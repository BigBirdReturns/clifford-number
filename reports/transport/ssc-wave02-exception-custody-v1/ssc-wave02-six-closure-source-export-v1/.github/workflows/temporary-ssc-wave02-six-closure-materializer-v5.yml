name: TEMP materialize SSC Wave 02 six-closure ledger v5

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-wave02-six-closure-materializer-v5.yml'
      - '.ssc-wave02-six-closure-source-export-v1/MATERIALIZE-V5'

permissions:
  contents: write
  actions: read

concurrency:
  group: temp-ssc-wave02-six-closure-materializer-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-wave02-six-closure-source-export-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HISTORICAL_MAIN: 72abc35c408d172d9be33b619b630a96ac317193
      CONTROLLER_BRANCH: agent/ssc-wave02-six-closure-source-export-v1
      TARGET_BRANCH: agent/ssc-wave02-current-ledger-six-closures-v5
      PACKAGE_B64_SHA256: 5e96f693219ae055177e245b5587fd744620c8bf7f28045ae0e5fbe7d6b07473
      PACKAGE_TGZ_SHA256: c8288e0629303e720ac88a600480f28a002f7591876e439d7313c58a939956c9
      PACKAGE_PATHS_SHA256: c82b72dd49f26a34f43e62aa09d1aa940feb05bcdd5bb8c8792b1e3d15ec9943
      NONWORKFLOW_PATHS_SHA256: 0d659c3822434d57a00d9d3236f3ccb42079789fb7e2460e181c58b193f8e390
      STANDING_WORKFLOW_SHA256: 02f907c466ce6445a12fb5c21ae1a7d89d77fe27438e288c1dabf3755a2dc3aa
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove current-main disjointness and derive complete controller
        run: |
          set -Eeuo pipefail
          bootstrap="$RUNNER_TEMP/ssc-wave02-six-closure-v5-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$bootstrap"
          mkdir -p "$bootstrap"
          printf '%s\n' rebind-current-main > "$bootstrap/final-step.txt"
          printf '%s\n' 1 > "$bootstrap/exit-code.txt"

          current_main="$(git rev-parse HEAD)"
          printf '%s\n' "$HISTORICAL_MAIN" > "$bootstrap/historical-main.txt"
          printf '%s\n' "$current_main" > "$bootstrap/current-main.txt"
          git cat-file -e "${HISTORICAL_MAIN}^{commit}"
          git merge-base --is-ancestor "$HISTORICAL_MAIN" "$current_main"

          cat > "$bootstrap/expected-product-paths.txt" <<'PATHS'
          .github/workflows/status-sovereignty-residual-denominator-wave-02-current.yml
          data/research/status-sovereignty-residual-denominator-wave-02-current.json
          docs/milestones/ssc-residual-denominator-wave-02-current.md
          schemas/status-sovereignty-residual-denominator-wave-02-current.schema.json
          test/status-sovereignty-rd-wave02-rd02-license-leverage.test.js
          test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js
          test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js
          test/status-sovereignty-residual-denominator-wave-02-current.test.js
          tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs
          tools/validate-status-sovereignty-rd-wave02-rd02-license-leverage.mjs
          tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          PATHS
          sed -i 's/^          //' "$bootstrap/expected-product-paths.txt"
          printf '%s  %s\n' "$PACKAGE_PATHS_SHA256" "$bootstrap/expected-product-paths.txt" | sha256sum -c -

          mapfile -t product_paths < "$bootstrap/expected-product-paths.txt"
          git diff --name-only "$HISTORICAL_MAIN" "$current_main" -- "${product_paths[@]}" | LC_ALL=C sort > "$bootstrap/main-product-overlap.txt"
          if test -s "$bootstrap/main-product-overlap.txt"; then
            echo 'current main overlaps the historical package paths' >&2
            cat "$bootstrap/main-product-overlap.txt" >&2
            exit 1
          fi
          git diff --name-status "$HISTORICAL_MAIN" "$current_main" | LC_ALL=C sort > "$bootstrap/main-advance-name-status.txt"

          export EXPECTED_MAIN="$current_main"
          export BOOTSTRAP_RECEIPT_DIR="$bootstrap"
          echo "EXPECTED_MAIN=$EXPECTED_MAIN" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_RECEIPT_DIR=$BOOTSTRAP_RECEIPT_DIR" >> "$GITHUB_ENV"
          echo "RECEIPT_DIR=$bootstrap" >> "$GITHUB_ENV"

          git fetch --no-tags origin "+refs/heads/${CONTROLLER_BRANCH}:refs/remotes/origin/six-closure-controller-v5"
          git show "origin/six-closure-controller-v5:.github/workflows/temporary-ssc-wave02-six-closure-materializer-v1.yml" > "$RUNNER_TEMP/six-closure-materializer-v1.yml"

          python - <<'PY'
          import hashlib
          import json
          import os
          import textwrap
          from pathlib import Path

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          bootstrap = Path(os.environ['BOOTSTRAP_RECEIPT_DIR'])
          lines = (runner_temp / 'six-closure-materializer-v1.yml').read_text().splitlines()
          step = lines.index('      - name: Qualify and publish exact non-workflow product')
          start = next(i for i in range(step + 1, len(lines)) if lines[i] == '        run: |') + 1
          end = next(
              i for i in range(start, len(lines))
              if lines[i].startswith('      - name: Preserve exact materialization receipt')
          )
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'

          def block(items):
              return '\n'.join(items) + '\n'

          receipt_anchor = block([
              'rm -rf "$receipt"',
              'mkdir -p "$receipt"',
              'echo "RECEIPT_DIR=$receipt" >> "$GITHUB_ENV"',
              'exec > >(tee "$receipt/execution.log") 2>&1',
          ])
          receipt_replacement = block([
              'rm -rf "$receipt"',
              'mkdir -p "$receipt"',
              'if [ -n "${BOOTSTRAP_RECEIPT_DIR:-}" ] && [ -d "$BOOTSTRAP_RECEIPT_DIR" ]; then',
              '  cp -a "$BOOTSTRAP_RECEIPT_DIR/." "$receipt/"',
              'fi',
              'echo "RECEIPT_DIR=$receipt" >> "$GITHUB_ENV"',
              'exec > >(tee "$receipt/execution.log") 2>&1',
              "trap 'status=$?; printf \"%s\\n\" \"$status\" > \"$receipt/exit-code.txt\"; printf \"%s\\n\" \"$BASH_COMMAND\" > \"$receipt/failing-command.txt\"; exit \"$status\"' ERR",
          ])
          if script.count(receipt_anchor) != 1:
              raise RuntimeError('receipt setup anchor changed')
          script = script.replace(receipt_anchor, receipt_replacement, 1)

          insertion_anchor = block([
              'hash_product() {',
              '  while IFS= read -r path; do sha256sum "$path"; done < "$receipt/expected-paths.txt"',
              '}',
          ])
          insertion = block([
              'restore_release_outputs() {',
              '  label="$1"',
              "  printf '%s\\n' 'build/axm-identity.json' 'build/build-hop-report.json' 'build/hop-graph.json' 'build/migration-review.md' 'build/migration-summary.json' 'build/receipt-graph.json' 'build/scores.json' 'build/scout-report.json' 'build/scout-report.md' 'build/surface-graph.json' > \"$receipt/expected-release-output-paths.txt\"",
              '  git diff --name-only -- . | LC_ALL=C sort > "$receipt/postcheck-all-paths-${label}.txt"',
              '  comm -13 "$receipt/expected-paths.txt" "$receipt/postcheck-all-paths-${label}.txt" > "$receipt/actual-release-output-paths-${label}.txt"',
              '  cmp "$receipt/expected-release-output-paths.txt" "$receipt/actual-release-output-paths-${label}.txt"',
              '  while IFS= read -r path; do git restore --worktree -- "$path"; done < "$receipt/expected-release-output-paths.txt"',
              '}',
              'hash_product() {',
              '  while IFS= read -r path; do sha256sum "$path"; done < "$receipt/expected-paths.txt"',
              '}',
          ])
          if script.count(insertion_anchor) != 1:
              raise RuntimeError('hash-product insertion anchor changed')
          script = script.replace(insertion_anchor, insertion, 1)

          first = block([
              'run_checks',
              'assert_paths',
              'hash_product > "$receipt/product-pass-1.sha256"',
          ]).rstrip('\n')
          first_new = block([
              'run_checks',
              'restore_release_outputs pass-1',
              'assert_paths',
              'hash_product > "$receipt/product-pass-1.sha256"',
          ]).rstrip('\n')
          second = block([
              'run_checks',
              'assert_paths',
              'hash_product > "$receipt/product-pass-2.sha256"',
          ]).rstrip('\n')
          second_new = block([
              'run_checks',
              'restore_release_outputs pass-2',
              'assert_paths',
              'hash_product > "$receipt/product-pass-2.sha256"',
          ]).rstrip('\n')
          if script.count(first) != 1 or script.count(second) != 1:
              raise RuntimeError('release-output call anchors changed')
          script = script.replace(first, first_new, 1).replace(second, second_new, 1)

          restore_anchor = 'git restore --source=HEAD --worktree -- "$workflow_path"\n'
          if script.count(restore_anchor) != 1:
              raise RuntimeError('standing-workflow restore anchor changed')
          prefix, tail = script.split(restore_anchor, 1)
          tail = tail.replace('$receipt/nonworkflow-paths.txt', '$receipt/expected-paths.txt')
          tail = tail.replace('nonworkflow-actual-paths.txt', 'permanent-actual-paths.txt')
          tail = tail.replace('published-nonworkflow-product', 'published-thirteen-path-product')
          script = prefix + tail

          output = Path('/tmp/ssc-wave02-six-closure-materializer-v5.sh')
          output.write_text(script)
          digest = hashlib.sha256(script.encode()).hexdigest()
          (bootstrap / 'derived-script.sh').write_text(script)
          (bootstrap / 'derived-script.sha256').write_text(
              f'{digest}  ssc-wave02-six-closure-materializer-v5.sh\n'
          )
          (bootstrap / 'controller-repair.json').write_text(
              json.dumps(
                  {
                      'schema_version': 'ssc-wave02-six-closure-controller-repair@4',
                      'repair': 'dynamic_current_main_complete_thirteen_path_publication',
                      'historical_main': os.environ['HISTORICAL_MAIN'],
                      'rebound_main': os.environ['EXPECTED_MAIN'],
                      'target_branch': os.environ['TARGET_BRANCH'],
                      'expected_permanent_path_count': 13,
                      'expected_volatile_output_count': 10,
                      'product_archive_sha256': os.environ['PACKAGE_TGZ_SHA256'],
                      'product_paths_sha256': os.environ['PACKAGE_PATHS_SHA256'],
                      'standing_workflow_sha256': os.environ['STANDING_WORKFLOW_SHA256'],
                      'derived_script_sha256': digest,
                  },
                  indent=2,
              ) + '\n'
          )
          PY

          bash -n /tmp/ssc-wave02-six-closure-materializer-v5.sh
          printf '%s\n' 0 > "$bootstrap/exit-code.txt"
          printf '%s\n' derived-complete-controller > "$bootstrap/final-step.txt"
      - name: Execute complete package on proven-disjoint current main
        run: bash /tmp/ssc-wave02-six-closure-materializer-v5.sh
      - name: Preserve exact v5 materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-wave02-six-closure-materialization-v5
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 90
