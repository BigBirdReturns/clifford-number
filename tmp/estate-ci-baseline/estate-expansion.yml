name: Estate expansion

on:
  pull_request:
    paths:
      - 'data/intake/estate-expansion-01/README.md'
      - 'data/intake/estate-expansion-01/completion.json'
      - 'data/intake/estate-expansion-01/next-ten.json'
      - 'data/intake/estate-expansion-01/triage.json'
      - 'data/intake/estate-expansion-01/sources.jsonl'
      - 'data/intake/estate-expansion-01/manifest.json'
      - 'data/intake/next-ten-estates/**'
      - 'tools/build-estate-expansion.mjs'
      - 'tools/validate-estate-expansion.mjs'
      - 'tools/compile.mjs'
      - 'test/estate-expansion.test.js'
      - 'test/research-tracks.test.js'
      - '.github/workflows/estate-expansion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate expansion
        run: |
          node tools/build-next-ten-estates.mjs
          node tools/build-estate-expansion.mjs
          node tools/validate-estate-expansion.mjs
          node test/estate-expansion.test.js
          node test/research-tracks.test.js

      - name: Full release gate
        run: npm run release:check

      - name: Preserve estate expansion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-expansion-01
          path: |
            data/intake/estate-expansion-01/README.md
            data/intake/estate-expansion-01/completion.json
            data/intake/estate-expansion-01/next-ten.json
            data/intake/estate-expansion-01/triage.json
            data/intake/estate-expansion-01/sources.jsonl
            data/intake/estate-expansion-01/manifest.json
          if-no-files-found: error
