name: TEMP materialize RD-04 North Dakota one-cell promotion v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-ssc-rd04-postpromotion-nd-one-cell-promotion-v1.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: temp-materialize-rd04-postpromotion-nd-one-cell-promotion-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-postpromotion-nd-one-cell-promotion-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned schema and workflow parsers
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1' 'PyYAML==6.0.2'

      - name: Materialize, qualify, and stage exact one-cell product
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          PARENT=79a7e18bfd45f1b1d893fa8b9683710891d4bbca
          PARENT_TREE=de7b86fbc9caa247bfa2a960f190626e22f1c4b6
          CARRIER_BRANCH=agent/ssc-rd04-postpromotion-nd-one-cell-promotion-materializer-v1
          CARRIER_PATH=.github/workflows/temp-materialize-ssc-rd04-postpromotion-nd-one-cell-promotion-v1.yml
          STAGING_BRANCH=staging/ssc-rd04-postpromotion-nd-one-cell-promotion-v1
          SHADOW_WORKFLOW=exchange/rd04-postpromotion-nd-one-cell-promotion/final-workflow.yml
          STANDING_WORKFLOW=.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.yml
          OUT="${RUNNER_TEMP}/ssc-rd04-postpromotion-nd-one-cell-promotion-materializer-v1"
          WORK="${RUNNER_TEMP}/ssc-rd04-postpromotion-nd-one-cell-product"
          STAGE_WT="${RUNNER_TEMP}/ssc-rd04-postpromotion-nd-one-cell-staging"
          rm -rf "$OUT" "$WORK" "$STAGE_WT"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/materializer.log") 2>&1
          stage=bootstrap
          candidate_commit=
          candidate_tree=
          staging_commit=
          staging_tree=

          finalize_sums() {
            set +e
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )
          }

          on_error() {
            local code=$?
            trap - ERR
            set +e
            printf '%s\n' "$code" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            jq -n \
              --arg stage "$stage" \
              --argjson exit_code "$code" \
              --arg parent "$PARENT" \
              --arg carrier_head "$(git rev-parse HEAD 2>/dev/null || true)" \
              --arg candidate_commit "$candidate_commit" \
              --arg candidate_tree "$candidate_tree" \
              --arg staging_commit "$staging_commit" \
              --arg staging_tree "$staging_tree" \
              '{
                schema_version:"ssc-rd04-postpromotion-nd-one-cell-materializer@1",
                state:"failed_closed",
                failed_or_final_stage:$stage,
                exit_code:$exit_code,
                product_parent:$parent,
                carrier_head:(if $carrier_head=="" then null else $carrier_head end),
                candidate_commit:(if $candidate_commit=="" then null else $candidate_commit end),
                candidate_tree:(if $candidate_tree=="" then null else $candidate_tree end),
                staging_commit:(if $staging_commit=="" then null else $staging_commit end),
                staging_tree:(if $staging_tree=="" then null else $staging_tree end),
                source_requests:0,
                route_executions:0,
                new_source_admissions:0,
                matrix_updates:(if $candidate_commit=="" then 0 else 1 end),
                field_terminalizations:(if $candidate_commit=="" then 0 else 1 end),
                row_state_mutations:0,
                class_closed:false,
                cumulative_ledger_effect:"none",
                outside_human_dependency:false,
                publication_effect:"none",
                adoption_effect:"none",
                graph_effect:"none"
              }' > "$OUT/materializer-receipt.json"
            finalize_sums
            exit "$code"
          }

          trap on_error ERR
          set -Eeuo pipefail

          stage=bind_exact_carrier_and_live_main
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          test "${{ github.event.pull_request.head.ref }}" = "$CARRIER_BRANCH"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git rev-list --count "$PARENT"..HEAD)" -eq 1
          test "$(git diff --name-only "$PARENT" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --name-only --diff-filter=A "$PARENT" HEAD)" = "$CARRIER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$PARENT" HEAD)"
          git diff --check "$PARENT" HEAD
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$PARENT"
          test -z "$(git ls-remote --heads origin "refs/heads/$STAGING_BRANCH" | awk '{print $1}')"

          stage=reconstruct_and_authenticate_static_package
          cat > "$OUT/static-package.b64" <<'B64'
          
          B64
          test "$(wc -c < "$OUT/static-package.b64" | tr -d ' ')" -eq 20577
          tr -d '\n' < "$OUT/static-package.b64" | base64 -d > "$OUT/static-package.tar.xz"
          test "$(wc -c < "$OUT/static-package.tar.xz" | tr -d ' ')" -eq 15432
          test "$(sha256sum "$OUT/static-package.tar.xz" | awk '{print $1}')" = 20209c25776c3f69a6c8159780953749b9fd3da6c1c6ce42122f17115a1ffc15
          tar -tJf "$OUT/static-package.tar.xz" | sed 's#^\./##' | sort > "$OUT/static-package-paths.txt"
          cat > "$OUT/expected-static-paths.txt" <<'PATHS'
          .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.yml
          docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.md
          schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.schema.json
          test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.test.js
          tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
          PATHS
          diff -u "$OUT/expected-static-paths.txt" "$OUT/static-package-paths.txt"
          cat > "$OUT/static-sha256s.txt" <<'SUMS'
          7177b0bd661d0d01af2d5902e0ded673debdf630a46867ab78482dd9180e9d50  ./.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.yml
          173372c8a474f788010732585c9d8c38c50d91f65b5ae33d49815d24248d3ef6  ./docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.md
          3c5b1279e200327ca0036ae31abbaed558620fc09245d6a3d7855feb4d92dc18  ./schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.schema.json
          c3e32b971f6736c1f5aa57eaefbfb48b01d300154db00782df89bdc605b8aaac  ./test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.test.js
          8c233bc1ef409a45d1443c32d2b1508de2c9acb06be9ef2100cdb780d69d76bb  ./tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
          fceecffdd959b00a4dc3d48b1672d0e5faa67a9ccf61223f4fa091a1de7534b0  ./tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
          SUMS

          stage=construct_exact_candidate
          git worktree add --detach "$WORK" "$PARENT"
          tar -xJf "$OUT/static-package.tar.xz" -C "$WORK"
          (cd "$WORK" && sha256sum -c "$OUT/static-sha256s.txt")
          node --check "$WORK/tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs"
          node --check "$WORK/tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs"
          node --check "$WORK/test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.test.js"
          python - "$WORK" <<'PY'
          import json, sys
          from pathlib import Path
          import yaml
          from jsonschema import Draft202012Validator
          root=Path(sys.argv[1])
          yaml.safe_load((root/'.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.yml').read_text())
          schema=json.loads((root/'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.schema.json').read_text())
          Draft202012Validator.check_schema(schema)
          print('static_workflow_and_schema=pass')
          PY
          (
            cd "$WORK"
            node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
            node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
            node test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.test.js
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
          )
          python - "$WORK" <<'PY'
          import json, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path(sys.argv[1])
          schema=json.loads((root/'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.schema.json').read_text())
          validator=Draft202012Validator(schema)
          data=root/'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion'
          names=[
            'promotion-input-custody.json','promotion-decisions.json','cell-promotion-ledger.json',
            'promoted-partial-field-matrix.json','remaining-open-field-census.json','promotion-summary.json',
            'index.json','product-manifest.json'
          ]
          for name in names:
              errors=sorted(validator.iter_errors(json.loads((data/name).read_text())),key=lambda e:list(e.path))
              if errors: raise SystemExit(f'{name}: {errors[0].message} at {list(errors[0].path)}')
          print('schema_validation=pass objects=8')
          PY

          mapfile -t PERMANENT_PATHS <<'PATHS'
          .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.yml
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/cell-promotion-ledger.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/index.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/promoted-partial-field-matrix.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/promotion-decisions.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/promotion-input-custody.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/promotion-summary.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion/remaining-open-field-census.json
          docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.md
          schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.schema.json
          test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.test.js
          tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
          PATHS
          printf '%s\n' "${PERMANENT_PATHS[@]}" | sort > "$OUT/expected-product-paths.txt"
          git -C "$WORK" diff --name-only "$PARENT" | sort > "$OUT/actual-product-paths.txt"
          diff -u "$OUT/expected-product-paths.txt" "$OUT/actual-product-paths.txt"
          git -C "$WORK" diff --name-only --diff-filter=A "$PARENT" | sort > "$OUT/added-product-paths.txt"
          diff -u "$OUT/expected-product-paths.txt" "$OUT/added-product-paths.txt"
          test -z "$(git -C "$WORK" diff --name-only --diff-filter=MDTCRUXB "$PARENT")"
          git -C "$WORK" diff --check "$PARENT"
          git -C "$WORK" config user.name 'RD-04 bounded materializer'
          git -C "$WORK" config user.email 'rd04-materializer@users.noreply.github.com'
          git -C "$WORK" add -- "${PERMANENT_PATHS[@]}"
          git -C "$WORK" commit -m 'Promote one RD-04 North Dakota operative-authority cell'
          candidate_commit="$(git -C "$WORK" rev-parse HEAD)"
          candidate_tree="$(git -C "$WORK" rev-parse HEAD^{tree})"
          test "$(git -C "$WORK" rev-parse HEAD^)" = "$PARENT"
          test "$(git -C "$WORK" rev-list --count "$PARENT"..HEAD)" -eq 1
          test "$(git -C "$WORK" diff-tree --no-commit-id --name-only -r HEAD | sort | wc -l)" -eq 14
          printf '%s\n' "$candidate_commit" > "$OUT/candidate-commit.txt"
          printf '%s\n' "$candidate_tree" > "$OUT/candidate-tree.txt"

          stage=run_complete_release_gate
          (cd "$WORK" && npm run release:check)

          stage=restore_and_clean_replay
          git -C "$WORK" restore --staged --worktree .
          git -C "$WORK" clean -fdx
          (
            cd "$WORK"
            node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
            node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.mjs
            node test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-one-cell-promotion.test.js
            test -z "$(git status --porcelain)"
          )

          stage=construct_and_publish_staging_custody
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$PARENT"
          test -z "$(git ls-remote --heads origin "refs/heads/$STAGING_BRANCH" | awk '{print $1}')"
          git worktree add --detach "$STAGE_WT" "$PARENT"
          for relative in "${PERMANENT_PATHS[@]}"; do
            if test "$relative" = "$STANDING_WORKFLOW"; then
              continue
            fi
            mkdir -p "$STAGE_WT/$(dirname "$relative")"
            cp "$WORK/$relative" "$STAGE_WT/$relative"
          done
          mkdir -p "$STAGE_WT/$(dirname "$SHADOW_WORKFLOW")"
          cp "$WORK/$STANDING_WORKFLOW" "$STAGE_WT/$SHADOW_WORKFLOW"
          git -C "$STAGE_WT" config user.name 'RD-04 bounded materializer'
          git -C "$STAGE_WT" config user.email 'rd04-materializer@users.noreply.github.com'
          git -C "$STAGE_WT" add -- "${PERMANENT_PATHS[@]:1}" "$SHADOW_WORKFLOW"
          git -C "$STAGE_WT" commit -m 'Stage exact RD-04 North Dakota one-cell promotion product'
          staging_commit="$(git -C "$STAGE_WT" rev-parse HEAD)"
          staging_tree="$(git -C "$STAGE_WT" rev-parse HEAD^{tree})"
          test "$(git -C "$STAGE_WT" rev-parse HEAD^)" = "$PARENT"
          test "$(git -C "$STAGE_WT" rev-list --count "$PARENT"..HEAD)" -eq 1
          { printf '%s\n' "${PERMANENT_PATHS[@]:1}"; printf '%s\n' "$SHADOW_WORKFLOW"; } | sort > "$OUT/expected-staging-paths.txt"
          git -C "$STAGE_WT" diff-tree --no-commit-id --name-only -r HEAD | sort > "$OUT/actual-staging-paths.txt"
          diff -u "$OUT/expected-staging-paths.txt" "$OUT/actual-staging-paths.txt"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$PARENT"
          test -z "$(git ls-remote --heads origin "refs/heads/$STAGING_BRANCH" | awk '{print $1}')"
          git -C "$STAGE_WT" push origin "HEAD:refs/heads/$STAGING_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$STAGING_BRANCH" | awk '{print $1}')" = "$staging_commit"
          printf '%s\n' "$staging_commit" > "$OUT/staging-commit.txt"
          printf '%s\n' "$staging_tree" > "$OUT/staging-tree.txt"

          stage=seal_product_and_staging_artifact
          (
            cd "$WORK"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -cJf "$OUT/product.tar.xz" "${PERMANENT_PATHS[@]}"
          )
          python - "$WORK" "$STAGE_WT" "$OUT" "$candidate_commit" "$staging_commit" "$SHADOW_WORKFLOW" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          work, stage, out = map(Path, sys.argv[1:4])
          candidate, staging, shadow = sys.argv[4:7]
          permanent = [line for line in (out/'expected-product-paths.txt').read_text().splitlines() if line]
          staging_paths = [line for line in (out/'expected-staging-paths.txt').read_text().splitlines() if line]
          def inventory(root, commit, paths):
              rows=[]
              for rel in paths:
                  line=subprocess.check_output(['git','-C',str(root),'ls-tree',commit,'--',rel],text=True).strip()
                  mode, typ, blob, actual = line.split(None,3)
                  data=(root/rel).read_bytes()
                  rows.append({
                    'path':actual,'mode':mode,'type':typ,'git_blob':blob,'bytes':len(data),
                    'sha256':hashlib.sha256(data).hexdigest()
                  })
              return rows
          (out/'candidate-product-inventory.json').write_text(json.dumps(inventory(work,candidate,permanent),indent=2,sort_keys=True)+'\n')
          (out/'staging-inventory.json').write_text(json.dumps(inventory(stage,staging,staging_paths),indent=2,sort_keys=True)+'\n')
          PY
          product_archive_sha="$(sha256sum "$OUT/product.tar.xz" | awk '{print $1}')"
          product_archive_bytes="$(wc -c < "$OUT/product.tar.xz" | tr -d ' ')"
          test "$(tar -tJf "$OUT/product.tar.xz" | wc -l)" -eq 14
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$PARENT"
          jq -n \
            --arg parent "$PARENT" \
            --arg parent_tree "$PARENT_TREE" \
            --arg carrier_head "$(git rev-parse HEAD)" \
            --arg carrier_path "$CARRIER_PATH" \
            --arg candidate_commit "$candidate_commit" \
            --arg candidate_tree "$candidate_tree" \
            --arg staging_branch "$STAGING_BRANCH" \
            --arg staging_commit "$staging_commit" \
            --arg staging_tree "$staging_tree" \
            --arg shadow_workflow "$SHADOW_WORKFLOW" \
            --arg product_archive_sha256 "$product_archive_sha" \
            --argjson product_archive_bytes "$product_archive_bytes" \
            '{
              schema_version:"ssc-rd04-postpromotion-nd-one-cell-materializer@1",
              state:"qualified_staging_published",
              failed_or_final_stage:"complete",
              exit_code:0,
              product_parent:$parent,
              product_parent_tree:$parent_tree,
              carrier_head:$carrier_head,
              carrier_path:$carrier_path,
              candidate_commit:$candidate_commit,
              candidate_tree:$candidate_tree,
              permanent_path_count:14,
              staging_branch:$staging_branch,
              staging_commit:$staging_commit,
              staging_tree:$staging_tree,
              staging_path_count:14,
              shadow_workflow_path:$shadow_workflow,
              product_archive_sha256:$product_archive_sha256,
              product_archive_bytes:$product_archive_bytes,
              validation_pull_request:1585,
              validation_workflow_run:31277994050,
              validation_artifact_id:9027574937,
              validation_artifact_zip_sha256:"c12b2bb95dcedb9b02aee4282835548d72a08a72f3488568c4966adb0b2aedfb",
              validation_receipt_sha256:"7b6fd6a65c9592445054379c0f1142bad02141a620e0855f6100ad49d486c5dc",
              terminal_cells_before:226,
              terminal_cells_after:227,
              still_open_cells_before:224,
              still_open_cells_after:223,
              open_substantive_cells_before:184,
              open_substantive_cells_after:183,
              terminal_units_before:10,
              terminal_units_after:10,
              source_requests:0,
              route_executions:0,
              new_source_admissions:0,
              matrix_updates:1,
              field_terminalizations:1,
              row_state_mutations:0,
              class_closed:false,
              cumulative_ledger_effect:"none",
              outside_human_dependency:false,
              publication_effect:"none",
              adoption_effect:"none",
              graph_effect:"none"
            }' > "$OUT/materializer-receipt.json"
          stage=complete
          printf '0\n' > "$OUT/EXIT_CODE"
          printf '%s\n' "$stage" > "$OUT/STAGE"
          finalize_sums
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Preserve exact materialization and staging custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-nd-one-cell-promotion-materializer-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-nd-one-cell-promotion-materializer-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Enforce qualified terminal result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/ssc-rd04-postpromotion-nd-one-cell-promotion-materializer-v1"
          test "${{ steps.materialize.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          jq -e '
            .state=="qualified_staging_published" and
            .failed_or_final_stage=="complete" and
            .exit_code==0 and
            .permanent_path_count==14 and
            .staging_path_count==14 and
            .terminal_cells_before==226 and
            .terminal_cells_after==227 and
            .still_open_cells_before==224 and
            .still_open_cells_after==223 and
            .open_substantive_cells_before==184 and
            .open_substantive_cells_after==183 and
            .terminal_units_before==10 and
            .terminal_units_after==10 and
            .source_requests==0 and
            .route_executions==0 and
            .new_source_admissions==0 and
            .matrix_updates==1 and
            .field_terminalizations==1 and
            .row_state_mutations==0 and
            .class_closed==false and
            .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and
            .publication_effect=="none" and
            .adoption_effect=="none" and
            .graph_effect=="none"
          ' "$OUT/materializer-receipt.json" > /dev/null
          (cd "$OUT" && sha256sum -c SHA256SUMS)
