name: APC-01 A1 adjudicator nomination
description: Nominate a public independence, evidence, or challenge reviewer. Nomination does not confer eligibility or authority.
title: "[A1 adjudicator nomination] "
body:
  - type: markdown
    attributes:
      value: |
        This public nomination supports Sprint 07 reviewer-pool formation. Do not post secrets, private personal data, credentials, sealed records, or confidential evidence. Nomination is not selection, approval, or A1.
  - type: input
    id: name
    attributes:
      label: Public name
    validations:
      required: true
  - type: input
    id: legal_entity
    attributes:
      label: Legal entity or independent-practice identity
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Proposed role
      options:
        - independence adjudicator
        - evidence adjudicator
        - challenge reviewer
    validations:
      required: true
  - type: input
    id: identity_uri
    attributes:
      label: Public identity and qualification evidence URI
    validations:
      required: true
  - type: textarea
    id: relationships
    attributes:
      label: Complete relationship, funding, contribution, and conflict disclosure
      description: Include project, maintainer, reproducer, vendor, operator, customer, adopter, employment, contract, funding, investment, governance, family, litigation, and close professional relationships.
    validations:
      required: true
  - type: checkboxes
    id: disqualifiers
    attributes:
      label: Required declarations
      options:
        - label: I am not a repository administrator, maintainer, or contributor to the frozen reference capsule.
          required: true
        - label: I am not the reproducer, receipt preparer, vendor, operator, customer, assessed adopter, project bot, or evidence host/preparer.
          required: true
        - label: My compensation is not contingent on an approval or A1 outcome.
          required: true
        - label: I understand that nomination does not establish independence, selection, authority, or A1.
          required: true
