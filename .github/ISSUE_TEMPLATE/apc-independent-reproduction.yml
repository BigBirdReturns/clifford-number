name: APC-01 independent reproduction receipt
description: Submit a public clean-room reproduction receipt for structural and human review. Submission does not award A1.
title: "[A1 reproduction] "
body:
  - type: markdown
    attributes:
      value: |
        This intake targets commit `ce8f4194019cf75cc2b66436efbeebdfd43f9951` and exact-byte bundle `9084e2fe8e4a951fd667c71b9be58475a1b8fc463ab25c885fd98891d39747ad`.

        Do not submit secrets, personal data, credentials, sealed records, private keys, or confidential evidence. All evidence links must be public and durable. Maintainers, reference contributors, project bots, vendors, operators, customers, and assessed adopters cannot self-certify A1.
  - type: input
    id: receipt_id
    attributes:
      label: Receipt ID
      description: Must match A1R-[A-Z0-9-].
      placeholder: A1R-EXAMPLE-001
    validations:
      required: true
  - type: input
    id: receipt_uri
    attributes:
      label: Public receipt URI
      description: Link to the complete JSON receipt using apc-independent-reproduction-receipt@1.
    validations:
      required: true
  - type: input
    id: evidence_uri
    attributes:
      label: Public evidence-bundle URI
      description: Immutable or versioned raw logs, hashes, environment record, and signed statement.
    validations:
      required: true
  - type: input
    id: reproducer
    attributes:
      label: Reproducer identity
      description: Public person or organization name. Anonymous and bot submissions are ineligible.
    validations:
      required: true
  - type: textarea
    id: relationships
    attributes:
      label: Relationship, funding, and conflict disclosure
      description: Disclose all project, maintainer, vendor, operator, adopter, customer, employment, contract, funding, investment, governance, family, and close professional relationships.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Required confirmations
      options:
        - label: I used the exact frozen commit and bundle fingerprint shown above.
          required: true
        - label: I used an independently provisioned clean-room workspace and no project-supplied build artifacts.
          required: true
        - label: I am not a project maintainer, reference contributor, vendor, operator, customer, assessed adopter, or bot.
          required: true
        - label: I understand that machine validation cannot establish actual independence or evidence truth, and that this submission does not award A1.
          required: true
