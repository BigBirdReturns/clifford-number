name: APC A1 support challenge
description: Challenge the continuing support, independence, custody, validity, or registry state of an A1 entry.
title: "[A1 support challenge]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This form opens the **public** route. Do not post secrets, credentials, private keys, personal data, sealed records, confidential evidence, or protected challenger identities. A protected route must use the protected identity custodian and publish only the custody attestation and digest.
  - type: input
    id: target_entry
    attributes:
      label: Target A1 entry ID
      placeholder: A1E-...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Challenge category
      options:
        - identity_or_independence_failure
        - undisclosed_material_conflict
        - selection_capture_or_veto
        - evidence_custody_break
        - reproduction_or_output_failure
        - material_reference_or_successor_change
        - retaliation_or_chilling_effect
        - challenge_suppression_or_docket_omission
        - registry_or_signature_mismatch
        - fraud_misrepresentation_or_omitted_failure
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Bounded challenge statement
      description: Identify the exact support claim, transition, omission, or custody failure being challenged.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence custody
      description: Provide version-stable URIs and SHA-256 digests. Preserve contradictions, failures, and missing material.
    validations:
      required: true
  - type: dropdown
    id: requested_action
    attributes:
      label: Requested interim or final action
      options: [notice, challenge_state, suspend, revoke, expire, supersede, reconsider]
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I understand that submission does not prove the challenge, suspend or revoke an entry, establish my independence, or mutate the registry.
          required: true
        - label: I have not included restricted, private, or real-person deployment data.
          required: true
