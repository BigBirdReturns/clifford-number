name: APC A1 support incident
description: Record evidence that an automatic A1 support-loss trigger may have occurred.
title: "[A1 support incident]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        A support incident is an evidence intake, not a final adjudication. A recognized trigger requires a public incident and an interim lifecycle proposal; it does not authorize the project or registry custodian to determine truth unilaterally.
  - type: input
    id: target_entry
    attributes:
      label: Target A1 entry ID
      placeholder: A1E-...
    validations:
      required: true
  - type: dropdown
    id: trigger
    attributes:
      label: Automatic support-loss trigger
      options:
        - reference_byte_mismatch
        - receipt_or_evidence_unavailable
        - signature_or_digest_invalid
        - substantive_adjudicator_disqualified
        - adjudication_or_entry_expired
        - unresolved_material_challenge
        - registry_history_not_append_preserving
        - material_update_without_successor_review
        - newly_disclosed_material_conflict
        - retaliation_or_challenge_suppression
        - binding_court_or_regulator_order
        - required_exit_or_substitution_route_unavailable
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence custody
      description: Provide public, version-stable URIs and SHA-256 digests. State inaccessible or restricted evidence without exposing it.
    validations:
      required: true
  - type: dropdown
    id: automatic_action
    attributes:
      label: Required interim action
      options: [challenge_state, suspend, revoke, expire, supersede]
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I understand that this intake does not prove the incident, determine final disposition, or mutate the registry.
          required: true
        - label: I have preserved failures and contradictory evidence rather than reporting only supporting material.
          required: true
