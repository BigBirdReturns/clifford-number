name: TEMP diagnose School.House IRS-candidate index carrier

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/temp-schoolhouse-irs-candidate-990-index-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-irs-candidate-990-index-census-v1')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Print exact no-request custody values
        shell: bash
        run: |
          set -Eeuxo pipefail
          PARENT='9d9f9522fbc2909611033370044e9748a29b3cf7'
          BUNDLE='.schoolhouse-irs-candidate-990-index-census/capture.py.gz.b64'
          GZIP='/tmp/index.py.gz'
          RUNNER='/tmp/index.py'
          git fetch --no-tags origin main
          printf 'origin_main=%s\n' "$(git rev-parse origin/main)"
          printf 'merge_base=%s\n' "$(git merge-base HEAD origin/main)"
          git diff --name-only "$PARENT"..HEAD | sort
          for path in \
            data/intake/bvvc-defense-capital/schoolhouse-irs-identity-adjudication.json \
            data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-eo-bmf.jsonl \
            data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-publication-78.jsonl \
            data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-form-990n.jsonl \
            data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-auto-revocation.jsonl; do
            printf 'blob %s %s\n' "$path" "$(git rev-parse "$PARENT:$path")"
          done
          printf 'bundle '; sha256sum "$BUNDLE"
          base64 -d "$BUNDLE" > "$GZIP"
          printf 'gzip '; sha256sum "$GZIP"
          gzip -dc "$GZIP" > "$RUNNER"
          printf 'runner '; sha256sum "$RUNNER"
          python -m py_compile "$RUNNER"
          printf 'execute '; sha256sum .schoolhouse-irs-candidate-990-index-census/EXECUTE
          printf 'workflow '; sha256sum .github/workflows/temp-schoolhouse-irs-candidate-990-index-census.yml
          test "$(git rev-parse origin/main)" = "$PARENT"
          test "$(git merge-base HEAD origin/main)" = "$PARENT"
