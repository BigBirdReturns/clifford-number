name: Temporary PR 2231 V123 exact live-head qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v123-live-head-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v123-live-head:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v123-indexed-provenance-qualification-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      PRODUCT_PR: "2231"
      EXPECTED_PRODUCT: 792e49d5e14b7d2590dae0d925147c0815367e43
      EXPECTED_MAIN: 9de137e64b51339087c47028b9b0fc5f78d1fcff
      EXPECTED_PRODUCT_TREE: ffc83e90c4ed281ce8c8d4adc2505c577191bdd5
      EXPECTED_LIBRARY_BLOB: 53bd803ddf1360b5606986fa12d0d135da9ab1bd
      EXPECTED_TEST_BLOB: 846f08174c7e77ea10171a37e97bc8f4ef60d133
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v123-indexed-provenance-qualification-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute exact read-only live-head qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          repo=BigBirdReturns/clifford-number
          source_blob=333078362ec50bc62c59c7be66713e79e3897228
          source_size=18307
          source_sha256=378be1b4c5d08b466fe2e175684e6543c22f9188fb83e098370848783f4d158a
          qualifier_blob=c2293259f40b1c4e93f973a6e7c644b3c9b54967
          qualifier_size=18306
          qualifier_sha256=50dea7987e131042db5e5c4cc7f5ddf861fe96f4e222507e6babe66e58a9ff56
          envelope=/tmp/pr2231-v123-live-head-controller-v1
          source="$envelope/qualifier-source.sh"
          qualifier="$envelope/qualifier.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-live-head-qualification\n' "$rc" \
              > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort \
              > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum \
              > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          test "$CONTROLLER_BRANCH" = "$EXPECTED_CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"

          gh api "repos/$repo/git/blobs/$source_blob" --jq '.content' \
            | tr -d '\n' | base64 -d > "$source"
          test "$(wc -c < "$source")" = "$source_size"
          test "$(git hash-object "$source")" = "$source_blob"
          test "$(sha256sum "$source" | awk '{print $1}')" = "$source_sha256"
          cp "$source" "$qualifier"

          QUALIFIER_PATH="$qualifier" python3 <<'PY'
          from os import environ
          from pathlib import Path

          path = Path(environ['QUALIFIER_PATH'])
          source = path.read_text()
          old = '%ntcommitter_time=%cI%nsubject=%s'
          new = '%ncommitter_time=%cI%nsubject=%s'
          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f'qualifier receipt-field repair expected one anchor, found {count}'
              )
          path.write_text(source.replace(old, new, 1))
          PY

          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          printf 'source_blob=%s\nsource_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\n' \
            "$source_blob" "$source_sha256" "$qualifier_blob" "$qualifier_sha256" \
            > "$envelope/qualifier-provenance.txt"
          bash "$qualifier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v123-live-head-qualification-v1
          path: |
            /tmp/pr2231-v123-live-head-qualification-v1
            /tmp/pr2231-v123-live-head-controller-v1
          if-no-files-found: error
          retention-days: 90
