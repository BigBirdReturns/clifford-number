name: Temporary PR 2231 V123 indexed provenance qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v123-indexed-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v123:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v123-indexed-provenance-qualification-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      PRODUCT_PR: "2231"
      EXPECTED_PRODUCT: 914af980b7b11d421d056404a7116e2cc5e95bc2
      EXPECTED_MAIN: 9de137e64b51339087c47028b9b0fc5f78d1fcff
      EXPECTED_PRODUCT_TREE: 96ee4387f1457628109a9e9b1d1a89291075a541
      EXPECTED_LIBRARY_BLOB: 32535700ee66fb962895a2a8e73cad279892f4ea
      EXPECTED_TEST_BLOB: 327c68d1d7b0f8055f72529663fb90580288fff8
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v123-indexed-provenance-qualification-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute the exact read-only V123 qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          repo=BigBirdReturns/clifford-number
          payload_blob=b090cad80e7b7b1ba5e8347c975cadc96260e790
          payload_size=6256
          payload_sha256=3ef848131a3f6c1ccd7dae599327d9ab432776389b6c420e5d3880d401c784aa
          qualifier_size=28940
          qualifier_sha256=dbd5c3da6a346ce26ba69428c47c86f1a7fe8952325486701f57473ffced200d
          envelope=/tmp/pr2231-v123-indexed-provenance-controller-v1
          payload="$envelope/qualifier-v123.sh.xz"
          qualifier="$envelope/qualifier-v123.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-qualification\n' "$rc" \
              > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort \
              > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum \
              > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          test "$CONTROLLER_BRANCH" = "$EXPECTED_CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"

          gh api "repos/$repo/git/blobs/$payload_blob" --jq '.content' \
            | tr -d '\n' | base64 -d > "$payload"
          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          xz -dc "$payload" > "$qualifier"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          printf 'payload_blob=%s\npayload_sha256=%s\nqualifier_sha256=%s\n' \
            "$payload_blob" "$payload_sha256" "$qualifier_sha256" \
            > "$envelope/qualifier-provenance.txt"
          bash "$qualifier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v123-indexed-provenance-qualification-v1
          path: |
            /tmp/pr2231-v123-indexed-provenance-qualification-v1
            /tmp/pr2231-v123-indexed-provenance-controller-v1
          if-no-files-found: error
          retention-days: 90
