name: SSC RD-03 Wave 03 lifecycle-recovery intake

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.yml'
      - 'data/project/ssc-residual-wave03/seeds/RD-03-C05.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/**'
      - 'data/intake/status-sovereignty-rd03-osc-instrument-lifecycle.json'
      - 'data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'data/project/ssc-residual-wave02/closures/RD-03-C04.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'docs/milestones/ssc-rd-wave03-rd03-lifecycle-recovery-intake.md'
      - 'schemas/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.yml'
      - 'data/project/ssc-residual-wave03/seeds/RD-03-C05.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/**'
      - 'data/intake/status-sovereignty-rd03-osc-instrument-lifecycle.json'
      - 'data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'data/project/ssc-residual-wave02/closures/RD-03-C04.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'docs/milestones/ssc-rd-wave03-rd03-lifecycle-recovery-intake.md'
      - 'schemas/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd03-wave03-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact fixed-protocol design
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs
          node --check test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.test.js
          node tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs
          node test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore and replay deterministic package
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs --write
          node tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs
          node test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve exact intake-design custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-wave03-lifecycle-recovery-intake
          path: |
            data/intake/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/fixed-protocol-package.json
            schemas/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.schema.json
            docs/milestones/ssc-rd-wave03-rd03-lifecycle-recovery-intake.md
          if-no-files-found: error
          retention-days: 90
