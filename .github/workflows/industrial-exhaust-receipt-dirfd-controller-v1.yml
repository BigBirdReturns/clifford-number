name: Industrial-exhaust receipt dirfd publication controller v1

on:
  push:
    branches:
      - agent/industrial-exhaust-receipt-dirfd-controller-v1
    paths:
      - .github/workflows/industrial-exhaust-receipt-dirfd-controller-v1.yml

permissions:
  contents: write

concurrency:
  group: industrial-exhaust-receipt-dirfd-controller-v1
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/industrial-exhaust-receipt-dirfd-controller-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reproduce and replace procfs pathname mediation with dirfd publication
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA='2fcb33c6847d12d11b11462d053db2c42cd82b0d'
          PRODUCT_BRANCH='agent/industrial-exhaust-receipt-dirfd-v1'
          WORKFLOW_PATH='.github/workflows/industrial-exhaust-receipt-dirfd-controller-v1.yml'
          LIB_PATCH='.github/tmp/industrial-exhaust-receipt-dirfd-lib-patch.py'
          TEST_PATCH='.github/tmp/industrial-exhaust-receipt-dirfd-test-patch.py'
          LIB_PATH='tools/lib/industrial-exhaust-artifacts.mjs'
          TEST_PATH='test/industrial-exhaust-retained-store-custody.test.js'

          current_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$current_sha"

          expected_controller_paths=(
            "$LIB_PATCH"
            "$TEST_PATCH"
            "$WORKFLOW_PATH"
          )
          mapfile -t controller_diff < <(git diff --name-only "$BASE_SHA" "$current_sha")
          test "${#controller_diff[@]}" -eq "${#expected_controller_paths[@]}"
          for index in "${!expected_controller_paths[@]}"; do
            test "${controller_diff[$index]}" = "${expected_controller_paths[$index]}"
          done

          python3 -m py_compile "$LIB_PATCH" "$TEST_PATCH"
          python3 "$TEST_PATCH"

          if node "$TEST_PATH"; then
            echo 'predecessor unexpectedly avoided procfs pathname mediation' >&2
            exit 1
          else
            echo 'predecessor procfs operation-atomicity defect reproduced'
          fi

          python3 "$LIB_PATCH"

          node --check "$LIB_PATH"
          node --check "$TEST_PATH"
          node "$TEST_PATH"
          node test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node tools/hydrate-industrial-exhaust.mjs --audit
          git diff --check

          rm "$WORKFLOW_PATH" "$LIB_PATCH" "$TEST_PATCH"

          mapfile -t product_diff < <(git diff --name-only "$BASE_SHA")
          test "${#product_diff[@]}" -eq 2
          test "${product_diff[0]}" = "$TEST_PATH"
          test "${product_diff[1]}" = "$LIB_PATH"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          new_sha="$(
            printf '%s\n\n%s\n' \
              'fix(industrial-exhaust): publish receipts through inherited dirfds' \
              'Replace procfs pathname mediation with a fail-closed Python dirfd helper that performs directory traversal, no-overwrite publication, cleanup, durability, and final verification relative to an inherited repository descriptor.' \
              | git commit-tree "$tree_sha" -p "$BASE_SHA"
          )"

          mapfile -t final_diff < <(git diff --name-only "$BASE_SHA" "$new_sha")
          test "${#final_diff[@]}" -eq 2
          test "${final_diff[0]}" = "$TEST_PATH"
          test "${final_diff[1]}" = "$LIB_PATH"
          git diff --check "$BASE_SHA" "$new_sha"

          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$BASE_SHA"

          git push \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:" \
            origin \
            "${new_sha}:refs/heads/${PRODUCT_BRANCH}"
