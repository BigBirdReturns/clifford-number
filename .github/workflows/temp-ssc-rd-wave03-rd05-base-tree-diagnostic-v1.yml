name: TEMP report RD-05 object-publication base tree

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-ssc-rd-wave03-rd05-base-tree-diagnostic-v1.yml'

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd-wave03-rd05-intake-materializer-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Report exact commit and tree
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'canonical_main=%s\n' "$(git rev-parse HEAD)"
          printf 'canonical_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
