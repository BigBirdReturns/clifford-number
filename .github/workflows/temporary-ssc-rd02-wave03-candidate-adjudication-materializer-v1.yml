name: TEMP materialize RD-02 Wave 03 candidate adjudication v1

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd02-wave03-candidate-adjudication-materializer-v1.yml'
      - '.ssc-rd02-wave03-candidate-adjudication-materializer-v1/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: temp-ssc-rd02-wave03-candidate-adjudication-materializer-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd02-wave03-candidate-adjudication-materializer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE_HEAD: 44d4544b23dc24db24a4a7c61939396ada0b5fd5
      TARGET_BRANCH: agent/ssc-rd-wave03-rd02-candidate-adjudication-v1
      B64_BYTES: '40288'
      B64_SHA256: dd868e4788c02d28cc69aafe13835f50544e81bb157dbf9c765ba3bbdd4afb06
      XZ_BYTES: '30216'
      XZ_SHA256: 8c7e02369e2b79ce4c1a44e783b0880b71103f3cc2b3b6c8eb21ef25627245f6
      PATH_LIST_BYTES: '1535'
      PATH_LIST_SHA256: 3d3964fcf2b8832436bcb0c6f847fade4087ac06e80fca32a411aa12d00eceef
      FILE_MANIFEST_BYTES: '2697'
      FILE_MANIFEST_SHA256: 3fcdf11231764e6b2923a95bace0e636a896747b71bcd2ffcbaf43acc8fcc513
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct and verify exact sixteen-path package
        run: |
          set -Eeuo pipefail
          carrier='.ssc-rd02-wave03-candidate-adjudication-materializer-v1'
          cat "$carrier"/payload-*.b64 > "$RUNNER_TEMP/package.b64"
          test "$(wc -c < "$RUNNER_TEMP/package.b64")" = "$B64_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/package.b64" | cut -d' ' -f1)" = "$B64_SHA256"
          base64 -d "$RUNNER_TEMP/package.b64" > "$RUNNER_TEMP/package.tar.xz"
          test "$(wc -c < "$RUNNER_TEMP/package.tar.xz")" = "$XZ_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/package.tar.xz" | cut -d' ' -f1)" = "$XZ_SHA256"
          test "$(wc -c < "$carrier/paths.txt")" = "$PATH_LIST_BYTES"
          test "$(sha256sum "$carrier/paths.txt" | cut -d' ' -f1)" = "$PATH_LIST_SHA256"
          test "$(wc -c < "$carrier/files.txt")" = "$FILE_MANIFEST_BYTES"
          test "$(sha256sum "$carrier/files.txt" | cut -d' ' -f1)" = "$FILE_MANIFEST_SHA256"
          mkdir -p "$RUNNER_TEMP/package"
          tar -xJf "$RUNNER_TEMP/package.tar.xz" -C "$RUNNER_TEMP/package"
          (cd "$RUNNER_TEMP/package" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$carrier/paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          while read -r expected_sha expected_bytes rel; do
            test -f "$RUNNER_TEMP/package/$rel"
            test "$(wc -c < "$RUNNER_TEMP/package/$rel")" = "$expected_bytes"
            test "$(sha256sum "$RUNNER_TEMP/package/$rel" | cut -d' ' -f1)" = "$expected_sha"
          done < "$carrier/files.txt"

      - name: Qualify full product and publish fifteen non-workflow paths
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "$BASE_HEAD")" = "$BASE_HEAD"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          carrier="$GITHUB_WORKSPACE/.ssc-rd02-wave03-candidate-adjudication-materializer-v1"
          full="$RUNNER_TEMP/full"
          git worktree add --detach "$full" "$BASE_HEAD"
          git -C "$full" config user.name github-actions[bot]
          git -C "$full" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          while read -r rel; do
            mkdir -p "$full/$(dirname "$rel")"
            cp "$RUNNER_TEMP/package/$rel" "$full/$rel"
          done < "$carrier/paths.txt"
          cd "$full"
          node tools/validate-status-sovereignty-rd-wave03-rd02-candidate-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd02-candidate-adjudication.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd02/run-candidate-followups.py
          node tools/validate-no-magic-human-gate.mjs
          git add --pathspec-from-file="$carrier/paths.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/full-paths.txt"
          diff -u "$carrier/paths.txt" "$RUNNER_TEMP/full-paths.txt"
          git commit -m 'Qualify RD-02 Wave-03 candidate adjudication and followups'
          full_commit="$(git rev-parse HEAD)"
          full_tree="$(git rev-parse HEAD^{tree})"
          npm run release:check
          git reset --hard HEAD
          node tools/validate-status-sovereignty-rd-wave03-rd02-candidate-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd02-candidate-adjudication.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd02/run-candidate-followups.py
          node tools/validate-no-magic-human-gate.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          grep -v '^.github/workflows/status-sovereignty-rd-wave03-rd02-candidate-adjudication.yml$' "$carrier/paths.txt" > "$RUNNER_TEMP/nonworkflow-paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/nonworkflow-paths.txt")" = '15'
          pub="$RUNNER_TEMP/pub"
          git worktree add --detach "$pub" "$BASE_HEAD"
          git -C "$pub" config user.name github-actions[bot]
          git -C "$pub" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          while read -r rel; do
            mkdir -p "$pub/$(dirname "$rel")"
            cp "$RUNNER_TEMP/package/$rel" "$pub/$rel"
          done < "$RUNNER_TEMP/nonworkflow-paths.txt"
          cd "$pub"
          node tools/validate-status-sovereignty-rd-wave03-rd02-candidate-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd02-candidate-adjudication.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd02/run-candidate-followups.py
          node tools/validate-no-magic-human-gate.mjs
          git add --pathspec-from-file="$RUNNER_TEMP/nonworkflow-paths.txt"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/pub-paths.txt"
          diff -u "$RUNNER_TEMP/nonworkflow-paths.txt" "$RUNNER_TEMP/pub-paths.txt"
          git commit -m 'Materialize RD-02 Wave-03 candidate adjudication without standing workflow'
          pub_commit="$(git rev-parse HEAD)"
          pub_tree="$(git rev-parse HEAD^{tree})"
          npm run release:check
          git reset --hard HEAD
          node tools/validate-status-sovereignty-rd-wave03-rd02-candidate-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd02-candidate-adjudication.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd02/run-candidate-followups.py
          node tools/validate-no-magic-human-gate.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          receipt="$RUNNER_TEMP/receipt"
          mkdir -p "$receipt"
          cp "$RUNNER_TEMP/package/.github/workflows/status-sovereignty-rd-wave03-rd02-candidate-adjudication.yml" "$receipt/desired-standing-workflow.yml"
          cp "$carrier/paths.txt" "$receipt/full-paths.txt"
          cp "$RUNNER_TEMP/nonworkflow-paths.txt" "$receipt/nonworkflow-paths.txt"
          cp "$carrier/files.txt" "$receipt/files.txt"
          python - "$receipt/receipt.json" "$full_commit" "$full_tree" "$pub_commit" "$pub_tree" <<'PY'
          import json, os, sys
          out, full_commit, full_tree, pub_commit, pub_tree = sys.argv[1:]
          value = {
            'schema_version':'ssc-rd02-wave03-candidate-adjudication-materialization@1',
            'base_head':os.environ['BASE_HEAD'],
            'target_branch':os.environ['TARGET_BRANCH'],
            'qualified_full_commit':full_commit,
            'qualified_full_tree':full_tree,
            'published_nonworkflow_commit':pub_commit,
            'published_nonworkflow_tree':pub_tree,
            'full_paths':16,
            'published_nonworkflow_paths':15,
            'standing_workflow_paths':1,
            'package_xz_sha256':os.environ['XZ_SHA256'],
            'package_base64_sha256':os.environ['B64_SHA256'],
            'path_list_sha256':os.environ['PATH_LIST_SHA256'],
            'file_manifest_sha256':os.environ['FILE_MANIFEST_SHA256'],
            'candidate_rows':480,
            'unique_candidate_urls':210,
            'terminal_candidate_urls':210,
            'followup_routes':10,
            'admitted_sources':0,
            'class_state':'still_open',
            'class_closed':False,
            'outside_human_dependency':False,
            'external_contacts':0,
            'external_reviews':0,
            'publication_effect':'none',
            'adoption_effect':'none',
            'graph_effect':'none'
          }
          open(out,'w').write(json.dumps(value,indent=2)+'\n')
          PY
          (cd "$receipt" && sha256sum * > SHA256SUMS)
          echo "RECEIPT_DIR=$receipt" >> "$GITHUB_ENV"

      - name: Preserve exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd02-wave03-candidate-adjudication-materialization-v1
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
