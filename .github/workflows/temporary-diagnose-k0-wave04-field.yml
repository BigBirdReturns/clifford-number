name: Temporary diagnose K0 Wave 04 field carrier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave04-field.yml'
  push:
    branches: [agent/k0-wave04-field-adjudication]
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave04-field.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-wave04-field-adjudication
      - name: Inspect and decode fragments
        shell: bash
        run: |
          set +e
          for f in .github/tmp/k0-wave04-field-materializer-part-*.b64; do
            echo "FILE=$f BYTES=$(wc -c < "$f")"
            echo -n "INVALID_OFFSETS="
            LC_ALL=C grep -abo '[^A-Za-z0-9+/=[:space:]]' "$f" | head -20 || true
            base64 -d "$f" >/tmp/"$(basename "$f")".bin
            echo "PART_DECODE_EXIT=$? PART_DECODE_BYTES=$(wc -c < /tmp/"$(basename "$f")".bin)"
          done
          cat .github/tmp/k0-wave04-field-materializer-part-*.b64 | tr -d '\r\n\t ' > /tmp/joined.b64
          echo "JOINED_CHARS=$(wc -c < /tmp/joined.b64) MOD4=$(( $(wc -c < /tmp/joined.b64) % 4 ))"
          base64 -d /tmp/joined.b64 >/tmp/joined.tgz
          code=$?
          echo "JOIN_DECODE_EXIT=$code"
          echo "JOINED_TGZ_BYTES=$(wc -c < /tmp/joined.tgz)"
          echo "JOINED_TGZ_SHA256=$(sha256sum /tmp/joined.tgz | awk '{print $1}')"
          tar -tzf /tmp/joined.tgz | head -30
          exit $code
