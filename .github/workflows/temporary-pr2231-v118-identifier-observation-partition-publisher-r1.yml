name: Temporary PR 2231 V118 identifier observation partition publisher R1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/temporary-pr2231-v118-identifier-observation-partition-publisher-r1.yml

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v118-identifier-observation-partition-publisher-r1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      MAIN: 771a64b6b467748d2f4df667b5f78e76f9432d69
      EXPECTED_PRODUCT: 6c4acfb15047dcc6a28dca87732fe2c4c7e7b1e6
      EXPECTED_PRODUCT_TREE: d0e42c6312bda625474e557a691b1b2b981e9902
      EXPECTED_PRODUCT_LIBRARY: 5582c5310f6413de43c13a151abddc84cb206c8d
      EXPECTED_PRODUCT_TEST: 02794c0c3f18f439871cd3695c8fd9d77d083549
      REVIEW_ID: '5074298652'
      REVIEW_COMMENT_ID: '3901036540'
      REVIEW_THREAD_ID: PRRT_kwDOTGqftc6d-sYp
      QUALIFIER_PR: '2480'
      QUALIFIER_HEAD: dc9bca38cba9f2ec91836346064dcd9d6df3a680
      QUALIFIER_RUN: '33476069790'
      QUALIFIER_JOB: '99755479464'
      QUALIFIER_ARTIFACT_ID: '9788218793'
      QUALIFIER_ARTIFACT: pr2231-v118-identifier-observation-partition-r3
      QUALIFIER_DIGEST: sha256:e94638217e4daad969c437725e025afaa9189104f1800463a59572b6b51ac4ef
      CANDIDATE_COMMIT: 19e927b8c4c716f4aa60b5346830170586e57bba
      CANDIDATE_TREE: aa5c55523ac82b06f3c3632bfaa76620fbe17aea
      CANDIDATE_LIBRARY_BLOB: 25866adcbe4f95cb2f149d078f7a70bfd84570c5
      CANDIDATE_TEST_BLOB: 771393e3f0c40ce3bb60288ab162e46649f17e6a
      CANDIDATE_LIBRARY_SHA256: aa3dc4b679c331c8113c455fa46f9feb577d7ce7d437c69594607656068369ed
      CANDIDATE_TEST_SHA256: 11f3bcf6b216bbf378e5d6669adb79e3cf84b0f7446824ecbf4843ab940d63a5
      CANDIDATE_PATCH_SHA256: d3d630fd0839554d5eb33d4c26a594c0cf434def4742afc1f0a69af648a22259
      PUBLISHER_BRANCH: agent/pr2231-v118-identifier-observation-partition-publisher-r1
      OUT: /tmp/pr2231-v118-identifier-observation-partition-publisher-r1

    steps:
      - name: Check out exact product predecessor
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/clifford-number
          ref: 6c4acfb15047dcc6a28dca87732fe2c4c7e7b1e6
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind qualifier, rerun gates, and publish exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/qualifier" "$OUT/candidate"
          exec > >(tee "$OUT/publication.log") 2>&1
          failed=none
          published=false
          trap 'failed=$BASH_COMMAND' ERR
          preserve() {
            rc=$?
            trap - ERR EXIT
            set +e
            publication=skipped
            if [ "$published" = true ]; then publication=success; fi
            printf 'publication_exit=%s\nfailed_command=%s\npublication=%s\nproduct_mutation=%s\nreview_resolution_mutation=false\nreadiness_mutation=false\nmerge_mutation=false\n' "$rc" "$failed" "$publication" "$published" > "$OUT/status.env"
            find "$OUT" -type f -printf '%P\t%s\n' | sort > "$OUT/final-manifest.txt"
            exit "$rc"
          }
          trap preserve EXIT

          controller_pr='${{ github.event.pull_request.number }}'
          controller_head='${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.head.ref }}' = "$PUBLISHER_BRANCH"
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$OUT/product-before.json"
          gh api "repos/$REPO/pulls/$controller_pr" > "$OUT/publisher-before.json"
          gh api "repos/$REPO/pulls/$QUALIFIER_PR" > "$OUT/qualifier-pr.json"
          jq -e --arg head "$EXPECTED_PRODUCT" --arg base "$MAIN" --arg branch "$PRODUCT_BRANCH" '
            .state == "open" and .draft == true and .merged == false
            and .head.sha == $head and .head.ref == $branch
            and .base.sha == $base and .commits == 1 and .changed_files == 2
          ' "$OUT/product-before.json" >/dev/null
          jq -e --arg head "$controller_head" --arg base "$MAIN" --arg branch "$PUBLISHER_BRANCH" '
            .state == "open" and .draft == true and .merged == false
            and .head.sha == $head and .head.ref == $branch
            and .base.sha == $base and .commits == 1 and .changed_files == 1
          ' "$OUT/publisher-before.json" >/dev/null
          jq -e --arg head "$QUALIFIER_HEAD" --arg base "$MAIN" '
            .state == "closed" and .draft == true and .merged == false
            and .head.sha == $head and .base.sha == $base
            and .commits == 1 and .changed_files == 1
          ' "$OUT/qualifier-pr.json" >/dev/null

          gh api "repos/$REPO/pulls/comments/$REVIEW_COMMENT_ID" > "$OUT/review-comment-before.json"
          jq -e --arg commit "$EXPECTED_PRODUCT" --argjson review "$REVIEW_ID" '
            .pull_request_review_id == $review and .commit_id == $commit
            and (.body | contains("Preserve observations before accepting identifier partitions"))
          ' "$OUT/review-comment-before.json" >/dev/null
          gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on PullRequestReviewThread { id isResolved isOutdated comments(first: 20) { nodes { databaseId } } } } }' -F id="$REVIEW_THREAD_ID" > "$OUT/review-thread-before.json"
          jq -e --arg id "$REVIEW_THREAD_ID" --argjson comment "$REVIEW_COMMENT_ID" '
            .data.node.id == $id and .data.node.isResolved == false
            and .data.node.isOutdated == false
            and any(.data.node.comments.nodes[]; .databaseId == $comment)
          ' "$OUT/review-thread-before.json" >/dev/null

          gh api "repos/$REPO/actions/artifacts/$QUALIFIER_ARTIFACT_ID" > "$OUT/qualifier-artifact.json"
          gh api "repos/$REPO/actions/runs/$QUALIFIER_RUN" > "$OUT/qualifier-run.json"
          gh api "repos/$REPO/actions/jobs/$QUALIFIER_JOB" > "$OUT/qualifier-job.json"
          jq -e --arg digest "$QUALIFIER_DIGEST" --arg name "$QUALIFIER_ARTIFACT" --argjson run "$QUALIFIER_RUN" '
            .name == $name and .digest == $digest and .expired == false
            and .workflow_run.id == $run
          ' "$OUT/qualifier-artifact.json" >/dev/null
          jq -e --arg head "$QUALIFIER_HEAD" '.conclusion == "success" and .head_sha == $head' "$OUT/qualifier-run.json" >/dev/null
          jq -e --argjson run "$QUALIFIER_RUN" '.conclusion == "success" and .run_id == $run' "$OUT/qualifier-job.json" >/dev/null
          gh run download "$QUALIFIER_RUN" -R "$REPO" -n "$QUALIFIER_ARTIFACT" -D "$OUT/qualifier"
          test "$(sed -n 's/^qualification_exit=//p' "$OUT/qualifier/status.env")" = 0
          grep -Fxq 'PUBLICATION_SKIPPED' "$OUT/qualifier/terminal.txt"
          grep -Fxq 'QUALIFICATION_SUCCESS' "$OUT/qualifier/terminal.txt"
          grep -Fxq "candidate_commit=$CANDIDATE_COMMIT" "$OUT/qualifier/candidate.env"
          grep -Fxq "parent=$MAIN" "$OUT/qualifier/candidate.env"
          grep -Fxq "tree=$CANDIDATE_TREE" "$OUT/qualifier/candidate.env"
          grep -Fxq "library_blob=$CANDIDATE_LIBRARY_BLOB" "$OUT/qualifier/candidate.env"
          grep -Fxq "test_blob=$CANDIDATE_TEST_BLOB" "$OUT/qualifier/candidate.env"

          mapfile -t candidate_library < <(find "$OUT/qualifier" -type f -path '*/r1/candidate/industrial-exhaust.mjs')
          mapfile -t candidate_test < <(find "$OUT/qualifier" -type f -path '*/r1/candidate/industrial-exhaust.test.js')
          test "${#candidate_library[@]}" = 1
          test "${#candidate_test[@]}" = 1
          test "$(sha256sum "${candidate_library[0]}" | awk '{print $1}')" = "$CANDIDATE_LIBRARY_SHA256"
          test "$(sha256sum "${candidate_test[0]}" | awk '{print $1}')" = "$CANDIDATE_TEST_SHA256"
          test "$(git hash-object "${candidate_library[0]}")" = "$CANDIDATE_LIBRARY_BLOB"
          test "$(git hash-object "${candidate_test[0]}")" = "$CANDIDATE_TEST_BLOB"
          test "$(sha256sum "$OUT/qualifier/candidate/v118.patch" | awk '{print $1}')" = "$CANDIDATE_PATCH_SHA256"

          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT"
          test "$(git rev-parse HEAD^)" = "$MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test "$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)" = "$EXPECTED_PRODUCT_LIBRARY"
          test "$(git rev-parse HEAD:test/industrial-exhaust.test.js)" = "$EXPECTED_PRODUCT_TEST"
          cp "${candidate_library[0]}" tools/lib/industrial-exhaust.mjs
          cp "${candidate_test[0]}" test/industrial-exhaust.test.js
          git diff -- tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js > "$OUT/candidate/product.patch"
          test "$(sha256sum "$OUT/candidate/product.patch" | awk '{print $1}')" = "$CANDIDATE_PATCH_SHA256"

          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node --input-type=module <<'NODE' | tee "$OUT/direct-matrix.json"
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';
          const cases = [
            ['ID: 123-45678/3.14/(03) 6216 8041', 'ID: 123-45678/3.14/[contact omitted]'],
            ['ID: 123-45678/2026-08-17/(03) 6216 8041', 'ID: 123-45678/2026-08-17/[contact omitted]'],
            ['ID: 1234 5678/2026 people/(03) 6216 8041', 'ID: 1234 5678/2026 people/[contact omitted]'],
            ['ＩＤ：１２３－４５６７８／３．１４／（０３） ６２１６ ８０４１', 'ＩＤ：１２３－４５６７８／３．１４／[contact omitted]'],
            ['ID: 123-45678/(03) 6216 8041', 'ID: 123-45678/[contact omitted]'],
            ['ID: 123-45678/3.14/12345678', 'ID: 123-45678/3.14/12345678'],
            ['Phone: ID: +33 1.42.68.53.00 / 03-6216-8041', 'Phone: ID: [contact omitted] / [contact omitted]'],
            ['Visit 192.0.2.1/+81 3 6216 5111', 'Visit 192.0.2.1/+81 3 6216 5111']
          ];
          const results = cases.map(([input, expected]) => {
            const actual = redactContactData(input);
            assert.equal(actual, expected, input);
            return { input, expected, actual, pass: true };
          });
          console.log(JSON.stringify(results, null, 2));
          NODE

          : > "$OUT/focused-product.log"
          for test_file in test/industrial-exhaust*.test.js; do
            printf 'RUN %s\n' "$test_file" | tee -a "$OUT/focused-product.log"
            node "$test_file" 2>&1 | tee -a "$OUT/focused-product.log"
          done
          npm run release:check 2>&1 | tee "$OUT/release-product.log"

          git reset --hard "$MAIN"
          git clean -fd
          cp "${candidate_library[0]}" tools/lib/industrial-exhaust.mjs
          cp "${candidate_test[0]}" test/industrial-exhaust.test.js
          : > "$OUT/focused-main-transplant.log"
          for test_file in test/industrial-exhaust*.test.js; do
            printf 'RUN %s\n' "$test_file" | tee -a "$OUT/focused-main-transplant.log"
            node "$test_file" 2>&1 | tee -a "$OUT/focused-main-transplant.log"
          done
          npm run release:check 2>&1 | tee "$OUT/release-main-transplant.log"

          git reset --hard "$MAIN"
          git clean -fd
          cp "${candidate_library[0]}" tools/lib/industrial-exhaust.mjs
          cp "${candidate_test[0]}" test/industrial-exhaust.test.js
          test "$(git diff --name-only | sort | paste -sd ',' -)" = 'test/industrial-exhaust.test.js,tools/lib/industrial-exhaust.mjs'
          export GIT_AUTHOR_NAME='BigBirdReturns'
          export GIT_AUTHOR_EMAIL='219768509+BigBirdReturns@users.noreply.github.com'
          export GIT_COMMITTER_NAME='BigBirdReturns'
          export GIT_COMMITTER_EMAIL='219768509+BigBirdReturns@users.noreply.github.com'
          export GIT_AUTHOR_DATE='2026-09-01T05:00:00Z'
          export GIT_COMMITTER_DATE='2026-09-01T05:00:00Z'
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" = "$CANDIDATE_TREE"
          candidate_commit="$(printf '%s\n\n%s\n' 'fix: preserve observations before identifier partitions' 'Give complete observations exclusive source custody before identifier-partition telephone admission.' | git commit-tree "$candidate_tree" -p "$MAIN")"
          test "$candidate_commit" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse "$candidate_commit^")" = "$MAIN"
          test "$(git rev-parse "$candidate_commit:tools/lib/industrial-exhaust.mjs")" = "$CANDIDATE_LIBRARY_BLOB"
          test "$(git rev-parse "$candidate_commit:test/industrial-exhaust.test.js")" = "$CANDIDATE_TEST_BLOB"
          test "$(git diff --name-only "$MAIN" "$candidate_commit" | sort | paste -sd ',' -)" = 'test/industrial-exhaust.test.js,tools/lib/industrial-exhaust.mjs'
          git cat-file -p "$candidate_commit" > "$OUT/candidate/commit.txt"
          printf 'candidate_commit=%s\nparent=%s\ntree=%s\nlibrary_blob=%s\ntest_blob=%s\n' "$candidate_commit" "$MAIN" "$candidate_tree" "$CANDIDATE_LIBRARY_BLOB" "$CANDIDATE_TEST_BLOB" | tee "$OUT/candidate.env"

          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test "$(gh api "repos/$REPO/git/ref/heads/$PRODUCT_BRANCH" --jq '.object.sha')" = "$EXPECTED_PRODUCT"
          test "$(gh api "repos/$REPO/git/ref/heads/$PUBLISHER_BRANCH" --jq '.object.sha')" = "$controller_head"
          gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$OUT/product-prepublish.json"
          jq -e --arg head "$EXPECTED_PRODUCT" --arg base "$MAIN" '
            .state == "open" and .draft == true and .merged == false
            and .head.sha == $head and .base.sha == $base
            and .commits == 1 and .changed_files == 2
          ' "$OUT/product-prepublish.json" >/dev/null
          gh api "repos/$REPO/pulls/comments/$REVIEW_COMMENT_ID" > "$OUT/review-comment-prepublish.json"
          cmp "$OUT/review-comment-before.json" "$OUT/review-comment-prepublish.json"
          gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on PullRequestReviewThread { id isResolved isOutdated comments(first: 20) { nodes { databaseId } } } } }' -F id="$REVIEW_THREAD_ID" > "$OUT/review-thread-prepublish.json"
          cmp "$OUT/review-thread-before.json" "$OUT/review-thread-prepublish.json"

          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$EXPECTED_PRODUCT" origin "$candidate_commit:refs/heads/$PRODUCT_BRANCH"
          published=true

          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test "$(gh api "repos/$REPO/git/ref/heads/$PRODUCT_BRANCH" --jq '.object.sha')" = "$CANDIDATE_COMMIT"
          test "$(gh api "repos/$REPO/git/ref/heads/$PUBLISHER_BRANCH" --jq '.object.sha')" = "$controller_head"
          gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$OUT/product-after.json"
          jq -e --arg head "$CANDIDATE_COMMIT" --arg base "$MAIN" --arg branch "$PRODUCT_BRANCH" '
            .state == "open" and .draft == true and .merged == false
            and .head.sha == $head and .head.ref == $branch
            and .base.sha == $base and .commits == 1 and .changed_files == 2
          ' "$OUT/product-after.json" >/dev/null
          gh api "repos/$REPO/pulls/comments/$REVIEW_COMMENT_ID" > "$OUT/review-comment-after.json"
          jq -e --arg commit "$EXPECTED_PRODUCT" --argjson review "$REVIEW_ID" '
            .pull_request_review_id == $review and .commit_id == $commit
            and (.body | contains("Preserve observations before accepting identifier partitions"))
          ' "$OUT/review-comment-after.json" >/dev/null
          gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on PullRequestReviewThread { id isResolved isOutdated comments(first: 20) { nodes { databaseId } } } } }' -F id="$REVIEW_THREAD_ID" > "$OUT/review-thread-after.json"
          jq -e --arg id "$REVIEW_THREAD_ID" --argjson comment "$REVIEW_COMMENT_ID" '
            .data.node.id == $id and .data.node.isResolved == false
            and any(.data.node.comments.nodes[]; .databaseId == $comment)
          ' "$OUT/review-thread-after.json" >/dev/null
          printf 'PUBLICATION_SUCCESS\n' | tee "$OUT/terminal.txt"

      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v118-identifier-observation-partition-publication-r1
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
