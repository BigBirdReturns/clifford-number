name: TEMP prove canonical RD-04 next-frontier protocol v2

on:
  push:
    branches:
      - 'agent/ssc-rd04-next-frontier-protocol-postmerge-proof-v1'

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

env:
  CONTROLLER: .transport/ssc-rd04-next-frontier-protocol-postmerge-proof-v2.py

concurrency:
  group: temp-ssc-rd04-next-frontier-protocol-postmerge-proof-v2
  cancel-in-progress: true

jobs:
  prove:
    if: github.ref_name == 'agent/ssc-rd04-next-frontier-protocol-postmerge-proof-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Require inert v2 proof trigger
        run: |
          set -Eeuo pipefail
          if test -f '.trigger/ssc-rd04-next-frontier-protocol-postmerge-proof-v1/EXECUTE-V2'; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.execute == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.execute == 'true'
        with:
          python-version: '3.13'
      - name: Install pinned proof dependencies
        if: steps.gate.outputs.execute == 'true'
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - id: prove
        name: Prove canonical product and retire temporary estate
        if: steps.gate.outputs.execute == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -f "$CONTROLLER"
          python -m py_compile "$CONTROLLER"
          python "$CONTROLLER"
      - name: Preserve exact v2 proof receipt
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-next-frontier-protocol-postmerge-proof-v2
          path: /tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v2
          if-no-files-found: warn
          retention-days: 90
      - name: Refuse failed v2 proof
        if: always() && steps.gate.outputs.execute == 'true'
        env:
          OUTCOME: ${{ steps.prove.outcome }}
        run: test "$OUTCOME" = success
