name: Preference custody choice-effectiveness control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/choice-effectiveness.fixture.json'
      - 'tools/lib/preference-choice-effectiveness.mjs'
      - 'tools/compile-preference-choice-effectiveness.mjs'
      - 'tools/validate-preference-choice-effectiveness.mjs'
      - 'test/preference-choice-effectiveness.test.js'
      - 'docs/preference-custody-choice-effectiveness.md'
      - '.github/workflows/preference-choice-effectiveness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  choice-effectiveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile comprehension, accessibility, exit, and assent worlds
        run: node tools/compile-preference-choice-effectiveness.mjs
      - name: Validate construct, transfer, translation, access, agency, assent, and authority boundaries
        run: node tools/validate-preference-choice-effectiveness.mjs
      - name: Exercise open, recognition, translation, access, friction, substitution, payment, authority, and tamper fixtures
        run: node test/preference-choice-effectiveness.test.js
      - name: Preserve deterministic choice-effectiveness projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-choice-effectiveness-pc21
          path: |
            build/research/preference-choice-effectiveness.json
            build/research/preference-choice-effectiveness.md
          if-no-files-found: error
