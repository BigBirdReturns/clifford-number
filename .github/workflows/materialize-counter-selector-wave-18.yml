name: Materialize Counter-Selector Wave 18

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-18.yml'
      - '.github/materializers/counter-selector-wave-18/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-18-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-18-repair-continuation

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify carrier and unpack exact Wave 18 estate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave18-expected-blobs <<'EOF'
          d5df4689306b62730e0154479f3ae390914ee0cf  .github/materializers/counter-selector-wave-18/payload-000
          ec9b3350667cc184ebdd2dc0d4f604ec4bf86fa9  .github/materializers/counter-selector-wave-18/payload-001
          68a7ece12e1fc339836959089fd9808adf132f3d  .github/materializers/counter-selector-wave-18/payload-002
          6a0659609f110ebef57f185ade53df01924474cb  .github/materializers/counter-selector-wave-18/payload-003
          9a03d9e420e4aaab4e3b5a7193ca4d28cda0520b  .github/materializers/counter-selector-wave-18/payload-004
          a982892950e063d3186da1dc57deeb29531e63e9  .github/materializers/counter-selector-wave-18/payload-005
          91b62782116dd6b0934f4c6592eaf8a98f77fbf2  .github/materializers/counter-selector-wave-18/payload-006
          1d7af30f659b0289d3cb592e45e14f808aabc305  .github/materializers/counter-selector-wave-18/payload-007
          516e4060008ae2ed93a613d2f7fc45ed52ba35ce  .github/materializers/counter-selector-wave-18/payload-008
          3543eaea8a53a61148d67fb390d29ccd620c399d  .github/materializers/counter-selector-wave-18/payload-009
          adbdc65f7637ff4377f26c0e01efddd65db5d0d9  .github/materializers/counter-selector-wave-18/payload-010
          02469fd93eaa0669b344f9d86dea03adae70f934  .github/materializers/counter-selector-wave-18/payload-011
          c442d4ba1648bb9146c92a0b90f215eb1a6dff03  .github/materializers/counter-selector-wave-18/payload-012
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave18-expected-blobs

          cat .github/materializers/counter-selector-wave-18/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-18.tar.gz
          echo '627d2f566c1450b3ddcc5f9b32e552598b8a6ac91a7625b9ae15445360149524  /tmp/counter-selector-wave-18.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-18.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-18

      - name: Build, validate, and attack Wave 18
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-18.mjs
          node tools/validate-counter-selector-wave-18.mjs
          node test/counter-selector-wave-18.test.js

      - name: Commit exact permanent non-workflow Wave 18 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-18/payload-000 \
            .github/materializers/counter-selector-wave-18/payload-001 \
            .github/materializers/counter-selector-wave-18/payload-002 \
            .github/materializers/counter-selector-wave-18/payload-003 \
            .github/materializers/counter-selector-wave-18/payload-004 \
            .github/materializers/counter-selector-wave-18/payload-005 \
            .github/materializers/counter-selector-wave-18/payload-006 \
            .github/materializers/counter-selector-wave-18/payload-007 \
            .github/materializers/counter-selector-wave-18/payload-008 \
            .github/materializers/counter-selector-wave-18/payload-009 \
            .github/materializers/counter-selector-wave-18/payload-010 \
            .github/materializers/counter-selector-wave-18/payload-011 \
            .github/materializers/counter-selector-wave-18/payload-012 \
            data/project/counter-selector-external-review-export-registry.json \
            data/project/counter-selector-repair-continuation-registry.json \
            data/project/counter-selector-wave-18-release-manifest.json \
            data/project/counter-selector-wave-18-repair-continuation.json \
            docs/methods/counter-selector-repair-continuation.md \
            docs/milestones/counter-selector-wave-18.md \
            reports/core-thesis/counter-selector-wave-18/data.json \
            reports/core-thesis/counter-selector-wave-18/index.html \
            schemas/counter-selector-repair-continuation.schema.json \
            test/counter-selector-wave-18.test.js \
            tools/build-counter-selector-wave-18.mjs \
            tools/validate-counter-selector-wave-18.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Advance Counter-Selector Wave 18 repair continuation'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 18 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-18.mjs
          node tools/validate-counter-selector-wave-18.mjs
          node test/counter-selector-wave-18.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent non-workflow Wave 18 head
        run: git push origin HEAD:agent/counter-selector-wave-18-repair-continuation
