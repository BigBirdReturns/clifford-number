name: Temporary materialize K0 Wave 07 field adjudication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave07-field.yml'
  push:
    branches: [agent/k0-wave07-field-adjudication]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave07-field.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-wave07-field-adjudication
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct and verify exact source
        run: |
          set -euo pipefail
          test "$(find .github/tmp -maxdepth 1 -name 'k0-wave07-field-source-piece-*.bin' -type f | wc -l)" -eq 22
          cat .github/tmp/k0-wave07-field-source-piece-*.bin > /tmp/k0-wave07-field-source.tar.gz
          test "$(sha256sum /tmp/k0-wave07-field-source.tar.gz | awk '{print $1}')" = "0de616122be3e2bf69f975d8106badefd2ba3036a73324280f8349e425dd5444"
          python - <<'PY'
          import tarfile
          expected = {
            '.github/workflows/k0-wave07-field-adjudication.yml',
            'data/research/k0-wave07-field-adjudication.json',
            'docs/milestones/m05-k0-wave07-field-adjudication.md',
            'tools/build-k0-wave07-field-adjudication.mjs',
            'tools/validate-k0-wave07-field-adjudication.mjs',
            'test/k0-wave07-field-adjudication.test.js',
            'data/research/k0-role-neutral-denominator.json',
            'data/research/corpus-coverage.json',
            'data/research/selection-adversarial-reviews.json',
            'tools/build-k0-epistemic-admissibility.mjs',
            'tools/validate-k0-epistemic-admissibility.mjs',
            'test/k0-epistemic-admissibility.test.js',
            'tools/validate-k0-role-neutral-wave-07.mjs',
            'test/k0-role-neutral-wave-07.test.js',
          }
          with tarfile.open('/tmp/k0-wave07-field-source.tar.gz', 'r:gz') as tf:
            actual = {m.name.removeprefix('./') for m in tf.getmembers() if m.isfile()}
            assert actual == expected, f'bundle path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
            for member in tf.getmembers():
              name = member.name.removeprefix('./')
              assert name and not name.startswith('/') and '..' not in name.split('/'), name
          print(f'exact source denominator: {len(actual)}')
          PY
          tar -xzf /tmp/k0-wave07-field-source.tar.gz

      - name: Build and validate focused and aggregate products
        run: |
          set -euo pipefail
          node tools/build-k0-wave07-field-adjudication.mjs
          node tools/validate-k0-wave07-field-adjudication.mjs
          node test/k0-wave07-field-adjudication.test.js
          node tools/build-k0-role-neutral-wave-07.mjs
          node tools/validate-k0-role-neutral-wave-07.mjs
          node test/k0-role-neutral-wave-07.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent tree
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          git clean -fd
          test "$(find .github/tmp -maxdepth 1 -name 'k0-wave07-field-source-piece-*.bin' -type f | wc -l)" -eq 22
          cat .github/tmp/k0-wave07-field-source-piece-*.bin > /tmp/k0-wave07-field-source.tar.gz
          test "$(sha256sum /tmp/k0-wave07-field-source.tar.gz | awk '{print $1}')" = "0de616122be3e2bf69f975d8106badefd2ba3036a73324280f8349e425dd5444"
          tar -xzf /tmp/k0-wave07-field-source.tar.gz
          node tools/build-k0-wave07-field-adjudication.mjs
          node tools/build-k0-role-neutral-wave-07.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-wave07-field-adjudication.mjs
          node test/k0-wave07-field-adjudication.test.js
          node tools/validate-k0-role-neutral-wave-07.mjs
          node test/k0-role-neutral-wave-07.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Prove deterministic 23-path product
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          paths = [
            '.github/workflows/k0-wave07-field-adjudication.yml',
            'data/project/k0-epistemic-admissibility-release-manifest.json',
            'data/project/k0-role-neutral-wave-07-release-manifest.json',
            'data/project/k0-wave07-field-adjudication-release-manifest.json',
            'data/research/corpus-coverage.json',
            'data/research/k0-role-neutral-denominator.json',
            'data/research/k0-wave07-field-adjudication.json',
            'data/research/selection-adversarial-reviews.json',
            'docs/milestones/m05-k0-wave07-field-adjudication.md',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-07.html',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-07.json',
            'reports/core-thesis/answerable-power/k0-wave07-field-adjudication.html',
            'reports/core-thesis/answerable-power/k0-wave07-field-adjudication.json',
            'reports/core-thesis/answerable-power/k0.html',
            'reports/core-thesis/answerable-power/k0.json',
            'test/k0-epistemic-admissibility.test.js',
            'test/k0-role-neutral-wave-07.test.js',
            'test/k0-wave07-field-adjudication.test.js',
            'tools/build-k0-epistemic-admissibility.mjs',
            'tools/build-k0-wave07-field-adjudication.mjs',
            'tools/validate-k0-epistemic-admissibility.mjs',
            'tools/validate-k0-role-neutral-wave-07.mjs',
            'tools/validate-k0-wave07-field-adjudication.mjs',
          ]
          before = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          subprocess.run(['node','tools/build-k0-wave07-field-adjudication.mjs'], check=True)
          subprocess.run(['node','tools/build-k0-role-neutral-wave-07.mjs'], check=True)
          subprocess.run(['node','tools/build-k0-epistemic-admissibility.mjs'], check=True)
          after = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          assert before == after, {p: (before[p], after[p]) for p in paths if before[p] != after[p]}
          print(json.dumps({'deterministic': True, 'paths': len(paths)}, indent=2))
          PY

      - name: Commit non-workflow permanent surface and remove carriers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm .github/workflows/k0-wave07-field-adjudication.yml
          git rm .github/tmp/k0-wave07-field-source-piece-*.bin

          git add \
            data/project/k0-epistemic-admissibility-release-manifest.json \
            data/project/k0-role-neutral-wave-07-release-manifest.json \
            data/project/k0-wave07-field-adjudication-release-manifest.json \
            data/research/corpus-coverage.json \
            data/research/k0-role-neutral-denominator.json \
            data/research/k0-wave07-field-adjudication.json \
            data/research/selection-adversarial-reviews.json \
            docs/milestones/m05-k0-wave07-field-adjudication.md \
            reports/core-thesis/answerable-power/k0-role-neutral-wave-07.html \
            reports/core-thesis/answerable-power/k0-role-neutral-wave-07.json \
            reports/core-thesis/answerable-power/k0-wave07-field-adjudication.html \
            reports/core-thesis/answerable-power/k0-wave07-field-adjudication.json \
            reports/core-thesis/answerable-power/k0.html \
            reports/core-thesis/answerable-power/k0.json \
            test/k0-epistemic-admissibility.test.js \
            test/k0-role-neutral-wave-07.test.js \
            test/k0-wave07-field-adjudication.test.js \
            tools/build-k0-epistemic-admissibility.mjs \
            tools/build-k0-wave07-field-adjudication.mjs \
            tools/validate-k0-epistemic-admissibility.mjs \
            tools/validate-k0-role-neutral-wave-07.mjs \
            tools/validate-k0-wave07-field-adjudication.mjs

          python - <<'PY'
          import subprocess
          permanent = {
            'data/project/k0-epistemic-admissibility-release-manifest.json',
            'data/project/k0-role-neutral-wave-07-release-manifest.json',
            'data/project/k0-wave07-field-adjudication-release-manifest.json',
            'data/research/corpus-coverage.json',
            'data/research/k0-role-neutral-denominator.json',
            'data/research/k0-wave07-field-adjudication.json',
            'data/research/selection-adversarial-reviews.json',
            'docs/milestones/m05-k0-wave07-field-adjudication.md',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-07.html',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-07.json',
            'reports/core-thesis/answerable-power/k0-wave07-field-adjudication.html',
            'reports/core-thesis/answerable-power/k0-wave07-field-adjudication.json',
            'reports/core-thesis/answerable-power/k0.html',
            'reports/core-thesis/answerable-power/k0.json',
            'test/k0-epistemic-admissibility.test.js',
            'test/k0-role-neutral-wave-07.test.js',
            'test/k0-wave07-field-adjudication.test.js',
            'tools/build-k0-epistemic-admissibility.mjs',
            'tools/build-k0-wave07-field-adjudication.mjs',
            'tools/validate-k0-epistemic-admissibility.mjs',
            'tools/validate-k0-role-neutral-wave-07.mjs',
            'tools/validate-k0-wave07-field-adjudication.mjs',
          }
          transport = {f'.github/tmp/k0-wave07-field-source-piece-{i:03d}.bin' for i in range(22)}
          expected = permanent | transport
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          assert len(permanent) == 22 and len(transport) == 22 and len(actual) == 44
          assert not any(p.startswith('build/') or p.startswith('dist/') or p.startswith('.github/workflows/') for p in actual)
          print('exact staged denominator: 22 non-workflow permanent paths + 22 carrier deletions')
          PY

          git diff --cached --check
          git commit -m 'Materialize K0 Wave 07 field adjudication'
          git push origin HEAD:agent/k0-wave07-field-adjudication
