name: Temporary Wave 22 post-Wave 21 fetch diagnostic

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/tmp/wave22-post-wave21-fetch-diagnostic-trigger.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reproduce Wave 21 custody fetches
        run: node tools/validate-lake-allocator-war-wave-21.mjs

      - name: Diagnose descendant history recovery
        shell: bash
        run: |
          set -u
          base='ec730441e4779b24226f12f556707f4a89b7fe3f'
          remote_head="refs/remotes/origin/${GITHUB_HEAD_REF}"
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "shallow_after_wave21=$(git rev-parse --is-shallow-repository)"
          echo 'shallow_boundaries_begin'
          cat .git/shallow 2>/dev/null || true
          echo 'shallow_boundaries_end'
          git cat-file -e "${base}^{commit}" 2>/dev/null
          echo "base_before_status=$?"
          git fetch --no-tags --unshallow origin \
            "+refs/heads/${GITHUB_HEAD_REF}:${remote_head}" \
            > /tmp/unshallow.out 2> /tmp/unshallow.err
          status=$?
          echo "unshallow_status=$status"
          cat /tmp/unshallow.out
          cat /tmp/unshallow.err
          echo "shallow_after_unshallow=$(git rev-parse --is-shallow-repository)"
          git cat-file -e "${base}^{commit}" 2>/dev/null
          echo "base_after_unshallow_status=$?"
          git merge-base --is-ancestor "$base" "$remote_head" 2>/dev/null
          echo "ancestry_after_unshallow_status=$?"
          if [ "$status" -ne 0 ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$base" "$remote_head"; then
            git fetch --no-tags --depth=1000000 origin \
              "+refs/heads/${GITHUB_HEAD_REF}:${remote_head}" \
              > /tmp/depth.out 2> /tmp/depth.err
            depth_status=$?
            echo "depth_status=$depth_status"
            cat /tmp/depth.out
            cat /tmp/depth.err
            echo "shallow_after_depth=$(git rev-parse --is-shallow-repository)"
            git cat-file -e "${base}^{commit}" 2>/dev/null
            echo "base_after_depth_status=$?"
            git merge-base --is-ancestor "$base" "$remote_head" 2>/dev/null
            echo "ancestry_after_depth_status=$?"
          fi
          exit 0
