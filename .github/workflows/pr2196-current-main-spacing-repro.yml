name: Current-main domestic wrapper boundary trace

on:
  pull_request:
    paths:
      - '.github/workflows/pr2196-current-main-spacing-repro.yml'

permissions:
  contents: read

concurrency:
  group: pr2210-current-main-domestic-wrapper-trace
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8321004b1bb03d0d119272f9f9694a6b121b470d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace selected range and closer ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label} occurrence count was {count}, expected 1')
              return text.replace(old, new, 1)

          path = Path('tools/lib/industrial-exhaust.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = '''  return value.slice(contextStart);
          }

          function stripUnownedLeadingPhoneClosers(value, availableOuterOpeners) {
          '''
          helper = '''  return value.slice(contextStart);
          }

          function partitionRedactedPhoneBoundary(candidate, start, end, structuralPrefix) {
            const debug = candidate.normalize('NFKC').includes('(03) ) 6216 5111');
            const openerStack = [];
            const scanSurviving = value => {
              for (const character of value) {
                const normalized = character.normalize('NFKC');
                if (normalized === '(') openerStack.push(true);
                else if (normalized === ')' && openerStack.length) openerStack.pop();
              }
            };

            const structuralContext = currentNarrativeParenthesisContext(structuralPrefix);
            scanSurviving(structuralContext);
            scanSurviving(candidate.slice(0, start));

            let preservedBoundary = '';
            let previousCloserEnd = start;
            let closerRunHadDeletion = false;

            if (debug) {
              console.error(`BOUNDARY_START ${JSON.stringify({
                candidate,
                start,
                end,
                structuralPrefix,
                structuralContext,
                prefix: candidate.slice(0, start),
                selected: candidate.slice(start, end),
                suffix: candidate.slice(end),
                openerStack: [...openerStack]
              })}`);
            }

            const processCloser = (index, floor, forceDropWhitespace = false) => {
              let tokenStart = index;
              while (tokenStart > floor && /\\s/u.test(candidate[tokenStart - 1])) {
                tokenStart -= 1;
              }

              const opener = openerStack.pop() ?? null;
              const ownedBySurvivingOpener = opener === true;
              const continuesCloserRun = tokenStart === previousCloserEnd;
              const currentCloserWasDeleted = !ownedBySurvivingOpener;
              if (debug) {
                console.error(`CLOSER_BEFORE ${JSON.stringify({
                  index,
                  floor,
                  tokenStart,
                  token: candidate.slice(tokenStart, index + 1),
                  opener,
                  ownedBySurvivingOpener,
                  continuesCloserRun,
                  forceDropWhitespace,
                  closerRunHadDeletion,
                  previousCloserEnd,
                  openerStack: [...openerStack]
                })}`);
              }
              if (ownedBySurvivingOpener) {
                const preserveStart = forceDropWhitespace
                  || (continuesCloserRun && closerRunHadDeletion)
                  ? index
                  : tokenStart;
                preservedBoundary += candidate.slice(preserveStart, index + 1);
              }
              closerRunHadDeletion = continuesCloserRun
                ? closerRunHadDeletion || currentCloserWasDeleted
                : currentCloserWasDeleted;
              previousCloserEnd = index + 1;
              if (debug) {
                console.error(`CLOSER_AFTER ${JSON.stringify({
                  preservedBoundary,
                  closerRunHadDeletion,
                  previousCloserEnd
                })}`);
              }
            };

            for (let index = start; index < end; index += 1) {
              const normalized = candidate[index].normalize('NFKC');
              if (normalized === '(') {
                openerStack.push(false);
                if (debug) console.error(`OPENER ${JSON.stringify({ index, openerStack: [...openerStack] })}`);
                continue;
              }
              if (normalized === ')') {
                processCloser(index, Math.max(start, previousCloserEnd));
              }
            }

            let cursor = end;
            let pendingWhitespace = '';
            while (cursor < candidate.length) {
              const character = candidate[cursor];
              const normalized = character.normalize('NFKC');
              if (/\\s/u.test(character)) {
                pendingWhitespace += character;
                cursor += 1;
                continue;
              }
              if (normalized !== ')') break;
              const dropLeadingWhitespace = pendingWhitespace.length > 0
                && closerRunHadDeletion;
              processCloser(cursor, previousCloserEnd, dropLeadingWhitespace);
              pendingWhitespace = '';
              cursor += 1;
            }

            const remainder = `${pendingWhitespace}${candidate.slice(cursor)}`;
            if (debug) {
              console.error(`BOUNDARY_END ${JSON.stringify({
                preservedBoundary,
                pendingWhitespace,
                cursor,
                remainder,
                openerStack: [...openerStack]
              })}`);
            }
            return { preservedBoundary, remainder };
          }

          function stripUnownedLeadingPhoneClosers(value, availableOuterOpeners) {
          '''
          text = replace_once(text, anchor, helper, 'helper anchor')

          old = '''  if (wholeSpanIsAffirmative && allowInitialGroup && observationGroup > 0) {
            const { start, end } = phoneWindowBounds(candidate, groups, 0, observationGroup - 1);
            const completePhoneSpan = candidate.slice(start, end);
            if (phoneCandidateScore(completePhoneSpan, `${externalPrefix}${candidate.slice(0, start)}`)) {
              const remainder = candidate.slice(end);
              const redactedRemainder = redactPhoneSubspans(
                remainder,
                `${externalPrefix}${candidate.slice(0, start)}[contact omitted]`,
                externalSuffix,
                true
              );
              return `${candidate.slice(0, start)}[contact omitted]${redactedRemainder}`;
            }
          }
          '''
          new = '''  if (wholeSpanIsAffirmative && allowInitialGroup && observationGroup > 0) {
            const { start, end } = phoneWindowBounds(candidate, groups, 0, observationGroup - 1);
            const completePhoneSpan = candidate.slice(start, end);
            if (phoneCandidateScore(completePhoneSpan, `${externalPrefix}${candidate.slice(0, start)}`)) {
              const prefixBeforeRange = candidate.slice(0, start);
              const boundary = partitionRedactedPhoneBoundary(
                candidate,
                start,
                end,
                externalPrefix
              );
              const markerPrefix = `${prefixBeforeRange}[contact omitted]${boundary.preservedBoundary}`;
              const redactedRemainder = redactPhoneSubspans(
                boundary.remainder,
                `${externalPrefix}${markerPrefix}`,
                externalSuffix,
                true
              );
              return `${markerPrefix}${redactedRemainder}`;
            }
          }
          '''
          text = replace_once(text, old, new, 'whole-span shortcut')
          path.write_text(text, encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --input-type=module <<'NODE'
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          for (const input of [
            'Context (Phone: (03) ) 6216 5111',
            'Context (Phone: (03 6216 5111) )'
          ]) {
            console.log(`RESULT ${JSON.stringify({ input, actual: redactContactData(input) })}`);
          }
          NODE
