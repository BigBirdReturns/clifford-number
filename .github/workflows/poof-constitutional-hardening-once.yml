      - name: Build and validate hardened ecology
        run: |
          npm run ci:poof-ecology
          git diff --check
      - name: Remove one-shot machinery and leave final-check trigger
        run: |
          rm -f .poof-constitutional-hardening-trigger
          rm -f .github/workflows/poof-constitutional-hardening-once.yml
          cat > docs/poof-clifford-hardening-finalize.md <<'EOF'
          # POOF constitutional hardening finalization marker

          This temporary file exists only to permit one connector-authored deletion commit after the one-shot generator commit. Its deletion triggers the ordinary PR validation workflows on the final hardened tree. It is outside the frozen ecology release scope.
          EOF
      - name: Commit hardened source and generated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden POOF constitutional effect and projection law"
          git push origin HEAD:agent/poof-clifford-ecology
