name: Temporary diagnose M-04G payload pieces

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/temporary/m04g-evidence-hydrology/**'
      - '.github/workflows/temporary-m04g-payload-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04g-evidence-hydrology-inland-sea
      - name: Upload exact payload carrier and repair map
        uses: actions/upload-artifact@v4
        with:
          name: m04g-payload-source
          path: .github/temporary/m04g-evidence-hydrology/
          if-no-files-found: error
          include-hidden-files: true
