name: Temporary DCA-H01 materialization

on:
  push:
    branches: [agent/dca-h01-field-hypothesis]
    paths:
      - '.github/workflows/temporary-dca-h01-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dca-h01-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dca-h01-field-hypothesis
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate DCA-H01
        run: |
          node tools/build-dca-h01.mjs
          node tools/validate-dca-h01.mjs
          node test/dca-h01.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Commit deterministic products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/project/dca-h01-release-manifest.json \
            reports/core-thesis/distributed-counterpower-aversion/data.json \
            reports/core-thesis/distributed-counterpower-aversion/index.html
          if git diff --cached --quiet; then
            echo "DCA-H01 products already deterministic"
            exit 0
          fi
          git commit -m "Materialize DCA-H01 deterministic products"
          git push origin HEAD:agent/dca-h01-field-hypothesis
