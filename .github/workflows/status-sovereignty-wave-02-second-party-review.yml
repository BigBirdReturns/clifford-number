name: Status-for-sovereignty Wave 02 second-party review campaign

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/status-sovereignty-wave-02-second-party-review-*.json'
      - 'data/research/status-sovereignty-wave-02-second-party-review-*.json'
      - 'schemas/status-sovereignty-wave-02-second-party-review-*.json'
      - 'tools/*wave-02-second-party-review*'
      - 'test/status-sovereignty-wave-02-second-party-review.test.js'
      - '.github/workflows/status-sovereignty-wave-02-second-party-review.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/status-sovereignty-wave-02-second-party-review-*.json'
      - 'data/research/status-sovereignty-wave-02-second-party-review-*.json'
      - 'schemas/status-sovereignty-wave-02-second-party-review-*.json'
      - 'tools/*wave-02-second-party-review*'
      - 'test/status-sovereignty-wave-02-second-party-review.test.js'
      - '.github/workflows/status-sovereignty-wave-02-second-party-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate campaign
        run: |
          node tools/build-status-sovereignty-wave-02-second-party-review.mjs
          node tools/validate-status-sovereignty-wave-02-second-party-review.mjs
          node test/status-sovereignty-wave-02-second-party-review.test.js
      - name: Prove publication hold
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/reports/core-thesis/status-sovereignty/wave-02-second-party-review
          test ! -e dist/data/research/status-sovereignty-wave-02-second-party-review-candidates.json
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic campaign products
        run: |
          git restore --staged --worktree .
          node tools/build-status-sovereignty-wave-02-second-party-review.mjs
          node tools/validate-status-sovereignty-wave-02-second-party-review.mjs
          node test/status-sovereignty-wave-02-second-party-review.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
