name: Preference custody laboratory floor v12

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-custody.mjs'
      - 'tools/lib/preference-equifinality.mjs'
      - 'tools/lib/preference-attrition.mjs'
      - 'tools/lib/preference-subgroup.mjs'
      - 'tools/lib/preference-standing.mjs'
      - 'tools/lib/preference-agenda.mjs'
      - 'tools/lib/preference-package.mjs'
      - 'tools/lib/preference-succession.mjs'
      - 'tools/lib/preference-dynamic-change.mjs'
      - 'tools/lib/preference-network-formation.mjs'
      - 'tools/lib/preference-deliberative-formation.mjs'
      - 'tools/lib/preference-epistemic-quality.mjs'
      - 'tools/lib/preference-provenance-recovery.mjs'
      - 'tools/lib/preference-custody-manifest.mjs'
      - 'tools/lib/preference-custody-manifest-v9.mjs'
      - 'tools/lib/preference-custody-manifest-v10.mjs'
      - 'tools/lib/preference-custody-manifest-v11.mjs'
      - 'tools/lib/preference-custody-manifest-v12.mjs'
      - 'tools/compile-preference-provenance-recovery.mjs'
      - 'tools/validate-preference-provenance-recovery.mjs'
      - 'tools/compile-preference-custody-manifest-v12.mjs'
      - 'tools/validate-preference-custody-manifest-v12.mjs'
      - 'test/preference-provenance-recovery.test.js'
      - 'test/preference-custody-manifest-v12.test.js'
      - 'docs/preference-custody-provenance-recovery.md'
      - 'docs/preference-custody-laboratory-floor-v12.md'
      - '.github/workflows/preference-custody-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-14 and the compositional v12 floor
        run: |
          node tools/compile-preference-provenance-recovery.mjs
          node tools/compile-preference-custody-manifest-v12.mjs
      - name: Validate provenance-recovery and floor boundaries
        run: |
          node tools/validate-preference-provenance-recovery.mjs
          node tools/validate-preference-custody-manifest-v12.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-provenance-recovery.test.js
          node test/preference-custody-manifest-v12.test.js
      - name: Preserve deterministic v12 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v12
          path: |
            build/research/preference-provenance-recovery.json
            build/research/preference-provenance-recovery.md
            build/research/preference-custody-laboratory-floor-v12.json
            build/research/preference-custody-laboratory-floor-v12.md
          if-no-files-found: error
