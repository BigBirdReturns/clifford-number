name: Performative synthetic constituency fixture

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/compile-performative-synthetic-constituency.mjs'
      - 'tools/validate-performative-synthetic-constituency.mjs'
      - 'test/performative-synthetic-constituency.test.js'
      - 'docs/performative-synthetic-constituency.md'
      - '.github/workflows/performative-synthetic-constituency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile deterministic exposure-confounding projection
        run: node tools/compile-performative-synthetic-constituency.mjs
      - name: Validate interpretation and authority boundaries
        run: node tools/validate-performative-synthetic-constituency.mjs
      - name: Exercise positive and refusal fixtures
        run: node test/performative-synthetic-constituency.test.js
      - name: Preserve deterministic fixture projection
        uses: actions/upload-artifact@v4
        with:
          name: performative-synthetic-constituency-fixture
          path: |
            build/research/performative-synthetic-constituency-fixture.json
            build/research/performative-synthetic-constituency-fixture.md
          if-no-files-found: error
