name: One-shot crawl gap normalization

on:
  push:
    branches:
      - fix/normalize-current-crawl-gap

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/normalize-current-crawl-gap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize the published gap state to the committed crawl
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('data/crawl/state.json').read_text())
          assert state['sources']['federal-register']['status'] == 'ok'
          assert state['sources']['sam-opportunities']['status'] == 'skipped_missing_credential'

          path = Path('data/research/clifford-cross-corpus-public-interest-map.json')
          data = json.loads(path.read_text())
          lane = next(item for item in data['lanes'] if item['lane_id'] == 'official-research-fanout')
          lane['counts']['crawl_source_gaps'] = 1
          lane['crawl_source_gap_states'] = [{
              'source_id': 'sam-opportunities',
              'status': 'skipped_missing_credential',
              'interpretation': 'Acquisition did not run; this is not a zero result.'
          }]
          old = ('The current committed crawl exposes two source gaps: SAM.gov did not execute without its credential, '
                 'and the Federal Register scan completed only partially after four upstream 503 responses. '
                 'Neither state supports a zero-result interpretation.')
          new = ('The current committed crawl exposes one source gap: SAM.gov did not execute because its credential is unavailable. '
                 'This state is an acquisition gap, not a zero result or evidence of absence. '
                 'The Federal Register source returned to ok in the committed 2026-07-21 intake; '
                 'the earlier partial run remains preserved in repository history.')
          assert old in lane['what_the_data_shows']
          lane['what_the_data_shows'] = lane['what_the_data_shows'].replace(old, new)
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          npm run fanout
          npm run validate:cross-corpus-map
      - name: Commit the normalized baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/research/clifford-cross-corpus-public-interest-map.json
          git commit -m "Document current official-source gap state"
          git push origin HEAD:fix/normalize-current-crawl-gap
