name: Temporary Wave 37 finalization v3

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave37-finalize-v3.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave37-finalize-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave37-finalize-v3.yml'
          encoded_ref='agent%2Flake-allocator-war-residual-obligations-wave-37'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 37 workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-residual-obligations-wave-37
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize, qualify, audit self-reference, and publish Wave 37
        shell: bash
        env:
          BRANCH: agent/lake-allocator-war-residual-obligations-wave-37
          BASE_COMMIT: 2b286dd377373cd3a213bcb042c831a402e177f8
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          test "$(git merge-base "$BASE_COMMIT" "$before")" = "$BASE_COMMIT"
          test ! -e .github/workflows/temporary-wave37-finalize-v3.yml

          tree_hash() {
            git add -A
            git write-tree
          }

          lake_pass() {
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/stabilize-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-semantics.mjs
            node tools/stabilize-lake-receipt-custody-wave-20.mjs
            node tools/stabilize-lake-allocator-war-wave-21.mjs
            node tools/build-lake-gap-summary.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-receipt-semantics.mjs
            node tools/validate-lake-gap-summary.mjs
            node tools/reconcile-lake-identifier-topology-wave-18.mjs
            node tools/reconcile-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-custody-wave-20.mjs
            node tools/reconcile-lake-allocator-war-wave-21.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
          }

          shard_and_validate() {
            node tools/shard-lake-index.mjs
            node tools/validate-lake-index-shards.mjs
            node tools/build-lake-basin-index.mjs
            node tools/validate-lake-basin-index.mjs
          }

          focused_validate() {
            node tools/validate-lake-residual-frontier-wave-17.mjs
            node tools/validate-lake-identifier-topology-wave-18.mjs
            node test/lake-identifier-topology-wave-18.test.js
            node tools/validate-lake-generator-contracts-wave-19.mjs
            node tools/validate-lake-receipt-custody-wave-20.mjs
            node tools/validate-lake-allocator-war-wave-21.mjs
            node tools/validate-lake-allocator-war-bounded-source-snapshots-wave-32.mjs
            node tools/validate-lake-allocator-war-structural-parses-wave-33.mjs
            node tools/validate-lake-allocator-war-schema-joins-wave-34.mjs
            node tools/validate-lake-allocator-war-join-requirements-wave-35.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
            npm run validate:lake-allocator-war-residual-obligations-wave-37
          }

          stabilize_epoch() {
            node --check tools/build-lake-allocator-war-residual-obligations-wave-37.mjs
            node --check tools/validate-lake-allocator-war-residual-obligations-wave-37.mjs
            node --check tools/install-lake-allocator-war-residual-obligations-wave-37.mjs
            node --check test/lake-allocator-war-residual-obligations-wave-37.test.js

            node tools/install-lake-allocator-war-residual-obligations-wave-37.mjs
            install1="$(tree_hash)"
            node tools/install-lake-allocator-war-residual-obligations-wave-37.mjs
            install2="$(tree_hash)"
            test "$install1" = "$install2"
            echo "Wave 37 installer fixed point: $install2"

            node tools/build-lake-allocator-war-residual-obligations-wave-37.mjs
            node test/lake-allocator-war-residual-obligations-wave-37.test.js
            build1="$(tree_hash)"
            node tools/build-lake-allocator-war-residual-obligations-wave-37.mjs
            node test/lake-allocator-war-residual-obligations-wave-37.test.js
            build2="$(tree_hash)"
            test "$build1" = "$build2"
            echo "Wave 37 builder fixed point: $build2"

            lake_pass
            pass1="$(tree_hash)"
            lake_pass
            pass2="$(tree_hash)"
            lake_pass
            pass3="$(tree_hash)"
            test "$pass2" = "$pass3"
            echo "Wave 37 lake fixed point: $pass3"

            shard_and_validate
            focused_validate
            npm run release:check

            lake_pass
            post1="$(tree_hash)"
            lake_pass
            post2="$(tree_hash)"
            test "$post1" = "$post2"
            shard_and_validate
            focused_validate
            git diff --check
          }

          stabilize_epoch
          qualified_tree="$(tree_hash)"
          git diff --cached --check

          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Materialize allocator-war residual obligations Wave 37'

          product_commit="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$product_tree" = "$qualified_tree"
          test ! -e .github/workflows/temporary-wave37-finalize-v3.yml
          test -z "$(git status --porcelain)"

          git reset --hard HEAD
          git clean -fd
          stabilize_epoch
          git add -A
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" != "$product_tree"

          cat > /tmp/wave37-expected-self-reference-paths.txt <<'PATHS'
          build/axm-identity.json
          build/build-hop-report.json
          build/canonical-subject-projection-wave-13.json
          build/hop-graph.json
          build/lake-actions/canonical-subject-projection-wave-13.json
          build/lake-actions/subject-integration-wave-16.json
          build/lake-index/basin-manifest.json
          build/lake-index/basin-membership.jsonl
          build/lake-index/basins.json
          build/lake-index/files.jsonl
          build/lake-index/gap-summary.json
          build/lake-index/manifest.json
          build/lake-index/objects.jsonl
          build/lake-index/summary.json
          build/migration-review.md
          build/migration-summary.json
          build/receipt-graph.json
          build/scores.json
          build/scout-report.json
          build/scout-report.md
          build/subject-integration-wave-16.json
          build/surface-graph.json
          reports/lake-canonical-subject-projection-wave-13.md
          reports/lake-index-census.md
          reports/lake-index-gap-summary.md
          reports/lake-subject-integration-wave-16.md
          PATHS
          git diff --cached --name-only | sort > /tmp/wave37-actual-self-reference-paths.txt
          sort -o /tmp/wave37-expected-self-reference-paths.txt /tmp/wave37-expected-self-reference-paths.txt
          diff -u /tmp/wave37-expected-self-reference-paths.txt /tmp/wave37-actual-self-reference-paths.txt
          echo "Wave 37 post-commit self-reference closure: 26 expected generated paths"

          git reset --hard HEAD
          git clean -fd
          test "$(git rev-parse HEAD)" = "$product_commit"
          test "$(git rev-parse 'HEAD^{tree}')" = "$product_tree"
          test -z "$(git status --porcelain)"

          git push \
            --force-with-lease="refs/heads/${BRANCH}:${before}" \
            origin \
            "HEAD:refs/heads/${BRANCH}"
          echo "Wave 37 source head: $before"
          echo "Wave 37 product commit: $product_commit"
          echo "Wave 37 product tree: $product_tree"
          echo "Wave 37 post-commit candidate tree: $candidate_tree"

      - name: Preserve Wave 37 failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo 'HEAD:'
            git rev-parse HEAD || true
            echo 'STATUS:'
            git status --short || true
            echo 'DIFF STAT:'
            git diff --stat || true
            echo 'CACHED DIFF STAT:'
            git diff --cached --stat || true
            echo 'CACHED NAMES:'
            git diff --cached --name-status || true
            echo 'EXPECTED SELF-REFERENCE PATHS:'
            cat /tmp/wave37-expected-self-reference-paths.txt 2>/dev/null || true
            echo 'ACTUAL SELF-REFERENCE PATHS:'
            cat /tmp/wave37-actual-self-reference-paths.txt 2>/dev/null || true
          } > /tmp/wave37-finalize-v3-diagnostics.txt
          cat /tmp/wave37-finalize-v3-diagnostics.txt

      - name: Upload Wave 37 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wave37-finalize-v3-diagnostics
          path: /tmp/wave37-finalize-v3-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
