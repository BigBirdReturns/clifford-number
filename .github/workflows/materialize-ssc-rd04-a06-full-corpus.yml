name: TEMP materialize SSC RD-04 A06 full decision corpus

on:
  push:
    branches:
      - agent/ssc-rd04-a06-full-decision-corpus
    paths:
      - '.github/workflows/materialize-ssc-rd04-a06-full-corpus.yml'
      - '.github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ssc-rd04-a06-full-corpus-materializer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a06-full-decision-corpus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize exact A06 source and install validated product-push recovery
        env:
          SOURCE_B64_SHA256: 01d31daa01fc288956b08b5f6058eb26a0bc6df57014a6563171d1ddcf35889b
          SOURCE_TGZ_SHA256: 9a9e6fb15016146fecbe6752642273371c8bfaa291076862c6dcbff0b1109a40
          OVERLAY_B64_SHA256: a913180696539c102874ae32caf6c01246f92499ca5b796040e88a0847db61cd
          OVERLAY_TGZ_SHA256: 92fde70c19421bf0b26b181add058c1410091968fb87dc3e237cee79e2fb1430
          RECOVERY_SCRIPT_SHA256: f41454aed6204ee91b5aaf651233ea18ae2dd29b260e57c6d38da1f0dc937464
          PRODUCT_PUSH_SCRIPT_SHA256: beac0216ea7c3d3a7c2b004616397c03183e40ea81c864b508eb069c2a061da8
          MILESTONE_SHA256: 1a3ccd6fa3a689fada8236efadfc975e6e96d0e5a11e2c9451bf9ab5f3b10bc0
        run: |
          set -Eeuo pipefail
          cat \
            .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part00 \
            .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part01 \
            .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part02 \
            .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part03 \
            > "${RUNNER_TEMP}/ssc-rd04-a06-full-source.tgz.b64"
          printf '%s  %s\n' "$SOURCE_B64_SHA256" "${RUNNER_TEMP}/ssc-rd04-a06-full-source.tgz.b64" | sha256sum --check --strict
          base64 --decode "${RUNNER_TEMP}/ssc-rd04-a06-full-source.tgz.b64" > "${RUNNER_TEMP}/ssc-rd04-a06-full-source.tgz"
          printf '%s  %s\n' "$SOURCE_TGZ_SHA256" "${RUNNER_TEMP}/ssc-rd04-a06-full-source.tgz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/ssc-rd04-a06-full-source.tgz" -C .

          cat \
            .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part00 \
            .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part01 \
            .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part02 \
            .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part03 \
            > "${RUNNER_TEMP}/a06-recovery-overlay.tgz.b64"
          printf '%s  %s\n' "$OVERLAY_B64_SHA256" "${RUNNER_TEMP}/a06-recovery-overlay.tgz.b64" | sha256sum --check --strict
          base64 --decode "${RUNNER_TEMP}/a06-recovery-overlay.tgz.b64" > "${RUNNER_TEMP}/a06-recovery-overlay.tgz"
          printf '%s  %s\n' "$OVERLAY_TGZ_SHA256" "${RUNNER_TEMP}/a06-recovery-overlay.tgz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/a06-recovery-overlay.tgz" -C .

          printf '%s  %s\n' "$RECOVERY_SCRIPT_SHA256" tools/materialize-ssc-rd04-a06-full-corpus.sh | sha256sum --check --strict
          printf '%s  %s\n' "$MILESTONE_SHA256" docs/milestones/ssc-rd04-a06-full-corpus.md | sha256sum --check --strict

          python - <<'PY'
          from pathlib import Path

          path = Path('tools/materialize-ssc-rd04-a06-full-corpus.sh')
          text = path.read_text()

          old_cleanup = '''rm -f .github/workflows/materialize-ssc-rd04-a06-full-corpus.yml
          rm -f tools/materialize-ssc-rd04-a06-full-corpus.sh
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part00
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part01
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part02
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part03
          rm -f .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part00
          rm -f .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part01
          rm -f .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part02
          rm -f .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part03
          '''
          new_cleanup = '''rm -f tools/materialize-ssc-rd04-a06-full-corpus.sh
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part00
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part01
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part02
          rm -f .github/tmp/ssc-rd04-a06-full-source.tgz.b64.part03
          '''
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'expected one recovery cleanup block, observed {text.count(old_cleanup)}')
          text = text.replace(old_cleanup, new_cleanup)

          old_push = '''git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$source_head"
          test "$(git rev-parse origin/main)" = "$live_main"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$source_head" origin "HEAD:refs/heads/$TARGET_BRANCH"
          '''
          new_push = '''git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$source_head"
          test "$(git rev-parse origin/main)" = "$live_main"

          # The generated read-only workflow was present for every validator above. The
          # Actions token cannot publish workflow-file changes, so remove only that exact
          # path after validation and amend the already-validated product commit. The
          # connector restores the same checksum-bound bytes in the final cleanup commit.
          git rm .github/workflows/status-sovereignty-rd04-a06-full-corpus.yml
          git commit --amend --no-edit
          product_head="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1)"
          test "$(git rev-parse "$source_head:.github/workflows/materialize-ssc-rd04-a06-full-corpus.yml")" = "$(git rev-parse "HEAD:.github/workflows/materialize-ssc-rd04-a06-full-corpus.yml")"
          if git cat-file -e "HEAD:.github/workflows/status-sovereignty-rd04-a06-full-corpus.yml" 2>/dev/null; then
            echo 'generated permanent workflow remained in the Actions-token product commit'
            exit 1
          fi

          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$source_head" origin "HEAD:refs/heads/$TARGET_BRANCH"
          '''
          if text.count(old_push) != 1:
              raise SystemExit(f'expected one recovery push block, observed {text.count(old_push)}')
          path.write_text(text.replace(old_push, new_push))
          PY

          printf '%s  %s\n' "$PRODUCT_PUSH_SCRIPT_SHA256" tools/materialize-ssc-rd04-a06-full-corpus.sh | sha256sum --check --strict
          node --check tools/ssc-rd04-a06-full-corpus.mjs
          bash -n tools/materialize-ssc-rd04-a06-full-corpus.sh
          ! grep -nE '[[:blank:]]+$' docs/milestones/ssc-rd04-a06-full-corpus.md
          grep -Fq 'release_assets_page3=' tools/materialize-ssc-rd04-a06-full-corpus.sh
          grep -Fq 'Reusing the exact completed 64-shard draft release; no source document is refetched' tools/materialize-ssc-rd04-a06-full-corpus.sh
          grep -Fq 'git rm .github/workflows/status-sovereignty-rd04-a06-full-corpus.yml' tools/materialize-ssc-rd04-a06-full-corpus.sh
          grep -Fq 'git rev-parse "$source_head:.github/workflows/materialize-ssc-rd04-a06-full-corpus.yml"' tools/materialize-ssc-rd04-a06-full-corpus.sh
          grep -Fq 'generated permanent workflow remained in the Actions-token product commit' tools/materialize-ssc-rd04-a06-full-corpus.sh
          ! grep -Fq 'git diff --name-only "$source_head" HEAD -- .github/workflows' tools/materialize-ssc-rd04-a06-full-corpus.sh
          ! grep -Fq 'rm -f .github/workflows/materialize-ssc-rd04-a06-full-corpus.yml' tools/materialize-ssc-rd04-a06-full-corpus.sh
          ! grep -Fq 'rm -f .github/tmp/ssc-rd04-a06-recovery-overlay.tgz.b64.part03' tools/materialize-ssc-rd04-a06-full-corpus.sh
          grep -Fq 'rm -f tools/materialize-ssc-rd04-a06-full-corpus.sh' tools/materialize-ssc-rd04-a06-full-corpus.sh
          ! grep -Fq '/releases/tags/' tools/materialize-ssc-rd04-a06-full-corpus.sh
      - name: Install bounded PDF and archive tools when absent
        run: |
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1 || ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils zstd
          fi
      - name: Execute validated completed-release product transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/materialize-ssc-rd04-a06-full-corpus.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-a06-full-corpus-receipt
          path: ssc-rd04-a06-full-corpus-receipt.txt
          if-no-files-found: error
          retention-days: 90
