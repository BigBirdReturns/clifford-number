name: TEMP diagnose Wave-03 intake carrier bytes

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ssc-rd-wave03-intake-carrier-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.pull_request.base.ref == 'agent/ssc-rd-wave03-five-lane-intake-materializer-base-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd-wave03-five-lane-intake-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted carrier base
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave03-five-lane-intake-materializer-base-v1
          fetch-depth: 1
          persist-credentials: false
      - name: Decode and inventory carrier without publication
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd-wave03-intake-carrier-diagnostic"
          rm -rf "$OUT"
          mkdir -p "$OUT/product"
          python - "$OUT" <<'PY'
          import base64
          import hashlib
          import io
          import json
          import lzma
          import os
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          out = Path(sys.argv[1])
          root = Path('.transport/ssc-rd-wave03-five-lane-intake-v1')
          expected = {
              'base64_sha256': '120e98824f5f4617fc912ebf2129a314185dcd6dd65e43463a790eb936585809',
              'archive_sha256': 'dacdfd9c3fb75dd1011908109868c169782569f3413dd1cb8b9d22f7f9157990',
              'path_list_sha256': '8c64907fbd431557b91257f606c9224c06321b3eb33370f342397f897b5418e4',
              'path_count': 37,
          }
          report = {
              'schema_version': 'ssc-rd-wave03-intake-carrier-diagnostic@1',
              'publication_effect': 'none',
              'branch_effect': 'none',
              'expected': expected,
              'shards': [],
          }

          combined_parts = []
          for index in range(8):
              name = f'part-{index:02d}.b64'
              path = root / name
              raw = path.read_bytes()
              normalized = b''.join(raw.split())
              row = {
                  'name': name,
                  'raw_bytes': len(raw),
                  'normalized_bytes': len(normalized),
                  'normalized_sha256': hashlib.sha256(normalized).hexdigest(),
              }
              report['shards'].append(row)
              combined_parts.append(normalized)

          combined = b''.join(combined_parts)
          (out / 'product.b64').write_bytes(combined)
          report['combined_base64_bytes'] = len(combined)
          report['combined_base64_sha256'] = hashlib.sha256(combined).hexdigest()
          report['base64_matches_expected'] = report['combined_base64_sha256'] == expected['base64_sha256']

          try:
              archive = base64.b64decode(combined, validate=True)
              report['base64_decode_ok'] = True
          except Exception as exc:
              report['base64_decode_ok'] = False
              report['base64_decode_error'] = f'{type(exc).__name__}: {exc}'
              archive = b''

          if archive:
              (out / 'product.tar.xz').write_bytes(archive)
              report['archive_bytes'] = len(archive)
              report['archive_sha256'] = hashlib.sha256(archive).hexdigest()
              report['archive_matches_expected'] = report['archive_sha256'] == expected['archive_sha256']

          members = []
          regular_files = []
          if archive:
              try:
                  decompressed = lzma.decompress(archive)
                  report['xz_decode_ok'] = True
                  report['tar_bytes'] = len(decompressed)
                  with tarfile.open(fileobj=io.BytesIO(decompressed), mode='r:') as tf:
                      for member in tf.getmembers():
                          posix = PurePosixPath(member.name)
                          if posix.is_absolute() or '..' in posix.parts:
                              raise ValueError(f'unsafe archive path: {member.name}')
                          if member.isdir():
                              continue
                          if not member.isfile():
                              raise ValueError(f'non-regular archive member: {member.name}')
                          data = tf.extractfile(member).read()
                          target = out / 'product' / Path(*posix.parts)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(data)
                          members.append(member.name)
                          regular_files.append({
                              'path': member.name,
                              'bytes': len(data),
                              'sha256': hashlib.sha256(data).hexdigest(),
                          })
              except Exception as exc:
                  report['xz_decode_ok'] = False
                  report['archive_decode_error'] = f'{type(exc).__name__}: {exc}'

          members = sorted(members)
          regular_files = sorted(regular_files, key=lambda row: row['path'])
          path_list = ''.join(f'{path}\n' for path in members).encode()
          (out / 'paths.txt').write_bytes(path_list)
          (out / 'file-manifest.json').write_text(json.dumps(regular_files, indent=2) + '\n')
          report['path_count'] = len(members)
          report['path_list_sha256'] = hashlib.sha256(path_list).hexdigest()
          report['path_count_matches_expected'] = len(members) == expected['path_count']
          report['path_list_matches_expected'] = report['path_list_sha256'] == expected['path_list_sha256']
          report['extracted_files'] = regular_files
          report['diagnostic_complete'] = True
          report['carrier_exactly_matches_declared_package'] = all([
              report.get('base64_matches_expected') is True,
              report.get('archive_matches_expected') is True,
              report.get('path_count_matches_expected') is True,
              report.get('path_list_matches_expected') is True,
          ])
          (out / 'diagnostic.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({
              'combined_base64_sha256': report.get('combined_base64_sha256'),
              'base64_decode_ok': report.get('base64_decode_ok'),
              'archive_sha256': report.get('archive_sha256'),
              'xz_decode_ok': report.get('xz_decode_ok'),
              'path_count': report.get('path_count'),
              'path_list_sha256': report.get('path_list_sha256'),
              'carrier_exactly_matches_declared_package': report.get('carrier_exactly_matches_declared_package'),
          }, indent=2))
          PY
      - name: Upload byte diagnostic and any safely extracted package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave03-intake-carrier-diagnostic-v1
          path: ${{ runner.temp }}/ssc-rd-wave03-intake-carrier-diagnostic
          if-no-files-found: error
          retention-days: 90
