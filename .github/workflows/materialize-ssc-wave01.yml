name: Materialize SSC Wave 01 transition

on:
  push:
    branches: [agent/status-sovereignty-wave01-loader]
    paths:
      - '.github/tmp/ssc-wave01/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-ssc-wave01
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/status-sovereignty-wave01-loader
          fetch-depth: 0
      - name: Verify carrier and publish non-workflow transition
        shell: bash
        run: |
          set -euo pipefail
          base='0d701692fa83a405bd0ba86e7b45c525022589f7'
          target='agent/status-sovereignty-wave-01'
          expected_archive='db2aefe157bcdc8af8cd89c107deb521a985e437833c8bf1ab67181aecc902bc'

          mapfile -t chunks < <(find .github/tmp/ssc-wave01 -maxdepth 1 -type f -name 'part-*.b64' | sort)
          test "${#chunks[@]}" -eq 4
          cat "${chunks[@]}" | base64 --decode > /tmp/ssc-wave01-transition.tar.gz
          printf '%s  %s\n' "$expected_archive" /tmp/ssc-wave01-transition.tar.gz | sha256sum -c -

          rm -rf /tmp/ssc-wave01-payload /tmp/ssc-wave01-work
          mkdir -p /tmp/ssc-wave01-payload
          tar -xzf /tmp/ssc-wave01-transition.tar.gz -C /tmp/ssc-wave01-payload
          test "$(cat /tmp/ssc-wave01-payload/TRANSITION_BASE.txt)" = "$base"
          test "$(wc -l < /tmp/ssc-wave01-payload/TRANSITION_PATHS.txt)" -eq 42

          git fetch origin main "$target"
          test "$(git rev-parse origin/main)" = "$base"
          old_head="$(git rev-parse "origin/$target")"
          test "$old_head" = "$base"
          git worktree add --detach /tmp/ssc-wave01-work "$base"
          cd /tmp/ssc-wave01-work

          while IFS= read -r rel; do
            case "$rel" in
              .github/workflows/project-stable-ground-sg05.yml|\
              .github/workflows/project-stable-ground-sg06.yml|\
              .github/workflows/status-sovereignty-compact.yml|\
              .github/workflows/status-sovereignty-wave-01.yml)
                continue
                ;;
            esac
            mkdir -p "$(dirname "$rel")"
            cp "/tmp/ssc-wave01-payload/$rel" "$rel"
          done < /tmp/ssc-wave01-payload/TRANSITION_PATHS.txt

          grep -vE '^\.github/workflows/(project-stable-ground-sg05|project-stable-ground-sg06|status-sovereignty-compact|status-sovereignty-wave-01)\.yml$' \
            /tmp/ssc-wave01-payload/TRANSITION_PATHS.txt | sort > /tmp/expected-nonworkflow-paths
          git diff --name-only | sort > /tmp/observed-nonworkflow-paths
          diff -u /tmp/expected-nonworkflow-paths /tmp/observed-nonworkflow-paths
          test "$(wc -l < /tmp/observed-nonworkflow-paths)" -eq 38
          git diff --check

          git add -A
          git diff --cached --name-only | sort > /tmp/staged-nonworkflow-paths
          diff -u /tmp/expected-nonworkflow-paths /tmp/staged-nonworkflow-paths
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Execute SSC-H01 Wave 01 and append SG-06'
          transition_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base"
          git push --force-with-lease="refs/heads/$target:$old_head" origin "HEAD:refs/heads/$target"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/ssc-wave01-materialization.json').write_text(json.dumps({
              'base': '0d701692fa83a405bd0ba86e7b45c525022589f7',
              'transition_head': os.popen('git rev-parse HEAD').read().strip(),
              'published_paths': 38,
              'remaining_workflow_paths': 4,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-wave01-materialization-${{ github.run_id }}
          path: /tmp/ssc-wave01-materialization.json
          retention-days: 2
