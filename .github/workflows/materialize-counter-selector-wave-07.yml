name: Materialize Counter-Selector Wave 07 Batch 02

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-07.yml'
      - '.github/materializers/counter-selector-wave-07/**'
  push:
    branches:
      - 'agent/counter-selector-wave-07-b02-acquisition'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-07.yml'
      - '.github/materializers/counter-selector-wave-07/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-07-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-07-b02-acquisition

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 07 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-07/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-07.tar.gz
          echo 'd35a6a074015c6fee9cad8657664f4e69a0de0ee42eab25ea813aabf91647555  /tmp/counter-selector-wave-07.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-07.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-07

      - name: Build, validate, and attack Batch 02 acquisition
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-07.mjs
          node tools/validate-counter-selector-wave-07.mjs
          node test/counter-selector-wave-07.test.js

      - name: Commit exact non-workflow Wave 07 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-07/payload-00 \
            .github/materializers/counter-selector-wave-07/payload-01 \
            .github/materializers/counter-selector-wave-07/payload-02 \
            .github/materializers/counter-selector-wave-07/payload-03 \
            .github/materializers/counter-selector-wave-07/payload-04 \
            .github/materializers/counter-selector-wave-07/payload-05 \
            .github/materializers/counter-selector-wave-07/payload-06 \
            .github/materializers/counter-selector-wave-07/payload-07 \
            data/project/counter-selector-artifact-acquisition-b02-registry.json \
            data/project/counter-selector-blind-packet-registry-b02.json \
            data/project/counter-selector-wave-07-batch-02.json \
            data/project/counter-selector-wave-07-release-manifest.json \
            data/project/counter-selector-wave-07-source-registry.json \
            docs/methods/counter-selector-batch02-acquisition.md \
            docs/milestones/counter-selector-wave-07.md \
            reports/core-thesis/counter-selector-wave-07/data.json \
            reports/core-thesis/counter-selector-wave-07/index.html \
            schemas/counter-selector-batch02-acquisition.schema.json \
            test/counter-selector-wave-07.test.js \
            tools/build-counter-selector-wave-07.mjs \
            tools/validate-counter-selector-wave-07.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Acquire Counter-Selector Wave 07 Batch 02 artifacts'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 07 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-07.mjs
          node tools/validate-counter-selector-wave-07.mjs
          node test/counter-selector-wave-07.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish non-workflow Wave 07 head
        run: git push origin HEAD:agent/counter-selector-wave-07-b02-acquisition
