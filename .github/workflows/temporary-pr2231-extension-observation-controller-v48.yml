name: Temporary PR 2231 extension observation controller v48
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-extension-observation-controller-v48.yml'
permissions:
  contents: write
  issues: read
  pull-requests: read
concurrency:
  group: pr2231-extension-observation-controller-v48
  cancel-in-progress: false
jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-extension-observation-controller-v48
      CPATH: .github/workflows/temporary-pr2231-extension-observation-controller-v48.yml
      CPARENT: 2e6cacab7aee4a245466768ff8a18a948ad25ba9
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: ecb875258f10b932c0dff4cb116e6eefe6a451f2
      PLIB: 9fcec61d586616b9ba8ec9063f26c99f93c348aa
      PTEST: e4dee4517078c4b74e2c654fb46f8c48c5443016
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify and publish exact successor
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-v48-source
          Q=/tmp/pr2231-v48-main
          R=/tmp/pr2231-v48-receipt.txt
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s actual=%s expected=%s\n' "$label" "$actual" "$expected" | tee -a "$R"
            [ "$actual" = "$expected" ] || fail "$label" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-branch '${{ github.head_ref }}' "$CBRANCH"
          require_eq controller-paths "$(git diff --name-only "$CPARENT..HEAD")" "$CPATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-remote "$(git rev-parse "refs/remotes/origin/$CBRANCH")" "$H"
          require_eq product-head "$(git rev-parse "refs/remotes/origin/$PBRANCH")" "$PHEAD"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          MAIN="$(git rev-parse refs/remotes/origin/main)"
          printf 'main=%s\n' "$MAIN" | tee -a "$R"
          require_eq main-lib "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" "$BTEST"

          stage exact-head-defect-reproduction
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as r } from './tools/lib/industrial-exhaust.mjs';
          const chain = 'GUID '.repeat(4000);
          const input = `Phone ${chain}record id: 09012345678 2026-08-17(3.14) 03-6216-8041 ext 55`;
          const expected = `Phone ${chain}record id: [contact omitted] 2026-08-17(3.14) [contact omitted] ext [contact omitted]`;
          const actual = r(input);
          console.log(JSON.stringify({
            inputLength: input.length,
            actualTail: actual.slice(-160),
            expectedTail: expected.slice(-160)
          }));
          assert.notEqual(actual, expected);
          assert.match(
            actual,
            /record id: \[contact omitted\] 2026-08-\[contact omitted\]-\[contact omitted\] ext \[contact omitted\]$/u,
            'exact head must reproduce the extension-bearing observation P2 before repair'
          );
          NODE

          stage exact-two-file-repair
          python3 <<'PY'
          from pathlib import Path

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          test_path = Path('test/industrial-exhaust.test.js')
          library = library_path.read_text()
          tests = test_path.read_text()

          old_constant = r"""const PHONE_EXTENSION_SUFFIX_PATTERN = /^\s*[,;:()（）.．。\-–—]*(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?|内線(?:番号)?\s*[:：#＃]?|[#＃])\s*(?:[（(]\s*)?[0-9０-９]/iu;
          """
          old_shortcut = r"""      if (PHONE_EXTENSION_SUFFIX_PATTERN.test(normalizedSuffix)) return groups.length;
          """

          if library.count(old_constant) != 1:
              raise SystemExit(f'extension constant removal count={library.count(old_constant)}')
          if library.count(old_shortcut) != 1:
              raise SystemExit(f'extension shortcut removal count={library.count(old_shortcut)}')
          library = library.replace(old_constant, '')
          library = library.replace(old_shortcut, '')

          anchor = r"""const attachedParenthesizedPhone = `Phone ${overflowIdentifierLabelChain}record id: 09012345678 2026-08-17(03) 6216 8041`;
          """

          replacement = r"""for (const [observations, laterPhone, extension, expectedExtension] of [
            ['2026-08-17(3.14)', '03-6216-8041', ' ext 55', ' ext [contact omitted]'],
            ['2026-08-17(12:30)', '+81 3 6216 5111', ' #1234', ' #[contact omitted]'],
            ['3.14((2027-09-18))', '(03) 6216 8041', '内線1234', '内線[contact omitted]'],
            ['２０２６－０８－１７（３．１４）', '０３－６２１６－８０４１', '内線１２３４', '内線[contact omitted]']
          ]) {
            const input = `Phone ${overflowIdentifierLabelChain}record id: 09012345678 ${observations} ${laterPhone}${extension}`;
            assert.equal(
              redactContactData(input),
              `Phone ${overflowIdentifierLabelChain}record id: [contact omitted] ${observations} [contact omitted]${expectedExtension}`,
              'extension authority must apply only after complete observation custody and later-phone validation'
            );
          }

          const extensionYearEndingPhone = `Phone ${overflowIdentifierLabelChain}record id: 09012345678 2026-08-17(3.14) +882 13 123 456 2026 #1234`;
          assert.equal(
            redactContactData(extensionYearEndingPhone),
            `Phone ${overflowIdentifierLabelChain}record id: [contact omitted] 2026-08-17(3.14) [contact omitted] #[contact omitted]`,
            'observation custody must not truncate a structurally valid year-ending phone before its extension'
          );

          const attachedParenthesizedPhone = `Phone ${overflowIdentifierLabelChain}record id: 09012345678 2026-08-17(03) 6216 8041`;
          """

          if tests.count(anchor) != 1:
              raise SystemExit(f'test insertion count={tests.count(anchor)}')
          tests = tests.replace(anchor, replacement)
          library_path.write_text(library)
          test_path.write_text(tests)
          PY
          git diff --check
          require_eq repair-paths "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage repaired-behavior-and-focused-suites
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as r } from './tools/lib/industrial-exhaust.mjs';
          const chain = 'GUID '.repeat(4000);
          const cases = [
            ['2026-08-17(3.14)', '03-6216-8041', ' ext 55', ' ext [contact omitted]'],
            ['2026-08-17(12:30)', '+81 3 6216 5111', ' #1234', ' #[contact omitted]'],
            ['3.14((2027-09-18))', '(03) 6216 8041', '内線1234', '内線[contact omitted]'],
            ['２０２６－０８－１７（３．１４）', '０３－６２１６－８０４１', '内線１２３４', '内線[contact omitted]']
          ];
          for (const [observations, phone, extension, expectedExtension] of cases) {
            const input = `Phone ${chain}record id: 09012345678 ${observations} ${phone}${extension}`;
            const expected = `Phone ${chain}record id: [contact omitted] ${observations} [contact omitted]${expectedExtension}`;
            const actual = r(input);
            console.log(JSON.stringify({
              observations,
              phone,
              extension,
              actualTail: actual.slice(-180)
            }));
            assert.equal(actual, expected);
          }
          assert.equal(
            r(`Phone ${chain}record id: 09012345678 2026-08-17(3.14) +882 13 123 456 2026 #1234`),
            `Phone ${chain}record id: [contact omitted] 2026-08-17(3.14) [contact omitted] #[contact omitted]`
          );
          NODE
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"

          stage live-main-transplant-and-release-qualification
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$MAIN"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq qualified-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check

          stage construct-qualified-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: preserve observations before extension-bearing phones'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq qualified-parent "$(git rev-parse HEAD^)" "$MAIN"
          require_eq qualified-count "$(git rev-list --count "$MAIN..HEAD")" '1'
          require_eq qualified-commit-paths "$(git diff --name-only "$MAIN..HEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
          git diff --numstat "$MAIN..HEAD" | LC_ALL=C sort -k3 | tee -a "$R"

          stage final-lease-revalidation-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          require_eq final-product "$(git rev-parse "refs/remotes/origin/$PBRANCH")" "$PHEAD"
          require_eq final-controller "$(git rev-parse "refs/remotes/origin/$CBRANCH")" "$H"
          require_eq final-main-lib "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq final-main-test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq final-product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq final-product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse "refs/remotes/origin/$PBRANCH")" "$AHEAD"
          require_eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          require_eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ALIB"
          require_eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ATEST"
          printf 'QUALIFICATION_SUCCESS\nbase=%s\nold_product=%s\nnew_product=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$MAIN" "$PHEAD" "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-extension-observation-v48
          path: /tmp/pr2231-v48-receipt.txt
          if-no-files-found: error
          retention-days: 90
