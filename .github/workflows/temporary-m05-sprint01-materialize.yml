name: Temporary materialize M-05 Sprint 01

on:
  push:
    branches:
      - agent/m05-sprint-01-triad-and-counterpower
    paths:
      - '.github/workflows/temporary-m05-sprint01-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-sprint01-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-01-triad-and-counterpower
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate Sprint 01
        run: |
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/build-m05-answerable-power-sprint-01.mjs
          node tools/validate-m05-answerable-power-sprint-01.mjs
          node test/m05-answerable-power-sprint-01.test.js
          npm run release:check
      - name: Commit regenerated reports and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-m05-sprint01-materialize.yml
          git add reports/core-thesis/answerable-power/sprint-01.json reports/core-thesis/answerable-power/sprint-01.html
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'no regenerated changes'; exit 1; }
          git commit -m 'Regenerate M-05 Sprint 01 with live topology'
          git push origin HEAD:refs/heads/agent/m05-sprint-01-triad-and-counterpower
