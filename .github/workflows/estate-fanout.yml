name: Estate fan-out

on:
  pull_request:
    paths:
      - 'data/estates/**'
      - 'tools/build-estates.mjs'
      - 'tools/validate-estates.mjs'
      - 'tools/build-estate-fanout.mjs'
      - 'tools/validate-estate-fanout.mjs'
      - 'tools/compile.mjs'
      - 'test/estate-fanout.test.js'
      - 'test/research-tracks.test.js'
      - 'docs/research-fanout.md'
      - '.github/workflows/estate-fanout.yml'
  push:
    branches:
      - main
    paths:
      - 'data/estates/**'
      - 'data/intake/next-ten-estates/**'
      - 'data/intake/estate-expansion-01/**'
      - 'tools/build-estates.mjs'
      - 'tools/build-estate-fanout.mjs'
      - 'tools/compile.mjs'
      - '.github/workflows/estate-fanout.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-fanout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compile current estate custody and fan-out
        run: npm run compile

      - name: Validate estate lanes and dependency law
        run: |
          node tools/validate-estates.mjs
          node tools/validate-estate-fanout.mjs
          node test/estate-fanout.test.js
          node test/research-tracks.test.js

      - id: matrix
        name: Publish estate matrix
        shell: bash
        run: |
          echo "value=$(node -e \"const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('build/estate-fanout/manifest.json','utf8'));process.stdout.write(JSON.stringify(m.matrix))\")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: estate-fanout
          path: |
            data/estates/fanout-methodology.json
            build/estates/index.json
            build/estate-fanout/
          if-no-files-found: error
          retention-days: 30

  dispatch:
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: estate-fanout
          path: .

      - name: Show bounded estate assignment
        shell: bash
        run: cat "${{ matrix.markdown_path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh durable estate lane
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: ${{ matrix.issue_title }}
          BODY_PATH: ${{ matrix.markdown_path }}
        shell: bash
        run: |
          number="$(gh issue list --repo "$GH_REPO" --state open --limit 500 --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GH_REPO" --body-file "$BODY_PATH"
          else
            gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" --body-file "$BODY_PATH"
          fi
