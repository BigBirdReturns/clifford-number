name: Temporary materialize M-05 Sprint 05 start-to-finish audit

on:
  push:
    branches:
      - agent/m05-sprint-05-start-to-finish-audit
    paths:
      - '.github/workflows/temporary-materialize-m05-s05-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-05-start-to-finish-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Expand the checksum-bounded permanent payload
        run: |
          cat .github/tmp/s05-audit-payload-part-*.b64 > /tmp/s05-audit-payload.b64
          base64 -d /tmp/s05-audit-payload.b64 > /tmp/s05-audit-payload.tgz
          tar -xzf /tmp/s05-audit-payload.tgz -C .
      - name: Run focused Sprint 05 hardening checks
        run: |
          node tools/build-m05-answerable-power-sprint-05.mjs
          node tools/validate-m05-answerable-power-sprint-05.mjs
          node test/m05-answerable-power-sprint-05.test.js
          node test/m05-adoption-conformance.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Commit only the permanent audited surface
        run: |
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/m05-answerable-power-sprint-05.yml' \
            'data/project/m05-answerable-power-sprint-05-audit.json' \
            'data/project/m05-answerable-power-sprint-05-leg-01-conformance.json' \
            'data/project/m05-answerable-power-sprint-05-leg-02-threat-model.json' \
            'data/project/m05-answerable-power-sprint-05-leg-05-candidate-landscape.json' \
            'data/project/m05-answerable-power-sprint-05-leg-07-registry.json' \
            'data/project/m05-answerable-power-sprint-05-plan.json' \
            'data/project/m05-answerable-power-sprint-05-release-manifest.json' \
            'docs/methods/answerable-power-adoption-integrity.md' \
            'docs/milestones/m05-answerable-power-sprint-05-audit.md' \
            'docs/milestones/m05-answerable-power-sprint-05.md' \
            'reports/core-thesis/answerable-power/sprint-05.html' \
            'reports/core-thesis/answerable-power/sprint-05.json' \
            'test/m05-adoption-conformance.test.js' \
            'test/m05-answerable-power-sprint-05.test.js' \
            'tools/build-m05-answerable-power-sprint-05.mjs' \
            'tools/m05-adoption-conformance.mjs' \
            'tools/validate-m05-answerable-power-sprint-05.mjs' | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected staged paths:\n%s\n\nExpected:\n%s\n' "$actual" "$expected"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden M-05 Sprint 05 after start-to-finish audit'
      - name: Prove deterministic products from the permanent commit
        run: |
          git restore --staged --worktree .
          git clean -fd
          node tools/build-m05-answerable-power-sprint-05.mjs
          node tools/validate-m05-answerable-power-sprint-05.mjs
          node test/m05-answerable-power-sprint-05.test.js
          node test/m05-adoption-conformance.test.js
          git diff --exit-code
      - name: Remove transport machinery and publish the clean branch
        run: |
          git rm -f .github/workflows/temporary-materialize-m05-s05-audit.yml .github/tmp/s05-audit-payload-part-*.b64
          git commit -m 'Remove Sprint 05 audit transport machinery'
          git push origin HEAD:agent/m05-sprint-05-start-to-finish-audit
