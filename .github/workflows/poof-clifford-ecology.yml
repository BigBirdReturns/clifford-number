name: POOF and Clifford ecology

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/poof-*'
      - 'schemas/poof-*'
      - 'test/fixtures/poof-*'
      - 'docs/poof-*'
      - 'docs/methods/poof-*'
      - 'docs/milestones/m05-poof-*'
      - 'tools/*poof*'
      - 'test/poof-*'
      - 'reports/core-thesis/poof-clifford-ecology/**'
      - 'data/project/core-thesis.json'
      - 'data/project/m05-answerable-power-methodology.json'
      - 'data/project/m05-answerable-power-story-registry.json'
      - 'data/project/m05-answerable-power-fanout.json'
      - 'tools/build-core-thesis.mjs'
      - 'tools/validate-core-thesis.mjs'
      - 'tools/validate-m05-answerable-power.mjs'
      - 'tools/validate-k0-epistemic-admissibility.mjs'
      - 'data/project/k0-epistemic-admissibility-release-manifest.json'
      - 'reports/core-thesis/answerable-power/k0.*'
      - 'test/core-thesis.test.js'
      - 'test/m05-answerable-power.test.js'
      - 'CORE-THESIS.md'
      - 'docs/README.md'
      - 'package.json'
      - '.github/workflows/poof-clifford-ecology.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/poof-*'
      - 'schemas/poof-*'
      - 'test/fixtures/poof-*'
      - 'docs/poof-*'
      - 'docs/methods/poof-*'
      - 'docs/milestones/m05-poof-*'
      - 'tools/*poof*'
      - 'test/poof-*'
      - 'reports/core-thesis/poof-clifford-ecology/**'
      - 'data/project/core-thesis.json'
      - 'data/project/m05-answerable-power-methodology.json'
      - 'data/project/m05-answerable-power-story-registry.json'
      - 'data/project/m05-answerable-power-fanout.json'
      - 'tools/build-core-thesis.mjs'
      - 'tools/validate-core-thesis.mjs'
      - 'tools/validate-m05-answerable-power.mjs'
      - 'tools/validate-k0-epistemic-admissibility.mjs'
      - 'data/project/k0-epistemic-admissibility-release-manifest.json'
      - 'reports/core-thesis/answerable-power/k0.*'
      - 'test/core-thesis.test.js'
      - 'test/m05-answerable-power.test.js'
      - 'CORE-THESIS.md'
      - 'docs/README.md'
      - 'package.json'
      - '.github/workflows/poof-clifford-ecology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate constitutional change custody
        run: |
          node tools/validate-poof-constitutional-change.mjs
          node test/poof-constitutional-change.test.js
      - name: Build and validate the ecology
        run: |
          node tools/build-core-thesis.mjs
          node tools/validate-core-thesis.mjs
          node test/core-thesis.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-poof-clifford-ecology.mjs
          node tools/validate-poof-clifford-ecology.mjs
          node test/poof-clifford-ecology.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Play-test desktop, mobile, Reader File, and Proving Ground
        run: node test/poof-clifford-ecology-browser.test.js
      - name: Prove deterministic products
        run: |
          git restore --staged --worktree .
          node tools/build-core-thesis.mjs
          node tools/build-m05-answerable-power.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/build-poof-clifford-ecology.mjs
          node tools/validate-core-thesis.mjs
          node tools/validate-m05-answerable-power.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node tools/validate-poof-clifford-ecology.mjs
          node test/k0-epistemic-admissibility.test.js
          node test/poof-clifford-ecology.test.js
          git diff --exit-code
      - name: Upload review aperture and browser receipt
        uses: actions/upload-artifact@v4
        with:
          name: poof-clifford-ecology
          path: |
            reports/core-thesis/poof-clifford-ecology/
            build/poof-clifford-ecology/browser-qa.json
          retention-days: 14
