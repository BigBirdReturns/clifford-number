name: TEMP recover Wave-03 intake shard from Git object custody

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ssc-rd-wave03-intake-shard-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.pull_request.base.ref == 'agent/ssc-rd-wave03-five-lane-intake-materializer-base-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd-wave03-five-lane-intake-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete trusted repository history
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave03-five-lane-intake-materializer-base-v1
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Fetch pull-request refs and search every reachable blob
        shell: bash
        env:
          TARGET_NORMALIZED_SHA256: b338fe9fc66a317b922f758e6471b82b59ea90410a14eb56bd88513ee16109e4
          TARGET_PATH: .transport/ssc-rd-wave03-five-lane-intake-v1/part-04.b64
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd-wave03-intake-shard-recovery"
          rm -rf "$OUT"
          mkdir -p "$OUT/matches"
          exec > >(tee "$OUT/execution.log") 2>&1

          git fetch --no-tags origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge' || true

          git for-each-ref --format='%(refname) %(objectname)' | sort > "$OUT/refs.txt"
          git log --all --full-history --date=iso-strict \
            --format='%H%x09%P%x09%ad%x09%s' -- "$TARGET_PATH" > "$OUT/path-history.tsv"
          git rev-list --objects --all > "$OUT/reachable-objects.txt"

          python - "$OUT" "$TARGET_PATH" "$TARGET_NORMALIZED_SHA256" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          target_path = sys.argv[2]
          target_digest = sys.argv[3]

          def git(*args, input_bytes=None, check=True):
              return subprocess.run(
                  ['git', *args], input=input_bytes, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, check=check
              )

          report = {
              'schema_version': 'ssc-rd-wave03-intake-shard-recovery@1',
              'target_path': target_path,
              'target_normalized_bytes': 4096,
              'target_normalized_sha256': target_digest,
              'publication_effect': 'none',
              'branch_effect': 'none',
              'path_versions': [],
              'matching_blobs': [],
          }

          history = git('log', '--all', '--full-history', '--format=%H', '--', target_path).stdout.decode().splitlines()
          seen_commits = set()
          for commit in history:
              if commit in seen_commits:
                  continue
              seen_commits.add(commit)
              proc = git('show', f'{commit}:{target_path}', check=False)
              if proc.returncode != 0:
                  continue
              raw = proc.stdout
              normalized = b''.join(raw.split())
              row = {
                  'commit': commit,
                  'raw_bytes': len(raw),
                  'normalized_bytes': len(normalized),
                  'raw_sha256': hashlib.sha256(raw).hexdigest(),
                  'normalized_sha256': hashlib.sha256(normalized).hexdigest(),
              }
              report['path_versions'].append(row)

          inventory = git(
              'cat-file', '--batch-all-objects',
              '--batch-check=%(objectname) %(objecttype) %(objectsize)'
          ).stdout.decode().splitlines()
          candidates = []
          for line in inventory:
              oid, kind, size_text = line.split()
              size = int(size_text)
              if kind == 'blob' and 3800 <= size <= 5200:
                  candidates.append((oid, size))
          report['candidate_blobs_scanned'] = len(candidates)

          for oid, size in candidates:
              raw = git('cat-file', 'blob', oid).stdout
              normalized = b''.join(raw.split())
              if len(normalized) != 4096:
                  continue
              digest = hashlib.sha256(normalized).hexdigest()
              if digest != target_digest:
                  continue
              match_path = out / 'matches' / f'{oid}.b64'
              match_path.write_bytes(raw)
              refs = git(
                  'log', '--all', '--find-object=' + oid,
                  '--date=iso-strict', '--format=%H%x09%P%x09%ad%x09%s',
                  check=False
              ).stdout.decode().splitlines()
              names = git('rev-list', '--objects', '--all').stdout.decode().splitlines()
              paths = sorted({
                  line.split(' ', 1)[1] for line in names
                  if line.startswith(oid + ' ') and ' ' in line
              })
              report['matching_blobs'].append({
                  'blob_oid': oid,
                  'raw_bytes': len(raw),
                  'raw_sha256': hashlib.sha256(raw).hexdigest(),
                  'normalized_sha256': digest,
                  'reachable_paths': paths,
                  'introducing_or_removing_commits': refs,
                  'saved_path': str(match_path.relative_to(out)),
              })

          report['path_versions'] = sorted(report['path_versions'], key=lambda row: row['commit'])
          report['path_version_count'] = len(report['path_versions'])
          report['matching_blob_count'] = len(report['matching_blobs'])
          report['recovery_complete'] = len(report['matching_blobs']) > 0
          (out / 'recovery.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({
              'path_version_count': report['path_version_count'],
              'candidate_blobs_scanned': report['candidate_blobs_scanned'],
              'matching_blob_count': report['matching_blob_count'],
              'recovery_complete': report['recovery_complete'],
          }, indent=2))
          PY
      - name: Upload exact recovery census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave03-intake-shard-recovery-v1
          path: ${{ runner.temp }}/ssc-rd-wave03-intake-shard-recovery
          if-no-files-found: error
          retention-days: 90
