name: TEMP materialize RD-04 state-source adjudication

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd04-state-source-adjudication-materializer.yml'
      - '.ssc-rd04-state-source-adjudication-materializer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-rd04-state-source-adjudication-materializer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct, qualify, and lease-publish the thirteen-file product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuxo pipefail
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          readonly LIVE_MAIN_LEASE=a4a9ced8a702ab5f6ba57b15073683246295035d
          readonly TARGET_BRANCH=agent/ssc-rd-wave03-rd04-state-source-adjudication-v1
          readonly TARGET_LEASE=08dcb3843b6295bf3339f70f4654c6ce3b7d3c42
          readonly STANDING_WORKFLOW=.github/workflows/status-sovereignty-rd-wave03-rd04-state-source-adjudication.yml
          readonly CARRIER=.ssc-rd04-state-source-adjudication-materializer
          readonly B64=/tmp/ssc-rd04-state-source-product.tar.xz.b64
          readonly ARCHIVE=/tmp/ssc-rd04-state-source-product.tar.xz
          readonly PACKAGE=/tmp/ssc-rd04-state-source-package
          readonly WORK=/tmp/ssc-rd04-state-source-worktree
          readonly RECEIPT=/tmp/ssc-rd04-state-source-materializer-receipt
          readonly PATHS=/tmp/ssc-rd04-state-source-product-paths.txt

          rm -rf "$B64" "$ARCHIVE" "$PACKAGE" "$WORK" "$RECEIPT" "$PATHS"
          mkdir -p "$PACKAGE" "$RECEIPT"

          check_part() {
            local name="$1" bytes="$2" digest="$3"
            local path="$CARRIER/archive/$name"
            test "$(wc -c < "$path" | tr -d ' ')" = "$bytes"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$digest"
          }
          check_part part-00 6000 8c0e2e5507770e587b27da28dbb15dd536067e59f47a590834eddc884a27855d
          check_part part-01 6000 165a9cabcdee2068a27132ec00936e92038fdb8700a383fccd3f4c605b14a987
          check_part part-02 6000 c09c48568acbf16aecb426857a75387e3e9aa595caac91f5c87d24e6dcc5f862
          check_part part-03 6000 38a2a39f6d216ba2cdd7eb239a7901bf96500ca3f42f1dce73489eb4e39fc6e3
          check_part part-04 6000 2dc9dd97d76f5c8461194e916a98b2c34315aba09cc2b16a6574e2757ad331c5
          check_part part-05 6000 95035066dc0a2cc9a3776797f00aa71049d51b3bf6350281984367ca32536e31
          check_part part-06 6000 f87db0fcdcf15f79dbddb43ea427cf8c040df55389d0b359288ef69dc2e2be4e
          check_part part-07 6000 42b693d9cb8979599b8c79198006a8962e01280dff6e0c14f403fb968707a3ff
          check_part part-08 6000 f72f32598b26c21963df6f6e96122177786b4250afb9b87179c886523caa91ca
          check_part part-09 6000 c2f98c769c47e0026c1428a47205151faebe6217d212f8870d8cccfdc0b163d3
          check_part part-10 4112 d26466a043036ac917033d41850aaa88cd53c094802adfd676aa7c578b34e174

          cat "$CARRIER"/archive/part-* > "$B64"
          test "$(wc -c < "$B64" | tr -d ' ')" = 64112
          test "$(sha256sum "$B64" | awk '{print $1}')" = af9afaf43be0f5b1fbab2217919cee21cd39538fc6bb873617b03e0135021ddd
          base64 --decode "$B64" > "$ARCHIVE"
          test "$(wc -c < "$ARCHIVE" | tr -d ' ')" = 48084
          test "$(sha256sum "$ARCHIVE" | awk '{print $1}')" = b064f0666bf71778215684f7adda118f8546d44bc8b79f46d36e4562dfd78907

          cat > "$PATHS" <<'PATHS_EOF'
          data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/execution-receipt.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/index.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/link-candidates.jsonl
          data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/route-adjudications.jsonl
          data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/selected-followup-protocol.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/state-source-observations.jsonl
          docs/milestones/ssc-rd-wave03-rd04-state-source-adjudication.md
          schemas/status-sovereignty-rd-wave03-rd04-state-source-adjudication.schema.json
          test/status-sovereignty-rd-wave03-rd04-state-source-adjudication.test.js
          tools/acquisition/status-sovereignty-rd-wave03-rd04/run-responsive-link-protocol.py
          tools/build-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs
          PATHS_EOF
          sed -i 's/^          //' "$PATHS"
          sort -o "$PATHS" "$PATHS"
          test "$(wc -l < "$PATHS" | tr -d ' ')" = 13
          test "$(sha256sum "$PATHS" | awk '{print $1}')" = e6aeb8b77c8b49d3c5c7e4b264b2af749d731da756531e40fa00a2f8942b476c

          tar -tJf "$ARCHIVE" | sed 's#^\./##' | sed '/^$/d' | sort > "$RECEIPT/archive-paths.txt"
          cmp "$PATHS" "$RECEIPT/archive-paths.txt"
          tar -xJf "$ARCHIVE" -C "$PACKAGE"
          test "$(find "$PACKAGE" -type f | wc -l | tr -d ' ')" = 13
          test "$(find "$PACKAGE" -type l | wc -l | tr -d ' ')" = 0

          python - "$PACKAGE" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
            'data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/execution-receipt.json': (2353, '4b6cfefc97cfef49eeacd4f13d61d44c236160b96aa97242952882929571130d'),
            'data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/index.json': (2091, '42933693a52c38e927860e2f272a35c2f0145f1bc4b214b21768e083631432e1'),
            'data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/link-candidates.jsonl': (224452, '11da737f89093be5b14d2acc80383610dfade55a4f8f0fde2133702c46f4a2d1'),
            'data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/product-manifest.json': (1155, '21ff0c41687c0ce204448ffe446a828f4c95437ba5074c66e853b16991fdb5cd'),
            'data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/route-adjudications.jsonl': (78920, 'c7197a5b2a1dffcf8e6f3491adacc6f253b26188665457ccac7122b253b75708'),
            'data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/selected-followup-protocol.json': (67530, 'e72bd11b31864592713f2f6f1966b02167faedec5391183ccc73baab3ffa5bf0'),
            'data/intake/status-sovereignty-rd-wave03-rd04-state-source-adjudication/state-source-observations.jsonl': (46865, '6170bb365b1f45f2aea89f2d0e32c35260b2e1d24c481caf71a80f906ecc7101'),
            'docs/milestones/ssc-rd-wave03-rd04-state-source-adjudication.md': (4541, '7a1d429a1d174ed1be3aca8b1d57dc876b022ee57ab642f8fc96def9e49867e8'),
            'schemas/status-sovereignty-rd-wave03-rd04-state-source-adjudication.schema.json': (2240, '92a114a5fecfc4ae62a35085e370441e456fabbd5f38da2c917758422bc69ca4'),
            'test/status-sovereignty-rd-wave03-rd04-state-source-adjudication.test.js': (10384, '0b23d40e4780adb8265c8bbfa1a116a0f72fd7b9ee228fb4692acd2ae9dfc7fb'),
            'tools/acquisition/status-sovereignty-rd-wave03-rd04/run-responsive-link-protocol.py': (7093, 'bc6b07b7867877ddc650f34653dd2a18a8f832c8cbc03d420a2db37914a1e5c4'),
            'tools/build-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs': (15659, '6a74ef924ca6d62403ee2afbf47b038b3d3efdc4868ea280c87d05ec3c8e11c9'),
            'tools/validate-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs': (5166, 'd5b0431483d62aea6aa9d1a833592477b7bc3d144595d61dfc0b3655854d0773'),
          }
          for rel, (size, digest) in expected.items():
              data = (root / rel).read_bytes()
              assert len(data) == size, (rel, len(data), size)
              assert hashlib.sha256(data).hexdigest() == digest, rel
          print('exact_nonworkflow_product_files=13')
          PY

          git fetch --no-tags origin main "$TARGET_BRANCH"
          LIVE_MAIN=$(git rev-parse origin/main)
          LIVE_TARGET=$(git rev-parse "origin/$TARGET_BRANCH")
          test "$LIVE_MAIN" = "$LIVE_MAIN_LEASE"
          test "$LIVE_TARGET" = "$TARGET_LEASE"
          test "$(git rev-parse "$LIVE_TARGET^")" = "$LIVE_MAIN"
          test "$(git rev-list --count "$LIVE_MAIN..$LIVE_TARGET")" = 1
          test "$(git diff --name-only "$LIVE_MAIN..$LIVE_TARGET")" = "$STANDING_WORKFLOW"
          test "$(git diff --name-status "$LIVE_MAIN..$LIVE_TARGET" | awk '$1 != "A" {n++} END {print n+0}')" = 0

          git worktree add --detach "$WORK" "$LIVE_TARGET"
          cp -a "$PACKAGE"/. "$WORK"/
          cd "$WORK"
          while IFS= read -r path; do git add -- "$path"; done < "$PATHS"
          git diff --cached --name-only | sort > "$RECEIPT/staged-paths.txt"
          cmp "$PATHS" "$RECEIPT/staged-paths.txt"
          test "$(git diff --cached --name-status | awk '$1 != "A" {n++} END {print n+0}')" = 0
          if grep -E '(^|/)(tmp|transport|carrier|materializer|trigger)(/|$)' "$RECEIPT/staged-paths.txt"; then exit 1; fi
          git commit -m 'Adjudicate RD-04 state-source outcomes and freeze responsive-link protocol'
          FINAL_COMMIT=$(git rev-parse HEAD)
          FINAL_TREE=$(git rev-parse 'HEAD^{tree}')
          test "$(git rev-parse HEAD^)" = "$LIVE_TARGET"

          node --check tools/build-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-state-source-adjudication.test.js
          node tools/build-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-state-source-adjudication.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd04/run-responsive-link-protocol.py
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-responsive-link-protocol.py --validate-only
          node tools/validate-no-magic-human-gate.mjs
          npm run release:check

          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs --write
          node tools/build-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-state-source-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-state-source-adjudication.test.js
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-responsive-link-protocol.py --validate-only
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$LIVE_MAIN"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$LIVE_TARGET"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$LIVE_TARGET"

          printf 'live_main=%s\nstanding_workflow_commit=%s\nfinal_commit=%s\nfinal_tree=%s\npermanent_nonworkflow_paths=13\nroute_adjudications=54\nlanding_page_context_admissions=38\nresponsive_link_candidates=329\nselected_followups=79\nterminal_cells=100/450\nclass_closed=false\noutside_human_dependency=false\n' \
            "$LIVE_MAIN" "$LIVE_TARGET" "$FINAL_COMMIT" "$FINAL_TREE" > "$RECEIPT/final.txt"
          cp "$PATHS" "$RECEIPT/product-paths.txt"
          sha256sum "$B64" "$ARCHIVE" "$RECEIPT"/* > "$RECEIPT/sha256sums.txt"
          cat "$RECEIPT/final.txt"

      - name: Preserve exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-state-source-adjudication-materializer-v1
          path: /tmp/ssc-rd04-state-source-materializer-receipt
          if-no-files-found: error
          retention-days: 30
