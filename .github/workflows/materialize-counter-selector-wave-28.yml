name: Materialize Counter-Selector Wave 28

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-28.yml'
  push:
    branches:
      - 'agent/counter-selector-wave-28-batch-b-blind-review'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-28-batch-b-blind-review
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact carrier and unpack Wave 28 estate
        run: |
          set -euo pipefail
          cat > /tmp/wave28-expected-blobs <<'EOF'
          dbd8a547ec21ea32975b1227ee7166f987c8585e  .github/materializers/counter-selector-wave-28/payload-00
          f1c34c612016ebcaf3783f1ad3b79b83ac316dab  .github/materializers/counter-selector-wave-28/payload-01
          07522282665a1cecf31898ac17d6429681362ce0  .github/materializers/counter-selector-wave-28/payload-02
          88e01af37f99827d19500ee7d65b11da1ac47a9f  .github/materializers/counter-selector-wave-28/payload-03
          335071fe02c84689a503e3aa2282e207b301d03a  .github/materializers/counter-selector-wave-28/payload-04
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave28-expected-blobs
          cat .github/materializers/counter-selector-wave-28/payload-* | base64 --decode > /tmp/counter-selector-wave-28.tar.gz
          echo '685098a6e4e8dc60cf6f68c0ec81d0b6c8f1b530a924dfe4279ab7ca7d6fc80e  /tmp/counter-selector-wave-28.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-28.tar.gz -C .
          cp .github/workflows/counter-selector-wave-28.yml /tmp/counter-selector-wave-28.yml
      - name: Build, validate, and attack Wave 28
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-28.mjs
          node tools/validate-counter-selector-wave-28.mjs
          node test/counter-selector-wave-28.test.js
      - name: Commit exact permanent non-workflow Wave 28 estate
        run: |
          set -euo pipefail
          rm -f .github/workflows/counter-selector-wave-28.yml
          rm -rf .github/materializers/counter-selector-wave-28
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/materializers/counter-selector-wave-28/payload-00 .github/materializers/counter-selector-wave-28/payload-01 .github/materializers/counter-selector-wave-28/payload-02 .github/materializers/counter-selector-wave-28/payload-03 .github/materializers/counter-selector-wave-28/payload-04 data/project/counter-selector-wave-28-batch-b-blind-review.json data/project/counter-selector-wave-28-blind-packet-registry.json data/project/counter-selector-wave-28-review-registry.json data/project/counter-selector-wave-28-disagreement-ledger.json data/project/counter-selector-wave-28-release-manifest.json schemas/counter-selector-observability-batch-b-review.schema.json docs/methods/counter-selector-observability-batch-b-review.md docs/milestones/counter-selector-wave-28.md tools/build-counter-selector-wave-28.mjs tools/validate-counter-selector-wave-28.mjs test/counter-selector-wave-28.test.js reports/core-thesis/counter-selector-wave-28/data.json reports/core-thesis/counter-selector-wave-28/index.html | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected staged paths' >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Execute Counter-Selector Wave 28 Batch B blind review'
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Wave 28 reconstruction
        run: |
          set -euo pipefail
          cp /tmp/counter-selector-wave-28.yml .github/workflows/counter-selector-wave-28.yml
          node tools/build-counter-selector-wave-28.mjs
          node tools/validate-counter-selector-wave-28.mjs
          node test/counter-selector-wave-28.test.js
          git diff --exit-code -- data/project/counter-selector-wave-28-blind-packet-registry.json data/project/counter-selector-wave-28-review-registry.json data/project/counter-selector-wave-28-disagreement-ledger.json data/project/counter-selector-wave-28-release-manifest.json reports/core-thesis/counter-selector-wave-28/data.json reports/core-thesis/counter-selector-wave-28/index.html
          rm -f .github/workflows/counter-selector-wave-28.yml
          test -z "$(git status --porcelain)"
      - name: Publish permanent non-workflow Wave 28 head
        run: git push origin HEAD:agent/counter-selector-wave-28-batch-b-blind-review
