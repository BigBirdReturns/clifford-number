name: Status-for-sovereignty Wave 01 maintainer review

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/research/status-sovereignty-wave-01*'
      - 'data/project/status-sovereignty-*'
      - 'docs/milestones/m05-status-sovereignty-wave-01-review.md'
      - 'tools/*status-sovereignty-wave-01*'
      - 'test/status-sovereignty-wave-01*'
      - 'package.json'
      - '.github/workflows/status-sovereignty-wave-01-review.yml'
  push:
    branches: [main]
    paths:
      - 'data/research/status-sovereignty-wave-01*'
      - 'data/project/status-sovereignty-*'
      - 'docs/milestones/m05-status-sovereignty-wave-01-review.md'
      - 'tools/*status-sovereignty-wave-01*'
      - 'test/status-sovereignty-wave-01*'
      - 'package.json'
      - '.github/workflows/status-sovereignty-wave-01-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate Wave 01 review
        run: |
          node tools/build-status-sovereignty-wave-01.mjs
          node tools/build-status-sovereignty-wave-01-review.mjs
          node tools/validate-status-sovereignty-wave-01.mjs
          node tools/validate-status-sovereignty-wave-01-review.mjs
          node test/status-sovereignty-wave-01.test.js
          node test/status-sovereignty-wave-01-review.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic review products
        run: |
          git restore --staged --worktree .
          npm run build:status-sovereignty
          npm run validate:status-sovereignty
          git diff --exit-code -- \
            data/project/status-sovereignty-wave-01-release-manifest.json \
            data/project/status-sovereignty-wave-01-maintainer-review-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-01/manifest.json \
            build/core-thesis/status-sovereignty/wave-01/data.json \
            build/core-thesis/status-sovereignty/wave-01-review/manifest.json \
            build/core-thesis/status-sovereignty/wave-01-review/data.json \
            reports/core-thesis/status-sovereignty/wave-01/data.json \
            reports/core-thesis/status-sovereignty/wave-01/index.html \
            reports/core-thesis/status-sovereignty/wave-01-review/data.json \
            reports/core-thesis/status-sovereignty/wave-01-review/index.html
