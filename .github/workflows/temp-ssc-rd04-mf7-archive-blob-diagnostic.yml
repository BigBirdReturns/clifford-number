name: TEMP inspect RD-04 adjudication archive blob

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ssc-rd04-mf7-archive-blob-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    if: github.head_ref == 'agent/ssc-rd04-mf7-capture-adjudication-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARCHIVE_BLOB_SHA: f9ffb2019978734d2b0dfa9db52801af8b81b16a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover immutable blob and publish exact custody metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/ssc-rd04-mf7-archive-blob-diagnostic
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path

          sha = os.environ['ARCHIVE_BLOB_SHA']
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          out = Path('/tmp/ssc-rd04-mf7-archive-blob-diagnostic')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'ssc-rd04-mf7-archive-blob-diagnostic',
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              payload = json.load(response)
          if payload.get('encoding') != 'base64':
              raise SystemExit(f"unexpected encoding: {payload.get('encoding')}")
          raw = base64.b64decode(''.join(payload['content'].split()), validate=True)
          identity = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          digest = hashlib.sha256(raw).hexdigest()
          receipt = {
              'blob_sha_expected': sha,
              'blob_sha_observed': identity,
              'api_size': payload.get('size'),
              'decoded_bytes': len(raw),
              'sha256': digest,
              'identity_matches': identity == sha,
              'api_size_matches': payload.get('size') == len(raw),
              'first_16_bytes_hex': raw[:16].hex(),
          }
          (out / 'product.tar.xz').write_bytes(raw)
          (out / 'blob-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          if not receipt['identity_matches'] or not receipt['api_size_matches']:
              raise SystemExit('Git blob identity or API-size mismatch')
          PY
      - name: Preserve exact blob bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mf7-archive-blob-diagnostic
          path: /tmp/ssc-rd04-mf7-archive-blob-diagnostic
          if-no-files-found: error
          retention-days: 90
