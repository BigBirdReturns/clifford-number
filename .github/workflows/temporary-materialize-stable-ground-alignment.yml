name: Temporary materialize stable-ground alignment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp/stable-ground-part-*.b64'
      - '.github/workflows/temporary-materialize-stable-ground-alignment.yml'
  push:
    branches: [agent/project-stable-ground-alignment]
    paths:
      - '.github/tmp/stable-ground-part-*.b64'
      - '.github/workflows/temporary-materialize-stable-ground-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-ground-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-stable-ground-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and expand exact stable-ground package
        run: |
          set -euo pipefail
          test "$(sha256sum .github/tmp/stable-ground-part-00.b64 | awk '{print $1}')" = "bf0c67f76b4de9c000d66b984ab947709c31614f9f802cadaf7619f39110814e"
          test "$(sha256sum .github/tmp/stable-ground-part-01.b64 | awk '{print $1}')" = "ea73582763a6e06cffb76e9e8a34771c51f32f35edcde26109ffd039a4df6f8c"
          test "$(sha256sum .github/tmp/stable-ground-part-02.b64 | awk '{print $1}')" = "2da16cb95d19a9d8063e72c96d71d0106c5140b47529f837f7876c44f37524c6"
          test "$(sha256sum .github/tmp/stable-ground-part-03.b64 | awk '{print $1}')" = "a2f2d9cc5180e2edcab3d3d500724531f25df1cd6e6f45c91cec7331fafa45bf"
          test "$(sha256sum .github/tmp/stable-ground-part-04.b64 | awk '{print $1}')" = "9faa0fad8e6160e4a0b46b528be4cb81891240083bcd543cda85ac5ff4256e85"
          test "$(sha256sum .github/tmp/stable-ground-part-05.b64 | awk '{print $1}')" = "34f1a0e3bf22dd46cc8c327ca90d536537b4584139457e36b3bed49c3d429b12"
          test "$(sha256sum .github/tmp/stable-ground-part-06.b64 | awk '{print $1}')" = "b018059a09feec5a8656f977a682cb1e3941a9458d412717b69e3f7fa74bc8e1"
          test "$(sha256sum .github/tmp/stable-ground-part-07.b64 | awk '{print $1}')" = "a47663aa3b1595e7f08ac09445860145adf3f9b3cb2881973b0eea86f1428119"
          test "$(sha256sum .github/tmp/stable-ground-part-08.b64 | awk '{print $1}')" = "eb42df779aaf35fff5c41b18308b39f8961517b992c023e96b7ee05da50d7f55"
          cat .github/tmp/stable-ground-part-*.b64 > /tmp/stable-ground.b64
          test "$(sha256sum /tmp/stable-ground.b64 | awk '{print $1}')" = "0f05f7de12e2ed3edf0335609e0b73912af2be498e874ea6f230d2618cb27299"
          base64 -d /tmp/stable-ground.b64 > /tmp/stable-ground.tgz
          test "$(sha256sum /tmp/stable-ground.tgz | awk '{print $1}')" = "7edb17fd691aff7a933b1ebd6dea27d735e2c990b0714b4b475da701a71f5e56"
          cat > /tmp/archive-expected-paths.txt <<'EOF'
          .github/workflows/project-stable-ground-alignment.yml
          data/project/project-stable-ground-alignment-release-manifest.json
          data/project/project-stable-ground-alignment.json
          docs/milestones/project-stable-ground-alignment.md
          reports/core-thesis/stable-ground/checkpoint.json
          reports/core-thesis/stable-ground/index.html
          test/project-stable-ground-alignment.test.js
          tools/build-project-stable-ground-alignment.mjs
          tools/validate-project-stable-ground-alignment.mjs
          EOF
          tar -tzf /tmp/stable-ground.tgz | sort > /tmp/archive-paths.txt
          sort -o /tmp/archive-expected-paths.txt /tmp/archive-expected-paths.txt
          diff -u /tmp/archive-expected-paths.txt /tmp/archive-paths.txt
          grep -v '^\.github/workflows/' /tmp/archive-expected-paths.txt > /tmp/materialize-paths.txt
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            tar -xzOf /tmp/stable-ground.tgz "$path" > "$path"
          done < /tmp/materialize-paths.txt
      - name: Run focused alignment checks
        run: |
          set -euo pipefail
          node tools/build-project-stable-ground-alignment.mjs
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
      - name: Prove deterministic alignment products
        run: |
          set -euo pipefail
          sha256sum \
            data/project/project-stable-ground-alignment-release-manifest.json \
            reports/core-thesis/stable-ground/checkpoint.json \
            reports/core-thesis/stable-ground/index.html > /tmp/before.sha256
          node tools/build-project-stable-ground-alignment.mjs
          node tools/validate-project-stable-ground-alignment.mjs
          sha256sum \
            data/project/project-stable-ground-alignment-release-manifest.json \
            reports/core-thesis/stable-ground/checkpoint.json \
            reports/core-thesis/stable-ground/index.html > /tmp/after.sha256
          diff -u /tmp/before.sha256 /tmp/after.sha256
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Commit permanent non-workflow checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/project/project-stable-ground-alignment.json \
            data/project/project-stable-ground-alignment-release-manifest.json \
            docs/milestones/project-stable-ground-alignment.md \
            reports/core-thesis/stable-ground/checkpoint.json \
            reports/core-thesis/stable-ground/index.html \
            test/project-stable-ground-alignment.test.js \
            tools/build-project-stable-ground-alignment.mjs \
            tools/validate-project-stable-ground-alignment.mjs
          git diff --cached --name-only | sort > /tmp/staged.txt
          cat > /tmp/expected-staged.txt <<'EOF'
          data/project/project-stable-ground-alignment-release-manifest.json
          data/project/project-stable-ground-alignment.json
          docs/milestones/project-stable-ground-alignment.md
          reports/core-thesis/stable-ground/checkpoint.json
          reports/core-thesis/stable-ground/index.html
          test/project-stable-ground-alignment.test.js
          tools/build-project-stable-ground-alignment.mjs
          tools/validate-project-stable-ground-alignment.mjs
          EOF
          sort -o /tmp/expected-staged.txt /tmp/expected-staged.txt
          diff -u /tmp/expected-staged.txt /tmp/staged.txt
          git commit -m "Record project stable-ground alignment"
          git push origin HEAD:agent/project-stable-ground-alignment
