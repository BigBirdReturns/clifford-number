name: TEMP export SSC Wave 03 exact lane deltas v2

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-wave03-source-export-v1.yml'
      - '.ssc-wave03-source-export-v1/EXPORT'

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-ssc-wave03-source-export-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/ssc-wave03-source-export-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_HEAD: dc47681a9ad43e1c64c86e3d823dbb7c203a18c2
      RD01_HEAD: c491c99b2deb79b069a6dd7bc92f68e764228151
      RD02_HEAD: 431f94963c369f982d262e96ed378806862539aa
      RD03_HEAD: 06345049d48b0e5b0a2703751d820bb380b9ff88
      RD04_HEAD: 2e007a337897b4e67f618c20cd698b86a2c240c0
      RD05_HEAD: aa72bd3706f2a5c2ee0e36a3ee0c1cd544c24017
      RD06_HEAD: 38082e5e9843aa6d09a42581593f77622f81b821
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc47681a9ad43e1c64c86e3d823dbb7c203a18c2
          fetch-depth: 0
      - name: Export exact lane deltas
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"

          export_dir="$RUNNER_TEMP/ssc-wave03-lane-deltas-v2"
          rm -rf "$export_dir"
          mkdir -p "$export_dir/patches" "$export_dir/paths" "$export_dir/logs"

          git fetch --no-tags origin \
            "+refs/heads/agent/ssc-rd-wave03-rd01-methodology-correction:refs/remotes/export/rd01" \
            "+refs/heads/agent/ssc-rd-wave03-rd02-portfolio-lifecycle:refs/remotes/export/rd02" \
            "+refs/heads/agent/ssc-rd-wave03-rd03-lifecycle-recovery:refs/remotes/export/rd03" \
            "+refs/heads/agent/ssc-rd-wave03-rd04-state-implementation:refs/remotes/export/rd04" \
            "+refs/heads/agent/ssc-rd-wave03-rd05-member-participation:refs/remotes/export/rd05" \
            "+refs/heads/agent/ssc-rd-wave03-rd06-evaluation-custody:refs/remotes/export/rd06"

          test "$(git rev-parse refs/remotes/export/rd01)" = "$RD01_HEAD"
          test "$(git rev-parse refs/remotes/export/rd02)" = "$RD02_HEAD"
          test "$(git rev-parse refs/remotes/export/rd03)" = "$RD03_HEAD"
          test "$(git rev-parse refs/remotes/export/rd04)" = "$RD04_HEAD"
          test "$(git rev-parse refs/remotes/export/rd05)" = "$RD05_HEAD"
          test "$(git rev-parse refs/remotes/export/rd06)" = "$RD06_HEAD"

          emit_lane() {
            lane="$1"
            head="$2"
            git merge-base --is-ancestor "$BASE_HEAD" "$head"
            git diff --binary --full-index "$BASE_HEAD" "$head" > "$export_dir/patches/${lane}.patch"
            git diff --name-only "$BASE_HEAD" "$head" | LC_ALL=C sort > "$export_dir/paths/${lane}.txt"
            git log --reverse --format='%H %s' "$BASE_HEAD..$head" > "$export_dir/logs/${lane}.txt"
            test -s "$export_dir/patches/${lane}.patch"
            test -s "$export_dir/paths/${lane}.txt"
          }

          emit_lane rd01 "$RD01_HEAD"
          emit_lane rd02 "$RD02_HEAD"
          emit_lane rd03 "$RD03_HEAD"
          emit_lane rd04 "$RD04_HEAD"
          emit_lane rd05 "$RD05_HEAD"
          emit_lane rd06 "$RD06_HEAD"

          cat > "$export_dir/heads.txt" <<HEADS
          base $BASE_HEAD
          rd01 $RD01_HEAD
          rd02 $RD02_HEAD
          rd03 $RD03_HEAD
          rd04 $RD04_HEAD
          rd05 $RD05_HEAD
          rd06 $RD06_HEAD
          HEADS
          sed -i 's/^          //' "$export_dir/heads.txt"

          (cd "$export_dir" && sha256sum heads.txt patches/*.patch paths/*.txt logs/*.txt > SHA256SUMS)
          echo "EXPORT_DIR=$export_dir" >> "$GITHUB_ENV"
      - name: Preserve exact lane deltas
        uses: actions/upload-artifact@v4
        with:
          name: ssc-wave03-exact-lane-deltas-v2
          path: ${{ env.EXPORT_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
