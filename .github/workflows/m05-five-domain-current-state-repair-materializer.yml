name: Materialize M-05 five-domain current-state repair

on:
  push:
    branches:
      - agent/m05-s03-l7-five-domain-current-state-repair-materializer-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize exact five-path repair
        env:
          PAYLOAD_BLOB_SHA: 08f9bc33c9c0520a5f876ed1c0cbe12b9c0313a2
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git switch -c agent/m05-s03-l7-five-domain-current-state-repair-v1
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$PAYLOAD_BLOB_SHA" \
            | python -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > "$RUNNER_TEMP/m05-five-domain-repair.txz"
          tar -xJf "$RUNNER_TEMP/m05-five-domain-repair.txz"

      - name: Validate focused current-state repair
        run: |
          set -euo pipefail
          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs
          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.test.js

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore clean base and rematerialize exact product
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          tar -xJf "$RUNNER_TEMP/m05-five-domain-repair.txz"

      - name: Stage and prove exact five-path boundary
        run: |
          set -euo pipefail
          git add -- \
            .github/workflows/m05-five-domain-claim-evidence-reconciliation.yml \
            data/project/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.json \
            test/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.test.js \
            tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs \
            tools/validate-m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs
          git diff --cached --check
          printf '%s\n' \
            .github/workflows/m05-five-domain-claim-evidence-reconciliation.yml \
            data/project/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.json \
            test/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.test.js \
            tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs \
            tools/validate-m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs \
            | sort > "$RUNNER_TEMP/expected-paths"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Prove focused state is deterministic
        run: |
          set -euo pipefail
          node tools/validate-m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.mjs
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-claim-evidence-reconciliation.test.js
          git diff --exit-code

      - name: Commit exact product
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git commit -m '[M-05 S03-L7] Preserve Robodebt state in five-domain reconciliation'

      - name: Publish clean product branch
        run: git push --force origin HEAD:refs/heads/agent/m05-s03-l7-five-domain-current-state-repair-v1
