name: Counter-Selector Wave 39 digest-selected restore

on:
  pull_request:
    paths:
      - 'data/project/counter-selector-wave-39-*.json'
      - 'schemas/counter-selector-digest-selected-restore.schema.json'
      - 'docs/methods/counter-selector-digest-selected-restore.md'
      - 'docs/milestones/counter-selector-wave-39.md'
      - 'tools/*counter-selector-wave-39*'
      - 'test/counter-selector-wave-39.test.js'
      - 'reports/core-thesis/counter-selector-wave-39/**'
      - '.github/workflows/counter-selector-wave-39.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 39 products
        run: node tools/build-counter-selector-wave-39.mjs
      - name: Validate digest-selected restore contract
        run: node tools/validate-counter-selector-wave-39.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-39.test.js
      - name: Require exact committed Wave 39 products
        run: git diff --exit-code -- data/project/counter-selector-wave-39-control-registry.json data/project/counter-selector-wave-39-release-manifest.json reports/core-thesis/counter-selector-wave-39/data.json reports/core-thesis/counter-selector-wave-39/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 39 deterministically
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-39.mjs
          node tools/validate-counter-selector-wave-39.mjs
          node test/counter-selector-wave-39.test.js
          git diff --exit-code -- data/project/counter-selector-wave-39-control-registry.json data/project/counter-selector-wave-39-release-manifest.json reports/core-thesis/counter-selector-wave-39/data.json reports/core-thesis/counter-selector-wave-39/index.html
          test -z "$(git status --porcelain)"
