name: TEMP qualify exact School.House USPTO census artifact v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: schoolhouse-uspto-exact-mark-census-qualifier-v2-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-uspto-exact-mark-census-qualifier-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate and independently qualify the exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='b320e380723600fe39c3aa711a09d3d861f756c2'
          BASE_TREE='50801e462a7e5d170a65dd0612e7ff1b96d75dd8'
          SOURCE_HEAD='16cf3c313c6760814d6fca0ab491a093fba9ff4a'
          SOURCE_RUN='31141096853'
          ARTIFACT_ID='8979839804'
          ARTIFACT_NAME='schoolhouse-uspto-exact-mark-census-v1'
          ARTIFACT_BYTES='6026'
          ARTIFACT_SHA='008180c6126a9281ce1016171ea01c5292cddcefd9896f15c78fa304fc65cce5'
          WORKFLOW='.github/workflows/temp-schoolhouse-uspto-exact-mark-census-qualifier-v2.yml'
          ZIP="$RUNNER_TEMP/$ARTIFACT_NAME.zip"
          RECEIPT="$RUNNER_TEMP/schoolhouse-uspto-exact-mark-census-qualification-v2"
          mkdir -p "$RECEIPT"

          git fetch --no-tags origin main
          MAIN="$(git rev-parse origin/main)"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE" origin/main
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          mapfile -t DELTA < <(git diff --name-only "$BASE"..HEAD)
          test "${#DELTA[@]}" -eq 1
          test "${DELTA[0]}" = "$WORKFLOW"

          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.digest // ""')" = "sha256:$ARTIFACT_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .name)" = "$ARTIFACT_NAME"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .workflow_run.id)" = "$SOURCE_RUN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .workflow_run.head_sha)" = "$SOURCE_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .workflow_run.head_branch)" = 'agent/schoolhouse-uspto-exact-mark-census-v1'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ZIP"
          test "$(stat -c%s "$ZIP")" = "$ARTIFACT_BYTES"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$ARTIFACT_SHA"

          python - "$ZIP" "$RECEIPT" "$MAIN" <<'PY'
          from __future__ import annotations
          from collections import Counter
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import sys
          import zipfile

          zip_path = Path(sys.argv[1])
          receipt = Path(sys.argv[2])
          main = sys.argv[3]
          out = receipt / 'source'
          out.mkdir(parents=True)

          def sha256_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def read_json(name: str):
              return json.loads((out / name).read_text())

          def read_json_documents(name: str):
              text = (out / name).read_text()
              decoder = json.JSONDecoder()
              documents = []
              cursor = 0
              while True:
                  while cursor < len(text) and text[cursor].isspace():
                      cursor += 1
                  if cursor == len(text):
                      return documents
                  value, cursor = decoder.raw_decode(text, cursor)
                  documents.append(value)

          expected_members = sorted([
              'RUNNER-OUTPUT.log', 'RUNNER_EXIT_CODE', 'SHA256SUMS',
              'adjudication.json', 'artifact-manifest.json',
              'query-receipts.jsonl', 'query-results.jsonl',
              'route-policy.json', 'source-receipt.json', 'summary.json',
          ])
          with zipfile.ZipFile(zip_path) as archive:
              assert archive.testzip() is None
              assert sorted(archive.namelist()) == expected_members
              archive.extractall(out)

          assert (out / 'RUNNER_EXIT_CODE').read_text().strip() == '0'
          checksum_names = []
          for line in (out / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert '/' not in name and name in expected_members
              assert sha256_bytes((out / name).read_bytes()) == digest
              checksum_names.append(name)
          assert checksum_names == [
              'adjudication.json', 'query-receipts.jsonl', 'query-results.jsonl',
              'route-policy.json', 'source-receipt.json', 'summary.json',
              'artifact-manifest.json',
          ]

          summary = read_json('summary.json')
          adjudication = read_json('adjudication.json')
          policy = read_json('route-policy.json')
          source = read_json('source-receipt.json')
          manifest = read_json('artifact-manifest.json')
          queries = read_json_documents('query-receipts.jsonl')
          assert (out / 'query-results.jsonl').read_bytes() == b''

          assert summary['schema_version'] == 'schoolhouse-uspto-exact-mark-census-v1@1'
          assert summary['state'] == 'terminal_bounded_uspto_exact_mark_candidate_census'
          assert summary['fixed_query_count'] == summary['terminal_query_count'] == 3
          assert summary['terminal_query_state_counts'] == {'terminal_public_search_rendered_no_parseable_rows': 3}
          assert summary['query_row_counts'] == {}
          assert summary['exact_form_counts'] == {}
          for key in ('retained_result_rows', 'unique_serials', 'trademark_serial_candidate_rows',
                      'owner_or_applicant_name_values_retained', 'person_names_retained',
                      'addresses_retained', 'phone_or_email_values_retained',
                      'attorney_or_correspondence_values_retained', 'complete_html_responses_retained',
                      'screenshots_retained', 'raw_json_responses_retained',
                      'raw_browser_profiles_or_cookies_retained', 'identities_admitted',
                      'relationships_admitted', 'negative_existence_claims_created'):
              assert summary[key] == 0, key
          assert summary['blocked_officially_unscoped_host_requests'] == 15
          assert summary['outside_human_dependency'] is False
          assert [summary[k] for k in ('publication_effect','adoption_effect','graph_effect')] == ['none','none','none']

          assert adjudication['schema_version'] == 'schoolhouse-uspto-trademark-adjudication-v1@1'
          assert adjudication['state'] == summary['state']
          for key in ('public_schoolhouse_identity_admitted', 'trademark_owner_admitted',
                      'school_house_domain_operation_admitted', 'fiscal_sponsor_relationship_admitted',
                      'funding_relationship_admitted', 'governance_or_control_relationship_admitted',
                      'related_party_relationship_admitted', 'negative_existence_claim_created'):
              assert adjudication[key] is False, key
          assert adjudication['promotes_to'] == 'candidate_only'
          assert adjudication['trademark_serial_candidate_rows'] == 0
          assert adjudication['interpretation'] == {
              'zero_results_is_not_registry_absence': True,
              'source_unavailable_is_not_registry_absence': True,
              'serial_candidate_is_not_owner_identity': True,
              'separate_exact_domain_document_adjudication_required': True,
          }
          assert adjudication['outside_human_dependency'] is False
          assert [adjudication[k] for k in ('publication_effect','adoption_effect','graph_effect')] == ['none','none','none']

          assert policy['schema_version'] == 'schoolhouse-uspto-trademark-route-policy-v1@1'
          assert policy['issue'] == 1323
          assert policy['canonical_parent'] == 'b320e380723600fe39c3aa711a09d3d861f756c2'
          assert policy['canonical_parent_tree'] == '50801e462a7e5d170a65dd0612e7ff1b96d75dd8'
          assert policy['official_roots'] == ['https://tmsearch.uspto.gov/', 'https://tmsearch.uspto.gov/help']
          assert policy['fixed_queries'] == [
              {'query_id':'q1_school_dot_house','expected_mark_normalized':'school.house','query_text_sha256':'c47c3fc49cf776064bae1646e3b66c365c8bd7bb2331519202d99cc50be37bbd'},
              {'query_id':'q2_schoolhouse','expected_mark_normalized':'schoolhouse','query_text_sha256':'559373c929bc49198ae8d453c15c2dd5915c52b06c260bbb99806ddcc2f1f3e5'},
              {'query_id':'q3_school_house','expected_mark_normalized':'school house','query_text_sha256':'69b47483ba29306ba297ca884cd28538e2408754617af8ea6c044b05f8b1ee52'},
          ]
          assert policy['bounds'] == {
              'browser_sessions':1, 'fixed_search_submissions':3,
              'maximum_result_rows_per_query':500, 'maximum_unique_serials_retained':1000,
              'maximum_same_host_detail_views':1000, 'login_attempts':0,
              'account_creation_attempts':0, 'api_key_requests':0,
              'captcha_or_waf_bypass_attempts':0, 'cookie_export_or_replay_attempts':0,
              'query_derived_officially_unscoped_requests':0, 'outside_human_dependency':False,
          }
          assert policy['candidate_rule'] == {
              'all_required':['serial_number_present','combined_mark_exact_fixed_form','terminal_public_retrieval_state'],
              'promotes_to':'trademark_serial_candidate', 'owner_identity_admission':False,
              'successor_tsd_document_adjudication_required':True,
          }
          assert all(value == 0 for value in policy['retention'].values())
          assert policy['authority'] == {
              'identities_admitted':0, 'relationships_admitted':0,
              'negative_existence_claims':0, 'outside_human_dependency':False,
              'publication_effect':'none', 'adoption_effect':'none', 'graph_effect':'none',
          }

          assert source['schema_version'] == 'schoolhouse-uspto-trademark-source-receipt-v1@1'
          assert source['issue'] == 1323
          assert source['canonical_parent'] == policy['canonical_parent']
          assert source['canonical_parent_tree'] == policy['canonical_parent_tree']
          assert source['official_source_host'] == 'tmsearch.uspto.gov'
          assert source['browser_engine'] == 'playwright_chromium'
          assert source['anonymous_session'] is True
          assert source['fixed_query_count'] == 3
          assert source['terminal_query_state_counts'] == summary['terminal_query_state_counts']
          assert source['result_rows'] == source['unique_serials'] == source['trademark_serial_candidate_rows'] == 0
          assert source['blocked_officially_unscoped_host_requests'] == 15
          assert source['blocked_host_hashes'] == [
              '26fa5d71cd6c815bf57de6af3d4c71e39f139086734351983608e1b7444a4cb9',
              '7df7caa0a5579e01ef923800346a2cedac8293073a94e9220720893eb22539ea',
              'd9c819b94209f17e1b149d0758abb46ce0ab71d008b6988fe463472cf79326d6',
              'edf7dcad352dc8cbe0020ec23a3b6a9789cc3a881a66ed8f3b2a8917515ca357',
          ]
          assert source['outside_human_dependency'] is False
          assert [source[k] for k in ('publication_effect','adoption_effect','graph_effect')] == ['none','none','none']

          assert len(queries) == 3
          expected_ids = ['q1_school_dot_house','q2_schoolhouse','q3_school_house']
          expected_norms = ['school.house','schoolhouse','school house']
          expected_hashes = [
              'c47c3fc49cf776064bae1646e3b66c365c8bd7bb2331519202d99cc50be37bbd',
              '559373c929bc49198ae8d453c15c2dd5915c52b06c260bbb99806ddcc2f1f3e5',
              '69b47483ba29306ba297ca884cd28538e2408754617af8ea6c044b05f8b1ee52',
          ]
          assert [row['query_id'] for row in queries] == expected_ids
          assert [row['expected_mark_normalized'] for row in queries] == expected_norms
          assert [row['query_text_sha256'] for row in queries] == expected_hashes
          assert [row['blocked_officially_unscoped_host_requests'] for row in queries] == [5,10,15]
          assert Counter(row['terminal_state'] for row in queries) == Counter({'terminal_public_search_rendered_no_parseable_rows':3})
          for row in queries:
              assert row['schema_version'] == 'schoolhouse-uspto-trademark-query-receipt-v1@1'
              assert row['blocked_host_hashes'] == source['blocked_host_hashes']
              assert row['retained_result_rows'] == 0
              assert row['final_url_sha256'] == '2e76cab2b6c6f9ad5d27dfd06a4377307b869faf470bd20b1f3604117978534d'
              assert row['final_title_sha256'] == 'ab99b2c6497abb178258cd3e5ff24384edb7a160581281345f6cf77c75f3555c'
              assert row['request_count'] == 108 and row['response_count'] == 24
              assert row['json_response_count'] == 8 and row['json_parse_error_count'] == 0
              assert row['login_attempts'] == row['account_creation_attempts'] == row['api_key_requests'] == 0
              assert row['captcha_or_waf_bypass_attempts'] == row['cookie_export_or_replay_attempts'] == 0
              assert row['challenge_detected'] is False
              assert row['access_block_http_statuses'] == [] and row['error_class'] is None
              assert row['outside_human_dependency'] is False
              assert [row[k] for k in ('publication_effect','adoption_effect','graph_effect')] == ['none','none','none']

          assert manifest['schema_version'] == 'schoolhouse-uspto-trademark-artifact-manifest-v1@1'
          assert manifest['combined_sha256'] == 'bc6a37aac6a578e8a30a53c584db69b4d268d49db922ce8af1f4f9ed4f6e00a9'
          assert manifest['counts'] == {'query_receipts':3,'result_rows':0,'trademark_serial_candidates':0,'unique_serials':0}
          assert manifest['files'] == [
              {'path':'adjudication.json','bytes':963,'sha256':'bc346da315f8d695a88837389df2356f93fc1ce12c7c9969f2db392996d3cc4a'},
              {'path':'query-receipts.jsonl','bytes':4141,'sha256':'09d2b315ede70b18b0ec6a9839dc9a222d64ddabf7703936cb6365a9622f9103'},
              {'path':'query-results.jsonl','bytes':0,'sha256':'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'},
              {'path':'route-policy.json','bytes':2442,'sha256':'06cf8f641a9945670ce0adfb476a9de13040cc2f4386b78ffdfae5e9f7a8c5cc'},
              {'path':'source-receipt.json','bytes':1132,'sha256':'a364fb17119b005001755c10d4ac064de424753105dd5219812ba7791d23e2d6'},
              {'path':'summary.json','bytes':1057,'sha256':'aade6e6e981e39d8bf05fea2b30bacb6980c42916adbd1cb0a8d706c5aafde35'},
          ]

          prohibited = {
              'owner','owner_name','applicant','applicant_name','person_name',
              'attorney','correspondence','street_address','mailing_address',
              'phone','email','cookie','browser_profile','raw_html','raw_json','screenshot',
          }
          def walk(value):
              if isinstance(value, dict):
                  assert prohibited.isdisjoint(value)
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          for value in (summary, adjudication, policy, source, manifest, queries):
              walk(value)

          qualification = {
              'schema_version':'schoolhouse-uspto-exact-mark-census-qualification-v2@2',
              'canonical_main_observed':main,
              'canonical_predecessor':policy['canonical_parent'],
              'canonical_predecessor_tree':policy['canonical_parent_tree'],
              'source_pr':1324,
              'source_head':'16cf3c313c6760814d6fca0ab491a093fba9ff4a',
              'source_workflow_run':31141096853,
              'source_workflow_conclusion':'failure_after_successful_census_and_validation_wrapper',
              'artifact_id':8979839804,
              'artifact_name':'schoolhouse-uspto-exact-mark-census-v1',
              'artifact_bytes':6026,
              'artifact_sha256':'008180c6126a9281ce1016171ea01c5292cddcefd9896f15c78fa304fc65cce5',
              'fixed_query_count':3,
              'terminal_query_count':3,
              'terminal_state':summary['state'],
              'query_terminal_state':'terminal_public_search_rendered_no_parseable_rows',
              'retained_result_rows':0,
              'unique_serials':0,
              'trademark_serial_candidate_rows':0,
              'blocked_officially_unscoped_host_requests':15,
              'identities_admitted':0,
              'relationships_admitted':0,
              'negative_existence_claims':0,
              'outside_human_dependency':False,
              'publication_effect':'none',
              'adoption_effect':'none',
              'graph_effect':'none',
              'qualification':'pass',
          }
          (receipt / 'qualification.json').write_text(json.dumps(qualification, indent=2, sort_keys=True) + '\n')
          shutil.copy2(out / 'summary.json', receipt / 'source-summary.json')
          shutil.copy2(out / 'SHA256SUMS', receipt / 'source-SHA256SUMS')
          shutil.rmtree(out)
          rows = []
          for path in sorted(receipt.iterdir()):
              if path.is_file(): rows.append(f'{sha256_bytes(path.read_bytes())}  {path.name}')
          (receipt / 'SHA256SUMS').write_text('\n'.join(rows) + '\n')
          print(json.dumps(qualification, indent=2, sort_keys=True))
          PY

      - name: Preserve independent qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-uspto-exact-mark-census-qualification-v2
          path: ${{ runner.temp }}/schoolhouse-uspto-exact-mark-census-qualification-v2
          if-no-files-found: error
          retention-days: 90
