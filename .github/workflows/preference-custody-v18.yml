name: Preference custody laboratory floor v18

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-release-authority.mjs'
      - 'tools/validate-preference-release-authority.mjs'
      - 'tools/compile-preference-custody-manifest-v18.mjs'
      - 'tools/validate-preference-custody-manifest-v18.mjs'
      - 'test/preference-release-authority.test.js'
      - 'test/preference-custody-manifest-v18.test.js'
      - 'docs/preference-custody-release-authority.md'
      - 'docs/preference-custody-laboratory-floor-v18.md'
      - '.github/workflows/preference-release-authority.yml'
      - '.github/workflows/preference-custody-v18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-20 and the compositional v18 floor
        run: |
          node tools/compile-preference-release-authority.mjs
          node tools/compile-preference-custody-manifest-v18.mjs
      - name: Validate release-authority and floor boundaries
        run: |
          node tools/validate-preference-release-authority.mjs
          node tools/validate-preference-custody-manifest-v18.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-release-authority.test.js
          node test/preference-custody-manifest-v18.test.js
      - name: Preserve deterministic v18 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v18
          path: |
            build/research/preference-release-authority.json
            build/research/preference-release-authority.md
            build/research/preference-custody-laboratory-floor-v18.json
            build/research/preference-custody-laboratory-floor-v18.md
          if-no-files-found: error
