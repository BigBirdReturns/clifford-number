name: Temporary diagnose K0 SG-04 materializer

on:
  pull_request_target:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: k0-sg04-materializer-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.pull_request.number == 405 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/k0-role-neutral-wave-08'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/clifford-number
          ref: agent/k0-role-neutral-wave-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Replay materializer and publish first-failure receipt
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -u
          receipt='.github/tmp/sg04-materializer-diagnostic.log'
          if test -f "$receipt"; then
            echo 'diagnostic receipt already present; refusing recursive diagnostic run'
            exit 0
          fi

          old_head="$(git rev-parse HEAD)"
          test "$old_head" = "$EXPECTED_HEAD" || exit 91
          log='/tmp/sg04-materializer-diagnostic.log'
          : > "$log"
          stage='bootstrap'

          report() {
            code="$1"
            {
              echo
              echo "RESULT: $([ "$code" -eq 0 ] && echo PASS || echo FAIL)"
              echo "STAGE: $stage"
              echo "EXIT_CODE: $code"
              echo "EVENT_HEAD: $old_head"
              echo "BASE_MAIN: $(git rev-parse origin/main 2>/dev/null || true)"
              echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              echo 'STATUS BEFORE CLEANUP:'
              git status --short --untracked-files=all || true
            } >> "$log" 2>&1

            git reset --hard "$old_head" >> "$log" 2>&1 || true
            git clean -fd >> "$log" 2>&1 || true
            mkdir -p .github/tmp
            cp "$log" "$receipt"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$receipt"
            git diff --cached --check
            git commit -m "Record SG-04 materializer diagnostic: $stage"
            git push --force-with-lease=refs/heads/agent/k0-role-neutral-wave-08:"$old_head" origin HEAD:agent/k0-role-neutral-wave-08
            exit 0
          }

          run_stage() {
            stage="$1"
            shift
            {
              echo
              echo "===== STAGE: $stage ====="
              printf 'COMMAND:'
              printf ' %q' "$@"
              echo
            } >> "$log"
            "$@" >> "$log" 2>&1
            code="$?"
            if test "$code" -ne 0; then
              report "$code"
            fi
          }

          run_stage verify-transition git merge-base --is-ancestor e9b85b31281db02ce3f9a9a84dd7aea34b714849 HEAD

          stage='verify-carrier'
          carrier='.github/tmp/sg04-source.tar.gz.b64'
          if ! test -f "$carrier"; then echo 'carrier missing' >> "$log"; report 92; fi
          if ! printf '%s  %s\n' '116d7d7aebc8452a8b08b0a3b1244bb274ab4efffc2e795ab475049502a7f58f' "$carrier" | sha256sum --check --strict >> "$log" 2>&1; then report 93; fi
          base64 --decode "$carrier" > /tmp/sg04-source.tar.gz
          if ! printf '%s  %s\n' 'db3b6d4cd41163fb889d7ceb91033f345d9f97dc4029d0c92095665ce48afd34' /tmp/sg04-source.tar.gz | sha256sum --check --strict >> "$log" 2>&1; then report 94; fi

          stage='verify-carrier-members'
          python3 - <<'PY' >> "$log" 2>&1
          import tarfile
          from pathlib import PurePosixPath
          expected = {
              '.github/workflows/project-stable-ground-sg03.yml',
              '.github/workflows/project-stable-ground-sg04.yml',
              'data/project/project-stable-ground-current.json',
              'data/project/project-stable-ground-sg04.json',
              'docs/milestones/project-stable-ground-sg04.md',
              'test/project-stable-ground-sg03.test.js',
              'test/project-stable-ground-sg04.test.js',
              'tools/build-project-stable-ground-sg04.mjs',
              'tools/validate-project-stable-ground-sg03.mjs',
              'tools/validate-project-stable-ground-sg04.mjs',
          }
          with tarfile.open('/tmp/sg04-source.tar.gz', 'r:gz') as archive:
              files = []
              for member in archive.getmembers():
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts:
                      raise RuntimeError(f'unsafe carrier path: {member.name}')
                  if member.isfile():
                      files.append(member.name.removeprefix('./'))
              if set(files) != expected:
                  raise RuntimeError({'missing': sorted(expected - set(files)), 'unexpected': sorted(set(files) - expected)})
          print('carrier members: PASS')
          PY
          code="$?"; if test "$code" -ne 0; then report "$code"; fi

          run_stage extract-carrier tar -xzf /tmp/sg04-source.tar.gz
          rm -f "$carrier"

          stage='patch-release-integration'
          python3 - <<'PY' >> "$log" 2>&1
          import json
          from pathlib import Path
          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          scripts['build:stable-ground'] = 'node tools/build-project-stable-ground-sg04.mjs'
          scripts['validate:stable-ground'] = (
              'node tools/validate-project-stable-ground-alignment.mjs && '
              'node test/project-stable-ground-alignment.test.js && '
              'node tools/validate-project-stable-ground-sg02.mjs && '
              'node test/project-stable-ground-sg02.test.js && '
              'node tools/validate-project-stable-ground-sg03.mjs && '
              'node test/project-stable-ground-sg03.test.js && '
              'node tools/validate-project-stable-ground-sg04.mjs && '
              'node test/project-stable-ground-sg04.test.js'
          )
          scripts['ci:stable-ground'] = 'npm run build:stable-ground && npm run validate:stable-ground'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          builder_path = Path('tools/build-k0-role-neutral-wave-08.mjs')
          builder = builder_path.read_text()
          old_title = '<title>K0 Wave 08 · authorship transfer</title>'
          old_label = 'CLIFFORD NUMBER · M-05 · K0 · WAVE 07'
          if builder.count(old_title) != 1 or builder.count(old_label) != 1:
              raise RuntimeError({'title_matches': builder.count(old_title), 'label_matches': builder.count(old_label)})
          builder = builder.replace(old_title, '<title>K0 Wave 08 · contrary advice and gate action</title>', 1)
          builder = builder.replace(old_label, 'CLIFFORD NUMBER · M-05 · K0 · WAVE 08', 1)
          builder_path.write_text(builder)

          test_path = Path('test/k0-role-neutral-wave-08.test.js')
          test = test_path.read_text()
          anchor = "console.log('k0-role-neutral-wave-08.test: OK');"
          if test.count(anchor) != 1:
              raise RuntimeError({'test_anchor_matches': test.count(anchor)})
          replacement = (
              "const html=fs.readFileSync(path.join(root,'reports/core-thesis/answerable-power/k0-role-neutral-wave-08.html'),'utf8');"
              "assert.match(html,/WAVE 08/);assert.doesNotMatch(html,/WAVE 07/);"
              + anchor
          )
          test_path.write_text(test.replace(anchor, replacement, 1))
          print('release integration patch: PASS')
          PY
          code="$?"; if test "$code" -ne 0; then report "$code"; fi

          run_stage build-wave08 node tools/build-k0-role-neutral-wave-08.mjs
          run_stage validate-wave08 node tools/validate-k0-role-neutral-wave-08.mjs
          run_stage test-wave08 node test/k0-role-neutral-wave-08.test.js
          run_stage build-k0 node tools/build-k0-epistemic-admissibility.mjs
          run_stage validate-k0 node tools/validate-k0-epistemic-admissibility.mjs
          run_stage test-k0 node test/k0-epistemic-admissibility.test.js
          run_stage build-poof node tools/build-poof-clifford-ecology.mjs
          run_stage validate-poof-constitution node tools/validate-poof-constitutional-change.mjs
          run_stage test-poof-constitution node test/poof-constitutional-change.test.js
          run_stage validate-poof node tools/validate-poof-clifford-ecology.mjs
          run_stage test-poof node test/poof-clifford-ecology.test.js
          run_stage build-sg04 node tools/build-project-stable-ground-sg04.mjs
          run_stage validate-stable-ground npm run validate:stable-ground
          run_stage full-release npm run release:check

          stage='freeze-patch'
          git add -A >> "$log" 2>&1
          git diff --cached --check >> "$log" 2>&1
          code="$?"; if test "$code" -ne 0; then report "$code"; fi
          git diff --cached --binary > /tmp/sg04-diagnostic.patch
          if ! test -s /tmp/sg04-diagnostic.patch; then echo 'empty patch' >> "$log"; report 95; fi

          stage='reconstruct'
          git reset --hard "$old_head" >> "$log" 2>&1
          git clean -fd >> "$log" 2>&1
          git apply --index /tmp/sg04-diagnostic.patch >> "$log" 2>&1
          code="$?"; if test "$code" -ne 0; then report "$code"; fi
          run_stage reconstruct-build-wave08 node tools/build-k0-role-neutral-wave-08.mjs
          run_stage reconstruct-build-k0 node tools/build-k0-epistemic-admissibility.mjs
          run_stage reconstruct-build-poof node tools/build-poof-clifford-ecology.mjs
          run_stage reconstruct-build-sg04 node tools/build-project-stable-ground-sg04.mjs
          run_stage reconstruct-validate-stable-ground npm run validate:stable-ground
          run_stage reconstruct-validate-wave08 node tools/validate-k0-role-neutral-wave-08.mjs
          run_stage reconstruct-test-wave08 node test/k0-role-neutral-wave-08.test.js
          run_stage reconstruct-validate-k0 node tools/validate-k0-epistemic-admissibility.mjs
          run_stage reconstruct-test-k0 node test/k0-epistemic-admissibility.test.js
          run_stage reconstruct-validate-poof node tools/validate-poof-clifford-ecology.mjs
          run_stage reconstruct-test-poof node test/poof-clifford-ecology.test.js
          run_stage reconstruct-working-tree-clean git diff --exit-code
          git diff --cached --binary > /tmp/sg04-diagnostic-rebuilt.patch
          run_stage reconstruct-patch-equality cmp /tmp/sg04-diagnostic.patch /tmp/sg04-diagnostic-rebuilt.patch

          stage='all-materializer-stages'
          report 0
