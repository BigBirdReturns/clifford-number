name: TEMP bind current-main tree for PC-48 publication

on:
  push:
    branches:
      - agent/pc48-source-export
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  bind-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 15fbe32735c85be44b833040f3b630966287871c
          fetch-depth: 0
      - name: Emit exact current-main commit and tree
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$commit" = "15fbe32735c85be44b833040f3b630966287871c"
          printf 'commit=%s\ntree=%s\n' "$commit" "$tree" | tee /tmp/pc48-current-main-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pc48-current-main-tree-15fbe32
          path: /tmp/pc48-current-main-tree.txt
          if-no-files-found: error
