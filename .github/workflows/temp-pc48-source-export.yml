name: TEMP export current main for PC-48 construction

on:
  push:
    branches:
      - agent/pc48-source-export
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4c7388b3dbd5e3c19b42f027f1b32cd578e93c1b
          fetch-depth: 0
      - name: Create exact source archive
        run: |
          set -euo pipefail
          git rev-parse HEAD | grep -Fx 4c7388b3dbd5e3c19b42f027f1b32cd578e93c1b
          tar --exclude=.git --exclude=node_modules --exclude=build -czf /tmp/clifford-number-4c7388b.tar.gz .
          sha256sum /tmp/clifford-number-4c7388b.tar.gz | tee /tmp/clifford-number-4c7388b.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: clifford-number-source-4c7388b
          path: |
            /tmp/clifford-number-4c7388b.tar.gz
            /tmp/clifford-number-4c7388b.sha256
          if-no-files-found: error
