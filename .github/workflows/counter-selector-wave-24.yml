name: Counter-Selector Wave 24 model update and handoff

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-24.yml'
      - 'data/project/counter-selector-wave-24-*.json'
      - 'schemas/counter-selector-model-update-handoff.schema.json'
      - 'docs/methods/counter-selector-model-update-handoff.md'
      - 'docs/milestones/counter-selector-wave-24.md'
      - 'tools/build-counter-selector-wave-24.mjs'
      - 'tools/validate-counter-selector-wave-24.mjs'
      - 'test/counter-selector-wave-24.test.js'
      - 'reports/core-thesis/counter-selector-wave-24/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-24.yml'
      - 'data/project/counter-selector-wave-24-*.json'
      - 'schemas/counter-selector-model-update-handoff.schema.json'
      - 'docs/methods/counter-selector-model-update-handoff.md'
      - 'docs/milestones/counter-selector-wave-24.md'
      - 'tools/build-counter-selector-wave-24.mjs'
      - 'tools/validate-counter-selector-wave-24.mjs'
      - 'test/counter-selector-wave-24.test.js'
      - 'reports/core-thesis/counter-selector-wave-24/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 24 products
        run: node tools/build-counter-selector-wave-24.mjs
      - name: Validate model-update and handoff contract
        run: node tools/validate-counter-selector-wave-24.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-24.test.js
      - name: Require exact committed Wave 24 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-24-evidence-registry.json \
            data/project/counter-selector-wave-24-release-manifest.json \
            reports/core-thesis/counter-selector-wave-24/data.json \
            reports/core-thesis/counter-selector-wave-24/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 24 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-24.mjs
          node tools/validate-counter-selector-wave-24.mjs
          node test/counter-selector-wave-24.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
