name: TEMP probe SSC RD-04 A07 all-program SHN form

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd04-a07-shn-pilot-base
    paths:
      - '.github/tmp/ssc-rd04-a07-shn-pilot.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-rd04-a07-shn-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a07-shn-pilot-base
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce no-magic-human contract
        run: node tools/validate-no-magic-human-gate.mjs
      - name: Execute the frozen sixteen-SHN all-program pilot
        run: node .github/tmp/ssc-rd04-a07-shn-pilot.mjs
      - name: Upload exact A07 SHN pilot receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-a07-all-program-shn-pilot
          path: a07-shn-pilot
          if-no-files-found: error
          retention-days: 30
