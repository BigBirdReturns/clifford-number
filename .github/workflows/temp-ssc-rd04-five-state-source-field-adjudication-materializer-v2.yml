name: TEMP materialize RD-04 five-state source-field adjudication v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: rd04-five-state-source-field-adjudication-materializer-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ssc-rd04-five-state-source-field-adjudication-materializer-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact one-commit one-path repair carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          PARENT='d26cb838df12a877840ebe71eb9388d44b6ceaf9'
          PATH_ONLY='.github/workflows/temp-ssc-rd04-five-state-source-field-adjudication-materializer-v2.yml'
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git rev-list --count "$PARENT"..HEAD)" = 1
          test "$(git diff --name-only "$PARENT" HEAD)" = "$PATH_ONLY"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.ref }}' = main
          git fetch --force --no-tags origin main
          test "$(git rev-parse origin/main)" = "$PARENT"
          test -z "$(git ls-remote --heads origin refs/heads/agent/ssc-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication-v1)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'

      - name: Recover and execute immutable glob-repaired materializer
        id: materializer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIRED_RUNNER_BLOB: '7021bbb8c215424634a9b41ff1f14026f676516b'
          REPAIRED_RUNNER_XZ_BYTES: '3972'
          REPAIRED_RUNNER_XZ_SHA256: '667946be2b2496973cd6505ab478e402838e64417082c16ef5748a41c455ce79'
          REPAIRED_RUNNER_SOURCE_BYTES: '12428'
          REPAIRED_RUNNER_SOURCE_SHA256: '9dadf0f1988a8f58a033b91ff66a4dbcb438863d44e5014efe75c8ad14d6c3aa'
          PRODUCT_ARCHIVE_SHA256: 'db341e88a3dbcb4679c87f1bb3591f09fad3c9161d5e4941bb8d950ebd647de3'
          PRODUCT_BRANCH: 'agent/ssc-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication-v1'
        run: |
          set -Eeuo pipefail
          OUT=/tmp/rd04-five-state-materializer-runner-v2
          rm -rf "$OUT"
          mkdir -p "$OUT"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$REPAIRED_RUNNER_BLOB" \
            > "$OUT/blob.json"
          test "$(jq -r .encoding "$OUT/blob.json")" = base64
          jq -r .content "$OUT/blob.json" | tr -d '\n' | base64 -d > "$OUT/materializer.sh.xz"
          test "$(wc -c < "$OUT/materializer.sh.xz" | tr -d ' ')" = "$REPAIRED_RUNNER_XZ_BYTES"
          test "$(sha256sum "$OUT/materializer.sh.xz" | awk '{print $1}')" = "$REPAIRED_RUNNER_XZ_SHA256"
          test "$(git hash-object "$OUT/materializer.sh.xz")" = "$REPAIRED_RUNNER_BLOB"
          xz -t "$OUT/materializer.sh.xz"
          xz -dc "$OUT/materializer.sh.xz" > "$OUT/materializer.sh"
          test "$(wc -c < "$OUT/materializer.sh" | tr -d ' ')" = "$REPAIRED_RUNNER_SOURCE_BYTES"
          test "$(sha256sum "$OUT/materializer.sh" | awk '{print $1}')" = "$REPAIRED_RUNNER_SOURCE_SHA256"
          bash -n "$OUT/materializer.sh"

          grep -Fq "ARCHIVE_SHA256='$PRODUCT_ARCHIVE_SHA256'" "$OUT/materializer.sh"
          grep -Fq "PRODUCT_BRANCH='$PRODUCT_BRANCH'" "$OUT/materializer.sh"
          if grep -Fq 'cat "$OUT"/chunks/part-* > "$OUT/product.tar.xz"' "$OUT/materializer.sh"; then
            echo 'repaired materializer still contains the over-broad chunk glob' >&2
            exit 1
          fi
          python - "$OUT/materializer.sh" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text()
          exact_cat = 'cat "$OUT/chunks/part-00" "$OUT/chunks/part-01" "$OUT/chunks/part-02" "$OUT/chunks/part-03" "$OUT/chunks/part-04" > "$OUT/product.tar.xz"'
          assert exact_cat in text
          for token in ('FAILED_LINE', 'FAILED_COMMAND', 'failed_line:', 'failed_command:'):
              assert token in text, token
          print('glob_repair_and_failure_receipt_surface=pass')
          PY

          python - <<PY > "$OUT/repaired-runner-custody.json"
          import json
          print(json.dumps({
            'schema_version': 'ssc-rd04-five-state-materializer-repair-custody@1',
            'workflow_run': int('${GITHUB_RUN_ID}'),
            'carrier_head': '${GITHUB_SHA}',
            'repaired_runner_git_blob': '${REPAIRED_RUNNER_BLOB}',
            'repaired_runner_xz_bytes': int('${REPAIRED_RUNNER_XZ_BYTES}'),
            'repaired_runner_xz_sha256': '${REPAIRED_RUNNER_XZ_SHA256}',
            'repaired_runner_source_bytes': int('${REPAIRED_RUNNER_SOURCE_BYTES}'),
            'repaired_runner_source_sha256': '${REPAIRED_RUNNER_SOURCE_SHA256}',
            'product_archive_sha256': '${PRODUCT_ARCHIVE_SHA256}',
            'repair_scope': 'replace_over_broad_part_glob_with_five_exact_chunk_paths_and_add_failure_line_command_receipt',
            'product_bytes_changed': False,
            'authority_changed': False,
          }, indent=2, sort_keys=True))
          PY

          chmod 0755 "$OUT/materializer.sh"
          bash "$OUT/materializer.sh"

      - name: Preserve repair and materialization receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-five-state-source-field-adjudication-materialization-v2
          path: |
            /tmp/rd04-five-state-materializer-runner-v2
            /tmp/rd04-five-state-source-field-materializer
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

      - name: Require successful repaired materialization
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.materializer.outcome }}
        run: test "$OUTCOME" = success
