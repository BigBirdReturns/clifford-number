name: Temporary PR 2231 intrinsic phone and strong observation controller v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-intrinsic-phone-strong-observation-v1-repair.py'
      - '.github/workflows/temporary-pr2231-intrinsic-phone-strong-observation-controller-v1.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-intrinsic-phone-strong-observation-v1
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-intrinsic-phone-strong-observation-controller-v1
      REPAIR_PATH: .github/tmp/pr2231-intrinsic-phone-strong-observation-v1-repair.py
      REPAIR_BLOB: 08e8adcddfd588bcea95d5c64d9ecbc669669661
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      CTREE: f7fc52609c1c6b42921c7a4db6e20c4e54c1f99e
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 1a8a885582ab9786d8d6165b615003155d49535d
      PTREE: d4c9c80da9c66477aa679f2a3692d333a96fe24a
      PLIB: e44e4493aeb937f2c2faabe059d25c3a8ce36bb7
      PTEST: e1c10d355b5220319f786fa923a6b201d5c8b7bd
      ELIB: 36a5c1b83956037efaaad94c8fe9d92b7cc210be
      ETEST: 3979cbfc7f63f24e12c8d39aff326f0f9ac65a77
      PREDBRANCH: agent/pr2231-live-authority-custody-controller-v1
      PREDHEAD: bf84b4e5f73d81604b0d249729d2e0fdbf40305a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Qualify and publish intrinsic phone and strong observation repair
        shell: bash
        run: |
          set -euo pipefail

          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-intrinsic-strong-source
          Q=/tmp/pr2231-intrinsic-strong-main
          A=/tmp/pr2231-intrinsic-strong-artifact
          R="$A/receipt.txt"
          mkdir -p "$A"
          : >"$R"

          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$PREDBRANCH:refs/remotes/origin/$PREDBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }
          retain_workspace() {
            if [ -d "$S" ]; then
              git -C "$S" diff --binary -- \
                tools/lib/industrial-exhaust.mjs \
                test/industrial-exhaust.test.js \
                > "$A/candidate.patch" 2>/dev/null || true
              cp "$S/tools/lib/industrial-exhaust.mjs" \
                "$A/industrial-exhaust.mjs" 2>/dev/null || true
              cp "$S/test/industrial-exhaust.test.js" \
                "$A/industrial-exhaust.test.js" 2>/dev/null || true
            fi
          }
          trap retain_workspace EXIT

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq controller-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'.github/tmp/pr2231-intrinsic-phone-strong-observation-v1-repair.py\n.github/workflows/temporary-pr2231-intrinsic-phone-strong-observation-controller-v1.yml'
          require_eq repair-blob \
            "$(git rev-parse "HEAD:$REPAIR_PATH")" "$REPAIR_BLOB"
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths \
            "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq predecessor-controller-head \
            "$(git rev-parse refs/remotes/origin/$PREDBRANCH)" "$PREDHEAD"

          stage exact-product-regression-witnesses
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const predecessorCases = [
            [
              'P1 intrinsic weak-range domestic phone is dropped',
              '050-12345678 03-6216-8041',
              '050-12345678 [contact omitted]'
            ],
            [
              'P1 compact range-shaped domestic phone is dropped',
              '03-62165111 09012345678',
              '03-62165111 [contact omitted]'
            ],
            [
              'P2 labelled hyphen-date pair is partly consumed',
              'Phone: 2026-08-17 2027-09-18',
              'Phone: [contact omitted]-09-18'
            ],
            [
              'P2 labelled slash-date pair is partly consumed',
              'Phone: 2026/08/17 2027/09/18',
              'Phone: [contact omitted]/09/18'
            ],
            [
              'P2 labelled period-date pair is partly consumed',
              'Phone: 2026.08.17 2027.09.18',
              'Phone: [contact omitted].09.18'
            ],
            [
              'P2 fullwidth labelled date pair is partly consumed',
              '電話：２０２６－０８－１７ ２０２７－０９－１８',
              '電話：[contact omitted]－０９－１８'
            ]
          ];
          for (const [name, input, expected] of predecessorCases) {
            const actual = redact(input);
            console.log(JSON.stringify({
              kind: 'exact-predecessor-reproduction', name, input, actual, expected
            }));
            assert.equal(actual, expected, name);
          }
          NODE

          stage apply-repair-and-exact-blob-controls
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          require_eq repair-paths \
            "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq repaired-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$ELIB"
          require_eq repaired-test "$(git hash-object test/industrial-exhaust.test.js)" "$ETEST"
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js

          stage repaired-transition-matrix
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const repairedCases = [
            ['P1 domestic weak-range plus domestic', '050-12345678 03-6216-8041', '[contact omitted] [contact omitted]'],
            ['P1 compact range-shaped plus compact', '03-62165111 09012345678', '[contact omitted] [contact omitted]'],
            ['P1 fullwidth domestic pair', '０５０－１２３４５６７８ ０３－６２１６－８０４１', '[contact omitted] [contact omitted]'],
            ['P1 parenthesized intrinsic weak phone', '(050-12345678) 03-6216-8041', '[contact omitted] [contact omitted]'],
            ['P2 labelled hyphen-date pair', 'Phone: 2026-08-17 2027-09-18', 'Phone: 2026-08-17 2027-09-18'],
            ['P2 labelled slash-date pair', 'Phone: 2026/08/17 2027/09/18', 'Phone: 2026/08/17 2027/09/18'],
            ['P2 labelled period-date pair', 'Phone: 2026.08.17 2027.09.18', 'Phone: 2026.08.17 2027.09.18'],
            ['P2 fullwidth labelled date pair', '電話：２０２６－０８－１７ ２０２７－０９－１８', '電話：２０２６－０８－１７ ２０２７－０９－１８'],
            ['labelled date then local phone', 'Phone: 2026-08-17 555-1212', 'Phone: 2026-08-17 [contact omitted]'],
            ['two labelled dates then local phone', 'Phone: 2026-08-17 2027-09-18 555-1212', 'Phone: 2026-08-17 2027-09-18 [contact omitted]'],
            ['unwrapped unit observation then intrinsic phone', 'Phone: 03-62165111 people 03-6216-8041', 'Phone: 03-62165111 people [contact omitted]'],
            ['external square wrapper observation', 'Phone: [03-62165111 people] 12:30:45 555-1212', 'Phone: [03-62165111 people] 12:30:45 555-1212'],
            ['nested bridge phone', 'Phone: ((03-62165111)) 12:30:45 555-1212', 'Phone: ([contact omitted]) 12:30:45 [contact omitted]'],
            ['labelled weak local remains eligible', 'Phone: 555-1212 03-6216-8041', 'Phone: [contact omitted] [contact omitted]'],
            ['unlabelled weak local remains unclassified', '555-1212 03-6216-8041', '555-1212 [contact omitted]'],
            ['unlabelled generic weak range remains observation', '10-20 03-6216-8041', '10-20 [contact omitted]'],
            ['identifier period suffix remains independent', 'ID: 12345678.03.6216.8041', 'ID: 12345678.[contact omitted]'],
            ['labelled initial wrapped local plus intrinsic phone', 'Phone: (555-1212) 03-6216-8041', 'Phone: [contact omitted] [contact omitted]'],
            ['sentence boundary still expires label lease', 'Phone: 09012345678. 2026-08-17 12:30:45 555-1212', 'Phone: [contact omitted]. 2026-08-17 12:30:45 555-1212'],
            ['bridged callback still cannot renew label lease', 'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212']
          ];
          for (const [name, input, expected] of repairedCases) {
            const actual = redact(input);
            console.log(JSON.stringify({
              kind: 'repaired-transition', name, input, actual, expected
            }));
            assert.equal(actual, expected, name);
          }
          console.log(`REPAIRED_TRANSITION_CASES=${repairedCases.length}`);
          NODE

          stage repaired-industrial-exhaust-suites
          mapfile -t suites < <(
            find test -maxdepth 1 -type f \
              -name 'industrial-exhaust*.test.js' -print | LC_ALL=C sort
          )
          test "${#suites[@]}" -ge 3
          printf '%s\n' "${suites[@]}" | tee "$A/suites.txt"
          for suite in "${suites[@]}"; do
            printf 'RUNNING %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done

          stage exact-main-transplant-and-release
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq transplant-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq transplant-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$ELIB"
          require_eq transplant-test "$(git hash-object test/industrial-exhaust.test.js)" "$ETEST"
          git diff --check
          for suite in "${suites[@]}"; do
            printf 'TRANSPLANT %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage construct-qualified-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: separate intrinsic phones from strong observations'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq qualified-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq qualified-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq qualified-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq qualified-lib "$ALIB" "$ELIB"
          require_eq qualified-test "$ATEST" "$ETEST"
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' \
            "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
          git show --format=fuller --stat HEAD > "$A/qualified-commit.txt"
          git format-patch -1 --stdout > "$A/qualified-product.patch"

          stage final-lease-revalidation-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-predecessor-controller \
            "$(git rev-parse refs/remotes/origin/$PREDBRANCH)" "$PREDHEAD"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin \
            "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$AHEAD"
          require_eq published-parent "$(git rev-parse "$AHEAD^")" "$CPARENT"
          require_eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          require_eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ELIB"
          require_eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ETEST"
          printf 'QUALIFICATION_SUCCESS\nold=%s\nnew=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$PHEAD" "$AHEAD" "$ATREE" "$ELIB" "$ETEST" | tee -a "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-intrinsic-phone-strong-observation-v1
          path: /tmp/pr2231-intrinsic-strong-artifact
          if-no-files-found: error
          retention-days: 90
