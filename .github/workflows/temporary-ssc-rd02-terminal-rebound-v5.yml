name: TEMP rebound exact RD-02 terminal closure v5

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd02-terminal-rebound-v5.yml'
      - '.rd02-terminal-v1/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd02-terminal-rebound-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd02-terminal-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea1776f7bba28b56fee9f3defb1940ef640517a2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Recover carrier, apply exact compatibility rebind, and materialize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          receipt=/tmp/ssc-rd02-terminal-rebound-v5
          repair=/tmp/ssc-rd02-carrier-repair-v5
          carrier=/tmp/ssc-rd02-terminal-carrier-v5
          rm -rf "$receipt" "$repair" "$carrier" /tmp/ssc-rd02-carrier-repair-v5.zip /tmp/rebind-current-atlas-v5.py
          mkdir -p "$receipt" "$repair" "$carrier"
          cat > "$receipt/preflight.json" <<'JSON'
          {
            "schema_version": "ssc-rd02-terminal-rebound-preflight@2",
            "expected_main": "ea1776f7bba28b56fee9f3defb1940ef640517a2",
            "source_head": "c78d243ee3d5c5c9b6c09e4b620bd3192b5e25a1",
            "carrier_repair_artifact": 8882325326,
            "compatibility_patch_sha256": "52650c04cd9cae860d1ccaf98fc11e4ded9e9e53dd0268e5687815aead4bc142",
            "state": "current_atlas_compatibility_rebind_started",
            "completed": false,
            "outside_human_dependency": false,
            "external_contacts": 0,
            "external_reviews": 0
          }
          JSON
          sed -i 's/^          //' "$receipt/preflight.json"

          git fetch origin \
            'refs/heads/agent/ssc-rd02-terminal-materializer-base-v1:refs/remotes/origin/agent/ssc-rd02-terminal-materializer-base-v1'
          git show \
            'origin/agent/ssc-rd02-terminal-materializer-base-v1:.rd02-terminal-v1/rebind-current-atlas-v5.py' \
            > /tmp/rebind-current-atlas-v5.py
          test "$(wc -c < /tmp/rebind-current-atlas-v5.py | tr -d ' ')" = '2635'
          test "$(sha256sum /tmp/rebind-current-atlas-v5.py | awk '{print $1}')" = \
            '5170460b2d70de731ef81ad4216f0e788b68ee17144b68e6cb3086241f0e2fde'

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/BigBirdReturns/clifford-number/actions/artifacts/8882325326/zip' \
            --output /tmp/ssc-rd02-carrier-repair-v5.zip
          test "$(wc -c < /tmp/ssc-rd02-carrier-repair-v5.zip | tr -d ' ')" = '158956'
          test "$(sha256sum /tmp/ssc-rd02-carrier-repair-v5.zip | awk '{print $1}')" = \
            '7574a059caeb804bcb8aa02669175e6e4961121f3b1e324a9a8141da926e1fd6'
          unzip -q /tmp/ssc-rd02-carrier-repair-v5.zip -d "$repair"
          test "$(wc -c < "$repair/repaired-carrier.zip" | tr -d ' ')" = '26950'
          test "$(sha256sum "$repair/repaired-carrier.zip" | awk '{print $1}')" = \
            '3c544be21dc40d3ae30396f66af9fb19a8008365d41ad6ae1d62fd5d2613d5f1'
          test "$(wc -c < "$repair/repaired-carrier.zip.b64" | tr -d ' ')" = '35936'
          test "$(sha256sum "$repair/repaired-carrier.zip.b64" | awk '{print $1}')" = \
            '221a3b05b7caddaafd57463ecf61ee81c7a9a2f50460080091d3f44e24a3eedd'
          unzip -t "$repair/repaired-carrier.zip" > "$receipt/carrier-unzip-test.txt"
          unzip -q "$repair/repaired-carrier.zip" -d "$carrier"
          (cd "$carrier/authored" && sha256sum --check --strict ../authored-sha256.txt) \
            > "$receipt/authored-sha256-check.txt"

          original_script="$carrier/materialize.sh"
          rebound_script="$carrier/materialize-rebound-v5.sh"
          test "$(wc -c < "$original_script" | tr -d ' ')" = '13736'
          test "$(sha256sum "$original_script" | awk '{print $1}')" = \
            '06505572ab94b88c78240e79bd91853acd4eb8a98d7d5309502785d73d717768'
          python /tmp/rebind-current-atlas-v5.py "$original_script" "$rebound_script"
          test "$(wc -c < "$rebound_script" | tr -d ' ')" = '15514'
          test "$(sha256sum "$rebound_script" | awk '{print $1}')" = \
            '4ecd75b5fce42bc07d26fd38859804fc510b474969e5990509aafa82f9a396d2'
          bash -n "$rebound_script"

          cat > "$receipt/rebound-binding.json" <<'JSON'
          {
            "schema_version": "ssc-rd02-terminal-rebound-binding@2",
            "carrier_repair_artifact_id": 8882325326,
            "carrier_repair_artifact_bytes": 158956,
            "carrier_repair_artifact_sha256": "7574a059caeb804bcb8aa02669175e6e4961121f3b1e324a9a8141da926e1fd6",
            "carrier_zip_sha256": "3c544be21dc40d3ae30396f66af9fb19a8008365d41ad6ae1d62fd5d2613d5f1",
            "carrier_base64_sha256": "221a3b05b7caddaafd57463ecf61ee81c7a9a2f50460080091d3f44e24a3eedd",
            "rebinder_bytes": 2635,
            "rebinder_sha256": "5170460b2d70de731ef81ad4216f0e788b68ee17144b68e6cb3086241f0e2fde",
            "compatibility_patch_sha256": "52650c04cd9cae860d1ccaf98fc11e4ded9e9e53dd0268e5687815aead4bc142",
            "patched_validator_sha256": "e57f296913ef2b8129836f416b38016d8a9a7909296219917d73197503a2f354",
            "patched_test_sha256": "ff400d24b30bd5bf1878c80bddd556ef7fdd0d4ef55fa714d217b342716a09ff",
            "original_materializer_bytes": 13736,
            "original_materializer_sha256": "06505572ab94b88c78240e79bd91853acd4eb8a98d7d5309502785d73d717768",
            "rebound_materializer_bytes": 15514,
            "rebound_materializer_sha256": "4ecd75b5fce42bc07d26fd38859804fc510b474969e5990509aafa82f9a396d2",
            "rebound_expected_main": "ea1776f7bba28b56fee9f3defb1940ef640517a2",
            "semantic_product_mutations": 0,
            "atlas_compatibility_mutations": 4,
            "lease_mutations": 1,
            "outside_human_dependency": false,
            "external_contacts": 0,
            "external_reviews": 0
          }
          JSON
          sed -i 's/^          //' "$receipt/rebound-binding.json"

          set +e
          bash -x "$rebound_script" 2>&1 | tee /tmp/ssc-rd02-terminal-rebound-v5-execution.log
          materializer_status="${PIPESTATUS[0]}"
          set -e

          mkdir -p "$receipt"
          cp /tmp/ssc-rd02-terminal-rebound-v5-execution.log "$receipt/execution.log"
          cat > "$receipt/execution-status.json" <<JSON
          {
            "schema_version": "ssc-rd02-terminal-rebound-execution@2",
            "rebound_materializer_sha256": "4ecd75b5fce42bc07d26fd38859804fc510b474969e5990509aafa82f9a396d2",
            "exit_status": ${materializer_status},
            "completed": $([ "$materializer_status" = '0' ] && printf true || printf false),
            "outside_human_dependency": false,
            "external_contacts": 0,
            "external_reviews": 0
          }
          JSON
          sed -i 's/^          //' "$receipt/execution-status.json"
          sha256sum "$receipt/execution.log" > "$receipt/execution.log.sha256"
          exit "$materializer_status"

      - name: Preserve exact rebound materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd02-wave02-terminal-rebound-v5
          path: /tmp/ssc-rd02-terminal-rebound-v5
          if-no-files-found: error
          retention-days: 90
