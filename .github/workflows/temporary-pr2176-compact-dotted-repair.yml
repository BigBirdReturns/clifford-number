name: Temporary PR2176 compact and dotted-contact repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-compact-dotted-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-compact-dotted-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "66b50a673b8dfc5932d0a8c68cd3a805b5e7ee8f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-compact-dotted-repair.yml"

      - name: Apply the compact and dotted-contact repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')

          helper_anchor = 'function internationalAccessPrefixCandidates(value) {'
          helper = dedent(r'''
          function isDottedContactContinuation(value, separator) {
            const normalizedTail = normalizedWrappedNumericTail(value);
            return !YEAR_LIKE_PATTERN.test(normalizedTail)
              && /^\d{3,4}$/u.test(normalizedTail)
              && /^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'));
          }

          ''')
          if library.count(helper_anchor) != 1:
              raise SystemExit('dotted-contact helper anchor did not match exactly once')
          library = library.replace(helper_anchor, helper + helper_anchor, 1)

          compact_anchor = (
              r"  const parenthesized = /\(\s*\d{1,5}\s*\)/u.test(normalized);" "\n"
              r"  const domesticPairGrouped = groups.length >= 4"
          )
          compact_replacement = (
              r"  const parenthesized = /\(\s*\d{1,5}\s*\)/u.test(normalized);" "\n"
              r"  const compactDomestic = groups.length === 1" "\n"
              r"    && (/^0[1-9]\d{8}$/u.test(groups[0])" "\n"
              r"      || /^0(?:50|70|80|90)\d{8}$/u.test(groups[0]));" "\n"
              r"  const domesticPairGrouped = groups.length >= 4"
          )
          if library.count(compact_anchor) != 1:
              raise SystemExit('compact domestic anchor did not match exactly once')
          library = library.replace(compact_anchor, compact_replacement, 1)

          base_anchor = '  if (domesticGrouped || northAmericanGrouped) base = Math.max(base, 550);'
          base_replacement = '  if (compactDomestic || domesticGrouped || northAmericanGrouped) base = Math.max(base, 550);'
          if library.count(base_anchor) != 1:
              raise SystemExit('domestic base anchor did not match exactly once')
          library = library.replace(base_anchor, base_replacement, 1)

          phone_context_anchor = (
              r"        const contextualTail = `${candidate.slice(start).trimStart()}${normalizedSuffix}`.normalize('NFKC');" "\n"
              r"        if (DATE_LIKE_PATTERN.test(normalizedTail)"
          )
          phone_context_replacement = (
              r"        const contextualTail = `${candidate.slice(start).trimStart()}${normalizedSuffix}`.normalize('NFKC');" "\n"
              r"        const contactEnd = groups[index].index + groups[index][0].length;" "\n"
              r"        const dottedContactContinuation = isDottedContactContinuation(tail, separator)" "\n"
              r"          && (extensionContext" "\n"
              r"            || phoneCandidateScore(candidate.slice(0, contactEnd), externalPrefix));" "\n"
              r"        if (DATE_LIKE_PATTERN.test(normalizedTail)"
          )
          if library.count(phone_context_anchor) != 1:
              raise SystemExit('phone dotted-context anchor did not match exactly once')
          library = library.replace(phone_context_anchor, phone_context_replacement, 1)

          phone_boundary = '            || isSentenceSeparatedNumericTail(tail, separator, contextualTail)) return index;'
          phone_boundary_replacement = '            || (!dottedContactContinuation\n              && isSentenceSeparatedNumericTail(tail, separator, contextualTail))) return index;'
          if library.count(phone_boundary) != 1:
              raise SystemExit('phone numeric-boundary anchor did not match exactly once')
          library = library.replace(phone_boundary, phone_boundary_replacement, 1)

          extension_context_anchor = (
              r"        const contextualTail = `${extension.slice(start).trimStart()}${normalizedSuffix}`.normalize('NFKC');" "\n"
              r"        if (isSentenceSeparatedNumericTail(tail, separator, contextualTail)"
          )
          extension_context_replacement = (
              r"        const contextualTail = `${extension.slice(start).trimStart()}${normalizedSuffix}`.normalize('NFKC');" "\n"
              r"        const dottedExtensionContinuation = isDottedContactContinuation(tail, separator);" "\n"
              r"        if ((!dottedExtensionContinuation" "\n"
              r"              && isSentenceSeparatedNumericTail(tail, separator, contextualTail))"
          )
          if library.count(extension_context_anchor) != 1:
              raise SystemExit('extension dotted-context anchor did not match exactly once')
          library = library.replace(extension_context_anchor, extension_context_replacement, 1)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')

          compact_test_anchor = "for (const multiGroupDomestic of ["
          compact_tests = dedent('''
          for (const compactDomestic of [
            '0362168041',
            '05012345678',
            '07012345678',
            '08012345678',
            '09012345678',
            '０９０１２３４５６７８'
          ]) {
            assert.equal(
              redactContactData(compactDomestic),
              '[contact omitted]',
              'compact domestic telephone numbers must be redacted at clean token boundaries'
            );
          }
          for (const compactNumericIdentifier of [
            '1234567890',
            '00012345678',
            '2026081701',
            'release09012345678',
            'GUID0362168041'
          ]) {
            assert.equal(
              redactContactData(compactNumericIdentifier),
              compactNumericIdentifier,
              'non-domestic or attached compact numeric identifiers must remain intact'
            );
          }
          ''')
          if tests.count(compact_test_anchor) != 1:
              raise SystemExit('compact domestic test anchor did not match exactly once')
          tests = tests.replace(compact_test_anchor, compact_tests + compact_test_anchor, 1)

          dotted_test_anchor = (
              "assert.equal(\n"
              "  redactContactData('Tel: +44 20 7123. 4567'),"
          )
          dotted_tests = dedent('''
          assert.equal(
            redactContactData('Tel: +44 20 7123. 4567 office hours apply.'),
            'Tel: [contact omitted] office hours apply.',
            'narrative text after a four-digit dotted phone group must not expose that group'
          );
          assert.equal(
            redactContactData('Tel: +49 30 1234. 567 office hours apply.'),
            'Tel: [contact omitted] office hours apply.',
            'narrative text after a three-digit dotted phone group must not expose that group'
          );
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 1234. 5678 is the extension.'),
            'Tel: [contact omitted] ext [contact omitted] is the extension.',
            'narrative text after a dotted extension group must not expose that group'
          );
          assert.equal(
            redactContactData('Contact +44 20 7123. 4567 people attended.'),
            'Contact [contact omitted]. 4567 people attended.',
            'strong unit-labelled observation evidence must override the dotted-contact tie-break'
          );
          ''')
          if tests.count(dotted_test_anchor) != 1:
              raise SystemExit('dotted contact test anchor did not match exactly once')
          tests = tests.replace(dotted_test_anchor, dotted_tests + dotted_test_anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-compact-dotted-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-compact-dotted-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): cover compact and dotted contacts"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
