name: Temporary materialize M-05 Sprint 03 Leg 01

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-m05-s03-l1.yml'
  push:
    branches:
      - agent/m05-sprint-03-leg-01-answer-constitution
    paths:
      - '.github/workflows/temporary-materialize-m05-s03-l1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-01-answer-constitution
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate Answerable Power Constitution
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-01.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-01.mjs
          node test/m05-answerable-power-sprint-03-leg-01.test.js
      - name: Commit generated products
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/core-thesis/answerable-power/sprint-03-leg-01.json reports/core-thesis/answerable-power/sprint-03-leg-01.html
          if git diff --cached --quiet; then
            echo 'No generated drift'
          else
            git commit -m 'Materialize the Answerable Power Constitution report'
            git push origin HEAD:agent/m05-sprint-03-leg-01-answer-constitution
          fi
