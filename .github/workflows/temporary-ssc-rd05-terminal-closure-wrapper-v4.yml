name: TEMP replay exact RD-05 terminal closure v4

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd05-terminal-closure-wrapper-v4.yml'
      - '.rd05-closure/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd05-terminal-closure-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd05-terminal-closure-materializer-trigger-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_WORKFLOW_REF: agent/ssc-rd05-terminal-closure-materializer-base-v2
      SOURCE_WORKFLOW_PATH: .github/workflows/temporary-ssc-rd05-terminal-closure-materializer-v2.yml
      TARGET_BRANCH: agent/ssc-rd-wave02-rd05-recommendation-disposition
      EXPECTED_START_SHA: 03d0c627308b86ad75e8cdad6a90756c97e592ce
      CARRIER_BRANCH: agent/ssc-rd05-terminal-closure-materializer-base-v2
      CLASSIFICATION_PATH: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/object-semantic-classification.json
      CLASSIFICATION_SHA256: ed35fbd41027497742d5db4473d8675978d37eab52f95c35628616aa7fba6f13
      CENSUS_ARTIFACT_ID: '8852846428'
      CENSUS_ARTIFACT_SHA256: 9a7524164ad5594ac720ec914a84812005aef8e79d0a82ebb561b268089c08fb
      CENSUS_MANIFEST_SHA256: 0fb07dd92ff7e8c27a7e4b3e6b3db18842538516b1badd05afe194fd07446c32
      CENSUS_DEST: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/source-custody/successor-census-v1
      EXECUTION_RECEIPT_PATH: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/successor-census-execution-receipt.json
      PRODUCT_ROOT: data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition
      CLOSURE_REFERENCE_PATH: data/project/ssc-residual-wave02/closures/RD-05-C03.json
      SOURCE_ZIP_SHA256: c981742e18fd69f30235ae234c89f3d48f1b73447c55237d2da4960d07b37360
      SOURCE_BASE64_SHA256: 635c6db190fb11f1bd5e8cb74925845e71553408c0ee46782c52dc02ccf92be7
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd05-recommendation-disposition
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract exact v2 transaction and import its complete environment
        run: |
          set -Eeuo pipefail
          git rev-parse --verify "refs/remotes/origin/${SOURCE_WORKFLOW_REF}"
          git show "origin/${SOURCE_WORKFLOW_REF}:${SOURCE_WORKFLOW_PATH}" > /tmp/rd05-v2-workflow.yml
          test "$(sha256sum /tmp/rd05-v2-workflow.yml | awk '{print $1}')" = '27bb1b4abf8f2aa87dd809d8c8617b0c14d3455f7b6695b5a654999e52852226'

          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/rd05-v2-workflow.yml').read_text().splitlines()
          scripts = []
          index = 0
          while index < len(source):
              if source[index] == '        run: |':
                  index += 1
                  body = []
                  while index < len(source):
                      line = source[index]
                      if line.startswith('          ') or line == '':
                          body.append(line[10:] if line.startswith('          ') else '')
                          index += 1
                          continue
                      break
                  scripts.append('\n'.join(body).rstrip() + '\n')
                  continue
              index += 1

          assert len(scripts) == 6, len(scripts)
          old = 'git fetch origin "refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"'
          new = 'git rev-parse --verify "refs/remotes/origin/${CARRIER_BRANCH}"'
          assert scripts[0].count(old) == 1
          scripts[0] = scripts[0].replace(old, new)
          scripts[-1] = scripts[-1].replace(
              "ssc-rd05-wave02-terminal-closure-materializer-receipt@2",
              "ssc-rd05-wave02-terminal-closure-materializer-receipt@4",
          )
          for ordinal, script in enumerate(scripts, 1):
              path = Path(f'/tmp/rd05-v4-step-{ordinal:02d}.sh')
              path.write_text('#!/usr/bin/env bash\n' + script)
              path.chmod(0o755)
          print('extracted six exact run steps; imported full transaction env; repaired one redundant fetch; receipt schema advanced to v4')
          PY

      - name: Execute exact terminal-closure transaction
        run: |
          set -Eeuo pipefail
          for script in /tmp/rd05-v4-step-*.sh; do
            echo "executing ${script}"
            "$script"
            if test -s "$GITHUB_ENV"; then
              set -a
              # shellcheck disable=SC1090
              source "$GITHUB_ENV"
              set +a
            fi
          done

      - name: Upload exact RD-05 terminal closure receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd05-terminal-closure-materializer-v4
          path: ssc-rd05-terminal-closure-materializer-receipt.json
          if-no-files-found: error
          retention-days: 90
