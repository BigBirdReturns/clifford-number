name: TEMP recover exact RD-04 postpromotion five-route V3 archive

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-recover-ssc-rd04-postpromotion-five-route-v3-archive-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref == 'observer/ssc-rd04-postpromotion-five-route-v3-archive-recovery-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OBSERVED_MAIN: a18f19ddc923e553848a5165cdf29fb1b9add97a
      QUALIFIER_BRANCH: observer/ssc-rd04-postpromotion-five-route-v3-archive-recovery-v1
      QUALIFIER_WORKFLOW: .github/workflows/temp-recover-ssc-rd04-postpromotion-five-route-v3-archive-v1.yml
      V3_BRANCH: agent/ssc-rd04-postpromotion-five-route-adjudication-materializer-v3
      V3_HEAD: f8db0944e76c87a2baf337ce96694e0947f341b0
      V3_PARENT: 52017c9522c92d097a6831c7acaece15d950199e
      PRODUCT_PARENT: 91b386df809079884825b19a6b5d864b6e739172
      PRODUCT_PARENT_TREE: 7825098153b33c15418c973d1d04ff22eb50e015
      CHUNK_ROOT: .tmp/ssc-rd04-postpromotion-five-route-adjudication-v1
      ARCHIVE_BYTES: '24972'
      ARCHIVE_SHA256: 376ddae342dad3829c17412c11db5aaae7b692eefc5aa2573b7c47b4aa231662
      MANIFEST_BLOB: 35b45ee0946fa0fe344d2ec8b3fffbb0e0607d1b
      WORKFLOW_BLOB: 6e85ed36416821131bbd5ddc9ee3b579a25859d6
      DATA_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication
      SCHEMA_REL: schemas/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.schema.json
      BUILDER_REL: tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.mjs
      VALIDATOR_REL: tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.mjs
      TEST_REL: test/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.test.js
      PERMANENT_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.yml
      MANIFEST_REL: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication/product-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1' 'PyYAML==6.0.2'

      - name: Reconstruct and qualify exact V3 product archive
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-five-route-v3-archive-recovery-v1"
          EXTRACT="$OUT/product"
          WORK="$RUNNER_TEMP/ssc-rd04-postpromotion-five-route-v3-product-worktree"
          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT/chunks" "$EXTRACT"
          printf 'initializing\n' > "$OUT/STAGE"
          printf 'source_requests=0\nroute_executions=0\nnew_transport_captures=0\nsource_admissions=0\nfield_classifications=0\nfield_terminalizations=0\nmatrix_updates=0\nrow_state_mutations=0\nclass_closed=false\ncumulative_ledger_effect=none\noutside_human_dependency=false\npublication_effect=none\nadoption_effect=none\ngraph_effect=none\n' > "$OUT/BOUNDARY"

          finalize() {
            rc="$?"
            trap - EXIT
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            if test -d "$WORK"; then
              git -C "$WORK" rev-parse HEAD > "$OUT/candidate-head-final.txt" 2>/dev/null || true
              git -C "$WORK" rev-parse 'HEAD^{tree}' > "$OUT/candidate-tree-final.txt" 2>/dev/null || true
              git -C "$WORK" status --porcelain=v1 --untracked-files=all > "$OUT/candidate-status-final.txt" 2>/dev/null || true
            fi
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          focused_validate() {
            node --check "$BUILDER_REL"
            node --check "$VALIDATOR_REL"
            node --check "$TEST_REL"
            python - <<'PYYAML'
          import os
          from pathlib import Path
          import yaml
          value = yaml.safe_load(Path(os.environ['PERMANENT_WORKFLOW']).read_text())
          if not isinstance(value, dict):
              raise SystemExit('permanent workflow did not parse to an object')
          print('workflow_yaml_parse=pass')
          PYYAML
            node "$BUILDER_REL"
            git diff --exit-code -- "$DATA_ROOT"
            python - <<'PYSCHEMA'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path(os.environ['SCHEMA_REL']).read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          root = Path(os.environ['DATA_ROOT'])
          names = [
              'capture-custody.json',
              'source-adjudications.json',
              'field-adjudications.json',
              'pdf-review-receipts.json',
              'promotion-candidate-protocol.json',
              'selected-followup-protocol.json',
              'index.json',
              'product-manifest.json',
          ]
          for name in names:
              value = json.loads((root / name).read_text())
              errors = sorted(validator.iter_errors(value), key=lambda error: list(error.path))
              if errors:
                  error = errors[0]
                  raise SystemExit(f'{name}: {error.message} at {list(error.path)}')
          print(f'recursive_schema_validation=pass objects={len(names)}')
          PYSCHEMA
            node "$VALIDATOR_REL"
            node "$TEST_REL"
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
          }

          printf 'binding-one-path-observer\n' > "$OUT/STAGE"
          git rev-parse HEAD > "$OUT/qualifier-head.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/qualifier-tree.txt"
          test "${{ github.event_name }}" != pull_request || test "${{ github.event.pull_request.head.ref }}" = "$QUALIFIER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$OBSERVED_MAIN"
          test "$(git rev-list --count "$OBSERVED_MAIN"..HEAD)" -eq 1
          printf '%s\n' "$QUALIFIER_WORKFLOW" > "$OUT/expected-qualifier-paths.txt"
          git diff --name-only --diff-filter=ACDMRTUXB "$OBSERVED_MAIN" HEAD | sort > "$OUT/actual-qualifier-paths.txt"
          git diff --name-only --diff-filter=A "$OBSERVED_MAIN" HEAD | sort > "$OUT/added-qualifier-paths.txt"
          diff -u "$OUT/expected-qualifier-paths.txt" "$OUT/actual-qualifier-paths.txt"
          diff -u "$OUT/expected-qualifier-paths.txt" "$OUT/added-qualifier-paths.txt"
          git diff --check "$OBSERVED_MAIN" HEAD

          printf 'binding-live-main-v3-carrier-and-product-parent\n' > "$OUT/STAGE"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$V3_BRANCH:refs/remotes/origin/$V3_BRANCH"
          V3_REF="refs/remotes/origin/$V3_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$OBSERVED_MAIN"
          test "$(git rev-parse "$V3_REF")" = "$V3_HEAD"
          test "$(git rev-parse "$V3_REF^")" = "$V3_PARENT"
          test "$(git rev-parse "$PRODUCT_PARENT^{tree}")" = "$PRODUCT_PARENT_TREE"

          printf 'authenticating-seven-product-archive-shards\n' > "$OUT/STAGE"
          cat > "$OUT/chunk-ledger.txt" <<'EOF_CHUNKS'
          chunk-00.b64 5000 160e09448b4b9320c43f51d6f5e253f4d49ac7120eeca865082e251847bb7304
          chunk-01.b64 5000 c4c29e127cedd6bdbb62259f20ef9a4d5f1f651d7c372522439751b9353eda0c
          chunk-02.b64 5000 ab2e21989347ab0af2d3195384e5f50dd92c183165ace8b7570ea126d869c5c1
          chunk-03.b64 5000 366a1c6554e1ad3c51c96cd65ec1af867a5e20eb87a40c997fa08612ffc25ec0
          chunk-04.b64 5000 7b8761d0801b15c1e5445fe6940078ed1437361a8dc30277a82fd1f240ef2ec9
          chunk-05.b64 5000 5c9433351969f979f5597cb38163f66f76d6d08df515fa9b0aa55875fb39f1d5
          chunk-06.b64 3296 adc4ccd38c71c481b1d31add83401b216b781e2e5e8ab9e5ccc81718e9454da7
          EOF_CHUNKS
          : > "$OUT/product.tar.xz.b64"
          while read -r name bytes digest; do
            git show "$V3_HEAD:$CHUNK_ROOT/$name" > "$OUT/chunks/$name"
            test "$(stat -c %s "$OUT/chunks/$name")" -eq "$bytes"
            test "$(sha256sum "$OUT/chunks/$name" | cut -d' ' -f1)" = "$digest"
            cat "$OUT/chunks/$name" >> "$OUT/product.tar.xz.b64"
          done < "$OUT/chunk-ledger.txt"
          test "$(stat -c %s "$OUT/product.tar.xz.b64")" -eq 33296
          base64 --decode "$OUT/product.tar.xz.b64" > "$OUT/product.tar.xz"
          test "$(stat -c %s "$OUT/product.tar.xz")" -eq "$ARCHIVE_BYTES"
          test "$(sha256sum "$OUT/product.tar.xz" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          xz --test "$OUT/product.tar.xz"

          printf 'extracting-safe-fourteen-path-product\n' > "$OUT/STAGE"
          python - "$OUT/product.tar.xz" "$EXTRACT" <<'PYTAR'
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          extract = Path(sys.argv[2])
          with tarfile.open(archive, mode='r:xz') as bundle:
              files = [member for member in bundle.getmembers() if member.isfile()]
              paths = []
              for member in files:
                  if not member.name.startswith('./'):
                      raise SystemExit(f'non-relative archive path: {member.name}')
                  relative = member.name[2:]
                  pure = PurePosixPath(relative)
                  if pure.is_absolute() or '..' in pure.parts or relative.startswith('.tmp/') or '.trigger' in pure.parts:
                      raise SystemExit(f'unsafe archive path: {relative}')
                  paths.append(relative)
              if len(paths) != 14 or len(set(paths)) != 14:
                  raise SystemExit(f'archive path denominator mismatch: {len(paths)}')
              bundle.extractall(extract)
          print('safe_archive_extract=pass files=14')
          PYTAR
          (cd "$EXTRACT" && find . -type f -printf '%P\n' | sort) > "$OUT/archive-paths.txt"
          test "$(wc -l < "$OUT/archive-paths.txt")" -eq 14

          printf 'authenticating-product-manifest-and-file-identities\n' > "$OUT/STAGE"
          test "$(git hash-object "$EXTRACT/$MANIFEST_REL")" = "$MANIFEST_BLOB"
          test "$(git hash-object "$EXTRACT/$PERMANENT_WORKFLOW")" = "$WORKFLOW_BLOB"
          python - "$EXTRACT" "$OUT/archive-paths.txt" <<'PYMANIFEST'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          archive_paths = Path(sys.argv[2]).read_text().splitlines()
          manifest_rel = 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication/product-manifest.json'
          manifest = json.loads((root / manifest_rel).read_text())
          paths = sorted(manifest['permanent_paths'])
          if manifest['permanent_path_count'] != 14 or paths != archive_paths:
              raise SystemExit('manifest/archive path denominator mismatch')
          if manifest.get('addition_only') is not True or manifest.get('modified_paths') != 0 or manifest.get('deleted_paths') != 0:
              raise SystemExit('manifest addition-only boundary mismatch')
          rows = manifest['hashed_files']
          if manifest['hashed_file_count'] != 13 or len(rows) != 13:
              raise SystemExit('manifest hash denominator mismatch')
          row_paths = sorted(row['path'] for row in rows)
          expected_rows = sorted(path for path in paths if path != manifest_rel)
          if row_paths != expected_rows:
              raise SystemExit('manifest hashed path set mismatch')
          for row in rows:
              path = root / row['path']
              data = path.read_bytes()
              observed_sha = hashlib.sha256(data).hexdigest()
              observed_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              if len(data) != row['bytes'] or observed_sha != row['sha256'] or observed_blob != row['git_blob']:
                  raise SystemExit(f"manifest identity mismatch: {row['path']}")
          print('manifest_identity_validation=pass paths=14 hashed=13')
          PYMANIFEST

          printf 'constructing-exact-one-parent-product-candidate\n' > "$OUT/STAGE"
          git worktree add --detach "$WORK" "$PRODUCT_PARENT"
          while IFS= read -r path; do test ! -e "$WORK/$path"; done < "$OUT/archive-paths.txt"
          cp -a "$EXTRACT"/. "$WORK"/
          cd "$WORK"
          git config user.name 'OpenAI Observer'
          git config user.email 'openai-observer@users.noreply.github.com'
          git config commit.gpgsign false
          while IFS= read -r path; do git add -- "$path"; done < "$OUT/archive-paths.txt"
          git diff --cached --name-only --diff-filter=ACDMRTUXB | sort > "$OUT/candidate-paths.txt"
          git diff --cached --name-only --diff-filter=A | sort > "$OUT/candidate-added-paths.txt"
          diff -u "$OUT/archive-paths.txt" "$OUT/candidate-paths.txt"
          diff -u "$OUT/archive-paths.txt" "$OUT/candidate-added-paths.txt"
          git diff --cached --check
          git commit -m 'Adjudicate RD-04 postpromotion five-route capture' -m 'Admit four narrow official sources, preserve six bounded field decisions with four promotion candidates and two held fields, publish two follow-up routes, and create no automatic matrix, row-state, class, cumulative-ledger, publication, adoption, graph, or outside-human effect.'
          CANDIDATE="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$CANDIDATE" > "$OUT/candidate-head.txt"
          printf '%s\n' "$CANDIDATE_TREE" > "$OUT/candidate-tree.txt"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_PARENT"
          test "$(git rev-list --count "$PRODUCT_PARENT"..HEAD)" -eq 1
          git diff --name-only --diff-filter=ACDMRTUXB "$PRODUCT_PARENT" HEAD | sort > "$OUT/committed-paths.txt"
          git diff --name-only --diff-filter=A "$PRODUCT_PARENT" HEAD | sort > "$OUT/committed-added-paths.txt"
          diff -u "$OUT/archive-paths.txt" "$OUT/committed-paths.txt"
          diff -u "$OUT/archive-paths.txt" "$OUT/committed-added-paths.txt"

          printf 'running-focused-and-complete-gates\n' > "$OUT/STAGE"
          focused_validate
          npm run release:check

          printf 'proving-clean-deterministic-replay\n' > "$OUT/STAGE"
          git reset --hard HEAD
          git clean -fdx
          node "$BUILDER_REL" --write
          focused_validate
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          printf 'writing-recovery-receipt\n' > "$OUT/STAGE"
          cd "$GITHUB_WORKSPACE"
          python - "$OUT" <<'PYRECEIPT'
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          receipt = {
              'schema_version': 'ssc-rd04-postpromotion-five-route-v3-archive-recovery@1',
              'qualifier_head': (out / 'qualifier-head.txt').read_text().strip(),
              'observed_main': 'a18f19ddc923e553848a5165cdf29fb1b9add97a',
              'v3_carrier_head': 'f8db0944e76c87a2baf337ce96694e0947f341b0',
              'v3_carrier_parent': '52017c9522c92d097a6831c7acaece15d950199e',
              'product_parent': '91b386df809079884825b19a6b5d864b6e739172',
              'product_parent_tree': '7825098153b33c15418c973d1d04ff22eb50e015',
              'product_archive_bytes': 24972,
              'product_archive_sha256': '376ddae342dad3829c17412c11db5aaae7b692eefc5aa2573b7c47b4aa231662',
              'candidate_head': (out / 'candidate-head.txt').read_text().strip(),
              'candidate_tree': (out / 'candidate-tree.txt').read_text().strip(),
              'permanent_paths': (out / 'archive-paths.txt').read_text().splitlines(),
              'permanent_path_count': 14,
              'ordinary_path_count': 13,
              'workflow_path_count': 1,
              'added_paths': 14,
              'modified_paths': 0,
              'deleted_paths': 0,
              'transport_attempts_observed': 10,
              'unique_body_identities': 5,
              'narrow_source_admissions': 4,
              'field_decisions': 6,
              'promotion_candidates': 4,
              'held_fields': 2,
              'followup_routes': 2,
              'source_requests_executed_by_recovery': 0,
              'field_classifications_created': 0,
              'field_terminalizations_created': 0,
              'matrix_updates': 0,
              'row_state_mutations': 0,
              'class_closed': False,
              'cumulative_ledger_effect': 'none',
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'recursive_schema_objects': 8,
              'focused_gate': 'pass',
              'complete_release_gate': 'pass',
              'clean_deterministic_replay': 'pass',
              'authority': 'recovered_candidate_only',
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PYRECEIPT
          printf 'complete\n' > "$OUT/STAGE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-rd04-postpromotion-five-route-v3-archive-recovery-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-five-route-v3-archive-recovery-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
