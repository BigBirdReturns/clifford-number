name: TEMP M-04G v8 committed-payload audit

on:
  push:
    branches:
      - agent/m04g-escwa-original-route-recovery-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out committed workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract, salvage, and compile committed controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification
          python3 - <<'PY'
          import ast
          import base64
          import gzip
          import hashlib
          import json
          import pathlib
          import py_compile
          import re
          import struct
          import zlib

          source_path = pathlib.Path('.github/workflows/temporary-m04g-escwa-original-route-recovery-v5.yml')
          source = source_path.read_text()
          match = re.search(r'encoded\s*=\s*"""(.*?)"""', source, re.S)
          if not match:
              raise SystemExit('embedded controller payload not found')
          encoded = ''.join(match.group(1).split())
          compressed = base64.b64decode(encoded, validate=True)
          pathlib.Path('qualification/controller.py.gz').write_bytes(compressed)

          def gzip_deflate_bounds(data):
              if len(data) < 18 or data[:2] != b'\x1f\x8b' or data[2] != 8:
                  raise ValueError('unsupported gzip header')
              flags = data[3]
              pos = 10
              if flags & 4:
                  if pos + 2 > len(data):
                      raise ValueError('truncated gzip extra length')
                  extra_len = struct.unpack('<H', data[pos:pos + 2])[0]
                  pos += 2 + extra_len
              for flag in (8, 16):
                  if flags & flag:
                      end = data.find(b'\0', pos)
                      if end < 0:
                          raise ValueError('unterminated gzip string field')
                      pos = end + 1
              if flags & 2:
                  pos += 2
              if pos >= len(data) - 8:
                  raise ValueError('invalid gzip member bounds')
              return pos, len(data) - 8

          gzip_valid = True
          gzip_error = None
          try:
              raw = gzip.decompress(compressed)
          except Exception as error:
              gzip_valid = False
              gzip_error = f'{type(error).__name__}: {error}'
              start, end = gzip_deflate_bounds(compressed)
              raw = zlib.decompress(compressed[start:end], -zlib.MAX_WBITS)

          controller = pathlib.Path('qualification/controller.py')
          controller.write_bytes(raw)
          expected_crc, expected_size = struct.unpack('<II', compressed[-8:])
          actual_crc = zlib.crc32(raw) & 0xFFFFFFFF
          actual_size = len(raw) & 0xFFFFFFFF
          syntax_valid = True
          syntax_error = None
          imports = []
          try:
              py_compile.compile(str(controller), doraise=True)
              tree = ast.parse(raw.decode('utf-8'), filename=str(controller))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.append(node.module or '')
          except Exception as error:
              syntax_valid = False
              syntax_error = f'{type(error).__name__}: {error}'

          text = raw.decode('utf-8', errors='replace')
          lines = text.splitlines()
          receipt = {
              'schema': 'm04g-v8-committed-payload-audit@2',
              'workflow_sha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
              'compressed_sha256': hashlib.sha256(compressed).hexdigest(),
              'controller_sha256': hashlib.sha256(raw).hexdigest(),
              'intended_controller_sha256': 'ae2a604167683b943487c8c8584dbb206dda3d6497dbd02f383d8ebe44c6103d',
              'matches_intended_controller': hashlib.sha256(raw).hexdigest() == 'ae2a604167683b943487c8c8584dbb206dda3d6497dbd02f383d8ebe44c6103d',
              'gzip_valid': gzip_valid,
              'gzip_error': gzip_error,
              'gzip_footer_crc32': f'{expected_crc:08x}',
              'recovered_crc32': f'{actual_crc:08x}',
              'crc_matches': expected_crc == actual_crc,
              'gzip_footer_size': expected_size,
              'recovered_size_mod32': actual_size,
              'size_matches': expected_size == actual_size,
              'controller_bytes': len(raw),
              'controller_lines': len(lines),
              'syntax_valid': syntax_valid,
              'syntax_error': syntax_error,
              'imports': sorted(set(imports)),
              'first_lines': lines[:12],
              'last_lines': lines[-12:],
              'product_files_modified': False,
          }
          pathlib.Path('qualification/audit.json').write_text(json.dumps(receipt, indent=2) + '\n')
          pathlib.Path('qualification/controller.sha256').write_text(receipt['controller_sha256'] + '  controller.py\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload committed controller audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-v8-committed-payload-audit-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
