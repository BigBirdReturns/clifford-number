name: Temporary PR2176 final contact edge repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - '.github/workflows/temporary-pr2176-final-contact-edge-repair.yml'

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-final-contact-edge-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d94f74b5199dca0050e7acdcca4126faf48ce505"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-final-contact-edge-repair.yml"
      - name: Apply repair or write diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import traceback

          diagnostic = Path('.github/pr2176-final-contact-edge-repair-diagnostic.txt')
          diagnostic.unlink(missing_ok=True)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label} anchor count was {count}, expected 1')
              return text.replace(old, new, 1)

          def insert_after_assertion(text, message, block, label):
              message_index = text.find(message)
              if message_index < 0:
                  raise RuntimeError(f'{label} message marker was absent')
              statement_end = text.find('\n);', message_index)
              if statement_end < 0:
                  raise RuntimeError(f'{label} assertion terminator was absent')
              insertion = statement_end + len('\n);')
              return text[:insertion] + '\n' + block + text[insertion:]

          try:
              library_path = Path('tools/lib/industrial-exhaust.mjs')
              library = library_path.read_text(encoding='utf-8')

              library = replace_once(
                  library,
                  r'''const PHONE_EXTENSION_PATTERN = /(\[contact omitted\][\s,;:()（）\-–—]*(?:(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?\s*)|(?:内線(?:番号)?\s*[:：#＃]?\s*)|(?:[#＃]\s*))(?:[（(]\s*)?)[0-9０-９]+(?:[()./／\s\-‐‑‒–—−－．（）]+[0-9０-９]+)*/giu;''',
                  r'''const PHONE_EXTENSION_PATTERN = /(\[contact omitted\][\s,;:()（）.．。\-–—]*(?:(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?\s*)|(?:内線(?:番号)?\s*[:：#＃]?\s*)|(?:[#＃]\s*))(?:[（(]\s*)?)[0-9０-９]+(?:[()./／\s\-‐‑‒–—−－．（）]+[0-9０-９]+)*/giu;''',
                  'extension pattern'
              )
              library = replace_once(
                  library,
                  r'''const PHONE_EXTENSION_SUFFIX_PATTERN = /^\s*[,;:()（）\-–—]*(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?|内線(?:番号)?\s*[:：#＃]?|[#＃])\s*(?:[（(]\s*)?[0-9０-９]/iu;''',
                  r'''const PHONE_EXTENSION_SUFFIX_PATTERN = /^\s*[,;:()（）.．。\-–—]*(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?|内線(?:番号)?\s*[:：#＃]?|[#＃])\s*(?:[（(]\s*)?[0-9０-９]/iu;''',
                  'extension suffix pattern'
              )
              library = replace_once(
                  library,
                  r'''function isDottedContactContinuation(value, separator) {
            const normalizedTail = normalizedWrappedNumericTail(value);
            return !/^(?:19|20)\d{2}$/u.test(normalizedTail)
              && /^\d{3,4}$/u.test(normalizedTail)
              && /^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'));
          }''',
                  r'''function isDottedContactContinuation(value, separator, groups, index) {
            const normalizedTail = normalizedWrappedNumericTail(value);
            if (/^(?:19|20)\d{2}$/u.test(normalizedTail)) return false;
            if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'))) {
              return false;
            }
            if (/^\d{3,4}$/u.test(normalizedTail)) return true;
            if (!/^\d{2}$/u.test(normalizedTail) || index < 3) return false;
            return groups.slice(index - 3, index + 1).every(group =>
              /^\d{2}$/u.test(group[0].normalize('NFKC'))
            );
          }''',
                  'dotted continuation helper'
              )
              if library.count('isDottedContactContinuation(tail, separator)') != 2:
                  raise RuntimeError('dotted continuation call count was not two')
              library = library.replace(
                  'isDottedContactContinuation(tail, separator)',
                  'isDottedContactContinuation(tail, separator, groups, index)'
              )

              test_path = Path('test/industrial-exhaust.test.js')
              tests = test_path.read_text(encoding='utf-8')
              tests = insert_after_assertion(
                  tests,
                  'parenthesized grouped extension digits must be fully redacted',
                  r'''assert.equal(
            redactContactData('Tel: +44 20 7123 4567. Ext. 1234'),
            'Tel: [contact omitted]. Ext. [contact omitted]',
            'an explicit extension marker must retain authority across an ASCII sentence dot'
          );
          assert.equal(
            redactContactData('電話番号03-6216-8041．内線１２３４'),
            '電話番号[contact omitted]．内線[contact omitted]',
            'a Japanese extension marker must retain authority across a fullwidth sentence dot'
          );
          assert.equal(
            redactContactData('電話番号03-6216-8041。内線１２３４'),
            '電話番号[contact omitted]。内線[contact omitted]',
            'a Japanese extension marker must retain authority across an ideographic full stop'
          );''',
                  'sentence-dot extension tests'
              )
              tests = insert_after_assertion(
                  tests,
                  'narrative text after a three-digit dotted phone group must not expose that group',
                  r'''assert.equal(
            redactContactData('Tel: +33 1 42 68 53. 00 office hours apply.'),
            'Tel: [contact omitted] office hours apply.',
            'narrative text after a two-digit pair-group phone ending must not expose that group'
          );
          assert.equal(
            redactContactData('Tel: +33 1 42 68 53. 00'),
            'Tel: [contact omitted]',
            'a two-digit dotted pair-group ending must remain in the phone span'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53. 00 people attended.'),
            'Contact [contact omitted]. 00 people attended.',
            'strong unit-labelled evidence must override a two-digit dotted pair-group tie-break'
          );''',
                  'two-digit dotted phone tests'
              )

              library_path.write_text(library, encoding='utf-8')
              test_path.write_text(tests, encoding='utf-8')
          except Exception:
              diagnostic.write_text(traceback.format_exc(), encoding='utf-8')
          PY
      - name: Validate repair or append diagnostic
        shell: bash
        run: |
          set -uo pipefail
          if test -f .github/pr2176-final-contact-edge-repair-diagnostic.txt; then
            exit 0
          fi
          {
            node --check tools/lib/industrial-exhaust.mjs &&
            node --check tools/crawl-industrial-exhaust.mjs &&
            node --check test/industrial-exhaust.test.js &&
            node test/industrial-exhaust.test.js &&
            git diff --check
          } > /tmp/pr2176-validation.log 2>&1
          status=$?
          if test "$status" -ne 0; then
            {
              printf 'validation_exit=%s\n' "$status"
              cat /tmp/pr2176-validation.log
            } > .github/pr2176-final-contact-edge-repair-diagnostic.txt
          fi
          exit 0
      - name: Publish repair or diagnostic and remove runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-final-contact-edge-repair.yml
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-final-contact-edge-repair.yml
          if test -f .github/pr2176-final-contact-edge-repair-diagnostic.txt; then
            git add .github/pr2176-final-contact-edge-repair-diagnostic.txt
            message="Publish PR2176 final contact repair diagnostic"
          else
            message="Redact dotted extensions and pair-group endings"
          fi
          git diff --cached --check
          git commit -m "$message"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
