name: Project stable-ground alignment · historical SG-01

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-alignment*.json'
      - 'data/project/project-stable-ground-current.json'
      - 'docs/milestones/project-stable-ground-alignment.md'
      - 'tools/build-project-stable-ground-alignment.mjs'
      - 'tools/validate-project-stable-ground-alignment.mjs'
      - 'test/project-stable-ground-alignment.test.js'
      - 'reports/core-thesis/stable-ground/checkpoint.json'
      - 'reports/core-thesis/stable-ground/index.html'
      - '.github/workflows/project-stable-ground-alignment.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-alignment*.json'
      - 'data/project/project-stable-ground-current.json'
      - 'docs/milestones/project-stable-ground-alignment.md'
      - 'tools/build-project-stable-ground-alignment.mjs'
      - 'tools/validate-project-stable-ground-alignment.mjs'
      - 'test/project-stable-ground-alignment.test.js'
      - 'reports/core-thesis/stable-ground/checkpoint.json'
      - 'reports/core-thesis/stable-ground/index.html'
      - '.github/workflows/project-stable-ground-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate immutable SG-01 record and supersession custody
        run: |
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Refuse historical-check mutation
        run: |
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
