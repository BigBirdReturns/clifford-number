name: TEMP current-main official crawler dispatch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-scheduled-crawl-official-dispatch.yml'

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: temp-current-main-official-crawler-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/scheduled-crawl-official-dispatch-control-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
      MAIN_SHA: 56596519121c689074d29205205fc46c96a0ccec
      MAIN_TREE: e9ee23e9d99ad5d1dcd4e02c163ce4f213a872ab
      OFFICIAL_WORKFLOW_BLOB: 68e134682dcb0583908845250648b02b84281f1d
      CONTROLLER_BRANCH: agent/scheduled-crawl-official-dispatch-control-20260908
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate leases and dispatch current-main official crawler
        id: dispatch
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_path='.github/workflows/temp-scheduled-crawl-official-dispatch.yml'
          target_workflow='.github/workflows/crawl-official.yml'
          receipt_dir='dispatch-receipt'
          mkdir -p "$receipt_dir"

          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test "$(git show -s --format=%T HEAD^)" = "$MAIN_TREE"
          mapfile -t paths < <(git diff --name-only "$MAIN_SHA" "$EXACT_HEAD")
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = "$workflow_path"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$MAIN_SHA" --jq .tree.sha)" = "$MAIN_TREE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROLLER_BRANCH" --jq .object.sha)" = "$EXACT_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/$target_workflow?ref=$MAIN_SHA" --jq .sha)" = "$OFFICIAL_WORKFLOW_BLOB"

          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n '{ref:"main",inputs:{max_records:"100"}}' > "$receipt_dir/dispatch-request.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/crawl-official.yml/dispatches" \
            --input "$receipt_dir/dispatch-request.json"

          run_id=''
          for _ in $(seq 1 60); do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/crawl-official.yml/runs" \
              -f event=workflow_dispatch -f branch=main -f per_page=100 \
              > "$receipt_dir/workflow-runs.json"
            run_id="$(jq -r --arg sha "$MAIN_SHA" --arg start "$start" '
              [.workflow_runs[] |
                select(.event == "workflow_dispatch" and .head_sha == $sha and .created_at >= $start)] |
              sort_by(.id) | last | .id // empty
            ' "$receipt_dir/workflow-runs.json")"
            test -z "$run_id" || break
            sleep 2
          done
          test -n "$run_id"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$receipt_dir/dispatched-run.json"
          jq -e --argjson id "$run_id" --arg sha "$MAIN_SHA" '
            .id == $id and
            .name == "Official-record intake" and
            .path == ".github/workflows/crawl-official.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $sha
          ' "$receipt_dir/dispatched-run.json" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN_SHA"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg controller_branch "$CONTROLLER_BRANCH" \
            --arg controller_head "$EXACT_HEAD" \
            --arg main "$MAIN_SHA" \
            --arg main_tree "$MAIN_TREE" \
            --arg workflow_blob "$OFFICIAL_WORKFLOW_BLOB" \
            --arg start "$start" \
            --argjson run_id "$run_id" \
            --arg run_url "$(jq -r .html_url "$receipt_dir/dispatched-run.json")" \
            --arg created_at "$(jq -r .created_at "$receipt_dir/dispatched-run.json")" '
            {
              schema_version: "scheduled-crawl-official-dispatch-control@1",
              repository: $repository,
              controller: {branch: $controller_branch, head: $controller_head, never_merge: true},
              protected_main: {sha: $main, tree: $main_tree},
              target_workflow: {path: ".github/workflows/crawl-official.yml", blob: $workflow_blob},
              dispatch: {requested_at: $start, run_id: $run_id, run_url: $run_url, created_at: $created_at, event: "workflow_dispatch", ref: "main"},
              main_unchanged_after_dispatch: true,
              self_retirement_pending: true
            }
          ' > "$receipt_dir/DISPATCH.json"
          sha256sum "$receipt_dir/DISPATCH.json" > "$receipt_dir/SHA256SUMS"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Upload exact dispatch receipt
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-crawl-official-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: dispatch-receipt/
          if-no-files-found: error
          retention-days: 30

      - name: Retire the never-merge controller ref
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROLLER_BRANCH" --jq .object.sha)" = "$EXACT_HEAD"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CONTROLLER_BRANCH"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROLLER_BRANCH" >/dev/null 2>&1; then
            echo 'controller ref survived self-retirement' >&2
            exit 1
          fi
