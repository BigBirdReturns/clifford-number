name: TEMP qualify and stage canonical RD-04 workflow repair v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/temp-qualify-stage-ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1.sh'
      - '.github/workflows/temp-qualify-stage-ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: temp-qualify-stage-ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1
  cancel-in-progress: false

env:
  CURRENT_MAIN: f0bf84537bdcb8b9f9de57c392ad83d01bac6f35
  FIRST_PARENT: bf48e7f424283232bae5060779d2d33e4d85bbcb
  PRODUCT_COMMIT: ecbb9a354f63699d0db9a658db27b643bbc07045
  PRODUCT_PARENT: 91b386df809079884825b19a6b5d864b6e739172
  CARRIER_SCRIPT_PATH: .github/scripts/temp-qualify-stage-ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1.sh
  CARRIER_WORKFLOW_PATH: .github/workflows/temp-qualify-stage-ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1.yml
  WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.yml
  MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication/product-manifest.json
  BUILDER_PATH: tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.mjs
  SCHEMA_PATH: schemas/status-sovereignty-rd-wave03-rd04-postpromotion-five-route-adjudication.schema.json
  ROUTE_CONTRACT_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/route-query-contract.json
  ROUTE_LEDGER_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/route-ledger.json
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promoted-partial-field-matrix.json
  EXCLUSION_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/previously-frozen-url-exclusion.json
  SOURCE_WORKFLOW_BLOB: 6e85ed36416821131bbd5ddc9ee3b579a25859d6
  SOURCE_MANIFEST_BLOB: 35b45ee0946fa0fe344d2ec8b3fffbb0e0607d1b
  SOURCE_BUILDER_BLOB: 4de87352d853cd7de72ebcbee97a5a7d74c95a51
  SOURCE_SCHEMA_BLOB: e4dbeca29761ba286937ef48808c3c213d0c4bfa
  HISTORICAL_CONTRACT_BLOB: d5c445435dd74bea61e7e50887a27a3ffb1edcf1
  LIVE_CONTRACT_BLOB: 6e3d9eb55ebcc029151144ce9965754ac4e35e1a
  ROUTE_LEDGER_BLOB: ad4a82bc1a23e0957137468dfc0a4c3333d84394
  MATRIX_BLOB: 42361e559db90777e1d60aea5530df5694c86dc6
  EXCLUSION_BLOB: 5d5890f4bc84d943d3a0ac6a3042321448c63959
  STAGING_BRANCH: staging/ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1
  WORKFLOW_SHADOW_PATH: exchange/rd04-postpromotion-five-route-adjudication-workflow-repair/repaired-workflow.yml

jobs:
  qualify-and-stage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-carrier-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute exact canonical workflow-repair transaction
        id: transaction
        continue-on-error: true
        shell: bash
        run: bash "$CARRIER_SCRIPT_PATH"

      - name: Upload exact repair custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Report bounded repair result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          R="${RUNNER_TEMP}/ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1/receipt.json"
          test -s "$R"
          state="$(jq -r .state "$R")"
          stage="$(jq -r .failed_or_final_stage "$R")"
          candidate="$(jq -r '.qualified_candidate_commit // "none"' "$R")"
          tree="$(jq -r '.qualified_candidate_tree // "none"' "$R")"
          workflow_blob="$(jq -r '.repaired_workflow_blob // "none"' "$R")"
          manifest_blob="$(jq -r '.regenerated_manifest_blob // "none"' "$R")"
          staging="$(jq -r '.staging_commit // "none"' "$R")"
          {
            printf '%s\n\n' 'Canonical RD-04 five-route adjudication workflow repair reached a typed result.'
            printf '%s\n' '```text'
            printf 'state: %s\n' "$state"
            printf 'stage: %s\n' "$stage"
            printf 'canonical_main: %s\n' "$CURRENT_MAIN"
            printf 'historical_contract: %s\n' "$HISTORICAL_CONTRACT_BLOB"
            printf 'live_contract: %s\n' "$LIVE_CONTRACT_BLOB"
            printf 'qualified_candidate: %s\n' "$candidate"
            printf 'qualified_tree: %s\n' "$tree"
            printf 'repaired_workflow_blob: %s\n' "$workflow_blob"
            printf 'regenerated_manifest_blob: %s\n' "$manifest_blob"
            printf 'staging_commit: %s\n' "$staging"
            printf 'repair_paths: 2\n'
            printf 'semantic_product_paths_changed: 0\n'
            printf 'matrix_updates: 0\n'
            printf 'field_terminalizations: 0\n'
            printf 'row_state_mutations: 0\n'
            printf 'class_closed: false\n'
            printf '%s\n\n' '```'
            printf '%s\n' 'The repair separates historical protocol custody from the repaired live contract. The control question is whether the connected Git object API can replace the standing workflow, remove the staging-only shadow path, and reproduce the qualified repair tree exactly.'
          } > /tmp/rd04-canonical-workflow-repair-result.md
          gh issue comment 1017 --repo "$GITHUB_REPOSITORY" --body-file /tmp/rd04-canonical-workflow-repair-result.md

      - name: Preserve fail-closed conclusion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/ssc-rd04-postpromotion-five-route-adjudication-workflow-repair-v1"
          test "${{ steps.transaction.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          jq -e \
            --arg main "$CURRENT_MAIN" \
            --arg historical "$HISTORICAL_CONTRACT_BLOB" \
            --arg live "$LIVE_CONTRACT_BLOB" \
            --arg staging "$STAGING_BRANCH" \
            --arg shadow "$WORKFLOW_SHADOW_PATH" \
            '.state=="qualified_and_staged" and
             .exit_code==0 and
             .canonical_main==$main and
             .contract_bindings.historical_protocol_parent==$historical and
             .contract_bindings.live_repaired_main==$live and
             .qualified_candidate_commit!=null and
             .qualified_candidate_tree!=null and
             .repaired_workflow_blob!=null and
             .regenerated_manifest_blob!=null and
             .repair_path_count==2 and
             .semantic_product_paths_changed==0 and
             .staging_branch==$staging and
             .staging_commit!=null and
             .staging_tree!=null and
             .workflow_shadow_path==$shadow and
             .staging_path_count==2 and
             .permanent_workflow_updated_by_actions==false and
             .repair_product_ref_updated_by_actions==false and
             .connector_publication_required==true and
             .source_requests_executed==0 and
             .route_executions==0 and
             .source_admissions_created==0 and
             .matrix_updates==0 and
             .field_terminalizations==0 and
             .row_state_mutations==0 and
             .class_closed==false and
             .cumulative_ledger_effect=="none" and
             .outside_human_dependency==false and
             .publication_effect=="none" and
             .adoption_effect=="none" and
             .graph_effect=="none"' \
            "$OUT/receipt.json" > /dev/null
