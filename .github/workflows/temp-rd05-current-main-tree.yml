name: TEMP report current main tree for RD-05 publication

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-rd05-current-main-tree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/ssc-rd05-candidate-object-recovery-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Report exact current main commit and tree
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'main_commit=%s\n' "$(git rev-parse HEAD)"
          printf 'main_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
