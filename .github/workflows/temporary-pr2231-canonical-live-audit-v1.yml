name: Temporary PR 2231 canonical live audit v1

on:
  push:
    branches:
      - diagnostic/pr2231-canonical-live-audit-v1

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact product parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8aae3b90e7506856f41e96e14c6e4727872779b8"
          test "$(git rev-parse HEAD^:tools/lib/industrial-exhaust.mjs)" = "994ad06d13e8ea0df28b988d7ec21ddfcd1d640b"
          test "$(git rev-parse HEAD^:test/industrial-exhaust.test.js)" = "2629ce7d8942f75687772426c11c70bfe8fa8973"
      - name: Execute canonical witnesses
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { performance } from 'node:perf_hooks';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          const witnesses = [
            ['outer-closer-segmentation', `Archive ${'GUID '.repeat(4000)}(record id: 555-1212)12345678`],
            ['sentence-boundary', 'Phone: 09012345678. 2026-08-17 12:30:45 555-1212'],
            ['one-use-lease', 'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212'],
            ['nested-phone', 'Phone: ((09012345678)) 12:30:45 555-1212'],
            ['nested-observation-date', 'Phone: ((2026-08-17)) 12:30:45 555-1212'],
            ['nested-observation-count', 'Phone: ((12345678 people)) 12:30:45 555-1212'],
            ['nested-observation-decimal', 'Phone: ((1234.5678 people)) 12:30:45 555-1212'],
            ['fullwidth-nested-phone', '電話：((０９０１２３４５６７８)) １２：３０：４５ ５５５－１２１２'],
            ['fullwidth-nested-observation', '電話：((２０２６－０８－１７)) １２：３０：４５ ５５５－１２１２']
          ];

          for (const [name, input] of witnesses) {
            const started = performance.now();
            const output = redactContactData(input);
            const elapsedMs = performance.now() - started;
            console.log(JSON.stringify({ name, input, output, elapsedMs }));
          }

          for (const repetitions of [200, 400, 800, 1200]) {
            const input = `Phone: 09012345678 ${'1.1 '.repeat(repetitions)}12:30 555-1212`;
            const started = performance.now();
            const output = redactContactData(input);
            const elapsedMs = performance.now() - started;
            console.log(JSON.stringify({
              name: 'repeated-observation-scan',
              repetitions,
              bytes: Buffer.byteLength(input),
              elapsedMs,
              outputTail: output.slice(-80)
            }));
          }
          NODE
