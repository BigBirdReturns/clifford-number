name: Counter-Selector Wave 28 Batch B blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-28.yml'
      - 'data/project/counter-selector-wave-28-*.json'
      - 'schemas/counter-selector-observability-batch-b-review.schema.json'
      - 'docs/methods/counter-selector-observability-batch-b-review.md'
      - 'docs/milestones/counter-selector-wave-28.md'
      - 'tools/build-counter-selector-wave-28.mjs'
      - 'tools/validate-counter-selector-wave-28.mjs'
      - 'test/counter-selector-wave-28.test.js'
      - 'reports/core-thesis/counter-selector-wave-28/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-28.yml'
      - 'data/project/counter-selector-wave-28-*.json'
      - 'schemas/counter-selector-observability-batch-b-review.schema.json'
      - 'docs/methods/counter-selector-observability-batch-b-review.md'
      - 'docs/milestones/counter-selector-wave-28.md'
      - 'tools/build-counter-selector-wave-28.mjs'
      - 'tools/validate-counter-selector-wave-28.mjs'
      - 'test/counter-selector-wave-28.test.js'
      - 'reports/core-thesis/counter-selector-wave-28/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 28 products
        run: node tools/build-counter-selector-wave-28.mjs
      - name: Validate Batch B blind-review contract
        run: node tools/validate-counter-selector-wave-28.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-28.test.js
      - name: Require exact committed Wave 28 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-28-blind-packet-registry.json \
            data/project/counter-selector-wave-28-review-registry.json \
            data/project/counter-selector-wave-28-disagreement-ledger.json \
            data/project/counter-selector-wave-28-release-manifest.json \
            reports/core-thesis/counter-selector-wave-28/data.json \
            reports/core-thesis/counter-selector-wave-28/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 28 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-28.mjs
          node tools/validate-counter-selector-wave-28.mjs
          node test/counter-selector-wave-28.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
