name: TEMP rebase repaired PC-43 to current main

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc43-review-rebase.yml'
      - '.pc43-review/rebase.part-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc43-review-rebase-current-main
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc43-review-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and reconstruct exact controller
        run: |
          set -Eeuo pipefail
          test "$(stat -c '%s' .pc43-review/rebase.part-00)" = 3500
          test "$(stat -c '%s' .pc43-review/rebase.part-01)" = 3500
          test "$(stat -c '%s' .pc43-review/rebase.part-02)" = 3500
          test "$(stat -c '%s' .pc43-review/rebase.part-03)" = 1424
          test "$(sha256sum .pc43-review/rebase.part-00 | cut -d' ' -f1)" = bdd83229f537b1f2b8b3851797e9a9cae8bb6b3da0a953a6b4636f1a8282a23d
          test "$(sha256sum .pc43-review/rebase.part-01 | cut -d' ' -f1)" = 6c8d00f0bee76771a84fbd0313a8f659ba457abc729e3fb132ffe6168ffc0c5a
          test "$(sha256sum .pc43-review/rebase.part-02 | cut -d' ' -f1)" = 484e16cc56001ccb2b175ddc39e8c770386423b358613ff41ed2529e4961fb30
          test "$(sha256sum .pc43-review/rebase.part-03 | cut -d' ' -f1)" = 12231c84c54e0356266390fca941a4e013fca9d5e61f17090ecec75cbdaf9adb
          cat .pc43-review/rebase.part-* > /tmp/pc43-review-rebase.sh.b64
          test "$(stat -c '%s' /tmp/pc43-review-rebase.sh.b64)" = 11924
          test "$(sha256sum /tmp/pc43-review-rebase.sh.b64 | cut -d' ' -f1)" = 12eb1235d9eaba0236fb486ecac65d45d2634b6d7f07aa90e26c472e326d43fd
          base64 --decode /tmp/pc43-review-rebase.sh.b64 > /tmp/pc43-review-rebase.sh
          test "$(stat -c '%s' /tmp/pc43-review-rebase.sh)" = 8942
          test "$(sha256sum /tmp/pc43-review-rebase.sh | cut -d' ' -f1)" = b45ca6d400330cedb110a9568d3bc241383f1ecf7e136e9932a3f24c0b5e0201
          bash -n /tmp/pc43-review-rebase.sh
          chmod +x /tmp/pc43-review-rebase.sh
      - name: Execute exact current-main review repair
        run: /tmp/pc43-review-rebase.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc43-review-current-main-rebase-${{ github.run_id }}
          path: /tmp/pc43-review-current-main-rebase-receipt.json
          if-no-files-found: error
          retention-days: 90
