name: TEMP materialize Montana row-state review repair v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-ssc-rd04-mt-row-state-review-repair-v2.yml'

permissions:
  contents: write

env:
  SOURCE_PRODUCT: 85fad4f736a3639444edd2c522a67316dbade480
  SOURCE_CARRIER_BRANCH: agent/ssc-rd04-mt-row-state-review-repair-materializer-v1
  SOURCE_CARRIER_PATH: .github/workflows/temp-materialize-ssc-rd04-mt-row-state-review-repair-v1.yml
  CANONICAL_PARENT: 0840358962621b0be3db6864ecec763327f35903
  TARGET_BRANCH: agent/ssc-rd04-mt-row-state-reconciliation-v2
  CARRIER_PATH: .github/workflows/temp-materialize-ssc-rd04-mt-row-state-review-repair-v2.yml
  PRODUCT_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.yml
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation
  SCHEMA_PATH: schemas/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.schema.json
  MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation/product-manifest.json
  OUT: /tmp/ssc-rd04-mt-row-state-review-repair-v1
  WORK: /tmp/ssc-rd04-mt-row-state-review-repair-work-v1
  WRAPPER_OUT: /tmp/ssc-rd04-mt-row-state-review-repair-wrapper-v2
  PRODUCT_AUTHOR_NAME: github-actions[bot]
  PRODUCT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PRODUCT_AUTHOR_DATE: '2026-08-10T19:00:00+00:00'
  PRODUCT_COMMITTER_NAME: github-actions[bot]
  PRODUCT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PRODUCT_COMMITTER_DATE: '2026-08-10T19:00:00+00:00'
  PRODUCT_MESSAGE: Promote exact Montana derivative row-state reconciliation v2

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Execute authenticated V1 materializer program on canonical carrier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$WRAPPER_OUT"
          mkdir -p "$WRAPPER_OUT"
          printf '%s\n' wrapper-bootstrap > "$WRAPPER_OUT/STAGE"
          printf '%s\n' 1 > "$WRAPPER_OUT/EXIT_CODE"
          fail() {
            local rc=$?
            trap - ERR
            printf '%s\n' "$rc" > "$WRAPPER_OUT/EXIT_CODE"
            if [ -f /tmp/source-carrier.yml ]; then cp /tmp/source-carrier.yml "$WRAPPER_OUT/source-carrier.yml"; fi
            if [ -f /tmp/materialize.sh ]; then cp /tmp/materialize.sh "$WRAPPER_OUT/materialize.sh"; fi
            if [ -f /tmp/materializer-console.log ]; then cp /tmp/materializer-console.log "$WRAPPER_OUT/materializer-console.log"; fi
            if [ -d "$OUT" ]; then mkdir -p "$WRAPPER_OUT/materializer-out"; cp -a "$OUT"/. "$WRAPPER_OUT/materializer-out"/ || true; fi
            exit "$rc"
          }
          trap fail ERR

          printf '%s\n' authenticate-wrapper > "$WRAPPER_OUT/STAGE"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_PARENT"
          test "$(git diff --name-only "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"
          git diff --check "$CANONICAL_PARENT" HEAD
          git fetch --no-tags --force origin \
            "+refs/heads/$SOURCE_CARRIER_BRANCH:refs/remotes/origin/source-carrier" \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/source-carrier^)" = "$SOURCE_PRODUCT"
          test "$(git show -s --format='%P' "$SOURCE_PRODUCT")" = "$CANONICAL_PARENT"
          git show "refs/remotes/origin/source-carrier:$SOURCE_CARRIER_PATH" > /tmp/source-carrier.yml

          printf '%s\n' extract-sealed-program > "$WRAPPER_OUT/STAGE"
          python - /tmp/source-carrier.yml /tmp/materialize.sh <<'PYEXTRACT'
          from pathlib import Path
          import sys
          src,out=map(Path,sys.argv[1:])
          text=src.read_text(encoding='utf-8')
          start="      - name: Authenticate carrier and materialize repaired sole-parent product\n"
          end="      - name: Preserve repair materialization receipt\n"
          if text.count(start)!=1 or text.count(end)!=1:
              raise SystemExit(f'materializer marker denominator start={text.count(start)} end={text.count(end)}')
          section=text.split(start,1)[1].split(end,1)[0]
          run_marker="        run: |\n"
          if section.count(run_marker)!=1:
              raise SystemExit(f'run marker denominator {section.count(run_marker)}')
          raw=section.split(run_marker,1)[1]
          lines=raw.splitlines()
          body=[]
          for lineno,line in enumerate(lines,1):
              if line and not line.startswith('          '):
                  raise SystemExit(f'run block indentation mismatch line {lineno}: {line!r}')
              body.append(line[10:] if line else '')
          program='\n'.join(body)+'\n'
          if 'set -Eeuo pipefail' not in program or 'qualified_repaired_product_published' not in program:
              raise SystemExit('extracted program authentication markers absent')
          out.write_text(program,encoding='utf-8')
          PYEXTRACT

          printf '%s\n' rebind-carrier-preflight > "$WRAPPER_OUT/STAGE"
          python - /tmp/materialize.sh <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          replacements={
            'test "$(git rev-parse HEAD^)" = "$SOURCE_PRODUCT"':'test "$(git rev-parse HEAD^)" = "$CANONICAL_PARENT"',
            'test "$(git diff --name-only "$SOURCE_PRODUCT" HEAD)" = "$CARRIER_PATH"':'test "$(git diff --name-only "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"',
            'test "$(git diff --name-only --diff-filter=A "$SOURCE_PRODUCT" HEAD)" = "$CARRIER_PATH"':'test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"',
            'test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$SOURCE_PRODUCT" HEAD)"':'test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"',
            'git diff --check "$SOURCE_PRODUCT" HEAD':'git diff --check "$CANONICAL_PARENT" HEAD',
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'replacement denominator for {old!r}: {s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          printf '%s\n' execute-sealed-materializer > "$WRAPPER_OUT/STAGE"
          set +e
          bash /tmp/materialize.sh > /tmp/materializer-console.log 2>&1
          rc=$?
          set -e
          cp /tmp/materializer-console.log "$WRAPPER_OUT/materializer-console.log"
          cp /tmp/materialize.sh "$WRAPPER_OUT/materialize.sh"
          if [ -d "$OUT" ]; then mkdir -p "$WRAPPER_OUT/materializer-out"; cp -a "$OUT"/. "$WRAPPER_OUT/materializer-out"/ || true; fi
          cat /tmp/materializer-console.log
          test "$rc" = 0

          printf '%s\n' complete > "$WRAPPER_OUT/STAGE"
          printf '%s\n' 0 > "$WRAPPER_OUT/EXIT_CODE"
          trap - ERR
      - name: Preserve repair materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-review-repair-materializer-v2
          path: |
            ${{ env.OUT }}
            ${{ env.WRAPPER_OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
