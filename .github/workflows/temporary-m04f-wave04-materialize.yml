name: Temporary materialize M-04F Wave 04 vertical joins

on:
  push:
    branches:
      - agent/m04f-wave04-vertical-joins
    paths:
      - '.github/temporary/m04f-wave04/**'
      - '.github/workflows/temporary-m04f-wave04-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04f-wave04-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-wave04-vertical-joins
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble and extract exact source payload
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          root = Path('.github/temporary/m04f-wave04')
          encoded = ''.join((root / name).read_text().strip() for name in [
              'payload.b64', 'part-01.txt', 'part-02.txt', 'part-03.txt',
              'part-04.txt', 'part-05.txt', 'part-06.txt',
          ])
          assert len(encoded) == 54616, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '88c3bc67f6dc9860d8a84fa3459de53b2ea3f46c1862f4b2430ac468fee5edcd'
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == 40960, len(payload)
          assert hashlib.sha256(payload).hexdigest() == '9a4c6ad70ac555ec60254cba3ad276a8d0e49370f03a8cbae96368efbccb3365'
          Path('/tmp/m04f-wave04-source.tgz').write_bytes(payload)
          PY
          tar -tzf /tmp/m04f-wave04-source.tgz
          tar -xzf /tmp/m04f-wave04-source.tgz -C .
      - name: Build and validate seven vertical joins
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          allowed_exact = {
              '.github/workflows/m04f-epistemic-jurisdiction.yml',
              'data/intake/m04f-epistemic-jurisdiction-sources-05.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-04.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-01.json',
              'data/project/m04f-epistemic-jurisdiction-fanout-wave-04.json',
              'data/project/m04f-vertical-joins-wave-04.json',
              'data/project/m04f-epistemic-jurisdiction-estate.json',
              'docs/milestones/m04f-vertical-joins-wave-04.md',
              'tools/build-m04f-epistemic-jurisdiction.mjs',
              'tools/validate-m04f-epistemic-jurisdiction.mjs',
              'test/m04f-epistemic-jurisdiction.test.js',
          }
          allowed_prefix = (
              'build/core-thesis/epistemic-jurisdiction/',
              'reports/core-thesis/epistemic-jurisdiction/',
          )
          for row in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefix):
                  continue
              tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', '--', path],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if tracked:
                  subprocess.run(['git', 'restore', '--staged', '--worktree', '--', path], check=True)
              else:
                  target = Path(path)
                  if target.is_dir(): shutil.rmtree(target)
                  elif target.exists(): target.unlink()
          PY
      - name: Rebuild final products and refuse unexpected drift
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          git diff --check
          python - <<'PY'
          import subprocess
          allowed_exact = {
              '.github/workflows/m04f-epistemic-jurisdiction.yml',
              'data/intake/m04f-epistemic-jurisdiction-sources-05.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-04.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-01.json',
              'data/project/m04f-epistemic-jurisdiction-fanout-wave-04.json',
              'data/project/m04f-vertical-joins-wave-04.json',
              'data/project/m04f-epistemic-jurisdiction-estate.json',
              'docs/milestones/m04f-vertical-joins-wave-04.md',
              'tools/build-m04f-epistemic-jurisdiction.mjs',
              'tools/validate-m04f-epistemic-jurisdiction.mjs',
              'test/m04f-epistemic-jurisdiction.test.js',
          }
          allowed_prefix = (
              'build/core-thesis/epistemic-jurisdiction/',
              'reports/core-thesis/epistemic-jurisdiction/',
          )
          paths=[]
          for row in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines():
              path=row[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              paths.append(path)
          bad=[p for p in paths if p not in allowed_exact and not p.startswith(allowed_prefix)]
          print('\n'.join(paths))
          if bad: raise SystemExit('unexpected durable drift:\n'+'\n'.join(bad))
          PY
      - name: Commit verified permanent Wave 04 estate
        run: |
          target='agent/m04f-wave04-vertical-joins'
          remote_sha="$(git rev-parse "origin/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/m04f-epistemic-jurisdiction.yml \
            data/intake/m04f-epistemic-jurisdiction-sources-05.json \
            data/intake/m04f-epistemic-jurisdiction-wave-04.json \
            data/intake/m04f-epistemic-jurisdiction-wave-01.json \
            data/project/m04f-epistemic-jurisdiction-fanout-wave-04.json \
            data/project/m04f-vertical-joins-wave-04.json \
            data/project/m04f-epistemic-jurisdiction-estate.json \
            docs/milestones/m04f-vertical-joins-wave-04.md \
            tools/build-m04f-epistemic-jurisdiction.mjs \
            tools/validate-m04f-epistemic-jurisdiction.mjs \
            test/m04f-epistemic-jurisdiction.test.js \
            build/core-thesis/epistemic-jurisdiction \
            reports/core-thesis/epistemic-jurisdiction
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'No permanent Wave 04 changes to commit'; exit 1; }
          git commit -m 'Close the seven M-04F vertical joins'
          git push --force-with-lease="refs/heads/$target:$remote_sha" origin "HEAD:refs/heads/$target"
