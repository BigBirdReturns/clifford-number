name: Temporary materialize M-04F Wave 04 vertical joins

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/temporary/m04f-wave04/**'
      - '.github/workflows/temporary-m04f-wave04-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04f-wave04-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-wave04-vertical-joins
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract source records and apply clean Wave 04 code patch
        run: |
          python - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path

          root = Path('.github/temporary/m04f-wave04')
          names = ['payload.b64', 'part-01.txt', 'part-02.txt', 'part-03.txt', 'part-04.txt', 'part-05.txt', 'part-06.txt']
          encoded = ''.join((root / name).read_text().strip() for name in names)
          assert len(encoded) == 54616, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '88c3bc67f6dc9860d8a84fa3459de53b2ea3f46c1862f4b2430ac468fee5edcd'
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == 40960, len(payload)
          assert hashlib.sha256(payload).hexdigest() == '9a4c6ad70ac555ec60254cba3ad276a8d0e49370f03a8cbae96368efbccb3365'
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tf:
              members = tf.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall('.')
          PY

          git show origin/main:tools/build-m04f-epistemic-jurisdiction.mjs > tools/build-m04f-epistemic-jurisdiction.mjs
          git show origin/main:tools/validate-m04f-epistemic-jurisdiction.mjs > tools/validate-m04f-epistemic-jurisdiction.mjs
          git show origin/main:test/m04f-epistemic-jurisdiction.test.js > test/m04f-epistemic-jurisdiction.test.js

          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''''''
          data = base64.b64decode(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '6f3f150ed032690c01af8c33a091107357434e1ed11d5b177ea3e0116edb2917'
          assert hashlib.sha256(data).hexdigest() == 'a3b804e9014edae73b651c5e3dd95449ebe37c41b5e84656f944a8d0e941198a'
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'cfa1dcb857ac2f73e9027ab074938d362fd954f27828782c2c81be142b4b55d3'
          Path('/tmp/wave04-clean.patch').write_bytes(patch)
          PY
          git apply /tmp/wave04-clean.patch
      - name: Build and validate seven vertical joins
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          def allowed(path):
              exact = {
                  '.github/workflows/m04f-epistemic-jurisdiction.yml',
                  'tools/build-m04f-epistemic-jurisdiction.mjs',
                  'tools/validate-m04f-epistemic-jurisdiction.mjs',
                  'test/m04f-epistemic-jurisdiction.test.js',
              }
              prefixes = (
                  'data/intake/m04f-epistemic-jurisdiction-', 'data/project/m04f-',
                  'docs/milestones/m04f-', 'build/core-thesis/epistemic-jurisdiction/',
                  'reports/core-thesis/epistemic-jurisdiction/', '.github/temporary/m04f-wave04/',
                  '.github/workflows/temporary-m04f-wave04-',
              )
              return path in exact or path.startswith(prefixes)
          for row in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = row[3:].split(' -> ')[-1]
              if allowed(path):
                  continue
              tracked = subprocess.run(['git', 'ls-files', '--error-unmatch', '--', path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if tracked:
                  subprocess.run(['git', 'restore', '--staged', '--worktree', '--', path], check=True)
              else:
                  target = Path(path)
                  if target.is_dir(): shutil.rmtree(target)
                  elif target.exists(): target.unlink()
          PY
      - name: Rebuild final products and refuse unexpected drift
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          git diff --check
      - name: Commit verified permanent Wave 04 estate
        run: |
          target='agent/m04f-wave04-vertical-joins'
          remote_sha="$(git rev-parse "origin/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch \
            .github/temporary/m04f-wave04 \
            .github/workflows/temporary-m04f-wave04-export.yml \
            .github/workflows/temporary-m04f-wave04-materialize.yml
          git add -- \
            .github/workflows/m04f-epistemic-jurisdiction.yml \
            'data/intake/m04f-epistemic-jurisdiction-*.json' \
            'data/project/m04f-*.json' \
            'docs/milestones/m04f-*.md' \
            tools/build-m04f-epistemic-jurisdiction.mjs \
            tools/validate-m04f-epistemic-jurisdiction.mjs \
            test/m04f-epistemic-jurisdiction.test.js \
            build/core-thesis/epistemic-jurisdiction \
            reports/core-thesis/epistemic-jurisdiction
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'No permanent Wave 04 changes to commit'; exit 1; }
          git commit -m 'Close the seven M-04F vertical joins'
          git push --force-with-lease="refs/heads/$target:$remote_sha" origin "HEAD:refs/heads/$target"
