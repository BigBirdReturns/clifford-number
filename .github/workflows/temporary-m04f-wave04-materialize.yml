name: Temporary materialize M-04F Wave 04 vertical joins

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/temporary/m04f-wave04/**'
      - '.github/workflows/temporary-m04f-wave04-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-wave04-vertical-joins
      - name: Print exact payload-piece receipts
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          root = Path('.github/temporary/m04f-wave04')
          names = [
              'payload.b64', 'part-01.txt', 'part-02.txt', 'part-03.txt',
              'part-04.txt', 'part-05.txt', 'part-06.txt',
          ]
          parts = []
          for name in names:
              text = (root / name).read_text().strip()
              parts.append(text)
              print(name, len(text), hashlib.sha256(text.encode()).hexdigest())
          encoded = ''.join(parts)
          print('combined', len(encoded), hashlib.sha256(encoded.encode()).hexdigest())
          try:
              payload = base64.b64decode(encoded, validate=True)
              print('decoded', len(payload), hashlib.sha256(payload).hexdigest())
          except Exception as exc:
              print('decode_error', repr(exc))
              raise
          PY
