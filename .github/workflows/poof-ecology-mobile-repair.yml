name: One-shot POOF ecology mobile repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/poof-ecology-mobile-repair.yml'
      - 'tools/build-poof-clifford-ecology.mjs'
      - 'reports/core-thesis/poof-clifford-ecology/**'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/poof-clifford-ecology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair long-identifier overflow at the shared component
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build-poof-clifford-ecology.mjs')
          text = path.read_text()
          text = text.replace('.card{grid-column:span 4;background:', '.card{min-width:0;grid-column:span 4;background:')
          text = text.replace('.pill{display:inline-block;border:', '.pill{display:inline-block;max-width:100%;overflow-wrap:anywhere;word-break:break-word;border:')
          text = text.replace('code,pre{font-family:', 'code,pre{font-family:')
          text = text.replace('pre{white-space:pre-wrap;', 'code{overflow-wrap:anywhere;word-break:break-word}pre{white-space:pre-wrap;')
          path.write_text(text)
          PY
          node tools/build-poof-clifford-ecology.mjs
          node tools/validate-poof-clifford-ecology.mjs
          node test/poof-clifford-ecology.test.js
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node test/poof-clifford-ecology-browser.test.js
          npm run release:check
          git diff --check
      - name: Publish the repaired source and products
        run: |
          if git diff --quiet; then
            echo 'Repair already materialized.'
            exit 0
          fi
          git add tools/build-poof-clifford-ecology.mjs \
            data/project/poof-clifford-ecology-release-manifest.json \
            reports/core-thesis/poof-clifford-ecology/assets/site.css \
            reports/core-thesis/poof-clifford-ecology/release-manifest.json
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.invalid'
          git commit -m 'Fix POOF ecology mobile identifier overflow'
          git push origin HEAD:agent/poof-clifford-ecology
