name: Temporary materialize M-05 Sprint 06

on:
  push:
    branches:
      - agent/m05-sprint-06-independent-reproduction
    paths:
      - '.github/workflows/temporary-materialize-m05-s06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-06-independent-reproduction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Expand the Sprint 06 package
        run: |
          base64 -d .github/tmp/s06-payload.b64 > /tmp/s06-package.tgz
          tar -xzf /tmp/s06-package.tgz -C .
      - name: Run focused Sprint 06 checks
        run: |
          node tools/build-m05-answerable-power-sprint-06.mjs
          node tools/validate-m05-answerable-power-sprint-06.mjs
          node test/m05-independent-reproduction.test.js
          node test/m05-answerable-power-sprint-06.test.js
      - name: Run the complete repository release gate
        run: npm run release:check
      - name: Reconstruct the clean permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          tar -xzf /tmp/s06-package.tgz -C .
          node tools/build-m05-answerable-power-sprint-06.mjs
          node tools/validate-m05-answerable-power-sprint-06.mjs
          node test/m05-independent-reproduction.test.js
          node test/m05-answerable-power-sprint-06.test.js
      - name: Commit the fifteen non-workflow permanent files
        run: |
          git add \
            .github/ISSUE_TEMPLATE/apc-independent-reproduction.yml \
            data/project/m05-answerable-power-sprint-06-plan.json \
            data/project/m05-answerable-power-sprint-06-protocol.json \
            data/project/m05-answerable-power-sprint-06-receipt-schema.json \
            data/project/m05-answerable-power-sprint-06-registry.json \
            data/project/m05-answerable-power-sprint-06-release-manifest.json \
            docs/methods/answerable-power-independent-reproduction.md \
            docs/milestones/m05-answerable-power-sprint-06.md \
            reports/core-thesis/answerable-power/sprint-06.html \
            reports/core-thesis/answerable-power/sprint-06.json \
            test/m05-answerable-power-sprint-06.test.js \
            test/m05-independent-reproduction.test.js \
            tools/build-m05-answerable-power-sprint-06.mjs \
            tools/m05-independent-reproduction.mjs \
            tools/validate-m05-answerable-power-sprint-06.mjs
          python - <<'PY'
          import subprocess
          expected = {
            '.github/ISSUE_TEMPLATE/apc-independent-reproduction.yml',
            'data/project/m05-answerable-power-sprint-06-plan.json',
            'data/project/m05-answerable-power-sprint-06-protocol.json',
            'data/project/m05-answerable-power-sprint-06-receipt-schema.json',
            'data/project/m05-answerable-power-sprint-06-registry.json',
            'data/project/m05-answerable-power-sprint-06-release-manifest.json',
            'docs/methods/answerable-power-independent-reproduction.md',
            'docs/milestones/m05-answerable-power-sprint-06.md',
            'reports/core-thesis/answerable-power/sprint-06.html',
            'reports/core-thesis/answerable-power/sprint-06.json',
            'test/m05-answerable-power-sprint-06.test.js',
            'test/m05-independent-reproduction.test.js',
            'tools/build-m05-answerable-power-sprint-06.mjs',
            'tools/m05-independent-reproduction.mjs',
            'tools/validate-m05-answerable-power-sprint-06.mjs'
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert actual == expected, f'path denominator mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-gpg-sign -m 'Build M-05 Sprint 06 independent reproduction intake'
      - name: Prove deterministic generated products
        run: |
          node tools/build-m05-answerable-power-sprint-06.mjs
          node tools/validate-m05-answerable-power-sprint-06.mjs
          node test/m05-answerable-power-sprint-06.test.js
          git diff --exit-code
      - name: Push the permanent non-workflow commit
        run: git push origin HEAD:agent/m05-sprint-06-independent-reproduction
