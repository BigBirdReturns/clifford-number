name: Recover adversarial payload from Git history

on:
  push:
    branches:
      - agent/adversarial-release-integrity
    paths:
      - '.github/workflows/adversarial-payload-history-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adversarial-payload-history-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adversarial-payload-history-recovery-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adversarial-release-integrity
          fetch-depth: 0
      - name: Recover checksum-bound payload from historical tree states
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import re
          import subprocess
          import tarfile
          from io import BytesIO
          from pathlib import Path

          out = Path('/tmp/adversarial-payload-history-recovery')
          out.mkdir(parents=True, exist_ok=True)
          manifest = json.loads(Path('.github/tmp/adversarial-release-manifest.json').read_text())
          expected = {
              'chunk_count': int(manifest['chunk_count']),
              'base64_bytes': int(manifest['base64_bytes']),
              'base64_sha256': manifest['base64_sha256'],
              'payload_bytes': int(manifest['payload_bytes']),
              'payload_sha256': manifest['payload_sha256'],
          }
          prefixes = {
              'original': re.compile(r'^\.github/tmp/adversarial-release-payload-([0-9]+)\.b64$'),
              'final_source': re.compile(r'^\.github/tmp/final-source-part-([0-9]+)\.b64$'),
          }
          commits = subprocess.check_output(
              ['git', 'rev-list', '--all', '--', '.github/tmp'], text=True
          ).splitlines()
          seen = set()
          candidates = []
          recovered = None

          def compact_blob(commit, path):
              raw = subprocess.check_output(['git', 'show', f'{commit}:{path}'])
              return b''.join(raw.split())

          def decode_modes(parts):
              modes = {}
              compact = b''.join(parts)
              try:
                  modes['concatenated_text'] = base64.b64decode(compact, validate=True)
              except Exception as exc:
                  modes['concatenated_text_error'] = f'{type(exc).__name__}: {exc}'
              try:
                  modes['individually_decoded_parts'] = b''.join(
                      base64.b64decode(part, validate=True) for part in parts
                  )
              except Exception as exc:
                  modes['individually_decoded_parts_error'] = f'{type(exc).__name__}: {exc}'
              try:
                  unpadded = b''.join(part.rstrip(b'=') for part in parts)
                  unpadded += b'=' * ((4 - len(unpadded) % 4) % 4)
                  modes['rejoined_unpadded_text'] = base64.b64decode(unpadded, validate=True)
              except Exception as exc:
                  modes['rejoined_unpadded_text_error'] = f'{type(exc).__name__}: {exc}'
              return modes

          for commit in commits:
              if commit in seen:
                  continue
              seen.add(commit)
              listing = subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', commit, '--', '.github/tmp'],
                  text=True,
              ).splitlines()
              for family, pattern in prefixes.items():
                  indexed = []
                  for path in listing:
                      match = pattern.match(path)
                      if match:
                          indexed.append((int(match.group(1)), path))
                  if not indexed:
                      continue
                  indexed.sort()
                  paths = [path for _, path in indexed]
                  parts = [compact_blob(commit, path) for path in paths]
                  compact = b''.join(parts)
                  candidate = {
                      'commit': commit,
                      'family': family,
                      'paths': paths,
                      'part_count': len(parts),
                      'part_lengths': [len(part) for part in parts],
                      'base64_bytes': len(compact),
                      'base64_sha256': hashlib.sha256(compact).hexdigest(),
                      'modes': {},
                  }
                  modes = decode_modes(parts)
                  for mode, value in modes.items():
                      if mode.endswith('_error'):
                          candidate['modes'][mode] = value
                          continue
                      payload = value
                      payload_sha = hashlib.sha256(payload).hexdigest()
                      mode_record = {
                          'payload_bytes': len(payload),
                          'payload_sha256': payload_sha,
                          'gzip_tar': False,
                      }
                      try:
                          with tarfile.open(fileobj=BytesIO(payload), mode='r:gz') as archive:
                              names = archive.getnames()
                          mode_record['gzip_tar'] = True
                          mode_record['tar_entries'] = len(names)
                      except Exception as exc:
                          mode_record['tar_error'] = f'{type(exc).__name__}: {exc}'
                      candidate['modes'][mode] = mode_record
                      if len(payload) == expected['payload_bytes'] and payload_sha == expected['payload_sha256']:
                          with tarfile.open(fileobj=BytesIO(payload), mode='r:gz') as archive:
                              names = archive.getnames()
                          (out / 'final-source.recovered.tar.gz').write_bytes(payload)
                          (out / 'final-source.tree.txt').write_text('\n'.join(names) + '\n')
                          (out / 'final-source.recovered.b64').write_bytes(compact)
                          recovered = {
                              'commit': commit,
                              'family': family,
                              'mode': mode,
                              'paths': paths,
                              'part_count': len(parts),
                              'part_lengths': [len(part) for part in parts],
                              'base64_bytes': len(compact),
                              'base64_sha256': hashlib.sha256(compact).hexdigest(),
                              'payload_bytes': len(payload),
                              'payload_sha256': payload_sha,
                              'tar_entries': len(names),
                          }
                          break
                  if len(candidates) < 150:
                      candidates.append(candidate)
                  if recovered is not None:
                      break
              if recovered is not None:
                  break

          diagnostic = {
              'schema_version': 'adversarial-payload-history-recovery@2',
              'encoding_law': 'base64 transport decodes directly to the checksum-bound gzip tar payload',
              'expected': expected,
              'commits_scanned': len(seen),
              'candidate_sample': candidates,
              'recovered': recovered,
          }
          (out / 'diagnostic.json').write_text(json.dumps(diagnostic, indent=2) + '\n')
          print(json.dumps(diagnostic, indent=2))
          if recovered is None:
              raise SystemExit('no historical transport mode reproduced the checksum-bound gzip tar payload')
          PY
      - name: Upload recovery custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-payload-history-recovery-${{ github.run_id }}
          path: /tmp/adversarial-payload-history-recovery/
          if-no-files-found: error
          retention-days: 7

# Recovery replay requested after the POOF ecology merge.
# The final payload hash is authoritative; transport spelling is not.
