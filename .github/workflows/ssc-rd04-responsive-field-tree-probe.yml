name: SSC RD-04 responsive-field current-main tree probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ssc-rd04-responsive-field-tree-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd04-responsive-field-tree-probe-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print exact live-main commit and peeled tree
        run: |
          set -Eeuo pipefail
          readonly EXPECTED_MAIN=170cffa6c2a0c1e6fcd5124d713f054d228b4979
          git fetch --no-tags origin main
          LIVE_MAIN=$(git rev-parse origin/main)
          MAIN_TREE=$(git rev-parse "${LIVE_MAIN}^{tree}")
          printf 'expected_main=%s\nlive_main=%s\nmain_tree=%s\n' "$EXPECTED_MAIN" "$LIVE_MAIN" "$MAIN_TREE"
          test "$LIVE_MAIN" = "$EXPECTED_MAIN"
