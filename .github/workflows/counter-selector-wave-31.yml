name: Counter-Selector Wave 31 recipient-acknowledged handoff controls

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-31.yml'
      - 'data/project/counter-selector-wave-31-*.json'
      - 'schemas/counter-selector-recipient-handoff-controls.schema.json'
      - 'docs/methods/counter-selector-recipient-acknowledgment.md'
      - 'docs/milestones/counter-selector-wave-31.md'
      - 'tools/build-counter-selector-wave-31.mjs'
      - 'tools/validate-counter-selector-wave-31.mjs'
      - 'test/counter-selector-wave-31.test.js'
      - 'reports/core-thesis/counter-selector-wave-31/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-31.yml'
      - 'data/project/counter-selector-wave-31-*.json'
      - 'schemas/counter-selector-recipient-handoff-controls.schema.json'
      - 'docs/methods/counter-selector-recipient-acknowledgment.md'
      - 'docs/milestones/counter-selector-wave-31.md'
      - 'tools/build-counter-selector-wave-31.mjs'
      - 'tools/validate-counter-selector-wave-31.mjs'
      - 'test/counter-selector-wave-31.test.js'
      - 'reports/core-thesis/counter-selector-wave-31/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 31 products
        run: node tools/build-counter-selector-wave-31.mjs
      - name: Validate recipient-handoff contract
        run: node tools/validate-counter-selector-wave-31.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-31.test.js
      - name: Require exact committed Wave 31 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-31-handoff-registry.json \
            data/project/counter-selector-wave-31-release-manifest.json \
            reports/core-thesis/counter-selector-wave-31/data.json \
            reports/core-thesis/counter-selector-wave-31/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 31 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-31.mjs
          node tools/validate-counter-selector-wave-31.mjs
          node test/counter-selector-wave-31.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
