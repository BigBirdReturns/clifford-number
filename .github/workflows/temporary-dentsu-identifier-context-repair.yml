name: Temporary Dentsu identifier-context repair

on:
  push:
    branches:
      - agent/dentsu-identifier-context-followup
    paths:
      - .github/workflows/temporary-dentsu-identifier-context-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-dentsu-identifier-context-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dentsu-identifier-context-followup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact entry state and reproduce the gap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ade17b2748eeb17ac40102c45cde70b3158488ab"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-dentsu-identifier-context-repair.yml"
          node --input-type=module <<'NODE'
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';
          const cases = [
            'ID: 09012345678',
            'GUID: 03-6216-8041',
            'reference: +81 3 6216 5111',
            '管理番号：03-6216-8041',
            '識別子：+81 3 6216 5111'
          ];
          const changed = cases.filter(value => redactContactData(value) !== value);
          for (const value of cases) {
            console.log(JSON.stringify({ input: value, actual: redactContactData(value) }));
          }
          if (changed.length < 4) {
            throw new Error(`expected the current implementation to reproduce at least four identifier failures; observed ${changed.length}`);
          }
          NODE
      - name: Apply the identifier-context repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count was {count}, expected 1')
              return text.replace(old, new, 1)

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')

          library = replace_once(
              library,
              "  const labelled = hasPhoneLabelPrefix(prefix);",
              "  const normalizedPrefix = prefix.normalize('NFKC');\n  const labelled = hasPhoneLabelPrefix(normalizedPrefix);",
              'normalized prefix'
          )

          old_identifier = r'''  const compactIdentifierContext = /(?:(?:^|\b)(?:guid|identifier|reference|revision|release(?:\s+id)?|record(?:\s+id)?|receipt|sha(?:-?256)?|hash|ticket|case|invoice|order|code)|(?:識別子|参照(?:番号)?|管理番号|受付番号|注文番号|案件番号|コード))\s*[:：=#＃-]?\s*$/iu.test(
    prefix.normalize('NFKC').slice(-80)
  );'''
          new_identifier = r'''  const identifierContext = /(?:(?:^|\b)(?:id|guid|identifier|reference|revision|release(?:\s+id)?|record(?:\s+id)?|receipt|sha(?:-?256)?|hash|ticket|case|invoice|order|code)|(?:識別子|参照(?:番号)?|管理番号|受付番号|注文番号|案件番号|コード))\s*[:：=#＃-]?\s*$/iu.test(
    normalizedPrefix.slice(-80)
  );
  if (identifierContext && !labelled) return 0;'''
          library = replace_once(library, old_identifier, new_identifier, 'identifier context')
          library = replace_once(
              library,
              "    && !compactIdentifierContext;",
              ";",
              'compact identifier condition'
          )
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')

          old_identifiers = dedent('''\
          for (const labelledCompactIdentifier of [
            'GUID: 06012345678',
            'GUID: 09012345678',
            'release id 0817020000',
            'reference 0362168041',
            '管理番号：０６０１２３４５６７８',
            '管理番号：０９０１２３４５６７８'
          ]) {
            assert.equal(
              redactContactData(labelledCompactIdentifier),
              labelledCompactIdentifier,
              'explicit English and Japanese identifier labels must protect compact numeric identifiers'
            );
          }
          ''')
          new_identifiers = dedent('''\
          for (const labelledPhoneShapedIdentifier of [
            'ID: 09012345678',
            'ＩＤ：０９０１２３４５６７８',
            'GUID: 06012345678',
            'GUID: 09012345678',
            'GUID: 03-6216-8041',
            'release id 0817020000',
            'reference 0362168041',
            'reference: +81 3 6216 5111',
            '管理番号：０６０１２３４５６７８',
            '管理番号：０９０１２３４５６７８',
            '管理番号：03-6216-8041',
            '識別子：+81 3 6216 5111'
          ]) {
            assert.equal(
              redactContactData(labelledPhoneShapedIdentifier),
              labelledPhoneShapedIdentifier,
              'explicit English and Japanese identifier labels must protect phone-shaped identifiers'
            );
          }
          ''')
          tests = replace_once(tests, old_identifiers, new_identifiers, 'identifier regressions')

          old_phones = dedent('''\
          for (const labelledCompactPhone of ['Phone: 06012345678', 'Phone: 09012345678']) {
            assert.equal(
              redactContactData(labelledCompactPhone),
              'Phone: [contact omitted]',
              'phone labels must continue to redact compact domestic numbers'
            );
          }
          ''')
          new_phones = dedent('''\
          for (const labelledPhone of [
            'Phone: 06012345678',
            'Phone: 09012345678',
            'Phone: 03-6216-8041',
            'Phone: +81 3 6216 5111'
          ]) {
            assert.equal(
              redactContactData(labelledPhone),
              'Phone: [contact omitted]',
              'phone labels must continue to redact compact, grouped, and international numbers'
            );
          }
          assert.equal(
            redactContactData('GUID: +81 3 6216 5111 Phone: 09012345678'),
            'GUID: +81 3 6216 5111 Phone: [contact omitted]',
            'identifier protection must not suppress a later independently labelled phone'
          );
          ''')
          tests = replace_once(tests, old_phones, new_phones, 'phone-label controls')
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Validate and publish the clean repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-dentsu-identifier-context-audit.yml
          rm .github/workflows/temporary-dentsu-identifier-context-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js \
            .github/workflows/temporary-dentsu-identifier-context-audit.yml \
            .github/workflows/temporary-dentsu-identifier-context-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): preserve explicit phone-shaped identifiers"
          git push --force-with-lease=refs/heads/agent/dentsu-identifier-context-followup:${expected_remote_head} \
            origin HEAD:refs/heads/agent/dentsu-identifier-context-followup
