name: M-05 Sprint 07 external adjudication

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-07-*.json'
      - 'docs/methods/answerable-power-a1-adjudication.md'
      - 'docs/milestones/m05-answerable-power-sprint-07.md'
      - 'tools/m05-a1-adjudication.mjs'
      - 'tools/build-m05-answerable-power-sprint-07.mjs'
      - 'tools/validate-m05-answerable-power-sprint-07.mjs'
      - 'test/m05-a1-adjudication.test.js'
      - 'test/m05-answerable-power-sprint-07.test.js'
      - 'reports/core-thesis/answerable-power/sprint-07.*'
      - '.github/ISSUE_TEMPLATE/apc-a1-adjudicator-nomination.yml'
      - '.github/workflows/m05-answerable-power-sprint-07.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-07-*.json'
      - 'docs/methods/answerable-power-a1-adjudication.md'
      - 'docs/milestones/m05-answerable-power-sprint-07.md'
      - 'tools/m05-a1-adjudication.mjs'
      - 'tools/build-m05-answerable-power-sprint-07.mjs'
      - 'tools/validate-m05-answerable-power-sprint-07.mjs'
      - 'test/m05-a1-adjudication.test.js'
      - 'test/m05-answerable-power-sprint-07.test.js'
      - 'reports/core-thesis/answerable-power/sprint-07.*'
      - '.github/ISSUE_TEMPLATE/apc-a1-adjudicator-nomination.yml'
      - '.github/workflows/m05-answerable-power-sprint-07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test Sprint 07
        run: |
          node tools/build-m05-answerable-power-sprint-07.mjs
          node tools/validate-m05-answerable-power-sprint-07.mjs
          node test/m05-a1-adjudication.test.js
          node test/m05-answerable-power-sprint-07.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Sprint 07 products
        run: |
          git restore --staged --worktree .
          node tools/build-m05-answerable-power-sprint-07.mjs
          node tools/validate-m05-answerable-power-sprint-07.mjs
          node test/m05-a1-adjudication.test.js
          node test/m05-answerable-power-sprint-07.test.js
          git diff --exit-code
