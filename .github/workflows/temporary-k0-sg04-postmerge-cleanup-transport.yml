name: Temporary K0 SG-04 post-merge cleanup transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-k0-sg04-postmerge-cleanup-transport.yml'
  pull_request_target:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: k0-sg04-postmerge-cleanup-transport
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.number == 461 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/k0-sg04-postmerge-cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/clifford-number
          ref: agent/k0-sg04-postmerge-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute exact transport-free correction
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            export EXPECTED_HEAD="$(git rev-parse HEAD)"
          else
            export EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'
          fi
          bash .github/scripts/run-k0-sg04-postmerge-cleanup.sh
