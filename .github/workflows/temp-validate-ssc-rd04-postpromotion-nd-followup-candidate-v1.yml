name: TEMP validate exact RD-04 North Dakota follow-up candidate

on:
  pull_request:
    paths:
      - '.github/workflows/temp-validate-ssc-rd04-postpromotion-nd-followup-candidate-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute exact request-free candidate validation
        id: validation
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          PARENT='30e151b3ff4aeb5e6353d443fab1c535bc6d7b69'
          PARENT_TREE='9d5b15d4b78e3027a316f507e46692e215f7e5a8'
          BRANCH='agent/ssc-rd04-postpromotion-nd-followup-candidate-validation-v1'
          PATH_ONLY='.github/workflows/temp-validate-ssc-rd04-postpromotion-nd-followup-candidate-v1.yml'
          MATRIX='data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/promoted-partial-field-matrix.json'
          ROOT='data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-two-route-adjudication'
          CANDIDATE="$ROOT/promotion-candidate-protocol.json"
          FIELD="$ROOT/field-adjudications.json"
          SOURCE="$ROOT/source-adjudications.json"
          CAPTURE="$ROOT/capture-custody.json"
          HTML="$ROOT/html-review-receipts.json"
          DUP="$ROOT/transport-duplication-ledger.json"
          MANIFEST="$ROOT/product-manifest.json"
          VALIDATOR='tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-two-route-adjudication.mjs'
          TEST='test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-two-route-adjudication.test.js'
          OUT="${RUNNER_TEMP}/ssc-rd04-postpromotion-nd-followup-candidate-validation-v1"
          SCRIPT="${RUNNER_TEMP}/validate-rd04-nd-followup-candidate.mjs"
          STAGE='initializing'
          mkdir -p "$OUT"
          exec > >(tee "$OUT/validation.log") 2>&1

          write_failure_receipt() {
            local rc="$1"
            if [[ ! -s "$OUT/receipt.json" ]]; then
              jq -n --arg stage "$STAGE" --arg parent "$PARENT" --arg head "$(git rev-parse HEAD 2>/dev/null || printf unknown)" --argjson exit_code "$rc" \
                '{schema_version:"ssc-rd04-postpromotion-nd-followup-candidate-validation@1",state:"failed_closed",failed_or_final_stage:$stage,exit_code:$exit_code,validation_parent:$parent,carrier_head:$head,validated_candidate_count:0,held_cell_count:1,source_requests:0,route_executions:0,matrix_updates:0,field_terminalizations:0,row_state_mutations:0,class_closed:false,cumulative_ledger_effect:"none",outside_human_dependency:false,publication_effect:"none",adoption_effect:"none",graph_effect:"none",promotion_authority_created:false}' > "$OUT/receipt.json"
            fi
          }
          finish() {
            local rc=$?
            trap - EXIT
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$STAGE" > "$OUT/STAGE"
            write_failure_receipt "$rc"
            (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
            exit "$rc"
          }
          trap finish EXIT

          cat > "$SCRIPT" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';

          const out = process.argv[2];
          const root = 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-two-route-adjudication';
          const paths = {
            matrix: 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/promoted-partial-field-matrix.json',
            candidate: `${root}/promotion-candidate-protocol.json`,
            field: `${root}/field-adjudications.json`,
            source: `${root}/source-adjudications.json`,
            capture: `${root}/capture-custody.json`,
            html: `${root}/html-review-receipts.json`,
            duplication: `${root}/transport-duplication-ledger.json`,
            manifest: `${root}/product-manifest.json`,
            validator: 'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-two-route-adjudication.mjs',
            test: 'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-two-route-adjudication.test.js',
          };
          const expectedBlobs = {
            matrix: '66896190dd575f9867f1e121d845acfb4d27f56f',
            candidate: 'a93c685b47f2678e39bba8fb395fc5fdfdbee7ff',
            field: '11875231a4b074ea2ec4125cfbf0d27fcde44222',
            source: 'c46480e360d4302ec3e1846e43097d163c7d3c88',
            capture: 'c53688f9540033383594863cfec2dc932a515146',
            html: 'a9e82f717fe9293aaa588940b0974ffc095e7cfd',
            duplication: '6d3efcbd5137e6e94229cebd57a79f5a80c95467',
            manifest: '4378b0f723a5705f80476af8dad3c197fc597bff',
            validator: 'fce38f5d25d8a69673f1c7144c6cb0cbf5c9df1f',
            test: '5511a1c17ca6d010df1b568e7ccfcf258895e9cb',
          };
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const stable = (v) => Array.isArray(v) ? v.map(stable) : (v && typeof v === 'object') ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, stable(v[k])])) : v;
          const canonicalSha = (v) => crypto.createHash('sha256').update(JSON.stringify(stable(v))).digest('hex');
          const blob = (p) => execFileSync('git', ['rev-parse', `HEAD:${p}`], {encoding:'utf8'}).trim();
          const inventory = Object.entries(paths).map(([name, p]) => ({name, path:p, git_blob:blob(p)}));
          for (const row of inventory) assert.equal(row.git_blob, expectedBlobs[row.name], `${row.name} blob`);

          const matrix = read(paths.matrix);
          const candidate = read(paths.candidate);
          const field = read(paths.field);
          const source = read(paths.source);
          const capture = read(paths.capture);
          const html = read(paths.html);
          const duplication = read(paths.duplication);
          const manifest = read(paths.manifest);

          assert.equal(matrix.counts.terminal_cells, 226);
          assert.equal(matrix.counts.still_open_cells, 224);
          assert.equal(matrix.counts.still_open_substantive_cells, 184);
          assert.equal(matrix.counts.terminal_units, 10);
          assert.equal(matrix.counts.class_closed, false);
          const nd = matrix.rows.find((row) => row.unit_id === 'US-STATE-ND');
          assert.ok(nd);
          assert.equal(nd.row_state, 'still_open');
          assert.equal(nd.terminal_fields, 6);
          assert.equal(nd.open_fields, 3);
          const authorityCell = nd.cells.find((cell) => cell.field_id === 'operative_state_implementation_authority_and_version');
          const waiverCell = nd.cells.find((cell) => cell.field_id === 'abawd_or_work_requirement_waiver_state_and_governing_period');
          assert.equal(authorityCell.state, 'still_open');
          assert.equal(authorityCell.terminal, false);
          assert.equal(canonicalSha(authorityCell), '1e857cb90de38207a82ca2f844083ea56ef8d616c0aa229d135b0bb53f0cc382');
          assert.equal(waiverCell.state, 'still_open');
          assert.equal(waiverCell.terminal, false);
          assert.equal(canonicalSha(waiverCell), 'cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe');

          assert.equal(candidate.candidate_count, 1);
          assert.equal(candidate.unique_candidate_cell_count, 1);
          assert.equal(candidate.held_cell_count, 1);
          assert.equal(candidate.matrix_updates, 0);
          assert.equal(candidate.field_terminalizations, 0);
          assert.equal(candidate.row_state_mutations, 0);
          assert.equal(candidate.class_closed, false);
          const c = candidate.candidates[0];
          assert.equal(c.candidate_id, 'RD04-PPN-ND-FU-CANDIDATE-OPERATIVE-STATE-IMPLEMENTATION-AUTHORITY-AND-VERSION');
          assert.equal(c.unit_id, 'US-STATE-ND');
          assert.equal(c.field_id, 'operative_state_implementation_authority_and_version');
          assert.equal(c.current_cell_canonical_sha256, canonicalSha(authorityCell));
          assert.deepEqual(c.source_route_ids, ['RD04-W03-PPN-ND-FU-001']);
          assert.equal(c.promotion_effect_authorized_here, 'none');
          assert.equal(c.row_state_effect, 'none');

          const authorityDecision = field.decisions.find((d) => d.decision_id === c.decision_id);
          assert.ok(authorityDecision);
          assert.equal(authorityDecision.disposition, 'evidence_complete_bounded_finding');
          assert.equal(authorityDecision.promotion_candidate, true);
          assert.deepEqual(c.bounded_finding, authorityDecision.bounded_finding);
          assert.deepEqual(c.evidence_locators, authorityDecision.evidence_locators);
          assert.deepEqual(c.source_route_ids, authorityDecision.source_route_ids);
          const waiverDecision = field.decisions.find((d) => d.field_id === 'abawd_or_work_requirement_waiver_state_and_governing_period');
          assert.equal(waiverDecision.disposition, 'temporal_or_scope_ambiguity_hold_open');
          assert.equal(waiverDecision.promotion_candidate, false);
          assert.deepEqual(waiverDecision.source_route_ids, ['RD04-W03-PPN-ND-FU-002']);

          const s1 = source.decisions.find((d) => d.route_id === 'RD04-W03-PPN-ND-FU-001');
          const s2 = source.decisions.find((d) => d.route_id === 'RD04-W03-PPN-ND-FU-002');
          assert.equal(s1.body_sha256, 'b67637ce96affea164d2a467bae37327eeb9141e15d824ab092e017364595d8d');
          assert.equal(s2.body_sha256, '30268733f0aa5e2f1e3d7ce4aa0b3c748c0394afc5a0b860327ad64c19bdb81a');
          assert.deepEqual(s1.candidate_fields_for_offline_review, ['operative_state_implementation_authority_and_version']);
          assert.deepEqual(s2.candidate_fields_for_offline_review, ['abawd_or_work_requirement_waiver_state_and_governing_period']);
          assert.equal(s1.substantive_weight_count, 1);
          assert.equal(s2.substantive_weight_count, 1);
          assert.equal(capture.additional_execution_authorized, false);
          assert.equal(capture.transport_ledger.unique_body_identity_count, 2);
          assert.equal(duplication.summary.duplicate_artifacts, 2);
          assert.equal(duplication.summary.body_changes, 0);
          assert.ok(duplication.route_body_identity.every((r) => r.artifact_body_identity_count === 3 && r.substantive_weight_count === 1));
          assert.equal(html.summary.all_visible_text_reviewed, true);
          assert.equal(manifest.permanent_path_count, 14);
          assert.equal(manifest.authority_boundary.matrix_updates, 0);
          assert.equal(manifest.authority_boundary.field_terminalizations_created, 0);
          assert.equal(manifest.authority_boundary.row_state_mutations, 0);
          assert.equal(manifest.authority_boundary.class_closed, false);

          const ledger = {
            schema_version: 'ssc-rd04-postpromotion-nd-followup-candidate-validation-ledger@1',
            validation_parent: '30e151b3ff4aeb5e6353d443fab1c535bc6d7b69',
            candidate_count: 1,
            admissible_candidate_count: 1,
            held_cell_count: 1,
            candidate: {
              candidate_id: c.candidate_id,
              decision_id: c.decision_id,
              unit_id: c.unit_id,
              field_id: c.field_id,
              current_cell_state: authorityCell.state,
              current_cell_terminal: authorityCell.terminal,
              current_cell_canonical_sha256: canonicalSha(authorityCell),
              source_route_ids: c.source_route_ids,
              evidence_locator_count: c.evidence_locators.length,
              route_target_checks: 1,
              locator_target_checks: c.evidence_locators.length,
            },
            held_cell: {
              unit_id: 'US-STATE-ND',
              field_id: waiverCell.field_id,
              current_cell_state: waiverCell.state,
              current_cell_terminal: waiverCell.terminal,
              current_cell_canonical_sha256: canonicalSha(waiverCell),
              disposition: waiverDecision.disposition,
              excluded_from_candidate_denominator: true,
            },
            matrix_counts: {
              terminal_cells: matrix.counts.terminal_cells,
              still_open_cells: matrix.counts.still_open_cells,
              still_open_substantive_cells: matrix.counts.still_open_substantive_cells,
              terminal_units: matrix.counts.terminal_units,
            },
            promotion_authority_created: false,
          };
          fs.writeFileSync(path.join(out, 'candidate-validation-ledger.json'), JSON.stringify(ledger, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'input-inventory.json'), JSON.stringify({schema_version:'ssc-rd04-postpromotion-nd-followup-candidate-input-inventory@1', inputs:inventory}, null, 2) + '\n');
          console.log(JSON.stringify({candidate_count:1, held_cell_count:1, route_target_checks:1, locator_target_checks:c.evidence_locators.length, terminal_cells:226, open_substantive_cells:184}));
          NODE

          STAGE='authenticating-carrier'
          test "$EVENT_NAME" = pull_request
          test "$PR_HEAD_REF" = "$BRANCH"
          CARRIER_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git diff --name-only "$PARENT" HEAD)" = "$PATH_ONLY"
          test "$(git diff --diff-filter=A --name-only "$PARENT" HEAD)" = "$PATH_ONLY"
          test -z "$(git diff --diff-filter=MDTCRUXB --name-only "$PARENT" HEAD)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$PARENT"

          STAGE='validating-current-candidate'
          node "$VALIDATOR"
          node "$TEST"
          node "$SCRIPT" "$OUT"
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js

          STAGE='running-complete-release-gate'
          npm run release:check
          git status --porcelain > "$OUT/post-release-status.txt"

          STAGE='clean-replay'
          git reset --hard "$CARRIER_HEAD"
          git clean -fdx
          node "$VALIDATOR"
          node "$TEST"
          node "$SCRIPT" "$OUT"
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          test -z "$(git status --porcelain)"

          STAGE='complete'
          jq -n --arg parent "$PARENT" --arg tree "$PARENT_TREE" --arg head "$CARRIER_HEAD" \
            '{schema_version:"ssc-rd04-postpromotion-nd-followup-candidate-validation@1",state:"candidate_validated",failed_or_final_stage:"complete",exit_code:0,validation_parent:$parent,validation_parent_tree:$tree,carrier_head:$head,validated_candidate_count:1,admissible_candidate_count:1,held_cell_count:1,route_target_checks:1,locator_target_checks:3,terminal_cells:226,still_open_cells:224,open_substantive_cells:184,terminal_units:10,source_requests:0,route_executions:0,matrix_updates:0,field_terminalizations:0,row_state_mutations:0,class_closed:false,cumulative_ledger_effect:"none",outside_human_dependency:false,publication_effect:"none",adoption_effect:"none",graph_effect:"none",promotion_authority_created:false,separate_promotion_product_required:true}' > "$OUT/receipt.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-rd04-postpromotion-nd-followup-candidate-validation-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-nd-followup-candidate-validation-v1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
      - name: Require typed successful validation receipt
        if: always()
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/ssc-rd04-postpromotion-nd-followup-candidate-validation-v1"
          test "${{ steps.validation.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e '
            .state=="candidate_validated" and .failed_or_final_stage=="complete" and .exit_code==0 and
            .validation_parent=="30e151b3ff4aeb5e6353d443fab1c535bc6d7b69" and
            .validation_parent_tree=="9d5b15d4b78e3027a316f507e46692e215f7e5a8" and
            .validated_candidate_count==1 and .admissible_candidate_count==1 and .held_cell_count==1 and
            .route_target_checks==1 and .locator_target_checks==3 and
            .terminal_cells==226 and .still_open_cells==224 and .open_substantive_cells==184 and .terminal_units==10 and
            .source_requests==0 and .route_executions==0 and .matrix_updates==0 and .field_terminalizations==0 and
            .row_state_mutations==0 and .class_closed==false and .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and .publication_effect=="none" and .adoption_effect=="none" and
            .graph_effect=="none" and .promotion_authority_created==false and .separate_promotion_product_required==true' \
            "$OUT/receipt.json" >/dev/null
