name: Temporary PC-27 floor-v25 bootstrap

on:
  pull_request:
    paths:
      - '.pc27/v25-payload-*.txt'
      - '.github/workflows/pc27-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-interference-mapping-v1
      - name: Materialize the permanent floor-v25 non-workflow surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import tarfile

          parts = sorted(Path('.pc27').glob('v25-payload-*.txt'))
          if len(parts) != 5:
              raise SystemExit(f'expected five PC-27 v25 payload parts, found {len(parts)}')

          encoded = ''.join(path.read_text().strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          expected = '18b36cdec9c88c4fc1ac8758d2d8e47cfdf975d22cb9c8260f8858b3f0c63af6'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'PC-27 floor-v25 payload digest mismatch: {actual}')

          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(extracted.read())
                  print(f'materialized {member.name}')
          PY
      - name: Commit the permanent floor-v25 non-workflow surface
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f \
            data/research/preference-custody/control-manifest-v25.json \
            tools/lib/preference-custody-manifest-v25.mjs \
            tools/compile-preference-custody-manifest-v25.mjs \
            tools/validate-preference-custody-manifest-v25.mjs \
            test/preference-custody-manifest-v25.test.js \
            docs/preference-custody-laboratory-floor-v25.md
          if git diff --cached --quiet; then
            echo 'Permanent floor-v25 non-workflow files already exist.'
          else
            git commit -m 'Compose PC-27 into Preference Custody floor v25'
            git push origin HEAD:research/preference-interference-mapping-v1
          fi
