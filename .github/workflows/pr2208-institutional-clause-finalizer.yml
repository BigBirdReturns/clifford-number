name: PR2208 present-tense and hash-label finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr2208-institutional-clause-finalizer.yml'

permissions:
  contents: read

concurrency:
  group: pr2208-present-hash-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  patch-qualify-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/pr2194-fresh-sentence-followup-controller-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CONTROLLER_BRANCH: agent/pr2194-fresh-sentence-followup-controller-v1
      RESULT_BRANCH: agent/pr2194-fresh-sentence-followup-v1
      EXPECTED_RESULT_HEAD: 64dfa333e8f5b4bbc4713adba005352b7ef8f923
      EXPECTED_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebase, repair, qualify, and publish the exact two-file product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_HEAD"
          git fetch origin \
            'refs/heads/main:refs/remotes/origin/main' \
            "refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH" \
            "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$CONTROLLER_BRANCH)" = "$EXPECTED_TRIGGER_HEAD"
          test "$(git rev-parse refs/remotes/origin/$RESULT_BRANCH)" = "$EXPECTED_RESULT_HEAD"

          prior_base="$(git rev-parse "$EXPECTED_RESULT_HEAD^")"
          expected_paths="$(printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs | sort)"
          test "$(git diff --name-only "$prior_base..$EXPECTED_RESULT_HEAD" | sort)" = "$expected_paths"

          base_sha="$(git rev-parse refs/remotes/origin/main)"
          git diff --quiet "$prior_base" "$base_sha" -- \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs
          git checkout -B pr2208-present-hash-candidate "$base_sha"
          git cherry-pick --no-commit "$EXPECTED_RESULT_HEAD"
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git reset
          test "$(git diff --name-only | sort)" = "$expected_paths"

          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/lib/industrial-exhaust.mjs')
          source = source_path.read_text(encoding='utf-8')

          replacements = [
            (
              r"/(?:tel(?:ephone)?|phone|mobile|cell|fax|contact)(?:\s*\.\s*)?(?:\s*(?:number|no)(?:\s*\.\s*)?)?\s*$/iu",
              r"/(?:tel(?:ephone)?|phone|mobile|cell|fax|contact)(?:\s*\.\s*)?(?:(?:\s+(?:number|no)(?:\s*\.\s*)?)|\s*#)?\s*$/iu",
              'isolated telephone label'
            ),
            (
              r"/^(?:tel(?:ephone)?|phone|mobile|cell|fax|contact)(?:\s+(?:number|no))?\s*[:.]?\s*$/iu",
              r"/^(?:tel(?:ephone)?|phone|mobile|cell|fax|contact)(?:(?:\s+(?:number|no)(?:\s*\.)?)|\s*#)?\s*[:.]?\s*$/iu",
              'telephone label remainder'
            ),
            (
              r"/(?:\s+(?:tel(?:ephone)?|phone|mobile|cell|fax|contact)(?:\s+(?:number|no))?\s*[:.]?\s*|(?:電話(?:番号)?|携帯(?:電話)?|ファックス|連絡先|お問い合わせ先)\s*[:.]?\s*)$/iu",
              r"/(?:\s+(?:tel(?:ephone)?|phone|mobile|cell|fax|contact)(?:(?:\s+(?:number|no)(?:\s*\.)?)|\s*#)?\s*[:.]?\s*|(?:電話(?:番号)?|携帯(?:電話)?|ファックス|連絡先|お問い合わせ先)\s*[:.]?\s*)$/iu",
              'named-entity terminal telephone label'
            ),
          ]
          for old, new, label in replacements:
            assert source.count(old) == 1, f'{label} changed'
            source = source.replace(old, new, 1)

          old_finite_gate = r"""function isStrongFiniteSentencePredicate(value) {
            return /^(?:said|called|asked|needed|wanted|used|saw|thought|moved|lived|worked|sent|contacted|emailed|texted|dialed|replied|wrote|read|found|got|cared|helped|led|provided|offered|remained|mattered|seemed|became|made|took|gave|knew|looked|came|went|kept|supported|served|built|ran)$/u.test(
              value.toLocaleLowerCase('en-US')
            );
          }"""
          new_finite_gate = r"""function isStrongFiniteSentencePredicate(value) {
            const lower = value.toLocaleLowerCase('en-US');
            if (!isBoundedSentencePredicate(lower)) return false;
            return !/^(?:be|been|being|having|doing|saying|calling|asking|needing|wanting|using|seen|seeing|thinking|moving|living|working|sending|contacting|emailing|texting|dialing|replying|written|writing|reading|finding|getting|caring|helping|leading|providing|offering|remaining|mattering|seeming|becoming|making|taken|taking|given|giving|known|knowing|looking|coming|gone|going|keeping|letting|supporting|serving|building|running)$/u.test(lower);
          }"""
          assert source.count(old_finite_gate) == 1, 'finite predicate gate changed'
          source = source.replace(old_finite_gate, new_finite_gate, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          marker = '// period abbreviation classification must remain lexical and context-bounded'
          assert tests.count(marker) == 1, 'test insertion marker changed'
          sentinel = 'present finite pronoun clauses must outrank institutional suffixes'
          assert sentinel not in tests, 'present-finite regressions already inserted'
          additions = r"""
          for (const [input, expected] of [
            [
              'Broken (He moved to the U.S. HE CALLS ACME COMPANY +81 3 6216 5111)',
              'Broken (He moved to the U.S. HE CALLS ACME COMPANY [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. THEY CONTACT ACME FOUNDATION +81 3 6216 5111)',
              'Broken (He moved to the U.S. THEY CONTACT ACME FOUNDATION [contact omitted]'
            ],
            [
              'Broken（He moved to the Ｕ．Ｓ． ＴＨＥＹ ＣＯＮＴＡＣＴ ＡＣＭＥ ＦＯＵＮＤＡＴＩＯＮ ＋８１ ３ ６２１６ ５１１１）',
              'Broken（He moved to the Ｕ．Ｓ． ＴＨＥＹ ＣＯＮＴＡＣＴ ＡＣＭＥ ＦＯＵＮＤＡＴＩＯＮ [contact omitted]'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'present finite pronoun clauses must outrank institutional suffixes'
            );
          }

          for (const [input, expected] of [
            [
              'Context (U.S. WE CARE FOUNDATION Phone #: +1 253 477 8777)',
              'Context (U.S. WE CARE FOUNDATION Phone #: [contact omitted])'
            ],
            [
              'Context (U.S. Phone #: +1 253 477 8777)',
              'Context (U.S. Phone #: [contact omitted])'
            ],
            [
              'Context（Ｕ．Ｓ． ＷＥ ＣＡＲＥ ＦＯＵＮＤＡＴＩＯＮ Ｐｈｏｎｅ ＃： ＋１ ２５３ ４７７ ８７７７）',
              'Context（Ｕ．Ｓ． ＷＥ ＣＡＲＥ ＦＯＵＮＤＡＴＩＯＮ Ｐｈｏｎｅ ＃： [contact omitted]）'
            ],
            [
              'Context（Ｕ．Ｓ． Ｐｈｏｎｅ ＃： ＋１ ２５３ ４７７ ８７７７）',
              'Context（Ｕ．Ｓ． Ｐｈｏｎｅ ＃： [contact omitted]）'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'hash-style telephone labels must provide affirmative wrapper ownership evidence'
            );
          }

          """
          test_path.write_text(tests.replace(marker, additions + marker, 1), encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          test "$(git diff --name-only | sort)" = "$expected_paths"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git commit -m 'fix(crawler): classify present clauses and hash labels'
          test "$(git rev-parse HEAD^)" = "$base_sha"
          git push \
            --force-with-lease="refs/heads/$RESULT_BRANCH:$EXPECTED_RESULT_HEAD" \
            origin "HEAD:refs/heads/$RESULT_BRANCH"
