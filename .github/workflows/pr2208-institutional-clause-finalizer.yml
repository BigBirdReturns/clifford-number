name: PR2208 labelled-title casing finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr2208-institutional-clause-finalizer.yml'

permissions:
  contents: read

concurrency:
  group: pr2208-labelled-title-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  patch-qualify-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/pr2194-fresh-sentence-followup-controller-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CONTROLLER_BRANCH: agent/pr2194-fresh-sentence-followup-controller-v1
      RESULT_BRANCH: agent/pr2194-fresh-sentence-followup-v1
      EXPECTED_RESULT_HEAD: af7f247c31fac9bd5d1c10881dc9828807c74b77
      EXPECTED_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebase, repair, qualify, and publish the exact two-file product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_HEAD"
          git fetch origin \
            'refs/heads/main:refs/remotes/origin/main' \
            "refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH" \
            "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$CONTROLLER_BRANCH)" = "$EXPECTED_TRIGGER_HEAD"
          test "$(git rev-parse refs/remotes/origin/$RESULT_BRANCH)" = "$EXPECTED_RESULT_HEAD"

          prior_base="$(git rev-parse "$EXPECTED_RESULT_HEAD^")"
          expected_paths="$(printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs | sort)"
          test "$(git diff --name-only "$prior_base..$EXPECTED_RESULT_HEAD" | sort)" = "$expected_paths"

          base_sha="$(git rev-parse refs/remotes/origin/main)"
          git diff --quiet "$prior_base" "$base_sha" -- \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs
          git checkout -B pr2208-labelled-title-candidate "$base_sha"
          git cherry-pick --no-commit "$EXPECTED_RESULT_HEAD"
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git reset
          test "$(git diff --name-only | sort)" = "$expected_paths"

          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/lib/industrial-exhaust.mjs')
          source = source_path.read_text(encoding='utf-8')

          old_predicate_gate = r"""  const predicate = tokens[predicateIndex];
            if (isStrongFiniteSentencePredicate(predicate)) return true;

            const lowerPredicate = predicate.toLocaleLowerCase('en-US');
            const auxiliaryPattern = /^(?:am|is|are|was|were|have|has|had|will|would|shall|should|can|could|may|might|must|do|does|did)$/u;
            return auxiliaryPattern.test(lowerPredicate)
              && tokens.slice(predicateIndex + 1).some(isBoundedSentencePredicate);"""
          new_predicate_gate = r"""  const predicate = tokens[predicateIndex];
            const postPredicateTokens = tokens.slice(predicateIndex + 1);
            if (postPredicateTokens.some(token =>
              /^(?:a|an|the|my|our|your|his|her|its|their|this|that|these|those)$/u.test(
                token.toLocaleLowerCase('en-US')
              )
            )) return true;
            if (isStrongFiniteSentencePredicate(predicate)) return true;

            const lowerPredicate = predicate.toLocaleLowerCase('en-US');
            const auxiliaryPattern = /^(?:am|is|are|was|were|have|has|had|will|would|shall|should|can|could|may|might|must|do|does|did)$/u;
            return auxiliaryPattern.test(lowerPredicate)
              && postPredicateTokens.some(isBoundedSentencePredicate);"""
          assert source.count(old_predicate_gate) == 1, 'strong-clause predicate gate changed'
          source = source.replace(old_predicate_gate, new_predicate_gate, 1)

          suffix_start_marker = "  if (hasInstitutionalSuffix) {"
          suffix_end_marker = "\n  }\n\n  const hasMixedCaseTitleToken"
          assert source.count(suffix_start_marker) == 1, 'institutional suffix gate changed'
          suffix_start = source.index(suffix_start_marker)
          suffix_end = source.index(suffix_end_marker, suffix_start) + len("\n  }")
          new_suffix_gate = "\n".join([
            "  if (hasInstitutionalSuffix) {",
            r"    const casedWords = words.filter(word => /\p{L}/u.test(word));",
            "    const allCapsPhrase = casedWords.length > 0 && casedWords.every(word => {",
            "      const lower = word.toLocaleLowerCase('en-US');",
            "      const upper = word.toLocaleUpperCase('en-US');",
            "      return lower === upper || word === upper;",
            "    });",
            "    // Override the suffix only for unlabelled all-caps clauses. A",
            "    // terminal phone label and title casing are affirmative name evidence.",
            "    if (!labelMatch",
            "        && allCapsPhrase",
            "        && isStrongPronounClauseWithinInstitutionalPhrase(phrase)) {",
            "      return false;",
            "    }",
            "    return true;",
            "  }",
          ])
          source = source[:suffix_start] + new_suffix_gate + source[suffix_end:]
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          marker = '// period abbreviation classification must remain lexical and context-bounded'
          assert tests.count(marker) == 1, 'test insertion marker changed'
          additions = r"""
          for (const [input, expected] of [
            [
              'Broken (He moved to the U.S. THIS IS THE FOUNDATION +81 3 6216 5111)',
              'Broken (He moved to the U.S. THIS IS THE FOUNDATION [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. WE SUPPORT THE FOUNDATION +81 3 6216 5111)',
              'Broken (He moved to the U.S. WE SUPPORT THE FOUNDATION [contact omitted]'
            ],
            [
              'Broken（He moved to the Ｕ．Ｓ． ＴＨＩＳ ＩＳ ＴＨＥ ＦＯＵＮＤＡＴＩＯＮ ＋８１ ３ ６２１６ ５１１１）',
              'Broken（He moved to the Ｕ．Ｓ． ＴＨＩＳ ＩＳ ＴＨＥ ＦＯＵＮＤＡＴＩＯＮ [contact omitted]'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'unlabelled all-caps pronoun clauses must outrank institutional suffixes'
            );
          }

          for (const [input, expected] of [
            [
              "Context (U.S. It's a Small World Foundation Phone: +1 253 477 8777)",
              "Context (U.S. It's a Small World Foundation Phone: [contact omitted])"
            ],
            [
              'Context (U.S. We Can Do It Foundation Phone: +1 253 477 8777)',
              'Context (U.S. We Can Do It Foundation Phone: [contact omitted])'
            ],
            [
              'Context (U.S. WE CAN DO IT FOUNDATION Phone: +1 253 477 8777)',
              'Context (U.S. WE CAN DO IT FOUNDATION Phone: [contact omitted])'
            ],
            [
              'Context（Ｕ．Ｓ． Ｗｅ Ｃａｎ Ｄｏ Ｉｔ Ｆｏｕｎｄａｔｉｏｎ Phone: ＋１ ２５３ ４７７ ８７７７）',
              'Context（Ｕ．Ｓ． Ｗｅ Ｃａｎ Ｄｏ Ｉｔ Ｆｏｕｎｄａｔｉｏｎ Phone: [contact omitted]）'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'labelled title-cased and all-caps institutions must retain their owned closer'
            );
          }

          """
          test_path.write_text(tests.replace(marker, additions + marker, 1), encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          test "$(git diff --name-only | sort)" = "$expected_paths"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git commit -m 'fix(crawler): preserve labelled title-shaped institutions'
          test "$(git rev-parse HEAD^)" = "$base_sha"
          git push \
            --force-with-lease="refs/heads/$RESULT_BRANCH:$EXPECTED_RESULT_HEAD" \
            origin "HEAD:refs/heads/$RESULT_BRANCH"
