name: PR2208 delimiter, title, and structural-clause finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr2208-institutional-clause-finalizer.yml'

permissions:
  contents: read

concurrency:
  group: pr2208-delimiter-title-clause-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  patch-qualify-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/pr2194-fresh-sentence-followup-controller-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CONTROLLER_BRANCH: agent/pr2194-fresh-sentence-followup-controller-v1
      RESULT_BRANCH: agent/pr2194-fresh-sentence-followup-v1
      EXPECTED_RESULT_HEAD: ad97cd3024d2f6df6293abd52e3a53ef19fbb36a
      EXPECTED_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct, repair, qualify, and publish the exact two-file product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_HEAD"
          git fetch origin \
            'refs/heads/main:refs/remotes/origin/main' \
            "refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH" \
            "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$CONTROLLER_BRANCH)" = "$EXPECTED_TRIGGER_HEAD"
          test "$(git rev-parse refs/remotes/origin/$RESULT_BRANCH)" = "$EXPECTED_RESULT_HEAD"

          prior_base="$(git rev-parse "$EXPECTED_RESULT_HEAD^")"
          expected_paths="$(printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs | sort)"
          test "$(git diff --name-only "$prior_base..$EXPECTED_RESULT_HEAD" | sort)" = "$expected_paths"

          base_sha="$(git rev-parse refs/remotes/origin/main)"
          git diff --quiet "$prior_base" "$base_sha" -- \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs
          git checkout -B pr2208-delimiter-title-clause-candidate "$base_sha"
          git cherry-pick --no-commit "$EXPECTED_RESULT_HEAD"
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git reset
          test "$(git diff --name-only | sort)" = "$expected_paths"

          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/lib/industrial-exhaust.mjs')
          source = source_path.read_text(encoding='utf-8')

          old_clause_helpers = r"""function isStrongFiniteSentencePredicate(value) {
            const lower = value.toLocaleLowerCase('en-US');
            if (!isBoundedSentencePredicate(lower)) return false;
            return !/^(?:be|been|being|having|doing|saying|calling|asking|needing|wanting|using|seen|seeing|thinking|moving|living|working|sending|contacting|emailing|texting|dialing|replying|written|writing|reading|finding|getting|caring|helping|leading|providing|offering|remaining|mattering|seeming|becoming|making|taken|taking|given|giving|known|knowing|looking|coming|gone|going|keeping|letting|supporting|serving|building|running)$/u.test(lower);
          }

          function isStrongPronounClauseWithinInstitutionalPhrase(value) {
            const normalized = value.normalize('NFKC').trim();
            if (/^(?:i|we|you|he|she|they|it|this|that|these|those)['’](?:m|s|re|ve|ll|d)(?=$|[^\p{L}])/iu.test(normalized)) {
              return true;
            }

            const leadMatch = normalized.match(
              /^(?:i|we|you|he|she|they|it|this|that|these|those)(?:\s+|$)/iu
            );
            if (!leadMatch) return false;
            const tokens = normalized.slice(leadMatch[0].length)
              .match(/[\p{L}]+/gu)?.slice(0, 8) ?? [];
            const predicateIndex = tokens.findIndex(isBoundedSentencePredicate);
            if (predicateIndex < 0) return false;

            const predicate = tokens[predicateIndex];
            const postPredicateTokens = tokens.slice(predicateIndex + 1);
            if (postPredicateTokens.some(token =>
              /^(?:a|an|the|my|our|your|his|her|its|their|this|that|these|those)$/u.test(
                token.toLocaleLowerCase('en-US')
              )
            )) return true;
            if (isStrongFiniteSentencePredicate(predicate)) return true;

            const lowerPredicate = predicate.toLocaleLowerCase('en-US');
            const auxiliaryPattern = /^(?:am|is|are|was|were|have|has|had|will|would|shall|should|can|could|may|might|must|do|does|did)$/u;
            return auxiliaryPattern.test(lowerPredicate)
              && postPredicateTokens.some(isBoundedSentencePredicate);
          }"""
          new_clause_helpers = r"""function isAllCapsPronounClauseWithinInstitutionalPhrase(value) {
            const normalized = value.normalize('NFKC').trim();
            if (/^(?:i|we|you|he|she|they|it|this|that|these|those)['’](?:m|s|re|ve|ll|d)(?=$|[^\p{L}])/iu.test(normalized)) {
              return true;
            }

            const tokens = normalized.match(/[\p{L}\p{M}\p{N}&'’\-]+/gu) ?? [];
            if (tokens.length < 2) return false;
            const lead = tokens[0].toLocaleLowerCase('en-US');
            if (!/^(?:i|we|you|he|she|they|it|this|that|these|those)$/u.test(lead)) {
              return false;
            }

            const next = tokens[1].toLocaleLowerCase('en-US');
            if (/^(?:a|an|the|of|and|&)$/u.test(next)) return false;
            if (tokens[0] === 'I'
                && /^(?:army|brigade|command|corps|division|regiment)$/u.test(next)) {
              return false;
            }
            if (tokens[0] === 'IT'
                && /^(?:department|group|lab|labs|network|office|services|solutions|systems|team)$/u.test(next)) {
              return false;
            }

            // Within an unlabelled all-caps institutional-suffix phrase, the
            // pronoun-plus-predicate reading is the safer structural default.
            // This avoids making correctness depend on an exhaustive verb list.
            return true;
          }"""
          assert source.count(old_clause_helpers) == 1, 'clause helper block changed'
          source = source.replace(old_clause_helpers, new_clause_helpers, 1)

          old_phrase = r"""  const phrase = (labelMatch
            ? normalized.slice(0, labelMatch.index)
            : normalized).trim();"""
          new_phrase = r"""  const phrase = (labelMatch
            ? normalized.slice(0, labelMatch.index)
              .replace(/\s*(?:[-‐‑‒–—−－|｜/／]+)\s*$/u, '')
            : normalized).trim();"""
          assert source.count(old_phrase) == 1, 'labelled phrase extraction changed'
          source = source.replace(old_phrase, new_phrase, 1)

          old_suffix_gate = r"""    if (!labelMatch
                && allCapsPhrase
                && isStrongPronounClauseWithinInstitutionalPhrase(phrase)) {
              return false;
            }"""
          new_suffix_gate = r"""    if (!labelMatch
                && allCapsPhrase
                && isAllCapsPronounClauseWithinInstitutionalPhrase(phrase)) {
              return false;
            }"""
          assert source.count(old_suffix_gate) == 1, 'institutional suffix gate changed'
          source = source.replace(old_suffix_gate, new_suffix_gate, 1)

          old_title_return = r"""  const hasMixedCaseTitleToken = words.slice(1).some(word =>
            nameTokenPattern.test(word) && /\p{Ll}/u.test(word)
          );
          return Boolean(labelMatch) && words.length >= 3 && hasMixedCaseTitleToken;"""
          new_title_return = r"""  const casedWords = words.filter(word => /\p{L}/u.test(word));
          const hasMixedCaseTitleToken = words.slice(1).some(word =>
            nameTokenPattern.test(word) && /\p{Ll}/u.test(word)
          );
          const titleCasedPhrase = casedWords.length >= 3
            && casedWords.filter(word => /\p{Ll}/u.test(word)).length >= 2;
          return words.length >= 3
            && hasMixedCaseTitleToken
            && (Boolean(labelMatch) || titleCasedPhrase);"""
          assert source.count(old_title_return) == 1, 'title continuation return changed'
          source = source.replace(old_title_return, new_title_return, 1)

          old_pronoun_lead = r"""function isPronounSentenceLead(value) {
            const normalized = value.normalize('NFKC').trimStart();
            if (/^(?:i|we|you|he|she|they|it|this|that|these|those)['’](?:m|s|re|ve|ll|d)(?=$|[^\p{L}])/iu.test(normalized)) {
              return true;
            }

            const leadMatch = normalized.match(
              /^(?:i|we|you|he|she|they|it|this|that|these|those)(?:\s+|$)/iu
            );
            if (!leadMatch) return false;
            const followingTokens = normalized.slice(leadMatch[0].length)
              .match(/[\p{L}]+/gu)?.slice(0, 4) ?? [];
            return followingTokens.some(isBoundedSentencePredicate);
          }"""
          new_pronoun_lead = r"""function isPronounSentenceLead(value) {
            const normalized = value.normalize('NFKC').trimStart();
            if (/^(?:i|we|you|he|she|they|it|this|that|these|those)['’](?:m|s|re|ve|ll|d)(?=$|[^\p{L}])/iu.test(normalized)) {
              return true;
            }

            const leadToken = normalized.match(/^[\p{L}]+/u)?.[0] ?? '';
            const leadMatch = normalized.match(
              /^(?:i|we|you|he|she|they|it|this|that|these|those)(?:\s+|$)/iu
            );
            if (!leadMatch) return false;
            const followingTokens = normalized.slice(leadMatch[0].length)
              .match(/[\p{L}]+/gu)?.slice(0, 6) ?? [];
            if (followingTokens.some(isBoundedSentencePredicate)) return true;
            if (!followingTokens.length) return false;

            const first = followingTokens[0];
            const lowerFirst = first.toLocaleLowerCase('en-US');
            if (leadToken === 'I'
                && /^(?:army|brigade|command|corps|division|regiment)$/u.test(lowerFirst)) {
              return false;
            }
            if (leadToken === 'IT'
                && /^(?:department|group|lab|labs|network|office|services|solutions|systems|team)$/u.test(lowerFirst)) {
              return false;
            }

            const upperFirst = first.toLocaleUpperCase('en-US');
            if (first === lowerFirst && lowerFirst !== upperFirst) return true;
            if (/(?:ed|ied|ing|en|ifies|ified|ify|ises|ised|ise|izes|ized|ize|ates|ated|ate|s)$/u.test(lowerFirst)
                && lowerFirst.length > 3) {
              return true;
            }

            const determinerIndex = followingTokens.findIndex((token, index) =>
              index > 0 && /^(?:a|an|the|my|our|your|his|her|its|their|this|that|these|those)$/u.test(
                token.toLocaleLowerCase('en-US')
              )
            );
            if (determinerIndex > 0) return true;

            const phraseTokens = [leadToken, ...followingTokens];
            const allCapsPhrase = phraseTokens.every(token => {
              const lower = token.toLocaleLowerCase('en-US');
              const upper = token.toLocaleUpperCase('en-US');
              return lower === upper || token === upper;
            });
            return allCapsPhrase
              && followingTokens.length >= 2
              && !/^(?:a|an|the|of|and)$/u.test(lowerFirst);
          }"""
          assert source.count(old_pronoun_lead) == 1, 'pronoun sentence lead changed'
          source = source.replace(old_pronoun_lead, new_pronoun_lead, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          marker = '// period abbreviation classification must remain lexical and context-bounded'
          assert tests.count(marker) == 1, 'test insertion marker changed'
          sentinel = 'delimiter-aware labels and structural clause evidence must preserve wrapper ownership'
          assert sentinel not in tests, 'final regressions already inserted'
          additions = r"""
          for (const [input, expected] of [
            [
              'Context (U.S. We Care Foundation - Phone: +1 253 477 8777)',
              'Context (U.S. We Care Foundation - Phone: [contact omitted])'
            ],
            [
              'Context (U.S. We Care Foundation — Phone: +1 253 477 8777)',
              'Context (U.S. We Care Foundation — Phone: [contact omitted])'
            ],
            [
              'Context (U.S. We Care Foundation | Phone #: +1 253 477 8777)',
              'Context (U.S. We Care Foundation | Phone #: [contact omitted])'
            ],
            [
              'Context (U.S. We Care Foundation / Contact: +1 253 477 8777)',
              'Context (U.S. We Care Foundation / Contact: [contact omitted])'
            ],
            [
              'Context（Ｕ．Ｓ． Ｗｅ Ｃａｒｅ Ｆｏｕｎｄａｔｉｏｎ ｜ Ｐｈｏｎｅ ＃： ＋１ ２５３ ４７７ ８７７７）',
              'Context（Ｕ．Ｓ． Ｗｅ Ｃａｒｅ Ｆｏｕｎｄａｔｉｏｎ ｜ Ｐｈｏｎｅ ＃： [contact omitted]）'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'terminal phone-label delimiters must remain outside title classification'
            );
          }

          for (const [input, expected] of [
            [
              'Context (U.S. She Leads Africa +1 253 477 8777)',
              'Context (U.S. She Leads Africa [contact omitted])'
            ],
            [
              'Context (U.S. This Is Us +1 253 477 8777)',
              'Context (U.S. This Is Us [contact omitted])'
            ],
            [
              'Context（Ｕ．Ｓ． Ｓｈｅ Ｌｅａｄｓ Ａｆｒｉｃａ ＋１ ２５３ ４７７ ８７７７）',
              'Context（Ｕ．Ｓ． Ｓｈｅ Ｌｅａｄｓ Ａｆｒｉｃａ [contact omitted]）'
            ],
            [
              'Context (U.S. IT DEPARTMENT +1 253 477 8777)',
              'Context (U.S. IT DEPARTMENT [contact omitted])'
            ],
            [
              'Context (U.S. WE THE PEOPLE FOUNDATION +1 253 477 8777)',
              'Context (U.S. WE THE PEOPLE FOUNDATION [contact omitted])'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'title-shaped unlabelled institutions must retain their owned closer'
            );
          }

          for (const [input, expected] of [
            [
              'Broken (He moved to the U.S. He visited the company +1 253 477 8777)',
              'Broken (He moved to the U.S. He visited the company [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. HE VISITED THE COMPANY +1 253 477 8777)',
              'Broken (He moved to the U.S. HE VISITED THE COMPANY [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. THEY ACQUIRE ACME FOUNDATION +1 253 477 8777)',
              'Broken (He moved to the U.S. THEY ACQUIRE ACME FOUNDATION [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. WE REVIEWED THE FOUNDATION +1 253 477 8777)',
              'Broken (He moved to the U.S. WE REVIEWED THE FOUNDATION [contact omitted]'
            ],
            [
              'Broken（He moved to the Ｕ．Ｓ． ＨＥ ＶＩＳＩＴＥＤ ＴＨＥ ＣＯＭＰＡＮＹ ＋１ ２５３ ４７７ ８７７７）',
              'Broken（He moved to the Ｕ．Ｓ． ＨＥ ＶＩＳＩＴＥＤ ＴＨＥ ＣＯＭＰＡＮＹ [contact omitted]'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'ordinary predicates outside the bounded lexicon must reset wrapper ownership'
            );
          }

          assert.equal(
            redactContactData('Context (U.S. We Care Foundation - Phone: +1 253 477 8777)'),
            'Context (U.S. We Care Foundation - Phone: [contact omitted])',
            'delimiter-aware labels and structural clause evidence must preserve wrapper ownership'
          );

          """
          test_path.write_text(tests.replace(marker, additions + marker, 1), encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          test "$(git diff --name-only | sort)" = "$expected_paths"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git commit -m 'fix(crawler): harden title and clause boundaries'
          test "$(git rev-parse HEAD^)" = "$base_sha"
          git push \
            --force-with-lease="refs/heads/$RESULT_BRANCH:$EXPECTED_RESULT_HEAD" \
            origin "HEAD:refs/heads/$RESULT_BRANCH"
