name: PR2208 title-evidence and lexical-ing finalizer v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr2208-institutional-clause-finalizer.yml'

permissions:
  contents: write

concurrency:
  group: pr2208-title-evidence-finalizer-v2
  cancel-in-progress: false

env:
  RESULT_BRANCH: agent/pr2194-fresh-sentence-followup-v1
  ANCHOR_BRANCH: agent/pr2208-title-evidence-product-anchor-v2
  EXPECTED_RESULT_HEAD: b9340415683780bdf2248201d52c39262ea9522f

jobs:
  patch-qualify-publish:
    if: github.event.pull_request.head.ref == 'agent/pr2194-fresh-sentence-followup-controller-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct, repair, qualify, and publish the exact two-file product
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"

          result_head="$(git rev-parse "refs/remotes/origin/$RESULT_BRANCH")"
          test "$result_head" = "$EXPECTED_RESULT_HEAD"
          product_parent="$(git rev-parse "$result_head^")"

          mapfile -t product_files < <(
            git diff --name-only "$product_parent" "$result_head" | LC_ALL=C sort
          )
          test "${#product_files[@]}" -eq 2
          test "${product_files[0]}" = "test/industrial-exhaust.test.js"
          test "${product_files[1]}" = "tools/lib/industrial-exhaust.mjs"

          git switch --force-create pr2208-title-evidence-final "refs/remotes/origin/main"
          git cherry-pick --no-commit "$result_head"

          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/lib/industrial-exhaust.mjs')
          test_path = Path('test/industrial-exhaust.test.js')
          source = source_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              assert count == 1, f'{label}: expected one match, found {count}'
              return text.replace(old, new, 1)

          constants_anchor = r"""const titleConnectorPattern = /^(?:a|an|and|at|by|for|from|in|of|on|the|to|with|&)$/iu;

function isLikelyRegularFiniteSentencePredicate(value, lead, followingTokens) {"""
          constants_replacement = r"""const titleConnectorPattern = /^(?:a|an|and|at|by|for|from|in|of|on|the|to|with|&)$/iu;
const lexicalIngBasePredicatePattern = /^(?:bring|cling|fling|ring|sing|sling|spring|sting|string|swing|wring)$/u;

function hasInstitutionalTitleTail(tokens) {
  const lowerTokens = tokens.map(token =>
    token.toLocaleLowerCase('en-US')
  );
  if (lowerTokens.length < 3) return false;
  if (!institutionalSuffixPattern.test(lowerTokens.at(-1))) return false;
  return lowerTokens.slice(0, -1).some(token =>
    institutionalSuffixPattern.test(token)
    || titleConnectorPattern.test(token)
  );
}

function isLikelyRegularFiniteSentencePredicate(value, lead, followingTokens) {"""
          source = replace_once(
              source,
              constants_anchor,
              constants_replacement,
              'predicate helper anchor changed'
          )

          source = replace_once(
              source,
              "      && !/(?:ed|ing)$/u.test(lower)) {",
              "      && (!/(?:ed|ing)$/u.test(lower)\n        || lexicalIngBasePredicatePattern.test(lower))) {",
              'plural lexical-ing exclusion changed'
          )

          generic_following_anchor = r"""    const firstFollowing = followingTokens[0].toLocaleLowerCase('en-US');
    if (sentenceObjectMarkerPattern.test(firstFollowing)) {"""
          generic_following_replacement = r"""    const firstFollowing = followingTokens[0].toLocaleLowerCase('en-US');
    if (hasInstitutionalTitleTail(followingTokens)
        && !sentenceObjectMarkerPattern.test(firstFollowing)) {
      return false;
    }
    if (sentenceObjectMarkerPattern.test(firstFollowing)) {"""
          source = replace_once(
              source,
              generic_following_anchor,
              generic_following_replacement,
              'plural following-token gate changed'
          )

          title_clause_anchor = r"""  const predicate = tokens[0];
  const postPredicateTokens = tokens.slice(1);
  return (isStrongFiniteSentencePredicate(predicate)"""
          title_clause_replacement = r"""  const predicate = tokens[0];
  const postPredicateTokens = tokens.slice(1);
  const firstPostPredicate = postPredicateTokens[0]
    ?.toLocaleLowerCase('en-US') ?? '';
  if (hasInstitutionalTitleTail(postPredicateTokens)
      && sentenceObjectMarkerPattern.test(firstPostPredicate)) {
    return false;
  }
  return (isStrongFiniteSentencePredicate(predicate)"""
          source = replace_once(
              source,
              title_clause_anchor,
              title_clause_replacement,
              'title-case clause gate changed'
          )

          suffix_fallback_anchor = r"""  const first = tokens[0]?.toLocaleLowerCase('en-US') ?? '';
  const last = tokens.at(-1)?.toLocaleLowerCase('en-US') ?? '';
  return tokens.length >= 3
    && !titleConnectorPattern.test(first)
    && !sentenceObjectMarkerPattern.test(first)
    && institutionalSuffixPattern.test(last);"""
          suffix_fallback_replacement = r"""  const first = tokens[0]?.toLocaleLowerCase('en-US') ?? '';
  const last = tokens.at(-1)?.toLocaleLowerCase('en-US') ?? '';
  const titleTail = hasInstitutionalTitleTail(tokens.slice(1))
    && !sentenceObjectMarkerPattern.test(
      tokens[1]?.toLocaleLowerCase('en-US') ?? ''
    );
  return tokens.length >= 3
    && !titleTail
    && !titleConnectorPattern.test(first)
    && !sentenceObjectMarkerPattern.test(first)
    && institutionalSuffixPattern.test(last);"""
          source = replace_once(
              source,
              suffix_fallback_anchor,
              suffix_fallback_replacement,
              'institutional suffix fallback changed'
          )

          regression_block = r"""

for (const [input, expected] of [
  [
    'Context (U.S. WE INSPIRE YOUNG PEOPLE FOUNDATION +1 253 477 8777)',
    'Context (U.S. WE INSPIRE YOUNG PEOPLE FOUNDATION [contact omitted])'
  ],
  [
    'Context（Ｕ．Ｓ． ＷＥ ＩＮＳＰＩＲＥ ＹＯＵＮＧ ＰＥＯＰＬＥ ＦＯＵＮＤＡＴＩＯＮ ＋１ ２５３ ４７７ ８７７７）',
    'Context（Ｕ．Ｓ． ＷＥ ＩＮＳＰＩＲＥ ＹＯＵＮＧ ＰＥＯＰＬＥ ＦＯＵＮＤＡＴＩＯＮ [contact omitted]）'
  ],
  [
    'Context (U.S. We Are The World Foundation +1 253 477 8777)',
    'Context (U.S. We Are The World Foundation [contact omitted])'
  ],
  [
    'Context（Ｕ．Ｓ． Ｗｅ Ａｒｅ Ｔｈｅ Ｗｏｒｌｄ Ｆｏｕｎｄａｔｉｏｎ ＋１ ２５３ ４７７ ８７７７）',
    'Context（Ｕ．Ｓ． Ｗｅ Ａｒｅ Ｔｈｅ Ｗｏｒｌｄ Ｆｏｕｎｄａｔｉｏｎ [contact omitted]）'
  ],
  [
    'Context (U.S. They Serve The People Foundation +1 253 477 8777)',
    'Context (U.S. They Serve The People Foundation [contact omitted])'
  ]
]) {
  assert.equal(
    redactContactData(input),
    expected,
    'title-shaped institutional continuations must retain their owned wrapper closer'
  );
}

for (const [input, expected] of [
  [
    'Broken (He moved to the U.S. WE INSPIRE THE PUBLIC +1 253 477 8777)',
    'Broken (He moved to the U.S. WE INSPIRE THE PUBLIC [contact omitted]'
  ],
  [
    'Broken (He moved to the U.S. THEY SING SONGS +1 253 477 8777)',
    'Broken (He moved to the U.S. THEY SING SONGS [contact omitted]'
  ],
  [
    'Broken（He moved to the Ｕ．Ｓ． ＷＥ ＢＲＩＮＧ ＳＵＰＰＬＩＥＳ ＋１ ２５３ ４７７ ８７７７）',
    'Broken（He moved to the Ｕ．Ｓ． ＷＥ ＢＲＩＮＧ ＳＵＰＰＬＩＥＳ [contact omitted]'
  ],
  [
    'Broken (He moved to the U.S. YOU SWING BATS +1 253 477 8777)',
    'Broken (He moved to the U.S. YOU SWING BATS [contact omitted]'
  ],
  [
    'Broken (He moved to the U.S. THEY VISIT ACME FOUNDATION +1 253 477 8777)',
    'Broken (He moved to the U.S. THEY VISIT ACME FOUNDATION [contact omitted]'
  ],
  [
    'Broken (He moved to the U.S. He Visited The Company +1 253 477 8777)',
    'Broken (He moved to the U.S. He Visited The Company [contact omitted]'
  ],
  [
    'Broken (He moved to the U.S. She Leads The Foundation +1 253 477 8777)',
    'Broken (He moved to the U.S. She Leads The Foundation [contact omitted]'
  ]
]) {
  assert.equal(
    redactContactData(input),
    expected,
    'finite pronoun clauses must reset wrapper ownership despite casing or suffix ambiguity'
  );
}
"""
          assert 'WE INSPIRE YOUNG PEOPLE FOUNDATION' not in tests, 'new regressions already present'
          tests = tests.rstrip() + regression_block + '\n'

          source_path.write_text(source, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node test/industrial-exhaust.test.js

          mapfile -t changed_files < <(
            git diff --name-only | LC_ALL=C sort
          )
          test "${#changed_files[@]}" -eq 2
          test "${changed_files[0]}" = "test/industrial-exhaust.test.js"
          test "${changed_files[1]}" = "tools/lib/industrial-exhaust.mjs"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs
          git commit -m 'fix(crawler): preserve titles and lexical ing predicates'

          product_sha="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD^)" = "$main_sha"
          test "$(git rev-list --count "$main_sha..HEAD")" -eq 1

          git push --force origin "HEAD:refs/heads/$ANCHOR_BRANCH"
          git push \
            --force-with-lease="refs/heads/$RESULT_BRANCH:$EXPECTED_RESULT_HEAD" \
            origin "HEAD:refs/heads/$RESULT_BRANCH"

          test "$(git ls-remote origin "refs/heads/$RESULT_BRANCH" | cut -f1)" = "$product_sha"
          printf 'PR2208_PRODUCT_SHA=%s\nPR2208_PRODUCT_TREE=%s\nPR2208_PRODUCT_PARENT=%s\n' \
            "$product_sha" "$product_tree" "$main_sha"
