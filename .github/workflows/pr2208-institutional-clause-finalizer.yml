name: PR2208 plural-base and title-clause finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr2208-institutional-clause-finalizer.yml'

permissions:
  contents: read

concurrency:
  group: pr2208-plural-title-clause-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  patch-qualify-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/pr2194-fresh-sentence-followup-controller-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CONTROLLER_BRANCH: agent/pr2194-fresh-sentence-followup-controller-v1
      RESULT_BRANCH: agent/pr2194-fresh-sentence-followup-v1
      EXPECTED_RESULT_HEAD: 5d872f183572fa3538856a6b97f4a9a4b4845b92
      EXPECTED_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct, repair, qualify, and publish the exact two-file product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_HEAD"
          git fetch origin \
            'refs/heads/main:refs/remotes/origin/main' \
            "refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH" \
            "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$CONTROLLER_BRANCH)" = "$EXPECTED_TRIGGER_HEAD"
          test "$(git rev-parse refs/remotes/origin/$RESULT_BRANCH)" = "$EXPECTED_RESULT_HEAD"

          prior_base="$(git rev-parse "$EXPECTED_RESULT_HEAD^")"
          expected_paths="$(printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs | sort)"
          test "$(git diff --name-only "$prior_base..$EXPECTED_RESULT_HEAD" | sort)" = "$expected_paths"

          base_sha="$(git rev-parse refs/remotes/origin/main)"
          git diff --quiet "$prior_base" "$base_sha" -- \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs
          git checkout -B pr2208-plural-title-clause-candidate "$base_sha"
          git cherry-pick --no-commit "$EXPECTED_RESULT_HEAD"
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git reset
          test "$(git diff --name-only | sort)" = "$expected_paths"

          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/lib/industrial-exhaust.mjs')
          source = source_path.read_text(encoding='utf-8')

          old_regular = r"""function isLikelyRegularFiniteSentencePredicate(value, lead, followingTokens) {
            const lower = value.toLocaleLowerCase('en-US');
            if (!/^\p{L}{3,}$/u.test(lower) || followingTokens.length === 0) return false;

            if (/^(?:\p{L}+ed|\p{L}*[^aeiou]ied)$/u.test(lower)) {
              return followingTokens.length >= 2
                || sentenceObjectMarkerPattern.test(followingTokens[0].toLocaleLowerCase('en-US'));
            }

            const normalizedLead = lead.toLocaleLowerCase('en-US');
            if (/^(?:he|she|this|that)$/u.test(normalizedLead)
                && /^(?:\p{L}{2,}(?:s|es)|\p{L}*[^aeiou]ies)$/u.test(lower)) {
              return followingTokens.length >= 2;
            }

            return false;
          }"""
          new_regular = r"""function isLikelyRegularFiniteSentencePredicate(value, lead, followingTokens) {
            const lower = value.toLocaleLowerCase('en-US');
            if (!/^\p{L}{3,}$/u.test(lower) || followingTokens.length === 0) return false;

            if (/^(?:\p{L}+ed|\p{L}*[^aeiou]ied)$/u.test(lower)) {
              return followingTokens.length >= 2
                || sentenceObjectMarkerPattern.test(followingTokens[0].toLocaleLowerCase('en-US'));
            }

            const normalizedLead = lead.toLocaleLowerCase('en-US');
            if (/^(?:he|she|this|that)$/u.test(normalizedLead)
                && /^(?:\p{L}{2,}(?:s|es)|\p{L}*[^aeiou]ies)$/u.test(lower)) {
              return followingTokens.length >= 2;
            }

            const upper = value.toLocaleUpperCase('en-US');
            const hasCase = lower !== upper;
            const ordinaryOrAllCapsToken = /\p{Ll}/u.test(value) || (hasCase && value === upper);
            if (/^(?:we|you|they|these|those)$/u.test(normalizedLead)
                && ordinaryOrAllCapsToken
                && !isBoundedSentencePredicate(value)
                && !sentenceAuxiliaryPattern.test(lower)
                && !sentenceObjectMarkerPattern.test(lower)
                && !titleConnectorPattern.test(value)
                && !institutionalSuffixPattern.test(lower)
                && !/(?:ed|ing)$/u.test(lower)) {
              const firstFollowing = followingTokens[0].toLocaleLowerCase('en-US');
              if (sentenceObjectMarkerPattern.test(firstFollowing)) {
                return followingTokens.length >= 2;
              }
              return !titleConnectorPattern.test(followingTokens[0]);
            }

            return false;
          }"""
          assert source.count(old_regular) == 1, 'regular finite predicate helper changed'
          source = source.replace(old_regular, new_regular, 1)

          helper_marker = 'function isStrongPronounClauseWithinInstitutionalPhrase(value) {'
          assert source.count(helper_marker) == 1, 'pronoun clause helper marker changed'
          assert 'function isTitleCasedPronounObjectClause(value) {' not in source
          title_clause_helper = r"""function isTitleCasedPronounObjectClause(value) {
            const normalized = value.normalize('NFKC').trim();
            const leadMatch = normalized.match(
              /^(?:i|we|you|he|she|they|it|this|that|these|those)(?:\s+|$)/iu
            );
            if (!leadMatch) return false;

            const words = normalized.split(/\s+/u);
            const titleCasedPhrase = words.every((word, index) => {
              if (titleConnectorPattern.test(word)) return true;
              if (index === 0 && /^I$/u.test(word)) return true;
              return /^[\p{Lu}\p{Lt}][\p{Ll}\p{M}\p{N}&'’\-]*$/u.test(word);
            });
            if (!titleCasedPhrase) return false;

            const lead = leadMatch[0].trim();
            const tokens = normalized.slice(leadMatch[0].length)
              .match(/[\p{L}]+/gu)?.slice(0, 8) ?? [];
            if (tokens.length < 3) return false;

            const predicate = tokens[0];
            const postPredicateTokens = tokens.slice(1);
            return (isStrongFiniteSentencePredicate(predicate)
                || isLikelyRegularFiniteSentencePredicate(
                  predicate,
                  lead,
                  postPredicateTokens
                ))
              && sentenceObjectMarkerPattern.test(
                postPredicateTokens[0].toLocaleLowerCase('en-US')
              )
              && postPredicateTokens.length >= 2;
          }

          """
          source = source.replace(helper_marker, title_clause_helper + helper_marker, 1)

          old_suffix_gate = r"""    if (!labelMatch
        && allCapsPhrase
        && isStrongPronounClauseWithinInstitutionalPhrase(phrase)) {
      return false;
    }"""
          new_suffix_gate = r"""    if (!labelMatch
        && (allCapsPhrase || isTitleCasedPronounObjectClause(phrase))
        && isStrongPronounClauseWithinInstitutionalPhrase(phrase)) {
      return false;
    }"""
          assert source.count(old_suffix_gate) == 1, 'institutional suffix clause gate changed'
          source = source.replace(old_suffix_gate, new_suffix_gate, 1)

          old_entity_tail = r"""  const hasMixedCaseTitleToken = words.slice(1).some(word =>
  nameTokenPattern.test(word) && /\p{Ll}/u.test(word)
);
return words.length >= 3 && hasMixedCaseTitleToken;"""
          new_entity_tail = r"""  const hasMixedCaseTitleToken = words.slice(1).some(word =>
  nameTokenPattern.test(word) && /\p{Ll}/u.test(word)
);
if (!labelMatch && isTitleCasedPronounObjectClause(phrase)) return false;
return words.length >= 3 && hasMixedCaseTitleToken;"""
          assert source.count(old_entity_tail) == 1, 'non-suffix title gate changed'
          source = source.replace(old_entity_tail, new_entity_tail, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          marker = '// period abbreviation classification must remain lexical and context-bounded'
          assert tests.count(marker) == 1, 'test insertion marker changed'
          sentinel = 'plural-subject base-form predicates must reset wrapper ownership'
          assert sentinel not in tests, 'plural/title-clause regressions already inserted'
          additions = r"""
          for (const [input, expected] of [
            ['Broken (He moved to the U.S. THEY PURCHASE TICKETS +1 253 477 8777)', 'Broken (He moved to the U.S. THEY PURCHASE TICKETS [contact omitted]'],
            ['Broken (He moved to the U.S. WE ACQUIRE ASSETS +1 253 477 8777)', 'Broken (He moved to the U.S. WE ACQUIRE ASSETS [contact omitted]'],
            ['Broken (He moved to the U.S. YOU PURCHASE THE TICKETS +1 253 477 8777)', 'Broken (He moved to the U.S. YOU PURCHASE THE TICKETS [contact omitted]'],
            ['Broken（He moved to the Ｕ．Ｓ． ＴＨＥＹ ＰＵＲＣＨＡＳＥ ＴＩＣＫＥＴＳ ＋１ ２５３ ４７７ ８７７７）', 'Broken（He moved to the Ｕ．Ｓ． ＴＨＥＹ ＰＵＲＣＨＡＳＥ ＴＩＣＫＥＴＳ [contact omitted]']
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'plural-subject base-form predicates must reset wrapper ownership'
            );
          }

          for (const [input, expected] of [
            ['Broken (He moved to the U.S. He Visited The Company +1 253 477 8777)', 'Broken (He moved to the U.S. He Visited The Company [contact omitted]'],
            ['Broken (He moved to the U.S. She Leads The Foundation +1 253 477 8777)', 'Broken (He moved to the U.S. She Leads The Foundation [contact omitted]'],
            ['Broken（He moved to the Ｕ．Ｓ． Ｈｅ Ｖｉｓｉｔｅｄ Ｔｈｅ Ｃｏｍｐａｎｙ ＋１ ２５３ ４７７ ８７７７）', 'Broken（He moved to the Ｕ．Ｓ． Ｈｅ Ｖｉｓｉｔｅｄ Ｔｈｅ Ｃｏｍｐａｎｙ [contact omitted]']
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'unlabelled title-case object clauses must outrank institutional suffixes'
            );
          }

          for (const [input, expected] of [
            ['Context (U.S. This Is Us Foundation +1 253 477 8777)', 'Context (U.S. This Is Us Foundation [contact omitted])'],
            ['Context (U.S. We Care Center +1 253 477 8777)', 'Context (U.S. We Care Center [contact omitted])'],
            ['Context (U.S. He Visited The Company Phone: +1 253 477 8777)', 'Context (U.S. He Visited The Company Phone: [contact omitted])'],
            ['Context (U.S. THEY PURCHASE TICKETS FOUNDATION Phone: +1 253 477 8777)', 'Context (U.S. THEY PURCHASE TICKETS FOUNDATION Phone: [contact omitted])']
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'title-shaped or terminally labelled institutions must remain protected'
            );
          }

          """
          test_path.write_text(tests.replace(marker, additions + marker, 1), encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          test "$(git diff --name-only | sort)" = "$expected_paths"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          git commit -m 'fix(crawler): classify plural and title-case clauses'
          test "$(git rev-parse HEAD^)" = "$base_sha"
          git push \
            --force-with-lease="refs/heads/$RESULT_BRANCH:$EXPECTED_RESULT_HEAD" \
            origin "HEAD:refs/heads/$RESULT_BRANCH"
