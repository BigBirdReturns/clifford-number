name: Qualify RD-04 North Dakota promotion manifest-contract repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/product-manifest.json'
      - 'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/product-manifest.json'
      - 'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs'

permissions:
  contents: read

env:
  REPAIR_PARENT: 4eaa66d7a0f025e0c4ec797e9925634a22d9e49e
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion
  OUT: /tmp/rd04-nd-current-public-record-gap-promotion-manifest-contract-repair

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact repair topology and canonical promotion product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT/generated"
          EVENT='${{ github.event_name }}'
          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          if [ "$EVENT" = pull_request ]; then
            REPAIR_COMMIT='${{ github.event.pull_request.head.sha }}'
            test "$CHECKOUT_HEAD" = "$REPAIR_COMMIT"
            test '${{ github.event.pull_request.base.sha }}' = "$REPAIR_PARENT"
            test "$(git rev-parse "$REPAIR_COMMIT^")" = "$REPAIR_PARENT"
            git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
            test "$(git rev-parse origin/main)" = "$REPAIR_PARENT"
          else
            read -r P1 P2 EXTRA <<< "$(git show -s --format='%P' HEAD)"
            test "$P1" = "$REPAIR_PARENT"
            test -n "$P2" && test -z "${EXTRA:-}"
            REPAIR_COMMIT="$P2"
            test "$(git rev-parse "$REPAIR_COMMIT^")" = "$REPAIR_PARENT"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$REPAIR_COMMIT^{tree}")"
          fi
          printf '%s\n' "$REPAIR_COMMIT" > "$OUT/repair-commit.txt"
          EXPECTED="$(printf '%s\n' \
            ".github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/product-manifest.json" \
            "test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js" \
            "tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" | LC_ALL=C sort)"
          test "$(git diff --name-only "$REPAIR_PARENT" "$REPAIR_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test "$(git diff --name-only --diff-filter=M "$REPAIR_PARENT" "$REPAIR_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test -z "$(git diff --name-only --diff-filter=ADTRCUXB "$REPAIR_PARENT" "$REPAIR_COMMIT")"
          git diff --check "$REPAIR_PARENT" "$REPAIR_COMMIT"
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promotion-input-custody.json")" = '7401d972c211b6558b5aa09fa59b6344c7a404d2'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promotion-decision.json")" = '7af836513c2eec2a58eea9fa6a95f71b9256748e'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/cell-promotion-ledger.json")" = 'b36b1f85e8d8d3054200bbf2824757e797f70f54'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promoted-partial-field-matrix.json")" = 'c25a1ad8fdfe82f70f1ff71e61da6796be94c737'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/remaining-open-field-census.json")" = '474685d89edcd256995fc1fe220935703453eb3b'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promotion-summary.json")" = 'b6e13e195eb21b4f4285139626baeb0d4bbf2464'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/index.json")" = 'e38a652d93fbd3ae3094173fd5ff9b6cb36c3399'
          test "$(git rev-parse "$REPAIR_COMMIT:tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs")" = '57b74bb8536314f0d0b363de6c40fb9e03b6fd49'
          test "$(git rev-parse "$REPAIR_COMMIT:schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.schema.json")" = '3396ee10b4c4673b836e85ed158a45b8956029dd'
          test "$(git rev-parse "$REPAIR_COMMIT:docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.md")" = 'b06c4e43b2917e1f61a147383cae5c8f771bcc18'
      - name: Rebuild and validate repaired manifest contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node "tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" --out "$OUT/generated" | tee "$OUT/builder.json"
          for name in promotion-input-custody.json promotion-decision.json cell-promotion-ledger.json promoted-partial-field-matrix.json remaining-open-field-census.json promotion-summary.json index.json; do
            cmp "$OUT/generated/$name" "$PRODUCT_ROOT/$name"
          done
          node "tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" | tee "$OUT/validator.json"
          node "test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js" | tee "$OUT/adversarial.json"
          jq -e '.refusals == 44' "$OUT/adversarial.json" > /dev/null
          npm run release:check > "$OUT/release-check.log" 2>&1
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain)"
          node "tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" > "$OUT/post-release-validator.json"
          cmp "$OUT/validator.json" "$OUT/post-release-validator.json"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve exact repair qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-current-public-record-gap-promotion-manifest-contract-repair-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
