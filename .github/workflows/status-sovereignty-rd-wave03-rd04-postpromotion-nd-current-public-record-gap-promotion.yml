name: Qualify RD-04 North Dakota current public-record-gap promotion

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs'

permissions:
  contents: read

env:
  CANONICAL_PARENT: 77aef3313e85e1fddc68805a9f22252ff147b4e8
  WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion
  OUT: /tmp/rd04-nd-current-public-record-gap-promotion

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact product topology and canonical inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT/generated"
          EVENT='${{ github.event_name }}'
          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          if [ "$EVENT" = pull_request ]; then
            PRODUCT_COMMIT='${{ github.event.pull_request.head.sha }}'
            test "$CHECKOUT_HEAD" = "$PRODUCT_COMMIT"
            test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_PARENT"
            test "$(git rev-parse "$PRODUCT_COMMIT^")" = "$CANONICAL_PARENT"
            git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
            test "$(git rev-parse origin/main)" = "$CANONICAL_PARENT"
          else
            read -r P1 P2 EXTRA <<< "$(git show -s --format='%P' HEAD)"
            test "$P1" = "$CANONICAL_PARENT"
            test -n "$P2" && test -z "${EXTRA:-}"
            PRODUCT_COMMIT="$P2"
            test "$(git rev-parse "$PRODUCT_COMMIT^")" = "$CANONICAL_PARENT"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$PRODUCT_COMMIT^{tree}")"
          fi
          printf '%s\n' "$PRODUCT_COMMIT" > "$OUT/product-commit.txt"
          EXPECTED="$(printf '%s\n' \
            ".github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/promotion-input-custody.json" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/promotion-decision.json" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/cell-promotion-ledger.json" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/promoted-partial-field-matrix.json" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/remaining-open-field-census.json" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/promotion-summary.json" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/index.json" \
            "data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/product-manifest.json" \
            "docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.md" \
            "schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.schema.json" \
            "test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js" \
            "tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" \
            "tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" | LC_ALL=C sort)"
          test "$(git diff --name-only "$CANONICAL_PARENT" "$PRODUCT_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" "$PRODUCT_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" "$PRODUCT_COMMIT")"
          git diff --check "$CANONICAL_PARENT" "$PRODUCT_COMMIT"
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json")" = '19357f8214ab2710bc5e75b3fae8c7fb09ff1654'
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/promotion-candidate.json")" = 'c5af22ad9457f93d3a34734982434bbee764b051'
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/source-corpus.json")" = 'c4cf754c064e4cc707b7b55ca872eff3006afe07'
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/field-decision.json")" = '54ab12737d4bcfba8f79373bab826d72db469d8d'
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation/candidate-validation.json")" = '504c828de461d3933af7d755d15e254cd2261ccd'
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation/current-cell-custody.json")" = 'd466159af5abb0ec677388389accc23a3c36e5ef'
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation/validated-candidate-protocol.json")" = '9abd89f655573827bfabad60e0923e2f80a7f4aa'
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation/product-manifest.json")" = '85e54edfc3789d5579ba227d55b09773451ad092'
      - name: Rebuild and validate exact one-cell promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          node "tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" --out "$OUT/generated" | tee "$OUT/builder.json"
          for name in promotion-input-custody.json promotion-decision.json cell-promotion-ledger.json promoted-partial-field-matrix.json remaining-open-field-census.json promotion-summary.json index.json; do
            cmp "$OUT/generated/$name" "$PRODUCT_ROOT/$name"
          done
          node "tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" | tee "$OUT/validator.json"
          node "test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js" | tee "$OUT/adversarial.json"
          npm run release:check > "$OUT/release-check.log" 2>&1
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain)"
          node "tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs" > "$OUT/post-release-validator.json"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve exact qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-current-public-record-gap-promotion-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
