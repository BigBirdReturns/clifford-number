name: M-05 trusted observation-time product materializer v2

on:
  push:
    branches:
      - agent/m05-s03-l7-observation-time-materializer-v2
    paths:
      - '.tmp/m05-observation-time-v2/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-observation-time-materializer-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize exact four-path observation-time product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .tmp/m05-observation-time-v2/materialize.sh
