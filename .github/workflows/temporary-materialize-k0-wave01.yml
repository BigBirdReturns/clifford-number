name: Temporary materialize K0 role-neutral wave 01

on:
  push:
    branches:
      - agent/k0-role-neutral-wave-01
    paths:
      - '.github/workflows/temporary-materialize-k0-wave01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand exact Wave 01 materializer
        run: |
          base64 -d .github/tmp/k0-wave01-payload.b64 > /tmp/k0-wave01.tgz
          test "$(sha256sum /tmp/k0-wave01.tgz | awk '{print $1}')" = "4dd0c8e2401a74ed4fbf2dd640a3866a1f73f1bcf3e41bcee81ba02bfc2fb84f"
          rm -rf /tmp/k0-wave01
          mkdir -p /tmp/k0-wave01
          tar -xzf /tmp/k0-wave01.tgz -C /tmp/k0-wave01

      - name: Materialize and validate Wave 01
        run: |
          node /tmp/k0-wave01/materialize-k0-role-neutral-wave-01.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-role-neutral-wave-01.mjs
          node test/k0-role-neutral-wave-01.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          node /tmp/k0-wave01/materialize-k0-role-neutral-wave-01.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-role-neutral-wave-01.mjs
          node test/k0-role-neutral-wave-01.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Enforce permanent path denominator
        run: |
          python - <<'PYDENOM'
          import subprocess
          expected = {
              '.github/workflows/k0-role-neutral-wave-01.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-01.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-01.md',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-01.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-01.mjs',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM

      - name: Create exact blobs and export transaction receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBLOBS'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          parent = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          paths = [
              '.github/workflows/k0-role-neutral-wave-01.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-01.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-01.md',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-01.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-01.mjs',
          ]

          def post(path, payload):
              req = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'k0-role-neutral-wave-01',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          rows = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = post(f'/repos/{repo}/git/blobs', {
                  'content': base64.b64encode(raw).decode(),
                  'encoding': 'base64',
              })
              index_row = subprocess.check_output(['git','ls-files','-s','--',path], text=True).strip()
              mode = index_row.split()[0] if index_row else '100644'
              rows.append({'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': mode})

          receipt = {
              'schema_version': 'k0-role-neutral-wave-01-transaction@1',
              'repository': repo,
              'parent': parent,
              'base_tree': base_tree,
              'updates': rows,
              'deletions': [
                  '.github/tmp/k0-wave01-payload.b64',
                  '.github/workflows/temporary-materialize-k0-wave01.yml',
              ],
              'ref_updated': False,
              'graph_effect': 'none',
          }
          os.makedirs('/tmp/k0-wave01-export', exist_ok=True)
          with open('/tmp/k0-wave01-export/BLOB_RECEIPTS.json', 'w') as handle:
              json.dump(receipt, handle, indent=2)
              handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PYBLOBS

      - name: Seal validated transaction
        run: |
          cp /tmp/k0-wave01.tgz /tmp/k0-wave01-export/materializer.tgz
          sha256sum /tmp/k0-wave01-export/* > /tmp/k0-wave01-export/SHA256SUMS.txt
          tar -czf /tmp/k0-role-neutral-wave-01-transaction.tgz -C /tmp/k0-wave01-export .
          sha256sum /tmp/k0-role-neutral-wave-01-transaction.tgz > /tmp/k0-role-neutral-wave-01-transaction.sha256

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-role-neutral-wave-01-validated-transaction
          path: |
            /tmp/k0-role-neutral-wave-01-transaction.tgz
            /tmp/k0-role-neutral-wave-01-transaction.sha256
          if-no-files-found: error
          retention-days: 30
