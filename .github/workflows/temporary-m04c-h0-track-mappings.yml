name: Temporary materialize M-04C H0 research-track mappings

on:
  push:
    branches: [agent/m04c-h0-track-mappings]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04c-h0-track-mappings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize explicit research-track mappings
        run: |
          node .github/temporary/m04c-h0-track-mappings/materialize.mjs
          node tools/build-estate-lens-audit.mjs
          node tools/validate-estate-lens-audit.mjs
          node test/estate-lens-audit.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Remove one-shot carrier
        run: |
          rm -rf .github/temporary/m04c-h0-track-mappings
          rm -f .github/workflows/temporary-m04c-h0-track-mappings.yml
      - name: Restore unrelated generated projections
        run: |
          python - <<'PY'
          import os
          import subprocess

          allowed_exact = {
              'data/project/estate-lens-mappings.jsonl',
              'test/estate-lens-audit.test.js',
              'docs/milestones/m04c-h0-research-track-mappings.md',
              'build/core-thesis/estate-lens-audit-manifest.json',
              'build/core-thesis/estate-lens-audit.md',
              'reports/core-thesis/unmapped-sections/data.json',
              'reports/core-thesis/unmapped-sections/index.html',
              '.github/workflows/temporary-m04c-h0-track-mappings.yml',
          }
          allowed_prefix = (
              'build/core-thesis/estate-lens-audit/estates/',
              'build/core-thesis/estate-lens-fanout/',
              'reports/core-thesis/unmapped-sections/estates/',
              '.github/temporary/m04c-h0-track-mappings/',
          )

          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          for row in rows:
              status = row[:2]
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefix):
                  continue
              if status == '??':
                  if os.path.isdir(path):
                      subprocess.run(['rm', '-rf', path], check=True)
                  elif os.path.exists(path):
                      os.remove(path)
              else:
                  subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '--', path], check=True)
          PY
      - name: Validate permanent branch state
        run: |
          node tools/build-estate-lens-audit.mjs
          node tools/validate-estate-lens-audit.mjs
          node test/estate-lens-audit.test.js
          git diff --check
      - name: Commit verified mapping pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/temporary/m04c-h0-track-mappings \
            .github/workflows/temporary-m04c-h0-track-mappings.yml \
            data/project/estate-lens-mappings.jsonl \
            test/estate-lens-audit.test.js \
            docs/milestones/m04c-h0-research-track-mappings.md \
            build/core-thesis/estate-lens-audit-manifest.json \
            build/core-thesis/estate-lens-audit.md \
            build/core-thesis/estate-lens-audit/estates \
            build/core-thesis/estate-lens-fanout \
            reports/core-thesis/unmapped-sections
          git commit -m "Map every declared research track across the estates"
          git push origin HEAD:${GITHUB_REF_NAME}
