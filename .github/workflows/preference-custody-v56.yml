name: Preference custody laboratory floor v56

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/**'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.mjs'
      - 'tools/validate-preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v56.mjs'
      - 'tools/validate-preference-custody-manifest-v56.mjs'
      - 'test/preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.test.js'
      - 'test/preference-custody-manifest-v56.test.js'
      - 'docs/preference-custody-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v56.md'
      - '.github/workflows/preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.yml'
      - '.github/workflows/preference-custody-v56.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v56:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile and validate PC-58 and floor v56
        run: |
          node tools/compile-preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.mjs
          node tools/validate-preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.mjs
          node test/preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.test.js
          node tools/compile-preference-custody-manifest-v56.mjs
          node tools/validate-preference-custody-manifest-v56.mjs
          node test/preference-custody-manifest-v56.test.js
      - name: Reconstruct every Preference Custody floor
        run: |
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
      - name: Enforce no-magic-human and repository release gates
        run: |
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v56
          path: |
            build/research/preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.json
            build/research/preference-linkage-repository-owner-login-immutable-owner-id-account-state-owner-rename-assurance.md
            build/research/preference-custody-laboratory-floor-v56.json
            build/research/preference-custody-laboratory-floor-v56.md
          if-no-files-found: error
