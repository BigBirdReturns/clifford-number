name: PC-62 terminal-controller patch materializer

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc62-terminal-controller-patch-materializer.yml'

permissions:
  contents: write

concurrency:
  group: pc62-terminal-controller-patch-materializer
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPOSITORY: ${{ github.repository }}
  OUT: /tmp/pc62-terminal-controller-patch-materializer
  ORIGINAL_CONTROLLER_BLOB: c7b81be209eb2bed2a382ac325a8a66c55101ead
  ORIGINAL_CONTROLLER_SHA256: dbd27049e6c49498847bff4fbf263d73b43f90a06d911314501486d8d45208a5
  PATCH_BLOB: b3b5c02e5a0c1c2cf1b9f0bce25bd8f6bff161e5
  PATCH_SHA256: c4b1c40db1b4ca0151913fd1d336592f725f50a5600705cdd7521b153b6754d8
  FINAL_CONTROLLER_BLOB: 22d7deb733f0b82db4fe6ef93a6f94170ff5d7d0
  FINAL_CONTROLLER_SHA256: 5ffb4f91dd483c017ad0709e9d64bea5539274a5a1991fb13461fa36ecd29c67
  FINAL_CONTROLLER_BYTES: '36236'
  FINAL_PRODUCT: 6c2ffff2b1768f766a84a4bd37f9c1a9ab7827cd
  FINAL_PRODUCT_TREE: 0a6ebb735cfb7670a65da26c148306ece9fcc0c3

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/pc62-terminal-controller-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Authenticate, patch, and publish exact terminal-controller blob
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          rm -rf "$OUT"
          mkdir -p "$OUT"

          gh api "/repos/$GH_REPOSITORY/git/blobs/$ORIGINAL_CONTROLLER_BLOB" > "$OUT/original-blob.json"
          test "$(jq -r .sha "$OUT/original-blob.json")" = "$ORIGINAL_CONTROLLER_BLOB"
          jq -r .content "$OUT/original-blob.json" | tr -d '\n' | base64 -d > "$OUT/original-controller.yml"
          test "$(git hash-object "$OUT/original-controller.yml")" = "$ORIGINAL_CONTROLLER_BLOB"
          test "$(sha256sum "$OUT/original-controller.yml" | awk '{print $1}')" = "$ORIGINAL_CONTROLLER_SHA256"

          gh api "/repos/$GH_REPOSITORY/git/blobs/$PATCH_BLOB" > "$OUT/patch-blob.json"
          test "$(jq -r .sha "$OUT/patch-blob.json")" = "$PATCH_BLOB"
          jq -r .content "$OUT/patch-blob.json" | tr -d '\n' | base64 -d > "$OUT/controller.patch"
          test "$(git hash-object "$OUT/controller.patch")" = "$PATCH_BLOB"
          test "$(sha256sum "$OUT/controller.patch" | awk '{print $1}')" = "$PATCH_SHA256"

          cp "$OUT/original-controller.yml" "$OUT/final-controller.yml"
          patch --batch --fuzz=0 --no-backup-if-mismatch "$OUT/final-controller.yml" < "$OUT/controller.patch"
          test "$(wc -c < "$OUT/final-controller.yml" | tr -d ' ')" = "$FINAL_CONTROLLER_BYTES"
          test "$(sha256sum "$OUT/final-controller.yml" | awk '{print $1}')" = "$FINAL_CONTROLLER_SHA256"
          test "$(git hash-object "$OUT/final-controller.yml")" = "$FINAL_CONTROLLER_BLOB"
          ruby -e 'require "yaml"; document=YAML.load_file(ARGV[0]); abort "controller identity" unless document["name"]=="PC-62 terminal reconciler"; abort "product pin" unless document["env"]["PRODUCT"]==ENV["FINAL_PRODUCT"]; abort "tree pin" unless document["env"]["PRODUCT_TREE"]==ENV["FINAL_PRODUCT_TREE"]' "$OUT/final-controller.yml"

          encoded=$(base64 -w0 "$OUT/final-controller.yml")
          gh api --method POST "/repos/$GH_REPOSITORY/git/blobs" -f content="$encoded" -f encoding=base64 > "$OUT/final-blob-response.json"
          test "$(jq -r .sha "$OUT/final-blob-response.json")" = "$FINAL_CONTROLLER_BLOB"

          jq -n \
            --arg schema_version pc62-terminal-controller-patch-materializer@1 \
            --arg original_controller_blob "$ORIGINAL_CONTROLLER_BLOB" \
            --arg original_controller_sha256 "sha256:$ORIGINAL_CONTROLLER_SHA256" \
            --arg patch_blob "$PATCH_BLOB" \
            --arg patch_sha256 "sha256:$PATCH_SHA256" \
            --arg final_controller_blob "$FINAL_CONTROLLER_BLOB" \
            --arg final_controller_sha256 "sha256:$FINAL_CONTROLLER_SHA256" \
            --arg final_product "$FINAL_PRODUCT" \
            --arg final_product_tree "$FINAL_PRODUCT_TREE" \
            '{schema_version:$schema_version,status:"complete",original_controller:{blob:$original_controller_blob,sha256:$original_controller_sha256},patch:{blob:$patch_blob,sha256:$patch_sha256},final_controller:{blob:$final_controller_blob,sha256:$final_controller_sha256,bytes:36236,yaml_parsed:true},final_product:{commit:$final_product,tree:$final_product_tree},product_semantics_changed:false,graph_effect:"none"}' > "$OUT/receipt.json"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload controller patch materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc62-terminal-controller-patch-materializer
          path: /tmp/pc62-terminal-controller-patch-materializer
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
