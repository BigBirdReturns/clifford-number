name: Temporary materialize M-05 Sprint 02 Leg 01

on:
  push:
    branches:
      - agent/m05-sprint-02-leg-01-clifford-decision-file
    paths:
      - '.github/workflows/temporary-m05-sprint02-leg01-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-02-leg-01-clifford-decision-file
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate permanent products
        run: |
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/build-m05-answerable-power-sprint-01.mjs
          node tools/validate-m05-answerable-power-sprint-01.mjs
          node test/m05-answerable-power-sprint-01.test.js
          node tools/build-m05-answerable-power-sprint-02-leg-01.mjs
          node tools/validate-m05-answerable-power-sprint-02-leg-01.mjs
          node test/m05-answerable-power-sprint-02-leg-01.test.js
          npm run release:check
      - name: Commit generated reports and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-m05-sprint02-leg01-materialize.yml
          git add -- reports/core-thesis/answerable-power/sprint-02-leg-01.json reports/core-thesis/answerable-power/sprint-02-leg-01.html
          git diff --cached --check
          git commit -m 'Materialize M-05 Sprint 02 Leg 01 reports'
          git push origin HEAD:refs/heads/agent/m05-sprint-02-leg-01-clifford-decision-file
