name: Thesis assembly

on:
  pull_request:
    paths:
      - 'data/research/theses/**'
      - 'data/research/thesis-evidence/**'
      - 'data/research/thesis-reviews/**'
      - 'tools/lib/thesis.mjs'
      - 'tools/compile-thesis.mjs'
      - 'tools/validate-thesis.mjs'
      - 'test/thesis-assembly.test.js'
      - 'docs/thesis-assembly.md'
      - 'package.json'
      - '.github/workflows/thesis-assembly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thesis-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile thesis dossier
        run: npm run compile:thesis
      - name: Validate thesis dossier
        run: npm run validate:thesis
      - name: Exercise falsification and review fixtures
        run: node test/thesis-assembly.test.js
      - name: Preserve deterministic dossier
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-population-thesis-dossier
          path: |
            build/thesis/synthetic-population-infrastructure.json
            build/thesis/synthetic-population-infrastructure.md
          if-no-files-found: error
