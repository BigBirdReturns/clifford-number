name: TEMP repair one RD-04 transport byte

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temp-ssc-rd04-mf7-shard013-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/ssc-rd04-mf7-capture-adjudication-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Correct exact shard byte and retire this workflow
        run: |
          set -Eeuo pipefail
          FILE=.transport/ssc-rd04-mf7-capture-adjudication-v2/part-013.b64
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('.transport/ssc-rd04-mf7-capture-adjudication-v2/part-013.b64')
          data = bytearray(path.read_bytes())
          assert len(data) == 5000
          assert hashlib.sha256(data).hexdigest() == '424cda79191c9bf6809add2dae4f3c0a6aa76e35405f64c037be0d53c0d6df22'
          assert data[2465:2466] == b'3'
          data[2465:2466] = b'8'
          assert hashlib.sha256(data).hexdigest() == '8317e829785761158f785b0269af8bfe3b3b85fe908fea7dcba13eb5a949798b'
          path.write_bytes(data)
          print('transport_shard_013_exact_byte_repair=pass offset=2465 old=3 new=8')
          PY
          git rm .github/workflows/temp-ssc-rd04-mf7-shard013-repair.yml
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'TEMP repair exact RD-04 transport shard byte'
          git push origin "HEAD:${{ github.head_ref }}"
