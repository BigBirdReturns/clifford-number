name: TEMP qualify and create exact PC-51 product blobs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc51-product-blob-carrier-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify-and-create-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, verify, qualify, and create immutable Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, os, subprocess, tarfile, urllib.request
          from pathlib import Path

          root = Path.cwd()
          carrier_root = root / '.pc51-carrier'
          manifest = json.loads((carrier_root / 'manifest.json').read_text())
          if manifest.get('schema_version') != 'pc51-product-carrier-manifest@1':
              raise SystemExit('carrier manifest schema mismatch')
          parent = manifest['qualified_parent_commit']
          expected_carrier_paths = {
              '.github/workflows/temp-pc51-product-blob-carrier.yml',
              '.pc51-carrier/manifest.json',
              *[entry['path'] for entry in manifest['shards']],
          }
          merge_base = subprocess.check_output(['git', 'merge-base', 'HEAD', parent], text=True).strip()
          if merge_base != parent:
              raise SystemExit(f'carrier is not rooted at qualified parent: {merge_base} != {parent}')
          actual_carrier_paths = set(subprocess.check_output(
              ['git', 'diff', '--name-only', parent, 'HEAD'], text=True
          ).splitlines())
          if actual_carrier_paths != expected_carrier_paths:
              raise SystemExit(f'carrier path mismatch: {sorted(actual_carrier_paths)}')

          shard_bytes = []
          shard_receipts = []
          for spec in sorted(manifest['shards'], key=lambda item: item['ordinal']):
              transported = (root / spec['path']).read_bytes()
              raw = transported
              transport_normalization = 'none'
              if len(transported) == spec['bytes'] + 1 and transported.endswith(b'\n'):
                  raw = transported[:-1]
                  transport_normalization = 'one_terminal_lf_removed'
              digest = hashlib.sha256(raw).hexdigest()
              if len(raw) != spec['bytes'] or digest != spec['sha256']:
                  raise SystemExit(
                      f"shard custody mismatch: {spec['path']} "
                      f"transport_bytes={len(transported)} normalized_bytes={len(raw)} "
                      f"normalized_sha256={digest}"
                  )
              shard_bytes.append(raw)
              shard_receipts.append({
                  **spec,
                  'transport_bytes': len(transported),
                  'transport_sha256': hashlib.sha256(transported).hexdigest(),
                  'transport_normalization': transport_normalization,
                  'observed_sha256': digest,
              })
          b64 = b''.join(shard_bytes)
          if len(b64) != manifest['base64_bytes'] or hashlib.sha256(b64).hexdigest() != manifest['base64_sha256']:
              raise SystemExit('aggregate base64 custody mismatch')
          try:
              archive = base64.b64decode(b64, validate=True)
          except Exception as error:
              raise SystemExit(f'base64 decoding failed: {error}')
          if len(archive) != manifest['archive_bytes'] or hashlib.sha256(archive).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('archive custody mismatch')

          product_root = Path('/tmp/pc51-product')
          product_root.mkdir(parents=True, exist_ok=True)
          expected_files = {entry['path']: entry for entry in manifest['product_files']}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tf:
              file_members = [member for member in tf.getmembers() if member.isfile()]
              observed_names = {member.name for member in file_members}
              if observed_names != set(expected_files):
                  raise SystemExit(f'archive path mismatch: {sorted(observed_names)}')
              for member in file_members:
                  if member.name.startswith('/') or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  tf.extract(member, path=product_root)

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          blob_receipts = []
          for path, spec in expected_files.items():
              raw = (product_root / path).read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              git_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              if len(raw) != spec['bytes'] or digest != spec['sha256'] or git_blob != spec['git_blob_sha1']:
                  raise SystemExit(f'product file custody mismatch: {path}')
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)
              payload = json.dumps({
                  'content': base64.b64encode(raw).decode(),
                  'encoding': 'base64',
              }).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'pc51-product-blob-carrier',
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.load(response)
              if result.get('sha') != git_blob:
                  raise SystemExit(f'remote blob mismatch for {path}: {result.get("sha")} != {git_blob}')
              blob_receipts.append({**spec, 'remote_git_blob_sha1': result['sha']})

          receipt_root = Path('/tmp/pc51-product-blob-receipt')
          receipt_root.mkdir(parents=True, exist_ok=True)
          receipt = {
              'schema_version': 'pc51-product-blob-receipt@2',
              'qualified_parent_commit': parent,
              'qualified_parent_tree': manifest['qualified_parent_tree'],
              'carrier_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'carrier_paths': sorted(actual_carrier_paths),
              'archive_bytes': len(archive),
              'archive_sha256': hashlib.sha256(archive).hexdigest(),
              'base64_bytes': len(b64),
              'base64_sha256': hashlib.sha256(b64).hexdigest(),
              'shards': shard_receipts,
              'product_path_count': len(blob_receipts),
              'product_files': blob_receipts,
              'ref_updates': 0,
              'outside_human_dependency': False,
              'graph_effect': 'none',
          }
          (receipt_root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (receipt_root / 'product-file-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps({
              'qualified_parent_commit': parent,
              'product_path_count': len(blob_receipts),
              'archive_sha256': receipt['archive_sha256'],
              'remote_blobs_created': len(blob_receipts),
              'ref_updates': 0,
          }, indent=2))
          PY

          node tools/compile-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          node tools/validate-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          node test/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.test.js
          node tools/compile-preference-custody-manifest-v49.mjs
          node tools/validate-preference-custody-manifest-v49.mjs
          node test/preference-custody-manifest-v49.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          printf '%s\n' \
            'focused_pc51: pass' \
            'floor_v49: pass' \
            'no_magic_human: pass' \
            >> /tmp/pc51-product-blob-receipt/gates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pc51-product-blob-receipt
          path: /tmp/pc51-product-blob-receipt
          if-no-files-found: error
          retention-days: 90
