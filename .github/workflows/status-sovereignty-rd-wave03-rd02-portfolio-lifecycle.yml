name: SSC RD-02 Wave 03 portfolio-lifecycle terminal closure

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.yml'
      - 'data/project/ssc-residual-wave03/seeds/RD-02-C05.json'
      - 'data/project/ssc-residual-wave03/closures/RD-02-C05.json'
      - 'data/project/ssc-residual-wave02/closures/RD-02-C04.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/**'
      - 'data/research/status-sovereignty-rd-wave02-rd02-license-leverage/**'
      - 'data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/**'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-current.json'
      - 'schemas/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs'
      - 'test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd02-portfolio-lifecycle.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.yml'
      - 'data/project/ssc-residual-wave03/closures/RD-02-C05.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/**'
      - 'data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/**'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-current.json'
      - 'schemas/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs'
      - 'test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd02-portfolio-lifecycle.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd02-wave03-portfolio-lifecycle-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact terminal product and forward cumulative-ledger custody
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs
          node --check test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.test.js
          node tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs
          node test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore volatile outputs and replay deterministic terminal build
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs --write
          node tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.mjs
          node test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve exact terminal custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd02-wave03-portfolio-lifecycle-terminal
          path: |
            data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/terminal-field-matrix.json
            data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/summary.json
            data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/class-receipt.json
            data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/manifest.json
            data/project/ssc-residual-wave03/closures/RD-02-C05.json
            schemas/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle.schema.json
            docs/milestones/ssc-rd-wave03-rd02-portfolio-lifecycle.md
          if-no-files-found: error
          retention-days: 90
