name: Materialize SSC RD-04 SNAP route adjudication A04

on:
  push:
    branches:
      - 'agent/ssc-rd04-snap-route-adjudication-a04'
    paths:
      - '.github/workflows/materialize-ssc-rd04-snap-route-adjudication-a04.yml'
      - 'tools/acquire-status-sovereignty-rd04-snap-route-adjudication-a04.py'
      - 'tools/lib/ssc_rd04_a04_*.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssc-rd04-a04-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-snap-route-adjudication-a04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch and terminally adjudicate all A04 URLs
        env:
          A04_WORKERS: '8'
        run: python tools/acquire-status-sovereignty-rd04-snap-route-adjudication-a04.py
      - name: Build deterministic products
        run: python tools/build-status-sovereignty-rd04-snap-route-adjudication-a04.py
      - name: Validate exact page custody and score law
        run: python tools/validate-status-sovereignty-rd04-snap-route-adjudication-a04.py
      - name: Exercise positive and adversarial fixtures
        run: python test/status-sovereignty-rd04-snap-route-adjudication-a04.test.py
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Publish product without result shopping
        env:
          BRANCH: agent/ssc-rd04-snap-route-adjudication-a04
        run: |
          expected="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete SSC RD-04 A04 route adjudication"
          git push origin "HEAD:${BRANCH}"
