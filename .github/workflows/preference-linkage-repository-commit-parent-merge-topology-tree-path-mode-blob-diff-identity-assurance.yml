name: Preference linkage repository, commit, parent, merge topology, tree, path mode, blob, and diff identity assurance

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.fixture.json'
      - 'tools/lib/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.mjs'
      - 'tools/compile-preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.mjs'
      - 'tools/validate-preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.mjs'
      - 'test/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.test.js'
      - 'docs/preference-custody-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.md'
      - '.github/workflows/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pc54:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile, validate, and test PC-54
        run: |
          node tools/compile-preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.mjs
          node tools/validate-preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.mjs
          node test/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance
          path: |
            build/research/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.json
            build/research/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.md
          if-no-files-found: error
