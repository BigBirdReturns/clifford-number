name: PR2211 structural matrix

on:
  push:
    branches:
      - 'agent/pr2211-structural-matrix-v1'
    paths:
      - '.github/workflows/pr2211-structural-matrix.yml'
      - 'tools/temporary-pr2211-structural-matrix-trigger.txt'

permissions:
  contents: write

concurrency:
  group: pr2211-structural-matrix
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr2211-structural-matrix-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute exact structural matrix and record receipt
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p receipts/qualification
          set +e
          {
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          const exactCases = [
            [
              'Context (Phone: 03-6216-8041)090-1234-5678',
              'Context (Phone: [contact omitted])[contact omitted]'
            ],
            [
              '文脈（電話：０３－６２１６－８０４１）０９０－１２３４－５６７８',
              '文脈（電話：[contact omitted]）[contact omitted]'
            ],
            [
              'Context ((Phone: 03-6216-8041)090-1234-5678))',
              'Context ((Phone: [contact omitted])[contact omitted])'
            ],
            [
              '文脈（（電話：０３－６２１６－８０４１）０９０－１２３４－５６７８））',
              '文脈（（電話：[contact omitted]）[contact omitted]）'
            ],
            [
              'Context (Phone: 03-6216-8041))090-1234-5678',
              'Context (Phone: [contact omitted])[contact omitted]'
            ],
            [
              'Context (Phone: 03-6216-8041) )090-1234-5678',
              'Context (Phone: [contact omitted])[contact omitted]'
            ],
            [
              'Outer (Context (Phone: 03-6216-8041)090-1234-5678))',
              'Outer (Context (Phone: [contact omitted])[contact omitted])'
            ],
            [
              'Context (Phone: (03) )6216-8041)090-1234-5678',
              'Context (Phone: [contact omitted])[contact omitted]'
            ],
            [
              'Phone: 03-6216-8041)090-1234-5678',
              'Phone: [contact omitted][contact omitted]'
            ],
            [
              'Phone: 03-6216-8041) 090-1234-5678',
              'Phone: [contact omitted] [contact omitted]'
            ],
            [
              'Context (Phone: 03-6216-8041)090-1234-5678 90 people',
              'Context (Phone: [contact omitted])[contact omitted] 90 people'
            ],
            [
              'Context (Phone: 03-6216-8041)090-1234-5678 ext 1234',
              'Context (Phone: [contact omitted])[contact omitted] ext [contact omitted]'
            ]
          ];

          for (const [input, expected] of exactCases) {
            const actual = redactContactData(input);
            console.log(JSON.stringify({ input, expected, actual }));
            assert.equal(actual, expected);
          }

          const invariantCases = [
            'Context (((Phone: 03-6216-8041)090-1234-5678)))',
            'Context (Phone: ((03) 6216 5111)090-1234-5678)',
            '文脈（電話：（（０３） ６２１６ ５１１１）０９０－１２３４－５６７８）',
            'Context (Phone: 03-6216-8041)090-1234-5678)080-1111-2222',
            'Context ((Phone: 03-6216-8041))090-1234-5678',
            'Outer (Context (Phone: (03) )6216-8041)090-1234-5678)'
          ];

          const balance = value => {
            let depth = 0;
            for (const character of value.normalize('NFKC')) {
              if (character === '(') depth += 1;
              if (character === ')') depth -= 1;
              assert.ok(depth >= 0, `negative structural depth for ${JSON.stringify(value)}`);
            }
            return depth;
          };

          for (const input of invariantCases) {
            const actual = redactContactData(input);
            console.log(JSON.stringify({ input, actual }));
            assert.equal(balance(actual), 0, `unbalanced output for ${JSON.stringify(input)}`);
            assert.doesNotMatch(actual, /6216|8041|1234|5678|1111|2222/u);
            assert.ok((actual.match(/\[contact omitted\]/gu) ?? []).length >= 2);
          }
          NODE
            node test/industrial-exhaust.test.js
            node test/industrial-exhaust-artifacts.test.js
            git diff --check
          } > /tmp/pr2211-structural-matrix.log 2>&1
          status=$?
          set -e

          {
            printf 'product_head=%s\n' '18c5e3d0ea816adfc15ed9e858747e6c0aca3bf7'
            printf 'matrix_carrier=%s\n' "$(git rev-parse HEAD)"
            printf 'status=%s\n' "${status}"
            printf '%s\n' '--- output ---'
            cat /tmp/pr2211-structural-matrix.log
          } > receipts/qualification/pr2211-structural-matrix.txt

          cat receipts/qualification/pr2211-structural-matrix.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- receipts/qualification/pr2211-structural-matrix.txt
          git commit -m 'test(crawler): record PR2211 structural matrix'
          git push origin HEAD:refs/heads/agent/pr2211-structural-matrix-v1
          exit "${status}"
