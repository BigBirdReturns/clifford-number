name: PC-61 v5 workflow registration repair

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc61-v5-registration-repair.yml'
      - '.github/workflows/pc61-terminal-reconciler-v5.yml'

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pc61-v5-registration-repair
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPOSITORY: ${{ github.repository }}
  TARGET_BRANCH: 'agent/pc61-terminal-reconcile-v5'
  TARGET_PATH: '.github/workflows/pc61-terminal-reconciler-v5.yml'
  ORIGINAL_BLOB: '9930cd150c51855a1679dc264b084893afcc2132'
  OUT: '/tmp/pc61-v5-registration-repair'

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pc61-terminal-reconcile-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Replace only the invalid 420-minute job timeout
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"

          gh api --method GET "/repos/$GH_REPOSITORY/contents/$TARGET_PATH" -f ref="$TARGET_BRANCH" > "$OUT/content-before.json"
          before_blob=$(jq -r .sha "$OUT/content-before.json")
          jq -r .content "$OUT/content-before.json" | tr -d '\n' | base64 -d > "$OUT/before.yml"
          test "$(git hash-object "$OUT/before.yml")" = "$before_blob"

          if grep -qx '    timeout-minutes: 360' "$OUT/before.yml" && ! grep -qx '    timeout-minutes: 420' "$OUT/before.yml"; then
            jq -n --arg schema_version 'pc61-v5-registration-repair@1' --arg status 'already_repaired' --arg branch "$TARGET_BRANCH" --arg path "$TARGET_PATH" --arg blob "$before_blob" '{schema_version:$schema_version,status:$status,target_branch:$branch,target_path:$path,current_blob:$blob,changed:false,product_semantics_changed:false,graph_effect:"none"}' > "$OUT/receipt.json"
          else
            test "$before_blob" = "$ORIGINAL_BLOB"
            test "$(grep -xc '    timeout-minutes: 420' "$OUT/before.yml")" = 1
            test "$(grep -xc '    timeout-minutes: 360' "$OUT/before.yml" || true)" = 0

            python - "$OUT/before.yml" "$OUT/after.yml" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text()
          old = '    timeout-minutes: 420\n'
          new = '    timeout-minutes: 360\n'
          if source.count(old) != 1 or source.count(new) != 0:
              raise SystemExit('timeout replacement denominator mismatch')
          target = source.replace(old, new)
          if target.count(new) != 1 or target.count(old) != 0:
              raise SystemExit('timeout replacement result mismatch')
          Path(sys.argv[2]).write_text(target)
          PY

            diff -u "$OUT/before.yml" "$OUT/after.yml" > "$OUT/exact.patch" || test "$?" = 1
            test "$(grep -c '^-' "$OUT/exact.patch")" = 2
            test "$(grep -c '^+' "$OUT/exact.patch")" = 2
            after_blob=$(git hash-object "$OUT/after.yml")
            encoded=$(base64 -w0 "$OUT/after.yml")
            gh api --method PUT "/repos/$GH_REPOSITORY/contents/$TARGET_PATH" \
              -f message='Repair PC-61 v5 workflow registration timeout' \
              -f content="$encoded" \
              -f sha="$before_blob" \
              -f branch="$TARGET_BRANCH" > "$OUT/update-response.json"
            test "$(jq -r .content.sha "$OUT/update-response.json")" = "$after_blob"
            commit=$(jq -r .commit.sha "$OUT/update-response.json")
            test -n "$commit"
            jq -n --arg schema_version 'pc61-v5-registration-repair@1' --arg status 'repaired' --arg branch "$TARGET_BRANCH" --arg path "$TARGET_PATH" --arg before "$before_blob" --arg after "$after_blob" --arg commit "$commit" '{schema_version:$schema_version,status:$status,target_branch:$branch,target_path:$path,before_blob:$before,after_blob:$after,repair_commit:$commit,changed:true,change_denominator:{lines_removed:1,lines_added:1,old_timeout_minutes:420,new_timeout_minutes:360},product_semantics_changed:false,graph_effect:"none"}' > "$OUT/receipt.json"
          fi

          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve registration-repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc61-v5-registration-repair
          path: /tmp/pc61-v5-registration-repair
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
