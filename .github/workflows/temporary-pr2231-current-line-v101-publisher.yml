name: Temporary PR 2231 current-line V101 leased publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-current-line-v101-publisher.yml'

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-current-line-v101-leased-publisher
  cancel-in-progress: false

jobs:
  publish-v101-exact-product:
    if: github.event.pull_request.number == 2391
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_BRANCH: agent/pr2231-cumulative-custody-controller-v92
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      EXPECTED_MAIN: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PRODUCT: bea76f0dd155122c3a45fe82c7c1abbaf676349b
      EXPECTED_PREDECESSOR_TREE: 23dde19530990df1f1daa436993b1214e83ac8fd
      EXPECTED_BASE_LIBRARY_BLOB: 5f68254d3e44de693e83503aed879160f9b7b997
      EXPECTED_BASE_FOCUSED_TEST_BLOB: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      EXPECTED_PREDECESSOR_LIBRARY_BLOB: 6655e9aa10ac2964e5f6289a4881f1343265fa0e
      EXPECTED_PREDECESSOR_FOCUSED_TEST_BLOB: 7f72ca8c2eb7f436471453c74b98e1227b0970d5
      PAYLOAD_PATH: .github/tmp/pr2231-current-line-v100.py.gz.b64
      EXPECTED_PAYLOAD_BLOB: 22379d46e0d1d6a3782717bdcb070f68c8072042
      EXPECTED_MUTATOR_SHA256: c124f16378d131539dccd138946cd21ac78fd6d2519288a88b8fa84cc42a3e33
      EXPECTED_CANDIDATE_LIBRARY_BLOB: d02ac8fdb1dad6777d6a722a097706c5660ebe8a
      EXPECTED_CANDIDATE_FOCUSED_TEST_BLOB: 1d8fd285563eea4121bbe178a4b54eb715af3ac0
      EXPECTED_CANDIDATE_TREE: ec2c1fdf2bc9e7b05d9fe1ec40f22c56e9ae4184
      PUBLISHER_SCRIPT_PATH: .github/tmp/pr2231-current-line-v101-publisher.sh.gz
      EXPECTED_PUBLISHER_SCRIPT_BLOB: 49148c09e709eb751d2121c7ec23085bf9b5b009
      EXPECTED_PUBLISHER_SCRIPT_SHA256: 32526e81f0b54caa70dc47455460ee91f2b9be13af13abb7c9a4f67019dc265b
      QUALIFICATION_RUN_ID: '33288385779'
      QUALIFICATION_ARTIFACT_ID: '9725178535'
      ARTIFACT_DIR: /tmp/pr2231-v101-publication

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recover and execute the exact V101 leased publisher
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' BOOTSTRAP_STARTED > "$ARTIFACT_DIR/result.txt"
          script_blob="$(git rev-parse "${CONTROLLER_SHA}:${PUBLISHER_SCRIPT_PATH}")" || {
            printf '%s\n' FAIL:RESOLVE_PUBLISHER_SCRIPT_BLOB > "$ARTIFACT_DIR/result.txt"
            exit 1
          }
          printf '%s\n' "$script_blob" > "$ARTIFACT_DIR/publisher-script.blob"
          if [[ "$script_blob" != "$EXPECTED_PUBLISHER_SCRIPT_BLOB" ]]; then
            printf '%s\n' FAIL:PUBLISHER_SCRIPT_BLOB > "$ARTIFACT_DIR/result.txt"
            exit 1
          fi
          if ! gzip -dc "$GITHUB_WORKSPACE/$PUBLISHER_SCRIPT_PATH" > /tmp/pr2231-v101-publisher.sh; then
            printf '%s\n' FAIL:PUBLISHER_SCRIPT_DECODE > "$ARTIFACT_DIR/result.txt"
            exit 1
          fi
          script_sha="$(sha256sum /tmp/pr2231-v101-publisher.sh | awk '{print $1}')"
          printf '%s\n' "$script_sha" > "$ARTIFACT_DIR/publisher-script.sha256"
          if [[ "$script_sha" != "$EXPECTED_PUBLISHER_SCRIPT_SHA256" ]]; then
            printf '%s\n' FAIL:PUBLISHER_SCRIPT_SHA256 > "$ARTIFACT_DIR/result.txt"
            exit 1
          fi
          bash -n /tmp/pr2231-v101-publisher.sh || {
            printf '%s\n' FAIL:PUBLISHER_SCRIPT_SYNTAX > "$ARTIFACT_DIR/result.txt"
            exit 1
          }
          bash /tmp/pr2231-v101-publisher.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-current-line-v101-publication
          path: /tmp/pr2231-v101-publication
          retention-days: 90
