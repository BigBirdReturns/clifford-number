name: TEMP M-04G ESCWA bounded original-route recovery v6

on:
  push:
    branches:
      - agent/m04g-escwa-original-route-recovery-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out probe source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize recovery receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/bodies qualification/text qualification/cdx
          printf '%s\n' '{"status":"initialized","product_files_modified":false}' > qualification/initialization.json

      - name: Install PDF text extractor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils'
          pdftotext -v 2>&1 | head -n 1

      - name: Build bounded v6 controller
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import textwrap

          source_sha = "668185452e5ecc1c23f0c44d098cd3c1462c8052"
          workflow_path = ".github/workflows/temporary-m04g-escwa-original-route-recovery-v5.yml"
          source = subprocess.check_output(
              ["git", "show", f"{source_sha}:{workflow_path}"],
              text=True,
          )
          match = re.search(
              r"cat > /tmp/m04g-escwa-original-route-recovery\.py <<'PY'\n(.*?)\n          PY",
              source,
              re.S,
          )
          if not match:
              raise SystemExit("source controller heredoc not found")
          script = textwrap.dedent(match.group(1))
          replacements = []

          def replace_once(old, new, label):
              global script
              count = script.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              script = script.replace(old, new, 1)
              replacements.append(label)

          replace_once(
              '"workflow_run_id": "${' + '{ github.run_id }}",',
              f'"workflow_run_id": {json.dumps(os.environ["RUN_ID"])},',
              "render_run_id",
          )
          replace_once(
              '"commit_sha": "${' + '{ github.sha }}",',
              f'"commit_sha": {json.dumps(os.environ["COMMIT_SHA"])},',
              "render_commit_sha",
          )
          replace_once(
              '"schema_version": "m04g-escwa-original-route-recovery@5",',
              '"schema_version": "m04g-escwa-original-route-recovery@6",',
              "schema_v6",
          )
          replace_once(
              'for attempt in range(3):',
              'for attempt in range(1):',
              "single_attempt_fetch",
          )
          for old, new, label in (
              ('timeout=120', 'timeout=8', "bound_120_second_calls"),
              ('timeout=90', 'timeout=8', "bound_90_second_calls"),
              ('timeout=180', 'timeout=8', "bound_180_second_calls"),
          ):
              count = script.count(old)
              if count < 1:
                  raise SystemExit(f"{label}: no matches")
              script = script.replace(old, new)
              replacements.append(f"{label}:{count}")

          replace_once(
              '                  indexes = json.loads(collinfo["body"])[:28]',
              '''                  all_indexes = json.loads(collinfo["body"])
                  indexes = []
                  for target_year in ("2026", "2023", "2015"):
                      candidate = next(
                          (
                              row for row in all_indexes
                              if f"CC-MAIN-{target_year}" in row.get("id", "")
                          ),
                          None,
                      )
                      if candidate and candidate not in indexes:
                          indexes.append(candidate)''',
              "target_common_crawl_years",
          )
          replace_once(
              '              for url in urls:',
              '              for url in urls[:2]:',
              "two_canonical_route_variants",
          )
          replace_once(
              '                  for capture in wayback["rows"][-16:]:',
              '''                  wayback_rows = wayback["rows"]
                  sampled_wayback = (
                      wayback_rows[:1]
                      + wayback_rows[len(wayback_rows) // 2:len(wayback_rows) // 2 + 1]
                      + wayback_rows[-1:]
                  )
                  for capture in list({
                      (row.get("timestamp"), row.get("digest")): row
                      for row in sampled_wayback
                  }.values()):''',
              "sample_three_wayback_eras",
          )
          replace_once(
              '                  for capture in cc["rows"][-12:]:',
              '                  for capture in cc["rows"][-3:]:',
              "three_common_crawl_bodies",
          )
          replace_once(
              '              for timestamp, link in list(dict.fromkeys(linked_targets))[:24]:',
              '              for timestamp, link in list(dict.fromkeys(linked_targets))[:3]:',
              "three_linked_targets",
          )
          replace_once(
              '                  for candidate in candidates:',
              '                  for candidate in candidates[:1]:',
              "one_linked_candidate",
          )
          replace_once(
              '                  "limit": "100",',
              '                  "limit": "32",',
              "bounded_wayback_metadata",
          )
          replace_once(
              '''                              window = compact[start:end]
                              pairs.append({
                                  "distance": distance,
                                  "window": window,
                                  "contains_2030": bool(re.search(r"\\b2030\\b", window)),
                              })''',
              '''                              window = compact[start:end]
                              value_start = max(0, min(tm.start(), dm.start()) - 120)
                              value_end = min(len(compact), max(tm.end(), dm.end()) + 120)
                              value_window = compact[value_start:value_end]
                              values = re.findall(
                                  r"(?<![\\d,])(?:0?\\.\\d+|[1-9]\\d?(?:\\.\\d+)?)(?![\\d,])",
                                  value_window,
                              )
                              pairs.append({
                                  "distance": distance,
                                  "window": window,
                                  "contains_2030": bool(re.search(r"\\b2030\\b", window)),
                                  "contains_density_value": bool(values),
                                  "density_values": values[:8],
                              })''',
              "gp051_density_value_gate",
          )
          replace_once(
              '''                  pairs.sort(key=lambda row: (not row["contains_2030"], row["distance"]))
                  has_2030 = bool(re.search(r"\\b2030\\b", compact))
                  return {
                      "matched": bool(pairs) and has_2030,
                      "health_term_count": len(term_matches),
                      "density_term_count": len(density_matches),
                      "has_2030": has_2030,
                      "nearest_distance": pairs[0]["distance"] if pairs else None,
                      "windows": [row["window"] for row in pairs[:8]],
                  }''',
              '''                  qualifying_pairs = [
                      row for row in pairs
                      if row["contains_2030"] and row["contains_density_value"]
                  ]
                  qualifying_pairs.sort(key=lambda row: row["distance"])
                  has_2030 = bool(re.search(r"\\b2030\\b", compact))
                  return {
                      "matched": bool(qualifying_pairs),
                      "health_term_count": len(term_matches),
                      "density_term_count": len(density_matches),
                      "has_2030": has_2030,
                      "nearest_distance": qualifying_pairs[0]["distance"] if qualifying_pairs else None,
                      "windows": [row["window"] for row in qualifying_pairs[:8]],
                      "density_values": [row["density_values"] for row in qualifying_pairs[:8]],
                  }''',
              "gp051_same_window_admission",
          )
          replace_once(
              '              year_re = re.compile(r"\\b(?:year|years)\\b", re.I)',
              '              year_re = re.compile(r"\\b(?:[1-9]\\d{0,2}(?:\\.\\d+)?)\\s+(?:year|years)\\b", re.I)',
              "gp056_numeric_year_interval",
          )
          replace_once(
              '                  "gp051_health_workforce_density_and_2030": True,',
              '                  "gp051_value_health_density_and_2030_same_window": True,',
              "gp051_requirement_label",
          )
          replace_once(
              '                  "gp056_population_doubling_and_years": True,',
              '                  "gp056_population_doubling_and_numeric_year_interval": True,',
              "gp056_requirement_label",
          )

          transformed = pathlib.Path("/tmp/m04g-escwa-original-route-recovery-v6.py")
          transformed.write_text(script)
          compile(script, str(transformed), "exec")
          receipt = {
              "schema": "m04g-escwa-controller-transform@1",
              "source_commit": source_sha,
              "source_workflow": workflow_path,
              "source_sha256": hashlib.sha256(match.group(1).encode()).hexdigest(),
              "transformed_sha256": hashlib.sha256(script.encode()).hexdigest(),
              "replacements": replacements,
              "product_files_modified": False,
          }
          pathlib.Path("qualification/controller-transform.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          print(json.dumps(receipt, indent=2))
          PY

      - name: Run bounded v6 controller
        id: bounded_probe
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 11m \
            python3 /tmp/m04g-escwa-original-route-recovery-v6.py \
            2>&1 | tee qualification/probe.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            PROBE_STATUS="$status" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("qualification")
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  data = path.read_bytes()
                  files.append({
                      "path": str(path),
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
          receipt = {
              "schema": "m04g-escwa-bounded-failure@1",
              "exit_status": int(os.environ["PROBE_STATUS"]),
              "timed_out": os.environ["PROBE_STATUS"] in ("124", "137"),
              "files_recovered": files,
              "product_files_modified": False,
          }
          (root / "bounded-run-failure.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          print(json.dumps(receipt, indent=2))
          PY
          fi
          exit "$status"

      - name: Upload bounded original-route recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-escwa-bounded-recovery-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
