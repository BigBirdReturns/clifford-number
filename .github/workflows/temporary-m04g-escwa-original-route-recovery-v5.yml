          pathlib.Path("qualification/controller.sha256").write_text(f"{actual}  controller.py\n")
          print(f"decoded {len(raw)} bytes with sha256 {actual}")
          PY
          python3 -m py_compile /tmp/m04g-escwa-original-route-recovery-v7.py

      - name: Run bounded v7 controller
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 10m \
            python3 /tmp/m04g-escwa-original-route-recovery-v7.py \
            2>&1 | tee qualification/probe.log
          status=${PIPESTATUS[0]}
          set -e
          PROBE_STATUS="$status" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("qualification")
          controller = root / "controller.py"
          ledger = root / "ledger.json"
          receipt = {
              "schema": "m04g-escwa-bounded-run-status@1",
              "exit_status": int(os.environ["PROBE_STATUS"]),
              "timed_out": os.environ["PROBE_STATUS"] in ("124", "137"),
              "ledger_exists": ledger.exists(),
              "controller_sha256": hashlib.sha256(controller.read_bytes()).hexdigest() if controller.exists() else None,
              "product_files_modified": False,
          }
          (root / "run-status.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
          exit 0

      - name: Render bounded recovery summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path("qualification")
          ledger_path = root / "ledger.json"
          status_path = root / "run-status.json"
          lines = ["# M-04G ESCWA bounded recovery v7", ""]
          if status_path.exists():
              status = json.loads(status_path.read_text())
              lines.append(f"Controller exit status: `{status.get('exit_status')}`")
              lines.append("")
          if ledger_path.exists():
              ledger = json.loads(ledger_path.read_text())
              lines.append(f"Candidate authorized: `{ledger.get('candidate_authorized')}`")
              lines.append("")
              for route_id, selected in ledger.get("selected", {}).items():
                  if selected:
                      lines.append(
                          f"- `{route_id}` selected `{selected.get('content_sha256')}` from `{selected.get('final_url')}`"
                      )
                  else:
                      lines.append(f"- `{route_id}` has no qualifying selection")
              lines.append("")
              for reason in ledger.get("candidate_authorization_reasons", []):
                  lines.append(f"- {reason}")
          else:
              lines.append("No ledger was produced; inspect the uploaded controller and probe log.")
          summary = "\n".join(lines) + "\n"
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              pathlib.Path(summary_path).write_text(summary)
          PY

      - name: Upload bounded original-route recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-escwa-bounded-recovery-v7-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
