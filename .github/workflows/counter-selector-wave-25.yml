name: Counter-Selector Wave 25 support-adjusted surplus audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-25.yml'
      - 'data/project/counter-selector-wave-25-*.json'
      - 'schemas/counter-selector-support-adjusted-surplus.schema.json'
      - 'docs/methods/counter-selector-support-adjusted-surplus.md'
      - 'docs/milestones/counter-selector-wave-25.md'
      - 'tools/build-counter-selector-wave-25.mjs'
      - 'tools/validate-counter-selector-wave-25.mjs'
      - 'test/counter-selector-wave-25.test.js'
      - 'reports/core-thesis/counter-selector-wave-25/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-25.yml'
      - 'data/project/counter-selector-wave-25-*.json'
      - 'schemas/counter-selector-support-adjusted-surplus.schema.json'
      - 'docs/methods/counter-selector-support-adjusted-surplus.md'
      - 'docs/milestones/counter-selector-wave-25.md'
      - 'tools/build-counter-selector-wave-25.mjs'
      - 'tools/validate-counter-selector-wave-25.mjs'
      - 'test/counter-selector-wave-25.test.js'
      - 'reports/core-thesis/counter-selector-wave-25/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 25 products
        run: node tools/build-counter-selector-wave-25.mjs
      - name: Validate support-adjusted surplus contract
        run: node tools/validate-counter-selector-wave-25.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-25.test.js
      - name: Require exact committed Wave 25 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-25-comparator-registry.json \
            data/project/counter-selector-wave-25-release-manifest.json \
            reports/core-thesis/counter-selector-wave-25/data.json \
            reports/core-thesis/counter-selector-wave-25/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 25 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-25.mjs
          node tools/validate-counter-selector-wave-25.mjs
          node test/counter-selector-wave-25.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
