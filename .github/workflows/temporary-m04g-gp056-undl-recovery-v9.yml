name: TEMP M-04G GP056 UN Digital Library recovery v9

on:
  push:
    branches:
      - agent/m04g-escwa-original-route-recovery-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify GP056 controller
        shell: bash
        run: |
          set -euo pipefail
          expected="5840a2760a40f0ac51356a5a23e305af34e87e5cfbeddda6d47772d3a876e354"
          actual="$(sha256sum .github/probes/m04g_gp056_undl_v9.py | awk '{print $1}')"
          test "$actual" = "$expected"
          python3 -m py_compile .github/probes/m04g_gp056_undl_v9.py
          mkdir -p qualification/gp056-v9
          printf '%s\n' "$actual  m04g_gp056_undl_v9.py" > qualification/gp056-v9/controller.sha256

      - name: Install PDF text extractor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils'
          pdftotext -v 2>&1 | head -n 1

      - name: Run bounded GP056 official-corpus probe
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          QUAL_ROOT: qualification/gp056-v9
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 10m \
            python3 .github/probes/m04g_gp056_undl_v9.py \
            2>&1 | tee qualification/gp056-v9/probe.log
          status=${PIPESTATUS[0]}
          set -e
          PROBE_STATUS="$status" python3 - <<'PY'
          import json
          import os
          import pathlib
          root = pathlib.Path('qualification/gp056-v9')
          receipt = {
              'schema': 'm04g-gp056-v9-run-status@1',
              'exit_status': int(os.environ['PROBE_STATUS']),
              'timed_out': os.environ['PROBE_STATUS'] in ('124', '137'),
              'ledger_exists': (root / 'ledger.json').exists(),
              'product_files_modified': False,
          }
          (root / 'run-status.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
          exit 0

      - name: Render GP056 summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          root = pathlib.Path('qualification/gp056-v9')
          ledger_path = root / 'ledger.json'
          lines = ['# M-04G GP056 UN Digital Library recovery v9', '']
          if ledger_path.exists():
              ledger = json.loads(ledger_path.read_text())
              lines.append(f"Qualified: `{ledger.get('qualified')}`")
              lines.append(f"Observations: `{len(ledger.get('observations', []))}`")
              lines.append(f"Transport errors: `{len(ledger.get('errors', []))}`")
              selected = ledger.get('selected')
              if selected:
                  lines.append(f"Selected hash: `{selected.get('content_sha256')}`")
                  lines.append(f"Selected URL: `{selected.get('final_url')}`")
                  lines.append(f"Intervals: `{selected.get('semantic', {}).get('intervals')}`")
              else:
                  lines.append('No qualifying official-custody body was selected.')
          else:
              lines.append('No ledger was produced; inspect the run-status receipt and probe log.')
          summary = '\n'.join(lines) + '\n'
          print(summary)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          PY

      - name: Upload GP056 recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-gp056-undl-v9-${{ github.run_id }}
          path: qualification/gp056-v9/
          if-no-files-found: error
          retention-days: 30
