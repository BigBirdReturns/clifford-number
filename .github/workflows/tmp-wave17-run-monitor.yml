name: Temporary Wave 17 push-run monitor

on:
  push:
    branches:
      - agent/tmp-wave17-run-monitor
    paths:
      - '.github/tmp/tmp-wave17-run-monitor-request.json'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Query requested Wave 17 branch push runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch=$(node -p "require('./.github/tmp/tmp-wave17-run-monitor-request.json').branch")
          encoded=$(node -p "encodeURIComponent(process.argv[1])" "$branch")
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${encoded}&event=push&per_page=30" > /tmp/wave17-runs.json
          node - "$branch" <<'NODE'
          const fs = require('fs');
          const branch = process.argv[2];
          const source = JSON.parse(fs.readFileSync('/tmp/wave17-runs.json', 'utf8'));
          const runs = (source.workflow_runs || []).map(({id, name, workflow_id, run_number, status, conclusion, head_sha, event, created_at, updated_at, html_url}) => ({
            id, name, workflow_id, run_number, status, conclusion, head_sha, event, created_at, updated_at, html_url
          }));
          fs.writeFileSync('data/project/tmp-wave17-push-runs.json', JSON.stringify({
            observed_at: new Date().toISOString(),
            branch,
            runs
          }) + '\n');
          NODE
      - name: Commit observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/project/tmp-wave17-push-runs.json
          git commit -m 'Refresh Wave 17 push-run observation'
          git fetch origin agent/tmp-wave17-run-monitor
          test "$(git rev-parse origin/agent/tmp-wave17-run-monitor)" = "${{ github.sha }}"
          git push origin HEAD:agent/tmp-wave17-run-monitor
