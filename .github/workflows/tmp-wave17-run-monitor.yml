name: Temporary Wave 17 push-run monitor

on:
  push:
    branches:
      - agent/tmp-wave17-run-monitor
    paths:
      - '.github/tmp/tmp-wave17-run-monitor-request.json'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Query Wave 17 branch push runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Flake-residual-frontier-wave-17&event=push&per_page=30" \
            --jq '{observed_at: now | todate, runs: [.workflow_runs[] | {id, name, workflow_id, run_number, status, conclusion, head_sha, event, created_at, updated_at, html_url}]}' \
            > data/project/tmp-wave17-push-runs.json
      - name: Commit observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/project/tmp-wave17-push-runs.json
          git commit -m 'Refresh Wave 17 push-run observation'
          git fetch origin agent/tmp-wave17-run-monitor
          test "$(git rev-parse origin/agent/tmp-wave17-run-monitor)" = "${{ github.sha }}"
          git push origin HEAD:agent/tmp-wave17-run-monitor
