name: Materialize Counter-Selector Wave 01 reports

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-01-reports.yml'
      - '.github/workflows/counter-selector-wave-00.yml'
      - 'data/project/counter-selector-program.json'
      - 'data/project/counter-selector-wave-00-supersession.json'
      - 'data/project/counter-selector-candidate-registry.json'
      - 'data/project/counter-selector-candidates/**'
      - 'data/project/counter-selector-wave-01.json'
      - 'schemas/counter-selector-candidate.schema.json'
      - 'docs/methods/counter-selector.md'
      - 'docs/milestones/counter-selector-wave-01.md'
      - 'tools/build-counter-selector.mjs'
      - 'tools/validate-counter-selector.mjs'
      - 'test/counter-selector.test.js'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and validate exact products
        run: |
          set -euo pipefail
          node tools/build-counter-selector.mjs
          node tools/validate-counter-selector.mjs
          node test/counter-selector.test.js

      - name: Commit generated products
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/project/counter-selector-release-manifest.json reports/core-thesis/counter-selector/data.json reports/core-thesis/counter-selector/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Counter-Selector products already exact.'
            exit 0
          fi
          git commit -m 'Materialize Counter-Selector Wave 01 reports'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
