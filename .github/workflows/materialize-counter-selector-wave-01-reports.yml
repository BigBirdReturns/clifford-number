name: Materialize Counter-Selector Wave 01 reports

on:
  push:
    branches:
      - 'agent/counter-selector-wave-01'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-01-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-01

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and validate exact products
        run: |
          set -euo pipefail
          node tools/build-counter-selector.mjs
          node tools/validate-counter-selector.mjs
          node test/counter-selector.test.js

      - name: Commit generated products
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/project/counter-selector-release-manifest.json reports/core-thesis/counter-selector/data.json reports/core-thesis/counter-selector/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Counter-Selector products already exact.'
            exit 0
          fi
          git commit -m 'Materialize Counter-Selector Wave 01 reports'
          git push origin HEAD:agent/counter-selector-wave-01
