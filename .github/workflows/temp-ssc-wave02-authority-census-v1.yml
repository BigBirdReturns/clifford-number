name: TEMP SSC Wave-02 live-ref authority census v1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-ssc-wave02-authority-census-v1.yml'

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: ssc-wave02-authority-census-v1
  cancel-in-progress: false

jobs:
  census:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-wave02-authority-census-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      API_ROOT: https://api.github.com/repos/${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_BRANCH: agent/ssc-wave02-authority-census-v1
      CONTROLLER_PARENT: 2fd3d20802595797fc7618dcb2c1c72391e275c5
      CONTROLLER_PATH: .github/workflows/temp-ssc-wave02-authority-census-v1.yml
      FINAL_WAVE_ISSUE: '785'
      FINAL_RECON_PR: '1012'
      FINAL_RECON_MERGE: 2af6bb7819a37e51c7198fb48da894445a29e494
      CURRENT_LEDGER_PATH: data/research/status-sovereignty-residual-denominator-wave-02-current.json
    steps:
      - name: Check out the exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Census every live SSC Wave-02 ref without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p receipt/prs receipt/paths
          trap 'code=$?; printf "%s\n" "$code" > receipt/exit-code.txt; if [[ "$code" -eq 0 ]]; then printf "success\n" > receipt/phase.txt; else printf "failed\n" > receipt/phase.txt; fi' EXIT

          headers=(
            -H 'Accept: application/vnd.github+json'
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          api_get() {
            curl --fail-with-body --silent --show-error \
              "${headers[@]}" "${API_ROOT}/$1"
          }

          api_get "pulls/${PR_NUMBER}" > receipt/controller-pr.json
          jq -e \
            --arg branch "${CONTROLLER_BRANCH}" \
            --arg head "${EVENT_HEAD_SHA}" \
            '.state == "open" and .base.ref == "main" and .head.ref == $branch and
             .head.sha == $head and .head.repo.full_name == .base.repo.full_name and
             .commits == 1 and .changed_files == 1' \
            receipt/controller-pr.json >/dev/null

          api_get "git/commits/${EVENT_HEAD_SHA}" > receipt/controller-commit.json
          jq -e --arg parent "${CONTROLLER_PARENT}" \
            '(.parents | length) == 1 and .parents[0].sha == $parent' \
            receipt/controller-commit.json >/dev/null

          api_get "pulls/${PR_NUMBER}/files?per_page=100" > receipt/controller-files.json
          jq -e --arg path "${CONTROLLER_PATH}" \
            'length == 1 and .[0].filename == $path and .[0].status == "added"' \
            receipt/controller-files.json >/dev/null

          main_before="$(api_get 'git/ref/heads/main' | jq -r '.object.sha')"
          [[ "${main_before}" == "${CONTROLLER_PARENT}" ]]
          printf '%s\n' "${main_before}" > receipt/main-before.txt

          api_get "issues/${FINAL_WAVE_ISSUE}" > receipt/final-wave-issue.json
          jq -e '.state == "closed" and .state_reason == "completed"' \
            receipt/final-wave-issue.json >/dev/null

          api_get "pulls/${FINAL_RECON_PR}" > receipt/final-reconciliation-pr.json
          jq -e --arg merge "${FINAL_RECON_MERGE}" \
            '.state == "closed" and .merged_at != null and .merge_commit_sha == $merge' \
            receipt/final-reconciliation-pr.json >/dev/null

          api_get "compare/${FINAL_RECON_MERGE}...${main_before}" > receipt/final-reconciliation-to-main.json
          jq -e --arg merge "${FINAL_RECON_MERGE}" \
            '.merge_base_commit.sha == $merge and
             ((.status == "ahead") or (.status == "identical"))' \
            receipt/final-reconciliation-to-main.json >/dev/null

          : > receipt/child-issues.tsv
          for issue in 786 787 788 789 790 791; do
            api_get "issues/${issue}" > "receipt/issue-${issue}.json"
            jq -e '.state == "closed" and .state_reason == "completed"' \
              "receipt/issue-${issue}.json" >/dev/null
            printf '%s\tclosed\tcompleted\n' "${issue}" >> receipt/child-issues.tsv
          done

          : > receipt/closure-prs.tsv
          for pr in 801 802 803 804 805 806; do
            api_get "pulls/${pr}" > "receipt/pr-${pr}.json"
            jq -e '.state == "closed" and .merged_at != null and .merge_commit_sha != null' \
              "receipt/pr-${pr}.json" >/dev/null
            jq -r '[.number, .merge_commit_sha, .head.ref, .head.sha] | @tsv' \
              "receipt/pr-${pr}.json" >> receipt/closure-prs.tsv
          done

          git fetch --filter=blob:none --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${main_before}" ]]
          [[ "$(git rev-parse "${EVENT_HEAD_SHA}^{commit}")" == "${EVENT_HEAD_SHA}" ]]
          [[ "$(git rev-parse "${EVENT_HEAD_SHA}^")" == "${CONTROLLER_PARENT}" ]]

          git show "${main_before}:${CURRENT_LEDGER_PATH}" > receipt/current-ledger.json
          jq -e '
            .schema_version == "status-sovereignty-residual-denominator-wave-02-current@1" and
            .issue == 785 and
            (.promoted_class_receipts | length) == 6 and
            (.selected_classes_open | length) == 0 and
            .counts.canonical_residual_classes == 42 and
            .counts.selected_class_attempts == 6 and
            .counts.terminal_class_receipts == 6 and
            .counts.classes_closed_this_wave == 6 and
            .counts.closed_residual_classes == 6 and
            .counts.open_residual_classes == 36 and
            .counts.outside_human_dependencies == 0 and
            .counts.external_contacts == 0 and
            .counts.external_reviews == 0 and
            .counts.graph_effects == 0 and
            .counts.publication_effects == 0 and
            .counts.adoption_effects == 0 and
            .current_result.all_six_selected_classes_closed == true and
            .current_result.wave_complete == false and
            .current_result.outside_human_dependency == false and
            .current_result.graph_effect == "none" and
            .current_result.publication_effect == "none" and
            .current_result.adoption_effect == "none"
          ' receipt/current-ledger.json >/dev/null
          sha256sum receipt/current-ledger.json > receipt/current-ledger.sha256

          git ls-remote --heads origin | sort -k2,2 > receipt/all-live-heads.tsv

          awk -v self="${CONTROLLER_BRANCH}" '
            {
              branch=$2
              sub("^refs/heads/", "", branch)
              if (branch != self &&
                  branch ~ /^(agent|archive)\/ssc-/ &&
                  branch ~ /(wave02|w02)/) {
                print branch "\t" $1
              }
            }
          ' receipt/all-live-heads.tsv | sort -u > receipt/candidate-refs.tsv

          awk -v self="${CONTROLLER_BRANCH}" '
            {
              branch=$2
              sub("^refs/heads/", "", branch)
              if (branch != self &&
                  branch ~ /(wave02|w02)/ &&
                  branch !~ /^(agent|archive)\/ssc-/) {
                print branch "\t" $1
              }
            }
          ' receipt/all-live-heads.tsv | sort -u > receipt/excluded-lookalikes.tsv

          candidate_count="$(wc -l < receipt/candidate-refs.tsv)"
          [[ "${candidate_count}" -gt 0 ]]
          [[ "$(cut -f1 receipt/candidate-refs.tsv | sort -u | wc -l)" -eq "${candidate_count}" ]]
          [[ "$(cut -f2 receipt/candidate-refs.tsv | grep -Ec '^[0-9a-f]{40}$')" -eq "${candidate_count}" ]]
          ! cut -f1 receipt/candidate-refs.tsv | grep -Fxq "${CONTROLLER_BRANCH}"
          ! cut -f1 receipt/candidate-refs.tsv | grep -Eq '^main$'

          mapfile -t candidate_branches < <(cut -f1 receipt/candidate-refs.tsv)
          refspecs=()
          for branch in "${candidate_branches[@]}"; do
            [[ "${branch}" =~ ^[A-Za-z0-9._/-]+$ ]]
            refspecs+=("+refs/heads/${branch}:refs/remotes/origin/${branch}")
          done
          git fetch --filter=blob:none --no-tags origin "${refspecs[@]}"

          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.parse
          import urllib.request

          root = pathlib.Path("receipt")
          repo = os.environ["GITHUB_REPOSITORY"]
          owner = repo.split("/", 1)[0]
          token = os.environ["GH_TOKEN"]
          api_root = os.environ["API_ROOT"]
          main_sha = (root / "main-before.txt").read_text().strip()

          candidates = []
          with (root / "candidate-refs.tsv").open(newline="") as handle:
              for branch, sha in csv.reader(handle, delimiter="\t"):
                  candidates.append((branch, sha))

          def git(*args, check=True):
              proc = subprocess.run(
                  ["git", *args],
                  check=check,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              return proc.stdout

          def git_text(*args, check=True):
              return git(*args, check=check).decode("utf-8", "surrogateescape").strip()

          def object_at(commit, path):
              proc = subprocess.run(
                  ["git", "rev-parse", f"{commit}:{path}"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              if proc.returncode:
                  return ""
              return proc.stdout.decode().strip()

          def api_pulls(branch):
              query = urllib.parse.urlencode({
                  "state": "all",
                  "head": f"{owner}:{branch}",
                  "per_page": "100",
              })
              request = urllib.request.Request(
                  f"{api_root}/pulls?{query}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          header = [
              "branch", "head_sha", "tree_sha", "commit_date", "commit_subject",
              "merge_base", "head_reachable_from_main", "unique_commit_count",
              "branch_changed_path_count", "same_on_main_count",
              "unique_path_count", "unique_workflow_path_count",
              "unique_nonworkflow_path_count", "associated_pr_count",
              "exact_head_pr_count", "open_pr_count", "merged_pr_count",
              "closed_unmerged_pr_count", "pr_numbers", "preservation_mode",
              "retirement_class", "path_receipt",
          ]
          rows = []
          exception_rows = []
          eligible_rows = []

          for index, (branch, sha) in enumerate(candidates, start=1):
              remote_sha = git_text("rev-parse", f"refs/remotes/origin/{branch}^{{commit}}")
              if remote_sha != sha:
                  raise SystemExit(f"remote ref mismatch for {branch}: {remote_sha} != {sha}")

              tree_sha = git_text("rev-parse", f"{sha}^{{tree}}")
              commit_date = git_text("show", "-s", "--format=%cI", sha)
              subject = git_text("show", "-s", "--format=%s", sha).replace("\t", " ").replace("\n", " ")
              merge_base = git_text("merge-base", sha, main_sha)
              reachable = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", sha, main_sha],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              unique_commit_count = int(git_text("rev-list", "--count", sha, f"^{main_sha}"))

              changed_raw = git(
                  "-c", "core.quotepath=false",
                  "diff", "--name-only", "-z", "--diff-filter=ACDMRTUXB",
                  merge_base, sha,
              )
              changed_paths = [
                  item.decode("utf-8", "surrogateescape")
                  for item in changed_raw.split(b"\0")
                  if item
              ]

              path_key = hashlib.sha256(branch.encode()).hexdigest()[:20]
              path_receipt = f"paths/{path_key}.tsv"
              same_count = 0
              unique_count = 0
              unique_workflow_count = 0
              unique_nonworkflow_count = 0

              with (root / path_receipt).open("w", newline="") as handle:
                  writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
                  writer.writerow(["branch", "path", "branch_object", "main_object", "state"])
                  for path in changed_paths:
                      branch_object = object_at(sha, path)
                      main_object = object_at(main_sha, path)
                      if branch_object and branch_object == main_object:
                          state = "same_blob_on_main"
                          same_count += 1
                      elif not branch_object and not main_object:
                          state = "absent_in_both"
                          same_count += 1
                      elif branch_object and not main_object:
                          state = "branch_object_absent_on_main"
                          unique_count += 1
                      elif not branch_object and main_object:
                          state = "branch_deletion_not_current_on_main"
                          unique_count += 1
                      else:
                          state = "branch_object_differs_from_main"
                          unique_count += 1

                      if state not in {"same_blob_on_main", "absent_in_both"}:
                          if path.startswith(".github/workflows/"):
                              unique_workflow_count += 1
                          else:
                              unique_nonworkflow_count += 1
                      writer.writerow([branch, path, branch_object, main_object, state])

              pulls = api_pulls(branch)
              (root / "prs" / f"{path_key}.json").write_text(
                  json.dumps(pulls, indent=2, sort_keys=True) + "\n"
              )
              associated_pr_count = len(pulls)
              exact_head_pr_count = sum(pr["head"]["sha"] == sha for pr in pulls)
              open_pr_count = sum(pr["state"] == "open" for pr in pulls)
              merged_pr_count = sum(pr.get("merged_at") is not None for pr in pulls)
              closed_unmerged_pr_count = sum(
                  pr["state"] == "closed" and pr.get("merged_at") is None for pr in pulls
              )
              pr_numbers = ",".join(str(pr["number"]) for pr in sorted(pulls, key=lambda item: item["number"]))

              if reachable:
                  preservation_mode = "exact_head_reachable_from_main"
              elif unique_count == 0:
                  preservation_mode = "branch_touched_state_reproduced_on_main"
              else:
                  preservation_mode = "unique_branch_state_requires_disposition"

              if open_pr_count:
                  retirement_class = "blocked_open_pr"
              elif preservation_mode == "exact_head_reachable_from_main":
                  retirement_class = "ancestry_preserved_candidate"
              elif preservation_mode == "branch_touched_state_reproduced_on_main":
                  retirement_class = "blob_reproduced_candidate"
              elif unique_nonworkflow_count == 0 and unique_workflow_count > 0:
                  retirement_class = "workflow_only_disposable_candidate"
              else:
                  retirement_class = "archive_or_explicit_disposition_required"

              row = [
                  branch, sha, tree_sha, commit_date, subject, merge_base,
                  str(reachable).lower(), unique_commit_count, len(changed_paths),
                  same_count, unique_count, unique_workflow_count,
                  unique_nonworkflow_count, associated_pr_count,
                  exact_head_pr_count, open_pr_count, merged_pr_count,
                  closed_unmerged_pr_count, pr_numbers, preservation_mode,
                  retirement_class, path_receipt,
              ]
              rows.append(row)
              if retirement_class in {
                  "blocked_open_pr",
                  "archive_or_explicit_disposition_required",
              }:
                  exception_rows.append(row)
              else:
                  eligible_rows.append(row)

              print(f"[{index}/{len(candidates)}] {branch}: {retirement_class}")

          with (root / "classifications.tsv").open("w", newline="") as handle:
              writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
              writer.writerow(header)
              writer.writerows(rows)

          for filename, selected in [
              ("exceptions.tsv", exception_rows),
              ("provisional-retirement-candidates.tsv", eligible_rows),
          ]:
              with (root / filename).open("w", newline="") as handle:
                  writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
                  writer.writerow(header)
                  writer.writerows(selected)

          class_counts = {}
          preservation_counts = {}
          namespace_counts = {}
          for row in rows:
              retirement_class = row[20]
              preservation_mode = row[19]
              branch = row[0]
              class_counts[retirement_class] = class_counts.get(retirement_class, 0) + 1
              preservation_counts[preservation_mode] = preservation_counts.get(preservation_mode, 0) + 1
              pieces = branch.split("/")
              if branch.startswith("archive/"):
                  namespace = "archive/ssc-wave02"
              elif branch.startswith("agent/ssc-rd-wave02-"):
                  namespace = "agent/ssc-rd-wave02"
              elif branch.startswith("agent/ssc-rd01-wave02-"):
                  namespace = "agent/ssc-rd01-wave02"
              elif branch.startswith("agent/ssc-rd02-wave02-"):
                  namespace = "agent/ssc-rd02-wave02"
              elif branch.startswith("agent/ssc-rd05-wave02-"):
                  namespace = "agent/ssc-rd05-wave02"
              elif branch.startswith("agent/ssc-rd06-wave02-"):
                  namespace = "agent/ssc-rd06-wave02"
              elif branch.startswith("agent/ssc-residual-wave02-"):
                  namespace = "agent/ssc-residual-wave02"
              elif branch.startswith("agent/ssc-wave02-"):
                  namespace = "agent/ssc-wave02"
              elif branch.startswith("agent/ssc-w02-"):
                  namespace = "agent/ssc-w02"
              else:
                  namespace = "/".join(pieces[:2])
              namespace_counts[namespace] = namespace_counts.get(namespace, 0) + 1

          target_bytes = "".join(f"{branch}\t{sha}\n" for branch, sha in candidates).encode()
          summary = {
              "schema_version": "ssc-wave02-live-ref-authority-census@1",
              "repository": repo,
              "controller_branch": os.environ["CONTROLLER_BRANCH"],
              "controller_head": os.environ["EVENT_HEAD_SHA"],
              "controller_parent": os.environ["CONTROLLER_PARENT"],
              "main_sha": main_sha,
              "final_wave_issue": int(os.environ["FINAL_WAVE_ISSUE"]),
              "final_reconciliation_pr": int(os.environ["FINAL_RECON_PR"]),
              "final_reconciliation_merge": os.environ["FINAL_RECON_MERGE"],
              "candidate_ref_count": len(candidates),
              "candidate_ref_tsv_sha256": hashlib.sha256(target_bytes).hexdigest(),
              "exception_ref_count": len(exception_rows),
              "provisional_retirement_candidate_count": len(eligible_rows),
              "retirement_class_counts": dict(sorted(class_counts.items())),
              "preservation_mode_counts": dict(sorted(preservation_counts.items())),
              "namespace_counts": dict(sorted(namespace_counts.items())),
              "mutation_performed": False,
              "authority_created": "none",
              "next_control_question": (
                  "Which unique branch states require canonical archive migration or explicit "
                  "zero-authority disposition before an exact SHA-leased retirement denominator can be admitted?"
              ),
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          PY

          main_after="$(api_get 'git/ref/heads/main' | jq -r '.object.sha')"
          [[ "${main_after}" == "${main_before}" ]]
          printf '%s\n' "${main_after}" > receipt/main-after.txt

          find receipt -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > receipt/SHA256SUMS
          sha256sum -c receipt/SHA256SUMS
          jq -e '.mutation_performed == false and .authority_created == "none"' \
            receipt/summary.json >/dev/null

      - name: Upload checksum-bound census receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-wave02-live-ref-authority-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90
