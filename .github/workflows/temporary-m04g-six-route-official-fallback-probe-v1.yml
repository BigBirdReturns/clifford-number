name: TEMP M-04G official fallback census v1

on:
  push:
    branches:
      - agent/m04g-six-route-official-fallback-probe-v1
    paths:
      - '.github/probes/m04g_official_fallback_probe_v1.mjs'
      - '.github/workflows/temporary-m04g-six-route-official-fallback-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out bounded probe
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run official fallback census
        run: node .github/probes/m04g_official_fallback_probe_v1.mjs qualification

      - name: Render probe summary
        if: always()
        run: |
          if [ -f qualification/summary.md ]; then
            cat qualification/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# M-04G official fallback census v1' '' 'No summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload official fallback census receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-official-fallback-census-v1-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
