name: Preference custody laboratory floor v34

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-population-coverage-turnover-assurance.mjs'
      - 'tools/validate-preference-population-coverage-turnover-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v34.mjs'
      - 'tools/validate-preference-custody-manifest-v34.mjs'
      - 'test/preference-population-coverage-turnover-assurance.test.js'
      - 'test/preference-custody-manifest-v34.test.js'
      - 'docs/preference-custody-population-coverage-turnover-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v34.md'
      - '.github/workflows/preference-population-coverage-turnover-assurance.yml'
      - '.github/workflows/preference-custody-v34.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  floor-v34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          node tools/compile-preference-population-coverage-turnover-assurance.mjs
          node tools/compile-preference-custody-manifest-v34.mjs
      - run: |
          node tools/validate-preference-population-coverage-turnover-assurance.mjs
          node tools/validate-preference-custody-manifest-v34.mjs
      - run: |
          node test/preference-population-coverage-turnover-assurance.test.js
          node test/preference-custody-manifest-v34.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v34
          path: |
            build/research/preference-population-coverage-turnover-assurance.json
            build/research/preference-population-coverage-turnover-assurance.md
            build/research/preference-custody-laboratory-floor-v34.json
            build/research/preference-custody-laboratory-floor-v34.md
          if-no-files-found: error
