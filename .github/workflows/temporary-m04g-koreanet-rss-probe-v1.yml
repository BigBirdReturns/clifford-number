name: TEMP M-04G Korea.net RSS probe v1

on:
  push:
    branches:
      - agent/m04g-six-route-official-fallback-probe-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out bounded probe
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Korea.net RSS probe
        run: node .github/probes/m04g_koreanet_rss_probe_v1.mjs qualification
      - name: Render probe summary
        if: always() && hashFiles('qualification/ledger.json') != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledger=JSON.parse(fs.readFileSync('qualification/ledger.json','utf8'));
          const r=ledger.result;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,[
            '# M-04G Korea.net RSS probe',
            '',
            `- Candidate authorized: ${ledger.candidate_authorized}`,
            `- HTTP status: ${r.status}`,
            `- Bytes: ${r.bytes||0}`,
            `- RSS items: ${r.item_count||0}`,
            `- Body SHA-256: ${r.body_sha256||'none'}`,
            `- Final URL: ${r.final_url}`
          ].join('\n')+'\n');
          NODE
      - name: Upload Korea.net RSS receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-koreanet-rss-probe-v1-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
