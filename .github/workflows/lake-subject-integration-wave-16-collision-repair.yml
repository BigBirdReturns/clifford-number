name: Repair Wave 16 Frontier identity collision

on:
  push:
    branches:
      - agent/lake-subject-integration-wave-16
    paths:
      - '.github/tmp/lake-subject-integration-wave-16-collision-repair-trigger.json'

permissions:
  contents: write

concurrency:
  group: lake-subject-integration-wave-16-collision-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the bounded collision repair
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/tmp/wave16-collision-runtime.patch
          git apply .github/tmp/wave16-collision-runtime.patch
          node --check tools/apply-lake-subject-integration-wave-16-sources.mjs
          node --check tools/build-lake-subject-integration-wave-16.mjs
          node --check tools/validate-lake-subject-integration-wave-16.mjs
          node --check test/lake-subject-integration-wave-16.test.js
          cat > .github/tmp/lake-subject-integration-wave-16-trigger.json <<'JSON'
          {
            "schema_version": "lake-subject-integration-wave-16-trigger@1",
            "requested_at": "2026-07-29",
            "attempt": 2,
            "purpose": "Materialize the collision-corrected Wave 16 integration: fifteen existing canonical resolutions including Frontier AI Taskforce to AISI, two new canonical organizations, forty typed subject objects, zero generic unresolved references, and zero relationship, participation, active-claim, graph, hop, cross-case bridge, or human-permission effect."
          }
          JSON
          rm -f \
            .github/tmp/lake-subject-integration-wave-16-collision-repair-trigger.json \
            .github/tmp/wave16-collision-runtime.patch \
            .github/workflows/lake-subject-integration-wave-16-collision-repair.yml
          git diff --check
      - name: Commit and publish the repaired materialization input
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Wave 16 Frontier identity collision'
          git fetch origin agent/lake-subject-integration-wave-16
          test "$(git rev-parse origin/agent/lake-subject-integration-wave-16)" = "${{ github.sha }}"
          git push origin HEAD:agent/lake-subject-integration-wave-16
