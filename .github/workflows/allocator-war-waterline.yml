name: Allocator War Waterline

on:
  pull_request:
    paths:
      - 'data/project/allocator-war-*.json'
      - 'data/research/status-sovereignty-wave-01*.json'
      - 'data/project/status-sovereignty-*.json'
      - 'data/project/estate-thesis-alignment.json'
      - 'data/project/m05-answerable-power-story-registry.json'
      - 'schemas/allocator-war-findings-waterline.schema.json'
      - 'tools/validate-allocator-war-waterline.mjs'
      - 'test/allocator-war-waterline.test.js'
      - 'docs/milestones/allocator-war-waterline-wave-01.md'
      - '.github/workflows/allocator-war-waterline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate allocator-war source, lake, estate, and findings custody
        run: |
          node tools/validate-allocator-war-waterline.mjs
          node test/allocator-war-waterline.test.js
      - name: Revalidate parent SSC and core-thesis contracts
        run: |
          npm run validate:status-sovereignty
          npm run validate:core-thesis
      - name: Run complete repository release gate
        run: npm run release:check
