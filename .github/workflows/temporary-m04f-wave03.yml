name: Temporary materialize M-04F Wave 03 stratigraphy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/temporary/m04f-wave03/**'
      - '.github/workflows/temporary-m04f-wave03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-wave03-evidentiary-stratigraphy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble and extract exact source payload
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          root = Path('.github/temporary/m04f-wave03')
          encoded = ''.join(''.join((root / f'part-{i:02d}.txt').read_text().split()) for i in range(8))
          assert len(encoded) == 47200, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'd59c2a9f9a00c3357a0ad9db76d22fc84215e4acd5aea939343e2cf8f95cf4ea'
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == 35399, len(payload)
          assert hashlib.sha256(payload).hexdigest() == '358b36ab28bf1c789b522e201cdb7e0aa8afa45d182f4e9639e3fd02a8a403d4'
          Path('/tmp/m04f-wave03-source.tgz').write_bytes(payload)
          PY
          tar -xzf /tmp/m04f-wave03-source.tgz -C .
      - name: Build Wave 03
        id: build
        continue-on-error: true
        run: node tools/build-m04f-epistemic-jurisdiction.mjs 2>&1 | tee /tmp/m04f-build.log
      - name: Validate Wave 03
        id: validate
        if: always()
        continue-on-error: true
        run: node tools/validate-m04f-epistemic-jurisdiction.mjs 2>&1 | tee /tmp/m04f-validate.log
      - name: Run Wave 03 regression
        id: regression
        if: always()
        continue-on-error: true
        run: node test/m04f-epistemic-jurisdiction.test.js 2>&1 | tee /tmp/m04f-test.log
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04f-wave03-focused-${{ github.run_attempt }}
          path: |
            /tmp/m04f-build.log
            /tmp/m04f-validate.log
            /tmp/m04f-test.log
          if-no-files-found: warn
      - name: Refuse failed focused gates
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
        run: |
          echo "build=$BUILD validate=$VALIDATE regression=$REGRESSION"
          test "$BUILD" = success
          test "$VALIDATE" = success
          test "$REGRESSION" = success
