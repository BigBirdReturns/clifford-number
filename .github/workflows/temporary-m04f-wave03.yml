name: Temporary materialize M-04F Wave 03 stratigraphy

on:
  push:
    branches:
      - agent/m04f-wave03-evidentiary-stratigraphy
    paths:
      - '.github/temporary/m04f-wave03/**'
      - '.github/workflows/temporary-m04f-wave03.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/temporary/m04f-wave03/**'
      - '.github/workflows/temporary-m04f-wave03.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04f-wave03-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-wave03-evidentiary-stratigraphy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble exact source payload
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path

          root = Path('.github/temporary/m04f-wave03')
          parts = [root / f'part-{i:02d}.txt' for i in range(8)]
          encoded = ''.join(''.join(p.read_text().split()) for p in parts)
          assert len(encoded) == 47200, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'd59c2a9f9a00c3357a0ad9db76d22fc84215e4acd5aea939343e2cf8f95cf4ea'
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == 35399, len(payload)
          assert hashlib.sha256(payload).hexdigest() == '358b36ab28bf1c789b522e201cdb7e0aa8afa45d182f4e9639e3fd02a8a403d4'
          Path('/tmp/m04f-wave03-source.tgz').write_bytes(payload)
          PY
          tar -tzf /tmp/m04f-wave03-source.tgz
      - name: Extract permanent Wave 03 files
        run: tar -xzf /tmp/m04f-wave03-source.tgz -C .
      - name: Build and validate evidentiary stratigraphy
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path

          allowed_exact = {
              '.github/workflows/m04f-epistemic-jurisdiction.yml',
              'data/intake/m04f-epistemic-jurisdiction-sources-04.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-03.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-01.json',
              'data/project/m04f-evidentiary-stratigraphy.json',
              'data/project/m04f-epistemic-jurisdiction-fanout-wave-03.json',
              'data/project/m04f-epistemic-jurisdiction-estate.json',
              'docs/milestones/m04f-evidence-lake-wave-03-stratigraphy.md',
              'test/m04f-epistemic-jurisdiction.test.js',
              'tools/build-m04f-epistemic-jurisdiction.mjs',
              'tools/validate-m04f-epistemic-jurisdiction.mjs',
          }
          allowed_prefix = (
              'build/core-thesis/epistemic-jurisdiction/',
              'reports/core-thesis/epistemic-jurisdiction/',
          )
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          for row in rows:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefix):
                  continue
              tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', '--', path],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if tracked:
                  subprocess.run(['git', 'restore', '--staged', '--worktree', '--', path], check=True)
              else:
                  target = Path(path)
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
          PY
      - name: Rebuild and refuse unexpected output
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          git diff --check
          python - <<'PY'
          import subprocess

          allowed_exact = {
              '.github/workflows/m04f-epistemic-jurisdiction.yml',
              'data/intake/m04f-epistemic-jurisdiction-sources-04.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-03.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-01.json',
              'data/project/m04f-evidentiary-stratigraphy.json',
              'data/project/m04f-epistemic-jurisdiction-fanout-wave-03.json',
              'data/project/m04f-epistemic-jurisdiction-estate.json',
              'docs/milestones/m04f-evidence-lake-wave-03-stratigraphy.md',
              'test/m04f-epistemic-jurisdiction.test.js',
              'tools/build-m04f-epistemic-jurisdiction.mjs',
              'tools/validate-m04f-epistemic-jurisdiction.mjs',
          }
          allowed_prefix = (
              'build/core-thesis/epistemic-jurisdiction/',
              'reports/core-thesis/epistemic-jurisdiction/',
          )
          paths = []
          for row in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          bad = [p for p in paths if p not in allowed_exact and not p.startswith(allowed_prefix)]
          print('\n'.join(paths))
          if bad:
              raise SystemExit('unexpected durable drift:\n' + '\n'.join(bad))
          PY
      - name: Commit verified permanent Wave 03 estate
        run: |
          target='agent/m04f-wave03-evidentiary-stratigraphy'
          remote_sha="$(git rev-parse "origin/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/m04f-epistemic-jurisdiction.yml \
            data/intake/m04f-epistemic-jurisdiction-sources-04.json \
            data/intake/m04f-epistemic-jurisdiction-wave-03.json \
            data/intake/m04f-epistemic-jurisdiction-wave-01.json \
            data/project/m04f-evidentiary-stratigraphy.json \
            data/project/m04f-epistemic-jurisdiction-fanout-wave-03.json \
            data/project/m04f-epistemic-jurisdiction-estate.json \
            docs/milestones/m04f-evidence-lake-wave-03-stratigraphy.md \
            test/m04f-epistemic-jurisdiction.test.js \
            tools/build-m04f-epistemic-jurisdiction.mjs \
            tools/validate-m04f-epistemic-jurisdiction.mjs \
            build/core-thesis/epistemic-jurisdiction \
            reports/core-thesis/epistemic-jurisdiction
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'No generated changes to commit'; exit 1; }
          git commit -m 'Install M-04F Wave 03 evidentiary stratigraphy'
          git push --force-with-lease="refs/heads/$target:$remote_sha" origin "HEAD:refs/heads/$target"
