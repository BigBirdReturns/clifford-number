name: Temporary PR 2231 nested observation diagnostic v71

on:
  push:
    branches:
      - agent/pr2231-nested-observation-diagnostic-v71
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reproduce and qualify observation-first wrapper custody
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const input = 'Phone: ((2026-08-17)) 12:30:45 555-1212';
          const actual = redact(input);
          console.log(JSON.stringify({ kind: 'pre-patch-reproduction', input, actual }));
          assert.equal(
            actual,
            'Phone: ([contact omitted]) 12:30:45 [contact omitted]',
            'exact v71 parent must reproduce the reviewed nested-observation defect'
          );
          NODE

          python3 <<'PY'
          from pathlib import Path

          path = Path('tools/lib/industrial-exhaust.mjs')
          source = path.read_text()
          old = """  const leadingObservationSource = candidate.trimStart();
          const leadingObservationOffset = candidate.length - leadingObservationSource.length;
          const leadingObservationMatch = numericObservationMatch(
            leadingObservationSource,
            externalSuffix
          );
          """
          new = """  let leadingObservationOffset = candidate.length - candidate.trimStart().length;
          let leadingObservationSource = candidate.slice(leadingObservationOffset);
          let wrappedObservationOffset = leadingObservationOffset;
          let sawLeadingObservationWrapper = false;
          while (wrappedObservationOffset < candidate.length) {
            const character = candidate[wrappedObservationOffset];
            const normalizedCharacter = character.normalize('NFKC');
            if (!Object.hasOwn(OBSERVATION_WRAPPER_PAIRS, normalizedCharacter)) break;
            sawLeadingObservationWrapper = true;
            wrappedObservationOffset += character.length;
            while (wrappedObservationOffset < candidate.length
                && /\\s/u.test(candidate[wrappedObservationOffset])) {
              wrappedObservationOffset += 1;
            }
          }
          if (sawLeadingObservationWrapper) {
            leadingObservationOffset = wrappedObservationOffset;
            leadingObservationSource = candidate.slice(leadingObservationOffset);
          }
          const leadingObservationMatch = numericObservationMatch(
            leadingObservationSource,
            externalSuffix
          );
          """
          if source.count(old) != 1:
              raise SystemExit(f'leading observation block count={source.count(old)}')
          source = source.replace(old, new)

          anchor = """  const observationGroup = observation.group;
          const normalizedCandidate = candidate.trim().normalize('NFKC');
          """
          replacement = """  const observationGroup = observation.group;
          const normalizedPrefixLabelEnd = terminalIdentifierLabelEnd(
            normalizedExternalPrefix,
            normalizedExternalPrefix.length
          );
          const wrapperSeparatedPhoneLabel = explicitPhoneLabelContext
            && (sawLeadingObservationWrapper
              || trailingObservationOpeners(
                candidate.slice(0, groups[0].index)
              ).length > 0
              || normalizedPrefixLabelEnd < normalizedExternalPrefix.length);
          const strongWrappedObservationAtEntry = wrapperSeparatedPhoneLabel
            && Boolean(leadingObservationMatch)
            && !isWeakBareRangeObservation(
              leadingObservationSource,
              externalSuffix
            )
            && observation.end > groups[0].index;

          if (strongWrappedObservationAtEntry) {
            if (observation.end < candidate.length) {
              const laterPhone = independentPhoneStartAfterObservation(
                candidate,
                groups,
                observation,
                '',
                externalSuffix,
                false,
                false
              );
              if (laterPhone) {
                const remainderRanges = laterPhone.end < candidate.length
                  ? phoneRedactionRanges(
                      candidate.slice(laterPhone.end),
                      `${candidate.slice(0, laterPhone.start)}[contact omitted]`,
                      externalSuffix,
                      true,
                      false,
                      false
                    ).map(range => ({
                      start: range.start + laterPhone.end,
                      end: range.end + laterPhone.end
                    }))
                  : [];
                return [laterPhone, ...remainderRanges];
              }
            }
            return [];
          }

          const normalizedCandidate = candidate.trim().normalize('NFKC');
          """
          if source.count(anchor) != 1:
              raise SystemExit(f'observation anchor count={source.count(anchor)}')
          source = source.replace(anchor, replacement)
          path.write_text(source)
          PY

          git diff --check
          node --check tools/lib/industrial-exhaust.mjs

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const refusalCases = [
            'Phone: ((2026-08-17)) 12:30:45 555-1212',
            '電話：（（２０２６－０８－１７）） １２：３０：４５ ５５５－１２１２',
            'Phone: ((123456789.123456)) 12:30:45 555-1212',
            'Phone: ((123456789 people)) 12:30:45 555-1212'
          ];
          for (const input of refusalCases) {
            const actual = redact(input);
            console.log(JSON.stringify({ kind: 'observation-refusal', input, actual }));
            assert.equal(actual, input, `${input}: wrapped observation must retain custody`);
          }

          const nestedPhone = redact(
            'Phone: ((09012345678)) 12:30:45 555-1212'
          );
          console.log(JSON.stringify({ kind: 'nested-phone-control', actual: nestedPhone }));
          assert.equal(
            nestedPhone,
            'Phone: ([contact omitted]) 12:30:45 [contact omitted]'
          );

          for (const input of [
            'Phone: (+81 90 1234 5678) 12:30:45 555-1212',
            'Phone: (09012345678) 90 people 555-1212'
          ]) {
            const actual = redact(input);
            const normalized = actual.normalize('NFKC');
            console.log(JSON.stringify({ kind: 'labelled-phone-control', input, actual }));
            assert.equal((actual.match(/\[contact omitted\]/gu) ?? []).length, 2);
            assert.ok(normalized.includes(input.includes('90 people') ? '90 people' : '12:30:45'));
            assert.doesNotMatch(normalized, /555-1212/u);
          }
          NODE

          node test/industrial-exhaust.test.js

          mkdir -p /tmp/pr2231-v71
          cp tools/lib/industrial-exhaust.mjs /tmp/pr2231-v71/industrial-exhaust.mjs
          git diff -- tools/lib/industrial-exhaust.mjs > /tmp/pr2231-v71/patch.diff
          printf 'V71_DIAGNOSTIC_COMPLETE\n' > /tmp/pr2231-v71/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-nested-observation-diagnostic-v71
          path: /tmp/pr2231-v71
          if-no-files-found: warn
          retention-days: 90
