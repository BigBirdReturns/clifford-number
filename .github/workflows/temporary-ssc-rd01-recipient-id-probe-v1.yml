name: TEMP SSC RD-01 recipient identifier probe v1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd01-recipient-id-probe-base-v1
    paths:
      - '.github/tmp/ssc-rd01-recipient-id-probe-v1.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute fixed identifier-bearing route probe
        run: |
          set -Eeuo pipefail
          test "$(git hash-object .github/tmp/ssc-rd01-recipient-id-probe-v1.mjs)" = '9405f2ba2c1858b1aec059b0e8989d0981d04e90'
          node .github/tmp/ssc-rd01-recipient-id-probe-v1.mjs
          jq -e '
            .routes == 5 and
            .http_successes == 5 and
            .parsed_json_responses == 5 and
            .external_contacts == 0 and
            .external_reviews == 0 and
            .outside_human_dependency == false and
            .graph_effect == "none"
          ' rd01-recipient-id-probe-v1/summary.json >/dev/null
      - name: Upload exact probe responses
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-recipient-id-probe-v1
          path: rd01-recipient-id-probe-v1
          if-no-files-found: error
          retention-days: 90
