name: TEMP qualify exact School.House SAM custody product

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-sam-custody-product-qualifier-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: schoolhouse-sam-custody-product-qualifier-v1-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-sam-custody-product-qualifier-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove exact product head and run independent qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='0a4091391e4c17c64683bd91f6a739a2a0a152fc'
          BASE_TREE='a44489a4af8f1c5ef2ad735e9f7a2b7f49d5feb1'
          PRODUCT='2e5db278971e344a529c96a3658b214a90ad8356'
          PRODUCT_TREE='0ffec7018bcfc038a73cd280970f783d12a5c222'
          WORKFLOW='.github/workflows/temp-schoolhouse-sam-custody-product-qualifier-v1.yml'
          RECEIPT="$RUNNER_TEMP/schoolhouse-sam-custody-product-qualification-v1"
          rm -rf "$RECEIPT"
          mkdir -p "$RECEIPT"
          printf 'source_requests=0\n' > "$RECEIPT/BOUNDARY"
          printf 'initializing\n' > "$RECEIPT/STAGE"
          trap 'rc=$?; trap - EXIT; printf "%s\n" "$rc" > "$RECEIPT/SCRIPT_EXIT_CODE"; exit "$rc"' EXIT

          cat > "$RECEIPT/permanent-paths.txt" <<'EOF'
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/product-manifest.json
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/sealed-qualification-artifact.zip
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/sealed-source-artifact.zip
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/sealed-wrapper-reconstruction-artifact.zip
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/source-custody.json
          docs/milestones/schoolhouse-sam-public-entity-registration-census-v1.md
          tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py
          EOF
          sort -o "$RECEIPT/permanent-paths.txt" "$RECEIPT/permanent-paths.txt"

          printf 'proving-topology-and-product-surface\n' > "$RECEIPT/STAGE"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$PRODUCT_TREE"
          test "$(git rev-parse "$PRODUCT^")" = "$BASE"
          test "$(git rev-list --count "$BASE".."$PRODUCT")" = '1'
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-list --count "$PRODUCT"..HEAD)" = '1'
          mapfile -t QUALIFIER_DELTA < <(git diff --name-only "$PRODUCT"..HEAD)
          test "${#QUALIFIER_DELTA[@]}" -eq 1
          test "${QUALIFIER_DELTA[0]}" = "$WORKFLOW"
          git diff --name-only "$BASE".."$PRODUCT" | sort > "$RECEIPT/observed-product-paths.txt"
          diff -u "$RECEIPT/permanent-paths.txt" "$RECEIPT/observed-product-paths.txt"
          test "$(git diff --name-status "$BASE".."$PRODUCT" | wc -l | tr -d ' ')" = '7'
          git diff --name-status "$BASE".."$PRODUCT" | awk '$1 != "A" { exit 1 }'
          ! git diff --name-only "$BASE".."$PRODUCT" | grep -q '^\.github/workflows/'

          git ls-tree -r "$PRODUCT" \
            data/intake/schoolhouse-sam-public-entity-registration-census-v1 \
            docs/milestones/schoolhouse-sam-public-entity-registration-census-v1.md \
            tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py \
            > "$RECEIPT/product-ls-tree.txt"
          test "$(wc -l < "$RECEIPT/product-ls-tree.txt" | tr -d ' ')" = '7'
          while IFS= read -r path; do
            test "$(git rev-parse "$PRODUCT:$path")" = "$(git rev-parse "HEAD:$path")"
          done < "$RECEIPT/permanent-paths.txt"

          printf 'running-independent-focused-and-complete-gates\n' > "$RECEIPT/STAGE"
          python tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py --self-test \
            | tee "$RECEIPT/focused-validator.log"
          node tools/validate-no-magic-human-gate.mjs \
            | tee "$RECEIPT/no-magic-human.log"
          npm run release:check > "$RECEIPT/release-check.log" 2>&1

          printf 'restoring-and-replaying-product\n' > "$RECEIPT/STAGE"
          QUALIFIER_HEAD="$(git rev-parse HEAD)"
          git reset --hard "$QUALIFIER_HEAD"
          git clean -fd
          python tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py --self-test \
            | tee "$RECEIPT/deterministic-replay.log"
          node tools/validate-no-magic-human-gate.mjs \
            | tee "$RECEIPT/no-magic-human-replay.log"
          test -z "$(git status --porcelain)"
          while IFS= read -r path; do
            test "$(git rev-parse "$PRODUCT:$path")" = "$(git rev-parse "HEAD:$path")"
          done < "$RECEIPT/permanent-paths.txt"

          printf 'writing-qualification-receipt\n' > "$RECEIPT/STAGE"
          python - "$RECEIPT/qualification.json" "$QUALIFIER_HEAD" <<'PY'
          from pathlib import Path
          import json
          import sys

          output, qualifier_head = sys.argv[1:]
          value = {
              'schema_version': 'schoolhouse-sam-custody-product-qualification@1',
              'qualification': 'pass',
              'issue': 1382,
              'source_requests': 0,
              'canonical_parent': '0a4091391e4c17c64683bd91f6a739a2a0a152fc',
              'canonical_parent_tree': 'a44489a4af8f1c5ef2ad735e9f7a2b7f49d5feb1',
              'product_commit': '2e5db278971e344a529c96a3658b214a90ad8356',
              'product_tree': '0ffec7018bcfc038a73cd280970f783d12a5c222',
              'qualifier_head': qualifier_head,
              'product_commit_count': 1,
              'permanent_path_count': 7,
              'addition_only': True,
              'workflow_paths': 0,
              'focused_validation': 'pass',
              'repository_composability': 'pass',
              'adversarial_refusals': 10,
              'no_magic_human_gate': 'pass',
              'complete_release_gate': 'pass',
              'deterministic_replay': 'pass',
              'post_restore_clean': True,
              'product_blobs_unchanged_at_qualifier_head': True,
              'terminal_query_state_counts': {'bounded_public_search_controls_unavailable': 3},
              'query_submissions': 0,
              'retained_candidate_rows': 0,
              'unique_public_ueis': 0,
              'identities_admitted': 0,
              'relationships_admitted': 0,
              'negative_existence_claims': 0,
              'federal_registration_admissions': 0,
              'federal_award_or_funding_admissions': 0,
              'owner_admissions': 0,
              'operator_admissions': 0,
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'public_schoolhouse_legal_identity': 'unresolved',
          }
          Path(output).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PY
          printf 'complete\n' > "$RECEIPT/STAGE"
          (
            cd "$RECEIPT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          cat "$RECEIPT/qualification.json"

      - name: Upload exact-head qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-sam-custody-product-qualification-v1
          path: ${{ runner.temp }}/schoolhouse-sam-custody-product-qualification-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
