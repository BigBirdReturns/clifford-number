name: TEMP materialize topology-aware Montana row-state reconciliation v5

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-ssc-rd04-mt-row-state-reconciliation-v5.yml'
      - '.tmp/ssc-rd04-mt-row-state-reconciliation-v5/**'

permissions:
  contents: write

env:
  CARRIER_PARENT: 0840358962621b0be3db6864ecec763327f35903
  CARRIER_PATH: .github/workflows/temp-materialize-ssc-rd04-mt-row-state-reconciliation-v5.yml
  PART_ROOT: .tmp/ssc-rd04-mt-row-state-reconciliation-v5
  SOURCE_BRANCH: agent/ssc-rd04-mt-row-state-reconciliation-v4
  SOURCE_PRODUCT: 574a8723f0f887c297b21708feb25474b6386e28
  SOURCE_TREE: 18f520e4256a34881cf664167c87728c716fc2e9
  SOURCE_LOCK_REF: refs/heads/lock/ssc-rd04-mt-row-state-reconciliation-v4-qualified
  CANONICAL_PARENT: 0840358962621b0be3db6864ecec763327f35903
  PREVIOUS_MERGE: 9510310129c3aab44f8b5b187430a3ede005b7b4
  TARGET_BRANCH: agent/ssc-rd04-mt-row-state-reconciliation-v5
  QUALIFIED_PRODUCT_REF: refs/heads/lock/ssc-rd04-mt-row-state-reconciliation-v5-qualified
  WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.yml
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation
  MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation/product-manifest.json
  OUT: /tmp/ssc-rd04-mt-row-state-reconciliation-v5
  WORK: /tmp/ssc-rd04-mt-row-state-reconciliation-v5-work
  PRODUCT_NAME: github-actions[bot]
  PRODUCT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PRODUCT_DATE: '1786434600 +0000'
  PRODUCT_MESSAGE: Promote topology-aware Montana derivative row-state reconciliation v5
  PROGRAM_SHA256: d70afd977feadabb0ed45517969ebff8aed06d2fad1bd8635233d525448a8cb1

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Execute checksum-bound topology-aware materializer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cat "$PART_ROOT"/part-00 "$PART_ROOT"/part-01 "$PART_ROOT"/part-02 "$PART_ROOT"/part-03 > /tmp/materialize.sh
          test "$(sha256sum /tmp/materialize.sh | awk '{print $1}')" = "$PROGRAM_SHA256"
          bash -n /tmp/materialize.sh
          bash /tmp/materialize.sh
      - name: Preserve exact topology-aware transaction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-reconciliation-v5
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
