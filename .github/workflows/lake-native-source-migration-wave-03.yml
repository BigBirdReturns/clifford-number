name: Evidence lake native source migration Wave 03

on:
  push:
    branches:
      - agent/lake-native-source-migration-wave-03
    paths:
      - '.github/tmp/lake-native-source-migration-wave-03-trigger.json'
  pull_request:
    branches:
      - agent/lake-identifier-repair-wave-02
    paths:
      - 'data/project/lake-native-source-migration-wave-03-policy.json'
      - 'data/project/lake-index-policy.json'
      - '.github/tmp/apply-lake-native-source-wave-03.mjs'
      - 'tools/build-lake-native-source-migration-wave-03.mjs'
      - 'tools/reconcile-lake-native-source-migration-wave-03.mjs'
      - 'tools/validate-lake-native-source-migration-wave-03.mjs'
      - 'test/lake-native-source-migration-wave-03.test.js'
      - '.github/workflows/lake-native-source-migration-wave-03.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lake-native-source-migration-wave-03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Determine execution mode
        id: mode
        shell: bash
        run: |
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test -f .github/tmp/lake-native-source-migration-wave-03-trigger.json; then
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
            echo 'phase=execute' >> "$GITHUB_OUTPUT"
          elif test "$GITHUB_EVENT_NAME" = 'pull_request' || test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'; then
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
            if git ls-files --error-unmatch cases/uk-ai-policy/case.json >/dev/null 2>&1; then
              echo 'phase=post' >> "$GITHUB_OUTPUT"
            else
              echo 'phase=execute' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'validate=false' >> "$GITHUB_OUTPUT"
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
            echo 'phase=none' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.validate == 'true'
        with:
          node-version: '24'
      - name: Run the complete legacy release gate before source migration
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.phase == 'execute'
        run: npm run release:check
      - name: Restore committed bytes before source migration
        if: steps.mode.outputs.validate == 'true'
        run: git restore --staged --worktree .
      - name: Apply the checked catalog and frontier source migration
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.phase == 'execute'
        run: node .github/tmp/apply-lake-native-source-wave-03.mjs
      - name: Build and deterministically prove the native source migration
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.phase == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-lake-native-source-migration-wave-03.mjs
          sha256sum \
            cases/uk-ai-policy/case.json \
            cases/uk-ai-policy/receipts.jsonl \
            cases/uk-ai-policy/claims.jsonl \
            cases/uk-ai-policy/events.jsonl \
            cases/uk-ai-policy/relations.jsonl \
            cases/uk-ai-policy/beacons.jsonl \
            cases/uk-ai-policy/trails.jsonl \
            data/project/lake-identifier-source-supersessions-wave-03.jsonl \
            data/project/lake-native-source-migration-wave-03.json \
            build/lake-actions/native-source-migration-wave-03.json \
            reports/lake-native-source-migration-wave-03.md > /tmp/lake-native-wave-03-first.sha256
          node tools/build-lake-native-source-migration-wave-03.mjs
          sha256sum --check --strict /tmp/lake-native-wave-03-first.sha256
          git diff --check
      - name: Stage native source and checked source changes
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.phase == 'execute'
        run: |
          git add \
            tools/build-public-catalog.mjs \
            test/report-frontier.test.js \
            cases/uk-ai-policy/case.json \
            cases/uk-ai-policy/receipts.jsonl \
            cases/uk-ai-policy/claims.jsonl \
            cases/uk-ai-policy/events.jsonl \
            cases/uk-ai-policy/relations.jsonl \
            cases/uk-ai-policy/beacons.jsonl \
            cases/uk-ai-policy/trails.jsonl \
            data/project/lake-identifier-source-supersessions-wave-03.jsonl \
            data/project/lake-native-source-migration-wave-03.json \
            build/lake-actions/native-source-migration-wave-03.json \
            reports/lake-native-source-migration-wave-03.md
      - name: Run the complete repository release gate with the native case
        if: steps.mode.outputs.validate == 'true'
        run: npm run release:check
      - name: Observe current open-PR shadow
        if: steps.mode.outputs.validate == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs
      - name: Rebuild and reconcile the post-migration lake
        if: steps.mode.outputs.validate == 'true'
        run: |
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/reconcile-lake-native-source-migration-wave-03.mjs
          node tools/validate-lake-native-source-migration-wave-03.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-native-source-migration-wave-03.test.js
      - name: Prove deterministic compiled, lake, and reconciliation products
        if: steps.mode.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find build/lake-index -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/lake-native-wave-03-post.sha256
          sha256sum \
            build/cases/uk-ai-policy.json \
            build/cases/index.json \
            build/public-catalog.json \
            build/report-frontier.json \
            reports/index.html \
            build/lake-actions/native-source-migration-wave-03-reconciliation.json \
            reports/lake-index-census.md \
            reports/lake-index-gap-summary.md \
            reports/lake-basin-index.md \
            reports/lake-native-source-migration-wave-03-reconciliation.md >> /tmp/lake-native-wave-03-post.sha256
          node tools/compile-cases.mjs
          node tools/build-public-catalog.mjs
          node tools/build-report-frontier.mjs
          node tools/render-report-frontier.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/reconcile-lake-native-source-migration-wave-03.mjs
          sha256sum --check --strict /tmp/lake-native-wave-03-post.sha256
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-native-source-migration-wave-03.mjs
          node test/case-ledger.test.js
          node test/public-catalog.test.js
          node test/report-frontier.test.js
          node test/lake-native-source-migration-wave-03.test.js
          git diff --check
      - name: Restore the non-materializing validation surface
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.materialize != 'true'
        run: |
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
      - name: Enforce native source and generated-output boundaries
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp/lake-native-source-wave-03-source-paths.json /tmp/lake-native-source-wave-03-source-paths.json
          rm -f \
            .github/tmp/lake-native-source-migration-wave-03-trigger.json \
            .github/tmp/apply-lake-native-source-wave-03.mjs \
            .github/tmp/lake-native-source-wave-03-source-paths.json
          python - <<'PY'
          import json
          import re
          import subprocess

          migration = json.load(open('/tmp/lake-native-source-wave-03-source-paths.json'))
          required = set(migration['changed_paths']) | {
              '.github/tmp/lake-native-source-migration-wave-03-trigger.json',
              '.github/tmp/apply-lake-native-source-wave-03.mjs',
              'cases/uk-ai-policy/case.json',
              'cases/uk-ai-policy/receipts.jsonl',
              'cases/uk-ai-policy/claims.jsonl',
              'cases/uk-ai-policy/events.jsonl',
              'cases/uk-ai-policy/relations.jsonl',
              'cases/uk-ai-policy/beacons.jsonl',
              'cases/uk-ai-policy/trails.jsonl',
              'data/project/lake-identifier-source-supersessions-wave-03.jsonl',
              'data/project/lake-native-source-migration-wave-03.json',
              'build/lake-actions/native-source-migration-wave-03.json',
              'build/lake-actions/native-source-migration-wave-03-reconciliation.json',
              'reports/lake-native-source-migration-wave-03.md',
              'reports/lake-native-source-migration-wave-03-reconciliation.md',
          }
          exact_allowed_sources = required | {
              'data/project/lake-open-pr-shadow.json',
          }
          generated_prefixes = (
              'build/',
              'reports/',
              'briefs/',
              'estates/',
              'gametrails/',
          )
          generated_root = re.compile(r'^(?:Clifford-.*\.html|[^/]+-standalone\.html)$')

          raw = subprocess.check_output([
              'git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'
          ])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          actual = set()
          for entry in entries:
              status = entry[:2]
              assert 'R' not in status and 'C' not in status, entry
              actual.add(entry[3:])

          unexpected = sorted(path for path in actual
              if path not in exact_allowed_sources
              and not path.startswith(generated_prefixes)
              and not generated_root.match(path))
          assert required <= actual, {
              'missing_required_native_source_or_reconciliation_changes': sorted(required - actual),
          }
          assert not unexpected, {
              'undeclared_source_changes': unexpected,
          }
          print(json.dumps({
              'required_changes': len(required),
              'actual_changes': len(actual),
              'generated_changes': len(actual - exact_allowed_sources),
          }, indent=2))
          PY
      - name: Commit the executed native source migration
        if: steps.mode.outputs.materialize == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute evidence lake native source migration Wave 03'
          git fetch origin agent/lake-native-source-migration-wave-03
          test "$(git rev-parse origin/agent/lake-native-source-migration-wave-03)" = "${{ steps.mode.outputs.original_sha }}"
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-native-source-migration-wave-03.mjs
          git push origin HEAD:agent/lake-native-source-migration-wave-03
