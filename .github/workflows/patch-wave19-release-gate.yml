name: Register Wave 19 in canonical release gate

on:
  push:
    branches:
      - agent/lake-generator-contracts-wave-19
    paths:
      - '.github/tmp/patch-wave19-release-gate-trigger.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch package gate and self-delete
        shell: bash
        run: |
          set -euo pipefail
          original_sha=$(git rev-parse HEAD)
          node - <<'NODE'
          const fs = require('fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const prior = pkg.scripts.check;
          const anchor = ' && npm run validate:lake-identifier-topology-wave-18';
          const insertion = `${anchor} && npm run validate:lake-generator-contracts-wave-19`;
          if (!prior.includes('npm run validate:lake-generator-contracts-wave-19')) {
            if (!prior.includes(anchor)) throw new Error('Wave 18 release-gate anchor missing');
            pkg.scripts.check = prior.replace(anchor, insertion);
          }
          pkg.scripts['validate:lake-generator-contracts-wave-19'] =
            'node tools/validate-lake-generator-contracts-wave-19.mjs && node test/lake-generator-contracts-wave-19.test.js';
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          rm -f .github/tmp/patch-wave19-release-gate-trigger.json
          rm -f .github/workflows/patch-wave19-release-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check
          node -e "const p=require('./package.json'); if (!p.scripts.check.includes('validate:lake-generator-contracts-wave-19')) process.exit(1); if (!p.scripts['validate:lake-generator-contracts-wave-19']) process.exit(1)"
          git commit -m 'Register Wave 19 in canonical release gate'
          git fetch origin agent/lake-generator-contracts-wave-19
          test "$(git rev-parse origin/agent/lake-generator-contracts-wave-19)" = "$original_sha"
          git push origin HEAD:agent/lake-generator-contracts-wave-19
