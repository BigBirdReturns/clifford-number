name: Temporary Wave 36 basin diagnostic

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-basin-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: temporary-wave36-basin-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Print every competing Wave 36 basin match
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('data/project/lake-basin-registry.json','utf8'));
          const paths = [
            'data/project/lake-allocator-war-public-acquisition-wave-36-policy.json',
            'data/acquisition/lake-allocator-war-wave-36/capture-ledger.jsonl',
            'data/acquisition/lake-allocator-war-wave-36/snapshots/law36-c001.html',
            'build/lake-actions/allocator-war-public-acquisition-wave-36.json',
            'reports/lake-allocator-war-public-acquisition-wave-36.md'
          ];
          for (const path of paths) {
            const matches = [];
            for (const basin of registry.basins) {
              for (const prefix of basin.path_prefixes ?? []) {
                const normalized = prefix.endsWith('/') ? prefix : prefix;
                if (path === prefix || (prefix.endsWith('/') && path.startsWith(prefix)) || (!prefix.endsWith('/') && path.startsWith(`${prefix}/`))) {
                  matches.push({basin_id:basin.basin_id,prefix,length:prefix.length});
                }
              }
            }
            matches.sort((a,b)=>b.length-a.length || a.basin_id.localeCompare(b.basin_id));
            console.log(JSON.stringify({path,matches},null,2));
          }
          NODE
