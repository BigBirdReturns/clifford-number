name: Preference custody trust-federation control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/trust-federation.fixture.json'
      - 'tools/lib/preference-trust-federation.mjs'
      - 'tools/compile-preference-trust-federation.mjs'
      - 'tools/validate-preference-trust-federation.mjs'
      - 'test/preference-trust-federation.test.js'
      - 'docs/preference-custody-trust-federation.md'
      - '.github/workflows/preference-trust-federation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile cross-organizational trust and recovery worlds
        run: node tools/compile-preference-trust-federation.mjs
      - name: Validate topology, revocation, trust, cache, recovery, rights, and authority boundaries
        run: node tools/validate-preference-trust-federation.mjs
      - name: Exercise complete, cache, cloud, lag, authority, rights, abstention, tenant, and tamper fixtures
        run: node test/preference-trust-federation.test.js
      - name: Preserve deterministic trust-federation projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-trust-federation-pc15
          path: |
            build/research/preference-trust-federation.json
            build/research/preference-trust-federation.md
          if-no-files-found: error
