name: Temporary PR 2231 dotted phone and inherited wrapper controller v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-dotted-phone-inherited-wrapper-v1-repair.py'
      - '.github/workflows/temporary-pr2231-dotted-phone-inherited-wrapper-controller-v1.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-dotted-phone-inherited-wrapper-v1
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-dotted-phone-inherited-wrapper-controller-v1
      REPAIR_PATH: .github/tmp/pr2231-dotted-phone-inherited-wrapper-v1-repair.py
      REPAIR_BLOB: b49caab61a83b80c623b4492793cae1705ad5a2d
      CPARENT: 01428cde971ffe0d995a60c80c153eded9b7e6b1
      CTREE: 1c37cad91b3be5c2b6cf7fe98966ae797f5f441b
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: a8428d09b3aa167b5aa86af0876929deb9fadb18
      PTREE: 33813b1324a8ea3460496b35b9a193162d902b25
      PLIB: 36a5c1b83956037efaaad94c8fe9d92b7cc210be
      PTEST: 3979cbfc7f63f24e12c8d39aff326f0f9ac65a77
      PREDBRANCH: agent/pr2231-intrinsic-phone-strong-observation-controller-v1
      PREDHEAD: 66d1903eab522cba7082163338773d3509b08ce3
      PREDREPAIR_PATH: .github/tmp/pr2231-intrinsic-phone-strong-observation-v1-repair.py
      PREDREPAIR_BLOB: 08e8adcddfd588bcea95d5c64d9ecbc669669661

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Qualify and publish dotted-phone and inherited-wrapper repair
        shell: bash
        run: |
          set -euo pipefail

          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-dotted-wrapper-source
          Q=/tmp/pr2231-dotted-wrapper-main
          A=/tmp/pr2231-dotted-wrapper-artifact
          R="$A/receipt.txt"
          mkdir -p "$A"
          : >"$R"

          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$PREDBRANCH:refs/remotes/origin/$PREDBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }
          retain_workspace() {
            if [ -d "$S" ]; then
              git -C "$S" diff --binary -- \
                tools/lib/industrial-exhaust.mjs \
                test/industrial-exhaust.test.js \
                > "$A/candidate.patch" 2>/dev/null || true
              cp "$S/tools/lib/industrial-exhaust.mjs" \
                "$A/industrial-exhaust.mjs" 2>/dev/null || true
              cp "$S/test/industrial-exhaust.test.js" \
                "$A/industrial-exhaust.test.js" 2>/dev/null || true
            fi
          }
          trap retain_workspace EXIT

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq controller-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'.github/tmp/pr2231-dotted-phone-inherited-wrapper-v1-repair.py\n.github/workflows/temporary-pr2231-dotted-phone-inherited-wrapper-controller-v1.yml'
          require_eq repair-blob \
            "$(git rev-parse "HEAD:$REPAIR_PATH")" "$REPAIR_BLOB"
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq main-parent "$(git rev-parse "$CPARENT^")" "$PPARENT"
          require_eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$PPARENT"
          require_eq product-main-merge-base "$(git merge-base "$PHEAD" "$CPARENT")" "$PPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$PPARENT..$PHEAD")" '1'
          require_eq product-paths \
            "$(git diff --name-only "$PPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq predecessor-controller-head \
            "$(git rev-parse refs/remotes/origin/$PREDBRANCH)" "$PREDHEAD"
          require_eq predecessor-repair-blob \
            "$(git rev-parse "$PREDHEAD:$PREDREPAIR_PATH")" "$PREDREPAIR_BLOB"

          stage exact-product-regression-witnesses
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const predecessorCases = [
            [
              'P1 labelled dotted domestic phone is held as an observation',
              'Phone: 03.6216.8041',
              'Phone: 03.6216.8041'
            ],
            [
              'P1 labelled dotted mobile phone is held as an observation',
              'Phone: 090.1234.5678',
              'Phone: 090.1234.5678'
            ],
            [
              'P2 inherited label cannot enter an attached wrapper',
              'Phone: 09012345678 12:30:45(03-6216-8041)',
              'Phone: [contact omitted] 12:30:45(03-6216-8041)'
            ]
          ];
          for (const [name, input, expected] of predecessorCases) {
            const actual = redact(input);
            console.log(JSON.stringify({
              kind: 'exact-predecessor-reproduction', name, input, actual, expected
            }));
            assert.equal(actual, expected, name);
          }
          assert.equal(
            redact('03.6216.8041'),
            '[contact omitted]',
            'P1 control: the same dotted value remains intrinsically telephone-valid without a label'
          );
          assert.equal(
            redact('Phone: 03-62165111 people'),
            'Phone: 03-62165111 people',
            'unit-bearing observation custody must remain active before repair'
          );
          NODE

          stage apply-repair-and-targeted-controls
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          require_eq repair-paths \
            "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          RLIB="$(git hash-object tools/lib/industrial-exhaust.mjs)"
          RTEST="$(git hash-object test/industrial-exhaust.test.js)"
          printf 'repaired-lib=%s\nrepaired-test=%s\n' "$RLIB" "$RTEST" | tee -a "$R"

          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const repairedCases = [
            ['P1 labelled dotted domestic phone', 'Phone: 03.6216.8041', 'Phone: [contact omitted]'],
            ['P1 labelled dotted mobile phone', 'Phone: 090.1234.5678', 'Phone: [contact omitted]'],
            ['P1 fullwidth labelled dotted domestic phone', '電話：０３．６２１６．８０４１', '電話：[contact omitted]'],
            ['P1 fullwidth labelled dotted mobile phone', '電話：０９０．１２３４．５６７８', '電話：[contact omitted]'],
            ['P2 attached wrapped grouped phone', 'Phone: 09012345678 12:30:45(03-6216-8041)', 'Phone: [contact omitted] 12:30:45[contact omitted]'],
            ['P2 fullwidth attached wrapped grouped phone', '電話：０９０１２３４５６７８ １２：３０：４５（０３－６２１６－８０４１）', '電話：[contact omitted] １２：３０：４５[contact omitted]'],
            ['P2 attached wrapped weak local phone', 'Phone: 09012345678 12:30:45(555-1212)', 'Phone: [contact omitted] 12:30:45[contact omitted]'],
            ['P2 one-use lease does not renew', 'Phone: 09012345678 12:30:45(03-6216-8041) 13:40:50 666-1212', 'Phone: [contact omitted] 12:30:45[contact omitted] 13:40:50 666-1212'],
            ['unlabelled dotted intrinsic control', '03.6216.8041', '[contact omitted]'],
            ['labelled decimal observation control', 'Phone: 3.1415', 'Phone: 3.1415'],
            ['labelled period-date observation control', 'Phone: 2026.08.17', 'Phone: 2026.08.17'],
            ['unit-bearing phone-shaped observation control', 'Phone: 03-62165111 people', 'Phone: 03-62165111 people'],
            ['two complete labelled dates remain observations', 'Phone: 2026.08.17 2027.09.18', 'Phone: 2026.08.17 2027.09.18'],
            ['unit observation then later phone', 'Phone: 03-62165111 people 03-6216-8041', 'Phone: 03-62165111 people [contact omitted]'],
            ['weak local plus later phone under direct label', 'Phone: 555-1212 03-6216-8041', 'Phone: [contact omitted] [contact omitted]'],
            ['generic weak range remains observation', '10-20 03-6216-8041', '10-20 [contact omitted]'],
            ['unlabelled local remains unclassified', '555-1212 03-6216-8041', '555-1212 [contact omitted]'],
            ['identifier period suffix remains independent', 'ID: 12345678.03.6216.8041', 'ID: 12345678.[contact omitted]'],
            ['ordinary one-use bridge remains bounded', 'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212'],
            ['unproved alphanumeric adjacency remains protected', 'A(03-6216-8041)', 'A(03-6216-8041)'],
            ['intervening letter blocks bridge', 'Phone: 09012345678 12:30:45A(03-6216-8041)', 'Phone: [contact omitted] 12:30:45A(03-6216-8041)']
          ];
          for (const [name, input, expected] of repairedCases) {
            const actual = redact(input);
            console.log(JSON.stringify({
              kind: 'repaired-transition', name, input, actual, expected
            }));
            assert.equal(actual, expected, name);
          }
          console.log(`REPAIRED_TRANSITION_CASES=${repairedCases.length}`);
          NODE

          stage repaired-industrial-exhaust-suites
          mapfile -t suites < <(
            find test -maxdepth 1 -type f \
              -name 'industrial-exhaust*.test.js' -print | LC_ALL=C sort
          )
          test "${#suites[@]}" -ge 3
          printf '%s\n' "${suites[@]}" | tee "$A/suites.txt"
          for suite in "${suites[@]}"; do
            printf 'RUNNING %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done

          stage current-main-transplant-and-release
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq transplant-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq transplant-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq transplant-test "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"
          git diff --check
          for suite in "${suites[@]}"; do
            printf 'TRANSPLANT %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq post-release-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq post-release-test "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"

          stage construct-qualified-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: preserve dotted phones and inherited wrapper entry'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq qualified-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq qualified-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq qualified-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq qualified-lib "$ALIB" "$RLIB"
          require_eq qualified-test "$ATEST" "$RTEST"
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' \
            "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
          git show --format=fuller --stat HEAD > "$A/qualified-commit.txt"
          git format-patch -1 --stdout > "$A/qualified-product.patch"

          stage final-lease-revalidation-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-predecessor-controller \
            "$(git rev-parse refs/remotes/origin/$PREDBRANCH)" "$PREDHEAD"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin \
            "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$AHEAD"
          require_eq published-parent "$(git rev-parse "$AHEAD^")" "$CPARENT"
          require_eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          require_eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ALIB"
          require_eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ATEST"
          printf 'QUALIFICATION_SUCCESS\nold=%s\nnew=%s\nparent=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$PHEAD" "$AHEAD" "$CPARENT" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-dotted-phone-inherited-wrapper-v1
          path: /tmp/pr2231-dotted-wrapper-artifact
          if-no-files-found: error
          retention-days: 90
