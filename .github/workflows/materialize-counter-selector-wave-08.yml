name: Materialize Counter-Selector Wave 08 blind review

on:
  push:
    branches:
      - 'agent/counter-selector-wave-08-blind-review'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-08.yml'
      - '.github/materializers/counter-selector-wave-08/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-08-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-08-blind-review

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 08 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-08/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-08.tar.gz
          echo '2e79e5456fb646fdfa42c51d21351e0bb54485f7415007752bb51e4f8bd0543e  /tmp/counter-selector-wave-08.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-08.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-08
          rm .github/workflows/materialize-counter-selector-wave-08.yml

      - name: Build, validate, and attack Batch 02 blind review
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-08.mjs
          node tools/validate-counter-selector-wave-08.mjs
          node test/counter-selector-wave-08.test.js

      - name: Commit exact permanent Wave 08 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-08/payload-00 \
            .github/materializers/counter-selector-wave-08/payload-01 \
            .github/materializers/counter-selector-wave-08/payload-02 \
            .github/materializers/counter-selector-wave-08/payload-03 \
            .github/materializers/counter-selector-wave-08/payload-04 \
            .github/materializers/counter-selector-wave-08/payload-05 \
            .github/materializers/counter-selector-wave-08/payload-06 \
            .github/workflows/counter-selector-wave-08.yml \
            .github/workflows/materialize-counter-selector-wave-08.yml \
            data/project/counter-selector-blind-review-b02-registry.json \
            data/project/counter-selector-review-disagreement-b02-ledger.json \
            data/project/counter-selector-wave-08-blind-review.json \
            data/project/counter-selector-wave-08-release-manifest.json \
            docs/methods/counter-selector-blind-review-b02.md \
            docs/milestones/counter-selector-wave-08.md \
            reports/core-thesis/counter-selector-wave-08/data.json \
            reports/core-thesis/counter-selector-wave-08/index.html \
            schemas/counter-selector-blind-review-b02.schema.json \
            test/counter-selector-wave-08.test.js \
            tools/build-counter-selector-wave-08.mjs \
            tools/validate-counter-selector-wave-08.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Execute Counter-Selector Wave 08 Batch 02 blind review'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 08 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-08.mjs
          node tools/validate-counter-selector-wave-08.mjs
          node test/counter-selector-wave-08.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent Wave 08 head
        run: git push origin HEAD:agent/counter-selector-wave-08-blind-review
