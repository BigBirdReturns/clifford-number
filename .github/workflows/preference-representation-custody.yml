name: Preference custody participant representation control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/real-cases/twineo-originalvoices-representation-custody.json'
      - 'tools/lib/preference-representation-custody.mjs'
      - 'tools/compile-preference-representation-custody.mjs'
      - 'tools/validate-preference-representation-custody.mjs'
      - 'test/preference-representation-custody.test.js'
      - 'docs/preference-custody-twineo-originalvoices-representation-custody.md'
      - '.github/workflows/preference-representation-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile participant representation-custody control
        run: node tools/compile-preference-representation-custody.mjs
      - name: Validate individual, platform, and public-authority boundaries
        run: node tools/validate-preference-representation-custody.mjs
      - name: Exercise rights, ownership, authority, and tamper fixtures
        run: node test/preference-representation-custody.test.js
      - name: Preserve deterministic representation-custody projections
        uses: actions/upload-artifact@v4
        with:
          name: twineo-originalvoices-representation-custody
          path: |
            build/research/preference-real-cases/twineo-originalvoices-representation-custody.json
            build/research/preference-real-cases/twineo-originalvoices-representation-custody.md
          if-no-files-found: error
