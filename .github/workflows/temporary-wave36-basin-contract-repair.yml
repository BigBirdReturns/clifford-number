name: Temporary Wave 36 basin-contract repair

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-basin-contract-repair.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave36-basin-contract-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave36-basin-contract-repair.yml'
          encoded_ref='agent%2Flake-allocator-war-public-acquisition-wave-36'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 36 basin repair workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronize the constitutional basin contract and prove idempotence
        shell: bash
        env:
          BRANCH: agent/lake-allocator-war-public-acquisition-wave-36
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          node - <<'NODE'
          const fs = require('fs');
          const policyPath = 'data/project/lake-allocator-war-wave-21-policy.json';
          const registryPath = 'data/project/lake-basin-registry.json';
          const policy = JSON.parse(fs.readFileSync(policyPath,'utf8'));
          const registry = JSON.parse(fs.readFileSync(registryPath,'utf8'));
          const ids = ['allocator-war-source','allocator-war-lake-actions','allocator-war-reports'];
          for (const id of ids) {
            const contract = policy.basin_contract.find(row => row.basin_id === id);
            const canonical = registry.basins.find(row => row.basin_id === id);
            if (!contract || !canonical) throw new Error(`${id}: basin missing from policy or registry`);
            contract.path_prefixes = [...canonical.path_prefixes];
            contract.authoritative_entrypoints = [...canonical.authoritative_entrypoints];
          }
          fs.writeFileSync(policyPath, `${JSON.stringify(policy,null,2)}\n`);
          NODE

          test "$(git diff --name-only "$before")" = 'data/project/lake-allocator-war-wave-21-policy.json'
          git diff --check

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fixture="$tmp/fixture"
          mkdir -p "$fixture"
          tar --exclude=.git -cf - . | tar -xf - -C "$fixture"
          (
            cd "$fixture"
            before_registry="$(sha256sum data/project/lake-basin-registry.json | awk '{print $1}')"
            node tools/install-lake-allocator-war-wave-21.mjs
            after_first="$(sha256sum data/project/lake-basin-registry.json | awk '{print $1}')"
            node tools/install-lake-allocator-war-wave-21.mjs
            after_second="$(sha256sum data/project/lake-basin-registry.json | awk '{print $1}')"
            test "$before_registry" = "$after_first"
            test "$after_first" = "$after_second"

            LAW36_FIXTURE_MODE=1 LAW36_OBSERVED_AT=2026-08-02T16:30:00Z node tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
            node test/lake-allocator-war-public-acquisition-wave-36.test.js | tee "$tmp/mutations.log"
            grep -F 'adversarial mutations passed: 167' "$tmp/mutations.log"

            node - <<'NODE'
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('data/project/lake-basin-registry.json','utf8'));
            const policy = JSON.parse(fs.readFileSync('data/project/lake-allocator-war-public-acquisition-wave-36-policy.json','utf8'));
            const plan = JSON.parse(fs.readFileSync('data/project/lake-allocator-war-public-acquisition-wave-36-plan.json','utf8'));
            const routes = ['internal-authority-and-inventory','public-award-and-contract-denominators','published-enforcement-and-action-registers','correction-dockets-and-outcomes','protected-personnel-records','affected-comparator-and-distributional-joins','financial-recovery-and-continuity'];
            const sourcePaths = [
              'data/project/lake-allocator-war-public-acquisition-wave-36-policy.json',
              'data/project/lake-allocator-war-public-acquisition-wave-36-plan.json',
              policy.paths.capture_ledger,
              policy.paths.record_ledger,
              ...routes.map(route => `${policy.paths.result_root}/${route}.jsonl`),
              ...plan.source_specs.map(row => row.storage_path),
              policy.paths.method,
              policy.paths.milestone
            ];
            function basinFor(path) {
              const matches = [];
              for (const basin of registry.basins) for (const prefix of basin.path_prefixes ?? []) {
                if (path === prefix || (prefix.endsWith('/') && path.startsWith(prefix)) || (!prefix.endsWith('/') && path.startsWith(`${prefix}/`))) matches.push({id:basin.basin_id,length:prefix.length});
              }
              matches.sort((a,b)=>b.length-a.length || a.id.localeCompare(b.id));
              return matches[0]?.id ?? 'unclassified-current-tree';
            }
            for (const path of sourcePaths) if (basinFor(path) !== 'allocator-war-source') throw new Error(`${path}: expected allocator-war-source, got ${basinFor(path)}`);
            if (basinFor(policy.paths.projection) !== 'allocator-war-lake-actions') throw new Error('Wave 36 projection basin mismatch');
            if (basinFor(policy.paths.report) !== 'allocator-war-reports') throw new Error('Wave 36 report basin mismatch');
            console.log(`Wave 36 basin contract synchronized: ${sourcePaths.length} source paths plus projection and report`);
            NODE
          )

          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add data/project/lake-allocator-war-wave-21-policy.json
          git commit -m 'Synchronize Wave 36 basin contract custody'

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$before"
          git push origin "HEAD:$BRANCH"
