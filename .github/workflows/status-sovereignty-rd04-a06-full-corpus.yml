name: SSC RD-04 A06 full CalFresh Decision Registry corpus

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd04-a06-full-corpus.yml'
      - 'data/intake/status-sovereignty-rd04-calfresh-decision-corpus-a06/**'
      - 'data/project/status-sovereignty-rd04-calfresh-decision-corpus-a06-release-manifest.json'
      - 'docs/milestones/ssc-rd04-a06-full-corpus.md'
      - 'schemas/status-sovereignty-rd04-a06-full-corpus.schema.json'
      - 'tools/ssc-rd04-a06-full-corpus.mjs'
      - 'test/status-sovereignty-rd04-a06-full-corpus.test.js'
      - 'build/core-thesis/status-sovereignty/rd04-calfresh-decision-corpus-a06/**'
      - 'reports/core-thesis/status-sovereignty/rd04-calfresh-decision-corpus-a06/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd04-a06-full-corpus.yml'
      - 'data/intake/status-sovereignty-rd04-calfresh-decision-corpus-a06/**'
      - 'data/project/status-sovereignty-rd04-calfresh-decision-corpus-a06-release-manifest.json'
      - 'docs/milestones/ssc-rd04-a06-full-corpus.md'
      - 'schemas/status-sovereignty-rd04-a06-full-corpus.schema.json'
      - 'tools/ssc-rd04-a06-full-corpus.mjs'
      - 'test/status-sovereignty-rd04-a06-full-corpus.test.js'
      - 'build/core-thesis/status-sovereignty/rd04-calfresh-decision-corpus-a06/**'
      - 'reports/core-thesis/status-sovereignty/rd04-calfresh-decision-corpus-a06/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate complete registry and document custody
        run: |
          node tools/validate-no-magic-human-gate.mjs
          node tools/ssc-rd04-a06-full-corpus.mjs validate .
          node test/status-sovereignty-rd04-a06-full-corpus.test.js
      - name: Refuse deterministic drift
        run: git diff --exit-code
