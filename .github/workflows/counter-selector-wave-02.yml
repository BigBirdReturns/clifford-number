name: Counter-Selector Wave 02 artifact readiness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-02.yml'
      - '.github/workflows/materialize-counter-selector-wave-02.yml'
      - 'data/project/counter-selector-wave-02-artifact-readiness.json'
      - 'data/project/counter-selector-artifact-readiness-registry.json'
      - 'data/project/counter-selector-artifact-acquisition-queue.json'
      - 'data/project/counter-selector-wave-02-release-manifest.json'
      - 'data/project/counter-selector-candidate-registry.json'
      - 'data/project/counter-selector-candidates/**'
      - 'data/project/counter-selector-release-manifest.json'
      - 'schemas/counter-selector-artifact-readiness.schema.json'
      - 'docs/methods/counter-selector-artifact-readiness.md'
      - 'docs/milestones/counter-selector-wave-02.md'
      - 'tools/build-counter-selector-wave-02.mjs'
      - 'tools/validate-counter-selector-wave-02.mjs'
      - 'test/counter-selector-wave-02.test.js'
      - 'reports/core-thesis/counter-selector-wave-02/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-02.yml'
      - '.github/workflows/materialize-counter-selector-wave-02.yml'
      - 'data/project/counter-selector-wave-02-artifact-readiness.json'
      - 'data/project/counter-selector-artifact-readiness-registry.json'
      - 'data/project/counter-selector-artifact-acquisition-queue.json'
      - 'data/project/counter-selector-wave-02-release-manifest.json'
      - 'data/project/counter-selector-candidate-registry.json'
      - 'data/project/counter-selector-candidates/**'
      - 'data/project/counter-selector-release-manifest.json'
      - 'schemas/counter-selector-artifact-readiness.schema.json'
      - 'docs/methods/counter-selector-artifact-readiness.md'
      - 'docs/milestones/counter-selector-wave-02.md'
      - 'tools/build-counter-selector-wave-02.mjs'
      - 'tools/validate-counter-selector-wave-02.mjs'
      - 'test/counter-selector-wave-02.test.js'
      - 'reports/core-thesis/counter-selector-wave-02/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 02 products
        run: node tools/build-counter-selector-wave-02.mjs
      - name: Validate artifact-readiness contract
        run: node tools/validate-counter-selector-wave-02.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-02.test.js
      - name: Require exact committed Wave 02 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-artifact-readiness-registry.json \
            data/project/counter-selector-artifact-acquisition-queue.json \
            data/project/counter-selector-wave-02-release-manifest.json \
            reports/core-thesis/counter-selector-wave-02/data.json \
            reports/core-thesis/counter-selector-wave-02/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 02 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-02.mjs
          node tools/validate-counter-selector-wave-02.mjs
          node test/counter-selector-wave-02.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
