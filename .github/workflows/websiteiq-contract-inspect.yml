name: WebsiteIQ contract inspection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/websiteiq-contract-inspect.yml'
      - 'tools/inspect-websiteiq-contract.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch WebsiteIQ public contract surface
        run: node tools/inspect-websiteiq-contract.mjs
      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: websiteiq-contract-inspection
          path: websiteiq-contract/
          retention-days: 14
