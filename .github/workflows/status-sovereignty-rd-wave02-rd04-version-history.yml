name: SSC RD-04 Wave 02 terminal version history

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd04-version-history.yml'
      - 'data/intake/status-sovereignty-rd-wave02-rd04-version-history/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-04-C01.json'
      - 'data/project/ssc-residual-wave02/closures/RD-04-C01.json'
      - 'data/research/status-sovereignty-rd-wave02-rd04-version-history/**'
      - 'data/research/status-sovereignty-residual-denominator-wave-01.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-progress.json'
      - 'schemas/status-sovereignty-rd-wave02-rd04-version-history.schema.json'
      - 'schemas/status-sovereignty-residual-denominator-wave-02-progress.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd04-version-history.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd04-version-history.mjs'
      - 'test/status-sovereignty-rd-wave02-rd04-version-history.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd04-version-history.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd04-version-history.yml'
      - 'data/intake/status-sovereignty-rd-wave02-rd04-version-history/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-04-C01.json'
      - 'data/project/ssc-residual-wave02/closures/RD-04-C01.json'
      - 'data/research/status-sovereignty-rd-wave02-rd04-version-history/**'
      - 'data/research/status-sovereignty-residual-denominator-wave-01.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-progress.json'
      - 'schemas/status-sovereignty-rd-wave02-rd04-version-history.schema.json'
      - 'schemas/status-sovereignty-residual-denominator-wave-02-progress.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd04-version-history.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd04-version-history.mjs'
      - 'test/status-sovereignty-rd-wave02-rd04-version-history.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd04-version-history.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd04-wave02-version-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild exact terminal products and refuse drift
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave02-rd04-version-history.mjs
          git diff --exit-code
      - name: Validate closure, provenance, atlas, and adversarial refusals
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node tools/validate-status-sovereignty-residual-denominator-wave-01.mjs
          node tools/validate-status-sovereignty-residual-denominator-wave-02-constitution.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd04-version-history.mjs
          node test/status-sovereignty-rd-wave02-rd04-version-history.test.js
          git diff --check
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Preserve read-only terminal product
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave02-rd04-version-history
          path: |
            data/intake/status-sovereignty-rd-wave02-rd04-version-history/provenance-index.json
            data/project/ssc-residual-wave02/closures/RD-04-C01.json
            data/research/status-sovereignty-rd-wave02-rd04-version-history
            data/research/status-sovereignty-residual-denominator-wave-02-progress.json
            schemas/status-sovereignty-rd-wave02-rd04-version-history.schema.json
            schemas/status-sovereignty-residual-denominator-wave-02-progress.schema.json
            docs/milestones/ssc-rd-wave02-rd04-version-history.md
          if-no-files-found: error
          retention-days: 90
