name: Preference custody collective-distribution control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/collective-distribution.fixture.json'
      - 'tools/lib/preference-collective-distribution.mjs'
      - 'tools/compile-preference-collective-distribution.mjs'
      - 'tools/validate-preference-collective-distribution.mjs'
      - 'test/preference-collective-distribution.test.js'
      - 'docs/preference-custody-collective-distribution.md'
      - '.github/workflows/preference-collective-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collective-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile collective representation and distribution-governance worlds
        run: node tools/compile-preference-collective-distribution.mjs
      - name: Validate population, notice, release, allocation, payment, residual, and authority boundaries
        run: node tools/validate-preference-collective-distribution.mjs
      - name: Exercise conflict, notice, claims, formula, cy-pres, fee, release, authority, and tamper fixtures
        run: node test/preference-collective-distribution.test.js
      - name: Preserve deterministic collective-distribution projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-collective-distribution-pc18
          path: |
            build/research/preference-collective-distribution.json
            build/research/preference-collective-distribution.md
          if-no-files-found: error
