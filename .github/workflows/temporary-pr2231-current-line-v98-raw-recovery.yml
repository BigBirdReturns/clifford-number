name: Temporary PR 2231 current-line V98 raw recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-current-line-v98-raw-recovery.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr2231-current-line-v98-raw-recovery
  cancel-in-progress: false

jobs:
  qualify-v98-read-only:
    if: github.event.pull_request.number == 2391
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PRODUCT: bea76f0dd155122c3a45fe82c7c1abbaf676349b
      EXPECTED_LIBRARY_BLOB: 6655e9aa10ac2964e5f6289a4881f1343265fa0e
      EXPECTED_FOCUSED_TEST_BLOB: 7f72ca8c2eb7f436471453c74b98e1227b0970d5
      EXPECTED_MUTATOR_SHA256: 93f6d92810a13581150b2b5918680303f7bae1b79a946c69fe68eb2e34cddb99
      EXPECTED_CANDIDATE_LIBRARY_BLOB: 7cd97b5c0a235516336886cab04988f952c77a21
      EXPECTED_CANDIDATE_FOCUSED_TEST_BLOB: 3a19844263765e63b9b81344c20e858d1efcce6f
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      ARTIFACT_DIR: /tmp/pr2231-v98-raw-recovery-artifact

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recover raw DEFLATE source, apply, and qualify
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/qualified/test" "$ARTIFACT_DIR/qualified/tools/lib"
          : > "$ARTIFACT_DIR/trace.txt"
          printf '%s\n' STARTED > "$ARTIFACT_DIR/result.txt"

          note() {
            printf '%s\n' "$*" | tee -a "$ARTIFACT_DIR/trace.txt"
            printf '::notice title=V98 raw recovery::%s\n' "$*"
          }
          fail() {
            note "FAIL:$*"
            printf '%s\n' "FAIL:$*" > "$ARTIFACT_DIR/result.txt"
            exit 1
          }

          note BIND_STARTED
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}" || fail GIT_FETCH
          actual_main="$(git rev-parse refs/remotes/origin/main)" || fail RESOLVE_MAIN
          actual_product="$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" || fail RESOLVE_PRODUCT
          actual_parent="$(git rev-parse "${EXPECTED_PRODUCT}^")" || fail RESOLVE_PRODUCT_PARENT
          predecessor_library="$(git rev-parse "${EXPECTED_PRODUCT}:tools/lib/industrial-exhaust.mjs")" || fail RESOLVE_LIBRARY
          predecessor_test="$(git rev-parse "${EXPECTED_PRODUCT}:test/industrial-exhaust.test.js")" || fail RESOLVE_TEST
          note "ACTUAL_MAIN=$actual_main"
          note "ACTUAL_PRODUCT=$actual_product"
          note "ACTUAL_PRODUCT_PARENT=$actual_parent"
          note "PREDECESSOR_LIBRARY_BLOB=$predecessor_library"
          note "PREDECESSOR_FOCUSED_TEST_BLOB=$predecessor_test"
          [[ "$actual_main" == "$EXPECTED_MAIN" ]] || fail MAIN_LEASE
          [[ "$actual_product" == "$EXPECTED_PRODUCT" ]] || fail PRODUCT_LEASE
          [[ "$actual_parent" == "$EXPECTED_MAIN" ]] || fail PRODUCT_PARENT
          [[ "$predecessor_library" == "$EXPECTED_LIBRARY_BLOB" ]] || fail PREDECESSOR_LIBRARY
          [[ "$predecessor_test" == "$EXPECTED_FOCUSED_TEST_BLOB" ]] || fail PREDECESSOR_TEST
          printf '%s\n' "$actual_main" > "$ARTIFACT_DIR/main.sha"
          printf '%s\n' "$actual_product" > "$ARTIFACT_DIR/product-predecessor.sha"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > "$ARTIFACT_DIR/controller.sha"
          rm -rf /tmp/pr2231-v98-product
          git worktree add --detach /tmp/pr2231-v98-product "$EXPECTED_PRODUCT" || fail ADD_WORKTREE
          cd /tmp/pr2231-v98-product || fail ENTER_WORKTREE
          note BIND_SUCCESS

          note PREDECESSOR_REPRODUCTION_STARTED
          node --input-type=module > "$ARTIFACT_DIR/predecessor-reproduction.txt" 2>&1 <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';
          const witnesses = [
            ['Archive 03-6216-8041-3.14', 'Archive 03-6216-8041-3.14'],
            ['Phone: 09012345678 03.6216.8041', 'Phone: [contact omitted] 03.6216.8041'],
            ['Archive +81 3 6216 8041–3.14', 'Archive [contact omitted]']
          ];
          for (const [input, expected] of witnesses) {
            const actual = redactContactData(input);
            console.log(JSON.stringify({ input, actual }));
            assert.equal(actual, expected);
          }
          console.log('V98_PREDECESSOR_REPRODUCTION_SUCCESS');
          NODE
          predecessor_status=$?
          cat "$ARTIFACT_DIR/predecessor-reproduction.txt"
          [[ "$predecessor_status" -eq 0 ]] || fail PREDECESSOR_REPRODUCTION
          note PREDECESSOR_REPRODUCTION_SUCCESS

          note RAW_SOURCE_RECOVERY_STARTED
          python - \
            "$GITHUB_WORKSPACE/.github/tmp/pr2231-current-line-v97.py.gz.b64" \
            /tmp/pr2231-v98.py \
            "$ARTIFACT_DIR/source-recovery.json" \
            > "$ARTIFACT_DIR/source-recovery.log" 2>&1 <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          from pathlib import Path
          import struct
          import sys
          import zlib

          source_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          receipt_path = Path(sys.argv[3])

          text = ''.join(source_path.read_text(encoding='ascii').split())
          if len(text) % 4 == 1:
              raise ValueError('irrecoverable base64 length')
          raw = base64.b64decode(text + ('=' * ((-len(text)) % 4)), validate=True)
          if len(raw) < 18:
              raise ValueError('gzip member too short')
          if raw[0:2] != b'\x1f\x8b':
              raise ValueError('bad gzip magic')
          if raw[2] != 8:
              raise ValueError('unsupported gzip compression method')

          flags = raw[3]
          if flags & 0xE0:
              raise ValueError('reserved gzip flags set')
          cursor = 10
          trailer_offset = len(raw) - 8

          def require(count, label):
              if cursor + count > trailer_offset:
                  raise ValueError(f'truncated gzip {label}')

          if flags & 0x04:
              require(2, 'extra length')
              extra_length = int.from_bytes(raw[cursor:cursor + 2], 'little')
              cursor += 2
              require(extra_length, 'extra field')
              cursor += extra_length
          if flags & 0x08:
              end = raw.find(b'\x00', cursor, trailer_offset)
              if end < 0:
                  raise ValueError('unterminated gzip filename')
              cursor = end + 1
          if flags & 0x10:
              end = raw.find(b'\x00', cursor, trailer_offset)
              if end < 0:
                  raise ValueError('unterminated gzip comment')
              cursor = end + 1
          if flags & 0x02:
              require(2, 'header crc')
              cursor += 2
          if cursor >= trailer_offset:
              raise ValueError('empty gzip deflate body')

          compressed = raw[cursor:trailer_offset]
          inflater = zlib.decompressobj(-zlib.MAX_WBITS)
          recovered = inflater.decompress(compressed)
          recovered += inflater.flush()
          if not inflater.eof:
              raise ValueError('raw deflate stream did not terminate')
          if inflater.unconsumed_tail:
              raise ValueError('raw deflate stream left unconsumed input')
          if inflater.unused_data:
              raise ValueError('raw deflate body contains trailing bytes')

          trailer_crc32, trailer_isize = struct.unpack('<II', raw[trailer_offset:])
          actual_crc32 = binascii.crc32(recovered) & 0xFFFFFFFF
          actual_isize = len(recovered) & 0xFFFFFFFF
          output_path.write_bytes(recovered)
          receipt = {
              'base64_characters': len(text),
              'compressed_bytes': len(raw),
              'compressed_sha256': hashlib.sha256(raw).hexdigest(),
              'gzip_flags': flags,
              'gzip_header_bytes': cursor,
              'deflate_bytes': len(compressed),
              'deflate_eof': inflater.eof,
              'trailer_crc32': f'{trailer_crc32:08x}',
              'actual_crc32': f'{actual_crc32:08x}',
              'crc32_matches': trailer_crc32 == actual_crc32,
              'trailer_isize': trailer_isize,
              'actual_isize': actual_isize,
              'isize_matches': trailer_isize == actual_isize,
              'recovered_bytes': len(recovered),
              'recovered_sha256': hashlib.sha256(recovered).hexdigest(),
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY
          recovery_status=$?
          cat "$ARTIFACT_DIR/source-recovery.log"
          [[ "$recovery_status" -eq 0 ]] || fail RAW_SOURCE_RECOVERY
          actual_mutator_sha="$(sha256sum /tmp/pr2231-v98.py | awk '{print $1}')" || fail HASH_MUTATOR
          printf '%s\n' "$actual_mutator_sha" > "$ARTIFACT_DIR/mutator.sha256"
          note "RECOVERED_MUTATOR_SHA256=$actual_mutator_sha"
          [[ "$actual_mutator_sha" == "$EXPECTED_MUTATOR_SHA256" ]] || fail RECOVERED_MUTATOR_SHA256
          python -W error -m py_compile /tmp/pr2231-v98.py > "$ARTIFACT_DIR/python-compile.log" 2>&1 || {
            cat "$ARTIFACT_DIR/python-compile.log"
            fail PYTHON_COMPILE
          }
          cp /tmp/pr2231-v98.py "$ARTIFACT_DIR/recovered-mutator.py"
          note RAW_SOURCE_RECOVERY_SUCCESS

          note MUTATOR_STARTED
          python /tmp/pr2231-v98.py > "$ARTIFACT_DIR/mutator.log" 2>&1
          mutator_status=$?
          cat "$ARTIFACT_DIR/mutator.log"
          [[ "$mutator_status" -eq 0 ]] || fail MUTATOR_EXECUTION
          git diff --check > "$ARTIFACT_DIR/diff-check.log" 2>&1 || {
            cat "$ARTIFACT_DIR/diff-check.log"
            fail DIFF_CHECK
          }
          git diff --name-only | sort > "$ARTIFACT_DIR/changed-paths.txt" || fail LIST_CHANGED_PATHS
          mapfile -t changed < "$ARTIFACT_DIR/changed-paths.txt"
          note "CHANGED_PATH_COUNT=${#changed[@]}"
          for path in "${changed[@]}"; do note "CHANGED_PATH=$path"; done
          [[ "${#changed[@]}" -eq 2 ]] || fail CHANGED_PATH_COUNT
          [[ "${changed[0]}" == 'test/industrial-exhaust.test.js' ]] || fail FIRST_CHANGED_PATH
          [[ "${changed[1]}" == 'tools/lib/industrial-exhaust.mjs' ]] || fail SECOND_CHANGED_PATH
          node --check tools/lib/industrial-exhaust.mjs > "$ARTIFACT_DIR/node-check.log" 2>&1 || {
            cat "$ARTIFACT_DIR/node-check.log"
            fail NODE_CHECK
          }
          candidate_library="$(git hash-object tools/lib/industrial-exhaust.mjs)" || fail HASH_CANDIDATE_LIBRARY
          candidate_test="$(git hash-object test/industrial-exhaust.test.js)" || fail HASH_CANDIDATE_TEST
          printf '%s\n' "$candidate_library" > "$ARTIFACT_DIR/candidate-library.blob"
          printf '%s\n' "$candidate_test" > "$ARTIFACT_DIR/candidate-focused-test.blob"
          note "CANDIDATE_LIBRARY_BLOB=$candidate_library"
          note "CANDIDATE_FOCUSED_TEST_BLOB=$candidate_test"
          [[ "$candidate_library" == "$EXPECTED_CANDIDATE_LIBRARY_BLOB" ]] || fail CANDIDATE_LIBRARY_BLOB
          [[ "$candidate_test" == "$EXPECTED_CANDIDATE_FOCUSED_TEST_BLOB" ]] || fail CANDIDATE_FOCUSED_TEST_BLOB

          node --input-type=module > "$ARTIFACT_DIR/candidate-witnesses.txt" 2>&1 <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';
          const witnesses = [
            ['Archive 03-6216-8041-3.14', 'Archive [contact omitted]-3.14'],
            ['Phone: 09012345678 03.6216.8041', 'Phone: [contact omitted] [contact omitted]'],
            ['Archive +81 3 6216 8041–3.14', 'Archive [contact omitted]–3.14']
          ];
          for (const [input, expected] of witnesses) {
            const actual = redactContactData(input);
            console.log(JSON.stringify({ input, actual }));
            assert.equal(actual, expected);
          }
          console.log('V98_CANDIDATE_WITNESSES_SUCCESS');
          NODE
          witness_status=$?
          cat "$ARTIFACT_DIR/candidate-witnesses.txt"
          [[ "$witness_status" -eq 0 ]] || fail CANDIDATE_WITNESSES
          cp tools/lib/industrial-exhaust.mjs /tmp/pr2231-v98-qualified-library.mjs || fail COPY_LIBRARY
          cp test/industrial-exhaust.test.js /tmp/pr2231-v98-qualified-focused-test.js || fail COPY_TEST
          note MUTATOR_SUCCESS

          note TESTS_STARTED
          shopt -s nullglob
          tests=(test/industrial-exhaust*.test.js)
          [[ "${#tests[@]}" -gt 0 ]] || fail NO_FOCUSED_TESTS
          : > "$ARTIFACT_DIR/test-files.txt"
          for test_file in "${tests[@]}"; do
            printf '%s\n' "$test_file" >> "$ARTIFACT_DIR/test-files.txt"
            note "TEST_STARTED=$test_file"
            test_log="$ARTIFACT_DIR/$(basename "$test_file").log"
            node "$test_file" > "$test_log" 2>&1
            test_status=$?
            cat "$test_log"
            [[ "$test_status" -eq 0 ]] || fail "TEST_FAILED=$test_file"
            note "TEST_SUCCESS=$test_file"
          done
          note RELEASE_CHECK_STARTED
          npm run release:check > "$ARTIFACT_DIR/release-check.log" 2>&1
          release_status=$?
          cat "$ARTIFACT_DIR/release-check.log"
          [[ "$release_status" -eq 0 ]] || fail RELEASE_CHECK
          note TESTS_SUCCESS

          note FINAL_BINDING_STARTED
          git restore --source="$EXPECTED_PRODUCT" --staged --worktree -- . || fail RESTORE_PRODUCT
          git clean -fd > "$ARTIFACT_DIR/git-clean.log" 2>&1 || {
            cat "$ARTIFACT_DIR/git-clean.log"
            fail GIT_CLEAN
          }
          cp /tmp/pr2231-v98-qualified-library.mjs tools/lib/industrial-exhaust.mjs || fail RESTORE_LIBRARY
          cp /tmp/pr2231-v98-qualified-focused-test.js test/industrial-exhaust.test.js || fail RESTORE_TEST
          git diff --check > "$ARTIFACT_DIR/final-diff-check.log" 2>&1 || {
            cat "$ARTIFACT_DIR/final-diff-check.log"
            fail FINAL_DIFF_CHECK
          }
          git diff --name-only | sort > "$ARTIFACT_DIR/final-paths.txt" || fail LIST_FINAL_PATHS
          mapfile -t final_paths < "$ARTIFACT_DIR/final-paths.txt"
          [[ "${#final_paths[@]}" -eq 2 ]] || fail FINAL_PATH_COUNT
          [[ "${final_paths[0]}" == 'test/industrial-exhaust.test.js' ]] || fail FINAL_FIRST_PATH
          [[ "${final_paths[1]}" == 'tools/lib/industrial-exhaust.mjs' ]] || fail FINAL_SECOND_PATH
          git diff --name-only "$EXPECTED_MAIN" | sort > "$ARTIFACT_DIR/cumulative-paths.txt" || fail LIST_CUMULATIVE_PATHS
          mapfile -t cumulative_paths < "$ARTIFACT_DIR/cumulative-paths.txt"
          [[ "${#cumulative_paths[@]}" -eq 2 ]] || fail CUMULATIVE_PATH_COUNT
          [[ "${cumulative_paths[0]}" == 'test/industrial-exhaust.test.js' ]] || fail CUMULATIVE_FIRST_PATH
          [[ "${cumulative_paths[1]}" == 'tools/lib/industrial-exhaust.mjs' ]] || fail CUMULATIVE_SECOND_PATH
          final_library="$(git hash-object tools/lib/industrial-exhaust.mjs)" || fail FINAL_LIBRARY_HASH
          final_test="$(git hash-object test/industrial-exhaust.test.js)" || fail FINAL_TEST_HASH
          [[ "$final_library" == "$candidate_library" ]] || fail FINAL_LIBRARY_DIVERGENCE
          [[ "$final_test" == "$candidate_test" ]] || fail FINAL_TEST_DIVERGENCE
          git add test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs || fail STAGE_CANDIDATE
          candidate_tree="$(git write-tree)" || fail WRITE_CANDIDATE_TREE
          printf '%s\n' "$candidate_tree" > "$ARTIFACT_DIR/candidate.tree"
          git diff --cached --binary "$EXPECTED_MAIN" -- > "$ARTIFACT_DIR/product.patch" || fail WRITE_PATCH
          git diff --cached --stat "$EXPECTED_MAIN" -- > "$ARTIFACT_DIR/product.diffstat" || fail WRITE_DIFFSTAT
          cp tools/lib/industrial-exhaust.mjs "$ARTIFACT_DIR/qualified/tools/lib/industrial-exhaust.mjs" || fail RECEIPT_LIBRARY
          cp test/industrial-exhaust.test.js "$ARTIFACT_DIR/qualified/test/industrial-exhaust.test.js" || fail RECEIPT_TEST
          sha256sum \
            tools/lib/industrial-exhaust.mjs \
            test/industrial-exhaust.test.js \
            /tmp/pr2231-v98.py \
            > "$ARTIFACT_DIR/sha256.txt" || fail WRITE_SHA256
          printf '%s\n' QUALIFICATION_SUCCESS > "$ARTIFACT_DIR/result.txt"
          note "V98_LIBRARY_BLOB=$final_library"
          note "V98_FOCUSED_TEST_BLOB=$final_test"
          note "V98_CANDIDATE_TREE=$candidate_tree"
          note QUALIFICATION_SUCCESS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-current-line-v98-raw-recovery
          path: /tmp/pr2231-v98-raw-recovery-artifact
          retention-days: 90
