name: TEMP M-04G ESCWA route-fallback materializer v1

on:
  push:
    branches:
      - agent/m04g-unescwa-archive-probe-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_MAIN: c7d91194620feb00c6bff2469950897ecce9f656
      EXPECTED_MAIN_TREE: 9afb558ddf195e37817ff9cbe2a94b3917bde436
      CANDIDATE_BRANCH: candidate/m04g-escwa-route-fallback-v1
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify transport provenance and capture materializer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main^{tree})" = "$EXPECTED_MAIN_TREE"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          mapfile -t paths < <(git diff --name-only "$EXPECTED_MAIN"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 2
          expected=$'.github/scripts/m04g-escwa-route-fallback-transport.mjs\n.github/workflows/temporary-m04g-unescwa-archive-probe-v1.yml'
          test "$(printf '%s\n' "${paths[@]}")" = "$expected"
          test -z "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH")"
          cp .github/scripts/m04g-escwa-route-fallback-transport.mjs /tmp/m04g-escwa-route-fallback-transport.mjs
          node --check /tmp/m04g-escwa-route-fallback-transport.mjs

      - name: Reset to exact canonical product base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_MAIN_TREE"
          test "$(git hash-object data/project/m04g-global-circulation-polls.json)" = 33ebf45abaff435c6172f3213129645778e13a7a
          test "$(git hash-object tools/lib/m04g-source-ecology-v2.mjs)" = 934db56b046a734dd74db0a974fc49ce12833a87
          test "$(git hash-object test/m05-answerable-power-sprint-03-leg-07.test.js)" = 5767c2e8b1616504b0b3eebe6c721a3adf9eec51

      - name: Apply and qualify deterministic product
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/m04g-escwa-route-fallback-transport.mjs apply
          node --check tools/lib/m04g-source-ecology-v2.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07.test.js
          node test/m05-answerable-power-sprint-03-leg-07.test.js
          npm run release:check

      - name: Restore generated outputs and enforce product boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t drift < <(git diff --name-only "$EXPECTED_MAIN" --)
          for path in "${drift[@]}"; do
            case "$path" in
              data/project/m04g-global-circulation-polls.json|tools/lib/m04g-source-ecology-v2.mjs|test/m05-answerable-power-sprint-03-leg-07.test.js) ;;
              *) git checkout "$EXPECTED_MAIN" -- "$path" ;;
            esac
          done
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN" -- | sort)
          expected=$'data/project/m04g-global-circulation-polls.json\ntest/m05-answerable-power-sprint-03-leg-07.test.js\ntools/lib/m04g-source-ecology-v2.mjs'
          test "${#changed[@]}" -eq 3
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          test -z "$(git diff --name-only --diff-filter=D "$EXPECTED_MAIN" --)"
          git diff --check

      - name: Force both route-specific fallbacks
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/m04g-escwa-route-fallback-transport.mjs forced

      - name: Run and verify live 96-route orbit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qualification/live
          node tools/run-m04g-source-ecology-v2.mjs --output-dir qualification/live
          node /tmp/m04g-escwa-route-fallback-transport.mjs verify-live

      - name: Publish clean one-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$CANDIDATE_BRANCH"
          git add data/project/m04g-global-circulation-polls.json tools/lib/m04g-source-ecology-v2.mjs test/m05-answerable-power-sprint-03-leg-07.test.js
          git commit -m 'Repair ESCWA route-specific official-record fallbacks'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort | wc -l)" -eq 3
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          node /tmp/m04g-escwa-route-fallback-transport.mjs publication

      - name: Upload qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-escwa-route-fallback-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
