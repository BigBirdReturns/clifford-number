name: TEMP M-04G ESCWA hash-pinned v8 repair run

on:
  push:
    branches:
      - agent/m04g-escwa-original-route-recovery-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification/bodies qualification/text qualification/metadata qualification/tmp
          printf '%s\n' '{"status":"initialized","product_files_modified":false}' > qualification/initialization.json

      - name: Install PDF text extractor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils'
          pdftotext -v 2>&1 | head -n 1

      - name: Recover and verify intended v8 controller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import py_compile
          import re
          import struct
          import zlib

          source_path = pathlib.Path('.github/workflows/temporary-m04g-escwa-original-route-recovery-v5.yml')
          source = source_path.read_text()
          match = re.search(r'encoded\s*=\s*"""(.*?)"""', source, re.S)
          if not match:
              raise SystemExit('embedded controller payload not found')
          compressed = base64.b64decode(''.join(match.group(1).split()), validate=True)

          def gzip_deflate_bounds(data):
              if len(data) < 18 or data[:2] != b'\x1f\x8b' or data[2] != 8:
                  raise ValueError('unsupported gzip header')
              flags = data[3]
              pos = 10
              if flags & 4:
                  extra_len = struct.unpack('<H', data[pos:pos + 2])[0]
                  pos += 2 + extra_len
              for flag in (8, 16):
                  if flags & flag:
                      end = data.find(b'\0', pos)
                      if end < 0:
                          raise ValueError('unterminated gzip string field')
                      pos = end + 1
              if flags & 2:
                  pos += 2
              return pos, len(data) - 8

          start, end = gzip_deflate_bounds(compressed)
          raw = zlib.decompress(compressed[start:end], -zlib.MAX_WBITS)
          recovered_sha = hashlib.sha256(raw).hexdigest()
          if recovered_sha != '4479bc57fabd53c35909bf806e6cf1a708a426001007eb366a79d65d32d7e586':
              raise SystemExit(f'unexpected recovered controller sha256: {recovered_sha}')

          text = raw.decode('utf-8')
          repairs = [
              (
                  '    "controllerents": {\n     transport": "curl",',
                  '    "controller": {\n        "transport": "curl",',
                  'controller mapping header',
              ),
              (
                  '        "message": str(error),": {\n     traceback": traceback.format_exc()[-8000:],',
                  '        "message": str(error),\n        "traceback": traceback.format_exc()[-8000:],',
                  'controller error receipt',
              ),
          ]
          applied = []
          for old, new, label in repairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one corrupt fragment, found {count}')
              text = text.replace(old, new, 1)
              applied.append(label)

          repaired = text.encode('utf-8')
          repaired_sha = hashlib.sha256(repaired).hexdigest()
          expected_sha = 'ae2a604167683b943487c8c8584dbb206dda3d6497dbd02f383d8ebe44c6103d'
          if repaired_sha != expected_sha:
              raise SystemExit(f'repaired controller digest mismatch: {repaired_sha}')
          controller = pathlib.Path('qualification/controller.py')
          controller.write_bytes(repaired)
          py_compile.compile(str(controller), doraise=True)
          receipt = {
              'schema': 'm04g-v8-controller-repair@1',
              'source_workflow': str(source_path),
              'source_workflow_sha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
              'compressed_sha256': hashlib.sha256(compressed).hexdigest(),
              'recovered_controller_sha256': recovered_sha,
              'repaired_controller_sha256': repaired_sha,
              'expected_controller_sha256': expected_sha,
              'repairs_applied': applied,
              'syntax_valid': True,
              'product_files_modified': False,
          }
          pathlib.Path('qualification/controller-repair.json').write_text(json.dumps(receipt, indent=2) + '\n')
          pathlib.Path('qualification/controller.sha256').write_text(repaired_sha + '  controller.py\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Run hash-pinned v8 controller
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=15s 10m \
            python3 qualification/controller.py \
            2>&1 | tee qualification/probe.log
          status=${PIPESTATUS[0]}
          set -e
          PROBE_STATUS="$status" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path('qualification')
          ledger = root / 'ledger.json'
          controller = root / 'controller.py'
          receipt = {
              'schema': 'm04g-v8-hash-pinned-run-status@1',
              'exit_status': int(os.environ['PROBE_STATUS']),
              'timed_out': os.environ['PROBE_STATUS'] in ('124', '137'),
              'ledger_exists': ledger.exists(),
              'controller_sha256': hashlib.sha256(controller.read_bytes()).hexdigest(),
              'product_files_modified': False,
          }
          (root / 'run-status.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
          exit 0

      - name: Render recovery summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path('qualification')
          lines = ['# M-04G ESCWA hash-pinned v8 repair run', '']
          status_path = root / 'run-status.json'
          ledger_path = root / 'ledger.json'
          if status_path.exists():
              status = json.loads(status_path.read_text())
              lines.append(f"Controller exit status: `{status.get('exit_status')}`")
              lines.append('')
          if ledger_path.exists():
              ledger = json.loads(ledger_path.read_text())
              lines.append(f"Candidate authorized: `{ledger.get('candidate_authorized')}`")
              lines.append('')
              for route_id, selected in ledger.get('selected', {}).items():
                  if selected:
                      lines.append(f"- `{route_id}` selected `{selected.get('content_sha256')}` from `{selected.get('final_url')}`")
                  else:
                      lines.append(f"- `{route_id}` has no qualifying selection")
              lines.append('')
              for reason in ledger.get('candidate_authorization_reasons', []):
                  lines.append(f'- {reason}')
          else:
              lines.append('No ledger was produced; inspect the controller repair receipt and probe log.')
          summary = '\n'.join(lines) + '\n'
          print(summary)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          PY

      - name: Upload hash-pinned recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-escwa-hash-pinned-v8-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
