name: TEMP materialize RD-04 five-state source-field adjudication v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: rd04-five-state-source-field-adjudication-materializer-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ssc-rd04-five-state-source-field-adjudication-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact one-commit one-path carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = 'd26cb838df12a877840ebe71eb9388d44b6ceaf9'
          test "$(git rev-list --count HEAD^..HEAD)" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/temp-ssc-rd04-five-state-source-field-adjudication-materializer-v1.yml'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.ref }}' = main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'

      - name: Recover and execute immutable materializer
        id: materializer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_BLOB: '10e4d9a6d4f6a0fac4aca996187fc983ca1af8ab'
          RUNNER_XZ_BYTES: '3896'
          RUNNER_XZ_SHA256: '697ddfbced23548025528fcc7a637a966964561c2eeba33696a71048244dce03'
          RUNNER_SOURCE_BYTES: '12087'
          RUNNER_SOURCE_SHA256: '33c9d6619e13c4e2d04a2d232b139407cffee5db58a0f2e046400088cbd44a09'
        run: |
          set -Eeuo pipefail
          OUT=/tmp/rd04-five-state-materializer-runner
          rm -rf "$OUT"
          mkdir -p "$OUT"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$RUNNER_BLOB" > "$OUT/blob.json"
          test "$(jq -r .encoding "$OUT/blob.json")" = base64
          jq -r .content "$OUT/blob.json" | tr -d '\n' | base64 -d > "$OUT/materializer.sh.xz"
          test "$(wc -c < "$OUT/materializer.sh.xz" | tr -d ' ')" = "$RUNNER_XZ_BYTES"
          test "$(sha256sum "$OUT/materializer.sh.xz" | awk '{print $1}')" = "$RUNNER_XZ_SHA256"
          test "$(git hash-object "$OUT/materializer.sh.xz")" = "$RUNNER_BLOB"
          xz -dc "$OUT/materializer.sh.xz" > "$OUT/materializer.sh"
          test "$(wc -c < "$OUT/materializer.sh" | tr -d ' ')" = "$RUNNER_SOURCE_BYTES"
          test "$(sha256sum "$OUT/materializer.sh" | awk '{print $1}')" = "$RUNNER_SOURCE_SHA256"
          bash -n "$OUT/materializer.sh"
          chmod 0755 "$OUT/materializer.sh"
          bash "$OUT/materializer.sh"

      - name: Preserve materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-five-state-source-field-adjudication-materialization-v1
          path: |
            /tmp/rd04-five-state-materializer-runner
            /tmp/rd04-five-state-source-field-materializer
          if-no-files-found: warn
          retention-days: 90

      - name: Require successful materialization
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.materializer.outcome }}
        run: test "$OUTCOME" = success
