name: Temporary PR 2231 callback observation frontier V110
# Read-only qualification for exact-head comments 3890125090 and 3890125092.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-callback-observation-frontier-v110.yml'
      - '.github/tmp/pr2231-callback-observation-frontier-v110.sh.gz.b64'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-callback-observation-frontier-v110
  cancel-in-progress: false

jobs:
  qualify-callback-observation-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: edbf7027f5de312d77a91d615ecb8cad619ce154
      EXPECTED_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_TREE: efc92aba2de7088ad1e4a9b0514ccb9e8f498c47
      EXPECTED_LIBRARY: cb6bcf21460d4d0cca0dcb29affb9424713399d0
      EXPECTED_TEST: 96822fbd5ac213d03e2bdc91c92c7ddfc3931963
      REVIEW_PREDECESSOR: edbf7027f5de312d77a91d615ecb8cad619ce154
      REVIEW_IDS: '3890125090 3890125092'
      ARTIFACT_DIR: /tmp/pr2231-callback-observation-v110
      PRODUCT_WT: /tmp/pr2231-callback-observation-product-v110
      MAIN_WT: /tmp/pr2231-callback-observation-main-v110
      QUALIFIED_DIR: /tmp/pr2231-callback-observation-qualified-v110

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode and execute read-only qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d .github/tmp/pr2231-callback-observation-frontier-v110.sh.gz.b64 \
            | gzip -d > /tmp/pr2231-callback-observation-frontier-v110.sh
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('/tmp/pr2231-callback-observation-frontier-v110.sh')
          source = path.read_text()

          predecessor_needle = 'Archive 62-16-03-6216-8041'
          predecessor_replacement = 'Archive 62-16-[contact omitted]'
          first = source.find(predecessor_needle)
          second = source.find(
              predecessor_needle,
              first + len(predecessor_needle)
          ) if first >= 0 else -1
          if first < 0 or second < 0:
              raise SystemExit('unable to locate the auxiliary predecessor expectation')
          source = (
              source[:second]
              + predecessor_replacement
              + source[second + len(predecessor_needle):]
          )

          focused_target = 'tee "$ARTIFACT_DIR/focused-product.log"'
          target_index = source.find(focused_target)
          if target_index < 0:
              raise SystemExit('unable to locate the focused-product tee pipeline')
          line_start = source.rfind('\n', 0, target_index) + 1
          line_end = source.find('\n', target_index)
          if line_end < 0:
              line_end = len(source)
          focused_line = source[line_start:line_end]
          if '| tee' not in focused_line:
              raise SystemExit(f'unexpected focused-product pipeline: {focused_line!r}')
          focused_line = focused_line.replace('| tee', '2>&1 | tee', 1)
          source = source[:line_start] + focused_line + source[line_end:]

          syntax_anchor = 'node --check "$PRODUCT_WT/tools/lib/industrial-exhaust.mjs"'
          syntax_index = source.find(syntax_anchor)
          if syntax_index < 0:
              raise SystemExit('unable to locate product syntax validation')
          syntax_line_start = source.rfind('\n', 0, syntax_index) + 1

          url_guard_injection = dedent(r'''
          python - "$PRODUCT_WT/tools/lib/industrial-exhaust.mjs" <<'PY_URL_GUARD'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          function_start = text.index(
              "function leadingFormattedObservationPhoneTransition("
          )
          function_end = text.index(
              "\nfunction formattedObservationPrecedesIntrinsicPhone(",
              function_start
          )
          function_source = text[function_start:function_end]
          needle = (
              "  const laterPhone = intrinsicPhoneIntervalAfterObservationBoundary(\n"
              "    candidate.slice(observationEnd)\n"
              "  );\n"
              "  if (!laterPhone) return null;\n\n"
              "  return {\n"
          )
          replacement = (
              "  const laterPhone = intrinsicPhoneIntervalAfterObservationBoundary(\n"
              "    candidate.slice(observationEnd)\n"
              "  );\n"
              "  if (!laterPhone) return null;\n\n"
              "  const laterPhoneStart = observationEnd + laterPhone.start;\n"
              "  if (hasUrlTokenPrefixContext(\n"
              "    `${externalPrefix}${candidate.slice(0, laterPhoneStart)}`\n"
              "      .normalize('NFKC')\n"
              "  )) return null;\n\n"
              "  return {\n"
          )
          if function_source.count(needle) != 1:
              raise SystemExit(
                  'unexpected leading-function guard count: '
                  f'{function_source.count(needle)}'
              )
          function_source = function_source.replace(needle, replacement, 1)
          path.write_text(
              text[:function_start]
              + function_source
              + text[function_end:]
          )
          PY_URL_GUARD

          (
            cd "$PRODUCT_WT"
            node --input-type=module <<'NODE_URL_GUARD'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';

          const moduleUrl = pathToFileURL(
            `${process.cwd()}/tools/lib/industrial-exhaust.mjs`
          ).href;
          const { redactContactData } = await import(
            `${moduleUrl}?url-guard=${Date.now()}`
          );

          for (const source of [
            'https://example.test/01/42/68/53/00',
            'example.test/01/42/68/53/00',
            '//example.test/03/6216/5111',
            '192.0.2.1/01/42/68/53/00',
            `example.test/${'long-segment/'.repeat(12)}01/42/68/53/00`
          ]) {
            assert.equal(redactContactData(source), source);
          }
          assert.equal(
            redactContactData('https://example.test/ 01 42 68 53 00'),
            'https://example.test/ [contact omitted]'
          );
          NODE_URL_GUARD
          )

          ''')
          source = (
              source[:syntax_line_start]
              + url_guard_injection
              + source[syntax_line_start:]
          )

          path.write_text(source)
          PY
          chmod +x /tmp/pr2231-callback-observation-frontier-v110.sh
          /tmp/pr2231-callback-observation-frontier-v110.sh

      - name: Emit qualification diagnostics
        if: always()
        shell: bash
        run: |
          upload=/tmp/pr2231-callback-observation-v110-upload
          rm -rf "$upload"
          mkdir -p "$ARTIFACT_DIR" "$upload"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$ARTIFACT_DIR/artifact-manifest.txt"
          cp -a "$ARTIFACT_DIR"/. "$upload"/
          find "$upload" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$upload/upload-manifest.txt"
          {
            printf '%s\n' '### PR 2231 callback observation frontier V110'
            for receipt in summary.json qualification-terminal.txt \
              predecessor-reproduction.jsonl direct-matrix.jsonl \
              focused-product.log product-release-check.log \
              focused-main-transplant.log main-release-check.log \
              candidate-commit.txt candidate-paths.txt \
              review-comments-before.tsv review-thread-ledger-before.jsonl \
              review-comments-after.tsv review-thread-ledger-after.jsonl \
              artifact-manifest.txt; do
              printf '\n#### %s\n\n```text\n' "$receipt"
              [[ ! -f "$ARTIFACT_DIR/$receipt" ]] \
                || tail -n 420 "$ARTIFACT_DIR/$receipt"
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-callback-observation-frontier-v110
          path: /tmp/pr2231-callback-observation-v110-upload
          retention-days: 90
