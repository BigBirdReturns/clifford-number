name: TEMP materialize School.House IRS candidate filing-index custody

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-materializer.yml'
  workflow_dispatch:

concurrency:
  group: schoolhouse-irs-candidate-filing-index-materializer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-irs-candidate-filing-index-census-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact integrated carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct and execute exact filing-index acquisition
        shell: bash
        run: |
          set -Eeuo pipefail
          ACQUIRE='.github/workflows/temp-schoolhouse-irs-candidate-filing-index-census.yml'
          MATERIALIZER='.github/workflows/temp-schoolhouse-irs-candidate-filing-index-materializer.yml'
          OUT="$RUNNER_TEMP/schoolhouse-irs-candidate-filing-index-census"
          RUNNER="$RUNNER_TEMP/schoolhouse-irs-candidate-filing-index-census.py"

          git fetch --no-tags origin main
          BASE="$(git merge-base HEAD origin/main)"
          mapfile -t CHANGED < <(git diff --name-only "$BASE"..HEAD | sort)
          test "${#CHANGED[@]}" -eq 2
          test "${CHANGED[0]}" = "$ACQUIRE"
          test "${CHANGED[1]}" = "$MATERIALIZER"

          declare -A BLOBS=(
            ['data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-eo-bmf.jsonl']='9601a38868a47c8188b960dfd2841725da1e332c'
            ['data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-publication-78.jsonl']='c27ea6549351bda5b47b43358d97b0a501d5b769'
            ['data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-form-990n.jsonl']='ad608c5bb5e9b466909707f09663366e68b8f208'
            ['data/intake/bvvc-defense-capital/schoolhouse-irs-candidates-auto-revocation.jsonl']='0edf90bd039284cc081d4ee6b62b53af885ff54f'
          )
          for path in "${!BLOBS[@]}"; do
            test "$(git rev-parse "origin/main:$path")" = "${BLOBS[$path]}"
          done

          python - "$ACQUIRE" "$RUNNER" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text()
          marker = '          cat > "$RUNNER" <<\'PY\'\n'
          start = source.index(marker) + len(marker)
          end_marker = '\n          PY\n\n          python -m py_compile "$RUNNER"'
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          runner = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          runner = runner.replace(
              "                      assert row['identity_state'] == 'registry_candidate_not_admitted'\n                      assert row['street_address_retained'] is False\n                      assert row['contact_details_retained'] is False\n                      assert row['graph_effect'] == 'none'\n                      assert row['promotes_to'] == 'candidate_only'",
              "                      if 'identity_state' in row: assert row['identity_state'] == 'registry_candidate_not_admitted'\n                      if 'street_address_retained' in row: assert row['street_address_retained'] is False\n                      if 'contact_details_retained' in row: assert row['contact_details_retained'] is False\n                      if 'graph_effect' in row: assert row['graph_effect'] == 'none'\n                      if 'promotes_to' in row: assert row['promotes_to'] == 'candidate_only'",
          )
          runner = runner.replace(
              "                      item['candidate_row_ids'].append(row['candidate_row_id'])",
              "                      item['candidate_row_ids'].append(row.get('candidate_row_id') or row.get('source_row_id') or f'{name}:{len(rows)}')",
          )
          runner = runner.replace(
              "                      if row.get('legal_name_as_recorded'):\n                          item['candidate_legal_names'].add(row['legal_name_as_recorded'])",
              "                      legal_name = row.get('legal_name_as_recorded') or row.get('legal_name') or row.get('organization_name') or row.get('name')\n                      if legal_name:\n                          item['candidate_legal_names'].add(legal_name)",
          )
          runner = runner.replace(
              "                      if row.get('dataset'):\n                          item['candidate_datasets'].add(row['dataset'])",
              "                      dataset = row.get('dataset') or row.get('source_dataset') or name\n                      if dataset:\n                          item['candidate_datasets'].add(dataset)",
          )
          Path(sys.argv[2]).write_text(runner)
          PY

          python -m py_compile "$RUNNER"
          rm -rf "$OUT"
          python "$RUNNER" --repo-root "$GITHUB_WORKSPACE" --output "$OUT" \
            2>&1 | tee "$RUNNER_TEMP/schoolhouse-irs-candidate-filing-index-materializer-acquisition.log"
          printf '0\n' > "$OUT/RUNNER_EXIT_CODE"
          cp "$RUNNER_TEMP/schoolhouse-irs-candidate-filing-index-materializer-acquisition.log" "$OUT/RUNNER-OUTPUT.log"
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          python - "$OUT" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          summary = json.loads((root / 'summary.json').read_text())
          attempts = [json.loads(x) for x in (root / 'index-attempts.jsonl').read_text().splitlines() if x.strip()]
          candidates = [json.loads(x) for x in (root / 'candidate-ein-summary.jsonl').read_text().splitlines() if x.strip()]
          matches = [json.loads(x) for x in (root / 'filing-index-matches.jsonl').read_text().splitlines() if x.strip()]
          assert summary['candidate_rows'] == 641
          assert summary['unique_candidate_eins'] == len(candidates) == 438
          assert summary['official_index_requests'] == len(attempts) == 8
          assert summary['exact_candidate_filing_rows'] == len(matches)
          assert summary['xml_fetches'] == summary['batch_zip_fetches'] == summary['successor_fetches'] == 0
          assert summary['identities_admitted'] == summary['relationships_admitted'] == 0
          assert summary['outside_human_dependency'] is False
          PY

      - name: Upload exact acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-candidate-filing-index-census-materializer
          path: ${{ runner.temp }}/schoolhouse-irs-candidate-filing-index-census
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Build, qualify, and publish workflow-free product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='agent/schoolhouse-irs-candidate-filing-index-custody-product-v1'
          OUT="$RUNNER_TEMP/schoolhouse-irs-candidate-filing-index-census"
          DATA='data/intake/schoolhouse-irs-candidate-filing-index-census'
          RECEIPT="$RUNNER_TEMP/schoolhouse-irs-candidate-filing-index-materialization-receipt"

          git fetch --prune --no-tags origin main
          git checkout -B "$TARGET" origin/main
          PARENT="$(git rev-parse HEAD)"
          PARENT_TREE="$(git rev-parse 'HEAD^{tree}')"

          for _ in $(seq 1 30); do
            ARTIFACT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="schoolhouse-irs-candidate-filing-index-census-materializer")' || true)"
            [[ -n "$ARTIFACT_JSON" ]] && break
            sleep 2
          done
          [[ -n "$ARTIFACT_JSON" ]]
          ARTIFACT_ID="$(python - "$ARTIFACT_JSON" <<'PY'
          import json,sys; print(json.loads(sys.argv[1])['id'])
          PY
          )"
          ARTIFACT_DIGEST="$(python - "$ARTIFACT_JSON" <<'PY'
          import json,sys; print(json.loads(sys.argv[1])['digest'])
          PY
          )"

          rm -rf "$DATA" "$RECEIPT"
          mkdir -p "$DATA" docs/milestones tools "$RECEIPT"
          for name in \
            candidate-denominator.json \
            index-attempts.jsonl \
            filing-index-matches.jsonl \
            candidate-ein-summary.jsonl \
            summary.json \
            route-policy.json \
            adjudication.json \
            artifact-manifest.json; do
            cp "$OUT/$name" "$DATA/$name"
          done
          cp "$OUT/SHA256SUMS" "$DATA/acquisition-SHA256SUMS"

          python - "$DATA" "$PARENT" "$PARENT_TREE" "${{ github.event.pull_request.number || 0 }}" "${{ github.event.pull_request.head.sha || github.sha }}" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          root = Path(sys.argv[1])
          parent, parent_tree, pr, head, run, artifact_id, digest = sys.argv[2:]
          load = lambda n: json.loads((root / n).read_text())
          rows = lambda n: [json.loads(x) for x in (root / n).read_text().splitlines() if x.strip()]
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          summary = load('summary.json')
          attempts = rows('index-attempts.jsonl')
          matches = rows('filing-index-matches.jsonl')
          candidates = rows('candidate-ein-summary.jsonl')
          source_files = [
              'candidate-denominator.json', 'index-attempts.jsonl',
              'filing-index-matches.jsonl', 'candidate-ein-summary.jsonl',
              'summary.json', 'route-policy.json', 'adjudication.json',
              'artifact-manifest.json', 'acquisition-SHA256SUMS',
          ]
          source_rows = [
              {'path': name, 'bytes': (root / name).stat().st_size, 'sha256': sha(root / name)}
              for name in source_files
          ]
          custody = {
              'schema_version': 'schoolhouse-irs-candidate-filing-index-custody@1',
              'state': 'terminal_exact_438_candidate_ein_official_filing_index_custody',
              'canonical_parent_commit': parent,
              'canonical_parent_tree': parent_tree,
              'acquisition_pr': int(pr),
              'acquisition_head': head,
              'acquisition_workflow_run_id': int(run),
              'acquisition_artifact_id': int(artifact_id),
              'acquisition_artifact_digest': digest,
              'candidate_rows': 641,
              'unique_candidate_eins': 438,
              'declared_index_years': list(range(2019, 2027)),
              'official_index_attempts': len(attempts),
              'available_index_years': summary['available_index_years'],
              'unavailable_index_years': summary['unavailable_index_years'],
              'official_index_rows_scanned': summary['official_index_rows_scanned'],
              'filing_index_match_rows': len(matches),
              'candidate_eins_with_filing_rows': summary['unique_candidate_eins_with_filing_rows'],
              'candidate_ein_terminal_rows': len(candidates),
              'xml_fetches': 0, 'batch_zip_fetches': 0, 'successor_fetches': 0,
              'query_submissions': 0, 'forms_submitted': 0, 'cookie_replays': 0,
              'subscription_purchases': 0, 'raw_source_retained': False,
              'full_index_rows_retained': False, 'street_address_rows_retained': 0,
              'contact_detail_rows_retained': 0, 'preparer_rows_retained': 0,
              'private_support_rows': 0, 'identities_admitted': 0,
              'relationships_admitted': 0, 'negative_existence_claims_created': 0,
              'outside_human_dependency': False, 'publication_effect': 'none',
              'adoption_effect': 'none', 'graph_effect': 'none',
              'promotes_to': 'candidate_only',
              'authority_boundary': 'Official filing-index rows are filing-route custody for pre-existing IRS phrase candidates only. They do not identify the public School.House legal entity or establish exemption, fiscal-sponsor, grant, funding, governance, ownership, control, or related-party relationships. Zero rows and unavailable indexes are not absence evidence.',
              'source_files': source_rows,
          }
          (root / 'source-custody.json').write_text(json.dumps(custody, indent=2, sort_keys=True) + '\n')
          PY

          cat > tools/validate-schoolhouse-irs-candidate-filing-index-custody.mjs <<'MJS'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const dataRoot = path.join(repoRoot, 'data/intake/schoolhouse-irs-candidate-filing-index-census');
          const load = (name) => JSON.parse(readFileSync(path.join(dataRoot, name), 'utf8'));
          const rows = (name) => readFileSync(path.join(dataRoot, name), 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const sha = (name) => createHash('sha256').update(readFileSync(path.join(dataRoot, name))).digest('hex');
          const custody = load('source-custody.json');
          const denominator = load('candidate-denominator.json');
          const summary = load('summary.json');
          const policy = load('route-policy.json');
          const adjudication = load('adjudication.json');
          const artifact = load('artifact-manifest.json');
          const attempts = rows('index-attempts.jsonl');
          const matches = rows('filing-index-matches.jsonl');
          const candidates = rows('candidate-ein-summary.jsonl');
          assert.equal(custody.schema_version, 'schoolhouse-irs-candidate-filing-index-custody@1');
          assert.equal(custody.state, 'terminal_exact_438_candidate_ein_official_filing_index_custody');
          assert.match(custody.canonical_parent_commit, /^[0-9a-f]{40}$/);
          assert.match(custody.canonical_parent_tree, /^[0-9a-f]{40}$/);
          assert.match(custody.acquisition_head, /^[0-9a-f]{40}$/);
          assert.match(custody.acquisition_artifact_digest, /^sha256:[0-9a-f]{64}$/);
          assert.equal(custody.candidate_rows, 641);
          assert.equal(custody.unique_candidate_eins, 438);
          assert.deepEqual(custody.declared_index_years, [2019,2020,2021,2022,2023,2024,2025,2026]);
          assert.equal(custody.official_index_attempts, attempts.length);
          assert.equal(attempts.length, 8);
          assert.equal(custody.candidate_ein_terminal_rows, candidates.length);
          assert.equal(candidates.length, 438);
          assert.equal(custody.filing_index_match_rows, matches.length);
          assert.equal(custody.candidate_eins_with_filing_rows, new Set(matches.map((row) => row.ein)).size);
          assert.equal(denominator.candidate_rows, 641);
          assert.equal(denominator.unique_candidate_eins, 438);
          assert.equal(summary.official_index_requests, 8);
          assert.equal(summary.terminal_index_rows, 8);
          assert.equal(summary.exact_candidate_filing_rows, matches.length);
          assert.equal(summary.xml_fetches, 0);
          assert.equal(summary.batch_zip_fetches, 0);
          assert.equal(summary.successor_fetches, 0);
          assert.equal(summary.identities_admitted, 0);
          assert.equal(summary.relationships_admitted, 0);
          assert.equal(summary.negative_existence_claims_created, 0);
          assert.equal(summary.outside_human_dependency, false);
          assert.equal(policy.selection_contract.exact_ein_intersection_only, true);
          assert.equal(policy.selection_contract.no_xml_or_batch_fetch, true);
          assert.equal(policy.interpretation.zero_rows_are_not_identity_or_record_absence_evidence, true);
          assert.equal(adjudication.public_schoolhouse_legal_identity_admitted, false);
          assert.equal(adjudication.fiscal_sponsor_relationship_admitted, false);
          assert.equal(adjudication.related_party_relationship_admitted, false);
          assert.equal(artifact.counts.candidate_rows, 641);
          assert.equal(artifact.counts.unique_candidate_eins, 438);
          assert.equal(artifact.counts.index_attempts, 8);
          assert.equal(artifact.counts.candidate_ein_summaries, 438);
          assert.equal(artifact.counts.filing_index_matches, matches.length);
          assert.deepEqual(attempts.map((row) => row.index_year), [2019,2020,2021,2022,2023,2024,2025,2026]);
          assert.equal(new Set(candidates.map((row) => row.ein)).size, 438);
          for (const row of attempts) {
            assert.equal(row.request_method, 'GET');
            assert.equal(row.raw_index_retained, false);
            assert.equal(row.identity_admitted, false);
            assert.equal(row.relationship_admitted, false);
            assert.equal(row.outside_human_dependency, false);
          }
          const candidateSet = new Set(candidates.map((row) => row.ein));
          for (const row of matches) {
            assert(candidateSet.has(row.ein));
            assert.equal(row.xml_fetched, false);
            assert.equal(row.batch_zip_fetched, false);
            assert.equal(row.successor_fetch_executed, false);
            assert.equal(row.identity_admitted, false);
            assert.equal(row.relationship_admitted, false);
          }
          for (const row of candidates) {
            assert.equal(row.legal_identity_admitted, false);
            assert.equal(row.fiscal_sponsor_relationship_admitted, false);
            assert.equal(row.related_party_relationship_admitted, false);
            assert.equal(row.negative_existence_claim_created, false);
            assert.equal(row.outside_human_dependency, false);
          }
          for (const file of custody.source_files) {
            assert.equal(sha(file.path), file.sha256, file.path);
            assert.equal(readFileSync(path.join(dataRoot, file.path)).length, file.bytes, file.path);
          }
          const forbidden = new Set(['address','street','mailing_address','postal_code','zip_code','email','phone','contact','preparer','raw_row','raw_index','raw_text','full_text','xml']);
          const inspect = (value) => {
            if (Array.isArray(value)) return value.forEach(inspect);
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              assert(!forbidden.has(key.toLowerCase()), key);
              inspect(child);
            }
          };
          for (const name of readdirSync(dataRoot).filter((name) => name.endsWith('.json') || name.endsWith('.jsonl'))) {
            if (name.endsWith('.jsonl')) rows(name).forEach(inspect); else inspect(load(name));
          }
          assert(!readdirSync(dataRoot).some((name) => /\.(csv|zip|xml)$/i.test(name)));
          console.log(JSON.stringify({state:custody.state,candidate_eins:438,index_attempts:8,available_index_years:summary.available_index_years.length,official_index_rows_scanned:summary.official_index_rows_scanned,filing_index_match_rows:matches.length,candidate_eins_with_filing_rows:summary.unique_candidate_eins_with_filing_rows,outside_human_dependency:false,graph_effect:'none'}, null, 2));
          MJS
          sed -i 's/^          //' tools/validate-schoolhouse-irs-candidate-filing-index-custody.mjs
          chmod +x tools/validate-schoolhouse-irs-candidate-filing-index-custody.mjs

          cat > tools/build-schoolhouse-irs-candidate-filing-index-custody.mjs <<'MJS'
          #!/usr/bin/env node
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const repoRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const result = spawnSync(process.execPath, [path.join(repoRoot, 'tools/validate-schoolhouse-irs-candidate-filing-index-custody.mjs')], {cwd:repoRoot,stdio:'inherit'});
          if (result.status !== 0) process.exit(result.status ?? 1);
          console.log(`schoolhouse_irs_candidate_filing_index_builder=${process.argv.includes('--write') ? 'write' : 'check'} source_layer=sealed`);
          MJS
          sed -i 's/^          //' tools/build-schoolhouse-irs-candidate-filing-index-custody.mjs
          chmod +x tools/build-schoolhouse-irs-candidate-filing-index-custody.mjs

          cat > tools/test-schoolhouse-irs-candidate-filing-index-custody.mjs <<'MJS'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { cpSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { fileURLToPath } from 'node:url';
          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const validator = path.join(root, 'tools/validate-schoolhouse-irs-candidate-filing-index-custody.mjs');
          const source = path.join(root, 'data/intake/schoolhouse-irs-candidate-filing-index-census');
          const clean = spawnSync(process.execPath, [validator], {cwd:root,encoding:'utf8'});
          assert.equal(clean.status, 0, clean.stderr || clean.stdout);
          const temp = mkdtempSync(path.join(os.tmpdir(), 'schoolhouse-irs-index-test-'));
          try {
            cpSync(source, temp, {recursive:true});
            const summaryPath = path.join(temp, 'summary.json');
            const summary = JSON.parse(readFileSync(summaryPath, 'utf8'));
            summary.unique_candidate_eins = 437;
            writeFileSync(summaryPath, JSON.stringify(summary, null, 2) + '\n');
            const script = readFileSync(validator, 'utf8').replace("const dataRoot = path.join(repoRoot, 'data/intake/schoolhouse-irs-candidate-filing-index-census');", `const dataRoot = ${JSON.stringify(temp)};`);
            const mutantValidator = path.join(temp, 'validator.mjs');
            writeFileSync(mutantValidator, script);
            const mutated = spawnSync(process.execPath, [mutantValidator], {cwd:root,encoding:'utf8'});
            assert.notEqual(mutated.status, 0, 'mutated denominator must be refused');
          } finally {
            rmSync(temp, {recursive:true,force:true});
          }
          console.log('schoolhouse_irs_candidate_filing_index_adversarial_refusals=1');
          MJS
          sed -i 's/^          //' tools/test-schoolhouse-irs-candidate-filing-index-custody.mjs
          chmod +x tools/test-schoolhouse-irs-candidate-filing-index-custody.mjs

          SUMMARY_JSON="$(cat "$DATA/summary.json")"
          MATCHES="$(python - "$DATA/filing-index-matches.jsonl" <<'PY'
          import sys; print(sum(1 for x in open(sys.argv[1]) if x.strip()))
          PY
          )"
          MATCHED_EINS="$(python - "$DATA/filing-index-matches.jsonl" <<'PY'
          import json,sys; print(len({json.loads(x)['ein'] for x in open(sys.argv[1]) if x.strip()}))
          PY
          )"
          AVAILABLE="$(python - "$DATA/summary.json" <<'PY'
          import json,sys; print(len(json.load(open(sys.argv[1]))['available_index_years']))
          PY
          )"
          ROWS="$(python - "$DATA/summary.json" <<'PY'
          import json,sys; print(json.load(open(sys.argv[1]))['official_index_rows_scanned'])
          PY
          )"

          cat > docs/milestones/schoolhouse-irs-candidate-filing-index-census.md <<EOF
          # School.House IRS candidate filing-index custody

          This workflow-free product freezes the exact official Form 990 filing-index intersection for the permanent 641-row / 438-EIN School.House IRS phrase-candidate denominator.

          \`\`\`text
          canonical parent:                 $PARENT
          acquisition PR:                   #${{ github.event.pull_request.number || 0 }}
          acquisition head:                 ${{ github.event.pull_request.head.sha || github.sha }}
          acquisition/materializer run:      $GITHUB_RUN_ID
          acquisition artifact:              $ARTIFACT_ID
          artifact digest:                   $ARTIFACT_DIGEST
          official index years:              2019–2026
          available index years:             $AVAILABLE / 8
          official index rows screened:      $ROWS
          exact filing-index rows:            $MATCHES
          candidate EINs with filing rows:   $MATCHED_EINS / 438
          \`\`\`

          Filing-index rows are filing-route custody for pre-existing phrase candidates only. They do not identify the public School.House legal entity or establish exemption, fiscal sponsorship, grants, funding, governance, ownership, control, related-party status, or a Clifford hop. Zero rows and unavailable indexes are not absence evidence.

          The product fetches no XML or batch ZIP and retains no raw annual index, nonmatching rows, street address, contact detail, preparer value, private support, identity, relationship, negative-existence claim, outside-human dependency, publication effect, adoption effect, or graph effect.
          EOF
          sed -i 's/^          //' docs/milestones/schoolhouse-irs-candidate-filing-index-census.md

          node --check tools/validate-schoolhouse-irs-candidate-filing-index-custody.mjs
          node --check tools/build-schoolhouse-irs-candidate-filing-index-custody.mjs
          node --check tools/test-schoolhouse-irs-candidate-filing-index-custody.mjs
          node tools/build-schoolhouse-irs-candidate-filing-index-custody.mjs --check
          node tools/test-schoolhouse-irs-candidate-filing-index-custody.mjs
          node tools/validate-no-magic-human-gate.mjs
          git diff --check

          git add "$DATA" \
            tools/validate-schoolhouse-irs-candidate-filing-index-custody.mjs \
            tools/build-schoolhouse-irs-candidate-filing-index-custody.mjs \
            tools/test-schoolhouse-irs-candidate-filing-index-custody.mjs \
            docs/milestones/schoolhouse-irs-candidate-filing-index-census.md
          git commit -m 'Preserve School.House IRS candidate filing-index custody' \
            -m 'Freeze the exact 641-row, 438-EIN candidate denominator across eight official 2019-2026 Form 990 indexes. Retain filing-route custody only, fetch no XML or batch ZIP, preserve zero identity or relationship admissions, no outside-human dependency, and no publication, adoption, or graph effect.'
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-list --count "$PARENT"..HEAD)" = '1'
          mapfile -t PRODUCT_PATHS < <(git diff --name-only "$PARENT"..HEAD | sort)
          test "${#PRODUCT_PATHS[@]}" -eq 14
          test -z "$(printf '%s\n' "${PRODUCT_PATHS[@]}" | grep '^\.github/workflows/' || true)"

          npm run release:check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push --force origin "HEAD:refs/heads/$TARGET"

          mkdir -p "$RECEIPT"
          python - "$RECEIPT/receipt.json" "$PARENT" "$PARENT_TREE" "$PRODUCT_COMMIT" "$PRODUCT_TREE" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ROWS" "$MATCHES" "$MATCHED_EINS" <<'PY'
          import json, sys
          keys = ['parent','parent_tree','product_commit','product_tree','artifact_id','artifact_digest','official_index_rows_scanned','filing_index_match_rows','candidate_eins_with_filing_rows']
          values = sys.argv[2:]
          row = {'state':'product_branch_published','permanent_changed_paths':14,'target_branch':'agent/schoolhouse-irs-candidate-filing-index-custody-product-v1',**dict(zip(keys,values))}
          for key in ['artifact_id','official_index_rows_scanned','filing_index_match_rows','candidate_eins_with_filing_rows']:
              row[key] = int(row[key])
          open(sys.argv[1], 'w').write(json.dumps(row, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum "$RECEIPT/receipt.json" > "$RECEIPT/SHA256SUMS"

      - name: Upload exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-candidate-filing-index-materialization-receipt
          path: ${{ runner.temp }}/schoolhouse-irs-candidate-filing-index-materialization-receipt
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
