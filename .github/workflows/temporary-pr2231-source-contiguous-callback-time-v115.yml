name: Temporary PR 2231 source-contiguous callback time V115

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-pr2231-source-contiguous-callback-time-v115.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-source-contiguous-callback-time-v115
  cancel-in-progress: false

jobs:
  qualify-source-contiguous-callback-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      CONTROLLER_WORKFLOW: .github/workflows/temporary-pr2231-source-contiguous-callback-time-v115.yml
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: cfd1e459efc07f57cab7117200a4a4b962fd1bac
      EXPECTED_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_TREE: 17d5350c902e47f129fae0282735b4acbeff381c
      EXPECTED_LIBRARY: dab48bfba026dc1629a4384a26d98c13366b0ea3
      EXPECTED_TEST: 8fad1d2be93f9a286f9b95bb35751d3e908c4834
      REVIEW_BINDINGS: >-
        PRRT_kwDOTGqftc6dept0:3888440222 PRRT_kwDOTGqftc6dfK4F:3888640534
        PRRT_kwDOTGqftc6dfK4H:3888640536 PRRT_kwDOTGqftc6dfLu0:3888645507
        PRRT_kwDOTGqftc6di_ww:3890125090 PRRT_kwDOTGqftc6di_wy:3890125092
      ARTIFACT_DIR: /tmp/pr2231-source-contiguous-callback-time-v115
      PRODUCT_WT: /tmp/pr2231-source-contiguous-callback-time-product-v115
      MAIN_WT: /tmp/pr2231-source-contiguous-callback-time-main-v115
      QUALIFIED_DIR: /tmp/pr2231-source-contiguous-callback-time-qualified-v115
      QUALIFIER_BLOB: 1ffed621da63ac60b12f89f9d65313b51cf11a07
      QUALIFIER_GZIP_SHA256: 36e239a3a9b6bad139d8270e966212b0456f66f603a904b676366a41adfbd1a1
      QUALIFIER_SCRIPT_SHA256: dd37719f4a64e16efbdbc8c40a4b7358860987f0018b64222809dcf725814dbc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and execute read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir=/tmp/pr2231-source-contiguous-callback-time-v115-source
          rm -rf "$source_dir"
          mkdir -p "$source_dir" "$ARTIFACT_DIR"
          gh api "repos/$REPO/git/blobs/$QUALIFIER_BLOB" > "$source_dir/qualifier-blob.json"
          jq -e --arg sha "$QUALIFIER_BLOB" '.sha == $sha and .encoding == "base64"' \
            "$source_dir/qualifier-blob.json" >/dev/null
          jq -r '.content' "$source_dir/qualifier-blob.json" \
            | tr -d '\n' \
            | base64 -d > "$source_dir/qualifier-v115.sh.gz"
          printf '%s  %s\n' "$QUALIFIER_GZIP_SHA256" \
            "$source_dir/qualifier-v115.sh.gz" | sha256sum -c -
          gzip -dc "$source_dir/qualifier-v115.sh.gz" > "$source_dir/qualifier-v115.sh"
          printf '%s  %s\n' "$QUALIFIER_SCRIPT_SHA256" \
            "$source_dir/qualifier-v115.sh" | sha256sum -c -
          bash -n "$source_dir/qualifier-v115.sh"
          chmod +x "$source_dir/qualifier-v115.sh"
          "$source_dir/qualifier-v115.sh"
      - name: Retain qualification source and receipts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir=/tmp/pr2231-source-contiguous-callback-time-v115-source
          mkdir -p "$ARTIFACT_DIR"
          [[ ! -f "$source_dir/qualifier-v115.sh" ]] \
            || cp "$source_dir/qualifier-v115.sh" "$ARTIFACT_DIR/qualifier-v115.sh"
          [[ ! -f "$source_dir/qualifier-v115.sh.gz" ]] \
            || cp "$source_dir/qualifier-v115.sh.gz" "$ARTIFACT_DIR/qualifier-v115.sh.gz"
          [[ ! -f "$source_dir/qualifier-blob.json" ]] \
            || cp "$source_dir/qualifier-blob.json" "$ARTIFACT_DIR/qualifier-blob.json"
          cp "$CONTROLLER_WORKFLOW" "$ARTIFACT_DIR/controller-workflow-v115.yml"
          sha256sum "$CONTROLLER_WORKFLOW" > "$ARTIFACT_DIR/controller-workflow-v115.sha256"
          find "$ARTIFACT_DIR" -maxdepth 2 -type f -printf '%P\t%s\n' \
            | sort > "$ARTIFACT_DIR/artifact-manifest.txt"
          {
            printf '%s\n' '### PR 2231 source-contiguous callback-time qualification V115'
            for receipt in qualification-terminal.txt predecessor-reproduction.jsonl \
              direct-matrix.jsonl source-contiguity-matrix.json \
              focused-product.log product-release-check.log \
              focused-main-transplant.log main-release-check.log \
              candidate-commit.txt candidate-paths.txt summary.json \
              controller-workflow-v115.sha256 artifact-manifest.txt; do
              printf '\n#### %s\n\n```text\n' "$receipt"
              [[ ! -f "$ARTIFACT_DIR/$receipt" ]] \
                || tail -n 420 "$ARTIFACT_DIR/$receipt"
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-source-contiguous-callback-time-v115
          path: /tmp/pr2231-source-contiguous-callback-time-v115
          retention-days: 90
