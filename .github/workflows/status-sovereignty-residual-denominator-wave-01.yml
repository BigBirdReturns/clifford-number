name: Status sovereignty residual-denominator Wave 01

on:
  pull_request:
    paths:
      - 'data/intake/status-sovereignty-rd0*-*.json'
      - 'data/intake/status-sovereignty-*-first-pass.json'
      - 'data/intake/status-sovereignty-six-gate-first-pass-reconciliation.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-01.json'
      - 'data/project/status-sovereignty-residual-denominator-wave-01-release-manifest.json'
      - 'schemas/status-sovereignty-residual-denominator-wave-01.schema.json'
      - 'docs/milestones/ssc-rd0*-*.md'
      - 'docs/milestones/ssc-residual-denominator-wave-01.md'
      - 'tools/build-status-sovereignty-residual-denominator-wave-01.mjs'
      - 'tools/validate-status-sovereignty-residual-denominator-wave-01.mjs'
      - 'test/status-sovereignty-residual-denominator-wave-01.test.js'
      - 'build/core-thesis/status-sovereignty/residual-denominator-wave-01/**'
      - 'reports/core-thesis/status-sovereignty/residual-denominator-wave-01/**'
      - '.github/workflows/status-sovereignty-residual-denominator-wave-01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-denominator-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact repository dependencies
        run: npm ci
      - name: Rebuild Wave 01 deterministic outputs
        run: node tools/build-status-sovereignty-residual-denominator-wave-01.mjs
      - name: Refuse generated drift
        run: git diff --exit-code -- data/project/status-sovereignty-residual-denominator-wave-01-release-manifest.json build/core-thesis/status-sovereignty/residual-denominator-wave-01 reports/core-thesis/status-sovereignty/residual-denominator-wave-01
      - name: Validate six typed terminal receipts and forty-two open residual classes
        run: node tools/validate-status-sovereignty-residual-denominator-wave-01.mjs
      - name: Exercise positive and adversarial fixtures
        run: node test/status-sovereignty-residual-denominator-wave-01.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Preserve exact reconciliation outputs
        uses: actions/upload-artifact@v4
        with:
          name: status-sovereignty-residual-denominator-wave-01
          path: |
            data/project/status-sovereignty-residual-denominator-wave-01-release-manifest.json
            build/core-thesis/status-sovereignty/residual-denominator-wave-01
            reports/core-thesis/status-sovereignty/residual-denominator-wave-01
          if-no-files-found: error
