name: M-04G source ecology v2

on:
  push:
    branches: [main]
    paths:
      - 'data/project/m04g-source-ecology-v2-policy.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-source-ecology-v2.json'
      - 'tools/lib/m04g-source-ecology-v2.mjs'
      - 'tools/run-m04g-source-ecology-v2.mjs'
      - 'tools/build-m05-answerable-power-sprint-03-leg-07.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07.test.js'
      - '.github/workflows/m04g-source-ecology-v2.yml'
  schedule:
    - cron: '47 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frozen denominator and repair contract
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-07.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-07.mjs
          node test/m05-answerable-power-sprint-03-leg-07.test.js
      - name: Run the frozen 96-route v2 orbit
        run: |
          node tools/run-m04g-source-ecology-v2.mjs --output-dir build/m04g-source-ecology-v2-live
      - name: Write step summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt=JSON.parse(fs.readFileSync('build/m04g-source-ecology-v2-live/m04g-source-ecology-v2-receipt.json','utf8'));
          const s=receipt.summary;
          const lines=[
            '# M-04G source ecology v2',
            '',
            `- Selected: ${s.selected}`,
            `- Route successes: ${s.route_successes} (${(100*s.route_success_rate).toFixed(2)}%)`,
            `- Content successes: ${s.content_successes} (${(100*s.content_success_rate).toFixed(2)}%)`,
            `- Metadata only: ${s.metadata_only}`,
            `- Failed: ${s.failed}`,
            `- Healthy basins: ${s.healthy_basins}/12`,
            `- Unclassified failures: ${s.unclassified_failures}`,
            `- Coverage healthy: ${s.coverage_healthy}`,
            `- Proof: ${receipt.proof_sha256}`
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: m04g-source-ecology-v2-${{ github.run_id }}
          path: build/m04g-source-ecology-v2-live/
          if-no-files-found: error
          retention-days: 30
      - name: Reconcile the live research issue
        if: always() && hashFiles('build/m04g-source-ecology-v2-live/m04g-source-ecology-v2-receipt.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE' > /tmp/m04g-v2-comment.md
          import fs from 'node:fs';
          const receipt=JSON.parse(fs.readFileSync('build/m04g-source-ecology-v2-live/m04g-source-ecology-v2-receipt.json','utf8'));
          const s=receipt.summary;
          console.log('## M-04G source ecology v2 observed orbit');
          console.log('');
          console.log('```text');
          console.log(`run:                  ${process.env.GITHUB_RUN_ID}`);
          console.log(`event:                ${process.env.GITHUB_EVENT_NAME}`);
          console.log(`head:                 ${process.env.GITHUB_SHA}`);
          console.log(`selected routes:      ${s.selected}`);
          console.log(`route successes:      ${s.route_successes}`);
          console.log(`content successes:    ${s.content_successes}`);
          console.log(`metadata only:        ${s.metadata_only}`);
          console.log(`failed:               ${s.failed}`);
          console.log(`healthy basins:       ${s.healthy_basins} / 12`);
          console.log(`unclassified failures:${s.unclassified_failures}`);
          console.log(`route rate:           ${(100*s.route_success_rate).toFixed(2)}%`);
          console.log(`content rate:         ${(100*s.content_success_rate).toFixed(2)}%`);
          console.log(`coverage healthy:     ${s.coverage_healthy}`);
          console.log(`proof SHA-256:        ${receipt.proof_sha256}`);
          console.log('```');
          console.log('');
          console.log('The same 96-route denominator is preserved. Metadata-only results do not count as content. Failed and blocked routes remain in the denominator. Source health does not set evidentiary sufficiency or answer effectiveness.');
          NODE
          if [ "$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('build/m04g-source-ecology-v2-live/m04g-source-ecology-v2-receipt.json','utf8')); process.stdout.write(String(r.summary.coverage_healthy));")" = "false" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/345" -f state=open >/dev/null
          fi
          gh issue comment 345 --body-file /tmp/m04g-v2-comment.md
      - name: Enforce execution and failure-classification contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { executionContractFailures } from './tools/lib/m04g-source-ecology-v2.mjs';
          const receipt=JSON.parse(fs.readFileSync('build/m04g-source-ecology-v2-live/m04g-source-ecology-v2-receipt.json','utf8'));
          const s=receipt.summary;
          const failures=executionContractFailures(s);
          if(failures.length){
            console.error(`M-04G execution contract failed: ${failures.join('; ')}.`);
            process.exit(2);
          }
          if(!s.coverage_healthy){
            console.warn('M-04G execution completed and every failure was classified, but the frozen source-health thresholds remain unmet. Issue #345 tracks that open ecological contract.');
          }
          NODE
