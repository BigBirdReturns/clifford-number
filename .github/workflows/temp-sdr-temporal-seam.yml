name: TEMP repair Strategic Defence Review temporal seam

on:
  push:
    branches:
      - agent/sdr-temporal-seam

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sdr-temporal-seam
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Split the terms surface from the review workstream
        run: python .github/materialize-sdr-temporal-seam.py mutate
      - name: Rebuild topology
        run: npm run compile
      - name: Reconcile derived counters
        run: python .github/materialize-sdr-temporal-seam.py reconcile
      - name: Compile and validate the exact public release
        run: npm run release:check
      - name: Commit the canonical increment and remove temporary transport
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sdr-temporal-seam.yml .github/materialize-sdr-temporal-seam.py
          git add -A
          for path in .github/workflows/temp-sdr-temporal-seam.yml .github/materialize-sdr-temporal-seam.py; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "temporary transport remains present or tracked: $path" >&2
              exit 1
            fi
          done
          git commit -m "topology: separate SDR terms from review workstream"
          git push origin HEAD:agent/sdr-temporal-seam
