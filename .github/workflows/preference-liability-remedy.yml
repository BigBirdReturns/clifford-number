name: Preference custody liability-remedy control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/liability-remedy.fixture.json'
      - 'tools/lib/preference-liability-remedy.mjs'
      - 'tools/compile-preference-liability-remedy.mjs'
      - 'tools/validate-preference-liability-remedy.mjs'
      - 'test/preference-liability-remedy.test.js'
      - 'docs/preference-custody-liability-remedy.md'
      - '.github/workflows/preference-liability-remedy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liability-remedy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile liability and remedy worlds
        run: node tools/compile-preference-liability-remedy.mjs
      - name: Validate contract, insurance, standing, payment, and residual-loss boundaries
        run: node tools/validate-preference-liability-remedy.mjs
      - name: Exercise allocation, cap, exclusion, forum, causation, authority, and tamper fixtures
        run: node test/preference-liability-remedy.test.js
      - name: Preserve deterministic liability-remedy projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-liability-remedy-pc16
          path: |
            build/research/preference-liability-remedy.json
            build/research/preference-liability-remedy.md
          if-no-files-found: error
