name: Temporary PR 2231 V131 exact leased publisher R3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-v131-phone-label-bare-host-exact-leased-publisher-v3
  cancel-in-progress: false

jobs:
  publish-v131-r3:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v131-phone-label-bare-host-publisher-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v131-phone-label-bare-host-publisher-v3
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact publisher R3 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute exact V131 replay and leased publication R3
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=.github/temporary/pr2231-v131-phone-label-bare-host-publisher-v3.tar.xz
          payload_size=10504
          payload_blob=e8ed182ec489ba9ee77a3032f639c942ee2ec59f
          payload_sha256=f3b4adedcc4d1f281d40abad51653962eefb3375c09009956ad1bda98877e605
          runroot=/tmp/pr2231-v131-phone-label-bare-host-publisher-controller-v3
          script="$runroot/.github/scripts/pr2231-v131-phone-label-bare-host-publisher-v3.sh"
          patch="$runroot/.github/scripts/pr2231-v131-phone-label-bare-host-v1.patch"

          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          rm -rf "$runroot"
          mkdir -p "$runroot"
          tar -xJf "$payload" -C "$runroot"
          mapfile -t members < <(tar -tJf "$payload")
          test "${#members[@]}" = 2
          test "${members[0]}" = .github/scripts/pr2231-v131-phone-label-bare-host-publisher-v3.sh
          test "${members[1]}" = .github/scripts/pr2231-v131-phone-label-bare-host-v1.patch
          test "$(wc -c < "$script")" = 39694
          test "$(git hash-object "$script")" = 84e14d6309700ba8b6b76e8e2b4891044c411acf
          test "$(sha256sum "$script" | awk '{print $1}')" = 28e0a254c08bb9840f7dc00630df0bc133b0bf7b014a993603747199b807d2e7
          test "$(wc -c < "$patch")" = 8695
          test "$(git hash-object "$patch")" = a1b0f675294882c33d8501193c1e34b746eb3194
          test "$(sha256sum "$patch" | awk '{print $1}')" = 038cdfc8d067cfba7799dbe3d8980004ff588b848a95c47f287dcb9e61cfb5ff
          chmod 0755 "$script"
          bash -n "$script"
          V131_PATCH_FILE="$patch" bash "$script"

      - name: Retain V131 R3 publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v131-phone-label-bare-host-exact-leased-publication-v3
          path: /tmp/pr2231-v131-phone-label-bare-host-publication-v3
          if-no-files-found: error
          retention-days: 90
