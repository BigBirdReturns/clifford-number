name: TEMP probe RD-04 CA-SD-WA capture-adjudication carrier

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ssc-rd04-ca-sd-wa-capture-adjudication-carrier-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact archive from immutable binary Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, tarfile, urllib.request
          from pathlib import Path

          blob_shas = [
              '8f7273bb97c73eeb090e58b3f068f48398836f9e',
              '14d2efca366b5cab4b00605637972dc64540bcc9',
              '8dd17653f493594ca357232559d52097c09e3b34',
          ]
          out = Path('/tmp/rd04-carrier-probe')
          out.mkdir(parents=True, exist_ok=True)
          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']

          parts = []
          part_receipts = []
          for ordinal, sha in enumerate(blob_shas):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'ssc-rd04-carrier-probe',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              if payload.get('encoding') != 'base64':
                  raise SystemExit(f'blob {sha} unexpected encoding {payload.get("encoding")}')
              raw = base64.b64decode(''.join(payload['content'].split()), validate=True)
              if hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() != sha:
                  raise SystemExit(f'blob identity mismatch for {sha}')
              if payload.get('size') != len(raw):
                  raise SystemExit(f'blob size mismatch for {sha}: api={payload.get("size")} local={len(raw)}')
              (out / f'part-{ordinal:02d}.bin').write_bytes(raw)
              parts.append(raw)
              part_receipts.append({
                  'ordinal': ordinal,
                  'sha': sha,
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })

          decoded = b''.join(parts)
          archive = out / 'product.tar.xz'
          archive.write_bytes(decoded)
          digest = hashlib.sha256(decoded).hexdigest()
          expected_bytes = 59820
          expected_sha256 = '27279ff201f60d5c208f75332444324cdb70a59be2f668d0f82f53acc8eb220c'
          names = []
          archive_error = None
          try:
              with tarfile.open(archive, mode='r:xz') as tf:
                  names = sorted(m.name for m in tf.getmembers() if m.isfile())
          except Exception as exc:
              archive_error = f'{type(exc).__name__}: {exc}'

          receipt = {
              'source': 'immutable_binary_git_blobs',
              'parts': part_receipts,
              'decoded_bytes': len(decoded),
              'decoded_sha256': digest,
              'expected_bytes': expected_bytes,
              'expected_sha256': expected_sha256,
              'matches_expected': len(decoded) == expected_bytes and digest == expected_sha256,
              'archive_file_count': len(names),
              'archive_files': names,
              'archive_error': archive_error,
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Preserve probe receipt and reconstructed bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-ca-sd-wa-capture-adjudication-carrier-probe
          path: /tmp/rd04-carrier-probe
          if-no-files-found: error
          retention-days: 90
      - name: Refuse incomplete or drifted carrier
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/rd04-carrier-probe/receipt.json').read_text())
          if not r['matches_expected']:
              raise SystemExit(
                  f"carrier mismatch: bytes={r['decoded_bytes']} sha256={r['decoded_sha256']} "
                  f"expected_bytes={r['expected_bytes']} expected_sha256={r['expected_sha256']}"
              )
          if r['archive_error'] is not None or r['archive_file_count'] != 17:
              raise SystemExit(f"archive shape mismatch: {r}")
          print('carrier_exact=true')
          PY
