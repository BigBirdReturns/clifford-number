name: TEMP probe RD-04 CA-SD-WA capture-adjudication carrier

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ssc-rd04-ca-sd-wa-capture-adjudication-carrier-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect exact carrier bytes without publication
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64, hashlib, json, string, tarfile
          from pathlib import Path

          carrier = Path('.rd04-ca-sd-wa-capture-adjudication-carrier')
          parts = [carrier / 'part-00.b64', carrier / 'part-01.b64']
          out = Path('/tmp/rd04-carrier-probe')
          out.mkdir(parents=True, exist_ok=True)

          raw_parts = [p.read_text(encoding='ascii') for p in parts]
          text_parts = [''.join(text.split()) for text in raw_parts]
          allowed = set(string.ascii_letters + string.digits + '+/=')
          invalid = []
          offset = 0
          for part_index, text in enumerate(text_parts):
              for position, char in enumerate(text):
                  if char not in allowed:
                      invalid.append({
                          'part_index': part_index,
                          'position_in_part': position,
                          'joined_position': offset + position,
                          'character': char,
                          'codepoint': ord(char),
                      })
                      if len(invalid) >= 100:
                          break
              offset += len(text)

          joined = ''.join(text_parts)
          receipt = {
              'part_files': [str(p) for p in parts],
              'part_raw_bytes': [len(t.encode('ascii')) for t in raw_parts],
              'part_base64_bytes_after_whitespace_normalization': [len(t.encode('ascii')) for t in text_parts],
              'part_prefixes': [t[:80] for t in text_parts],
              'part_suffixes': [t[-80:] for t in text_parts],
              'joined_base64_bytes': len(joined.encode('ascii')),
              'invalid_character_count_sampled': len(invalid),
              'invalid_characters': invalid,
              'decode_error': None,
              'decoded_bytes': None,
              'decoded_sha256': None,
              'expected_bytes': 59820,
              'expected_sha256': '27279ff201f60d5c208f75332444324cdb70a59be2f668d0f82f53acc8eb220c',
              'matches_expected': False,
              'archive_file_count': 0,
              'archive_files': [],
              'archive_error': None,
          }

          if not invalid:
              try:
                  decoded = base64.b64decode(joined, validate=True)
                  archive = out / 'product.tar.xz'
                  archive.write_bytes(decoded)
                  receipt['decoded_bytes'] = len(decoded)
                  receipt['decoded_sha256'] = hashlib.sha256(decoded).hexdigest()
                  receipt['matches_expected'] = (
                      receipt['decoded_bytes'] == receipt['expected_bytes']
                      and receipt['decoded_sha256'] == receipt['expected_sha256']
                  )
                  try:
                      with tarfile.open(archive, mode='r:xz') as tf:
                          names = sorted(m.name for m in tf.getmembers() if m.isfile())
                      receipt['archive_file_count'] = len(names)
                      receipt['archive_files'] = names
                  except Exception as exc:
                      receipt['archive_error'] = f'{type(exc).__name__}: {exc}'
              except Exception as exc:
                  receipt['decode_error'] = f'{type(exc).__name__}: {exc}'
          else:
              receipt['decode_error'] = 'invalid_non_base64_characters_after_whitespace_normalization'

          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Preserve probe receipt and reconstructed bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-ca-sd-wa-capture-adjudication-carrier-probe
          path: /tmp/rd04-carrier-probe
          if-no-files-found: error
          retention-days: 90
      - name: Refuse incomplete or drifted carrier
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/rd04-carrier-probe/receipt.json').read_text())
          if r['decode_error'] is not None:
              raise SystemExit(f"carrier decode refused: {r['decode_error']} invalid={r['invalid_characters'][:10]}")
          if not r['matches_expected']:
              raise SystemExit(
                  f"carrier mismatch: bytes={r['decoded_bytes']} sha256={r['decoded_sha256']} "
                  f"expected_bytes={r['expected_bytes']} expected_sha256={r['expected_sha256']}"
              )
          if r['archive_error'] is not None or r['archive_file_count'] != 17:
              raise SystemExit(f"archive shape mismatch: {r}")
          print('carrier_exact=true')
          PY
