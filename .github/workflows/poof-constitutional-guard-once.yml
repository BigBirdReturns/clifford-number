name: Apply POOF constitutional diff guard once

on:
  pull_request:
    branches: [main]
    paths:
      - '.poof-constitutional-guard-launch'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/poof-clifford-ecology'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/poof-clifford-ecology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply constitutional diff guard
        run: |
          python3 -m py_compile .github/scripts/apply-poof-constitutional-guard.py
          python3 .github/scripts/apply-poof-constitutional-guard.py
          python3 - <<'PY'
          from pathlib import Path
          target = Path('tools/validate-poof-clifford-ecology.mjs')
          text = target.read_text()
          old = "  if (projection.selection_contract.candidate_count === projection.selection_contract.included_count && projection.selection_contract.candidate_set_hash !== includedHash) fail('projection candidate set hash drift');\n"
          new = "  if (projection.selection_contract && projection.selection_contract.candidate_count === projection.selection_contract.included_count && projection.selection_contract.candidate_set_hash !== includedHash) fail('projection candidate set hash drift');\n"
          if text.count(old) != 1:
              raise SystemExit(f'candidate hash guard anchor count: {text.count(old)}')
          target.write_text(text.replace(old, new, 1))
          PY
      - name: Prove constitutional custody and focused ecology
        run: |
          node tools/validate-poof-constitutional-change.mjs origin/main
          node test/poof-constitutional-change.test.js
          npm run ci:poof-ecology
          git diff --check
      - name: Prepare a workflow-permission-safe commit
        run: |
          rm -f .poof-constitutional-guard-launch
          rm -f .github/scripts/apply-poof-constitutional-guard.py
          git restore --source=HEAD --staged --worktree .github/workflows/poof-clifford-ecology.yml .github/workflows/poof-constitutional-guard-once.yml
      - name: Commit guarded constitution and regenerated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce append-only POOF constitutional change custody"
          git push origin HEAD:agent/poof-clifford-ecology
