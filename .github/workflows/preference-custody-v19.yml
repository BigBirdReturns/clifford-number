name: Preference custody laboratory floor v19

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-choice-effectiveness.mjs'
      - 'tools/validate-preference-choice-effectiveness.mjs'
      - 'tools/compile-preference-custody-manifest-v19.mjs'
      - 'tools/validate-preference-custody-manifest-v19.mjs'
      - 'test/preference-choice-effectiveness.test.js'
      - 'test/preference-custody-manifest-v19.test.js'
      - 'docs/preference-custody-choice-effectiveness.md'
      - 'docs/preference-custody-laboratory-floor-v19.md'
      - '.github/workflows/preference-choice-effectiveness.yml'
      - '.github/workflows/preference-custody-v19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-21 and the compositional v19 floor
        run: |
          node tools/compile-preference-choice-effectiveness.mjs
          node tools/compile-preference-custody-manifest-v19.mjs
      - name: Validate choice-effectiveness and floor boundaries
        run: |
          node tools/validate-preference-choice-effectiveness.mjs
          node tools/validate-preference-custody-manifest-v19.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-choice-effectiveness.test.js
          node test/preference-custody-manifest-v19.test.js
      - name: Preserve deterministic v19 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v19
          path: |
            build/research/preference-choice-effectiveness.json
            build/research/preference-choice-effectiveness.md
            build/research/preference-custody-laboratory-floor-v19.json
            build/research/preference-custody-laboratory-floor-v19.md
          if-no-files-found: error
