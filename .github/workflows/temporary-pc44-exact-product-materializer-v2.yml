name: TEMP materialize exact PC-44 product v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc44-exact-product-materializer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc44-exact-product-materializer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify carrier, qualify exact product, and publish
        env:
          SOURCE_BRANCH: agent/pc44-exact-product-materializer
          TARGET_BRANCH: research/preference-linkage-uncertainty-monitoring-assurance-v1
          SOURCE_BASE: ef74c7dba6278912534bc3eb8c6fa4191b9ff2d8
        run: |
          set -Eeuo pipefail
          status=failed
          source_head="$(git rev-parse HEAD)"
          publication_base=
          product_commit=
          product_tree=
          attempt=0
          pass_focused=false
          pass_historical=false
          pass_no_magic=false
          pass_release=false
          pass_replay=false
          published=false

          emit_receipt() {
            code=$?
            trap - EXIT
            overlap='[]'; advance='[]'; files='{}'
            test ! -f /tmp/pc44-overlap.txt || overlap="$(jq -Rsc 'split("\n")|map(select(length>0))' /tmp/pc44-overlap.txt)"
            test ! -f /tmp/pc44-main-advance.txt || advance="$(jq -Rsc 'split("\n")|map(select(length>0))' /tmp/pc44-main-advance.txt)"
            test ! -f /tmp/pc44-package-manifest.json || files="$(jq '.files' /tmp/pc44-package-manifest.json)"
            jq -n \
              --arg status "$status" --arg run "$GITHUB_RUN_ID" \
              --arg source "$source_head" --arg source_base "$SOURCE_BASE" \
              --arg parent "$publication_base" --arg product "$product_commit" --arg tree "$product_tree" \
              --arg target "$TARGET_BRANCH" --argjson attempt "$attempt" \
              --argjson overlap "$overlap" --argjson advance "$advance" --argjson files "$files" \
              --argjson focused "$pass_focused" --argjson historical "$pass_historical" \
              --argjson no_magic "$pass_no_magic" --argjson release "$pass_release" \
              --argjson replay "$pass_replay" --argjson published "$published" \
              '{schema_version:"pc44-exact-product-materialization-receipt@2",workflow_run_id:$run,status:$status,source_controller_head:$source,source_export_head:$source_base,publication_parent:($parent|select(length>0)),product_head:($product|select(length>0)),product_tree:($tree|select(length>0)),attempt:$attempt,target_branch:$target,permanent_path_count:14,path_list_sha256:"0595fac06166e0a08e40c3714fbb5188a4f7fe832c27de273c16b06d4aa1a92c",package_bytes:19272,package_sha256:"c0fd8e689b162afd403b318cb0c25b0c9c37ac3133005fd7b9eb41b8f145a505",package_base64_bytes:25696,package_base64_sha256:"433f7f4356cb2c35d8f9481056cd1a8c03de3d6e01c468fab3ce99477ae273b2",carrier_shards:4,files:$files,main_advance_paths:$advance,overlap_paths:$overlap,focused_pc44_and_floor_v42:$focused,historical_preference_custody_floors:$historical,no_magic_human:$no_magic,release_check:$release,deterministic_replay:$replay,standalone_fixture_mutations:51,standalone_build_tamper_checks:16,floor_v42_adversarial_mutations:63,complete_manifest_snapshot_binding:true,private_canonical_refusal_ledger_frozen:true,exported_refusal_ledger_separate_frozen_copy:true,target_published:$published,outside_human_dependency:false,graph_effect:"none"}' \
              > /tmp/pc44-exact-product-materialization-receipt.json
            cat /tmp/pc44-exact-product-materialization-receipt.json
            exit "$code"
          }
          trap emit_receipt EXIT

          jq -e '.schema_version=="pc44-product-package-manifest@1" and .source_head==env.SOURCE_BASE and .path_count==14' .pc44-package-manifest.json >/dev/null
          cp .pc44-package-manifest.json /tmp/pc44-package-manifest.json
          jq -r '.files|keys[]' .pc44-package-manifest.json | LC_ALL=C sort > /tmp/pc44-paths.txt
          test "$(sha256sum /tmp/pc44-paths.txt | cut -d' ' -f1)" = "$(jq -r .path_list_sha256 .pc44-package-manifest.json)"
          cat .pc44-package.b64.00 .pc44-package.b64.01 .pc44-package.b64.02 .pc44-package.b64.03 > /tmp/pc44-package.b64
          test "$(stat -c '%s' /tmp/pc44-package.b64)" = "$(jq -r .base64_bytes .pc44-package-manifest.json)"
          test "$(sha256sum /tmp/pc44-package.b64 | cut -d' ' -f1)" = "$(jq -r .base64_sha256 .pc44-package-manifest.json)"
          base64 --decode /tmp/pc44-package.b64 > /tmp/pc44-package.tar.xz
          test "$(stat -c '%s' /tmp/pc44-package.tar.xz)" = "$(jq -r .archive_bytes .pc44-package-manifest.json)"
          test "$(sha256sum /tmp/pc44-package.tar.xz | cut -d' ' -f1)" = "$(jq -r .archive_sha256 .pc44-package-manifest.json)"
          tar -tJf /tmp/pc44-package.tar.xz | LC_ALL=C sort > /tmp/pc44-tar-paths.txt
          diff -u /tmp/pc44-paths.txt /tmp/pc44-tar-paths.txt
          rm -rf /tmp/pc44-product && mkdir -p /tmp/pc44-product
          tar -xJf /tmp/pc44-package.tar.xz -C /tmp/pc44-product
          jq -r '.files|to_entries[]|[.key,.value.bytes,.value.sha256,.value.git_blob_sha1]|@tsv' .pc44-package-manifest.json > /tmp/pc44-files.tsv
          while IFS=$'\t' read -r path bytes digest blob; do
            test "$(stat -c '%s' "/tmp/pc44-product/$path")" = "$bytes"
            test "$(sha256sum "/tmp/pc44-product/$path" | cut -d' ' -f1)" = "$digest"
            test "$(git hash-object "/tmp/pc44-product/$path")" = "$blob"
          done < /tmp/pc44-files.tsv

          for attempt in 1 2 3; do
            pass_focused=false; pass_historical=false; pass_no_magic=false
            pass_release=false; pass_replay=false; published=false
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$source_head"
            publication_base="$(git rev-parse origin/main)"
            git merge-base --is-ancestor "$SOURCE_BASE" "$publication_base"
            ! git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1
            git diff --name-only "$SOURCE_BASE..$publication_base" | LC_ALL=C sort -u > /tmp/pc44-main-advance.txt
            comm -12 /tmp/pc44-paths.txt /tmp/pc44-main-advance.txt > /tmp/pc44-overlap.txt
            test ! -s /tmp/pc44-overlap.txt

            git checkout --detach "$publication_base"
            git reset --hard "$publication_base" && git clean -fdx
            cp -a /tmp/pc44-product/. .
            while IFS=$'\t' read -r path bytes digest blob; do
              test "$(stat -c '%s' "$path")" = "$bytes"
              test "$(sha256sum "$path" | cut -d' ' -f1)" = "$digest"
              test "$(git hash-object "$path")" = "$blob"
            done < /tmp/pc44-files.tsv

            export GIT_INDEX_FILE="/tmp/pc44-index-$attempt"; rm -f "$GIT_INDEX_FILE"
            git read-tree "$publication_base"; xargs -d '\n' git add -- < /tmp/pc44-paths.txt
            product_tree="$(git write-tree)"
            export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            product_commit="$(printf '%s\n' 'Preference Custody: add PC-44 uncertainty monitoring and recalibration custody' | git commit-tree "$product_tree" -p "$publication_base")"
            unset GIT_INDEX_FILE
            git diff-tree --no-commit-id --name-only -r "$product_commit" | LC_ALL=C sort > /tmp/pc44-observed-paths.txt
            diff -u /tmp/pc44-paths.txt /tmp/pc44-observed-paths.txt
            test "$(git rev-parse "$product_commit^")" = "$publication_base"

            git reset --hard "$product_commit"
            node tools/compile-preference-linkage-uncertainty-monitoring-assurance.mjs
            node tools/validate-preference-linkage-uncertainty-monitoring-assurance.mjs
            node test/preference-linkage-uncertainty-monitoring-assurance.test.js
            node tools/compile-preference-custody-manifest-v42.mjs
            node tools/validate-preference-custody-manifest-v42.mjs
            node test/preference-custody-manifest-v42.test.js
            pass_focused=true
            for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
            node test/preference-custody-manifest.test.js
            pass_historical=true
            node tools/validate-no-magic-human-gate.mjs && node test/no-magic-human-gate.test.js
            pass_no_magic=true

            rm -rf /tmp/pc44-reference && mkdir -p /tmp/pc44-reference
            cp build/research/preference-linkage-uncertainty-monitoring-assurance.{json,md} /tmp/pc44-reference/
            cp build/research/preference-custody-laboratory-floor-v42.{json,md} /tmp/pc44-reference/
            npm run release:check
            while IFS= read -r path; do git diff --exit-code -- "$path"; done < /tmp/pc44-paths.txt
            pass_release=true

            git reset --hard "$product_commit" && git clean -fdx
            node tools/compile-preference-linkage-uncertainty-monitoring-assurance.mjs
            node tools/validate-preference-linkage-uncertainty-monitoring-assurance.mjs
            node test/preference-linkage-uncertainty-monitoring-assurance.test.js
            node tools/compile-preference-custody-manifest-v42.mjs
            node tools/validate-preference-custody-manifest-v42.mjs
            node test/preference-custody-manifest-v42.test.js
            cmp /tmp/pc44-reference/preference-linkage-uncertainty-monitoring-assurance.json build/research/preference-linkage-uncertainty-monitoring-assurance.json
            cmp /tmp/pc44-reference/preference-linkage-uncertainty-monitoring-assurance.md build/research/preference-linkage-uncertainty-monitoring-assurance.md
            cmp /tmp/pc44-reference/preference-custody-laboratory-floor-v42.json build/research/preference-custody-laboratory-floor-v42.json
            cmp /tmp/pc44-reference/preference-custody-laboratory-floor-v42.md build/research/preference-custody-laboratory-floor-v42.md
            pass_replay=true
            git reset --hard "$product_commit" && git clean -fdx
            test -z "$(git status --porcelain=v1 --untracked-files=all)"

            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$source_head"
            test "$(git rev-parse origin/main)" = "$publication_base" || continue
            ! git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1
            git push --force-with-lease="refs/heads/$TARGET_BRANCH:" origin "$product_commit:refs/heads/$TARGET_BRANCH"
            published=true; status=success; break
          done
          test "$published" = true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc44-exact-product-materialization-v2-${{ github.run_id }}
          path: /tmp/pc44-exact-product-materialization-receipt.json
          if-no-files-found: error
          retention-days: 90
