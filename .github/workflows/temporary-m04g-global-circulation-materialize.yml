name: Temporary materialize M-04G global circulation

on:
  push:
    branches:
      - agent/m04g-global-circulation-wave-02
    paths:
      - '.github/temporary/m04g-global-circulation/**'
      - '.github/workflows/temporary-m04g-global-circulation-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04g-global-circulation-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04g-global-circulation-wave-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble and safely extract the verified global-circulation payload
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import tarfile
          from pathlib import Path

          root = Path('.github/temporary/m04g-global-circulation')
          manifest = json.loads((root / 'manifest.json').read_text())
          encoded = ''.join((root / f'part-{index:02d}').read_text().strip() for index in range(manifest['parts']))
          assert len(encoded) == manifest['encoded_length'], (len(encoded), manifest['encoded_length'])
          assert hashlib.sha256(encoded.encode()).hexdigest() == manifest['encoded_sha256']
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == manifest['payload_length'], (len(payload), manifest['payload_length'])
          assert hashlib.sha256(payload).hexdigest() == manifest['payload_sha256']

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              archive.extractall('.')
              print('\n'.join(member.name for member in members))
          PY
      - name: Build and validate the deterministic global orbit
        run: |
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node test/m04g-global-circulation.test.js
          node tools/refresh-m04g-global-circulation.mjs --dry-run --basin all --class all --limit 500
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          exact = {
              '.github/workflows/m04g-global-circulation.yml',
              'data/project/m04g-global-circulation-methodology.json',
              'data/project/m04g-global-circulation-basins.json',
              'data/project/m04g-global-circulation-polls.json',
              'data/project/m04g-global-circulation-fanout.json',
              'data/intake/m04g-global-circulation-sources-02.json',
              'docs/methods/global-evidence-circulation.md',
              'docs/milestones/m04g-global-circulation-wave-02.md',
              'tools/build-m04g-global-circulation.mjs',
              'tools/validate-m04g-global-circulation.mjs',
              'tools/refresh-m04g-global-circulation.mjs',
              'test/m04g-global-circulation.test.js',
              'build/core-thesis/evidence-hydrology/global-circulation/data.json',
              'reports/core-thesis/evidence-hydrology/global-circulation/data.json',
              'reports/core-thesis/evidence-hydrology/global-circulation/index.html',
              '.github/workflows/temporary-m04g-global-circulation-materialize.yml',
          }
          prefixes = ('.github/temporary/m04g-global-circulation/',)
          def allowed(path): return path in exact or path.startswith(prefixes)
          for row in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines():
              path = row[3:].split(' -> ',1)[-1]
              if allowed(path):
                  continue
              target = Path(path)
              tracked = subprocess.run(['git','ls-files','--error-unmatch','--',path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if tracked:
                  subprocess.run(['git','restore','--staged','--worktree','--',path], check=True)
              elif target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
          PY
      - name: Rebuild, revalidate, and refuse unexpected drift
        run: |
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node test/m04g-global-circulation.test.js
          git diff --check
          python - <<'PY'
          import subprocess
          exact = {
              '.github/workflows/m04g-global-circulation.yml',
              'data/project/m04g-global-circulation-methodology.json',
              'data/project/m04g-global-circulation-basins.json',
              'data/project/m04g-global-circulation-polls.json',
              'data/project/m04g-global-circulation-fanout.json',
              'data/intake/m04g-global-circulation-sources-02.json',
              'docs/methods/global-evidence-circulation.md',
              'docs/milestones/m04g-global-circulation-wave-02.md',
              'tools/build-m04g-global-circulation.mjs',
              'tools/validate-m04g-global-circulation.mjs',
              'tools/refresh-m04g-global-circulation.mjs',
              'test/m04g-global-circulation.test.js',
              'build/core-thesis/evidence-hydrology/global-circulation/data.json',
              'reports/core-thesis/evidence-hydrology/global-circulation/data.json',
              'reports/core-thesis/evidence-hydrology/global-circulation/index.html',
              '.github/workflows/temporary-m04g-global-circulation-materialize.yml',
          }
          prefixes = ('.github/temporary/m04g-global-circulation/',)
          paths = [row[3:].split(' -> ',1)[-1] for row in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines()]
          bad = [path for path in paths if path not in exact and not path.startswith(prefixes)]
          print('\n'.join(paths))
          if bad:
              raise SystemExit('unexpected durable drift:\n' + '\n'.join(bad))
          PY
      - name: Commit only the permanent global-circulation program
        run: |
          target='agent/m04g-global-circulation-wave-02'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch \
            .github/temporary/m04g-global-circulation \
            .github/workflows/temporary-m04g-global-circulation-materialize.yml
          git add -- \
            .github/workflows/m04g-global-circulation.yml \
            data/project/m04g-global-circulation-methodology.json \
            data/project/m04g-global-circulation-basins.json \
            data/project/m04g-global-circulation-polls.json \
            data/project/m04g-global-circulation-fanout.json \
            data/intake/m04g-global-circulation-sources-02.json \
            docs/methods/global-evidence-circulation.md \
            docs/milestones/m04g-global-circulation-wave-02.md \
            tools/build-m04g-global-circulation.mjs \
            tools/validate-m04g-global-circulation.mjs \
            tools/refresh-m04g-global-circulation.mjs \
            test/m04g-global-circulation.test.js \
            build/core-thesis/evidence-hydrology/global-circulation/data.json \
            reports/core-thesis/evidence-hydrology/global-circulation/data.json \
            reports/core-thesis/evidence-hydrology/global-circulation/index.html
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'No permanent global-circulation changes to commit'; exit 1; }
          git commit -m 'Build M-04G global circulation wave 02'
          git push origin "HEAD:refs/heads/$target"
