name: TEMP correct PC-21 issue custody

on:
  push:
    branches:
      - research/preference-choice-effectiveness-v1
    paths:
      - 'tools/temp-correct-pc21-issue-custody.mjs'
      - '.github/workflows/temp-correct-pc21-issue-custody.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-qualify-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-choice-effectiveness-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Correct issue identity across PC-21 custody
        run: node tools/temp-correct-pc21-issue-custody.mjs
      - name: Qualify standalone and compositional controls
        run: |
          node tools/compile-preference-choice-effectiveness.mjs
          node tools/validate-preference-choice-effectiveness.mjs
          node test/preference-choice-effectiveness.test.js
          node tools/compile-preference-custody-manifest-v19.mjs
          node tools/validate-preference-custody-manifest-v19.mjs
          node test/preference-custody-manifest-v19.test.js
      - name: Retire temporary transport and publish correction
        run: |
          rm -f build/research/preference-choice-effectiveness.json
          rm -f build/research/preference-choice-effectiveness.md
          rm -f build/research/preference-custody-laboratory-floor-v19.json
          rm -f build/research/preference-custody-laboratory-floor-v19.md
          rm tools/temp-correct-pc21-issue-custody.mjs
          rm .github/workflows/temp-correct-pc21-issue-custody.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct PC-21 control issue custody'
          git push origin HEAD:research/preference-choice-effectiveness-v1
