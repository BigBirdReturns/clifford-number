name: Status-for-sovereignty compact

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/intake/status-sovereignty-*'
      - 'data/research/status-sovereignty-*'
      - 'data/project/status-sovereignty-*'
      - 'schemas/status-sovereignty-*'
      - 'docs/methods/status-sovereignty-*'
      - 'docs/milestones/m05-status-sovereignty-*'
      - 'tools/*status-sovereignty*'
      - 'test/status-sovereignty-*'
      - 'reports/core-thesis/status-sovereignty/**'
      - 'build/core-thesis/status-sovereignty/**'
      - 'data/project/project-stable-ground-sg07*.json'
      - 'data/project/project-stable-ground-sg08*.json'
      - 'data/project/project-stable-ground-sg09*.json'
      - 'tools/*project-stable-ground-sg08*'
      - 'tools/*project-stable-ground-sg09*'
      - 'test/project-stable-ground-sg08.test.js'
      - 'test/project-stable-ground-sg09.test.js'
      - '.github/workflows/project-stable-ground-sg07.yml'
      - '.github/workflows/project-stable-ground-sg08.yml'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/status-sovereignty-compact.yml'
      - '.github/workflows/status-sovereignty-wave-01.yml'
      - '.github/workflows/status-sovereignty-wave-01-review.yml'
      - '.github/workflows/status-sovereignty-wave-01-targeted-acquisition.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/intake/status-sovereignty-*'
      - 'data/research/status-sovereignty-*'
      - 'data/project/status-sovereignty-*'
      - 'schemas/status-sovereignty-*'
      - 'docs/methods/status-sovereignty-*'
      - 'docs/milestones/m05-status-sovereignty-*'
      - 'tools/*status-sovereignty*'
      - 'test/status-sovereignty-*'
      - 'reports/core-thesis/status-sovereignty/**'
      - 'build/core-thesis/status-sovereignty/**'
      - 'data/project/project-stable-ground-sg07*.json'
      - 'data/project/project-stable-ground-sg08*.json'
      - 'data/project/project-stable-ground-sg09*.json'
      - 'tools/*project-stable-ground-sg08*'
      - 'tools/*project-stable-ground-sg09*'
      - 'test/project-stable-ground-sg08.test.js'
      - 'test/project-stable-ground-sg09.test.js'
      - '.github/workflows/project-stable-ground-sg07.yml'
      - '.github/workflows/project-stable-ground-sg08.yml'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/status-sovereignty-compact.yml'
      - '.github/workflows/status-sovereignty-wave-01.yml'
      - '.github/workflows/status-sovereignty-wave-01-review.yml'
      - '.github/workflows/status-sovereignty-wave-01-targeted-acquisition.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and attack SSC-H01
        run: |
          npm run build:status-sovereignty
          npm run validate:status-sovereignty
          node test/status-sovereignty-wave-01.test.js
          node test/status-sovereignty-wave-01-review.test.js
          node test/status-sovereignty-wave-01-targeted-acquisition.test.js
          node test/status-sovereignty-compact.test.js
      - name: Revalidate current stable ground
        run: |
          node tools/validate-project-stable-ground-sg07.mjs
          node test/project-stable-ground-sg07.test.js
          node tools/build-project-stable-ground-sg09.mjs
          node tools/validate-project-stable-ground-sg08.mjs
          node test/project-stable-ground-sg08.test.js
          node tools/validate-project-stable-ground-sg09.mjs
          node test/project-stable-ground-sg09.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic SSC and SG-08 products
        run: |
          git restore --staged --worktree .
          npm run build:status-sovereignty
          node tools/build-poof-clifford-ecology.mjs
          node tools/build-project-stable-ground-sg09.mjs
          npm run validate:stable-ground
          git diff --exit-code -- \
            data/project/status-sovereignty-wave-01-release-manifest.json \
            data/project/status-sovereignty-wave-01-maintainer-review-release-manifest.json \
            data/project/status-sovereignty-wave-01-targeted-acquisition-release-manifest.json \
            data/project/status-sovereignty-release-manifest.json \
            data/project/poof-clifford-ecology-release-manifest.json \
            data/project/project-stable-ground-sg08-release-manifest.json \
            reports/core-thesis/stable-ground/sg08/checkpoint.json \
            reports/core-thesis/stable-ground/sg08/index.html
