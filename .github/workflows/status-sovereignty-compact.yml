name: Status-for-sovereignty compact

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/intake/status-sovereignty-*'
      - 'data/research/status-sovereignty-*'
      - 'data/project/status-sovereignty-*'
      - 'schemas/status-sovereignty-*'
      - 'docs/methods/status-sovereignty-*'
      - 'docs/milestones/m05-status-sovereignty-*'
      - 'tools/*status-sovereignty*'
      - 'test/status-sovereignty-*'
      - 'reports/core-thesis/status-sovereignty/**'
      - 'build/core-thesis/status-sovereignty/**'
      - 'data/project/core-thesis.json'
      - 'tools/build-core-thesis.mjs'
      - 'tools/validate-core-thesis.mjs'
      - 'test/core-thesis.test.js'
      - 'data/project/dca-h01-field-hypothesis.json'
      - 'data/project/m05-answerable-power-story-registry.json'
      - 'data/project/m05-answerable-power-fanout.json'
      - 'data/project/security-state-organism-program.json'
      - 'tools/build-pages.mjs'
      - 'tools/validate-pages.mjs'
      - 'package.json'
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg05*.json'
      - 'data/project/project-stable-ground-sg06*.json'
      - 'data/project/project-stable-ground-sg07*.json'
      - 'docs/milestones/project-stable-ground-sg06.md'
      - 'docs/milestones/project-stable-ground-sg07.md'
      - 'tools/build-project-stable-ground-sg06.mjs'
      - 'tools/build-project-stable-ground-sg07.mjs'
      - 'tools/validate-project-stable-ground-sg06.mjs'
      - 'tools/validate-project-stable-ground-sg07.mjs'
      - 'test/project-stable-ground-sg06.test.js'
      - 'test/project-stable-ground-sg07.test.js'
      - '.github/workflows/project-stable-ground-sg05.yml'
      - '.github/workflows/project-stable-ground-sg06.yml'
      - '.github/workflows/project-stable-ground-sg07.yml'
      - '.github/workflows/status-sovereignty-compact.yml'
      - '.github/workflows/status-sovereignty-wave-01.yml'
      - '.github/workflows/status-sovereignty-wave-01-review.yml'
  push:
    branches: [main]
    paths:
      - 'data/intake/status-sovereignty-*'
      - 'data/research/status-sovereignty-*'
      - 'data/project/status-sovereignty-*'
      - 'schemas/status-sovereignty-*'
      - 'docs/methods/status-sovereignty-*'
      - 'docs/milestones/m05-status-sovereignty-*'
      - 'tools/*status-sovereignty*'
      - 'test/status-sovereignty-*'
      - 'reports/core-thesis/status-sovereignty/**'
      - 'build/core-thesis/status-sovereignty/**'
      - 'data/project/core-thesis.json'
      - 'tools/build-core-thesis.mjs'
      - 'tools/validate-core-thesis.mjs'
      - 'test/core-thesis.test.js'
      - 'data/project/dca-h01-field-hypothesis.json'
      - 'data/project/m05-answerable-power-story-registry.json'
      - 'data/project/m05-answerable-power-fanout.json'
      - 'data/project/security-state-organism-program.json'
      - 'tools/build-pages.mjs'
      - 'tools/validate-pages.mjs'
      - 'package.json'
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg05*.json'
      - 'data/project/project-stable-ground-sg06*.json'
      - 'data/project/project-stable-ground-sg07*.json'
      - 'docs/milestones/project-stable-ground-sg06.md'
      - 'docs/milestones/project-stable-ground-sg07.md'
      - 'tools/build-project-stable-ground-sg06.mjs'
      - 'tools/build-project-stable-ground-sg07.mjs'
      - 'tools/validate-project-stable-ground-sg06.mjs'
      - 'tools/validate-project-stable-ground-sg07.mjs'
      - 'test/project-stable-ground-sg06.test.js'
      - 'test/project-stable-ground-sg07.test.js'
      - '.github/workflows/project-stable-ground-sg05.yml'
      - '.github/workflows/project-stable-ground-sg06.yml'
      - '.github/workflows/project-stable-ground-sg07.yml'
      - '.github/workflows/status-sovereignty-compact.yml'
      - '.github/workflows/status-sovereignty-wave-01.yml'
      - '.github/workflows/status-sovereignty-wave-01-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate SSC-H01 Wave 01
        run: |
          npm run build:status-sovereignty
          npm run validate:status-sovereignty
          node test/status-sovereignty-wave-01.test.js
          node test/status-sovereignty-compact.test.js
      - name: Revalidate joined constitutional surfaces
        run: |
          node tools/build-core-thesis.mjs
          node tools/validate-core-thesis.mjs
          node test/core-thesis.test.js
          node tools/build-dca-h01.mjs
          node tools/validate-dca-h01.mjs
          node test/dca-h01.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          node tools/validate-project-stable-ground-sg06.mjs
          node test/project-stable-ground-sg06.test.js
          node tools/build-project-stable-ground-sg07.mjs
          node tools/validate-project-stable-ground-sg07.mjs
          node test/project-stable-ground-sg07.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic SSC-H01 and SG-07 products
        run: |
          git restore --staged --worktree .
          npm run build:status-sovereignty
          node tools/build-core-thesis.mjs
          node tools/build-dca-h01.mjs
          node tools/build-m05-answerable-power.mjs
          node tools/build-security-state-organism.mjs
          node tools/build-project-stable-ground-sg07.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/build-poof-clifford-ecology.mjs
          git diff --exit-code -- \
            data/project/status-sovereignty-wave-01-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-01/manifest.json \
            build/core-thesis/status-sovereignty/wave-01/data.json \
            reports/core-thesis/status-sovereignty/wave-01/data.json \
            reports/core-thesis/status-sovereignty/wave-01/index.html \
            data/project/status-sovereignty-release-manifest.json \
            build/core-thesis/status-sovereignty/manifest.json \
            build/core-thesis/status-sovereignty/data.json \
            reports/core-thesis/status-sovereignty/data.json \
            reports/core-thesis/status-sovereignty/index.html \
            data/project/project-stable-ground-sg06-release-manifest.json \
            reports/core-thesis/stable-ground/sg06/checkpoint.json \
            reports/core-thesis/stable-ground/sg06/index.html \
            data/project/project-stable-ground-sg07-release-manifest.json \
            reports/core-thesis/stable-ground/sg07/checkpoint.json \
            reports/core-thesis/stable-ground/sg07/index.html \
            data/project/poof-clifford-ecology-release-manifest.json \
            reports/core-thesis/poof-clifford-ecology/release-manifest.json
