name: Materialize Counter-Selector Wave 32

on:
  push:
    branches:
      - 'agent/counter-selector-wave-32-candidate-handoff-application'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-32.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-32-candidate-handoff-application
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact carrier and unpack Wave 32 estate
        run: |
          set -euo pipefail
          cat > /tmp/wave32-expected-blobs <<'EOF'
          c9e2a34ea23393510f13f624eba0ac295771636a  .github/materializers/counter-selector-wave-32/payload-00
          30c2a346f030c74fdcb19c86ed253e4f84c93151  .github/materializers/counter-selector-wave-32/payload-01
          531ae1945a0464c753ee4b120037f473833362cd  .github/materializers/counter-selector-wave-32/payload-02
          ba80a7ad97ded3e796e96596d6529371571764b1  .github/materializers/counter-selector-wave-32/payload-03
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave32-expected-blobs
          cat .github/materializers/counter-selector-wave-32/payload-* | base64 --decode > /tmp/counter-selector-wave-32.tar.gz
          echo '8944beacb183f802a658228e71f372a0194759a9982c8cfaca0073dba1b98f5f  /tmp/counter-selector-wave-32.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-32.tar.gz -C .
      - name: Build, validate, and attack Wave 32
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-32.mjs
          node tools/validate-counter-selector-wave-32.mjs
          node test/counter-selector-wave-32.test.js
      - name: Commit exact permanent Wave 32 estate
        run: |
          set -euo pipefail
          rm -rf .github/materializers/counter-selector-wave-32
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-32/payload-00 \
            .github/materializers/counter-selector-wave-32/payload-01 \
            .github/materializers/counter-selector-wave-32/payload-02 \
            .github/materializers/counter-selector-wave-32/payload-03 \
            data/project/counter-selector-wave-32-candidate-handoff-application.json \
            data/project/counter-selector-wave-32-handoff-registry.json \
            data/project/counter-selector-wave-32-release-manifest.json \
            docs/methods/counter-selector-candidate-handoff-application.md \
            docs/milestones/counter-selector-wave-32.md \
            reports/core-thesis/counter-selector-wave-32/data.json \
            reports/core-thesis/counter-selector-wave-32/index.html \
            schemas/counter-selector-candidate-handoff-application.schema.json \
            test/counter-selector-wave-32.test.js \
            tools/build-counter-selector-wave-32.mjs \
            tools/validate-counter-selector-wave-32.mjs | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected staged paths' >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Apply Counter-Selector Wave 32 candidate handoff ladder'
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Wave 32 reconstruction
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-32.mjs
          node tools/validate-counter-selector-wave-32.mjs
          node test/counter-selector-wave-32.test.js
          git diff --exit-code -- \
            data/project/counter-selector-wave-32-handoff-registry.json \
            data/project/counter-selector-wave-32-release-manifest.json \
            reports/core-thesis/counter-selector-wave-32/data.json \
            reports/core-thesis/counter-selector-wave-32/index.html
          test -z "$(git status --porcelain)"
      - name: Publish permanent Wave 32 head
        run: git push origin HEAD:agent/counter-selector-wave-32-candidate-handoff-application
