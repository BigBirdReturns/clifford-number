          assert manifest['authority'] == authority
          assert len(manifest['files']) == 5
          combined = hashlib.sha256()
          for row in manifest['files']:
              assert set(row) == {'path', 'bytes', 'sha256'}
              assert row['path'] in source_members
              assert len(source[row['path']]) == row['bytes']
              assert digest(source[row['path']]) == row['sha256']
              combined.update(f"{row['sha256']}  {row['path']}\n".encode())
          assert manifest['combined_sha256'] == combined.hexdigest()

          # The source validator's generic key walker was invalid: it rejected
          # its own control keys `points_of_contact` and `state`. Privacy is
