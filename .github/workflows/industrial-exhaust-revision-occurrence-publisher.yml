      - name: Validate exact four-file product surface
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/lib/industrial-exhaust-artifacts.mjs
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            test/industrial-exhaust-artifacts.test.js \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust-artifacts.mjs \
            tools/lib/industrial-exhaust.mjs | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Publish qualified product commit
        env:
          EXPECTED_BASE: cdc9d3670fb226e92ff90952c3f8a4392c532a26
          PRODUCT_BRANCH: agent/industrial-exhaust-revision-occurrence-v1
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            test/industrial-exhaust-artifacts.test.js \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust-artifacts.mjs \
            tools/lib/industrial-exhaust.mjs
          git commit -m "fix(exhaust): bind recurring content to revision occurrences"
          local_tree="$(git rev-parse HEAD^{tree})"
          if remote_line="$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH")" && test -n "$remote_line"; then
            remote_sha="${remote_line%%$'\t'*}"
            git fetch --no-tags origin "$remote_sha"
            remote_tree="$(git rev-parse "$remote_sha^{tree}")"
            test "$remote_tree" = "$local_tree"
            echo "Existing product branch already carries the qualified tree: $remote_sha"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "Published product carrier $(git rev-parse HEAD) with tree $local_tree"
