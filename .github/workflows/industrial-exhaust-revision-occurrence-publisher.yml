name: Industrial exhaust revision-occurrence publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/industrial-exhaust-revision-occurrence-publisher.yml'
      - '.industrial-exhaust-revision-occurrence-trigger'

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/industrial-exhaust-revision-occurrence-controller-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize revision-occurrence repair on exact base
        env:
          EXPECTED_BASE: cdc9d3670fb226e92ff90952c3f8a4392c532a26
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git checkout --detach "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          base64 -d <<'PAYLOAD' | gzip -d > /tmp/revision-occurrence-patch.py
