name: Temporary PR 2231 observation-phone frontier V106
# Lease-bound execution of the content-addressed corrected controller.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-observation-phone-frontier-v106.yml'
      - '.github/tmp/pr2231-observation-phone-frontier-v106.sh.gz.b64'

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-observation-phone-frontier-v106
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: 405882b7f22fd3dc588a2237289f8550ed9525f9
      EXPECTED_PRODUCT_PARENT: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PR_BASE: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PRODUCT_TREE: 7ae48a2dc664c98f0e39f693d13a63fb4ee82224
      EXPECTED_LIBRARY_BLOB: 5e753c9c32cba270ea79b6299fc35db94cd0928f
      EXPECTED_TEST_BLOB: 069349ea792a8da8c5d67831ac2e73efc0ee82e9
      ARTIFACT_DIR: /tmp/pr2231-observation-phone-frontier-v106

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qualify and publish exact two-file successor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          controller_script=/tmp/pr2231-observation-phone-frontier-v106.sh
          base64 -d .github/tmp/pr2231-observation-phone-frontier-v106.sh.gz.b64 | gzip -dc > "$controller_script"
          controller_sha=$(sha256sum "$controller_script" | awk '{print $1}')
          [[ "$controller_sha" == "1ed38ec30663707e56292b4d18902e1f14894caca6d139b468f1cb0240dc872c" ]]
          {
            printf 'controller_script_sha256=%s\n' "$controller_sha"
            printf 'execution_payload=direct-corrected-controller\n'
            printf 'expected_main=%s\n' "$EXPECTED_MAIN"
            printf 'expected_product_parent=%s\n' "$EXPECTED_PRODUCT_PARENT"
            printf 'expected_pr_base=%s\n' "$EXPECTED_PR_BASE"
          } > "$ARTIFACT_DIR/controller-envelope.txt"
          bash "$controller_script"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-observation-phone-frontier-v106
          path: /tmp/pr2231-observation-phone-frontier-v106
          retention-days: 90
