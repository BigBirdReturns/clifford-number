name: Temporary PR 2231 live product qualification V108
# Read-only, lease-bound qualification of the already published exact product head, with explicit review-lease receipts.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-observation-phone-frontier-v106.yml'
      - '.github/tmp/pr2231-observation-phone-frontier-v106.sh.gz.b64'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-live-product-qualification-v108
  cancel-in-progress: false

jobs:
  qualify-live-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR_NUMBER: '2231'
      CONTROLLER_PR_NUMBER: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: edbf7027f5de312d77a91d615ecb8cad619ce154
      EXPECTED_PRODUCT_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT_TREE: efc92aba2de7088ad1e4a9b0514ccb9e8f498c47
      EXPECTED_LIBRARY_BLOB: cb6bcf21460d4d0cca0dcb29affb9424713399d0
      EXPECTED_TEST_BLOB: 96822fbd5ac213d03e2bdc91c92c7ddfc3931963
      PREDECESSOR_PRODUCT: 405882b7f22fd3dc588a2237289f8550ed9525f9
      REVIEW_COMMENT_IDS: '3888640534 3888640536 3888645507'
      ARTIFACT_DIR: /tmp/pr2231-live-product-v108
      PRODUCT_WT: /tmp/pr2231-live-product-v108-worktree

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify exact live two-file product
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          rm -rf "$PRODUCT_WT"

          fail() {
            printf 'FAIL: %s\n' "$*" >&2
            return 1
          }

          assert_eq() {
            local actual=$1
            local expected=$2
            local label=$3
            [[ "$actual" == "$expected" ]] \
              || fail "$label expected=$expected actual=$actual"
          }

          cleanup() {
            git worktree remove --force "$PRODUCT_WT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          qualification_terminal="$ARTIFACT_DIR/qualification-terminal.txt"
          on_error() {
            local rc=$1
            local failed_line=$2
            local failed_command=$3
            trap - ERR
            {
              printf 'qualification_exit=%s\n' "$rc"
              printf 'failed_line=%s\n' "$failed_line"
              printf 'failed_command=%q\n' "$failed_command"
            } > "$qualification_terminal"
            find "$ARTIFACT_DIR" -maxdepth 1 -type f \
              -printf '%f\t%s\n' | sort \
              > "$ARTIFACT_DIR/artifact-manifest.txt"
            exit "$rc"
          }
          trap 'on_error "$?" "$LINENO" "$BASH_COMMAND"' ERR

          fetch_refs() {
            git fetch --force origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
              "+refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH"
          }

          fetch_review_comment() {
            local comment_id=$1
            local phase=$2
            local final="$ARTIFACT_DIR/review-comment-$comment_id-$phase.json"
            local attempt
            local temporary
            local stderr_path

            for attempt in 1 2 3; do
              temporary="$ARTIFACT_DIR/review-comment-$comment_id-$phase-attempt-$attempt.tmp"
              stderr_path="$ARTIFACT_DIR/review-comment-$comment_id-$phase-attempt-$attempt.stderr"
              if gh api "repos/$REPO/pulls/comments/$comment_id" \
                  > "$temporary" 2> "$stderr_path"; then
                mv "$temporary" "$final"
                printf '%s\t%s\t%s\n' \
                  "$comment_id" "$phase" "$attempt" \
                  >> "$ARTIFACT_DIR/review-api-attempts.tsv"
                return 0
              fi
              sleep "$attempt"
            done
            fail "review comment API retrieval failed id=$comment_id phase=$phase"
          }

          capture_pr_state() {
            local phase=$1
            local product_json="$ARTIFACT_DIR/product-pr-$phase.json"
            local controller_json="$ARTIFAACT_DIR/controller-pr-$phase.json"
            local threads_json="$ARTIFACT_DIR/review-threads-$phase.json"
            local comment_ledger="$ARTIFAACT_DIR/review-comment-ledger-$phase.tsv"
            local thread_ledger="$ARTIFACT_DIR/review-thread-ledger-$phase.jsonl"

            gh api "repos/$REPO/pulls/$PRODUCT_PR_NUMBER" > "$product_json"
            jq -e --arg head "$EXPECTED_PRODUCT" '
              .state == "open"
              and .draft == true
              and .merged == false
              and .head.sha == $head
              and .head.ref == "agent/current-main-identifier-context-product-v1"
              and .base.ref == "main"
            ' "$product_json" >/dev/null

            gh api "repos/$REPO/pulls/$CONTROLLER_PR_NUMBER" > "$controller_json"
            jq -e --arg head "$EXPECTED_CONTROLLER" '
              .state == "open"
              and .draft == true
              and .merged == false
              and .head.sha == $head
              and .base.ref == "main"
            ' "$controller_json" >/dev/null

            gh api graphql \
              -f 'query=query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(last:100){nodes{id isResolved isOutdated comments(first:100){nodes{databaseId commit{oid}}}}}}}}' \
              -F owner=BigBirdReturns \
              -F name=clifford-number \
              -F number="$PRODUCT_PR_NUMBER" \
