name: Temporary PR 2231 observation-phone frontier V106
# Lease-bound execution with focused tests rooted in each qualified worktree.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-observation-phone-frontier-v106.yml'
      - '.github/tmp/pr2231-observation-phone-frontier-v106.sh.gz.b64'

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-observation-phone-frontier-v106
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: 405882b7f22fd3dc588a2237289f8550ed9525f9
      EXPECTED_PRODUCT_PARENT: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PR_BASE: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PRODUCT_TREE: 7ae48a2dc664c98f0e39f693d13a63fb4ee82224
      EXPECTED_LIBRARY_BLOB: 5e753c9c32cba270ea79b6299fc35db94cd0928f
      EXPECTED_TEST_BLOB: 069349ea792a8da8c5d67831ac2e73efc0ee82e9
      ARTIFACT_DIR: /tmp/pr2231-observation-phone-frontier-v106

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qualify and publish exact two-file successor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          qualification_terminal="$ARTIFACT_DIR/qualification-terminal.txt"
          trap 'rc=$?; failed_command=$BASH_COMMAND; failed_line=$LINENO; trap - ERR; { printf "qualification_exit=%s\n" "$rc"; printf "failed_line=%s\n" "$failed_line"; printf "failed_command=%q\n" "$failed_command"; } > "$qualification_terminal"; exit "$rc"' ERR

          controller_script=/tmp/pr2231-observation-phone-frontier-v106.sh
          base64 -d .github/tmp/pr2231-observation-phone-frontier-v106.sh.gz.b64 | gzip -dc > "$controller_script"
          original_sha=$(sha256sum "$controller_script" | awk '{print $1}')
          [[ "$original_sha" == "1ed38ec30663707e56292b4d18902e1f14894caca6d139b468f1cb0240dc872c" ]]
          {
            printf 'original_controller_script_sha256=%s\n' "$original_sha"
            grep -n -B24 -A40 -E \
              'FOCUSED_PRODUCT_STARTED|focused-source\.log|focused-main\.log' \
              "$controller_script" || true
          } > "$ARTIFACT_DIR/focused-blocks.txt"
          python3 - "$controller_script" 2> >(tee "$ARTIFACT_DIR/controller-patch-stderr.log" >&2) <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          source_old = r'''printf 'FOCUSED_PRODUCT_STARTED\n'
          for test_file in "$SOURCE_WT"/test/industrial-exhaust*.test.js; do
            node "$test_file"
          done | tee "$ARTIFACT_DIR/focused-source.log"
          printf 'FOCUSED_PRODUCT_SUCCESS\n'
          '''
          source_new = r'''printf 'FOCUSED_PRODUCT_STARTED\n'
          for test_file in "$SOURCE_WT"/test/industrial-exhaust*.test.js; do
            (
              cd "$SOURCE_WT"
              printf 'FOCUSED_TEST_CWD=%s FILE=%s\n' "$PWD" "${test_file#"$SOURCE_WT"/}"
              node "$test_file"
            )
          done | tee "$ARTIFACT_DIR/focused-source.log"
          printf 'FOCUSED_PRODUCT_SUCCESS\n'
          '''

          main_old = r'''for test_file in "$MAIN_WT"/test/industrial-exhaust*.test.js; do
            node "$test_file"
          done | tee "$ARTIFACT_DIR/focused-main.log"
          '''
          main_new = r'''for test_file in "$MAIN_WT"/test/industrial-exhaust*.test.js; do
            (
              cd "$MAIN_WT"
              printf 'FOCUSED_TEST_CWD=%s FILE=%s\n' "$PWD" "${test_file#"$MAIN_WT"/}"
              node "$test_file"
            )
          done | tee "$ARTIFACT_DIR/focused-main.log"
          '''

          for name, old, new in (
              ("source", source_old, source_new),
              ("main", main_old, main_new),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"focused {name} worktree repair count={count}, expected=1"
                  )
              text = text.replace(old, new)

          program_old = r'''text = text.replace(old_call, new_call)

          helper_marker = "function identifierContextNeedsExpansion(normalizedPrefix) {\n"
          '''
          program_new = r'''text = text.replace(old_call, new_call)

          old_boundary_call = (
              'intrinsicPhoneIntervalAfterDashBoundary(dashPhoneSource)'
          )
          new_boundary_call = (
              'intrinsicPhoneIntervalAfterObservationBoundary(dashPhoneSource)'
          )
          if text.count(old_boundary_call) != 1:
              raise SystemExit('cross-callback boundary call count mismatch')
          text = text.replace(old_boundary_call, new_boundary_call)

          helper_marker = "function identifierContextNeedsExpansion(normalizedPrefix) {\n"
          '''
          if text.count(program_old) != 1:
              raise SystemExit('controller boundary-call repair count mismatch')
          text = text.replace(program_old, program_new, 1)

          diagnostic_marker = r'''printf 'DIRECT_MATRIX_SUCCESS\n'

          printf 'FOCUSED_PRODUCT_STARTED\n'
          '''
          diagnostic_block = r'''printf 'DIRECT_MATRIX_SUCCESS\n'
          cp "$SOURCE_WT/tools/lib/industrial-exhaust.mjs" "$ARTIFACT_DIR/candidate-industrial-exhaust.mjs"
          cp "$SOURCE_WT/test/industrial-exhaust.test.js" "$ARTIFACT_DIR/candidate-industrial-exhaust.test.js"
          LIB_PATH="$SOURCE_WT/tools/lib/industrial-exhaust.mjs" node --input-type=module <<'NODE_CAP' \
            > "$ARTIFACT_DIR/candidate-cap-diagnostic.jsonl"
          import { pathToFileURL } from 'node:url';
          const { redactContactData } = await import(
            `${pathToFileURL(process.env.LIB_PATH).href}?cap=${Date.now()}`
          );
          const chain = 'GUID '.repeat(4000);
          for (const terminalObservation of [
            '90 people',
            '3.14',
            '12:30',
            '10-20 people',
            '2027-09-18'
          ]) {
            const input = `Phone ${chain}record id: 09012345678 2026-08-17 01 42 68 53 00 ${terminalObservation}`;
            const expected = `Phone ${chain}record id: [contact omitted] 2026-08-17 [contact omitted] ${terminalObservation}`;
            const actual = redactContactData(input);
            let prefix = 0;
            while (prefix < actual.length
                && prefix < expected.length
                && actual[prefix] === expected[prefix]) prefix += 1;
            let suffix = 0;
            while (suffix < actual.length - prefix
                && suffix < expected.length - prefix
                && actual[actual.length - 1 - suffix]
                  === expected[expected.length - 1 - suffix]) suffix += 1;
            const windowStart = Math.max(0, prefix - 96);
            console.log(JSON.stringify({
              terminalObservation,
              inputLength: input.length,
              actualLength: actual.length,
              expectedLength: expected.length,
              commonPrefix: prefix,
              commonSuffix: suffix,
              actualWindow: actual.slice(windowStart, Math.min(actual.length, prefix + 256)),
              expectedWindow: expected.slice(windowStart, Math.min(expected.length, prefix + 256)),
              actualTail: actual.slice(-256),
              expectedTail: expected.slice(-256)
            }));
          }
          NODE_CAP

          printf 'FOCUSED_PRODUCT_STARTED\n'
          '''
          if text.count(diagnostic_marker) != 1:
              raise SystemExit('candidate diagnostic insertion count mismatch')
          text = text.replace(diagnostic_marker, diagnostic_block, 1)

          path.write_text(text, encoding="utf-8")
          print("FOCUSED_WORKTREE_REPAIR_SUCCESS count=2")
          print("CROSS_CALLBACK_BOUNDARY_REPAIR_SUCCESS count=1")
          print("CANDIDATE_DIAGNOSTIC_INSERTION_SUCCESS count=1")
          PY
          controller_sha=$(sha256sum "$controller_script" | awk '{print $1}')
          {
            printf 'original_controller_script_sha256=%s\n' "$original_sha"
            printf 'controller_script_sha256=%s\n' "$controller_sha"
          } > "$ARTIFACT_DIR/controller-preflight.txt"
          [[ "$controller_sha" == "04d2abee8fab56867ef6cf54485c1b4004279bd040f20f7c02d023a85c0cee02" ]]
          {
            printf 'original_controller_script_sha256=%s\n' "$original_sha"
            printf 'controller_script_sha256=%s\n' "$controller_sha"
            printf 'execution_payload=corrected-controller-plus-candidate-diagnostic\n'
            printf 'expected_main=%s\n' "$EXPECTED_MAIN"
            printf 'expected_product_parent=%s\n' "$EXPECTED_PRODUCT_PARENT"
            printf 'expected_pr_base=%s\n' "$EXPECTED_PR_BASE"
          } > "$ARTIFACT_DIR/controller-envelope.txt"
          cp "$controller_script" "$ARTIFACT_DIR/controller-script.sh"
          grep -n -B80 -A140 -E \
            'intrinsicPhoneIntervalAfterDashBoundary|crossCallbackPhoneObservationBridge' \
            "$controller_script" > "$ARTIFACT_DIR/controller-symbols.txt" || true

          trace_path="$ARTIFACT_DIR/controller-trace.log"
          terminal_path="$ARTIFACT_DIR/controller-terminal.txt"
          set +e
          BASH_XTRACEFD=9 bash -x "$controller_script" 9>"$trace_path"
          controller_rc=$?
          set -e
          {
            printf 'controller_exit=%s\n' "$controller_rc"
            printf 'controller_script_sha256=%s\n' "$controller_sha"
            printf '%s\n' '--- TRACE TAIL ---'
            tail -n 240 "$trace_path" || true
          } > "$terminal_path"
          trap - ERR
          exit "$controller_rc"

      - name: Emit controller terminal diagnostic
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' '### V106 controller terminal diagnostic'
            for receipt in \
              focused-blocks.txt \
              candidate-cap-diagnostic.jsonl \
              controller-symbols.txt \
              controller-preflight.txt \
              controller-patch-stderr.log \
              qualification-terminal.txt \
              controller-terminal.txt; do
              printf '\n#### %s\n\n' "$receipt"
              printf '%s\n' '```text'
              if [[ -f "$ARTIFACT_DIR/$receipt" ]]; then
                tail -n 360 "$ARTIFACT_DIR/$receipt"
              else
                printf '%s\n' 'unavailable'
              fi
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-observation-phone-frontier-v106
          path: /tmp/pr2231-observation-phone-frontier-v106
          retention-days: 90
