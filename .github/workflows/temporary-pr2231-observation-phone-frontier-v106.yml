name: Temporary PR 2231 exact live qualification V109
# Read-only qualification of the exact live product and its unresolved review leases.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-observation-phone-frontier-v106.yml'
      - '.github/tmp/pr2231-observation-phone-frontier-v106.sh.gz.b64'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-exact-live-qualification-v109
  cancel-in-progress: false

jobs:
  qualify-live-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: edbf7027f5de312d77a91d615ecb8cad619ce154
      EXPECTED_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_TREE: efc92aba2de7088ad1e4a9b0514ccb9e8f498c47
      EXPECTED_LIBRARY: cb6bcf21460d4d0cca0dcb29affb9424713399d0
      EXPECTED_TEST: 96822fbd5ac213d03e2bdc91c92c7ddfc3931963
      REVIEW_PREDECESSOR: 405882b7f22fd3dc588a2237289f8550ed9525f9
      REVIEW_IDS: '3888640534 3888640536 3888645507'
      ARTIFACT_DIR: /tmp/pr2231-live-product-v109
      PRODUCT_WT: /tmp/pr2231-live-product-v109-worktree

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify exact live product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ARTIFACT_DIR" "$PRODUCT_WT"
          mkdir -p "$ARTIFACT_DIR"

          fail() { printf 'FAIL: %s\n' "$*" >&2; return 1; }
          eq() {
            local actual=$1 expected=$2 label=$3
            [[ "$actual" == "$expected" ]] || fail "$label expected=$expected actual=$actual"
          }
          cleanup() { git worktree remove --force "$PRODUCT_WT" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          terminal="$ARTIFACT_DIR/qualification-terminal.txt"
          on_error() {
            local rc=$1 line=$2 command=$3
            trap - ERR
            {
              printf 'qualification_exit=%s\n' "$rc"
              printf 'failed_line=%s\n' "$line"
              printf 'failed_command=%q\n' "$command"
            } > "$terminal"
            find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\t%s\n' \
              | sort > "$ARTIFACT_DIR/artifact-manifest.txt"
            exit "$rc"
          }
          trap 'on_error "$?" "$LINENO" "$BASH_COMMAND"' ERR

          fetch_refs() {
            git fetch --force origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
              "+refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH"
          }

          capture_state() {
            local phase=$1
            local product_json="$ARTIFACT_DIR/product-pr-$phase.json"
            local controller_json="$ARTIFACT_DIR/controller-pr-$phase.json"
            local threads_json="$ARTIFACT_DIR/review-threads-$phase.json"
            local comments_tsv="$ARTIFACT_DIR/review-comments-$phase.tsv"
            local threads_jsonl="$ARTIFACT_DIR/review-thread-ledger-$phase.jsonl"

            gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$product_json"
            jq -e --arg head "$EXPECTED_PRODUCT" '
              .state == "open" and .draft == true and .merged == false
              and .head.sha == $head
              and .head.ref == "agent/current-main-identifier-context-product-v1"
              and .base.ref == "main"
            ' "$product_json" >/dev/null

            gh api "repos/$REPO/pulls/$CONTROLLER_PR" > "$controller_json"
            jq -e --arg head "$EXPECTED_CONTROLLER" '
              .state == "open" and .draft == true and .merged == false
              and .head.sha == $head and .base.ref == "main"
            ' "$controller_json" >/dev/null

            gh api graphql \
              -f 'query=query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(last:100){nodes{id isResolved isOutdated comments(first:100){nodes{databaseId commit{oid}}}}}}}}' \
              -F owner=BigBirdReturns -F name=clifford-number -F number="$PRODUCT_PR" \
              > "$threads_json"

            printf 'id\toriginal_commit_id\tcommit_id\tpath\tpull_request_url\n' > "$comments_tsv"
            : > "$threads_jsonl"
            local id comment_json matching unresolved
            for id in $REVIEW_IDS; do
              comment_json="$ARTIFACT_DIR/review-comment-$id-$phase.json"
              gh api "repos/$REPO/pulls/comments/$id" > "$comment_json"
              jq -r '[.id,.original_commit_id,.commit_id,.path,.pull_request_url] | @tsv' \
                "$comment_json" >> "$comments_tsv"
              eq "$(jq -r '.id | tostring' "$comment_json")" "$id" "review id $id $phase"
              eq "$(jq -r '.original_commit_id // ""' "$comment_json")" \
                "$REVIEW_PREDECESSOR" "review predecessor $id $phase"
              eq "$(jq -r '.commit_id // ""' "$comment_json")" \
                "$EXPECTED_PRODUCT" "review current commit $id $phase"
              eq "$(jq -r '.path // ""' "$comment_json")" \
                'tools/lib/industrial-exhaust.mjs' "review path $id $phase"
              eq "$(jq -r '.pull_request_url // ""' "$comment_json")" \
                "https://api.github.com/repos/$REPO/pulls/$PRODUCT_PR" \
                "review PR $id $phase"

              jq -c --arg id "$id" '[
                .data.repository.pullRequest.reviewThreads.nodes[]
                | select(any(.comments.nodes[]; (.databaseId | tostring) == $id))
                | {id,isResolved,isOutdated,
                   comment_ids:[.comments.nodes[].databaseId],
                   comment_commits:[.comments.nodes[].commit.oid]}
              ]' "$threads_json" >> "$threads_jsonl"
              matching=$(jq -r --arg id "$id" '[
                .data.repository.pullRequest.reviewThreads.nodes[]
                | select(any(.comments.nodes[]; (.databaseId | tostring) == $id))
              ] | length' "$threads_json")
              unresolved=$(jq -r --arg id "$id" '[
                .data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved == false
                    and any(.comments.nodes[]; (.databaseId | tostring) == $id))
              ] | length' "$threads_json")
              eq "$matching" '1' "review thread count $id $phase"
              eq "$unresolved" '1' "unresolved review thread $id $phase"
            done
          }

          printf 'LEASE_BIND_STARTED\n'
          fetch_refs
          eq "$(git rev-parse refs/remotes/origin/main)" "$EXPECTED_MAIN" 'main lease'
          eq "$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")" \
            "$EXPECTED_PRODUCT" 'product lease'
          eq "$(git rev-parse "refs/remotes/origin/$CONTROLLER_BRANCH")" \
            "$EXPECTED_CONTROLLER" 'controller lease'
          capture_state before
          printf 'LEASE_BIND_SUCCESS\n'

          printf 'PRODUCT_TOPOLOGY_STARTED\n'
          mapfile -t parents < <(git rev-list --parents -n 1 "$EXPECTED_PRODUCT" | tr ' ' '\n')
          [[ "${#parents[@]}" -eq 2 ]] || fail "product parent field count=${#parents[@]}"
          eq "${parents[0]}" "$EXPECTED_PRODUCT" 'product commit'
          eq "${parents[1]}" "$EXPECTED_PARENT" 'product parent'
          eq "$EXPECTED_PARENT" "$EXPECTED_MAIN" 'parent/main identity'
          eq "$(git rev-parse "$EXPECTED_PRODUCT^{tree}")" "$EXPECTED_TREE" 'product tree'
          eq "$(git rev-parse "$EXPECTED_PRODUCT:tools/lib/industrial-exhaust.mjs")" \
            "$EXPECTED_LIBRARY" 'library blob'
          eq "$(git rev-parse "$EXPECTED_PRODUCT:test/industrial-exhaust.test.js")" \
            "$EXPECTED_TEST" 'test blob'
          mapfile -t paths < <(git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_PRODUCT" | sort)
          [[ "${#paths[@]}" -eq 2 ]] || fail "product path count=${#paths[@]}"
          eq "${paths[0]}" 'test/industrial-exhaust.test.js' 'first product path'
          eq "${paths[1]}" 'tools/lib/industrial-exhaust.mjs' 'second product path'
          printf '%s\n' "${paths[@]}" > "$ARTIFACT_DIR/product-paths.txt"
          git show --no-ext-diff --format=fuller --stat "$EXPECTED_PRODUCT" \
            > "$ARTIFACT_DIR/product-commit.txt"
          printf 'PRODUCT_TOPOLOGY_SUCCESS\n'

          git worktree add --detach "$PRODUCT_WT" "$EXPECTED_PRODUCT"

          printf 'DIRECT_MATRIX_STARTED\n'
          LIB_PATH="$PRODUCT_WT/tools/lib/industrial-exhaust.mjs" \
            node --input-type=module <<'NODE' \
            | tee "$ARTIFACT_DIR/direct-matrix.jsonl"
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';
          const { redactContactData } = await import(
            `${pathToFileURL(process.env.LIB_PATH).href}?qualification=${Date.now()}`
          );
          const cases = [
            ['Archive 3.14/03-6216-8041', 'Archive 3.14/[contact omitted]'],
            ['Archive 3.14.03-6216-8041', 'Archive 3.14.[contact omitted]'],
            ['Archive 12:30:45/03-6216-8041', 'Archive 12:30:45/[contact omitted]'],
            ['Archive 62-16-03-6216-8041', 'Archive 62-16-[contact omitted]'],
            ['Archive +81 3 6216 8041–2027-09-18', 'Archive [contact omitted]–2027-09-18'],
            ['電話：＋８１ ３ ６２１６ ８０４１－２０２７－０９－１８', '電話：[contact omitted]－２０２７－０９－１８']
          ];
          for (const [input, expected] of cases) {
            const actual = redactContactData(input);
            console.log(JSON.stringify({ input, actual, expected }));
            assert.equal(actual, expected);
          }
          const chain = 'GUID '.repeat(4000);
          for (const observation of ['90 people','3.14','12:30','10-20 people','2027-09-18']) {
            const input = `Phone ${chain}record id: 09012345678 2026-08-17 01 42 68 53 00 ${observation}`;
            const expected = `Phone ${chain}record id: [contact omitted] 2026-08-17 [contact omitted] ${observation}`;
            const actual = redactContactData(input);
            console.log(JSON.stringify({observation,equal:actual===expected,
              actualTail:actual.slice(-256),expectedTail:expected.slice(-256)}));
            assert.equal(actual, expected, 'bounded cap must preserve terminal observation');
          }
          NODE
          printf 'DIRECT_MATRIX_SUCCESS\n'

          printf 'FOCUSED_PRODUCT_STARTED\n'
          for test_file in "$PRODUCT_WT"/test/industrial-exhaust*.test.js; do
            (
              cd "$PRODUCT_WT"
              printf 'FOCUSED_TEST_CWD=%s FILE=%s\n' "$PWD" "${test_file#"$PRODUCT_WT"/}"
              node "$test_file"
            )
          done | tee "$ARTIFACT_DIR/focused-product.log"
          printf 'FOCUSED_PRODUCT_SUCCESS\n'

          printf 'RELEASE_CHECK_STARTED\n'
          (
            cd "$PRODUCT_WT"
            [[ ! -f package-lock.json ]] || npm ci --ignore-scripts
            npm run release:check
          ) | tee "$ARTIFACT_DIR/release-check.log"
          printf 'RELEASE_CHECK_SUCCESS\n'

          git -C "$PRODUCT_WT" status --porcelain=v1 > "$ARTIFACT_DIR/post-release-status.txt"
          git -C "$PRODUCT_WT" restore --staged --worktree -- .
          git -C "$PRODUCT_WT" clean -fd
          [[ -z "$(git -C "$PRODUCT_WT" status --porcelain=v1)" ]] \
            || fail 'product worktree did not restore cleanly'
          eq "$(git -C "$PRODUCT_WT" rev-parse HEAD)" "$EXPECTED_PRODUCT" 'restored product head'
          eq "$(git -C "$PRODUCT_WT" rev-parse HEAD^{tree})" "$EXPECTED_TREE" 'restored product tree'
          printf 'GENERATED_STATE_RESTORED\n'

          printf 'FINAL_LEASE_REVALIDATION_STARTED\n'
          fetch_refs
          eq "$(git rev-parse refs/remotes/origin/main)" "$EXPECTED_MAIN" 'final main lease'
          eq "$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")" \
            "$EXPECTED_PRODUCT" 'final product lease'
          eq "$(git rev-parse "refs/remotes/origin/$CONTROLLER_BRANCH")" \
            "$EXPECTED_CONTROLLER" 'final controller lease'
          capture_state after
          printf 'FINAL_LEASE_REVALIDATION_SUCCESS\n'

          jq -n \
            --arg main "$EXPECTED_MAIN" --arg product "$EXPECTED_PRODUCT" \
            --arg parent "$EXPECTED_PARENT" --arg tree "$EXPECTED_TREE" \
            --arg library "$EXPECTED_LIBRARY" --arg test "$EXPECTED_TEST" \
            --arg controller "$EXPECTED_CONTROLLER" \
            '{qualification:"success",main:$main,product:$product,parent:$parent,
              tree:$tree,library_blob:$library,test_blob:$test,controller:$controller,
              paths:["test/industrial-exhaust.test.js","tools/lib/industrial-exhaust.mjs"],
              gates:["direct-matrix","focused-industrial-exhaust","release-check",
                     "final-lease-revalidation"]}' > "$ARTIFACT_DIR/summary.json"
          trap - ERR
          {
            printf 'qualification_exit=0\n'
            printf 'qualification=success\n'
            printf 'product=%s\n' "$EXPECTED_PRODUCT"
          } > "$terminal"
          printf 'QUALIFICATION_SUCCESS\n'

      - name: Emit exact qualification diagnostic
        if: always()
        shell: bash
        run: |
          upload=/tmp/pr2231-live-product-v109-upload
          rm -rf "$upload"
          mkdir -p "$ARTIFACT_DIR" "$upload"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$ARTIFACT_DIR/artifact-manifest.txt"
          cp -a "$ARTIFACT_DIR"/. "$upload"/
          find "$upload" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$upload/upload-manifest.txt"
          {
            printf '%s\n' '### PR 2231 exact live qualification V109'
            for receipt in summary.json qualification-terminal.txt artifact-manifest.txt \
              review-comments-before.tsv review-thread-ledger-before.jsonl \
              review-comments-after.tsv review-thread-ledger-after.jsonl \
              product-paths.txt direct-matrix.jsonl focused-product.log \
              release-check.log post-release-status.txt; do
              printf '\n#### %s\n\n```text\n' "$receipt"
              [[ ! -f "$ARTIFACT_DIR/$receipt" ]] \
                || tail -n 360 "$ARTIFACT_DIR/$receipt"
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-exact-live-qualification-v109
          path: /tmp/pr2231-live-product-v109-upload
          retention-days: 90
