name: Temporary PR 2231 live product qualification V107
# Read-only, lease-bound qualification of the already published exact product head.

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-observation-phone-frontier-v106.yml'
      - '.github/tmp/pr2231-observation-phone-frontier-v106.sh.gz.b64'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-live-product-qualification-v107
  cancel-in-progress: false

jobs:
  qualify-live-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR_NUMBER: '2231'
      CONTROLLER_PR_NUMBER: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: 43588313351e9dceebe2bff3fd05f7088b384534
      EXPECTED_PRODUCT_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT_TREE: efc92aba2de7088ad1e4a9b0514ccb9e8f498c47
      EXPECTED_LIBRARY_BLOB: cb6bcf21460d4d0cca0dcb29affb9424713399d0
      EXPECTED_TEST_BLOB: 96822fbd5ac213d03e2bdc91c92c7ddfc3931963
      PREDECESSOR_PRODUCT: 405882b7f22fd3dc588a2237289f8550ed9525f9
      REVIEW_COMMENT_IDS: '3888640534 3888640536 3888645507'
      ARTIFACT_DIR: /tmp/pr2231-live-product-v107
      PRODUCT_WT: /tmp/pr2231-live-product-v107-worktree

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify exact live two-file product
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          rm -rf "$PRODUCT_WT"

          fail() {
            printf 'FAIL: %s\n' "$*" >&2
            return 1
          }

          assert_eq() {
            local actual=$1
            local expected=$2
            local label=$3
            [[ "$actual" == "$expected" ]] \
              || fail "$label expected=$expected actual=$actual"
          }

          cleanup() {
            git worktree remove --force "$PRODUCT_WT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          qualification_terminal="$ARTIFACT_DIR/qualification-terminal.txt"
          trap 'rc=$?; failed_command=$BASH_COMMAND; failed_line=$LINENO; trap - ERR; { printf "qualification_exit=%s\n" "$rc"; printf "failed_line=%s\n" "$failed_line"; printf "failed_command=%q\n" "$failed_command"; } > "$qualification_terminal"; exit "$rc"' ERR

          fetch_refs() {
            git fetch --force origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
              "+refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH"
          }

          capture_pr_state() {
            local phase=$1
            local product_json="$ARTIFACT_DIR/product-pr-$phase.json"
            local controller_json="$ARTIFACT_DIR/controller-pr-$phase.json"
            local threads_json="$ARTIFACT_DIR/review-threads-$phase.json"

            gh api "repos/$REPO/pulls/$PRODUCT_PR_NUMBER" > "$product_json"
            jq -e --arg head "$EXPECTED_PRODUCT" '
              .state == "open"
              and .draft == true
              and .merged == false
              and .head.sha == $head
              and .head.ref == "agent/current-main-identifier-context-product-v1"
              and .base.ref == "main"
            ' "$product_json" >/dev/null

            gh api "repos/$REPO/pulls/$CONTROLLER_PR_NUMBER" > "$controller_json"
            jq -e --arg head "$EXPECTED_CONTROLLER" '
              .state == "open"
              and .draft == true
              and .merged == false
              and .head.sha == $head
              and .base.ref == "main"
            ' "$controller_json" >/dev/null

            gh api graphql \
              -f 'query=query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(last:100){nodes{id isResolved isOutdated comments(first:100){nodes{databaseId commit{oid}}}}}}}}' \
              -F owner=BigBirdReturns \
              -F name=clifford-number \
              -F number="$PRODUCT_PR_NUMBER" \
              > "$threads_json"

            for comment_id in $REVIEW_COMMENT_IDS; do
              gh api "repos/$REPO/pulls/comments/$comment_id" \
                > "$ARTIFACT_DIR/review-comment-$comment_id-$phase.json"
              jq -e \
                --argjson id "$comment_id" \
                --arg predecessor "$PREDECESSOR_PRODUCT" '
                  .id == $id
                  and .original_commit_id == $predecessor
                ' "$ARTIFACT_DIR/review-comment-$comment_id-$phase.json" \
                >/dev/null
              jq -e --argjson id "$comment_id" '
                any(.data.repository.pullRequest.reviewThreads.nodes[];
                  .isResolved == false
                  and any(.comments.nodes[]; .databaseId == $id)
                )
              ' "$threads_json" >/dev/null
            done
          }

          printf 'LEASE_BIND_STARTED\n'
          fetch_refs
          assert_eq "$(git rev-parse refs/remotes/origin/main)" \
            "$EXPECTED_MAIN" 'main lease'
          assert_eq "$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")" \
            "$EXPECTED_PRODUCT" 'product lease'
          assert_eq "$(git rev-parse "refs/remotes/origin/$CONTROLLER_BRANCH")" \
            "$EXPECTED_CONTROLLER" 'controller lease'
          capture_pr_state before
          printf 'LEASE_BIND_SUCCESS\n'

          printf 'PRODUCT_TOPOLOGY_STARTED\n'
          mapfile -t parent_fields < <(
            git rev-list --parents -n 1 "$EXPECTED_PRODUCT" | tr ' ' '\n'
          )
          [[ "${#parent_fields[@]}" -eq 2 ]] \
            || fail "product parent count=${#parent_fields[@]} expected=2 fields"
          assert_eq "${parent_fields[0]}" "$EXPECTED_PRODUCT" 'product commit'
          assert_eq "${parent_fields[1]}" "$EXPECTED_PRODUCT_PARENT" 'product parent'
          assert_eq "$EXPECTED_PRODUCT_PARENT" "$EXPECTED_MAIN" \
            'product parent/main identity'
          assert_eq "$(git rev-parse "$EXPECTED_PRODUCT^{tree}")" \
            "$EXPECTED_PRODUCT_TREE" 'product tree'
          assert_eq "$(git rev-parse "$EXPECTED_PRODUCT:tools/lib/industrial-exhaust.mjs")" \
            "$EXPECTED_LIBRARY_BLOB" 'library blob'
          assert_eq "$(git rev-parse "$EXPECTED_PRODUCT:test/industrial-exhaust.test.js")" \
            "$EXPECTED_TEST_BLOB" 'test blob'

          mapfile -t product_paths < <(
            git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_PRODUCT" | sort
          )
          [[ "${#product_paths[@]}" -eq 2 ]] \
            || fail "product path count=${#product_paths[@]} expected=2"
          assert_eq "${product_paths[0]}" 'test/industrial-exhaust.test.js' \
            'first product path'
          assert_eq "${product_paths[1]}" 'tools/lib/industrial-exhaust.mjs' \
            'second product path'
          printf '%s\n' "${product_paths[@]}" > "$ARTIFACT_DIR/product-paths.txt"
          git show --no-ext-diff --format=fuller --stat "$EXPECTED_PRODUCT" \
            > "$ARTIFACT_DIR/product-commit.txt"
          printf 'PRODUCT_TOPOLOGY_SUCCESS\n'

          git worktree add --detach "$PRODUCT_WT" "$EXPECTED_PRODUCT"

          printf 'DIRECT_MATRIX_STARTED\n'
          LIB_PATH="$PRODUCT_WT/tools/lib/industrial-exhaust.mjs" \
            node --input-type=module <<'NODE' \
            | tee "$ARTIFACT_DIR/direct-matrix.jsonl"
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';

          const { redactContactData } = await import(
            `${pathToFileURL(process.env.LIB_PATH).href}?qualification=${Date.now()}`
          );

          const directCases = [
            ['Archive 3.14/03-6216-8041', 'Archive 3.14/[contact omitted]'],
            ['Archive 3.14.03-6216-8041', 'Archive 3.14.[contact omitted]'],
            ['Archive 12:30:45/03-6216-8041', 'Archive 12:30:45/[contact omitted]'],
            ['Archive 62-16-03-6216-8041', 'Archive 62-16-[contact omitted]'],
            ['Archive +81 3 6216 8041–2027-09-18', 'Archive [contact omitted]–2027-09-18'],
            ['電話：＋８１ ３ ６２１６ ８０４１－２０２７－０９－１８', '電話：[contact omitted]－２０２７－０９－１８']
          ];
          for (const [input, expected] of directCases) {
            const actual = redactContactData(input);
            console.log(JSON.stringify({ input, actual, expected }));
            assert.equal(actual, expected);
          }

          const chain = 'GUID '.repeat(4000);
          for (const terminalObservation of [
            '90 people',
            '3.14',
            '12:30',
            '10-20 people',
            '2027-09-18'
          ]) {
            const input = `Phone ${chain}record id: 09012345678 2026-08-17 01 42 68 53 00 ${terminalObservation}`;
            const expected = `Phone ${chain}record id: [contact omitted] 2026-08-17 [contact omitted] ${terminalObservation}`;
            const actual = redactContactData(input);
            console.log(JSON.stringify({
              terminalObservation,
              inputLength: input.length,
              actualLength: actual.length,
              expectedLength: expected.length,
              equal: actual === expected,
              actualTail: actual.slice(-256),
              expectedTail: expected.slice(-256)
            }));
            assert.equal(
              actual,
              expected,
              'candidate-specific observation cap must preserve the terminal observation'
            );
          }
          NODE
          printf 'DIRECT_MATRIX_SUCCESS\n'

          printf 'FOCUSED_PRODUCT_STARTED\n'
          for test_file in "$PRODUCT_WT"/test/industrial-exhaust*.test.js; do
            (
              cd "$PRODUCT_WT"
              printf 'FOCUSED_TEST_CWD=%s FILE=%s\n' \
                "$PWD" "${test_file#"$PRODUCT_WT"/}"
              node "$test_file"
            )
          done | tee "$ARTIFACT_DIR/focused-product.log"
          printf 'FOCUSED_PRODUCT_SUCCESS\n'

          printf 'RELEASE_CHECK_STARTED\n'
          (
            cd "$PRODUCT_WT"
            if [[ -f package-lock.json ]]; then
              npm ci --ignore-scripts
            else
              printf 'INSTALL_SKIPPED_NO_LOCKFILE\n'
            fi
            npm run release:check
          ) | tee "$ARTIFACT_DIR/release-check.log"
          printf 'RELEASE_CHECK_SUCCESS\n'

          git -C "$PRODUCT_WT" status --porcelain=v1 \
            > "$ARTIFACT_DIR/post-release-status.txt"
          git -C "$PRODUCT_WT" restore --staged --worktree -- .
          git -C "$PRODUCT_WT" clean -fd
          [[ -z "$(git -C "$PRODUCT_WT" status --porcelain=v1)" ]] \
            || fail 'product worktree did not restore cleanly'
          assert_eq "$(git -C "$PRODUCT_WT" rev-parse HEAD)" \
            "$EXPECTED_PRODUCT" 'restored product head'
          assert_eq "$(git -C "$PRODUCT_WT" rev-parse HEAD^{tree})" \
            "$EXPECTED_PRODUCT_TREE" 'restored product tree'
          printf 'GENERATED_STATE_RESTORED\n'

          printf 'FINAL_LEASE_REVALIDATION_STARTED\n'
          fetch_refs
          assert_eq "$(git rev-parse refs/remotes/origin/main)" \
            "$EXPECTED_MAIN" 'final main lease'
          assert_eq "$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")" \
            "$EXPECTED_PRODUCT" 'final product lease'
          assert_eq "$(git rev-parse "refs/remotes/origin/$CONTROLLER_BRANCH")" \
            "$EXPECTED_CONTROLLER" 'final controller lease'
          capture_pr_state after
          printf 'FINAL_LEASE_REVALIDATION_SUCCESS\n'

          jq -n \
            --arg main "$EXPECTED_MAIN" \
            --arg product "$EXPECTED_PRODUCT" \
            --arg parent "$EXPECTED_PRODUCT_PARENT" \
            --arg tree "$EXPECTED_PRODUCT_TREE" \
            --arg library_blob "$EXPECTED_LIBRARY_BLOB" \
            --arg test_blob "$EXPECTED_TEST_BLOB" \
            --arg controller "$EXPECTED_CONTROLLER" \
            '{
              qualification:"success",
              main:$main,
              product:$product,
              parent:$parent,
              tree:$tree,
              library_blob:$library_blob,
              test_blob:$test_blob,
              controller:$controller,
              product_paths:[
                "test/industrial-exhaust.test.js",
                "tools/lib/industrial-exhaust.mjs"
              ],
              gates:[
                "direct-matrix",
                "focused-industrial-exhaust",
                "release-check",
                "final-lease-revalidation"
              ]
            }' > "$ARTIFACT_DIR/summary.json"

          trap - ERR
          {
            printf 'qualification_exit=0\n'
            printf 'qualification=success\n'
            printf 'product=%s\n' "$EXPECTED_PRODUCT"
          } > "$qualification_terminal"
          printf 'QUALIFICATION_SUCCESS\n'

      - name: Emit live product qualification diagnostic
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' '### PR 2231 live product qualification V107'
            for receipt in \
              summary.json \
              qualification-terminal.txt \
              product-paths.txt \
              direct-matrix.jsonl \
              focused-product.log \
              release-check.log \
              post-release-status.txt; do
              printf '\n#### %s\n\n' "$receipt"
              printf '%s\n' '```text'
              if [[ -f "$ARTIFACT_DIR/$receipt" ]]; then
                tail -n 360 "$ARTIFACT_DIR/$receipt"
              else
                printf '%s\n' 'unavailable'
              fi
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-live-product-qualification-v107
          path: /tmp/pr2231-live-product-v107
          retention-days: 90
