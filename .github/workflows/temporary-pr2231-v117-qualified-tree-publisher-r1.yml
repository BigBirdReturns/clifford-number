name: Temporary PR 2231 V117 qualified-tree publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: pr2231-v117-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-qualified-v117:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PUBLISHER: ${{ github.event.pull_request.head.sha }}
      PUBLISHER_PR: ${{ github.event.pull_request.number }}
      PUBLISHER_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and execute exact V117 publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=BigBirdReturns/clifford-number
          root=/tmp/pr2231-v117-publisher-envelope
          receipt=/tmp/pr2231-v117-publication
          payload="$root/publisher-v117.sh.xz"
          script="$root/publisher-v117.sh"
          wrapper_log="$root/publisher-wrapper.log"
          rm -rf "$root" "$receipt"
          mkdir -p "$root"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1
          preserve() {
            rc=$?
            trap - EXIT
            set +e
            mkdir -p "$receipt/wrapper"
            install -m 0644 "$wrapper_log" "$receipt/wrapper/publisher-wrapper.log"
            printf '%s\n' \
              'controller_envelope=v117-publisher-wrapper-r1' \
              "outer_status=$rc" \
              > "$receipt/wrapper/wrapper-status.env"
            find "$receipt" -type f -printf '%P\t%s\n' | sort \
              > "$receipt/wrapper/final-manifest.txt"
            exit "$rc"
          }
          trap preserve EXIT

          blob=8c478caa796f266b93cdc715224c9f75655430e5
          expected_size=4184
          expected_sha=96eb0473b78f94270192c88e3eac41cfbf8ef07cb6cadd3bf09503dffdb96176
          gh api -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$repo/git/blobs/$blob" --jq '.content' \
            | tr -d '\n' | base64 -d > "$payload"
          [[ "$(wc -c < "$payload")" == "$expected_size" ]]
          [[ "$(git hash-object "$payload")" == "$blob" ]]
          [[ "$(sha256sum "$payload" | awk '{print $1}')" == "$expected_sha" ]]
          xz -t "$payload"
          xz -dc "$payload" > "$script"
          [[ "$(wc -c < "$script")" == 16030 ]]
          [[ "$(git hash-object "$script")" == 7b921563da13222e988b8d1800f12d1834cd6730 ]]
          [[ "$(sha256sum "$script" | awk '{print $1}')" == c095bb9583c1b67683164a2ae4ab74add263085339dba08961021f140842d29e ]]
          chmod +x "$script"
          bash -n "$script"
          bash "$script"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v117-qualified-tree-publication-r1
          path: /tmp/pr2231-v117-publication
          retention-days: 90
