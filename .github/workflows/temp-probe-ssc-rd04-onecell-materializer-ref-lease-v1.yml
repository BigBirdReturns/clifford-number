name: TEMP probe RD-04 one-cell materializer ref lease v1

on:
  pull_request:
    branches:
      - 'agent/ssc-rd04-onecell-materializer-ref-probe-base-v1'
    types: [opened, synchronize, reopened]
    paths:
      - '.tmp/rd04-onecell-materializer-ref-probe-v1.trigger.json'

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'agent/ssc-rd04-onecell-materializer-ref-probe-base-v1' &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-onecell-materializer-ref-probe-trigger-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Capture exact ref observations
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/rd04-onecell-materializer-ref-probe-v1"
          mkdir -p "$OUT"
          base_branch='agent/ssc-rd04-onecell-materializer-ref-probe-base-v1'
          trigger_branch='agent/ssc-rd04-onecell-materializer-ref-probe-trigger-v1'
          staging_branch='staging/ssc-rd04-postpromotion-nd-one-cell-promotion-v1'
          main_value="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          base_value="$(git ls-remote --heads origin "refs/heads/$base_branch" | awk '{print $1}')"
          trigger_value="$(git ls-remote --heads origin "refs/heads/$trigger_branch" | awk '{print $1}')"
          staging_value="$(git ls-remote --heads origin "refs/heads/$staging_branch" | awk '{print $1}')"
          jq -n \
            --arg event_base_ref '${{ github.event.pull_request.base.ref }}' \
            --arg event_base_sha '${{ github.event.pull_request.base.sha }}' \
            --arg event_head_ref '${{ github.event.pull_request.head.ref }}' \
            --arg event_head_sha '${{ github.event.pull_request.head.sha }}' \
            --arg checkout_head "$(git rev-parse HEAD)" \
            --arg checkout_parent "$(git rev-parse HEAD^)" \
            --arg main "$main_value" \
            --arg base "$base_value" \
            --arg trigger "$trigger_value" \
            --arg staging "$staging_value" \
            '{event_base_ref:$event_base_ref,event_base_sha:$event_base_sha,event_head_ref:$event_head_ref,event_head_sha:$event_head_sha,checkout_head:$checkout_head,checkout_parent:$checkout_parent,remote_main:$main,remote_base:$base,remote_trigger:$trigger,remote_staging:(if $staging=="" then null else $staging end)}' > "$OUT/receipt.json"
          cat "$OUT/receipt.json"
          (cd "$OUT" && sha256sum receipt.json > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rd04-onecell-materializer-ref-probe-v1
          path: ${{ runner.temp }}/rd04-onecell-materializer-ref-probe-v1
          if-no-files-found: error
          retention-days: 30
