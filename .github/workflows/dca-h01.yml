name: DCA-H01 field hypothesis

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/dca-h01-*.json'
      - 'schemas/dca-field-record.schema.json'
      - 'docs/methods/distributed-counterpower-aversion.md'
      - 'docs/milestones/m05-dca-h01-field-hypothesis.md'
      - 'tools/build-dca-h01.mjs'
      - 'tools/validate-dca-h01.mjs'
      - 'test/dca-h01.test.js'
      - 'reports/core-thesis/distributed-counterpower-aversion/**'
      - '.github/workflows/dca-h01.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/dca-h01-*.json'
      - 'schemas/dca-field-record.schema.json'
      - 'docs/methods/distributed-counterpower-aversion.md'
      - 'docs/milestones/m05-dca-h01-field-hypothesis.md'
      - 'tools/build-dca-h01.mjs'
      - 'tools/validate-dca-h01.mjs'
      - 'test/dca-h01.test.js'
      - 'reports/core-thesis/distributed-counterpower-aversion/**'
      - '.github/workflows/dca-h01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and attack DCA-H01
        run: |
          node tools/build-dca-h01.mjs
          node tools/validate-dca-h01.mjs
          node test/dca-h01.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic DCA-H01 products
        run: |
          git restore --staged --worktree .
          node tools/build-dca-h01.mjs
          node tools/validate-dca-h01.mjs
          node test/dca-h01.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
