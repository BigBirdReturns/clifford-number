name: Finalize Counter-Selector Wave 07 canonical state

on:
  push:
    branches:
      - 'agent/counter-selector-wave-07-finalize'
    paths:
      - '.github/workflows/finalize-counter-selector-wave-07.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: BigBirdReturns/clifford-number
  SOURCE_BRANCH: agent/counter-selector-wave-07-b02-acquisition-v3

jobs:
  verify-or-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Allow the publisher to finish, then complete a validated open PR if necessary
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          git fetch origin main "$SOURCE_BRANCH" || true
          if ! git cat-file -e origin/main:tools/build-counter-selector-wave-07.mjs 2>/dev/null; then
            pr="$(gh pr list --repo "$REPO" --head "$SOURCE_BRANCH" --state open --json number --jq '.[0].number // empty')"
            test -n "$pr"
            git checkout -B wave07 origin/$SOURCE_BRANCH
            test ! -e .github/workflows/materialize-counter-selector-wave-07.yml
            test ! -d .github/materializers/counter-selector-wave-07
            node tools/build-counter-selector-wave-07.mjs
            node tools/validate-counter-selector-wave-07.mjs
            node test/counter-selector-wave-07.test.js
            npm run release:check
            git diff --exit-code
            test -z "$(git status --porcelain)"
            head="$(git rev-parse HEAD)"
            for context in 'Counter-Selector Wave 07 Batch 02 acquisition' 'Release checks' 'Core thesis and estate alignment'; do
              gh api --method POST "repos/$REPO/statuses/$head" -f state=success -f context="$context" -f description='Validated by canonical finalizer' -f target_url="https://github.com/$REPO/actions/runs/${{ github.run_id }}" >/dev/null
            done
            gh pr ready "$pr" --repo "$REPO" || true
            if ! gh pr merge "$pr" --repo "$REPO" --squash --admin --subject 'Acquire Counter-Selector Wave 07 Batch 02 artifacts' --body 'Four bounded packets, two explicit partials, zero field-test or ranking authority.'; then
              gh api --method PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash -f commit_title='Acquire Counter-Selector Wave 07 Batch 02 artifacts' -f commit_message='Four bounded packets, two explicit partials, zero field-test or ranking authority.' >/tmp/merge.json
            fi
          fi

      - name: Validate exact canonical main and publish receipt status
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          test -f tools/build-counter-selector-wave-07.mjs
          test -f data/project/counter-selector-wave-07-release-manifest.json
          test ! -e .github/workflows/materialize-counter-selector-wave-07.yml
          test ! -d .github/materializers/counter-selector-wave-07
          node tools/build-counter-selector-wave-07.mjs
          node tools/validate-counter-selector-wave-07.mjs
          node test/counter-selector-wave-07.test.js
          npm run release:check
          git diff --exit-code
          test -z "$(git status --porcelain)"
          main_sha="$(git rev-parse HEAD)"
          digest="$(node -e "console.log(require('./data/project/counter-selector-wave-07-release-manifest.json').combined_sha256)")"
          gh api --method POST "repos/$REPO/statuses/$main_sha" -f state=success -f context='Counter-Selector Wave 07 canonical verification' -f description='Canonical main rebuilt and validated cleanly' -f target_url="https://github.com/$REPO/actions/runs/${{ github.run_id }}" >/dev/null
          pr="$(gh pr list --repo "$REPO" --head "$SOURCE_BRANCH" --state all --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr comment "$pr" --repo "$REPO" --body "Independent finalizer rebuilt canonical \`main\` at \`$main_sha\`, passed the complete release gate and 30 mutation refusals, and verified release digest \`$digest\`."
          fi

      - name: Retire finalizer branch
        if: success()
        run: git push origin --delete agent/counter-selector-wave-07-finalize
