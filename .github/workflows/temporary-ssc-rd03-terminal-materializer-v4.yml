name: TEMP materialize exact RD-03 terminal closure v4

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd03-terminal-materializer-v4.yml'
      - '.rd03-v4/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd03-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd03-terminal-materializer-trigger-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd03-terminal-materializer-base-v4
          path: control
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd03-negotiated-terms
          path: work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct and execute exact materializer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : > /tmp/rd03-v4-helper.gz.b64
          cat > /tmp/rd03-v4-helper-parts.tsv <<'EOF'
          part-00.b64	3000	df83abd6f4fac7be4b9ce20d356a7a71546fc43a6766050d0e430041e1757c3f
          part-01.b64	3000	45af9c81467900522804e9f46b59796b2b38fbcdd2a52c86da26dfb3b5ae1fd6
          part-02.b64	612	e17b0ec6103d7c462d4eb86db626264e006fb84ee86c425740120d9f601aa1cc
          EOF
          sed -i 's/^          //' /tmp/rd03-v4-helper-parts.tsv
          while IFS=$'\t' read -r part expected_bytes expected_sha; do
            path="$PWD/control/.rd03-v4/helper/$part"
            test "$(wc -c < "$path" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$expected_sha"
            cat "$path" >> /tmp/rd03-v4-helper.gz.b64
          done < /tmp/rd03-v4-helper-parts.tsv
          test "$(wc -c < /tmp/rd03-v4-helper.gz.b64 | tr -d ' ')" = '6612'
          test "$(sha256sum /tmp/rd03-v4-helper.gz.b64 | awk '{print $1}')" = 'e4d9530e03daa5c4dc3f5a57fc7240282f4da2cb2bccfabb35c87e881e0ccb01'
          base64 --decode /tmp/rd03-v4-helper.gz.b64 > /tmp/rd03-v4-helper.sh.gz
          test "$(wc -c < /tmp/rd03-v4-helper.sh.gz | tr -d ' ')" = '4959'
          test "$(sha256sum /tmp/rd03-v4-helper.sh.gz | awk '{print $1}')" = '5cc5b74c235b782f5fae4d733c22a70e0e976f95f2bd3198ec0a257340206518'
          gzip -dc /tmp/rd03-v4-helper.sh.gz > /tmp/rd03-v4-helper.sh
          test "$(wc -c < /tmp/rd03-v4-helper.sh | tr -d ' ')" = '15386'
          test "$(sha256sum /tmp/rd03-v4-helper.sh | awk '{print $1}')" = '9ecc52ede8eaa464c66964c90fd4e930f12e5ddeb07a4172aef72aaae0f363f3'
          bash -n /tmp/rd03-v4-helper.sh

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/rd03-v4-helper.sh')
          text = path.read_text()
          assert text.count('3309003') == 1, text.count('3309003')
          assert text.count('207959') == 0, text.count('207959')
          text = text.replace('3309003', '207959')
          assert text.count('3309003') == 0
          assert text.count('207959') == 1
          path.write_text(text)
          PY
          export PATCHED_HELPER_SHA256="$(sha256sum /tmp/rd03-v4-helper.sh | awk '{print $1}')"
          test "$PATCHED_HELPER_SHA256" != '9ecc52ede8eaa464c66964c90fd4e930f12e5ddeb07a4172aef72aaae0f363f3'
          bash -n /tmp/rd03-v4-helper.sh

          mkdir -p /tmp/rd03-v4-terminal-receipt
          cat > /tmp/rd03-v4-terminal-receipt/helper-repair.json <<JSON
          {
            "schema_version": "ssc-rd03-v4-helper-repair@1",
            "original_helper_sha256": "9ecc52ede8eaa464c66964c90fd4e930f12e5ddeb07a4172aef72aaae0f363f3",
            "patched_helper_sha256": "${PATCHED_HELPER_SHA256}",
            "repair": {
              "field": "census_artifact_outer_zip_bytes",
              "old_value": 3309003,
              "new_value": 207959,
              "artifact_sha256": "5b5414816cb626a7d9bbe16d914f67d5d02d1233c6ca0d84e21930909eba5f08",
              "basis": "measured outer ZIP bytes with unchanged exact artifact SHA-256"
            },
            "outside_human_dependency": false,
            "external_contacts": 0,
            "external_reviews": 0
          }
          JSON
          sed -i 's/^          //' /tmp/rd03-v4-terminal-receipt/helper-repair.json

          set +e
          bash -x /tmp/rd03-v4-helper.sh "$PWD/work" "$PWD/control" \
            2>&1 | tee /tmp/rd03-v4-terminal-receipt/execution.log
          helper_status="${PIPESTATUS[0]}"
          set -e
          cat > /tmp/rd03-v4-terminal-receipt/execution-status.json <<JSON
          {
            "schema_version": "ssc-rd03-v4-execution-status@2",
            "original_helper_sha256": "9ecc52ede8eaa464c66964c90fd4e930f12e5ddeb07a4172aef72aaae0f363f3",
            "patched_helper_sha256": "${PATCHED_HELPER_SHA256}",
            "exit_status": ${helper_status},
            "completed": $([ "$helper_status" = '0' ] && printf true || printf false),
            "outside_human_dependency": false,
            "external_contacts": 0,
            "external_reviews": 0
          }
          JSON
          sed -i 's/^          //' /tmp/rd03-v4-terminal-receipt/execution-status.json
          sha256sum /tmp/rd03-v4-terminal-receipt/execution.log \
            > /tmp/rd03-v4-terminal-receipt/execution.log.sha256
          sha256sum /tmp/rd03-v4-terminal-receipt/helper-repair.json \
            > /tmp/rd03-v4-terminal-receipt/helper-repair.json.sha256
          exit "$helper_status"

      - name: Preserve terminal materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-wave02-terminal-materialization-v4
          path: /tmp/rd03-v4-terminal-receipt
          if-no-files-found: error
          retention-days: 90
