name: SSC RD-02 Wave 03 fixed lifecycle search census

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd02-search-census.yml'
      - 'data/project/ssc-residual-wave03/seeds/RD-02-C05.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/field-matrix-contract.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/search-census-protocol.json'
      - 'schemas/status-sovereignty-rd-wave03-rd02-search-census.schema.json'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd02/run-search-census.py'
      - 'tools/validate-status-sovereignty-rd-wave03-rd02-search-census.mjs'
      - 'test/status-sovereignty-rd-wave03-rd02-search-census.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd02-search-census.md'
      - '.ssc-rd02-wave03-search-census-trigger/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd02-search-census.yml'
      - 'data/project/ssc-residual-wave03/seeds/RD-02-C05.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/field-matrix-contract.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/search-census-protocol.json'
      - 'schemas/status-sovereignty-rd-wave03-rd02-search-census.schema.json'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd02/run-search-census.py'
      - 'tools/validate-status-sovereignty-rd-wave03-rd02-search-census.mjs'
      - 'test/status-sovereignty-rd-wave03-rd02-search-census.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd02-search-census.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd02-wave03-search-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate exact protocol, denominator, routes, and authority boundaries
        run: |
          set -Eeuo pipefail
          node tools/validate-status-sovereignty-rd-wave03-rd02-search-census.mjs
          node test/status-sovereignty-rd-wave03-rd02-search-census.test.js
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd02/run-search-census.py
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore volatile outputs and replay deterministic validation
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          node tools/validate-status-sovereignty-rd-wave03-rd02-search-census.mjs
          node test/status-sovereignty-rd-wave03-rd02-search-census.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  capture:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/ssc-rd-wave03-rd02-search-census-trigger-')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Revalidate exact protocol before requests
        run: |
          set -Eeuo pipefail
          node tools/validate-status-sovereignty-rd-wave03-rd02-search-census.mjs
          node tools/validate-no-magic-human-gate.mjs

      - name: Execute exact frozen 51-route search census
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ssc-rd02-wave03-search-census-v1
        run: |
          set -Eeuo pipefail
          python tools/acquisition/status-sovereignty-rd-wave03-rd02/run-search-census.py --output "$OUTPUT_DIR" | tee "$RUNNER_TEMP/execution-summary.json"
          test "$(find "$OUTPUT_DIR/routes" -name receipt.json -type f | wc -l)" = '51'
          python - "$OUTPUT_DIR" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          summary = json.loads((root / 'summary.json').read_text())
          manifest = json.loads((root / 'manifest.json').read_text())
          counts = summary['counts']
          result = summary['current_result']
          assert counts['fixed_routes'] == 51
          assert counts['route_attempts'] == 51
          assert counts['terminal_routes'] == 51
          assert counts['withheld_row_routes'] == 0
          assert counts['candidate_urls_admitted'] == 0
          assert counts['result_spawned_requests'] == 0
          assert result['class_state'] == 'still_open'
          assert result['class_closed'] is False
          with open(pathlib.Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as out:
              out.write('## RD-02 Wave-03 fixed search census\n\n')
              out.write('```text\n')
              out.write(f"fixed / terminal routes:     {counts['fixed_routes']} / {counts['terminal_routes']}\n")
              out.write(f"route states:                {json.dumps(counts['route_state_counts'], sort_keys=True)}\n")
              out.write(f"candidate rows:              {counts['candidate_rows']}\n")
              out.write(f"unique candidate URLs:       {counts['unique_candidate_urls']}\n")
              out.write(f"official-domain candidates:  {counts['official_domain_candidate_rows']}\n")
              out.write(f"candidate URLs admitted:     {counts['candidate_urls_admitted']}\n")
              out.write(f"withheld-row routes:         {counts['withheld_row_routes']}\n")
              out.write(f"result-spawned requests:      {counts['result_spawned_requests']}\n")
              out.write(f"manifest entries:            {manifest['entry_count']}\n")
              out.write(f"manifest SHA-256:            {manifest['combined_sha256']}\n")
              out.write(f"class state / closed:        {result['class_state']} / {str(result['class_closed']).lower()}\n")
              out.write('```\n')
          PY
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Preserve exact route bodies, receipts, candidates, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd02-wave03-search-census-v1
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
