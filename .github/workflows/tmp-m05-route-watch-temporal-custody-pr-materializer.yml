name: NEVER MERGE M-05 temporal-custody PR materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-m05-route-watch-temporal-custody-pr-materializer.yml'
      - 'tools/tmp/materialize-m05-route-watch-temporal-custody.mjs'
      - 'tools/tmp/m05-route-watch-temporal-custody-trigger.txt'

permissions:
  contents: write
  issues: write

concurrency:
  group: m05-route-watch-temporal-custody-pr-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/m05-s03-l7-route-watch-temporal-custody-carrier-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: '6535b119f1edf8aeafa9ce0d58813c85901be5f3'
      BASE_TREE: '187aec69c4efca7366219cb7d1db4b7febc62883'
      PRODUCT_BRANCH: 'agent/m05-s03-l7-route-watch-temporal-custody-v1'
      PRODUCT_LEASE: 'b4ea0a4255597a2e51f4d577c01f0720b80e5084'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize and qualify the clean two-path product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "origin/${PRODUCT_BRANCH}")" = "$PRODUCT_LEASE"
          test "$(git show -s --format=%T "$BASE_SHA")" = "$BASE_TREE"

          product_dir="$RUNNER_TEMP/m05-route-watch-temporal-custody-product"
          intended_dir="$RUNNER_TEMP/m05-route-watch-temporal-custody-intended"
          rm -rf "$product_dir" "$intended_dir"
          git worktree add --detach "$product_dir" "$BASE_SHA"
          node tools/tmp/materialize-m05-route-watch-temporal-custody.mjs "$product_dir" \
            > "$RUNNER_TEMP/materialization-receipt.json"

          cd "$product_dir"
          expected=(
            'test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js'
            'tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          )
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          mkdir -p "$intended_dir"
          intended_hashes=()
          for path in "${expected[@]}"; do
            mkdir -p "$intended_dir/$(dirname "$path")"
            cp -- "$path" "$intended_dir/$path"
            intended_hashes+=("$(sha256sum "$path" | cut -d' ' -f1)")
          done

          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          npm run release:check

          for index in "${!expected[@]}"; do
            path="${expected[$index]}"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "${intended_hashes[$index]}"
          done

          mapfile -t release_tracked < <(git diff --name-only | sort)
          mapfile -t release_untracked < <(git ls-files --others --exclude-standard | sort)
          printf 'qualified release drift: %s tracked path(s), %s untracked path(s)\n' \
            "${#release_tracked[@]}" "${#release_untracked[@]}"

          git restore --source="$BASE_SHA" --staged --worktree -- .
          git clean -fd
          for index in "${!expected[@]}"; do
            path="${expected[$index]}"
            mkdir -p "$(dirname "$path")"
            cp -- "$intended_dir/$path" "$path"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "${intended_hashes[$index]}"
          done

          mapfile -t final_changed < <(git diff --name-only | sort)
          test "${#final_changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${final_changed[$index]}" = "${expected[$index]}"
          done
          mapfile -t final_untracked < <(git ls-files --others --exclude-standard | sort)
          test "${#final_untracked[@]}" -eq 0
          git diff --check

          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js

          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git add -- "${expected[@]}"
          git commit -m '[M-05 S03-L7] Bind route-watch receipts to one temporal window'
          product_sha="$(git rev-parse HEAD)"
          product_tree="$(git show -s --format=%T HEAD)"
          test "$(git rev-list --count "$BASE_SHA..$product_sha")" -eq 1
          test "$(git rev-list --count "$product_sha..$BASE_SHA")" -eq 0
          mapfile -t committed < <(git diff --name-only "$BASE_SHA" "$product_sha" | sort)
          test "${#committed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${committed[$index]}" = "${expected[$index]}"
          done

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git push origin \
            "$product_sha:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${PRODUCT_LEASE}"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          echo "product_tree=$product_tree" >> "$GITHUB_OUTPUT"
      - name: Record publication without promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
          PRODUCT_TREE: ${{ steps.product.outputs.product_tree }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m05-temporal-custody-comment.md" <<EOF
          ## M-05 route-watch temporal-custody product published

          Carrier PR #2265 published a clean two-path product from run `${{ github.run_id }}`.

          ```text
          product branch:  $PRODUCT_BRANCH
          product head:    $PRODUCT_SHA
          product tree:    $PRODUCT_TREE
          changed paths:   2
          focused suite:   success
          release:check:   success
          ```

          The product closes receipt temporal-window contradictions without changing route, comparison, Intel gate, authority, answer, graph, completion, or issue-closure semantics. The carrier remains never-merge.
          EOF
          gh issue comment 345 --body-file "$RUNNER_TEMP/m05-temporal-custody-comment.md"
