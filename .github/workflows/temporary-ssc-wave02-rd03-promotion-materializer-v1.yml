name: TEMP promote exact RD-03 closure into Wave 02 current ledger

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-wave02-rd03-promotion-materializer-v1.yml'
      - '.ssc-wave02-rd03-promotion/**'

permissions:
  contents: write

concurrency:
  group: temp-ssc-wave02-rd03-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-wave02-rd03-promotion-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 580d9c998f747330d190bed5011c7a1a517a1c0d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture fully context-repaired promotion program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/ssc-wave02-five-receipt
          mkdir -p /tmp/ssc-wave02-five-receipt
          git fetch origin \
            'refs/heads/agent/ssc-wave02-rd03-promotion-materializer-base-v1:refs/remotes/origin/agent/ssc-wave02-rd03-promotion-materializer-base-v1'
          git show \
            'origin/agent/ssc-wave02-rd03-promotion-materializer-base-v1:.ssc-wave02-rd03-promotion/materialize.sh' \
            > /tmp/ssc-wave02-rd03-promotion-carrier.sh
          carrier_bytes="$(wc -c < /tmp/ssc-wave02-rd03-promotion-carrier.sh | tr -d ' ')"
          carrier_sha="$(sha256sum /tmp/ssc-wave02-rd03-promotion-carrier.sh | awk '{print $1}')"
          test "$carrier_bytes" = '21765'
          test "$carrier_sha" = '9933ef0a9aac6792a696a03fe5acd6be377f629516f9e8422dc670061a9f089b'

          cp /tmp/ssc-wave02-rd03-promotion-carrier.sh \
            /tmp/ssc-wave02-rd03-promotion-materialize.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/ssc-wave02-rd03-promotion-materialize.sh')
          text = path.read_text()

          old = "    (\"['RD-04-C01','RD-05-C03','RD-01-C03','RD-06-C01']\", \"['RD-04-C01','RD-05-C03','RD-01-C03','RD-06-C01','RD-03-C04']\", 'validator promoted order first'),"
          new = "    (\"same(current.promoted_class_receipts.map((row) => row.class_id), ['RD-04-C01','RD-05-C03','RD-01-C03','RD-06-C01'], 'promoted class order changed');\", \"same(current.promoted_class_receipts.map((row) => row.class_id), ['RD-04-C01','RD-05-C03','RD-01-C03','RD-06-C01','RD-03-C04'], 'promoted class order changed');\", 'validator promoted order first'),"
          if text.count(old) != 1:
              raise SystemExit(f'validator promoted-order anchor: expected one carrier match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "    (\"['RD-02-C04','RD-03-C04']\", \"['RD-02-C04']\", 'validator open order first'),"
          new = "    (\"same(current.selected_classes_open.map((row) => row.class_id), ['RD-02-C04','RD-03-C04'], 'open selected class order changed');\", \"same(current.selected_classes_open.map((row) => row.class_id), ['RD-02-C04'], 'open selected class order changed');\", 'validator open order first'),"
          if text.count(old) != 1:
              raise SystemExit(f'validator open-order anchor: expected one carrier match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          lines = text.splitlines(keepends=True)
          helper_anchor = "    p.write_text(text.replace(old, new, 1))\n"
          if sum(line == helper_anchor for line in lines) != 1:
              raise SystemExit('replace helper anchor is not unique')
          helper = [
              "\n",
              "def replace_twice(path, old, new, label):\n",
              "    p = ROOT / path\n",
              "    text = p.read_text()\n",
              "    count = text.count(old)\n",
              "    if count != 2:\n",
              "        raise SystemExit(f'{label}: expected exactly two matches, found {count}')\n",
              "    p.write_text(text.replace(old, new, 2))\n",
          ]
          repaired = []
          counts = {
              'pr_closure': 0,
              'push_closure': 0,
              'pr_receipt': 0,
              'push_receipt': 0,
          }
          for line in lines:
              repaired.append(line)
              if line == helper_anchor:
                  repaired.extend(helper)
          lines = repaired
          repaired = []
          for line in lines:
              if "'workflow PR closure watch')" in line:
                  counts['pr_closure'] += 1
                  line = line.replace('replace_once(', 'replace_twice(', 1).replace('workflow PR closure watch', 'workflow closure watches')
              elif "'workflow push closure watch')" in line:
                  counts['push_closure'] += 1
                  continue
              elif "'workflow PR receipt watch')" in line:
                  counts['pr_receipt'] += 1
                  line = line.replace('replace_once(', 'replace_twice(', 1).replace('workflow PR receipt watch', 'workflow receipt watches')
              elif "'workflow push receipt watch')" in line:
                  counts['push_receipt'] += 1
                  continue
              repaired.append(line)
          if counts != {'pr_closure': 1, 'push_closure': 1, 'pr_receipt': 1, 'push_receipt': 1}:
              raise SystemExit(f'workflow watch-line custody changed: {counts}')
          path.write_text(''.join(repaired))
          PY

          executable_bytes="$(wc -c < /tmp/ssc-wave02-rd03-promotion-materialize.sh | tr -d ' ')"
          executable_sha="$(sha256sum /tmp/ssc-wave02-rd03-promotion-materialize.sh | awk '{print $1}')"
          cat > /tmp/ssc-wave02-five-receipt/program-binding.json <<JSON
          {
            "schema_version": "ssc-wave02-rd03-promotion-program-binding@5",
            "carrier_bytes": ${carrier_bytes},
            "carrier_sha256": "${carrier_sha}",
            "executable_bytes": ${executable_bytes},
            "executable_sha256": "${executable_sha}",
            "context_repairs": 7,
            "capture_only": true,
            "outside_human_dependency": false,
            "external_contacts": 0,
            "external_reviews": 0
          }
          JSON
          sed -i 's/^          //' /tmp/ssc-wave02-five-receipt/program-binding.json
          cat /tmp/ssc-wave02-five-receipt/program-binding.json
          bash -n /tmp/ssc-wave02-rd03-promotion-materialize.sh
          exit 17

      - name: Preserve exact promotion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-wave02-rd03-promotion-program-capture-v5
          path: /tmp/ssc-wave02-five-receipt
          if-no-files-found: error
          retention-days: 90
