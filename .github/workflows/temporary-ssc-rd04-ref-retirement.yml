name: TEMP retire completed SSC RD-04 branch refs

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd04-ref-retirement.yml'

permissions:
  contents: write

concurrency:
  group: temp-ssc-rd04-ref-retirement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retire:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd04-wave02-ref-retirement'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Retire remaining completed RD-04 refs with bounded retries
        env:
          REQUIRED_MERGE: 7b21d1f2b0606a5550b9c26fadc0cb465ba88b7e
          CLEANUP_REF: agent/ssc-rd04-wave02-ref-retirement
        run: |
          set -Eeuo pipefail

          retry() {
            local attempt=1
            local max=6
            while ! "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }

          remote_heads() {
            git ls-remote --heads origin
          }

          retry git fetch --force origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$REQUIRED_MERGE" refs/remotes/origin/main

          retry remote_heads > /tmp/all-heads.txt
          awk '{sub("refs/heads/", "", $2); print $2}' /tmp/all-heads.txt \
            | grep -E '^agent/ssc-rd04|^agent/ssc-rd-wave02-rd04-version-history$' \
            | sort -u > /tmp/rd04-observed-before.txt

          test "$(wc -l < /tmp/rd04-observed-before.txt)" -eq 62
          test "$(grep -Fxc "$CLEANUP_REF" /tmp/rd04-observed-before.txt)" -eq 1
          grep -Fvx "$CLEANUP_REF" /tmp/rd04-observed-before.txt > /tmp/rd04-delete.txt
          test "$(wc -l < /tmp/rd04-delete.txt)" -eq 61

          : > /tmp/rd04-retired.tsv
          while IFS= read -r branch; do
            before=''
            for attempt in 1 2 3 4 5 6; do
              if output="$(git ls-remote --heads origin "refs/heads/$branch" 2>/tmp/ls-remote.err)"; then
                before="$(printf '%s' "$output" | cut -f1)"
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                cat /tmp/ls-remote.err >&2
                exit 1
              fi
              sleep $((attempt * 3))
            done

            if [ -z "$before" ]; then
              printf '%s\t%s\talready_absent\n' "$branch" '-' >> /tmp/rd04-retired.tsv
              continue
            fi

            deleted=false
            for attempt in 1 2 3 4 5 6; do
              if git push origin --delete "$branch"; then
                deleted=true
                break
              fi
              sleep $((attempt * 3))
              if output="$(git ls-remote --heads origin "refs/heads/$branch" 2>/dev/null)" && [ -z "$output" ]; then
                deleted=true
                break
              fi
            done
            test "$deleted" = true
            printf '%s\t%s\tdeleted\n' "$branch" "$before" >> /tmp/rd04-retired.tsv
          done < /tmp/rd04-delete.txt

          test "$(wc -l < /tmp/rd04-retired.tsv)" -eq 61
          retry remote_heads > /tmp/all-heads-after.txt
          awk '{sub("refs/heads/", "", $2); print $2}' /tmp/all-heads-after.txt \
            | grep -E '^agent/ssc-rd04|^agent/ssc-rd-wave02-rd04-version-history$' \
            | sort -u > /tmp/rd04-observed-after.txt
          test "$(wc -l < /tmp/rd04-observed-after.txt)" -eq 1
          test "$(cat /tmp/rd04-observed-after.txt)" = "$CLEANUP_REF"

          sha256sum /tmp/rd04-observed-before.txt /tmp/rd04-delete.txt /tmp/rd04-retired.tsv /tmp/rd04-observed-after.txt > /tmp/SHA256SUMS

      - name: Preserve retirement receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-completed-ref-retirement
          path: |
            /tmp/rd04-observed-before.txt
            /tmp/rd04-delete.txt
            /tmp/rd04-retired.tsv
            /tmp/rd04-observed-after.txt
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Delete this cleanup ref last
        env:
          CLEANUP_REF: agent/ssc-rd04-wave02-ref-retirement
        run: |
          set -Eeuo pipefail
          deleted=false
          for attempt in 1 2 3 4 5 6; do
            if git push origin --delete "$CLEANUP_REF"; then
              deleted=true
              break
            fi
            sleep $((attempt * 3))
            if output="$(git ls-remote --heads origin "refs/heads/$CLEANUP_REF" 2>/dev/null)" && [ -z "$output" ]; then
              deleted=true
              break
            fi
          done
          test "$deleted" = true
