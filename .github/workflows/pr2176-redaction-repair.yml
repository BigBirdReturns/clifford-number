name: PR 2176 redaction repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/pr2176-redaction-repair.yml

permissions:
  contents: write

concurrency:
  group: pr2176-redaction-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply, verify, test, and commit the one-shot repair
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "ab2b453af8455695b8ea3793ce21cdf1d12f4e81"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "0dd993d3b37449e4398884172bfc46dfabf9ae2f"
          test "$(git hash-object tools/crawl-industrial-exhaust.mjs)" = "22c4cc8a53058bbb128d064850c2a7c71a4367de"
          test "$(git ls-files -s tools/crawl-industrial-exhaust.mjs | awk '{print $1}')" = "100755"

          cat > /tmp/pr2176.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/pr2176.patch.gz.b64 | gzip --decompress > /tmp/pr2176.patch
          echo "5a065f64a702a3d1d2a5d14bb796be964bf6041198cde4377796371e0f3c4a84  /tmp/pr2176.patch" | sha256sum --check --status

          git apply --check /tmp/pr2176.patch
          git apply /tmp/pr2176.patch

          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "fb447b0833d5552943a55cd8f07321b60cc39ecd"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "bc820b57365fc7e0be32422223e5f3c523a3d8a7"
          test "$(git hash-object tools/crawl-industrial-exhaust.mjs)" = "22c4cc8a53058bbb128d064850c2a7c71a4367de"
          test "$(git ls-files -s tools/crawl-industrial-exhaust.mjs | awk '{print $1}')" = "100755"

          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node test/industrial-exhaust.test.js

          git rm .github/workflows/pr2176-redaction-repair.yml
          expected_paths=$'.github/workflows/pr2176-redaction-repair.yml\ntest/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          actual_paths="$(git diff HEAD --name-only | sort)"
          test "$actual_paths" = "$expected_paths"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m "fix(crawler): close remaining phone redaction gaps"
          git push origin "HEAD:$GITHUB_REF_NAME"
