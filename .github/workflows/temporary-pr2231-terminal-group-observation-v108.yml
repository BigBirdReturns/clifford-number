name: Temporary PR 2231 combined observation-frontier V108 qualification

on:
  push:
    branches:
      - agent/pr2231-terminal-group-observation-controller-v108

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-combined-observation-frontier-v108
  cancel-in-progress: false

jobs:
  qualify-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: '2398'
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: agent/pr2231-terminal-group-observation-controller-v108
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: edbf7027f5de312d77a91d615ecb8cad619ce154
      EXPECTED_PRODUCT_TREE: efc92aba2de7088ad1e4a9b0514ccb9e8f498c47
      EXPECTED_LIBRARY_BLOB: cb6bcf21460d4d0cca0dcb29affb9424713399d0
      EXPECTED_TEST_BLOB: 96822fbd5ac213d03e2bdc91c92c7ddfc3931963
      PRODUCT_WORKTREE: /tmp/pr2231-v108-product
      MAIN_WORKTREE: /tmp/pr2231-v108-main
      ARTIFACT_DIR: /tmp/pr2231-combined-observation-frontier-v108

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recover and execute frozen qualification program
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/pr2231-v108-qualify.sh
          chmod +x /tmp/pr2231-v108-qualify.sh
          /tmp/pr2231-v108-qualify.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-combined-observation-frontier-v108
          path: /tmp/pr2231-combined-observation-frontier-v108
          if-no-files-found: error
          retention-days: 90
