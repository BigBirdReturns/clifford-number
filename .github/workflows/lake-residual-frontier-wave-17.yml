name: Evidence lake residual frontier Wave 17

on:
  push:
    branches:
      - agent/lake-residual-frontier-wave-17
    paths:
      - '.github/tmp/lake-residual-frontier-wave-17-trigger.json'
  pull_request:
    branches:
      - agent/lake-subject-integration-wave-16
    paths:
      - 'data/project/lake-residual-frontier-wave-17-policy.json'
      - 'data/project/lake-residual-path-registry-wave-17.json'
      - 'data/project/lake-projection-lineage-registry-wave-17.json'
      - 'data/project/lake-residual-frontier-wave-17.json'
      - 'tools/build-lake-residual-frontier-wave-17.mjs'
      - 'tools/summarize-lake-residual-frontier-wave-17.mjs'
      - 'tools/materialize-lake-residual-frontier-wave-17.mjs'
      - 'tools/capture-lake-residual-frontier-wave-17-baseline.mjs'
      - 'tools/reconcile-lake-residual-frontier-wave-17.mjs'
      - 'tools/validate-lake-residual-frontier-wave-17.mjs'
      - 'test/lake-residual-frontier-wave-17.test.js'
      - '.github/workflows/lake-residual-frontier-wave-17.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lake-residual-frontier-wave-17-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Determine execution mode
        id: mode
        shell: bash
        run: |
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_EVENT_NAME" = 'push' \
            && test -f .github/tmp/lake-residual-frontier-wave-17-trigger.json; then
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
          else
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate current branch baseline
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check
          git restore --staged --worktree .
          git clean -fd
      - name: Build deterministic Wave 17 source controls
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/materialize-lake-residual-frontier-wave-17.mjs
          node --check tools/capture-lake-residual-frontier-wave-17-baseline.mjs
          node --check tools/reconcile-lake-residual-frontier-wave-17.mjs
          node --check tools/validate-lake-residual-frontier-wave-17.mjs
          node tools/materialize-lake-residual-frontier-wave-17.mjs
          node tools/capture-lake-residual-frontier-wave-17-baseline.mjs
          sha256sum \
            data/project/lake-residual-path-registry-wave-17.json \
            data/project/lake-projection-lineage-registry-wave-17.json \
            data/project/lake-residual-frontier-wave-17.json \
            build/lake-actions/residual-frontier-wave-17.json \
            data/project/lake-index-policy.json \
            BUILD-INSTRUCTIONS.md \
            README.md > /tmp/wave17-source-first.sha256
          node tools/materialize-lake-residual-frontier-wave-17.mjs
          node tools/capture-lake-residual-frontier-wave-17-baseline.mjs
          sha256sum --check --strict /tmp/wave17-source-first.sha256
          git diff --check
      - name: Run complete repository gate with Wave 17 sources active
        if: steps.mode.outputs.materialize == 'true'
        env:
          WAVE17_ALLOW_PRELIMINARY_RECEIPT: 'true'
        run: |
          set -euo pipefail
          npm run release:check
          git diff --check
      - name: Validate an already materialized committed head
        if: steps.mode.outputs.materialize != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if test -f data/project/lake-residual-frontier-wave-17.json \
            && node -e "const x=require('./data/project/lake-residual-frontier-wave-17.json'); process.exit(x.post_execution_reconciliation_complete ? 0 : 1)"; then
            npm run release:check
            node tools/validate-lake-index-shards.mjs
            node tools/validate-lake-basin-index.mjs
            node tools/validate-lake-residual-frontier-wave-17.mjs
            node test/lake-residual-frontier-wave-17.test.js
          else
            node tools/build-lake-residual-frontier-wave-17.mjs
            node tools/summarize-lake-residual-frontier-wave-17.mjs
            npm run release:check
          fi
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
      - name: Stabilize exact staged source tree
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          rm -f .github/tmp/lake-residual-frontier-wave-17-trigger.json
          git add -A
          git restore --worktree .
          git clean -fd
      - name: Observe current open-PR shadow
        if: steps.mode.outputs.materialize == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs
      - name: Build and reconcile the final lake fixed point
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "Wave 17 lake pass ${pass}"
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/reconcile-lake-receipt-semantics.mjs
            node tools/build-lake-gap-summary.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-receipt-semantics.mjs
            node tools/validate-lake-gap-summary.mjs
            node tools/reconcile-lake-residual-frontier-wave-17.mjs
            git add -A
          done
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-residual-frontier-wave-17.test.js
          git add -A
      - name: Prove deterministic final reconstruction
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find build/lake-index -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/wave17-final.sha256
          sha256sum \
            data/project/lake-residual-path-registry-wave-17.json \
            data/project/lake-projection-lineage-registry-wave-17.json \
            data/project/lake-residual-frontier-wave-17.json \
            build/lake-actions/residual-frontier-wave-17.json \
            build/lake-actions/residual-frontier-wave-17-reconciliation.json \
            reports/lake-residual-frontier-wave-17.md >> /tmp/wave17-final.sha256
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/reconcile-lake-residual-frontier-wave-17.mjs
          git add -A
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/reconcile-lake-residual-frontier-wave-17.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          sha256sum --check --strict /tmp/wave17-final.sha256
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node test/lake-residual-frontier-wave-17.test.js
          git diff --check
      - name: Enforce Wave 17 source and generated-output boundaries
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess

          required = {
              '.github/tmp/lake-residual-frontier-wave-17-trigger.json',
              'BUILD-INSTRUCTIONS.md',
              'README.md',
              'data/project/lake-index-policy.json',
              'data/project/lake-residual-path-registry-wave-17.json',
              'data/project/lake-projection-lineage-registry-wave-17.json',
              'data/project/lake-residual-frontier-wave-17.json',
          }
          allowed_sources = required | {'data/project/lake-open-pr-shadow.json'}
          generated_prefixes = ('build/', 'reports/', 'briefs/', 'estates/', 'gametrails/')
          generated_root = re.compile(r'^(?:Clifford-.*\.html|[^/]+-standalone\.html)$')
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          actual = set()
          for entry in entries:
              status = entry[:2]
              assert 'R' not in status and 'C' not in status, entry
              actual.add(entry[3:])
          unexpected = sorted(path for path in actual
              if path not in allowed_sources
              and not path.startswith(generated_prefixes)
              and not generated_root.match(path))
          assert required <= actual, {'missing_required_wave_17_changes': sorted(required - actual)}
          assert not unexpected, {'undeclared_source_changes': unexpected}
          print({'required_changes': len(required), 'actual_changes': len(actual), 'generated_changes': len(actual - allowed_sources)})
          PY
      - name: Commit and push Wave 17 checkpoint
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute residual lake frontier Wave 17'
          git fetch origin agent/lake-residual-frontier-wave-17
          test "$(git rev-parse origin/agent/lake-residual-frontier-wave-17)" = "${{ steps.mode.outputs.original_sha }}"
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          git push origin HEAD:agent/lake-residual-frontier-wave-17
