name: Evidence lake residual frontier Wave 17

on:
  push:
    branches:
      - agent/lake-residual-frontier-wave-17
    paths:
      - '.github/tmp/lake-residual-frontier-wave-17-trigger.json'
  pull_request:
    branches:
      - agent/lake-subject-integration-wave-16
    paths:
      - 'data/project/lake-residual-frontier-wave-17-policy.json'
      - 'tools/build-lake-residual-frontier-wave-17.mjs'
      - '.github/workflows/lake-residual-frontier-wave-17.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lake-residual-frontier-wave-17-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Determine execution mode
        id: mode
        shell: bash
        run: |
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_EVENT_NAME" = 'push' \
            && test -f .github/tmp/lake-residual-frontier-wave-17-trigger.json; then
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
          else
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build deterministic residual-frontier preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-lake-residual-frontier-wave-17.mjs
          node tools/build-lake-residual-frontier-wave-17.mjs
          sha256sum \
            build/lake-actions/residual-frontier-wave-17-preflight.json \
            reports/lake-residual-frontier-wave-17-preflight.md > /tmp/wave17-preflight.sha256
          node tools/build-lake-residual-frontier-wave-17.mjs
          sha256sum --check --strict /tmp/wave17-preflight.sha256
          node - <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync('data/project/lake-residual-frontier-wave-17-policy.json'));
          const preflight = JSON.parse(fs.readFileSync(policy.paths.preflight));
          const b = policy.baseline;
          if (preflight.baseline_counts.evidence_paths_without_program_owner !== b.evidence_paths_without_program_owner) throw new Error('owner denominator drift');
          if (preflight.baseline_counts.exact_orphan_evidence_files !== b.exact_orphan_evidence_files) throw new Error('orphan denominator drift');
          if (preflight.baseline_counts.evidence_paths_not_index_reachable !== b.evidence_paths_not_index_reachable) throw new Error('reachability denominator drift');
          if (preflight.baseline_counts.projection_ids_without_source !== b.projection_ids_without_source) throw new Error('projection denominator drift');
          if (!preflight.completion.all_residual_paths_classified) throw new Error('unclassified residual path');
          if (!preflight.completion.all_projection_only_ids_classified) throw new Error('unclassified projection row');
          if (preflight.completion.review_required_to_decide !== false) throw new Error('human-permission dependency introduced');
          if (preflight.completion.graph_effect !== 'none') throw new Error('graph effect introduced');
          console.log({
            residual_path_union_count: preflight.residual_path_union_count,
            path_refusals: preflight.completion.semantic_owner_refusals_preserved,
            projection_refusals: preflight.completion.projection_refusals_preserved
          });
          NODE
          git diff --check
      - name: Run complete repository gate
        run: npm run release:check
      - name: Commit preflight checkpoint
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/lake-residual-frontier-wave-17-trigger.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check
          git commit -m 'Census residual lake frontier Wave 17'
          git fetch origin agent/lake-residual-frontier-wave-17
          test "$(git rev-parse origin/agent/lake-residual-frontier-wave-17)" = "${{ steps.mode.outputs.original_sha }}"
          git push origin HEAD:agent/lake-residual-frontier-wave-17
      - name: Preserve clean PR validation worktree
        if: steps.mode.outputs.materialize != 'true'
        run: |
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
