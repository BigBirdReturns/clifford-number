name: SSC RD-04 SNAP route adjudication A04

on:
  push:
    branches:
      - 'agent/ssc-rd04-snap-route-adjudication-a04'
    paths:
      - '.github/workflows/status-sovereignty-rd04-snap-route-adjudication-a04.yml'
      - 'data/intake/status-sovereignty-rd04-snap-route-adjudication-a04/**'
      - 'data/project/status-sovereignty-rd04-snap-route-adjudication-a04-release-manifest.json'
      - 'schemas/status-sovereignty-rd04-snap-route-adjudication-a04.schema.json'
      - 'docs/milestones/ssc-rd04-snap-route-adjudication-a04.md'
      - 'tools/lib/ssc_rd04_a04_*.py'
      - 'tools/acquire-status-sovereignty-rd04-snap-route-adjudication-a04.py'
      - 'tools/build-status-sovereignty-rd04-snap-route-adjudication-a04.py'
      - 'tools/validate-status-sovereignty-rd04-snap-route-adjudication-a04.py'
      - 'test/status-sovereignty-rd04-snap-route-adjudication-a04.test.py'
      - 'build/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04/**'
      - 'reports/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04/**'
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd04-snap-route-adjudication-a04.yml'
      - 'data/intake/status-sovereignty-rd04-snap-route-adjudication-a04/**'
      - 'data/project/status-sovereignty-rd04-snap-route-adjudication-a04-release-manifest.json'
      - 'schemas/status-sovereignty-rd04-snap-route-adjudication-a04.schema.json'
      - 'docs/milestones/ssc-rd04-snap-route-adjudication-a04.md'
      - 'tools/lib/ssc_rd04_a04_*.py'
      - 'tools/acquire-status-sovereignty-rd04-snap-route-adjudication-a04.py'
      - 'tools/build-status-sovereignty-rd04-snap-route-adjudication-a04.py'
      - 'tools/validate-status-sovereignty-rd04-snap-route-adjudication-a04.py'
      - 'test/status-sovereignty-rd04-snap-route-adjudication-a04.test.py'
      - 'build/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04/**'
      - 'reports/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build deterministic A04 products
        run: python tools/build-status-sovereignty-rd04-snap-route-adjudication-a04.py
      - name: Refuse generated drift
        run: |
          git diff --exit-code -- \
            data/intake/status-sovereignty-rd04-snap-route-adjudication-a04 \
            data/project/status-sovereignty-rd04-snap-route-adjudication-a04-release-manifest.json \
            build/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04 \
            reports/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04
      - name: Validate all 112 reconciliations and 400 decisions
        run: python tools/validate-status-sovereignty-rd04-snap-route-adjudication-a04.py
      - name: Exercise positive and adversarial fixtures
        run: python test/status-sovereignty-rd04-snap-route-adjudication-a04.test.py
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Preserve exact A04 outputs
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-snap-route-adjudication-a04
          path: |
            data/intake/status-sovereignty-rd04-snap-route-adjudication-a04
            data/project/status-sovereignty-rd04-snap-route-adjudication-a04-release-manifest.json
            build/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04
            reports/core-thesis/status-sovereignty/rd04-snap-route-adjudication-a04
          if-no-files-found: error
