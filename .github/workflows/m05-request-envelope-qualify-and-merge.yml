name: M-05 request-envelope exact-head qualifier

on:
  push:
    branches:
      - agent/m05-s03-l7-request-envelope-materializer-v6
    paths:
      - '.github/workflows/m05-request-envelope-qualify-and-merge.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: m05-request-envelope-exact-head-qualifier
  cancel-in-progress: false

jobs:
  qualify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: '2189'
      ISSUE: '345'
      EXPECTED_BASE: '7e4228dd97168bbd2d3df14261bf85a54e758034'
      EXPECTED_HEAD_BRANCH: 'agent/m05-s03-l7-intel-realization-request-envelope-custody-v1'
      EXPECTED_PRODUCT_PATHS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze exact PR identity and path denominator
        id: freeze
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json state,isDraft,headRefName,headRefOid,baseRefName,baseRefOid,mergeable > /tmp/pr.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/pr.json','utf8'));
          const fail=m=>{throw new Error(m)};
          if(p.state!=='OPEN')fail(`PR state ${p.state}`);
          if(p.headRefName!==process.env.EXPECTED_HEAD_BRANCH)fail(`head branch ${p.headRefName}`);
          if(p.baseRefName!=='main'||p.baseRefOid!==process.env.EXPECTED_BASE)fail(`base lease ${p.baseRefName}@${p.baseRefOid}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`head=${p.headRefOid}\n`);
          NODE
          head=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pr.json')).headRefOid")
          gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate > /tmp/files.json
          node <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/files.json','utf8'));
          const expected=[
            '.github/workflows/m05-intel-realization-request-envelope-custody-amendment.yml',
            'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.json',
            'test/m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.test.js',
            'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.mjs'
          ].sort();
          const actual=rows.map(x=>x.filename).sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(`path denominator drift ${JSON.stringify(actual)}`);
          if(rows.some(x=>x.status!=='added'))throw new Error('non-additive product path');
          NODE
      - name: Await and require all exact-head pull-request workflows
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" > /tmp/runs.json
            if node <<'NODE'
          const fs=require('fs');
          const runs=JSON.parse(fs.readFileSync('/tmp/runs.json','utf8')).workflow_runs;
          const expected=[
            'M-05 Intel realization request envelope custody amendment',
            'Release checks',
            'M-05 story ecology and answerable power',
            'Core thesis and estate alignment',
            'No magic human gate'
          ];
          const relevant=runs.filter(r=>expected.includes(r.name));
          const bad=relevant.filter(r=>r.status==='completed'&&r.conclusion!=='success');
          if(bad.length){console.error(JSON.stringify(bad.map(r=>({id:r.id,name:r.name,conclusion:r.conclusion}))));process.exit(2)}
          const latest=new Map();
          for(const r of relevant){const old=latest.get(r.name);if(!old||r.id>old.id)latest.set(r.name,r)}
          const ready=expected.every(name=>latest.get(name)?.status==='completed'&&latest.get(name)?.conclusion==='success');
          if(!ready)process.exit(1);
          fs.writeFileSync('/tmp/qualified-runs.json',JSON.stringify(expected.map(name=>{const r=latest.get(name);return{name,id:r.id,head_sha:r.head_sha,conclusion:r.conclusion}}),null,2));
          NODE
            then break
            else code=$?; if [ "$code" -eq 2 ]; then exit 1; fi
            fi
            if [ "$attempt" -eq 150 ]; then echo 'workflow qualification timeout' >&2; exit 1; fi
            sleep 10
          done
      - name: Recheck immutable head, live-main lease, and mergeability
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json state,headRefOid,baseRefOid,mergeable > /tmp/final-pr.json
          node <<'NODE'
          const p=JSON.parse(require('fs').readFileSync('/tmp/final-pr.json','utf8'));
          if(p.state!=='OPEN')throw new Error(`state ${p.state}`);
          if(p.headRefOid!==process.env.HEAD_SHA)throw new Error(`head moved ${p.headRefOid}`);
          if(p.baseRefOid!==process.env.EXPECTED_BASE)throw new Error(`main moved ${p.baseRefOid}`);
          if(!['MERGEABLE','UNKNOWN'].includes(p.mergeable))throw new Error(`mergeability ${p.mergeable}`);
          NODE
      - name: Record qualification and move PR into review state
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_SHA"
          tree=$(git show -s --format=%T "$HEAD_SHA")
          runs=$(cat /tmp/qualified-runs.json)
          body=$(gh pr view "$PR" --repo "$REPO" --json body -q .body)
          cat > /tmp/qualification.md <<EOF

All five applicable pull-request workflows passed on exact head \`$HEAD_SHA\`, tree \`$tree\`. The exact workflow receipt is:

\`\`\`json
$runs
\`\`\`

The focused workflow passed predecessor transport validation, exact request-envelope validation, adversarial mutation testing, the complete repository release gate, and deterministic replay. The branch remained based on canonical \`$EXPECTED_BASE\`, changed exactly four additive paths, and preserved zero observed receipts and every answer, graph, completion, and issue-closure boundary.
EOF
          printf '%s' "$body" > /tmp/body.md
          cat /tmp/qualification.md >> /tmp/body.md
          gh pr edit "$PR" --repo "$REPO" --body-file /tmp/body.md
          gh pr ready "$PR" --repo "$REPO"
      - name: Merge exact qualified head
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/$REPO/pulls/$PR/merge" \
            -f merge_method=merge \
            -f sha="$HEAD_SHA" \
            -f commit_title='[M-05 S03-L7] Require exact request-envelope custody (#2189)' \
            -f commit_message='Bind every Intel realization-stage receipt to the exact request selection envelope, public credential scope, conditional and range state, and response Vary reconciliation while preserving zero observed receipts, no answer change, no graph effect, and issue #345 as open.' \
            > /tmp/merge.json
          node -e "const x=require('/tmp/merge.json');if(!x.merged)throw new Error(JSON.stringify(x))"
      - name: Verify exact canonical merge tree and replay controls
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          merge=$(node -p "require('/tmp/merge.json').sha")
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$merge"
          head_tree=$(git show -s --format=%T "$HEAD_SHA")
          merge_tree=$(git show -s --format=%T "$merge")
          test "$head_tree" = "$merge_tree"
          parents=$(git show -s --format=%P "$merge")
          test "$parents" = "$EXPECTED_BASE $HEAD_SHA"
          git switch --detach "$merge"
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-transport-body-hash-domain-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-transport-body-hash-domain-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.test.js
          npm run release:check
          printf '%s\n' "$merge" > /tmp/merge-sha
          printf '%s\n' "$merge_tree" > /tmp/merge-tree
      - name: Record the canonical transaction on issue 345
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          merge=$(cat /tmp/merge-sha)
          tree=$(cat /tmp/merge-tree)
          runs=$(cat /tmp/qualified-runs.json)
          cat > /tmp/issue-comment.md <<EOF
PR #2189 is now the canonical exact request-envelope custody control for the Intel realization chain. It merged exact qualified head \`$HEAD_SHA\` into \`main\` through merge commit \`$merge\`, preserving product tree \`$tree\` and the exact two-parent order \`$EXPECTED_BASE $HEAD_SHA\`.

The four-stage amendment closes the representation-selection gap left after exact transport-body custody. Every transaction, federal-cash, public-account, and distribution receipt must preserve the request method, exact target and query octets, request-header capture and canonicalization, content-negotiation fields, request-body custody, public credential and cookie scope, conditional validators, Range state, redirect-followup envelopes, response \`Vary\` names, \`Vary: *\` state, and one reconciled effective request-envelope digest. Same URL, default headers, private credentials, cookies, partial Range bodies, and unreconciled response variation cannot qualify.

All five pull-request workflows passed on the exact head:

\`\`\`json
$runs
\`\`\`

The controller then replayed the predecessor transport validator and adversarial suite, the request-envelope validator and adversarial suite, and the complete repository release gate on the canonical merge commit.

This remains an admission-control transaction. It establishes no Intel sale, transfer, dividend, warrant exercise, federal cash receipt, TAS/BETC booking, distribution ledger, effective answer, graph effect, cross-domain completion, project completion, or issue-closure authority. The ordinary acquisition gate remains \`2026-08-27T00:00:00Z\`.

The evidentiary ledger is exact predecessor Git-object custody, independent semantic hashing, exact request-target and request-header custody, request-body and public credential-scope custody, deterministic conditional and Range state, response-variation reconciliation, and adversarial byte-rewrite testing; the venue is PRs #2180 through #2189, canonical \`main\`, and this issue; the target is the gap between preserving response bytes and reproducing the request that selected them; the upside is representation-level reproducibility; the downside is zero empirical Intel realization or distribution receipts; and the failure mode is treating one URL or response hash as reproducible evidence while the request envelope is absent or materially different. The controlling question is whether the first post-gate Intel record can reproduce the exact request and response and then satisfy transaction, gross federal receipt, TAS/BETC booking, complete-denominator, distribution, answer, graph, completion, and issue-closure controls.
EOF
          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/issue-comment.md
