name: Materialize Counter-Selector Wave 09 Batch 03 acquisition

on:
  push:
    branches:
      - 'agent/counter-selector-wave-09-b03-acquisition'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-09.yml'
      - '.github/materializers/counter-selector-wave-09/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-09.yml'
      - '.github/materializers/counter-selector-wave-09/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-09-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-09-b03-acquisition

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 09 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-09/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-09.tar.gz
          echo '8a02ac2e7ac3020654fa78c3e91f4a966c88ab5c6d9d1a34486ff5d7a535e99d  /tmp/counter-selector-wave-09.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-09.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-09

      - name: Build, validate, and attack Batch 03 acquisition
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-09.mjs
          node tools/validate-counter-selector-wave-09.mjs
          node test/counter-selector-wave-09.test.js

      - name: Commit exact permanent Wave 09 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-09/payload-00 \
            .github/materializers/counter-selector-wave-09/payload-01 \
            .github/materializers/counter-selector-wave-09/payload-02 \
            .github/materializers/counter-selector-wave-09/payload-03 \
            .github/materializers/counter-selector-wave-09/payload-04 \
            .github/materializers/counter-selector-wave-09/payload-05 \
            .github/materializers/counter-selector-wave-09/payload-06 \
            data/project/counter-selector-artifact-acquisition-b03-registry.json \
            data/project/counter-selector-blind-packet-registry-b03.json \
            data/project/counter-selector-wave-09-batch-03.json \
            data/project/counter-selector-wave-09-release-manifest.json \
            data/project/counter-selector-wave-09-source-registry.json \
            docs/methods/counter-selector-artifact-acquisition-b03.md \
            docs/milestones/counter-selector-wave-09.md \
            reports/core-thesis/counter-selector-wave-09/data.json \
            reports/core-thesis/counter-selector-wave-09/index.html \
            schemas/counter-selector-artifact-acquisition-b03.schema.json \
            test/counter-selector-wave-09.test.js \
            tools/build-counter-selector-wave-09.mjs \
            tools/validate-counter-selector-wave-09.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Acquire Counter-Selector Wave 09 Batch 03 artifacts'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 09 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-09.mjs
          node tools/validate-counter-selector-wave-09.mjs
          node test/counter-selector-wave-09.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent Wave 09 head
        run: git push origin HEAD:agent/counter-selector-wave-09-b03-acquisition
