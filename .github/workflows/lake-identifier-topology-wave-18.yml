name: Evidence lake identifier topology Wave 18

on:
  push:
    branches:
      - agent/lake-identifier-topology-wave-18
    paths:
      - '.github/tmp/lake-identifier-topology-wave-18-preflight-trigger.json'
  pull_request:
    branches:
      - agent/lake-residual-frontier-wave-17
    paths:
      - 'data/project/lake-identifier-topology-wave-18-policy.json'
      - 'tools/build-lake-identifier-topology-wave-18.mjs'
      - 'tools/summarize-lake-identifier-topology-wave-18.mjs'
      - '.github/workflows/lake-identifier-topology-wave-18.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lake-identifier-topology-wave-18-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Determine execution mode
        id: mode
        shell: bash
        run: |
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_EVENT_NAME" = 'push' \
            && test -f .github/tmp/lake-identifier-topology-wave-18-preflight-trigger.json; then
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
          else
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build deterministic identifier-topology preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-lake-identifier-topology-wave-18.mjs
          node --check tools/summarize-lake-identifier-topology-wave-18.mjs
          node tools/build-lake-identifier-topology-wave-18.mjs
          node tools/summarize-lake-identifier-topology-wave-18.mjs
          sha256sum \
            build/lake-actions/identifier-topology-wave-18-preflight.json \
            build/lake-actions/identifier-topology-wave-18-diagnostics.json \
            build/lake-actions/identifier-topology-wave-18-family-diagnostics.json \
            reports/lake-identifier-topology-wave-18-preflight.md \
            reports/lake-identifier-topology-wave-18-diagnostics.md \
            reports/lake-identifier-topology-wave-18-family-diagnostics.md > /tmp/wave18-preflight.sha256
          node tools/build-lake-identifier-topology-wave-18.mjs
          node tools/summarize-lake-identifier-topology-wave-18.mjs
          sha256sum --check --strict /tmp/wave18-preflight.sha256
          node - <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync('data/project/lake-identifier-topology-wave-18-policy.json'));
          const preflight = JSON.parse(fs.readFileSync(policy.paths.preflight));
          const family = JSON.parse(fs.readFileSync('build/lake-actions/identifier-topology-wave-18-family-diagnostics.json'));
          const baseline = policy.baseline;
          const counts = preflight.counts;
          if (counts.distinct_machine_ids !== baseline.distinct_machine_ids) throw new Error('machine-ID denominator drift');
          if (counts.unindexed_machine_ids !== baseline.unindexed_machine_ids) throw new Error('unindexed denominator drift');
          if (counts.source_ids_without_projection !== baseline.source_ids_without_projection) throw new Error('source-only denominator drift');
          if (counts.divergent_identifier_projections !== baseline.divergent_identifier_projections) throw new Error('divergence denominator drift');
          if (counts.projection_ids_without_source !== baseline.projection_ids_without_source) throw new Error('projection-without-source denominator drift');
          if (!preflight.completion.every_frozen_identifier_classified) throw new Error('unclassified frozen identifier');
          if (family.counts.source_only_family_adjudication_required !== preflight.completion.unclassified_source_only_rows) throw new Error('source-only family diagnostics drift');
          if (family.counts.same_path_projection_variants !== preflight.completion.same_path_projection_variant_rows) throw new Error('same-path family diagnostics drift');
          if (preflight.completion.review_required_to_decide !== false) throw new Error('human-permission dependency introduced');
          if (preflight.completion.graph_effect !== 'none') throw new Error('graph effect introduced');
          console.log({
            frozen_union: counts.frozen_union,
            overlap_counts: counts.overlap_counts,
            source_only_classes: counts.source_only_classification_counts,
            divergence_classes: counts.divergence_classification_counts,
            unclassified_source_only_rows: preflight.completion.unclassified_source_only_rows,
            same_path_projection_variant_rows: preflight.completion.same_path_projection_variant_rows,
            same_path_shapes: Object.fromEntries(family.counts.same_path_shape_counts.map(row => [row.key, row.count]))
          });
          NODE
          git diff --check
      - name: Run complete repository gate in a clean detached worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/wave18-gate "${{ steps.mode.outputs.original_sha }}"
          cd /tmp/wave18-gate
          npm run release:check
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
      - name: Commit preflight checkpoint
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/lake-identifier-topology-wave-18-preflight-trigger.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check
          git commit -m 'Census identifier topology Wave 18'
          git fetch origin agent/lake-identifier-topology-wave-18
          test "$(git rev-parse origin/agent/lake-identifier-topology-wave-18)" = "${{ steps.mode.outputs.original_sha }}"
          git push origin HEAD:agent/lake-identifier-topology-wave-18
      - name: Preserve clean nonmaterializing worktree
        if: steps.mode.outputs.materialize != 'true'
        run: |
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
