name: Evidence lake canonical subject projection Wave 13

on:
  push:
    branches:
      - agent/lake-canonical-subject-projection-wave-13
    paths:
      - '.github/tmp/lake-canonical-subject-projection-wave-13-trigger.json'
  pull_request:
    branches:
      - agent/lake-bounded-hold-resolution-wave-12
    paths:
      - 'data/project/lake-canonical-subject-projection-wave-13-policy.json'
      - 'tools/lib/local-canonical-resolution.mjs'
      - 'tools/lib/case-ledger.mjs'
      - 'tools/build-public-catalog.mjs'
      - 'tools/build-hop-graph.mjs'
      - 'tools/lib/report-waterline.mjs'
      - 'tools/compile-reporter-briefings.mjs'
      - 'tools/build-lake-canonical-subject-projection-wave-13.mjs'
      - 'tools/reconcile-lake-canonical-subject-projection-wave-13.mjs'
      - 'tools/validate-lake-canonical-subject-projection-wave-13.mjs'
      - 'tools/snapshot-lake-canonical-subject-projection-wave-13.mjs'
      - 'tools/compile.mjs'
      - 'test/case-ledger.test.js'
      - 'test/public-catalog.test.js'
      - 'test/lake-canonical-subject-projection-wave-13.test.js'
      - '.github/workflows/lake-canonical-subject-projection-wave-13.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lake-canonical-subject-projection-wave-13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Determine execution mode
        id: mode
        shell: bash
        run: |
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test -f .github/tmp/lake-canonical-subject-projection-wave-13-trigger.json; then
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
            echo 'phase=execute' >> "$GITHUB_OUTPUT"
          elif test "$GITHUB_EVENT_NAME" = 'pull_request' || test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'; then
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
            if git ls-files --error-unmatch build/canonical-subject-projection-wave-13.json >/dev/null 2>&1; then
              echo 'phase=post' >> "$GITHUB_OUTPUT"
            else
              echo 'phase=execute' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'validate=false' >> "$GITHUB_OUTPUT"
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
            echo 'phase=none' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.validate == 'true'
        with:
          node-version: '24'
      - name: Restore committed bytes before canonical subject projection
        if: steps.mode.outputs.validate == 'true'
        run: |
          git restore --staged --worktree .
          git clean -fd
      - name: Run the complete repository release gate with canonical subject projection active
        if: steps.mode.outputs.validate == 'true'
        run: npm run release:check
      - name: Deterministically prove the Wave 13 projection
        if: steps.mode.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-lake-canonical-subject-projection-wave-13.mjs
          sha256sum \
            build/canonical-subject-projection-wave-13.json \
            build/lake-actions/canonical-subject-projection-wave-13.json \
            reports/lake-canonical-subject-projection-wave-13.md > /tmp/lake-canonical-subject-wave-13-first.sha256
          node tools/build-lake-canonical-subject-projection-wave-13.mjs
          sha256sum --check --strict /tmp/lake-canonical-subject-wave-13-first.sha256
          node test/lake-canonical-subject-projection-wave-13.test.js
          git diff --check
      - name: Stage release-normalized projection products
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.phase == 'execute'
        run: git add -A
      - name: Stabilize the source and generated tree before the lake census
        if: steps.mode.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.mode.outputs.phase }}" = 'execute'; then
            rm -f .github/tmp/lake-canonical-subject-projection-wave-13-trigger.json
            git add -A
            git restore --worktree .
            git clean -fd
          else
            git reset --hard HEAD
            git clean -fd
          fi
      - name: Observe current open-PR shadow
        if: steps.mode.outputs.validate == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs
      - name: Rebuild and reconcile the canonical-subject lake
        if: steps.mode.outputs.validate == 'true'
        run: |
          set -euo pipefail
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/reconcile-lake-canonical-subject-projection-wave-13.mjs
          # Make the reconciliation products part of the tracked index before the
          # final census. Otherwise the materialization commit adds paths that the
          # pre-commit file shard could not observe.
          git add -A
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-canonical-subject-projection-wave-13.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-canonical-subject-projection-wave-13.test.js
      - name: Prove deterministic post-projection products
        if: steps.mode.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/snapshot-lake-canonical-subject-projection-wave-13.mjs /tmp/lake-canonical-subject-wave-13-before.json
          node tools/build-hop-graph.mjs
          node tools/compile-cases.mjs
          node tools/compile-reporter-briefings.mjs
          node tools/build-public-catalog.mjs
          node tools/build-lake-canonical-subject-projection-wave-13.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/reconcile-lake-canonical-subject-projection-wave-13.mjs
          git add -A
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/snapshot-lake-canonical-subject-projection-wave-13.mjs /tmp/lake-canonical-subject-wave-13-after.json
          if ! cmp --silent /tmp/lake-canonical-subject-wave-13-before.json /tmp/lake-canonical-subject-wave-13-after.json; then
            diff -u /tmp/lake-canonical-subject-wave-13-before.json /tmp/lake-canonical-subject-wave-13-after.json | sed -n '1,240p'
            exit 1
          fi
          sha256sum /tmp/lake-canonical-subject-wave-13-before.json /tmp/lake-canonical-subject-wave-13-after.json
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-canonical-subject-projection-wave-13.mjs
          node test/lake-canonical-subject-projection-wave-13.test.js
          git diff --check
      - name: Restore the non-materializing validation surface
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.materialize != 'true'
        run: |
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
      - name: Enforce projection source and generated-output boundaries
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/lake-canonical-subject-projection-wave-13-trigger.json
          python - <<'PY'
          import re
          import subprocess

          required = {
              '.github/tmp/lake-canonical-subject-projection-wave-13-trigger.json',
              'build/canonical-subject-projection-wave-13.json',
              'build/lake-actions/canonical-subject-projection-wave-13.json',
              'build/lake-actions/canonical-subject-projection-wave-13-reconciliation.json',
              'reports/lake-canonical-subject-projection-wave-13.md',
              'reports/lake-canonical-subject-projection-wave-13-reconciliation.md',
          }
          exact_allowed_sources = required | {
              'data/project/lake-open-pr-shadow.json',
          }
          generated_prefixes = (
              'build/',
              'reports/',
              'briefs/',
              'estates/',
              'gametrails/',
          )
          generated_root = re.compile(r'^(?:Clifford-.*\.html|[^/]+-standalone\.html)$')
          raw = subprocess.check_output([
              'git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'
          ])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          actual = set()
          for entry in entries:
              status = entry[:2]
              assert 'R' not in status and 'C' not in status, entry
              actual.add(entry[3:])
          unexpected = sorted(path for path in actual
              if path not in exact_allowed_sources
              and not path.startswith(generated_prefixes)
              and not generated_root.match(path))
          assert required <= actual, {
              'missing_required_canonical_subject_projection_changes': sorted(required - actual),
          }
          assert not unexpected, {
              'undeclared_source_changes': unexpected,
          }
          print({
              'required_changes': len(required),
              'actual_changes': len(actual),
              'generated_changes': len(actual - exact_allowed_sources),
          })
          PY
      - name: Commit the executed canonical subject projection
        if: steps.mode.outputs.materialize == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute canonical subject projection Wave 13'
          git fetch origin agent/lake-canonical-subject-projection-wave-13
          test "$(git rev-parse origin/agent/lake-canonical-subject-projection-wave-13)" = "${{ steps.mode.outputs.original_sha }}"
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-canonical-subject-projection-wave-13.mjs
          git push origin HEAD:agent/lake-canonical-subject-projection-wave-13
