name: Preference custody hybrid-architecture control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/real-cases/yougov-parallax-hybrid-architecture.json'
      - 'tools/lib/preference-hybrid-architecture.mjs'
      - 'tools/compile-preference-hybrid-architecture.mjs'
      - 'tools/validate-preference-hybrid-architecture.mjs'
      - 'test/preference-hybrid-architecture.test.js'
      - 'docs/preference-custody-yougov-parallax-hybrid-architecture.md'
      - '.github/workflows/preference-hybrid-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile bounded hybrid architecture
        run: node tools/compile-preference-hybrid-architecture.mjs
      - name: Validate execution and authority boundaries
        run: node tools/validate-preference-hybrid-architecture.mjs
      - name: Exercise positive, tamper, and laundering fixtures
        run: node test/preference-hybrid-architecture.test.js
      - name: Preserve deterministic hybrid-architecture projections
        uses: actions/upload-artifact@v4
        with:
          name: yougov-parallax-hybrid-architecture
          path: |
            build/research/preference-real-cases/yougov-parallax-hybrid-architecture.json
            build/research/preference-real-cases/yougov-parallax-hybrid-architecture.md
          if-no-files-found: error
