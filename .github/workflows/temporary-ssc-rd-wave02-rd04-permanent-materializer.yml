name: TEMP export SSC RD-04-C01 deferred permanent workflow

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd-wave02-rd04-permanent-materializer.yml'
      - '.rd04-permanent-materializer/**'

permissions:
  contents: read

concurrency:
  group: temp-ssc-rd04-workflow-export-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd04-wave02-permanent-materializer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Reconstruct and export exact deferred workflow
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/rd04-workflow-export
          cat .rd04-permanent-materializer/package.part.* | tr -d '\n' > /tmp/rd04-workflow-export/package.b64
          echo '73f5727a7216277a1b4ece8b3ed741a4d5f69fe8566ddee55e934f9f320d0701  /tmp/rd04-workflow-export/package.b64' | sha256sum --check --strict
          base64 --decode /tmp/rd04-workflow-export/package.b64 > /tmp/rd04-workflow-export/package.tgz
          echo '164443cbaedf75b72826b4ca3a963dfd57d64b320b5c51d9464ec2d13a8dd6ca  /tmp/rd04-workflow-export/package.tgz' | sha256sum --check --strict
          tar -xOf /tmp/rd04-workflow-export/package.tgz .github/workflows/status-sovereignty-rd-wave02-rd04-version-history.yml > /tmp/rd04-workflow-export/permanent-workflow.yml
          test -s /tmp/rd04-workflow-export/permanent-workflow.yml
          head -5 /tmp/rd04-workflow-export/permanent-workflow.yml
          sha256sum /tmp/rd04-workflow-export/permanent-workflow.yml > /tmp/rd04-workflow-export/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave02-rd04-deferred-permanent-workflow
          path: |
            /tmp/rd04-workflow-export/permanent-workflow.yml
            /tmp/rd04-workflow-export/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
