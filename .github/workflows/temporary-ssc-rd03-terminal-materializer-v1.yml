name: TEMP materialize exact RD-03 terminal closure v2

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd03-terminal-materializer-v1.yml'
      - '.rd03-terminal/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd03-terminal-materializer-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd03-terminal-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_BRANCH: agent/ssc-rd-wave02-rd03-negotiated-terms
      CARRIER_BRANCH: agent/ssc-rd03-terminal-materializer-base-v1
      EXPECTED_RESEARCH_HEAD: e70aec0f6809c77e198e0c4ee80f6bcadb6bbdc4
      EXPECTED_MAIN_HEAD: 61d8baabee70a40d13fc08c1f446313c3416a6e0
      CENSUS_ARTIFACT_ID: '8875551993'
      CENSUS_ARTIFACT_SHA256: 5b5414816cb626a7d9bbe16d914f67d5d02d1233c6ca0d84e21930909eba5f08
      CENSUS_MANIFEST_SHA256: 0bcee2db7be4904f775c55a2533a2a5f1c199edff47e273993925b742f24ac06
      CENSUS_DEST: data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/source-custody/public-record-census-v1
      EXECUTION_RECEIPT_PATH: data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/public-record-census-execution-receipt.json
      PRODUCT_ROOT: data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms
      CLOSURE_REFERENCE_PATH: data/project/ssc-residual-wave02/closures/RD-03-C04.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd03-negotiated-terms
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Integrate, reconstruct, prove, and publish exact permanent product
        run: |
          set -Eeuo pipefail
          export RESEARCH_START_SHA="$(git rev-parse HEAD)"
          test "$RESEARCH_START_SHA" = "$EXPECTED_RESEARCH_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "$EXPECTED_RESEARCH_HEAD"
          git fetch --no-tags origin main
          export MAIN_START_SHA="$(git rev-parse FETCH_HEAD)"
          test "$MAIN_START_SHA" = "$EXPECTED_MAIN_HEAD"
          node tools/validate-no-magic-human-gate.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B rd03-permanent-integration "$MAIN_START_SHA"
          git merge --no-ff --no-commit "$RESEARCH_START_SHA"
          git diff --cached --name-only | sort > /tmp/rd03-integration-paths.txt
          cat > /tmp/rd03-expected-integration-paths.txt <<'EOF'
          data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/field-matrix.json
          data/project/ssc-residual-wave02/seeds/RD-03-C04.json
          test/status-sovereignty-rd-wave02-rd03-field-matrix.test.js
          tools/acquisition/status-sovereignty-rd-wave02-rd03/build-field-matrix.mjs
          tools/acquisition/status-sovereignty-rd-wave02-rd03/validate-field-matrix.mjs
          EOF
          sed -i 's/^          //' /tmp/rd03-expected-integration-paths.txt
          diff -u /tmp/rd03-expected-integration-paths.txt /tmp/rd03-integration-paths.txt
          git diff --cached --check
          git commit -m 'Integrate current main with RD-03 acquisition lineage'
          export INTEGRATION_SHA="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P "$INTEGRATION_SHA")" = "$MAIN_START_SHA $RESEARCH_START_SHA"

          git fetch origin "refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"
          rm -rf /tmp/rd03-authored /tmp/rd03-authored.b64 /tmp/rd03-authored.zip
          mkdir -p /tmp/rd03-authored
          git show "origin/${CARRIER_BRANCH}:.rd03-terminal/authored/part-00.b64" > /tmp/rd03-authored.b64
          test "$(wc -c < /tmp/rd03-authored.b64 | tr -d ' ')" = '25720'
          test "$(sha256sum /tmp/rd03-authored.b64 | awk '{print $1}')" = 'd741e8229ddfe7f544dd29ef4c1d50b60140351a47477c47321b16eb63c509fd'
          base64 --decode /tmp/rd03-authored.b64 > /tmp/rd03-authored.zip
          test "$(wc -c < /tmp/rd03-authored.zip | tr -d ' ')" = '19288'
          test "$(sha256sum /tmp/rd03-authored.zip | awk '{print $1}')" = '279556dcfa7d3332d115282ca835fafe2a3dec16ad3b4a78baa11a0ac646d328'
          unzip -q /tmp/rd03-authored.zip -d /tmp/rd03-authored
          cat > /tmp/rd03-authored-sha256.txt <<'HASHES'
          27fd04bde88341499b2ae8494a0b6a8126358f0f550315213ec0469fccaa7364  ./.github/workflows/status-sovereignty-rd-wave02-rd03-negotiated-terms.yml
          5f90199a597cc92050ecc91b20076849de9f453cc369675fce97c67ea9c67a57  ./docs/milestones/ssc-rd-wave02-rd03-negotiated-terms.md
          dfeea84c64828a8719e9fcf35ce6ffd5cd1f5be39a31fcc056b66d414399c4d5  ./schemas/status-sovereignty-rd-wave02-rd03-negotiated-terms.schema.json
          22c47846a7aab3e86bad0958c41d9f2793480286c57336acda00988949dd4cbc  ./test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js
          b241f98cdc80208cc800503f70c8983c48de3e8da93a8d214cb5461a07c2f2ed  ./tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          299c63cf44f6b52aab31fb5ccac7353c2ae878eeeb79ff933d24af6ee8cef035  ./tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          HASHES
          sed -i 's/^          //' /tmp/rd03-authored-sha256.txt
          (cd /tmp/rd03-authored && sha256sum --check --strict /tmp/rd03-authored-sha256.txt)
          test "$(find /tmp/rd03-authored -type f | wc -l | tr -d ' ')" = '6'

          rm -rf /tmp/rd03-census /tmp/rd03-census.zip
          mkdir -p /tmp/rd03-census
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${CENSUS_ARTIFACT_ID}/zip" \
            --output /tmp/rd03-census.zip
          test "$(sha256sum /tmp/rd03-census.zip | awk '{print $1}')" = "$CENSUS_ARTIFACT_SHA256"
          unzip -q /tmp/rd03-census.zip -d /tmp/rd03-census
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/rd03-census')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['schema_version']=='ssc-rd03-wave02-public-record-census-manifest@1'
          assert manifest['entry_count']==263 and len(manifest['entries'])==263
          assert len({row['path'] for row in manifest['entries']})==263
          for row in manifest['entries']:
              rel=pathlib.PurePosixPath(row['path']); assert not rel.is_absolute() and '..' not in rel.parts
              data=(root/rel).read_bytes(); assert len(data)==row['bytes']; assert hashlib.sha256(data).hexdigest()==row['sha256']
          combined=hashlib.sha256('\n'.join(f"{row['sha256']}  {row['path']}" for row in manifest['entries']).encode()).hexdigest()
          assert combined==manifest['combined_sha256']=='0bcee2db7be4904f775c55a2533a2a5f1c199edff47e273993925b742f24ac06'
          summary=json.loads((root/'summary.json').read_text())
          assert summary['fixed_routes']==30 and summary['route_attempts']==30
          assert summary['terminal_transport_states']=={'http_terminal_non_success':15,'http_success':15}
          assert summary['candidate_rows']==150 and summary['unique_candidate_urls']==60
          assert summary['official_candidate_urls']==5 and summary['first_party_candidate_urls']==1
          assert summary['result_spawned_requests']==0 and summary['transport_census_complete'] is True
          assert summary['substantive_adjudication_complete'] is False and summary['class_closed'] is False
          assert sum(1 for path in root.rglob('*') if path.is_file())==264
          print(f"RD-03 census verified: 263 entries plus manifest; {combined}")
          PY

          test ! -e "$CENSUS_DEST"
          mkdir -p "$CENSUS_DEST"
          cp -a /tmp/rd03-census/. "$CENSUS_DEST/"
          while read -r digest authored_path; do
            source_path="${authored_path#./}"
            install -D -m 0644 "/tmp/rd03-authored/${source_path}" "${source_path}"
          done < /tmp/rd03-authored-sha256.txt

          mkdir -p "$(dirname "$EXECUTION_RECEIPT_PATH")"
          cat > "$EXECUTION_RECEIPT_PATH" <<'JSON'
          {
            "schema_version": "ssc-rd03-wave02-public-record-census-execution-receipt@1",
            "wave_id": "SSC-RD-W02",
            "class_id": "RD-03-C04",
            "issue": 788,
            "research_head": "e70aec0f6809c77e198e0c4ee80f6bcadb6bbdc4",
            "workflow_run": 30864413469,
            "job_id": 91853036710,
            "artifact_id": 8875551993,
            "artifact_name": "ssc-rd03-wave02-public-record-census-v1",
            "artifact_zip_sha256": "5b5414816cb626a7d9bbe16d914f67d5d02d1233c6ca0d84e21930909eba5f08",
            "manifest_entry_count": 263,
            "manifest_combined_sha256": "0bcee2db7be4904f775c55a2533a2a5f1c199edff47e273993925b742f24ac06",
            "counts": {"fixed_routes":30,"route_attempts":30,"http_success":15,"terminal_non_success":15,"candidate_result_rows":150,"unique_candidate_urls":60,"official_candidate_urls":5,"first_party_candidate_urls":1,"admitted_candidate_urls":0,"result_spawned_requests":0},
            "authority": {"outside_human_dependency":false,"external_contacts":0,"external_reviews":0,"substantive_adjudication_performed_by_census":false,"class_closed_by_census":false,"publication_effect":"none","adoption_effect":"none","graph_effect":"none"}
          }
          JSON
          sed -i 's/^          //' "$EXECUTION_RECEIPT_PATH"

          node tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs --write
          node tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          node test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js
          node tools/validate-no-magic-human-gate.mjs

          git add \
            "$CENSUS_DEST" "$EXECUTION_RECEIPT_PATH" "$PRODUCT_ROOT" "$CLOSURE_REFERENCE_PATH" \
            .github/workflows/status-sovereignty-rd-wave02-rd03-negotiated-terms.yml \
            docs/milestones/ssc-rd-wave02-rd03-negotiated-terms.md \
            schemas/status-sovereignty-rd-wave02-rd03-negotiated-terms.schema.json \
            test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js \
            tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs \
            tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          git diff --cached --name-only | sort > /tmp/rd03-product-paths.txt
          test "$(wc -l < /tmp/rd03-product-paths.txt | tr -d ' ')" = '276'
          test -z "$(git diff --cached --name-status | awk '$1 != "A" {print}')"
          test -z "$(grep -E '(^|/)\.rd03-|temporary-ssc-rd03' /tmp/rd03-product-paths.txt || true)"
          test "$(grep -c '^data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/source-custody/public-record-census-v1/' /tmp/rd03-product-paths.txt)" = '264'
          git diff --cached --check
          git commit -m 'Close RD-03 negotiated terms as source unavailable'
          export PRODUCT_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$INTEGRATION_SHA"

          npm run release:check
          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          node test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          test "$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "$RESEARCH_START_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN_START_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" --force-with-lease="refs/heads/${TARGET_BRANCH}:${RESEARCH_START_SHA}"
          test "$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "$PRODUCT_SHA"

          rm -rf /tmp/rd03-terminal-receipt
          mkdir -p /tmp/rd03-terminal-receipt
          cp /tmp/rd03-integration-paths.txt /tmp/rd03-terminal-receipt/integration-paths.txt
          cp /tmp/rd03-product-paths.txt /tmp/rd03-terminal-receipt/product-paths.txt
          cp "$EXECUTION_RECEIPT_PATH" /tmp/rd03-terminal-receipt/
          cp "$PRODUCT_ROOT/class-receipt.json" "$PRODUCT_ROOT/manifest.json" "$PRODUCT_ROOT/summary.json" /tmp/rd03-terminal-receipt/
          cp "$CLOSURE_REFERENCE_PATH" /tmp/rd03-terminal-receipt/closure-reference.json
          cat > /tmp/rd03-terminal-receipt/materialization.json <<JSON
          {
            "schema_version": "ssc-rd03-wave02-terminal-materialization-receipt@2",
            "main_first_parent": "$MAIN_START_SHA",
            "research_second_parent": "$RESEARCH_START_SHA",
            "integration_commit": "$INTEGRATION_SHA",
            "product_head": "$PRODUCT_SHA",
            "integration_paths": 5,
            "product_paths": 276,
            "total_permanent_increment_paths": 281,
            "temporary_paths": 0,
            "terminal_state": "bounded_source_unavailable",
            "instruments": 5,
            "terminal_fields": 70,
            "adversarial_mutations_refused": 94,
            "outside_human_dependency": false,
            "external_contacts": 0,
            "external_reviews": 0,
            "publication_effect": "none",
            "adoption_effect": "none",
            "graph_effect": "none"
          }
          JSON
          sed -i 's/^          //' /tmp/rd03-terminal-receipt/materialization.json

      - name: Preserve terminal materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-wave02-terminal-materialization-v2
          path: /tmp/rd03-terminal-receipt
          if-no-files-found: error
          retention-days: 90
