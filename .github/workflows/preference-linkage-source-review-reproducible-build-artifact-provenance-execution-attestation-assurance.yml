name: Preference linkage source review reproducible build artifact provenance execution attestation assurance

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.fixture.json'
      - 'tools/lib/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs'
      - 'tools/compile-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs'
      - 'tools/validate-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs'
      - 'test/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.test.js'
      - 'docs/preference-custody-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.md'
      - '.github/workflows/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pc51:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile, validate, and test PC-51
        run: |
          node tools/compile-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          node tools/validate-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          node test/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance
          path: |
            build/research/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.json
            build/research/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.md
          if-no-files-found: error
