name: TEMP materialize School.House archive minimum-surface reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconstruct, validate, gate, and publish exact product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          EXECUTE='.schoolhouse-archive-minimum-reconciliation-materializer/EXECUTE'
          BUNDLE='.schoolhouse-archive-minimum-reconciliation-materializer/builder.mjs.gz.b64'
          UNPATCHED_BUILDER='/tmp/build-schoolhouse-archive-minimum-reconciliation.unpatched.mjs'
          BUILDER='/tmp/build-schoolhouse-archive-minimum-legal-surface-reconciliation-custody.mjs'
          BASELINE='/tmp/schoolhouse-archive-minimum-legal-surface'
          REPLAY='/tmp/schoolhouse-archive-minimum-legal-surface-replay'
          PRODUCT='/tmp/schoolhouse-archive-minimum-reconciliation-product'
          REPRO='/tmp/schoolhouse-archive-minimum-reconciliation-reproduction'
          RECEIPT='/tmp/schoolhouse-archive-minimum-reconciliation-materialization-receipt'
          SAFE_MAIN='88e9ff60e581ec386ad4673bc709ec0350ebe163'
          SAFE_TREE='a54307dfaae7feb2ea44379e6ff6c4f22a4ac1ac'
          TARGET='agent/schoolhouse-archive-minimum-legal-surface-reconciliation-product-v1'

          cat > /tmp/expected-product-paths <<'PATHS'
          data/intake/bvvc-defense-capital/README.md
          data/intake/bvvc-defense-capital/acquisition-frontier.json
          data/intake/bvvc-defense-capital/coverage-matrix.json
          data/intake/bvvc-defense-capital/manifest.json
          data/intake/bvvc-defense-capital/schoolhouse.json
          data/intake/bvvc-defense-capital/schoolhouse-archive-minimum-legal-surface-attempt-results.jsonl
          data/intake/bvvc-defense-capital/schoolhouse-archive-minimum-legal-surface-legal-signals.jsonl
          data/intake/bvvc-defense-capital/schoolhouse-archive-minimum-legal-surface-link-inventory.jsonl
          data/intake/bvvc-defense-capital/schoolhouse-archive-minimum-legal-surface-reconciliation-custody.json
          data/intake/bvvc-defense-capital/schoolhouse-archive-minimum-legal-surface-route-reconciliation.jsonl
          data/intake/bvvc-defense-capital/source-inventory-16.jsonl
          tools/build-schoolhouse-archive-minimum-legal-surface-reconciliation-custody.mjs
          tools/validate-bvvc-defense-capital.mjs
          PATHS
          sed -i 's/^          //' /tmp/expected-product-paths
          sort -u -o /tmp/expected-product-paths /tmp/expected-product-paths
          test "$(wc -l < /tmp/expected-product-paths | tr -d ' ')" = '13'

          test -s "$EXECUTE"
          test -s "$BUNDLE"
          grep -Fx 'materialize=schoolhouse-archive-minimum-legal-surface-reconciliation-custody-v1' "$EXECUTE"
          grep -Fx "known_safe_main=$SAFE_MAIN" "$EXECUTE"
          grep -Fx "known_safe_tree=$SAFE_TREE" "$EXECUTE"
          grep -Fx 'materialize_from_live_main=true' "$EXECUTE"
          grep -Fx 'baseline_workflow_run_id=31030908630' "$EXECUTE"
          grep -Fx 'baseline_artifact_id=8940650245' "$EXECUTE"
          grep -Fx 'baseline_artifact_digest=sha256:dc499ff1899811f84be3873df2787835dd70f95a73a64d7652ede4d51f48f7da' "$EXECUTE"
          grep -Fx 'replay_workflow_run_id=31032164683' "$EXECUTE"
          grep -Fx 'replay_artifact_id=8941112372' "$EXECUTE"
          grep -Fx 'replay_artifact_digest=sha256:ae34561d531c077e56473553b09fc2fe834c32d23f03d7eef3f422c700daf831' "$EXECUTE"
          grep -Fx 'builder_parent_commit_occurrences=1' "$EXECUTE"
          grep -Fx 'builder_parent_tree_occurrences=1' "$EXECUTE"
          grep -Fx "target_product_branch=$TARGET" "$EXECUTE"
          grep -Fx 'expected_permanent_paths=13' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"

          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = '8534808a37f5dac5fc0f32da391d73226c21271bedf6c1bb06e90693774c307a'
          base64 -d "$BUNDLE" > /tmp/builder.mjs.gz
          test "$(sha256sum /tmp/builder.mjs.gz | awk '{print $1}')" = '4b2c956c32652d43743879d9b5b94c34f57aaf426dc769ccb013d7479cdbd759'
          gzip -dc /tmp/builder.mjs.gz > "$UNPATCHED_BUILDER"
          test "$(sha256sum "$UNPATCHED_BUILDER" | awk '{print $1}')" = '186c06c6b9c7ef7152df39147173f2f00348d258b1f6456b01215c25ca21905d'
          test "$(grep -o "$SAFE_MAIN" "$UNPATCHED_BUILDER" | wc -l | tr -d ' ')" = '1'
          test "$(grep -o "$SAFE_TREE" "$UNPATCHED_BUILDER" | wc -l | tr -d ' ')" = '1'
          node --check "$UNPATCHED_BUILDER"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8940650245" --jq .digest)" = 'sha256:dc499ff1899811f84be3873df2787835dd70f95a73a64d7652ede4d51f48f7da'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8941112372" --jq .digest)" = 'sha256:ae34561d531c077e56473553b09fc2fe834c32d23f03d7eef3f422c700daf831'

          rm -rf "$BASELINE" "$REPLAY" "$RECEIPT"
          mkdir -p "$BASELINE" "$REPLAY" "$RECEIPT"
          gh run download 31030908630 --repo "$GITHUB_REPOSITORY" --name schoolhouse-archive-minimum-legal-surface --dir "$BASELINE"
          gh run download 31032164683 --repo "$GITHUB_REPOSITORY" --name schoolhouse-archive-minimum-legal-surface-replay --dir "$REPLAY"
          (cd "$BASELINE" && sha256sum -c SHA256SUMS)
          (cd "$REPLAY" && sha256sum -c SHA256SUMS)

          MATERIALIZATION_PASS=0
          while :; do
            MATERIALIZATION_PASS=$((MATERIALIZATION_PASS + 1))
            test "$MATERIALIZATION_PASS" -le 3

            git fetch --no-tags origin main "$SAFE_MAIN"
            LIVE_MAIN="$(git rev-parse origin/main^{commit})"
            LIVE_TREE="$(git rev-parse "$LIVE_MAIN^{tree}")"
            test "$(git rev-parse "$SAFE_MAIN^{commit}")" = "$SAFE_MAIN"
            test "$(git rev-parse "$SAFE_MAIN^{tree}")" = "$SAFE_TREE"
            git merge-base --is-ancestor "$SAFE_MAIN" "$LIVE_MAIN"

            git diff --name-only --no-renames "$SAFE_MAIN..$LIVE_MAIN" | sort -u > /tmp/live-main-advance-paths
            comm -12 /tmp/expected-product-paths /tmp/live-main-advance-paths > /tmp/live-main-overlap-paths
            test ! -s /tmp/live-main-overlap-paths

            cp "$UNPATCHED_BUILDER" "$BUILDER"
            python - "$BUILDER" "$SAFE_MAIN" "$LIVE_MAIN" "$SAFE_TREE" "$LIVE_TREE" <<'PYPATCH'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old_commit, new_commit, old_tree, new_tree = sys.argv[2:]
          source = path.read_text()
          assert source.count(old_commit) == 1, source.count(old_commit)
          assert source.count(old_tree) == 1, source.count(old_tree)
          if new_commit != old_commit:
              assert source.count(new_commit) == 0, source.count(new_commit)
              source = source.replace(old_commit, new_commit)
          if new_tree != old_tree:
              assert source.count(new_tree) == 0, source.count(new_tree)
              source = source.replace(old_tree, new_tree)
          path.write_text(source)
          PYPATCH
            PATCHED_BUILDER_SHA="$(sha256sum "$BUILDER" | awk '{print $1}')"
            node --check "$BUILDER"

            git worktree remove --force "$PRODUCT" 2>/dev/null || true
            git worktree remove --force "$REPRO" 2>/dev/null || true
            rm -rf "$PRODUCT" "$REPRO"
            git worktree add --detach "$PRODUCT" "$LIVE_MAIN"
            git worktree add --detach "$REPRO" "$LIVE_MAIN"
            install -m 0644 "$BUILDER" "$PRODUCT/tools/build-schoolhouse-archive-minimum-legal-surface-reconciliation-custody.mjs"
            install -m 0644 "$BUILDER" "$REPRO/tools/build-schoolhouse-archive-minimum-legal-surface-reconciliation-custody.mjs"

            (
              cd "$PRODUCT"
              node tools/build-schoolhouse-archive-minimum-legal-surface-reconciliation-custody.mjs "$BASELINE" "$REPLAY" | tee "$RECEIPT/build-output.json"
              node --check tools/build-schoolhouse-archive-minimum-legal-surface-reconciliation-custody.mjs
              node --check tools/validate-bvvc-defense-capital.mjs
              node tools/validate-bvvc-defense-capital.mjs
              node test/person-routers.test.js
              npm run release:check

              git diff --name-only --no-renames "$LIVE_MAIN" | sort -u > /tmp/tracked-after-gate-paths
              comm -23 /tmp/tracked-after-gate-paths /tmp/expected-product-paths > /tmp/nonproduct-tracked-paths
              while IFS= read -r generated_path; do
                test -z "$generated_path" || git restore --source="$LIVE_MAIN" --worktree --staged -- "$generated_path"
              done < /tmp/nonproduct-tracked-paths

              git ls-files --others --exclude-standard | sort -u > /tmp/untracked-after-gate-paths
              comm -23 /tmp/untracked-after-gate-paths /tmp/expected-product-paths > /tmp/unexpected-untracked-paths
              test ! -s /tmp/unexpected-untracked-paths

              while IFS= read -r product_path; do git add -- "$product_path"; done < /tmp/expected-product-paths
              git diff --cached --name-only --no-renames | sort -u > /tmp/staged-product-paths
              diff -u /tmp/expected-product-paths /tmp/staged-product-paths
              test "$(wc -l < /tmp/staged-product-paths | tr -d ' ')" = '13'
              test "$(grep -c '^\.github/workflows/' /tmp/staged-product-paths || true)" = '0'
            )

            (
              cd "$REPRO"
              node tools/build-schoolhouse-archive-minimum-legal-surface-reconciliation-custody.mjs "$BASELINE" "$REPLAY" > /tmp/reproduction-build-output.json
              node tools/validate-bvvc-defense-capital.mjs
            )
            diff -u "$RECEIPT/build-output.json" /tmp/reproduction-build-output.json
            while IFS= read -r product_path; do
              cmp "$PRODUCT/$product_path" "$REPRO/$product_path"
            done < /tmp/expected-product-paths

            git fetch --no-tags origin main
            OBSERVED_MAIN="$(git rev-parse origin/main^{commit})"
            if test "$OBSERVED_MAIN" != "$LIVE_MAIN"; then
              git merge-base --is-ancestor "$LIVE_MAIN" "$OBSERVED_MAIN"
              git diff --name-only --no-renames "$LIVE_MAIN..$OBSERVED_MAIN" | sort -u > /tmp/during-gate-advance-paths
              comm -12 /tmp/expected-product-paths /tmp/during-gate-advance-paths > /tmp/during-gate-overlap-paths
              test ! -s /tmp/during-gate-overlap-paths
              continue
            fi
            break
          done

          cd "$PRODUCT"
          while IFS= read -r product_path; do sha256sum "$product_path"; done < /tmp/expected-product-paths > /tmp/product-sha256sums
          sha256sum -c /tmp/product-sha256sums

          git config user.name 'School.House Archive Custody Materializer'
          git config user.email 'actions@users.noreply.github.com'
          while IFS= read -r product_path; do git add -- "$product_path"; done < /tmp/expected-product-paths
          git diff --cached --name-only --no-renames | sort -u > /tmp/staged-product-paths
          diff -u /tmp/expected-product-paths /tmp/staged-product-paths
          git commit -m 'Reconcile School.House archived legal-surface minimum lane'

          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^1)" = "$LIVE_MAIN"
          test "$(git rev-list --count "$LIVE_MAIN..HEAD")" = '1'
          git diff-tree --no-commit-id --name-only -r HEAD | sort -u > /tmp/committed-product-paths
          diff -u /tmp/expected-product-paths /tmp/committed-product-paths
          test -z "$(git status --porcelain)"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main^{commit})" = "$LIVE_MAIN"
          git push --force origin "HEAD:refs/heads/$TARGET"

          cp /tmp/expected-product-paths "$RECEIPT/permanent-paths.txt"
          cp /tmp/product-sha256sums "$RECEIPT/product-SHA256SUMS"
          cp /tmp/live-main-advance-paths "$RECEIPT/safe-anchor-to-parent-paths.txt"
          cat > "$RECEIPT/materialization.txt" <<RECEIPT_DATA
          materializer_workflow_run_id=$GITHUB_RUN_ID
          materializer_workflow_head=$GITHUB_SHA
          known_safe_main=$SAFE_MAIN
          known_safe_tree=$SAFE_TREE
          canonical_parent_commit=$LIVE_MAIN
          canonical_parent_tree=$LIVE_TREE
          materialization_passes=$MATERIALIZATION_PASS
          patched_builder_sha256=$PATCHED_BUILDER_SHA
          product_commit=$PRODUCT_COMMIT
          product_tree=$PRODUCT_TREE
          product_branch=$TARGET
          permanent_paths=13
          carrier_paths=0
          baseline_workflow_run_id=31030908630
          baseline_artifact_id=8940650245
          baseline_artifact_digest=sha256:dc499ff1899811f84be3873df2787835dd70f95a73a64d7652ede4d51f48f7da
          replay_workflow_run_id=31032164683
          replay_artifact_id=8941112372
          replay_artifact_digest=sha256:ae34561d531c077e56473553b09fc2fe834c32d23f03d7eef3f422c700daf831
          selected_locator_rows=5
          overlap_locator_rows=4
          novel_locator_rows=1
          cumulative_unique_archive_snapshots=8
          cumulative_successful_archive_snapshots=8
          cumulative_residual_provider_error_routes=0
          outside_human_dependency=false
          publication_effect=none
          adoption_effect=none
          graph_effect=none
          RECEIPT_DATA
          sed -i 's/^          //' "$RECEIPT/materialization.txt"
          (cd "$RECEIPT" && sha256sum build-output.json materialization.txt permanent-paths.txt product-SHA256SUMS safe-anchor-to-parent-paths.txt > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-archive-minimum-reconciliation-materialization-receipt
          path: /tmp/schoolhouse-archive-minimum-reconciliation-materialization-receipt
          if-no-files-found: error
          retention-days: 90
