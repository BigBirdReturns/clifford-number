name: TEMP execute RD-04 North Dakota FY2026 waiver-index refresh v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.tmp/rd04-nd-fy26-index-refresh-v1/trigger.json'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARRIER_PARENT: a592acea22c69a979f2a90c24a2bafb8c9445759
  CARRIER_TREE: c7dbb1df10b409caa7893846a9e4b3e8d1392be0
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  WAIVER_CELL_SHA256: cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe
  BASE_BRANCH: agent/ssc-rd04-nd-fy26-index-refresh-base-v1
  HEAD_BRANCH: agent/ssc-rd04-nd-fy26-index-refresh-trigger-v1
  WORKFLOW_PATH: .github/workflows/temp-execute-ssc-rd04-nd-fy26-index-refresh-v1.yml
  TRIGGER_PATH: .tmp/rd04-nd-fy26-index-refresh-v1/trigger.json
  ROUTE_ID: RD04-ND-FNA-TIME-LIMIT-WAIVER-INDEX-CANONICAL-2025-2029-REFRESH-2026-07-22-001
  ROUTE_URL: https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029
  OUTPUT_DIR: /tmp/rd04-nd-fy26-index-refresh-v1

concurrency:
  group: temp-rd04-nd-fy26-index-refresh-v1
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'agent/ssc-rd04-nd-fy26-index-refresh-base-v1' &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-fy26-index-refresh-trigger-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute exact current index refresh
        id: execute
        continue-on-error: true
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          stage=bootstrap

          finalize() {
            rc=$?
            trap - EXIT
            set +e
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            if [ ! -f "$OUT/execution-receipt.json" ]; then
              jq -n \
                --arg stage "$stage" \
                --argjson rc "$rc" \
                --arg route_id "$ROUTE_ID" \
                --arg route_url "$ROUTE_URL" \
                '{
                  schema_version:"ssc-rd04-nd-fy26-index-refresh-transport@1",
                  state:"failed_closed",failed_or_final_stage:$stage,exit_code:$rc,
                  route_id:$route_id,requested_url:$route_url,fixed_routes:1,
                  initiated_route_attempts:0,terminal_routes:0,physical_requests:0,
                  followed_redirects:0,result_spawned_requests:0,
                  source_admissions:0,field_classifications:0,field_terminalizations:0,
                  matrix_updates:0,row_state_mutations:0,class_closed:false,
                  cumulative_ledger_effect:"none",outside_human_dependency:false,
                  publication_effect:"none",adoption_effect:"none",graph_effect:"none",
                  additional_execution_authorized:false
                }' > "$OUT/execution-receipt.json"
            fi
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
              sha256sum -c SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          stage=bind_exact_two_level_carrier_and_live_matrix
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          BASE_SHA="$(git rev-parse HEAD^)"
          test "$BASE_SHA" = "$EVENT_BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^")" = "$CARRIER_PARENT"
          test "$(git rev-list --count "$CARRIER_PARENT..$BASE_SHA")" -eq 1
          test "$(git rev-list --count "$BASE_SHA..HEAD")" -eq 1
          test "$(git diff --name-only "$CARRIER_PARENT" "$BASE_SHA")" = "$WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$CARRIER_PARENT" "$BASE_SHA")" = "$WORKFLOW_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CARRIER_PARENT" "$BASE_SHA")"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = "$TRIGGER_PATH"
          test "$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD)" = "$TRIGGER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$BASE_SHA" HEAD)"
          git diff --check "$CARRIER_PARENT" HEAD
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$CARRIER_PARENT"
          test "$(git rev-parse 'origin/main^{tree}')" = "$CARRIER_TREE"
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$MATRIX_BLOB"
          git show "origin/main:$MATRIX_PATH" > "$OUT/matrix.json"
          python - "$OUT/matrix.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          matrix=json.loads(Path(sys.argv[1]).read_text())
          row=[r for r in matrix['rows'] if r.get('unit_id')=='US-STATE-ND']
          assert len(row)==1
          row=row[0]
          assert row['row_state']=='still_open'
          assert row['terminal_fields']==7 and row['open_fields']==2
          cells=[c for c in row['cells'] if c.get('field_id')=='abawd_or_work_requirement_waiver_state_and_governing_period']
          assert len(cells)==1 and cells[0]['state']=='still_open' and cells[0]['terminal'] is False
          body=json.dumps(cells[0],sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          assert hashlib.sha256(body).hexdigest()=='cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe'
          PY
          rm "$OUT/matrix.json"
          printf '%s\n' "$CARRIER_PARENT" > "$OUT/live-main.txt"
          printf '%s\n' "$CARRIER_TREE" > "$OUT/live-main-tree.txt"

          stage=execute_one_exact_get
          python - "$ROUTE_ID" "$ROUTE_URL" "$OUT" <<'PY'
          import hashlib, json, ssl, sys, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, HTTPSHandler

          route_id,url,out=sys.argv[1],sys.argv[2],Path(sys.argv[3])
          class RefuseRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener=build_opener(HTTPSHandler(context=ssl.create_default_context()),RefuseRedirect())
          req=Request(url,headers={'User-Agent':'RD04-evidence-custody/1.0','Accept':'text/html,application/xhtml+xml'})
          started=time.time()
          try:
              resp=opener.open(req,timeout=120)
          except HTTPError as exc:
              resp=exc
          status=int(resp.status)
          headers=list(resp.headers.items())
          body=resp.read(2_000_001)
          elapsed_ms=round((time.time()-started)*1000)
          if len(body)>2_000_000:
              raise RuntimeError('body exceeds 2,000,000-byte ceiling')
          final_url=resp.geturl()
          content_type=resp.headers.get('Content-Type','')
          location=resp.headers.get('Location')
          body_sha=hashlib.sha256(body).hexdigest()
          (out/'response-body.html').write_bytes(body)
          (out/'response-headers.json').write_text(json.dumps(headers,indent=2)+'\n')
          route={
              'schema_version':'ssc-rd04-nd-fy26-index-refresh-route-receipt@1',
              'route_id':route_id,'requested_url':url,'effective_url':final_url,
              'http_status':status,'content_type':content_type,'location':location,
              'body_bytes':len(body),'body_sha256':body_sha,'elapsed_ms':elapsed_ms,
              'physical_requests':1,'followed_redirects':0,'result_spawned_requests':0,
              'terminal_state':'http_success_body_captured' if status==200 else 'terminal_http_observation'
          }
          (out/'route-receipt.json').write_text(json.dumps(route,indent=2,sort_keys=True)+'\n')
          if status!=200:
              raise RuntimeError(f'expected HTTP 200, observed {status}')
          if final_url!=url:
              raise RuntimeError(f'unexpected effective URL {final_url}')
          if not content_type.lower().startswith('text/html'):
              raise RuntimeError(f'unexpected content type {content_type}')
          if not body:
              raise RuntimeError('empty body')
          receipt={
              'schema_version':'ssc-rd04-nd-fy26-index-refresh-transport@1',
              'state':'transport_complete','failed_or_final_stage':'complete','exit_code':0,
              'route_id':route_id,'requested_url':url,'fixed_routes':1,
              'initiated_route_attempts':1,'terminal_routes':1,'physical_requests':1,
              'followed_redirects':0,'result_spawned_requests':0,
              'http_status':status,'content_type':content_type,
              'body_bytes':len(body),'body_sha256':body_sha,
              'source_admissions':0,'field_classifications':0,'field_terminalizations':0,
              'matrix_updates':0,'row_state_mutations':0,'class_closed':False,
              'cumulative_ledger_effect':'none','outside_human_dependency':False,
              'publication_effect':'none','adoption_effect':'none','graph_effect':'none',
              'additional_execution_authorized':False
          }
          (out/'execution-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

          stage=complete
      - name: Preserve exact refresh artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-fy26-index-refresh-v1
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
      - name: Enforce terminal zero-effect transport
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.execute.outcome }}" = success
          test "$(cat "$OUTPUT_DIR/STAGE")" = complete
          test "$(cat "$OUTPUT_DIR/EXIT_CODE")" = 0
          (cd "$OUTPUT_DIR" && sha256sum -c SHA256SUMS)
          jq -e '
            .state=="transport_complete" and .fixed_routes==1 and
            .initiated_route_attempts==1 and .terminal_routes==1 and
            .physical_requests==1 and .followed_redirects==0 and
            .result_spawned_requests==0 and .http_status==200 and
            .source_admissions==0 and .field_terminalizations==0 and
            .matrix_updates==0 and .row_state_mutations==0 and
            .class_closed==false and .additional_execution_authorized==false
          ' "$OUTPUT_DIR/execution-receipt.json" > /dev/null
