name: TEMP stage exact RD-04 North Dakota follow-up adjudication product

on:
  pull_request:
    paths:
      - '.github/scripts/temp-stage-ssc-rd04-postpromotion-nd-followup-two-route-adjudication-v1.sh'
      - '.github/workflows/temp-stage-ssc-rd04-postpromotion-nd-followup-two-route-adjudication-v1.yml'
      - '.tmp/ssc-rd04-postpromotion-nd-followup-two-route-adjudication-v1/**'

permissions:
  contents: write
  issues: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned schema and workflow parsers
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1' 'PyYAML==6.0.2'
      - name: Authenticate temporary carrier program
        run: |
          set -Eeuo pipefail
          test "$(stat -c %s .github/scripts/temp-stage-ssc-rd04-postpromotion-nd-followup-two-route-adjudication-v1.sh)" -eq 14051
          test "$(sha256sum .github/scripts/temp-stage-ssc-rd04-postpromotion-nd-followup-two-route-adjudication-v1.sh | cut -d' ' -f1)" = 8dfea03b41283ace1a99c06a795ac3bd10ff8f8394338c9a3e52d59ce6d99712
          bash -n .github/scripts/temp-stage-ssc-rd04-postpromotion-nd-followup-two-route-adjudication-v1.sh
      - name: Execute exact request-free product transaction
        id: transaction
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/temp-stage-ssc-rd04-postpromotion-nd-followup-two-route-adjudication-v1.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-rd04-postpromotion-nd-followup-two-route-adjudication-stager-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-nd-followup-two-route-adjudication-stager-v1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
      - name: Require typed successful staging receipt
        if: always()
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/ssc-rd04-postpromotion-nd-followup-two-route-adjudication-stager-v1"
          R="$OUT/receipt.json"
          test "${{ steps.transaction.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e '
            .state=="qualified_staging_published" and
            .failed_or_final_stage=="complete" and
            .exit_code==0 and
            .product_parent=="048e9d13a2555d8e6fabdbee5f45aea858f919b7" and
            .product_parent_tree=="d354309d6b936b499c78f3d0ff47d20f69abda78" and
            .product_archive_sha256=="2e5a31f9646962abf620d09d198c3481b4301cb16c11bed95fd59b88e0a6af71" and
            .permanent_product_paths==14 and
            .qualified_full_candidate_tree=="9d5b15d4b78e3027a316f507e46692e215f7e5a8" and
            .staging_paths==14 and
            .permanent_workflow_omitted_from_staging==true and
            .source_admissions==2 and
            .field_decisions==2 and
            .candidate_findings==1 and
            .held_open_cells==1 and
            .source_requests_executed==0 and
            .route_executions==0 and
            .matrix_updates_created_by_stager==0 and
            .field_terminalizations_created_by_stager==0 and
            .row_state_mutations==0 and
            .class_closed==false and
            .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and
            .publication_effect=="none" and
            .adoption_effect=="none" and
            .graph_effect=="none" and
            .product_authority_created==false and
            .connector_final_assembly_required==true
          ' "$R" >/dev/null
