name: Temporary POOF mainline reconciliation materializer

on:
  push:
    branches:
      - agent/poof-clifford-ecology
    paths:
      - '.github/workflows/temporary-poof-mainline-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/poof-clifford-ecology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge canonical Sprint 09 and stable ground
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/temporary-poof-mainline-reconcile.yml
          rm -f build/poof-mainline-reconcile-probe.txt
      - name: Rebuild and validate the reconciled constitutional stack
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-m05-answerable-power-sprint-09.mjs
          node tools/validate-m05-answerable-power-sprint-09.mjs
          node test/m05-answerable-power-sprint-09.test.js
          node tools/build-project-stable-ground-alignment.mjs
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
          npm run ci:poof-ecology
          npm run release:check
          git diff --check
      - name: Play-test the reconciled aperture
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node test/poof-clifford-ecology-browser.test.js
      - name: Commit reconciled permanent surface
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Reconcile POOF ecology with Sprint 09 stable ground'
      - name: Prove deterministic products from the committed tree
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-m05-answerable-power-sprint-09.mjs
          node tools/validate-m05-answerable-power-sprint-09.mjs
          node test/m05-answerable-power-sprint-09.test.js
          node tools/build-project-stable-ground-alignment.mjs
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
          npm run ci:poof-ecology
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Push reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/poof-clifford-ecology
