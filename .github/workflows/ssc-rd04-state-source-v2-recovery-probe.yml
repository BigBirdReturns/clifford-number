name: SSC RD-04 state-source v2 publication tree probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd04-state-source-v2-recovery-probe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print exact publication leases and trees
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main agent/ssc-rd-wave03-rd04-state-source-adjudication-v1
          MAIN=$(git rev-parse origin/main)
          MAIN_TREE=$(git rev-parse 'origin/main^{tree}')
          TARGET=$(git rev-parse origin/agent/ssc-rd-wave03-rd04-state-source-adjudication-v1)
          TARGET_TREE=$(git rev-parse 'origin/agent/ssc-rd-wave03-rd04-state-source-adjudication-v1^{tree}')
          printf 'main=%s\nmain_tree=%s\ntarget=%s\ntarget_tree=%s\n' "$MAIN" "$MAIN_TREE" "$TARGET" "$TARGET_TREE"
          test "$MAIN" = 1099c9f53fa2b07a96ea9d0cd108d9332eccfb96
          test "$TARGET" = 08dcb3843b6295bf3339f70f4654c6ce3b7d3c42
