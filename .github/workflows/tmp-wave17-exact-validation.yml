name: Temporary exact Wave 17 clean-head validation

on:
  push:
    branches:
      - agent/tmp-wave17-exact-validation
    paths:
      - '.github/tmp/tmp-wave17-exact-validation-trigger.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove the exact materialized Wave 17 commit
        shell: bash
        run: |
          set -euo pipefail
          original_sha=$(git rev-parse HEAD)
          git worktree add --detach /tmp/wave17-exact ce5a3b6f4091f8832d927357a3e1d9d2e6739fb0
          cd /tmp/wave17-exact
          test "$(git rev-parse HEAD)" = 'ce5a3b6f4091f8832d927357a3e1d9d2e6739fb0'
          npm run release:check
          git reset --hard HEAD
          git clean -fd
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-residual-frontier-wave-17.test.js
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
          cd "$GITHUB_WORKSPACE"
          mkdir -p data/project
          cat > data/project/tmp-wave17-exact-validation-result.json <<JSON
          {
            "schema_version": "tmp-wave17-exact-validation-result@1",
            "target_commit": "ce5a3b6f4091f8832d927357a3e1d9d2e6739fb0",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "release_check_passed": true,
            "lake_shard_validation_passed": true,
            "lake_basin_validation_passed": true,
            "wave_17_validation_passed": true,
            "wave_17_regression_passed": true,
            "clean_worktree_restored": true
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/project/tmp-wave17-exact-validation-result.json
          git commit -m 'Record exact Wave 17 clean-head validation'
          git fetch origin agent/tmp-wave17-exact-validation
          test "$(git rev-parse origin/agent/tmp-wave17-exact-validation)" = "$original_sha"
          git push origin HEAD:agent/tmp-wave17-exact-validation
