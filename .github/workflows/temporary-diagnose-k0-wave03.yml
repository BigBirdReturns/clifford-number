name: Temporary diagnose K0 role-neutral Wave 03

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave03.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and expand carrier
        run: |
          base64 -d .github/tmp/k0-wave03-materializer.b64 > /tmp/k0-wave03-materializer.tgz
          test "$(sha256sum /tmp/k0-wave03-materializer.tgz | awk '{print $1}')" = "51b43d6772b0be8c0312e3fd24de339d5d230711b852f4dacb863364a8fe7b33"
          mkdir -p /tmp/k0-wave03-materializer
          tar -xzf /tmp/k0-wave03-materializer.tgz -C /tmp/k0-wave03-materializer
      - name: Materialize source package
        run: node /tmp/k0-wave03-materializer/materialize-k0-role-neutral-wave-03.mjs
      - name: Build Wave 03
        run: node tools/build-k0-role-neutral-wave-03.mjs
      - name: Validate Wave 03
        run: node tools/validate-k0-role-neutral-wave-03.mjs
      - name: Test Wave 03
        run: node test/k0-role-neutral-wave-03.test.js
      - name: Build aggregate K0
        run: node tools/build-k0-epistemic-admissibility.mjs
      - name: Validate aggregate K0
        run: node tools/validate-k0-epistemic-admissibility.mjs
      - name: Test aggregate K0
        run: node test/k0-epistemic-admissibility.test.js
      - name: Validate corpus selection
        run: node tools/validate-corpus-selection.mjs
      - name: Validate consumption contract
        run: node tools/validate-consumption-contract.mjs
