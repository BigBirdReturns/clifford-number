name: Apply Wave 39 standalone narrative custody fix

on:
  push:
    branches:
      - agent/counter-selector-wave-39-digest-selected-restore
    paths:
      - '.github/workflows/apply-wave39-standalone-narrative-custody.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-standalone-narrative-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/counter-selector-wave-39-digest-selected-restore
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact narrative custody and qualify permanent product
        env:
          BRANCH_NAME: agent/counter-selector-wave-39-digest-selected-restore
          EXPECTED_PRODUCT: 012b507a4abf9e31acea9cf466039c467318c25f
          EXPECTED_METHOD_SHA256: 452e1018186cf5aee08b1d6fd49fba1fb26c46b8016fe6f38c759e684f53cdc6
          EXPECTED_MILESTONE_SHA256: ce46ddce7c819eb096b7beb00cbd645cbfa7f38a7e41856867ddeab6b6621483
        run: |
          set -euo pipefail

          git config user.name 'Wave 39 narrative custodian'
          git config user.email 'wave39-narrative-custodian@users.noreply.github.com'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT"
          test -z "$(git status --porcelain)"

          python3 - <<'PY'
          from pathlib import Path

          validator = Path('tools/validate-counter-selector-wave-39.mjs')
          text = validator.read_text()
          replacements = [
              (
                  "const HTML_PATH = 'reports/core-thesis/counter-selector-wave-39/index.html';\nconst EXPECTED_SOURCE_SHA256",
                  "const HTML_PATH = 'reports/core-thesis/counter-selector-wave-39/index.html';\nconst METHOD_PATH = 'docs/methods/counter-selector-digest-selected-restore.md';\nconst MILESTONE_PATH = 'docs/milestones/counter-selector-wave-39.md';\nconst EXPECTED_METHOD_SHA256 = '452e1018186cf5aee08b1d6fd49fba1fb26c46b8016fe6f38c759e684f53cdc6';\nconst EXPECTED_MILESTONE_SHA256 = 'ce46ddce7c819eb096b7beb00cbd645cbfa7f38a7e41856867ddeab6b6621483';\nconst EXPECTED_SOURCE_SHA256",
              ),
              (
                  "function sha256(buffer) { return crypto.createHash('sha256').update(buffer).digest('hex'); }\n\nexport const EXPECTED_COUNTS",
                  "function sha256(buffer) { return crypto.createHash('sha256').update(buffer).digest('hex'); }\n\nexport function validateStandaloneNarratives(\n  methodBytes = fs.readFileSync(path.join(ROOT, METHOD_PATH)),\n  milestoneBytes = fs.readFileSync(path.join(ROOT, MILESTONE_PATH)),\n) {\n  assert.equal(sha256(methodBytes), EXPECTED_METHOD_SHA256, 'method narrative exact-contract drift');\n  assert.equal(sha256(milestoneBytes), EXPECTED_MILESTONE_SHA256, 'milestone narrative exact-contract drift');\n}\n\nexport const EXPECTED_COUNTS",
              ),
              (
                  "  validateSource(source);\n  validateSchemaAgainstSource(schema, source);\n  const expectedRegistry",
                  "  validateSource(source);\n  validateSchemaAgainstSource(schema, source);\n  validateStandaloneNarratives();\n  const expectedRegistry",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'validator replacement count {text.count(old)} for {old[:80]!r}')
              text = text.replace(old, new)
          validator.write_text(text)

          test = Path('test/counter-selector-wave-39.test.js')
          text = test.read_text()
          old_import = "import { validateSource, validateSchemaAgainstSource, EXPECTED_ADJUDICATIONS, EXPECTED_BOUNDARIES, EXPECTED_COUNTS, EXPECTED_JOIN_MATRIX, EXPECTED_SOURCE_RECORDS, EXPECTED_CONTROL_METADATA } from '../tools/validate-counter-selector-wave-39.mjs';"
          new_import = "import { validateSource, validateSchemaAgainstSource, validateStandaloneNarratives, EXPECTED_ADJUDICATIONS, EXPECTED_BOUNDARIES, EXPECTED_COUNTS, EXPECTED_JOIN_MATRIX, EXPECTED_SOURCE_RECORDS, EXPECTED_CONTROL_METADATA } from '../tools/validate-counter-selector-wave-39.mjs';"
          if text.count(old_import) != 1:
              raise SystemExit('test import replacement mismatch')
          text = text.replace(old_import, new_import)
          old_inputs = "const schema = JSON.parse(fs.readFileSync('schemas/counter-selector-digest-selected-restore.schema.json', 'utf8'));\nconst clone = value => structuredClone(value);"
          new_inputs = "const schema = JSON.parse(fs.readFileSync('schemas/counter-selector-digest-selected-restore.schema.json', 'utf8'));\nconst methodNarrative = fs.readFileSync('docs/methods/counter-selector-digest-selected-restore.md');\nconst milestoneNarrative = fs.readFileSync('docs/milestones/counter-selector-wave-39.md');\nconst clone = value => structuredClone(value);"
          if text.count(old_inputs) != 1:
              raise SystemExit('test input replacement mismatch')
          text = text.replace(old_inputs, new_inputs)
          old_tail = "const exactContractTamperCases = sourceContractTamperCases.length + schemaContractTamperCases.length;\nassert.equal(exactContractTamperCases, 6);\nconsole.log(`counter-selector-wave-39.test: ${mutations.length} adversarial mutations + ${exactContractTamperCases} exact-contract tamper cases PASS`);"
          new_tail = "const narrativeContractTamperCases = [\n  [Buffer.concat([methodNarrative, Buffer.from('\\nmutated narrative\\n')]), milestoneNarrative],\n  [methodNarrative, Buffer.from(milestoneNarrative.toString('utf8').replace(\n    'one bounded observed public checkpoint control',\n    'first public checkpoint control',\n  ), 'utf8')],\n];\nfor (const [index, [methodCandidate, milestoneCandidate]] of narrativeContractTamperCases.entries()) {\n  assert.throws(\n    () => validateStandaloneNarratives(methodCandidate, milestoneCandidate),\n    undefined,\n    `narrative contract tamper ${index + 1} should fail`,\n  );\n}\n\nconst exactContractTamperCases = sourceContractTamperCases.length\n  + schemaContractTamperCases.length\n  + narrativeContractTamperCases.length;\nassert.equal(exactContractTamperCases, 8);\nconsole.log(`counter-selector-wave-39.test: ${mutations.length} adversarial mutations + ${exactContractTamperCases} exact-contract tamper cases PASS`);"
          if text.count(old_tail) != 1:
              raise SystemExit('test tail replacement mismatch')
          test.write_text(text.replace(old_tail, new_tail))
          PY

          rm -f .github/workflows/apply-wave39-standalone-narrative-custody.yml

          node tools/build-counter-selector-wave-39.mjs
          node tools/validate-counter-selector-wave-39.mjs
          node test/counter-selector-wave-39.test.js

          git add -A
          git diff --cached --check
          cat > /tmp/wave39-narrative-paths.txt <<'EOF'
          data/project/counter-selector-wave-39-release-manifest.json
          reports/core-thesis/counter-selector-wave-39/data.json
          test/counter-selector-wave-39.test.js
          tools/validate-counter-selector-wave-39.mjs
          EOF
          sed -i 's/^          //' /tmp/wave39-narrative-paths.txt
          git diff --cached --name-only "$EXPECTED_PRODUCT" | LC_ALL=C sort > /tmp/wave39-actual-paths.txt
          diff -u /tmp/wave39-narrative-paths.txt /tmp/wave39-actual-paths.txt

          git commit -m 'Wave 39: bind standalone narrative contracts'
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"

          rm -rf /tmp/wave39-narrative-gate
          git worktree add --detach /tmp/wave39-narrative-gate "$PRODUCT_COMMIT"
          (
            cd /tmp/wave39-narrative-gate
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            npm run release:check
            git restore --staged --worktree .
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            test -z "$(git status --porcelain)"
          )
          git worktree remove /tmp/wave39-narrative-gate

          git diff --name-only "$EXPECTED_PRODUCT..$PRODUCT_COMMIT" | LC_ALL=C sort > /tmp/wave39-final-paths.txt
          diff -u /tmp/wave39-narrative-paths.txt /tmp/wave39-final-paths.txt
          test -z "$(git status --porcelain)"

          python3 - <<PY
          import json
          from pathlib import Path
          receipt = {
              'schema_version': 'counter-selector-wave-39-standalone-narrative-custody-receipt@1',
              'parent_commit': '$EXPECTED_PRODUCT',
              'product_commit': '$PRODUCT_COMMIT',
              'product_tree': '$PRODUCT_TREE',
              'method_sha256': '$EXPECTED_METHOD_SHA256',
              'milestone_sha256': '$EXPECTED_MILESTONE_SHA256',
              'changed_paths': Path('/tmp/wave39-narrative-paths.txt').read_text().splitlines(),
              'adversarial_mutations': 205,
              'exact_contract_tamper_cases': 8,
              'standalone_narrative_contracts': 'exact_sha256_bound',
              'complete_release_gate': 'passed',
              'deterministic_reconstruction': 'passed',
              'temporary_paths_survive': False,
          }
          Path('/tmp/counter-selector-wave-39-standalone-narrative-custody.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

          git push --force-with-lease="refs/heads/$BRANCH_NAME:$(git rev-parse HEAD^)" origin "HEAD:refs/heads/$BRANCH_NAME"
      - name: Preserve exact custody receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-selector-wave-39-standalone-narrative-custody-${{ github.run_id }}
          path: /tmp/counter-selector-wave-39-standalone-narrative-custody.json
          if-no-files-found: error
