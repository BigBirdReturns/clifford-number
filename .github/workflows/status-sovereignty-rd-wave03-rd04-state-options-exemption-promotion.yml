name: Status sovereignty RD Wave 03 RD-04 State Options exemption promotion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/**'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/promoted-partial-field-matrix.json'
      - 'docs/milestones/ssc-rd-wave03-rd04-state-options-exemption-promotion.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs'
      - 'test/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/**'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/promoted-partial-field-matrix.json'
      - 'docs/milestones/ssc-rd-wave03-rd04-state-options-exemption-promotion.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs'
      - 'test/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd04-wave03-state-options-exemption-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report exact head and tree
        run: |
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - name: Validate exact one-field fifty-state transition
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.test.js
          node tools/build-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          root = Path('.')
          schema = json.loads((root / 'schemas/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.schema.json').read_text())
          data = root / 'data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion'
          for name in [
              'source-custody.json',
              'promoted-partial-field-matrix.json',
              'remaining-open-field-census.json',
              'promotion-summary.json',
              'product-manifest.json',
          ]:
              jsonschema.Draft202012Validator(schema).validate(json.loads((data / name).read_text()))
          print('closed_schema_validation=pass')
          PY
          node test/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.test.js
          node tools/validate-no-magic-human-gate.mjs
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove clean deterministic replay
        run: |
          set -Eeuo pipefail
          git restore --staged --worktree .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs --write
          node tools/build-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs
          node test/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve exact State Options promotion custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-wave03-state-options-exemption-promotion
          path: |
            data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion
            schemas/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.schema.json
            docs/milestones/ssc-rd-wave03-rd04-state-options-exemption-promotion.md
          if-no-files-found: error
          retention-days: 90
