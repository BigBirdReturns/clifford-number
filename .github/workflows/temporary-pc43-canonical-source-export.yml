name: TEMP export exact canonical PC-42 source for PC-43

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc43-canonical-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5782105034a6ef2dae9422e8b15eab2345b8980b
          fetch-depth: 1
      - name: Export exact canonical PC-42 source
        run: |
          set -Eeuo pipefail
          expected=5782105034a6ef2dae9422e8b15eab2345b8980b
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$expected"
          out=/tmp/pc43-canonical-source
          mkdir -p "$out"
          printf '%s\n' "$observed" > "$out/source-head.sha"
          git rev-parse 'HEAD^{tree}' > "$out/source-tree.sha"
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './dist/*' \
            -printf '%P\n' | LC_ALL=C sort > "$out/source-paths.txt"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            -czf "$out/source.tar.gz" .
          stat -c '%s' "$out/source.tar.gz" > "$out/source.bytes"
          sha256sum "$out/source.tar.gz" > "$out/source.sha256"
          wc -l < "$out/source-paths.txt" | tr -d ' ' > "$out/source-path-count.txt"
          test "$(cat "$out/source-path-count.txt")" -gt 4000
      - uses: actions/upload-artifact@v4
        with:
          name: pc43-canonical-pc42-source
          path: /tmp/pc43-canonical-source
          if-no-files-found: error
          retention-days: 7
