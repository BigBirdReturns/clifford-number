name: TEMP materialize recursive PC-48 cache repair

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/pc48-source-export'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact checksum-bound repair carrier
        uses: actions/checkout@v4
        with:
          ref: bdad48379c5217645eea48af3ed102c084801347
          fetch-depth: 0

      - name: Preserve exact repair programs
        run: |
          set -euo pipefail
          cp .pc48-repair/cache-v3.py /tmp/cache-v3.py
          cp .pc48-repair/cache-v3-run.sh /tmp/cache-v3-run.sh
          sha256sum /tmp/cache-v3.py /tmp/cache-v3-run.sh

      - name: Checkout exact first cache-repair candidate
        uses: actions/checkout@v4
        with:
          ref: 517637995fcf44d3d099d15a23372da5e2fcb2b2
          fetch-depth: 0
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct, rebind, qualify, and publish exact candidate
        run: bash /tmp/cache-v3-run.sh

      - name: Upload exact recursive cache-repair custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc48-recursive-cache-safety-repair-v3
          path: |
            /tmp/pc48-cache-v3-receipt.txt
            /tmp/pc48-cache-v3-diagnostic.txt
            /tmp/pc48-cache-v3-push.log
            /tmp/pc48-cache-v3-test.log
          if-no-files-found: error
