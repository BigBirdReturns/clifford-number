name: TEMP retire PC-48 refs

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/pc48-source-export'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main with ref-deletion authority
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prove merged custody and delete exact temporary refs
        run: |
          set -Eeuo pipefail

          MERGE_RECEIPT=5e926c349071dc8372ac2beca148f90f1d1b8900
          PRODUCT_HEAD=705a1b06325d9362a02411c6736a4a8e7c0b1956
          MATERIALIZER_HEAD=d7f668a4522be902c50ad8bdce8100fc58341116

          git fetch --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/agent/pc48-materializer:refs/remotes/origin/agent/pc48-materializer \
            +refs/heads/agent/pc48-postmerge-cache-repair:refs/remotes/origin/agent/pc48-postmerge-cache-repair \
            +refs/heads/agent/pc48-source-export:refs/remotes/origin/agent/pc48-source-export

          current_main="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse refs/remotes/origin/agent/pc48-postmerge-cache-repair)" = "$PRODUCT_HEAD"
          test "$(git rev-parse refs/remotes/origin/agent/pc48-materializer)" = "$MATERIALIZER_HEAD"
          git merge-base --is-ancestor "$MERGE_RECEIPT" "$current_main"
          git merge-base --is-ancestor "$PRODUCT_HEAD" "$current_main"
          git merge-base --is-ancestor "$MATERIALIZER_HEAD" "$current_main"

          git push origin --delete \
            agent/pc48-materializer \
            agent/pc48-postmerge-cache-repair

          test -z "$(git ls-remote --heads origin \
            refs/heads/agent/pc48-materializer \
            refs/heads/agent/pc48-postmerge-cache-repair)"

          git push origin --delete agent/pc48-source-export
          test -z "$(git ls-remote --heads origin refs/heads/agent/pc48-source-export)"

          {
            echo '## PC-48 temporary-ref retirement'
            echo
            echo "- current main: \`$current_main\`"
            echo "- merge receipt: \`$MERGE_RECEIPT\`"
            echo "- retired: \`agent/pc48-materializer\`"
            echo "- retired: \`agent/pc48-postmerge-cache-repair\`"
            echo "- retired: \`agent/pc48-source-export\`"
            echo '- outside-human dependency: false'
          } >> "$GITHUB_STEP_SUMMARY"
