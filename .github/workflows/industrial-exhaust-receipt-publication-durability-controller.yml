name: Industrial-exhaust receipt publication durability controller

on:
  push:
    branches:
      - agent/industrial-exhaust-receipt-publication-durability-controller-v1
    paths:
      - .github/workflows/industrial-exhaust-receipt-publication-durability-controller.yml

permissions:
  contents: write

concurrency:
  group: industrial-exhaust-receipt-publication-durability-controller
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/industrial-exhaust-receipt-publication-durability-controller-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reproduce, repair, qualify, and publish
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='bd66952df64b7eef2e673af724e922ad3f6a719a'
          PRODUCT_BRANCH='agent/industrial-exhaust-receipt-publication-durability-v1'
          WORKFLOW_PATH='.github/workflows/industrial-exhaust-receipt-publication-durability-controller.yml'
          LIB_PATH='tools/lib/industrial-exhaust-artifacts.mjs'
          TEST_PATH='test/industrial-exhaust-retained-store-custody.test.js'
          current_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t controller_diff < <(git diff --name-only "$BASE_SHA" "$current_sha")
          test "${#controller_diff[@]}" -eq 1
          test "${controller_diff[0]}" = "$WORKFLOW_PATH"

          OLD_Z64=''
          NEW_Z64=''
          TEST_Z64=''
          export OLD_Z64 NEW_Z64 TEST_Z64

          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          test_path = Path('test/industrial-exhaust-retained-store-custody.test.js')
          text = test_path.read_text()
          marker = "  const indexAbsolutePath = path.join(rootDir, indexReceiptPath);\n"
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected test insertion marker count: {text.count(marker)}')
          insertion = zlib.decompress(base64.b64decode(os.environ['TEST_Z64'])).decode()
          test_path.write_text(text.replace(marker, insertion + marker, 1))
          PY

          set +e
          node "$TEST_PATH" > /tmp/durability-predecessor.log 2>&1
          predecessor_status=$?
          set -e
          test "$predecessor_status" -ne 0
          grep -Eq 'must synchronize its directory after linking the receipt' /tmp/durability-predecessor.log

          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          lib_path = Path('tools/lib/industrial-exhaust-artifacts.mjs')
          text = lib_path.read_text()
          old = zlib.decompress(base64.b64decode(os.environ['OLD_Z64'])).decode()
          new = zlib.decompress(base64.b64decode(os.environ['NEW_Z64'])).decode()
          if text.count(old) != 1:
              raise SystemExit(f'unexpected publication function count: {text.count(old)}')
          lib_path.write_text(text.replace(old, new, 1))
          PY

          rm "$WORKFLOW_PATH"
          node --check "$LIB_PATH"
          node --check "$TEST_PATH"
          node "$TEST_PATH"
          node test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node tools/hydrate-industrial-exhaust.mjs --audit
          git diff --check

          mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA")
          test "${#changed_paths[@]}" -eq 2
          test "${changed_paths[0]}" = "$TEST_PATH"
          test "${changed_paths[1]}" = "$LIB_PATH"

          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/${PRODUCT_BRANCH}" >/dev/null 2>&1; then
            echo "product branch already exists" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          product_sha="$(
            printf '%s\n\n%s\n'               'fix(industrial-exhaust): make receipt publication crash-durable'               'Synchronize the receipt directory chain and final publication entry, including idempotent reuse.'               | git commit-tree "$tree_sha" -p "$BASE_SHA"
          )"
          mapfile -t product_paths < <(git diff --name-only "$BASE_SHA" "$product_sha")
          test "${#product_paths[@]}" -eq 2
          test "${product_paths[0]}" = "$TEST_PATH"
          test "${product_paths[1]}" = "$LIB_PATH"
          git diff --check "$BASE_SHA" "$product_sha"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git push origin "${product_sha}:refs/heads/${PRODUCT_BRANCH}"
          echo "PRODUCT_SHA=${product_sha}"
