name: Counter-Selector Wave 13 Batch 04 blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-13.yml'
      - 'data/project/counter-selector-wave-13-blind-review.json'
      - 'data/project/counter-selector-blind-review-b04-registry.json'
      - 'data/project/counter-selector-review-disagreement-b04-ledger.json'
      - 'data/project/counter-selector-wave-13-release-manifest.json'
      - 'schemas/counter-selector-blind-review-b04.schema.json'
      - 'docs/methods/counter-selector-blind-review-b04.md'
      - 'docs/milestones/counter-selector-wave-13.md'
      - 'tools/build-counter-selector-wave-13.mjs'
      - 'tools/validate-counter-selector-wave-13.mjs'
      - 'test/counter-selector-wave-13.test.js'
      - 'reports/core-thesis/counter-selector-wave-13/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-13-b04-blind-review'
    paths:
      - '.github/workflows/counter-selector-wave-13.yml'
      - 'data/project/counter-selector-wave-13-blind-review.json'
      - 'data/project/counter-selector-blind-review-b04-registry.json'
      - 'data/project/counter-selector-review-disagreement-b04-ledger.json'
      - 'data/project/counter-selector-wave-13-release-manifest.json'
      - 'schemas/counter-selector-blind-review-b04.schema.json'
      - 'docs/methods/counter-selector-blind-review-b04.md'
      - 'docs/milestones/counter-selector-wave-13.md'
      - 'tools/build-counter-selector-wave-13.mjs'
      - 'tools/validate-counter-selector-wave-13.mjs'
      - 'test/counter-selector-wave-13.test.js'
      - 'reports/core-thesis/counter-selector-wave-13/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 13 products
        run: node tools/build-counter-selector-wave-13.mjs
      - name: Validate Batch 04 blind-review contract
        run: node tools/validate-counter-selector-wave-13.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-13.test.js
      - name: Require exact committed Wave 13 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-blind-review-b04-registry.json \
            data/project/counter-selector-review-disagreement-b04-ledger.json \
            data/project/counter-selector-wave-13-release-manifest.json \
            reports/core-thesis/counter-selector-wave-13/data.json \
            reports/core-thesis/counter-selector-wave-13/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 13 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-13.mjs
          node tools/validate-counter-selector-wave-13.mjs
          node test/counter-selector-wave-13.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
