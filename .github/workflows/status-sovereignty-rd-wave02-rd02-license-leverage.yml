name: SSC RD-02 Wave 02 terminal license and leverage chronology

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd02-license-leverage.yml'
      - 'data/intake/status-sovereignty-rd02-sbicct-state-transitions.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd02-license-leverage/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-02-C04.json'
      - 'data/project/ssc-residual-wave02/closures/RD-02-C04.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-rd-wave02-rd02-license-leverage/**'
      - 'schemas/status-sovereignty-rd-wave02-rd02-license-leverage.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd02-license-leverage.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd02-license-leverage.mjs'
      - 'test/status-sovereignty-rd-wave02-rd02-license-leverage.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd02-license-leverage.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd02-license-leverage.yml'
      - 'data/intake/status-sovereignty-rd02-sbicct-state-transitions.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd02-license-leverage/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-02-C04.json'
      - 'data/project/ssc-residual-wave02/closures/RD-02-C04.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-rd-wave02-rd02-license-leverage/**'
      - 'schemas/status-sovereignty-rd-wave02-rd02-license-leverage.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd02-license-leverage.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd02-license-leverage.mjs'
      - 'test/status-sovereignty-rd-wave02-rd02-license-leverage.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd02-license-leverage.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd02-wave02-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove exact terminal RD-02 product
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave02-rd02-license-leverage.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd02-license-leverage.mjs
          node test/status-sovereignty-rd-wave02-rd02-license-leverage.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore volatile outputs and replay
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          node tools/build-status-sovereignty-rd-wave02-rd02-license-leverage.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd02-license-leverage.mjs
          node test/status-sovereignty-rd-wave02-rd02-license-leverage.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve terminal product
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd02-wave02-terminal-license-leverage
          path: |
            data/intake/status-sovereignty-rd-wave02-rd02-license-leverage/fixed-source-capture-execution-receipt.json
            data/project/ssc-residual-wave02/closures/RD-02-C04.json
            data/research/status-sovereignty-rd-wave02-rd02-license-leverage
            schemas/status-sovereignty-rd-wave02-rd02-license-leverage.schema.json
            docs/milestones/ssc-rd-wave02-rd02-license-leverage.md
          if-no-files-found: error
          retention-days: 90
