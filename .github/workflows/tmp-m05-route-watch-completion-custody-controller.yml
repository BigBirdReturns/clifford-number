name: NEVER MERGE M-05 completion-custody controller

on:
  push:
    branches:
      - agent/m05-s03-l7-route-watch-completion-custody-controller-v1

permissions:
  contents: write

concurrency:
  group: m05-route-watch-completion-custody-controller
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 6535b119f1edf8aeafa9ce0d58813c85901be5f3
      BASE_TREE: 187aec69c4efca7366219cb7d1db4b7febc62883
      MAIN_LEASE: 242efd8190cd07b781c395c9fd7e9523c8de02a6
      PRODUCT_BRANCH: agent/m05-s03-l7-route-watch-temporal-custody-v1
      PRODUCT_LEASE: 167391c520e71021a88aa97740624bc15dd87df3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize one direct-parent two-path product
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse origin/main)" = "$MAIN_LEASE"
          test "$(git rev-parse "origin/${PRODUCT_BRANCH}")" = "$PRODUCT_LEASE"
          test "$(git show -s --format=%T "$BASE_SHA")" = "$BASE_TREE"
          test "$(git show -s --format=%P "$PRODUCT_LEASE")" = "$BASE_SHA"

          product_dir="$RUNNER_TEMP/m05-route-watch-completion-custody-product"
          intended_dir="$RUNNER_TEMP/m05-route-watch-completion-custody-intended"
          rm -rf "$product_dir" "$intended_dir"
          git worktree add --detach "$product_dir" "$PRODUCT_LEASE"

          python3 - "$product_dir" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          library_path = root / 'tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          test_path = root / 'test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          library = library_path.read_text(encoding='utf-8')
          library = replace_once(
              library,
              "function policyObservation(lane,route,observedAt,status,reason,extra={}){",
              "function createPolicyObservation(lane,route,observedAt,status,reason,extra={}){",
              'policy-observation constructor rename',
          )
          library = replace_once(
              library,
              "  const startedAt=new Date(clock()).toISOString();\n  let current=new URL(route.url);",
              "  const startedAt=new Date(clock()).toISOString();\n"
              "  const policyObservation=(targetLane,targetRoute,targetObservedAt,status,reason,extra={})=>createPolicyObservation(\n"
              "    targetLane,targetRoute,targetObservedAt,status,reason,\n"
              "    {...extra,completed_at:new Date(clock()).toISOString()}\n"
              "  );\n"
              "  let current=new URL(route.url);",
              'executed-terminal completion wrapper',
          )
          library = replace_once(
              library,
              "      return policyObservation(lane,route,observedAt,'gated_not_before','ordinary Intel acquisition gate has not opened',{not_before_utc:activation.not_before_utc});",
              "      return createPolicyObservation(lane,route,observedAt,'gated_not_before','ordinary Intel acquisition gate has not opened',{not_before_utc:activation.not_before_utc});",
              'gated-row completion exemption',
          )
          library = replace_once(
              library,
              "const COMPLETED_STATUSES=new Set(['content_retrieved','metadata_only','challenge_page','http_failure']);",
              "const COMPLETED_STATUSES=new Set([...TERMINAL_STATUSES].filter((status)=>status!=='gated_not_before'));",
              'all-executed-status completion denominator',
          )
          library_path.write_text(library, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          insertion = r'''

          {
            const beforeGate=Date.parse('2026-08-26T23:00:00Z');
            clockValue=Math.max(clockValue,beforeGate+1000);
            const receipt=await runRouteWatch(contract,{
              observedAtMs:beforeGate,
              fetchImpl:async()=>successResponse('completion custody before gate'),
              sleepImpl:noSleep,
              clock
            });
            validateReceipt(receipt,contract);
            const gated=receipt.observations.filter((row)=>row.status==='gated_not_before');
            const executed=receipt.observations.filter((row)=>row.status!=='gated_not_before');
            assert.equal(gated.length,4);
            assert.equal(executed.length,16);
            assert(gated.every((row)=>!Object.prototype.hasOwnProperty.call(row,'completed_at')));
            assert(executed.every((row)=>Object.prototype.hasOwnProperty.call(row,'completed_at')));

            const forgedGatedCompletion=clone(receipt);
            const gatedIndex=forgedGatedCompletion.observations.findIndex((row)=>row.status==='gated_not_before');
            forgedGatedCompletion.observations[gatedIndex].completed_at=forgedGatedCompletion.generated_at;
            resign(forgedGatedCompletion);
            assert.throws(()=>validateReceipt(forgedGatedCompletion,contract),/keys drift/u);
          }

          {
            const lane=contract.lanes[0];
            const route={...lane.routes[0],url:'http://ministers.dss.gov.au/media-releases/51'};
            clockValue=Math.max(clockValue,Date.parse('2026-08-28T12:00:00Z'));
            const observation=await fetchOfficialRoute(lane,route,contract,{
              fetchImpl:async()=>{throw new Error('pre-request refusal must not execute')},
              clock
            });
            assert.equal(observation.status,'policy_refusal');
            assert.equal(observation.reason,'non_https_target');
            assert(Object.prototype.hasOwnProperty.call(observation,'completed_at'));
            assert(Date.parse(observation.completed_at)>=Date.parse(observation.observed_at));
          }

          {
            const afterGate=Date.parse('2026-08-28T12:00:00Z');
            const bounded=clone(contract);
            bounded.execution_policy.max_body_bytes=1024;
            validateContract(bounded);
            const failureCases=[
              {
                status:'transport_failure',
                receiptContract:contract,
                fetchImpl:async()=>{
                  const error=new Error('synthetic connection reset');
                  error.code='ECONNRESET';
                  throw error;
                }
              },
              {
                status:'timeout',
                receiptContract:contract,
                fetchImpl:async()=>{
                  const error=new Error('synthetic timeout');
                  error.name='AbortError';
                  throw error;
                }
              },
              {
                status:'body_limit_exceeded',
                receiptContract:bounded,
                fetchImpl:async()=>new Response(Buffer.alloc(1025,1),{status:200,headers:{'content-type':'application/octet-stream'}})
              },
              {
                status:'policy_refusal',
                receiptContract:contract,
                fetchImpl:async()=>new Response(null,{status:302,headers:{location:'https://example.com/refused'}})
              }
            ];

            for(const failureCase of failureCases){
              clockValue=Math.max(clockValue,afterGate+1000);
              const receipt=await runRouteWatch(failureCase.receiptContract,{
                observedAtMs:afterGate,
                fetchImpl:failureCase.fetchImpl,
                sleepImpl:noSleep,
                clock
              });
              validateReceipt(receipt,failureCase.receiptContract);
              assert.equal(receipt.observations.length,20);
              assert(receipt.observations.every((row)=>row.status===failureCase.status));
              assert(receipt.observations.every((row)=>Object.prototype.hasOwnProperty.call(row,'completed_at')));
              assert(receipt.observations.every((row)=>Date.parse(row.completed_at)>=Date.parse(row.observed_at)));
              assert(receipt.observations.every((row)=>Date.parse(row.completed_at)<=Date.parse(receipt.generated_at)));

              const missingCompletion=clone(receipt);
              delete missingCompletion.observations[0].completed_at;
              resign(missingCompletion);
              assert.throws(()=>validateReceipt(missingCompletion,failureCase.receiptContract),/keys drift/u);

              const completionAfterGeneration=clone(receipt);
              completionAfterGeneration.observations[0].completed_at=new Date(Date.parse(completionAfterGeneration.generated_at)+1).toISOString();
              resign(completionAfterGeneration);
              assert.throws(()=>validateReceipt(completionAfterGeneration,failureCase.receiptContract),/completes after receipt generation/u);
            }
          }
          '''
          tests = replace_once(
              tests,
              "\nconsole.log('m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test: OK');\n",
              insertion + "\nconsole.log('m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test: OK');\n",
              'completion-custody adversarial suite insertion',
          )
          test_path.write_text(tests, encoding='utf-8')
          PY

          cd "$product_dir"
          expected=(
            'test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js'
            'tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          )
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" -- | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          mkdir -p "$intended_dir"
          intended_hashes=()
          for path in "${expected[@]}"; do
            mkdir -p "$intended_dir/$(dirname "$path")"
            cp -- "$path" "$intended_dir/$path"
            intended_hashes+=("$(sha256sum "$path" | cut -d' ' -f1)")
          done

          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          npm run release:check

          for index in "${!expected[@]}"; do
            path="${expected[$index]}"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "${intended_hashes[$index]}"
          done

          git restore --source="$BASE_SHA" --staged --worktree -- .
          git clean -fd
          for index in "${!expected[@]}"; do
            path="${expected[$index]}"
            mkdir -p "$(dirname "$path")"
            cp -- "$intended_dir/$path" "$path"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "${intended_hashes[$index]}"
          done

          mapfile -t final_changed < <(git diff --name-only "$BASE_SHA" -- | sort)
          test "${#final_changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${final_changed[$index]}" = "${expected[$index]}"
          done
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check
          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js

          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git add -- "${expected[@]}"
          product_tree="$(git write-tree)"
          product_sha="$(printf '%s\n' '[M-05 S03-L7] Bind every terminal route receipt to one temporal window' | git commit-tree "$product_tree" -p "$BASE_SHA")"
          test "$(git show -s --format=%T "$product_sha")" = "$product_tree"
          test "$(git show -s --format=%P "$product_sha")" = "$BASE_SHA"
          mapfile -t committed < <(git diff --name-only "$BASE_SHA" "$product_sha" | sort)
          test "${#committed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${committed[$index]}" = "${expected[$index]}"
          done

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse origin/main)" = "$MAIN_LEASE"
          test "$(git rev-parse "origin/${PRODUCT_BRANCH}")" = "$PRODUCT_LEASE"
          git push origin \
            "$product_sha:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${PRODUCT_LEASE}"

          printf 'product_sha=%s\nproduct_tree=%s\n' "$product_sha" "$product_tree"
