name: NEVER MERGE M-05 terminal temporal-custody controller

on:
  push:
    branches:
      - agent/m05-s03-l7-route-watch-completion-custody-controller-v1

permissions:
  contents: write

concurrency:
  group: m05-route-watch-terminal-temporal-custody-controller
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 6535b119f1edf8aeafa9ce0d58813c85901be5f3
      BASE_TREE: 187aec69c4efca7366219cb7d1db4b7febc62883
      MAIN_LEASE: 242efd8190cd07b781c395c9fd7e9523c8de02a6
      PRODUCT_BRANCH: agent/m05-s03-l7-route-watch-temporal-custody-v1
      PRODUCT_LEASE: c5c7277f6feb84850c415c7efd097a552ee086c5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Materialize monotonic one-window product
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse origin/main)" = "$MAIN_LEASE"
          test "$(git rev-parse "origin/${PRODUCT_BRANCH}")" = "$PRODUCT_LEASE"
          test "$(git show -s --format=%T "$BASE_SHA")" = "$BASE_TREE"
          test "$(git show -s --format=%P "$PRODUCT_LEASE")" = "$BASE_SHA"

          product_dir="$RUNNER_TEMP/m05-route-watch-monotonic-product"
          intended_dir="$RUNNER_TEMP/m05-route-watch-monotonic-intended"
          rm -rf "$product_dir" "$intended_dir"
          git worktree add --detach "$product_dir" "$PRODUCT_LEASE"

          python3 - "$product_dir" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          library_path = root / 'tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          test_path = root / 'test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          library = library_path.read_text(encoding='utf-8')
          library = replace_once(
              library,
              "  const actualClockMs=Number(clock());\n"
              "  assert(Number.isFinite(actualClockMs),'execution clock must be finite');\n"
              "  assert(Number.isFinite(Number(observedAtMs)),'observation clock must be finite');\n"
              "  assert(Number(observedAtMs)<=actualClockMs,'observation clock cannot be in the future');\n"
              "  if(previousReceipt)validateReceipt(previousReceipt,contract);",
              "  const actualClockMs=Number(clock());\n"
              "  assert(Number.isFinite(actualClockMs),'execution clock must be finite');\n"
              "  assert(Number.isFinite(Number(observedAtMs)),'observation clock must be finite');\n"
              "  assert(Number(observedAtMs)<=actualClockMs,'observation clock cannot be in the future');\n"
              "  let receiptClockMs=actualClockMs;\n"
              "  const receiptClock=()=>{\n"
              "    const next=Number(clock());\n"
              "    assert(Number.isFinite(next),'execution clock must be finite');\n"
              "    receiptClockMs=Math.max(receiptClockMs,next);\n"
              "    return receiptClockMs;\n"
              "  };\n"
              "  if(previousReceipt)validateReceipt(previousReceipt,contract);",
              'monotonic receipt clock',
          )
          library = replace_once(
              library,
              "fetchOfficialRoute(lane,route,contract,{fetchImpl,clock,beforeRequest:(host,interval)=>gate.waitForRequest(host,interval)})",
              "fetchOfficialRoute(lane,route,contract,{fetchImpl,clock:receiptClock,beforeRequest:(host,interval)=>gate.waitForRequest(host,interval)})",
              'route timestamp clock binding',
          )
          library = replace_once(
              library,
              "    generated_at:new Date(clock()).toISOString(),",
              "    generated_at:new Date(receiptClock()).toISOString(),",
              'generation timestamp clamp',
          )
          library_path.write_text(library, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          insertion = r'''

          {
            const afterGate=Date.parse('2026-08-28T18:00:00Z');
            const peak=afterGate+10000;
            let clockCalls=0;
            const regressingClock=()=>{
              clockCalls+=1;
              return clockCalls===1?peak:afterGate-10000;
            };
            const receipt=await runRouteWatch(contract,{
              observedAtMs:afterGate,
              fetchImpl:async()=>successResponse('monotonic receipt time'),
              sleepImpl:noSleep,
              clock:regressingClock
            });
            validateReceipt(receipt,contract);
            assert(clockCalls>1);
            assert.equal(Date.parse(receipt.generated_at),peak);
            assert(receipt.observations.every((row)=>Date.parse(row.observed_at)<=Date.parse(receipt.generated_at)));
            assert(receipt.observations.every((row)=>Date.parse(row.completed_at)<=Date.parse(receipt.generated_at)));
            assert(receipt.observations.every((row)=>Date.parse(row.completed_at)>=Date.parse(row.observed_at)));
          }
          '''
          tests = replace_once(
              tests,
              "\nconsole.log('m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test: OK');\n",
              insertion + "\nconsole.log('m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test: OK');\n",
              'monotonic-clock regression insertion',
          )
          test_path.write_text(tests, encoding='utf-8')
          PY

          cd "$product_dir"
          expected=(
            'test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js'
            'tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          )
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" -- | sort)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

          mkdir -p "$intended_dir"
          intended_hashes=()
          for path in "${expected[@]}"; do
            mkdir -p "$intended_dir/$(dirname "$path")"
            cp -- "$path" "$intended_dir/$path"
            intended_hashes+=("$(sha256sum "$path" | cut -d' ' -f1)")
          done

          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          npm run release:check

          for index in "${!expected[@]}"; do
            path="${expected[$index]}"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "${intended_hashes[$index]}"
          done

          git restore --source="$BASE_SHA" --staged --worktree -- .
          git clean -fd
          for index in "${!expected[@]}"; do
            path="${expected[$index]}"
            mkdir -p "$(dirname "$path")"
            cp -- "$intended_dir/$path" "$path"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "${intended_hashes[$index]}"
          done

          mapfile -t final_changed < <(git diff --name-only "$BASE_SHA" -- | sort)
          test "${#final_changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${final_changed[$index]}" = "${expected[$index]}"
          done
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check
          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js
          node test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js

          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git add -- "${expected[@]}"
          product_tree="$(git write-tree)"
          product_sha="$(printf '%s\n' '[M-05 S03-L7] Make route-watch receipt time monotonic' | git commit-tree "$product_tree" -p "$BASE_SHA")"
          test "$(git show -s --format=%T "$product_sha")" = "$product_tree"
          test "$(git show -s --format=%P "$product_sha")" = "$BASE_SHA"
          mapfile -t committed < <(git diff --name-only "$BASE_SHA" "$product_sha" | sort)
          test "${#committed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${committed[$index]}" = "${expected[$index]}"
          done

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse origin/main)" = "$MAIN_LEASE"
          test "$(git rev-parse "origin/${PRODUCT_BRANCH}")" = "$PRODUCT_LEASE"
          git push origin \
            "$product_sha:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${PRODUCT_LEASE}"

          printf 'product_sha=%s\nproduct_tree=%s\n' "$product_sha" "$product_tree"
