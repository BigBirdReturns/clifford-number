name: TEMP authoritative finalize SSC RD-01 Wave-03

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-authoritative-finalizer.yml'
      - '.github/tmp/finalize-rd01-wave03-authoritative.sh'
      - '.ssc-rd01-wave03-authoritative-finalizer/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: ssc-rd01-wave03-authoritative-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: finalizer
        name: Authoritatively materialize, qualify, merge, prove, and clean RD-01-C06
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINALIZER_PR: ${{ github.event.pull_request.number }}
        run: bash .github/tmp/finalize-rd01-wave03-authoritative.sh
      - name: Preserve exact authoritative finalizer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-authoritative-finalizer
          path: /tmp/ssc-rd01-wave03-authoritative-finalizer-receipt
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable authoritative checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINALIZER_OUTCOME: ${{ steps.finalizer.outcome }}
        run: |
          set -Eeuo pipefail
          REF='archive/ssc-rd01-wave03-authoritative-finalizer-receipt'
          START=$(git ls-remote origin "refs/heads/$REF" | awk '{print $1}')
          if [[ -z "$START" ]]; then
            START=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$REF" -f sha="$START" >/dev/null
          fi
          git fetch --no-tags origin "$REF"
          rm -rf /tmp/rd01-authoritative-receipt-branch
          git worktree add --detach /tmp/rd01-authoritative-receipt-branch "origin/$REF"
          cd /tmp/rd01-authoritative-receipt-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf reports/transport/ssc-rd01-wave03-authoritative-finalizer-latest
          mkdir -p reports/transport/ssc-rd01-wave03-authoritative-finalizer-latest
          cp -a /tmp/ssc-rd01-wave03-authoritative-finalizer-receipt/. reports/transport/ssc-rd01-wave03-authoritative-finalizer-latest/
          printf 'workflow_outcome: %s\nrun_id: %s\nrun_attempt: %s\nhead_sha: %s\n' "$FINALIZER_OUTCOME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > reports/transport/ssc-rd01-wave03-authoritative-finalizer-latest/workflow.txt
          git add reports/transport/ssc-rd01-wave03-authoritative-finalizer-latest
          git commit -m 'Update authoritative RD-01 Wave-03 finalizer receipt'
          git push origin "HEAD:refs/heads/$REF" --force-with-lease="refs/heads/$REF:$START"
      - name: Enforce authoritative finalizer result
        if: always()
        env:
          FINALIZER_OUTCOME: ${{ steps.finalizer.outcome }}
        run: test "$FINALIZER_OUTCOME" = 'success'
