name: M-05 Sprint 06 independent reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-06-*.json'
      - 'docs/methods/answerable-power-independent-reproduction.md'
      - 'docs/milestones/m05-answerable-power-sprint-06.md'
      - 'tools/m05-independent-reproduction.mjs'
      - 'tools/build-m05-answerable-power-sprint-06.mjs'
      - 'tools/validate-m05-answerable-power-sprint-06.mjs'
      - 'test/m05-independent-reproduction.test.js'
      - 'test/m05-answerable-power-sprint-06.test.js'
      - 'reports/core-thesis/answerable-power/sprint-06.*'
      - '.github/ISSUE_TEMPLATE/apc-independent-reproduction.yml'
      - '.github/workflows/m05-answerable-power-sprint-06.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-06-*.json'
      - 'docs/methods/answerable-power-independent-reproduction.md'
      - 'docs/milestones/m05-answerable-power-sprint-06.md'
      - 'tools/m05-independent-reproduction.mjs'
      - 'tools/build-m05-answerable-power-sprint-06.mjs'
      - 'tools/validate-m05-answerable-power-sprint-06.mjs'
      - 'test/m05-independent-reproduction.test.js'
      - 'test/m05-answerable-power-sprint-06.test.js'
      - 'reports/core-thesis/answerable-power/sprint-06.*'
      - '.github/ISSUE_TEMPLATE/apc-independent-reproduction.yml'
      - '.github/workflows/m05-answerable-power-sprint-06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test Sprint 06
        run: |
          node tools/build-m05-answerable-power-sprint-06.mjs
          node tools/validate-m05-answerable-power-sprint-06.mjs
          node test/m05-answerable-power-sprint-06.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Sprint 06 products
        run: |
          git restore --staged --worktree .
          node tools/build-m05-answerable-power-sprint-06.mjs
          node tools/validate-m05-answerable-power-sprint-06.mjs
          node test/m05-answerable-power-sprint-06.test.js
          git diff --exit-code
