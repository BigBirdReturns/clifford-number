name: TEMP certify sealed School.House NC report drift artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.schoolhouse-nc-business-reports-data-census-certify/**'
      - '.github/workflows/temp-schoolhouse-nc-business-reports-data-census-certify.yml'

concurrency:
  group: schoolhouse-nc-report-drift-certify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed artifact and issue zero-request certification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PARENT='327648726320507532751f219a52d03f9c17fac5'
          EXECUTE='.schoolhouse-nc-business-reports-data-census-certify/EXECUTE'
          ARTIFACT='/tmp/nc-report-drift-artifact'
          RECEIPT='/tmp/nc-report-drift-certification'
          LIVE_DIGEST='sha256:e7feb5a1a406a718a83aafaabd71fbb62c32dbfd0c43e0e66e3429eb9f20b10a'

          git cat-file -e "$PARENT^{commit}"
          git merge-base --is-ancestor "$PARENT" HEAD
          git diff --name-only --no-renames "$PARENT..HEAD" | sort -u > /tmp/changed
          printf '%s\n' \
            '.github/workflows/temp-schoolhouse-nc-business-reports-data-census-certify.yml' \
            '.schoolhouse-nc-business-reports-data-census-certify/EXECUTE' \
            | sort -u > /tmp/expected
          diff -u /tmp/expected /tmp/changed

          python - "$EXECUTE" "$LIVE_DIGEST" <<'PY'
          from pathlib import Path
          import sys
          values = dict(line.split('=', 1) for line in Path(sys.argv[1]).read_text().splitlines() if line.strip())
          expected = {
            'certify': 'schoolhouse-nc-business-reports-data-census-artifact-v1',
            'canonical_parent': '327648726320507532751f219a52d03f9c17fac5',
            'source_pr': '1236',
            'source_head': '5447b15b58f9679d6eddcb75da9dcb03a0f86526',
            'source_workflow_run_id': '31066659672',
            'source_artifact_id': '8954062856',
            'source_artifact_digest': sys.argv[2],
            'source_content_sha256': '7740bc619e71d17b378df4348a51f79b954b0f77202eb93cea786b7406f648bb',
            'source_content_bytes': '121309',
            'observed_link_rows': '246',
            'observed_form_rows': '0',
            'eligible_successor_unique_routes': '0',
            'predecessor_candidate_routes_present': '0',
            'predecessor_candidate_routes_missing': '2',
            'current_candidate_routes_added': '0',
            'certification_source_requests': '0',
            'successor_fetches': '0',
            'query_submissions': '0',
            'forms_submitted': '0',
            'identities_admitted': '0',
            'relationships_admitted': '0',
            'negative_existence_claims_created': '0',
            'raw_source_retained': 'false',
            'full_visible_text_retained': 'false',
            'outside_human_dependency': 'false',
            'publication_effect': 'none',
            'adoption_effect': 'none',
            'graph_effect': 'none',
          }
          for key, value in expected.items():
              assert values.get(key) == value, (key, values.get(key), value)
          assert len(values) == 48, len(values)
          PY

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8954062856" --jq '.digest // ""')" = "$LIVE_DIGEST"
          rm -rf "$ARTIFACT" "$RECEIPT"
          mkdir -p "$ARTIFACT" "$RECEIPT"
          gh run download 31066659672 --repo "$GITHUB_REPOSITORY" \
            --name schoolhouse-nc-business-reports-data-census --dir "$ARTIFACT"

          declare -A EXPECTED_HASHES=(
            [artifact-manifest.json]='07b742a29c3c19bb714ce8dbaa5c7edd953097d7455d3af98cb5af9f9d8f5f18'
            [SHA256SUMS]='160da92ced90835914231d12afe58a13923738b8c33ced497843f1b585c996ad'
            [RUNNER_EXIT_CODE]='9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa'
            [source-receipt.json]='c9f9cf7d489d7426c9f1db850336583b4564cf9a8df339b1feea650115841519'
            [source-drift-comparison.json]='977e4ba414e2a7e31b228edff03261ee73221ec6415e60510a388c2fbd6a71b2'
            [link-observations.jsonl]='e924d60ccec8ac948d5eb8ab4cba2735a1cefe2579d26a964c6b370611ba458b'
            [successor-routes.jsonl]='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
            [form-mechanics.jsonl]='e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
            [route-policy.json]='48a3d9e815082b683aa483168a6380421b7d28073436f257b106d7be1115d429'
            [summary.json]='e8be60aa62e90d2585e42faf52f6cad414158be59e36881d1bad21c2195e19cd'
          )
          for file in "${!EXPECTED_HASHES[@]}"; do
            test "$(sha256sum "$ARTIFACT/$file" | awk '{print $1}')" = "${EXPECTED_HASHES[$file]}"
          done
          test "$(cat "$ARTIFACT/RUNNER_EXIT_CODE")" = '0'
          (cd "$ARTIFACT" && sha256sum -c SHA256SUMS)

          python - "$ARTIFACT" "$RECEIPT" "$LIVE_DIGEST" <<'PY'
          from pathlib import Path
          import json, sys
          root, out, live_digest = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          load = lambda n: json.loads((root / n).read_text())
          rows = lambda n: [json.loads(x) for x in (root / n).read_text().splitlines() if x.strip()]
          s, r, d, p, m = map(load, ['summary.json','source-receipt.json','source-drift-comparison.json','route-policy.json','artifact-manifest.json'])
          links, successors, forms = rows('link-observations.jsonl'), rows('successor-routes.jsonl'), rows('form-mechanics.jsonl')

          assert s['schema_version'] == 'schoolhouse-nc-business-reports-data-census@2'
          assert s['state'] == 'terminal_current_nonprofit_report_link_denominator_after_predecessor_source_drift'
          assert (s['source_content_sha256'], s['source_content_bytes']) == ('7740bc619e71d17b378df4348a51f79b954b0f77202eb93cea786b7406f648bb', 121309)
          assert s['source_changed_from_predecessor'] is True and s['page_identity_preserved'] is True and s['page_title_token_observed'] is True
          assert s['source_requests'] == 1 and s['observed_link_rows'] == len(links) == 246 and s['observed_form_rows'] == len(forms) == 0
          assert s['eligible_successor_unique_routes'] == len(successors) == 0
          assert s['static_data_unique_routes'] == s['static_document_unique_routes'] == s['report_or_listing_unique_routes'] == s['query_bearing_eligible_unique_routes'] == 0
          assert (s['predecessor_candidate_routes_present'], s['predecessor_candidate_routes_missing'], s['current_candidate_routes_added']) == (0, 2, 0)
          zero_keys = ['successor_fetches_executed','query_submissions','forms_submitted','cookie_replays','subscription_purchases','identities_admitted','relationships_admitted','negative_existence_claims_created','street_address_rows_retained','contact_detail_rows_retained','officer_rows_retained','private_support_rows']
          assert all(s[k] == 0 for k in zero_keys)
          assert s['raw_source_retained'] is False and s['full_visible_text_retained'] is False and s['outside_human_dependency'] is False
          assert s['publication_effect'] == s['adoption_effect'] == s['graph_effect'] == 'none'

          assert r['state'] == 'terminal_current_source_captured_after_predecessor_drift' and r['request_method'] == 'GET' and r['http_status'] == 200
          assert (r['content_sha256'], r['content_bytes'], r['observed_link_rows'], r['observed_form_rows']) == (s['source_content_sha256'], 121309, 246, 0)
          assert (r['predecessor_content_sha256'], r['predecessor_content_bytes'], r['predecessor_link_rows'], r['predecessor_form_rows']) == ('21b5334028fae1c314ca0f63b21b1d57b85e95462c8749ecb79c1bd6108cc7ee', 120956, 245, 0)
          assert r['page_identity_preserved'] is True and r['page_title_token_observed'] is True and r['raw_source_retained'] is False and r['full_visible_text_retained'] is False
          assert r['query_submitted'] is False and r['forms_submitted'] == 0 and r['identity_admitted'] is False and r['relationship_admitted'] is False and r['negative_existence_claim_created'] is False

          assert d['source_changed_from_predecessor'] is True and d['page_identity_preserved'] is True
          assert d['deltas'] == {'content_byte_delta': 353, 'current_candidate_routes_added': [], 'current_candidate_routes_added_count': 0, 'form_row_delta': 0, 'link_row_delta': 1, 'predecessor_candidate_routes_missing': d['deltas']['predecessor_candidate_routes_missing'], 'predecessor_candidate_routes_missing_count': 2, 'predecessor_candidate_routes_present': [], 'predecessor_candidate_routes_present_count': 0}
          assert len(d['deltas']['predecessor_candidate_routes_missing']) == 2
          assert d['interpretation']['byte_drift_is_not_identity_evidence'] is True and d['interpretation']['missing_predecessor_route_is_not_absence_evidence'] is True

          assert p['request_bounds']['maximum_total_requests'] == 1 and p['request_bounds']['successor_fetches'] == 0
          assert p['selection_contract']['current_complete_anchor_observation_denominator_required'] is True and p['selection_contract']['no_successor_fetches'] is True
          assert p['interpretation']['query_bearing_route_requires_separate_fixed_route_execution'] is True
          assert m['counts']['source_requests'] == 1 and m['counts']['successor_fetches'] == 0 and m['counts']['observed_link_rows'] == 246 and m['counts']['observed_form_rows'] == 0 and m['counts']['eligible_successor_unique_routes'] == 0
          assert m['page_identity_preserved'] is True and m['raw_source_retained'] is False

          assert [x['observation_ordinal'] for x in links] == list(range(1, 247))
          forbidden = {'raw_html','raw_text','full_visible_text','street_address','mailing_address','postal_code','email','phone','cookie_value','hidden_value'}
          for x in links:
              assert not forbidden.intersection(x)
              assert x['source_content_sha256'] == s['source_content_sha256'] and x['source_link_denominator'] == 246
              assert all(x[k] is False for k in ['fetch_executed','query_submitted','form_submitted','cookie_replayed','subscription_purchased','identity_admitted','relationship_admitted','negative_existence_claim_created','raw_source_retained','full_visible_text_retained','outside_human_dependency'])
              assert all(x[k] == 0 for k in ['street_address_rows_retained','contact_detail_rows_retained','officer_rows_retained','private_support_rows'])
              assert x['publication_effect'] == x['adoption_effect'] == x['graph_effect'] == 'none'
          assert not successors and not forms
          assert not any(x.suffix.lower() in {'.html','.htm','.csv','.xlsx','.zip'} for x in root.rglob('*') if x.is_file())

          receipt = {
            'schema_version': 'schoolhouse-nc-business-reports-data-census-artifact-certification@1',
            'certified_at': '2026-08-06', 'canonical_parent': '327648726320507532751f219a52d03f9c17fac5',
            'source_pr': 1236, 'source_workflow_run_id': 31066659672, 'source_artifact_id': 8954062856,
            'source_artifact_digest': live_digest, 'runner_exit_code': 0,
            'source_requests_in_acquisition': 1, 'source_requests_in_certification': 0,
            'source_content_sha256': s['source_content_sha256'], 'source_content_bytes': s['source_content_bytes'],
            'predecessor_content_sha256': r['predecessor_content_sha256'], 'predecessor_content_bytes': r['predecessor_content_bytes'],
            'observed_link_rows': 246, 'observed_form_rows': 0, 'eligible_successor_unique_routes': 0,
            'predecessor_candidate_routes_present': 0, 'predecessor_candidate_routes_missing': 2, 'current_candidate_routes_added': 0,
            'identity_admitted': False, 'relationship_admitted': False, 'negative_existence_claim_created': False,
            'outside_human_dependency': False, 'publication_effect': 'none', 'adoption_effect': 'none', 'graph_effect': 'none',
            'state': 'certified_terminal_current_nc_nonprofit_report_link_denominator_after_source_drift_zero_eligible_successor_routes'
          }
          out.mkdir(parents=True, exist_ok=True)
          (out/'certification.json').write_text(json.dumps(receipt, sort_keys=True, indent=2)+'\n')
          (out/'source-artifact-SHA256SUMS').write_bytes((root/'SHA256SUMS').read_bytes())
          (out/'source-artifact-manifest.json').write_bytes((root/'artifact-manifest.json').read_bytes())
          print(json.dumps(receipt, sort_keys=True))
          PY

          node tools/validate-no-magic-human-gate.mjs
          (cd "$RECEIPT" && sha256sum certification.json source-artifact-SHA256SUMS source-artifact-manifest.json > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload certification receipt
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-nc-business-reports-data-census-certification
          path: /tmp/nc-report-drift-certification
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
