name: Temporary PR 2231 consecutive observation publisher v47
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/temporary-pr2231-observation-interval-controller-v36.yml']
permissions:
  contents: write
  issues: read
concurrency:
  group: pr2231-consecutive-observation-publisher-v47
  cancel-in-progress: false
jobs:
  qualify-and-publish-consecutive-observation-repair:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CBRANCH: agent/pr2231-observation-interval-controller-v36
      CPATH: .github/workflows/temporary-pr2231-observation-interval-controller-v36.yml
      SOURCE_COMMIT: fef1c4f0a8429507f371cdd332cc0671ea989d62
      SOURCE_BLOB: 145b1a57d6225692890903af9c6a4ab1cd3b9e36
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BRANCH: ${{ github.head_ref }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      QUALIFIED_TREE: d8acecd1750c9a51a054c806a02cd4a6d610c004
      QUALIFIED_LIB: 3cea6706bcc69b18de026107efb993b63cb4b110
      QUALIFIED_TEST: b511fae6aa674d6d885c314510bea4df0628d7d2
      QUALIFIED_NUMSTAT: |-
        744	0	test/industrial-exhaust.test.js
        653	56	tools/lib/industrial-exhaust.mjs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repeat v46 qualification and publish under exact leases
        shell: bash
        run: |
          set -euo pipefail
          actual_source_blob="$(git rev-parse "$SOURCE_COMMIT:$CPATH")"
          printf 'source-blob actual=%s expected=%s\n' "$actual_source_blob" "$SOURCE_BLOB"
          [ "$actual_source_blob" = "$SOURCE_BLOB" ]

          python3 <<'PY'
          import os
          import pathlib
          import subprocess

          path = os.environ['CPATH']
          source = subprocess.check_output(
              ['git', 'show', f"{os.environ['SOURCE_COMMIT']}:{path}"],
              text=True
          )
          marker = "      - name: Reproduce, repair, and qualify exact product bytes\n        shell: bash\n        run: |\n"
          if source.count(marker) != 1:
              raise SystemExit('v46 run-block marker mismatch')
          remainder = source.split(marker, 1)[1]
          lines = []
          for line in remainder.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line == '':
                  lines.append('')
              else:
                  break
          script = '\n'.join(lines) + '\n'
          replacements = {
              '$' + '{{ github.event.pull_request.head.sha }}': os.environ['CURRENT_HEAD'],
              '$' + '{{ github.head_ref }}': os.environ['CURRENT_BRANCH'],
              '$' + '{{ github.run_id }}': os.environ['CURRENT_RUN_ID'],
          }
          for old, new in replacements.items():
              if script.count(old) != 1:
                  raise SystemExit(f'v46 expression count mismatch: {old!r}')
              script = script.replace(old, new)
          target = pathlib.Path('/tmp/pr2231-v47-qualified.sh')
          target.write_text(script)
          target.chmod(0o700)
          PY
          bash -n /tmp/pr2231-v47-qualified.sh
          source /tmp/pr2231-v47-qualified.sh

          V47=/tmp/pr2231-v47-publication.txt
          cp "$R" "$V47"
          stage prepublication-qualified-object-census
          require_eq qualified-tree "$NEWTREE" "$QUALIFIED_TREE"
          require_eq qualified-lib "$NEWLIB" "$QUALIFIED_LIB"
          require_eq qualified-test "$NEWTEST" "$QUALIFIED_TEST"
          require_eq qualified-numstat "$CANDIDATE_NUMSTAT" "$QUALIFIED_NUMSTAT"
          require_eq qualified-parent "$(git -C "$Q" rev-parse "$NEWHEAD^")" "$MAIN"
          require_eq qualified-count "$(git -C "$Q" rev-list --count "$MAIN..$NEWHEAD")" '1'
          require_eq qualified-author "$(git -C "$Q" show -s --format=%an "$NEWHEAD")" 'BigBirdReturns'
          require_eq qualified-committer "$(git -C "$Q" show -s --format=%cn "$NEWHEAD")" 'BigBirdReturns'

          stage atomic-force-with-lease-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq publication-main-lease "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          require_eq publication-product-lease "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq publication-controller-lease "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          git -C "$Q" push --atomic origin \
            "$MAIN:refs/heads/main" \
            "$NEWHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/main:$MAIN" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD" 2>&1 | tee -a "$V47"

          stage postpublication-census
          fetch_leases
          require_eq published-main "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          require_eq published-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$NEWHEAD"
          require_eq published-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq published-parent "$(git rev-parse "$NEWHEAD^")" "$MAIN"
          require_eq published-tree "$(git rev-parse "$NEWHEAD^{tree}")" "$QUALIFIED_TREE"
          require_eq published-lib "$(git rev-parse "$NEWHEAD:tools/lib/industrial-exhaust.mjs")" "$QUALIFIED_LIB"
          require_eq published-test "$(git rev-parse "$NEWHEAD:test/industrial-exhaust.test.js")" "$QUALIFIED_TEST"
          require_eq published-paths "$(git diff --name-only "$MAIN..$NEWHEAD" | LC_ALL=C sort)" "$PRODUCT_PATHS"
          require_eq published-numstat "$(git diff --numstat "$MAIN..$NEWHEAD" | LC_ALL=C sort -k3)" "$QUALIFIED_NUMSTAT"

          printf 'PUBLICATION_SUCCESS\nrun=%s\nbase=%s\nold-product=%s\nproduct=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            '${{ github.run_id }}' "$MAIN" "$PHEAD" "$NEWHEAD" "$QUALIFIED_TREE" "$QUALIFIED_LIB" "$QUALIFIED_TEST" | tee -a "$V47"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-consecutive-observation-publication-v47
          path: |
            /tmp/pr2231-v46-qualification.txt
            /tmp/pr2231-v46-product.patch
            /tmp/pr2231-v47-qualified.sh
            /tmp/pr2231-v47-publication.txt
          if-no-files-found: error
          retention-days: 90
