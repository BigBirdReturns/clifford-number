name: Temporary PR 2231 publish current-main successor v45
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/temporary-pr2231-observation-interval-controller-v36.yml']
permissions:
  contents: write
  issues: read
concurrency:
  group: pr2231-current-main-publication-v45
  cancel-in-progress: false
jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CBRANCH: agent/pr2231-observation-interval-controller-v36
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 5a664528ced503daf37141d87c17e1c973a07eb1
      PPARENT: ab781df0a26d0c3c6d870863b1d89b3a7d06a14f
      PTREE: 4e47f7fc240b4cf3144b228514bb1020e8daecef
      PLIB: d825c94f2dfe5ef2bd64d483a2feb9dfa0a5c645
      PTEST: 34ae708c4934834334839552d7603e48e3db4ea4
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify and publish exact product bytes on live main
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          Q=/tmp/pr2231-v45-main
          R=/tmp/pr2231-v45-publication.txt
          : > "$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s actual=%s expected=%s\n' "$label" "$actual" "$expected" | tee -a "$R"
            [ "$actual" = "$expected" ] || fail "$label" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }
          PRODUCT_PATHS=$'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          PRODUCT_NUMSTAT=$'729\t0\ttest/industrial-exhaust.test.js\n638\t56\ttools/lib/industrial-exhaust.mjs'
          RELEASE_PATHS=$'build/axm-identity.json\nbuild/build-hop-report.json\nbuild/hop-graph.json\nbuild/migration-review.md\nbuild/migration-summary.json\nbuild/receipt-graph.json\nbuild/scores.json\nbuild/scout-report.json\nbuild/scout-report.md\nbuild/surface-graph.json\nbuild/topology-admission-frontier.json\ntest/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage initial-live-leases
          fetch_leases
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq source-product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq source-product-parent "$(git rev-parse "$PHEAD^")" "$PPARENT"
          require_eq source-product-count "$(git rev-list --count "$PPARENT..$PHEAD")" '1'
          require_eq source-product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq source-product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq source-product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq source-product-paths "$(git diff --name-only "$PPARENT..$PHEAD" | LC_ALL=C sort)" "$PRODUCT_PATHS"
          require_eq source-product-numstat "$(git diff --numstat "$PPARENT..$PHEAD" | LC_ALL=C sort -k3)" "$PRODUCT_NUMSTAT"
          MAIN="$(git rev-parse refs/remotes/origin/main)"
          printf 'captured-main=%s\n' "$MAIN" | tee -a "$R"
          require_eq main-lib "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" "$BTEST"

          stage live-main-byte-transplant
          rm -rf "$Q"
          git worktree prune
          git worktree add --detach "$Q" "$MAIN"
          git show "$PHEAD:tools/lib/industrial-exhaust.mjs" > "$Q/tools/lib/industrial-exhaust.mjs"
          git show "$PHEAD:test/industrial-exhaust.test.js" > "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq qualified-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$PLIB"
          require_eq qualified-test "$(git hash-object test/industrial-exhaust.test.js)" "$PTEST"
          require_eq qualified-paths "$(git diff --name-only | LC_ALL=C sort)" "$PRODUCT_PATHS"
          require_eq qualified-numstat "$(git diff --numstat | LC_ALL=C sort -k3)" "$PRODUCT_NUMSTAT"
          git diff --check

          stage exact-boundary-matrix
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import {redactContactData as r} from './tools/lib/industrial-exhaust.mjs';
          const cases = [
            ['Phone: 09012345678 2026-08-17 01 42 68 53 00', 'Phone: [contact omitted] 2026-08-17 [contact omitted]'],
            ['Phone: 09012345678 2026.08.17.03 62 16 80 41', 'Phone: [contact omitted] 2026.08.17.[contact omitted]'],
            ['ID: 09012345678 2026-08-17.1 212 555 1234', 'ID: 09012345678 2026-08-17.[contact omitted]'],
            ['Phone: 09012345678 2026-08-17 01 42 68 53 00 90 people', 'Phone: [contact omitted] 2026-08-17 [contact omitted] 90 people'],
            ['Phone: 09012345678 3.14 03-6216-8041', 'Phone: [contact omitted] 3.14 [contact omitted]'],
            ['Phone: 09012345678 12:30 +81 3 6216 5111', 'Phone: [contact omitted] 12:30 [contact omitted]'],
            ['Phone: 09012345678 10-20 people (03) 6216 8041', 'Phone: [contact omitted] 10-20 people [contact omitted]'],
            ['電話：０９０１２３４５６７８ ２０２６．０８．１７．１ ２１２ ５５５ １２３４', '電話：[contact omitted] ２０２６．０８．１７．[contact omitted]'],
          ];
          for (const [input, expected] of cases) {
            const actual = r(input);
            console.log(JSON.stringify({input, actual, expected}));
            assert.equal(actual, expected, input);
          }
          NODE

          stage focused-and-release-gates
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"
          npm run release:check 2>&1 | tee -a "$R"
          require_eq post-release-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$PLIB"
          require_eq post-release-test "$(git hash-object test/industrial-exhaust.test.js)" "$PTEST"
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" "$RELEASE_PATHS"
          git restore --source=HEAD --worktree -- build
          git clean -fd -- build
          require_eq restored-paths "$(git diff --name-only | LC_ALL=C sort)" "$PRODUCT_PATHS"
          require_eq restored-numstat "$(git diff --numstat | LC_ALL=C sort -k3)" "$PRODUCT_NUMSTAT"
          require_eq restored-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$PLIB"
          require_eq restored-test "$(git hash-object test/industrial-exhaust.test.js)" "$PTEST"
          git diff --check

          stage prepublication-live-leases
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq prepublish-main "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          require_eq prepublish-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq prepublish-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq prepublish-main-lib "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq prepublish-main-test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" "$BTEST"

          stage construct-product-successor
          cd "$Q"
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: preserve observation intervals before later telephone values' 2>&1 | tee -a "$R"
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"
          require_eq successor-parent "$(git rev-parse HEAD^)" "$MAIN"
          require_eq successor-count "$(git rev-list --count "$MAIN..HEAD")" '1'
          require_eq successor-lib "$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)" "$PLIB"
          require_eq successor-test "$(git rev-parse HEAD:test/industrial-exhaust.test.js)" "$PTEST"
          require_eq successor-paths "$(git diff --name-only "$MAIN..HEAD" | LC_ALL=C sort)" "$PRODUCT_PATHS"
          require_eq successor-numstat "$(git diff --numstat "$MAIN..HEAD" | LC_ALL=C sort -k3)" "$PRODUCT_NUMSTAT"
          require_eq successor-author "$(git show -s --format=%an HEAD)" 'BigBirdReturns'
          require_eq successor-committer "$(git show -s --format=%cn HEAD)" 'BigBirdReturns'
          printf 'successor-head=%s\nsuccessor-tree=%s\n' "$NEW_HEAD" "$NEW_TREE" | tee -a "$R"

          stage atomic-force-with-lease-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq publication-main-lease "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          require_eq publication-product-lease "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq publication-controller-lease "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          git -C "$Q" push --atomic origin \
            "$MAIN:refs/heads/main" \
            "$NEW_HEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/main:$MAIN" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD" 2>&1 | tee -a "$R"

          stage postpublication-census
          fetch_leases
          require_eq published-main "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          require_eq published-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$NEW_HEAD"
          require_eq published-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq published-parent "$(git rev-parse "$NEW_HEAD^")" "$MAIN"
          require_eq published-tree "$(git rev-parse "$NEW_HEAD^{tree}")" "$NEW_TREE"
          require_eq published-lib "$(git rev-parse "$NEW_HEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq published-test "$(git rev-parse "$NEW_HEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq published-paths "$(git diff --name-only "$MAIN..$NEW_HEAD" | LC_ALL=C sort)" "$PRODUCT_PATHS"
          require_eq published-numstat "$(git diff --numstat "$MAIN..$NEW_HEAD" | LC_ALL=C sort -k3)" "$PRODUCT_NUMSTAT"

          printf 'PUBLICATION_SUCCESS\nrun=%s\nbase=%s\nold-product=%s\nproduct=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            '${{ github.run_id }}' "$MAIN" "$PHEAD" "$NEW_HEAD" "$NEW_TREE" "$PLIB" "$PTEST" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-current-main-publication-v45
          path: /tmp/pr2231-v45-publication.txt
          if-no-files-found: error
          retention-days: 90
