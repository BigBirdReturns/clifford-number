name: Temporary PR 2231 observation interval controller v36
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/temporary-pr2231-observation-interval-controller-v36.yml']
permissions:
  contents: read
  issues: read
concurrency:
  group: pr2231-observation-interval-controller-v36
  cancel-in-progress: false
jobs:
  qualify-repaired-transport:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BRANCH: ${{ github.head_ref }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      RUNNER_SHA256: 23e58095f15733fa216c5e6b0bc769597b7cc1088c108514efe7e9484e0d9477
      RUNNER_BLOB: c348d1d78f337c78b8536ff56e3664d9c8bc3add
      PAYLOAD_BLOBS: >-
        538450eb626d58f65268999a1cd82ad582d92eb5
        5db12ca5816d73e8c37d4ee885447db8cdb20a6a
        04157ba0531954b72690d62eb6f65fd092cbf69a
        f5b208b3453568afe2b8b5bf7ee9cae22f139739
        a6e8455ae829201e1736891fdb204d4599f002dc
        1abb45e295db645a8f694100e3510fa23d477f47
        e0e23a8b5da65abdcc377b253612beec826d86a4
        6f18fefeca82bcc06631346dc9e1b4f8ecdabbb2
        13c6a0db2b4272cd0909cb10276f665d8ecd8c48
        670451026986faab0972d8a352166b037dda29f0
        baa457e40e71b8d85fac8631fdff0015e3f67a76
        0174f5e3c141753fa614420c4c226507c9853529
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble and run checksum-pinned v42 qualifier
        shell: bash
        run: |
          set -euo pipefail
          runner=/tmp/p2231-v42-runner.sh
          : > "$runner"
          for sha in $PAYLOAD_BLOBS; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content \
              | tr -d '\n' | base64 -d >> "$runner"
          done
          actual_sha="$(sha256sum "$runner" | cut -d' ' -f1)"
          actual_blob="$(git hash-object "$runner")"
          printf 'runner-sha actual=%s expected=%s\n' "$actual_sha" "$RUNNER_SHA256"
          printf 'runner-blob actual=%s expected=%s\n' "$actual_blob" "$RUNNER_BLOB"
          [ "$actual_sha" = "$RUNNER_SHA256" ]
          [ "$actual_blob" = "$RUNNER_BLOB" ]
          cat > /tmp/p2231-v42-payload-receipt.txt <<EOF
          payload_blobs=$PAYLOAD_BLOBS
          runner_sha256=$actual_sha
          runner_blob=$actual_blob
          current_head=$CURRENT_HEAD
          current_branch=$CURRENT_BRANCH
          run_id=$CURRENT_RUN_ID
          EOF
          chmod 700 "$runner"
          bash -n "$runner"
          bash "$runner"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-repaired-transport-qualification-v42
          path: |
            /tmp/p2231-v42-payload-receipt.txt
            /tmp/p2231-v42-runner.sh
            /tmp/p2231-controller-repair-v42.txt
            /tmp/p2231-qualified-v42.sh
            /tmp/p2231-repaired-qualification.txt
            /tmp/p2231-comment-initial.md
            /tmp/p2231-posted-initial.gz
            /tmp/p2231-repaired-initial.patch
            /tmp/p2231-repaired-initial.gz
            /tmp/p2231-comment-final.md
            /tmp/p2231-posted-final.gz
            /tmp/p2231-repaired-final.patch
            /tmp/p2231-repaired-final.gz
          if-no-files-found: warn
          retention-days: 90
