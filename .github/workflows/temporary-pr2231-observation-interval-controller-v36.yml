name: Temporary PR 2231 observation interval controller v36
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/temporary-pr2231-observation-interval-controller-v36.yml']
permissions:
  contents: read
  issues: read
concurrency:
  group: pr2231-observation-interval-controller-v36
  cancel-in-progress: false
jobs:
  recover-exact-patch-digest:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CBRANCH: agent/pr2231-observation-interval-controller-v36
      CPATH: .github/workflows/temporary-pr2231-observation-interval-controller-v36.yml
      CPARENT: d513cf672f3b75967d5bfe79e65e0fd8166b1f70
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 456ee43cb8a0d3c1afeeed8b9f7342219a3fac05
      PPARENT: 2d2c7b6cd7517ca25854e481b21774a697d0e76b
      PLIB: dbf28c75e6681ca06915ccc2e85062f67382175f
      PTEST: 08b3cd4014b916d1ac5845c73c59f7d55dbae7ef
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      COMMENT: '5401422894'
      PCOMMIT: 614c8065a6c255fbd8cfdc9315ef861d700011a9
      PTREE: 7f562e216eb716fef39bd426176f7c638fa8e778
      SLIB: d825c94f2dfe5ef2bd64d483a2feb9dfa0a5c645
      STEST: 34ae708c4934834334839552d7603e48e3db4ea4
      CURRENT_SHA: 20056e150a6953f4c942c126e4098705e0992f1cc80676a7b4eb9acf5cbe4a96
      TARGET_SHA: 7f25ffa5c58b0025bbd7ce2783393c6010a98e8f0606c3f94607946efb4f9054
      PZBYTES: '4343'
      PBYTES: '15943'
      PCHARS: '5792'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover and verify exact digest
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/p2231-source
          R=/tmp/p2231-exact-digest-recovery.txt
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" mismatch
          }
          fetch() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }

          stage leases
          eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          eq controller-branch '${{ github.head_ref }}' "$CBRANCH"
          eq controller-path "$(git diff --name-only "$CPARENT..HEAD")" "$CPATH"
          fetch
          eq controller-remote "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          eq product-parent "$(git rev-parse "$PHEAD^")" "$PPARENT"
          eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          MAIN="$(git rev-parse refs/remotes/origin/main)"
          printf 'main=%s\n' "$MAIN" | tee -a "$R"
          eq main-lib "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          eq main-test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" "$BTEST"

          stage transport
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT" --jq .body >/tmp/p2231-comment.md
          python3 - /tmp/p2231-comment.md /tmp/p2231.patch /tmp/p2231-corrected.gz /tmp/p2231-posted.gz <<'PY' 2>&1 | tee -a "$R"
          import base64, gzip, hashlib, os, pathlib, re, sys, time
          def emit(k, v): print(f'{k}={v}', flush=True)
          def die(k, v): print(f'FAIL[{k}] {v}', file=sys.stderr, flush=True); raise SystemExit(1)
          body = pathlib.Path(sys.argv[1]).read_text()
          chunks = re.findall(r'^\d+\. `([A-Za-z0-9+/=]+)`$', body, re.M)
          emit('chunk-count', len(chunks))
          if len(chunks) != 1: die('chunk-count', len(chunks))
          encoded = ''.join(chunks)
          emit('encoded-chars', len(encoded))
          if len(encoded) != int(os.environ['PCHARS']): die('encoded-chars', len(encoded))
          declared = re.findall(r'Compressed SHA-256\s*\|\s*`([0-9a-f]{64})`', body)
          emit('declared-digests', declared)
          if declared != [os.environ['TARGET_SHA']]: die('declared-digest', declared)
          posted = base64.b64decode(encoded, validate=True)
          posted_sha = hashlib.sha256(posted).hexdigest()
          emit('posted-bytes', len(posted)); emit('posted-sha256', posted_sha)
          if len(posted) != int(os.environ['PZBYTES']): die('posted-bytes', len(posted))
          if posted_sha != os.environ['CURRENT_SHA']: die('posted-sha256', posted_sha)
          target = bytes.fromhex(os.environ['TARGET_SHA'])
          work = bytearray(posted)
          found = None
          attempts = 0
          started = time.monotonic()
          for i, old in enumerate(posted):
              for new in range(256):
                  if new == old: continue
                  work[i] = new; attempts += 1
                  if hashlib.sha256(work).digest() == target:
                      found = (i, old, new, bytes(work)); break
              work[i] = old
              if found: break
          emit('attempts', attempts); emit('seconds', f'{time.monotonic()-started:.3f}')
          pathlib.Path(sys.argv[4]).write_bytes(posted)
          if not found: die('single-byte-recovery', 'no digest match')
          i, old, new, corrected = found
          emit('mutation-index', i); emit('old-hex', f'{old:02x}'); emit('new-hex', f'{new:02x}'); emit('xor-hex', f'{old^new:02x}')
          emit('corrected-sha256', hashlib.sha256(corrected).hexdigest())
          patch = gzip.decompress(corrected)
          emit('patch-bytes', len(patch)); emit('patch-sha256', hashlib.sha256(patch).hexdigest())
          if len(patch) != int(os.environ['PBYTES']): die('patch-bytes', len(patch))
          prefix = b'From ' + os.environ['PCOMMIT'].encode() + b' '
          if not patch.startswith(prefix): die('patch-prefix', patch.splitlines()[0])
          pathlib.Path(sys.argv[2]).write_bytes(patch)
          pathlib.Path(sys.argv[3]).write_bytes(corrected)
          PY

          stage apply
          rm -rf "$S"; git worktree prune; git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git am /tmp/p2231.patch 2>&1 | tee -a "$R"
          eq applied-parent "$(git rev-parse HEAD^)" "$PHEAD"
          eq applied-count "$(git rev-list --count "$PHEAD..HEAD")" '1'
          eq applied-tree "$(git rev-parse HEAD^{tree})" "$PTREE"
          eq applied-lib "$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)" "$SLIB"
          eq applied-test "$(git rev-parse HEAD:test/industrial-exhaust.test.js)" "$STEST"
          eq applied-paths "$(git diff --name-only "$PHEAD..HEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          eq applied-numstat "$(git diff --numstat "$PHEAD..HEAD" | LC_ALL=C sort -k3)" $'39\t0\ttest/industrial-exhaust.test.js\n195\t22\ttools/lib/industrial-exhaust.mjs'
          git diff --check "$PHEAD..HEAD"

          stage focused-verification
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"

          stage final-leases
          cd "$GITHUB_WORKSPACE"; fetch
          eq final-main "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          printf 'RECOVERY_SUCCESS tree=%s lib=%s test=%s gzip=%s\n' "$PTREE" "$SLIB" "$STEST" "$TARGET_SHA" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-exact-digest-recovery-v36
          path: |
            /tmp/p2231-exact-digest-recovery.txt
            /tmp/p2231-posted.gz
            /tmp/p2231-corrected.gz
            /tmp/p2231.patch
          if-no-files-found: warn
          retention-days: 90
