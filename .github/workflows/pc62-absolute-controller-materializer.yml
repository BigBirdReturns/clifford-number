name: PC-62 absolute terminal-controller materializer

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc62-absolute-controller-materializer.yml'
      - '.github/pc62-absolute-controller-transform.py'

permissions:
  contents: write

concurrency:
  group: pc62-absolute-terminal-controller-materializer
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPOSITORY: ${{ github.repository }}
  SOURCE_CONTROLLER_BLOB: 'd2ea3d248251c2eb9fdc291c8b905c66b997c2db'
  SOURCE_CONTROLLER_SHA256: '7708fd1a52494022b4f2b4d79b16dc170448ac68bf3638fe99b5d637ab02d594'
  SOURCE_CONTROLLER_BYTES: '39968'
  FINAL_PRODUCT: '7725fd2168fcab12af7d79850551dc9578acb034'
  FINAL_PRODUCT_TREE: 'cca67dfac6dc10b83668660e6947161951b663fe'
  FINAL_LIBRARY_BLOB: '073998e98e15aa033489097fd864944ac005613b'
  FINAL_TEST_BLOB: 'cd4e3304645dd6e76a0b92ca4e34ef711ebe2457'
  BUILD_WORLD_REPAIR_ARTIFACT: '9094613464'
  BUILD_WORLD_REPAIR_DIGEST: 'sha256:938b94a45c1429657c7204d3736de64a2c3093282cbe6ffa0c69931dc6c37fdc'
  OUT: '/tmp/pc62-absolute-controller-materializer'

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/pc62-absolute-controller-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Authenticate source controller, transform, and publish absolute blob
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          rm -rf "$OUT"
          mkdir -p "$OUT/api"
          python --check .github/pc62-absolute-controller-transform.py

          gh api "/repos/$GH_REPOSITORY/git/blobs/$SOURCE_CONTROLLER_BLOB" > "$OUT/api/source-controller.json"
          test "$(jq -r .sha "$OUT/api/source-controller.json")" = "$SOURCE_CONTROLLER_BLOB"
          jq -r .content "$OUT/api/source-controller.json" | tr -d '\n' | base64 -d > "$OUT/source-controller.yml"
          test "$(wc -c < "$OUT/source-controller.yml" | tr -d ' ')" = "$SOURCE_CONTROLLER_BYTES"
          test "$(sha256sum "$OUT/source-controller.yml" | awk '{print $1}')" = "$SOURCE_CONTROLLER_SHA256"
          test "$(git hash-object "$OUT/source-controller.yml")" = "$SOURCE_CONTROLLER_BLOB"

          python .github/pc62-absolute-controller-transform.py "$OUT/source-controller.yml" "$OUT/final-controller.yml"
          test "$(grep -cF "$FINAL_PRODUCT" "$OUT/final-controller.yml")" -ge 1
          test "$(grep -cF "$FINAL_PRODUCT_TREE" "$OUT/final-controller.yml")" -ge 1
          test "$(grep -cF "$FINAL_LIBRARY_BLOB" "$OUT/final-controller.yml")" -ge 1
          test "$(grep -cF "$FINAL_TEST_BLOB" "$OUT/final-controller.yml")" -ge 1
          test "$(grep -cF 'PC-62 fixture mutations rejected: 62' "$OUT/final-controller.yml")" = 1
          test "$(grep -cF 'malformed_build_world_shape_mutations:1' "$OUT/final-controller.yml")" = 1
          ruby -e 'require "yaml"; y=YAML.load_file(ARGV[0]); abort "name" unless y["name"]=="PC-62 terminal reconciler"; abort "product" unless y["env"]["PRODUCT"]==ENV["FINAL_PRODUCT"]; abort "tree" unless y["env"]["PRODUCT_TREE"]==ENV["FINAL_PRODUCT_TREE"]; abort "build artifact" unless y["env"]["BUILD_WORLD_REPAIR_ARTIFACT"]==ENV["BUILD_WORLD_REPAIR_ARTIFACT"]' "$OUT/final-controller.yml"

          FINAL_BYTES=$(wc -c < "$OUT/final-controller.yml" | tr -d ' ')
          FINAL_SHA256=$(sha256sum "$OUT/final-controller.yml" | awk '{print $1}')
          FINAL_BLOB=$(git hash-object "$OUT/final-controller.yml")
          encoded=$(base64 -w0 "$OUT/final-controller.yml")
          gh api --method POST "/repos/$GH_REPOSITORY/git/blobs" -f content="$encoded" -f encoding=base64 > "$OUT/api/final-controller-blob.json"
          test "$(jq -r .sha "$OUT/api/final-controller-blob.json")" = "$FINAL_BLOB"

          jq -n --arg schema_version 'pc62-absolute-controller-materializer@1' --arg source_controller_blob "$SOURCE_CONTROLLER_BLOB" --arg source_controller_sha256 "sha256:$SOURCE_CONTROLLER_SHA256" --arg final_controller_blob "$FINAL_BLOB" --arg final_controller_sha256 "sha256:$FINAL_SHA256" --arg final_controller_bytes "$FINAL_BYTES" --arg final_product "$FINAL_PRODUCT" --arg final_product_tree "$FINAL_PRODUCT_TREE" --arg build_world_artifact "$BUILD_WORLD_REPAIR_ARTIFACT" --arg build_world_digest "$BUILD_WORLD_REPAIR_DIGEST" '{schema_version:$schema_version,status:"complete",source_controller:{blob:$source_controller_blob,sha256:$source_controller_sha256},final_controller:{blob:$final_controller_blob,sha256:$final_controller_sha256,bytes:($final_controller_bytes|tonumber),yaml_parsed:true},final_product:{commit:$final_product,tree:$final_product_tree},build_world_repair_artifact:{id:($build_world_artifact|tonumber),digest:$build_world_digest,authenticated_in_controller:true},adversarial_mutations:62,prototype_rewritten_node_mutations:16,prototype_rewritten_web_api_mutations:6,non_extensible_web_api_mutations:2,malformed_fixture_world_mutations:2,malformed_build_world_mutations:1,product_semantics_changed:false,graph_effect:"none"}' > "$OUT/receipt.json"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload absolute controller materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc62-absolute-terminal-controller-materializer
          path: /tmp/pc62-absolute-controller-materializer
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
