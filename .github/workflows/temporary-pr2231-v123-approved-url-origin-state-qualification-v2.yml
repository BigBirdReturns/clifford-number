name: Temporary PR 2231 V123 approved URL origin-state qualification V2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v123-approved-url-origin-state-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v123-v2:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v123-approved-url-origin-state-qualification-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v123-approved-url-origin-state-qualification-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute the exact read-only V123 V2 qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          repo=BigBirdReturns/clifford-number
          payload_blob=6b446a8a4d4eb624560dbea4f032fb7368877851
          payload_size=4920
          payload_sha256=2414ec589dec845437140d651dfe12dbb19b6f857aa4b014aac41ae48a2510d5
          qualifier_blob=8c733794d852da7196958cf061fe310507ca0afc
          qualifier_size=20585
          qualifier_sha256=5b8612834e7f9b22ac3a9a24a5580535c2142b0b34410e06fc29cd8c2a714b40
          envelope=/tmp/pr2231-v123-approved-url-origin-state-controller-v2
          payload="$envelope/qualifier-v123-v2.sh.xz"
          qualifier="$envelope/qualifier-v123-v2.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-qualification\n' "$rc" > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          gh api "repos/$repo/git/blobs/$payload_blob" --jq '.content' \
            | tr -d '\n' | base64 -d > "$payload"
          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          xz -dc "$payload" > "$qualifier"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          printf 'payload_blob=%s\npayload_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\n' \
            "$payload_blob" "$payload_sha256" "$qualifier_blob" "$qualifier_sha256" \
            > "$envelope/qualifier-provenance.txt"
          bash "$qualifier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v123-approved-url-origin-state-qualification-v2
          path: |
            /tmp/pr2231-v123-approved-url-origin-state-qualification-v2
            /tmp/pr2231-v123-approved-url-origin-state-controller-v2
          if-no-files-found: error
          retention-days: 90
