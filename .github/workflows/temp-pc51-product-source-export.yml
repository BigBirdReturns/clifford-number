name: TEMP export exact PC-51 product source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-product-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          PRODUCT_COMMIT=7802dcc91ca45d564a72f87c99183a6ed196e6fb
          EXPECTED_TREE=96331690ce118920ebd3cb9bd3528dc9e12f5505
          git cat-file -e "${PRODUCT_COMMIT}^{commit}"
          PRODUCT_TREE=$(git rev-parse "${PRODUCT_COMMIT}^{tree}")
          test "$PRODUCT_TREE" = "$EXPECTED_TREE"
          SHORT=${PRODUCT_COMMIT:0:12}
          ARCHIVE="clifford-number-pc51-product-${SHORT}.tar.gz"
          git archive --format=tar --prefix="clifford-number-${SHORT}/" "$PRODUCT_COMMIT" | gzip -9n > "$ARCHIVE"
          ARCHIVE_BYTES=$(wc -c < "$ARCHIVE" | tr -d ' ')
          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          cat > receipt.txt <<EOF
          schema_version: pc51-product-source-export-receipt@2
          product_commit: $PRODUCT_COMMIT
          product_tree: $PRODUCT_TREE
          carrier_head: $(git rev-parse HEAD)
          archive_name: $ARCHIVE
          archive_bytes: $ARCHIVE_BYTES
          archive_sha256: $ARCHIVE_SHA256
          outside_human_dependency: false
          graph_effect: none
          EOF
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$ARCHIVE" > archive.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pc51-exact-product-source
          path: |
            clifford-number-pc51-product-*.tar.gz
            receipt.txt
            archive.sha256
          if-no-files-found: error
          retention-days: 30
