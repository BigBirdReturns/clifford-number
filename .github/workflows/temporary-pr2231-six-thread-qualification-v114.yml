name: Temporary PR 2231 six-thread qualification V114

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-six-thread-qualification-v114.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-six-thread-qualification-v114-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-six-thread-callback-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      CONTROLLER_WORKFLOW_PATH: .github/workflows/temporary-pr2231-six-thread-qualification-v114.yml
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: cfd1e459efc07f57cab7117200a4a4b962fd1bac
      EXPECTED_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_TREE: 17d5350c902e47f129fae0282735b4acbeff381c
      EXPECTED_LIBRARY: dab48bfba026dc1629a4384a26d98c13366b0ea3
      EXPECTED_TEST: 8fad1d2be93f9a286f9b95bb35751d3e908c4834
      REVIEW_BINDINGS: >-
        PRRT_kwDOTGqftc6dept0:3888440222
        PRRT_kwDOTGqftc6dfK4F:3888640534
        PRRT_kwDOTGqftc6dfK4H:3888640536
        PRRT_kwDOTGqftc6dfLu0:3888645507
        PRRT_kwDOTGqftc6di_ww:3890125090
        PRRT_kwDOTGqftc6di_wy:3890125092
      ARTIFACT_DIR: /tmp/pr2231-six-thread-qualification-v114
      PRODUCT_WT: /tmp/pr2231-six-thread-product-v114
      MAIN_WT: /tmp/pr2231-six-thread-main-v114
      QUALIFIED_DIR: /tmp/pr2231-six-thread-qualified-v114
      SOURCE_CONTROLLER_BRANCH: agent/pr2231-six-thread-qualifier-v112
      SOURCE_CONTROLLER_COMMIT: ef848dea4990681aa798943998d13ce7e8dd0037
      SOURCE_WORKFLOW_PATH: .github/workflows/temporary-pr2231-six-thread-qualification-v112.yml
      SOURCE_WORKFLOW_BLOB: 814bbbacc83a7cb2041a36186ca035ba0b755f96
      QUALIFIER_SHA256: ac7a872c0db5905944b3ff9742049700d348f2a829ec698de03f0d9a733c2ac7

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover, correct, and execute the immutable qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force origin \
            "+refs/heads/$SOURCE_CONTROLLER_BRANCH:refs/remotes/origin/source-v112"
          test "$(git rev-parse refs/remotes/origin/source-v112)" = \
            "$SOURCE_CONTROLLER_COMMIT"
          test "$(git rev-parse "$SOURCE_CONTROLLER_COMMIT:$SOURCE_WORKFLOW_PATH")" = \
            "$SOURCE_WORKFLOW_BLOB"
          git show "$SOURCE_CONTROLLER_COMMIT:$SOURCE_WORKFLOW_PATH" \
            > /tmp/pr2231-six-thread-source-v112.yml
          python - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/pr2231-six-thread-source-v112.yml')
          lines = workflow.read_text().splitlines()
          start = next(
              index for index, line in enumerate(lines)
              if "base64 -d <<'QUALIFIER_PAYLOAD'" in line
          ) + 1
          end = next(
              index for index in range(start, len(lines))
              if lines[index].strip() == 'QUALIFIER_PAYLOAD'
          )
          payload = [line.strip() for line in lines[start:end]]
          Path('/tmp/pr2231-six-thread-source-v112.sh.gz.b64').write_text(
              '\n'.join(payload) + '\n'
          )
          PY
          base64 -d /tmp/pr2231-six-thread-source-v112.sh.gz.b64 \
            | gzip -d > /tmp/pr2231-six-thread-qualification-v114.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/pr2231-six-thread-qualification-v114.sh')
          source = path.read_text()
          source = source.replace('v112', 'v114').replace('V112', 'V114')
          old = (
              'reviewThreads(first:100,after:$endCursor){nodes{id isResolved '
              'isOutdated path line comments(first:100){nodes{databaseId '
              'commit{oid}}} pageInfo{hasNextPage endCursor}}'
          )
          new = (
              'reviewThreads(first:100,after:$endCursor){nodes{id isResolved '
              'isOutdated path line comments(first:100){nodes{databaseId '
              'commit{oid}}}} pageInfo{hasNextPage endCursor}'
          )
          if source.count(old) != 1:
              raise SystemExit(
                  f'unexpected reviewThreads query anchor count: {source.count(old)}'
              )
          source = source.replace(old, new, 1)
          path.write_text(source)

          query_line = next(
              line for line in source.splitlines()
              if "-f 'query=query(" in line
          )
          query = query_line.split("-f '", 1)[1].rsplit("'", 1)[0]
          if query.count('{') != query.count('}'):
              raise SystemExit('unbalanced GraphQL query document')
          PY
          printf '%s  %s\n' "$QUALIFIER_SHA256" \
            /tmp/pr2231-six-thread-qualification-v114.sh | sha256sum -c -
          bash -n /tmp/pr2231-six-thread-qualification-v114.sh
          chmod +x /tmp/pr2231-six-thread-qualification-v114.sh
          /tmp/pr2231-six-thread-qualification-v114.sh

      - name: Emit qualification diagnostics
        if: always()
        shell: bash
        run: |
          upload=/tmp/pr2231-six-thread-qualification-v114-upload
          rm -rf "$upload"
          mkdir -p "$ARTIFACT_DIR" "$upload"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$ARTIFACT_DIR/artifact-manifest.txt"
          cp -a "$ARTIFACT_DIR"/. "$upload"/
          find "$upload" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$upload/upload-manifest.txt"
          {
            printf '%s\n' '### PR 2231 six-thread qualification V114'
            for receipt in summary.json qualification-terminal.txt \
              predecessor-reproduction.jsonl direct-matrix.jsonl \
              focused-product.log product-release-check.log \
              focused-main-transplant.log main-release-check.log \
              candidate-commit.txt candidate-paths.txt candidate.patch \
              review-comments-before.tsv review-comments-after.tsv \
              review-thread-ledger-before.jsonl review-thread-ledger-after.jsonl \
              current-line-review-thread-count-before.txt \
              current-line-review-thread-count-after.txt \
              current-line-review-threads-before.json \
              current-line-review-threads-after.json \
              controller-paths.txt product-paths-before.txt \
              artifact-manifest.txt; do
              printf '\n#### %s\n\n```text\n' "$receipt"
              [[ ! -f "$ARTIFACT_DIR/$receipt" ]] \
                || tail -n 500 "$ARTIFACT_DIR/$receipt"
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-six-thread-qualification-v114
          path: /tmp/pr2231-six-thread-qualification-v114-upload
          retention-days: 90
