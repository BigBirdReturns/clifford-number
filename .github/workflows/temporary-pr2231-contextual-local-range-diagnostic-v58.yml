name: Temporary PR 2231 contextual local range diagnostic v58
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-contextual-local-range-diagnostic-v58.yml'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr2231-contextual-local-range-diagnostic-v58
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBRANCH: agent/pr2231-contextual-local-range-diagnostic-v58
      WORKFLOW_PATH: .github/workflows/temporary-pr2231-contextual-local-range-diagnostic-v58.yml
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 64cf378d5bb7b39b9d496f554a887076cf3d637b
      PTREE: 980429f782d882387335e1067c568fc5a7ac240c
      PLIB: 476ed485878026ae89682eb692b7802ad7fa37ec
      PTEST: 964c44006a528234dc0962ba7524c10281c9d81d
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Classify exact-head contextual local-range precedence
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-v58-product
          R=/tmp/pr2231-v58-diagnostic.txt
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s actual=%s expected=%s\n' "$label" "$actual" "$expected" | tee -a "$R"
            [ "$actual" = "$expected" ] || fail "$label" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }

          stage diagnostic-envelope
          require_eq diagnostic-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq diagnostic-branch '${{ github.head_ref }}' "$CBRANCH"
          require_eq diagnostic-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq diagnostic-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            "$WORKFLOW_PATH"

          stage exact-live-leases
          fetch_leases
          require_eq diagnostic-remote \
            "$(git rev-parse "refs/remotes/origin/$CBRANCH")" "$H"
          require_eq main-head \
            "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-library \
            "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test \
            "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head \
            "$(git rev-parse "refs/remotes/origin/$PBRANCH")" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-library \
            "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test \
            "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths \
            "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage exact-head-executable-classification
          rm -rf "$S"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const chain = 'GUID '.repeat(4000);
          const normalizedLocalPhone = /555\s*-\s*1212/u;
          const results = [];

          for (const [name, input] of [
            ['labelled-local-control', 'Phone: 555-1212'],
            ['wrapped-local-control', '(555-1212)'],
            ['fullwidth-local-control', 'Phone: ５５５－１２１２']
          ]) {
            const actual = redact(input);
            const normalized = actual.normalize('NFKC');
            console.log(JSON.stringify({ name, input, actual }));
            assert.match(actual, /\[contact omitted\]/u);
            assert.doesNotMatch(normalized, normalizedLocalPhone);
          }

          for (const [name, input] of [
            [
              'label-derived-post-observation',
              'Phone: 09012345678 2026-08-17 555-1212'
            ],
            [
              'wrapper-derived-post-observation',
              'Phone: 09012345678 2026-08-17 (555-1212)'
            ],
            [
              'fullwidth-label-derived-post-observation',
              'Phone: ０９０１２３４５６７８ ２０２６－０８－１７ ５５５－１２１２'
            ],
            [
              'bounded-phone-context-post-observation',
              `Phone ${chain}record id: 09012345678 2026-08-17 555-1212`
            ]
          ]) {
            const actual = redact(input);
            const normalized = actual.normalize('NFKC');
            const localPhoneRemains = normalizedLocalPhone.test(normalized);
            const redactions = (actual.match(/\[contact omitted\]/gu) ?? []).length;
            assert.match(normalized, /2026-08-17/u);
            assert.ok(redactions >= 1, `${name} must still redact the first phone-shaped value`);
            results.push({ name, localPhoneRemains, redactions, actualTail: actual.slice(-260) });
            console.log(JSON.stringify(results.at(-1)));
          }

          for (const [name, input, requiredTail] of [
            [
              'unit-labelled-range-control',
              'Phone: 09012345678 2026-08-17 10-20 people',
              '2026-08-17 10-20 people'
            ],
            [
              'time-observation-control',
              'Phone: 09012345678 2026-08-17 12:30',
              '2026-08-17 12:30'
            ],
            [
              'decimal-observation-control',
              'Phone: 09012345678 2026-08-17 3.14',
              '2026-08-17 3.14'
            ]
          ]) {
            const actual = redact(input);
            console.log(JSON.stringify({ name, actual }));
            assert.ok(actual.endsWith(requiredTail));
            assert.match(actual, /\[contact omitted\]/u);
          }

          for (const [name, input] of [
            [
              'intrinsic-range-shaped-domestic-control',
              'Phone: 09012345678 2026-08-17 050-12345678'
            ],
            [
              'intrinsic-two-group-domestic-control',
              'Phone: 09012345678 2026-08-17 03-62165111'
            ],
            [
              'current-outer-closer-control',
              `Archive ${chain}(record id: 09012345678 2026-08-17-)03-6216-8041) 12345678`
            ]
          ]) {
            const actual = redact(input);
            console.log(JSON.stringify({ name, actualTail: actual.slice(-260) }));
            if (name === 'current-outer-closer-control') {
              assert.equal((actual.match(/\[contact omitted\]/gu) ?? []).length, 2);
              assert.ok(actual.endsWith(' 12345678'));
            } else {
              assert.equal((actual.match(/\[contact omitted\]/gu) ?? []).length, 2);
            }
          }

          const leaked = results.filter(result => result.localPhoneRemains).map(result => result.name);
          const redacted = results.filter(result => !result.localPhoneRemains).map(result => result.name);
          const classification = leaked.length === results.length
            ? 'reproduced'
            : redacted.length === results.length
              ? 'closed'
              : 'mixed';
          console.log(JSON.stringify({
            DIAGNOSTIC_SUCCESS: true,
            classification,
            leaked,
            redacted,
            product: '64cf378d5bb7b39b9d496f554a887076cf3d637b',
            tree: '980429f782d882387335e1067c568fc5a7ac240c',
            library: '476ed485878026ae89682eb692b7802ad7fa37ec',
            test: '964c44006a528234dc0962ba7524c10281c9d81d'
          }));
          NODE

          stage final-live-lease-revalidation
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main \
            "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-product \
            "$(git rev-parse "refs/remotes/origin/$PBRANCH")" "$PHEAD"
          require_eq final-controller \
            "$(git rev-parse "refs/remotes/origin/$CBRANCH")" "$H"
          require_eq final-product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq final-product-library \
            "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq final-product-test \
            "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          printf 'DIAGNOSTIC_RECEIPT_COMPLETE\n' | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-contextual-local-range-diagnostic-v58
          path: /tmp/pr2231-v58-diagnostic.txt
          if-no-files-found: error
          retention-days: 90
