name: Temporary materialize K0 source and field audit
# checksum-bound carrier that exports every Git-object receipt before connector publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-audit.yml'
  push:
    branches:
      - agent/k0-source-field-audit
    paths:
      - '.github/workflows/temporary-materialize-k0-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-source-field-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand exact K0 audit payload
        run: |
          cat .github/tmp/k0-source-field-audit-part-*.b64 > /tmp/k0-source-field-audit.b64
          base64 -d /tmp/k0-source-field-audit.b64 > /tmp/k0-source-field-audit.tgz
          test "$(sha256sum /tmp/k0-source-field-audit.tgz | awk '{print $1}')" = "fc3606ddf6838e7ab8bb31bf7357a51e11ad8e4da5f6db742180c52afd694aa0"
          rm -rf /tmp/k0-source-field-audit
          mkdir -p /tmp/k0-source-field-audit
          tar -xzf /tmp/k0-source-field-audit.tgz -C /tmp/k0-source-field-audit

      - name: Materialize and validate exact permanent bytes
        run: |
          node /tmp/k0-source-field-audit/materialize-k0-source-field-audit.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Prepare exact validated transaction
        run: |
          rm -rf /tmp/k0-audit-export
          mkdir -p /tmp/k0-audit-export
          cp --parents \
            .github/workflows/k0-source-field-audit.yml \
            data/canonical/corpus-selection.json \
            data/intake/k0-ceiling-conversion-seed-events.json \
            data/project/k0-epistemic-admissibility-methodology.json \
            data/project/k0-epistemic-admissibility-release-manifest.json \
            data/research/corpus-coverage.json \
            data/research/k0-field-audit.json \
            data/research/k0-role-neutral-denominator.json \
            data/research/k0-source-custody-audit.json \
            data/research/selection-adversarial-reviews.json \
            docs/methods/k0-epistemic-admissibility.md \
            docs/milestones/m05-k0-source-field-audit.md \
            reports/core-thesis/answerable-power/k0.html \
            reports/core-thesis/answerable-power/k0.json \
            schemas/k0-ceiling-conversion-event.schema.json \
            test/k0-epistemic-admissibility.test.js \
            tools/build-k0-epistemic-admissibility.mjs \
            tools/validate-k0-epistemic-admissibility.mjs \
            /tmp/k0-audit-export/
          git rev-parse HEAD > /tmp/k0-audit-export/CARRIER_HEAD.txt
          git rev-parse 'HEAD^{tree}' > /tmp/k0-audit-export/CARRIER_TREE.txt
          git status --short > /tmp/k0-audit-export/MATERIALIZED_STATUS.txt
          git diff --name-status > /tmp/k0-audit-export/MATERIALIZED_PATHS.txt

      - name: Create Git objects and preserve complete API receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCOMMIT'
          import base64
          import json
          import os
          import subprocess
          import traceback
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          receipt_path = '/tmp/k0-audit-export/GIT_OBJECT_TRANSACTION.json'

          updates = [
              '.github/workflows/k0-source-field-audit.yml',
              'data/canonical/corpus-selection.json',
              'data/intake/k0-ceiling-conversion-seed-events.json',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-field-audit.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-source-custody-audit.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/methods/k0-epistemic-admissibility.md',
              'docs/milestones/m05-k0-source-field-audit.md',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'schemas/k0-ceiling-conversion-event.schema.json',
              'test/k0-epistemic-admissibility.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
          ]
          deletions = [
              '.github/workflows/temporary-materialize-k0-audit.yml',
              '.github/tmp/k0-audit-wave01-part-00.b64',
              '.github/tmp/k0-audit-wave01-part-01.b64',
              '.github/tmp/k0-audit-wave01-part-02.b64',
              '.github/tmp/k0-source-field-audit-part-00.b64',
              '.github/tmp/k0-source-field-audit-part-01.b64',
              '.github/tmp/k0-source-field-audit-part-02.b64',
              '.github/tmp/k0-source-field-audit-part-03.b64',
              '.github/tmp/k0-source-field-audit-part-04.b64',
              '.github/tmp/k0-source-field-audit-part-05.b64',
              '.github/tmp/k0-source-field-audit-part-06.b64',
              '.github/tmp/k0-source-field-audit-part-07.b64',
              '.github/tmp/k0-source-field-audit-part-08.b64',
          ]

          state = {
              'repository': repo,
              'parent': parent,
              'base_tree': base_tree,
              'updates': [],
              'deletions': deletions,
              'candidate_tree': None,
              'candidate_commit': None,
              'ref_updated': False,
              'error': None,
          }

          def persist():
              with open(receipt_path, 'w') as handle:
                  json.dump(state, handle, indent=2)
                  handle.write('\n')

          def post(path, payload):
              req = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'k0-source-field-audit',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'POST {path} -> HTTP {error.code}: {body}') from error

          persist()
          try:
              tree_entries = []
              for path in updates:
                  raw = open(path, 'rb').read()
                  blob = post(f'/repos/{repo}/git/blobs', {
                      'content': base64.b64encode(raw).decode(),
                      'encoding': 'base64',
                  })
                  index_row = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).strip()
                  mode = index_row.split()[0] if index_row else '100644'
                  row = {'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': mode}
                  state['updates'].append(row)
                  tree_entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
                  persist()

              for path in deletions:
                  tree_entries.append({'path': path, 'sha': None})

              tree = post(f'/repos/{repo}/git/trees', {'base_tree': base_tree, 'tree': tree_entries})
              state['candidate_tree'] = tree['sha']
              persist()
              commit = post(f'/repos/{repo}/git/commits', {
                  'message': 'Audit K0 source custody and CCD semantics',
                  'tree': tree['sha'],
                  'parents': [parent],
              })
              state['candidate_commit'] = commit['sha']
              persist()
          except Exception as error:
              state['error'] = {
                  'message': str(error),
                  'traceback': traceback.format_exc(),
              }
              persist()

          print(json.dumps(state, indent=2))
          PYCOMMIT

      - name: Seal exact validated transaction
        run: |
          find /tmp/k0-audit-export -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/k0-audit-export/FILE_SHA256SUMS.txt
          tar -czf /tmp/k0-source-field-audit-permanent.tgz -C /tmp/k0-audit-export .
          sha256sum /tmp/k0-source-field-audit-permanent.tgz > /tmp/k0-source-field-audit-permanent.sha256

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-source-field-audit-validated-transaction
          path: |
            /tmp/k0-source-field-audit-permanent.tgz
            /tmp/k0-source-field-audit-permanent.sha256
          if-no-files-found: error
          retention-days: 30
