name: Temporary PR 2231 V131 exact leased publisher R2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-v131-phone-label-bare-host-exact-leased-publisher-v2
  cancel-in-progress: false

jobs:
  publish-v131-r2:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v131-phone-label-bare-host-publisher-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v131-phone-label-bare-host-publisher-v2
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact publisher R2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute exact V131 replay and leased publication R2
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=.github/temporary/pr2231-v131-phone-label-bare-host-publisher-v2.tar.xz
          payload_size=10512
          payload_blob=ed6957d9d193c863d579b2d2bc91eaa372355665
          payload_sha256=178c988c3158d84543581b97c181b183b65e49fa165b7378b78dc0742ea0be88
          runroot=/tmp/pr2231-v131-phone-label-bare-host-publisher-controller-v2
          script="$runroot/.github/scripts/pr2231-v131-phone-label-bare-host-publisher-v2.sh"
          patch="$runroot/.github/scripts/pr2231-v131-phone-label-bare-host-v1.patch"

          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          rm -rf "$runroot"
          mkdir -p "$runroot"
          tar -xJf "$payload" -C "$runroot"
          mapfile -t members < <(tar -tJf "$payload")
          test "${#members[@]}" = 2
          test "${members[0]}" = .github/scripts/pr2231-v131-phone-label-bare-host-publisher-v2.sh
          test "${members[1]}" = .github/scripts/pr2231-v131-phone-label-bare-host-v1.patch
          test "$(wc -c < "$script")" = 39694
          test "$(git hash-object "$script")" = f9a94c664611e1660f260f8920480b961b1bcd96
          test "$(sha256sum "$script" | awk '{print $1}')" = 2c4cd14764a1fe353c86870bd3320ce06d5f1855da4a352a741f4860ba135b7a
          test "$(wc -c < "$patch")" = 8695
          test "$(git hash-object "$patch")" = a1b0f675294882c33d8501193c1e34b746eb3194
          test "$(sha256sum "$patch" | awk '{print $1}')" = 038cdfc8d067cfba7799dbe3d8980004ff588b848a95c47f287dcb9e61cfb5ff
          chmod 0755 "$script"
          bash -n "$script"
          V131_PATCH_FILE="$patch" bash "$script"

      - name: Retain V131 R2 publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v131-phone-label-bare-host-exact-leased-publication-v2
          path: /tmp/pr2231-v131-phone-label-bare-host-publication-v2
          if-no-files-found: error
          retention-days: 90
