name: Estate closure and Aperture milestone

on:
  pull_request:
    paths:
      - 'data/estates/**'
      - 'data/milestones/estate-aperture-v1.json'
      - 'docs/estates.md'
      - 'docs/milestones/estate-aperture-v1.md'
      - 'issue-handoffs/**'
      - 'src/estate-aperture*'
      - 'estates/**'
      - 'tools/build-estate-closures.mjs'
      - 'tools/render-estate-aperture.mjs'
      - 'tools/validate-estate-closures.mjs'
      - 'tools/validate-estate-aperture-pages.mjs'
      - 'tools/verify-estate-aperture-browser.cjs'
      - 'tools/compile.mjs'
      - 'tools/build-pages.mjs'
      - 'tools/build-standalone.mjs'
      - 'tools/validate-pages.mjs'
      - 'test/estate-closures.test.js'
      - 'test/estate-aperture.test.js'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/estate-closure-aperture.yml'
  push:
    branches:
      - main
    paths:
      - 'data/milestones/estate-aperture-v1.json'
      - 'docs/milestones/estate-aperture-v1.md'
      - '.github/workflows/estate-closure-aperture.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-closure-aperture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compile the complete estate waterline
        run: |
          set +e
          npm run compile > /tmp/estate-aperture-compile.log 2>&1
          status=$?
          tail -n 260 /tmp/estate-aperture-compile.log
          exit "$status"

      - name: Validate closure law and deterministic Aperture
        run: |
          npm run validate:estate-closures
          node test/estate-closures.test.js
          node test/estate-aperture.test.js
          node tools/validate-estate-aperture-pages.mjs

      - name: Run the complete repository release gate
        run: |
          set +e
          npm run release:check > /tmp/estate-aperture-release.log 2>&1
          status=$?
          tail -n 320 /tmp/estate-aperture-release.log
          exit "$status"

      - name: Refuse generated drift
        run: |
          git diff --exit-code -- \
            build/estate-closures \
            estates/data.json \
            estates/index.html \
            issue-handoffs

      - name: Install declared browser dependency
        run: |
          npm install --no-package-lock
          node -e "const version = require('./node_modules/playwright/package.json').version; if (version !== '1.55.0') throw new Error('expected playwright 1.55.0, got ' + version);"
          npx playwright install --with-deps chromium

      - name: Start the static public application
        run: |
          node tools/serve-static.mjs 8080 > /tmp/estate-aperture-server.log 2>&1 &
          echo $! > /tmp/estate-aperture-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/estates/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/estate-aperture-server.log
          exit 1

      - name: Verify Estate Aperture in Chromium
        run: |
          node --check tools/verify-estate-aperture-browser.cjs
          timeout 240s node tools/verify-estate-aperture-browser.cjs

      - name: Preserve milestone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-aperture-milestone
          path: |
            data/estates/closure-methodology.json
            data/estates/source-route-registry.json
            data/estates/issue-map.json
            data/milestones/estate-aperture-v1.json
            docs/milestones/estate-aperture-v1.md
            build/estate-closures/*.json
            estates/data.json
            estates/index.html
            issue-handoffs/*.md
            build/metrics/estate-aperture-browser.json
            build/metrics/estate-aperture-desktop.png
            build/metrics/estate-aperture-mobile.png
            build/metrics/estate-aperture-export.json
            dist/Clifford-Estate-Aperture-standalone.html
            /tmp/estate-aperture-compile.log
            /tmp/estate-aperture-release.log
            /tmp/estate-aperture-server.log
          if-no-files-found: warn
          retention-days: 90

  close-milestone:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MILESTONE_TITLE: M-01 · Bounded Estate Pass and Estate Aperture
    steps:
      - uses: actions/checkout@v4

      - name: Create or refresh the GitHub milestone
        id: milestone
        shell: bash
        run: |
          record="$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq ".[] | select(.title == env.MILESTONE_TITLE) | [.number,.state] | @tsv" | head -n 1)"
          number="$(printf '%s' "$record" | cut -f1)"
          state="$(printf '%s' "$record" | cut -f2)"
          description='Closes the declared fourteen-estate, 143-task acquisition pass to candidate-only handoffs and publishes the four-level Estate Aperture. A bounded pass is not a completed estate.'
          if [ -z "$number" ]; then
            number="$(gh api --method POST "repos/$GH_REPO/milestones" -f title="$MILESTONE_TITLE" -f description="$description" --jq '.number')"
            state='open'
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ "$state" = 'closed' ]; then
            echo 'already_closed=true' >> "$GITHUB_OUTPUT"
          else
            gh api --method PATCH "repos/$GH_REPO/milestones/$number" -f state='open' -f description="$description" >/dev/null
            echo 'already_closed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Record bounded closure on every estate lane
        if: steps.milestone.outputs.already_closed != 'true'
        shell: bash
        run: |
          for body in issue-handoffs/*.md; do
            issue="$(basename "$body" | cut -d- -f1 | sed 's/^0*//')"
            gh issue comment "$issue" --repo "$GH_REPO" --body-file "$body"
            gh issue edit "$issue" --repo "$GH_REPO" --milestone "$MILESTONE_TITLE"
            gh issue close "$issue" --repo "$GH_REPO" --reason completed
          done

      - name: Close the completed milestone
        if: steps.milestone.outputs.already_closed != 'true'
        shell: bash
        run: |
          gh api --method PATCH "repos/$GH_REPO/milestones/${{ steps.milestone.outputs.number }}" \
            -f state='closed' \
            -f description='Completed on main. Fourteen estate lanes and 143 tasks closed to bounded states; fourteen candidate-only handoffs and the Estate Aperture published. The estates remain open under residual fog.' >/dev/null