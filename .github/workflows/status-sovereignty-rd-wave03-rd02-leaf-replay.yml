name: SSC RD-02 Wave 03 admitted source and manager-lineage replay

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd02-leaf-replay.yml'
      - '.ssc-rd02-wave03-manager-lineage-replay-trigger/EXECUTE'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/disclosure-leaf-execution-receipt.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/manager-lineage-replay-protocol.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/field-matrix-contract.json'
      - 'data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/sources/stifel-am-forward-2024-final-approval.json'
      - 'schemas/status-sovereignty-rd-wave03-rd02-leaf-replay.schema.json'
      - 'tools/validate-status-sovereignty-rd-wave03-rd02-leaf-replay.mjs'
      - 'test/status-sovereignty-rd-wave03-rd02-leaf-replay.test.js'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd02/run-manager-lineage-replay.py'
      - 'docs/milestones/ssc-rd-wave03-rd02-leaf-replay.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd02-leaf-replay.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/disclosure-leaf-execution-receipt.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/manager-lineage-replay-protocol.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/field-matrix-contract.json'
      - 'data/research/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/sources/stifel-am-forward-2024-final-approval.json'
      - 'schemas/status-sovereignty-rd-wave03-rd02-leaf-replay.schema.json'
      - 'tools/validate-status-sovereignty-rd-wave03-rd02-leaf-replay.mjs'
      - 'test/status-sovereignty-rd-wave03-rd02-leaf-replay.test.js'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd02/run-manager-lineage-replay.py'
      - 'docs/milestones/ssc-rd-wave03-rd02-leaf-replay.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd02-wave03-leaf-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate admitted source and one-route replay
        run: |
          set -Eeuo pipefail
          node --check tools/validate-status-sovereignty-rd-wave03-rd02-leaf-replay.mjs
          node --check test/status-sovereignty-rd-wave03-rd02-leaf-replay.test.js
          node tools/validate-status-sovereignty-rd-wave03-rd02-leaf-replay.mjs
          node test/status-sovereignty-rd-wave03-rd02-leaf-replay.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd02/run-manager-lineage-replay.py
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore volatile outputs and replay exact validation
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          git clean -fdx
          node tools/validate-status-sovereignty-rd-wave03-rd02-leaf-replay.mjs
          node test/status-sovereignty-rd-wave03-rd02-leaf-replay.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd02/run-manager-lineage-replay.py
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  capture:
    if: startsWith(github.head_ref, 'agent/ssc-rd-wave03-rd02-manager-lineage-replay-trigger-')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Revalidate exact failed-route replay before request
        run: |
          set -Eeuo pipefail
          node tools/validate-status-sovereignty-rd-wave03-rd02-leaf-replay.mjs
          node test/status-sovereignty-rd-wave03-rd02-leaf-replay.test.js
          node tools/validate-no-magic-human-gate.mjs

      - name: Execute one exact manager-lineage replay
        run: |
          python tools/acquisition/status-sovereignty-rd-wave03-rd02/run-manager-lineage-replay.py \
            --output /tmp/ssc-rd02-wave03-manager-lineage-replay-v1

      - name: Preserve exact replay PDF, route receipt, summary, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd02-wave03-manager-lineage-replay-v1
          path: /tmp/ssc-rd02-wave03-manager-lineage-replay-v1
          if-no-files-found: error
          retention-days: 90
