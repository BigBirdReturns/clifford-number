name: Materialize Counter-Selector Wave 21

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-21.yml'
      - '.github/materializers/counter-selector-wave-21/**'
      - '.github/workflows/counter-selector-wave-21.yml'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-21-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-21-gate-exhaustion

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact chunks and unpack Wave 21 estate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave21-expected-blobs <<'EOF'
          a1dcd795b22a54c38ccde52a3c93bcbdd094aab4  .github/materializers/counter-selector-wave-21/payload-000
          edf6a115bb9d0e1181dff1f359fd369eee2ebc4b  .github/materializers/counter-selector-wave-21/payload-001
          df9d62dc9c878255af0258a9fdb10232cdeeea37  .github/materializers/counter-selector-wave-21/payload-002
          48cbfb82b5e43a3a9b912ca474123ac70ad51d90  .github/materializers/counter-selector-wave-21/payload-003
          640b6345eea720d423049404d03027e9d2dc30ba  .github/materializers/counter-selector-wave-21/payload-004
          cfdf6d3da20ea7575999515be2145fa21583f967  .github/materializers/counter-selector-wave-21/payload-005
          dcec6063952740c7fd12dfb013653d7d75a6a14b  .github/materializers/counter-selector-wave-21/payload-006
          e14b8115d9ae56b5bfdd86a2c9b4e36c516feee2  .github/materializers/counter-selector-wave-21/payload-007
          47333ae9e25b73f015b631ec57d3934fdc759edd  .github/materializers/counter-selector-wave-21/payload-008
          cb761d687b013040caef6fc53527876ae32a47a4  .github/materializers/counter-selector-wave-21/payload-009
          e5bdc8b5810e2dc51a623eb48845951b200d6267  .github/materializers/counter-selector-wave-21/payload-010
          186127ed2790fe28b7926c717d6321b8988f6e5e  .github/materializers/counter-selector-wave-21/payload-011
          dc1625fb19cc446a8358e5e760e0254ce1f32a59  .github/materializers/counter-selector-wave-21/payload-012
          5d17b975f5230eeed2de3de12abd4b7e61804a3d  .github/materializers/counter-selector-wave-21/payload-013
          6728bf2de1e8bb25fcc6c29666593684e94dd41d  .github/materializers/counter-selector-wave-21/payload-014
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave21-expected-blobs

          cat .github/materializers/counter-selector-wave-21/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-21.tar.gz
          echo '150408e518dd132c4a604d559f9bcd854285671cd51108979908130f7ab10e8e  /tmp/counter-selector-wave-21.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-21.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-21

      - name: Build, validate, and attack Wave 21
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-21.mjs
          node tools/validate-counter-selector-wave-21.mjs
          node test/counter-selector-wave-21.test.js

      - name: Commit exact permanent non-workflow Wave 21 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-21/payload-000 \
            .github/materializers/counter-selector-wave-21/payload-001 \
            .github/materializers/counter-selector-wave-21/payload-002 \
            .github/materializers/counter-selector-wave-21/payload-003 \
            .github/materializers/counter-selector-wave-21/payload-004 \
            .github/materializers/counter-selector-wave-21/payload-005 \
            .github/materializers/counter-selector-wave-21/payload-006 \
            .github/materializers/counter-selector-wave-21/payload-007 \
            .github/materializers/counter-selector-wave-21/payload-008 \
            .github/materializers/counter-selector-wave-21/payload-009 \
            .github/materializers/counter-selector-wave-21/payload-010 \
            .github/materializers/counter-selector-wave-21/payload-011 \
            .github/materializers/counter-selector-wave-21/payload-012 \
            .github/materializers/counter-selector-wave-21/payload-013 \
            .github/materializers/counter-selector-wave-21/payload-014 \
            data/project/counter-selector-wave-21-archive-request-registry.json \
            data/project/counter-selector-wave-21-external-review-registry.json \
            data/project/counter-selector-wave-21-gate-exhaustion.json \
            data/project/counter-selector-wave-21-gate-registry.json \
            data/project/counter-selector-wave-21-release-manifest.json \
            docs/methods/counter-selector-gate-exhaustion.md \
            docs/milestones/counter-selector-wave-21.md \
            docs/requests/counter-selector-wave-21-carter-library-request.md \
            docs/requests/counter-selector-wave-21-loc-request.md \
            docs/requests/counter-selector-wave-21-un-arms-request.md \
            reports/core-thesis/counter-selector-wave-21/data.json \
            reports/core-thesis/counter-selector-wave-21/index.html \
            schemas/counter-selector-gate-exhaustion.schema.json \
            test/counter-selector-wave-21.test.js \
            tools/build-counter-selector-wave-21.mjs \
            tools/validate-counter-selector-wave-21.mjs | sort)"
          test "$actual" = "$expected" || {
            echo "unexpected staged paths" >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Exhaust Counter-Selector Wave 21 remaining gates'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 21 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-21.mjs
          node tools/validate-counter-selector-wave-21.mjs
          node test/counter-selector-wave-21.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent non-workflow Wave 21 head
        run: git push origin HEAD:agent/counter-selector-wave-21-gate-exhaustion
