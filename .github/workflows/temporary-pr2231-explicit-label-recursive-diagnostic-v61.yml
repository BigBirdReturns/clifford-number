name: Temporary PR 2231 recursive phone-label diagnostic v61
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-explicit-label-recursive-diagnostic-v61.yml'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr2231-explicit-label-recursive-diagnostic-v61
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBRANCH: agent/pr2231-explicit-label-recursive-diagnostic-v61
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 08594a6eb033a137d1500ff5ff970658a7cac020
      PTREE: d53c3b2397b262972ff594fdbce478f3699179bf
      PLIB: 0730e31c7870b17c99dfdb92c0c0ac550f7f13c8
      PTEST: 77a55e8c6a5fba54515008126b1e64ed5b30ae6d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduce recursive explicit-label custody on exact product head
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          R=/tmp/pr2231-explicit-label-recursive-v61.txt
          W=/tmp/pr2231-explicit-label-recursive-v61-product
          : >"$R"
          require_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s actual=%s expected=%s\n' "$label" "$actual" "$expected" | tee -a "$R"
            [ "$actual" = "$expected" ]
          }

          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-branch '${{ github.head_ref }}' "$CBRANCH"
          require_eq controller-paths "$(git diff --name-only "$CPARENT..HEAD")" \
            '.github/workflows/temporary-pr2231-explicit-label-recursive-diagnostic-v61.yml'

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
            "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          rm -rf "$W"
          git worktree prune
          git worktree add --detach "$W" "$PHEAD"
          cd "$W"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const cases = [
            [
              'two-later-local-phones',
              'Phone: 09012345678 2026-08-17 555-1212 2027-09-18 666-1212',
              'Phone: [contact omitted] 2026-08-17 [contact omitted] 2027-09-18 [contact omitted]'
            ],
            [
              'fullwidth-two-later-local-phones',
              '電話番号：０９０１２３４５６７８ ２０２６－０８－１７ ５５５－１２１２ ２０２７－０９－１８ ６６６－１２１２',
              '電話番号：[contact omitted] ２０２６－０８－１７ [contact omitted] ２０２７－０９－１８ [contact omitted]'
            ],
            [
              'unit-observation-between-later-local-phones',
              'Mobile number: 2125551234 2026-08-17 555-1212 90 people 666-1212',
              'Mobile number: [contact omitted] 2026-08-17 [contact omitted] 90 people [contact omitted]'
            ],
            [
              'identifier-chain-two-later-local-phones',
              'Phone / GUID / record id: 09012345678 2026-08-17 555-1212 2027-09-18 666-1212',
              'Phone / GUID / record id: [contact omitted] 2026-08-17 [contact omitted] 2027-09-18 [contact omitted]'
            ],
            [
              'unlabelled-control',
              'Archive 09012345678 2026-08-17 555-1212 2027-09-18 666-1212',
              'Archive [contact omitted] 2026-08-17 555-1212 2027-09-18 666-1212'
            ]
          ];

          const results = cases.map(([name, input, expected]) => ({
            name,
            input,
            expected,
            actual: redact(input)
          }));
          for (const result of results) console.log(JSON.stringify(result));
          for (const result of results) {
            assert.equal(
              result.actual,
              result.expected,
              `${result.name}: explicit label state must survive every recursive observation transition without leaking into the unlabelled control`
            );
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-explicit-label-recursive-diagnostic-v61
          path: /tmp/pr2231-explicit-label-recursive-v61.txt
          if-no-files-found: error
          retention-days: 90
