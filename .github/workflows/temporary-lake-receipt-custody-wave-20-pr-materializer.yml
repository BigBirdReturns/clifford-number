name: Temporary Wave 20 PR materializer

on:
  pull_request:
    branches:
      - agent/lake-generator-contracts-wave-19
    paths:
      - '.github/tmp/lake-receipt-custody-wave-20-trigger.json'
      - '.github/workflows/temporary-lake-receipt-custody-wave-20-pr-materializer.yml'
      - 'data/project/lake-receipt-custody-wave-20-policy.json'
      - 'tools/build-lake-receipt-custody-wave-20.mjs'
      - 'tools/stabilize-lake-receipt-custody-wave-20.mjs'
      - 'tools/reconcile-lake-receipt-custody-wave-20.mjs'
      - 'tools/validate-lake-receipt-custody-wave-20.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave20-pr-materializer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require exact Wave 20 trigger
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/tmp/lake-receipt-custody-wave-20-trigger.json
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate trigger-free baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/lake-receipt-custody-wave-20-trigger.json .github/tmp/lake-generator-contracts-wave-19-trigger.json
          git add -A .github/tmp
          npm run release:check
          git restore --worktree .
          git clean -fd

      - name: Repair program identity contract and remove transport
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const f='tools/build-lake-receipt-custody-wave-20.mjs';let s=fs.readFileSync(f,'utf8');const a=\"schema_version: 'lake-receipt-custody-decision-wave-20@1',\\n    receipt_custody_decision_id:\";const b=\"schema_version: 'lake-receipt-custody-decision-wave-20@1',\\n    program_id: policy.program_id,\\n    receipt_custody_decision_id:\";if(!s.includes('program_id: policy.program_id')){if(!s.includes(a))throw new Error('decision marker drift');s=s.replace(a,b);}s=s.replaceAll('program_key: policy.program_id,','program_id: policy.program_id,');fs.writeFileSync(f,s);"
          node -e "const fs=require('fs');const f='tools/reconcile-lake-receipt-custody-wave-20.mjs';let s=fs.readFileSync(f,'utf8');s=s.replaceAll('program_key: policy.program_id,','program_id: policy.program_id,');fs.writeFileSync(f,s);"
          node -e "const fs=require('fs');const f='tools/validate-lake-receipt-custody-wave-20.mjs';let s=fs.readFileSync(f,'utf8');const marker=\"if (decisions.length !== policy.baseline.unused_receipt_definitions) fail(\`decision denominator is \${decisions.length}\`);\";const insertion=marker+\"\\nif (decisions.some(row => row.program_id !== policy.program_id)) fail('decision program identity drift');\\nif (projection.program_id !== policy.program_id) fail('projection program identity drift');\\nif (receipt.program_id !== policy.program_id) fail('receipt program identity drift');\\nif (reconciliation.program_id !== policy.program_id) fail('reconciliation program identity drift');\";if(!s.includes('decision program identity drift')){if(!s.includes(marker))throw new Error('validator marker drift');s=s.replace(marker,insertion);}fs.writeFileSync(f,s);"
          rm -f .github/tmp/lake-receipt-custody-wave-20-trigger.json
          rm -f .github/tmp/lake-generator-contracts-wave-19-trigger.json
          rm -f .github/workflows/temporary-lake-receipt-custody-wave-20-pr-materializer.yml
          node --check tools/build-lake-receipt-custody-wave-20.mjs
          node --check tools/reconcile-lake-receipt-custody-wave-20.mjs
          node --check tools/validate-lake-receipt-custody-wave-20.mjs
          git add -A
          git diff --check

      - name: Build Wave 20 source controls
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/stabilize-lake-receipt-custody-wave-20.mjs
          node tools/build-lake-receipt-custody-wave-20.mjs
          node tools/build-lake-receipt-custody-wave-20.mjs
          git add -A
          git diff --check

      - name: Observe current PR shadow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs

      - name: Reconcile Wave 20 fixed point
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/stabilize-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-semantics.mjs
            node tools/stabilize-lake-receipt-custody-wave-20.mjs
            node tools/build-lake-gap-summary.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-receipt-semantics.mjs
            node tools/validate-lake-gap-summary.mjs
            node tools/reconcile-lake-identifier-topology-wave-18.mjs
            node tools/reconcile-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-custody-wave-20.mjs
            git add -A
          done
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node tools/validate-lake-generator-contracts-wave-19.mjs
          node tools/validate-lake-receipt-custody-wave-20.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-identifier-topology-wave-18.test.js
          node test/lake-generator-contracts-wave-19.test.js
          node test/lake-receipt-custody-wave-20.test.js
          git add -A

      - name: Run complete repository gate and restore committed lake epoch
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check
          git restore --worktree .
          git clean -fd
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node tools/validate-lake-generator-contracts-wave-19.mjs
          node tools/validate-lake-receipt-custody-wave-20.mjs
          node test/lake-receipt-custody-wave-20.test.js
          git diff --check

      - name: Commit and push sealed Wave 20 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test ! -e .github/tmp/lake-receipt-custody-wave-20-trigger.json
          test ! -e .github/workflows/temporary-lake-receipt-custody-wave-20-pr-materializer.yml
          git commit -m 'Execute receipt and source custody Wave 20'
          git fetch origin agent/lake-receipt-custody-wave-20
          test "$(git rev-parse origin/agent/lake-receipt-custody-wave-20)" = "$original_sha"
          git push origin HEAD:agent/lake-receipt-custody-wave-20
