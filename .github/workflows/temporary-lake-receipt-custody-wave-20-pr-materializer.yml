name: Temporary Wave 20 PR materializer

on:
  pull_request:
    branches:
      - agent/lake-generator-contracts-wave-19
    paths:
      - '.github/tmp/lake-receipt-custody-wave-20-trigger.json'
      - '.github/workflows/temporary-lake-receipt-custody-wave-20-pr-materializer.yml'
      - 'data/project/lake-receipt-custody-wave-20-policy.json'
      - 'tools/build-lake-receipt-custody-wave-20.mjs'
      - 'tools/stabilize-lake-receipt-custody-wave-20.mjs'
      - 'tools/reconcile-lake-receipt-custody-wave-20.mjs'
      - 'tools/validate-lake-receipt-custody-wave-20.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave20-pr-materializer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require exact Wave 20 trigger
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/tmp/lake-receipt-custody-wave-20-trigger.json
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate trigger-free baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/lake-receipt-custody-wave-20-trigger.json .github/tmp/lake-generator-contracts-wave-19-trigger.json
          git add -A .github/tmp
          npm run release:check
          git restore --worktree .
          git clean -fd

      - name: Build Wave 20 source controls
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-lake-receipt-custody-wave-20.mjs
          node --check tools/stabilize-lake-receipt-custody-wave-20.mjs
          node --check tools/reconcile-lake-receipt-custody-wave-20.mjs
          node --check tools/validate-lake-receipt-custody-wave-20.mjs
          node tools/build-lake-receipt-custody-wave-20.mjs
          node tools/build-lake-receipt-custody-wave-20.mjs
          git add -A
          git diff --check

      - name: Observe current PR shadow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs

      - name: Reconcile Wave 20 fixed point
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/stabilize-lake-generator-contracts-wave-19.mjs
            node tools/stabilize-lake-receipt-custody-wave-20.mjs
            node tools/reconcile-lake-receipt-semantics.mjs
            node tools/build-lake-gap-summary.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-receipt-semantics.mjs
            node tools/validate-lake-gap-summary.mjs
            node tools/reconcile-lake-identifier-topology-wave-18.mjs
            node tools/reconcile-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-custody-wave-20.mjs
            git add -A
          done
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node tools/validate-lake-generator-contracts-wave-19.mjs
          node tools/validate-lake-receipt-custody-wave-20.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-identifier-topology-wave-18.test.js
          node test/lake-generator-contracts-wave-19.test.js
          node test/lake-receipt-custody-wave-20.test.js
          git add -A

      - name: Run complete repository gate and restore committed lake epoch
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check
          git restore --worktree .
          git clean -fd
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node tools/validate-lake-generator-contracts-wave-19.mjs
          node tools/validate-lake-receipt-custody-wave-20.mjs
          node test/lake-receipt-custody-wave-20.test.js
          git diff --check

      - name: Commit and push sealed Wave 20 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute receipt and source custody Wave 20'
          git fetch origin agent/lake-receipt-custody-wave-20
          test "$(git rev-parse origin/agent/lake-receipt-custody-wave-20)" = "$original_sha"
          git push origin HEAD:agent/lake-receipt-custody-wave-20
