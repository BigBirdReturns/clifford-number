name: Counter-Selector Wave 37 live operational handoff

on:
  pull_request:
    paths:
      - 'data/project/counter-selector-wave-37-*.json'
      - 'schemas/counter-selector-live-operational-handoff.schema.json'
      - 'docs/methods/counter-selector-live-operational-handoff.md'
      - 'docs/milestones/counter-selector-wave-37.md'
      - 'tools/*counter-selector-wave-37*'
      - 'test/counter-selector-wave-37.test.js'
      - 'reports/core-thesis/counter-selector-wave-37/**'
      - '.github/workflows/counter-selector-wave-37.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 37 products
        run: node tools/build-counter-selector-wave-37.mjs
      - name: Validate live-operational-handoff contract
        run: node tools/validate-counter-selector-wave-37.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-37.test.js
      - name: Require exact committed Wave 37 products
        run: git diff --exit-code -- data/project/counter-selector-wave-37-control-registry.json data/project/counter-selector-wave-37-release-manifest.json reports/core-thesis/counter-selector-wave-37/data.json reports/core-thesis/counter-selector-wave-37/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 37 deterministically
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-37.mjs
          node tools/validate-counter-selector-wave-37.mjs
          node test/counter-selector-wave-37.test.js
          git diff --exit-code -- data/project/counter-selector-wave-37-control-registry.json data/project/counter-selector-wave-37-release-manifest.json reports/core-thesis/counter-selector-wave-37/data.json reports/core-thesis/counter-selector-wave-37/index.html
          test -z "$(git status --porcelain)"
