name: TEMP materialize School.House first-party Archive locator custody v2

on:
  pull_request:
    paths:
      - '.github/workflows/temp-schoolhouse-first-party-archive-locator-materializer-v2.yml'
      - '.schoolhouse-first-party-archive-locator-materializer-v2/EXECUTE'
      - '.schoolhouse-first-party-archive-locator-materializer-v2/chunks/*.b64'
      - '.schoolhouse-first-party-archive-locator-materializer-v2/runner.sh.gz.b64'
  workflow_dispatch:

concurrency:
  group: temp-schoolhouse-first-party-archive-locator-materializer-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate and execute exact materializer runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BUNDLE='.schoolhouse-first-party-archive-locator-materializer-v2/runner.sh.gz.b64'
          EXECUTE='.schoolhouse-first-party-archive-locator-materializer-v2/EXECUTE'
          RUNNER='/tmp/materialize-schoolhouse-first-party-archive-locator.sh'

          TREE_BLOB=$(git ls-tree HEAD -- "$BUNDLE" | awk '{print $3}')
          test -n "$TREE_BLOB"
          test "$(git hash-object "$BUNDLE")" = "$TREE_BLOB"
          git diff --exit-code -- "$BUNDLE" "$EXECUTE"
          base64 -d "$BUNDLE" | gzip -dc > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = 'c46e86a2f7c2fa34fed60077c2336b05d074d241f556d965b320150a8453d182'
          grep -Fx 'runner_sha256=c46e86a2f7c2fa34fed60077c2336b05d074d241f556d965b320150a8453d182' "$EXECUTE"
          grep -Fx 'materialize_from_live_main=true' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"
          bash -n "$RUNNER"
          bash "$RUNNER"

      - uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-first-party-archive-locator-materialization-receipt
          path: /tmp/schoolhouse-first-party-archive-locator-materialization-receipt
          if-no-files-found: error
          retention-days: 90
