name: TEMP prove canonical RD-04 North Dakota row-state reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-prove-ssc-rd04-nd-row-state-canonical-v1.yml'
      - '.tmp/rd04-nd-row-state-canonical-proof-v1/trigger.json'

permissions:
  contents: read
  actions: read

env:
  CANONICAL_PARENT: 283c5993cb2ac0bff173c72aba70088c67b2ac3c
  PRODUCT_COMMIT: f9a3592a8853cf18c64779f8b4f59998e9a62256
  PRODUCT_TREE: 0d1f8369e2c68d18b11a8f375903ff597ea8ccdb
  CANONICAL_MERGE: e62de80e187f9be037cbdd3a4b942b5840d223de
  WORKFLOW_PATH: .github/workflows/temp-prove-ssc-rd04-nd-row-state-canonical-v1.yml
  TRIGGER_PATH: .tmp/rd04-nd-row-state-canonical-proof-v1/trigger.json
  PRODUCT_WORKFLOW_NAME: Qualify RD-04 North Dakota derivative row-state reconciliation
  PRODUCT_ARTIFACT_NAME: ssc-rd04-nd-current-public-record-gap-row-state-reconciliation-v2
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation
  OUT: /tmp/rd04-nd-row-state-canonical-proof-v1
  CANONICAL_WORK: /tmp/rd04-nd-row-state-canonical-proof-v1-work

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind canonical merge and observer topology
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$CANONICAL_WORK"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE_SHA"
          test "$(git diff --name-only "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA")" = "$TRIGGER_PATH"
          test "$(git diff --name-only --diff-filter=A "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA")" = "$TRIGGER_PATH"
          test "$(git rev-parse "$EVENT_BASE_SHA^")" = "$CANONICAL_MERGE"
          test "$(git diff --name-only "$CANONICAL_MERGE" "$EVENT_BASE_SHA")" = "$WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_MERGE" "$EVENT_BASE_SHA")" = "$WORKFLOW_PATH"
          git diff --check "$CANONICAL_MERGE" "$EVENT_HEAD_SHA"

          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$CANONICAL_MERGE"
          read -r P1 P2 EXTRA <<< "$(git show -s --format='%P' "$CANONICAL_MERGE")"
          test "$P1" = "$CANONICAL_PARENT"
          test "$P2" = "$PRODUCT_COMMIT"
          test -z "${EXTRA:-}"
          test "$(git rev-parse "$PRODUCT_COMMIT^")" = "$CANONICAL_PARENT"
          test "$(git rev-parse "$PRODUCT_COMMIT^{tree}")" = "$PRODUCT_TREE"
          test "$(git rev-parse "$CANONICAL_MERGE^{tree}")" = "$PRODUCT_TREE"
          test -z "$(git diff --name-only "$PRODUCT_COMMIT" "$CANONICAL_MERGE")"

          EXPECTED="$(printf '%s\n' \
            '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.yml' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/input-custody.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/row-state-decision.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/row-state-ledger.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/promoted-partial-field-matrix.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/remaining-open-field-census.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/row-state-summary.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/index.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/product-manifest.json' \
            'docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.md' \
            'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.schema.json' \
            'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.test.js' \
            'tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs' \
            'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs' | LC_ALL=C sort)"
          test "$(git diff --name-only "$CANONICAL_PARENT" "$PRODUCT_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" "$PRODUCT_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" "$PRODUCT_COMMIT")"
          test "$(git diff --name-only "$CANONICAL_PARENT" "$CANONICAL_MERGE" | LC_ALL=C sort)" = "$EXPECTED"
          printf '%s\n' "$EXPECTED" > "$OUT/product-paths.txt"

      - name: Authenticate native canonical-push workflow and artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          out = pathlib.Path(os.environ['OUT'])
          repo = os.environ['GITHUB_REPOSITORY']
          merge = os.environ['CANONICAL_MERGE']
          product = os.environ['PRODUCT_COMMIT']
          workflow_name = os.environ['PRODUCT_WORKFLOW_NAME']
          artifact_name = os.environ['PRODUCT_ARTIFACT_NAME']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'rd04-canonical-proof',
          }

          def api(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read())

          query = urllib.parse.urlencode({'head_sha': merge, 'event': 'push', 'per_page': 100})
          runs_url = f'https://api.github.com/repos/{repo}/actions/runs?{query}'
          selected = None
          for _ in range(72):
              runs = api(runs_url)['workflow_runs']
              matches = [r for r in runs if r.get('name') == workflow_name and r.get('head_sha') == merge]
              if matches:
                  matches.sort(key=lambda r: r.get('created_at', ''), reverse=True)
                  candidate = matches[0]
                  if candidate.get('status') == 'completed':
                      if candidate.get('conclusion') != 'success':
                          raise AssertionError(f"native push workflow concluded {candidate.get('conclusion')}")
                      selected = candidate
                      break
              time.sleep(5)
          if selected is None:
              raise AssertionError('successful native canonical-push workflow not recovered')

          artifacts = api(f"https://api.github.com/repos/{repo}/actions/runs/{selected['id']}/artifacts?per_page=100")['artifacts']
          matches = [a for a in artifacts if a.get('name') == artifact_name and not a.get('expired')]
          if len(matches) != 1:
              raise AssertionError(f'exact native artifact denominator mismatch: {len(matches)}')
          artifact = matches[0]
          zip_path = out / 'native-product-artifact.zip'
          subprocess.run(
              [
                  'curl', '-fsSL',
                  '-H', f'Authorization: Bearer {token}',
                  '-H', 'Accept: application/vnd.github+json',
                  '-H', 'X-GitHub-Api-Version: 2022-11-28',
                  artifact['archive_download_url'],
                  '-o', str(zip_path),
              ],
              check=True,
          )
          zip_bytes = zip_path.read_bytes()
          zip_sha = hashlib.sha256(zip_bytes).hexdigest()
          declared = artifact.get('digest')
          if not declared or declared != f'sha256:{zip_sha}':
              raise AssertionError(f'artifact digest mismatch: {declared} vs sha256:{zip_sha}')
          extract = out / 'native-product-artifact'
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise AssertionError(f'corrupt artifact member {bad}')
              archive.extractall(extract)
          sums = extract / 'SHA256SUMS'
          if not sums.is_file():
              raise AssertionError('native artifact missing SHA256SUMS')
          verified = 0
          for line in sums.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, rel = line.split(None, 1)
              rel = rel.strip()
              if rel.startswith('./'):
                  rel = rel[2:]
              data = (extract / rel).read_bytes()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise AssertionError(f'internal checksum mismatch {rel}')
              verified += 1
          before = (extract / 'validator.json').read_bytes()
          after = (extract / 'post-release-validator.json').read_bytes()
          if before != after:
              raise AssertionError('native pre/post validator receipts differ')
          validator = json.loads(before)
          expected = {
              'state': 'qualified_exact_north_dakota_row_state_reconciliation',
              'matrix_sha256': '9f9dc05a057396056771bb566c44e9c3779d8ef6b0d2c078f7ffff11d9c7e6cb',
              'terminal_cells': 229,
              'still_open_cells': 221,
              'terminal_substantive_cells': 118,
              'still_open_substantive_cells': 182,
              'row_terminal_cells': 11,
              'row_open_cells': 39,
              'terminal_units': 11,
              'north_dakota_terminal_fields': 9,
              'north_dakota_open_fields': 0,
              'north_dakota_row_state': 'terminal_fixed_public_record_obligation_complete',
              'class_closed': False,
              'adversarial_contract': 'closed',
          }
          if validator != expected:
              raise AssertionError(f'native validator mismatch: {validator}')
          product_file = (extract / 'product-commit.txt').read_text(encoding='utf-8').strip()
          if product_file != product:
              raise AssertionError(f'native artifact product mismatch {product_file}')

          proof = {
              'schema_version': 'ssc-rd04-nd-row-state-native-push-proof@1',
              'workflow_run_id': selected['id'],
              'workflow_run_number': selected['run_number'],
              'workflow_name': selected['name'],
              'workflow_event': selected['event'],
              'workflow_status': selected['status'],
              'workflow_conclusion': selected['conclusion'],
              'workflow_head_sha': selected['head_sha'],
              'artifact_id': artifact['id'],
              'artifact_name': artifact['name'],
              'artifact_bytes': artifact['size_in_bytes'],
              'artifact_digest': artifact['digest'],
              'artifact_internal_checksum_rows': verified,
              'validator': validator,
          }
          (out / 'native-push-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'native-validator.json').write_bytes(before)
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Replay canonical product from canonical merge
        shell: bash
        run: |
          set -Eeuo pipefail
          git worktree add --detach "$CANONICAL_WORK" "$CANONICAL_MERGE"
          node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs --check > "$OUT/canonical-builder.json" 2>&1
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs --out "$OUT/canonical-validator.json" > "$OUT/canonical-validator-stdout.txt" 2>&1
          node --test test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.test.js > "$OUT/canonical-adversarial.log" 2>&1
          npm run release:check > "$OUT/canonical-release-check.log" 2>&1
          test -z "$(git status --porcelain)"
        working-directory: ${{ env.CANONICAL_WORK }}

      - name: Seal terminal canonical proof
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          out = pathlib.Path(os.environ['OUT'])
          native = json.loads((out / 'native-push-proof.json').read_text(encoding='utf-8'))
          validator = json.loads((out / 'canonical-validator.json').read_text(encoding='utf-8'))
          if validator != native['validator']:
              raise AssertionError('canonical replay differs from native push receipt')
          receipt = {
              'schema_version': 'ssc-rd04-nd-row-state-canonical-proof@1',
              'state': 'canonical_north_dakota_row_state_reconciliation_proved',
              'canonical_merge': os.environ['CANONICAL_MERGE'],
              'canonical_parent': os.environ['CANONICAL_PARENT'],
              'product_commit': os.environ['PRODUCT_COMMIT'],
              'product_tree': os.environ['PRODUCT_TREE'],
              'observer_base': os.environ['EVENT_BASE_SHA'],
              'observer_head': os.environ['EVENT_HEAD_SHA'],
              'native_push': native,
              'canonical_replay': validator,
              'permanent_paths': 14,
              'matrix_updates': 1,
              'row_state_mutations': 1,
              'row_terminalizations': 1,
              'substantive_field_terminalizations': 0,
              'class_closed': False,
              'cumulative_ledger_effect': 'none',
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'outside_human_dependency': False,
          }
          (out / 'terminal-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          rows = []
          for path in sorted(out.rglob('*')):
              if path.is_file() and path.name != 'SHA256SUMS':
                  rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(out).as_posix()}")
          (out / 'SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          subprocess.run(['sha256sum', '-c', 'SHA256SUMS'], cwd=out, check=True)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Preserve canonical proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-row-state-canonical-proof-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
