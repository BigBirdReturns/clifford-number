name: Temporary export SSC Wave 02 SG-10 review base

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-export-ssc-wave02-sg10-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/ssc-wave02-sg10-review-export' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-wave02-sg10-review-export
          fetch-depth: 0
      - name: Package exact review tree
        run: |
          set -Eeuo pipefail
          git archive --format=zip --output=/tmp/ssc-wave02-sg10-review.zip 4c8ec34686d7005b06a94dc75bb8828610be60a1
          sha256sum /tmp/ssc-wave02-sg10-review.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-wave02-sg10-review-base
          path: /tmp/ssc-wave02-sg10-review.zip
          if-no-files-found: error
          retention-days: 1
