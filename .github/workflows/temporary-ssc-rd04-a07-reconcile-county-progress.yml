            ],
            [
`    parentReleaseLedgerBytes: readBytes(root, progressPaths.parentReleaseLedger),
    parentShard00: readJson(root, progressPaths.parentShard00)
`,
`    parentReleaseLedgerBytes: readBytes(root, progressPaths.parentReleaseLedger),
    parentShard00: readJson(root, progressPaths.parentShard00),
    countyAgencyRoots: readJson(root, progressPaths.countyAgencyRoots)
`,
