name: TEMP reconcile SSC RD-04 A07 county progress

on:
  push:
    branches:
      - agent/ssc-rd04-a07-public-compliance-receipts
    paths:
      - '.github/workflows/temporary-ssc-rd04-a07-reconcile-county-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a07-public-compliance-receipts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact reconciliation patches
        run: node tools/temporary-reconcile-a07-county-progress.mjs
      - name: Validate reconciled exact state
        run: |
          node --check tools/validate-status-sovereignty-rd04-calfresh-compliance-receipts-a07-progress.mjs
          node --check test/status-sovereignty-rd04-calfresh-compliance-receipts-a07-progress.test.js
          node tools/build-status-sovereignty-rd04-calfresh-county-agency-roots-a07.mjs validate .
          node tools/validate-status-sovereignty-rd04-calfresh-compliance-receipts-a07-progress.mjs .
          node test/status-sovereignty-rd04-calfresh-compliance-receipts-a07-progress.test.js
          node test/status-sovereignty-rd04-calfresh-county-agency-roots-a07.test.js
          node tools/validate-no-magic-human-gate.mjs
      - name: Commit transport-free reconciliation and remove temporary machinery
        run: |
          set -Eeuo pipefail
          rm .github/workflows/temporary-ssc-rd04-a07-reconcile-county-progress.yml
          rm tools/temporary-reconcile-a07-county-progress.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/validate-status-sovereignty-rd04-calfresh-compliance-receipts-a07-progress.mjs \
            test/status-sovereignty-rd04-calfresh-compliance-receipts-a07-progress.test.js \
            .github/workflows/status-sovereignty-rd04-calfresh-compliance-receipts-a07.yml \
            docs/milestones/ssc-rd04-calfresh-compliance-receipts-a07.md \
            .github/workflows/temporary-ssc-rd04-a07-reconcile-county-progress.yml \
            tools/temporary-reconcile-a07-county-progress.mjs
          git commit -m 'Reconcile A07 county-root progress custody'
          git push origin HEAD:agent/ssc-rd04-a07-public-compliance-receipts
