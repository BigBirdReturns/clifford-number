name: TEMP materialize SSC RD-01 Wave-03 terminal closure v2

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-terminal-materializer-v2.yml'
      - '.ssc-rd01-wave03-terminal-materializer-v2/TRIGGER'
      - 'data/project/transport/ssc-rd01-wave03-terminal-v1/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: temp-ssc-rd01-wave03-terminal-materializer-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and execute checksum-bound terminal materializer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT='data/project/transport/ssc-rd01-wave03-terminal-v1'
          CACHE='/tmp/ssc-rd01-wave03-terminal-transport'
          DIAG='/tmp/ssc-rd01-wave03-terminal-wrapper-diagnostic'
          rm -rf "$CACHE" "$DIAG"
          mkdir -p "$CACHE/package" "$DIAG"
          exec > >(tee "$DIAG/wrapper.log") 2>&1

          echo 'wrapper-preflight: verify exact shard denominators'
          test "$(find "$ROOT/package" -maxdepth 1 -type f -name '*.b64' | wc -l)" -eq 14
          test "$(find "$ROOT/executor" -maxdepth 1 -type f -name '*.b64' | wc -l)" -eq 2

          cp "$ROOT"/package/*.b64 "$CACHE/package/"
          cat "$CACHE"/package/*.b64 | tr -d '[:space:]' > /tmp/rd01-terminal-product.b64
          PRODUCT_SHA="$(sha256sum /tmp/rd01-terminal-product.b64 | awk '{print $1}')"
          echo "product_base64_sha256=$PRODUCT_SHA"
          test "$PRODUCT_SHA" = '1ce3440e9cc6e86896608fd6ec1f13912131d3fd4609f6df2ac1bfac14b3993b'
          base64 -d /tmp/rd01-terminal-product.b64 > /tmp/rd01-terminal-product.tar.xz
          test "$(sha256sum /tmp/rd01-terminal-product.tar.xz | awk '{print $1}')" = 'c2e6b7c2aecbc1924497b2fb1b1eb2a5b68d11e2fd28ce060e33c772b38a0432'

          cat "$ROOT"/executor/*.b64 | tr -d '[:space:]' > /tmp/rd01-executor.b64
          EXECUTOR_B64_SHA="$(sha256sum /tmp/rd01-executor.b64 | awk '{print $1}')"
          echo "executor_base64_sha256=$EXECUTOR_B64_SHA"
          test "$EXECUTOR_B64_SHA" = '4aed770ab8575e120f31ec285fdd97b89c8e8b793792841b8751f299f180e9ab'
          base64 -d /tmp/rd01-executor.b64 > /tmp/rd01-executor.sh.xz
          test "$(sha256sum /tmp/rd01-executor.sh.xz | awk '{print $1}')" = 'a31b4e0fe306be1f058b7b66ed860417f7333d78122b663a7de697ef1fc8e58f'
          xz -dc /tmp/rd01-executor.sh.xz > /tmp/publish-rd01-wave03-terminal.sh
          test "$(sha256sum /tmp/publish-rd01-wave03-terminal.sh | awk '{print $1}')" = 'a1c1d1a636c093bb57eb9f1d88b6066f1bf48b1bebb92ac4b9aff3f87a439079'

          python3 -c "from pathlib import Path; p=Path('/tmp/publish-rd01-wave03-terminal.sh'); q=Path('/tmp/publish-rd01-wave03-terminal-patched.sh'); s=p.read_text(); old='TRANSPORT_ROOT=\"data/project/transport/ssc-rd01-wave03-terminal-v1\"'; new='TRANSPORT_ROOT=\"/tmp/ssc-rd01-wave03-terminal-transport\"'; assert s.count(old)==1, s.count(old); t=s.replace(old,new); assert t.count(old)==0 and t.count(new)==1; q.write_text(t)"
          PATCHED_SHA="$(sha256sum /tmp/publish-rd01-wave03-terminal-patched.sh | awk '{print $1}')"
          echo "patched_executor_sha256=$PATCHED_SHA"
          test "$PATCHED_SHA" = '4d6bb2488eb14c2b9d19b0628785bf9f6330e631d79c30be3672b3af89b1fa67'
          chmod 0700 /tmp/publish-rd01-wave03-terminal-patched.sh

          echo 'wrapper-preflight: PASS; launch sealed transaction'
          gh --version
          /tmp/publish-rd01-wave03-terminal-patched.sh
      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-terminal-materializer-v2
          path: |
            /tmp/ssc-rd01-wave03-terminal-receipt
            /tmp/ssc-rd01-wave03-terminal-wrapper-diagnostic
          if-no-files-found: warn
          retention-days: 90
