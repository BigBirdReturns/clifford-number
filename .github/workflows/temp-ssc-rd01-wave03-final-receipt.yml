name: TEMP publish final SSC RD-01 Wave-03 cumulative receipt

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-final-receipt.yml'
      - '.ssc-rd01-wave03-final-receipt/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify final marker and publish exact receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO="$GITHUB_REPOSITORY"
          TARGET='agent/ssc-rd01-wave03-cumulative-promotion-v1'
          FINAL_REF='archive/ssc-rd01-wave03-cumulative-final'
          FINAL_TAG='ssc-rd01-wave03-cumulative-postmerge-proved'
          LEDGER='data/research/status-sovereignty-residual-denominator-wave-03-current.json'
          RELEASE='data/project/ssc-residual-wave03/current-release-manifest.json'
          PR_NUMBER=$(gh pr list --repo "$REPO" --state merged --head "$TARGET" --json number --jq 'sort_by(.number) | last | .number // empty')
          test -n "$PR_NUMBER"
          PR=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          test "$(jq -r .merged <<<"$PR")" = 'true'
          PERMANENT_HEAD=$(jq -r .head.sha <<<"$PR")
          MERGE_SHA=$(jq -r .merge_commit_sha <<<"$PR")
          TAG_SHA=$(gh api "repos/$REPO/git/ref/tags/$FINAL_TAG" --jq .object.sha)
          test "$TAG_SHA" = "$MERGE_SHA"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          RD01_PR=$(gh api "repos/$REPO/pulls/1022")
          RD01_HEAD=$(jq -r .head.sha <<<"$RD01_PR")
          RD01_MERGE=$(jq -r .merge_commit_sha <<<"$RD01_PR")
          test "$(jq -r .merged <<<"$RD01_PR")" = 'true'
          git fetch --no-tags origin "$MAIN_SHA" "$MERGE_SHA" "$PERMANENT_HEAD" "$RD01_MERGE" "$FINAL_REF"
          git merge-base --is-ancestor "$MERGE_SHA" "$MAIN_SHA"
          git merge-base --is-ancestor "$RD01_MERGE" "$MERGE_SHA"
          test "$(jq -r .current_state.canonical_residual_classes "$LEDGER")" -eq 42
          test "$(jq -r .current_state.closed_residual_classes "$LEDGER")" -eq 7
          test "$(jq -r .current_state.open_residual_classes "$LEDGER")" -eq 35
          test "$(jq -r .wave03_state.terminal_receipts "$LEDGER")" -eq 1
          test "$(jq -r .wave03_state.open_selected_attempts "$LEDGER")" -eq 5
          test "$(jq -r '.wave03_state.terminal_class_ids | join(",")' "$LEDGER")" = 'RD-01-C06'
          test "$(jq -r .current_state.residual_denominator_complete "$LEDGER")" = 'false'
          RELEASE_SHA=$(jq -r .release_sha256 "$RELEASE")
          test "${#RELEASE_SHA}" -eq 64
          OPEN_SELECTED=$(jq -c .wave03_state.open_selected_class_ids "$LEDGER")
          OUT='/tmp/ssc-rd01-wave03-cumulative-final-receipt'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          jq -n \
            --argjson permanent_pr "$PR_NUMBER" \
            --arg permanent_head "$PERMANENT_HEAD" \
            --arg merge_sha "$MERGE_SHA" \
            --arg current_main "$MAIN_SHA" \
            --arg rd01_pr_head "$RD01_HEAD" \
            --arg rd01_merge "$RD01_MERGE" \
            --arg marker_tag "$FINAL_TAG" \
            --arg release_sha256 "$RELEASE_SHA" \
            --argjson open_selected "$OPEN_SELECTED" \
            '{status:"canonical_wave03_7_35_complete",permanent_pr:$permanent_pr,permanent_head:$permanent_head,merge_sha:$merge_sha,current_main:$current_main,rd01_terminal_pr:1022,rd01_terminal_head:$rd01_pr_head,rd01_terminal_merge:$rd01_merge,marker_tag:$marker_tag,release_sha256:$release_sha256,permanent_paths:9,canonical_residual_classes:42,closed_residual_classes:7,open_residual_classes:35,wave03_selected_attempts:6,wave03_terminal_receipts:1,wave03_open_selected_attempts:5,wave03_open_selected_class_ids:$open_selected,promoted_class:"RD-01-C06",terminal_state:"bounded_source_unavailable",residual_denominator_complete:false,outside_human_dependency:false,external_contacts:0,external_reviews:0,reviewed_disposition_changes:0,complete_compact_findings:0,racial_order_findings:0,prevalence_findings:0,coordination_findings:0,common_purpose_findings:0,publication_effect:"none",adoption_effect:"none",graph_effect:"none"}' > "$OUT/status.json"
          cat > "$OUT/status.md" <<EOF
# Canonical SSC Wave-03 cumulative state after RD-01-C06

\`RD-01-C06\` is canonically closed at \`bounded_source_unavailable\` and promoted into the Wave-03 cumulative successor ledger.

\`\`\`text
permanent promotion PR:        #$PR_NUMBER
permanent promotion head:      $PERMANENT_HEAD
canonical promotion merge:     $MERGE_SHA
current main:                  $MAIN_SHA
RD-01 terminal PR:             #1022
RD-01 terminal merge:          $RD01_MERGE
release SHA-256:               $RELEASE_SHA
permanent promotion paths:     9
canonical residual classes:   42
closed residual classes:       7
open residual classes:        35
Wave-03 selected attempts:      6
Wave-03 terminal receipts:      1
Wave-03 selected still open:    5
residual denominator complete:false
outside-human dependency:     false
external contacts / reviews:   0 / 0
publication/adoption/graph:  none / none / none
\`\`\`

The five remaining selected Wave-03 classes are preserved in \`status.json\`. The promotion creates no selector-accuracy, technical-superiority, coordination, common-purpose, prevalence, racial-order, publication, adoption, or graph finding.
EOF
          sha256sum "$OUT/status.json" "$OUT/status.md" > "$OUT/SHA256SUMS"
          START=$(git ls-remote origin "refs/heads/$FINAL_REF" | awk '{print $1}')
          test -n "$START"
          rm -rf /tmp/rd01-final-receipt-branch
          git worktree add --detach /tmp/rd01-final-receipt-branch "origin/$FINAL_REF"
          cd /tmp/rd01-final-receipt-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf reports/transport/ssc-rd01-wave03-cumulative-final
          mkdir -p reports/transport/ssc-rd01-wave03-cumulative-final
          cp -a "$OUT"/. reports/transport/ssc-rd01-wave03-cumulative-final/
          git add reports/transport/ssc-rd01-wave03-cumulative-final
          git commit -m 'Publish canonical RD-01 Wave-03 cumulative receipt'
          git push origin "HEAD:refs/heads/$FINAL_REF" --force-with-lease="refs/heads/$FINAL_REF:$START"
          gh issue comment 1013 --repo "$REPO" --body "RD-01-C06 is canonically closed and cumulatively promoted through PR #$PR_NUMBER at \`$MERGE_SHA\`. Current Wave-03 state is 7 closed / 35 open, with five selected attempts still open. Residual-denominator completion remains false; no outside-human dependency or authority escalation was introduced."
      - name: Retire remaining temporary RD-01 Wave-03 lanes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName --jq '.[] | select(.headRefName|startswith("agent/ssc-rd01-wave03-")) | [.number,.headRefName] | @tsv' |
          while IFS=$'\t' read -r number head; do
            [[ -z "$number" ]] && continue
            [[ "$number" = "${{ github.event.pull_request.number }}" ]] && continue
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment 'Retired unmerged after canonical RD-01-C06 closure and Wave-03 7/35 cumulative promotion.' || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-cumulative-final-receipt
          path: /tmp/ssc-rd01-wave03-cumulative-final-receipt
          if-no-files-found: error
          retention-days: 90
