name: PC-61 v5 exact-head concurrency repair

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc61-v5-concurrency-repair.yml'

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pc61-v5-concurrency-repair
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPOSITORY: ${{ github.repository }}
  TARGET_BRANCH: 'agent/pc61-terminal-reconcile-v5'
  TARGET_PATH: '.github/workflows/pc61-terminal-reconciler-v5.yml'
  SOURCE_BLOB: '94d8f888af553b730fd8f741b7d54e89a20f98fc'
  OUT: '/tmp/pc61-v5-concurrency-repair'

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pc61-terminal-reconcile-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Stage exact superseding-run controller blob
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          gh api --method GET "/repos/$GH_REPOSITORY/contents/$TARGET_PATH" -f ref="$TARGET_BRANCH" > "$OUT/content-before.json"
          before_blob=$(jq -r .sha "$OUT/content-before.json")
          test "$before_blob" = "$SOURCE_BLOB"
          jq -r .content "$OUT/content-before.json" | tr -d '\n' | base64 -d > "$OUT/before.yml"
          test "$(git hash-object "$OUT/before.yml")" = "$SOURCE_BLOB"
          python - "$OUT/before.yml" "$OUT/after.yml" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text()
          old='  cancel-in-progress: false\n'
          new='  cancel-in-progress: true\n'
          if source.count(old)!=1 or source.count(new)!=0:
              raise SystemExit('concurrency preimage denominator mismatch')
          target=source.replace(old,new)
          if target.count(old)!=0 or target.count(new)!=1:
              raise SystemExit('concurrency postimage mismatch')
          Path(sys.argv[2]).write_text(target)
          PY
          python - "$OUT/after.yml" <<'PY'
          from pathlib import Path
          import sys,yaml
          document=yaml.safe_load(Path(sys.argv[1]).read_text())
          if document['concurrency']['cancel-in-progress'] is not True:
              raise SystemExit('cancel-in-progress did not become true')
          if document['jobs']['reconcile']['timeout-minutes'] != 360:
              raise SystemExit('timeout changed unexpectedly')
          PY
          diff -u "$OUT/before.yml" "$OUT/after.yml" > "$OUT/exact.patch" || test "$?" = 1
          target_blob=$(git hash-object "$OUT/after.yml")
          target_sha256=$(sha256sum "$OUT/after.yml" | awk '{print $1}')
          encoded=$(base64 -w0 "$OUT/after.yml")
          gh api --method POST "/repos/$GH_REPOSITORY/git/blobs" -f content="$encoded" -f encoding=base64 > "$OUT/blob-response.json"
          test "$(jq -r .sha "$OUT/blob-response.json")" = "$target_blob"
          gh api "/repos/$GH_REPOSITORY/git/blobs/$target_blob" > "$OUT/remote-blob.json"
          jq -r .content "$OUT/remote-blob.json" | tr -d '\n' | base64 -d > "$OUT/remote-after.yml"
          cmp "$OUT/after.yml" "$OUT/remote-after.yml"
          jq -n --arg schema_version 'pc61-v5-concurrency-repair@1' --arg status complete --arg source_blob "$SOURCE_BLOB" --arg target_blob "$target_blob" --arg target_sha256 "$target_sha256" '{schema_version:$schema_version,status:$status,source_blob:$source_blob,target_blob:$target_blob,target_sha256:$target_sha256,change_denominator:{cancel_in_progress_false_removed:1,cancel_in_progress_true_added:1},admission_gates_changed:false,review_gates_changed:false,merge_gates_changed:false,proof_gates_changed:false,cleanup_gates_changed:false,product_semantics_changed:false,graph_effect:"none"}' > "$OUT/receipt.json"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve concurrency-repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc61-v5-concurrency-repair
          path: /tmp/pc61-v5-concurrency-repair
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
