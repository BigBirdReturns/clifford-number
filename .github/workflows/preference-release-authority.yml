name: Preference custody release-authority control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/release-authority.fixture.json'
      - 'tools/lib/preference-release-authority.mjs'
      - 'tools/compile-preference-release-authority.mjs'
      - 'tools/validate-preference-release-authority.mjs'
      - 'test/preference-release-authority.test.js'
      - 'docs/preference-custody-release-authority.md'
      - '.github/workflows/preference-release-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile release, notice, exit, and binding-authority worlds
        run: node tools/compile-preference-release-authority.mjs
      - name: Validate notice, comprehension, accessibility, exit, release, assent, and authority boundaries
        run: node tools/validate-preference-release-authority.mjs
      - name: Exercise unread, overload, access, friction, drift, nonparticipant, assent, authority, and tamper fixtures
        run: node test/preference-release-authority.test.js
      - name: Preserve deterministic release-authority projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-release-authority-pc20
          path: |
            build/research/preference-release-authority.json
            build/research/preference-release-authority.md
          if-no-files-found: error
