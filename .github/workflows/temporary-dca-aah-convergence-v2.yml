name: Temporary DCA AAH convergence v2

on:
  push:
    branches:
      - agent/dca-aah-convergence-20260729-v2
    paths:
      - '.github/scripts/run-dca-aah-convergence-v2.sh'
      - '.github/workflows/temporary-dca-aah-convergence-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dca-aah-convergence-v2-20260729
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/dca-aah-convergence-20260729-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dca-aah-convergence-20260729-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Execute race-free convergence
        id: converge
        shell: bash
        run: bash .github/scripts/run-dca-aah-convergence-v2.sh 2>&1 | tee /tmp/dca-aah-convergence-v2.log
      - name: Publish typed success receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          poof_stage="$(node -p "require('./data/project/dca-aah-convergence-receipt.json').validated_stage_heads.poof_sprint09_stable_ground")"
          k0_stage="$(node -p "require('./data/project/dca-aah-convergence-receipt.json').validated_stage_heads.k0_q02_ninth_template")"
          digest="$(node -p "require('./data/project/dca-aah-program-release-manifest.json').combined_sha256")"
          candidates="$(node -p "require('./data/project/aah-hunt-registry.json').denominator.current")"
          target="$(node -p "require('./data/project/aah-hunt-registry.json').denominator.target")"
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          body=$(cat <<EOF
Race-free convergence completed and the final committed head revalidated.

- final head: \`${head}\`
- POOF/Sprint 09/stable-ground stage: \`${poof_stage}\`
- K0-Q02 ninth-template stage: \`${k0_stage}\`
- DCA/AAH exact-byte release digest: \`${digest}\`
- AAH candidate denominator: **${candidates}/${target}**; empty slots were not counted as evidence
- temporary workflows, observers, and source carriers: removed
- graph effect: **none**
- publication effect: **none**
- adoption effect: **none**

Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
EOF
          )
          [[ -z "$pr" ]] || gh pr comment "$pr" --body "$body"
          gh issue comment 418 --body "$body"
      - name: Publish failure receipt
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          body="Race-free convergence stopped before publication. No POOF/K0/DCA-AAH completion is claimed. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [[ -z "$pr" ]] || gh pr comment "$pr" --body "$body"
          gh issue comment 418 --body "$body"
      - name: Preserve convergence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dca-aah-convergence-v2-log-${{ github.run_id }}
          path: /tmp/dca-aah-convergence-v2.log
          if-no-files-found: warn
          retention-days: 14
