name: Materialize Counter-Selector Wave 04 blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-04.yml'
      - '.github/materializers/counter-selector-wave-04/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-04-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-04-blind-review

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 04 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-04/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-04.tar.gz
          echo '14ffad767317a454ccb0d0d13a14c973cc3e3cea83ef09cf59c30673199ec557  /tmp/counter-selector-wave-04.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-04.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-04

      - name: Build, validate, and attack blind review
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-04.mjs
          node tools/validate-counter-selector-wave-04.mjs
          node test/counter-selector-wave-04.test.js

      - name: Commit exact non-workflow Wave 04 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-04/payload-00 \
            .github/materializers/counter-selector-wave-04/payload-01 \
            .github/materializers/counter-selector-wave-04/payload-02 \
            .github/materializers/counter-selector-wave-04/payload-03 \
            .github/materializers/counter-selector-wave-04/payload-04 \
            .github/materializers/counter-selector-wave-04/payload-05 \
            data/project/counter-selector-wave-04-blind-review.json \
            data/project/counter-selector-blind-review-registry.json \
            data/project/counter-selector-review-disagreement-ledger.json \
            data/project/counter-selector-wave-04-release-manifest.json \
            schemas/counter-selector-blind-review.schema.json \
            docs/methods/counter-selector-blind-review.md \
            docs/milestones/counter-selector-wave-04.md \
            tools/build-counter-selector-wave-04.mjs \
            tools/validate-counter-selector-wave-04.mjs \
            test/counter-selector-wave-04.test.js \
            reports/core-thesis/counter-selector-wave-04/data.json \
            reports/core-thesis/counter-selector-wave-04/index.html | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Execute Counter-Selector Wave 04 blind review'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 04 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-04.mjs
          node tools/validate-counter-selector-wave-04.mjs
          node test/counter-selector-wave-04.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish non-workflow Wave 04 head
        run: git push origin HEAD:agent/counter-selector-wave-04-blind-review
