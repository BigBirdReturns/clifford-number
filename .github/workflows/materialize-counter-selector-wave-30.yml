name: Materialize Counter-Selector Wave 30

on:
  push:
    branches:
      - 'agent/counter-selector-wave-30-handoff-controls'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-30.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-30-handoff-controls
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact carrier and unpack Wave 30 estate
        run: |
          set -euo pipefail
          cat > /tmp/wave30-expected-blobs <<'EOF'
          048af663e948c61b367cf980b267b7ebf979eec9  .github/materializers/counter-selector-wave-30/payload-00
          055ba706526ae2b7bbafc7a892b65874c6b34358  .github/materializers/counter-selector-wave-30/payload-01
          9d64a74f9cb224d9c3c75f30f046c2e9d91b59f2  .github/materializers/counter-selector-wave-30/payload-02
          baa09674ccf12f691ee8ec08fde2503a1a4fafaf  .github/materializers/counter-selector-wave-30/payload-03
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave30-expected-blobs
          cat .github/materializers/counter-selector-wave-30/payload-* | base64 --decode > /tmp/counter-selector-wave-30.tar.gz
          echo '1e560b5fc6bf241ba79e2c7812f6ca0e30931af5f8a643bdb68d5f584a1a158b  /tmp/counter-selector-wave-30.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-30.tar.gz -C .
          cp .github/workflows/counter-selector-wave-30.yml /tmp/counter-selector-wave-30.yml
      - name: Build, validate, and attack Wave 30
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-30.mjs
          node tools/validate-counter-selector-wave-30.mjs
          node test/counter-selector-wave-30.test.js
      - name: Commit exact permanent non-workflow Wave 30 estate
        run: |
          set -euo pipefail
          rm -f .github/workflows/counter-selector-wave-30.yml
          rm -rf .github/materializers/counter-selector-wave-30
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-30/payload-00 \
            .github/materializers/counter-selector-wave-30/payload-01 \
            .github/materializers/counter-selector-wave-30/payload-02 \
            .github/materializers/counter-selector-wave-30/payload-03 \
            data/project/counter-selector-wave-30-handoff-controls.json \
            data/project/counter-selector-wave-30-handoff-registry.json \
            data/project/counter-selector-wave-30-release-manifest.json \
            schemas/counter-selector-handoff-controls.schema.json \
            docs/methods/counter-selector-public-handoff-controls.md \
            docs/milestones/counter-selector-wave-30.md \
            tools/build-counter-selector-wave-30.mjs \
            tools/validate-counter-selector-wave-30.mjs \
            test/counter-selector-wave-30.test.js \
            reports/core-thesis/counter-selector-wave-30/data.json \
            reports/core-thesis/counter-selector-wave-30/index.html | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected staged paths' >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Install Counter-Selector Wave 30 handoff controls'
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Wave 30 reconstruction
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          cp /tmp/counter-selector-wave-30.yml .github/workflows/counter-selector-wave-30.yml
          node tools/build-counter-selector-wave-30.mjs
          node tools/validate-counter-selector-wave-30.mjs
          node test/counter-selector-wave-30.test.js
          git diff --exit-code -- \
            data/project/counter-selector-wave-30-handoff-registry.json \
            data/project/counter-selector-wave-30-release-manifest.json \
            reports/core-thesis/counter-selector-wave-30/data.json \
            reports/core-thesis/counter-selector-wave-30/index.html
          rm -f .github/workflows/counter-selector-wave-30.yml
          test -z "$(git status --porcelain)"
      - name: Publish permanent non-workflow Wave 30 head
        run: git push origin HEAD:agent/counter-selector-wave-30-handoff-controls
