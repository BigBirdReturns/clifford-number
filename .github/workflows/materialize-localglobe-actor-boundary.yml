name: Materialize LocalGlobe actor-boundary refusal

on:
  push:
    branches:
      - candidate/localglobe-actor-boundary-refusal-v1

permissions:
  contents: write

concurrency:
  group: materialize-localglobe-actor-boundary-refusal-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: candidate/localglobe-actor-boundary-refusal-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply the bounded source transaction
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ORIGINAL = 'electric-twin-seed-round-2026-02-11'
          INSTITUTIONAL = 'electric-twin-seed-round-institutional-investors-2026-02-11'
          INSTITUTIONS = ['atomico', 'localglobe', 'mercuri', 'samos']
          ANGELS = ['cal-henderson', 'eric-salama', 'louis-mosley', 'marc-andreessen', 'tom-shinner']

          def read_jsonl(path):
              return [json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')]

          def write_jsonl(path, rows):
              Path(path).write_text(''.join(json.dumps(row, separators=(',', ':')) + '\n' for row in rows), encoding='utf-8')

          surfaces_path = Path('data/ledger/surfaces.jsonl')
          surfaces = read_jsonl(surfaces_path)
          matches = [s for s in surfaces if s.get('surface_id') == ORIGINAL]
          if len(matches) != 1:
              raise SystemExit(f'expected one {ORIGINAL} surface, found {len(matches)}')
          original = matches[0]
          original.update({
              'surface_label': 'Electric Twin $10m seed round named-angel record, 11 February 2026',
              'surface_type': 'employment_investment_surface',
              'secondary_surface_types': ['surface_factory_capital_layer'],
              'hop_eligible': True,
              'scorable': True,
              'status': 'source_native_named_angel_round_participants',
              'bounded_by': [
                  '11 February 2026 Electric Twin company announcement',
                  '12 February 2026 Tech.eu report for the complete named natural-person participant list',
                  'institutional investors segregated to a companion organization-only refusal surface',
              ],
              'time_start': '2026-02-11',
              'time_end': '2026-02-11',
              'receipt_ids': ['electric-twin-seed-round-announcement-2026-02-11', 'tech-eu-electric-twin-seed-round-2026-02-12'],
              'notes': 'One-day named-actor financing-announcement surface. It places only the five natural persons publicly named as angel investors. Institutional investors are preserved on a companion non-hop surface rather than converted into their founders, partners, directors, or other principals. Co-investment does not establish acquaintance, coordination, ideological alignment, shared control, board rights, participation in company decisions, motive, wrongdoing, or common purpose.',
          })
          original.pop('hop_refusal_reason', None)

          institutional = {
              'surface_id': INSTITUTIONAL,
              'surface_label': 'Electric Twin $10m seed round institutional-investor record, 11 February 2026',
              'surface_type': 'employment_investment_surface',
              'secondary_surface_types': ['surface_factory_capital_layer'],
              'hop_eligible': False,
              'hop_refusal_reason': 'organization_only_evidence',
              'scorable': True,
              'status': 'source_native_organization_only_investor_record',
              'bounded_by': [
                  '11 February 2026 Electric Twin company announcement',
                  '12 February 2026 Tech.eu report for the complete named institutional participant list',
                  'institution names preserved without person substitution',
              ],
              'time_start': '2026-02-11',
              'time_end': '2026-02-11',
              'evidence_class': 'reported',
              'receipt_ids': ['electric-twin-seed-round-announcement-2026-02-11', 'tech-eu-electric-twin-seed-round-2026-02-12'],
              'notes': 'The receipts identify Atomico, LocalGlobe, Mercuri, and Samos as organizations, not natural-person participants. In particular, the source record does not name Saul Klein or any other LocalGlobe principal as a participant. The compiler therefore refuses actor substitution and creates no actor hop from this surface. This bounded refusal does not prove that no undisclosed person participated or that no other relationship existed.',
          }
          ids = [s.get('surface_id') for s in surfaces]
          insert_at = min(i for i, sid in enumerate(ids) if sid in {ORIGINAL, INSTITUTIONAL})
          surfaces = [s for s in surfaces if s.get('surface_id') not in {ORIGINAL, INSTITUTIONAL}]
          surfaces[insert_at:insert_at] = [original, institutional]
          write_jsonl(surfaces_path, surfaces)

          participation_path = Path('data/ledger/participation.jsonl')
          participation = read_jsonl(participation_path)
          target_rows = [p for p in participation if p.get('surface_id') in {ORIGINAL, INSTITUTIONAL}]
          if not target_rows:
              raise SystemExit('seed-round participation denominator is missing')
          target_indices = [i for i, p in enumerate(participation) if p.get('surface_id') in {ORIGINAL, INSTITUTIONAL}]
          insert_at = min(target_indices)

          actor_rows = {}
          org_rows = {}
          electric_twin_row = None
          for row in target_rows:
              if row.get('participant_type') == 'actor':
                  actor_rows[row.get('actor_id')] = row
              elif row.get('participant_type') == 'organization':
                  oid = row.get('organization_id')
                  if oid == 'electric-twin':
                      electric_twin_row = row
                  elif oid in INSTITUTIONS:
                      org_rows[oid] = row

          if sorted(actor_rows) != ANGELS:
              raise SystemExit(f'unexpected named-angel denominator: {sorted(actor_rows)}')
          if sorted(org_rows) != sorted(INSTITUTIONS):
              raise SystemExit(f'unexpected institutional denominator: {sorted(org_rows)}')
          if electric_twin_row is None:
              raise SystemExit('missing Electric Twin issuer row')
          if 'saul-klein' in actor_rows:
              raise SystemExit('Saul Klein must not be admitted to the seed-round actor surface')

          original_rows = []
          host_original = dict(electric_twin_row)
          host_original.update({
              'surface_id': ORIGINAL,
              'role': 'company whose announcement names the angel participants',
              'participation_type': 'company',
              'time_start': '2026-02-11',
              'time_end': '2026-02-11',
              'evidence_class': 'primary_public',
              'receipt_ids': ['electric-twin-seed-round-announcement-2026-02-11'],
          })
          original_rows.append(host_original)
          for actor_id in ANGELS:
              row = dict(actor_rows[actor_id])
              row['surface_id'] = ORIGINAL
              original_rows.append(row)

          institutional_rows = []
          host_institutional = dict(electric_twin_row)
          host_institutional.update({
              'surface_id': INSTITUTIONAL,
              'role': 'company whose round record names the institutional investors',
              'participation_type': 'company',
              'time_start': '2026-02-11',
              'time_end': '2026-02-11',
              'evidence_class': 'primary_public',
              'receipt_ids': ['electric-twin-seed-round-announcement-2026-02-11'],
              'notes': 'Issuer and host context only; this non-hop surface creates no actor adjacency.',
          })
          institutional_rows.append(host_institutional)
          for organization_id in INSTITUTIONS:
              row = dict(org_rows[organization_id])
              row['surface_id'] = INSTITUTIONAL
              row['notes'] = ('Organization named in the public round record. The receipt does not identify a natural-person representative; '
                              'no founder, partner, director, employee, or other principal is substituted into the topology.')
              institutional_rows.append(row)

          participation = [p for p in participation if p.get('surface_id') not in {ORIGINAL, INSTITUTIONAL}]
          participation[insert_at:insert_at] = original_rows + institutional_rows
          write_jsonl(participation_path, participation)

          claims_path = Path('data/ledger/claims.jsonl')
          claims = [c for c in read_jsonl(claims_path) if c.get('claim_id') != 'electric-twin-localglobe-saul-klein-actor-boundary-2026-02-12']
          claims.append({
              'claim_id': 'electric-twin-localglobe-saul-klein-actor-boundary-2026-02-12',
              'text': 'The public Electric Twin seed-round receipts identify LocalGlobe as an institutional investor and do not name Saul Klein or another LocalGlobe principal as a participant. The compiler therefore preserves LocalGlobe as an organization and refuses to substitute Saul Klein onto the round.',
              'receipt_ids': ['electric-twin-seed-round-announcement-2026-02-11', 'tech-eu-electric-twin-seed-round-2026-02-12'],
              'evidence_class': 'judgment',
              'actor_ids': ['saul-klein'],
              'organization_ids': ['electric-twin', 'localglobe'],
              'surface_ids': [INSTITUTIONAL],
              'date': '2026-02-12',
              'limits': 'This is a bounded statement about the names in these receipts. It is not proof that no undisclosed person participated, that Saul Klein had no other relationship to the organizations, or that the institutional investors coordinated.',
          })
          write_jsonl(claims_path, claims)

          map_path = Path('data/research/clifford-cross-corpus-public-interest-map.json')
          public_map = json.loads(map_path.read_text(encoding='utf-8'))
          public_map['inventory']['canonical']['surfaces'] = len(surfaces)
          public_map['inventory']['canonical']['participations'] = len(participation)
          interpretation = public_map['inventory']['interpretation']
          boundary_sentence = (' The canonical surface denominator now keeps the Electric Twin institutional seed-round record non-hop, '
                               'preserving LocalGlobe as an organization without substituting Saul Klein or another principal.')
          if boundary_sentence.strip() not in interpretation:
              public_map['inventory']['interpretation'] = interpretation.rstrip() + boundary_sentence
          map_path.write_text(json.dumps(public_map, indent=2) + '\n', encoding='utf-8')

          test_path = Path('test/localglobe-actor-boundary.test.js')
          test_path.write_text(r'''import assert from 'node:assert/strict';
          import { loadAll } from '../tools/lib/ledger.mjs';
          import { deriveHopEdges } from '../tools/lib/hops.mjs';

          const ORIGINAL = 'electric-twin-seed-round-2026-02-11';
          const INSTITUTIONAL = 'electric-twin-seed-round-institutional-investors-2026-02-11';
          const ANGELS = ['cal-henderson', 'eric-salama', 'louis-mosley', 'marc-andreessen', 'tom-shinner'];
          const INSTITUTIONS = ['atomico', 'electric-twin', 'localglobe', 'mercuri', 'samos'];

          const data = loadAll();
          const original = data.surfaces.find(surface => surface.surface_id === ORIGINAL);
          const institutional = data.surfaces.find(surface => surface.surface_id === INSTITUTIONAL);
          assert.ok(original, 'named-angel seed-round surface must remain present');
          assert.ok(institutional, 'institutional seed-round refusal surface must be present');
          assert.equal(original.hop_eligible, true);
          assert.equal(institutional.hop_eligible, false);
          assert.equal(institutional.hop_refusal_reason, 'organization_only_evidence');
          assert.deepEqual(
            data.participation.filter(row => row.surface_id === ORIGINAL && row.participant_type === 'actor').map(row => row.actor_id).sort(),
            ANGELS,
            'the hop-eligible surface must contain only the five named natural-person investors',
          );
          assert.deepEqual(
            data.participation.filter(row => row.surface_id === INSTITUTIONAL && row.participant_type === 'organization').map(row => row.organization_id).sort(),
            INSTITUTIONS,
            'the refusal surface must preserve the issuer and four named institutional investors',
          );
          assert.equal(
            data.participation.filter(row => row.surface_id === INSTITUTIONAL && row.participant_type === 'actor').length,
            0,
            'organization-only evidence must not be rewritten as actor participation',
          );
          assert.equal(
            data.participation.some(row => [ORIGINAL, INSTITUTIONAL].includes(row.surface_id) && row.actor_id === 'saul-klein'),
            false,
            'Saul Klein must not be substituted for LocalGlobe',
          );

          const facultySaulSurfaces = data.participation
            .filter(row => row.actor_id === 'saul-klein' && row.surface_id.startsWith('faculty-science-'))
            .map(row => row.surface_id)
            .sort();
          assert.deepEqual(facultySaulSurfaces, [
            'faculty-science-director-shareholder-overlap-2024-10-10',
            'faculty-science-officer-employee-overlap-2018-01-24',
          ], 'the two independently receipted Faculty surfaces must remain intact');

          const participationBySurface = new Map();
          for (const row of data.participation) {
            if (!participationBySurface.has(row.surface_id)) participationBySurface.set(row.surface_id, []);
            participationBySurface.get(row.surface_id).push(row);
          }
          const receiptById = new Map(data.receipts.map(receipt => [receipt.receipt_id, receipt]));
          const broadOrgIds = new Set(data.organizations.filter(org => org.broad_institution).map(org => org.id));
          const result = deriveHopEdges({
            surfaces: data.surfaces,
            participationBySurface,
            broadOrgIds,
            densityPolicy: data.densityPolicy,
            receiptById,
          });
          assert.ok(
            result.rejectedHopSurfaces.some(row => row.surface_id === INSTITUTIONAL && row.reason === 'organization_only_evidence'),
            'the institutional surface must appear in the compiler refusal ledger',
          );
          assert.equal(
            result.edges.flatMap(edge => edge.surfaces).some(basis => basis.surface_id === INSTITUTIONAL),
            false,
            'the institutional surface must never become a hop basis',
          );
          assert.equal(
            result.edges.flatMap(edge => edge.surfaces).filter(basis => basis.surface_id === ORIGINAL).length,
            10,
            'five named angel investors must retain exactly ten pairwise hop bases',
          );

          const refusal = data.claims.find(claim => claim.claim_id === 'electric-twin-localglobe-saul-klein-actor-boundary-2026-02-12');
          assert.ok(refusal, 'the person-substitution refusal must be public and graph-inert');
          assert.deepEqual(refusal.surface_ids, [INSTITUTIONAL]);
          console.log('localglobe-actor-boundary.test: OK');
          ''').replace(/^          /gm, ''), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          test_command = 'node test/localglobe-actor-boundary.test.js'
          if test_command not in package['scripts']['test']:
              marker = 'node test/compiler.test.js'
              if marker not in package['scripts']['test']:
                  raise SystemExit('package test insertion marker is missing')
              package['scripts']['test'] = package['scripts']['test'].replace(marker, marker + ' && ' + test_command, 1)
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Compile the complete public projection
        run: npm run compile
      - name: Reconcile public-map compiled counts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/research/clifford-cross-corpus-public-interest-map.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          hop = json.loads(Path('build/hop-graph.json').read_text(encoding='utf-8'))
          data['inventory']['canonical']['compiled_hop_edges'] = len(hop['edges'])
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate the bounded product
        shell: bash
        run: |
          node test/localglobe-actor-boundary.test.js
          npm run validate:release
          npm run validate:cross-corpus-map
          git diff --check
      - name: Enforce product-only paths and publish
        shell: bash
        run: |
          rm .github/workflows/materialize-localglobe-actor-boundary.yml
          python - <<'PY'
          import subprocess
          exact = {
              '.github/workflows/materialize-localglobe-actor-boundary.yml',
              'data/ledger/claims.jsonl',
              'data/ledger/participation.jsonl',
              'data/ledger/surfaces.jsonl',
              'data/research/clifford-cross-corpus-public-interest-map.json',
              'package.json',
              'test/localglobe-actor-boundary.test.js',
          }
          generated_prefixes = ('build/', 'briefs/', 'cases/', 'reports/', 'estates/', 'gametrails/')
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          forbidden = [path for path in paths if path not in exact and not path.startswith(generated_prefixes)]
          if forbidden:
              raise SystemExit('unexpected path(s): ' + ', '.join(forbidden))
          required = exact - {'.github/workflows/materialize-localglobe-actor-boundary.yml'}
          missing = sorted(path for path in required if path not in paths)
          if missing:
              raise SystemExit('required product path(s) did not change: ' + ', '.join(missing))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'topology: preserve LocalGlobe as organization-only evidence'
          git push origin HEAD:candidate/localglobe-actor-boundary-refusal-v1
