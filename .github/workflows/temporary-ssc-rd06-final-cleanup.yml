name: TEMP retire all proved RD-06 execution refs

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd06-final-cleanup.yml'
      - '.rd06-final-cleanup/**'

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: temp-ssc-rd06-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-final-cleanup-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROOF_BRANCH: agent/ssc-rd06-v2-descendant-proof-trigger
      PROOF_WORKFLOW_NAME: TEMP prove descendant-main RD-06 closure v2
      PROOF_ARTIFACT_NAME: ssc-rd06-wave02-descendant-postmerge-proof-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact v2 descendant proof and canonical issue state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rd06-final-cleanup
          mkdir -p /tmp/rd06-final-cleanup/proof /tmp/rd06-final-cleanup/receipt
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${PROOF_BRANCH}&status=completed&per_page=100" > /tmp/rd06-final-cleanup/runs.json
          python - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path('/tmp/rd06-final-cleanup/runs.json').read_text()); pages=data if isinstance(data,list) else [data]; rows=[]
          for page in pages: rows.extend(page.get('workflow_runs',[]))
          matches=[r for r in rows if r.get('name')==os.environ['PROOF_WORKFLOW_NAME'] and r.get('head_branch')==os.environ['PROOF_BRANCH']]
          matches.sort(key=lambda r:r.get('created_at',''),reverse=True)
          if not matches: pathlib.Path('/tmp/rd06-final-cleanup/receipt/BLOCKED.txt').write_text('no_completed_v2_descendant_proof\n')
          else:
              run=matches[0]; pathlib.Path('/tmp/rd06-final-cleanup/proof-run.json').write_text(json.dumps(run,indent=2)+'\n'); pathlib.Path('/tmp/rd06-final-cleanup/proof-run-id.txt').write_text(str(run['id'])+'\n')
              if run.get('conclusion')!='success': pathlib.Path('/tmp/rd06-final-cleanup/receipt/BLOCKED.txt').write_text(f"v2_descendant_proof_{run.get('conclusion')}\n")
          PY
          if [ -f /tmp/rd06-final-cleanup/receipt/BLOCKED.txt ]; then exit 0; fi
          run_id="$(cat /tmp/rd06-final-cleanup/proof-run-id.txt)"; gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > /tmp/rd06-final-cleanup/artifacts.json
          python - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path('/tmp/rd06-final-cleanup/artifacts.json').read_text()); arts=[a for a in data.get('artifacts',[]) if a.get('name')==os.environ['PROOF_ARTIFACT_NAME'] and not a.get('expired')]
          if len(arts)!=1: pathlib.Path('/tmp/rd06-final-cleanup/receipt/BLOCKED.txt').write_text(f'v2_descendant_artifact_count_{len(arts)}\n')
          else:
              art=arts[0]; pathlib.Path('/tmp/rd06-final-cleanup/artifact.json').write_text(json.dumps(art,indent=2)+'\n'); pathlib.Path('/tmp/rd06-final-cleanup/artifact-id.txt').write_text(str(art['id'])+'\n')
          PY
          if [ -f /tmp/rd06-final-cleanup/receipt/BLOCKED.txt ]; then exit 0; fi
          artifact="$(cat /tmp/rd06-final-cleanup/artifact-id.txt)"; gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" > /tmp/rd06-final-cleanup/proof.zip
          expected="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-final-cleanup/artifact.json'))['digest'].split(':',1)[1])
          PY
          )"; test "$(sha256sum /tmp/rd06-final-cleanup/proof.zip | awk '{print $1}')" = "$expected"
          unzip -q /tmp/rd06-final-cleanup/proof.zip -d /tmp/rd06-final-cleanup/proof
          proof="$(find /tmp/rd06-final-cleanup/proof -type f -name proof.json -print -quit)"; manifest="$(find /tmp/rd06-final-cleanup/proof -type f -name manifest.json -print -quit)"; test -n "$proof"; test -n "$manifest"
          cp "$proof" /tmp/rd06-final-cleanup/receipt/proof.json; cp "$manifest" /tmp/rd06-final-cleanup/receipt/proof-manifest.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-final-cleanup/proof'); proof=json.load(open('/tmp/rd06-final-cleanup/receipt/proof.json')); manifest=json.load(open('/tmp/rd06-final-cleanup/receipt/proof-manifest.json'))
          assert proof['schema_version']=='ssc-rd06-wave02-descendant-postmerge-proof-v2@1'; assert proof['wave_id']=='SSC-RD-W02' and proof['lane_id']=='RD-06' and proof['class_id']=='RD-06-C01' and proof['issue']==791
          assert proof['merge_tree_identical_to_product'] and proof['merge_is_ancestor_of_current_main'] and proof['later_main_disjoint'] and proof['overlap_path_count']==0
          assert proof['atlas']=={'open':39,'closed':3}; assert proof['focused_checks_passed'] and proof['complete_release_gate_passed'] and proof['timestamp_only_volatility_proved'] and proof['deterministic_replay_passed'] and proof['no_magic_human_gate_passed']
          assert proof['authority']['outside_human_dependency'] is False and proof['authority']['external_contacts']==0 and proof['authority']['external_reviews']==0
          assert proof['authority']['publication_effect']=='none' and proof['authority']['adoption_effect']=='none' and proof['authority']['graph_effect']=='none'
          for row in manifest['entries']:
              p=root/row['path']; b=p.read_bytes(); assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in manifest['entries']).encode()).hexdigest(); assert combined==manifest['combined_sha256']
          PY
          merge_commit="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-final-cleanup/receipt/proof.json'))['merge_commit'])
          PY
          )"; git fetch origin main; git merge-base --is-ancestor "$merge_commit" origin/main
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/issues/791" --jq '.state')" = closed; test "$(gh api "/repos/${GITHUB_REPOSITORY}/issues/791" --jq '.state_reason')" = completed
          gh api "/repos/${GITHUB_REPOSITORY}/contents/data/project/ssc-residual-wave02/closures/RD-06-C01.json?ref=main" > /tmp/rd06-final-cleanup/receipt/main-closure-content.json
          git rev-parse origin/main > /tmp/rd06-final-cleanup/receipt/main-at-cleanup.txt

      - name: Close execution-only PRs and retire all RD-06 working refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [ -f /tmp/rd06-final-cleanup/receipt/BLOCKED.txt ]; then exit 0; fi
          cat > /tmp/rd06-final-cleanup/branches.txt <<'EOF'
          agent/ssc-rd-wave02-rd06-offeror-universe
          agent/ssc-rd06-wave02-terminal-promotion
          agent/ssc-rd06-terminal-audit-base-v1
          agent/ssc-rd06-terminal-audit-trigger-v1
          agent/ssc-rd06-current-main-reconcile-base-v1
          agent/ssc-rd06-current-main-reconcile-trigger-v1
          agent/ssc-rd06-promotion-proof-base-v1
          agent/ssc-rd06-promotion-proof-trigger-v1
          agent/ssc-rd06-exact-merge-base-v1
          agent/ssc-rd06-exact-merge-trigger-v1
          agent/ssc-rd06-postmerge-proof-base-v1
          agent/ssc-rd06-postmerge-proof-trigger-v1
          agent/ssc-rd06-descendant-proof-base-v1
          agent/ssc-rd06-descendant-proof-trigger-v1
          agent/ssc-rd06-cleanup-base-v1
          agent/ssc-rd06-cleanup-trigger-v1
          agent/ssc-rd06-current-main-reconcile-v2-base
          agent/ssc-rd06-current-main-reconcile-v2-trigger
          agent/ssc-rd06-wave02-terminal-promotion-v2
          agent/ssc-rd06-promotion-v2-proof-base
          agent/ssc-rd06-promotion-v2-proof-trigger
          agent/ssc-rd06-v2-exact-merge-base
          agent/ssc-rd06-v2-exact-merge-trigger
          agent/ssc-rd06-v2-descendant-proof-base
          agent/ssc-rd06-v2-descendant-proof-trigger
          EOF
          python - <<'PY'
          import json,pathlib,subprocess,os
          repo=os.environ['GITHUB_REPOSITORY']; branches=[x.strip() for x in pathlib.Path('/tmp/rd06-final-cleanup/branches.txt').read_text().splitlines() if x.strip()]; closed=[]
          for branch in branches:
              rows=json.loads(subprocess.run(['gh','pr','list','--repo',repo,'--state','open','--head',branch,'--json','number'],check=True,text=True,stdout=subprocess.PIPE).stdout)
              for row in rows:
                  subprocess.run(['gh','pr','close',str(row['number']),'--repo',repo,'--comment','Execution-only RD-06 surface retired after checksum-bound v2 descendant-main proof. Closed without merge.'],check=True); closed.append(row['number'])
          pathlib.Path('/tmp/rd06-final-cleanup/receipt/closed-prs.json').write_text(json.dumps(sorted(set(closed)),indent=2)+'\n')
          PY
          : > /tmp/rd06-final-cleanup/receipt/deleted-branches.txt; : > /tmp/rd06-final-cleanup/receipt/missing-branches.txt
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --silent >/dev/null 2>&1; then gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; echo "$branch" >> /tmp/rd06-final-cleanup/receipt/deleted-branches.txt; else echo "$branch" >> /tmp/rd06-final-cleanup/receipt/missing-branches.txt; fi
          done < /tmp/rd06-final-cleanup/branches.txt
          python - <<'PY'
          import json,pathlib
          deleted=pathlib.Path('/tmp/rd06-final-cleanup/receipt/deleted-branches.txt').read_text().splitlines(); missing=pathlib.Path('/tmp/rd06-final-cleanup/receipt/missing-branches.txt').read_text().splitlines(); proof=json.load(open('/tmp/rd06-final-cleanup/receipt/proof.json'))
          result={'schema_version':'ssc-rd06-wave02-final-cleanup@1','wave_id':'SSC-RD-W02','lane_id':'RD-06','class_id':'RD-06-C01','issue':791,'canonical_merge_commit':proof['merge_commit'],'current_main_at_cleanup':pathlib.Path('/tmp/rd06-final-cleanup/receipt/main-at-cleanup.txt').read_text().strip(),'branches_declared':25,'branches_deleted':len(deleted),'branches_already_missing':len(missing),'deleted_branches':deleted,'already_missing_branches':missing,'execution_only_prs_closed':json.load(open('/tmp/rd06-final-cleanup/receipt/closed-prs.json')),'canonical_state':{'atlas_open':39,'atlas_closed':3,'issue_closed_completed':True},'authority':proof['authority']}
          pathlib.Path('/tmp/rd06-final-cleanup/receipt/result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Seal cleanup or blocker receipt
        if: always()
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-final-cleanup/receipt'); root.mkdir(parents=True,exist_ok=True); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='manifest.json'):
            b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows).encode()).hexdigest(); (root/'manifest.json').write_text(json.dumps({'schema_version':'ssc-rd06-wave02-final-cleanup-manifest@1','entry_count':len(rows),'entries':rows,'combined_sha256':combined},indent=2)+'\n'); print(f'RD-06 final cleanup sealed: {combined}')
          PY

      - name: Preserve cleanup or blocker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-final-cleanup-v1
          path: /tmp/rd06-final-cleanup/receipt
          if-no-files-found: error
          retention-days: 90
