name: Temporary PC-35 shard diagnostic

on:
  pull_request:
    paths:
      - '.pc35/payload.part-*'
      - '.github/workflows/pc35-shard-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-population-frame-assurance-v1
      - name: Print normalized shard hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in sorted(Path('.pc35').glob('payload.part-*')):
              normalized = ''.join(path.read_text().split())
              print(path.name, len(normalized), hashlib.sha256(normalized.encode()).hexdigest())
          PY
