name: Counter-Selector Wave 20 exception falsification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-20.yml'
      - 'data/project/counter-selector-wave-20-exception-falsification.json'
      - 'data/project/counter-selector-exception-falsification-registry.json'
      - 'data/project/counter-selector-wave-20-external-review-export-registry.json'
      - 'data/project/counter-selector-wave-20-release-manifest.json'
      - 'schemas/counter-selector-exception-falsification.schema.json'
      - 'docs/methods/counter-selector-exception-falsification.md'
      - 'docs/milestones/counter-selector-wave-20.md'
      - 'tools/build-counter-selector-wave-20.mjs'
      - 'tools/validate-counter-selector-wave-20.mjs'
      - 'test/counter-selector-wave-20.test.js'
      - 'reports/core-thesis/counter-selector-wave-20/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-20-exception-falsification'
    paths:
      - '.github/workflows/counter-selector-wave-20.yml'
      - 'data/project/counter-selector-wave-20-exception-falsification.json'
      - 'data/project/counter-selector-exception-falsification-registry.json'
      - 'data/project/counter-selector-wave-20-external-review-export-registry.json'
      - 'data/project/counter-selector-wave-20-release-manifest.json'
      - 'schemas/counter-selector-exception-falsification.schema.json'
      - 'docs/methods/counter-selector-exception-falsification.md'
      - 'docs/milestones/counter-selector-wave-20.md'
      - 'tools/build-counter-selector-wave-20.mjs'
      - 'tools/validate-counter-selector-wave-20.mjs'
      - 'test/counter-selector-wave-20.test.js'
      - 'reports/core-thesis/counter-selector-wave-20/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 20 products
        run: node tools/build-counter-selector-wave-20.mjs
      - name: Validate exception-falsification contract
        run: node tools/validate-counter-selector-wave-20.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-20.test.js
      - name: Require exact committed Wave 20 products
        run: |
          git diff --exit-code --             data/project/counter-selector-exception-falsification-registry.json             data/project/counter-selector-wave-20-external-review-export-registry.json             data/project/counter-selector-wave-20-release-manifest.json             reports/core-thesis/counter-selector-wave-20/data.json             reports/core-thesis/counter-selector-wave-20/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 20 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-20.mjs
          node tools/validate-counter-selector-wave-20.mjs
          node test/counter-selector-wave-20.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
