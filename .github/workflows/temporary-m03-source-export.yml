name: Temporary M-03 verified materialization

on:
  push:
    branches:
      - agent/m03-decisive-acquisition-review
    paths:
      - '.github/workflows/temporary-m03-source-export.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: temporary-m03-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m03-decisive-acquisition-review
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download and verify exact M-03 source patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m03-diagnostics
          url='https://filebin.net/m03-794958daac0d5a3f/m03.patch.gz'
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 \
            "$url" -o /tmp/m03.patch.gz
          printf '%s  %s\n' \
            '794958daac0d5a3f1e691588ba116c348bc9e5f9602b2b755dc254a88daaaee1' \
            /tmp/m03.patch.gz | sha256sum --check
          base64 -w 0 /tmp/m03.patch.gz > /tmp/m03.patch.gz.b64
          printf '%s  %s\n' \
            'b34074a9f7ad380cbfb2af0836808d0236826011b0e406f5e4cd396b5fb21574' \
            /tmp/m03.patch.gz.b64 | sha256sum --check
          gzip -dc /tmp/m03.patch.gz > /tmp/m03.patch
          printf '%s  %s\n' \
            '748fc409ff24de6bcb99d06493c257bb5b1f40eacb53512619da14fc649736b4' \
            /tmp/m03.patch | sha256sum --check
          wc -c /tmp/m03.patch.gz /tmp/m03.patch.gz.b64 /tmp/m03.patch \
            | tee /tmp/m03-diagnostics/transport-bytes.txt
          sha256sum /tmp/m03.patch.gz /tmp/m03.patch.gz.b64 /tmp/m03.patch \
            | tee /tmp/m03-diagnostics/transport-sha256.txt

      - name: Apply permanent M-03 source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/m03.patch
          git apply /tmp/m03.patch
          rm -rf .github/temporary
          rm -f .github/workflows/temporary-m03-source-export.yml
          test -f .github/workflows/m03-decisive-acquisition.yml
          test -f data/reviews/m03-methodology.json
          test -f tools/acquire-m03-wave-01.mjs
          test -f tools/build-m03-review.mjs
          test -f tools/verify-m03-review-browser.cjs

      - name: Validate the static packet contract
        shell: bash
        run: |
          set -euo pipefail
          npm run compile
          npm run validate:m03-review
          node test/m03-acquisition.test.js
          node test/m03-review.test.js
          node test/m03-review-aperture.test.js
          npm run build:pages
          npm run build:standalone
          npm run validate:m03-aperture

      - name: Execute the first decisive-acquisition wave
        shell: bash
        env:
          M03_ACQUIRED_AT: '2026-07-23T16:30:00.000Z'
        run: |
          set -euo pipefail
          npm run acquire:m03-wave-01
          npm run build:m03-review
          npm run validate:m03-review
          node tools/finalize-m03-snapshot.mjs \
            --source build/m03-acquisition-wave-01 \
            --destination data/acquisitions/m03-wave-01 \
            --completed-at "$M03_ACQUIRED_AT" \
            --source-head "$GITHUB_SHA"
          npm run compile
          npm run validate:m03-review

      - name: Run the complete release and browser gates
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node tools/verify-m03-review-browser.cjs

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-materialization-evidence
          path: |
            /tmp/m03-diagnostics/
            data/acquisitions/m03-wave-01/
            data/reviews/
            data/milestones/decisive-acquisition-promotion-review-v1.json
            build/m03-review/
            build/metrics/m03-*
            reviews/
            review-handoffs/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the permanent source and frozen acquisition snapshot
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .github/temporary
          test ! -e .github/workflows/temporary-m03-source-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short | tee /tmp/m03-diagnostics/final-status.txt
          git diff --cached --check
          git commit -m 'Ship M-03 decisive acquisition review'
          git push origin HEAD:agent/m03-decisive-acquisition-review
