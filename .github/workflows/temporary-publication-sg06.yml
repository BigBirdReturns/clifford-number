name: Temporary materialize publication safety and SG-06

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/temporary-publication-sg06.yml'
      - '.github/tmp/publication-sg06-*'
      - '.github/scripts/run-publication-sg06.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-sg06-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/publication-allowlist-poof-admission-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-allowlist-poof-admission-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute exact publication and SG-06 transition
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' '0566357d4d1cfc3ab5472d1c8b1e16d2633b9907ee50d330c73f32d56277794f' .github/tmp/publication-sg06-v2-runner.sh.xz.b64 | sha256sum --check --strict
          base64 --decode .github/tmp/publication-sg06-v2-runner.sh.xz.b64 > /tmp/run-publication-sg06-v2.sh.xz
          printf '%s  %s\n' 'f64b7f56b380e5f1dc444e0508802581ab973c27e780b10bee6c497099ca9a5e' /tmp/run-publication-sg06-v2.sh.xz | sha256sum --check --strict
          xz --decompress --stdout /tmp/run-publication-sg06-v2.sh.xz > /tmp/run-publication-sg06-v2.sh
          printf '%s  %s\n' 'ef6577d2933e6d26af177a80dd837e35f794bc5384d05ed9a300710b71769caa' /tmp/run-publication-sg06-v2.sh | sha256sum --check --strict
          chmod +x /tmp/run-publication-sg06-v2.sh
          /tmp/run-publication-sg06-v2.sh
