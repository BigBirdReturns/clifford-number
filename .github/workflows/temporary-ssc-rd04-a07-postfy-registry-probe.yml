name: TEMP probe SSC RD-04 A07 post-FY registry denominator

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd04-a07-postfy-registry-probe-base
    paths:
      - '.github/tmp/ssc-rd04-a07-postfy-registry-probe.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-rd04-a07-postfy-registry-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a07-postfy-registry-probe-base
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce no-magic-human contract
        run: node tools/validate-no-magic-human-gate.mjs
      - name: Execute the complete post-FY registry denominator and exact SHN join
        run: node .github/tmp/ssc-rd04-a07-postfy-registry-probe.mjs
      - name: Upload exact A07 D2 registry receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-a07-d2-postfy-registry
          path: a07-postfy-registry-probe
          if-no-files-found: error
          retention-days: 30
