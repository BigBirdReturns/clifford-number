name: Materialize Counter-Selector Wave 39

on:
  pull_request:
    paths:
      - '.ci/carrier/counter-selector-wave-39.part-*'
      - '.github/workflows/materialize-counter-selector-wave-39.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct, qualify, and publish exact transport-free product
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EXPECTED_BASE: 8a2aa74ea43827447ee8557c41fdc059d2f76a3c
          ARCHIVE_SHA256: 76020de3397027243d3b160ad8b7a6962c98024a04ea1153378389925365faaa
        run: |
          set -euo pipefail

          git config user.name 'Wave 39 materializer'
          git config user.email 'wave39-materializer@users.noreply.github.com'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git status --porcelain | wc -l)" -eq 0

          cat .ci/carrier/counter-selector-wave-39.part-* \
            | base64 -d > /tmp/counter-selector-wave-39.tar.xz
          echo "$ARCHIVE_SHA256  /tmp/counter-selector-wave-39.tar.xz" \
            | sha256sum -c -

          rm -rf /tmp/counter-selector-wave-39-product
          mkdir -p /tmp/counter-selector-wave-39-product
          tar -xJf /tmp/counter-selector-wave-39.tar.xz \
            -C /tmp/counter-selector-wave-39-product

          cat > /tmp/wave39-expected-paths.txt <<'EOF'
          .github/workflows/counter-selector-wave-39.yml
          data/project/counter-selector-wave-39-control-registry.json
          data/project/counter-selector-wave-39-digest-selected-restore.json
          data/project/counter-selector-wave-39-release-manifest.json
          docs/methods/counter-selector-digest-selected-restore.md
          docs/milestones/counter-selector-wave-39.md
          reports/core-thesis/counter-selector-wave-39/data.json
          reports/core-thesis/counter-selector-wave-39/index.html
          schemas/counter-selector-digest-selected-restore.schema.json
          test/counter-selector-wave-39.test.js
          tools/build-counter-selector-wave-39.mjs
          tools/validate-counter-selector-wave-39.mjs
          EOF
          sed -i 's/^          //' /tmp/wave39-expected-paths.txt

          find /tmp/counter-selector-wave-39-product -type f -printf '%P\n' \
            | LC_ALL=C sort > /tmp/wave39-archive-paths.txt
          diff -u /tmp/wave39-expected-paths.txt /tmp/wave39-archive-paths.txt

          cp -a /tmp/counter-selector-wave-39-product/. .
          rm -f .ci/carrier/counter-selector-wave-39.part-00 \
                .ci/carrier/counter-selector-wave-39.part-01 \
                .ci/carrier/counter-selector-wave-39.part-02 \
                .ci/carrier/counter-selector-wave-39.part-03 \
                .github/workflows/materialize-counter-selector-wave-39.yml
          rmdir .ci/carrier 2>/dev/null || true
          rmdir .ci 2>/dev/null || true

          node tools/build-counter-selector-wave-39.mjs
          node tools/validate-counter-selector-wave-39.mjs
          node test/counter-selector-wave-39.test.js

          git add -A
          git diff --cached --check
          git diff --cached --name-only "$EXPECTED_BASE" \
            | LC_ALL=C sort > /tmp/wave39-staged-paths.txt
          diff -u /tmp/wave39-expected-paths.txt /tmp/wave39-staged-paths.txt

          git commit -m 'Counter-Selector Wave 39: bind repoDigest-selected restore'
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"

          rm -rf /tmp/wave39-gate
          git worktree add --detach /tmp/wave39-gate "$PRODUCT_COMMIT"
          (
            cd /tmp/wave39-gate
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            npm run release:check
            git restore --staged --worktree .
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            test -z "$(git status --porcelain)"
          )
          git worktree remove /tmp/wave39-gate

          git diff --name-only "$EXPECTED_BASE..$PRODUCT_COMMIT" \
            | LC_ALL=C sort > /tmp/wave39-final-paths.txt
          diff -u /tmp/wave39-expected-paths.txt /tmp/wave39-final-paths.txt
          test -z "$(git status --porcelain)"

          python3 - <<PY
          import json
          from pathlib import Path
          receipt = {
              'schema_version': 'counter-selector-wave-39-materialization-receipt@1',
              'base_commit': '$EXPECTED_BASE',
              'product_commit': '$PRODUCT_COMMIT',
              'product_tree': '$PRODUCT_TREE',
              'archive_sha256': '$ARCHIVE_SHA256',
              'permanent_paths': Path('/tmp/wave39-expected-paths.txt').read_text().splitlines(),
              'focused_gate': 'passed',
              'adversarial_mutations': 162,
              'complete_release_gate': 'passed',
              'deterministic_reconstruction': 'passed',
              'temporary_paths_survive': False,
          }
          Path('/tmp/counter-selector-wave-39-materialization.json').write_text(
              json.dumps(receipt, indent=2) + '\n'
          )
          PY

          git push --force-with-lease="refs/heads/$BRANCH_NAME:$(git rev-parse HEAD^)" \
            origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-selector-wave-39-materialization-${{ github.run_id }}
          path: /tmp/counter-selector-wave-39-materialization.json
          if-no-files-found: error
