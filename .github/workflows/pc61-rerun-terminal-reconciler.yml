name: PC-61 terminal reconciler rerun

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc61-rerun-terminal-reconciler.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: pc61-terminal-reconciler-rerun
  cancel-in-progress: false

jobs:
  rerun:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pc61-terminal-reconcile-rerun-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      ISSUE: '1822'
      RECONCILER_BRANCH: 'agent/pc61-terminal-reconcile-v3'
      RERUN_BRANCH: 'agent/pc61-terminal-reconcile-rerun-v4'
      OUT: '/tmp/pc61-reconciler-rerun'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind terminal state or rerun exact reconciler
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA" HEAD

          terminal_receipt_count() {
            gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$ISSUE/comments?per_page=100" \
              | jq '[.[][] | select(.body|startswith("## PC-61 terminal receipt"))] | length'
          }
          residual_refs() {
            if gh api "/repos/$GH_REPOSITORY/git/matching-refs/heads/agent/pc61" >/tmp/pc61-rerun-refs.json 2>/dev/null; then
              jq 'length' /tmp/pc61-rerun-refs.json
            else
              echo 0
            fi
          }
          residual_prs() {
            gh api --method GET "/repos/$GH_REPOSITORY/pulls" -f state=open -F per_page=100 \
              | jq '[.[] | select(.head.ref|startswith("agent/pc61"))] | length'
          }

          receipt=$(terminal_receipt_count)
          refs=$(residual_refs)
          prs=$(residual_prs)
          if [ "$receipt" -ge 1 ] && [ "$refs" -le 1 ] && [ "$prs" -le 1 ]; then
            jq -n --arg receipt "$receipt" --arg refs "$refs" --arg prs "$prs" '{schema_version:"pc61-reconciler-rerun@1",status:"terminal_receipt_already_present",rerun_executed:false,receipt_count:($receipt|tonumber),observed_refs:($refs|tonumber),observed_open_prs:($prs|tonumber)}' > "$OUT/receipt.json"
            exit 0
          fi

          owner=${GH_REPOSITORY%%/*}
          gh api --method GET "/repos/$GH_REPOSITORY/pulls" -f state=all -f head="$owner:$RECONCILER_BRANCH" -F per_page=100 > "$OUT/reconciler-prs.json"
          test "$(jq 'length' "$OUT/reconciler-prs.json")" -ge 1
          jq 'sort_by(.number) | last' "$OUT/reconciler-prs.json" > "$OUT/reconciler-pr.json"
          RECONCILER_HEAD=$(jq -r .head.sha "$OUT/reconciler-pr.json")
          test -n "$RECONCILER_HEAD"

          run_id=''
          for attempt in $(seq 1 60); do
            gh api "/repos/$GH_REPOSITORY/actions/runs?head_sha=$RECONCILER_HEAD&event=pull_request&per_page=100" > "$OUT/reconciler-runs.json"
            run_id=$(jq -r '[.workflow_runs[] | select(.name=="PC-61 exact terminal reconciler")] | sort_by(.run_number) | last | .id // empty' "$OUT/reconciler-runs.json")
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" > "$OUT/source-run-id.txt"

          for attempt in $(seq 1 720); do
            gh api "/repos/$GH_REPOSITORY/actions/runs/$run_id" > "$OUT/source-run.json"
            [ "$(jq -r .status "$OUT/source-run.json")" = completed ] && break
            sleep 15
          done
          test "$(jq -r .status "$OUT/source-run.json")" = completed

          receipt=$(terminal_receipt_count)
          if [ "$receipt" -ge 1 ]; then
            jq -n --arg source "$run_id" '{schema_version:"pc61-reconciler-rerun@1",status:"source_run_terminalized",source_run:($source|tonumber),rerun_executed:false}' > "$OUT/receipt.json"
            exit 0
          fi

          conclusion=$(jq -r .conclusion "$OUT/source-run.json")
          case "$conclusion" in
            failure|cancelled|timed_out|action_required|stale) ;;
            *) echo "reconciler conclusion is not rerunnable: $conclusion" >&2; exit 1 ;;
          esac
          source_attempt=$(jq -r .run_attempt "$OUT/source-run.json")
          gh api --method POST "/repos/$GH_REPOSITORY/actions/runs/$run_id/rerun" > "$OUT/rerun-response.json"

          terminal=false
          final_conclusion=''
          for attempt in $(seq 1 960); do
            receipt=$(terminal_receipt_count)
            if [ "$receipt" -ge 1 ]; then
              terminal=true
              break
            fi
            gh api "/repos/$GH_REPOSITORY/actions/runs/$run_id" > "$OUT/rerun-current.json"
            if [ "$(jq -r .status "$OUT/rerun-current.json")" = completed ] && [ "$(jq -r .run_attempt "$OUT/rerun-current.json")" -gt "$source_attempt" ]; then
              final_conclusion=$(jq -r .conclusion "$OUT/rerun-current.json")
              break
            fi
            sleep 15
          done
          receipt=$(terminal_receipt_count)
          [ "$receipt" -ge 1 ] && terminal=true
          jq -n --arg source "$run_id" --argjson terminal "$terminal" --arg conclusion "$final_conclusion" '{schema_version:"pc61-reconciler-rerun@1",status:(if $terminal then "terminal" else "rerun_completed_without_terminal_receipt" end),source_run:($source|tonumber),rerun_executed:true,terminal:$terminal,final_conclusion:$conclusion}' > "$OUT/receipt.json"
          test "$terminal" = true

      - name: Preserve rerun evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc61-terminal-reconciler-rerun
          path: /tmp/pc61-reconciler-rerun
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Retire rerun carrier when receipt is present
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          count=$(gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$ISSUE/comments?per_page=100" | jq '[.[][] | select(.body|startswith("## PC-61 terminal receipt"))] | length')
          test "$count" -ge 1
          gh api --method PATCH "/repos/$GH_REPOSITORY/pulls/${{ github.event.pull_request.number }}" -f state=closed >/tmp/pc61-rerun-pr-closed.json || true
          gh api --method DELETE "/repos/$GH_REPOSITORY/git/refs/heads/$RERUN_BRANCH" || true
