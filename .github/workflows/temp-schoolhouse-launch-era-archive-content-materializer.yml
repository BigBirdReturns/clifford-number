name: TEMP materialize School.House launch-era archived content custody

on:
  push:
    branches:
      - agent/schoolhouse-launch-era-archive-content-materializer-v1
    paths:
      - '.github/workflows/temp-schoolhouse-launch-era-archive-content-materializer.yml'
      - '.schoolhouse-launch-era-archive-content-materializer/EXECUTE'
      - '.schoolhouse-launch-era-archive-content-materializer/chunks/*.b64'
      - '.schoolhouse-launch-era-archive-content-materializer/runner.sh.gz.b64'
  pull_request:
    paths:
      - '.github/workflows/temp-schoolhouse-launch-era-archive-content-materializer.yml'
      - '.schoolhouse-launch-era-archive-content-materializer/EXECUTE'
      - '.schoolhouse-launch-era-archive-content-materializer/chunks/*.b64'
      - '.schoolhouse-launch-era-archive-content-materializer/runner.sh.gz.b64'
  workflow_dispatch:

concurrency:
  group: temp-schoolhouse-launch-era-archive-content-materializer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct, validate, and execute bounded materializer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          EXECUTE='.schoolhouse-launch-era-archive-content-materializer/EXECUTE'
          BUNDLE='.schoolhouse-launch-era-archive-content-materializer/runner.sh.gz.b64'
          RUNNER='/tmp/materialize-schoolhouse-launch-era-archive-content.sh'
          test -s "$EXECUTE"
          test -s "$BUNDLE"
          grep -Fx 'materialize=schoolhouse-launch-era-archive-content-custody-v1' "$EXECUTE"
          grep -Fx 'known_safe_main=ee88d215bf85f6d3033fb07d6f236bcb71a54546' "$EXECUTE"
          grep -Fx 'replay_artifact_digest=sha256:3fcc4191cf2e6aa3f84eadc5b5265c4e9af13a58a7391b2407a194d6d147a6c9' "$EXECUTE"
          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = '9312a8ba7c802614a5789df2a454d1623c9b9a36f259a42ab385567458a31922'
          base64 -d "$BUNDLE" | gzip -dc > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = '535c0bcb0c287b817dc186d29621672e84b179dbd6eca612f60cf1a4007a3d58'
          bash -n "$RUNNER"
          bash "$RUNNER"

      - uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-launch-era-archive-content-materialization-receipt
          path: /tmp/schoolhouse-launch-era-archive-content-materialization-receipt
          if-no-files-found: error
          retention-days: 90
