name: TEMP export exact RD-04 State Options rebuild custody

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-ssc-rd04-state-options-exemption-materializer-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: temp-ssc-rd04-state-options-export-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  CANONICAL_MAIN: 327648726320507532751f219a52d03f9c17fac5
  SOURCE_ADJUDICATION_HEAD: f8a8d2ead8de1c9e6e9b06f5ae4d1389ccb30b51
  SOURCE_ARTIFACT_ID: '8950104341'
  SOURCE_ARTIFACT_SHA256: 72db2a9c3b481f59383275f2821cdb4978dd4f257cf0236f309e94214c7f45d1

jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/ssc-rd04-state-options-exemption-materializer-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANONICAL_MAIN }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Export exact current matrix, implementation, and source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-state-options-rebuild-export-v1"
          rm -rf "$OUT"
          mkdir -p "$OUT/current-main" "$OUT/source-adjudication" "$OUT/receipts"

          test "$(git rev-parse HEAD)" = "$CANONICAL_MAIN"
          git fetch --no-tags origin main
          printf 'canonical_main=%s\nobserved_origin_main=%s\nsource_adjudication_head=%s\n' \
            "$CANONICAL_MAIN" "$(git rev-parse origin/main)" "$SOURCE_ADJUDICATION_HEAD" \
            > "$OUT/receipts/heads.txt"

          cat > "$OUT/receipts/current-main-paths.txt" <<'EOF'
          .github/workflows/status-sovereignty-rd-wave03-rd04-field-promotion.yml
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/cell-promotion-ledger.json
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/index.json
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/promoted-partial-field-matrix.json
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/promotion-decisions.json
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/promotion-input-custody.json
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/promotion-summary.json
          data/intake/status-sovereignty-rd-wave03-rd04-field-promotion/remaining-open-field-census.json
          data/research/status-sovereignty-residual-denominator-wave-03-current.json
          docs/milestones/ssc-rd-wave03-rd04-field-promotion.md
          schemas/status-sovereignty-rd-wave03-rd04-field-promotion.schema.json
          test/status-sovereignty-rd-wave03-rd04-field-promotion.test.js
          tools/build-status-sovereignty-rd-wave03-rd04-field-promotion.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-field-promotion.mjs
          EOF
          sed -i 's/^          //' "$OUT/receipts/current-main-paths.txt"
          while IFS= read -r rel; do
            test -f "$rel"
            mkdir -p "$OUT/current-main/$(dirname "$rel")"
            cp -a "$rel" "$OUT/current-main/$rel"
          done < "$OUT/receipts/current-main-paths.txt"

          git cat-file -e "$SOURCE_ADJUDICATION_HEAD^{commit}"
          git show "$SOURCE_ADJUDICATION_HEAD:.github/workflows/temp-ssc-rd04-state-options-report-acquisition-v1.yml" \
            > "$OUT/source-adjudication/workflow.yml"
          git show "$SOURCE_ADJUDICATION_HEAD^{commit}" --no-patch --format='%H%n%T%n%P%n%s' \
            > "$OUT/source-adjudication/commit.txt"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o "$OUT/source-adjudication/artifact.zip"
          test "$(sha256sum "$OUT/source-adjudication/artifact.zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_SHA256"
          mkdir -p "$OUT/source-adjudication/artifact"
          unzip -q "$OUT/source-adjudication/artifact.zip" -d "$OUT/source-adjudication/artifact"

          find "$OUT" -type f -printf '%P\n' | sort > "$OUT/receipts/export-paths.txt"
          find "$OUT" -type f ! -path "$OUT/receipts/SHA256SUMS" -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $OUT/#  #" \
            > "$OUT/receipts/SHA256SUMS"
          node tools/validate-no-magic-human-gate.mjs
          printf 'status=complete\noutside_human_dependency=false\nrepository_mutations=0\n' \
            > "$OUT/receipts/final.txt"
      - name: Upload exact rebuild export
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-state-options-rebuild-export-v1
          path: ${{ runner.temp }}/ssc-rd04-state-options-rebuild-export-v1
          if-no-files-found: error
          retention-days: 90
