name: TEMP materialize RD-04 State Options exemption promotion v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-ssc-rd04-state-options-exemption-materializer-v2.yml'

permissions:
  contents: write

concurrency:
  group: temp-ssc-rd04-state-options-exemption-materializer-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-state-options-exemption-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARRIER_ROOT: .transport/ssc-rd04-state-options-exemption-v1/shards
      PRODUCT_BRANCH: agent/ssc-rd04-state-options-exemption-promotion-v1
      PRODUCT_LEASE: e46d4aa98955e890a1bd2820dc43c52bc256490e
      CANONICAL_BASE: e46d4aa98955e890a1bd2820dc43c52bc256490e
      PERMANENT_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.yml
      BASE64_BYTES: '35180'
      BASE64_SHA256: 4059f1dcd17b225da24562e2cdeb5f93f7e44fe6aad964647574a44005ef0ace
      ARCHIVE_BYTES: '26384'
      ARCHIVE_SHA256: 97886246a6d8742b2da4a25797324b107368d0a3ececa2a215a0ca0862d74595
      PATHS_SHA256: 8717e0baadd372702e28bf63d165e4737625c3a92f46945e6ba2ebd929450192
      V1_WORKFLOW: .github/workflows/temp-ssc-rd04-state-options-exemption-materializer-v1.yml
      V1_WORKFLOW_BLOB: 252c05a486329be56c034812f9009f478b15623a
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - name: Derive exact v2 controller script
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$V1_WORKFLOW")" = "$V1_WORKFLOW_BLOB"
          python - "$V1_WORKFLOW" "$RUNNER_TEMP/rd04-materializer-v2.sh" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          step_marker = '      - name: Reconstruct, qualify, and publish transport-safe product\n'
          next_marker = '      - name: Preserve exact materialization receipt\n'
          if source.count(step_marker) != 1 or source.count(next_marker) != 1:
              raise SystemExit('v1 step denominator changed')
          block = source.split(step_marker, 1)[1].split(next_marker, 1)[0]
          run_marker = '        run: |\n'
          if block.count(run_marker) != 1:
              raise SystemExit('v1 run block denominator changed')
          raw = block.split(run_marker, 1)[1]
          lines = raw.splitlines()
          script_lines = []
          for line in lines:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line == '':
                  script_lines.append('')
              else:
                  raise SystemExit(f'unexpected v1 indentation: {line!r}')
          script = '\n'.join(script_lines) + '\n'
          old = '''find "$PACKAGE" -type f -printf '%P\\n' | sort > "$RECEIPT/archive-paths.txt"
cmp "$RECEIPT/expected-paths.txt" "$RECEIPT/archive-paths.txt"'''
          new = '''find "$PACKAGE" -type f -printf '%P\\n' | sort > "$RECEIPT/archive-paths.txt"
sort "$RECEIPT/expected-paths.txt" > "$RECEIPT/expected-paths-sorted.txt"
cmp "$RECEIPT/expected-paths-sorted.txt" "$RECEIPT/archive-paths.txt"'''
          if script.count(old) != 1:
              raise SystemExit(f'expected one path-list seam, found {script.count(old)}')
          repaired = script.replace(old, new, 1)
          if repaired.count('expected-paths-sorted.txt') != 2:
              raise SystemExit('v2 path-list repair count changed')
          output.write_text('#!/usr/bin/env bash\n' + repaired)
          output.chmod(0o700)
          PY
          grep -F 'sort "$RECEIPT/expected-paths.txt" > "$RECEIPT/expected-paths-sorted.txt"' "$RUNNER_TEMP/rd04-materializer-v2.sh"
          test "$(grep -Fc 'cmp "$RECEIPT/expected-paths-sorted.txt" "$RECEIPT/archive-paths.txt"' "$RUNNER_TEMP/rd04-materializer-v2.sh")" = 1
      - name: Execute repaired checksum-bound transaction
        shell: bash
        run: "$RUNNER_TEMP/rd04-materializer-v2.sh"
      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-state-options-exemption-materializer-v2
          path: ${{ runner.temp }}/ssc-rd04-state-options-exemption-materializer-v1/receipt
          if-no-files-found: error
          retention-days: 90
