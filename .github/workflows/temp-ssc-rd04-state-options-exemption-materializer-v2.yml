name: TEMP recover sealed RD-04 State Options v1 authored package

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-ssc-rd04-state-options-exemption-materializer-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-ssc-rd04-state-options-v1-package-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  SEALED_COMMIT: dcf5dbed25a2b0b4e617d23d3584df2ce1d1666b
  SEALED_WORKFLOW_BLOB: 252c05a486329be56c034812f9009f478b15623a
  CARRIER_ROOT: .transport/ssc-rd04-state-options-exemption-v1/shards
  BASE64_BYTES: '35180'
  BASE64_SHA256: 4059f1dcd17b225da24562e2cdeb5f93f7e44fe6aad964647574a44005ef0ace
  ARCHIVE_BYTES: '26384'
  ARCHIVE_SHA256: 97886246a6d8742b2da4a25797324b107368d0a3ececa2a215a0ca0862d74595
  PATHS_SHA256: 8717e0baadd372702e28bf63d165e4737625c3a92f46945e6ba2ebd929450192

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/ssc-rd04-state-options-exemption-materializer-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Recover and verify exact sealed authored package
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-state-options-v1-package-recovery"
          SHARDS="$OUT/shards"
          PACKAGE="$OUT/package"
          RECEIPT="$OUT/receipt"
          rm -rf "$OUT"
          mkdir -p "$SHARDS" "$PACKAGE" "$RECEIPT"

          git cat-file -e "$SEALED_COMMIT^{commit}"
          test "$(git rev-parse "$SEALED_COMMIT:.github/workflows/temp-ssc-rd04-state-options-exemption-materializer-v1.yml")" = "$SEALED_WORKFLOW_BLOB"

          git show "$SEALED_COMMIT:$CARRIER_ROOT/000.b64" > "$SHARDS/000.b64"
          git show "$SEALED_COMMIT:$CARRIER_ROOT/001.b64" > "$SHARDS/001.b64"
          test "$(sha256sum "$SHARDS/000.b64" | awk '{print $1}')" = e0ff1c1d9c6e0fa32da7551fbaa4998d893e8aa094c2eb67fc57b28387109917
          test "$(sha256sum "$SHARDS/001.b64" | awk '{print $1}')" = 534bf0c4ef4cda4332e8198a2267f743a26bd4a0381398e6637202156eec3382
          cat "$SHARDS/000.b64" "$SHARDS/001.b64" > "$OUT/product.b64"
          test "$(stat -c '%s' "$OUT/product.b64")" = "$BASE64_BYTES"
          test "$(sha256sum "$OUT/product.b64" | awk '{print $1}')" = "$BASE64_SHA256"
          base64 -d "$OUT/product.b64" > "$OUT/product.tar.xz"
          test "$(stat -c '%s' "$OUT/product.tar.xz")" = "$ARCHIVE_BYTES"
          test "$(sha256sum "$OUT/product.tar.xz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          tar -xJf "$OUT/product.tar.xz" -C "$PACKAGE"

          cat > "$RECEIPT/expected-paths.txt" <<'EOF'
          .github/workflows/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.yml
          data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/promoted-partial-field-matrix.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/promotion-summary.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/remaining-open-field-census.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/source-custody.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/source-page-11.txt
          data/intake/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion/state-field-register.jsonl
          docs/milestones/ssc-rd-wave03-rd04-state-options-exemption-promotion.md
          schemas/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.schema.json
          test/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.test.js
          tools/build-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.mjs
          EOF
          sed -i 's/^          //' "$RECEIPT/expected-paths.txt"
          test "$(sha256sum "$RECEIPT/expected-paths.txt" | awk '{print $1}')" = "$PATHS_SHA256"
          find "$PACKAGE" -type f -printf '%P\n' | sort > "$RECEIPT/archive-paths.txt"
          sort "$RECEIPT/expected-paths.txt" > "$RECEIPT/expected-paths-sorted.txt"
          cmp "$RECEIPT/expected-paths-sorted.txt" "$RECEIPT/archive-paths.txt"
          test "$(find "$PACKAGE" -type l | wc -l | tr -d ' ')" = 0

          find "$OUT" -type f ! -path "$RECEIPT/SHA256SUMS" -print0 \
            | sort -z | xargs -0 sha256sum | sed "s#  $OUT/#  #" > "$RECEIPT/SHA256SUMS"
          printf 'status=complete_exact_v1_package_recovered\nsealed_commit=%s\narchive_files=13\noutside_human_dependency=false\nrepository_mutations=0\n' \
            "$SEALED_COMMIT" > "$RECEIPT/final.txt"
      - name: Upload exact sealed package
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-state-options-v1-authored-package
          path: ${{ runner.temp }}/ssc-rd04-state-options-v1-package-recovery
          if-no-files-found: error
          retention-days: 90
