name: Materialize Counter-Selector Wave 17 fan-out

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-17.yml'
      - '.github/materializers/counter-selector-wave-17/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-17-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-17-function-attribution-fanout

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify carrier blobs and unpack exact Wave 17 estate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave17-expected-blobs <<'EOF'
            545a0ff768dc83f08537c5055d205004dc1171f5  .github/materializers/counter-selector-wave-17/payload-000
            c0093e99a4cf8ed3b5b27d066ef5fe8fc005b379  .github/materializers/counter-selector-wave-17/payload-001
            6c7d683af0d66a4c9d35e6c0aa397b14889b3e24  .github/materializers/counter-selector-wave-17/payload-002
            d7f5be4266eb75dffa467c870c8c277ec1fc85dc  .github/materializers/counter-selector-wave-17/payload-003
            0639a97cddb93bedfb582291b1ebe07a1b725e2c  .github/materializers/counter-selector-wave-17/payload-004
            c57a064f491562c6de8c0474b1ff0006ec4435ca  .github/materializers/counter-selector-wave-17/payload-005
            c92178a9e04109ca7c38ac1b054e8f55d1ffb8a4  .github/materializers/counter-selector-wave-17/payload-006
            d0e6981dc7cecc32029e1deedf1390f7bc811fad  .github/materializers/counter-selector-wave-17/payload-007
            29334423f5723be68ae01f6068f96185ecdf04da  .github/materializers/counter-selector-wave-17/payload-008
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave17-expected-blobs

          cat .github/materializers/counter-selector-wave-17/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-17.tar.gz
          echo 'adcedd669b7e54202d24e597df6679a62ba0c0515ee61f39461d5055f47625ac  /tmp/counter-selector-wave-17.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-17.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-17
          rm -f .github/workflows/materialize-counter-selector-wave-17.yml

      - name: Build, validate, and attack Wave 17 fan-out
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-17.mjs
          node tools/validate-counter-selector-wave-17.mjs
          node test/counter-selector-wave-17.test.js

      - name: Commit exact permanent Wave 17 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-17/payload-000 \
            .github/materializers/counter-selector-wave-17/payload-001 \
            .github/materializers/counter-selector-wave-17/payload-002 \
            .github/materializers/counter-selector-wave-17/payload-003 \
            .github/materializers/counter-selector-wave-17/payload-004 \
            .github/materializers/counter-selector-wave-17/payload-005 \
            .github/materializers/counter-selector-wave-17/payload-006 \
            .github/materializers/counter-selector-wave-17/payload-007 \
            .github/materializers/counter-selector-wave-17/payload-008 \
            .github/workflows/counter-selector-wave-17.yml \
            .github/workflows/materialize-counter-selector-wave-17.yml \
            data/project/counter-selector-external-review-packet-registry.json \
            data/project/counter-selector-function-attribution-registry.json \
            data/project/counter-selector-wave-17-function-attribution.json \
            data/project/counter-selector-wave-17-release-manifest.json \
            docs/methods/counter-selector-function-attribution-fanout.md \
            docs/milestones/counter-selector-wave-17.md \
            reports/core-thesis/counter-selector-wave-17/data.json \
            reports/core-thesis/counter-selector-wave-17/index.html \
            schemas/counter-selector-function-attribution-fanout.schema.json \
            test/counter-selector-wave-17.test.js \
            tools/build-counter-selector-wave-17.mjs \
            tools/validate-counter-selector-wave-17.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Fan out Counter-Selector Wave 17 function attribution'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 17 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-17.mjs
          node tools/validate-counter-selector-wave-17.mjs
          node test/counter-selector-wave-17.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent Wave 17 head
        run: git push origin HEAD:agent/counter-selector-wave-17-function-attribution-fanout
