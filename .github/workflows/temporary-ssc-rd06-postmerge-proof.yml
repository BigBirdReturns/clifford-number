name: TEMP prove exact-main RD-06 closure

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd06-postmerge-proof.yml'
      - '.rd06-postmerge-proof/**'

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: temp-ssc-rd06-postmerge-proof
  cancel-in-progress: false

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-postmerge-proof-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRODUCT_BRANCH: agent/ssc-rd06-wave02-terminal-promotion
      CLOSURE_PATH: data/project/ssc-residual-wave02/closures/RD-06-C01.json
      PROGRESS_PATH: data/research/status-sovereignty-residual-denominator-wave-02-progress.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bind exact main merge and canonical PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin main "$PRODUCT_BRANCH"
          proved_main="$(git rev-parse HEAD~2)"
          current_main="$(git rev-parse origin/main)"
          test "$proved_main" = "$current_main"
          product_head="$(git rev-parse "origin/${PRODUCT_BRANCH}")"

          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --head "$PRODUCT_BRANCH" --json number,headRefOid,baseRefName,mergeCommit,mergedAt,title > /tmp/rd06-merged-prs.json
          python - <<'PY'
          import json,pathlib,os
          rows=json.load(open('/tmp/rd06-merged-prs.json'))
          assert len(rows)==1, f'exactly one merged RD-06 canonical PR required, found {len(rows)}'
          pr=rows[0]
          assert pr['baseRefName']=='main'
          assert pr['headRefOid']==os.environ.get('PRODUCT_HEAD_ASSERT', pr['headRefOid'])
          assert pr['mergeCommit'] and pr['mergeCommit']['oid']
          pathlib.Path('/tmp/rd06-pr.json').write_text(json.dumps(pr,indent=2)+'\n')
          pathlib.Path('/tmp/rd06-merge-commit.txt').write_text(pr['mergeCommit']['oid']+'\n')
          PY
          actual_product="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-pr.json'))['headRefOid'])
          PY
          )"
          test "$actual_product" = "$product_head"
          merge_commit="$(cat /tmp/rd06-merge-commit.txt)"
          test "$merge_commit" = "$current_main"
          test "$(git rev-parse "${merge_commit}^{tree}")" = "$(git rev-parse "${product_head}^{tree}")"
          parents="$(git show -s --format='%P' "$merge_commit")"
          case " $parents " in *" $product_head "*) ;; *) exit 1 ;; esac
          printf '%s\n' "$current_main" > /tmp/rd06-current-main.txt
          printf '%s\n' "$product_head" > /tmp/rd06-product-head.txt

      - name: Validate additive atlas and authority boundary
        run: |
          set -Eeuo pipefail
          test -f "$CLOSURE_PATH"
          test -f "$PROGRESS_PATH"
          python - <<'PY'
          import json,pathlib
          closure=json.load(open('data/project/ssc-residual-wave02/closures/RD-06-C01.json'))
          assert closure['class_id']=='RD-06-C01' and closure['class_closed'] is True
          progress=json.load(open('data/research/status-sovereignty-residual-denominator-wave-02-progress.json'))
          ids=[r['class_id'] for r in progress['promoted_class_receipts']]
          assert ids.count('RD-04-C01')==1 and ids.count('RD-05-C03')==1 and ids.count('RD-06-C01')==1
          assert progress['counts']['closed_residual_classes']==3
          assert progress['counts']['open_residual_classes']==39
          for key in ['outside_human_dependencies','external_contacts','external_reviews','reviewed_disposition_changes','complete_compact_findings','racial_order_findings','prevalence_findings','coordination_findings','common_purpose_findings','graph_effects','publication_effects','adoption_effects']:
              assert progress['counts'][key]==0
          pathlib.Path('/tmp/rd06-atlas.json').write_text(json.dumps({'promoted_class_ids':ids,'open':39,'closed':3},indent=2)+'\n')
          PY
          node tools/validate-no-magic-human-gate.mjs | tee /tmp/rd06-no-magic-human.txt

      - name: Run every retained RD-06 focused check
        run: |
          set -Eeuo pipefail
          : > /tmp/rd06-focused-checks.txt
          mapfile -t files < <(find tools test -type f \( -iname '*rd06*' -o -iname '*offeror*' -o -iname '*dcgsa*' \) | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            case "$file" in
              test/*.js|test/*.mjs|tools/validate-*.mjs|tools/acquisition/*/validate-*.mjs)
                echo "RUN $file" | tee -a /tmp/rd06-focused-checks.txt
                node "$file" 2>&1 | tee -a /tmp/rd06-focused-checks.txt
                ;;
            esac
          done

      - name: Run complete repository release gate on exact main tree
        run: |
          set -Eeuo pipefail
          npm run release:check | tee /tmp/rd06-release-check.txt
          test -z "$(git status --short)"

      - name: Seal exact-main proof
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rd06-postmerge-proof
          mkdir -p /tmp/rd06-postmerge-proof
          cp /tmp/rd06-current-main.txt /tmp/rd06-postmerge-proof/main-head.txt
          cp /tmp/rd06-product-head.txt /tmp/rd06-postmerge-proof/product-head.txt
          cp /tmp/rd06-pr.json /tmp/rd06-postmerge-proof/merged-pr.json
          cp /tmp/rd06-atlas.json /tmp/rd06-postmerge-proof/atlas.json
          cp /tmp/rd06-focused-checks.txt /tmp/rd06-postmerge-proof/focused-checks.txt
          cp /tmp/rd06-release-check.txt /tmp/rd06-postmerge-proof/release-check.txt
          cp /tmp/rd06-no-magic-human.txt /tmp/rd06-postmerge-proof/no-magic-human.txt
          cp "$CLOSURE_PATH" /tmp/rd06-postmerge-proof/closure-reference.json
          cp "$PROGRESS_PATH" /tmp/rd06-postmerge-proof/wave02-progress.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-postmerge-proof')
          main=(root/'main-head.txt').read_text().strip(); product=(root/'product-head.txt').read_text().strip(); pr=json.load(open(root/'merged-pr.json'))
          receipt={'schema_version':'ssc-rd06-wave02-postmerge-proof@1','wave_id':'SSC-RD-W02','lane_id':'RD-06','class_id':'RD-06-C01','issue':791,'main_head':main,'product_head':product,'canonical_pr':pr['number'],'merge_commit':pr['mergeCommit']['oid'],'tree_identical':True,'atlas':{'open':39,'closed':3},'focused_checks_passed':True,'complete_release_gate_passed':True,'no_magic_human_gate_passed':True,'authority':{'outside_human_dependency':False,'external_contacts':0,'external_reviews':0,'reviewed_disposition_changed':False,'publication_effect':'none','adoption_effect':'none','graph_effect':'none'}}
          (root/'proof.json').write_text(json.dumps(receipt,indent=2)+'\n')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='manifest.json'):
            b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows).encode()).hexdigest()
          (root/'manifest.json').write_text(json.dumps({'schema_version':'ssc-rd06-wave02-postmerge-proof-manifest@1','entry_count':len(rows),'entries':rows,'combined_sha256':combined},indent=2)+'\n')
          print(f'RD-06 exact-main proof sealed: {combined}')
          PY
          git diff --exit-code
          test -z "$(git status --short)"

      - name: Preserve exact-main proof
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-postmerge-proof-v1
          path: /tmp/rd06-postmerge-proof
          if-no-files-found: error
          retention-days: 90
