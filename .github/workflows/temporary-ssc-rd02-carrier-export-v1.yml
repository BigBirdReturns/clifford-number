name: TEMP export exact RD-02 authored carrier

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd02-carrier-export-v1.yml'
      - '.rd02-terminal-v1/**'

permissions:
  contents: read

concurrency:
  group: temp-ssc-rd02-carrier-export-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd02-terminal-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd02-terminal-materializer-base-v1
          fetch-depth: 1
      - name: Test every plausible three-shard carrier composition
        run: |
          set -u
          out="$RUNNER_TEMP/rd02-carrier-export"
          rm -rf "$out"
          mkdir -p "$out"
          printf '%s\n' '0d845bd7783b0286f35e604e7a4a75fbd61f6458c09466f0de4d57d0d320f940' > "$out/expected-base64-sha256.txt"
          printf '%s\n' '23ef30188e1fff0b066f5e8b56585b3767c9abe830d929e6b264849e122ffbb9' > "$out/expected-zip-sha256.txt"
          find .rd02-terminal-v1/carrier -maxdepth 1 -type f -name 'part-*.b64' -print0 | sort -z | xargs -0 sha256sum > "$out/part-sha256.txt"

          test_candidate() {
            name="$1"; shift
            dir="$out/$name"
            mkdir -p "$dir"
            printf '%s\n' "$@" > "$dir/parts.txt"
            cat "$@" > "$dir/carrier.zip.b64"
            b64_sha="$(sha256sum "$dir/carrier.zip.b64" | cut -d' ' -f1)"
            printf '%s\n' "$b64_sha" > "$dir/base64-sha256.txt"
            if base64 --decode "$dir/carrier.zip.b64" > "$dir/carrier.zip" 2> "$dir/base64-stderr.txt"; then
              printf '%s\n' 0 > "$dir/base64-exit-code.txt"
              zip_sha="$(sha256sum "$dir/carrier.zip" | cut -d' ' -f1)"
              printf '%s\n' "$zip_sha" > "$dir/zip-sha256.txt"
              unzip -t "$dir/carrier.zip" > "$dir/unzip-test.txt" 2>&1
              printf '%s\n' "$?" > "$dir/unzip-exit-code.txt"
              unzip -l "$dir/carrier.zip" > "$dir/listing.txt" 2>&1 || true
              if test "$b64_sha" = '0d845bd7783b0286f35e604e7a4a75fbd61f6458c09466f0de4d57d0d320f940' && test "$zip_sha" = '23ef30188e1fff0b066f5e8b56585b3767c9abe830d929e6b264849e122ffbb9'; then
                printf '%s\n' true > "$dir/exact-match.txt"
              else
                printf '%s\n' false > "$dir/exact-match.txt"
              fi
            else
              printf '%s\n' "$?" > "$dir/base64-exit-code.txt"
              printf '%s\n' false > "$dir/exact-match.txt"
            fi
          }

          test_candidate original-tail \
            .rd02-terminal-v1/carrier/part-00.b64 \
            .rd02-terminal-v1/carrier/part-01.b64 \
            .rd02-terminal-v1/carrier/part-02.b64
          test_candidate alternate-tail \
            .rd02-terminal-v1/carrier/part-00.b64 \
            .rd02-terminal-v1/carrier/part-01.b64 \
            .rd02-terminal-v1/carrier/part-02a.b64
          test_candidate accidental-four-part \
            .rd02-terminal-v1/carrier/part-00.b64 \
            .rd02-terminal-v1/carrier/part-01.b64 \
            .rd02-terminal-v1/carrier/part-02.b64 \
            .rd02-terminal-v1/carrier/part-02a.b64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-rd02-authored-carrier-diagnostic-v3
          path: ${{ runner.temp }}/rd02-carrier-export
          if-no-files-found: error
          retention-days: 90
