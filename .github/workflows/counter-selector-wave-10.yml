name: Counter-Selector Wave 10 Batch 03 blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-10.yml'
      - 'data/project/counter-selector-wave-10-blind-review.json'
      - 'data/project/counter-selector-blind-review-b03-registry.json'
      - 'data/project/counter-selector-review-disagreement-b03-ledger.json'
      - 'data/project/counter-selector-wave-10-release-manifest.json'
      - 'schemas/counter-selector-blind-review-b03.schema.json'
      - 'docs/methods/counter-selector-blind-review-b03.md'
      - 'docs/milestones/counter-selector-wave-10.md'
      - 'tools/build-counter-selector-wave-10.mjs'
      - 'tools/validate-counter-selector-wave-10.mjs'
      - 'test/counter-selector-wave-10.test.js'
      - 'reports/core-thesis/counter-selector-wave-10/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-10-blind-review'
    paths:
      - '.github/workflows/counter-selector-wave-10.yml'
      - 'data/project/counter-selector-wave-10-blind-review.json'
      - 'data/project/counter-selector-blind-review-b03-registry.json'
      - 'data/project/counter-selector-review-disagreement-b03-ledger.json'
      - 'data/project/counter-selector-wave-10-release-manifest.json'
      - 'schemas/counter-selector-blind-review-b03.schema.json'
      - 'docs/methods/counter-selector-blind-review-b03.md'
      - 'docs/milestones/counter-selector-wave-10.md'
      - 'tools/build-counter-selector-wave-10.mjs'
      - 'tools/validate-counter-selector-wave-10.mjs'
      - 'test/counter-selector-wave-10.test.js'
      - 'reports/core-thesis/counter-selector-wave-10/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 10 products
        run: node tools/build-counter-selector-wave-10.mjs
      - name: Validate Batch 03 blind-review contract
        run: node tools/validate-counter-selector-wave-10.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-10.test.js
      - name: Require exact committed Wave 10 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-blind-review-b03-registry.json \
            data/project/counter-selector-review-disagreement-b03-ledger.json \
            data/project/counter-selector-wave-10-release-manifest.json \
            reports/core-thesis/counter-selector-wave-10/data.json \
            reports/core-thesis/counter-selector-wave-10/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 10 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-10.mjs
          node tools/validate-counter-selector-wave-10.mjs
          node test/counter-selector-wave-10.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
