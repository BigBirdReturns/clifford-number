name: Temporary install verified M-04G global circulation

on:
  push:
    branches:
      - agent/m04g-global-circulation-clean-wave-02
    paths:
      - '.github/workflows/temporary-install-m04g-global-circulation.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: m04g-global-circulation-clean-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04g-global-circulation-clean-wave-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified program artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BigBirdReturns/clifford-number/actions/artifacts/8634151471/zip \
            -o /tmp/m04g-global-program.zip
          mkdir -p /tmp/m04g-global-program
          unzip -q /tmp/m04g-global-program.zip -d /tmp/m04g-global-program
      - name: Verify manifest and install exact files
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          src=Path('/tmp/m04g-global-program')
          manifest=json.loads((src/'MANIFEST.json').read_text())
          expected={row['path']:(int(row['bytes']),row['sha256']) for row in manifest['files']}
          required={
            '.github/workflows/m04g-global-circulation.yml','build/core-thesis/global-circulation/data.json',
            'data/intake/m04g-global-circulation-sources-01.json','data/project/m04g-global-circulation-basins.json',
            'data/project/m04g-global-circulation-currents.json','data/project/m04g-global-circulation-fanout.json',
            'data/project/m04g-global-circulation-methodology.json','data/project/m04g-global-circulation-polls.json',
            'docs/methods/global-evidence-circulation.md','docs/milestones/m04g-global-circulation-wave-02.md',
            'reports/core-thesis/global-circulation/data.json','reports/core-thesis/global-circulation/index.html',
            'test/m04g-global-circulation.test.js','tools/build-m04g-global-circulation.mjs',
            'tools/refresh-m04g-global-circulation.mjs','tools/validate-m04g-global-circulation.mjs',
          }
          assert set(expected)==required,(set(expected)-required,required-set(expected))
          for rel,(size,digest) in expected.items():
            data=(src/rel).read_bytes()
            assert len(data)==size,(rel,len(data),size)
            assert hashlib.sha256(data).hexdigest()==digest,rel
            dst=Path(rel); dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src/rel,dst)
          PY
      - name: Validate focused and repository-wide contracts
        run: |
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node test/m04g-global-circulation.test.js
          node tools/refresh-m04g-global-circulation.mjs --dry-run --basin all --class all --limit 200
          npm run release:check
          git restore --staged --worktree -- . ':!/.github/workflows/temporary-install-m04g-global-circulation.yml' || true
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          src=Path('/tmp/m04g-global-program')
          manifest=json.loads((src/'MANIFEST.json').read_text())
          for row in manifest['files']:
            rel=row['path']; dst=Path(rel); dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src/rel,dst)
          PY
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node test/m04g-global-circulation.test.js
          git diff --check
      - name: Commit only permanent program
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/temporary-install-m04g-global-circulation.yml
          git add -- \
            .github/workflows/m04g-global-circulation.yml build/core-thesis/global-circulation/data.json \
            data/intake/m04g-global-circulation-sources-01.json data/project/m04g-global-circulation-basins.json \
            data/project/m04g-global-circulation-currents.json data/project/m04g-global-circulation-fanout.json \
            data/project/m04g-global-circulation-methodology.json data/project/m04g-global-circulation-polls.json \
            docs/methods/global-evidence-circulation.md docs/milestones/m04g-global-circulation-wave-02.md \
            reports/core-thesis/global-circulation/data.json reports/core-thesis/global-circulation/index.html \
            test/m04g-global-circulation.test.js tools/build-m04g-global-circulation.mjs \
            tools/refresh-m04g-global-circulation.mjs tools/validate-m04g-global-circulation.mjs
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'no permanent changes'; exit 1; }
          git commit -m 'Build proven M-04G global circulation wave 02'
          git push origin HEAD:refs/heads/agent/m04g-global-circulation-clean-wave-02
