name: TEMP execute RD-04 North Dakota FY2026 current index refresh v1

on:
  pull_request:
    branches: [agent/ssc-rd04-nd-fy2026-current-index-refresh-execution-base-v1]
    types: [opened, synchronize, reopened]
    paths: [.trigger/ssc-rd04-nd-fy2026-current-index-refresh-execution-v1.json]

permissions:
  contents: read

concurrency:
  group: temp-execute-ssc-rd04-nd-fy2026-current-index-refresh-v1
  cancel-in-progress: false

env:
  CURRENT_MAIN: aa1c0c3f741bf2fb7aa923a4008e5bc927dca032
  PROTOCOL_MERGE: 938ba049394af65e22d46cf65ec266390f589d16
  PROTOCOL_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-current-index-refresh-protocol
  PROTOCOL_MANIFEST_BLOB: b9b9a272c1fa64c48800dfd31de13eb1b1d0630c
  ROUTE_LEDGER_BLOB: 16b8d9401d40e3b96d2df959fb9b06f782951cc4
  QUERY_CONTRACT_BLOB: 1f2d67177c34b2d222614a019696bf9ef154d8da
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  BASE_BRANCH: agent/ssc-rd04-nd-fy2026-current-index-refresh-execution-base-v1
  HEAD_BRANCH: agent/ssc-rd04-nd-fy2026-current-index-refresh-execution-trigger-v1
  LOCK_BRANCH: lock/ssc-rd04-nd-fy2026-current-index-refresh-execution-v1
  WF_PATH: .github/workflows/temp-execute-ssc-rd04-nd-fy2026-current-index-refresh-v1.yml
  TRIGGER_PATH: .trigger/ssc-rd04-nd-fy2026-current-index-refresh-execution-v1.json
  ROUTE_ID: RD04-ND-FNA-TIME-LIMIT-WAIVER-INDEX-CANONICAL-2025-2029-REFRESH-2026-08-09-001
  ROUTE_URL: https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029
  EXACT_HOST: www.fna.usda.gov
  BASELINE_BODY_BYTES: '63505'
  BASELINE_BODY_SHA256: dcab625aeeebc30b1cf38dd32f67f0cb766a8e33735694b00f041e03d446476f
  MAX_BYTES: '5000000'
  OUT: /tmp/ssc-rd04-nd-fy2026-current-index-refresh-execution-v1

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-fy2026-current-index-refresh-execution-trigger-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute exact current-index refresh route once
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          O="$OUT"
          rm -rf "$O"
          mkdir -p "$O/transport"
          stage=bootstrap

          write_sums() {
            (
              cd "$O"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )
          }

          finalize() {
            local rc=$?
            trap - EXIT
            set +e
            if [[ ! -s "$O/execution-receipt.json" ]]; then
              jq -n \
                --arg stage "$stage" \
                --argjson exit_code "$rc" \
                --arg parent "$CURRENT_MAIN" \
                '{schema_version:"ssc-rd04-nd-fy2026-current-index-refresh-execution@1",
                  state:"failed_closed",
                  failed_or_final_stage:$stage,
                  exit_code:$exit_code,
                  execution_parent:$parent,
                  fixed_route_count:1,
                  terminal_route_count:0,
                  physical_requests:0,
                  result_spawned_requests:0,
                  source_admissions:0,
                  field_classifications:0,
                  field_terminalizations:0,
                  matrix_updates:0,
                  row_state_mutations:0,
                  class_closed:false,
                  additional_execution_authorized:false,
                  outside_human_dependency:false}' > "$O/execution-receipt.json"
            fi
            printf '%s\n' "$rc" > "$O/EXIT_CODE"
            printf '%s\n' "$stage" > "$O/STAGE"
            write_sums
            exit "$rc"
          }
          trap finalize EXIT

          stage=bind_topology
          B='${{ github.event.pull_request.base.sha }}'
          H='${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.ref }}' = "$BASE_BRANCH"
          test '${{ github.event.pull_request.head.ref }}' = "$HEAD_BRANCH"
          test "$(git rev-parse "$B^")" = "$CURRENT_MAIN"
          test "$(git rev-parse "$H^")" = "$B"
          test "$(git rev-list --count "$CURRENT_MAIN".."$B")" -eq 1
          test "$(git rev-list --count "$B".."$H")" -eq 1
          test "$(git diff --name-only "$CURRENT_MAIN" "$B")" = "$WF_PATH"
          test "$(git diff --name-only --diff-filter=A "$CURRENT_MAIN" "$B")" = "$WF_PATH"
          test "$(git diff --name-only "$B" "$H")" = "$TRIGGER_PATH"
          test "$(git diff --name-only --diff-filter=A "$B" "$H")" = "$TRIGGER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CURRENT_MAIN" "$B")"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$B" "$H")"
          git diff --check "$CURRENT_MAIN" "$H"
          cp "$TRIGGER_PATH" "$O/trigger.json"

          stage=bind_live_main_and_lock
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$CURRENT_MAIN"
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$MATRIX_BLOB"
          test "$(git ls-remote --heads origin "refs/heads/$LOCK_BRANCH" | awk '{print $1}')" = "$H"
          git merge-base --is-ancestor "$PROTOCOL_MERGE" "$CURRENT_MAIN"
          printf '%s\n' \
            data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication/archive-custody.json \
            data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication/current-cell-custody.json \
            data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication/member-inventory.json \
            data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication/north-dakota-disposition.json \
            data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication/product-manifest.json \
            data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication/summary.json |
            LC_ALL=C sort > "$O/expected-intervening-paths.txt"
          git diff --name-only "$PROTOCOL_MERGE" "$CURRENT_MAIN" | LC_ALL=C sort > "$O/actual-intervening-paths.txt"
          diff -u "$O/expected-intervening-paths.txt" "$O/actual-intervening-paths.txt"
          test -z "$(git diff --name-only "$PROTOCOL_MERGE" "$CURRENT_MAIN" -- "$PROTOCOL_ROOT" "$MATRIX_PATH")"
          printf '%s\n' "$CURRENT_MAIN" > "$O/main-at-start.txt"
          printf '%s\n' "$H" > "$O/execution-lock-head.txt"

          stage=authenticate_protocol
          test "$(git rev-parse "origin/main:$PROTOCOL_ROOT/product-manifest.json")" = "$PROTOCOL_MANIFEST_BLOB"
          test "$(git rev-parse "origin/main:$PROTOCOL_ROOT/route-ledger.json")" = "$ROUTE_LEDGER_BLOB"
          test "$(git rev-parse "origin/main:$PROTOCOL_ROOT/route-query-contract.json")" = "$QUERY_CONTRACT_BLOB"
          jq -e \
            --arg route "$ROUTE_ID" \
            --arg url "$ROUTE_URL" \
            --arg host "$EXACT_HOST" \
            --arg baseline "$BASELINE_BODY_SHA256" \
            --argjson baseline_bytes "$BASELINE_BODY_BYTES" \
            --argjson max "$MAX_BYTES" \
            '.schema_version=="ssc-rd04-nd-fy2026-current-index-refresh-route-ledger@1" and
             .fixed_route_count==1 and .route_executions==0 and .source_requests_executed==0 and
             [.routes[].route_id]==[$route] and [.routes[].requested_url]==[$url] and
             [.routes[].normalized_url]==[$url] and [.routes[].expected_host]==[$host] and
             [.routes[].maximum_attempts]==[1] and [.routes[].maximum_redirects]==[0] and
             [.routes[].maximum_body_bytes]==[$max] and
             [.routes[].baseline_body_bytes]==[$baseline_bytes] and
             [.routes[].baseline_body_sha256]==[$baseline] and
             [.routes[].result_spawned_requests]==[0] and
             [.routes[].automatic_source_admission]==[false] and
             [.routes[].automatic_field_classification]==[false] and
             [.routes[].automatic_row_terminalization]==[false] and
             [.routes[].automatic_class_closure]==[false]' \
            "$PROTOCOL_ROOT/route-ledger.json" > /dev/null
          jq -e \
            '.schema_version=="ssc-rd04-nd-fy2026-current-index-refresh-query-contract@1" and
             .fixed_route_count==1 and .maximum_attempts_per_route==1 and
             .maximum_total_requests==1 and .maximum_physical_requests==1 and
             .maximum_redirects_per_route==0 and .redirects_allowed==false and
             .result_spawned_requests==0 and .offline_post_capture_inspection.discovered_href_requests_allowed==0 and
             .offline_post_capture_inspection.automatic_source_admission==false and
             .offline_post_capture_inspection.automatic_field_classification==false and
             .offline_post_capture_inspection.automatic_matrix_update==false and
             .separate_never_merge_execution_carrier_required==true' \
            "$PROTOCOL_ROOT/route-query-contract.json" > /dev/null
          jq -e \
            '.schema_version=="ssc-rd04-nd-fy2026-current-index-refresh-protocol-product-manifest@1" and
             .permanent_path_count==6 and .workflow_or_transport_paths==0 and
             .semantic_counts.fixed_routes==1 and .semantic_counts.route_executions==0 and
             .semantic_counts.source_requests_executed==0 and
             .semantic_counts.source_admissions==0 and
             .semantic_counts.field_classifications==0 and
             .semantic_counts.field_terminalizations==0 and
             .semantic_counts.matrix_updates==0 and
             .semantic_counts.row_state_mutations==0 and
             .semantic_counts.class_closed==false' \
            "$PROTOCOL_ROOT/product-manifest.json" > /dev/null
          jq -e \
            --arg parent "$CURRENT_MAIN" \
            --arg matrix "$MATRIX_BLOB" \
            --arg manifest "$PROTOCOL_MANIFEST_BLOB" \
            --arg ledger "$ROUTE_LEDGER_BLOB" \
            --arg contract "$QUERY_CONTRACT_BLOB" \
            --arg route "$ROUTE_ID" \
            --arg url "$ROUTE_URL" \
            '.schema_version=="ssc-rd04-nd-fy2026-current-index-refresh-execution-trigger@1" and
             .issue==1017 and .canonical_parent==$parent and .matrix_blob==$matrix and
             .protocol_manifest_blob==$manifest and .route_ledger_blob==$ledger and
             .query_contract_blob==$contract and .route_id==$route and .url==$url and
             .execute_once==true and .maximum_followed_redirects==0 and
             .maximum_body_bytes==5000000 and .result_spawned_requests==0 and
             .automatic_source_admissions==0 and .automatic_field_classifications==0 and
             .automatic_field_terminalizations==0 and .automatic_matrix_updates==0 and
             .automatic_row_state_mutations==0 and .automatic_class_closures==0 and
             .outside_human_dependency==false' \
            "$O/trigger.json" > /dev/null
          cp "$PROTOCOL_ROOT/route-ledger.json" "$O/request-plan.json"
          cp "$PROTOCOL_ROOT/route-query-contract.json" "$O/query-contract.json"
          cp "$PROTOCOL_ROOT/product-manifest.json" "$O/protocol-manifest.json"

          stage=execute_exact_route
          python - "$ROUTE_ID" "$ROUTE_URL" "$EXACT_HOST" "$MAX_BYTES" "$BASELINE_BODY_BYTES" "$BASELINE_BODY_SHA256" "$LOCK_BRANCH" "$H" "$O" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          route_id, url, exact_host = sys.argv[1], sys.argv[2], sys.argv[3]
          max_bytes, baseline_bytes = int(sys.argv[4]), int(sys.argv[5])
          baseline_sha, lock_branch, head = sys.argv[6], sys.argv[7], sys.argv[8]
          out = pathlib.Path(sys.argv[9])

          parsed = urllib.parse.urlsplit(url)
          assert parsed.scheme == "https"
          assert parsed.hostname == exact_host
          assert not parsed.query and not parsed.fragment

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect(),
          )
          request = urllib.request.Request(
              url,
              method="GET",
              headers={
                  "User-Agent": "BigBirdReturns-RD04-bounded-index-refresh/1.0",
                  "Accept": "text/html,application/xhtml+xml;q=0.9,text/plain;q=0.8,*/*;q=0.1",
                  "Accept-Encoding": "identity",
                  "Cache-Control": "no-cache",
              },
          )

          started = time.time()
          status = None
          headers = None
          body = b""
          effective_url = url
          transport_error = None
          try:
              response = opener.open(request, timeout=90)
              status = int(response.status)
              headers = response.headers
              effective_url = response.geturl()
              body = response.read(max_bytes + 1)
          except urllib.error.HTTPError as exc:
              status = int(exc.code)
              headers = exc.headers
              effective_url = exc.geturl()
              body = exc.read(max_bytes + 1)
          except Exception as exc:
              transport_error = f"{type(exc).__name__}: {exc}"

          over_limit = len(body) > max_bytes
          if over_limit:
              body = body[:max_bytes]

          normalized_headers = [
              {"name": str(k).lower(), "value": str(v)}
              for k, v in sorted(
                  (headers.items() if headers else []),
                  key=lambda item: (str(item[0]).lower(), str(item[1])),
              )
          ]
          header_map = {row["name"]: row["value"] for row in normalized_headers}
          location = header_map.get("location")
          content_type = (header_map.get("content-type") or "").split(";", 1)[0].strip().lower() or None

          if transport_error is not None:
              terminal_state = "terminal_transport_error"
          elif over_limit:
              terminal_state = "terminal_body_limit_exceeded"
          elif status in {301, 302, 303, 307, 308}:
              terminal_state = "terminal_redirect_refused"
          elif status is not None and 200 <= status < 300 and body:
              terminal_state = "terminal_http_success_body_captured"
          elif status is not None and 200 <= status < 300:
              terminal_state = "terminal_http_success_no_body"
          else:
              terminal_state = "terminal_http_non_success"

          body_sha = hashlib.sha256(body).hexdigest()
          (out / "transport/response-body.bin").write_bytes(body)
          (out / "transport/response-headers.json").write_text(
              json.dumps(normalized_headers, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          class AnchorParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.anchors = []
                  self._href = None
                  self._parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      self._href = dict(attrs).get("href")
                      self._parts = []

              def handle_data(self, data):
                  if self._href is not None:
                      self._parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self._href is not None:
                      text = " ".join("".join(self._parts).split())
                      self.anchors.append({"text": text, "href": self._href})
                      self._href = None
                      self._parts = []

          inventory = {
              "schema_version": "ssc-rd04-nd-fy2026-current-index-refresh-inventory@1",
              "inspection_performed": False,
              "north_dakota_response_anchors": [],
              "fy2026_archive_locators": [],
              "discovered_href_requests": 0,
              "source_admissions": 0,
              "field_classifications": 0,
              "field_terminalizations": 0,
              "matrix_updates": 0,
          }
          if terminal_state == "terminal_http_success_body_captured" and content_type in {"text/html", "application/xhtml+xml"}:
              text = body.decode("utf-8", errors="replace")
              parser = AnchorParser()
              parser.feed(text)
              nd_rows = []
              archive_rows = []
              for row in parser.anchors:
                  href = row["href"] or ""
                  absolute = urllib.parse.urljoin(url, href)
                  hay = f'{row["text"]} {href}'.lower()
                  if "north dakota" in hay or re.search(r"(^|[/_-])nd([/_-]|$)", href.lower()):
                      nd_rows.append({**row, "absolute_url": absolute})
                  if "FY2026-ABAWD-State-Requests-and-Data-" in href and href.lower().endswith(".zip"):
                      archive_rows.append({**row, "absolute_url": absolute})
              inventory.update(
                  {
                      "inspection_performed": True,
                      "anchor_count": len(parser.anchors),
                      "north_dakota_response_anchors": nd_rows,
                      "north_dakota_fy2026_response_anchor_count": sum(
                          1 for row in nd_rows if "2026" in f'{row["text"]} {row["href"]}'
                      ),
                      "fy2026_archive_locators": archive_rows,
                      "fy2026_archive_locator_count": len(archive_rows),
                  }
              )
          (out / "locator-inventory.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          same_as_baseline = len(body) == baseline_bytes and body_sha == baseline_sha
          route_receipt = {
              "schema_version": "ssc-rd04-nd-fy2026-current-index-refresh-route-receipt@1",
              "route_id": route_id,
              "requested_url": url,
              "effective_url": effective_url,
              "physical_requests": 1,
              "http_status": status,
              "content_type": content_type,
              "location": location,
              "body_bytes": len(body),
              "body_sha256": body_sha,
              "baseline_body_bytes": baseline_bytes,
              "baseline_body_sha256": baseline_sha,
              "byte_identical_to_baseline": same_as_baseline,
              "followed_redirects": 0,
              "transport_error": transport_error,
              "body_limit_exceeded": over_limit,
              "elapsed_ms": int((time.time() - started) * 1000),
              "terminal_state": terminal_state,
              "result_spawned_requests": 0,
              "source_admissions": 0,
              "field_classifications": 0,
              "field_terminalizations": 0,
              "matrix_updates": 0,
              "row_state_mutations": 0,
              "class_closed": False,
              "additional_execution_authorized": False,
              "execution_lock_branch": lock_branch,
              "execution_lock_head": head,
          }
          (out / "route-receipt.json").write_text(
              json.dumps(route_receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "physical-request-ledger.json").write_text(
              json.dumps(
                  {
                      "schema_version": "ssc-rd04-physical-request-ledger@1",
                      "physical_requests": 1,
                      "requests": [
                          {
                              "ordinal": 1,
                              "method": "GET",
                              "url": url,
                              "status": status,
                              "terminal_state": terminal_state,
                          }
                      ],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          receipt = {
              "schema_version": "ssc-rd04-nd-fy2026-current-index-refresh-execution@1",
              "state": "complete",
              "failed_or_final_stage": "complete",
              "exit_code": 0,
              "execution_parent": "aa1c0c3f741bf2fb7aa923a4008e5bc927dca032",
              "execution_head": head,
              "fixed_route_count": 1,
              "terminal_route_count": 1,
              "physical_requests": 1,
              "route_terminal_state": terminal_state,
              "http_status": status,
              "body_bytes": len(body),
              "body_sha256": body_sha,
              "byte_identical_to_baseline": same_as_baseline,
              "result_spawned_requests": 0,
              "source_admissions": 0,
              "field_classifications": 0,
              "field_terminalizations": 0,
              "matrix_updates": 0,
              "row_state_mutations": 0,
              "class_closed": False,
              "cumulative_ledger_effect": "none",
              "outside_human_dependency": False,
              "publication_effect": "none",
              "adoption_effect": "none",
              "graph_effect": "none",
              "additional_execution_authorized": False,
              "next_authorized_operation": "request-free source and field adjudication of this exact terminal response only",
          }
          (out / "execution-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          stage=reconcile_finish
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CURRENT_MAIN"

          stage=complete
          printf '%s\n' 0 > "$O/EXIT_CODE"
          printf '%s\n' complete > "$O/STAGE"
          write_sums
          trap - EXIT
          (cd "$O" && sha256sum -c SHA256SUMS)

      - name: Upload terminal refresh custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-fy2026-current-index-refresh-execution-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Require terminal execution receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e '
            .state=="complete" and
            .fixed_route_count==1 and
            .terminal_route_count==1 and
            .physical_requests==1 and
            .result_spawned_requests==0 and
            .source_admissions==0 and
            .field_classifications==0 and
            .field_terminalizations==0 and
            .matrix_updates==0 and
            .row_state_mutations==0 and
            .class_closed==false and
            .additional_execution_authorized==false
          ' "$OUT/execution-receipt.json" > /dev/null
