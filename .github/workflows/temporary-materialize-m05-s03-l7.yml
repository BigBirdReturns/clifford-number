name: Temporary materialize M-05 Sprint 03 Leg 07

on:
  push:
    branches:
      - agent/m05-sprint-03-leg-07-source-ecology-v2
    paths:
      - '.github/workflows/temporary-materialize-m05-s03-l7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-07-source-ecology-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate Leg 07 into the M-05 gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.github/workflows/m05-answerable-power.yml';
          let text=fs.readFileSync(file,'utf8');
          const testPath="      - 'test/m05-answerable-power-sprint-03-leg-07.test.js'";
          if(!text.includes(testPath)){
            text=text.replaceAll("      - 'test/m05-answerable-power-sprint-03-leg-06.test.js'", "      - 'test/m05-answerable-power-sprint-03-leg-06.test.js'\n"+testPath);
          }
          const leg06='          node test/m05-answerable-power-sprint-03-leg-06.test.js';
          const leg07=[
            '          node tools/build-m05-answerable-power-sprint-03-leg-07.mjs',
            '          node tools/validate-m05-answerable-power-sprint-03-leg-07.mjs',
            '          node test/m05-answerable-power-sprint-03-leg-07.test.js'
          ].join('\n');
          if(!text.includes('node tools/build-m05-answerable-power-sprint-03-leg-07.mjs')){
            text=text.replaceAll(leg06,leg06+'\n'+leg07);
          }
          fs.writeFileSync(file,text);
          NODE
      - name: Build and validate Leg 07
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-07.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-07.mjs
          node test/m05-answerable-power-sprint-03-leg-07.test.js
      - name: Commit permanent surface and remove this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/m05-answerable-power.yml reports/core-thesis/answerable-power/sprint-03-leg-07.json reports/core-thesis/answerable-power/sprint-03-leg-07.html
          git rm -f .github/workflows/temporary-materialize-m05-s03-l7.yml
          git commit -m 'Build M-05 Sprint 03 Leg 07 products'
          git push origin HEAD:agent/m05-sprint-03-leg-07-source-ecology-v2
