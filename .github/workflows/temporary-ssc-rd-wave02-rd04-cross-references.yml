name: TEMP derive SSC RD-04-C01 version cross-references v2

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd-wave02-rd04-cross-references.yml'
      - 'data/intake/status-sovereignty-rd-wave02-rd04-version-history/seed-capture-receipt.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd04-version-history/cross-reference-receipt.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd04-version-history/cross-reference-parser-repair.json'
      - 'tools/acquisition/status-sovereignty-rd-wave02-rd04/derive-version-cross-references.mjs'
      - 'test/status-sovereignty-rd-wave02-rd04-cross-reference.test.js'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ssc-rd-wave02-rd04-cross-references-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact PDF text extraction dependency
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Download exact fourteen-source seed artifact
        uses: actions/download-artifact@v4
        with:
          name: ssc-rd-wave02-rd04-version-seed
          path: /tmp/rd04-version-seed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30765064506
      - name: Download superseded v1 cross-reference artifact
        uses: actions/download-artifact@v4
        with:
          name: ssc-rd-wave02-rd04-version-cross-references
          path: /tmp/rd04-cross-references-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30765689103
      - name: Derive corrected immutable cross-reference denominator
        env:
          RD04_REPOSITORY_ROOT: ${{ github.workspace }}
          RD04_VERSION_ARTIFACT: /tmp/rd04-version-seed
          RD04_CROSSREF_V1_ARTIFACT: /tmp/rd04-cross-references-v1
          RD04_CROSSREF_OUTPUT: /tmp/rd04-cross-references-v2
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node test/status-sovereignty-rd-wave02-rd04-cross-reference.test.js
          node tools/acquisition/status-sovereignty-rd-wave02-rd04/derive-version-cross-references.mjs
          test -f /tmp/rd04-cross-references-v2/registry.json
          test -f /tmp/rd04-cross-references-v2/delta.json
          test -f /tmp/rd04-cross-references-v2/receipt.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('/tmp/rd04-cross-references-v2/registry.json', 'utf8'));
          const expected = {
            source_units: 14,
            source_units_extracted: 13,
            source_units_unresolved: 1,
            reference_occurrences: 660,
            unique_reference_ids: 154,
            seed_alias_reference_ids: 14,
            new_cross_reference_candidates: 140,
            v1_reference_ids_preserved: 101,
            v1_reference_ids_typed_superseded: 2,
            v2_reference_ids_added: 53,
            version_edges_adjudicated: 0,
            class_closed: 0,
            external_contacts: 0,
            external_reviews: 0,
            graph_effects: 0,
            publication_effects: 0
          };
          for (const [key, value] of Object.entries(expected)) {
            if (registry.counts?.[key] !== value) throw new Error(`${key}: ${registry.counts?.[key]} != ${value}`);
          }
          const ids = new Set(registry.references.map((row) => row.reference_id));
          for (const required of [
            '25-USC-1603(13)',
            '45-CFR-164.502(a)(5)',
            '7-CFR-273.24(b)(2)',
            'CA-ACL-15-08',
            'CA-HSC-123110(d)(1)',
            'CA-HSC-1231110(d)(1)',
            'CA-MPP-63-407',
            'CA-WIC-11403(b)(4)',
            'US-FNA-2008-SEC-6(o)',
            'US-FRA-2023-SEC-311-312',
            'US-TRADE-ACT-1974-SEC-236'
          ]) {
            if (!ids.has(required)) throw new Error(`required repaired ID missing: ${required}`);
          }
          if (ids.has('7-CFR-273.24(b)')) throw new Error('truncated wrapped CFR ID survived repair');
          if (ids.has('CA-WIC-11403')) throw new Error('subsection-discarding WIC ID survived repair');
          if (registry.current_result?.parser_repair_complete !== true) throw new Error('parser repair not terminal');
          if (registry.current_result?.corrected_cross_reference_denominator_frozen !== true) throw new Error('corrected denominator not frozen');
          if (registry.current_result?.version_edge_adjudication_complete !== false) throw new Error('version-edge adjudication escalated');
          if (registry.current_result?.class_closed !== false) throw new Error('class closure escalated');
          if (registry.boundaries?.reference_occurrence_is_version_edge !== false) throw new Error('reference occurrence promoted to version edge');
          if (registry.boundaries?.unresolved_statute_page_is_missing_law !== false) throw new Error('HTTP 403 promoted to missing law');
          console.log('corrected cross-reference denominator and authority ceiling: PASS');
          NODE
      - name: Upload corrected cross-reference registry
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave02-rd04-version-cross-references-v2
          path: /tmp/rd04-cross-references-v2
          if-no-files-found: error
          retention-days: 90
