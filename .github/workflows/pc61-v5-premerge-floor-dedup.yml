name: PC-61 v5 premerge floor-v59 deduplication

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc61-v5-premerge-floor-dedup.yml'

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pc61-v5-premerge-floor-dedup
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPOSITORY: ${{ github.repository }}
  TARGET_BRANCH: 'agent/pc61-terminal-reconcile-v5'
  TARGET_PATH: '.github/workflows/pc61-terminal-reconciler-v5.yml'
  SOURCE_BLOB: 'c90f51ca2764e67ecd49dbd4dabc6636cbb7f925'
  OUT: '/tmp/pc61-v5-premerge-floor-dedup'

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pc61-terminal-reconcile-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Stage exact floor-v59 replay deduplication
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          gh api --method GET "/repos/$GH_REPOSITORY/contents/$TARGET_PATH" -f ref="$TARGET_BRANCH" > "$OUT/content-before.json"
          before_blob=$(jq -r .sha "$OUT/content-before.json")
          test "$before_blob" = "$SOURCE_BLOB"
          jq -r .content "$OUT/content-before.json" | tr -d '\n' | base64 -d > "$OUT/before.yml"
          test "$(git hash-object "$OUT/before.yml")" = "$SOURCE_BLOB"

          python - "$OUT/before.yml" "$OUT/after.yml" <<'PY'
          from pathlib import Path
          import sys

          source=Path(sys.argv[1]).read_text()
          marker='          } 2>&1 | tee "$WORK/product-replay.log"'
          if source.count(marker)!=1:
              raise SystemExit(f'premerge replay sink denominator {source.count(marker)} != 1')
          before,after=source.split(marker,1)
          floor_lines=[
              '            node "$floor_compile"\n',
              '            node "$floor_validate"\n',
              '            node "$floor_test"\n',
          ]
          for line in floor_lines:
              if before.count(line)!=1:
                  raise SystemExit(f'premerge floor command denominator {line.strip()}={before.count(line)}')
              before=before.replace(line,'',1)
          anchor='            node "$standalone_test"\n'
          replacement=anchor+"            printf '%s\\n' 'Preference custody laboratory floor v59: exact-head workflow required; canonical rerun required post-merge'\n"
          if before.count(anchor)!=1:
              raise SystemExit('standalone test anchor denominator mismatch')
          before=before.replace(anchor,replacement,1)
          source=before+marker+after

          old_receipt='\n'.join([
              '          test "$(jq -r \'.[0].conclusion\' "$WORK/release-workflow.json")" = success',
              '',
              '          gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$PRODUCT_PR/comments?per_page=100" > "$WORK/comment-pages.json"',
          ])
          new_receipt='\n'.join([
              '          test "$(jq -r \'.[0].conclusion\' "$WORK/release-workflow.json")" = success',
              '          jq \'[.[] | select(.name=="Preference custody laboratory floor v59")]\' "$WORK/matrix.json" > "$WORK/floor-v59-workflow.json"',
              '          test "$(jq \'length\' "$WORK/floor-v59-workflow.json")" -eq 1',
              '          test "$(jq -r \'.[0].status\' "$WORK/floor-v59-workflow.json")" = completed',
              '          test "$(jq -r \'.[0].conclusion\' "$WORK/floor-v59-workflow.json")" = success',
              '',
              '          gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$PRODUCT_PR/comments?per_page=100" > "$WORK/comment-pages.json"',
          ])
          if source.count(old_receipt)!=1:
              raise SystemExit(f'floor-v59 receipt insertion denominator {source.count(old_receipt)} != 1')
          source=source.replace(old_receipt,new_receipt,1)

          old_proof='\n'.join([
              '          cp "$WORK/release-workflow.json" "$PROOF/exact-head-release-workflow.json"',
              '          cp "$WORK/codex-terminal-comments.json" "$PROOF/codex-terminal-comments.json"',
          ])
          new_proof='\n'.join([
              '          cp "$WORK/release-workflow.json" "$PROOF/exact-head-release-workflow.json"',
              '          cp "$WORK/floor-v59-workflow.json" "$PROOF/exact-head-floor-v59-workflow.json"',
              '          cp "$WORK/codex-terminal-comments.json" "$PROOF/codex-terminal-comments.json"',
          ])
          if source.count(old_proof)!=1:
              raise SystemExit(f'proof floor-v59 receipt denominator {source.count(old_proof)} != 1')
          source=source.replace(old_proof,new_proof,1)

          canonical=source.split('          } 2>&1 | tee "$PROOF/canonical-replay.log"',1)[0].rsplit('          {',1)[1]
          for line in floor_lines:
              if canonical.count(line)!=1:
                  raise SystemExit(f'canonical floor command not retained: {line.strip()}')
          if canonical.count('            npm run release:check\n')!=1:
              raise SystemExit('canonical release invocation not retained')
          Path(sys.argv[2]).write_text(source)
          PY

          python - "$OUT/after.yml" <<'PY'
          from pathlib import Path
          import sys,yaml
          document=yaml.safe_load(Path(sys.argv[1]).read_text())
          if document['jobs']['reconcile']['timeout-minutes'] != 360: raise SystemExit('timeout mismatch')
          if document['concurrency']['cancel-in-progress'] is not True: raise SystemExit('superseding concurrency mismatch')
          PY
          diff -u "$OUT/before.yml" "$OUT/after.yml" > "$OUT/exact.patch" || test "$?" = 1
          target_blob=$(git hash-object "$OUT/after.yml")
          target_sha256=$(sha256sum "$OUT/after.yml" | awk '{print $1}')
          encoded=$(base64 -w0 "$OUT/after.yml")
          gh api --method POST "/repos/$GH_REPOSITORY/git/blobs" -f content="$encoded" -f encoding=base64 > "$OUT/blob-response.json"
          test "$(jq -r .sha "$OUT/blob-response.json")" = "$target_blob"
          gh api "/repos/$GH_REPOSITORY/git/blobs/$target_blob" > "$OUT/remote-blob.json"
          jq -r .content "$OUT/remote-blob.json" | tr -d '\n' | base64 -d > "$OUT/remote-after.yml"
          cmp "$OUT/after.yml" "$OUT/remote-after.yml"
          jq -n --arg schema_version 'pc61-v5-premerge-floor-dedup@1' --arg status complete --arg source_blob "$SOURCE_BLOB" --arg target_blob "$target_blob" --arg target_sha256 "$target_sha256" '{schema_version:$schema_version,status:$status,source_blob:$source_blob,target_blob:$target_blob,target_sha256:$target_sha256,change_denominator:{redundant_premerge_floor_v59_commands_removed:3,named_exact_head_floor_v59_receipts_added:1,canonical_postmerge_floor_v59_commands_retained:3,canonical_postmerge_release_invocations_retained:1},substantive_gate_effect:{exact_head_floor_v59_required:true,canonical_postmerge_floor_v59_required:true,canonical_postmerge_release_required:true,floor_gate_weakened:false},product_semantics_changed:false,graph_effect:"none"}' > "$OUT/receipt.json"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve floor-v59 deduplication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc61-v5-premerge-floor-dedup
          path: /tmp/pc61-v5-premerge-floor-dedup
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
