name: PC-61 v5 exact-head matrix denominator repair

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc61-v5-premerge-floor-dedup.yml'

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pc61-v5-matrix-denominator-repair
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPOSITORY: ${{ github.repository }}
  TARGET_BRANCH: 'agent/pc61-terminal-reconcile-v5'
  TARGET_PATH: '.github/workflows/pc61-terminal-reconciler-v5.yml'
  SOURCE_BLOB: 'e276ee81a5dbc73dd9c51c12d6267ecfd202a256'
  OUT: '/tmp/pc61-v5-matrix-denominator-repair'

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pc61-terminal-reconcile-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Stage exact 54-run matrix observer repair
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          gh api --method GET "/repos/$GH_REPOSITORY/contents/$TARGET_PATH" -f ref="$TARGET_BRANCH" > "$OUT/content-before.json"
          before_blob=$(jq -r .sha "$OUT/content-before.json")
          test "$before_blob" = "$SOURCE_BLOB"
          jq -r .content "$OUT/content-before.json" | tr -d '\n' | base64 -d > "$OUT/before.yml"
          test "$(git hash-object "$OUT/before.yml")" = "$SOURCE_BLOB"

          python - "$OUT/before.yml" "$OUT/after.yml" <<'PY'
          from pathlib import Path
          import sys

          source=Path(sys.argv[1]).read_text()
          replacements={
              "  MINIMUM_MATRIX: '55'\n":"  EXPECTED_MATRIX: '54'\n",
              '            [ "$matrix_count" -ge "$MINIMUM_MATRIX" ] && [ "$pending" -eq 0 ] && break\n':'            [ "$matrix_count" -eq "$EXPECTED_MATRIX" ] && [ "$pending" -eq 0 ] && break\n',
              '          test "$matrix_count" -ge "$MINIMUM_MATRIX"\n':'          test "$matrix_count" -eq "$EXPECTED_MATRIX"\n',
              'minimum_workflow_matrix:55':'minimum_workflow_matrix:54',
          }
          for old,new in replacements.items():
              if source.count(old)!=1:
                  raise SystemExit(f'exact replacement denominator {old!r}={source.count(old)}')
              source=source.replace(old,new,1)

          anchor='\n'.join([
              '          test "$(jq -r \'.[0].conclusion\' "$WORK/floor-v59-workflow.json")" = success',
              '',
              '          gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$PRODUCT_PR/comments?per_page=100" > "$WORK/comment-pages.json"',
          ])
          replacement='\n'.join([
              '          test "$(jq -r \'.[0].conclusion\' "$WORK/floor-v59-workflow.json")" = success',
              '          jq \'[.[] | select(.name=="Preference custody laboratory floor v58")]\' "$WORK/matrix.json" > "$WORK/floor-v58-workflow.json"',
              '          test "$(jq \'length\' "$WORK/floor-v58-workflow.json")" -eq 0',
              '          grep -Fq "name: Preference custody laboratory floor v58" "$REPLAY/.github/workflows/preference-custody-v58.yml"',
              '          test "$(grep -cF \'preference-custody-v59\' "$REPLAY/.github/workflows/preference-custody-v58.yml" || true)" -eq 0',
              '          test "$(grep -cF \'owner-login-unicode-casefold-alias-reuse\' "$REPLAY/.github/workflows/preference-custody-v58.yml" || true)" -eq 0',
              '          grep -Fq "from \'./preference-custody-manifest-v58.mjs\';" "$REPLAY/tools/lib/preference-custody-manifest-v59.mjs"',
              '          grep -Fq \'validatePreferenceCustodyManifestV58Build\' "$REPLAY/tools/lib/preference-custody-manifest-v59.mjs"',
              '          jq -n --argjson expected "$EXPECTED_MATRIX" --argjson observed "$matrix_count" \'{schema_version:"pc61-exact-head-matrix-basis@1",expected_workflows:$expected,observed_workflows:$observed,floor_v58:{exact_head_run_expected:false,exact_head_run_observed:false,inherited_path_scoped_workflow:true},floor_v59:{exact_head_run_required:true,recursively_validates_v58:true},release_checks:{exact_head_run_required:true}}\' > "$WORK/matrix-basis.json"',
              '',
              '          gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$PRODUCT_PR/comments?per_page=100" > "$WORK/comment-pages.json"',
          ])
          if source.count(anchor)!=1:
              raise SystemExit(f'v58 basis insertion denominator {source.count(anchor)} != 1')
          source=source.replace(anchor,replacement,1)

          proof_anchor='\n'.join([
              '          cp "$WORK/floor-v59-workflow.json" "$PROOF/exact-head-floor-v59-workflow.json"',
              '          cp "$WORK/codex-terminal-comments.json" "$PROOF/codex-terminal-comments.json"',
          ])
          proof_replacement='\n'.join([
              '          cp "$WORK/floor-v59-workflow.json" "$PROOF/exact-head-floor-v59-workflow.json"',
              '          cp "$WORK/floor-v58-workflow.json" "$PROOF/exact-head-floor-v58-workflow.json"',
              '          cp "$WORK/matrix-basis.json" "$PROOF/exact-head-matrix-basis.json"',
              '          cp "$WORK/codex-terminal-comments.json" "$PROOF/codex-terminal-comments.json"',
          ])
          if source.count(proof_anchor)!=1:
              raise SystemExit(f'proof matrix-basis insertion denominator {source.count(proof_anchor)} != 1')
          source=source.replace(proof_anchor,proof_replacement,1)

          if source.count('EXPECTED_MATRIX')!=3:
              raise SystemExit(f'EXPECTED_MATRIX usage denominator {source.count("EXPECTED_MATRIX")} != 3')
          if 'MINIMUM_MATRIX' in source:
              raise SystemExit('stale MINIMUM_MATRIX remains')
          Path(sys.argv[2]).write_text(source)
          PY

          python - "$OUT/after.yml" <<'PY'
          from pathlib import Path
          import sys,yaml
          document=yaml.safe_load(Path(sys.argv[1]).read_text())
          if document['env']['EXPECTED_MATRIX'] != '54': raise SystemExit('expected matrix mismatch')
          if document['jobs']['reconcile']['timeout-minutes'] != 360: raise SystemExit('timeout mismatch')
          if document['concurrency']['cancel-in-progress'] is not True: raise SystemExit('superseding concurrency mismatch')
          PY

          diff -u "$OUT/before.yml" "$OUT/after.yml" > "$OUT/exact.patch" || test "$?" = 1
          target_blob=$(git hash-object "$OUT/after.yml")
          target_sha256=$(sha256sum "$OUT/after.yml" | awk '{print $1}')
          encoded=$(base64 -w0 "$OUT/after.yml")
          gh api --method POST "/repos/$GH_REPOSITORY/git/blobs" -f content="$encoded" -f encoding=base64 > "$OUT/blob-response.json"
          test "$(jq -r .sha "$OUT/blob-response.json")" = "$target_blob"
          gh api "/repos/$GH_REPOSITORY/git/blobs/$target_blob" > "$OUT/remote-blob.json"
          jq -r .content "$OUT/remote-blob.json" | tr -d '\n' | base64 -d > "$OUT/remote-after.yml"
          cmp "$OUT/after.yml" "$OUT/remote-after.yml"

          jq -n --arg schema_version 'pc61-v5-matrix-denominator-repair@1' --arg status complete --arg source_blob "$SOURCE_BLOB" --arg target_blob "$target_blob" --arg target_sha256 "$target_sha256" '{schema_version:$schema_version,status:$status,source_blob:$source_blob,target_blob:$target_blob,target_sha256:$target_sha256,observer:{expected_exact_head_workflows:54,floor_v58_exact_head_run_expected:false,floor_v59_exact_head_run_required:true,floor_v59_recursively_validates_v58:true,release_exact_head_run_required:true},substantive_gate_effect:{qualification_weakened:false,canonical_postmerge_floor_v59_required:true,canonical_postmerge_release_required:true},product_semantics_changed:false,graph_effect:"none"}' > "$OUT/receipt.json"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve matrix denominator repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc61-v5-matrix-denominator-repair
          path: /tmp/pc61-v5-matrix-denominator-repair
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
