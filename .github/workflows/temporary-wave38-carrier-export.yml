name: Temporary Wave 38 carrier export

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave38-carrier-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-priority-one-execution-wave-38
          fetch-depth: 1

      - name: Verify and stage exact carriers
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/tmp/wave38-source.b64
          test -f .github/tmp/wave38-materializer-v2.sh.b64
          sha256sum \
            .github/tmp/wave38-source.b64 \
            .github/tmp/wave38-materializer-v2.sh.b64 \
            > /tmp/wave38-carrier-sha256.txt
          cp .github/tmp/wave38-source.b64 /tmp/
          cp .github/tmp/wave38-materializer-v2.sh.b64 /tmp/
          cat /tmp/wave38-carrier-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wave38-carriers
          path: |
            /tmp/wave38-source.b64
            /tmp/wave38-materializer-v2.sh.b64
            /tmp/wave38-carrier-sha256.txt
          if-no-files-found: error
          retention-days: 1
