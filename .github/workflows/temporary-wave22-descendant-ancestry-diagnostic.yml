name: Temporary Wave 22 descendant ancestry diagnostic

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/tmp/wave22-descendant-ancestry-diagnostic-trigger.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Test targeted full-history recovery
        shell: bash
        run: |
          set -euo pipefail
          base='ec730441e4779b24226f12f556707f4a89b7fe3f'
          remote_head="refs/remotes/origin/${GITHUB_HEAD_REF}"
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "shallow_before=$(git rev-parse --is-shallow-repository)"
          git fetch --no-tags --unshallow origin \
            "+refs/heads/${GITHUB_HEAD_REF}:${remote_head}"
          echo "shallow_after=$(git rev-parse --is-shallow-repository)"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" "$remote_head"
          echo 'targeted_unshallow_ancestry=passed'
