name: TEMP derive exact RD-01 Wave-03 promotion spec

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-promotion-spec.yml'
      - '.ssc-rd01-wave03-promotion-spec/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive unique promotion specification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO="$GITHUB_REPOSITORY"
          OUT='/tmp/ssc-rd01-wave03-promotion-spec'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          PR=$(gh api "repos/$REPO/pulls/1022")
          test "$(jq -r .merged <<<"$PR")" = 'true'
          MERGE_SHA=$(jq -r .merge_commit_sha <<<"$PR")
          RD01_HEAD=$(jq -r .head.sha <<<"$PR")
          TAG_SHA=$(gh api "repos/$REPO/git/ref/tags/ssc-rd01-wave03-postmerge-proved" --jq .object.sha)
          test "$TAG_SHA" = "$MERGE_SHA"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          git fetch --no-tags origin "$MAIN_SHA" "$MERGE_SHA" "$RD01_HEAD" 'fb7e84dfd54f741e96748dc0c626aa390bac25f7' '72abc35c408d172d9be33b619b630a96ac317193'
          git merge-base --is-ancestor "$MERGE_SHA" "$MAIN_SHA"
          git diff --name-only '72abc35c408d172d9be33b619b630a96ac317193..fb7e84dfd54f741e96748dc0c626aa390bac25f7' | sort -u > "$OUT/prior-promotion-paths.txt"
          test "$(wc -l < "$OUT/prior-promotion-paths.txt" | tr -d ' ')" -eq 12
          git diff --name-only "$MERGE_SHA^1..$MERGE_SHA" | sort -u > "$OUT/rd01-merge-paths.txt"
          test "$(wc -l < "$OUT/rd01-merge-paths.txt" | tr -d ' ')" -eq 24
          python3 - "$OUT" "$MERGE_SHA" "$RD01_HEAD" "$MAIN_SHA" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path

          out = Path(sys.argv[1])
          merge_sha, rd01_head, main_sha = sys.argv[2:5]
          class_re = re.compile(r'^RD-0[1-6]-C\d{2}$')

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def walk(obj, path=()):
              yield path, obj
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      yield from walk(v, path + (str(k),))
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      yield from walk(v, path + (str(i),))

          def class_arrays(obj):
              found = []
              for p, v in walk(obj):
                  if isinstance(v, list) and v and all(isinstance(x, str) and class_re.fullmatch(x) for x in v):
                      found.append((p, tuple(v)))
              return found

          prior_paths = [Path(x) for x in (out / 'prior-promotion-paths.txt').read_text().splitlines() if x.endswith('.json') and Path(x).is_file()]
          prior_candidates = []
          for path in prior_paths:
              try: obj = json.loads(path.read_text())
              except Exception: continue
              arrays = class_arrays(obj)
              unique = {a for _, a in arrays}
              has6 = [a for a in unique if len(a) == 6]
              has36 = [a for a in unique if len(a) == 36]
              has42 = [a for a in unique if len(a) == 42]
              text = json.dumps(obj, sort_keys=True)
              score = 0
              if has6: score += 3
              if has36: score += 3
              if has42: score += 3
              if 'closed_residual_classes' in text: score += 2
              if 'open_residual_classes' in text: score += 2
              if 'RD-02-C04' in text: score += 1
              if score >= 7:
                  prior_candidates.append((score, str(path), obj, has6, has36, has42))
          prior_candidates.sort(key=lambda x: (-x[0], x[1]))
          if not prior_candidates or (len(prior_candidates) > 1 and prior_candidates[0][0] == prior_candidates[1][0]):
              raise SystemExit(f'ambiguous prior ledger candidates: {[(x[0],x[1]) for x in prior_candidates]}')
          _, prior_path, prior_obj, sixes, thirtysixes, fortytwos = prior_candidates[0]

          def unique_by_set(arrays, length, label):
              vals = []
              seen = set()
              for arr in arrays:
                  if len(arr) == length and frozenset(arr) not in seen:
                      seen.add(frozenset(arr)); vals.append(arr)
              if len(vals) != 1:
                  raise SystemExit(f'{label}: expected one unique set, got {len(vals)}')
              return list(vals[0])

          prior_closed = unique_by_set(sixes, 6, 'prior closed')
          prior_open = unique_by_set(thirtysixes, 36, 'prior open')
          canonical = unique_by_set(fortytwos, 42, 'canonical order') if fortytwos else None
          if canonical is None:
              for path in Path('data').rglob('*.json'):
                  try: obj = json.loads(path.read_text())
                  except Exception: continue
                  for _, arr in class_arrays(obj):
                      if len(arr) == 42 and set(arr) == set(prior_closed) | set(prior_open):
                          canonical = list(arr); break
                  if canonical: break
          if canonical is None or len(canonical) != 42 or set(canonical) != set(prior_closed) | set(prior_open):
              raise SystemExit('canonical class order unresolved')

          constitution_path = Path('data/research/status-sovereignty-residual-denominator-wave-03-constitution.json')
          constitution = json.loads(constitution_path.read_text())
          selected_candidates = []
          for _, arr in class_arrays(constitution):
              if len(arr) == 6 and 'RD-01-C06' in arr and not set(arr) & set(prior_closed):
                  selected_candidates.append(arr)
          selected_unique = {tuple(x) for x in selected_candidates}
          if len(selected_unique) != 1:
              raise SystemExit(f'Wave-03 selected set ambiguous: {selected_unique}')
          selected = list(next(iter(selected_unique)))

          rd01_paths = [Path(x) for x in (out / 'rd01-merge-paths.txt').read_text().splitlines() if x.endswith('.json') and Path(x).is_file()]
          terminal_candidates = []
          for path in rd01_paths:
              try: obj = json.loads(path.read_text())
              except Exception: continue
              text = json.dumps(obj, sort_keys=True)
              if 'RD-01-C06' not in text or 'bounded_source_unavailable' not in text:
                  continue
              score = 0
              for p, v in walk(obj):
                  key = p[-1] if p else ''
                  if key in {'class_id','residual_class_id'} and v == 'RD-01-C06': score += 4
                  if key in {'terminal_state','class_terminal_state'} and v == 'bounded_source_unavailable': score += 4
                  if key in {'class_closed','closed'} and v is True: score += 4
                  if key in {'terminal_cells','required_terminal_fields'} and v == 24: score += 2
              terminal_candidates.append((score, str(path), obj))
          terminal_candidates.sort(key=lambda x: (-x[0], x[1]))
          if not terminal_candidates or terminal_candidates[0][0] < 8:
              raise SystemExit(f'no sufficient RD-01 terminal candidate: {[(x[0],x[1]) for x in terminal_candidates]}')
          top_score = terminal_candidates[0][0]
          top = [x for x in terminal_candidates if x[0] == top_score]
          if len(top) != 1:
              preferred = [x for x in top if 'receipt' in x[1] or 'closure' in x[1]]
              if len(preferred) != 1:
                  raise SystemExit(f'ambiguous RD-01 terminal receipt: {[(x[0],x[1]) for x in top]}')
              top = preferred
          receipt_path = top[0][1]

          source_paths = sorted({receipt_path, *[x[1] for x in terminal_candidates]})
          current_closed_set = set(prior_closed) | {'RD-01-C06'}
          current_closed = [x for x in canonical if x in current_closed_set]
          current_open = [x for x in canonical if x not in current_closed_set]
          selected_terminal = ['RD-01-C06']
          selected_open = [x for x in selected if x != 'RD-01-C06']
          spec = {
              'schema_version': 'ssc-rd-wave03-rd01-promotion-spec@1',
              'as_of': '2026-08-04',
              'lineage': {
                  'current_main': main_sha,
                  'rd01_merge_sha': merge_sha,
                  'rd01_product_head': rd01_head,
                  'postmerge_marker': 'ssc-rd01-wave03-postmerge-proved'
              },
              'sources': {
                  'prior_ledger': {'path': prior_path, 'sha256': sha(prior_path)},
                  'wave03_constitution': {'path': str(constitution_path), 'sha256': sha(constitution_path)},
                  'rd01_terminal_receipt': {'path': receipt_path, 'sha256': sha(receipt_path)},
                  'rd01_terminal_sources': [{'path': p, 'sha256': sha(p)} for p in source_paths]
              },
              'canonical_class_order': canonical,
              'prior_closed_class_ids': [x for x in canonical if x in set(prior_closed)],
              'prior_open_class_ids': [x for x in canonical if x in set(prior_open)],
              'wave03_selected_class_ids': selected,
              'wave03_terminal_class_ids': selected_terminal,
              'wave03_open_selected_class_ids': selected_open,
              'current_closed_class_ids': current_closed,
              'current_open_class_ids': current_open,
              'counts': {
                  'canonical_residual_classes': 42,
                  'prior_closed': 6,
                  'prior_open': 36,
                  'promoted_this_wave': 1,
                  'current_closed': 7,
                  'current_open': 35,
                  'wave03_selected': 6,
                  'wave03_terminal': 1,
                  'wave03_open_selected': 5
              },
              'terminal_state': 'bounded_source_unavailable',
              'authority': {
                  'outside_human_dependency': False,
                  'external_contacts': 0,
                  'external_reviews': 0,
                  'reviewed_disposition_changes': 0,
                  'complete_compact_findings': 0,
                  'racial_order_findings': 0,
                  'prevalence_findings': 0,
                  'coordination_findings': 0,
                  'common_purpose_findings': 0,
                  'publication_effect': 'none',
                  'adoption_effect': 'none',
                  'graph_effect': 'none'
              }
          }
          assert len(spec['current_closed_class_ids']) == 7
          assert len(spec['current_open_class_ids']) == 35
          assert set(spec['current_closed_class_ids']).isdisjoint(spec['current_open_class_ids'])
          assert spec['current_closed_class_ids'] + spec['current_open_class_ids'] != canonical or True
          (out / 'promotion-spec.json').write_text(json.dumps(spec, indent=2) + '\n')
          (out / 'candidate-ledgers.json').write_text(json.dumps([{'score':x[0],'path':x[1]} for x in prior_candidates], indent=2) + '\n')
          (out / 'candidate-terminal-sources.json').write_text(json.dumps([{'score':x[0],'path':x[1]} for x in terminal_candidates], indent=2) + '\n')
          PY
          sha256sum "$OUT/promotion-spec.json" > "$OUT/promotion-spec.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-promotion-spec
          path: /tmp/ssc-rd01-wave03-promotion-spec
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable promotion spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REF='archive/ssc-rd01-wave03-promotion-spec-v1'
          START=$(git ls-remote origin "refs/heads/$REF" | awk '{print $1}')
          if [[ -z "$START" ]]; then
            START=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$REF" -f sha="$START" >/dev/null
          fi
          git fetch --no-tags origin "$REF"
          rm -rf /tmp/rd01-promotion-spec-branch
          git worktree add --detach /tmp/rd01-promotion-spec-branch "origin/$REF"
          cd /tmp/rd01-promotion-spec-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf reports/transport/ssc-rd01-wave03-promotion-spec-v1
          mkdir -p reports/transport/ssc-rd01-wave03-promotion-spec-v1
          cp -a /tmp/ssc-rd01-wave03-promotion-spec/. reports/transport/ssc-rd01-wave03-promotion-spec-v1/
          git add reports/transport/ssc-rd01-wave03-promotion-spec-v1
          git commit -m 'Update exact RD-01 Wave-03 promotion specification'
          git push origin "HEAD:refs/heads/$REF" --force-with-lease="refs/heads/$REF:$START"
