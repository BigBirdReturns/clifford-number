name: Temporary materialize production Commit A

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-production-commit-a.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-convergence-origin-custody
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve exact production bundle from bounded Drive custody
        run: |
          python3 -m pip install --disable-pip-version-check --quiet gdown
          gdown \
            'https://drive.google.com/file/d/1EVCn5Y5A3E-sUmEjXwE90ovdLrdLyXnw/view?usp=drivesdk' \
            --output /tmp/commitA.bundle.xz
          file /tmp/commitA.bundle.xz
          stat -c 'bytes=%s' /tmp/commitA.bundle.xz
          sha256sum /tmp/commitA.bundle.xz
          echo '6a2131f43e82817f943a777519a5f825fb45afba26686be4e438b5797a54f2f5  /tmp/commitA.bundle.xz' | sha256sum --check
          xz --test /tmp/commitA.bundle.xz
