name: Temporary PR2176 exact-head review repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - '.github/workflows/temporary-pr2176-exact-head-review-repair.yml'

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-exact-head-review-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a451ce9bcee8577b90b82d8df5af1755660609a4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-exact-head-review-repair.yml"
      - name: Apply both exact-head review fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')

          old_extension_patterns = r'''const PHONE_EXTENSION_PATTERN = /(\[contact omitted\][\s,;:()（）\-–—]*(?:(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?\s*)|(?:内線(?:番号)?\s*[:：#＃]?\s*)|(?:[#＃]\s*)))[0-9０-９]+(?:[()./／\s\-‐‑‒–—−－．（）]+[0-9０-９]+)*/giu;
          const PHONE_EXTENSION_SUFFIX_PATTERN = /^\s*[,;:()（）\-–—]*(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?|内線(?:番号)?\s*[:：#＃]?|[#＃])\s*[0-9０-９]/iu;'''
          new_extension_patterns = r'''const PHONE_EXTENSION_PATTERN = /(\[contact omitted\][\s,;:()（）\-–—]*(?:(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?\s*)|(?:内線(?:番号)?\s*[:：#＃]?\s*)|(?:[#＃]\s*))(?:[（(]\s*)?)[0-9０-９]+(?:[()./／\s\-‐‑‒–—−－．（）]+[0-9０-９]+)*/giu;
          const PHONE_EXTENSION_SUFFIX_PATTERN = /^\s*[,;:()（）\-–—]*(?:(?:ext(?:ension)?|x)\s*[.:#：＃]?|内線(?:番号)?\s*[:：#＃]?|[#＃])\s*(?:[（(]\s*)?[0-9０-９]/iu;'''
          if library.count(old_extension_patterns) != 1:
              raise SystemExit('extension-pattern anchor did not match exactly once')
          library = library.replace(old_extension_patterns, new_extension_patterns, 1)

          old_domestic_grouping = r'''  const domesticGrouped = (groups.length === 2
                && /^0\d{1,4}$/u.test(groups[0])
                && /^\d{6,8}$/u.test(groups[1]))
              || (groups.length === 3
                && /^0\d{1,4}$/u.test(groups[0])
                && /^\d{2,5}$/u.test(groups[1])
                && /^\d{3,5}$/u.test(groups[2]));'''
          new_domestic_grouping = r'''  const domesticPairGrouped = groups.length >= 4
                && groups.length <= 6
                && /^0\d$/u.test(groups[0])
                && groups.slice(1).every(group => /^\d{2}$/u.test(group));
              const domesticGrouped = (groups.length === 2
                && /^0\d{1,4}$/u.test(groups[0])
                && /^\d{6,8}$/u.test(groups[1]))
              || (groups.length === 3
                && /^0\d{1,4}$/u.test(groups[0])
                && /^\d{2,5}$/u.test(groups[1])
                && /^\d{3,5}$/u.test(groups[2]))
              || domesticPairGrouped;'''
          if library.count(old_domestic_grouping) != 1:
              raise SystemExit('domestic-grouping anchor did not match exactly once')
          library = library.replace(old_domestic_grouping, new_domestic_grouping, 1)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')

          domestic_anchor = r'''assert.equal(redactContactData('電話番号：０３６２１６８０４１'), '電話番号：[contact omitted]');'''
          domestic_regressions = r'''for (const multiGroupDomestic of [
            '01 42 68 53 00',
            '01 42 68 53',
            '０１ ４２ ６８ ５３ ００'
          ]) {
            assert.equal(
              redactContactData(multiGroupDomestic),
              '[contact omitted]',
              'four-or-more-group domestic telephone formats must be redacted at clean token boundaries'
            );
          }
          assert.equal(
            redactContactData('01 2026 08 17'),
            '01 2026 08 17',
            'a spaced numeric sequence containing a year must not be treated as a pair-grouped domestic phone'
          );
          assert.equal(redactContactData('電話番号：０３６２１６８０４１'), '電話番号：[contact omitted]');'''
          if tests.count(domestic_anchor) != 1:
              raise SystemExit('domestic-test anchor did not match exactly once')
          tests = tests.replace(domestic_anchor, domestic_regressions, 1)

          extension_anchor = r'''assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 1234 5678'),
            'Tel: [contact omitted] ext [contact omitted]',
            'whitespace-grouped extension digits must be redacted as one marked extension'
          );'''
          extension_regressions = r'''assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 1234 5678'),
            'Tel: [contact omitted] ext [contact omitted]',
            'whitespace-grouped extension digits must be redacted as one marked extension'
          );
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext. (1234 5678)'),
            'Tel: [contact omitted] ext. ([contact omitted])',
            'parenthesized grouped extension digits must be fully redacted'
          );
          assert.equal(
            redactContactData('電話番号03-6216-8041内線（１２３４ ５６７８）'),
            '電話番号[contact omitted]内線（[contact omitted]）',
            'fullwidth-parenthesized grouped extension digits must be fully redacted'
          );'''
          if tests.count(extension_anchor) != 1:
              raise SystemExit('extension-test anchor did not match exactly once')
          tests = tests.replace(extension_anchor, extension_regressions, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Validate focused and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node test/industrial-exhaust.test.js
          git diff --check
      - name: Publish repaired exact head and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-exact-head-review-repair.yml
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-exact-head-review-repair.yml
          git diff --cached --check
          git commit -m "Fix grouped extension and domestic phone redaction"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
