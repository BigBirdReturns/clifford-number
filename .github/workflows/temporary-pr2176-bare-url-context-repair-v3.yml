name: Temporary PR2176 bare URL-context repair v3

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-bare-url-context-repair-v3.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-bare-url-context-repair-v3
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b88f1416ea67a43de62fe265a9aeadcbbf7b6ab8"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-bare-url-context-repair-v3.yml"

      - name: Extend URL-token recognition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')
          old_anchor = (
              r"  const numericUrlContext = /(?:https?:\/\/|www\.)[^\s]*$/iu.test(" "\n"
              r"    prefix.normalize('NFKC')" "\n"
              r"  );"
          )
          new_anchor = (
              r"  const numericUrlContext = /(?:(?:https?:)?\/\/|www\.|(?:[\p{L}\p{N}](?:[\p{L}\p{N}-]*[\p{L}\p{N}])?\.)+(?:[\p{L}]{2,}|xn--[\p{L}\p{N}-]{2,})(?=[:/?#])|(?:\d{1,3}\.){3}\d{1,3}(?=[:/?#]))[^\s]*$/iu.test(" "\n"
              r"    prefix.normalize('NFKC')" "\n"
              r"  );"
          )
          if library.count(old_anchor) != 1:
              raise SystemExit('bare URL-context anchor did not match exactly once')
          library = library.replace(old_anchor, new_anchor, 1)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          anchor = dedent(r'''\
          for (const longNumericUrl of [
            `https://example.test/${'long-segment/'.repeat(12)}01/42/68/53/00`,
            `www.example.test/${'long-segment/'.repeat(12)}03/6216/5111`,
            `https://example.test/${'long-segment/'.repeat(12)}+44/20/7123/4567`
          ]) {
            assert.equal(
              redactContactData(longNumericUrl),
              longNumericUrl,
              'numeric URL paths must remain intact when the scheme is more than 64 characters behind the candidate'
            );
          }
          ''')
          addition = dedent(r'''
          for (const implicitNumericUrl of [
            'example.test/01/42/68/53/00',
            '//example.test/03/6216/5111',
            '192.0.2.1/01/42/68/53/00',
            `example.test/${'long-segment/'.repeat(12)}01/42/68/53/00`
          ]) {
            assert.equal(
              redactContactData(implicitNumericUrl),
              implicitNumericUrl,
              'bare-domain, scheme-relative, IP-host, and long implicit URL paths must remain intact'
            );
          }
          ''')
          if tests.count(anchor) != 1:
              raise SystemExit('implicit URL-context test anchor did not match exactly once')
          tests = tests.replace(anchor, anchor + addition, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-bare-url-context-repair-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-bare-url-context-repair-v3.yml
          git diff --cached --check
          git commit -m "fix(crawler): preserve implicit numeric URL tokens"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
