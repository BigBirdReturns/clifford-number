name: M-05 stage-stack fresh-review repair materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp/m05-stage-stack-fresh-review-repair-v1/**'
      - '.github/workflows/m05-stage-stack-fresh-review-repair-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-stage-stack-fresh-review-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, qualify, and publish exact three-path successor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: bd885ff47b0256d0aba1cb3ff1e61ef7285b206e
          BASE_TREE: 98b03809a0ea23ba1c7267580e668317cd90ddac
          PRODUCT_BRANCH: agent/m05-s03-l7-stage-stack-postmerge-repair-v1
          PRODUCT_HEAD: ee68b2e1bf5ac11eb993f9a3b8909846933aa87c
          ARCHIVE_SHA256: 64889da1e8f32f12b8cb52223c77a4eb1b3c283025b49a95bf3dff08921933e3
          CONTRACT_BLOB: 14decc6ed12383ca7395551c025edac06c446c5c
          VALIDATOR_BLOB: f011ce212a5b94a8d2557b8a88f12f30740b010e
          TEST_BLOB: 159574dfe4cd3b86fddb8ff597ad7010b300f5b9
          WORKFLOW_BLOB: a97748f0a84c7f5a020b5c6e59aa471fcb5cd0de
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/product.b64"
          archive="$RUNNER_TEMP/product.tar.xz"
          extract="$RUNNER_TEMP/product"
          worktree="$RUNNER_TEMP/product-worktree"

          cat .tmp/m05-stage-stack-fresh-review-repair-v1/payload.part-* > "$payload"
          base64 --decode "$payload" > "$archive"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum -c -

          mkdir -p "$extract"
          mapfile -t actual_paths < <(tar -tJf "$archive" | sed 's#^\./##' | sort)
          mapfile -t expected_paths < <(printf '%s\n' \
            'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-postmerge-repair.json' \
            'test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js' \
            'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs' | sort)
          test "$(printf '%s\n' "${actual_paths[@]}")" = "$(printf '%s\n' "${expected_paths[@]}")"
          tar -xJf "$archive" -C "$extract" --no-same-owner --no-same-permissions

          test "$(git hash-object "$extract/data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-postmerge-repair.json")" = "$CONTRACT_BLOB"
          test "$(git hash-object "$extract/tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs")" = "$VALIDATOR_BLOB"
          test "$(git hash-object "$extract/test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js")" = "$TEST_BLOB"

          git fetch --no-tags origin main "$PRODUCT_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_HEAD"
          test "$(git ls-tree "$PRODUCT_HEAD" .github/workflows/m05-intel-realization-stage-receipt-control-stack-amendment.yml | awk '{print $3}')" = "$WORKFLOW_BLOB"

          git worktree add --detach "$worktree" "$PRODUCT_HEAD"
          for rel in "${expected_paths[@]}"; do
            mkdir -p "$worktree/$(dirname "$rel")"
            cp "$extract/$rel" "$worktree/$rel"
          done
          cd "$worktree"

          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-provenance-object-custody.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-provenance-object-custody.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-connection-authentication-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-connection-authentication-custody-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-temporal-reconciliation-admission-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-temporal-reconciliation-admission-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js
          npm run release:check
          git diff --check

          git add -- \
            data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-postmerge-repair.json \
            tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs \
            test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "$(printf '%s\n' "${staged[@]}")" = "$(printf '%s\n' "${expected_paths[@]}")"
          test "$(git hash-object data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-postmerge-repair.json)" = "$CONTRACT_BLOB"
          test "$(git hash-object tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs)" = "$VALIDATOR_BLOB"
          test "$(git hash-object test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js)" = "$TEST_BLOB"

          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git commit -m '[M-05 S03-L7] Bind freshness roles and strict nested custody'
          successor_head="$(git rev-parse HEAD)"
          successor_tree="$(git rev-parse HEAD^{tree})"
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "$(printf '%s\n' "${committed[@]}")" = "$(printf '%s\n' "${expected_paths[@]}")"

          git fetch --no-tags origin main "$PRODUCT_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_HEAD"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          printf 'successor_head=%s\nsuccessor_tree=%s\n' "$successor_head" "$successor_tree"
