name: Industrial-exhaust receipt runtime-probe Landlock controller v1

on:
  push:
    branches:
      - agent/industrial-exhaust-receipt-runtime-probe-landlock-controller-v1

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/industrial-exhaust-receipt-runtime-probe-landlock-controller-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reproduce and confine the runtime closure probe
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA='482db6e3ff25fa6d085a59f8677d9a0b33c5804b'
          PRODUCT_BRANCH='agent/industrial-exhaust-receipt-runtime-probe-landlock-v1'
          WORKFLOW_PATH='.github/workflows/industrial-exhaust-receipt-runtime-probe-landlock-controller-v1.yml'
          TEST_PATCH='.github/tmp/industrial-exhaust-runtime-probe-landlock-test-patch.py'
          INSTRUMENTATION_PATCH='.github/tmp/industrial-exhaust-runtime-probe-landlock-instrumentation-patch.py'
          REPAIR_PATCH='.github/tmp/industrial-exhaust-runtime-probe-landlock-repair-patch.py'
          LIB_PATH='tools/lib/industrial-exhaust-artifacts.mjs'
          TEST_PATH='test/industrial-exhaust-retained-store-custody.test.js'

          current_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse "${current_sha}^")" = "$BASE_SHA"

          expected_controller_paths=(
            "$INSTRUMENTATION_PATCH"
            "$REPAIR_PATCH"
            "$TEST_PATCH"
            "$WORKFLOW_PATH"
          )
          mapfile -t controller_diff < <(git diff --name-only "$BASE_SHA" "$current_sha")
          test "${#controller_diff[@]}" -eq "${#expected_controller_paths[@]}"
          for index in "${!expected_controller_paths[@]}"; do
            test "${controller_diff[$index]}" = "${expected_controller_paths[$index]}"
          done

          python -m py_compile \
            "$TEST_PATCH" \
            "$INSTRUMENTATION_PATCH" \
            "$REPAIR_PATCH"
          python "$TEST_PATCH"
          python "$INSTRUMENTATION_PATCH"

          set +e
          node "$TEST_PATH" \
            > /tmp/industrial-exhaust-runtime-probe-landlock-predecessor.log 2>&1
          predecessor_status=$?
          set -e
          test "$predecessor_status" -ne 0
          grep -F 'index runtime closure probe must deny ambient repository mutation' \
            /tmp/industrial-exhaust-runtime-probe-landlock-predecessor.log
          echo 'predecessor unconfined runtime closure probe reproduced'

          python "$REPAIR_PATCH"

          node --check "$LIB_PATH"
          node --check "$TEST_PATH"
          node "$TEST_PATH"
          node test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node tools/hydrate-industrial-exhaust.mjs --audit
          git diff --check

          rm \
            "$WORKFLOW_PATH" \
            "$TEST_PATCH" \
            "$INSTRUMENTATION_PATCH" \
            "$REPAIR_PATCH"

          mapfile -t product_diff < <(git diff --name-only "$BASE_SHA")
          test "${#product_diff[@]}" -eq 2
          test "${product_diff[0]}" = "$TEST_PATH"
          test "${product_diff[1]}" = "$LIB_PATH"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          new_sha="$(
            printf '%s\n\n%s\n' \
              'fix(industrial-exhaust): confine receipt runtime closure probes' \
              'Run capability-discovery probes beneath an admitted private directory root and require exact Landlock proof before capable helper execution.' \
              | git commit-tree "$tree_sha" -p "$BASE_SHA"
          )"

          mapfile -t final_diff < <(git diff --name-only "$BASE_SHA" "$new_sha")
          test "${#final_diff[@]}" -eq 2
          test "${final_diff[0]}" = "$TEST_PATH"
          test "${final_diff[1]}" = "$LIB_PATH"
          git diff --check "$BASE_SHA" "$new_sha"

          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$BASE_SHA"

          git push \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:" \
            origin \
            "${new_sha}:refs/heads/${PRODUCT_BRANCH}"
