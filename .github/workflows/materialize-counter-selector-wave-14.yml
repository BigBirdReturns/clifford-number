name: Materialize Counter-Selector Wave 14 Batch 05 blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-14.yml'
      - '.github/materializers/counter-selector-wave-14/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-14-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-14-b05-blind-review

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 14 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-14/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-14.tar.gz
          echo '976c13964db13491cad4e0d291f5638555a0d354b7acdd097ecb740b390331a3  /tmp/counter-selector-wave-14.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-14.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-14

      - name: Build, validate, and attack Batch 05 blind review
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-14.mjs
          node tools/validate-counter-selector-wave-14.mjs
          node test/counter-selector-wave-14.test.js

      - name: Commit exact permanent Wave 14 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-14/payload-000 \
            .github/materializers/counter-selector-wave-14/payload-001 \
            .github/materializers/counter-selector-wave-14/payload-002 \
            .github/materializers/counter-selector-wave-14/payload-003 \
            .github/materializers/counter-selector-wave-14/payload-004 \
            .github/materializers/counter-selector-wave-14/payload-005 \
            .github/materializers/counter-selector-wave-14/payload-006 \
            .github/materializers/counter-selector-wave-14/payload-007 \
            data/project/counter-selector-wave-14-blind-review.json \
            schemas/counter-selector-blind-review-b05.schema.json \
            docs/methods/counter-selector-blind-review-b05.md \
            docs/milestones/counter-selector-wave-14.md \
            tools/build-counter-selector-wave-14.mjs \
            tools/validate-counter-selector-wave-14.mjs \
            test/counter-selector-wave-14.test.js \
            data/project/counter-selector-blind-review-b05-registry.json \
            data/project/counter-selector-review-disagreement-b05-ledger.json \
            data/project/counter-selector-wave-14-release-manifest.json \
            reports/core-thesis/counter-selector-wave-14/data.json \
            reports/core-thesis/counter-selector-wave-14/index.html | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Execute Counter-Selector Wave 14 Batch 05 blind review'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 14 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-14.mjs
          node tools/validate-counter-selector-wave-14.mjs
          node test/counter-selector-wave-14.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent Wave 14 head
        run: git push origin HEAD:agent/counter-selector-wave-14-b05-blind-review
