name: Temporary materialize SSC-F02 SNAP deterministic products

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-ssc-f02-snap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact products on the authorized evidence head
        env:
          TARGET_BRANCH: agent/ssc-f02-institutional-gate
          EXPECTED_HEAD: ab88acdd7c68163ec12a0bce4d708b05a7da5f32
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          git switch -C target "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/build-status-sovereignty-f02-snap.mjs
          node tools/validate-status-sovereignty-f02-snap.mjs
          node test/status-sovereignty-f02-snap.test.js
          cat > /tmp/expected-paths <<'PATHS'
          build/core-thesis/status-sovereignty/f02-snap/data.json
          build/core-thesis/status-sovereignty/f02-snap/manifest.json
          data/project/status-sovereignty-f02-snap-gate-first-pass-release-manifest.json
          reports/core-thesis/status-sovereignty/f02-snap/data.json
          reports/core-thesis/status-sovereignty/f02-snap/index.html
          PATHS
          git status --porcelain=v1 --untracked-files=all | cut -c4- | sort > /tmp/observed-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/observed-paths
          test "$(wc -l < /tmp/observed-paths)" -eq 5
      - name: Prove publication exclusion and repository compatibility
        run: |
          set -Eeuo pipefail
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/data/intake/status-sovereignty-f02-snap-gate-first-pass.json
          test ! -e dist/build/core-thesis/status-sovereignty/f02-snap
          test ! -e dist/reports/core-thesis/status-sovereignty/f02-snap
          npm run release:check
          git restore --worktree -- \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/migration-review.md \
            build/migration-summary.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/scout-report.md \
            build/surface-graph.json
          git status --porcelain=v1 --untracked-files=all | cut -c4- | sort > /tmp/observed-after-release
          diff -u /tmp/expected-paths /tmp/observed-after-release
      - name: Publish only the five deterministic products
        env:
          TARGET_BRANCH: agent/ssc-f02-institutional-gate
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            build/core-thesis/status-sovereignty/f02-snap/data.json \
            build/core-thesis/status-sovereignty/f02-snap/manifest.json \
            data/project/status-sovereignty-f02-snap-gate-first-pass-release-manifest.json \
            reports/core-thesis/status-sovereignty/f02-snap/data.json \
            reports/core-thesis/status-sovereignty/f02-snap/index.html
          git diff --cached --name-only | sort > /tmp/staged-paths
          diff -u /tmp/expected-paths /tmp/staged-paths
          git commit -m 'Materialize SSC-F02 SNAP first-pass products'
          git push origin "HEAD:$TARGET_BRANCH"
