name: M-05 observation-time exact-head qualifier

on:
  push:
    branches:
      - agent/m05-s03-l7-observation-time-materializer-v1
    paths:
      - '.github/workflows/m05-observation-time-qualify-and-merge.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: m05-observation-time-exact-head-qualifier
  cancel-in-progress: false

jobs:
  qualify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: '2191'
      ISSUE: '345'
      EXPECTED_HEAD_BRANCH: 'agent/m05-s03-l7-intel-realization-observation-time-custody-v1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze PR identity and four-path denominator
        id: freeze
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json state,headRefName,headRefOid,baseRefName,baseRefOid,mergeable > /tmp/pr.json
          gh api "repos/$REPO/branches/main" > /tmp/main.json
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/pr.json')),m=JSON.parse(fs.readFileSync('/tmp/main.json'));
          if(p.state!=='OPEN'||p.headRefName!==process.env.EXPECTED_HEAD_BRANCH||p.baseRefName!=='main'||p.baseRefOid!==m.commit.sha)throw new Error(`identity or lease drift ${JSON.stringify({p,main:m.commit.sha})}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`head=${p.headRefOid}\nbase=${p.baseRefOid}\n`);
          NODE
          gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate > /tmp/files.json
          node <<'NODE'
          const rows=JSON.parse(require('fs').readFileSync('/tmp/files.json'));
          const expected=[
            '.github/workflows/m05-intel-realization-observation-time-custody-amendment.yml',
            'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.json',
            'test/m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.test.js',
            'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.mjs'
          ].sort(),actual=rows.map(x=>x.filename).sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)||rows.some(x=>x.status!=='added'))throw new Error(`path denominator drift ${JSON.stringify(rows.map(x=>({f:x.filename,s:x.status})))}`);
          NODE
      - name: Await all exact-head PR workflows
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" > /tmp/runs.json
            if node <<'NODE'
          const fs=require('fs'),runs=JSON.parse(fs.readFileSync('/tmp/runs.json')).workflow_runs;
          const expected=['M-05 Intel realization observation time custody amendment','Release checks','M-05 story ecology and answerable power','Core thesis and estate alignment','No magic human gate'];
          const latest=new Map();for(const r of runs.filter(r=>expected.includes(r.name))){const old=latest.get(r.name);if(!old||r.id>old.id)latest.set(r.name,r)}
          const bad=[...latest.values()].filter(r=>r.status==='completed'&&r.conclusion!=='success');if(bad.length){console.error(JSON.stringify(bad));process.exit(2)}
          if(!expected.every(n=>latest.get(n)?.status==='completed'&&latest.get(n)?.conclusion==='success'))process.exit(1);
          fs.writeFileSync('/tmp/qualified-runs.json',JSON.stringify(expected.map(n=>{const r=latest.get(n);return{name:n,id:r.id,head_sha:r.head_sha,conclusion:r.conclusion}}),null,2));
          NODE
            then break; else code=$?; [ "$code" -eq 2 ] && exit 1; fi
            [ "$attempt" -eq 150 ] && { echo timeout >&2; exit 1; }
            sleep 10
          done
      - name: Recheck immutable head and main lease
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
          BASE_SHA: ${{ steps.freeze.outputs.base }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json state,headRefOid,baseRefOid,mergeable > /tmp/final.json
          gh api "repos/$REPO/branches/main" > /tmp/main-final.json
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/final.json')),m=JSON.parse(fs.readFileSync('/tmp/main-final.json'));
          if(p.state!=='OPEN'||p.headRefOid!==process.env.HEAD_SHA||p.baseRefOid!==process.env.BASE_SHA||m.commit.sha!==process.env.BASE_SHA)throw new Error('final lease drift');
          if(!['MERGEABLE','UNKNOWN'].includes(p.mergeable))throw new Error(`mergeability ${p.mergeable}`);
          NODE
      - name: Record qualification and mark ready
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_SHA"
          tree=$(git show -s --format=%T "$HEAD_SHA")
          gh pr view "$PR" --repo "$REPO" --json body -q .body > /tmp/body.md
          cat >> /tmp/body.md <<EOF

All five applicable pull-request workflows passed on exact head \`$HEAD_SHA\`, tree \`$tree\`:

\`\`\`json
$(cat /tmp/qualified-runs.json)
\`\`\`

The focused workflow passed predecessor network-peer validation, trusted-clock and monotonic-interval validation, cache-age and revalidation-chain validation, temporal-semantics and freshness controls, adversarial mutations, the complete repository release gate, and deterministic replay. The branch remained a four-file additive transaction over the exact canonical base.
EOF
          gh pr edit "$PR" --repo "$REPO" --body-file /tmp/body.md
          gh pr ready "$PR" --repo "$REPO"
      - name: Merge exact head
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=merge -f sha="$HEAD_SHA" \
            -f commit_title='[M-05 S03-L7] Require trusted observation-time custody (#2191)' \
            -f commit_message='Bind every Intel realization-stage network-peer record to a trusted clock, monotonic interval, cache-age and revalidation chain, freshness policy, and distinct observation, publication, effective, transaction, and accounting time semantics while preserving zero observed receipts, no answer change, no graph effect, and issue #345 as open.' > /tmp/merge.json
          node -e "const x=require('/tmp/merge.json');if(!x.merged)throw new Error(JSON.stringify(x))"
      - name: Verify canonical merge and replay controls
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
          BASE_SHA: ${{ steps.freeze.outputs.base }}
        run: |
          set -euo pipefail
          merge=$(node -p "require('/tmp/merge.json').sha")
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$merge"
          head_tree=$(git show -s --format=%T "$HEAD_SHA")
          merge_tree=$(git show -s --format=%T "$merge")
          test "$head_tree" = "$merge_tree"
          test "$(git show -s --format=%P "$merge")" = "$BASE_SHA $HEAD_SHA"
          git switch --detach "$merge"
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-network-peer-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-network-peer-custody-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.test.js
          npm run release:check
          echo "$merge" > /tmp/merge-sha
          echo "$merge_tree" > /tmp/merge-tree
      - name: Record canonical transaction on issue 345
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
          BASE_SHA: ${{ steps.freeze.outputs.base }}
        run: |
          set -euo pipefail
          merge=$(cat /tmp/merge-sha); tree=$(cat /tmp/merge-tree)
          cat > /tmp/comment.md <<EOF
PR #2191 is now the canonical trusted observation-time, cache-age, freshness, and temporal-semantics custody control for the Intel realization chain. It merged exact qualified head \`$HEAD_SHA\` into \`main\` through merge commit \`$merge\`, preserving product tree \`$tree\` and exact parent order \`$BASE_SHA $HEAD_SHA\`.

Every transaction, federal-cash, public-account, and distribution receipt must now bind the network-peer digest to client start and completion times, a monotonic interval, clock-source and synchronization evidence, offset and uncertainty bounds, server Date and client skew, Age and cache-control state, prior-body and revalidation custody for HTTP 304, cache-chain receipts for non-origin responses, distinct observation, publication, effective, transaction, settlement or payment, accounting, distribution, and archive-capture semantics, a freshness policy and evaluation, and future or stale anomaly state. Self-declared timestamps, server Date, Age zero, Last-Modified, and archive capture time cannot be substituted for trusted time, origin freshness, publication, transaction, or accounting time.

All five pull-request workflows passed on the exact head:

\`\`\`json
$(cat /tmp/qualified-runs.json)
\`\`\`

The controller replayed the predecessor network-peer validator and adversarial suite, the observation-time validator and adversarial suite, and the complete repository release gate on the canonical merge commit.

This remains an admission-control transaction. It establishes no Intel sale, transfer, dividend, warrant exercise, federal cash receipt, TAS/BETC booking, distribution ledger, effective answer, graph effect, cross-domain completion, project completion, or issue-closure authority. The ordinary acquisition gate remains \`2026-08-27T00:00:00Z\`.

The evidentiary ledger is exact predecessor Git-object custody, trusted-clock and monotonic-interval custody, server-client skew, cache and revalidation-chain custody, explicit temporal semantics, freshness evaluation, deterministic validation, and adversarial byte-rewrite testing; the venue is PRs #2180 through #2191, canonical \`main\`, and this issue; the target is the gap between acquiring exact bytes from an exact peer and proving when the acquisition occurred and what time the record represents; the upside is temporal and freshness reproducibility; the downside is zero empirical Intel realization or distribution receipts; and the failure mode is treating a self-declared observation time, cached object, server Date, Last-Modified value, or archive timestamp as transaction, accounting, or current-state evidence. The controlling question is whether the first post-gate Intel record can preserve trusted observation time and distinct temporal semantics and then satisfy transaction, gross federal receipt, TAS/BETC booking, complete-denominator, distribution, answer, graph, completion, and issue-closure controls.
EOF
          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/comment.md
