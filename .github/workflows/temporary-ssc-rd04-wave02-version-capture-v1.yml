name: TEMP capture SSC RD-04 Wave 02 version-source universe

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd04-wave02-version-capture-base-v1
    paths:
      - '.github/tmp/ssc-rd04-wave02-version-capture-v1.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-rd04-wave02-version-capture-v1
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef1d309c9768bab36bdaf5e4e465d0caa068507a
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate immutable fourteen-source seed universe
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node tools/acquisition/status-sovereignty-rd-wave02-rd04/validate-version-seed.mjs
          node test/status-sovereignty-rd-wave02-rd04-version-seed.test.js
      - name: Capture exact bounded source receipts
        env:
          RD04_VERSION_OUTPUT: ${{ github.workspace }}/rd04-version-capture
        run: node tools/acquisition/status-sovereignty-rd-wave02-rd04/capture-version-seed.mjs
      - name: Refuse source-universe mutation
        run: git diff --exit-code
      - name: Upload exact RD-04 version-source custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-wave02-version-source-capture-v1
          path: rd04-version-capture
          if-no-files-found: error
          retention-days: 90
