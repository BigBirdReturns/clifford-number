name: TEMP screen School.House historical filing website fields

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/temp-schoolhouse-irs-historical-filing-website-screen-v1.yml'
      - '.schoolhouse-irs-historical-filing-website-screen-v1/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: schoolhouse-historical-filing-website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-irs-historical-filing-website-screen-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify exact carrier, reconstruct runner, and authenticate locator custody
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PARENT='a464dbbd96c365a7c040e17847486c5b3ba05c27'
          PARENT_TREE='e4a8b0072fcdd8ca575f6c0d279f035277110163'
          BRANCH='agent/schoolhouse-irs-historical-filing-website-screen-v1'
          ROOT='.schoolhouse-irs-historical-filing-website-screen-v1'
          WORKFLOW='.github/workflows/temp-schoolhouse-irs-historical-filing-website-screen-v1.yml'
          EXECUTE="$ROOT/EXECUTE"
          BUNDLE="$RUNNER_TEMP/acquire-schoolhouse-historical-website-v1.py.gz.b64"
          GZIP="$RUNNER_TEMP/acquire-schoolhouse-historical-website-v1.py.gz"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-historical-website-v1.py"
          LOCATOR_ZIP="$RUNNER_TEMP/schoolhouse-locators.zip"
          LOCATOR="$RUNNER_TEMP/schoolhouse-irs-candidate-xml-member-locator-census"

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git show -s --format=%P HEAD)" = "$PARENT"
          test "$(git rev-list --count "$PARENT"..HEAD)" = '1'
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          git merge-base --is-ancestor "$PARENT" origin/main
          test "$(git merge-base HEAD origin/main)" = "$PARENT"
          test "${GITHUB_HEAD_REF:-$BRANCH}" = "$BRANCH"

          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/workflows/temp-schoolhouse-irs-historical-filing-website-screen-v1.yml
          .schoolhouse-irs-historical-filing-website-screen-v1/EXECUTE
          .schoolhouse-irs-historical-filing-website-screen-v1/bundle/part-00
          .schoolhouse-irs-historical-filing-website-screen-v1/bundle/part-01
          .schoolhouse-irs-historical-filing-website-screen-v1/bundle/part-02
          .schoolhouse-irs-historical-filing-website-screen-v1/bundle/part-03
          .schoolhouse-irs-historical-filing-website-screen-v1/bundle/part-04
          EOF
          git diff --name-only "$PARENT"..HEAD | sort > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          while IFS= read -r path; do
            test -z "$(git ls-tree -r --name-only origin/main -- "$path")"
          done < "$RUNNER_TEMP/expected-paths"
          git diff --check "$PARENT"..HEAD

          test "$(stat -c%s "$EXECUTE")" = '2892'
          test "$(sha256sum "$EXECUTE" | awk '{print $1}')" = '9855914b42f980fcbcc107135bbe16cae366d77e058ec08a3054f67097b9681b'
          for line in \
            'issue=1316' \
            "canonical_main=$PARENT" \
            "canonical_tree=$PARENT_TREE" \
            'latest_selection_blob=56b848cf6b3888eda57893e6c46f3333084b7794' \
            'locator_artifact_id=8970691385' \
            'historical_exact_locator_rows=180' \
            'historical_unique_candidate_eins=72' \
            'historical_selection_sha256=4c14e8faae74fc9c4d57b44b27ae0feafb5f1ce2952fdc1ad490f441a5f07720' \
            'historical_object_ids_sha256=faeeca747d252b3ba00ef8df0f021c710b74b8f7ee841b050d0db154b6ec996e' \
            'full_archive_fallback_forbidden=true' \
            'observed_website_values_retained=0' \
            'outside_human_dependency=false' \
            'graph_effect=none' \
            'carrier_paths=7' \
            'runner_bundle_shards=5'; do
            grep -Fx "$line" "$EXECUTE"
          done

          : > "$BUNDLE"
          specs=(
            'part-00 3542 d41d89c30a3e0ffd00883761b1d8c41ce0d73e2983bcc4c15430711096536658'
            'part-01 3542 dbcf113db09105d4705df31a919c02ef81f2fa5ec5d0e699d95b6f84074c19f6'
            'part-02 3542 43c278c9a05e08a4a19a834f4ee7968f4ed2dd4b30c17435dda8da99e31a5dc4'
            'part-03 3542 c8b817f1661ff30432706e23e9d6eef256d22f448bc4f4e1dd7599b4f503b083'
            'part-04 2513 f4c6182d497adce1bad05116ced79fe8bfc6fbb003d3ff91e7b33c0a96a00dda'
          )
          for spec in "${specs[@]}"; do
            set -- $spec
            path="$ROOT/bundle/$1"
            test "$(stat -c%s "$path")" = "$2"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$3"
            cat "$path" >> "$BUNDLE"
          done
          test "$(stat -c%s "$BUNDLE")" = '16681'
          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = '5c15e9edeef09f0b036d1cccc4a123390ed31f07736d04f83ed01ed8167e0a4b'
          base64 -d "$BUNDLE" > "$GZIP"
          test "$(stat -c%s "$GZIP")" = '12346'
          test "$(sha256sum "$GZIP" | awk '{print $1}')" = 'cc064c13a0d71bbbc69303ab2a5eb36cd3b297d67a5d127b5a84eb6bf7ce2d5b'
          gzip -dc "$GZIP" > "$RUNNER"
          test "$(stat -c%s "$RUNNER")" = '56063'
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = '87dae515c29cfddb76c571aff2fcd422f539c388db6ab6c348ca101b8347c0a9'
          python -m py_compile "$RUNNER"
          python "$RUNNER" --self-test

          test "$(git rev-parse 'HEAD:data/intake/schoolhouse-irs-candidate-latest-filing-xml-v6/selection.jsonl')" = '56b848cf6b3888eda57893e6c46f3333084b7794'
          test "$(sha256sum data/intake/schoolhouse-irs-candidate-latest-filing-xml-v6/selection.jsonl | awk '{print $1}')" = '02e90e6ecce9fb7c09405e79033d1d0b3345d8f18321d9e8b74c468ed81d59a0'

          REPO="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$REPO/actions/artifacts/8970691385" --jq '.digest // ""')" = \
            'sha256:42fed8f0dbafe0f504b4234040e2d4e56920888aa846ac58debcf61fe8794333'
          gh api "repos/$REPO/actions/artifacts/8970691385/zip" > "$LOCATOR_ZIP"
          test "$(sha256sum "$LOCATOR_ZIP" | awk '{print $1}')" = '42fed8f0dbafe0f504b4234040e2d4e56920888aa846ac58debcf61fe8794333'
          rm -rf "$LOCATOR"
          mkdir -p "$LOCATOR"
          unzip -q "$LOCATOR_ZIP" -d "$LOCATOR"
          test "$(cat "$LOCATOR/RUNNER_EXIT_CODE")" = '0'
          test "$(sha256sum "$LOCATOR/member-locators.jsonl" | awk '{print $1}')" = '9d8ea6638813dfe20464226b405a42ea94fd449cc96a3d307ea701cc8580ce80'
          test "$(sha256sum "$LOCATOR/summary.json" | awk '{print $1}')" = '3b4bdb84dd6de1bab87634ccc3c04873f854d59cd36c2f59fbb472959b2c16a0'
          (cd "$LOCATOR" && sha256sum -c SHA256SUMS)
          jq -e '
            .object_rows == 486 and
            .exact_member_locator_rows == 234 and
            .objects_with_exact_one_locator == 234 and
            .objects_without_locator == 252 and
            .objects_with_duplicate_locators == 0 and
            .member_payload_fetches == 0 and
            .full_archive_fetches == 0 and
            .identities_admitted == 0 and
            .relationships_admitted == 0 and
            .outside_human_dependency == false and
            .graph_effect == "none"
          ' "$LOCATOR/summary.json"

      - name: Execute exact historical website-field screen
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/schoolhouse-irs-historical-filing-website-screen-v1"
          LOCATOR="$RUNNER_TEMP/schoolhouse-irs-candidate-xml-member-locator-census"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-historical-website-v1.py"
          LOG="$RUNNER_TEMP/schoolhouse-irs-historical-filing-website-screen-v1.log"
          rm -rf "$OUT"
          python "$RUNNER" \
            --repo-root "$GITHUB_WORKSPACE" \
            --locator-root "$LOCATOR" \
            --output "$OUT" \
            2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          mkdir -p "$OUT"
          printf '%s\n' "$status" > "$OUT/RUNNER_EXIT_CODE"
          cp "$LOG" "$OUT/RUNNER-OUTPUT.log"
          exit "$status"

      - name: Preserve terminal historical website-field artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-historical-filing-website-screen-v1
          path: ${{ runner.temp }}/schoolhouse-irs-historical-filing-website-screen-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Require complete terminal denominator, privacy ceiling, and authority boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/schoolhouse-irs-historical-filing-website-screen-v1"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-historical-website-v1.py"
          test -f "$OUT/RUNNER_EXIT_CODE"
          test "$(cat "$OUT/RUNNER_EXIT_CODE")" = '0'
          python "$RUNNER" --validate-output --repo-root "$GITHUB_WORKSPACE" --output "$OUT"
