name: SSC RD-04 A05 California remedy chain

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd04-california-remedy-chain-a05.yml'
      - 'data/intake/status-sovereignty-rd04-california-remedy-chain-a05/**'
      - 'data/intake/status-sovereignty-rd04-snap-route-adjudication-a04/core.json'
      - 'data/project/status-sovereignty-rd04-snap-route-adjudication-a04-release-manifest.json'
      - 'data/project/status-sovereignty-rd04-california-remedy-chain-a05-release-manifest.json'
      - 'docs/milestones/ssc-rd04-california-remedy-chain-a05.md'
      - 'schemas/status-sovereignty-rd04-california-remedy-chain-a05.schema.json'
      - 'tools/acquire-status-sovereignty-rd04-california-remedy-chain-a05.mjs'
      - 'tools/build-status-sovereignty-rd04-california-remedy-chain-a05.mjs'
      - 'tools/validate-status-sovereignty-rd04-california-remedy-chain-a05.mjs'
      - 'test/status-sovereignty-rd04-california-remedy-chain-a05.test.js'
      - 'reports/core-thesis/status-sovereignty/rd04-california-remedy-chain-a05/**'
      - 'build/core-thesis/status-sovereignty/rd04-california-remedy-chain-a05/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd04-california-remedy-chain-a05.yml'
      - 'data/intake/status-sovereignty-rd04-california-remedy-chain-a05/**'
      - 'data/project/status-sovereignty-rd04-california-remedy-chain-a05-release-manifest.json'
      - 'docs/milestones/ssc-rd04-california-remedy-chain-a05.md'
      - 'schemas/status-sovereignty-rd04-california-remedy-chain-a05.schema.json'
      - 'tools/build-status-sovereignty-rd04-california-remedy-chain-a05.mjs'
      - 'tools/validate-status-sovereignty-rd04-california-remedy-chain-a05.mjs'
      - 'test/status-sovereignty-rd04-california-remedy-chain-a05.test.js'
      - 'reports/core-thesis/status-sovereignty/rd04-california-remedy-chain-a05/**'
      - 'build/core-thesis/status-sovereignty/rd04-california-remedy-chain-a05/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd04-a05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate bounded California remedy chain
        run: |
          node tools/validate-no-magic-human-gate.mjs
          node tools/build-status-sovereignty-rd04-california-remedy-chain-a05.mjs
          node tools/validate-status-sovereignty-rd04-california-remedy-chain-a05.mjs
          node test/status-sovereignty-rd04-california-remedy-chain-a05.test.js
      - name: Refuse deterministic drift
        run: git diff --exit-code
