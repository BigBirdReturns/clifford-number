name: M-04G evidence hydrology and inland sea

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m04g-evidence-hydrology-*.json'
      - 'data/intake/m04g-evidence-hydrology-*.json'
      - 'docs/methods/evidence-hydrology.md'
      - 'docs/milestones/m04g-evidence-hydrology-*.md'
      - 'tools/build-m04g-evidence-hydrology.mjs'
      - 'tools/validate-m04g-evidence-hydrology.mjs'
      - 'tools/refresh-m04g-evidence-hydrology.mjs'
      - 'test/m04g-evidence-hydrology.test.js'
      - 'build/core-thesis/evidence-hydrology/**'
      - 'reports/core-thesis/evidence-hydrology/**'
      - '.github/workflows/m04g-evidence-hydrology.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m04g-evidence-hydrology-*.json'
      - 'data/intake/m04g-evidence-hydrology-*.json'
      - 'docs/methods/evidence-hydrology.md'
      - 'docs/milestones/m04g-evidence-hydrology-*.md'
      - 'tools/build-m04g-evidence-hydrology.mjs'
      - 'tools/validate-m04g-evidence-hydrology.mjs'
      - 'tools/refresh-m04g-evidence-hydrology.mjs'
      - 'test/m04g-evidence-hydrology.test.js'
      - 'build/core-thesis/evidence-hydrology/**'
      - 'reports/core-thesis/evidence-hydrology/**'
      - '.github/workflows/m04g-evidence-hydrology.yml'
  schedule:
    - cron: '17 5 * * *'
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate, freshwater, ocean, or all'
        required: true
        default: validate
        type: choice
        options: [validate, freshwater, ocean, all]
      limit:
        description: 'maximum pilot polls'
        required: false
        default: '100'
        type: string

permissions:
  contents: read

concurrency:
  group: m04g-evidence-hydrology-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'validate' || inputs.mode == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the inland sea
        run: |
          node tools/build-m04g-evidence-hydrology.mjs
          node tools/validate-m04g-evidence-hydrology.mjs
          node test/m04g-evidence-hydrology.test.js
          node tools/refresh-m04g-evidence-hydrology.mjs --dry-run --class all --limit 100
      - name: Fingerprint governed bytes
        run: |
          find \
            data/project/m04g-evidence-hydrology-*.json \
            data/intake/m04g-evidence-hydrology-*.json \
            docs/methods/evidence-hydrology.md \
            docs/milestones/m04g-evidence-hydrology-*.md \
            tools/build-m04g-evidence-hydrology.mjs \
            tools/validate-m04g-evidence-hydrology.mjs \
            tools/refresh-m04g-evidence-hydrology.mjs \
            test/m04g-evidence-hydrology.test.js \
            build/core-thesis/evidence-hydrology \
            reports/core-thesis/evidence-hydrology \
            .github/workflows/m04g-evidence-hydrology.yml \
            -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/m04g-before.sha256
      - name: Run the complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift and prove determinism
        run: |
          git restore --staged --worktree .
          node tools/build-m04g-evidence-hydrology.mjs
          node tools/validate-m04g-evidence-hydrology.mjs
          node test/m04g-evidence-hydrology.test.js
          find \
            data/project/m04g-evidence-hydrology-*.json \
            data/intake/m04g-evidence-hydrology-*.json \
            docs/methods/evidence-hydrology.md \
            docs/milestones/m04g-evidence-hydrology-*.md \
            tools/build-m04g-evidence-hydrology.mjs \
            tools/validate-m04g-evidence-hydrology.mjs \
            tools/refresh-m04g-evidence-hydrology.mjs \
            test/m04g-evidence-hydrology.test.js \
            build/core-thesis/evidence-hydrology \
            reports/core-thesis/evidence-hydrology \
            .github/workflows/m04g-evidence-hydrology.yml \
            -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/m04g-after.sha256
          diff -u /tmp/m04g-before.sha256 /tmp/m04g-after.sha256
          git diff --exit-code

  freshwater:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'freshwater' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: build/evidence-hydrology/state
          key: m04g-hydrology-${{ runner.os }}-${{ github.run_id }}-freshwater
          restore-keys: |
            m04g-hydrology-${{ runner.os }}-
      - name: Run freshwater pulse
        run: |
          node tools/validate-m04g-evidence-hydrology.mjs
          node tools/refresh-m04g-evidence-hydrology.mjs \
            --class freshwater_authoritative \
            --limit '${{ github.event.inputs.limit || '100' }}'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/evidence-hydrology/state
          key: m04g-hydrology-${{ runner.os }}-${{ github.run_id }}-freshwater
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04g-freshwater-${{ github.run_id }}
          path: build/evidence-hydrology
          if-no-files-found: error
          retention-days: 90

  ocean:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 6 * * 1') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'ocean' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: build/evidence-hydrology/state
          key: m04g-hydrology-${{ runner.os }}-${{ github.run_id }}-ocean
          restore-keys: |
            m04g-hydrology-${{ runner.os }}-
      - name: Run ocean tide and public aquifer fingerprints
        run: |
          node tools/validate-m04g-evidence-hydrology.mjs
          node tools/refresh-m04g-evidence-hydrology.mjs \
            --class ocean_discovery,aquifer_archival_or_restricted \
            --limit '${{ github.event.inputs.limit || '100' }}'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/evidence-hydrology/state
          key: m04g-hydrology-${{ runner.os }}-${{ github.run_id }}-ocean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04g-ocean-${{ github.run_id }}
          path: build/evidence-hydrology
          if-no-files-found: error
          retention-days: 90
