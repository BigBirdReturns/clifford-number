name: Temporary PC-24 domain-disjointness repair

on:
  pull_request:
    paths:
      - '.github/workflows/pc24-domain-repair.yml'
      - 'tools/lib/preference-instrument-validity.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-instrument-validity-v1
      - name: Enforce explicit domain disjointness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/lib/preference-instrument-validity.mjs')
          source = path.read_text()
          old = "  if (unique([...array(construct.covered_domains), ...array(construct.excluded_domains)]).length !== baseline.reference_domains.length) errors.push(`world ${worldId} construct domains must not overlap`);\n"
          new = "  if (array(construct.covered_domains).some(domain => array(construct.excluded_domains).includes(domain))) errors.push(`world ${worldId} construct domains must not overlap`);\n  if (unique(array(construct.covered_domains)).length !== array(construct.covered_domains).length || unique(array(construct.excluded_domains)).length !== array(construct.excluded_domains).length) errors.push(`world ${worldId} construct domain ledgers must not repeat entries`);\n"
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit('domain-overlap validator anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit bounded domain repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/lib/preference-instrument-validity.mjs
          if git diff --cached --quiet; then
            echo 'No domain repair required.'
          else
            git commit -m 'Enforce explicit PC-24 construct-domain disjointness'
            git push origin HEAD:research/preference-instrument-validity-v1
          fi
