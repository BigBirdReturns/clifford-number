name: Project stable-ground supersession 10

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-sg09*.json'
      - 'data/project/project-stable-ground-sg10*.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/status-sovereignty-*.json'
      - 'data/research/status-sovereignty-wave-02*.json'
      - 'docs/milestones/project-stable-ground-sg10.md'
      - 'reports/core-thesis/stable-ground/sg10/**'
      - 'tools/*project-stable-ground-sg09*'
      - 'tools/*project-stable-ground-sg10*'
      - 'tools/*status-sovereignty-wave-02-review*'
      - 'test/project-stable-ground-sg09.test.js'
      - 'test/project-stable-ground-sg10.test.js'
      - 'test/status-sovereignty-wave-02-review.test.js'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - '.github/workflows/status-sovereignty-wave-02-review.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-sg09*.json'
      - 'data/project/project-stable-ground-sg10*.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/status-sovereignty-*.json'
      - 'data/research/status-sovereignty-wave-02*.json'
      - 'docs/milestones/project-stable-ground-sg10.md'
      - 'reports/core-thesis/stable-ground/sg10/**'
      - 'tools/*project-stable-ground-sg09*'
      - 'tools/*project-stable-ground-sg10*'
      - 'tools/*status-sovereignty-wave-02-review*'
      - 'test/project-stable-ground-sg09.test.js'
      - 'test/project-stable-ground-sg10.test.js'
      - 'test/status-sovereignty-wave-02-review.test.js'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - '.github/workflows/status-sovereignty-wave-02-review.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate SG-10
        run: |
          node tools/build-project-stable-ground-sg10.mjs
          node tools/validate-project-stable-ground-sg09.mjs
          node test/project-stable-ground-sg09.test.js
          node tools/validate-project-stable-ground-sg10.mjs
          node test/project-stable-ground-sg10.test.js
      - name: Validate Wave 02 review and publication hold
        run: |
          node tools/validate-status-sovereignty-wave-02-review.mjs
          node test/status-sovereignty-wave-02-review.test.js
          npm run validate:status-sovereignty
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/build/core-thesis/status-sovereignty/wave-02-review
          test ! -e dist/reports/core-thesis/status-sovereignty/wave-02-review
          test ! -e dist/data/research/status-sovereignty-wave-02.json
          test ! -e dist/data/research/status-sovereignty-wave-02-maintainer-review.json
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic SG-10 reconstruction
        run: |
          git restore --staged --worktree .
          git clean -fdx
          npm run build:status-sovereignty
          npm run validate:status-sovereignty
          npm run build:poof-ecology
          npm run validate:poof-ecology
          npm run build:stable-ground
          npm run validate:stable-ground
          git diff --exit-code -- \
            data/project/status-sovereignty-release-manifest.json \
            data/project/status-sovereignty-wave-02-maintainer-review-release-manifest.json \
            build/core-thesis/status-sovereignty/manifest.json \
            build/core-thesis/status-sovereignty/data.json \
            build/core-thesis/status-sovereignty/wave-02-review/manifest.json \
            build/core-thesis/status-sovereignty/wave-02-review/data.json \
            reports/core-thesis/status-sovereignty/data.json \
            reports/core-thesis/status-sovereignty/index.html \
            reports/core-thesis/status-sovereignty/wave-02-review/data.json \
            reports/core-thesis/status-sovereignty/wave-02-review/index.html \
            data/project/poof-clifford-ecology-release-manifest.json \
            reports/core-thesis/poof-clifford-ecology/release-manifest.json \
            data/project/project-stable-ground-sg10-release-manifest.json \
            reports/core-thesis/stable-ground/sg10/checkpoint.json \
            reports/core-thesis/stable-ground/sg10/index.html
          git diff --exit-code -- \
            data/project/project-stable-ground-sg09.json \
            data/project/project-stable-ground-sg09-release-manifest.json \
            reports/core-thesis/stable-ground/sg09/checkpoint.json \
            reports/core-thesis/stable-ground/sg09/index.html
          test -z "$(git status --porcelain)"
