name: Project stable-ground supersession 10 · historical

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg10*.json'
      - 'data/project/project-stable-ground-sg11*.json'
      - 'reports/core-thesis/stable-ground/sg10/**'
      - 'reports/core-thesis/stable-ground/sg11/**'
      - 'tools/build-project-stable-ground-sg10.mjs'
      - 'tools/validate-project-stable-ground-sg10.mjs'
      - 'test/project-stable-ground-sg10.test.js'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - '.github/workflows/project-stable-ground-sg11.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg10*.json'
      - 'data/project/project-stable-ground-sg11*.json'
      - 'reports/core-thesis/stable-ground/sg10/**'
      - 'reports/core-thesis/stable-ground/sg11/**'
      - 'tools/build-project-stable-ground-sg10.mjs'
      - 'tools/validate-project-stable-ground-sg10.mjs'
      - 'test/project-stable-ground-sg10.test.js'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - '.github/workflows/project-stable-ground-sg11.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate SG-10 as immutable history
        run: |
          node tools/validate-project-stable-ground-sg10.mjs
          node test/project-stable-ground-sg10.test.js
      - name: Verify frozen SG-10 bytes at the merge receipt
        run: |
          set -Eeuo pipefail
          receipt=b952da00932012be409c63554d6c81f8367723cb
          for rel in \
            data/project/project-stable-ground-sg10.json \
            data/project/project-stable-ground-sg10-release-manifest.json \
            reports/core-thesis/stable-ground/sg10/checkpoint.json \
            reports/core-thesis/stable-ground/sg10/index.html
          do
            git show "$receipt:$rel" > "/tmp/$(basename "$rel")"
            cmp --silent "$rel" "/tmp/$(basename "$rel")"
          done
      - name: Validate current successor when present
        run: |
          if test -f data/project/project-stable-ground-sg11.json; then
            node tools/validate-project-stable-ground-sg11.mjs
            node test/project-stable-ground-sg11.test.js
          fi
      - name: Run complete repository release gate
        run: npm run release:check
