name: Temporary materialize M-04E constitutional-class estate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/temporary/m04e-constitutional-awareness/READY'
      - '.github/workflows/temporary-m04e-constitutional-awareness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04e-materialize-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble exact source payload
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.github/temporary/m04e-constitutional-awareness')
          expected = {
              'payload-00.txt': '369ec821ce0cb75f8ac8815f7c3267c2be60f99839c46aa4582a5bf00e2d65e8',
              'payload-01.txt': '4eb00b2ec91d097afdbc45f0f94cf84eba88e0b0b47502ae0f9efdced2d22a0a',
          }
          chunks = []
          for name, digest in expected.items():
              raw = (root / name).read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              print(f'{name}: {len(raw)} bytes; sha256={actual}')
              if actual != digest:
                  raise SystemExit(f'{name}: checksum mismatch')
              chunks.append(raw.decode('ascii'))
          encoded = ''.join(chunks)
          if len(encoded) != 47092:
              raise SystemExit(f'base64 length mismatch: {len(encoded)}')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != '38e5e01771381731412571f96b4485a9de09a61122aebe21b1ae99639364d4bd':
              raise SystemExit('assembled base64 checksum mismatch')
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != 35318:
              raise SystemExit(f'payload length mismatch: {len(payload)}')
          if hashlib.sha256(payload).hexdigest() != '5234615d7c00a644e1e7fe8324bc3a476d58ff5265fb100ec5df29fb6a312f95':
              raise SystemExit('payload checksum mismatch')
          Path('/tmp/m04e-source.tgz').write_bytes(payload)
          PY
          tar -tzf /tmp/m04e-source.tgz
      - name: Extract and validate exact estate
        run: |
          tar -xzf /tmp/m04e-source.tgz -C .
          node tools/build-m04e-constitutional-awareness.mjs
          node tools/validate-m04e-constitutional-awareness.mjs
          node test/m04e-constitutional-awareness.test.js
          npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          allowed_exact = {
              '.github/workflows/m04e-constitutional-awareness.yml',
              'data/intake/m04e-constitutional-awareness-estate-wave-01.json',
              'data/project/m04e-constitutional-awareness-estate.json',
              'data/project/m04e-constitutional-awareness-methodology.json',
              'docs/milestones/m04e-constitutional-class-awareness.md',
              'test/m04e-constitutional-awareness.test.js',
              'tools/build-m04e-constitutional-awareness.mjs',
              'tools/validate-m04e-constitutional-awareness.mjs',
          }
          allowed_prefix = (
              'build/core-thesis/constitutional-awareness/',
              'reports/core-thesis/constitutional-awareness/',
          )
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          bad = []
          for row in rows:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefix):
                  continue
              bad.append(path)
          for path in bad:
              tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', '--', path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if tracked:
                  subprocess.run(['git', 'restore', '--staged', '--worktree', '--', path], check=True)
              else:
                  target = Path(path)
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
          if bad:
              print('restored unrelated generated drift:')
              print('\n'.join(bad))
          PY
      - name: Rebuild final permanent products
        run: |
          node tools/build-m04e-constitutional-awareness.mjs
          node tools/validate-m04e-constitutional-awareness.mjs
          node test/m04e-constitutional-awareness.test.js
          git diff --check
      - name: Commit verified permanent estate
        run: |
          target="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "origin/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            data/intake/m04e-constitutional-awareness-estate-wave-01.json \
            data/project/m04e-constitutional-awareness-estate.json \
            data/project/m04e-constitutional-awareness-methodology.json \
            docs/milestones/m04e-constitutional-class-awareness.md \
            test/m04e-constitutional-awareness.test.js \
            tools/build-m04e-constitutional-awareness.mjs \
            tools/validate-m04e-constitutional-awareness.mjs \
            build/core-thesis/constitutional-awareness \
            reports/core-thesis/constitutional-awareness
          git diff --cached --name-status
          git commit -m 'Install M-04E constitutional class and counterpower estate'
          git push --force-with-lease="refs/heads/$target:$remote_sha" origin "HEAD:refs/heads/$target"
