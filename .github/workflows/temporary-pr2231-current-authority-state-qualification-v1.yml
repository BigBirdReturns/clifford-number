name: Temporary PR2231 current authority-state qualification

on:
  push:
    branches:
      - agent/pr2231-current-authority-state-qualification-v1
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PRODUCT: bea76f0dd155122c3a45fe82c7c1abbaf676349b
      EXPECTED_PRODUCT_TREE: 23dde19530990df1f1daa436993b1214e83ac8fd
      EXPECTED_LIBRARY_BLOB: 6655e9aa10ac2964e5f6289a4881f1343265fa0e
      EXPECTED_TEST_BLOB: 7f72ca8c2eb7f436471453c74b98e1227b0970d5
      EXPECTED_CONTROLLER_PARENT: a913ce18b27febb3d826806b8a7cb5fcdc241c15
      EXPECTED_CONTROLLER_PAYLOAD_BLOB: fe35f758ee07a8996e9b7dde8a16e25101860ea6
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      RECEIPT_DIR: /tmp/pr2231-current-authority-state-exact-head-read-only
    steps:
      - name: Check out exact controller event
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recover and execute exact-head read-only qualification
        shell: bash
        run: |
          set -euo pipefail
          payload_dir=/tmp/pr2231-current-authority-state-payload
          rm -rf "$payload_dir" "$RECEIPT_DIR"
          mkdir -p "$payload_dir"
          base64 -d .github/tmp/pr2231-current-authority-state-qualification-v1.tar.gz.b64 \
            | tar -xz -C "$payload_dir"
          script="$payload_dir/pr2231-current-authority-state-qualification-v2.sh"
          test -f "$script"
          chmod +x "$script"
          "$script"
      - name: Upload exact-head qualification receipt and frozen payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-current-authority-state-exact-head-read-only
          path: |
            /tmp/pr2231-current-authority-state-exact-head-read-only
            /tmp/pr2231-current-authority-state-payload
          if-no-files-found: error
          retention-days: 90
