name: Temporary package SSC SG-09 workflow bytes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/materialize-ssc-sg09.mjs'
      - '.github/workflows/temporary-materialize-ssc-sg09.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ssc-sg09-workflows
  cancel-in-progress: false

jobs:
  package:
    if: github.head_ref == 'agent/ssc-wave01-second-party-review-campaign' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-wave01-second-party-review-campaign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate exact workflow bytes
        run: |
          set -Eeuo pipefail
          node .github/tmp/materialize-ssc-sg09.mjs
          mkdir -p /tmp/ssc-sg09-workflows/.github/workflows
          cp \
            .github/workflows/project-stable-ground-sg07.yml \
            .github/workflows/status-sovereignty-compact.yml \
            .github/workflows/status-sovereignty-wave-01.yml \
            .github/workflows/status-sovereignty-wave-01-review.yml \
            .github/workflows/status-sovereignty-wave-01-targeted-acquisition.yml \
            .github/workflows/status-sovereignty-wave-01-second-party-review.yml \
            /tmp/ssc-sg09-workflows/.github/workflows/
          sha256sum /tmp/ssc-sg09-workflows/.github/workflows/*
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-sg09-exact-workflows
          path: /tmp/ssc-sg09-workflows
          if-no-files-found: error
          retention-days: 1
