name: Temporary materialize K0 Wave 01 additional acquisition

on:
  push:
    branches:
      - agent/k0-wave01-additional-acquisition
    paths:
      - '.github/workflows/temporary-materialize-k0-wave01-additional-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-wave01-additional-acquisition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand exact additional-acquisition package
        run: |
          base64 -d .github/tmp/k0-wave01-additional-acquisition-package.b64 > /tmp/k0-wave01-additional-acquisition-package.tgz
          test "$(sha256sum /tmp/k0-wave01-additional-acquisition-package.tgz | awk '{print $1}')" = "d295d9cb2a95f6e7c47134eec0205670acbfff2ad4a97600af2f7df106bb3a31"
          tar -xzf /tmp/k0-wave01-additional-acquisition-package.tgz -C .

      - name: Build, validate, and test exact package
        run: |
          node tools/build-k0-wave01-additional-acquisition.mjs
          node tools/validate-k0-wave01-additional-acquisition.mjs
          node test/k0-wave01-additional-acquisition.test.js

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          tar -xzf /tmp/k0-wave01-additional-acquisition-package.tgz -C .
          node tools/build-k0-wave01-additional-acquisition.mjs
          node tools/validate-k0-wave01-additional-acquisition.mjs
          node test/k0-wave01-additional-acquisition.test.js

      - name: Enforce permanent path denominator
        run: |
          python - <<'PYDENOM'
          import subprocess
          expected = {
              '.github/workflows/k0-wave01-additional-acquisition.yml',
              'data/project/k0-wave01-additional-acquisition-release-manifest.json',
              'data/research/k0-wave01-additional-acquisition-resolution.json',
              'docs/milestones/m05-k0-wave01-additional-acquisition.md',
              'reports/core-thesis/answerable-power/k0-wave01-additional-acquisition.html',
              'reports/core-thesis/answerable-power/k0-wave01-additional-acquisition.json',
              'test/k0-wave01-additional-acquisition.test.js',
              'tools/build-k0-wave01-additional-acquisition.mjs',
              'tools/validate-k0-wave01-additional-acquisition.mjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM

      - name: Create exact blob receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBLOBS'
          import base64, json, os, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          paths = [
              '.github/workflows/k0-wave01-additional-acquisition.yml',
              'data/project/k0-wave01-additional-acquisition-release-manifest.json',
              'data/research/k0-wave01-additional-acquisition-resolution.json',
              'docs/milestones/m05-k0-wave01-additional-acquisition.md',
              'reports/core-thesis/answerable-power/k0-wave01-additional-acquisition.html',
              'reports/core-thesis/answerable-power/k0-wave01-additional-acquisition.json',
              'test/k0-wave01-additional-acquisition.test.js',
              'tools/build-k0-wave01-additional-acquisition.mjs',
              'tools/validate-k0-wave01-additional-acquisition.mjs',
          ]
          def post(path, payload):
              req = urllib.request.Request(api + path, data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'k0-wave01-additional-acquisition',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          rows = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = post(f'/repos/{repo}/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              rows.append({'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': '100644'})
          receipt = {
              'schema_version': 'k0-wave01-additional-acquisition-transaction@1',
              'repository': repo,
              'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'updates': rows,
              'deletions': [
                  '.github/tmp/k0-wave01-additional-acquisition-package.b64',
                  '.github/workflows/temporary-materialize-k0-wave01-additional-acquisition.yml',
              ],
              'package_sha256': 'd295d9cb2a95f6e7c47134eec0205670acbfff2ad4a97600af2f7df106bb3a31',
              'ref_updated': False,
              'graph_effect': 'none',
          }
          os.makedirs('/tmp/k0-additional-export', exist_ok=True)
          with open('/tmp/k0-additional-export/BLOB_RECEIPTS.json', 'w') as handle:
              json.dump(receipt, handle, indent=2); handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PYBLOBS

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-wave01-additional-acquisition-validated-transaction
          path: /tmp/k0-additional-export/BLOB_RECEIPTS.json
          if-no-files-found: error
          retention-days: 30
