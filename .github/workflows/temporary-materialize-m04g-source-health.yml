name: Temporary materialize M-04G source health

on:
  push:
    branches:
      - agent/m05-sprint-02-leg-07-m04g-source-health
    paths:
      - '.github/workflows/temporary-materialize-m04g-source-health.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-02-leg-07-m04g-source-health
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test source health
        run: |
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node test/m04g-global-circulation.test.js
      - name: Commit generated products
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build/core-thesis/global-circulation/data.json reports/core-thesis/global-circulation/data.json reports/core-thesis/global-circulation/index.html
          if git diff --cached --quiet; then
            echo 'No generated drift'
          else
            git commit -m 'Materialize governed M-04G source-health products'
            git push origin HEAD:agent/m05-sprint-02-leg-07-m04g-source-health
          fi
