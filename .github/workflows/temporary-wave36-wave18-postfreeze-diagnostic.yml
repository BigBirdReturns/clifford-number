name: Temporary Wave 36 Wave 18 post-freeze diagnostic

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-wave18-postfreeze-diagnostic.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-wave36-wave18-postfreeze-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave36-wave18-postfreeze-diagnostic.yml'
          encoded_ref='agent%2Flake-allocator-war-public-acquisition-wave-36'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || exit 1
            sleep 2
          done
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Print bounded post-freeze shapes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync('data/project/lake-identifier-topology-wave-18-policy.json','utf8'));
          const registry = JSON.parse(fs.readFileSync(policy.paths.registry,'utf8'));
          const projection = JSON.parse(fs.readFileSync(policy.paths.projection,'utf8'));
          const receipt = JSON.parse(fs.readFileSync(policy.paths.receipt,'utf8'));
          const frozen = 10371;
          const post = registry.records.slice(frozen);
          const summarize = row => ({
            keys: Object.keys(row),
            topology_decision_id: row.topology_decision_id,
            id_key: row.id_key,
            id_value: row.id_value,
            baseline_states: row.baseline_states,
            indexing: row.indexing,
            source_only: row.source_only,
            divergence: row.divergence,
            review_required_to_decide: row.review_required_to_decide,
            correction_mode: row.correction_mode,
            cross_key_join_authorized: row.cross_key_join_authorized,
            graph_effect: row.graph_effect,
            source_paths: row.source_paths,
            source_families: row.source_families,
            source_roles: row.source_roles
          });
          console.log(JSON.stringify({
            policy_paths: policy.paths,
            registry_keys: Object.keys(registry),
            registry_counts: registry.counts,
            total_records: registry.records.length,
            post_freeze_records: post.length,
            first_post_freeze: post.slice(0,2).map(summarize),
            last_post_freeze: post.slice(-3).map(summarize),
            projection_keys: Object.keys(projection),
            projection_counts: projection.counts,
            projection_last: projection.topology_decisions.slice(-2).map(row => ({keys:Object.keys(row),topology_decision_id:row.topology_decision_id,id_key:row.id_key,id_value:row.id_value})),
            receipt_keys: Object.keys(receipt),
            receipt_counts: receipt.counts
          }, null, 2));
          NODE
