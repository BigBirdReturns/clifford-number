name: Counter-Selector Wave 18 repair continuation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-18.yml'
      - 'data/project/counter-selector-wave-18-repair-continuation.json'
      - 'data/project/counter-selector-repair-continuation-registry.json'
      - 'data/project/counter-selector-external-review-export-registry.json'
      - 'data/project/counter-selector-wave-18-release-manifest.json'
      - 'schemas/counter-selector-repair-continuation.schema.json'
      - 'docs/methods/counter-selector-repair-continuation.md'
      - 'docs/milestones/counter-selector-wave-18.md'
      - 'tools/build-counter-selector-wave-18.mjs'
      - 'tools/validate-counter-selector-wave-18.mjs'
      - 'test/counter-selector-wave-18.test.js'
      - 'reports/core-thesis/counter-selector-wave-18/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-18-repair-continuation'
    paths:
      - '.github/workflows/counter-selector-wave-18.yml'
      - 'data/project/counter-selector-wave-18-repair-continuation.json'
      - 'data/project/counter-selector-repair-continuation-registry.json'
      - 'data/project/counter-selector-external-review-export-registry.json'
      - 'data/project/counter-selector-wave-18-release-manifest.json'
      - 'schemas/counter-selector-repair-continuation.schema.json'
      - 'docs/methods/counter-selector-repair-continuation.md'
      - 'docs/milestones/counter-selector-wave-18.md'
      - 'tools/build-counter-selector-wave-18.mjs'
      - 'tools/validate-counter-selector-wave-18.mjs'
      - 'test/counter-selector-wave-18.test.js'
      - 'reports/core-thesis/counter-selector-wave-18/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 18 products
        run: node tools/build-counter-selector-wave-18.mjs
      - name: Validate repair-continuation contract
        run: node tools/validate-counter-selector-wave-18.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-18.test.js
      - name: Require exact committed Wave 18 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-repair-continuation-registry.json \
            data/project/counter-selector-external-review-export-registry.json \
            data/project/counter-selector-wave-18-release-manifest.json \
            reports/core-thesis/counter-selector-wave-18/data.json \
            reports/core-thesis/counter-selector-wave-18/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 18 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-18.mjs
          node tools/validate-counter-selector-wave-18.mjs
          node test/counter-selector-wave-18.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
