name: Recover SSC RD-04 SNAP search replay A03 product

on:
  push:
    branches:
      - 'agent/ssc-rd04-snap-search-replay-a03'
    paths:
      - '.github/workflows/recover-status-sovereignty-rd04-snap-search-replay-a03.yml'
  pull_request:
    paths:
      - '.github/workflows/recover-status-sovereignty-rd04-snap-search-replay-a03.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover the five immutable capture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rd04-a03-*
          path: collected
          merge-multiple: true
          run-id: 30725034294
          github-token: ${{ github.token }}
      - name: Restore retained scripts
        run: |
          base64 --decode data/transport/ssc-rd04-a03-acquire.py.gz.b64 | gunzip > tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py
          base64 --decode data/transport/ssc-rd04-a03-build.py.gz.b64 | gunzip > tools/build-status-sovereignty-rd04-snap-search-replay-a03.py
          chmod +x tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py tools/build-status-sovereignty-rd04-snap-search-replay-a03.py
          python -m py_compile tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py tools/build-status-sovereignty-rd04-snap-search-replay-a03.py
      - name: Stage the exact read-only workflow for manifest construction
        run: |
          cat > .github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml <<'WORKFLOW'
          name: SSC RD-04 SNAP search replay A03

          on:
            push:
              branches:
                - 'agent/ssc-rd04-snap-search-replay-a03'
              paths:
                - '.github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml'
                - 'data/intake/status-sovereignty-rd04-snap-search-replay-a03/**'
                - 'data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json'
                - 'tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'tools/build-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
                - 'reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
            pull_request:
              paths:
                - '.github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml'
                - 'data/intake/status-sovereignty-rd04-snap-search-replay-a03/**'
                - 'data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json'
                - 'tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'tools/build-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
                - 'reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 120
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Validate 200 frozen query receipts and deterministic projections
                  run: python tools/build-status-sovereignty-rd04-snap-search-replay-a03.py --repo-root . --check
                - name: Run complete repository release gate
                  run: npm run release:check
                - name: Preserve exact A03 products
                  uses: actions/upload-artifact@v4
                  with:
                    name: ssc-rd04-snap-search-replay-a03
                    path: |
                      data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json
                      build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03
                      reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03
                    if-no-files-found: error
          WORKFLOW
      - name: Retire carrier files in the product worktree
        run: rm -f data/transport/ssc-rd04-a03-acquire.py.gz.b64 data/transport/ssc-rd04-a03-build.py.gz.b64
      - name: Rebuild and validate from the preserved capture artifacts
        run: |
          python tools/build-status-sovereignty-rd04-snap-search-replay-a03.py \
            --repo-root . \
            --materialize \
            --collected collected
          python tools/build-status-sovereignty-rd04-snap-search-replay-a03.py --repo-root . --check
          npm run release:check
          git diff --check
      - name: Publish non-workflow product bytes without recapturing queries
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_HEAD"
          rm -rf collected
          rm -f .github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/transport \
            data/intake/status-sovereignty-rd04-snap-search-replay-a03 \
            data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json \
            build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03 \
            reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03 \
            tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py \
            tools/build-status-sovereignty-rd04-snap-search-replay-a03.py
          git commit -m "Recover SSC RD-04 A03 frozen search replay product"
          git push origin "HEAD:${BRANCH}"
