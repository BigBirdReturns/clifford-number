name: TEMP capture SSC Wave 02 RD-01 and RD-05 public universes

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-wave02-rd01-rd05-universe-capture-base-v1
    paths:
      - '.github/tmp/ssc-wave02-rd01-rd05-universe-capture-v1.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-wave02-rd01-rd05-universe-capture-v1
  cancel-in-progress: false

jobs:
  rd01:
    name: capture-rd01-natsec100-roster-surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44f746ca2301f7f5e92a9ca59df3a76908e2f1cd
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture static and rendered NatSec100 source bytes
        env:
          SOURCE_URL: https://www.natsec100.org/natsec100-2026
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          out='rd01-universe-capture'
          mkdir -p "$out/static" "$out/rendered"
          printf '%s\n' "$SOURCE_URL" > "$out/source-url.txt"

          resolved=0
          for attempt in 1 2; do
            headers="$out/static/attempt-${attempt}.headers"
            body="$out/static/attempt-${attempt}.body"
            stderr="$out/static/attempt-${attempt}.stderr"
            meta="$out/static/attempt-${attempt}.meta"
            set +e
            curl --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --user-agent 'clifford-number-rd01-roster-custody/1.0' \
              --dump-header "$headers" --output "$body" \
              --write-out '%{http_code}\n%{url_effective}\n%{content_type}\n%{size_download}\n' \
              "$SOURCE_URL" > "$meta" 2> "$stderr"
            code=$?
            set -e
            printf '%s\n' "$code" > "$out/static/attempt-${attempt}.curl-exit"
            status="$(sed -n '1p' "$meta" || true)"
            if test "$code" = 0 && test "$status" = 200 && test -s "$body"; then
              resolved=1
              printf '%s\n' "$attempt" > "$out/static/final-attempt.txt"
              break
            fi
          done
          printf '%s\n' "$resolved" > "$out/static/resolved.txt"

          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$candidate"; break; fi
          done
          printf '%s\n' "$browser" > "$out/rendered/browser.txt"
          if test -n "$browser"; then
            set +e
            timeout 120 "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom "$SOURCE_URL" \
              > "$out/rendered/dom.html" 2> "$out/rendered/stderr.txt"
            render_exit=$?
            set -e
          else
            : > "$out/rendered/dom.html"
            printf '%s\n' 'no supported browser executable' > "$out/rendered/stderr.txt"
            render_exit=127
          fi
          printf '%s\n' "$render_exit" > "$out/rendered/exit.txt"

          SOURCE_URL="$SOURCE_URL" OUT="$out" node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const out = process.env.OUT;
          const sha256 = (body) => crypto.createHash('sha256').update(body).digest('hex');
          const read = (target) => fs.existsSync(target) ? fs.readFileSync(target) : Buffer.alloc(0);
          const finalAttemptPath = path.join(out, 'static/final-attempt.txt');
          const finalAttempt = fs.existsSync(finalAttemptPath) ? Number(fs.readFileSync(finalAttemptPath, 'utf8').trim()) : 2;
          const staticBodyPath = path.join(out, `static/attempt-${finalAttempt}.body`);
          const staticBody = read(staticBodyPath);
          const staticMeta = read(path.join(out, `static/attempt-${finalAttempt}.meta`)).toString('utf8').split(/\r?\n/);
          const renderedBody = read(path.join(out, 'rendered/dom.html'));
          const analysisBody = renderedBody.length > 0 ? renderedBody : staticBody;
          const html = analysisBody.toString('utf8');
          const text = html
            .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;|&#160;/gi, ' ')
            .replace(/&amp;/gi, '&')
            .replace(/\s+/g, ' ')
            .trim();
          const occurrences = (needle) => (text.match(new RegExp(needle, 'gi')) || []).length;
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].map((match, index) => {
            const attrs = match[1] || '';
            const body = Buffer.from(match[2] || '', 'utf8');
            const src = attrs.match(/\bsrc=["']([^"']+)["']/i)?.[1] ?? null;
            const type = attrs.match(/\btype=["']([^"']+)["']/i)?.[1] ?? null;
            return { index, src, type, bytes: body.length, sha256: sha256(body), json_like: /^\s*[\[{]/.test(body.toString('utf8')) };
          });
          const hrefs = [...new Set([...html.matchAll(/\bhref=["']([^"'#]+)["']/gi)].map((match) => match[1]))].sort();
          const rankValues = new Set();
          for (const pattern of [/(?:data-rank|rank)[^0-9]{0,24}([1-9][0-9]?|100)\b/gi, /["']rank["']\s*:\s*([1-9][0-9]?|100)\b/gi]) {
            for (const match of html.matchAll(pattern)) rankValues.add(Number(match[1]));
          }
          const snippet = (needle) => {
            const index = text.toLowerCase().indexOf(needle.toLowerCase());
            return index < 0 ? null : text.slice(Math.max(0, index - 180), Math.min(text.length, index + needle.length + 220));
          };
          const candidateClassFragments = [...html.matchAll(/<[^>]+class=["'][^"']*(?:company|rank|card|entry|list|name|title)[^"']*["'][^>]*>/gi)].slice(0, 200).map((match) => match[0]);
          const summary = {
            schema_version: 'ssc-rd01-wave02-roster-surface-capture@1',
            class_id: 'RD-01-C03',
            issue: 786,
            captured_source: process.env.SOURCE_URL,
            exact_child_head: '44f746ca2301f7f5e92a9ca59df3a76908e2f1cd',
            static: {
              resolved: fs.readFileSync(path.join(out, 'static/resolved.txt'), 'utf8').trim() === '1',
              final_attempt: finalAttempt,
              http_status: Number(staticMeta[0] || 0),
              final_url: staticMeta[1] || process.env.SOURCE_URL,
              content_type: staticMeta[2] || '',
              body_bytes: staticBody.length,
              body_sha256: sha256(staticBody)
            },
            rendered: {
              browser: fs.readFileSync(path.join(out, 'rendered/browser.txt'), 'utf8').trim(),
              exit: Number(fs.readFileSync(path.join(out, 'rendered/exit.txt'), 'utf8').trim()),
              body_bytes: renderedBody.length,
              body_sha256: sha256(renderedBody)
            },
            analysis_surface: renderedBody.length > 0 ? 'rendered_dom' : 'static_response',
            analysis_bytes: analysisBody.length,
            analysis_sha256: sha256(analysisBody),
            structural_observations: {
              script_tags: scripts.length,
              json_like_inline_scripts: scripts.filter((row) => row.json_like).length,
              external_script_sources: scripts.filter((row) => row.src).map((row) => row.src),
              href_count: hrefs.length,
              detected_rank_values: [...rankValues].sort((a, b) => a - b),
              detected_rank_value_count: rankValues.size,
              candidate_class_fragment_count: candidateClassFragments.length,
              natsec100_occurrences: occurrences('NatSec100'),
              spacex_occurrences: occurrences('SpaceX'),
              anthropic_occurrences: occurrences('Anthropic'),
              spacex_snippet: snippet('SpaceX'),
              anthropic_snippet: snippet('Anthropic')
            },
            scripts,
            hrefs,
            candidate_class_fragments: candidateClassFragments,
            current_result: {
              exact_source_captured: staticBody.length > 0,
              rendered_dom_captured: renderedBody.length > 0,
              complete_100_row_roster_parsed: false,
              explicit_two_control_rows_parsed: false,
              parser_authorized_after_structure_review: true,
              outside_human_dependency: false,
              project_blocking: false,
              class_closed: false,
              publication_effect: 'none',
              adoption_effect: 'none',
              graph_effect: 'none'
            },
            authority: {
              page_capture_is_legal_entity_resolution: false,
              rank_marker_is_roster_row: false,
              company_name_is_legal_entity: false,
              missing_rendered_text_is_source_absence: false,
              external_contacts: 0,
              external_reviews: 0,
              graph_effect: 'none'
            }
          };
          fs.writeFileSync(path.join(out, 'summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          const files = [];
          function walk(target) {
            for (const entry of fs.readdirSync(target, { withFileTypes: true })) {
              const full = path.join(target, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name !== 'manifest.json') files.push(full);
            }
          }
          walk(out);
          const entries = files.sort().map((file) => { const body = fs.readFileSync(file); return { path: path.relative(out, file).split(path.sep).join('/'), bytes: body.length, sha256: sha256(body) }; });
          const combined = sha256(Buffer.from(entries.map((row) => `${row.path}\0${row.bytes}\0${row.sha256}\n`).join(''), 'utf8'));
          fs.writeFileSync(path.join(out, 'manifest.json'), `${JSON.stringify({ schema_version: 'ssc-rd01-wave02-roster-surface-manifest@1', entries, combined_sha256: combined }, null, 2)}\n`);
          console.log(JSON.stringify({ analysis_surface: summary.analysis_surface, analysis_bytes: summary.analysis_bytes, rank_values: rankValues.size, spacex: summary.structural_observations.spacex_occurrences, anthropic: summary.structural_observations.anthropic_occurrences }));
          NODE
      - name: Upload exact RD-01 source structure
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave02-roster-surface-capture
          path: rd01-universe-capture
          if-no-files-found: error
          retention-days: 90

  rd05:
    name: capture-rd05-aces-official-record-surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b3a73448759bac1210988a25e3d3b8c745a58b7
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture exact bounded ACES source universe and derive object candidates
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          OUT='rd05-universe-capture' node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const out = process.env.OUT;
          const parentPath = 'data/intake/status-sovereignty-rd05-aces-authority-control.json';
          const parentBody = fs.readFileSync(parentPath);
          const parent = JSON.parse(parentBody.toString('utf8'));
          if (parent.execution_id !== 'SSC-RD05-ACES-01') throw new Error(`parent execution ${parent.execution_id}`);
          if (!Array.isArray(parent.sources) || parent.sources.length !== 10) throw new Error(`source denominator ${parent.sources?.length}`);
          fs.rmSync(out, { recursive: true, force: true });
          fs.mkdirSync(path.join(out, 'sources'), { recursive: true });
          const sha256 = (body) => crypto.createHash('sha256').update(body).digest('hex');
          const safe = (value) => String(value).replace(/[^A-Za-z0-9._-]+/g, '-');
          const keywords = ['recommendation','final recommendation','agency response','disposition','adoption','adopted','rejection','rejected','implementation','outcome','minutes','transcript','agenda','subcommittee','termination','archive','charter','meeting','presentation','report'];
          const urlCandidatePattern = /(recommend|minute|agenda|meeting|faca|charter|transcript|presentation|report|archive|terminat|cancel|space-commerce|committee)/i;
          const receipts = [];
          const candidateMap = new Map();
          for (const source of parent.sources) {
            const sourceDir = path.join(out, 'sources', safe(source.source_id));
            fs.mkdirSync(sourceDir, { recursive: true });
            const attempts = [];
            for (let attempt = 1; attempt <= 2; attempt += 1) {
              const headersPath = path.join(sourceDir, `attempt-${attempt}.headers`);
              const bodyPath = path.join(sourceDir, `attempt-${attempt}.body`);
              const stderrPath = path.join(sourceDir, `attempt-${attempt}.stderr`);
              const metaPath = path.join(sourceDir, `attempt-${attempt}.meta`);
              const result = spawnSync('curl', [
                '--location','--silent','--show-error','--connect-timeout','15','--max-time','60',
                '--user-agent','clifford-number-rd05-official-record-custody/1.0',
                '--dump-header',headersPath,'--output',bodyPath,
                '--write-out','%{http_code}\n%{url_effective}\n%{content_type}\n%{size_download}\n',
                source.url
              ], { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 });
              if (!fs.existsSync(headersPath)) fs.writeFileSync(headersPath, Buffer.alloc(0));
              if (!fs.existsSync(bodyPath)) fs.writeFileSync(bodyPath, Buffer.alloc(0));
              fs.writeFileSync(stderrPath, result.stderr || '', 'utf8');
              fs.writeFileSync(metaPath, result.stdout || '', 'utf8');
              const meta = String(result.stdout || '').split(/\r?\n/);
              const body = fs.readFileSync(bodyPath);
              const receipt = {
                attempt,
                curl_exit: Number.isInteger(result.status) ? result.status : 255,
                http_status: Number(meta[0] || 0),
                final_url: meta[1] || source.url,
                content_type: meta[2] || '',
                reported_bytes: Number(meta[3] || 0),
                headers_path: path.relative(out, headersPath).split(path.sep).join('/'),
                headers_bytes: fs.statSync(headersPath).size,
                headers_sha256: sha256(fs.readFileSync(headersPath)),
                body_path: path.relative(out, bodyPath).split(path.sep).join('/'),
                body_bytes: body.length,
                body_sha256: sha256(body),
                resolved: (Number.isInteger(result.status) ? result.status : 255) === 0 && Number(meta[0] || 0) === 200 && body.length > 0
              };
              attempts.push(receipt);
              if (receipt.resolved) break;
            }
            const terminal = attempts.at(-1);
            const terminalBody = fs.readFileSync(path.join(out, terminal.body_path));
            const contentType = String(terminal.content_type || '').toLowerCase();
            const looksHtml = contentType.includes('html') || /^\s*<!doctype html|^\s*<html/i.test(terminalBody.toString('utf8', 0, Math.min(terminalBody.length, 1000)));
            const looksPdf = contentType.includes('pdf') || terminalBody.subarray(0, 5).toString('ascii') === '%PDF-';
            let extractedText = '';
            let textExtraction = 'none';
            if (looksHtml) {
              const html = terminalBody.toString('utf8');
              extractedText = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;|&#160;/gi, ' ').replace(/&amp;/gi, '&').replace(/\s+/g, ' ').trim();
              textExtraction = 'html_tag_strip';
              for (const match of html.matchAll(/\bhref=["']([^"'#]+)["']/gi)) {
                try {
                  const absolute = new URL(match[1], terminal.final_url).href;
                  const url = new URL(absolute);
                  const sourceHost = new URL(terminal.final_url).host;
                  if ((url.host === sourceHost || /\.gov$/i.test(url.host)) && urlCandidatePattern.test(absolute)) candidateMap.set(absolute, { url: absolute, discovered_from: source.source_id });
                } catch {}
              }
            } else if (looksPdf && terminalBody.length > 0) {
              const textPath = path.join(sourceDir, 'terminal.txt');
              const pdftotext = spawnSync('pdftotext', [path.join(out, terminal.body_path), textPath], { encoding: 'utf8' });
              if (pdftotext.status === 0 && fs.existsSync(textPath)) {
                extractedText = fs.readFileSync(textPath, 'utf8');
                textExtraction = 'pdftotext';
              } else {
                fs.writeFileSync(path.join(sourceDir, 'pdftotext.stderr'), pdftotext.stderr || '', 'utf8');
                textExtraction = 'pdf_text_unavailable';
              }
            }
            const lower = extractedText.toLowerCase();
            const keywordCounts = Object.fromEntries(keywords.map((keyword) => [keyword, lower.split(keyword).length - 1]));
            receipts.push({
              source_id: source.source_id,
              publisher: source.publisher,
              title: source.title,
              requested_url: source.url,
              source_class: source.source_class,
              attempts,
              terminal_state: terminal.resolved ? 'http_success' : terminal.curl_exit !== 0 ? 'transport_failure_after_bounded_retry' : 'http_non_200_after_bounded_retry',
              resolved: terminal.resolved,
              terminal_http_status: terminal.http_status,
              terminal_content_type: terminal.content_type,
              terminal_body_bytes: terminal.body_bytes,
              terminal_body_sha256: terminal.body_sha256,
              text_extraction: textExtraction,
              extracted_text_characters: extractedText.length,
              keyword_counts: keywordCounts
            });
          }
          const candidates = [...candidateMap.values()].sort((a, b) => a.url.localeCompare(b.url));
          const summary = {
            schema_version: 'ssc-rd05-wave02-official-record-surface-capture@1',
            class_id: 'RD-05-C03',
            issue: 790,
            exact_child_head: '2b3a73448759bac1210988a25e3d3b8c745a58b7',
            parent: { path: parentPath, bytes: parentBody.length, sha256: sha256(parentBody), execution_id: parent.execution_id },
            sources: receipts,
            candidate_official_objects: candidates,
            counts: {
              frozen_sources: receipts.length,
              terminal_source_receipts: receipts.length,
              resolved_sources: receipts.filter((row) => row.resolved).length,
              unresolved_sources: receipts.filter((row) => !row.resolved).length,
              total_attempts: receipts.reduce((sum, row) => sum + row.attempts.length, 0),
              candidate_official_object_urls: candidates.length,
              complete_official_object_universe_frozen: 0,
              recommendations_terminally_classified: 0,
              agency_responses_terminally_classified: 0,
              dispositions_terminally_classified: 0,
              class_closed: 0,
              external_contacts: 0,
              external_reviews: 0,
              graph_effects: 0
            },
            current_result: {
              terminal_state: 'bounded_parent_sources_captured_candidate_official_objects_derived',
              source_capture_complete: true,
              candidate_object_derivation_complete_for_recovered_html: true,
              complete_official_object_universe_frozen: false,
              recommendation_disposition_protocol_complete: false,
              class_closed: false,
              outside_human_dependency: false,
              project_blocking: false,
              publication_effect: 'none',
              adoption_effect: 'none',
              graph_effect: 'none'
            },
            authority: {
              candidate_url_is_official_object_admission: false,
              keyword_occurrence_is_recommendation: false,
              agenda_is_completed_output: false,
              termination_is_suppression_or_rejection: false,
              missing_public_output_is_no_influence: false,
              external_contacts: 0,
              external_reviews: 0,
              graph_effect: 'none'
            }
          };
          fs.writeFileSync(path.join(out, 'summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          const files = [];
          function walk(target) {
            for (const entry of fs.readdirSync(target, { withFileTypes: true })) {
              const full = path.join(target, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name !== 'manifest.json') files.push(full);
            }
          }
          walk(out);
          const entries = files.sort().map((file) => { const body = fs.readFileSync(file); return { path: path.relative(out, file).split(path.sep).join('/'), bytes: body.length, sha256: sha256(body) }; });
          const combined = sha256(Buffer.from(entries.map((row) => `${row.path}\0${row.bytes}\0${row.sha256}\n`).join(''), 'utf8'));
          fs.writeFileSync(path.join(out, 'manifest.json'), `${JSON.stringify({ schema_version: 'ssc-rd05-wave02-official-record-surface-manifest@1', entries, combined_sha256: combined }, null, 2)}\n`);
          console.log(JSON.stringify({ sources: receipts.length, resolved: summary.counts.resolved_sources, unresolved: summary.counts.unresolved_sources, candidates: candidates.length }));
          NODE
      - name: Upload exact RD-05 source structure
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd05-wave02-official-record-surface-capture
          path: rd05-universe-capture
          if-no-files-found: error
          retention-days: 90

  reconcile:
    name: reconcile-rd01-rd05-captures
    needs: [rd01, rd05]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ssc-rd0*-wave02-*-surface-capture
          path: captures
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove exact two-lane capture denominator and authority
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function collect(target) {
            if (!fs.existsSync(target)) return [];
            if (fs.statSync(target).isFile()) return path.basename(target) === 'summary.json' ? [target] : [];
            return fs.readdirSync(target).flatMap((name) => collect(path.join(target, name)));
          }
          const files = collect('captures').sort();
          if (files.length !== 2) throw new Error(`summary denominator ${files.length}`);
          const summaries = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8'))).sort((a, b) => a.class_id.localeCompare(b.class_id));
          if (JSON.stringify(summaries.map((row) => row.class_id)) !== JSON.stringify(['RD-01-C03','RD-05-C03'])) throw new Error('class denominator');
          for (const row of summaries) {
            if (row.current_result.outside_human_dependency !== false || row.current_result.class_closed !== false) throw new Error(`${row.class_id} authority`);
            if (row.current_result.graph_effect !== 'none') throw new Error(`${row.class_id} graph effect`);
          }
          const receipt = {
            schema_version: 'ssc-wave02-rd01-rd05-capture-reconciliation@1',
            class_ids: summaries.map((row) => row.class_id),
            status: 'two_exact_public_universe_capture_surfaces_ready_for_parser_and_object_denominator_freeze',
            execution_completion_is_class_closure: false,
            authority: { outside_human_dependency: false, external_contacts: 0, external_reviews: 0, classes_closed: 0, publication_effect: 'none', adoption_effect: 'none', graph_effect: 'none' }
          };
          fs.writeFileSync('captures/reconciliation.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(receipt.status);
          NODE
      - name: Upload reconciled capture fanout
        uses: actions/upload-artifact@v4
        with:
          name: ssc-wave02-rd01-rd05-universe-capture-reconciliation
          path: captures
          if-no-files-found: error
          retention-days: 90
