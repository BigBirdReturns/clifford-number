name: TEMP adjudicate RD-04 North Dakota FNA index redirect v1

on:
  pull_request:
    branches: [agent/ssc-rd04-nd-fna-index-redirect-adjudication-base-v1]
    types: [opened, synchronize, reopened]
    paths: [.trigger/ssc-rd04-nd-fna-index-redirect-adjudication-v1.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-adjudicate-ssc-rd04-nd-fna-index-redirect-v1
  cancel-in-progress: false

env:
  MAIN: a592acea22c69a979f2a90c24a2bafb8c9445759
  MATRIX: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  BASE: agent/ssc-rd04-nd-fna-index-redirect-adjudication-base-v1
  HEAD: agent/ssc-rd04-nd-fna-index-redirect-adjudication-trigger-v1
  WF: .github/workflows/temp-adjudicate-ssc-rd04-nd-fna-index-redirect-v1.yml
  TRIGGER: .trigger/ssc-rd04-nd-fna-index-redirect-adjudication-v1.json
  ARTIFACT_ID: '9031911277'
  ARTIFACT_BYTES: '1355234'
  ARTIFACT_DIGEST: sha256:53b54d9d23ab14e4f4e1b630390855a784d082997ca06596c4977b880902906e
  EXECUTION_RECEIPT_SHA: b85a60d69a2df7b72e61e8cec5e83a5be5b9e140b14c09b74d2768fa86da0037
  ROUTE_RECEIPT_SHA: b0615195176d9edc7c86fdb2ad29b6a7bd07ef4aecd59438eb8f12e41550ed32
  BODY_SHA: d9e5a50fca24303819557d37921a13824074ae80a2d2137290d048be57e162cf
  HEADERS_SHA: fc7146e235dbc7dcc3bd99fca753fec44af69ae3c6f2ca8eb0826464ae675dc2
  OUT: /tmp/ssc-rd04-nd-fna-index-redirect-adjudication-v1

jobs:
  adjudicate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-fna-index-redirect-adjudication-trigger-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0}

      - name: Adjudicate captured redirect offline
        id: run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          SRC="$OUT/execution"
          rm -rf "$OUT"; mkdir -p "$OUT" "$SRC"
          exec > >(tee "$OUT/adjudication.log") 2>&1
          stage=bootstrap
          fail_receipt(){ rc=$1; [[ -s "$OUT/receipt.json" ]] || jq -n --arg s "$stage" --argjson c "$rc" '{schema_version:"ssc-rd04-nd-fna-index-redirect-adjudication-receipt@1",state:"failed_closed",stage:$s,exit_code:$c,source_requests:0,route_executions:0,source_admissions:0,field_terminalizations:0,matrix_updates:0,row_state_mutations:0,class_closed:false,outside_human_dependency:false,selected_followup_routes:0,additional_execution_authorized:false}' > "$OUT/receipt.json"; }
          finish(){ rc=$?; trap - EXIT; set +e; fail_receipt "$rc"; printf '%s\n' "$rc" > "$OUT/EXIT_CODE"; printf '%s\n' "$stage" > "$OUT/STAGE"; (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS); exit "$rc"; }
          trap finish EXIT
          trap 'rc=$?; trap - ERR; set +e; fail_receipt "$rc"; exit "$rc"' ERR
          set -Eeuo pipefail

          stage=topology
          B=$(git rev-parse HEAD^); H=$(git rev-parse HEAD)
          test "$(git rev-parse "$B^")" = "$MAIN"
          test "$(git rev-list --count "$MAIN".."$B")" -eq 1
          test "$(git rev-list --count "$B".."$H")" -eq 1
          test "$(git diff --name-only "$MAIN" "$B")" = "$WF"
          test "$(git diff --name-only "$B" "$H")" = "$TRIGGER"
          test "$(git diff --name-only --diff-filter=A "$MAIN" "$B")" = "$WF"
          test "$(git diff --name-only --diff-filter=A "$B" "$H")" = "$TRIGGER"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$MAIN" "$H")"
          git diff --check "$MAIN" "$H"
          cp "$TRIGGER" "$OUT/trigger.json"
          jq -e --arg p "$MAIN" --arg m "$MATRIX_BLOB" --arg d "$ARTIFACT_DIGEST" --arg e "$EXECUTION_RECEIPT_SHA" --arg r "$ROUTE_RECEIPT_SHA" --arg b "$BODY_SHA" --arg h "$HEADERS_SHA" '.schema_version=="ssc-rd04-nd-fna-index-redirect-adjudication-trigger@1" and .issue==1017 and .canonical_parent==$p and .canonical_matrix_blob==$m and .execution_artifact_id==9031911277 and .execution_artifact_digest==$d and .execution_receipt_sha256==$e and .route_receipt_sha256==$r and .response_body_sha256==$b and .response_headers_sha256==$h and .requested_url=="https://www.fna.usda.gov/snap/abawd/waivers/2025-2029" and .http_status==301 and .redirect_location=="/snap/waivers/timelimit/2025-2029" and .redirect_target_contacted==false and .source_requests==0 and .route_executions==0 and .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false and .outside_human_dependency==false' "$OUT/trigger.json" >/dev/null

          stage=main_and_artifact
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git rev-parse "origin/main:$MATRIX")" = "$MATRIX_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$OUT/artifact.json"
          jq -e --argjson i "$ARTIFACT_ID" --argjson n "$ARTIFACT_BYTES" --arg d "$ARTIFACT_DIGEST" '.id==$i and .size_in_bytes==$n and .digest==$d and .expired==false' "$OUT/artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$OUT/execution.zip"
          test "$(stat -c%s "$OUT/execution.zip")" = "$ARTIFACT_BYTES"
          test "sha256:$(sha256sum "$OUT/execution.zip"|cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          unzip -t "$OUT/execution.zip" > "$OUT/zip-test.txt"
          unzip -q "$OUT/execution.zip" -d "$SRC"
          (cd "$SRC" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$SRC/execution-receipt.json"|cut -d' ' -f1)" = "$EXECUTION_RECEIPT_SHA"
          test "$(sha256sum "$SRC/transport/route-receipt.json"|cut -d' ' -f1)" = "$ROUTE_RECEIPT_SHA"
          test "$(sha256sum "$SRC/transport/response-body.bin"|cut -d' ' -f1)" = "$BODY_SHA"
          test "$(sha256sum "$SRC/transport/response-headers.json"|cut -d' ' -f1)" = "$HEADERS_SHA"
          jq -e '.state=="complete" and .fixed_route_count==1 and .terminal_route_count==1 and .physical_requests==1 and .terminal_state=="redirect_refused_terminal" and .http_status==301 and .body_bytes==378 and .body_sha256=="d9e5a50fca24303819557d37921a13824074ae80a2d2137290d048be57e162cf" and .redirects_followed==0 and .anchor_selection_performed==false and .href_followed==false and .source_admissions==0 and .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false and .outside_human_dependency==false and .additional_execution_authorized==false' "$SRC/execution-receipt.json" >/dev/null
          jq -e '.requested_url=="https://www.fna.usda.gov/snap/abawd/waivers/2025-2029" and .http_status==301 and .redirect_location=="/snap/waivers/timelimit/2025-2029" and .redirects_followed==0 and .physical_requests==1 and .terminal_state=="redirect_refused_terminal" and .body_bytes==378 and .anchor_selection_performed==false and .href_followed==false' "$SRC/transport/route-receipt.json" >/dev/null
          jq -e '[.[]|select(.name=="location" and .value=="/snap/waivers/timelimit/2025-2029")]|length==1' "$SRC/transport/response-headers.json" >/dev/null
          grep -Fq '/snap/waivers/timelimit/2025-2029' "$SRC/transport/response-body.bin"
          cp "$SRC/transport/route-receipt.json" "$OUT/input-route-receipt.json"
          cp "$SRC/transport/response-headers.json" "$OUT/input-response-headers.json"
          cp "$SRC/transport/response-body.bin" "$OUT/input-response-body.html"

          stage=adjudicate
          cat > "$OUT/transport-adjudication.json" <<'JSON'
          {
            "schema_version": "ssc-rd04-nd-fna-index-redirect-adjudication@1",
            "state": "complete",
            "input_route_id": "RD04-ND-FNA-TIME-LIMIT-WAIVER-INDEX-2025-2029-001",
            "requested_url": "https://www.fna.usda.gov/snap/abawd/waivers/2025-2029",
            "http_status": 301,
            "body_bytes": 378,
            "body_sha256": "d9e5a50fca24303819557d37921a13824074ae80a2d2137290d048be57e162cf",
            "response_headers_sha256": "fc7146e235dbc7dcc3bd99fca753fec44af69ae3c6f2ca8eb0826464ae675dc2",
            "redirect_location": "/snap/waivers/timelimit/2025-2029",
            "canonical_target_url": "https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029",
            "target_host": "www.fna.usda.gov",
            "target_contacted": false,
            "classification": "same_host_canonical_redirect_locator_only",
            "source_role": "transport_locator_only_not_source_content",
            "source_admission": false,
            "anchor_selection_performed": false,
            "href_followed": false
          }
          JSON
          cat > "$OUT/field-adjudication.json" <<'JSON'
          {
            "schema_version": "ssc-rd04-nd-waiver-field-after-index-redirect-adjudication@1",
            "state": "complete",
            "field_id": "abawd_or_work_requirement_waiver_state_and_governing_period",
            "decision": "hold_open_exact_geography_and_governing_period_not_proved",
            "promotion_candidate": null,
            "held_open": true,
            "reason": "the old response-index path returned only a same-host canonical redirect and no index content",
            "field_terminalizations": 0,
            "matrix_updates": 0,
            "row_state_mutations": 0,
            "class_closed": false
          }
          JSON
          cat > "$OUT/selected-followup-protocol.json" <<'JSON'
          {
            "schema_version": "ssc-rd04-nd-fna-canonical-response-index-transport-protocol@1",
            "state": "selected_unexecuted",
            "route_count": 1,
            "routes": [{
              "ordinal": 1,
              "route_id": "RD04-ND-FNA-TIME-LIMIT-WAIVER-INDEX-CANONICAL-2025-2029-001",
              "url": "https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029",
              "method": "GET",
              "attempts": 1,
              "exact_host": "www.fna.usda.gov",
              "maximum_followed_redirects": 0,
              "maximum_body_bytes": 5000000,
              "selection_scope": "locate only the North Dakota FY 2025 response anchor and exact href",
              "anchor_selection_performed_here": false,
              "href_followed_here": false,
              "result_spawned_requests": 0
            }],
            "source_requests": 0,
            "route_executions": 0,
            "field_terminalizations": 0,
            "matrix_updates": 0,
            "row_state_mutations": 0,
            "class_closed": false,
            "outside_human_dependency": false,
            "additional_execution_authorized": true
          }
          JSON
          jq -n '{schema_version:"ssc-rd04-nd-fna-index-redirect-adjudication-summary@1",state:"complete",transport_classification:"same_host_canonical_redirect_locator_only",field_decision:"hold_open_exact_geography_and_governing_period_not_proved",promotion_candidates:0,held_open_fields:1,selected_followup_routes:1,source_requests:0,route_executions:0,source_admissions:0,field_terminalizations:0,matrix_updates:0,row_state_mutations:0,class_closed:false,outside_human_dependency:false}' > "$OUT/summary.json"

          stage=seal
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/origin/main"
          FINAL=$(git rev-parse origin/main); git merge-base --is-ancestor "$MAIN" "$FINAL"
          test "$(git rev-parse "origin/main:$MATRIX")" = "$MATRIX_BLOB"
          jq -e '.classification=="same_host_canonical_redirect_locator_only" and .canonical_target_url=="https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029" and .target_contacted==false and .source_admission==false' "$OUT/transport-adjudication.json" >/dev/null
          jq -e '.decision=="hold_open_exact_geography_and_governing_period_not_proved" and .promotion_candidate==null and .held_open==true and .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false' "$OUT/field-adjudication.json" >/dev/null
          jq -e '.state=="selected_unexecuted" and .route_count==1 and [.routes[].route_id]==["RD04-ND-FNA-TIME-LIMIT-WAIVER-INDEX-CANONICAL-2025-2029-001"] and [.routes[].url]==["https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029"] and [.routes[].attempts]==[1] and [.routes[].maximum_followed_redirects]==[0] and [.routes[].result_spawned_requests]==[0] and .additional_execution_authorized==true' "$OUT/selected-followup-protocol.json" >/dev/null
          jq -n --arg p "$MAIN" --arg h "$H" --arg f "$FINAL" --argjson a "$ARTIFACT_ID" --arg t "$(sha256sum "$OUT/transport-adjudication.json"|cut -d' ' -f1)" --arg d "$(sha256sum "$OUT/field-adjudication.json"|cut -d' ' -f1)" --arg s "$(sha256sum "$OUT/selected-followup-protocol.json"|cut -d' ' -f1)" '{schema_version:"ssc-rd04-nd-fna-index-redirect-adjudication-receipt@1",state:"complete",stage:"complete",exit_code:0,canonical_parent:$p,canonical_main_at_finish:$f,adjudication_head:$h,execution_artifact_id:$a,transport_adjudication_sha256:$t,field_adjudication_sha256:$d,selected_protocol_sha256:$s,transport_classification:"same_host_canonical_redirect_locator_only",field_decision:"hold_open_exact_geography_and_governing_period_not_proved",promotion_candidates:0,held_open_fields:1,selected_followup_routes:1,source_requests:0,route_executions:0,source_admissions:0,field_terminalizations:0,matrix_updates:0,row_state_mutations:0,class_closed:false,cumulative_ledger_effect:"none",outside_human_dependency:false,publication_effect:"none",adoption_effect:"none",graph_effect:"none",additional_execution_authorized:true,next_authorized_operation:"execute exact canonical response-index route RD04-ND-FNA-TIME-LIMIT-WAIVER-INDEX-CANONICAL-2025-2029-001 once; preserve the complete response; do not follow any discovered href"}' > "$OUT/receipt.json"
          stage=complete

      - name: Upload terminal redirect adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-fna-index-redirect-adjudication-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Require terminal redirect adjudication
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ steps.run.outcome }}' = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e '.state=="complete" and .stage=="complete" and .transport_classification=="same_host_canonical_redirect_locator_only" and .field_decision=="hold_open_exact_geography_and_governing_period_not_proved" and .promotion_candidates==0 and .held_open_fields==1 and .selected_followup_routes==1 and .source_requests==0 and .route_executions==0 and .source_admissions==0 and .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false and .outside_human_dependency==false and .additional_execution_authorized==true' "$OUT/receipt.json" >/dev/null
