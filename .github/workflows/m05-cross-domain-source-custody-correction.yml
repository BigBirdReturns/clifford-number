name: M-05 cross-domain source custody correction

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.json'
      - 'data/project/m05-cross-domain-official-receipt-candidates.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-source-provenance-amendment.json'
      - 'tools/lib/m05-cross-domain-official-receipt-candidates.mjs'
      - 'tools/validate-m05-source-health-evidence-state-regression.mjs'
      - 'test/m05-source-health-evidence-state-regression.test.js'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.test.js'
      - '.github/workflows/m05-cross-domain-source-custody-correction.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.json'
      - 'data/project/m05-cross-domain-official-receipt-candidates.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-source-provenance-amendment.json'
      - 'tools/lib/m05-cross-domain-official-receipt-candidates.mjs'
      - 'tools/validate-m05-source-health-evidence-state-regression.mjs'
      - 'test/m05-source-health-evidence-state-regression.test.js'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.test.js'
      - '.github/workflows/m05-cross-domain-source-custody-correction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m05-cross-domain-source-custody-correction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate cross-domain source custody correction
        run: |
          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.test.js
          node tools/validate-m05-source-health-evidence-state-regression.mjs
          node test/m05-source-health-evidence-state-regression.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.mjs
          node test/m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic focused state
        run: |
          git restore --staged --worktree .
          node tools/validate-m05-source-health-evidence-state-regression.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.mjs
          node test/m05-answerable-power-sprint-03-leg-07-cross-domain-source-custody-correction.test.js
          git diff --exit-code
