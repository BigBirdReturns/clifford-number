name: Temporary finalize M-04B validator binding

on:
  push:
    branches: [agent/m04b-integrity-repair]
    paths:
      - '.github/temporary/m04b-finalize/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04b-finalize-validator
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04b-integrity-repair
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind dispatcher guarantees into validator
        run: node .github/temporary/m04b-finalize/apply-validator.mjs
      - name: Rebuild and validate M-04B
        run: |
          set -euo pipefail
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          M04B_REPOSITORY="$GITHUB_REPOSITORY" node tools/dispatch-security-state-organism.mjs --dry-run
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic M-04B products
        run: |
          set -euo pipefail
          rm -rf /tmp/m04b-build-final /tmp/m04b-report-final
          cp -a build/core-thesis/security-state-organism /tmp/m04b-build-final
          cp -a reports/core-thesis/security-state-organism /tmp/m04b-report-final
          node tools/build-security-state-organism.mjs
          diff -ru /tmp/m04b-build-final build/core-thesis/security-state-organism
          diff -ru /tmp/m04b-report-final reports/core-thesis/security-state-organism
          git diff --check
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
      - name: Commit validator and remove patch carrier
        run: |
          set -euo pipefail
          rm -rf .github/temporary/m04b-finalize
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate-security-state-organism.mjs .github/temporary/m04b-finalize
          git status --short
          git commit -m "Bind M-04B dispatch guards into validation"
          git push origin HEAD:agent/m04b-integrity-repair
      - uses: actions/upload-artifact@v4
        with:
          name: m04b-final-validator-evidence
          path: |
            tools/validate-security-state-organism.mjs
            tools/dispatch-security-state-organism.mjs
            test/security-state-organism.test.js
            build/core-thesis/security-state-organism/
          if-no-files-found: error
          retention-days: 90
