name: Temporary PC-36 exact shard repair

on:
  pull_request:
    paths:
      - '.github/workflows/pc36-shard-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc36-exact-shard-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-population-coverage-turnover-assurance-v1
          fetch-depth: 0
      - name: Repair the single known carrier-symbol transcription
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          path = Path('.pc36/payload.part-03')
          text = path.read_text()
          old = 'DXoroma2'
          new = 'DXoRoma2'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one repair target, found {text.count(old)}')
          repaired = text.replace(old, new, 1)
          normalized = ''.join(repaired.split())
          actual = hashlib.sha256(normalized.encode()).hexdigest()
          expected = '34fe8b736fafce53ff89c991da6635ef573904e63d24adbfb9f2f0f1c796bfc0'
          if actual != expected:
              raise SystemExit(f'repaired shard SHA-256 mismatch: {actual}')
          path.write_text(repaired)
          receipt = {
              'schema_version': 'pc36-exact-shard-repair-receipt@1',
              'target': str(path),
              'replacement': {'from': old, 'to': new},
              'normalized_sha256': actual,
              'outside_human_dependency': False,
          }
          Path('/tmp/pc36-shard-repair-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Commit only the repaired shard and retire this workflow
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .pc36/payload.part-03
          git rm -- .github/workflows/pc36-shard-repair.yml
          observed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/pc36-shard-repair.yml .pc36/payload.part-03 | sort)"
          test "$observed" = "$expected"
          git commit -m 'Repair exact PC-36 carrier shard'
          git push --force-with-lease=refs/heads/research/preference-population-coverage-turnover-assurance-v1:"$source_head" origin HEAD:refs/heads/research/preference-population-coverage-turnover-assurance-v1
      - name: Preserve exact repair receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc36-exact-shard-repair-receipt
          path: /tmp/pc36-shard-repair-receipt.json
          if-no-files-found: error
