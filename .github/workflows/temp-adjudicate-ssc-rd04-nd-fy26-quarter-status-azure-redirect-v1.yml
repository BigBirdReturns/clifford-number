name: TEMP adjudicate RD-04 North Dakota FY 2026 PDF redirects v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-adjudicate-ssc-rd04-nd-fy26-quarter-status-azure-redirect-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARRIER_PARENT: a592acea22c69a979f2a90c24a2bafb8c9445759
  TARGET_BRANCH: agent/ssc-rd04-nd-fy26-quarter-status-azure-redirect-adjudication-v1
  WORKFLOW_PATH: .github/workflows/temp-adjudicate-ssc-rd04-nd-fy26-quarter-status-azure-redirect-v1.yml
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  TRANSPORT_ARTIFACT_ID: '9030825769'
  TRANSPORT_ARTIFACT_BYTES: '91737'
  TRANSPORT_ARTIFACT_SHA256: 8f5e143e686a91d87ddc6b21ff2c255c1be278f815d0a197701fc80c893c28f9
  EXECUTION_RECEIPT_SHA256: 8291bd04e0666da292480c84cf7e27ad5d7edf31c0c8b4383f7c9e07e129a8d3
  ROUTE_RECEIPTS_SHA256: edb8f76453044e401bff91355149a8bf6f9c5fe636e874cf4c28efbb585208ba
  PHYSICAL_REQUESTS_SHA256: f616bde97c5acc8551d7e2f0b7901cfa8cdc82bad5b9e5b0ab7fbebe3af94ab9
  REQUEST_PLAN_SHA256: df515aff8ffa7296b8deb1b28203890e995c8f5a4ed0115d0625aaf3155bf29d
  AUTHORITY_SHA256: 522bfa7302a28ccfba7bad7a8c71fb5fd7ab7228732690c1b92eb170b2794844
  CDN_HOST: fna-bwbufwdzbabpezgc.z01.azurefd.us
  OUTPUT_DIR: /tmp/ssc-rd04-nd-fy26-quarter-status-azure-redirect-adjudication-v1

concurrency:
  group: temp-adjudicate-rd04-nd-fy26-quarter-status-azure-redirect-v1
  cancel-in-progress: false

jobs:
  adjudicate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-fy26-quarter-status-azure-redirect-adjudication-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Adjudicate exact redirect targets offline
        id: adjudicate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          SOURCE="$OUT/source-transport"
          rm -rf "$OUT"
          mkdir -p "$OUT" "$SOURCE"
          stage=bootstrap
          exec > >(tee "$OUT/adjudication.log") 2>&1

          finalize() {
            rc=$?
            trap - EXIT
            set +e
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            if [ ! -f "$OUT/receipt.json" ]; then
              jq -n \
                --arg stage "$stage" \
                --argjson rc "$rc" \
                --arg artifact "$TRANSPORT_ARTIFACT_ID" \
                '{
                  schema_version:"ssc-rd04-nd-fy26-quarter-status-azure-redirect-adjudication@1",
                  state:"failed_closed",failed_or_final_stage:$stage,exit_code:$rc,
                  source_transport_artifact_id:($artifact|tonumber),redirect_targets_admitted:0,
                  selected_followup_routes:0,source_requests:0,route_executions:0,
                  source_admissions:0,field_classifications:0,field_terminalizations:0,
                  matrix_updates:0,row_state_mutations:0,class_closed:false,
                  cumulative_ledger_effect:"none",outside_human_dependency:false,
                  publication_effect:"none",adoption_effect:"none",graph_effect:"none"
                }' > "$OUT/receipt.json"
            fi
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          stage=bind_exact_carrier_and_unchanged_live_matrix
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REF" = "$TARGET_BRANCH"
          test "$HEAD_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git rev-list --count "$CARRIER_PARENT"..HEAD)" -eq 1
          test "$(git diff --name-only "$CARRIER_PARENT" HEAD)" = "$WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$CARRIER_PARENT" HEAD)" = "$WORKFLOW_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CARRIER_PARENT" HEAD)"
          git diff --check "$CARRIER_PARENT" HEAD
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$CARRIER_PARENT" origin/main
          LIVE_MAIN="$(git rev-parse origin/main)"
          LIVE_TREE="$(git rev-parse 'origin/main^{tree}')"
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$MATRIX_BLOB"
          printf '%s\n' "$LIVE_MAIN" > "$OUT/live-main.txt"
          printf '%s\n' "$LIVE_TREE" > "$OUT/live-main-tree.txt"

          stage=authenticate_completed_origin_transport
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$TRANSPORT_ARTIFACT_ID" \
            > "$OUT/source-artifact.json"
          jq -e \
            --argjson id "$TRANSPORT_ARTIFACT_ID" \
            --argjson bytes "$TRANSPORT_ARTIFACT_BYTES" \
            --arg digest "sha256:$TRANSPORT_ARTIFACT_SHA256" \
            '.id==$id and .expired==false and .size_in_bytes==$bytes and .digest==$digest' \
            "$OUT/source-artifact.json" > /dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$TRANSPORT_ARTIFACT_ID/zip" \
            > "$OUT/source.zip"
          test "$(stat -c %s "$OUT/source.zip")" -eq "$TRANSPORT_ARTIFACT_BYTES"
          test "$(sha256sum "$OUT/source.zip" | awk '{print $1}')" = "$TRANSPORT_ARTIFACT_SHA256"
          unzip -t "$OUT/source.zip" > "$OUT/source-zip-test.txt"
          unzip -q "$OUT/source.zip" -d "$SOURCE"
          (cd "$SOURCE" && sha256sum -c SHA256SUMS)
          test "$(cat "$SOURCE/STAGE")" = complete
          test "$(cat "$SOURCE/EXIT_CODE")" = 0
          test "$(sha256sum "$SOURCE/execution-receipt.json" | awk '{print $1}')" = "$EXECUTION_RECEIPT_SHA256"
          test "$(sha256sum "$SOURCE/route-receipts.jsonl" | awk '{print $1}')" = "$ROUTE_RECEIPTS_SHA256"
          test "$(sha256sum "$SOURCE/physical-requests.jsonl" | awk '{print $1}')" = "$PHYSICAL_REQUESTS_SHA256"
          test "$(sha256sum "$SOURCE/request-plan.json" | awk '{print $1}')" = "$REQUEST_PLAN_SHA256"
          test "$(sha256sum "$SOURCE/authority-boundary.json" | awk '{print $1}')" = "$AUTHORITY_SHA256"
          jq -e '
            .state=="transport_complete" and .fixed_routes==3 and .initiated_route_attempts==3 and
            .terminal_routes==3 and .physical_requests==3 and .followed_redirects==0 and
            .refused_redirects==3 and .captured_final_body_bytes==0 and .pdf_magic_routes==0 and
            .expected_media_type_routes==0 and .source_admissions==0 and .field_classifications==0 and
            .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and
            .class_closed==false and .additional_execution_authorized==false
          ' "$SOURCE/execution-receipt.json" > /dev/null

          stage=derive_exact_path_preserving_redirect_protocol
          export LIVE_MAIN LIVE_TREE CDN_HOST
          python - "$SOURCE" "$OUT" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          source = Path(sys.argv[1])
          out = Path(sys.argv[2])
          cdn_host = os.environ["CDN_HOST"]
          expected = [
              (1, "RD04-ND-CURRENT-WAIVER-FY26-Q1-STATUS-PDF", "FY26-Quarter-1-ABAWD-Waiver-Status.pdf", "56b0c0ef2af1cb5ea6e60e6fc1e96127a88557082a863344e20bba8eb16d5616"),
              (2, "RD04-ND-CURRENT-WAIVER-FY26-Q2-STATUS-PDF", "FY26-Quarter-2-ABAWD-Waiver-Status.pdf", "a973269101389d87e6485eb9fce9d1fe6976ffa0642dc3ee671c3dd69987fe3c"),
              (3, "RD04-ND-CURRENT-WAIVER-FY26-Q3-STATUS-PDF", "FY26-Quarter-3-ABAWD-Waiver-Status.pdf", "70ecfc660932693637cf851e6c0ecde0fec4ea3c6217089d9e6d3573a42b1193"),
          ]

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          routes = [json.loads(line) for line in (source / "route-receipts.jsonl").read_text().splitlines() if line]
          physical = [json.loads(line) for line in (source / "physical-requests.jsonl").read_text().splitlines() if line]
          assert len(routes) == 3
          assert len(physical) == 3
          selected = []
          decisions = []
          for receipt, request, (ordinal, route_id, filename, header_sha) in zip(routes, physical, expected, strict=True):
              assert receipt["ordinal"] == ordinal
              assert receipt["route_id"] == route_id
              assert receipt["outcome"] == "terminal_redirect_refused_before_contact"
              assert receipt["attempts_initiated"] == 1
              assert receipt["physical_request_count"] == 1
              assert receipt["final_status_code"] == 302
              assert receipt["final_body_bytes"] == 0
              assert receipt["final_body_sha256"] == hashlib.sha256(b"").hexdigest()
              assert receipt["redirect_count"] == 1
              redirect = receipt["redirect_chain"][0]
              assert redirect["action"] == "refuse_before_contact"
              assert redirect["target_allowed"] is False
              target = redirect["target_url"]
              target_parts = urlsplit(target)
              origin_parts = urlsplit(receipt["requested_url"])
              assert target_parts.scheme == "https"
              assert target_parts.hostname == cdn_host
              assert target_parts.path == origin_parts.path
              assert target_parts.query == origin_parts.query == ""
              assert target_parts.fragment == ""
              assert target_parts.path.endswith("/" + filename)
              assert request["raw_headers_sha256"] == header_sha
              header_path = source / request["raw_headers_path"]
              assert sha(header_path) == header_sha
              header_text = header_path.read_text(encoding="iso-8859-1")
              assert "server: AkamaiGHost" in header_text
              assert f"location: {target}" in header_text
              assert "content-length: 0" in header_text
              decisions.append({
                  "ordinal": ordinal,
                  "origin_route_id": route_id,
                  "origin_url": receipt["requested_url"],
                  "origin_status_code": 302,
                  "origin_raw_headers_sha256": header_sha,
                  "redirect_target_url": target,
                  "redirect_target_host": cdn_host,
                  "path_preserved": True,
                  "query_preserved": True,
                  "disposition": "exact_server_directed_target_selected_for_one_transport_attempt",
                  "source_admission": False,
                  "field_classification": False,
              })
              selected.append({
                  "ordinal": ordinal,
                  "route_id": route_id + "-AZURE-TARGET",
                  "origin_route_id": route_id,
                  "url": target,
                  "route_category": "exact_server_directed_fna_pdf_distribution_target",
                  "allowed_hosts": [cdn_host],
                  "attempts": 1,
                  "redirects": "manual_same_host_only",
                  "maximum_body_bytes": 12_000_000,
                  "expected_media_type": "application/pdf",
                  "origin_raw_headers_sha256": header_sha,
              })

          protocol = {
              "schema_version": "ssc-rd04-nd-current-waiver-fy26-quarter-status-azure-redirect-followup-protocol@1",
              "object_type": "selected_exact_redirect_target_protocol",
              "issue": 1017,
              "class_id": "RD-04-C02",
              "unit_id": "US-STATE-ND",
              "target_field_id": "abawd_or_work_requirement_waiver_state_and_governing_period",
              "source_transport_artifact_id": 9030825769,
              "source_transport_artifact_sha256": "8f5e143e686a91d87ddc6b21ff2c255c1be278f815d0a197701fc80c893c28f9",
              "selection_basis": "three exact path-preserving HTTPS Location targets returned by the three admitted official FNA PDF origin URLs",
              "host_authority": "exact_listed_urls_only_no_wildcard_or_sibling_path_authority",
              "route_count": 3,
              "routes": selected,
              "source_requests_executed_here": 0,
              "same_host_expansion": 0,
              "result_spawned_requests": 0,
              "source_admissions": 0,
              "field_classifications": 0,
              "field_terminalizations": 0,
              "matrix_updates": 0,
              "row_state_mutations": 0,
              "class_closed": False,
              "outside_human_dependency": False,
              "next_authorized_operation": "execute exactly the three listed Azure Front Door target URLs once; do not rerun the three official-origin routes",
          }
          adjudication = {
              "schema_version": "ssc-rd04-nd-fy26-quarter-status-azure-redirect-adjudication@1",
              "object_type": "artifact_only_redirect_target_adjudication",
              "source_transport_artifact_id": 9030825769,
              "network_requests_executed_here": 0,
              "general_cdn_host_trust_granted": False,
              "sibling_path_authority_granted": False,
              "pdf_content_admitted": False,
              "north_dakota_field_classified": False,
              "decisions": decisions,
          }
          receipt = {
              "schema_version": "ssc-rd04-nd-fy26-quarter-status-azure-redirect-adjudication@1",
              "state": "complete",
              "failed_or_final_stage": "complete",
              "exit_code": 0,
              "live_main": os.environ["LIVE_MAIN"],
              "live_main_tree": os.environ["LIVE_TREE"],
              "matrix_git_blob": "19357f8214ab2710bc5e75b3fae8c7fb09ff1654",
              "source_transport_artifact_id": 9030825769,
              "source_transport_artifact_sha256": "8f5e143e686a91d87ddc6b21ff2c255c1be278f815d0a197701fc80c893c28f9",
              "redirect_targets_admitted": 3,
              "selected_followup_routes": 3,
              "general_cdn_host_trust_granted": False,
              "sibling_path_authority_granted": False,
              "source_requests": 0,
              "route_executions": 0,
              "source_admissions": 0,
              "field_classifications": 0,
              "field_terminalizations": 0,
              "matrix_updates": 0,
              "row_state_mutations": 0,
              "class_closed": False,
              "cumulative_ledger_effect": "none",
              "outside_human_dependency": False,
              "publication_effect": "none",
              "adoption_effect": "none",
              "graph_effect": "none",
              "next_authorized_operation": protocol["next_authorized_operation"],
          }
          (out / "redirect-adjudication.json").write_text(json.dumps(adjudication, indent=2, sort_keys=True) + "\n")
          (out / "selected-followup-protocol.json").write_text(json.dumps(protocol, indent=2, sort_keys=True) + "\n")
          (out / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (out / "summary.json").write_text(json.dumps({
              "redirect_targets": 3,
              "exact_target_host": cdn_host,
              "requests_executed_here": 0,
              "pdf_content_admitted": False,
              "field_terminalizations": 0,
              "matrix_updates": 0,
          }, indent=2, sort_keys=True) + "\n")
          PY
          cp "$SOURCE/headers/01-RD04-ND-CURRENT-WAIVER-FY26-Q1-STATUS-PDF-hop-01.headers" "$OUT/q1-origin-response.headers"
          cp "$SOURCE/headers/02-RD04-ND-CURRENT-WAIVER-FY26-Q2-STATUS-PDF-hop-01.headers" "$OUT/q2-origin-response.headers"
          cp "$SOURCE/headers/03-RD04-ND-CURRENT-WAIVER-FY26-Q3-STATUS-PDF-hop-01.headers" "$OUT/q3-origin-response.headers"

          stage=complete
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$MATRIX_BLOB"
          jq -e '
            .state=="complete" and .redirect_targets_admitted==3 and .selected_followup_routes==3 and
            .general_cdn_host_trust_granted==false and .sibling_path_authority_granted==false and
            .source_requests==0 and .route_executions==0 and .source_admissions==0 and
            .field_classifications==0 and .field_terminalizations==0 and .matrix_updates==0 and
            .row_state_mutations==0 and .class_closed==false and
            .next_authorized_operation=="execute exactly the three listed Azure Front Door target URLs once; do not rerun the three official-origin routes"
          ' "$OUT/receipt.json" > /dev/null

      - name: Preserve exact redirect-target adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-fy26-quarter-status-azure-redirect-adjudication-v1
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Enforce terminal zero-request redirect adjudication
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          test "${{ steps.adjudicate.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          jq -e '
            .state=="complete" and .redirect_targets_admitted==3 and .selected_followup_routes==3 and
            .general_cdn_host_trust_granted==false and .sibling_path_authority_granted==false and
            .source_requests==0 and .route_executions==0 and .source_admissions==0 and
            .field_classifications==0 and .field_terminalizations==0 and .matrix_updates==0 and
            .row_state_mutations==0 and .class_closed==false and .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and .publication_effect=="none" and
            .adoption_effect=="none" and .graph_effect=="none"
          ' "$OUT/receipt.json" > /dev/null
          jq -e '
            .route_count==3 and .host_authority=="exact_listed_urls_only_no_wildcard_or_sibling_path_authority" and
            .source_requests_executed_here==0 and .same_host_expansion==0 and .result_spawned_requests==0 and
            ([.routes[].route_id]==[
              "RD04-ND-CURRENT-WAIVER-FY26-Q1-STATUS-PDF-AZURE-TARGET",
              "RD04-ND-CURRENT-WAIVER-FY26-Q2-STATUS-PDF-AZURE-TARGET",
              "RD04-ND-CURRENT-WAIVER-FY26-Q3-STATUS-PDF-AZURE-TARGET"
            ])
          ' "$OUT/selected-followup-protocol.json" > /dev/null
          (cd "$OUT" && sha256sum -c SHA256SUMS)
