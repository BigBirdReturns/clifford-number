name: TEMP RD-06 fourth-closure export control

on:
  pull_request:
    paths:
      - '.rd06-fourth-closure-control/TRIGGER'

permissions:
  contents: read

concurrency:
  group: temp-rd06-fourth-closure-export-control
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out control bytes
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 0
      - name: Check out exact RD-06 research branch
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd06-offeror-universe
          path: research
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile, validate, and export seven exact files
        working-directory: research
        run: bash ../control/tools/temporary-rd06-fourth-closure-export.sh
      - name: Upload exact reconciled files
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-fourth-closure-export
          path: /tmp/rd06-fourth-closure-export
          if-no-files-found: error
          retention-days: 90
