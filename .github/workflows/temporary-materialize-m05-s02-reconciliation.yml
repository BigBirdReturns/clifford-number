name: Temporary materialize M-05 Sprint 02 reconciliation

on:
  push:
    branches:
      - agent/m05-sprint-02-reconciliation
    paths:
      - '.github/workflows/temporary-materialize-m05-s02-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-02-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate Sprint 02 reconciliation
        run: |
          node tools/build-m05-answerable-power-sprint-02-reconciliation.mjs
          node tools/validate-m05-answerable-power-sprint-02-reconciliation.mjs
          node test/m05-answerable-power-sprint-02-reconciliation.test.js
      - name: Commit generated products
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/core-thesis/answerable-power/sprint-02-reconciliation.json reports/core-thesis/answerable-power/sprint-02-reconciliation.html
          if git diff --cached --quiet; then
            echo 'No generated drift'
          else
            git commit -m 'Materialize M-05 Sprint 02 reconciliation report'
            git push origin HEAD:agent/m05-sprint-02-reconciliation
          fi
