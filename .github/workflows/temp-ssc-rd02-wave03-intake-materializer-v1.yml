name: TEMP materialize SSC RD-02 Wave-03 intake v1

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd02-wave03-intake-materializer-v1.yml'
      - '.ssc-rd02-wave03-intake-materializer-v1/TRIGGER'
      - 'data/project/transport/ssc-rd02-wave03-intake-v1/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: temp-ssc-rd02-wave03-intake-materializer-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, qualify, replay, and publish exact intake package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          TARGET_BRANCH='agent/ssc-rd-wave03-rd02-portfolio-lifecycle'
          TARGET_LEASE='431f94963c369f982d262e96ed378806862539aa'
          ROOT='data/project/transport/ssc-rd02-wave03-intake-v1'
          CACHE='/tmp/ssc-rd02-wave03-intake-v1'
          RECEIPT='/tmp/ssc-rd02-wave03-intake-receipt'
          rm -rf "$CACHE" "$RECEIPT"
          mkdir -p "$CACHE/shards" "$CACHE/product" "$RECEIPT"
          cp "$ROOT"/*.b64 "$CACHE/shards/"
          test "$(find "$CACHE/shards" -maxdepth 1 -type f -name '*.b64' | wc -l)" -eq 8
          cat "$CACHE"/shards/*.b64 | tr -d '\r\n\t ' > "$CACHE/product.b64"
          test "$(sha256sum "$CACHE/product.b64" | awk '{print $1}')" = '74147f05d4d6fe86c5bdcbcf56411dc607d26b943191c6bb65de6df4e79a9af3'
          base64 -d "$CACHE/product.b64" > "$CACHE/product.tar.xz"
          test "$(sha256sum "$CACHE/product.tar.xz" | awk '{print $1}')" = '7b39c0a084df494cad1b8297761133295cce6cddc22a6d40bb47b5d6f1c893f6'
          tar -xJf "$CACHE/product.tar.xz" -C "$CACHE/product"
          cat > "$CACHE/paths.txt" <<'PATHS'
          .github/workflows/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.yml
          data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/fixed-protocol-package.json
          docs/milestones/ssc-rd-wave03-rd02-portfolio-lifecycle-intake.md
          schemas/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.schema.json
          test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.test.js
          tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
          tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
          PATHS
          find "$CACHE/product" -type f -printf '%P\n' | LC_ALL=C sort > "$CACHE/observed-paths.txt"
          diff -u "$CACHE/paths.txt" "$CACHE/observed-paths.txt"
          cat > "$CACHE/expected.sha256" <<'SUMS'
          c4bea8d222e2c18aa5b2b70f8b261426eb5d8a62cff432f94dce2d3d12e8267e  .github/workflows/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.yml
          f270c9dcebc1bedcdeee504f1cf3c1ac4803a2dbbbf00d7d3f0efe32afe28473  data/intake/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle/fixed-protocol-package.json
          107bff44abf78aca5286a7c7d040a59262a75394b1fe8cdfc34e601bc707ea47  docs/milestones/ssc-rd-wave03-rd02-portfolio-lifecycle-intake.md
          142b41a0018a4f33e96f863414a3363eafb6313dc3cfdc9125c0ed6361a2bd64  schemas/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.schema.json
          8d0d1849dededddfd1fcfb87df9d6c6a5e69acc1666a702870835c1a5c513f63  test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.test.js
          a82e50abbdf386c7417f9a34139590238975249beb26376cd33d0c1480126a68  tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
          451df4b9f2dcb449a32d9fa2f01e12a8946b4fa3e4dfa2438582a2ce065f0f13  tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
          SUMS
          (cd "$CACHE/product" && sha256sum -c "$CACHE/expected.sha256")

          git fetch --no-tags origin "$TARGET_BRANCH" main
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_LEASE"
          git checkout -B "$TARGET_BRANCH" "$TARGET_LEASE"
          while IFS= read -r p; do
            test ! -e "$p"
            mkdir -p "$(dirname "$p")"
            cp "$CACHE/product/$p" "$p"
          done < "$CACHE/paths.txt"
          test "$(git diff --name-only -- . | wc -l)" -eq 0
          test "$(git status --porcelain=v1 --untracked-files=all | wc -l)" -eq 7

          node tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
          node test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.test.js
          node tools/validate-no-magic-human-gate.mjs
          npm run release:check
          git restore --worktree -- .
          node tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs --write
          node tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
          node test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.test.js
          node tools/validate-no-magic-human-gate.mjs
          test "$(git diff --name-only -- . | wc -l)" -eq 0
          test "$(git status --porcelain=v1 --untracked-files=all | wc -l)" -eq 7

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f --pathspec-from-file="$CACHE/paths.txt"
          FULL_TREE="$(git write-tree)"
          git reset
          WORKFLOW='.github/workflows/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.yml'
          grep -v -Fx "$WORKFLOW" "$CACHE/paths.txt" > "$CACHE/nonworkflow-paths.txt"
          git add -f --pathspec-from-file="$CACHE/nonworkflow-paths.txt"
          git commit -m 'Freeze RD-02 Wave-03 portfolio lifecycle intake protocol'
          RUNNER_COMMIT="$(git rev-parse HEAD)"
          RUNNER_TREE="$(git rev-parse HEAD^{tree})"
          WORKFLOW_BLOB="$(git hash-object "$WORKFLOW")"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 6
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_LEASE"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_LEASE" origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$RUNNER_COMMIT"

          printf '%s\n' "$TARGET_LEASE" > "$RECEIPT/target-start.txt"
          printf '%s\n' "$RUNNER_COMMIT" > "$RECEIPT/runner-commit.txt"
          printf '%s\n' "$RUNNER_TREE" > "$RECEIPT/runner-tree.txt"
          printf '%s\n' "$FULL_TREE" > "$RECEIPT/qualified-full-tree.txt"
          printf '%s\n' "$WORKFLOW_BLOB" > "$RECEIPT/standing-workflow-blob.txt"
          cp "$CACHE/paths.txt" "$RECEIPT/permanent-paths.txt"
          cp "$CACHE/expected.sha256" "$RECEIPT/per-file-sha256.txt"
          sha256sum "$CACHE/product.b64" "$CACHE/product.tar.xz" > "$RECEIPT/package-sha256.txt"
      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd02-wave03-intake-materializer-v1
          path: /tmp/ssc-rd02-wave03-intake-receipt
          if-no-files-found: warn
          retention-days: 90
