name: Temporary Wave 22 descendant ancestry repair

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/tmp/wave22-descendant-ancestry-repair-trigger.json'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave22-descendant-ancestry-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Await transport-workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave22-descendant-ancestry-repair.yml'
          encoded_ref='agent%2Flake-allocator-war-lead-acquisition-wave-23'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 150); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            if [[ "$status" == '404' ]]; then
              exit 0
            fi
            if [[ "$status" != '200' ]]; then
              echo "unexpected GitHub contents status: $status" >&2
              exit 1
            fi
            sleep 2
          done
          echo 'temporary descendant ancestry repair workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-lead-acquisition-wave-23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair descendant PR ancestry recovery and reseal Wave 23
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/run-wave22-descendant-ancestry-repair.sh
