name: Temporary PR 2231 V120 weak-range current-main qualification R5

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v120-weak-range-current-main-qualification-r5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v120-r5:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v120-weak-range-current-main-qualification-r5'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v120-weak-range-current-main-qualification-r5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute exact V120 read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          export GIT_TERMINAL_PROMPT=0

          repo=BigBirdReturns/clifford-number
          prior_controller=9573a5bb9778367dbe28102abee2d637cb962016
          prior_branch=agent/pr2231-v120-weak-range-current-main-qualification-r4
          prior_workflow=.github/workflows/temporary-pr2231-v120-weak-range-current-main-qualification-r4.yml
          prior_workflow_size=14700
          prior_workflow_blob=679fda18e96279acdd27cfec12c48c67b28a6e7b
          prior_workflow_sha256=f328bb4bb34d14c5eab4eee3dc9aebf6023366fab09019ddd94c3264224d470a
          prior_qualifier_size=22074
          prior_qualifier_blob=3adc1a9ee98f67ca81829764cfb236d938a12374
          prior_qualifier_sha256=13f0a63bf174d7a5e3ac2df6089754a9c44c56cfdfc221e2d002c26be5643f1f
          qualifier_size=22074
          qualifier_blob=dcc74ef011ddd9e1639a8981d0be35653f6f83c4
          qualifier_sha256=26038cc7dc09ad3a80d56c279f5db6a167c76d093afd2a102ea7f34aa4455f4d
          envelope=/tmp/pr2231-v120-weak-range-current-main-controller-envelope-r5
          recovered_workflow="$envelope/r4-controller-workflow.yml"
          prior_qualifier="$envelope/qualifier-v120-r4.sh"
          qualifier="$envelope/qualifier-v120-r5.sh"
          wrapper_log="$envelope/controller-wrapper.log"
          artifact=/tmp/pr2231-v120-weak-range-current-main-qualification-r5

          rm -rf "$envelope" "$artifact"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only\npublication=skipped\nproduct_mutation=none\nreview_mutation=none\n' "$rc" \
              > "$envelope/controller-status.env"
            manifest_tmp="$envelope/.envelope-manifest.tmp"
            find "$envelope" -type f \
              ! -name envelope-manifest.txt \
              ! -name envelope-sha256.txt \
              ! -name .envelope-manifest.tmp \
              -printf '%P\t%s\n' | sort > "$manifest_tmp"
            mv "$manifest_tmp" "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          failed_pr_json=$(gh api "repos/$repo/pulls/2503")
          test "$(jq -r '.head.sha' <<<"$failed_pr_json")" = "$prior_controller"
          test "$(jq -r '.head.ref' <<<"$failed_pr_json")" = "$prior_branch"
          test "$(jq -r '.draft' <<<"$failed_pr_json")" = true
          test "$(jq -r '.merged' <<<"$failed_pr_json")" = false
          failed_run_json=$(gh api "repos/$repo/actions/runs/33547262059")
          test "$(jq -r '.head_sha' <<<"$failed_run_json")" = "$prior_controller"
          test "$(jq -r '.status' <<<"$failed_run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$failed_run_json")" = failure
          failed_jobs_json=$(gh api "repos/$repo/actions/runs/33547262059/jobs")
          test "$(jq -r '.jobs[] | select(.id == 99987745307) | .conclusion' <<<"$failed_jobs_json")" = failure
          failed_artifacts_json=$(gh api "repos/$repo/actions/runs/33547262059/artifacts")
          test "$(jq -r '.artifacts[] | select(.id == 9815984351) | .size_in_bytes' <<<"$failed_artifacts_json")" = 26953
          test "$(jq -r '.artifacts[] | select(.id == 9815984351) | .digest' <<<"$failed_artifacts_json")" = sha256:73870976547835e3b972efc2eb81443bef76e0f8d533526f4ab9883db35e4b3e
          printf 'failed_controller_pr=2503\nfailed_controller=%s\nfailed_run=33547262059\nfailed_job=99987745307\nfailed_artifact=9815984351\nfailed_artifact_digest=sha256:73870976547835e3b972efc2eb81443bef76e0f8d533526f4ab9883db35e4b3e\nfailure_mode=candidate_numstat_expected_36_actual_35\n' \
            "$prior_controller" > "$envelope/r4-failure-lease.txt"

          git fetch --no-tags origin \
            "refs/heads/$prior_branch:refs/remotes/origin/v120-r4-controller"
          test "$(git rev-parse refs/remotes/origin/v120-r4-controller)" = "$prior_controller"
          git show "$prior_controller:$prior_workflow" > "$recovered_workflow"
          test "$(wc -c < "$recovered_workflow")" = "$prior_workflow_size"
          test "$(git hash-object "$recovered_workflow")" = "$prior_workflow_blob"
          test "$(sha256sum "$recovered_workflow" | awk '{print $1}')" = "$prior_workflow_sha256"

          python - "$recovered_workflow" "$prior_qualifier" "$qualifier" <<'PY'
          from pathlib import Path
          import base64
          import lzma
          import sys

          workflow = Path(sys.argv[1]).read_text()
          start_marker = '          base64 -d > "$qualifier_xz" <<\'QUALIFIER_XZ_B64\'\n'
          end_marker = '          QUALIFIER_XZ_B64\n'
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('R4 qualifier transport markers are not unique')
          encoded = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          payload = ''.join(line.strip() for line in encoded.splitlines())
          prior = lzma.decompress(base64.b64decode(payload, validate=True))
          Path(sys.argv[2]).write_bytes(prior)

          source = prior.decode()
          replacements = [
              (
                  'controller_workflow=.github/workflows/temporary-pr2231-v120-weak-range-current-main-qualification-r4.yml',
                  'controller_workflow=.github/workflows/temporary-pr2231-v120-weak-range-current-main-qualification-r5.yml',
              ),
              (
                  'root=/tmp/pr2231-v120-weak-range-current-main-r4',
                  'root=/tmp/pr2231-v120-weak-range-current-main-r5',
              ),
              (
                  'artifact=/tmp/pr2231-v120-weak-range-current-main-qualification-r4',
                  'artifact=/tmp/pr2231-v120-weak-range-current-main-qualification-r5',
              ),
              (
                  "test \"$(cat \"$artifact/candidate-numstat.txt\")\" = $'36\\t0\\ttest/industrial-exhaust.test.js\\n28\\t9\\ttools/lib/industrial-exhaust.mjs'",
                  "test \"$(cat \"$artifact/candidate-numstat.txt\")\" = $'35\\t0\\ttest/industrial-exhaust.test.js\\n28\\t9\\ttools/lib/industrial-exhaust.mjs'",
              ),
              (
                  'export GIT_AUTHOR_DATE=2026-09-01T19:15:00Z',
                  'export GIT_AUTHOR_DATE=2026-09-01T19:30:00Z',
              ),
              (
                  'export GIT_COMMITTER_DATE=2026-09-01T19:15:00Z',
                  'export GIT_COMMITTER_DATE=2026-09-01T19:30:00Z',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'R5 replacement count {count}, expected 1: {old[:96]!r}')
              source = source.replace(old, new)
          Path(sys.argv[3]).write_text(source)
          PY

          chmod 0755 "$prior_qualifier" "$qualifier"
          test "$(wc -c < "$prior_qualifier")" = "$prior_qualifier_size"
          test "$(git hash-object "$prior_qualifier")" = "$prior_qualifier_blob"
          test "$(sha256sum "$prior_qualifier" | awk '{print $1}')" = "$prior_qualifier_sha256"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          bash -n "$qualifier"
          printf 'qualifier_parent_blob=%s\nqualifier_parent_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\ntransport_controller=%s\ntransport_workflow_blob=%s\ntransport_workflow_sha256=%s\n' \
            "$prior_qualifier_blob" "$prior_qualifier_sha256" "$qualifier_blob" "$qualifier_sha256" \
            "$prior_controller" "$prior_workflow_blob" "$prior_workflow_sha256" \
            > "$envelope/qualifier-provenance.txt"

          set +e
          bash "$qualifier"
          qualifier_rc=$?
          set -e
          exit "$qualifier_rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v120-weak-range-current-main-qualification-r5
          path: |
            /tmp/pr2231-v120-weak-range-current-main-qualification-r5
            /tmp/pr2231-v120-weak-range-current-main-controller-envelope-r5
          if-no-files-found: error
          retention-days: 90
