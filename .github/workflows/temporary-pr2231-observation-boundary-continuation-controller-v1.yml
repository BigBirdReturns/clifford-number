name: Temporary PR 2231 observation-boundary continuation controller v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-observation-boundary-continuation-v1-repair.py'
      - '.github/workflows/temporary-pr2231-observation-boundary-continuation-controller-v1.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-observation-boundary-continuation-v1
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
      CBRANCH: agent/pr2231-observation-boundary-continuation-controller-v1
      REPAIR_PATH: .github/tmp/pr2231-observation-boundary-continuation-v1-repair.py
      REPAIR_BLOB: a240bec6d73b235f6c4235dfab797f4e621a1e8c
      CPARENT: 564da53a373bfee43b026d7ed0ba0022bcc38633
      CTREE: 2e0ba796bf4648e899e8c425ce00fa9bbdb2c7cc
      CBASEPARENT: 01428cde971ffe0d995a60c80c153eded9b7e6b1
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 27da1b37e606d87af8cea175995d2ba49e859369
      PTREE: 90f1556d017a2763bb3800479384c46f6f000bbc
      PLIB: daadf5c66839e6e2c74792a02706704eee98e698
      PTEST: c43624859ba307792a12b1b0986300540a66399e
      RLIB: 4ea5698df5928ad51c42172057578c0c2ef1781a
      RTEST: 9a5ce8776697ae36d9833c052bfa923cf43f210d
      RUN_SHA256: 6d847399788e6f11802e48bdc4419fc666012176c56d86c25a712f5b03a5793d

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Qualify and publish observation-boundary continuation repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          body="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "$api" | jq -r '.body // ""')"
          payload="$(printf '%s\n' "$body" | sed -n             '/^CONTROLLER_RUN_GZ_B64_BEGIN$/,/^CONTROLLER_RUN_GZ_B64_END$/p' |             sed '1d;$d' | tr -d '[:space:]')"
          test -n "$payload"
          printf '%s' "$payload" | base64 -d | gzip -d > /tmp/pr2231-controller-run.sh
          test "$(sha256sum /tmp/pr2231-controller-run.sh | awk '{print $1}')" = "$RUN_SHA256"
          bash /tmp/pr2231-controller-run.sh

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-observation-boundary-continuation-v1
          path: /tmp/pr2231-observation-boundary-continuation-artifact
          if-no-files-found: error
          retention-days: 90
