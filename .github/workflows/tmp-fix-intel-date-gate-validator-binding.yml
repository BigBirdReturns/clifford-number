name: Temporary Intel date-gate validator binding repair

on:
  push:
    branches:
      - agent/m05-s03-l7-intel-date-gate-qualification-v1
    paths:
      - '.github/workflows/tmp-fix-intel-date-gate-validator-binding.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-s03-l7-intel-date-gate-qualification-v1
          fetch-depth: 0
      - name: Correct the exact SyRI Git-object binding and retire this transport
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-date-gate-monitor.mjs')
          old = "blob:'69b6dee5c5ee6548ccb4997606be397e473a417c'"
          new = "blob:'58ac18ec5841982d8ffc1be75aee6269e5f40dc9'"
          text = target.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale SyRI blob binding')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/tmp-fix-intel-date-gate-validator-binding.yml
          git diff --check
          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git add -A
          git commit -m '[M-05 S03-L7] Correct Intel date-gate SyRI binding'
          git push origin HEAD:agent/m05-s03-l7-intel-date-gate-qualification-v1
