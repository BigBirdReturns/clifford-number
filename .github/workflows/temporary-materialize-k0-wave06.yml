name: Temporary materialize K0 Wave 06
# Fragmented transport repair: concatenate the ten exact Base64 fragments, verify the source archive, and publish only the permanent tree.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave06.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-06
    paths:
      - '.github/workflows/temporary-materialize-k0-wave06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assemble, decode, and verify exact source bundle
        run: |
          set -euo pipefail
          test "$(find .github/tmp -maxdepth 1 -name 'k0-wave06-source-part-*.b64' -type f | wc -l)" -eq 10
          cat .github/tmp/k0-wave06-source-part-*.b64 > /tmp/k0-wave06-source.b64
          base64 -d /tmp/k0-wave06-source.b64 > /tmp/k0-wave06-source.tar.gz
          test "$(sha256sum /tmp/k0-wave06-source.tar.gz | awk '{print $1}')" = "efa32db6bd3537d5a34a31661eecfd53a0903eaff5efd98dc3addf9cf9420cfa"
          python - <<'PY'
          import tarfile
          expected = {
            '.github/workflows/k0-role-neutral-wave-06.yml',
            'data/project/k0-epistemic-admissibility-methodology.json',
            'data/research/corpus-coverage.json',
            'data/research/k0-role-neutral-denominator.json',
            'data/research/k0-role-neutral-wave-06.json',
            'data/research/selection-adversarial-reviews.json',
            'docs/milestones/m05-k0-role-neutral-wave-06.md',
            'test/k0-epistemic-admissibility.test.js',
            'test/k0-role-neutral-wave-06.test.js',
            'tools/build-k0-epistemic-admissibility.mjs',
            'tools/build-k0-role-neutral-wave-06.mjs',
            'tools/validate-k0-epistemic-admissibility.mjs',
            'tools/validate-k0-role-neutral-wave-06.mjs',
          }
          with tarfile.open('/tmp/k0-wave06-source.tar.gz', 'r:gz') as tf:
            actual = {m.name.removeprefix('./') for m in tf.getmembers() if m.isfile()}
            assert actual == expected, f'bundle path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
            for member in tf.getmembers():
              name = member.name.removeprefix('./')
              assert name and not name.startswith('/') and '..' not in name.split('/'), name
          print(f'exact source denominator: {len(actual)}')
          PY
          tar -xzf /tmp/k0-wave06-source.tar.gz

      - name: Build and validate focused and aggregate products
        run: |
          set -euo pipefail
          node tools/build-k0-role-neutral-wave-06.mjs
          node tools/validate-k0-role-neutral-wave-06.mjs
          node test/k0-role-neutral-wave-06.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent tree
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          git clean -fd
          test "$(find .github/tmp -maxdepth 1 -name 'k0-wave06-source-part-*.b64' -type f | wc -l)" -eq 10
          cat .github/tmp/k0-wave06-source-part-*.b64 > /tmp/k0-wave06-source.b64
          base64 -d /tmp/k0-wave06-source.b64 > /tmp/k0-wave06-source.tar.gz
          test "$(sha256sum /tmp/k0-wave06-source.tar.gz | awk '{print $1}')" = "efa32db6bd3537d5a34a31661eecfd53a0903eaff5efd98dc3addf9cf9420cfa"
          tar -xzf /tmp/k0-wave06-source.tar.gz
          node tools/build-k0-role-neutral-wave-06.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-role-neutral-wave-06.mjs
          node test/k0-role-neutral-wave-06.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Prove deterministic reconstruction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          paths = [
            '.github/workflows/k0-role-neutral-wave-06.yml',
            'data/project/k0-epistemic-admissibility-methodology.json',
            'data/project/k0-epistemic-admissibility-release-manifest.json',
            'data/project/k0-role-neutral-wave-06-release-manifest.json',
            'data/research/corpus-coverage.json',
            'data/research/k0-role-neutral-denominator.json',
            'data/research/k0-role-neutral-wave-06.json',
            'data/research/selection-adversarial-reviews.json',
            'docs/milestones/m05-k0-role-neutral-wave-06.md',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-06.html',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-06.json',
            'reports/core-thesis/answerable-power/k0.html',
            'reports/core-thesis/answerable-power/k0.json',
            'test/k0-epistemic-admissibility.test.js',
            'test/k0-role-neutral-wave-06.test.js',
            'tools/build-k0-epistemic-admissibility.mjs',
            'tools/build-k0-role-neutral-wave-06.mjs',
            'tools/validate-k0-epistemic-admissibility.mjs',
            'tools/validate-k0-role-neutral-wave-06.mjs',
          ]
          before = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          subprocess.run(['node','tools/build-k0-role-neutral-wave-06.mjs'], check=True)
          subprocess.run(['node','tools/build-k0-epistemic-admissibility.mjs'], check=True)
          after = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          assert before == after, {p: (before[p], after[p]) for p in paths if before[p] != after[p]}
          print(json.dumps({'deterministic': True, 'paths': len(paths)}, indent=2))
          PY

      - name: Commit permanent tree and remove transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/tmp/k0-wave06-source.tar.gz.b64
          git rm .github/tmp/k0-wave06-source-part-*.b64
          git rm .github/workflows/temporary-k0-wave06-bootstrap.yml
          git rm .github/workflows/temporary-materialize-k0-wave06.yml

          git add \
            .github/workflows/k0-role-neutral-wave-06.yml \
            data/project/k0-epistemic-admissibility-methodology.json \
            data/project/k0-epistemic-admissibility-release-manifest.json \
            data/project/k0-role-neutral-wave-06-release-manifest.json \
            data/research/corpus-coverage.json \
            data/research/k0-role-neutral-denominator.json \
            data/research/k0-role-neutral-wave-06.json \
            data/research/selection-adversarial-reviews.json \
            docs/milestones/m05-k0-role-neutral-wave-06.md \
            reports/core-thesis/answerable-power/k0-role-neutral-wave-06.html \
            reports/core-thesis/answerable-power/k0-role-neutral-wave-06.json \
            reports/core-thesis/answerable-power/k0.html \
            reports/core-thesis/answerable-power/k0.json \
            test/k0-epistemic-admissibility.test.js \
            test/k0-role-neutral-wave-06.test.js \
            tools/build-k0-epistemic-admissibility.mjs \
            tools/build-k0-role-neutral-wave-06.mjs \
            tools/validate-k0-epistemic-admissibility.mjs \
            tools/validate-k0-role-neutral-wave-06.mjs

          python - <<'PY'
          import subprocess
          permanent = {
            '.github/workflows/k0-role-neutral-wave-06.yml',
            'data/project/k0-epistemic-admissibility-methodology.json',
            'data/project/k0-epistemic-admissibility-release-manifest.json',
            'data/project/k0-role-neutral-wave-06-release-manifest.json',
            'data/research/corpus-coverage.json',
            'data/research/k0-role-neutral-denominator.json',
            'data/research/k0-role-neutral-wave-06.json',
            'data/research/selection-adversarial-reviews.json',
            'docs/milestones/m05-k0-role-neutral-wave-06.md',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-06.html',
            'reports/core-thesis/answerable-power/k0-role-neutral-wave-06.json',
            'reports/core-thesis/answerable-power/k0.html',
            'reports/core-thesis/answerable-power/k0.json',
            'test/k0-epistemic-admissibility.test.js',
            'test/k0-role-neutral-wave-06.test.js',
            'tools/build-k0-epistemic-admissibility.mjs',
            'tools/build-k0-role-neutral-wave-06.mjs',
            'tools/validate-k0-epistemic-admissibility.mjs',
            'tools/validate-k0-role-neutral-wave-06.mjs',
          }
          transport = {
            '.github/tmp/k0-wave06-source.tar.gz.b64',
            '.github/workflows/temporary-k0-wave06-bootstrap.yml',
            '.github/workflows/temporary-materialize-k0-wave06.yml',
          }
          transport.update({f'.github/tmp/k0-wave06-source-part-{i:02d}.b64' for i in range(10)})
          expected = permanent | transport
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          assert len(permanent) == 19 and len(transport) == 13 and len(actual) == 32
          assert not any(p.startswith('build/') or p.startswith('dist/') for p in actual)
          print('exact staged denominator: 19 permanent paths + 13 transport deletions')
          PY

          git diff --cached --check
          git commit -m 'Execute K0 role-neutral denominator Wave 06'
          git push origin HEAD:agent/k0-role-neutral-wave-06
