name: Temporary observation recovery export v37

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-observation-recovery-export-v37.yml'

permissions:
  contents: read
  issues: read

concurrency:
  group: observation-recovery-export-v37
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'BigBirdReturns/clifford-number' && github.event.pull_request.number == 2227
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 2469a23db69e0b2bc325133d0619cc88e1c89ab2
      SOURCE_PARENT: 2d2c7b6cd7517ca25854e481b21774a697d0e76b
      SOURCE_HEAD: 456ee43cb8a0d3c1afeeed8b9f7342219a3fac05
      EXPECTED_PRODUCT: 456ee43cb8a0d3c1afeeed8b9f7342219a3fac05
      CARRIER_PARENT: 254fe47725d5db03610ce845a9dbc410a1b89e4d
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CARRIER_BRANCH: agent/current-main-identifier-context-v1
      RECOVERY_COMMENT_ID: '5400057410'
      PATCH_SHA256: 7988d991b5141ad7a7a0b79c5203be0279348f1d6d737c5656178c61ccdff2ea
      PATCH_BYTES: '3812'
      EXPECTED_PATCH_TREE: 32f5cbc1407c054dafd47356d04ff45d7b980906
      EXPECTED_PATCH_LIBRARY: 36ddfe7ea06b1e4676dd0b6bb5c57dc2c64568e1
      EXPECTED_PATCH_TEST: 220c2b3852d26b77cfde830d79278f192e029535
      SOURCE_WORK: /tmp/observation-recovery-export-source-v37
      PATCH_FILE: /tmp/observation-recovery-export-v37.patch
      EXPORT_DIR: /tmp/observation-recovery-export-v37

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate exact read-only leases
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test '${{ github.event.pull_request.head.ref }}' = "$CARRIER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git diff --name-only "$CARRIER_PARENT..HEAD")" = '.github/workflows/temporary-observation-recovery-export-v37.yml'
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "+refs/heads/$CARRIER_BRANCH:refs/remotes/origin/$CARRIER_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)" = "$EXPECTED_PRODUCT"
          test "$(git rev-parse refs/remotes/origin/$CARRIER_BRANCH)" = "$HEAD_SHA"
          test "$(git rev-parse "$SOURCE_HEAD^")" = "$SOURCE_PARENT"

      - name: Reconstruct exact recovery candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_WORK" "$EXPORT_DIR"
          git worktree prune
          git worktree add --detach "$SOURCE_WORK" "$SOURCE_HEAD"
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request

          url = ('https://api.github.com/repos/BigBirdReturns/clifford-number/'
                 f'issues/comments/{os.environ["RECOVERY_COMMENT_ID"]}')
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version': '2022-11-28'
          })
          with urllib.request.urlopen(request) as response:
              body = json.load(response)['body']
          chunks = re.findall(r'(?m)^\d+\.\s+`([A-Za-z0-9+/=]+)`\s*$', body)
          if len(chunks) != 6:
              raise SystemExit(f'expected 6 chunks, found {len(chunks)}')
          compressed = base64.b64decode(''.join(chunks), validate=True)
          if len(compressed) != int(os.environ['PATCH_BYTES']):
              raise SystemExit(f'unexpected compressed size: {len(compressed)}')
          digest = hashlib.sha256(compressed).hexdigest()
          if digest != os.environ['PATCH_SHA256']:
              raise SystemExit(f'unexpected digest: {digest}')
          pathlib.Path('/tmp/observation-recovery-export-v37.patch.gz').write_bytes(compressed)
          pathlib.Path(os.environ['PATCH_FILE']).write_bytes(gzip.decompress(compressed))
          PY
          cd "$SOURCE_WORK"
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git am "$PATCH_FILE"
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PATCH_TREE"
          test "$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)" = "$EXPECTED_PATCH_LIBRARY"
          test "$(git rev-parse HEAD:test/industrial-exhaust.test.js)" = "$EXPECTED_PATCH_TEST"
          mkdir -p "$EXPORT_DIR/tools/lib" "$EXPORT_DIR/test"
          cp tools/lib/industrial-exhaust.mjs "$EXPORT_DIR/tools/lib/industrial-exhaust.mjs"
          cp test/industrial-exhaust.test.js "$EXPORT_DIR/test/industrial-exhaust.test.js"
          cp "$PATCH_FILE" "$EXPORT_DIR/recovery.patch"
          git show --stat --oneline HEAD > "$EXPORT_DIR/commit.txt"
          printf '%s\n' "$SOURCE_HEAD" > "$EXPORT_DIR/parent.txt"
          printf '%s\n' "$(git rev-parse HEAD)" > "$EXPORT_DIR/commit-sha.txt"
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > "$EXPORT_DIR/tree.txt"

      - name: Upload exact recovery candidate
        uses: actions/upload-artifact@v4
        with:
          name: observation-recovery-export-v37
          path: /tmp/observation-recovery-export-v37
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git worktree remove --force "$SOURCE_WORK" >/dev/null 2>&1 || true
          rm -rf "$SOURCE_WORK" "$EXPORT_DIR" /tmp/observation-recovery-export-v37.patch.gz "$PATCH_FILE"
