name: TEMP qualify exact repaired PC-56 product tree v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc56-materializer-carrier-v3
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PARENT: 21afd8b3da1b7d06d2dada51929c63b60d6da66c
      PARENT_TREE: e6be866eb060e4fb3b2352601f964f7b5f4605fc
      PRODUCT_TREE: 3b2bfd2916f86d59adad372c07c5942f676f6aab
      ARCHIVE_SHA256: 9b42d1b7674f6e1e37fb2d21989f47c45a11f3951e5ad48e3c545c6533f4d337
      SOURCE_MANIFEST_SHA256: 02817147fb3f09ce97b1851299c5e446894c18ec1c73430c57a372e348768b60
      FINAL_MANIFEST_SHA256: 10c4ceca4314f8a80f3899cfa3b6fc49a951729dad77579a314aaeb69230329d
      REPAIR_PATCH_SHA256: a6a064202749a9e36c92aed505223f956af6292845529abf418c4d024ee97e53
      WORK: /tmp/pc56-qualified-product-tree-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate repaired package and live-main boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          cat .tmp/pc56/product.b64.* | tr -d '\n\r ' | base64 --decode > "$WORK/source-product.tar.gz"
          cp .tmp/pc56/product-manifest.json "$WORK/source-manifest.json"
          cp .tmp/pc56/repaired-product-manifest.json "$WORK/product-manifest.json"
          cp .tmp/pc56/manifest-runtime-alias-repair.patch "$WORK/repair.patch"
          test "$(sha256sum "$WORK/source-product.tar.gz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          test "$(sha256sum "$WORK/source-manifest.json" | awk '{print $1}')" = "$SOURCE_MANIFEST_SHA256"
          test "$(sha256sum "$WORK/product-manifest.json" | awk '{print $1}')" = "$FINAL_MANIFEST_SHA256"
          test "$(sha256sum "$WORK/repair.patch" | awk '{print $1}')" = "$REPAIR_PATCH_SHA256"

          python - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['WORK'])
          source=json.loads((root/'source-manifest.json').read_text())
          final=json.loads((root/'product-manifest.json').read_text())
          expected_top={'schema_version','issue','qualified_parent','qualified_parent_tree','permanent_path_count','transport_path_count','outside_human_dependency','graph_effect','entries'}
          for label,manifest in [('source',source),('final',final)]:
              assert set(manifest)==expected_top, f'{label} manifest keys'
              assert manifest['schema_version']=='pc56-product-manifest@1' and manifest['issue']==1450, f'{label} identity'
              assert manifest['qualified_parent']==os.environ['PARENT'] and manifest['qualified_parent_tree']==os.environ['PARENT_TREE'], f'{label} parent'
              assert manifest['permanent_path_count']==14 and manifest['transport_path_count']==0, f'{label} denominator'
              assert manifest['outside_human_dependency'] is False and manifest['graph_effect']=='none', f'{label} authority'
          paths=[e['path'] for e in final['entries']]
          assert paths==sorted(paths) and len(paths)==len(set(paths))==14
          assert [e['path'] for e in source['entries']]==paths
          blocked=('.tmp','carrier','materializer','controller','diagnostic','receipt','marker','pulse','trigger','shard')
          assert not [(path,token) for path in paths for token in blocked if token in path.lower()]
          (root/'product-paths.txt').write_text('\n'.join(paths)+'\n')
          with tarfile.open(root/'source-product.tar.gz','r:gz') as archive:
              members=archive.getmembers()
              assert [m.name for m in members]==paths
              for member,entry in zip(members,source['entries']):
                  data=archive.extractfile(member).read()
                  blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
                  assert member.isfile() and member.mode==0o644
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'] and blob==entry['git_blob']
          PY

          git fetch --no-tags origin "$PARENT"
          git fetch --no-tags origin main
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          CURRENT_MAIN=$(git rev-parse origin/main)
          test "$(git merge-base "$PARENT" "$CURRENT_MAIN")" = "$PARENT"
          printf '%s\n' "$CURRENT_MAIN" > "$WORK/current-main.txt"
          git diff --name-only "$PARENT" "$CURRENT_MAIN" | sort -u > "$WORK/main-successor-paths.txt"
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path(os.environ['WORK'])
          product=set(root.joinpath('product-paths.txt').read_text().splitlines())
          successor=set(root.joinpath('main-successor-paths.txt').read_text().splitlines())
          overlap=sorted(product & successor)
          existing=[]
          main=root.joinpath('current-main.txt').read_text().strip()
          for path in sorted(product):
              result=subprocess.run(['git','cat-file','-e',f'{main}:{path}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if result.returncode==0: existing.append(path)
          root.joinpath('main-overlap.txt').write_text('\n'.join(overlap)+('\n' if overlap else ''))
          root.joinpath('existing-product-paths.txt').write_text('\n'.join(existing)+('\n' if existing else ''))
          if overlap or existing: raise SystemExit(f'live-main collision: overlap={overlap!r} existing={existing!r}')
          PY

      - name: Apply exact repair and prove frozen fourteen-blob tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout --detach "$PARENT"
          tar -xzf "$WORK/source-product.tar.gz"
          git apply --check "$WORK/repair.patch"
          git apply "$WORK/repair.patch"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['WORK']); manifest=json.loads((root/'product-manifest.json').read_text())
          observed=[]
          for entry in manifest['entries']:
              data=Path(entry['path']).read_bytes()
              sha=hashlib.sha256(data).hexdigest(); blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              observed.append({'path':entry['path'],'bytes':len(data),'sha256':sha,'git_blob':blob})
              assert len(data)==entry['bytes'] and sha==entry['sha256'] and blob==entry['git_blob'], entry['path']
          root.joinpath('final-file-observations.json').write_text(json.dumps(observed,indent=2)+'\n')
          PY
          git add --pathspec-from-file="$WORK/product-paths.txt"
          git diff --cached --name-status "$PARENT" > "$WORK/product-delta.tsv"
          test "$(wc -l < "$WORK/product-delta.tsv" | tr -d ' ')" = 14
          awk '$1 != "A" { exit 1 }' "$WORK/product-delta.tsv"
          test "$(git write-tree)" = "$PRODUCT_TREE"
          printf '%s\n' "$PRODUCT_TREE" > "$WORK/product-tree.txt"
          : > "$WORK/product-blobs.tsv"
          while IFS= read -r path; do printf '%s\t%s\n' "$path" "$(git rev-parse ":$path")" >> "$WORK/product-blobs.tsv"; done < "$WORK/product-paths.txt"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['WORK'])
          expected={e['path']:e['git_blob'] for e in json.loads((root/'product-manifest.json').read_text())['entries']}
          observed=dict(line.split('\t',1) for line in root.joinpath('product-blobs.tsv').read_text().splitlines() if line)
          assert observed==expected
          PY

      - name: Run focused and complete repository qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build/research
          node tools/compile-preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs
          node tools/validate-preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs
          node test/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.test.js
          node tools/compile-preference-custody-manifest-v54.mjs
          node tools/validate-preference-custody-manifest-v54.mjs
          node test/preference-custody-manifest-v54.test.js
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check

      - name: Publish exact immutable blobs and seal qualification receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['WORK']); manifest=json.loads((root/'product-manifest.json').read_text())
          published=[]
          for entry in manifest['entries']:
              data=Path(entry['path']).read_bytes()
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'})
              proc=subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GH_REPOSITORY']}/git/blobs",'--input','-'],input=payload,text=True,capture_output=True,check=True)
              sha=json.loads(proc.stdout)['sha']
              assert sha==entry['git_blob'], entry['path']
              published.append({'path':entry['path'],'git_blob':sha})
          root.joinpath('remote-product-blobs.json').write_text(json.dumps(published,indent=2)+'\n')
          receipt={'schema_version':'pc56-qualified-product-tree@3','status':'qualified','issue':1450,'qualified_parent':os.environ['PARENT'],'qualified_parent_tree':os.environ['PARENT_TREE'],'current_main':root.joinpath('current-main.txt').read_text().strip(),'product_tree':os.environ['PRODUCT_TREE'],'permanent_paths':14,'additions':14,'modifications':0,'deletions':0,'transport_paths':0,'paid_defect':'manifest_to_runtime_cross_root_alias_accepted','repaired_paths':2,'standalone_fixture_mutations':794,'standalone_build_tamper_checks':99,'floor_manifest_mutations':113,'floor_build_tamper_checks':26,'historical_floor_reconstruction':'pass','base_preference_custody':'pass','no_magic_human':'pass','release_check':'pass','outside_human_dependency':False,'graph_effect':'none','ref_updates':0}
          root.joinpath('qualification-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          sha256sum "$WORK"/* > "$WORK/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: pc56-qualified-repaired-product-tree-v3
          path: /tmp/pc56-qualified-product-tree-v3
          if-no-files-found: error
          retention-days: 90
