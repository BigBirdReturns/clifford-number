name: SSC residual-denominator Wave 03 current ledger

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-residual-denominator-wave-03-current.yml'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-current.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'data/project/ssc-residual-wave03/closures/RD-01-C06.json'
      - 'data/research/status-sovereignty-rd-wave03-rd01-methodology-correction/class-receipt.json'
      - 'data/research/status-sovereignty-rd-wave03-rd01-methodology-correction/manifest.json'
      - 'data/project/ssc-residual-wave03/closures/RD-03-C05.json'
      - 'data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/class-receipt.json'
      - 'data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/manifest.json'
      - 'docs/milestones/ssc-residual-denominator-wave-03-current.md'
      - 'schemas/status-sovereignty-residual-denominator-wave-03-current.schema.json'
      - 'test/status-sovereignty-residual-denominator-wave-03-current.test.js'
      - 'tools/build-status-sovereignty-residual-denominator-wave-03-current.mjs'
      - 'tools/validate-status-sovereignty-residual-denominator-wave-03-current.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-residual-denominator-wave-03-current.yml'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-current.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'data/project/ssc-residual-wave03/closures/RD-01-C06.json'
      - 'data/research/status-sovereignty-rd-wave03-rd01-methodology-correction/class-receipt.json'
      - 'data/research/status-sovereignty-rd-wave03-rd01-methodology-correction/manifest.json'
      - 'data/project/ssc-residual-wave03/closures/RD-03-C05.json'
      - 'data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/class-receipt.json'
      - 'data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/manifest.json'
      - 'docs/milestones/ssc-residual-denominator-wave-03-current.md'
      - 'schemas/status-sovereignty-residual-denominator-wave-03-current.schema.json'
      - 'test/status-sovereignty-residual-denominator-wave-03-current.test.js'
      - 'tools/build-status-sovereignty-residual-denominator-wave-03-current.mjs'
      - 'tools/validate-status-sovereignty-residual-denominator-wave-03-current.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-residual-wave03-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact eight-closure cumulative ledger
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-residual-denominator-wave-03-current.mjs
          node --check tools/validate-status-sovereignty-residual-denominator-wave-03-current.mjs
          node --check test/status-sovereignty-residual-denominator-wave-03-current.test.js
          node tools/build-status-sovereignty-residual-denominator-wave-03-current.mjs --check
          node tools/validate-status-sovereignty-residual-denominator-wave-03-current.mjs
          node test/status-sovereignty-residual-denominator-wave-03-current.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore and deterministically replay current-ledger derivation
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-residual-denominator-wave-03-current.mjs --write
          node tools/validate-status-sovereignty-residual-denominator-wave-03-current.mjs
          node test/status-sovereignty-residual-denominator-wave-03-current.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve exact current-ledger custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-residual-denominator-wave-03-current
          path: |
            data/research/status-sovereignty-residual-denominator-wave-03-current.json
            schemas/status-sovereignty-residual-denominator-wave-03-current.schema.json
            docs/milestones/ssc-residual-denominator-wave-03-current.md
          if-no-files-found: error
          retention-days: 90
