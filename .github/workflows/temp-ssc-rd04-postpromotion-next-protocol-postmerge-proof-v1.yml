name: TEMP prove RD-04 postpromotion protocol merge custody

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PRODUCT_PARENT: 3918c799f8b8dcdac49c33cec5c7bbd01ac428e4
      FIRST_PARENT: d99146fe88617e002463481732a54626aafe3924
      PRODUCT_COMMIT: f45bc61a634082d6146182c880e4855ae8e8bc20
      MERGE_COMMIT: 91b386df809079884825b19a6b5d864b6e739172

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind carrier, merge topology, product blobs, and live-main lease
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1"
          WORK="$RUNNER_TEMP/ssc-rd04-postpromotion-next-protocol-postmerge-proof-worktree"
          CARRIER='.github/workflows/temp-ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1.yml'
          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT"
          printf 'source_requests=0\nsource_admissions=0\nfield_classifications=0\nrow_state_mutations=0\nclass_effect=none\ncumulative_ledger_effect=none\noutside_human_dependency=false\npublication_effect=none\nadoption_effect=none\ngraph_effect=none\n' > "$OUT/BOUNDARY"
          printf 'binding-carrier-and-merge\n' > "$OUT/STAGE"

          test "$(git rev-parse HEAD^)" = "$MERGE_COMMIT"
          test "$(git rev-list --count "$MERGE_COMMIT"..HEAD)" -eq 1
          test "$(git diff --name-only "$MERGE_COMMIT" HEAD)" = "$CARRIER"
          git diff --check "$MERGE_COMMIT" HEAD

          git fetch --no-tags origin main
          for object in "$PRODUCT_PARENT" "$FIRST_PARENT" "$PRODUCT_COMMIT" "$MERGE_COMMIT"; do
            git cat-file -e "$object^{commit}"
          done
          test "$(git rev-parse "$MERGE_COMMIT^1")" = "$FIRST_PARENT"
          test "$(git rev-parse "$MERGE_COMMIT^2")" = "$PRODUCT_COMMIT"
          test "$(git rev-parse "$PRODUCT_COMMIT^")" = "$PRODUCT_PARENT"
          test "$(git rev-list --count "$PRODUCT_PARENT".."$PRODUCT_COMMIT")" -eq 1

          cat > "$OUT/product-paths.txt" <<'EOF_PRODUCT_PATHS'
          .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.yml
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/frontier-selection.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/predecessor-custody.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/previously-frozen-url-exclusion.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/route-ledger.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/route-query-contract.json
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol/summary.json
          docs/milestones/ssc-rd-wave03-rd04-postpromotion-next-protocol.md
          schemas/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.schema.json
          test/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.test.js
          tools/acquisition/status-sovereignty-rd-wave03-rd04-postpromotion-next/execute-fixed-routes.py
          tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          EOF_PRODUCT_PATHS
          sort -o "$OUT/product-paths.txt" "$OUT/product-paths.txt"
          test "$(wc -l < "$OUT/product-paths.txt")" -eq 14

          cat > "$OUT/main-only-paths.txt" <<'EOF_MAIN_PATHS'
          data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json
          tools/validate-schoolhouse-legal-identity-current-frontier.py
          EOF_MAIN_PATHS
          sort -o "$OUT/main-only-paths.txt" "$OUT/main-only-paths.txt"

          cat > "$OUT/immutable-input-paths.txt" <<'EOF_INPUT_PATHS'
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promoted-partial-field-matrix.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-summary.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/remaining-open-field-census.json
          data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/selected-followup-protocol.json
          data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/source-adjudications.json
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/route-discovery-protocol.json
          EOF_INPUT_PATHS
          sort -o "$OUT/immutable-input-paths.txt" "$OUT/immutable-input-paths.txt"

          git diff --name-only --diff-filter=ACDMRTUXB "$PRODUCT_PARENT" "$PRODUCT_COMMIT" | sort > "$OUT/product-commit-paths.txt"
          git diff --name-only --diff-filter=A "$PRODUCT_PARENT" "$PRODUCT_COMMIT" | sort > "$OUT/product-added-paths.txt"
          diff -u "$OUT/product-paths.txt" "$OUT/product-commit-paths.txt"
          diff -u "$OUT/product-paths.txt" "$OUT/product-added-paths.txt"

          git diff --name-only --diff-filter=ACDMRTUXB "$FIRST_PARENT" "$MERGE_COMMIT" | sort > "$OUT/merge-first-parent-paths.txt"
          git diff --name-only --diff-filter=A "$FIRST_PARENT" "$MERGE_COMMIT" | sort > "$OUT/merge-first-parent-added-paths.txt"
          diff -u "$OUT/product-paths.txt" "$OUT/merge-first-parent-paths.txt"
          diff -u "$OUT/product-paths.txt" "$OUT/merge-first-parent-added-paths.txt"

          git diff --name-only --diff-filter=ACDMRTUXB "$PRODUCT_COMMIT" "$MERGE_COMMIT" | sort > "$OUT/merge-second-parent-paths.txt"
          diff -u "$OUT/main-only-paths.txt" "$OUT/merge-second-parent-paths.txt"

          while IFS= read -r path; do
            product_blob="$(git rev-parse "$PRODUCT_COMMIT:$path")"
            merge_blob="$(git rev-parse "$MERGE_COMMIT:$path")"
            test "$product_blob" = "$merge_blob"
            printf '%s\t%s\n' "$product_blob" "$path"
          done < "$OUT/product-paths.txt" > "$OUT/product-blob-custody.tsv"

          LIVE_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$MERGE_COMMIT" "$LIVE_MAIN"
          git diff --name-only "$MERGE_COMMIT" "$LIVE_MAIN" | sort > "$OUT/intervening-main-paths.txt"
          cat "$OUT/product-paths.txt" "$OUT/immutable-input-paths.txt" | sort -u > "$OUT/protected-paths.txt"
          comm -12 "$OUT/protected-paths.txt" "$OUT/intervening-main-paths.txt" > "$OUT/intervening-overlap.txt"
          test ! -s "$OUT/intervening-overlap.txt"

          while IFS= read -r path; do
            merge_blob="$(git rev-parse "$MERGE_COMMIT:$path")"
            live_blob="$(git rev-parse "$LIVE_MAIN:$path")"
            test "$merge_blob" = "$live_blob"
          done < "$OUT/product-paths.txt"

          printf '%s\n' "$LIVE_MAIN" > "$OUT/live-main.txt"
          printf '%s\n' "$PRODUCT_PARENT" > "$OUT/product-parent.txt"
          printf '%s\n' "$FIRST_PARENT" > "$OUT/merge-first-parent.txt"
          printf '%s\n' "$PRODUCT_COMMIT" > "$OUT/merge-second-parent.txt"
          printf '%s\n' "$MERGE_COMMIT" > "$OUT/merge-commit.txt"
          git rev-parse "$PRODUCT_COMMIT^{tree}" > "$OUT/product-tree.txt"
          git rev-parse "$MERGE_COMMIT^{tree}" > "$OUT/merge-tree.txt"
          git rev-parse "$LIVE_MAIN^{tree}" > "$OUT/live-main-tree.txt"

          printf 'qualifying-live-main\n' > "$OUT/STAGE"
          git worktree add --detach "$WORK" "$LIVE_MAIN"
          printf '%s\n' "$WORK" > "$OUT/worktree.txt"

      - name: Validate exact merge product on current main
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1"
          WORK="$RUNNER_TEMP/ssc-rd04-postpromotion-next-protocol-postmerge-proof-worktree"
          cd "$WORK"

          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promoted-partial-field-matrix.json)" = 42361e559db90777e1d60aea5530df5694c86dc6
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/remaining-open-field-census.json)" = e6ea2bb2722d084d0bb601864d4de5d9db4c7b47
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-summary.json)" = e774a9ed555364e4c6616c407a24001dd39f8f51
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/route-discovery-protocol.json)" = 35e09035659d54060547e84ab29d5ba440402b2c
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/selected-followup-protocol.json)" = 88cb73c7bae87a4031d1571d7dd5ebdcb58aa2f4
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/source-adjudications.json)" = 53f378c9c4a56ca4aab0312bba38150b071786af

          node --check tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd04-postpromotion-next/execute-fixed-routes.py
          rm -rf tools/acquisition/status-sovereignty-rd-wave03-rd04-postpromotion-next/__pycache__
          node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          git diff --exit-code -- data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol

          python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
          python - <<'PYSCHEMA'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('schemas/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.schema.json').read_text())
          validator = Draft202012Validator(schema)
          root = Path('data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol')
          names = [
              'predecessor-custody.json',
              'frontier-selection.json',
              'previously-frozen-url-exclusion.json',
              'route-ledger.json',
              'route-query-contract.json',
              'summary.json',
              'product-manifest.json',
          ]
          for name in names:
              value = json.loads((root / name).read_text())
              errors = sorted(validator.iter_errors(value), key=lambda error: list(error.path))
              if errors:
                  raise SystemExit(f'{name}: {errors[0].message} at {list(errors[0].path)}')
          print(f'recursive_schema_validation=pass objects={len(names)}')
          PYSCHEMA

          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          node test/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.test.js
          python tools/acquisition/status-sovereignty-rd-wave03-rd04-postpromotion-next/execute-fixed-routes.py --dry-run > "$OUT/execution-plan.json"
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check

          git restore --staged --worktree .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs --write
          node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.mjs
          node test/status-sovereignty-rd-wave03-rd04-postpromotion-next-protocol.test.js
          python tools/acquisition/status-sovereignty-rd-wave03-rd04-postpromotion-next/execute-fixed-routes.py --dry-run > "$OUT/replay-execution-plan.json"
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          printf 'complete\n' > "$OUT/STAGE"
          python - "$OUT" <<'PYRECEIPT'
          from pathlib import Path
          import json
          import sys

          out = Path(sys.argv[1])
          receipt = {
              'schema_version': 'ssc-rd04-postpromotion-next-protocol-postmerge-proof@1',
              'state': 'complete',
              'product_parent': (out / 'product-parent.txt').read_text().strip(),
              'merge_first_parent': (out / 'merge-first-parent.txt').read_text().strip(),
              'merge_second_parent': (out / 'merge-second-parent.txt').read_text().strip(),
              'merge_commit': (out / 'merge-commit.txt').read_text().strip(),
              'live_main': (out / 'live-main.txt').read_text().strip(),
              'product_tree': (out / 'product-tree.txt').read_text().strip(),
              'merge_tree': (out / 'merge-tree.txt').read_text().strip(),
              'live_main_tree': (out / 'live-main-tree.txt').read_text().strip(),
              'permanent_paths': 14,
              'merge_first_parent_added_paths': 14,
              'merge_second_parent_disjoint_paths': 3,
              'intervening_overlap_paths': len((out / 'intervening-overlap.txt').read_text().splitlines()),
              'fixed_routes': 5,
              'selected_states': ['MT', 'ND'],
              'selected_open_substantive_cells': 6,
              'source_requests': 0,
              'source_admissions': 0,
              'field_classifications': 0,
              'row_state_mutations': 0,
              'class_effect': 'none',
              'cumulative_ledger_effect': 'none',
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PYRECEIPT
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact post-merge proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-next-protocol-postmerge-proof-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
