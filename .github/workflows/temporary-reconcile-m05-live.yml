name: Temporary reconcile M-05 live topology

on:
  push:
    branches:
      - agent/m05-live-reconciliation
    paths:
      - '.github/workflows/temporary-reconcile-m05-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-live-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile live issue references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/project/m05-answerable-power-fanout.json')
          data=json.loads(path.read_text())
          data['parent_issue']=303
          for index,lane in enumerate(data['lanes'],start=304):
              lane['live_issue_number']=index
              lane['live_issue_url']=f'https://github.com/BigBirdReturns/clifford-number/issues/{index}'
          data['live_reconciliation']={
              'master_issue':303,
              'expected_lanes':16,
              'live_lanes':16,
              'uninstantiated_lanes':0,
              'first_issue':304,
              'last_issue':319,
          }
          path.write_text(json.dumps(data,indent=2)+'\n')
          milestone=Path('docs/milestones/m05-answerable-power-wave-01.md')
          text=milestone.read_text()
          marker='## Live reconciliation receipt\n'
          block='''## Live reconciliation receipt

```text
program PR: #302
merge: f4869088d2110d84fc9f9a127bc9b6e17410666b
master issue: #303
live lanes: #304–#319
reconciled: 16/16
```

'''
          if marker not in text:
              text=text.replace('## Completion condition\n',block+'## Completion condition\n')
              milestone.write_text(text)
          PY
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated drift and rebuild target products
        run: |
          mkdir -p /tmp/m05/data/project /tmp/m05/docs/milestones /tmp/m05/reports/core-thesis/answerable-power
          cp data/project/m05-answerable-power-fanout.json /tmp/m05/data/project/
          cp docs/milestones/m05-answerable-power-wave-01.md /tmp/m05/docs/milestones/
          cp reports/core-thesis/answerable-power/data.json /tmp/m05/reports/core-thesis/answerable-power/
          cp reports/core-thesis/answerable-power/index.html /tmp/m05/reports/core-thesis/answerable-power/
          git restore --staged --worktree .
          cp /tmp/m05/data/project/m05-answerable-power-fanout.json data/project/
          cp /tmp/m05/docs/milestones/m05-answerable-power-wave-01.md docs/milestones/
          cp /tmp/m05/reports/core-thesis/answerable-power/data.json reports/core-thesis/answerable-power/
          cp /tmp/m05/reports/core-thesis/answerable-power/index.html reports/core-thesis/answerable-power/
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          git diff --check
      - name: Commit the reconciled permanent topology
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/temporary-reconcile-m05-live.yml
          git add -- \
            data/project/m05-answerable-power-fanout.json \
            docs/milestones/m05-answerable-power-wave-01.md \
            reports/core-thesis/answerable-power/data.json \
            reports/core-thesis/answerable-power/index.html
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'no permanent changes'; exit 1; }
          git commit -m 'Reconcile M-05 live issue topology'
          git push origin HEAD:refs/heads/agent/m05-live-reconciliation
