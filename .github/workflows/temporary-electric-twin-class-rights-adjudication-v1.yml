name: TEMP adjudicate Electric Twin class rights

on:
  push:
    branches:
      - agent/electric-twin-class-rights-adjudication-v1

permissions:
  contents: write

jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact transport ref
        uses: actions/checkout@v4
        with:
          ref: agent/electric-twin-class-rights-adjudication-v1
          fetch-depth: 0
          show-progress: false

      - name: Adjudicate rights, qualify product, and publish candidate
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_MAIN="9008911cf6af3d715d0a6a1eaa7acaa68bfcf5e7"
          TRANSPORT_BRANCH="agent/electric-twin-class-rights-adjudication-v1"
          PRODUCT_BRANCH="candidate/electric-twin-class-rights-adjudication-v1"
          WORKTREE="/tmp/electric-twin-class-rights-adjudication-v1"
          PAYLOAD=".github/temporary/electric-twin-class-rights-adjudication-v1.py.gz.b64"

          base64 -d "$PAYLOAD" | gzip -d > /tmp/electric-twin-class-rights-adjudicate.py
          python3 -m py_compile /tmp/electric-twin-class-rights-adjudicate.py

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^^)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN"..HEAD)" = "2"

          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "$EXPECTED_MAIN"
          cd "$WORKTREE"
          git checkout -B "$PRODUCT_BRANCH"
          python3 /tmp/electric-twin-class-rights-adjudicate.py
          npm run release:check

          echo "Changed paths after qualification:"
          git status --short

          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(build/|data/ledger/(claims|receipts|surfaces)\.jsonl$|data/research/clifford-cross-corpus-public-interest-map\.json$|package\.json$|receipts/topology/companies-house-electric-twin-(articles|sh10-rights)-2025-09-12\.md$|test/electric-twin-class-rights\.test\.js$|tools/validate-electric-twin-class-rights\.mjs$)' || true)"
          test -z "$unexpected" || { echo "Unexpected changed paths:"; printf '%s\n' "$unexpected"; exit 1; }

          git add build \
            data/ledger/claims.jsonl \
            data/ledger/receipts.jsonl \
            data/ledger/surfaces.jsonl \
            package.json \
            receipts/topology/companies-house-electric-twin-articles-2025-09-12.md \
            receipts/topology/companies-house-electric-twin-sh10-rights-2025-09-12.md \
            test/electric-twin-class-rights.test.js \
            tools/validate-electric-twin-class-rights.mjs
          if test -f data/research/clifford-cross-corpus-public-interest-map.json; then
            git add data/research/clifford-cross-corpus-public-interest-map.json
          fi

          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          for required in \
            data/ledger/claims.jsonl \
            data/ledger/receipts.jsonl \
            data/ledger/surfaces.jsonl \
            package.json \
            receipts/topology/companies-house-electric-twin-articles-2025-09-12.md \
            receipts/topology/companies-house-electric-twin-sh10-rights-2025-09-12.md \
            test/electric-twin-class-rights.test.js \
            tools/validate-electric-twin-class-rights.mjs; do
            git diff --cached --name-only | grep -Fx "$required"
          done

          git restore --worktree -- .
          test -z "$(git diff --name-only)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: adjudicate Electric Twin class rights"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"

          git push --force origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          git push --force origin "$EXPECTED_MAIN:refs/heads/$TRANSPORT_BRANCH"

          {
            echo "## Electric Twin class-rights adjudication"
            echo
            echo '```text'
            echo "product_branch  $PRODUCT_BRANCH"
            echo "commit          $(git rev-parse HEAD)"
            echo "tree            $(git rev-parse HEAD^{tree})"
            echo "parent          $(git rev-parse HEAD^)"
            echo "changed_files   $(git diff --name-only HEAD^ HEAD | wc -l)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
