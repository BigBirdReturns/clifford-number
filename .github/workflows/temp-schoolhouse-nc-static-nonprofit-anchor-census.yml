name: TEMP census exact NC static nonprofit anchor denominator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-nc-static-nonprofit-anchor-census.yml'
      - '.schoolhouse-nc-static-nonprofit-anchor-census/EXECUTE'
      - '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.*'
  workflow_dispatch:

concurrency:
  group: schoolhouse-nc-static-nonprofit-anchor-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-nc-static-nonprofit-anchor-census-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact acquisition carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify permanent predecessor, exact carrier, and runner custody
        shell: bash
        run: |
          set -Eeuo pipefail
          SAFE_MAIN='327648726320507532751f219a52d03f9c17fac5'
          EXECUTE='.schoolhouse-nc-static-nonprofit-anchor-census/EXECUTE'
          SHARD_DIR='.schoolhouse-nc-static-nonprofit-anchor-census'
          WORKFLOW='.github/workflows/temp-schoolhouse-nc-static-nonprofit-anchor-census.yml'
          BUNDLE="$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census.py.gz.b64"
          GZIP="$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census.py.gz"
          RUNNER="$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census.py"

          git fetch --no-tags origin main "$SAFE_MAIN"
          git merge-base --is-ancestor "$SAFE_MAIN" origin/main
          test "$(git merge-base HEAD origin/main)" = "$SAFE_MAIN"
          test "$(git rev-parse "$SAFE_MAIN:data/intake/bvvc-defense-capital/schoolhouse-nc-static-nonprofit-census-custody.json")" = \
            'b6a9275bc6f29934ba7d83c71a948c9f9559b2bc'
          test "$(git rev-parse "$SAFE_MAIN:data/intake/bvvc-defense-capital/schoolhouse-nc-static-nonprofit-census-route-results.jsonl")" = \
            '1f61c9f6023baf77f9422f6fc20b52e06a7af380'

          mapfile -t CHANGED < <(git diff --name-only "$SAFE_MAIN"..HEAD | sort)
          EXPECTED=(
            '.github/workflows/temp-schoolhouse-nc-static-nonprofit-anchor-census.yml'
            '.schoolhouse-nc-static-nonprofit-anchor-census/EXECUTE'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.00'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.01'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.02'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.03'
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          for i in "${!EXPECTED[@]}"; do test "${CHANGED[$i]}" = "${EXPECTED[$i]}"; done
          git diff --exit-code -- "$WORKFLOW" "$EXECUTE" "$SHARD_DIR"/capture.part.*

          grep -Fx 'acquire=schoolhouse-nc-static-nonprofit-anchor-census-v1' "$EXECUTE"
          grep -Fx "permanent_predecessor_merge=$SAFE_MAIN" "$EXECUTE"
          grep -Fx 'runner_source_sha256=bd7c410e9fae72f0e571021ea948234ac34cb0100c54cc9010dc9f89164ff0e5' "$EXECUTE"
          grep -Fx 'runner_gzip_sha256=ae7565b24869f6143108c841ac63bbadc9b8bae5c0a4d94b252b16629b2bbd29' "$EXECUTE"
          grep -Fx 'runner_bundle_sha256=663d5e02e61a5623c0ea321edc4ac1bf3a176b8ac1de7fb8b1989e6a5ae02095' "$EXECUTE"
          grep -Fx 'runner_shard_03_sha256=c981244f43b36b57ba5c5d2af24bac510ad77aa84de3c206de635ad5d8294115' "$EXECUTE"
          grep -Fx 'fixed_source_routes=2' "$EXECUTE"
          grep -Fx 'maximum_total_requests=2' "$EXECUTE"
          grep -Fx 'successor_fetches=0' "$EXECUTE"
          grep -Fx 'query_submissions=0' "$EXECUTE"
          grep -Fx 'forms_submitted=0' "$EXECUTE"
          grep -Fx 'cookie_replays=0' "$EXECUTE"
          grep -Fx 'subscription_purchases=0' "$EXECUTE"
          grep -Fx 'raw_source_retained=false' "$EXECUTE"
          grep -Fx 'hidden_form_values_retained=false' "$EXECUTE"
          grep -Fx 'identity_admitted=false' "$EXECUTE"
          grep -Fx 'relationship_admitted=false' "$EXECUTE"
          grep -Fx 'negative_existence_claim_created=false' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"
          grep -Fx 'publication_effect=none' "$EXECUTE"
          grep -Fx 'adoption_effect=none' "$EXECUTE"
          grep -Fx 'graph_effect=none' "$EXECUTE"

          test "$(sha256sum "$SHARD_DIR/capture.part.00" | awk '{print $1}')" = '0015a95fe207550b4284d4a8edb278dd0357c8c8c19df3af709d33ec660a55b6'
          test "$(sha256sum "$SHARD_DIR/capture.part.01" | awk '{print $1}')" = '41974e89f6edacb74284370558be9971300d1ff42ec6e24aebb7e6cb86c52a5d'
          test "$(sha256sum "$SHARD_DIR/capture.part.02" | awk '{print $1}')" = '871159864914a3d90accdb112a3875d03120fbb3e1a75bd80bbdde4009a3b676'
          test "$(sha256sum "$SHARD_DIR/capture.part.03" | awk '{print $1}')" = 'c981244f43b36b57ba5c5d2af24bac510ad77aa84de3c206de635ad5d8294115'
          cat "$SHARD_DIR"/capture.part.00 \
              "$SHARD_DIR"/capture.part.01 \
              "$SHARD_DIR"/capture.part.02 \
              "$SHARD_DIR"/capture.part.03 > "$BUNDLE"
          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = '663d5e02e61a5623c0ea321edc4ac1bf3a176b8ac1de7fb8b1989e6a5ae02095'
          base64 -d "$BUNDLE" > "$GZIP"
          test "$(sha256sum "$GZIP" | awk '{print $1}')" = 'ae7565b24869f6143108c841ac63bbadc9b8bae5c0a4d94b252b16629b2bbd29'
          gzip -dc "$GZIP" > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = 'bd7c410e9fae72f0e571021ea948234ac34cb0100c54cc9010dc9f89164ff0e5'
          python -m py_compile "$RUNNER"

      - name: Execute exact two-request complete anchor census
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census"
          rm -rf "$OUT"
          python "$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census.py" --output "$OUT" \
            2>&1 | tee "$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census.log"
          status=${PIPESTATUS[0]}
          mkdir -p "$OUT"
          printf '%s\n' "$status" > "$OUT/RUNNER_EXIT_CODE"
          cp "$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census.log" "$OUT/RUNNER-OUTPUT.log"
          exit "$status"

      - name: Upload terminal anchor-census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-nc-static-nonprofit-anchor-census
          path: ${{ runner.temp }}/schoolhouse-nc-static-nonprofit-anchor-census
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Require complete current anchor denominator and zero execution authority
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census"
          RUNNER="$RUNNER_TEMP/schoolhouse-nc-static-nonprofit-anchor-census.py"
          test -f "$ROOT/RUNNER_EXIT_CODE"
          test "$(cat "$ROOT/RUNNER_EXIT_CODE")" = '0'
          for file in \
            page-receipts.jsonl \
            link-observations.jsonl \
            successor-routes.jsonl \
            fixed-term-observations.jsonl \
            form-observations.jsonl \
            script-route-observations.jsonl \
            route-policy.json \
            summary.json \
            artifact-manifest.json \
            SHA256SUMS; do
            test -f "$ROOT/$file"
          done
          (cd "$ROOT" && sha256sum -c SHA256SUMS)
          python "$RUNNER" --validate-only "$ROOT"
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          load = lambda n: json.loads((root / n).read_text())
          rows = lambda n: [json.loads(x) for x in (root / n).read_text().splitlines() if x.strip()]
          summary = load('summary.json')
          policy = load('route-policy.json')
          receipts = rows('page-receipts.jsonl')
          observations = rows('link-observations.jsonl')
          candidates = rows('successor-routes.jsonl')
          fixed = rows('fixed-term-observations.jsonl')
          forms = rows('form-observations.jsonl')
          scripts = rows('script-route-observations.jsonl')
          assert summary['schema_version'] == 'schoolhouse-nc-static-nonprofit-anchor-census@1'
          assert summary['permanent_predecessor_merge'] == '327648726320507532751f219a52d03f9c17fac5'
          assert summary['declared_source_routes'] == summary['terminal_source_routes'] == len(receipts) == 2
          assert summary['source_requests'] == 2
          assert summary['aggregate_response_bytes'] <= 4_000_000
          assert summary['current_anchor_rows'] == len(observations)
          assert summary['eligible_successor_unique_routes'] == len(candidates)
          assert summary['fixed_term_observation_rows'] == len(fixed)
          assert summary['form_observation_rows'] == len(forms)
          assert summary['script_route_observation_rows'] == len(scripts)
          assert summary['successor_fetches_executed'] == 0
          zeroes = [
              'query_submissions','forms_submitted','cookie_replays','subscription_purchases',
              'street_address_rows_retained','mailing_address_rows_retained','postal_code_rows_retained',
              'contact_detail_rows_retained','officer_rows_retained','private_support_rows',
              'identities_admitted','relationships_admitted','negative_existence_claims_created'
          ]
          assert all(summary[key] == 0 for key in zeroes)
          assert summary['raw_source_retained'] is False
          assert summary['full_visible_text_retained'] is False
          assert summary['full_script_text_retained'] is False
          assert summary['hidden_form_values_retained'] is False
          assert summary['outside_human_dependency'] is False
          assert summary['publication_effect'] == summary['adoption_effect'] == summary['graph_effect'] == 'none'
          assert policy['selection_contract']['complete_anchor_observation_denominator_required'] is True
          assert policy['selection_contract']['no_successor_fetches'] is True
          assert policy['request_bounds']['maximum_total_requests'] == 2
          assert policy['request_bounds']['maximum_parallel_workers'] == 1
          assert policy['outside_human_dependency'] is False
          assert {row['route_id'] for row in receipts} == {'nc-nonprofits-by-county','nc-unincorporated-nonprofits'}
          assert len({row['candidate_url'] for row in candidates}) == len(candidates)
          for row in observations + candidates:
              assert row['fetch_executed'] is False
              assert row['query_submitted'] is False
              assert row['identity_admitted'] is False
              assert row['relationship_admitted'] is False
              assert row['outside_human_dependency'] is False
              assert row['publication_effect'] == row['adoption_effect'] == row['graph_effect'] == 'none'
          forbidden = {'raw_html','raw_text','raw_script','street_address','mailing_address','postal_code','email','phone','cookie_value','hidden_value'}
          for collection in (observations, candidates, fixed, forms, scripts):
              assert all(not (forbidden & set(row)) for row in collection)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
