name: TEMP census exact NC static nonprofit anchor denominator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-nc-static-nonprofit-anchor-census.yml'
      - '.schoolhouse-nc-static-nonprofit-anchor-census/EXECUTE'
      - '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.*'
  workflow_dispatch:

concurrency:
  group: schoolhouse-nc-static-nonprofit-anchor-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-nc-static-nonprofit-anchor-census-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact acquisition carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify permanent predecessor, exact carrier, and runner custody
        shell: bash
        run: |
          set -Eeuo pipefail
          SAFE_MAIN='327648726320507532751f219a52d03f9c17fac5'
          EXECUTE='.schoolhouse-nc-static-nonprofit-anchor-census/EXECUTE'
          SHARD_DIR='.schoolhouse-nc-static-nonprofit-anchor-census'
          BUNDLE='/tmp/schoolhouse-nc-static-nonprofit-anchor-census.py.gz.b64'
          WORKFLOW='.github/workflows/temp-schoolhouse-nc-static-nonprofit-anchor-census.yml'
          GZIP='/tmp/schoolhouse-nc-static-nonprofit-anchor-census.py.gz'
          RUNNER='/tmp/schoolhouse-nc-static-nonprofit-anchor-census.py'

          git fetch --no-tags origin main "$SAFE_MAIN"
          git merge-base --is-ancestor "$SAFE_MAIN" origin/main
          test "$(git merge-base HEAD origin/main)" = "$SAFE_MAIN"
          test "$(git rev-parse "$SAFE_MAIN:data/intake/bvvc-defense-capital/schoolhouse-nc-static-nonprofit-census-custody.json")" = \
            'b6a9275bc6f29934ba7d83c71a948c9f9559b2bc'
          test "$(git rev-parse "$SAFE_MAIN:data/intake/bvvc-defense-capital/schoolhouse-nc-static-nonprofit-census-route-results.jsonl")" = \
            '1f61c9f6023baf77f9422f6fc20b52e06a7af380'

          mapfile -t CHANGED < <(git diff --name-only "$SAFE_MAIN"..HEAD | sort)
          EXPECTED=(
            '.github/workflows/temp-schoolhouse-nc-static-nonprofit-anchor-census.yml'
            '.schoolhouse-nc-static-nonprofit-anchor-census/EXECUTE'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.00'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.01'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.02'
            '.schoolhouse-nc-static-nonprofit-anchor-census/capture.part.03'
          )
          test "${#CHANGED[@]}" -eq 6
          for i in "${!EXPECTED[@]}"; do test "${CHANGED[$i]}" = "${EXPECTED[$i]}"; done
          git diff --exit-code -- "$WORKFLOW" "$EXECUTE" "$SHARD_DIR/capture.part.00" "$SHARD_DIR/capture.part.01" "$SHARD_DIR/capture.part.02" "$SHARD_DIR/capture.part.03"

          python - "$EXECUTE" <<'PY'
          from pathlib import Path
          import sys
          values = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              if line.strip():
                  key, value = line.split('=', 1)
                  assert key not in values
                  values[key] = value
          expected = {
              'acquire': 'schoolhouse-nc-static-nonprofit-anchor-census-v1',
              'permanent_predecessor_merge': '327648726320507532751f219a52d03f9c17fac5',
              'permanent_predecessor_custody_blob': 'b6a9275bc6f29934ba7d83c71a948c9f9559b2bc',
              'permanent_predecessor_route_results_blob': '1f61c9f6023baf77f9422f6fc20b52e06a7af380',
              'predecessor_product_pr': '1241',
              'predecessor_product_commit': '79a5aa8ec08ec2e4f3190e21660b2cc0f0aa0248',
              'predecessor_product_tree': '506fc79e4fa8cb6f5961cd2e82d259953ed2ab3e',
              'predecessor_acquisition_pr': '1232',
              'predecessor_acquisition_workflow_run_id': '31065319021',
              'predecessor_acquisition_artifact_id': '8953623153',
              'predecessor_acquisition_artifact_digest': 'sha256:f1462cc30b2f34d56ab59d0711d88e4ef4017a8eded51406b511c6cbc84210cc',
              'runner_source_sha256': 'bd7c410e9fae72f0e571021ea948234ac34cb0100c54cc9010dc9f89164ff0e5',
              'runner_gzip_sha256': 'ae7565b24869f6143108c841ac63bbadc9b8bae5c0a4d94b252b16629b2bbd29',
              'runner_bundle_sha256': 'db262d1807c1f44c839281ea8a0415ad96ed96fc216a3a2b3ac5520bf0b0096e',
              'runner_shards': '4',
              'runner_shard_00_sha256': '0015a95fe207550b4284d4a8edb278dd0357c8c8c19df3af709d33ec660a55b6',
              'runner_shard_01_sha256': '41974e89f6edacb74284370558be9971300d1ff42ec6e24aebb7e6cb86c52a5d',
              'runner_shard_02_sha256': '871159864914a3d90accdb112a3875d03120fbb3e1a75bd80bbdde4009a3b676',
              'runner_shard_03_sha256': 'd76b0f4cc10e4cf4cbcc6ee400213e22d9a4c32fcf7d6ce020b59df6fbccd811',
              'fixed_source_routes': '2',
              'prior_anchor_rows': '1552',
              'maximum_total_requests': '2',
              'maximum_response_bytes': '2000000',
              'maximum_aggregate_bytes': '4000000',
              'maximum_parallel_workers': '1',
              'successor_fetches': '0',
              'query_submissions': '0',
              'forms_submitted': '0',
              'cookie_replays': '0',
              'subscription_purchases': '0',
              'identity_admitted': 'false',
              'relationship_admitted': 'false',
              'negative_existence_claim_created': 'false',
              'outside_human_dependency': 'false',
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
          }
          for key, value in expected.items(): assert values.get(key) == value, (key, values.get(key))
          PY

          test "$(sha256sum "$SHARD_DIR/capture.part.00" | awk '{print $1}')" = '0015a95fe207550b4284d4a8edb278dd0357c8c8c19df3af709d33ec660a55b6'
          test "$(sha256sum "$SHARD_DIR/capture.part.01" | awk '{print $1}')" = '41974e89f6edacb74284370558be9971300d1ff42ec6e24aebb7e6cb86c52a5d'
          test "$(sha256sum "$SHARD_DIR/capture.part.02" | awk '{print $1}')" = '871159864914a3d90accdb112a3875d03120fbb3e1a75bd80bbdde4009a3b676'
          test "$(sha256sum "$SHARD_DIR/capture.part.03" | awk '{print $1}')" = 'd76b0f4cc10e4cf4cbcc6ee400213e22d9a4c32fcf7d6ce020b59df6fbccd811'
          cat "$SHARD_DIR"/capture.part.00 "$SHARD_DIR"/capture.part.01 "$SHARD_DIR"/capture.part.02 "$SHARD_DIR"/capture.part.03 > "$BUNDLE"
          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = 'db262d1807c1f44c839281ea8a0415ad96ed96fc216a3a2b3ac5520bf0b0096e'
          base64 -d "$BUNDLE" > "$GZIP"
          test "$(sha256sum "$GZIP" | awk '{print $1}')" = 'ae7565b24869f6143108c841ac63bbadc9b8bae5c0a4d94b252b16629b2bbd29'
          gzip -dc "$GZIP" > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = 'bd7c410e9fae72f0e571021ea948234ac34cb0100c54cc9010dc9f89164ff0e5'
          python -m py_compile "$RUNNER"

      - name: Execute exact two-request complete anchor census
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT='/tmp/schoolhouse-nc-static-nonprofit-anchor-census'
          rm -rf "$OUT"
          python /tmp/schoolhouse-nc-static-nonprofit-anchor-census.py --output "$OUT" \
            2>&1 | tee /tmp/schoolhouse-nc-static-nonprofit-anchor-census.log
          status=${PIPESTATUS[0]}
          mkdir -p "$OUT"
          printf '%s\n' "$status" > "$OUT/RUNNER_EXIT_CODE"
          cp /tmp/schoolhouse-nc-static-nonprofit-anchor-census.log "$OUT/RUNNER-OUTPUT.log"
          exit "$status"

      - name: Upload terminal anchor-census artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-nc-static-nonprofit-anchor-census
          path: /tmp/schoolhouse-nc-static-nonprofit-anchor-census
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Require complete current anchor denominator and zero execution authority
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT='/tmp/schoolhouse-nc-static-nonprofit-anchor-census'
          test -f "$ROOT/RUNNER_EXIT_CODE"
          test "$(cat "$ROOT/RUNNER_EXIT_CODE")" = '0'
          for file in \
            page-receipts.jsonl \
            link-observations.jsonl \
            successor-routes.jsonl \
            fixed-term-observations.jsonl \
            form-observations.jsonl \
            script-route-observations.jsonl \
            route-policy.json \
            summary.json \
            artifact-manifest.json \
            SHA256SUMS; do
            test -f "$ROOT/$file"
          done
          (cd "$ROOT" && sha256sum -c SHA256SUMS)
          python /tmp/schoolhouse-nc-static-nonprofit-anchor-census.py --validate-only "$ROOT"

          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json, sys, urllib.parse
          root = Path(sys.argv[1])
          load = lambda n: json.loads((root / n).read_text())
          rows = lambda n: [json.loads(x) for x in (root / n).read_text().splitlines() if x.strip()]
          s, p, m = map(load, ['summary.json','route-policy.json','artifact-manifest.json'])
          receipts = rows('page-receipts.jsonl')
          observations = rows('link-observations.jsonl')
          candidates = rows('successor-routes.jsonl')
          fixed = rows('fixed-term-observations.jsonl')
          forms = rows('form-observations.jsonl')
          scripts = rows('script-route-observations.jsonl')
          assert s['schema_version'] == 'schoolhouse-nc-static-nonprofit-anchor-census@1'
          assert s['permanent_predecessor_merge'] == '327648726320507532751f219a52d03f9c17fac5'
          assert s['declared_source_routes'] == s['terminal_source_routes'] == len(receipts) == 2
          assert s['source_requests'] == 2
          assert s['aggregate_response_bytes'] <= 4000000
          assert s['current_anchor_rows'] == len(observations)
          assert s['eligible_successor_unique_routes'] == len(candidates)
          assert s['fixed_term_observation_rows'] == len(fixed)
          assert s['form_observation_rows'] == len(forms)
          assert s['script_route_observation_rows'] == len(scripts)
          assert s['successor_fetches_executed'] == 0
          for key in ['query_submissions','forms_submitted','cookie_replays','subscription_purchases','street_address_rows_retained','mailing_address_rows_retained','postal_code_rows_retained','contact_detail_rows_retained','officer_rows_retained','private_support_rows','identities_admitted','relationships_admitted','negative_existence_claims_created']:
              assert s[key] == 0
          assert s['raw_source_retained'] is False
          assert s['full_visible_text_retained'] is False
          assert s['full_script_text_retained'] is False
          assert s['hidden_form_values_retained'] is False
          assert s['outside_human_dependency'] is False
          assert s['publication_effect'] == s['adoption_effect'] == s['graph_effect'] == 'none'
          assert p['selection_contract']['complete_anchor_observation_denominator_required'] is True
          assert p['selection_contract']['no_successor_fetches'] is True
          assert p['request_bounds']['maximum_total_requests'] == 2
          assert p['request_bounds']['maximum_parallel_workers'] == 1
          assert p['interpretation']['query_bearing_report_route_requires_separate_exact_execution'] is True
          assert p['outside_human_dependency'] is False
          route_ids = {'nc-nonprofits-by-county','nc-unincorporated-nonprofits'}
          assert {x['route_id'] for x in receipts} == route_ids
          ordinals = {route_id: [] for route_id in route_ids}
          for x in observations:
              assert x['source_route_id'] in route_ids
              ordinals[x['source_route_id']].append(x['anchor_ordinal'])
              assert x['fetch_executed'] is False and x['query_submitted'] is False
              assert x['identity_admitted'] is False and x['relationship_admitted'] is False
              assert x['outside_human_dependency'] is False
              assert x['publication_effect'] == x['adoption_effect'] == x['graph_effect'] == 'none'
          for receipt in receipts:
              if receipt['state'] == 'accessible_html_anchor_denominator':
                  assert receipt['http_status'] == 200
                  assert receipt['observed_anchor_rows'] > 0
                  assert ordinals[receipt['route_id']] == list(range(1, receipt['observed_anchor_rows'] + 1))
              else:
                  assert ordinals[receipt['route_id']] == []
          seen = set()
          allowed = {'static_data_file','static_document','entity_detail_candidate_route','query_bearing_report_route','report_or_listing_route'}
          for x in candidates:
              assert x['candidate_url'] not in seen; seen.add(x['candidate_url'])
              assert urllib.parse.urlsplit(x['candidate_url']).hostname in {'www.sosnc.gov','sosnc.gov'}
              assert x['route_class'] in allowed
              assert x['fetch_executed'] is False and x['query_submitted'] is False
              assert x['identity_admitted'] is False and x['relationship_admitted'] is False
              assert x['outside_human_dependency'] is False
          for x in fixed:
              assert any(x['fixed_term_matches'].values())
              assert x['identity_admitted'] is False
          for x in forms:
              assert x['hidden_values_retained'] is False
              assert x['form_submitted'] is False
          for x in scripts:
              assert x['fetch_executed'] is False
          assert m['counts']['source_routes'] == 2
          assert m['counts']['anchor_observations'] == len(observations)
          assert m['counts']['successor_routes'] == len(candidates)
          assert m['counts']['source_requests'] == 2
          assert m['counts']['successor_fetches'] == 0
          print(json.dumps(s, indent=2, sort_keys=True))
          PY
