name: Preference custody deliberative-formation control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/deliberative-formation.fixture.json'
      - 'tools/lib/preference-deliberative-formation.mjs'
      - 'tools/compile-preference-deliberative-formation.mjs'
      - 'tools/validate-preference-deliberative-formation.mjs'
      - 'test/preference-deliberative-formation.test.js'
      - 'docs/preference-custody-deliberative-formation.md'
      - '.github/workflows/preference-deliberative-formation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliberative-formation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile deliberative process worlds
        run: node tools/compile-preference-deliberative-formation.mjs
      - name: Validate reason, vote, summary, and authority boundaries
        run: node tools/validate-preference-deliberative-formation.mjs
      - name: Exercise conversion, reciprocity, briefing, conformity, logroll, summary, and tamper fixtures
        run: node test/preference-deliberative-formation.test.js
      - name: Preserve deterministic deliberative-formation projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-deliberative-formation-pc12
          path: |
            build/research/preference-deliberative-formation.json
            build/research/preference-deliberative-formation.md
          if-no-files-found: error
