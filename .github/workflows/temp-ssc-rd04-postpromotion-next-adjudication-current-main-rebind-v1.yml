name: TEMP repair and warehouse RD-04 adjudication predecessor binding v7

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-ssc-rd04-postpromotion-next-adjudication-current-main-rebind-v1.yml

permissions:
  contents: write

jobs:
  warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_PARENT: c108c323d9c254d8e4a6bb4f3089a7fae7975009
      CURRENT_MAIN: bf48e7f424283232bae5060779d2d33e4d85bbcb
      SOURCE_PRODUCT: e6a5e2065839abf9c4538a315aa08884453907b8
      SOURCE_TREE: 40583441335ab70722ce2962987b5639369d8df6
      PRODUCT_BRANCH: agent/ssc-rd04-postpromotion-next-adjudication-product-v1
      CARRIER_BRANCH: agent/ssc-rd04-postpromotion-next-adjudication-current-main-rebind-v1
      CARRIER_PATH: .github/workflows/temp-ssc-rd04-postpromotion-next-adjudication-current-main-rebind-v1.yml
      WAREHOUSE_BRANCH: staging/ssc-rd04-postpromotion-next-adjudication-predecessor-repair-blobs-v1
      WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.yml
      MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication/product-manifest.json
      SCHEMA_PATH: schemas/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.schema.json
      BUILDER_PATH: tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.mjs
      OLD_QUERY_BLOB: d5c445435dd74bea61e7e50887a27a3ffb1edcf1
      CURRENT_QUERY_BLOB: 6e3d9eb55ebcc029151144ce9965754ac4e35e1a
      REPAIRED_WORKFLOW_BLOB: 009a748e8ef4a2ecd5a3b65a064b4cb96a4073ab
      REPAIRED_BUILDER_BLOB: 92350e741520f1c6eee7582e401d165afc746e0f
      REPAIRED_MANIFEST_BLOB: ae6102c44f8e20b7663e52193e9c35b857e0dc98
      REPAIRED_SCHEMA_BLOB: 741ebbde0385822ef6823c547294cee69d468ef3
      WH_WORKFLOW: .tmp/ssc-rd04-postpromotion-next-adjudication-predecessor-repair/workflow.yml
      WH_BUILDER: .tmp/ssc-rd04-postpromotion-next-adjudication-predecessor-repair/builder.mjs
      WH_MANIFEST: .tmp/ssc-rd04-postpromotion-next-adjudication-predecessor-repair/product-manifest.json
      WH_SCHEMA: .tmp/ssc-rd04-postpromotion-next-adjudication-predecessor-repair/schema.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repair, qualify, and warehouse exact product objects
        id: warehouse
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-next-adjudication-predecessor-repair-v7"
          SWT="$RUNNER_TEMP/ssc-rd04-postpromotion-next-adjudication-predecessor-repair-v7-source"
          QWT="$RUNNER_TEMP/ssc-rd04-postpromotion-next-adjudication-predecessor-repair-v7-qualified"
          rm -rf "$OUT" "$SWT" "$QWT"
          mkdir -p "$OUT"
          printf 'initializing\n' > "$OUT/STAGE"
          printf 'source_requests=0\nroute_executions=0\nreviewed_source_admissions=4\npromotion_candidates=4\nheld_open_cells=2\nmatrix_updates=0\nfield_terminalizations=0\nrow_state_mutations=0\nclass_closed=false\ncumulative_ledger_effect=none\noutside_human_dependency=false\npublication_effect=none\nadoption_effect=none\ngraph_effect=none\nproduct_ref_mutations=0\nwarehouse_ref_mutations=1\n' > "$OUT/BOUNDARY"
          exec > >(tee "$OUT/warehouse.log") 2>&1
          finish() {
            rc=$?
            trap - EXIT
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
            exit "$rc"
          }
          trap finish EXIT

          printf 'bind-live-refs\n' > "$OUT/STAGE"
          test "${{ github.event.pull_request.head.ref }}" = "$CARRIER_BRANCH"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CURRENT_MAIN"
          test "$(git rev-list --count "$CURRENT_MAIN"..HEAD)" -eq 1
          test "$(git diff --name-only "$CURRENT_MAIN" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --name-only --diff-filter=A "$CURRENT_MAIN" HEAD)" = "$CARRIER_PATH"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CURRENT_MAIN"
          test "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$SOURCE_PRODUCT"
          test "$(git ls-remote --heads origin "refs/heads/$WAREHOUSE_BRANCH" | awk '{print $1}')" = "$CURRENT_MAIN"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "refs/heads/$WAREHOUSE_BRANCH:refs/remotes/origin/$WAREHOUSE_BRANCH"
          test "$(git rev-parse "$SOURCE_PRODUCT^")" = "$SOURCE_PARENT"
          test "$(git rev-parse "$SOURCE_PRODUCT^{tree}")" = "$SOURCE_TREE"
          git rev-parse "$CURRENT_MAIN^{tree}" > "$OUT/current-main-tree.txt"
          git diff --name-only "$SOURCE_PARENT" "$SOURCE_PRODUCT" | LC_ALL=C sort > "$OUT/product-paths.txt"
          git diff --name-only "$SOURCE_PARENT" "$CURRENT_MAIN" | LC_ALL=C sort > "$OUT/main-delta.txt"
          test "$(wc -l < "$OUT/product-paths.txt")" -eq 13
          comm -12 "$OUT/main-delta.txt" "$OUT/product-paths.txt" > "$OUT/overlap.txt"
          test ! -s "$OUT/overlap.txt"

          printf 'repair-four-parent-sensitive-objects\n' > "$OUT/STAGE"
          git worktree add --detach "$SWT" "$SOURCE_PRODUCT"
          cd "$SWT"
          python - <<'PYREPAIR'
          import hashlib
          import json
          import os
          from pathlib import Path

          old_parent = os.environ['SOURCE_PARENT']
          new_parent = os.environ['CURRENT_MAIN']
          old_query = os.environ['OLD_QUERY_BLOB']
          new_query = os.environ['CURRENT_QUERY_BLOB']
          workflow_path = Path(os.environ['WORKFLOW_PATH'])
          builder_path = Path(os.environ['BUILDER_PATH'])
          manifest_path = Path(os.environ['MANIFEST_PATH'])
          schema_path = Path(os.environ['SCHEMA_PATH'])

          workflow = workflow_path.read_text()
          if workflow.count(old_parent) != 1:
              raise SystemExit(f'workflow parent denominator={workflow.count(old_parent)}')
          if workflow.count(old_query) != 1:
              raise SystemExit(f'workflow predecessor denominator={workflow.count(old_query)}')
          workflow = workflow.replace(old_parent, new_parent, 1).replace(old_query, new_query, 1)
          workflow_path.write_text(workflow)

          builder = builder_path.read_text()
          needle = f'canonical_parent:"{old_parent}",product_branch:'
          if builder.count(needle) != 1:
              raise SystemExit(f'builder parent denominator={builder.count(needle)}')
          builder_path.write_text(builder.replace(needle, f'canonical_parent:"{new_parent}",product_branch:', 1))

          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('canonical_parent') != old_parent:
              raise SystemExit('manifest parent mismatch')
          manifest['canonical_parent'] = new_parent
          counts = {'workflow': 0, 'builder': 0}
          for item in manifest['hashed_files']:
              if item['path'] == os.environ['WORKFLOW_PATH']:
                  item['bytes'] = workflow_path.stat().st_size
                  item['sha256'] = sha(workflow_path)
                  counts['workflow'] += 1
              elif item['path'] == os.environ['BUILDER_PATH']:
                  item['bytes'] = builder_path.stat().st_size
                  item['sha256'] = sha(builder_path)
                  counts['builder'] += 1
          if counts != {'workflow': 1, 'builder': 1}:
              raise SystemExit(f'manifest hash denominator={counts}')
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          schema = json.loads(schema_path.read_text())
          counts = {'manifest': 0, 'workflow': 0, 'builder': 0}
          def walk(value):
              if isinstance(value, dict):
                  const = value.get('const')
                  if isinstance(const, dict) and const.get('object_type') == 'product_manifest':
                      if const.get('canonical_parent') != old_parent:
                          raise SystemExit('schema parent mismatch')
                      const['canonical_parent'] = new_parent
                      counts['manifest'] += 1
                      for item in const['hashed_files']:
                          if item['path'] == os.environ['WORKFLOW_PATH']:
                              item['bytes'] = workflow_path.stat().st_size
                              item['sha256'] = sha(workflow_path)
                              counts['workflow'] += 1
                          elif item['path'] == os.environ['BUILDER_PATH']:
                              item['bytes'] = builder_path.stat().st_size
                              item['sha256'] = sha(builder_path)
                              counts['builder'] += 1
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(schema)
          if counts != {'manifest': 1, 'workflow': 1, 'builder': 1}:
              raise SystemExit(f'schema denominator={counts}')
          schema_path.write_text(json.dumps(schema, indent=2, sort_keys=True) + '\n')
          PYREPAIR
          node "$BUILDER_PATH" --write
          test "$(git hash-object -w "$WORKFLOW_PATH")" = "$REPAIRED_WORKFLOW_BLOB"
          test "$(git hash-object -w "$BUILDER_PATH")" = "$REPAIRED_BUILDER_BLOB"
          test "$(git hash-object -w "$MANIFEST_PATH")" = "$REPAIRED_MANIFEST_BLOB"
          test "$(git hash-object -w "$SCHEMA_PATH")" = "$REPAIRED_SCHEMA_BLOB"
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2' 'jsonschema==4.25.1'
          cat > "$OUT/recursive-schema.py" <<'PYSCHEMA'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path('schemas/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.schema.json').read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          root = Path('data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication')
          names = ['capture-custody.json','source-adjudications.json','field-adjudications.json','promotion-candidate-protocol.json','adjudication-summary.json','index.json','product-manifest.json']
          for name in names:
              errors = sorted(validator.iter_errors(json.loads((root / name).read_text())), key=lambda e: list(e.path))
              if errors:
                  raise SystemExit(f'{name}: {errors[0].message} at {list(errors[0].path)}')
          print(f'recursive_schema_validation=pass objects={len(names)}')
          PYSCHEMA
          python -c "import yaml; yaml.safe_load(open('$WORKFLOW_PATH'))"
          node --check "$BUILDER_PATH"
          node "$BUILDER_PATH"
          python "$OUT/recursive-schema.py"
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js

          printf 'compose-and-qualify-current-main-candidate\n' > "$OUT/STAGE"
          CANDIDATE_INDEX="$OUT/candidate.index"
          rm -f "$CANDIDATE_INDEX"
          GIT_INDEX_FILE="$CANDIDATE_INDEX" git read-tree "$CURRENT_MAIN"
          : > "$OUT/candidate-blob-ledger.tsv"
          while IFS= read -r path; do
            blob="$(git hash-object -w "$path")"
            GIT_INDEX_FILE="$CANDIDATE_INDEX" git update-index --add --cacheinfo "100644,$blob,$path"
            printf '%s\t%s\n' "$path" "$blob" >> "$OUT/candidate-blob-ledger.tsv"
          done < "$OUT/product-paths.txt"
          CANDIDATE_TREE="$(GIT_INDEX_FILE="$CANDIDATE_INDEX" git write-tree)"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2026-08-08T18:00:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          CANDIDATE_COMMIT="$(printf '%s\n' 'Repair RD-04 adjudication predecessor binding on current main' | git commit-tree "$CANDIDATE_TREE" -p "$CURRENT_MAIN")"
          export CANDIDATE_TREE CANDIDATE_COMMIT
          printf '%s\n' "$CANDIDATE_TREE" > "$OUT/candidate-tree.txt"
          printf '%s\n' "$CANDIDATE_COMMIT" > "$OUT/candidate-commit.txt"
          git worktree add --detach "$QWT" "$CANDIDATE_COMMIT"
          cd "$QWT"
          test "$(git rev-parse HEAD^)" = "$CURRENT_MAIN"
          test "$(git rev-list --count "$CURRENT_MAIN"..HEAD)" -eq 1
          test "$(git diff --name-only "$CURRENT_MAIN" HEAD | LC_ALL=C sort | wc -l)" -eq 13
          test "$(git diff --name-only --diff-filter=A "$CURRENT_MAIN" HEAD | LC_ALL=C sort | wc -l)" -eq 13
          test -z "$(git diff --name-only --diff-filter=MD "$CURRENT_MAIN" HEAD)"
          test -z "$(git diff --name-only "$CURRENT_MAIN" HEAD | grep -E '(^|/)(\.tmp|trigger)(/|$)' || true)"
          git diff --check "$CURRENT_MAIN" HEAD
          test "$(git hash-object "$WORKFLOW_PATH")" = "$REPAIRED_WORKFLOW_BLOB"
          test "$(git hash-object "$BUILDER_PATH")" = "$REPAIRED_BUILDER_BLOB"
          test "$(git hash-object "$MANIFEST_PATH")" = "$REPAIRED_MANIFEST_BLOB"
          test "$(git hash-object "$SCHEMA_PATH")" = "$REPAIRED_SCHEMA_BLOB"
          python -c "import yaml; yaml.safe_load(open('$WORKFLOW_PATH'))"
          node "$BUILDER_PATH"
          python "$OUT/recursive-schema.py"
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
          git restore --staged --worktree .
          git clean -fdx
          node "$BUILDER_PATH" --write
          node "$BUILDER_PATH"
          python "$OUT/recursive-schema.py"
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.test.js
          node tools/validate-no-magic-human-gate.mjs
          test "$(git hash-object "$WORKFLOW_PATH")" = "$REPAIRED_WORKFLOW_BLOB"
          test "$(git hash-object "$BUILDER_PATH")" = "$REPAIRED_BUILDER_BLOB"
          test "$(git hash-object "$MANIFEST_PATH")" = "$REPAIRED_MANIFEST_BLOB"
          test "$(git hash-object "$SCHEMA_PATH")" = "$REPAIRED_SCHEMA_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          printf 'publish-four-object-warehouse\n' > "$OUT/STAGE"
          WAREHOUSE_INDEX="$OUT/warehouse.index"
          rm -f "$WAREHOUSE_INDEX"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git read-tree "$CURRENT_MAIN"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REPAIRED_WORKFLOW_BLOB,$WH_WORKFLOW"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REPAIRED_BUILDER_BLOB,$WH_BUILDER"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REPAIRED_MANIFEST_BLOB,$WH_MANIFEST"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REPAIRED_SCHEMA_BLOB,$WH_SCHEMA"
          WAREHOUSE_TREE="$(GIT_INDEX_FILE="$WAREHOUSE_INDEX" git write-tree)"
          export GIT_AUTHOR_DATE='2026-08-08T18:05:00Z'
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          WAREHOUSE_COMMIT="$(printf '%s\n' 'Warehouse exact RD-04 adjudication predecessor-repair blobs' | git commit-tree "$WAREHOUSE_TREE" -p "$CURRENT_MAIN")"
          export WAREHOUSE_TREE WAREHOUSE_COMMIT
          printf '%s\n' "$WAREHOUSE_TREE" > "$OUT/warehouse-tree.txt"
          printf '%s\n' "$WAREHOUSE_COMMIT" > "$OUT/warehouse-commit.txt"
          printf '%s\n' "$WH_WORKFLOW" "$WH_BUILDER" "$WH_MANIFEST" "$WH_SCHEMA" | LC_ALL=C sort > "$OUT/warehouse-paths.txt"
          git diff-tree --no-commit-id --name-only -r "$WAREHOUSE_COMMIT" | LC_ALL=C sort > "$OUT/warehouse-actual-paths.txt"
          diff -u "$OUT/warehouse-paths.txt" "$OUT/warehouse-actual-paths.txt"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CURRENT_MAIN"
          test "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$SOURCE_PRODUCT"
          test "$(git ls-remote --heads origin "refs/heads/$WAREHOUSE_BRANCH" | awk '{print $1}')" = "$CURRENT_MAIN"
          git push origin "$WAREHOUSE_COMMIT:refs/heads/$WAREHOUSE_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$WAREHOUSE_BRANCH" | awk '{print $1}')" = "$WAREHOUSE_COMMIT"
          python - <<'PYRECEIPT'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'ssc-rd04-postpromotion-next-adjudication-predecessor-repair-v7'
          receipt = {
              'schema_version': 'ssc-rd04-postpromotion-next-adjudication-predecessor-repair-receipt@1',
              'source_parent': os.environ['SOURCE_PARENT'],
              'current_main': os.environ['CURRENT_MAIN'],
              'current_main_tree': (out / 'current-main-tree.txt').read_text().strip(),
              'source_product': os.environ['SOURCE_PRODUCT'],
              'source_tree': os.environ['SOURCE_TREE'],
              'candidate_commit': os.environ['CANDIDATE_COMMIT'],
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'warehouse_branch': os.environ['WAREHOUSE_BRANCH'],
              'warehouse_commit': os.environ['WAREHOUSE_COMMIT'],
              'warehouse_tree': os.environ['WAREHOUSE_TREE'],
              'permanent_path_count': 13,
              'addition_only': True,
              'main_delta_overlap': 0,
              'stale_predecessor_blob': os.environ['OLD_QUERY_BLOB'],
              'canonical_predecessor_blob': os.environ['CURRENT_QUERY_BLOB'],
              'repaired_blobs': {
                  'workflow': os.environ['REPAIRED_WORKFLOW_BLOB'],
                  'builder': os.environ['REPAIRED_BUILDER_BLOB'],
                  'manifest': os.environ['REPAIRED_MANIFEST_BLOB'],
                  'schema': os.environ['REPAIRED_SCHEMA_BLOB']
              },
              'warehouse_path_count': 4,
              'warehouse_only': True,
              'product_ref_mutations': 0,
              'warehouse_ref_mutations': 1,
              'reviewed_source_admissions': 4,
              'promotion_candidates': 4,
              'held_open_cells': 2,
              'matrix_updates': 0,
              'field_terminalizations': 0,
              'row_state_mutations': 0,
              'class_closed': False,
              'cumulative_ledger_effect': 'none',
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none'
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PYRECEIPT
          printf 'complete\n' > "$OUT/STAGE"
      - name: Upload predecessor-repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-next-adjudication-predecessor-repair-v7
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-next-adjudication-predecessor-repair-v7
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
      - name: Enforce predecessor-repair result
        if: always()
        run: test '${{ steps.warehouse.outcome }}' = success
