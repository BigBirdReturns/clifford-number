name: TEMP transport qualified RD-04 adjudication blobs v5

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-ssc-rd04-postpromotion-next-adjudication-current-main-rebind-v1.yml

permissions:
  contents: write

jobs:
  warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRIOR_PARENT: 91b386df809079884825b19a6b5d864b6e739172
      CURRENT_MAIN: c108c323d9c254d8e4a6bb4f3089a7fae7975009
      CURRENT_MAIN_TREE: 4f45286d92bc5ef7b533d13cdc134bdb8729259b
      SOURCE_PRODUCT: 0e79772a84e99bce1a1ca9e78209c9ae5b55637a
      SOURCE_TREE: f3031844264107b0b329e7dd9af175eea8dd2456
      QUALIFIED_TREE: 40583441335ab70722ce2962987b5639369d8df6
      PRODUCT_BRANCH: agent/ssc-rd04-postpromotion-next-adjudication-product-v1
      CARRIER_BRANCH: agent/ssc-rd04-postpromotion-next-adjudication-current-main-rebind-v1
      CARRIER_PATH: .github/workflows/temp-ssc-rd04-postpromotion-next-adjudication-current-main-rebind-v1.yml
      WAREHOUSE_BRANCH: staging/ssc-rd04-postpromotion-next-adjudication-blob-warehouse-v1
      WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.yml
      MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication/product-manifest.json
      SCHEMA_PATH: schemas/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.schema.json
      BUILDER_PATH: tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.mjs
      REBOUND_WORKFLOW_BLOB: 16e02da43ed39af80589a9bdc1f31a698a007235
      REBOUND_BUILDER_BLOB: 32e2bb7bdf7abd694792adfe2f355fa9dfb611fb
      REBOUND_MANIFEST_BLOB: 9e7da9145f3869adf2d8f9d9218a994cf0127e43
      REBOUND_SCHEMA_BLOB: e9bc3a996c70e7f48872f647e126a8c49c8c2d68
      WH_WORKFLOW: .tmp/ssc-rd04-postpromotion-next-adjudication-blob-warehouse/workflow.yml
      WH_BUILDER: .tmp/ssc-rd04-postpromotion-next-adjudication-blob-warehouse/builder.mjs
      WH_MANIFEST: .tmp/ssc-rd04-postpromotion-next-adjudication-blob-warehouse/product-manifest.json
      WH_SCHEMA: .tmp/ssc-rd04-postpromotion-next-adjudication-blob-warehouse/schema.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize exact qualified blobs and warehouse them
        id: warehouse
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-next-adjudication-blob-warehouse-v5"
          WT="$RUNNER_TEMP/ssc-rd04-postpromotion-next-adjudication-blob-warehouse-v5-wt"
          rm -rf "$OUT" "$WT"; mkdir -p "$OUT"
          printf 'initializing\n' >"$OUT/STAGE"
          printf 'source_requests=0\nroute_executions=0\nreviewed_source_admissions=4\npromotion_candidates=4\nheld_open_cells=2\nmatrix_updates=0\nfield_terminalizations=0\nrow_state_mutations=0\nclass_closed=false\ncumulative_ledger_effect=none\noutside_human_dependency=false\npublication_effect=none\nadoption_effect=none\ngraph_effect=none\nproduct_ref_mutations=0\nwarehouse_ref_mutations=1\n' >"$OUT/BOUNDARY"
          exec > >(tee "$OUT/warehouse.log") 2>&1
          finish(){ rc=$?; trap - EXIT; printf '%s\n' "$rc" >"$OUT/EXIT_CODE"; (cd "$OUT"; find . -type f ! -name SHA256SUMS -print0|sort -z|xargs -0 sha256sum >SHA256SUMS); exit "$rc"; }
          trap finish EXIT

          printf 'bind-live-refs\n' >"$OUT/STAGE"
          test "${{ github.event.pull_request.head.ref }}" = "$CARRIER_BRANCH"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CURRENT_MAIN"
          test "$(git rev-list --count "$CURRENT_MAIN"..HEAD)" -eq 1
          test "$(git diff --name-only "$CURRENT_MAIN" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --name-only --diff-filter=A "$CURRENT_MAIN" HEAD)" = "$CARRIER_PATH"
          test "$(git ls-remote --heads origin refs/heads/main|awk '{print $1}')" = "$CURRENT_MAIN"
          test "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH"|awk '{print $1}')" = "$SOURCE_PRODUCT"
          test "$(git ls-remote --heads origin "refs/heads/$WAREHOUSE_BRANCH"|awk '{print $1}')" = "$CURRENT_MAIN"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "refs/heads/$WAREHOUSE_BRANCH:refs/remotes/origin/$WAREHOUSE_BRANCH"
          test "$(git rev-parse "$CURRENT_MAIN^{tree}")" = "$CURRENT_MAIN_TREE"
          test "$(git rev-parse "$SOURCE_PRODUCT^")" = "$PRIOR_PARENT"
          test "$(git rev-parse "$SOURCE_PRODUCT^{tree}")" = "$SOURCE_TREE"
          git diff --name-only "$PRIOR_PARENT" "$CURRENT_MAIN"|sort >"$OUT/main-delta.txt"
          git diff --name-only "$PRIOR_PARENT" "$SOURCE_PRODUCT"|sort >"$OUT/product-paths.txt"
          test "$(wc -l <"$OUT/product-paths.txt")" -eq 13
          comm -12 "$OUT/main-delta.txt" "$OUT/product-paths.txt" >"$OUT/overlap.txt"
          test ! -s "$OUT/overlap.txt"

          printf 'reconstruct-qualified-blobs\n' >"$OUT/STAGE"
          git worktree add --detach "$WT" "$SOURCE_PRODUCT"
          cd "$WT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          old=os.environ['PRIOR_PARENT']; new=os.environ['CURRENT_MAIN']
          wf=Path(os.environ['WORKFLOW_PATH']); lines=wf.read_text().splitlines(); out=[]; n=0; i=0
          while i<len(lines):
              if i+1<len(lines) and lines[i]=="          printf '%s" and lines[i+1]=="' \"$PRODUCT_PARENT\" >\"$OUT/product-parent.txt\"":
                  out.append("          printf '%s\\n' \"$PRODUCT_PARENT\" >\"$OUT/product-parent.txt\""); n+=1; i+=2
              else: out.append(lines[i]); i+=1
          if n!=1: raise SystemExit(f'workflow repair denominator={n}')
          text='\n'.join(out)+'\n'
          line=f'      PRODUCT_PARENT: {old}'
          if text.count(line)!=1: raise SystemExit('workflow parent denominator')
          text=text.replace(line,f'      PRODUCT_PARENT: {new}',1)
          anchor='          git fetch origin "$PRODUCT_PARENT" --depth=256\n'
          lease='          test "$(git ls-remote --heads origin refs/heads/main | awk \'{print $1}\')" = "$PRODUCT_PARENT"\n'
          if text.count(anchor)!=1: raise SystemExit('opening lease denominator')
          text=text.replace(anchor,lease+anchor,1)
          anchor2='      - name: Preserve exact-head qualification\n'
          step="      - name: Reconfirm live canonical parent\n        if: github.event_name == 'pull_request'\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          test \"$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')\" = \"$PRODUCT_PARENT\"\n"
          if text.count(anchor2)!=1: raise SystemExit('closing lease denominator')
          wf.write_text(text.replace(anchor2,step+anchor2,1))
          builder=Path(os.environ['BUILDER_PATH']); b=builder.read_text(); needle=f'canonical_parent:"{old}",product_branch:'
          if b.count(needle)!=1: raise SystemExit('builder parent denominator')
          builder.write_text(b.replace(needle,f'canonical_parent:"{new}",product_branch:',1))
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          schema_path=Path(os.environ['SCHEMA_PATH']); schema=json.loads(schema_path.read_text()); c={'m':0,'w':0,'b':0}
          def walk(v):
              if isinstance(v,dict):
                  x=v.get('const')
                  if isinstance(x,dict) and x.get('object_type')=='product_manifest':
                      if x.get('canonical_parent')!=old: raise SystemExit('schema parent mismatch')
                      x['canonical_parent']=new; c['m']+=1
                      for item in x.get('hashed_files',[]):
                          if item.get('path')==os.environ['WORKFLOW_PATH']:
                              item['bytes']=wf.stat().st_size; item['sha256']=sha(wf); c['w']+=1
                          if item.get('path')==os.environ['BUILDER_PATH']:
                              item['bytes']=builder.stat().st_size; item['sha256']=sha(builder); c['b']+=1
                  for z in v.values(): walk(z)
              elif isinstance(v,list):
                  for z in v: walk(z)
          walk(schema)
          if c!={'m':1,'w':1,'b':1}: raise SystemExit(f'schema denominator={c}')
          schema_path.write_text(json.dumps(schema,indent=2,sort_keys=True)+'\n')
          PY
          node "$BUILDER_PATH" --write
          test "$(git hash-object -w "$WORKFLOW_PATH")" = "$REBOUND_WORKFLOW_BLOB"
          test "$(git hash-object -w "$BUILDER_PATH")" = "$REBOUND_BUILDER_BLOB"
          test "$(git hash-object -w "$MANIFEST_PATH")" = "$REBOUND_MANIFEST_BLOB"
          test "$(git hash-object -w "$SCHEMA_PATH")" = "$REBOUND_SCHEMA_BLOB"
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2' 'jsonschema==4.25.1'
          python -c "import yaml; yaml.safe_load(open('$WORKFLOW_PATH'))"
          node "$BUILDER_PATH"
          python - <<'PYSCHEMA'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('schemas/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.schema.json').read_text())
          Draft202012Validator.check_schema(schema); validator=Draft202012Validator(schema)
          root=Path('data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication')
          names=['capture-custody.json','source-adjudications.json','field-adjudications.json','promotion-candidate-protocol.json','adjudication-summary.json','index.json','product-manifest.json']
          for name in names:
              errors=sorted(validator.iter_errors(json.loads((root/name).read_text())),key=lambda e:list(e.path))
              if errors: raise SystemExit(f'{name}: {errors[0].message} at {list(errors[0].path)}')
          print(f'recursive_schema_validation=pass objects={len(names)}')
          PYSCHEMA
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-postpromotion-next-adjudication.test.js
          node tools/validate-no-magic-human-gate.mjs

          printf 'reproduce-qualified-tree\n' >"$OUT/STAGE"
          CANDIDATE_INDEX="$OUT/candidate.index"; rm -f "$CANDIDATE_INDEX"
          GIT_INDEX_FILE="$CANDIDATE_INDEX" git read-tree "$CURRENT_MAIN"
          : >"$OUT/candidate-blob-ledger.tsv"
          while IFS= read -r p; do
            blob="$(git hash-object -w "$p")"
            GIT_INDEX_FILE="$CANDIDATE_INDEX" git update-index --add --cacheinfo "100644,$blob,$p"
            printf '%s\t%s\n' "$p" "$blob" >>"$OUT/candidate-blob-ledger.tsv"
          done <"$OUT/product-paths.txt"
          CANDIDATE_TREE="$(GIT_INDEX_FILE="$CANDIDATE_INDEX" git write-tree)"
          test "$CANDIDATE_TREE" = "$QUALIFIED_TREE"
          printf '%s\n' "$CANDIDATE_TREE" >"$OUT/candidate-tree.txt"

          printf 'publish-safe-blob-warehouse\n' >"$OUT/STAGE"
          WAREHOUSE_INDEX="$OUT/warehouse.index"; rm -f "$WAREHOUSE_INDEX"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git read-tree "$CURRENT_MAIN"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REBOUND_WORKFLOW_BLOB,$WH_WORKFLOW"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REBOUND_BUILDER_BLOB,$WH_BUILDER"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REBOUND_MANIFEST_BLOB,$WH_MANIFEST"
          GIT_INDEX_FILE="$WAREHOUSE_INDEX" git update-index --add --cacheinfo "100644,$REBOUND_SCHEMA_BLOB,$WH_SCHEMA"
          WAREHOUSE_TREE="$(GIT_INDEX_FILE="$WAREHOUSE_INDEX" git write-tree)"
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='2026-08-08T16:00:00Z' GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          WAREHOUSE_COMMIT="$(printf '%s\n' 'Warehouse exact RD-04 adjudication blobs for connector assembly' | git commit-tree "$WAREHOUSE_TREE" -p "$CURRENT_MAIN")"
          export WAREHOUSE_TREE WAREHOUSE_COMMIT CANDIDATE_TREE
          printf '%s\n' "$WAREHOUSE_TREE" >"$OUT/warehouse-tree.txt"
          printf '%s\n' "$WAREHOUSE_COMMIT" >"$OUT/warehouse-commit.txt"
          printf '%s\n' "$WH_WORKFLOW" "$WH_BUILDER" "$WH_MANIFEST" "$WH_SCHEMA" | sort >"$OUT/warehouse-paths.txt"
          git diff-tree --no-commit-id --name-only -r "$WAREHOUSE_COMMIT" | sort >"$OUT/warehouse-actual-paths.txt"
          diff -u "$OUT/warehouse-paths.txt" "$OUT/warehouse-actual-paths.txt"
          test "$(git ls-remote --heads origin refs/heads/main|awk '{print $1}')" = "$CURRENT_MAIN"
          test "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH"|awk '{print $1}')" = "$SOURCE_PRODUCT"
          test "$(git ls-remote --heads origin "refs/heads/$WAREHOUSE_BRANCH"|awk '{print $1}')" = "$CURRENT_MAIN"
          git push origin "$WAREHOUSE_COMMIT:refs/heads/$WAREHOUSE_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$WAREHOUSE_BRANCH"|awk '{print $1}')" = "$WAREHOUSE_COMMIT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'ssc-rd04-postpromotion-next-adjudication-blob-warehouse-v5'
          receipt={
            'schema_version':'ssc-rd04-postpromotion-next-adjudication-blob-warehouse-receipt@1',
            'current_main':os.environ['CURRENT_MAIN'],
            'current_main_tree':os.environ['CURRENT_MAIN_TREE'],
            'source_product':os.environ['SOURCE_PRODUCT'],
            'qualified_candidate_tree':os.environ['CANDIDATE_TREE'],
            'warehouse_branch':os.environ['WAREHOUSE_BRANCH'],
            'warehouse_commit':os.environ['WAREHOUSE_COMMIT'],
            'warehouse_tree':os.environ['WAREHOUSE_TREE'],
            'warehouse_path_count':4,
            'warehouse_only':True,
            'product_ref_mutations':0,
            'warehouse_ref_mutations':1,
            'rebound_blobs':{
              'workflow':os.environ['REBOUND_WORKFLOW_BLOB'],
              'builder':os.environ['REBOUND_BUILDER_BLOB'],
              'manifest':os.environ['REBOUND_MANIFEST_BLOB'],
              'schema':os.environ['REBOUND_SCHEMA_BLOB']},
            'reviewed_source_admissions':4,'promotion_candidates':4,'held_open_cells':2,
            'matrix_updates':0,'field_terminalizations':0,'row_state_mutations':0,
            'class_closed':False,'cumulative_ledger_effect':'none','outside_human_dependency':False,
            'publication_effect':'none','adoption_effect':'none','graph_effect':'none'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          printf 'complete\n' >"$OUT/STAGE"
      - name: Upload warehouse receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-next-adjudication-blob-warehouse-v5
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-next-adjudication-blob-warehouse-v5
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
      - name: Enforce warehouse result
        if: always()
        run: test '${{ steps.warehouse.outcome }}' = success
