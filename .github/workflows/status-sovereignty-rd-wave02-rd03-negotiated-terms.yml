name: SSC RD-03 Wave 02 terminal negotiated terms

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd03-negotiated-terms.yml'
      - 'data/intake/status-sovereignty-rd03-osc-instrument-lifecycle.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-03-C04.json'
      - 'data/project/ssc-residual-wave02/closures/RD-03-C04.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'schemas/status-sovereignty-rd-wave02-rd03-negotiated-terms.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs'
      - 'test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd03-negotiated-terms.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd03-negotiated-terms.yml'
      - 'data/intake/status-sovereignty-rd03-osc-instrument-lifecycle.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-03-C04.json'
      - 'data/project/ssc-residual-wave02/closures/RD-03-C04.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'schemas/status-sovereignty-rd-wave02-rd03-negotiated-terms.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs'
      - 'test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd03-negotiated-terms.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ssc-rd03-wave02-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove exact terminal RD-03 product
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          node test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore volatile outputs and replay
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          node tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs
          node test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve terminal product
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-wave02-terminal-negotiated-terms
          path: |
            data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/public-record-census-execution-receipt.json
            data/project/ssc-residual-wave02/closures/RD-03-C04.json
            data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms
            schemas/status-sovereignty-rd-wave02-rd03-negotiated-terms.schema.json
            docs/milestones/ssc-rd-wave02-rd03-negotiated-terms.md
          if-no-files-found: error
          retention-days: 90
