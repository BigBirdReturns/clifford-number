name: TEMP materialize RD-04 State Options exemption promotion v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-ssc-rd04-state-options-exemption-materializer-v1.yml'
      - '.transport/ssc-rd04-state-options-exemption-v1/shards/**'

permissions:
  contents: write

concurrency:
  group: temp-ssc-rd04-state-options-exemption-materializer-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-state-options-exemption-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARRIER_ROOT: .transport/ssc-rd04-state-options-exemption-v1/shards
      PRODUCT_BRANCH: agent/ssc-rd04-state-options-exemption-promotion-v1
      PRODUCT_LEASE: e46d4aa98955e890a1bd2820dc43c52bc256490e
      CANONICAL_BASE: e46d4aa98955e890a1bd2820dc43c52bc256490e
      PERMANENT_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd04-state-options-exemption-promotion.yml
      BASE64_BYTES: '35180'
      BASE64_SHA256: 4059f1dcd17b225da24562e2cdeb5f93f7e44fe6aad964647574a44005ef0ace
      ARCHIVE_BYTES: '26384'
      ARCHIVE_SHA256: 97886246a6d8742b2da4a25797324b107368d0a3ececa2a215a0ca0862d74595
      PATHS_SHA256: 8717e0baadd372702e28bf63d165e4737625c3a92f46945e6ba2ebd929450192
      V1_WORKFLOW: .github/workflows/temp-ssc-rd04-state-options-exemption-materializer-v1.yml
      SEALED_V1_COMMIT: dcf5dbed25a2b0b4e617d23d3584df2ce1d1666b
      SEALED_V1_BLOB: 252c05a486329be56c034812f9009f478b15623a
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - name: Recover, patch, and execute the sealed v1 transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          WRAPPER_RECEIPT="$RUNNER_TEMP/ssc-rd04-state-options-exemption-wrapper-v1"
          SEALED="$WRAPPER_RECEIPT/sealed-v1.yml"
          SCRIPT="$WRAPPER_RECEIPT/repaired-v1.sh"
          rm -rf "$WRAPPER_RECEIPT"
          mkdir -p "$WRAPPER_RECEIPT"
          exec > >(tee "$WRAPPER_RECEIPT/execution.log") 2>&1
          STAGE=init
          finish() {
            rc=$?
            printf 'status=%s\nstage=%s\nexit_code=%s\nutc=%s\n' \
              "$([[ $rc -eq 0 ]] && echo complete || echo failed_closed)" \
              "$STAGE" "$rc" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$WRAPPER_RECEIPT/checkpoint.txt"
            exit "$rc"
          }
          trap finish EXIT

          STAGE=recover-sealed-v1
          git cat-file -e "$SEALED_V1_COMMIT^{commit}"
          git show "$SEALED_V1_COMMIT:$V1_WORKFLOW" > "$SEALED"
          test "$(git hash-object "$SEALED")" = "$SEALED_V1_BLOB"

          STAGE=derive-repaired-script
          python - "$SEALED" "$SCRIPT" "$WRAPPER_RECEIPT/derivation.json" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          source_path = Path(sys.argv[1])
          output = Path(sys.argv[2])
          receipt = Path(sys.argv[3])
          source = source_path.read_text()
          step_marker = '      - name: Reconstruct, qualify, and publish transport-safe product\n'
          next_marker = '      - name: Preserve exact materialization receipt\n'
          if source.count(step_marker) != 1 or source.count(next_marker) != 1:
              raise SystemExit('sealed v1 step denominator changed')
          block = source.split(step_marker, 1)[1].split(next_marker, 1)[0]
          run_marker = '        run: |\n'
          if block.count(run_marker) != 1:
              raise SystemExit('sealed v1 run-block denominator changed')
          lines = block.split(run_marker, 1)[1].splitlines()
          script_lines = []
          for line in lines:
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line == '':
                  script_lines.append('')
              else:
                  raise SystemExit(f'unexpected sealed-v1 indentation: {line!r}')
          script = '\n'.join(script_lines) + '\n'
          old = 'cmp "$RECEIPT/expected-paths.txt" "$RECEIPT/archive-paths.txt"'
          new = 'sort "$RECEIPT/expected-paths.txt" > "$RECEIPT/expected-paths-sorted.txt"\ncmp "$RECEIPT/expected-paths-sorted.txt" "$RECEIPT/archive-paths.txt"'
          matches = script.count(old)
          if matches != 1:
              raise SystemExit(f'expected one path-list seam, found {matches}')
          repaired = script.replace(old, new, 1)
          if repaired.count('expected-paths-sorted.txt') != 2:
              raise SystemExit('repaired seam count changed')
          payload = ('#!/usr/bin/env bash\n' + repaired).encode()
          output.write_bytes(payload)
          output.chmod(0o700)
          receipt.write_text(json.dumps({
              'schema_version': 'ssc-rd04-state-options-exemption-wrapper-derivation@1',
              'sealed_workflow_blob': '252c05a486329be56c034812f9009f478b15623a',
              'sealed_workflow_sha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
              'replacement_count': matches,
              'repaired_script_bytes': len(payload),
              'repaired_script_sha256': hashlib.sha256(payload).hexdigest(),
          }, indent=2) + '\n')
          PY
          bash -n "$SCRIPT"
          test "$(grep -Fc 'sort "$RECEIPT/expected-paths.txt" > "$RECEIPT/expected-paths-sorted.txt"' "$SCRIPT")" = 1
          test "$(grep -Fc 'cmp "$RECEIPT/expected-paths-sorted.txt" "$RECEIPT/archive-paths.txt"' "$SCRIPT")" = 1

          STAGE=execute-sealed-transaction
          "$SCRIPT"
          STAGE=complete
      - name: Preserve exact wrapper and materialization receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-state-options-exemption-materializer-v1-repaired
          path: |
            ${{ runner.temp }}/ssc-rd04-state-options-exemption-wrapper-v1
            ${{ runner.temp }}/ssc-rd04-state-options-exemption-materializer-v1/receipt
          if-no-files-found: error
          retention-days: 90
