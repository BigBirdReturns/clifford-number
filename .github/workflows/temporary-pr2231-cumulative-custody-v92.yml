name: Temporary PR 2231 cumulative custody diagnostic v92

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-cumulative-custody-v92.py.gz.b64'
      - '.github/workflows/temporary-pr2231-cumulative-custody-v92.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr2231-cumulative-custody-diagnostic-v92
  cancel-in-progress: false

jobs:
  qualify-read-only:
    if: >-
      github.repository == 'BigBirdReturns/clifford-number' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'agent/pr2231-cumulative-custody-controller-v92'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_MAIN: 0e57325d62cff371e6f138d4f01086b96dd202b5
      EXPECTED_PRODUCT: ec210a32b888f3717027ce8d236ac6d14fcf1c82
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      ARTIFACT_DIR: /tmp/pr2231-v92-diagnostic-artifact

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Freeze leases and materialize the exact product
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$EXPECTED_PRODUCT"
          rm -rf /tmp/pr2231-v92-product
          git worktree add --detach /tmp/pr2231-v92-product "$EXPECTED_PRODUCT"

      - name: Reproduce all four exact-head defects before mutation
        shell: bash
        working-directory: /tmp/pr2231-v92-product
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          assert.equal(
            redactContactData('Archive 09012345678 3.14-03-6216-8041'),
            'Archive [contact omitted] 3.14-03-6216-8041'
          );
          assert.equal(
            redactContactData('Archive 09012345678 12:30:45-1 212 555 1234'),
            'Archive [contact omitted] 12:30:45-1 [contact omitted]'
          );
          const overflow = `Archive ${'ID '.repeat(6000)}09012345678`;
          assert.equal(
            redactContactData(overflow),
            `Archive ${'ID '.repeat(6000)}[contact omitted]`
          );

          const observations = '1.1 '.repeat(1600);
          const performanceInput = `Phone: 09012345678 ${observations}12:30 555-1212`;
          const started = Date.now();
          redactContactData(performanceInput);
          console.log(`PREDECESSOR_1600_OBSERVATION_MS=${Date.now() - started}`);
          console.log('PREDECESSOR_REPRODUCTION_SUCCESS');
          NODE

      - name: Apply the exact cumulative two-file repair
        shell: bash
        working-directory: /tmp/pr2231-v92-product
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v92.py.gz.b64" | gzip -dc > /tmp/pr2231-v92-apply.py
          printf '%s  %s\n' 'c5167a8800ea2616881d68feea54c72ce7ae6941a474b4d8d5e37cb88d1dc33c' /tmp/pr2231-v92-apply.py | sha256sum -c -
          python /tmp/pr2231-v92-apply.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'test/industrial-exhaust.test.js'
          test "${changed[1]}" = 'tools/lib/industrial-exhaust.mjs'
          node --check tools/lib/industrial-exhaust.mjs

      - name: Install exact repository dependencies
        shell: bash
        working-directory: /tmp/pr2231-v92-product
        run: npm ci

      - name: Run cumulative focused and repository-wide qualification
        shell: bash
        working-directory: /tmp/pr2231-v92-product
        run: |
          set -euo pipefail
          for test_file in test/industrial-exhaust*.test.js; do
            node "$test_file"
          done
          npm run release:check

      - name: Restore generated state and bind exact product bytes
        shell: bash
        working-directory: /tmp/pr2231-v92-product
        run: |
          set -euo pipefail
          while IFS= read -r changed_path; do
            case "$changed_path" in
              tools/lib/industrial-exhaust.mjs|test/industrial-exhaust.test.js) ;;
              *) git restore -- "$changed_path" ;;
            esac
          done < <(git diff --name-only)
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'test/industrial-exhaust.test.js'
          test "${changed[1]}" = 'tools/lib/industrial-exhaust.mjs'

          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' "$EXPECTED_MAIN" > "$ARTIFACT_DIR/main.sha"
          printf '%s\n' "$EXPECTED_PRODUCT" > "$ARTIFACT_DIR/product-predecessor.sha"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > "$ARTIFACT_DIR/controller.sha"
          git diff --binary > "$ARTIFACT_DIR/product.patch"
          git diff --stat > "$ARTIFACT_DIR/product.diffstat"
          git hash-object tools/lib/industrial-exhaust.mjs > "$ARTIFACT_DIR/library.blob"
          git hash-object test/industrial-exhaust.test.js > "$ARTIFACT_DIR/focused-test.blob"
          sha256sum \
            tools/lib/industrial-exhaust.mjs \
            test/industrial-exhaust.test.js \
            "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v92.py.gz.b64" \
            > "$ARTIFACT_DIR/sha256.txt"
          printf '%s\n' QUALIFICATION_SUCCESS > "$ARTIFACT_DIR/result.txt"

      - name: Upload retained diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-cumulative-custody-v92-diagnostic
          path: /tmp/pr2231-v92-diagnostic-artifact
          if-no-files-found: error
          retention-days: 90
