name: Temporary PR 2231 cumulative custody diagnostic v93 failure census

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-cumulative-custody-v92.py.gz.b64'
      - '.github/tmp/pr2231-cumulative-custody-v92-r2.py.gz.b64'
      - '.github/tmp/pr2231-cumulative-custody-v93.py.gz.b64'
      - '.github/workflows/temporary-pr2231-cumulative-custody-v92.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr2231-cumulative-custody-diagnostic-v93
  cancel-in-progress: false

jobs:
  qualify-read-only:
    if: >-
      github.repository == 'BigBirdReturns/clifford-number' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'agent/pr2231-cumulative-custody-controller-v92'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_MAIN: 0e57325d62cff371e6f138d4f01086b96dd202b5
      EXPECTED_PRODUCT: ec210a32b888f3717027ce8d236ac6d14fcf1c82
      EXPECTED_V92_LIBRARY_BLOB: 6655e9aa10ac2964e5f6289a4881f1343265fa0e
      EXPECTED_V92_FOCUSED_TEST_BLOB: 7f72ca8c2eb7f436471453c74b98e1227b0970d5
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      ARTIFACT_DIR: /tmp/pr2231-v93-diagnostic-artifact

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Freeze leases and materialize the exact product
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$EXPECTED_PRODUCT"
          rm -rf /tmp/pr2231-v93-product
          git worktree add --detach /tmp/pr2231-v93-product "$EXPECTED_PRODUCT"

      - name: Reproduce all four exact-head defects before V92 mutation
        shell: bash
        working-directory: /tmp/pr2231-v93-product
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          assert.equal(
            redactContactData('Archive 09012345678 3.14-03-6216-8041'),
            'Archive [contact omitted] 3.14-03-6216-8041'
          );
          assert.equal(
            redactContactData('Archive 09012345678 12:30:45-1 212 555 1234'),
            'Archive [contact omitted] 12:30:45-1 [contact omitted]'
          );
          const overflow = `Archive ${'ID '.repeat(6000)}09012345678`;
          assert.equal(
            redactContactData(overflow),
            `Archive ${'ID '.repeat(6000)}[contact omitted]`
          );

          const observations = '1.1 '.repeat(1600);
          const performanceInput = `Phone: 09012345678 ${observations}12:30 555-1212`;
          const started = Date.now();
          redactContactData(performanceInput);
          console.log(`PREDECESSOR_1600_OBSERVATION_MS=${Date.now() - started}`);
          console.log('PREDECESSOR_REPRODUCTION_SUCCESS');
          NODE

      - name: Apply and bind the exact V92 cumulative repair
        shell: bash
        working-directory: /tmp/pr2231-v93-product
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v92.py.gz.b64" | gzip -dc > /tmp/pr2231-v92-apply.py
          printf '%s  %s\n' 'c5167a8800ea2616881d68feea54c72ce7ae6941a474b4d8d5e37cb88d1dc33c' /tmp/pr2231-v92-apply.py | sha256sum -c -
          python /tmp/pr2231-v92-apply.py
          base64 -d "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v92-r2.py.gz.b64" | gzip -dc > /tmp/pr2231-v92-r2.py
          printf '%s  %s\n' 'b568c5a92ffb3bde822eb018facba48da90691ba9d9ea9629b6b8afc9e4f9da4' /tmp/pr2231-v92-r2.py | sha256sum -c -
          python /tmp/pr2231-v92-r2.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'test/industrial-exhaust.test.js'
          test "${changed[1]}" = 'tools/lib/industrial-exhaust.mjs'
          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "$EXPECTED_V92_LIBRARY_BLOB"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "$EXPECTED_V92_FOCUSED_TEST_BLOB"
          node --check tools/lib/industrial-exhaust.mjs

      - name: Reproduce the V92 complete-provenance no-label defect
        shell: bash
        working-directory: /tmp/pr2231-v93-product
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          const prefix = 'identifier '.repeat(2000);
          const input = `Archive ${prefix}09012345678`;
          const actual = redactContactData(input);
          assert.equal(actual, `Archive ${prefix}[contact omitted]`);
          console.log('V92_COMPLETE_PROVENANCE_NO_LABEL_REPRODUCTION_SUCCESS');
          NODE

      - name: Apply the bounded no-label provenance V93 overlay
        shell: bash
        working-directory: /tmp/pr2231-v93-product
        run: |
          set -euo pipefail
          printf '%s  %s\n' '66f31083fad82c64ffb85882f2e624522ca62b98c1df770efcbc6525a1d7e17b' "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v93.py.gz.b64" | sha256sum -c -
          base64 -d "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v93.py.gz.b64" | gzip -dc > /tmp/pr2231-v93.py
          printf '%s  %s\n' 'c08607259988f56ee89d02bd321a1fdd04de9cf04e5b067146c474d275efe50e' /tmp/pr2231-v93.py | sha256sum -c -
          python /tmp/pr2231-v93.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'test/industrial-exhaust.test.js'
          test "${changed[1]}" = 'tools/lib/industrial-exhaust.mjs'
          node --check tools/lib/industrial-exhaust.mjs

      - name: Prove the V93 repair before full qualification
        shell: bash
        working-directory: /tmp/pr2231-v93-product
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          const input = `Archive ${'identifier '.repeat(2000)}09012345678`;
          assert.equal(redactContactData(input), input);
          console.log('V93_COMPLETE_PROVENANCE_NO_LABEL_REPAIR_SUCCESS');
          NODE

      - name: Run cumulative qualification with retained first-failure census
        shell: bash
        working-directory: /tmp/pr2231-v93-product
        run: |
          set -uo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/logs"
          printf '%s\n' "$EXPECTED_MAIN" > "$ARTIFACT_DIR/main.sha"
          printf '%s\n' "$EXPECTED_PRODUCT" > "$ARTIFACT_DIR/product-predecessor.sha"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > "$ARTIFACT_DIR/controller.sha"
          git hash-object tools/lib/industrial-exhaust.mjs > "$ARTIFACT_DIR/prequalification-library.blob"
          git hash-object test/industrial-exhaust.test.js > "$ARTIFACT_DIR/prequalification-focused-test.blob"
          git diff --binary > "$ARTIFACT_DIR/prequalification-product.patch"
          git diff --stat > "$ARTIFACT_DIR/prequalification-product.diffstat"

          status=0
          for test_file in test/industrial-exhaust*.test.js; do
            log="$ARTIFACT_DIR/logs/$(basename "$test_file").log"
            printf 'RUNNING_TEST=%s\n' "$test_file"
            if ! node "$test_file" >"$log" 2>&1; then
              printf 'FAILED_COMMAND=node %s\n' "$test_file" | tee "$ARTIFACT_DIR/failure.txt"
              printf 'FAILED_LOG=%s\n' "$log" | tee -a "$ARTIFACT_DIR/failure.txt"
              tail -n 200 "$log" | tee -a "$ARTIFACT_DIR/failure.txt"
              status=1
              break
            fi
          done

          if [ "$status" -eq 0 ]; then
            log="$ARTIFACT_DIR/logs/release-check.log"
            printf '%s\n' 'RUNNING_RELEASE_CHECK'
            if ! npm run release:check >"$log" 2>&1; then
              printf '%s\n' 'FAILED_COMMAND=npm run release:check' | tee "$ARTIFACT_DIR/failure.txt"
              printf 'FAILED_LOG=%s\n' "$log" | tee -a "$ARTIFACT_DIR/failure.txt"
              tail -n 200 "$log" | tee -a "$ARTIFACT_DIR/failure.txt"
              status=1
            fi
          fi

          if [ "$status" -ne 0 ]; then
            printf '%s\n' QUALIFICATION_FAILURE > "$ARTIFACT_DIR/result.txt"
            exit "$status"
          fi

          printf '%s\n' QUALIFICATION_TESTS_SUCCESS > "$ARTIFACT_DIR/result.txt"

      - name: Restore generated state and bind exact V93 product bytes
        shell: bash
        working-directory: /tmp/pr2231-v93-product
        run: |
          set -euo pipefail
          cp tools/lib/industrial-exhaust.mjs /tmp/pr2231-v93-qualified-library.mjs
          cp test/industrial-exhaust.test.js /tmp/pr2231-v93-qualified-focused-test.js

          printf '%s\n' 'PRE_RESTORE_STATUS'
          git status --short
          printf '%s\n' 'PRE_RESTORE_DIFF'
          git diff --name-status

          git restore --source="$EXPECTED_PRODUCT" --staged --worktree -- .
          git clean -fd
          cp /tmp/pr2231-v93-qualified-library.mjs tools/lib/industrial-exhaust.mjs
          cp /tmp/pr2231-v93-qualified-focused-test.js test/industrial-exhaust.test.js

          printf '%s\n' 'POST_RESTORE_STATUS'
          git status --short
          printf '%s\n' 'POST_RESTORE_DIFF'
          git diff --name-status
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          printf 'CHANGED_COUNT=%s\n' "${#changed[@]}"
          printf 'CHANGED_PATH=%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'test/industrial-exhaust.test.js'
          test "${changed[1]}" = 'tools/lib/industrial-exhaust.mjs'

          library_blob="$(git hash-object tools/lib/industrial-exhaust.mjs)"
          focused_test_blob="$(git hash-object test/industrial-exhaust.test.js)"
          printf 'V93_LIBRARY_BLOB=%s\n' "$library_blob"
          printf 'V93_FOCUSED_TEST_BLOB=%s\n' "$focused_test_blob"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' "$EXPECTED_MAIN" > "$ARTIFACT_DIR/main.sha"
          printf '%s\n' "$EXPECTED_PRODUCT" > "$ARTIFACT_DIR/product-predecessor.sha"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > "$ARTIFACT_DIR/controller.sha"
          printf '%s\n' "$library_blob" > "$ARTIFACT_DIR/library.blob"
          printf '%s\n' "$focused_test_blob" > "$ARTIFACT_DIR/focused-test.blob"
          git diff --binary > "$ARTIFACT_DIR/product.patch"
          git diff --stat > "$ARTIFACT_DIR/product.diffstat"
          sha256sum \
            tools/lib/industrial-exhaust.mjs \
            test/industrial-exhaust.test.js \
            "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v92.py.gz.b64" \
            "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v92-r2.py.gz.b64" \
            "$GITHUB_WORKSPACE/.github/tmp/pr2231-cumulative-custody-v93.py.gz.b64" \
            > "$ARTIFACT_DIR/sha256.txt"
          printf '%s\n' QUALIFICATION_SUCCESS > "$ARTIFACT_DIR/result.txt"

      - name: Upload retained V93 diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-cumulative-custody-v93-diagnostic
          path: /tmp/pr2231-v93-diagnostic-artifact
          if-no-files-found: warn
          retention-days: 90
