name: Status sovereignty RD Wave 03 RD-04 five-state promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-five-state-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-five-state-promotion.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-sovereignty-rd04-five-state-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANONICAL_PRODUCT_PARENT: fdcbfbcd7e5a373444b25d3132d058669f8b3a71
  CANONICAL_PRODUCT_COMMIT: feadf9f13d87d714eca4b5d142538a4a73d684aa
  CANONICAL_PRODUCT_MERGE: 120c3b51b696a002a06ff82a0599216b84247882
  CANONICAL_WORKFLOW_BLOB: c5908bd67e34abdc9c737c90cd40f9a9fd7e78b8
  WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-five-state-promotion.yml

jobs:
  qualify:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bind canonical product and exact workflow-only repair surface
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "$CANONICAL_PRODUCT_PARENT^{commit}"
          git cat-file -e "$CANONICAL_PRODUCT_COMMIT^{commit}"
          git cat-file -e "$CANONICAL_PRODUCT_MERGE^{commit}"
          test "$(git rev-parse "$CANONICAL_PRODUCT_COMMIT^")" = "$CANONICAL_PRODUCT_PARENT"
          test "$(git rev-parse "$CANONICAL_PRODUCT_MERGE^1")" = "$CANONICAL_PRODUCT_PARENT"
          test "$(git rev-parse "$CANONICAL_PRODUCT_MERGE^2")" = "$CANONICAL_PRODUCT_COMMIT"
          test "$(git rev-parse "$CANONICAL_PRODUCT_COMMIT^{tree}")" = "$(git rev-parse "$CANONICAL_PRODUCT_MERGE^{tree}")"
          git merge-base --is-ancestor "$CANONICAL_PRODUCT_MERGE" HEAD

          mapfile -t product_delta < <(git diff --name-only "$CANONICAL_PRODUCT_MERGE" HEAD -- \
            "$WORKFLOW_PATH" \
            data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion \
            docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md \
            schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json \
            test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js \
            tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs \
            tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs | LC_ALL=C sort)
          test "${#product_delta[@]}" -eq 1
          test "${product_delta[0]}" = "$WORKFLOW_PATH"

          if test "$GITHUB_EVENT_NAME" = pull_request; then
            test "$(git rev-parse HEAD^)" = "$CANONICAL_PRODUCT_MERGE"
            test "$(git rev-list --count "$CANONICAL_PRODUCT_MERGE"..HEAD)" = 1
            test "$(git diff --name-only --diff-filter=M HEAD^ HEAD)" = "$WORKFLOW_PATH"
            test -z "$(git diff --name-only --diff-filter=ACDRTUXB HEAD^ HEAD || true)"
          else
            test "$GITHUB_EVENT_NAME" = push -o "$GITHUB_EVENT_NAME" = workflow_dispatch
          fi
          git diff --check "$CANONICAL_PRODUCT_MERGE" HEAD

      - name: Prove all thirteen canonical substantive blobs are unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/rd04-canonical-ordinary-blobs.txt <<'EOF'
          4c24071b47076ed572b31d2dc963989ea76b117b data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/cell-promotion-ledger.json
          f06b7a69a6496aa2a15220dde502a30381aa1f5b data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/index.json
          9a5c880e7da768c0f1f783a041125ddc00134eec data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/product-manifest.json
          42361e559db90777e1d60aea5530df5694c86dc6 data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promoted-partial-field-matrix.json
          04026657d60e54ea998c754b0e3c264dc347ab30 data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-decisions.json
          d479ba631aa37e0d9b0e71e1033d99f5b765e657 data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-input-custody.json
          e774a9ed555364e4c6616c407a24001dd39f8f51 data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-summary.json
          e6ea2bb2722d084d0bb601864d4de5d9db4c7b47 data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/remaining-open-field-census.json
          1e05762693e6fe4aebf4cbf810d3290d6f2bdbd8 docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md
          efa3829a76f15554fe3527f1656fd56deb9a4c1d schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json
          7645b8efea1347fd95e99fe885c88dbb894c31ad test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js
          e205b701192fd464b154ebb238ddda438d7916ea tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          83f3e2e07fe1702b9bb92ac4b310d66a9315b9cd tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          EOF
          while read -r expected path; do
            test "$(git rev-parse "$CANONICAL_PRODUCT_MERGE:$path")" = "$expected"
            test "$(git rev-parse "HEAD:$path")" = "$expected"
          done < /tmp/rd04-canonical-ordinary-blobs.txt
          test "$(git rev-parse "$CANONICAL_PRODUCT_MERGE:$WORKFLOW_PATH")" = "$CANONICAL_WORKFLOW_BLOB"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" != "$CANONICAL_WORKFLOW_BLOB"

      - name: Verify repaired workflow semantics and immutable promotion inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'ref: ${{ github.event.pull_request.head.sha || github.sha }}' "$WORKFLOW_PATH"
          grep -Fq 'push:' "$WORKFLOW_PATH"
          grep -Fq "$CANONICAL_PRODUCT_MERGE" "$WORKFLOW_PATH"
          ! grep -Fq '86937ea02e7e10223d0854240cd4e0cc9b6716a4' "$WORKFLOW_PATH"
          ! grep -Fq 'agent/ssc-rd04-five-state-promotion-product-v1' "$WORKFLOW_PATH"
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-row-state-adjudication/promoted-partial-field-matrix.json)" = ab5f136d887aa6f21edc793e7394fee38b8ad6f6
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/promotion-candidate-protocol.json)" = 30705b3d0f74d1b75f81175c2e9ca3fa9bf76c4a
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/field-adjudications.json)" = ca0be819a522532ecc7b0ee07909382ece6a8329
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/capture-custody.json)" = 863ab334d4f5a4a77003a9d39383ded489ab412e
          test "$(git hash-object data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/source-adjudications.json)" = 53f378c9c4a56ca4aab0312bba38150b071786af

      - name: Deterministic build, recursively closed schema validation, and adversarial test
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js
          python -m pip install --disable-pip-version-check jsonschema==4.25.1 pyyaml==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          value=yaml.safe_load(Path('.github/workflows/status-sovereignty-rd-wave03-rd04-five-state-promotion.yml').read_text())
          assert isinstance(value,dict) and 'jobs' in value
          print('workflow_yaml_parse=pass')
          PY
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          git diff --exit-code -- \
            data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion \
            docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md \
            schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json \
            test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js \
            tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs \
            tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path('.')
          schema=json.loads((root/'schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json').read_text())
          validator=Draft202012Validator(schema)
          product=root/'data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion'
          names=['promotion-input-custody.json','promotion-decisions.json','cell-promotion-ledger.json','promoted-partial-field-matrix.json','remaining-open-field-census.json','promotion-summary.json','index.json','product-manifest.json']
          for name in names:
              value=json.loads((product/name).read_text())
              errors=sorted(validator.iter_errors(value),key=lambda e:list(e.path))
              if errors:
                  raise SystemExit(f'{name}: {errors[0].message} at {list(errors[0].path)}')
          print('recursive_schema_validation=pass objects=8')
          PY
          node tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          node test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js

      - name: Repository gates and clean product replay
        shell: bash
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
          git diff --exit-code -- \
            data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion \
            docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md \
            schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json \
            test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js \
            tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs \
            tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs

      - name: Preserve workflow-binding qualification receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/ssc-rd04-five-state-promotion-workflow-binding
          rm -rf "$OUT"
          mkdir -p "$OUT/product"
          cp "$WORKFLOW_PATH" "$OUT/repaired-workflow.yml"
          cp data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/*.json "$OUT/product/"
          git rev-parse HEAD > "$OUT/executed-head.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/executed-tree.txt"
          printf '%s\n' "$CANONICAL_PRODUCT_PARENT" > "$OUT/canonical-product-parent.txt"
          printf '%s\n' "$CANONICAL_PRODUCT_COMMIT" > "$OUT/canonical-product-commit.txt"
          printf '%s\n' "$CANONICAL_PRODUCT_MERGE" > "$OUT/canonical-product-merge.txt"
          git hash-object "$WORKFLOW_PATH" > "$OUT/repaired-workflow-git-blob.txt"
          sha256sum "$WORKFLOW_PATH" | cut -d' ' -f1 > "$OUT/repaired-workflow-sha256.txt"
          git ls-tree "$CANONICAL_PRODUCT_MERGE" -- "$WORKFLOW_PATH" > "$OUT/canonical-workflow-tree-row.txt"
          git ls-tree HEAD -- "$WORKFLOW_PATH" > "$OUT/repaired-workflow-tree-row.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS > SHA256-CHECK.log
          )

      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-five-state-promotion-workflow-binding
          path: /tmp/ssc-rd04-five-state-promotion-workflow-binding
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
