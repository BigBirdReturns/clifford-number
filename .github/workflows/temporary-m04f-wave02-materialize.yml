name: Temporary materialize M-04F Wave 02

on:
  push:
    branches:
      - agent/m04f-evidence-lake-wave-02
    paths:
      - 'data/intake/m04f-epistemic-jurisdiction-sources-03.json'
      - 'data/intake/m04f-epistemic-jurisdiction-wave-02.json'
      - 'tools/build-m04f-epistemic-jurisdiction.mjs'
      - 'tools/validate-m04f-epistemic-jurisdiction.mjs'
      - 'test/m04f-epistemic-jurisdiction.test.js'
      - 'docs/milestones/m04f-evidence-lake-wave-02.md'
      - '.github/workflows/temporary-m04f-wave02-materialize.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'data/intake/m04f-epistemic-jurisdiction-sources-03.json'
      - 'data/intake/m04f-epistemic-jurisdiction-wave-02.json'
      - 'tools/build-m04f-epistemic-jurisdiction.mjs'
      - 'tools/validate-m04f-epistemic-jurisdiction.mjs'
      - 'test/m04f-epistemic-jurisdiction.test.js'
      - 'docs/milestones/m04f-evidence-lake-wave-02.md'
      - '.github/workflows/temporary-m04f-wave02-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04f-wave02-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-evidence-lake-wave-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate Wave 02
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          allowed = {
              'data/intake/m04f-epistemic-jurisdiction-wave-01.json',
              'data/project/m04f-epistemic-jurisdiction-estate.json',
              'build/core-thesis/epistemic-jurisdiction/manifest.json',
              'build/core-thesis/epistemic-jurisdiction/test-matrix.json',
              'reports/core-thesis/epistemic-jurisdiction/data.json',
              'reports/core-thesis/epistemic-jurisdiction/index.html',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          for row in rows:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed:
                  continue
              tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', '--', path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if tracked:
                  subprocess.run(['git', 'restore', '--staged', '--worktree', '--', path], check=True)
              else:
                  target = Path(path)
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
          PY
      - name: Rebuild and refuse unexpected output
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              'data/intake/m04f-epistemic-jurisdiction-wave-01.json',
              'data/project/m04f-epistemic-jurisdiction-estate.json',
              'build/core-thesis/epistemic-jurisdiction/manifest.json',
              'build/core-thesis/epistemic-jurisdiction/test-matrix.json',
              'reports/core-thesis/epistemic-jurisdiction/data.json',
              'reports/core-thesis/epistemic-jurisdiction/index.html',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          paths = []
          for row in rows:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          bad = [path for path in paths if path not in allowed]
          print('\n'.join(paths))
          if bad:
              raise SystemExit('unexpected durable drift:\n' + '\n'.join(bad))
          PY
      - name: Commit verified generated products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            data/intake/m04f-epistemic-jurisdiction-wave-01.json \
            data/project/m04f-epistemic-jurisdiction-estate.json \
            build/core-thesis/epistemic-jurisdiction/manifest.json \
            build/core-thesis/epistemic-jurisdiction/test-matrix.json \
            reports/core-thesis/epistemic-jurisdiction/data.json \
            reports/core-thesis/epistemic-jurisdiction/index.html
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'No generated changes to commit'; exit 1; }
          git commit -m 'Materialize M-04F evidence lake Wave 02'
          git push origin HEAD:agent/m04f-evidence-lake-wave-02
