name: Temporary materialize M-04G evidence hydrology inland sea

on:
  push:
    branches:
      - agent/m04g-evidence-hydrology-inland-sea
    paths:
      - '.github/temporary/m04g-evidence-hydrology/**'
      - '.github/workflows/temporary-m04g-evidence-hydrology-materialize.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/temporary/m04g-evidence-hydrology/**'
      - '.github/workflows/temporary-m04g-evidence-hydrology-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04g-evidence-hydrology-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04g-evidence-hydrology-inland-sea
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble, repair, and safely extract the inland-sea source payload
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import tarfile
          from pathlib import Path

          root = Path('.github/temporary/m04g-evidence-hydrology')
          names = [f'part-{index:02d}' for index in range(10)]
          encoded = ''.join((root / name).read_text().strip() for name in names)
          assert len(encoded) == 123768, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '04c17a93438f3695678910d2efadd9c5825e488a6c1e99800d404ce599c6c1a3'

          repairs = json.loads((root / 'repair-00.txt').read_text())
          assert len(repairs) == 6, len(repairs)
          assert len(repairs[-1]['replacement']) == 15543
          repairs[-1]['replacement'] = repairs[-1]['replacement'][:10283]

          for repair in sorted(repairs, key=lambda item: item['start'], reverse=True):
              start = int(repair['start'])
              end = int(repair['end'])
              encoded = encoded[:start] + repair['replacement'] + encoded[end:]

          # The recovered carrier is a transport object only. Canonical authority
          # comes from the deterministic build, focused validators, regression,
          # and complete repository release gate below.
          assert len(encoded) == 116252, len(encoded)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '1345169bc891660df2d2507734f1f2e0ee7423442f416013e5a4ed0b5f7c4ba9'

          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == 87187, len(payload)
          assert hashlib.sha256(payload).hexdigest() == '52a527747eb10fa1b6b93d8e89627236874c2373d53c6691f053b9a8e2b95230'

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              archive.extractall('.')
              print('\n'.join(member.name for member in members))
          PY
      - name: Build and validate the deterministic inland sea
        run: |
          node tools/build-m04g-evidence-hydrology.mjs
          node tools/validate-m04g-evidence-hydrology.mjs
          node test/m04g-evidence-hydrology.test.js
          node tools/refresh-m04g-evidence-hydrology.mjs --dry-run --class all --limit 100
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          exact = {
              '.github/workflows/m04g-evidence-hydrology.yml',
              'data/project/m04g-evidence-hydrology-methodology.json',
              'data/project/m04g-evidence-hydrology-catchments.json',
              'data/project/m04g-evidence-hydrology-pilot-polls.json',
              'data/project/m04g-evidence-hydrology-fanout.json',
              'data/intake/m04g-evidence-hydrology-sources-01.json',
              'docs/methods/evidence-hydrology.md',
              'docs/milestones/m04g-evidence-hydrology-inland-sea-wave-01.md',
              'tools/build-m04g-evidence-hydrology.mjs',
              'tools/validate-m04g-evidence-hydrology.mjs',
              'tools/refresh-m04g-evidence-hydrology.mjs',
              'test/m04g-evidence-hydrology.test.js',
              'build/core-thesis/evidence-hydrology/data.json',
              'reports/core-thesis/evidence-hydrology/data.json',
              'reports/core-thesis/evidence-hydrology/index.html',
              '.github/workflows/temporary-m04g-evidence-hydrology-materialize.yml',
          }
          prefixes = ('.github/temporary/m04g-evidence-hydrology/',)

          def allowed(path: str) -> bool:
              return path in exact or path.startswith(prefixes)

          for row in subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all'], text=True
          ).splitlines():
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if allowed(path):
                  continue
              tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', '--', path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              target = Path(path)
              if tracked:
                  subprocess.run(['git', 'restore', '--staged', '--worktree', '--', path], check=True)
              elif target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
          PY
      - name: Rebuild, revalidate, and refuse unexpected drift
        run: |
          node tools/build-m04g-evidence-hydrology.mjs
          node tools/validate-m04g-evidence-hydrology.mjs
          node test/m04g-evidence-hydrology.test.js
          node tools/refresh-m04g-evidence-hydrology.mjs --dry-run --class all --limit 100
          git diff --check
          python - <<'PY'
          import subprocess

          exact = {
              '.github/workflows/m04g-evidence-hydrology.yml',
              'data/project/m04g-evidence-hydrology-methodology.json',
              'data/project/m04g-evidence-hydrology-catchments.json',
              'data/project/m04g-evidence-hydrology-pilot-polls.json',
              'data/project/m04g-evidence-hydrology-fanout.json',
              'data/intake/m04g-evidence-hydrology-sources-01.json',
              'docs/methods/evidence-hydrology.md',
              'docs/milestones/m04g-evidence-hydrology-inland-sea-wave-01.md',
              'tools/build-m04g-evidence-hydrology.mjs',
              'tools/validate-m04g-evidence-hydrology.mjs',
              'tools/refresh-m04g-evidence-hydrology.mjs',
              'test/m04g-evidence-hydrology.test.js',
              'build/core-thesis/evidence-hydrology/data.json',
              'reports/core-thesis/evidence-hydrology/data.json',
              'reports/core-thesis/evidence-hydrology/index.html',
              '.github/workflows/temporary-m04g-evidence-hydrology-materialize.yml',
          }
          prefixes = ('.github/temporary/m04g-evidence-hydrology/',)
          paths = []
          for row in subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all'], text=True
          ).splitlines():
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          bad = [path for path in paths if path not in exact and not path.startswith(prefixes)]
          print('\n'.join(paths))
          if bad:
              raise SystemExit('unexpected durable drift:\n' + '\n'.join(bad))
          PY
      - name: Commit and push the verified non-workflow program
        run: |
          target='agent/m04g-evidence-hydrology-inland-sea'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -r --ignore-unmatch \
            .github/temporary/m04g-evidence-hydrology \
            .github/workflows/temporary-m04g-evidence-hydrology-materialize.yml \
            .github/workflows/temporary-m04g-payload-diagnostic.yml \
            .github/workflows/temporary-m04g-drift-diagnostic.yml

          # Workflow files require a GitHub App permission that the Actions token
          # intentionally does not have. Publish the fourteen verified non-workflow
          # products here; the permanent workflow is added by the GitHub App only
          # after this commit lands.
          rm -f .github/workflows/m04g-evidence-hydrology.yml

          git add -- \
            data/project/m04g-evidence-hydrology-methodology.json \
            data/project/m04g-evidence-hydrology-catchments.json \
            data/project/m04g-evidence-hydrology-pilot-polls.json \
            data/project/m04g-evidence-hydrology-fanout.json \
            data/intake/m04g-evidence-hydrology-sources-01.json \
            docs/methods/evidence-hydrology.md \
            docs/milestones/m04g-evidence-hydrology-inland-sea-wave-01.md \
            tools/build-m04g-evidence-hydrology.mjs \
            tools/validate-m04g-evidence-hydrology.mjs \
            tools/refresh-m04g-evidence-hydrology.mjs \
            test/m04g-evidence-hydrology.test.js \
            build/core-thesis/evidence-hydrology/data.json \
            reports/core-thesis/evidence-hydrology/data.json \
            reports/core-thesis/evidence-hydrology/index.html

          git diff --cached --name-status
          git diff --cached --quiet && { echo 'No permanent M-04G changes to commit'; exit 1; }
          git commit -m 'Build M-04G evidence hydrology inland sea core'
          git push origin "HEAD:refs/heads/$target"
