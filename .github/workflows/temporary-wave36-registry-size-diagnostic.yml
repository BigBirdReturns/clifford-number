name: Temporary Wave 36 registry-size diagnostic

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-registry-size-diagnostic.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-wave36-registry-size-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave36-registry-size-diagnostic.yml'
          encoded_ref='agent%2Flake-allocator-war-public-acquisition-wave-36'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || exit 1
            sleep 2
          done
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Measure the structured-index parse boundary
        shell: bash
        env:
          LAW36_ALLOW_REQUIRED_FAILURES: '1'
          LAW36_OBSERVED_AT: '2026-08-02T16:30:00Z'
        run: |
          set -euo pipefail
          registry='data/project/lake-identifier-topology-registry-wave-18.json'
          before_size="$(wc -c < "$registry" | tr -d ' ')"
          node tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
          node tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
          node .github/tmp/wave36-topology-extension.mjs
          after_size="$(wc -c < "$registry" | tr -d ' ')"
          git add -A
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');
          const policy = JSON.parse(fs.readFileSync('data/project/lake-index-policy.json','utf8'));
          const target = 'data/project/lake-identifier-topology-registry-wave-18.json';
          const targetBytes = fs.statSync(target).size;
          const files = cp.execFileSync('git',['ls-files','-z']).toString('utf8').split('\0').filter(Boolean);
          const candidates = files
            .filter(file => fs.existsSync(file) && policy.tracked_extensions.includes(path.extname(file).toLowerCase()))
            .map(file => ({ path: file, bytes: fs.statSync(file).size }))
            .filter(row => row.bytes > policy.max_text_bytes && row.bytes <= targetBytes)
            .sort((a,b) => a.bytes - b.bytes || a.path.localeCompare(b.path));
          const overLimit = files
            .filter(file => fs.existsSync(file) && policy.tracked_extensions.includes(path.extname(file).toLowerCase()))
            .map(file => ({ path: file, bytes: fs.statSync(file).size }))
            .filter(row => row.bytes > policy.max_text_bytes)
            .sort((a,b) => a.bytes - b.bytes || a.path.localeCompare(b.path));
          console.log(JSON.stringify({
            max_text_bytes: policy.max_text_bytes,
            target,
            target_bytes: targetBytes,
            additional_global_parse_candidates_if_limit_raised_to_target: candidates,
            all_tracked_text_files_over_current_limit: overLimit
          }, null, 2));
          NODE
          echo "registry bytes before extension: $before_size"
          echo "registry bytes after extension:  $after_size"
          node tools/build-lake-index.mjs
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('build/lake-index.json','utf8'));
          const objects = JSON.parse(fs.readFileSync('build/lake-object-index.json','utf8'));
          const target = 'data/project/lake-identifier-topology-registry-wave-18.json';
          const file = index.files.find(row => row.path === target);
          const sample = objects.objects.find(row => row.id_key === 'acquisition_id' && row.id_value === 'CANACQ-0411c92510f914d1face8f94');
          console.log(JSON.stringify({
            registry_file_row: file,
            sample_object: sample,
            summary_counts: index.summary.counts
          }, null, 2));
          NODE
