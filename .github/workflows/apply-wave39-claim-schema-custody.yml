name: Apply Wave 39 claim and schema custody fix

on:
  push:
    branches:
      - agent/counter-selector-wave-39-digest-selected-restore
    paths:
      - '.github/workflows/apply-wave39-claim-schema-custody.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-claim-schema-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/counter-selector-wave-39-digest-selected-restore
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact custody repair and qualify permanent product
        env:
          BRANCH_NAME: agent/counter-selector-wave-39-digest-selected-restore
          EXPECTED_PRODUCT: cdb8adb8bf9fa88b70b6caab337b53eaec028fc8
          EXPECTED_SOURCE_SHA256: 8b3f3104531d8ccdb6b8b9326786ab098aa61110c919f93080886ec95226346f
          EXPECTED_SCHEMA_SHA256: b386f453f4bf2b9096a5349b9a46884020b9f5f269c03d3349e13bf8fbffcfdb
        run: |
          set -euo pipefail

          git config user.name 'Wave 39 claim-schema custodian'
          git config user.email 'wave39-claim-schema-custodian@users.noreply.github.com'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT"
          test -z "$(git status --porcelain)"

          python3 - <<'PY'
          from pathlib import Path

          validator = Path('tools/validate-counter-selector-wave-39.mjs')
          text = validator.read_text()
          replacements = [
              (
                  "import assert from 'node:assert/strict';\nimport fs from 'node:fs';",
                  "import assert from 'node:assert/strict';\nimport crypto from 'node:crypto';\nimport fs from 'node:fs';",
              ),
              (
                  "const HTML_PATH = 'reports/core-thesis/counter-selector-wave-39/index.html';\n\nexport const EXPECTED_COUNTS = {",
                  "const HTML_PATH = 'reports/core-thesis/counter-selector-wave-39/index.html';\nconst EXPECTED_SOURCE_SHA256 = '8b3f3104531d8ccdb6b8b9326786ab098aa61110c919f93080886ec95226346f';\nconst EXPECTED_SCHEMA_SHA256 = 'b386f453f4bf2b9096a5349b9a46884020b9f5f269c03d3349e13bf8fbffcfdb';\n\nfunction sha256(buffer) { return crypto.createHash('sha256').update(buffer).digest('hex'); }\n\nexport const EXPECTED_COUNTS = {",
              ),
              (
                  "export function validateSource(source) {\n",
                  "export function validateSource(source) {\n  assert.equal(sha256(Buffer.from(stableJson(source), 'utf8')), EXPECTED_SOURCE_SHA256, 'source exact-contract drift');\n",
              ),
              (
                  "export function validateSchemaAgainstSource(schema, source) {\n",
                  "export function validateSchemaAgainstSource(schema, source) {\n  assert.equal(sha256(Buffer.from(stableJson(schema), 'utf8')), EXPECTED_SCHEMA_SHA256, 'schema exact-contract drift');\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'validator replacement count {text.count(old)} for {old[:60]!r}')
              text = text.replace(old, new)
          validator.write_text(text)

          test = Path('test/counter-selector-wave-39.test.js')
          text = test.read_text()
          old_import = "import { validateSource, EXPECTED_ADJUDICATIONS, EXPECTED_BOUNDARIES, EXPECTED_COUNTS, EXPECTED_JOIN_MATRIX, EXPECTED_SOURCE_RECORDS, EXPECTED_CONTROL_METADATA } from '../tools/validate-counter-selector-wave-39.mjs';"
          new_import = "import { validateSource, validateSchemaAgainstSource, EXPECTED_ADJUDICATIONS, EXPECTED_BOUNDARIES, EXPECTED_COUNTS, EXPECTED_JOIN_MATRIX, EXPECTED_SOURCE_RECORDS, EXPECTED_CONTROL_METADATA } from '../tools/validate-counter-selector-wave-39.mjs';"
          if text.count(old_import) != 1:
              raise SystemExit('test import replacement mismatch')
          text = text.replace(old_import, new_import)
          old_source = "const source = JSON.parse(fs.readFileSync('data/project/counter-selector-wave-39-digest-selected-restore.json', 'utf8'));\nconst clone = value => structuredClone(value);"
          new_source = "const source = JSON.parse(fs.readFileSync('data/project/counter-selector-wave-39-digest-selected-restore.json', 'utf8'));\nconst schema = JSON.parse(fs.readFileSync('schemas/counter-selector-digest-selected-restore.schema.json', 'utf8'));\nconst clone = value => structuredClone(value);"
          if text.count(old_source) != 1:
              raise SystemExit('test source replacement mismatch')
          text = text.replace(old_source, new_source)
          old_tail = "assert.equal(mutations.length, EXPECTED_COUNTS.adversarial_mutations);\nfor (const [index, mutate] of mutations.entries()) {\n  const candidate = clone(source);\n  mutate(candidate);\n  assert.throws(() => validateSource(candidate), undefined, `mutation ${index + 1} should fail`);\n}\nconsole.log(`counter-selector-wave-39.test: ${mutations.length} adversarial mutations PASS`);\n"
          new_tail = "assert.equal(mutations.length, EXPECTED_COUNTS.adversarial_mutations);\nfor (const [index, mutate] of mutations.entries()) {\n  const candidate = clone(source);\n  mutate(candidate);\n  assert.throws(() => validateSource(candidate), undefined, `mutation ${index + 1} should fail`);\n}\n\nconst sourceContractTamperCases = [\n  value => { value.controls[0].components.independent_verification += ' mutated'; },\n  value => { value.controls[1].positive_findings.push('mutated complete handoff claim'); },\n  value => { value.controls[2].known_limits[0] += ' mutated'; },\n];\nfor (const [index, mutate] of sourceContractTamperCases.entries()) {\n  const candidate = clone(source);\n  mutate(candidate);\n  assert.throws(() => validateSource(candidate), undefined, `source contract tamper ${index + 1} should fail`);\n}\n\nconst schemaContractTamperCases = [\n  value => { value.required = []; },\n  value => { value.$defs.control.properties.public_label.type = 'number'; },\n  value => { value.$defs.control.required = []; },\n];\nfor (const [index, mutate] of schemaContractTamperCases.entries()) {\n  const candidate = clone(schema);\n  mutate(candidate);\n  assert.throws(() => validateSchemaAgainstSource(candidate, source), undefined, `schema contract tamper ${index + 1} should fail`);\n}\n\nconst exactContractTamperCases = sourceContractTamperCases.length + schemaContractTamperCases.length;\nassert.equal(exactContractTamperCases, 6);\nconsole.log(`counter-selector-wave-39.test: ${mutations.length} adversarial mutations + ${exactContractTamperCases} exact-contract tamper cases PASS`);\n"
          if text.count(old_tail) != 1:
              raise SystemExit('test tail replacement mismatch')
          test.write_text(text.replace(old_tail, new_tail))
          PY

          rm -f .github/workflows/apply-wave39-claim-schema-custody.yml

          node tools/build-counter-selector-wave-39.mjs
          node tools/validate-counter-selector-wave-39.mjs
          node test/counter-selector-wave-39.test.js

          git add -A
          git diff --cached --check
          cat > /tmp/wave39-claim-schema-paths.txt <<'EOF'
          data/project/counter-selector-wave-39-release-manifest.json
          reports/core-thesis/counter-selector-wave-39/data.json
          test/counter-selector-wave-39.test.js
          tools/validate-counter-selector-wave-39.mjs
          EOF
          sed -i 's/^          //' /tmp/wave39-claim-schema-paths.txt
          git diff --cached --name-only "$EXPECTED_PRODUCT" | LC_ALL=C sort > /tmp/wave39-actual-paths.txt
          diff -u /tmp/wave39-claim-schema-paths.txt /tmp/wave39-actual-paths.txt

          git commit -m 'Wave 39: bind narrative claims and complete schema contract'
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"

          rm -rf /tmp/wave39-claim-schema-gate
          git worktree add --detach /tmp/wave39-claim-schema-gate "$PRODUCT_COMMIT"
          (
            cd /tmp/wave39-claim-schema-gate
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            npm run release:check
            git restore --staged --worktree .
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            test -z "$(git status --porcelain)"
          )
          git worktree remove /tmp/wave39-claim-schema-gate

          git diff --name-only "$EXPECTED_PRODUCT..$PRODUCT_COMMIT" | LC_ALL=C sort > /tmp/wave39-final-paths.txt
          diff -u /tmp/wave39-claim-schema-paths.txt /tmp/wave39-final-paths.txt
          test -z "$(git status --porcelain)"

          python3 - <<PY
          import json
          from pathlib import Path
          receipt = {
              'schema_version': 'counter-selector-wave-39-claim-schema-custody-receipt@1',
              'parent_commit': '$EXPECTED_PRODUCT',
              'product_commit': '$PRODUCT_COMMIT',
              'product_tree': '$PRODUCT_TREE',
              'source_sha256': '$EXPECTED_SOURCE_SHA256',
              'schema_sha256': '$EXPECTED_SCHEMA_SHA256',
              'changed_paths': Path('/tmp/wave39-claim-schema-paths.txt').read_text().splitlines(),
              'adversarial_mutations': 205,
              'exact_contract_tamper_cases': 6,
              'source_narrative_contract': 'exact_sha256_bound',
              'complete_schema_contract': 'exact_sha256_bound',
              'complete_release_gate': 'passed',
              'deterministic_reconstruction': 'passed',
              'temporary_paths_survive': False,
          }
          Path('/tmp/counter-selector-wave-39-claim-schema-custody.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

          git push --force-with-lease="refs/heads/$BRANCH_NAME:$(git rev-parse HEAD^)" origin "HEAD:refs/heads/$BRANCH_NAME"
      - name: Preserve exact custody receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-selector-wave-39-claim-schema-custody-${{ github.run_id }}
          path: /tmp/counter-selector-wave-39-claim-schema-custody.json
          if-no-files-found: error
