name: TEMP CE0364 exact-base export

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-ce0364-x-bow-source-acquisition.yml'

permissions:
  contents: read

concurrency:
  group: temp-ce0364-exact-base-export-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ce0364-x-bow-source-acquisition-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_MAIN: e499eaeeb6bcdf64b76f0440c10e79ea1c064c4a
      BASE_TREE: 60cc78433ce669d8d16b5d286378f49fa1918762
    steps:
      - name: Check out exact leased main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_MAIN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify lease and package exact source files
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$BASE_MAIN" ]]
          [[ "$(git show -s --format=%T HEAD)" == "$BASE_TREE" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$BASE_MAIN" ]]
          rm -rf export
          mkdir -p export/data/intake/natsec100-pathways/chunk1 export/test
          cp data/intake/natsec100-pathways/chunk1/companies.jsonl export/data/intake/natsec100-pathways/chunk1/
          cp data/intake/natsec100-pathways/chunk1/conversion_events.jsonl export/data/intake/natsec100-pathways/chunk1/
          cp data/intake/natsec100-pathways/chunk1/receipts.jsonl export/data/intake/natsec100-pathways/chunk1/
          cp test/natsec100-award-control.test.js export/test/
          printf '%s\n' "$BASE_MAIN" > export/BASE_COMMIT
          printf '%s\n' "$BASE_TREE" > export/BASE_TREE
          find export -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS

      - name: Upload exact base files
        uses: actions/upload-artifact@v4
        with:
          name: ce0364-exact-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: export/
          if-no-files-found: error
          retention-days: 30
