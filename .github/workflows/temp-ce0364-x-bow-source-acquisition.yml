          test_path.write_text(test_text.rstrip() + test_append + '\n', encoding='utf-8')
          PY

      - name: Run focused and complete qualification
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/ce0364-product/repo
        run: |
          set -Eeuo pipefail
          cd "$CANDIDATE_ROOT"
          npm ci --no-audit --no-fund > "$GITHUB_WORKSPACE/product-package/npm-ci.stdout" 2> "$GITHUB_WORKSPACE/product-package/npm-ci.stderr"
          node test/natsec100-award-control.test.js > "$GITHUB_WORKSPACE/product-package/focused.stdout" 2> "$GITHUB_WORKSPACE/product-package/focused.stderr"
          npm run release:check > "$GITHUB_WORKSPACE/product-package/release.stdout" 2> "$GITHUB_WORKSPACE/product-package/release.stderr"
          git diff --check
          git status --short > "$GITHUB_WORKSPACE/product-package/status.txt"
          git diff --stat "$BASE_MAIN" > "$GITHUB_WORKSPACE/product-package/diff-stat.txt"
          git diff --name-only "$BASE_MAIN" | sort > "$GITHUB_WORKSPACE/product-package/changed-paths.txt"
          git diff --binary "$BASE_MAIN" > "$GITHUB_WORKSPACE/product-package/candidate.patch"

      - name: Enforce the exact changed-path denominator and package full files
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/ce0364-product/repo
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil

          repo = pathlib.Path(os.environ['CANDIDATE_ROOT'])
          package = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'product-package'
          changed = [line.strip() for line in (package / 'changed-paths.txt').read_text().splitlines() if line.strip()]
          custody_prefix = os.environ['CUSTODY_DIR'].rstrip('/') + '/'
          fixed = {
              'data/intake/natsec100-pathways/chunk1/conversion_events.jsonl',
              'data/intake/natsec100-pathways/chunk1/receipts.jsonl',
              'data/research/natsec100-x-bow-award-adjudication.json',
              'test/natsec100-award-control.test.js',
          }
          unexpected = [path for path in changed if path not in fixed and not path.startswith(custody_prefix)]
          if unexpected:
              raise SystemExit(f'unexpected changed paths: {unexpected}')
          missing = sorted(path for path in fixed if path not in changed)
          if missing:
              raise SystemExit(f'missing required changed paths: {missing}')
          custody_paths = [path for path in changed if path.startswith(custody_prefix)]
          if len(custody_paths) < 20:
              raise SystemExit(f'incomplete source custody denominator: {len(custody_paths)}')

          files_root = package / 'files'
          for relative in changed:
              src = repo / relative
              if not src.is_file():
                  raise SystemExit(f'changed path is not a file: {relative}')
              dst = files_root / relative
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)

          hashes = []
          for path in sorted(files_root.rglob('*')):
              if path.is_file():
                  hashes.append({
                      'path': str(path.relative_to(files_root)),
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          qualification = {
              'schema_version': 'ce0364-x-bow-product-qualification@1',
              'repository': 'BigBirdReturns/clifford-number',
              'base_commit': os.environ['BASE_MAIN'],
              'base_tree': os.environ['BASE_TREE'],
              'controller_head': os.environ['GITHUB_SHA'],
              'source_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_job_id': int(os.environ['SOURCE_JOB_ID']),
              'source_artifact_id': int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_zip_sha256': os.environ['SOURCE_ARTIFACT_SHA256'],
              'changed_paths': changed,
              'changed_path_count': len(changed),
              'source_custody_path_count': len(custody_paths),
              'focused_test': 'success',
              'release_check': 'success',
              'diff_check': 'success',
              'graph_effect': 'none',
              'files': hashes,
          }
          (package / 'QUALIFICATION.json').write_text(json.dumps(qualification, indent=2) + '\n')
          ledger = []
          for path in sorted(package.rglob('*')):
              if path.is_file() and path.name != 'PACKAGE-SHA256SUMS':
                  ledger.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(package)}")
          (package / 'PACKAGE-SHA256SUMS').write_text('\n'.join(ledger) + '\n')
          PY

      - name: Upload exact candidate and qualification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce0364-x-bow-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-package/
          if-no-files-found: error
          retention-days: 30
