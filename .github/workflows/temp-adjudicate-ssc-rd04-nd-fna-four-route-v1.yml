          test "$(cat "$OUTPUT_DIR/result/EXIT_CODE")" = 0
          test "$(cat "$OUTPUT_DIR/result/STAGE")" = complete
          (cd "$OUTPUT_DIR/result" && sha256sum -c SHA256SUMS)
          python - "$OUTPUT_DIR/result/receipt.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["state"] == "complete"
