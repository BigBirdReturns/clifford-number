name: TEMP M-04G GDELT global tide materializer v2

on:
  push:
    branches:
      - agent/m04g-global-gdelt-tide-probe-v1
    paths:
      - '.github/probes/m04g_global_gdelt_tide_materializer_v2.part-*'
      - '.github/probes/m04g_global_gdelt_tide_runner_v2.part-*'
      - '.github/workflows/temporary-m04g-global-gdelt-materializer-v1.yml'

permissions:
  contents: write

concurrency:
  group: m04g-gdelt-global-tide-materializer-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct and run bounded materializer
        shell: bash
        run: |
          set -euo pipefail
          cat .github/probes/m04g_global_gdelt_tide_runner_v2.part-* > /tmp/m04g-global-gdelt-runner-v2.sh
          runner_sha="$(sha256sum /tmp/m04g-global-gdelt-runner-v2.sh | awk '{print $1}')"
          test "$runner_sha" = "9aeb689fe9355a9cae4d23edce30fc01bf9e5d1b99ef048d882f68e6233accbe"
          chmod +x /tmp/m04g-global-gdelt-runner-v2.sh
          /tmp/m04g-global-gdelt-runner-v2.sh

      - name: Upload materialization receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04g-gdelt-global-tide-materializer-v2-${{ github.run_id }}
          path: qualification/
          if-no-files-found: error
          retention-days: 30
