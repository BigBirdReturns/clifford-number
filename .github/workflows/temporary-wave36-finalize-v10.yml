name: Temporary Wave 36 finalization v10

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-finalize-v10.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave36-finalize-v10-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave36-finalize-v10.yml'
          encoded_ref='agent%2Flake-allocator-war-public-acquisition-wave-36'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || exit 1
            sleep 2
          done
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Execute the repaired sealed Wave 36 epoch transaction
        shell: bash
        run: bash .github/tmp/wave36-finalize-v10.sh

      - name: Preserve final acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave36-acquisition-diagnostics-final-v10
          path: data/acquisition/lake-allocator-war-wave-36/capture-ledger.jsonl
          if-no-files-found: warn
          retention-days: 1
