name: TEMP export canonical RD-04 Montana row-state source v2

on:
  pull_request:
    branches:
      - agent/ssc-rd04-mt-row-state-current-main-export-base-v2
    types: [opened, synchronize, reopened]
    paths:
      - '.trigger/ssc-rd04-mt-row-state-current-main-export-v2'

permissions:
  contents: read

concurrency:
  group: temp-export-ssc-rd04-mt-row-state-current-main-v2
  cancel-in-progress: false

env:
  SOURCE_MAIN: b1d1d8afb6c957401a762bf9d0b2abc464bd5e07
  SOURCE_TREE: 64f5b5e9e9d72bdf86ef6cf14d728b2ae996f834
  BASE_BRANCH: agent/ssc-rd04-mt-row-state-current-main-export-base-v2
  TRIGGER_BRANCH: agent/ssc-rd04-mt-row-state-current-main-export-trigger-v2
  WORKFLOW_PATH: .github/workflows/temp-export-ssc-rd04-mt-row-state-current-main-v2.yml
  TRIGGER_PATH: .trigger/ssc-rd04-mt-row-state-current-main-export-v2
  OUTPUT_DIR: /tmp/ssc-rd04-mt-row-state-current-main-export-v2

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-mt-row-state-current-main-export-trigger-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Export exact canonical parent tree
        id: export
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          stage=bootstrap
          printf '%s\n' "$stage" > "$OUT/STAGE"
          exec > >(tee "$OUT/export.log") 2>&1

          finalize() {
            local rc=$?
            trap - EXIT
            set +e
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            if [ ! -f "$OUT/receipt.json" ]; then
              jq -n \
                --arg state failed_closed \
                --arg failed_stage "$stage" \
                --argjson exit_code "$rc" \
                --arg source_main "$SOURCE_MAIN" \
                --arg source_tree "$SOURCE_TREE" \
                '{schema_version:"ssc-rd04-mt-row-state-source-export@2",
                  state:$state,failed_stage:$failed_stage,exit_code:$exit_code,
                  source_main:$source_main,source_tree:$source_tree,
                  source_requests:0,route_executions:0,source_admissions:0,
                  matrix_updates:0,field_terminalizations:0,row_state_mutations:0,
                  class_closed:false,cumulative_ledger_effect:"none",
                  outside_human_dependency:false,publication_effect:"none",
                  adoption_effect:"none",graph_effect:"none"}' > "$OUT/receipt.json"
            fi
            (
              cd "$OUT"
              find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          stage=bind_carrier_topology
          BASE_COMMIT="$(git rev-parse HEAD^)"
          test "$(git rev-parse "$BASE_COMMIT^")" = "$SOURCE_MAIN"
          test "$(git rev-list --count "$SOURCE_MAIN".."$BASE_COMMIT")" -eq 1
          test "$(git rev-list --count "$BASE_COMMIT"..HEAD)" -eq 1
          test "$(git diff --name-only "$SOURCE_MAIN" "$BASE_COMMIT")" = "$WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$SOURCE_MAIN" "$BASE_COMMIT")" = "$WORKFLOW_PATH"
          test "$(git diff --name-only "$BASE_COMMIT" HEAD)" = "$TRIGGER_PATH"
          test "$(git diff --name-only --diff-filter=A "$BASE_COMMIT" HEAD)" = "$TRIGGER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$SOURCE_MAIN" HEAD)"
          git diff --check "$SOURCE_MAIN" HEAD

          stage=bind_live_source
          test "$(git rev-parse "$SOURCE_MAIN^{tree}")" = "$SOURCE_TREE"
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$SOURCE_MAIN"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$SOURCE_MAIN"

          stage=create_source_archive
          git ls-tree -r --name-only "$SOURCE_MAIN" | LC_ALL=C sort > "$OUT/tracked-paths.txt"
          git archive --format=tar "$SOURCE_MAIN" | gzip -9 > "$OUT/source.tar.gz"
          gzip -t "$OUT/source.tar.gz"
          python - "$OUT/source.tar.gz" "$OUT/archive-paths.txt" <<'PY'
          import sys, tarfile
          from pathlib import Path
          archive=Path(sys.argv[1]); destination=Path(sys.argv[2])
          with tarfile.open(archive, 'r:gz') as tf:
              names=[]
              for member in tf.getmembers():
                  name=member.name.removeprefix('./')
                  if member.isfile():
                      assert name and not name.startswith('/') and '..' not in Path(name).parts
                      names.append(name)
              assert len(names)==len(set(names))
          destination.write_text(''.join(f'{name}\n' for name in sorted(names)))
          print(f'archive_regular_files={len(names)}')
          PY
          diff -u "$OUT/tracked-paths.txt" "$OUT/archive-paths.txt"
          PATH_COUNT="$(wc -l < "$OUT/tracked-paths.txt")"
          ARCHIVE_BYTES="$(stat -c %s "$OUT/source.tar.gz")"
          ARCHIVE_SHA256="$(sha256sum "$OUT/source.tar.gz" | awk '{print $1}')"
          printf '%s\n' "$SOURCE_MAIN" > "$OUT/source-main.txt"
          printf '%s\n' "$SOURCE_TREE" > "$OUT/source-tree.txt"
          printf '%s\n' "$PATH_COUNT" > "$OUT/source-path-count.txt"
          printf '%s\n' "$ARCHIVE_BYTES" > "$OUT/source-archive-bytes.txt"
          printf '%s\n' "$ARCHIVE_SHA256" > "$OUT/source-archive-sha256.txt"

          stage=final_live_source_reconciliation
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$SOURCE_MAIN"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$SOURCE_MAIN"

          stage=seal_terminal_receipt
          jq -n \
            --arg source_main "$SOURCE_MAIN" \
            --arg source_tree "$SOURCE_TREE" \
            --argjson source_path_count "$PATH_COUNT" \
            --argjson source_archive_bytes "$ARCHIVE_BYTES" \
            --arg source_archive_sha256 "$ARCHIVE_SHA256" \
            '{schema_version:"ssc-rd04-mt-row-state-source-export@2",
              state:"source_export_complete",failed_or_final_stage:"complete",exit_code:0,
              source_main:$source_main,source_tree:$source_tree,
              source_path_count:$source_path_count,
              source_archive_bytes:$source_archive_bytes,
              source_archive_sha256:$source_archive_sha256,
              archive_member_type:"regular_files_only_for_path_denominator",
              source_requests:0,route_executions:0,source_admissions:0,
              matrix_updates:0,field_terminalizations:0,row_state_mutations:0,
              class_closed:false,cumulative_ledger_effect:"none",
              outside_human_dependency:false,publication_effect:"none",
              adoption_effect:"none",graph_effect:"none",
              next_authorized_operation:"construct and qualify the derivative Montana row-state product over this exact canonical source archive"}' > "$OUT/receipt.json"
          stage=complete
          printf '%s\n' "$stage" > "$OUT/STAGE"
          printf '%s\n' 0 > "$OUT/EXIT_CODE"

      - name: Upload exact source custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-current-main-source-v2
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: true

      - name: Require terminal export
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          test "${{ steps.export.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e '
            .schema_version=="ssc-rd04-mt-row-state-source-export@2" and
            .state=="source_export_complete" and
            .failed_or_final_stage=="complete" and .exit_code==0 and
            .source_main=="b1d1d8afb6c957401a762bf9d0b2abc464bd5e07" and
            .source_tree=="64f5b5e9e9d72bdf86ef6cf14d728b2ae996f834" and
            .source_path_count>0 and .source_archive_bytes>0 and
            (.source_archive_sha256|length)==64 and
            .source_requests==0 and .route_executions==0 and .source_admissions==0 and
            .matrix_updates==0 and .field_terminalizations==0 and .row_state_mutations==0 and
            .class_closed==false and .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and
            .publication_effect=="none" and .adoption_effect=="none" and .graph_effect=="none"
          ' "$OUT/receipt.json" > /dev/null
