name: Temporary PC-29 exact product materializer

on:
  pull_request:
    paths:
      - '.pc29/payload.part-*'
      - '.github/workflows/pc29-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc29-exact-product-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-equilibrium-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify and extract the exact twelve-file product
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import subprocess
          import tarfile

          expected_xz_sha256 = 'b9fe8eb1fefa1511bb04dd80cb59786b8b6d3c02305faebd33f4e7881910f110'
          expected = {
              'data/research/preference-custody/equilibrium-assurance.fixture.json': '61f1a76cc7664fa982043d71159831f5628066902d1f03386c111440a6152737',
              'tools/lib/preference-equilibrium-assurance.mjs': '1968500d25ef8e2be726347b0ec22cb2fcdcabe6eea9da554e26797bd031a881',
              'tools/compile-preference-equilibrium-assurance.mjs': '570dadb84be90f58a4daadf32fee9abe751acae42201246f41d12a609e8e9007',
              'tools/validate-preference-equilibrium-assurance.mjs': '669eafd7800b93fb7fedecb34d64abb3040ecf4793befd3dddfc16a11eca978b',
              'test/preference-equilibrium-assurance.test.js': '54084104fbd1c239ea1f0b64663d47ef42e48ade27f38ffe57a4320d89542d48',
              'docs/preference-custody-equilibrium-assurance.md': '99f4be65448b5e013c7532a9900f1943e2b8826661fb85b51db7cf7793474e52',
              'data/research/preference-custody/control-manifest-v27.json': '2accac8c9b4d3e6b9f75d2d7ef52ec99adabbc5b29e92e655d77f1f47c77b308',
              'tools/lib/preference-custody-manifest-v27.mjs': '0492e824430cff6a14ac84e173d541674a606fd75d38b96f93739583407f3cd5',
              'tools/compile-preference-custody-manifest-v27.mjs': '829d71af8437a1dd772834335b58c93df304f778f1b2d1ac4dca2bc0acbede06',
              'tools/validate-preference-custody-manifest-v27.mjs': '2675fdd42857911a7f6a579ac8898ab8d089b6214cb1f1214cb64684d6ac1ff7',
              'test/preference-custody-manifest-v27.test.js': 'aeffe0d77f9760126a2eacb892af4b36d8e4a935c397176e5140d62c9b8fd472',
              'docs/preference-custody-laboratory-floor-v27.md': '45f8d19fecd99e47648bb4e134c5f2b28a0eaa1eafc4b4be267f0cf725c74279',
          }

          parts = sorted(Path('.pc29').glob('payload.part-*'))
          if [path.name for path in parts] != [f'payload.part-{index:02d}' for index in range(4)]:
              raise SystemExit(f'expected four ordered payload shards, found {[path.name for path in parts]}')

          encoded = ''.join(''.join(path.read_text().split()) for path in parts)
          try:
              xz_bytes = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'invalid payload base64: {error}')
          actual_xz_sha256 = hashlib.sha256(xz_bytes).hexdigest()
          if actual_xz_sha256 != expected_xz_sha256:
              raise SystemExit(f'payload xz SHA-256 mismatch: {actual_xz_sha256}')

          with tarfile.open(fileobj=io.BytesIO(xz_bytes), mode='r:xz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f'archive path/order mismatch: {names}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member must be a regular file: {member.name}')
                  if Path(member.name).is_absolute() or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())

          observed = {}
          for name, required_sha256 in expected.items():
              raw = Path(name).read_bytes()
              actual_sha256 = hashlib.sha256(raw).hexdigest()
              if actual_sha256 != required_sha256:
                  raise SystemExit(f'file SHA-256 mismatch for {name}: {actual_sha256}')
              observed[name] = {'bytes': len(raw), 'sha256': actual_sha256}

          receipt = {
              'schema_version': 'pc29-materialization-receipt@1',
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'payload_xz_sha256': actual_xz_sha256,
              'permanent_nonworkflow_file_count': len(expected),
              'files': observed,
              'outside_human_dependency': False,
          }
          Path('/tmp/pc29-materialization-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Qualify standalone PC-29 and compositional floor v27
        run: |
          node tools/compile-preference-equilibrium-assurance.mjs
          node tools/validate-preference-equilibrium-assurance.mjs
          node test/preference-equilibrium-assurance.test.js
          node tools/compile-preference-custody-manifest-v27.mjs
          node tools/validate-preference-custody-manifest-v27.mjs
          node test/preference-custody-manifest-v27.test.js
      - name: Commit only the exact product and retire all payload shards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/research/preference-custody/equilibrium-assurance.fixture.json \
            tools/lib/preference-equilibrium-assurance.mjs \
            tools/compile-preference-equilibrium-assurance.mjs \
            tools/validate-preference-equilibrium-assurance.mjs \
            test/preference-equilibrium-assurance.test.js \
            docs/preference-custody-equilibrium-assurance.md \
            data/research/preference-custody/control-manifest-v27.json \
            tools/lib/preference-custody-manifest-v27.mjs \
            tools/compile-preference-custody-manifest-v27.mjs \
            tools/validate-preference-custody-manifest-v27.mjs \
            test/preference-custody-manifest-v27.test.js \
            docs/preference-custody-laboratory-floor-v27.md
          git rm -- .pc29/payload.part-00 .pc29/payload.part-01 .pc29/payload.part-02 .pc29/payload.part-03
          python - <<'PY'
          import subprocess
          expected = sorted([
              'data/research/preference-custody/equilibrium-assurance.fixture.json',
              'tools/lib/preference-equilibrium-assurance.mjs',
              'tools/compile-preference-equilibrium-assurance.mjs',
              'tools/validate-preference-equilibrium-assurance.mjs',
              'test/preference-equilibrium-assurance.test.js',
              'docs/preference-custody-equilibrium-assurance.md',
              'data/research/preference-custody/control-manifest-v27.json',
              'tools/lib/preference-custody-manifest-v27.mjs',
              'tools/compile-preference-custody-manifest-v27.mjs',
              'tools/validate-preference-custody-manifest-v27.mjs',
              'test/preference-custody-manifest-v27.test.js',
              'docs/preference-custody-laboratory-floor-v27.md',
              '.pc29/payload.part-00',
              '.pc29/payload.part-01',
              '.pc29/payload.part-02',
              '.pc29/payload.part-03',
          ])
          observed = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if observed != expected:
              raise SystemExit(f'staged path mismatch:\nexpected={expected}\nobserved={observed}')
          print(f'exact staged path set verified: {len(observed)} paths')
          PY
          git commit -m 'Materialize PC-29 and Preference Custody floor v27'
          git push origin HEAD:research/preference-equilibrium-assurance-v1
      - name: Preserve the exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc29-exact-materialization-receipt
          path: /tmp/pc29-materialization-receipt.json
          if-no-files-found: error
