name: TEMP replay School.House Archive locator transport failures

on:
  pull_request:
    paths:
      - '.github/workflows/temp-schoolhouse-first-party-archive-locator-replay.yml'
      - '.schoolhouse-first-party-archive-locator-replay/EXECUTE'
      - '.schoolhouse-first-party-archive-locator-replay/retry-input.json.gz.b64'
      - '.schoolhouse-first-party-archive-locator-replay/replay.py.gz.b64'
  workflow_dispatch:

concurrency:
  group: temp-schoolhouse-first-party-archive-locator-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate exact retry denominator and runner
        run: |
          set -Eeuo pipefail
          BASE_MAIN='1099c9f53fa2b07a96ea9d0cd108d9332eccfb96'
          INPUT_BUNDLE='.schoolhouse-first-party-archive-locator-replay/retry-input.json.gz.b64'
          INPUT='/tmp/schoolhouse-first-party-archive-locator-retry-input.json'
          BUNDLE='.schoolhouse-first-party-archive-locator-replay/replay.py.gz.b64'
          EXECUTE='.schoolhouse-first-party-archive-locator-replay/EXECUTE'
          RUNNER='/tmp/replay-schoolhouse-first-party-archive-locator.py'
          OUT='/tmp/schoolhouse-first-party-archive-locator-replay'

          mkdir -p "$OUT"
          printf 'validation_started\n' > "$OUT/validation-state.txt"
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "$BASE_MAIN"
          git merge-base --is-ancestor "$BASE_MAIN" origin/main

          for file in "$INPUT_BUNDLE" "$BUNDLE" "$EXECUTE"; do
            TREE_BLOB=$(git ls-tree HEAD -- "$file" | awk '{print $3}')
            test -n "$TREE_BLOB"
            test "$(git hash-object "$file")" = "$TREE_BLOB"
          done
          git diff --exit-code -- "$INPUT_BUNDLE" "$BUNDLE" "$EXECUTE"

          grep -Fx 'retry_input_rows=26' "$EXECUTE"
          grep -Fx 'retry_input_sha256=66e50114a328785bd7dca89e321bfde05027d77d21bab4023868af6ed5197a85' "$EXECUTE"
          grep -Fx 'runner_sha256=090c126d323ecae340c878239a6731fedac4a43a976554d26b2dacd404ff13b7' "$EXECUTE"
          grep -Fx 'maximum_parallel_workers=1' "$EXECUTE"
          grep -Fx 'inter_query_delay_seconds=3' "$EXECUTE"
          grep -Fx 'archived_page_bodies_fetched=false' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"

          base64 -d "$INPUT_BUNDLE" | gzip -dc > "$INPUT"
          test "$(sha256sum "$INPUT" | awk '{print $1}')" = '66e50114a328785bd7dca89e321bfde05027d77d21bab4023868af6ed5197a85'
          jq -e '
            .schema_version == "schoolhouse-first-party-archive-locator-retry-input@1" and
            .baseline.workflow_run_id == 30995963355 and
            .baseline.artifact_id == 8926199862 and
            .baseline.artifact_digest == "sha256:1db8ed490991492167b6b9c2a2fbaaaca83ae8f09d036457dbd151202c0cc103" and
            .baseline.route_results_sha256 == "713f5e8f973c277706131112b0c8bc68eba69ab8fd8e5470c58e2a53bc966e0e" and
            .baseline.snapshot_locators_sha256 == "10d03c93d0a45b41e8a77937b08a1acb1ebdf7c0fe5b377aa8b55be9c4036b0c" and
            .baseline.source_routes == 46 and
            (.routes | length) == 26 and
            ([.routes[].source_route_id] | unique | length) == 26 and
            ([.routes[].baseline_archive_query_url_sha256] | unique | length) == 26 and
            ([.routes[].baseline_state] | unique) == ["terminal_archive_transport_error_not_absence_evidence"] and
            ([.routes[].baseline_request_attempts] | unique) == [1]
          ' "$INPUT"

          base64 -d "$BUNDLE" | gzip -dc > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = '090c126d323ecae340c878239a6731fedac4a43a976554d26b2dacd404ff13b7'
          python -m py_compile "$RUNNER"
          printf 'validation_passed\n' > "$OUT/validation-state.txt"

      - name: Execute one bounded replay attempt per failed route
        run: |
          set -Eeuo pipefail
          INPUT='/tmp/schoolhouse-first-party-archive-locator-retry-input.json'
          OUT='/tmp/schoolhouse-first-party-archive-locator-replay'
          rm -rf "$OUT"
          python /tmp/replay-schoolhouse-first-party-archive-locator.py --input "$INPUT" --output "$OUT"

          for file in summary.json route-policy.json artifact-manifest.json replay-route-results.jsonl archive-snapshot-locators.jsonl SHA256SUMS; do
            test -f "$OUT/$file"
          done

          cat "$OUT/summary.json"
          jq -e '
            .declared_retry_routes == 26 and
            .terminal_replay_rows == 26 and
            .archive_api_queries == 26 and
            .replay_request_attempts == 26 and
            .maximum_parallel_workers == 1 and
            .inter_query_delay_seconds == 3 and
            .maximum_results_per_route == 1000 and
            .result_caps_exhausted >= 0 and
            .result_caps_exhausted <= 26 and
            .archived_bodies_fetched == 0 and
            .interactive_search_submissions == 0 and
            .organization_name_submissions == 0 and
            .identifier_submissions == 0 and
            .source_rows_acquired == 0 and
            .street_address_rows_retained == 0 and
            .contact_detail_rows_retained == 0 and
            .private_support_rows == 0 and
            .identities_admitted == 0 and
            .negative_existence_claims_created == 0 and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none"
          ' "$OUT/summary.json"
          test "$(grep -cve '^$' "$OUT/replay-route-results.jsonl")" = '26'
          jq -e '
            .source_denominator.replayed_transport_error_routes == 26 and
            .source_denominator.source_baseline_routes == 46 and
            .archive_api.exact_url_queries == 26 and
            .archive_api.maximum_parallel_workers == 1 and
            .archive_api.archived_page_bodies_fetched == false and
            .interpretation.zero_rows_after_replay_is_not_absence == true and
            .interpretation.provider_error_after_replay_is_not_absence == true and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none"
          ' "$OUT/route-policy.json"
          jq -e '
            .raw_source_retained == false and
            .archived_bodies_fetched == false and
            .identity_admitted == false and
            .negative_existence_claim_created == false and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none"
          ' "$OUT/artifact-manifest.json"
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schoolhouse-first-party-archive-locator-replay
          path: /tmp/schoolhouse-first-party-archive-locator-replay
          if-no-files-found: error
          retention-days: 90
