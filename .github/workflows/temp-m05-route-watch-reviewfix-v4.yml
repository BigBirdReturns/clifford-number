name: TEMP publish hardened M-05 route-watch review fixes v4

on:
  push:
    branches:
      - agent/m05-s03-l7-route-watch-reviewfix-carrier-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-s03-l7-route-watch-reviewfix-carrier-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, qualify, and publish the hardened six-path product
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_BASE='bbd03eb3bf9a6eee1eb9d8a6f82d6829fe3d2237'
          EXPECTED_PRODUCT='c49933c7c69084fe3f78327018c5f502e437b752'
          PRODUCT_BRANCH='agent/m05-s03-l7-five-domain-route-watch-v1'
          PRODUCT_DIR='/tmp/m05-route-watch-reviewfix-product-v4'
          SNAPSHOT_DIR='/tmp/m05-route-watch-reviewfix-snapshot-v4'
          PATCHER_ONE="$GITHUB_WORKSPACE/tools/temp-m05-route-watch-reviewfix-v2.py"
          PATCHER_TWO="$GITHUB_WORKSPACE/tools/temp-m05-route-watch-run-selection-fix.py"

          WORKFLOW='.github/workflows/m05-five-domain-route-watch.yml'
          CONTRACT='data/project/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch-contract.json'
          TEST='test/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.test.js'
          LIBRARY='tools/lib/m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          RUNNER='tools/run-m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          VALIDATOR='tools/validate-m05-answerable-power-sprint-03-leg-07-five-domain-route-watch.mjs'
          PRODUCT_PATHS=("$WORKFLOW" "$CONTRACT" "$TEST" "$LIBRARY" "$RUNNER" "$VALIDATOR")

          git fetch --no-tags origin main "$PRODUCT_BRANCH"
          BASE="$(git rev-parse origin/main)"
          CURRENT_PRODUCT="$(git rev-parse "origin/$PRODUCT_BRANCH")"
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "Canonical main moved: expected $EXPECTED_BASE, found $BASE" >&2; exit 2; }
          [[ "$CURRENT_PRODUCT" == "$EXPECTED_PRODUCT" ]] || { echo "Product lease moved: expected $EXPECTED_PRODUCT, found $CURRENT_PRODUCT" >&2; exit 2; }

          rm -rf "$PRODUCT_DIR" "$SNAPSHOT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$BASE"
          cd "$PRODUCT_DIR"
          git checkout "$EXPECTED_PRODUCT" -- "${PRODUCT_PATHS[@]}"
          python "$PATCHER_ONE" "$PRODUCT_DIR"
          python "$PATCHER_TWO" "$PRODUCT_DIR"

          mkdir -p "$SNAPSHOT_DIR"
          for product_path in "${PRODUCT_PATHS[@]}"; do
            cp --parents "$product_path" "$SNAPSHOT_DIR"
          done
          (cd "$SNAPSHOT_DIR" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/m05-route-watch-reviewfix-v4.sha256

          node --check "$LIBRARY"
          node --check "$RUNNER"
          node --check "$VALIDATOR"
          node --check "$TEST"
          node "$VALIDATOR"
          node "$TEST"
          npm run release:check
          for product_path in "${PRODUCT_PATHS[@]}"; do
            cmp "$product_path" "$SNAPSHOT_DIR/$product_path"
          done

          git reset --hard "$BASE"
          git clean -fdx
          cp -a "$SNAPSHOT_DIR/." .
          sha256sum -c /tmp/m05-route-watch-reviewfix-v4.sha256

          node --check "$LIBRARY"
          node --check "$RUNNER"
          node --check "$VALIDATOR"
          node --check "$TEST"
          node "$VALIDATOR"
          node "$TEST"
          git diff --check

          mapfile -t EXPECTED_PATHS < <(printf '%s\n' "${PRODUCT_PATHS[@]}" | sort)
          mapfile -t ACTUAL_PATHS < <(git diff --name-only "$BASE" | sort)
          [[ "${#ACTUAL_PATHS[@]}" -eq 6 ]] || { printf 'Unexpected product path count: %s\n' "${#ACTUAL_PATHS[@]}" >&2; exit 2; }
          [[ "$(printf '%s\n' "${EXPECTED_PATHS[@]}")" == "$(printf '%s\n' "${ACTUAL_PATHS[@]}")" ]] || {
            printf 'Expected paths:\n%s\nActual paths:\n%s\n' "$(printf '%s\n' "${EXPECTED_PATHS[@]}")" "$(printf '%s\n' "${ACTUAL_PATHS[@]}")" >&2
            exit 2
          }

          grep -Fq 'actions: read' "$WORKFLOW"
          grep -Fq 'actions/runs/${run_id}/artifacts' "$WORKFLOW"
          grep -Fq 'select(.head_branch=="main")' "$WORKFLOW"
          ! grep -Fq 'branch=main&status=success' "$WORKFLOW"
          grep -Fq -- '--previous "$PREVIOUS_RECEIPT"' "$WORKFLOW"
          grep -Fq 'metadata_only flag is incoherent' "$LIBRARY"
          grep -Fq 'content_retrieved requires positive body bytes' "$LIBRARY"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${PRODUCT_PATHS[@]}"
          git commit -m '[M-05 S03-L7] Close route-watch comparison and receipt-state review gaps'

          PRODUCT="$(git rev-parse HEAD)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          PARENT="$(git rev-parse 'HEAD^')"
          [[ "$PARENT" == "$BASE" ]]
          [[ "$(git diff --name-only "$BASE" "$PRODUCT" | wc -l | tr -d ' ')" == '6' ]]

          WORKFLOW_BLOB="$(git rev-parse "HEAD:$WORKFLOW")"
          CONTRACT_BLOB="$(git rev-parse "HEAD:$CONTRACT")"
          TEST_BLOB="$(git rev-parse "HEAD:$TEST")"
          LIBRARY_BLOB="$(git rev-parse "HEAD:$LIBRARY")"
          RUNNER_BLOB="$(git rev-parse "HEAD:$RUNNER")"
          VALIDATOR_BLOB="$(git rev-parse "HEAD:$VALIDATOR")"

          [[ "$CONTRACT_BLOB" == '32602ed6b3181b7bed967bc9c173a5ebcff83f2e' ]]
          [[ "$RUNNER_BLOB" == '0b647e203a9683a838565f30754d5b03378ac1e7' ]]
          [[ "$VALIDATOR_BLOB" == 'a029596b949b12db586f2ce72b61c442c38ac3a5' ]]

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          REMOTE_PRODUCT="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          [[ "$REMOTE_MAIN" == "$BASE" ]] || { echo "Canonical main moved before publication" >&2; exit 2; }
          [[ "$REMOTE_PRODUCT" == "$EXPECTED_PRODUCT" ]] || { echo "Product branch moved before publication" >&2; exit 2; }
          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$EXPECTED_PRODUCT" origin "$PRODUCT:refs/heads/$PRODUCT_BRANCH"

          RECEIPT_DIR="$GITHUB_WORKSPACE/build/m05-route-watch-reviewfix-v4"
          mkdir -p "$RECEIPT_DIR"
          BASE="$BASE" PREVIOUS_PRODUCT="$EXPECTED_PRODUCT" PRODUCT="$PRODUCT" TREE="$TREE" WORKFLOW_BLOB="$WORKFLOW_BLOB" CONTRACT_BLOB="$CONTRACT_BLOB" TEST_BLOB="$TEST_BLOB" LIBRARY_BLOB="$LIBRARY_BLOB" RUNNER_BLOB="$RUNNER_BLOB" VALIDATOR_BLOB="$VALIDATOR_BLOB" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              'schema_version': 'm05-route-watch-reviewfix-receipt@4',
              'object_class': 'bounded_route_watch_review_fix',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'canonical_parent': os.environ['BASE'],
              'replaced_product_commit': os.environ['PREVIOUS_PRODUCT'],
              'product_commit': os.environ['PRODUCT'],
              'product_tree': os.environ['TREE'],
              'changed_paths': 6,
              'review_repairs': {
                  'previous_validated_receipt_loaded_from_latest_successful_main_artifact': True,
                  'main_run_selection_is_client_side': True,
                  'server_side_branch_filter_used': False,
                  'complete_terminal_status_coherence_enforced': True,
                  'self_hash_recalculation_bypass_regressed': True,
                  'response_bodies_retained': False,
                  'authority_changed': False
              },
              'blobs': {
                  'workflow': os.environ['WORKFLOW_BLOB'],
                  'contract': os.environ['CONTRACT_BLOB'],
                  'test': os.environ['TEST_BLOB'],
                  'library': os.environ['LIBRARY_BLOB'],
                  'runner': os.environ['RUNNER_BLOB'],
                  'validator': os.environ['VALIDATOR_BLOB']
              },
              'focused_validation': 'passed_twice',
              'release_check': 'passed',
              'source_requests': 0,
              'qualifying_evidence_receipts': 0,
              'answer_changes_authorized': False,
              'graph_effect': 'none',
              'issue_345_may_close': False
          }
          Path(os.environ['GITHUB_WORKSPACE'], 'build/m05-route-watch-reviewfix-v4/receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

          {
            echo '# M-05 route-watch review fixes v4'
            echo
            echo "- Canonical parent: $BASE"
            echo "- Replaced product: $EXPECTED_PRODUCT"
            echo "- Product commit: $PRODUCT"
            echo "- Product tree: $TREE"
            echo "- Workflow blob: $WORKFLOW_BLOB"
            echo "- Library blob: $LIBRARY_BLOB"
            echo "- Test blob: $TEST_BLOB"
            echo '- Changed paths: 6'
            echo '- Client-side main-run selection: true'
            echo '- Complete release gate: passed'
            echo '- Source requests: 0'
            echo '- Graph effect: none'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: m05-route-watch-reviewfix-v4-${{ github.run_id }}
          path: build/m05-route-watch-reviewfix-v4/
          if-no-files-found: error
          retention-days: 30
