name: TEMP prove canonical School.House historical filing website custody

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolhouse-historical-filing-website-postmerge-proof-b320
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove exact canonical merge and replay every gate
        shell: bash
        run: |
          set -Eeuo pipefail
          MERGE='b320e380723600fe39c3aa711a09d3d861f756c2'
          PARENT='08288d7358bd9d2a14babd9893cecea61cdb7334'
          PRODUCT='e8944e90668c152ed18de94a8b3d548c60058921'
          TREE='50801e462a7e5d170a65dd0612e7ff1b96d75dd8'
          WORKFLOW='.github/workflows/temp-schoolhouse-irs-historical-filing-website-screen-postmerge-proof-b320.yml'
          RECEIPT="$RUNNER_TEMP/schoolhouse-historical-filing-website-postmerge-proof-b320"
          mkdir -p "$RECEIPT"

          git fetch --no-tags origin main
          MAIN="$(git rev-parse origin/main)"
          test "$MAIN" = "$MERGE"
          test "$(git rev-parse "$MERGE^1")" = "$PARENT"
          test "$(git rev-parse "$MERGE^2")" = "$PRODUCT"
          test "$(git rev-parse "$PRODUCT^")" = "$PARENT"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$TREE"
          test "$(git rev-parse "$MERGE^{tree}")" = "$TREE"
          git merge-base --is-ancestor "$PRODUCT" "$MERGE"

          mapfile -t PROOF_DELTA < <(git diff --name-only origin/main HEAD)
          test "${#PROOF_DELTA[@]}" -eq 1
          test "${PROOF_DELTA[0]}" = "$WORKFLOW"

          cat > "$RECEIPT/expected-paths.txt" <<'PATHS'
          data/intake/schoolhouse-irs-historical-filing-website-screen-v1/SHA256SUMS
          data/intake/schoolhouse-irs-historical-filing-website-screen-v1/product-manifest.json
          data/intake/schoolhouse-irs-historical-filing-website-screen-v1/sealed-acquisition-artifact.zip
          data/intake/schoolhouse-irs-historical-filing-website-screen-v1/source-custody.json
          docs/milestones/schoolhouse-irs-historical-filing-website-screen-v1.md
          tools/build-schoolhouse-irs-historical-filing-website-screen-custody.mjs
          tools/test-schoolhouse-irs-historical-filing-website-screen-custody.mjs
          tools/validate-schoolhouse-irs-historical-filing-website-screen-custody.mjs
          PATHS
          sed -i 's/^          //' "$RECEIPT/expected-paths.txt"
          git diff --name-status "$PARENT" "$PRODUCT" > "$RECEIPT/product-name-status.txt"
          python - <<'PY'
          from pathlib import Path
          receipt = Path('/tmp')
          expected = set(Path('${{ runner.temp }}/schoolhouse-historical-filing-website-postmerge-proof-b320/expected-paths.txt').read_text().splitlines())
          rows = Path('${{ runner.temp }}/schoolhouse-historical-filing-website-postmerge-proof-b320/product-name-status.txt').read_text().splitlines()
          observed = set()
          for row in rows:
              status, path = row.split('\t', 1)
              if status != 'A':
                  raise SystemExit(f'non-addition product path: {row}')
              observed.add(path)
          if observed != expected:
              raise SystemExit(f'product path-set drift: {sorted(observed ^ expected)}')
          print('canonical_product_surface=8_addition_only_workflow_free')
          PY
          test -z "$(git diff --name-only "$PARENT" "$PRODUCT" | grep '^\.github/' || true)"

          {
            node --check tools/build-schoolhouse-irs-historical-filing-website-screen-custody.mjs
            node --check tools/validate-schoolhouse-irs-historical-filing-website-screen-custody.mjs
            node --check tools/test-schoolhouse-irs-historical-filing-website-screen-custody.mjs
            node tools/build-schoolhouse-irs-historical-filing-website-screen-custody.mjs --check
            node tools/validate-schoolhouse-irs-historical-filing-website-screen-custody.mjs
            node tools/test-schoolhouse-irs-historical-filing-website-screen-custody.mjs
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
          } 2>&1 | tee "$RECEIPT/focused-gates.log"
          grep -qx 'historical_filing_website_adversarial_refusals=6' "$RECEIPT/focused-gates.log"
          npm run release:check 2>&1 | tee "$RECEIPT/release-check.log"

          git restore --staged --worktree .
          git clean -fdx
          node tools/build-schoolhouse-irs-historical-filing-website-screen-custody.mjs --write
          node tools/build-schoolhouse-irs-historical-filing-website-screen-custody.mjs --check
          node tools/validate-schoolhouse-irs-historical-filing-website-screen-custody.mjs
          node tools/test-schoolhouse-irs-historical-filing-website-screen-custody.mjs
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python - <<'PY'
          import json
          from pathlib import Path
          receipt = {
              'schema_version': 'schoolhouse-irs-historical-filing-website-postmerge-proof@1',
              'canonical_main': 'b320e380723600fe39c3aa711a09d3d861f756c2',
              'canonical_parent': '08288d7358bd9d2a14babd9893cecea61cdb7334',
              'product_commit': 'e8944e90668c152ed18de94a8b3d548c60058921',
              'product_tree': '50801e462a7e5d170a65dd0612e7ff1b96d75dd8',
              'merge_tree': '50801e462a7e5d170a65dd0612e7ff1b96d75dd8',
              'product_paths': 8,
              'addition_only': True,
              'workflow_paths_in_product': 0,
              'historical_exact_locator_rows': 180,
              'screened_official_xml_rows': 180,
              'website_field_present_rows': 161,
              'candidate_legal_name_alignment_rows': 149,
              'exact_school_house_website_host_rows': 0,
              'identifier_grade_candidate_rows': 0,
              'adversarial_refusals': 6,
              'no_magic_human_adversarial_mutations': 23,
              'identities_admitted': 0,
              'relationships_admitted': 0,
              'negative_existence_claims': 0,
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'focused_validation': 'pass',
              'complete_release_gate': 'pass',
              'clean_replay': 'pass',
              'status': 'complete',
          }
          output = Path('${{ runner.temp }}/schoolhouse-historical-filing-website-postmerge-proof-b320/proof.json')
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
          sha256sum "$RECEIPT"/* > "$RECEIPT/SHA256SUMS"

      - name: Preserve canonical post-merge proof
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-historical-filing-website-postmerge-proof-b320
          path: ${{ runner.temp }}/schoolhouse-historical-filing-website-postmerge-proof-b320
          if-no-files-found: error
          retention-days: 90
