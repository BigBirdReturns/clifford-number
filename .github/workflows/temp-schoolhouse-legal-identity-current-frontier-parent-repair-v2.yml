name: TEMP repair School.House current-frontier parent custody v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-legal-identity-current-frontier-parent-repair-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: schoolhouse-current-frontier-parent-repair-v2-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-legal-identity-current-frontier-parent-repair-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Correct exact parent bindings and publish one-parent product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CARRIER_BASE='3918c799f8b8dcdac49c33cec5c7bbd01ac428e4'
          WORKFLOW='.github/workflows/temp-schoolhouse-legal-identity-current-frontier-parent-repair-v2.yml'
          OLD_PARENT='987f1b2574eeddaba49d67c1c1498a81d40f7c69'
          OLD_PARENT_TREE='f805cde651c5236e0918baba558e0da1be77b556'
          CORRECT_PARENT='2aaadb3b87c83a8cf79ded7046a3856101bf943b'
          CORRECT_PARENT_TREE='1a6690047ea1919fe4b63b1a4eb287b78459241b'
          OLD_PRODUCT='91c831a76f1af7b63fc4a1b8e26d3c5c093a17fb'
          OLD_PRODUCT_TREE='53efada1f97e68a392299b771d12a68e36d972b5'
          OLD_MERGE='3918c799f8b8dcdac49c33cec5c7bbd01ac428e4'
          TARGET='agent/schoolhouse-legal-identity-current-frontier-product-v2'
          RECEIPT="$RUNNER_TEMP/schoolhouse-current-frontier-parent-repair-v2"
          WORKTREE="$RUNNER_TEMP/schoolhouse-current-frontier-parent-repair-v2-worktree"
          rm -rf "$RECEIPT" "$WORKTREE"
          mkdir -p "$RECEIPT"
          printf 'initializing-parent-repair-v2\n' > "$RECEIPT/STAGE"
          printf 'source_requests=0\nregistry_queries=0\nform_submissions=0\ncontacts=0\npayments=0\nuploads=0\n' > "$RECEIPT/BOUNDARY"

          finalize() {
            rc="$?"
            trap - EXIT
            printf '%s\n' "$rc" > "$RECEIPT/SCRIPT_EXIT_CODE"
            (
              cd "$RECEIPT"
              find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          cat > "$RECEIPT/product-paths.txt" <<'EOF_PATHS'
          data/intake/bvvc-defense-capital/acquisition-frontier.json
          data/intake/bvvc-defense-capital/manifest.json
          data/intake/bvvc-defense-capital/schoolhouse.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/canonical-slice-manifest.jsonl
          data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/next-source-gate.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/source-custody.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/source-lanes.json
          docs/milestones/schoolhouse-legal-identity-current-frontier-v1.md
          tools/validate-schoolhouse-legal-identity-current-frontier.py
          EOF_PATHS
          sed -i 's/^          //' "$RECEIPT/product-paths.txt"
          sort -o "$RECEIPT/product-paths.txt" "$RECEIPT/product-paths.txt"
          cat > "$RECEIPT/expected-status.txt" <<'EOF_STATUS'
          M	data/intake/bvvc-defense-capital/acquisition-frontier.json
          M	data/intake/bvvc-defense-capital/manifest.json
          M	data/intake/bvvc-defense-capital/schoolhouse.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/canonical-slice-manifest.jsonl
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/next-source-gate.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/source-custody.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/source-lanes.json
          A	docs/milestones/schoolhouse-legal-identity-current-frontier-v1.md
          A	tools/validate-schoolhouse-legal-identity-current-frontier.py
          EOF_STATUS
          sed -i 's/^          //' "$RECEIPT/expected-status.txt"
          sort -k2,2 -o "$RECEIPT/expected-status.txt" "$RECEIPT/expected-status.txt"

          printf 'proving-carrier-and-merged-product-topology\n' > "$RECEIPT/STAGE"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$OLD_MERGE"
          test "$(git rev-parse HEAD^)" = "$CARRIER_BASE"
          test "$(git rev-list --count "$CARRIER_BASE"..HEAD)" = '1'
          test "$(git diff --name-only "$CARRIER_BASE"..HEAD)" = "$WORKFLOW"
          git diff --check "$CARRIER_BASE"..HEAD
          test "$(git rev-parse "$OLD_PRODUCT^")" = "$CORRECT_PARENT"
          test "$(git rev-parse "$CORRECT_PARENT^{tree}")" = "$CORRECT_PARENT_TREE"
          test "$(git rev-parse "$OLD_PRODUCT^{tree}")" = "$OLD_PRODUCT_TREE"
          test "$(git rev-parse "$OLD_MERGE^1")" = "$CORRECT_PARENT"
          test "$(git rev-parse "$OLD_MERGE^2")" = "$OLD_PRODUCT"
          test "$(git rev-parse "$OLD_MERGE^{tree}")" = "$OLD_PRODUCT_TREE"
          git diff --name-only "$CORRECT_PARENT".."$OLD_PRODUCT" | sort > "$RECEIPT/old-product-paths.txt"
          diff -u "$RECEIPT/product-paths.txt" "$RECEIPT/old-product-paths.txt"
          test -z "$(git diff --name-only "$CORRECT_PARENT".."$OLD_PRODUCT" | grep '^\.github/workflows/' || true)"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$TARGET" > "$RECEIPT/preexisting-target-ref.txt"
          TARGET_RC="$?"
          set -e
          test "$TARGET_RC" -eq 2

          printf 'constructing-corrected-one-parent-product\n' > "$RECEIPT/STAGE"
          mapfile -t PRODUCT_PATHS < "$RECEIPT/product-paths.txt"
          git worktree add --detach "$WORKTREE" "$CORRECT_PARENT"
          git -C "$WORKTREE" checkout "$OLD_PRODUCT" -- "${PRODUCT_PATHS[@]}"

          python - "$WORKTREE" "$RECEIPT/parent-binding-repair.json" <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import hashlib
          import json
          import sys

          root = Path(sys.argv[1])
          receipt = Path(sys.argv[2])
          old_parent = '987f1b2574eeddaba49d67c1c1498a81d40f7c69'
          old_tree = 'f805cde651c5236e0918baba558e0da1be77b556'
          parent = '2aaadb3b87c83a8cf79ded7046a3856101bf943b'
          parent_tree = '1a6690047ea1919fe4b63b1a4eb287b78459241b'
          paths = [
              'data/intake/bvvc-defense-capital/acquisition-frontier.json',
              'data/intake/bvvc-defense-capital/manifest.json',
              'data/intake/bvvc-defense-capital/schoolhouse.json',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/canonical-slice-manifest.jsonl',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/next-source-gate.json',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/source-custody.json',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/source-lanes.json',
              'docs/milestones/schoolhouse-legal-identity-current-frontier-v1.md',
              'tools/validate-schoolhouse-legal-identity-current-frontier.py',
          ]
          expected_files = {
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json',
              'tools/validate-schoolhouse-legal-identity-current-frontier.py',
          }

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          before = {}
          parent_files = set()
          tree_files = set()
          parent_count = 0
          tree_count = 0
          for relative in paths:
              data = (root / relative).read_bytes()
              pcount = data.count(old_parent.encode())
              tcount = data.count(old_tree.encode())
              before[relative] = {
                  'bytes': len(data),
                  'sha256': sha256(data),
                  'old_parent_occurrences': pcount,
                  'old_tree_occurrences': tcount,
              }
              if pcount:
                  parent_files.add(relative)
                  parent_count += pcount
              if tcount:
                  tree_files.add(relative)
                  tree_count += tcount
          assert parent_count == 3, parent_count
          assert tree_count == 3, tree_count
          assert parent_files == expected_files, parent_files
          assert tree_files == expected_files, tree_files
          assert all(before[path]['old_parent_occurrences'] == 1 for path in expected_files)
          assert all(before[path]['old_tree_occurrences'] == 1 for path in expected_files)

          reconciliation_path = root / 'data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json'
          reconciliation = json.loads(reconciliation_path.read_text(encoding='utf-8'))
          assert reconciliation['product_parent'] == old_parent
          assert reconciliation['product_parent_tree'] == old_tree
          reconciliation['product_parent'] = parent
          reconciliation['product_parent_tree'] = parent_tree
          reconciliation_path.write_text(json.dumps(reconciliation, indent=2) + '\n', encoding='utf-8')

          validator_path = root / 'tools/validate-schoolhouse-legal-identity-current-frontier.py'
          validator = validator_path.read_text(encoding='utf-8')
          assert validator.count(old_parent) == 1
          assert validator.count(old_tree) == 1
          validator = validator.replace(old_parent, parent).replace(old_tree, parent_tree)
          validator_path.write_text(validator, encoding='utf-8')

          manifest_path = root / 'data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['canonical_parent'] == old_parent
          assert manifest['canonical_parent_tree'] == old_tree
          manifest['canonical_parent'] = parent
          manifest['canonical_parent_tree'] = parent_tree
          for relative in [
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json',
              'tools/validate-schoolhouse-legal-identity-current-frontier.py',
          ]:
              data = (root / relative).read_bytes()
              manifest['file_digests'][relative] = {'bytes': len(data), 'sha256': sha256(data)}
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          after = {}
          for relative in paths:
              data = (root / relative).read_bytes()
              assert old_parent.encode() not in data, relative
              assert old_tree.encode() not in data, relative
              after[relative] = {'bytes': len(data), 'sha256': sha256(data)}
          changed = sorted(relative for relative in paths if before[relative]['sha256'] != after[relative]['sha256'])
          assert changed == sorted(expected_files), changed
          receipt.write_text(json.dumps({
              'schema_version': 'schoolhouse-legal-identity-current-frontier-parent-binding-repair@1',
              'state': 'complete',
              'old_parent': old_parent,
              'old_parent_tree': old_tree,
              'correct_parent': parent,
              'correct_parent_tree': parent_tree,
              'old_parent_occurrences_replaced': parent_count,
              'old_tree_occurrences_replaced': tree_count,
              'changed_files': changed,
              'changed_file_count': len(changed),
              'product_payload_changes_outside_parent_custody': 0,
              'before': before,
              'after': after,
              'source_requests': 0,
              'registry_queries': 0,
              'form_submissions': 0,
              'identity_admissions': 0,
              'relationship_admissions': 0,
              'negative_existence_claims': 0,
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'public_schoolhouse_legal_identity': 'unresolved',
          }, indent=2, sort_keys=True) + '\n')
          PY

          git -C "$WORKTREE" add -- "${PRODUCT_PATHS[@]}"
          git -C "$WORKTREE" diff --cached --name-status | sort -k2,2 > "$RECEIPT/corrected-product-status.txt"
          diff -u "$RECEIPT/expected-status.txt" "$RECEIPT/corrected-product-status.txt"
          git -C "$WORKTREE" diff --cached --check
          git -C "$WORKTREE" config user.name 'School.House custody materializer'
          git -C "$WORKTREE" config user.email 'schoolhouse-custody@users.noreply.github.com'
          git -C "$WORKTREE" commit -m 'Correct School.House current-frontier parent custody'
          PRODUCT="$(git -C "$WORKTREE" rev-parse HEAD)"
          PRODUCT_TREE="$(git -C "$WORKTREE" rev-parse HEAD^{tree})"
          test "$(git -C "$WORKTREE" rev-parse HEAD^)" = "$CORRECT_PARENT"
          test "$(git -C "$WORKTREE" rev-list --count "$CORRECT_PARENT"..HEAD)" = '1'
          git -C "$WORKTREE" diff --name-only "$CORRECT_PARENT"..HEAD | sort > "$RECEIPT/corrected-product-paths.txt"
          diff -u "$RECEIPT/product-paths.txt" "$RECEIPT/corrected-product-paths.txt"
          test -z "$(git -C "$WORKTREE" diff --name-only "$CORRECT_PARENT"..HEAD | grep '^\.github/workflows/' || true)"
          git -C "$WORKTREE" ls-tree -r HEAD -- "${PRODUCT_PATHS[@]}" > "$RECEIPT/corrected-product-ls-tree.txt"

          printf 'qualifying-corrected-product\n' > "$RECEIPT/STAGE"
          (
            cd "$WORKTREE"
            python tools/validate-schoolhouse-legal-identity-current-frontier.py --self-test | tee "$RECEIPT/focused-validator.log"
            node tools/validate-bvvc-defense-capital.mjs | tee "$RECEIPT/bvvc-validator.log"
            node tools/validate-no-magic-human-gate.mjs | tee "$RECEIPT/no-magic-human.log"
            node test/no-magic-human-gate.test.js | tee -a "$RECEIPT/no-magic-human.log"
            npm run release:check | tee "$RECEIPT/release-check.log"
            git restore --staged --worktree .
            git clean -fdx
            python tools/validate-schoolhouse-legal-identity-current-frontier.py --self-test | tee "$RECEIPT/focused-validator-replay.log"
            node tools/validate-bvvc-defense-capital.mjs | tee "$RECEIPT/bvvc-validator-replay.log"
            node tools/validate-no-magic-human-gate.mjs | tee "$RECEIPT/no-magic-human-replay.log"
            git diff --check
            git diff --exit-code
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )

          printf 'rechecking-leases-and-publishing\n' > "$RECEIPT/STAGE"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$OLD_MERGE"
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$TARGET" > "$RECEIPT/final-target-ref.txt"
          TARGET_RC="$?"
          set -e
          test "$TARGET_RC" -eq 2
          git -C "$WORKTREE" push origin "HEAD:refs/heads/$TARGET" |& tee "$RECEIPT/push.log"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$PRODUCT"

          python - "$RECEIPT/materialization.json" "$PRODUCT" "$PRODUCT_TREE" <<'PY'
          from pathlib import Path
          import json, sys
          output, product, product_tree = sys.argv[1:]
          Path(output).write_text(json.dumps({
              'schema_version': 'schoolhouse-legal-identity-current-frontier-corrected-product-materialization@1',
              'status': 'complete',
              'superseded_product_commit': '91c831a76f1af7b63fc4a1b8e26d3c5c093a17fb',
              'superseded_merge_commit': '3918c799f8b8dcdac49c33cec5c7bbd01ac428e4',
              'canonical_parent': '2aaadb3b87c83a8cf79ded7046a3856101bf943b',
              'canonical_parent_tree': '1a6690047ea1919fe4b63b1a4eb287b78459241b',
              'product_commit': product,
              'product_tree': product_tree,
              'product_commit_count': 1,
              'permanent_path_count': 11,
              'modified_path_count': 3,
              'added_path_count': 8,
              'workflow_paths': 0,
              'source_slice_files': 233,
              'source_lanes': 23,
              'active_source_leases': 0,
              'candidate_successors': 0,
              'parent_binding_files_repaired': 3,
              'parent_occurrences_replaced': 3,
              'parent_tree_occurrences_replaced': 3,
              'focused_validation': 'pass',
              'adversarial_refusals': 15,
              'bvvc_validation': 'pass',
              'no_magic_human_gate': 'pass',
              'complete_release_gate': 'pass',
              'clean_replay': 'pass',
              'post_restore_clean': True,
              'source_requests': 0,
              'registry_queries': 0,
              'form_submissions': 0,
              'identity_admissions': 0,
              'relationship_admissions': 0,
              'negative_existence_claims': 0,
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'public_schoolhouse_legal_identity': 'unresolved',
          }, indent=2, sort_keys=True) + '\n')
          PY
          printf 'complete\n' > "$RECEIPT/STAGE"

      - name: Upload exact parent-repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-legal-identity-current-frontier-parent-repair-v2
          path: ${{ runner.temp }}/schoolhouse-current-frontier-parent-repair-v2
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
