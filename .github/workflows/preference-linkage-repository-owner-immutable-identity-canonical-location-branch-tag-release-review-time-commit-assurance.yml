name: Preference linkage repository owner, immutable identity, canonical location, branch, tag, release, and review-time commit assurance

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.fixture.json'
      - 'tools/lib/preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.mjs'
      - 'tools/compile-preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.mjs'
      - 'tools/validate-preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.mjs'
      - 'test/preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.test.js'
      - 'docs/preference-custody-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.md'
      - '.github/workflows/preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pc55:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile, validate, and test PC-55
        run: |
          node tools/compile-preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.mjs
          node tools/validate-preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.mjs
          node test/preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance
          path: |
            build/research/preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.json
            build/research/preference-linkage-repository-owner-immutable-identity-canonical-location-branch-tag-release-review-time-commit-assurance.md
          if-no-files-found: error
