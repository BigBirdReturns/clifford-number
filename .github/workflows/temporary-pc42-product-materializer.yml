name: TEMP materialize exact PC-42 nonworkflow product

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc42-product-materializer.yml'
      - '.pc42/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc42-permanent-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QUALIFIED_ANCESTOR: 66e1ff01a381e39858e3e55717d74d40a15ca984
      TARGET_BRANCH: research/preference-linkage-score-calibration-assurance-v1
      SOURCE_BRANCH: agent/pc42-exact-product-materializer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc42-exact-product-materializer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify carrier and acquire live-main lease
        run: |
          set -Eeuo pipefail
          sha256sum -c .pc42/carrier.sha256
          test "$(stat -c '%s' .pc42/carrier.part-00)" = 6000
          test "$(stat -c '%s' .pc42/carrier.part-01)" = 6000
          test "$(stat -c '%s' .pc42/carrier.part-02)" = 6000
          test "$(stat -c '%s' .pc42/carrier.part-03)" = 4736
          cat .pc42/carrier.part-* > /tmp/pc42-product.b64
          test "$(stat -c '%s' /tmp/pc42-product.b64)" = 22736
          test "$(sha256sum /tmp/pc42-product.b64 | cut -d' ' -f1)" = dfbe68d870ea6463be834f56e6b2a4eb00515bcba477cf9c19df3ac91c474bb2
          base64 --decode /tmp/pc42-product.b64 > /tmp/pc42-product.tar.xz
          test "$(stat -c '%s' /tmp/pc42-product.tar.xz)" = 17052
          test "$(sha256sum /tmp/pc42-product.tar.xz | cut -d' ' -f1)" = 04a117e541a42d98dbf3c4cf391b22ee6df0837ccfad67f724d52be3e3897073
          xz --test /tmp/pc42-product.tar.xz
          tar -tJf /tmp/pc42-product.tar.xz | LC_ALL=C sort > /tmp/pc42-archive-paths.txt
          cut -f1 .pc42/nonworkflow-manifest.tsv | LC_ALL=C sort > /tmp/pc42-archive-paths.expected
          diff -u /tmp/pc42-archive-paths.expected /tmp/pc42-archive-paths.txt
          test "$(wc -l < /tmp/pc42-archive-paths.txt | tr -d ' ')" = 12
          ! grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/pc42-archive-paths.txt

          git fetch origin main "$SOURCE_BRANCH" --no-tags
          source_head="$(git rev-parse HEAD)"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$source_head"
          current_main="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$QUALIFIED_ANCESTOR" "$current_main"
          LC_ALL=C sort .pc42/all-paths.txt > /tmp/pc42-all-paths.txt
          git diff --name-only "$QUALIFIED_ANCESTOR..$current_main" | LC_ALL=C sort -u > /tmp/pc42-main-advance-paths.txt
          comm -12 /tmp/pc42-all-paths.txt /tmp/pc42-main-advance-paths.txt > /tmp/pc42-overlap-paths.txt
          test ! -s /tmp/pc42-overlap-paths.txt
          while IFS= read -r path; do
            ! git cat-file -e "$current_main:$path" 2>/dev/null
          done < /tmp/pc42-all-paths.txt
          ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1
          printf '%s\n' "$source_head" > /tmp/pc42-source-head.sha
          printf '%s\n' "$current_main" > /tmp/pc42-publication-parent.sha

      - name: Construct exact twelve-file nonworkflow commit
        run: |
          set -Eeuo pipefail
          current_main="$(cat /tmp/pc42-publication-parent.sha)"
          git checkout --detach "$current_main"
          tar -xJf /tmp/pc42-product.tar.xz
          while IFS=$'\t' read -r path bytes sha blob; do
            test "$(stat -c '%s' "$path")" = "$bytes"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "$sha"
            test "$(git hash-object "$path")" = "$blob"
            git add -- "$path"
          done < <(git show "origin/$SOURCE_BRANCH:.pc42/nonworkflow-manifest.tsv")
          git diff --cached --name-only | LC_ALL=C sort > /tmp/pc42-staged-paths.txt
          diff -u /tmp/pc42-archive-paths.expected /tmp/pc42-staged-paths.txt
          test "$(wc -l < /tmp/pc42-staged-paths.txt | tr -d ' ')" = 12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preference Custody: implement PC-42 linkage-score assurance and floor v40'
          test "$(git rev-parse HEAD^)" = "$current_main"
          git rev-parse HEAD > /tmp/pc42-product-commit.sha
          git rev-parse 'HEAD^{tree}' > /tmp/pc42-product-tree.sha

      - name: Run focused and historical Preference Custody qualification
        run: |
          set -Eeuo pipefail
          node tools/compile-preference-linkage-score-calibration-assurance.mjs
          node tools/validate-preference-linkage-score-calibration-assurance.mjs
          node test/preference-linkage-score-calibration-assurance.test.js
          node tools/compile-preference-custody-manifest-v40.mjs
          node tools/validate-preference-custody-manifest-v40.mjs
          node test/preference-custody-manifest-v40.test.js
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | LC_ALL=C sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          touch /tmp/pc42-focused.pass

      - name: Run complete repository release gate
        run: |
          set -Eeuo pipefail
          npm run release:check
          touch /tmp/pc42-release.pass

      - name: Restore volatile outputs and replay deterministically
        run: |
          set -Eeuo pipefail
          product_commit="$(cat /tmp/pc42-product-commit.sha)"
          while IFS=$'\t' read -r path _; do git diff --exit-code -- "$path"; done < <(git show "origin/$SOURCE_BRANCH:.pc42/nonworkflow-manifest.tsv")
          git reset --hard "$product_commit"
          git clean -fdx
          node tools/compile-preference-linkage-score-calibration-assurance.mjs
          node tools/validate-preference-linkage-score-calibration-assurance.mjs
          node test/preference-linkage-score-calibration-assurance.test.js
          node tools/compile-preference-custody-manifest-v40.mjs
          node tools/validate-preference-custody-manifest-v40.mjs
          node test/preference-custody-manifest-v40.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          touch /tmp/pc42-replay.pass

      - name: Recheck leases and publish
        run: |
          set -Eeuo pipefail
          source_head="$(cat /tmp/pc42-source-head.sha)"
          current_main="$(cat /tmp/pc42-publication-parent.sha)"
          product_commit="$(cat /tmp/pc42-product-commit.sha)"
          git fetch origin main "$SOURCE_BRANCH" --no-tags
          test "$(git rev-parse origin/main)" = "$current_main"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$source_head"
          ! git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1
          git push origin "$product_commit:refs/heads/$TARGET_BRANCH"
          touch /tmp/pc42-published.pass

      - name: Emit receipt
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os

          def read(path):
              p = Path(path)
              return p.read_text().strip() if p.exists() else None

          files = {}
          source = Path('.pc42/nonworkflow-manifest.tsv')
          if source.exists():
              for line in source.read_text().splitlines():
                  path, size, sha256, blob = line.split('\t')
                  files[path] = {'bytes': int(size), 'sha256': sha256, 'git_blob_sha1': blob}
          receipt = {
              'schema_version': 'pc42-nonworkflow-materialization-receipt@1',
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_head': read('/tmp/pc42-source-head.sha'),
              'qualified_ancestor': os.environ.get('QUALIFIED_ANCESTOR'),
              'publication_parent': read('/tmp/pc42-publication-parent.sha'),
              'product_commit': read('/tmp/pc42-product-commit.sha'),
              'product_tree': read('/tmp/pc42-product-tree.sha'),
              'target_branch': os.environ.get('TARGET_BRANCH'),
              'base64_bytes': 22736,
              'base64_sha256': 'dfbe68d870ea6463be834f56e6b2a4eb00515bcba477cf9c19df3ac91c474bb2',
              'archive_bytes': 17052,
              'archive_sha256': '04a117e541a42d98dbf3c4cf391b22ee6df0837ccfad67f724d52be3e3897073',
              'nonworkflow_path_count': len(files),
              'files': files,
              'overlap_paths': Path('/tmp/pc42-overlap-paths.txt').read_text().splitlines() if Path('/tmp/pc42-overlap-paths.txt').exists() else None,
              'focused_pc42': 'pass' if Path('/tmp/pc42-focused.pass').exists() else 'not_proved',
              'historical_preference_custody_floors': 'pass' if Path('/tmp/pc42-focused.pass').exists() else 'not_proved',
              'no_magic_human': 'pass' if Path('/tmp/pc42-focused.pass').exists() else 'not_proved',
              'release_check': 'pass' if Path('/tmp/pc42-release.pass').exists() else 'not_proved',
              'deterministic_replay': 'pass' if Path('/tmp/pc42-replay.pass').exists() else 'not_proved',
              'target_published': Path('/tmp/pc42-published.pass').exists(),
              'outside_human_dependency': False,
              'graph_effect': 'none'
          }
          Path('/tmp/pc42-materialization-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc42-nonworkflow-materialization-${{ github.run_id }}
          path: /tmp/pc42-materialization-receipt.json
          if-no-files-found: error
          retention-days: 90
