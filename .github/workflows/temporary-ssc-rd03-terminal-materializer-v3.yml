name: TEMP materialize exact RD-03 terminal closure v3

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd03-terminal-materializer-v3.yml'
      - '.rd03-terminal-v3/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd03-terminal-materializer-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd03-terminal-materializer-trigger-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_BRANCH: agent/ssc-rd-wave02-rd03-negotiated-terms
      CARRIER_BRANCH: agent/ssc-rd03-terminal-materializer-base-v1
      SOURCE_WORKFLOW_BRANCH: agent/ssc-rd03-terminal-materializer-base-v1
      SOURCE_WORKFLOW_PATH: .github/workflows/temporary-ssc-rd03-terminal-materializer-v1.yml
      EXPECTED_SOURCE_WORKFLOW_HEAD: 7ba5b96cd87e72151c4bbfdc348d06c33f8455e0
      EXPECTED_SOURCE_WORKFLOW_BLOB: 8fabf533a1958de38b5d5125439f8614e5ba2541
      EXPECTED_AUTHORED_PART_00_BLOB: 890923aa6883a28ca00b96ffbf697963578ed58e
      EXPECTED_AUTHORED_PART_01_BLOB: 6842f6cf162803a26ceb8eff378b4266501c4efb
      EXPECTED_RESEARCH_HEAD: e70aec0f6809c77e198e0c4ee80f6bcadb6bbdc4
      EXPECTED_MAIN_HEAD: 61d8baabee70a40d13fc08c1f446313c3416a6e0
      CENSUS_ARTIFACT_ID: '8875551993'
      CENSUS_ARTIFACT_SHA256: 5b5414816cb626a7d9bbe16d914f67d5d02d1233c6ca0d84e21930909eba5f08
      CENSUS_MANIFEST_SHA256: 0bcee2db7be4904f775c55a2533a2a5f1c199edff47e273993925b742f24ac06
      CENSUS_DEST: data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/source-custody/public-record-census-v1
      EXECUTION_RECEIPT_PATH: data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/public-record-census-execution-receipt.json
      PRODUCT_ROOT: data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms
      CLOSURE_REFERENCE_PATH: data/project/ssc-residual-wave02/closures/RD-03-C04.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd03-negotiated-terms
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract corrected retained materializer and execute
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RESEARCH_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)" = "$EXPECTED_RESEARCH_HEAD"
          node tools/validate-no-magic-human-gate.mjs

          git fetch origin "refs/heads/${SOURCE_WORKFLOW_BRANCH}:refs/remotes/origin/${SOURCE_WORKFLOW_BRANCH}"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_WORKFLOW_HEAD" "origin/${SOURCE_WORKFLOW_BRANCH}"
          git diff --name-only "$EXPECTED_SOURCE_WORKFLOW_HEAD..origin/${SOURCE_WORKFLOW_BRANCH}" | sort > /tmp/rd03-source-drift.txt
          printf '.rd03-terminal/TEST\n' | diff -u - /tmp/rd03-source-drift.txt
          git show "origin/${SOURCE_WORKFLOW_BRANCH}:${SOURCE_WORKFLOW_PATH}" > /tmp/rd03-source-workflow.yml
          test "$(git hash-object /tmp/rd03-source-workflow.yml)" = "$EXPECTED_SOURCE_WORKFLOW_BLOB"
          test "$(git rev-parse "origin/${SOURCE_WORKFLOW_BRANCH}:.rd03-terminal/authored/part-00.b64")" = "$EXPECTED_AUTHORED_PART_00_BLOB"
          test "$(git rev-parse "origin/${SOURCE_WORKFLOW_BRANCH}:.rd03-terminal/authored/part-01.b64")" = "$EXPECTED_AUTHORED_PART_01_BLOB"
          git ls-tree --name-only "origin/${SOURCE_WORKFLOW_BRANCH}:.rd03-terminal/authored" | sort > /tmp/rd03-authored-parts.txt
          printf 'part-00.b64\npart-01.b64\n' | diff -u - /tmp/rd03-authored-parts.txt

          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/rd03-source-workflow.yml').read_text().splitlines()
          marker = '        run: |'
          positions = [index for index, line in enumerate(source) if line == marker]
          assert len(positions) == 1, positions

          script_lines = []
          for line in source[positions[0] + 1:]:
              if line.startswith('      - '):
                  break
              if line == '':
                  script_lines.append('')
                  continue
              assert line.startswith('          '), repr(line)
              script_lines.append(line[10:])

          script = '\n'.join(script_lines) + '\n'

          old_parent = 'test "$(git show -s --format=%P "$INTEGRATION_SHA")" = "$MAIN_START_SHA $RESEARCH_START_SHA"'
          new_parent = '\n'.join([
              'parent_record="$(git rev-list --parents -n1 "$INTEGRATION_SHA")"',
              'parent_count="$(awk \'{print NF-1}\' <<<"$parent_record")"',
              'first_parent="$(git rev-parse "${INTEGRATION_SHA}^1")"',
              'second_parent="$(git rev-parse "${INTEGRATION_SHA}^2")"',
              'printf \'RD-03 integration parent record: %s\\n\' "$parent_record"',
              'printf \'RD-03 integration parent count: %s\\n\' "$parent_count"',
              'printf \'RD-03 integration first parent: observed=%s expected=%s\\n\' "$first_parent" "$MAIN_START_SHA"',
              'printf \'RD-03 integration second parent: observed=%s expected=%s\\n\' "$second_parent" "$RESEARCH_START_SHA"',
              'test "$parent_count" = \'2\'',
              'test "$first_parent" = "$MAIN_START_SHA"',
              'test "$second_parent" = "$RESEARCH_START_SHA"',
              'printf \'RD-03 integration parent proof: PASS\\n\'',
          ])
          assert script.count(old_parent) == 1, script.count(old_parent)
          script = script.replace(old_parent, new_parent)

          old_fetch = 'git fetch origin "refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"'
          new_fetch = '\n'.join([
              'test "$CARRIER_BRANCH" = "$SOURCE_WORKFLOW_BRANCH"',
              'carrier_head="$(git rev-parse "origin/${CARRIER_BRANCH}")"',
              'printf \'RD-03 carrier ref reused: %s\\n\' "$carrier_head"',
              'printf \'RD-03 carrier fetch reuse: PASS\\n\'',
          ])
          assert script.count(old_fetch) == 1, script.count(old_fetch)
          script = script.replace(old_fetch, new_fetch)

          old_single_part = 'git show "origin/${CARRIER_BRANCH}:.rd03-terminal/authored/part-00.b64" > /tmp/rd03-authored.b64'
          new_two_parts = '\n'.join([
              ': > /tmp/rd03-authored.b64',
              'for authored_part in part-00.b64 part-01.b64; do',
              '  git show "origin/${CARRIER_BRANCH}:.rd03-terminal/authored/${authored_part}" >> /tmp/rd03-authored.b64',
              'done',
              'printf \'RD-03 authored shard reconstruction: 2 / 2\\n\'',
          ])
          assert script.count(old_single_part) == 1, script.count(old_single_part)
          script = script.replace(old_single_part, new_two_parts)

          old_b64_checks = '\n'.join([
              'test "$(wc -c < /tmp/rd03-authored.b64 | tr -d \' \')" = \'25720\'',
              'test "$(sha256sum /tmp/rd03-authored.b64 | awk \'{print $1}\')" = \'d741e8229ddfe7f544dd29ef4c1d50b60140351a47477c47321b16eb63c509fd\'',
          ])
          new_b64_checks = '\n'.join([
              'authored_b64_bytes="$(wc -c < /tmp/rd03-authored.b64 | tr -d \' \')"',
              'authored_b64_sha="$(sha256sum /tmp/rd03-authored.b64 | awk \'{print $1}\')"',
              'printf \'RD-03 authored base64 bytes: observed=%s expected=25720\\n\' "$authored_b64_bytes"',
              'printf \'RD-03 authored base64 SHA-256: observed=%s expected=d741e8229ddfe7f544dd29ef4c1d50b60140351a47477c47321b16eb63c509fd\\n\' "$authored_b64_sha"',
              'test "$authored_b64_bytes" = \'25720\'',
              'test "$authored_b64_sha" = \'d741e8229ddfe7f544dd29ef4c1d50b60140351a47477c47321b16eb63c509fd\'',
              'printf \'RD-03 authored base64 proof: PASS\\n\'',
          ])
          assert script.count(old_b64_checks) == 1, script.count(old_b64_checks)
          script = script.replace(old_b64_checks, new_b64_checks)

          old_zip_checks = '\n'.join([
              'test "$(wc -c < /tmp/rd03-authored.zip | tr -d \' \')" = \'19288\'',
              'test "$(sha256sum /tmp/rd03-authored.zip | awk \'{print $1}\')" = \'279556dcfa7d3332d115282ca835fafe2a3dec16ad3b4a78baa11a0ac646d328\'',
          ])
          new_zip_checks = '\n'.join([
              'authored_zip_bytes="$(wc -c < /tmp/rd03-authored.zip | tr -d \' \')"',
              'authored_zip_sha="$(sha256sum /tmp/rd03-authored.zip | awk \'{print $1}\')"',
              'printf \'RD-03 authored ZIP bytes: observed=%s expected=19288\\n\' "$authored_zip_bytes"',
              'printf \'RD-03 authored ZIP SHA-256: observed=%s expected=279556dcfa7d3332d115282ca835fafe2a3dec16ad3b4a78baa11a0ac646d328\\n\' "$authored_zip_sha"',
              'test "$authored_zip_bytes" = \'19288\'',
              'test "$authored_zip_sha" = \'279556dcfa7d3332d115282ca835fafe2a3dec16ad3b4a78baa11a0ac646d328\'',
              'printf \'RD-03 authored ZIP proof: PASS\\n\'',
          ])
          assert script.count(old_zip_checks) == 1, script.count(old_zip_checks)
          script = script.replace(old_zip_checks, new_zip_checks)

          dollar = '$'
          old_repo_expression = dollar + '{{ github.repository }}'
          assert script.count(old_repo_expression) == 1, script.count(old_repo_expression)
          script = script.replace(old_repo_expression, '${GITHUB_REPOSITORY}')

          assert (dollar + '{{') not in script
          assert script.count('integration parent proof: PASS') == 1
          assert script.count('carrier fetch reuse: PASS') == 1
          assert script.count('authored shard reconstruction: 2 / 2') == 1
          assert script.count('authored base64 proof: PASS') == 1
          assert script.count('authored ZIP proof: PASS') == 1
          assert script.count('${INTEGRATION_SHA}^1') == 1
          assert script.count('${INTEGRATION_SHA}^2') == 1
          Path('/tmp/rd03-materialize.sh').write_text(script)
          PY

          bash -n /tmp/rd03-materialize.sh
          grep -F 'integration parent proof: PASS' /tmp/rd03-materialize.sh
          grep -F 'carrier fetch reuse: PASS' /tmp/rd03-materialize.sh
          grep -F 'authored shard reconstruction: 2 / 2' /tmp/rd03-materialize.sh
          grep -F 'authored base64 proof: PASS' /tmp/rd03-materialize.sh
          grep -F 'authored ZIP proof: PASS' /tmp/rd03-materialize.sh
          grep -F '${GITHUB_REPOSITORY}' /tmp/rd03-materialize.sh
          bash /tmp/rd03-materialize.sh

      - name: Preserve terminal materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-wave02-terminal-materialization-v3
          path: /tmp/rd03-terminal-receipt
          if-no-files-found: error
          retention-days: 90
