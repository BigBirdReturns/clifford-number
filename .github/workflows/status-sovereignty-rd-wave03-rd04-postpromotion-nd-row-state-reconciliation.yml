name: Qualify RD-04 North Dakota derivative row-state reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs'

permissions:
  contents: read

env:
  CANONICAL_PARENT: 283c5993cb2ac0bff173c72aba70088c67b2ac3c
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation
  OUT: /tmp/rd04-nd-row-state-reconciliation

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bind exact fourteen-path topology and canonical predecessor
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT/generated"
          EVENT='${{ github.event_name }}'
          CHECKOUT_HEAD="$(git rev-parse HEAD)"
          if [ "$EVENT" = pull_request ]; then
            PRODUCT_COMMIT='${{ github.event.pull_request.head.sha }}'
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            test "$CHECKOUT_HEAD" = "$PRODUCT_COMMIT"
            git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
            test "$(git rev-parse origin/main)" = "$BASE_SHA"
          else
            read -r P1 P2 EXTRA <<< "$(git show -s --format='%P' HEAD)"
            test -n "$P1" && test -n "$P2" && test -z "${EXTRA:-}"
            BASE_SHA="$P1"
            PRODUCT_COMMIT="$P2"
          fi
          test "$(git rev-parse "$PRODUCT_COMMIT^")" = "$CANONICAL_PARENT"
          git merge-base --is-ancestor "$CANONICAL_PARENT" "$BASE_SHA"
          printf '%s\n' "$PRODUCT_COMMIT" > "$OUT/product-commit.txt"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.yml' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/input-custody.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/row-state-decision.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/row-state-ledger.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/promoted-partial-field-matrix.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/remaining-open-field-census.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/row-state-summary.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/index.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/product-manifest.json' \
            'docs/milestones/ssc-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.md' \
            'schemas/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.schema.json' \
            'test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.test.js' \
            'tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs' \
            'tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs' | LC_ALL=C sort)"
          test "$(git diff --name-only "$CANONICAL_PARENT" "$PRODUCT_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" "$PRODUCT_COMMIT" | LC_ALL=C sort)" = "$EXPECTED"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" "$PRODUCT_COMMIT")"
          git diff --check "$CANONICAL_PARENT" "$PRODUCT_COMMIT"
          printf '%s\n' "$EXPECTED" > "$OUT/product-paths.txt"
          git diff --name-only "$CANONICAL_PARENT" "$BASE_SHA" | LC_ALL=C sort > "$OUT/intervening-paths.txt"
          test -z "$(comm -12 "$OUT/product-paths.txt" "$OUT/intervening-paths.txt")"
          if [ "$EVENT" = push ]; then
            test "$(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)" = "$EXPECTED"
            test "$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD | LC_ALL=C sort)" = "$EXPECTED"
            test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$BASE_SHA" HEAD)"
            while IFS= read -r PRODUCT_PATH; do
              test "$(git rev-parse "HEAD:$PRODUCT_PATH")" = "$(git rev-parse "$PRODUCT_COMMIT:$PRODUCT_PATH")"
            done <<< "$EXPECTED"
          fi
          test "$(git rev-parse "$PRODUCT_COMMIT:data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/promoted-partial-field-matrix.json")" = 'c25a1ad8fdfe82f70f1ff71e61da6796be94c737'
      - name: Rebuild, validate, and execute adversarial refusals
        shell: bash
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs --out "$OUT/generated" | tee "$OUT/builder.json"
          for name in row-state-ledger.json promoted-partial-field-matrix.json remaining-open-field-census.json row-state-summary.json index.json; do
            cmp "$OUT/generated/$name" "$PRODUCT_ROOT/$name"
          done
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs --out "$OUT/validator.json"
          node --test test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.test.js | tee "$OUT/adversarial.log"
          npm run release:check > "$OUT/release-check.log" 2>&1
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain)"
          node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs --check > "$OUT/post-release-builder.json"
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation.mjs --out "$OUT/post-release-validator.json"
          cp "$PRODUCT_ROOT/row-state-decision.json" "$OUT/"
          cp "$PRODUCT_ROOT/row-state-ledger.json" "$OUT/"
          cp "$PRODUCT_ROOT/row-state-summary.json" "$OUT/"
          cp "$PRODUCT_ROOT/product-manifest.json" "$OUT/"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve exact qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-current-public-record-gap-row-state-reconciliation-v2
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
