name: Temporary Wave 36 topology source repair

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-topology-source-repair.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave36-topology-source-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave36-topology-source-repair.yml'
          encoded_ref='agent%2Flake-allocator-war-public-acquisition-wave-36'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary topology source-repair workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair fixture, builder, and adversarial proof
        shell: bash
        env:
          BRANCH: agent/lake-allocator-war-public-acquisition-wave-36
          BUILD_APPEND_B64: `Wave 18 post-freeze denominator mismatch: ${registry.counts.post_freeze_records}`);
  writeJson(root, topologyPolicy.paths.registry, registry);

  projection.topology_decisions = registry.records.map(wave36TopologyProjectionDecision);
  projection.counts = JSON.parse(JSON.stringify(registry.counts));
  projection.registry_sha256 = wave36TopologyDigest(registry);
  writeJson(root, topologyPolicy.paths.projection, projection);
  console.log(`Wave 36 extended Wave 18 topology: ${observed.length} generated_internal_id decisions (${additions.length} added)`);
  return {
    generated_internal_ids: observed.length,
    additions: additions.length,
    registry_records: registry.records.length,
    post_freeze_records: registry.counts.post_freeze_records
  };
}
if (invoked) extendWave36IdentifierTopology(defaultRoot);
          TEST_APPEND_B64: 
          OLD_FIXTURE_B64: 
          NEW_FIXTURE_B64: 
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          node - <<'NODE'
          const fs = require('fs');
          const decode = name => Buffer.from(process.env[name], 'base64').toString('utf8');
          const acquisitionPath = 'tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs';
          const buildPath = 'tools/build-lake-allocator-war-public-acquisition-wave-36.mjs';
          const testPath = 'test/lake-allocator-war-public-acquisition-wave-36.test.js';
          let acquisition = fs.readFileSync(acquisitionPath, 'utf8');
          const oldFixture = decode('OLD_FIXTURE_B64');
          const newFixture = decode('NEW_FIXTURE_B64');
          if (acquisition.includes(oldFixture)) acquisition = acquisition.replace(oldFixture, newFixture);
          else if (!acquisition.includes(newFixture)) throw new Error('Wave 36 fixture block drifted');
          fs.writeFileSync(acquisitionPath, acquisition);
          let build = fs.readFileSync(buildPath, 'utf8');
          const buildAppend = decode('BUILD_APPEND_B64');
          if (!build.includes('LAW36-W18-GENERATED-INTERNAL-ID')) build = `${build.trimEnd()}\n\n${buildAppend}`;
          fs.writeFileSync(buildPath, build.endsWith('\n') ? build : `${build}\n`);
          let test = fs.readFileSync(testPath, 'utf8');
          const testAppend = decode('TEST_APPEND_B64');
          if (!test.includes('LAW36-W18-GENERATED-INTERNAL-ID')) test = `${test.trimEnd()}\n\n${testAppend}`;
          fs.writeFileSync(testPath, test.endsWith('\n') ? test : `${test}\n`);
          NODE

          changed="$(git diff --name-only "$before" | sort)"
          expected=$'test/lake-allocator-war-public-acquisition-wave-36.test.js\ntools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs\ntools/build-lake-allocator-war-public-acquisition-wave-36.mjs'
          test "$changed" = "$expected"
          node --check tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
          node --check tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
          node --check test/lake-allocator-war-public-acquisition-wave-36.test.js
          git diff --check

          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs tools/build-lake-allocator-war-public-acquisition-wave-36.mjs test/lake-allocator-war-public-acquisition-wave-36.test.js
          git commit -m 'Extend Wave 18 topology for Wave 36 award IDs'

          tmp="$(mktemp -d)"
          fixture="$tmp/fixture"
          cleanup() { git worktree remove --force "$fixture" >/dev/null 2>&1 || true; rm -rf "$tmp"; }
          trap cleanup EXIT
          git worktree add --detach "$fixture" HEAD
          (
            cd "$fixture"
            LAW36_FIXTURE_MODE=1 LAW36_OBSERVED_AT=2026-08-02T16:30:00Z node tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
            git add -A
            wave18_pass() {
              node tools/build-lake-index.mjs
              node tools/stabilize-lake-index.mjs
              node tools/reconcile-lake-identifier-topology-wave-18.mjs
              git add -A
              git write-tree
            }
            first="$(wave18_pass | tail -n 1)"
            second="$(wave18_pass | tail -n 1)"
            third="$(wave18_pass | tail -n 1)"
            test "$second" = "$third"
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/validate-lake-index.mjs
            node tools/reconcile-lake-identifier-topology-wave-18.mjs
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-identifier-topology-wave-18.mjs
            node test/lake-identifier-topology-wave-18.test.js
            node test/lake-allocator-war-public-acquisition-wave-36.test.js
            node - <<'NODE'
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('data/project/lake-identifier-topology-registry-wave-18.json','utf8'));
            const summary = JSON.parse(fs.readFileSync('build/lake-index.json','utf8')).summary;
            const rows = registry.records.filter(row => row.id_key === 'generated_internal_id');
            if (rows.length !== 100) throw new Error(`generated_internal_id topology rows: ${rows.length}`);
            if (registry.counts.records !== 10713 || registry.counts.post_freeze_records !== 342) throw new Error('Wave 18 extended denominator drift');
            if (summary.counts.unindexed_machine_ids !== 0 || summary.counts.unindexed_machine_ids_unadjudicated !== 0) throw new Error('Wave 36 topology left unindexed identifiers');
            if (summary.counts.source_ids_without_projection_unadjudicated !== 0 || summary.counts.divergent_identifier_projections_unadjudicated !== 0) throw new Error('Wave 36 topology left unadjudicated identifier states');
            console.log('Wave 36 topology source repair fixture passed: 100/100');
            NODE
            git diff --check
          )

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$before"
          git push origin "HEAD:$BRANCH"
