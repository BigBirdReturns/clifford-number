name: TEMP controller-custody repaired School.House current-frontier materializer v6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-legal-identity-current-frontier-materializer-v5.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: schoolhouse-legal-identity-current-frontier-materializer-v6-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-legal-identity-current-frontier-materializer-v6')
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct and execute exact v6 controller-custody repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BOOTSTRAP="$RUNNER_TEMP/schoolhouse-current-frontier-v6-bootstrap"
          RECEIPT="$RUNNER_TEMP/schoolhouse-current-frontier-materialization-v5"
          B64="$BOOTSTRAP/materializer-v6.sh.xz.b64"
          XZ="$BOOTSTRAP/materializer-v6.sh.xz"
          SCRIPT="$BOOTSTRAP/materializer-v6.sh"
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP" "$RECEIPT"
          printf 'initializing-v6-compressed-controller\n' > "$BOOTSTRAP/STAGE"
          printf 'source_requests=0\nregistry_queries=0\nform_submissions=0\ncontacts=0\npayments=0\nuploads=0\n' > "$BOOTSTRAP/BOUNDARY"

          finalize() {
            rc="$?"
            trap - EXIT
            mkdir -p "$RECEIPT/v6-wrapper"
            cp -a "$BOOTSTRAP"/. "$RECEIPT/v6-wrapper/"
            printf '%s\n' "$rc" > "$RECEIPT/V6_WRAPPER_EXIT_CODE"
            (
              cd "$RECEIPT"
              find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

