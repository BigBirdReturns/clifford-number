name: TEMP SSC Wave 02 three-closure ledger materializer

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-wave02-ledger3-materializer-base-v1
    paths:
      - '.github/tmp/ssc-wave02-ledger3-materializer.trigger'

permissions:
  contents: write

concurrency:
  group: ssc-wave02-ledger3-materializer-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 64af19ce7f860a7024a37ba5b6eef796b57c87b1
  TARGET_BRANCH: agent/ssc-wave02-current-ledger-three-closures
  CONTROLLER_BRANCH: agent/ssc-wave02-ledger3-materializer-base-v1
  PATCH_BLOB: 6a8d78bf23ca27ca40c0e7a02a19c60d3cde12d7

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout checksum-bound controller
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-wave02-ledger3-materializer-base-v1
          path: controller
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout exact merged RD-01 main
        uses: actions/checkout@v4
        with:
          ref: 64af19ce7f860a7024a37ba5b6eef796b57c87b1
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze exact refs
        run: |
          set -Eeuo pipefail
          test "$(git -C work rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git -C work ls-remote --heads origin "refs/heads/$CONTROLLER_BRANCH" | awk '{print $1}')" = "$(git -C controller rev-parse HEAD)"
          test "$(git -C controller hash-object .github/tmp/ssc-wave02-ledger3-materialize.py)" = "$PATCH_BLOB"
          git -C work config user.name github-actions[bot]
          git -C work config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C work checkout -b ssc-wave02-ledger3-materialization "$EXPECTED_MAIN"

      - name: Derive and commit exact 39-open / 3-closed ledger
        run: |
          set -Eeuo pipefail
          python controller/.github/tmp/ssc-wave02-ledger3-materialize.py work
          cd work
          node tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs --write
          node tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          node test/status-sovereignty-residual-denominator-wave-02-current.test.js
          node tools/validate-no-magic-human-gate.mjs
          jq -e '
            .authority == "three_terminal_class_receipts_promoted_without_cross_lane_empirical_authority" and
            .counts.closed_residual_classes == 3 and
            .counts.open_residual_classes == 39 and
            .counts.terminal_class_receipts == 3 and
            .current_result.closed_class_ids == ["RD-04-C01","RD-05-C03","RD-01-C03"] and
            .current_result.open_selected_class_ids == ["RD-02-C04","RD-03-C04","RD-06-C01"] and
            .current_result.wave_complete == false and
            .current_result.outside_human_dependency == false and
            .current_result.graph_effect == "none"
          ' data/research/status-sovereignty-residual-denominator-wave-02-current.json >/dev/null

          cat > /tmp/ssc-wave02-ledger3-paths.txt <<'PATHS'
          data/research/status-sovereignty-residual-denominator-wave-02-current.json
          docs/milestones/ssc-residual-denominator-wave-02-current.md
          schemas/status-sovereignty-residual-denominator-wave-02-current.schema.json
          test/status-sovereignty-residual-denominator-wave-02-current.test.js
          tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs
          tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          PATHS
          sed -i 's/^          //' /tmp/ssc-wave02-ledger3-paths.txt
          test "$(wc -l < /tmp/ssc-wave02-ledger3-paths.txt | tr -d ' ')" = '6'
          while IFS= read -r path; do test -f "$path"; done < /tmp/ssc-wave02-ledger3-paths.txt
          git add --pathspec-from-file=/tmp/ssc-wave02-ledger3-paths.txt
          sort /tmp/ssc-wave02-ledger3-paths.txt > /tmp/ssc-wave02-ledger3-expected.txt
          git diff --cached --name-only | sort > /tmp/ssc-wave02-ledger3-staged.txt
          cmp /tmp/ssc-wave02-ledger3-expected.txt /tmp/ssc-wave02-ledger3-staged.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all | awk '$1=="??" {print substr($0,4)}')"
          git commit -m 'Promote RD-01 into the Wave 02 cumulative ledger'
          product="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_MAIN" "$product" | sort > /tmp/ssc-wave02-ledger3-product.txt
          cmp /tmp/ssc-wave02-ledger3-expected.txt /tmp/ssc-wave02-ledger3-product.txt
          echo "PRODUCT_COMMIT=$product" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"

      - name: Run complete repository qualification and deterministic replay
        run: |
          set -Eeuo pipefail
          cd work
          npm run release:check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = [
            'build/axm-identity.json',
            'build/build-hop-report.json',
            'build/hop-graph.json',
            'build/migration-review.md',
            'build/migration-summary.json',
            'build/receipt-graph.json',
            'build/scores.json',
            'build/scout-report.json',
            'build/scout-report.md',
            'build/surface-graph.json'
          ].sort();
          const status = execFileSync('git', ['status','--porcelain=v1','--untracked-files=all'], { encoding: 'utf8' })
            .split('\n').filter(Boolean);
          const paths = status.map((line) => line.slice(3)).sort();
          if (paths.length && JSON.stringify(paths) !== JSON.stringify(allowed)) {
            throw new Error(`unexpected post-release paths: ${JSON.stringify(paths)}`);
          }
          console.log(`post-release bounded volatility: ${paths.length} allowed paths`);
          NODE
          git restore --staged --worktree .
          node tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs --check
          node tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          node test/status-sovereignty-residual-denominator-wave-02-current.test.js
          node tools/validate-no-magic-human-gate.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Push under exact target-base lease
        run: |
          set -Eeuo pipefail
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_MAIN"
          git -C work push origin "$PRODUCT_COMMIT:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_MAIN"
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$PRODUCT_COMMIT"

      - name: Preserve exact ledger materialization receipt
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const current = JSON.parse(fs.readFileSync('work/data/research/status-sovereignty-residual-denominator-wave-02-current.json', 'utf8'));
          fs.writeFileSync('ssc-wave02-ledger3-materialization.json', JSON.stringify({
            schema_version: 'ssc-wave02-ledger3-materialization@1',
            base_main: process.env.EXPECTED_MAIN,
            product_commit: process.env.PRODUCT_COMMIT,
            product_tree: process.env.PRODUCT_TREE,
            target_branch: process.env.TARGET_BRANCH,
            actions_product_paths: 6,
            connector_workflow_paths_pending: 1,
            closed_residual_classes: current.counts.closed_residual_classes,
            open_residual_classes: current.counts.open_residual_classes,
            closed_class_ids: current.current_result.closed_class_ids,
            open_selected_class_ids: current.current_result.open_selected_class_ids,
            label_reconciliations: current.counts.label_reconciliations,
            outside_human_dependencies: current.counts.outside_human_dependencies,
            external_contacts: current.counts.external_contacts,
            external_reviews: current.counts.external_reviews,
            release_gate: 'pass',
            deterministic_replay: 'pass',
            graph_effect: 'none',
            publication_effect: 'none',
            adoption_effect: 'none'
          }, null, 2) + '\n');
          NODE
          cat ssc-wave02-ledger3-materialization.json

      - uses: actions/upload-artifact@v4
        with:
          name: ssc-wave02-ledger3-materialization
          path: ssc-wave02-ledger3-materialization.json
          if-no-files-found: error
          retention-days: 90
