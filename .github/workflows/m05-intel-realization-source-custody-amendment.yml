name: M-05 Intel realization source custody amendment

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-accounting-admission-contract.json'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-accounting-admission-contract.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.test.js'
      - '.github/workflows/m05-intel-realization-source-custody-amendment.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-accounting-admission-contract.json'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-accounting-admission-contract.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.test.js'
      - '.github/workflows/m05-intel-realization-source-custody-amendment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m05-intel-realization-source-custody-amendment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Intel realization source custody amendment
        run: |
          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic focused state
        run: |
          git restore --staged --worktree .
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-source-custody-amendment.test.js
          git diff --exit-code
