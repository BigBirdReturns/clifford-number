name: Temporary export SSC Wave 02 review base

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-export-ssc-wave02-review-base.yml'
  push:
    branches: [agent/ssc-wave02-review-export]
    paths:
      - '.github/workflows/temporary-export-ssc-wave02-review-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact main working tree
        run: |
          set -Eeuo pipefail
          BASE=$(git rev-parse HEAD^1)
          printf '%s\n' "$BASE" > /tmp/SSC-W02-REVIEW-BASE-COMMIT.txt
          git checkout "$BASE" -- .
          rm -f .github/workflows/temporary-export-ssc-wave02-review-base.yml
          tar --exclude=.git -cJf /tmp/ssc-wave02-review-base.tar.xz .
          sha256sum /tmp/ssc-wave02-review-base.tar.xz > /tmp/ssc-wave02-review-base.tar.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-wave02-review-base
          path: |
            /tmp/ssc-wave02-review-base.tar.xz
            /tmp/ssc-wave02-review-base.tar.xz.sha256
            /tmp/SSC-W02-REVIEW-BASE-COMMIT.txt
          if-no-files-found: error
          retention-days: 1
