name: Temporary Wave 36 unindexed identifier diagnostic

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-unindexed-id-diagnostic.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-wave36-unindexed-id-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave36-unindexed-id-diagnostic.yml'
          encoded_ref='agent%2Flake-allocator-war-public-acquisition-wave-36'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reproduce and print the unindexed identifier frontier
        shell: bash
        env:
          LAW36_ALLOW_REQUIRED_FAILURES: '1'
          LAW36_OBSERVED_AT: '2026-08-02T16:30:00Z'
        run: |
          set -euo pipefail
          node tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
          node tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
          git add -A
          node tools/install-lake-allocator-war-wave-21.mjs
          git add -A
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node - <<'NODE'
          const fs = require('fs');
          const lake = JSON.parse(fs.readFileSync('build/lake-index.json','utf8'));
          const objectIndex = JSON.parse(fs.readFileSync('build/lake-object-index.json','utf8'));
          const rows = objectIndex.objects.filter(row => row.indexed === false);
          const byKey = {};
          const byPath = {};
          for (const row of rows) {
            byKey[row.id_key] = (byKey[row.id_key] ?? 0) + 1;
            for (const occurrence of row.occurrences ?? []) byPath[occurrence.path] = (byPath[occurrence.path] ?? 0) + 1;
          }
          console.log(JSON.stringify({
            summary: lake.summary.counts,
            unindexed_count: rows.length,
            by_key: Object.fromEntries(Object.entries(byKey).sort()),
            by_path: Object.fromEntries(Object.entries(byPath).sort()),
            rows: rows.map(row => ({
              id_key: row.id_key,
              id_value: row.id_value,
              source_without_projection: row.source_without_projection,
              source_without_projection_unadjudicated: row.source_without_projection_unadjudicated,
              occurrences: (row.occurrences ?? []).map(item => ({path:item.path,pointer:item.pointer,role:item.role,generated:item.generated,index_file:item.index_file}))
            }))
          }, null, 2));
          if (rows.length !== lake.summary.counts.unindexed_machine_ids) throw new Error('object frontier count does not match summary');
          NODE
