name: Counter-Selector Wave 00 and Wave 01

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-00.yml'
      - 'data/project/counter-selector-wave-00-*.json'
      - 'data/project/counter-selector-program.json'
      - 'data/project/counter-selector-candidate-registry.json'
      - 'data/project/counter-selector-candidates/**'
      - 'data/project/counter-selector-wave-01.json'
      - 'data/project/counter-selector-release-manifest.json'
      - 'schemas/counter-selector-candidate.schema.json'
      - 'docs/methods/counter-selector-wave-00.md'
      - 'docs/methods/counter-selector.md'
      - 'docs/milestones/counter-selector-wave-00.md'
      - 'docs/milestones/counter-selector-wave-01.md'
      - 'tools/build-counter-selector.mjs'
      - 'tools/validate-counter-selector.mjs'
      - 'test/counter-selector.test.js'
      - 'reports/core-thesis/counter-selector/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-00.yml'
      - 'data/project/counter-selector-wave-00-*.json'
      - 'data/project/counter-selector-program.json'
      - 'data/project/counter-selector-candidate-registry.json'
      - 'data/project/counter-selector-candidates/**'
      - 'data/project/counter-selector-wave-01.json'
      - 'data/project/counter-selector-release-manifest.json'
      - 'schemas/counter-selector-candidate.schema.json'
      - 'docs/methods/counter-selector-wave-00.md'
      - 'docs/methods/counter-selector.md'
      - 'docs/milestones/counter-selector-wave-00.md'
      - 'docs/milestones/counter-selector-wave-01.md'
      - 'tools/build-counter-selector.mjs'
      - 'tools/validate-counter-selector.mjs'
      - 'test/counter-selector.test.js'
      - 'reports/core-thesis/counter-selector/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Counter-Selector products
        run: node tools/build-counter-selector.mjs
      - name: Validate Counter-Selector contract
        run: node tools/validate-counter-selector.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Require exact committed products
        run: git diff --exit-code
      - name: Reconstruct deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector.mjs
          node tools/validate-counter-selector.mjs
          node test/counter-selector.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
