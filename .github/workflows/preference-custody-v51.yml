name: Preference custody laboratory floor v51

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/**'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.mjs'
      - 'tools/validate-preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v51.mjs'
      - 'tools/validate-preference-custody-manifest-v51.mjs'
      - 'test/preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.test.js'
      - 'test/preference-custody-manifest-v51.test.js'
      - 'docs/preference-custody-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v51.md'
      - '.github/workflows/preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.yml'
      - '.github/workflows/preference-custody-v51.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  floor-v51:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile and validate PC-53 and floor v51
        run: |
          node tools/compile-preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.mjs
          node tools/validate-preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.mjs
          node test/preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.test.js
          node tools/compile-preference-custody-manifest-v51.mjs
          node tools/validate-preference-custody-manifest-v51.mjs
          node test/preference-custody-manifest-v51.test.js
      - name: Reconstruct every Preference Custody floor
        run: |
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
      - name: Enforce no-magic-human and repository release gates
        run: |
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v51
          path: |
            build/research/preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.json
            build/research/preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.md
            build/research/preference-custody-laboratory-floor-v51.json
            build/research/preference-custody-laboratory-floor-v51.md
          if-no-files-found: error
