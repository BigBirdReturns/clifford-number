name: TEMP materialize exact RD-05 terminal closure v2

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd05-terminal-closure-materializer-v2.yml'
      - '.rd05-closure/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd05-terminal-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd05-terminal-closure-materializer-trigger-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: agent/ssc-rd-wave02-rd05-recommendation-disposition
      EXPECTED_START_SHA: 03d0c627308b86ad75e8cdad6a90756c97e592ce
      CARRIER_BRANCH: agent/ssc-rd05-terminal-closure-materializer-base-v2
      CLASSIFICATION_PATH: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/object-semantic-classification.json
      CLASSIFICATION_SHA256: ed35fbd41027497742d5db4473d8675978d37eab52f95c35628616aa7fba6f13
      CENSUS_ARTIFACT_ID: '8852846428'
      CENSUS_ARTIFACT_SHA256: 9a7524164ad5594ac720ec914a84812005aef8e79d0a82ebb561b268089c08fb
      CENSUS_MANIFEST_SHA256: 0fb07dd92ff7e8c27a7e4b3e6b3db18842538516b1badd05afe194fd07446c32
      CENSUS_DEST: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/source-custody/successor-census-v1
      EXECUTION_RECEIPT_PATH: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/successor-census-execution-receipt.json
      PRODUCT_ROOT: data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition
      CLOSURE_REFERENCE_PATH: data/project/ssc-residual-wave02/closures/RD-05-C03.json
      SOURCE_ZIP_SHA256: c981742e18fd69f30235ae234c89f3d48f1b73447c55237d2da4960d07b37360
      SOURCE_BASE64_SHA256: 635c6db190fb11f1bd5e8cb74925845e71553408c0ee46782c52dc02ccf92be7

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd05-recommendation-disposition
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact research lease and reconstruct authored source package
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_START_SHA"
          observed="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$observed" = "$EXPECTED_START_SHA"
          echo "${CLASSIFICATION_SHA256}  ${CLASSIFICATION_PATH}" | sha256sum --check --strict
          node tools/validate-no-magic-human-gate.mjs

          git fetch origin "refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"
          rm -rf /tmp/rd05-authored /tmp/rd05-source.b64 /tmp/rd05-source.zip
          mkdir -p /tmp/rd05-authored
          : > /tmp/rd05-source.b64

          declare -a expected_chunk_sha=(
            d435f040f37d83d92587d7df3f7cfabb8e7d86549c862b8ae33e4c1cb79d8283
            82604b09d0d9be84b34b321c4f691583e4a5613aa81ae53892f5d14d4e428459
            c397f65b4805a0d2a583bbf8dbd10bf577655b4e595b7953e209e04614398523
            9da0a45060dda382ece58a94ca2a2a1420c82dd32b932d07b6968f411164f9ea
          )
          declare -a expected_chunk_bytes=(6000 6000 6000 2392)
          for index in 0 1 2 3; do
            part="$(printf '%02d' "$index")"
            git show "origin/${CARRIER_BRANCH}:.rd05-closure/payload/part-${part}.b64" > "/tmp/rd05-part-${part}.b64"
            test "$(wc -c < "/tmp/rd05-part-${part}.b64" | tr -d ' ')" = "${expected_chunk_bytes[$index]}"
            test "$(sha256sum "/tmp/rd05-part-${part}.b64" | awk '{print $1}')" = "${expected_chunk_sha[$index]}"
            cat "/tmp/rd05-part-${part}.b64" >> /tmp/rd05-source.b64
          done
          test "$(wc -c < /tmp/rd05-source.b64 | tr -d ' ')" = '20392'
          test "$(sha256sum /tmp/rd05-source.b64 | awk '{print $1}')" = "$SOURCE_BASE64_SHA256"
          base64 --decode /tmp/rd05-source.b64 > /tmp/rd05-source.zip
          test "$(wc -c < /tmp/rd05-source.zip | tr -d ' ')" = '15292'
          test "$(sha256sum /tmp/rd05-source.zip | awk '{print $1}')" = "$SOURCE_ZIP_SHA256"
          unzip -q /tmp/rd05-source.zip -d /tmp/rd05-authored

          cat > /tmp/rd05-authored-sha256.txt <<'EOF'
          1fbccf1b711931747be9257e0ce9dd6ab0ede332df8fbf738e3351c4d1726c3f  docs/milestones/ssc-rd-wave02-rd05-recommendation-disposition.md
          45930aae6025a37e27296a76b97826a7ddc40e175478ca189f987fb8f037162d  schemas/status-sovereignty-rd-wave02-rd05-recommendation-disposition.schema.json
          6d0a94c72453e37cf4f0c2ed24de805ce698e214f26dfef56ff4c1e9301a5dfc  test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js
          dbdc7564fe4f6b6793c422f2a2b52b90b252c0bc7ecac1e53631e4d52616641d  tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          15af0ff50764f29ceb316290b06d66ca851c1468a643661dab0c823e2a8a5287  tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          EOF
          (cd /tmp/rd05-authored && sha256sum --check --strict /tmp/rd05-authored-sha256.txt)

      - name: Download and verify checksum-bound successor census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rd05-census /tmp/rd05-census.zip
          mkdir -p /tmp/rd05-census
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CENSUS_ARTIFACT_ID}/zip" \
            --output /tmp/rd05-census.zip
          test "$(sha256sum /tmp/rd05-census.zip | awk '{print $1}')" = "$CENSUS_ARTIFACT_SHA256"
          unzip -q /tmp/rd05-census.zip -d /tmp/rd05-census

          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path('/tmp/rd05-census')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['schema_version'] == 'ssc-rd05-wave02-successor-census-manifest@1'
          assert manifest['entry_count'] == 398
          assert len(manifest['entries']) == 398
          assert len({row['path'] for row in manifest['entries']}) == 398
          for row in manifest['entries']:
              rel = pathlib.PurePosixPath(row['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              path = root / rel
              assert path.is_file()
              data = path.read_bytes()
              assert len(data) == row['bytes']
              assert hashlib.sha256(data).hexdigest() == row['sha256']
          combined = hashlib.sha256('\n'.join(f"{row['sha256']}  {row['path']}" for row in manifest['entries']).encode()).hexdigest()
          assert combined == manifest['combined_sha256']
          assert combined == '0fb07dd92ff7e8c27a7e4b3e6b3db18842538516b1badd05afe194fd07446c32'
          assert len([p for p in root.rglob('*') if p.is_file()]) == 399
          print(f'RD-05 census verified: 398 manifest entries plus manifest; {combined}')
          PY

      - name: Install exact custody, authored machinery, and execution receipt
        run: |
          set -Eeuo pipefail
          test ! -e "$CENSUS_DEST"
          mkdir -p "$CENSUS_DEST"
          cp -a /tmp/rd05-census/. "$CENSUS_DEST/"

          while read -r digest source_path; do
            install -D -m 0644 "/tmp/rd05-authored/${source_path}" "${source_path}"
          done < /tmp/rd05-authored-sha256.txt

          mkdir -p "$(dirname "$EXECUTION_RECEIPT_PATH")"
          cat > "$EXECUTION_RECEIPT_PATH" <<'JSON'
          {
            "schema_version": "ssc-rd05-wave02-successor-census-execution-receipt@1",
            "wave_id": "SSC-RD-W02",
            "class_id": "RD-05-C03",
            "issue": 790,
            "research_head": "03d0c627308b86ad75e8cdad6a90756c97e592ce",
            "workflow_run": 30806151404,
            "job_id": 91661876762,
            "artifact_id": 8852846428,
            "artifact_name": "ssc-rd05-wave02-successor-census-v1",
            "artifact_zip_sha256": "9a7524164ad5594ac720ec914a84812005aef8e79d0a82ebb561b268089c08fb",
            "manifest_entry_count": 398,
            "manifest_combined_sha256": "0fb07dd92ff7e8c27a7e4b3e6b3db18842538516b1badd05afe194fd07446c32",
            "first_attempt": {
              "workflow_run": 30805582373,
              "job_id": 91660057710,
              "state": "failed_closed_preflight_invalid_blocking_predicate",
              "source_requests_executed": 0,
              "partial_custody_files": 0
            },
            "counts": {
              "fixed_routes": 49,
              "route_attempts": 49,
              "http_success": 45,
              "terminal_non_success": 4,
              "result_spawned_requests": 0
            },
            "authority": {
              "outside_human_dependency": false,
              "external_contacts": 0,
              "external_reviews": 0,
              "denominator_widened": false,
              "publication_effect": "none",
              "adoption_effect": "none",
              "graph_effect": "none"
            }
          }
          JSON

          node tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js
          node tools/validate-no-magic-human-gate.mjs

      - name: Prove exact 412-path product and commit
        run: |
          set -Eeuo pipefail
          find "$CENSUS_DEST" -type f | LC_ALL=C sort > /tmp/expected-rd05-closure-paths.txt
          cat >> /tmp/expected-rd05-closure-paths.txt <<EOF
          $EXECUTION_RECEIPT_PATH
          $PRODUCT_ROOT/candidate-exclusion-ledger.json
          $PRODUCT_ROOT/chain-terminal-ledger.json
          $PRODUCT_ROOT/class-receipt.json
          $PRODUCT_ROOT/manifest.json
          $PRODUCT_ROOT/summary.json
          $PRODUCT_ROOT/terminal-classification.json
          $CLOSURE_REFERENCE_PATH
          docs/milestones/ssc-rd-wave02-rd05-recommendation-disposition.md
          schemas/status-sovereignty-rd-wave02-rd05-recommendation-disposition.schema.json
          test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js
          tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          EOF
          LC_ALL=C sort -o /tmp/expected-rd05-closure-paths.txt /tmp/expected-rd05-closure-paths.txt
          test "$(wc -l < /tmp/expected-rd05-closure-paths.txt | tr -d ' ')" = '412'

          git status --porcelain=v1 --untracked-files=all | cut -c4- | LC_ALL=C sort > /tmp/actual-rd05-closure-paths.txt
          diff -u /tmp/expected-rd05-closure-paths.txt /tmp/actual-rd05-closure-paths.txt

          git add -- \
            "$CENSUS_DEST" \
            "$EXECUTION_RECEIPT_PATH" \
            "$PRODUCT_ROOT" \
            "$CLOSURE_REFERENCE_PATH" \
            docs/milestones/ssc-rd-wave02-rd05-recommendation-disposition.md \
            schemas/status-sovereignty-rd-wave02-rd05-recommendation-disposition.schema.json \
            test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js \
            tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs \
            tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Close RD-05 recommendation-disposition class'
          PRODUCT_SHA="$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=${PRODUCT_SHA}" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_START_SHA"
          git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort > /tmp/committed-rd05-closure-paths.txt
          diff -u /tmp/expected-rd05-closure-paths.txt /tmp/committed-rd05-closure-paths.txt

      - name: Run complete repository release gate and prove timestamp-only volatility
        run: |
          set -Eeuo pipefail
          npm run release:check

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const jsonPaths = [
            'build/axm-identity.json',
            'build/build-hop-report.json',
            'build/hop-graph.json',
            'build/migration-summary.json',
            'build/receipt-graph.json',
            'build/scores.json',
            'build/scout-report.json',
            'build/surface-graph.json'
          ];
          const markdownPaths = ['build/migration-review.md', 'build/scout-report.md'];
          const expected = [...jsonPaths, ...markdownPaths].sort();
          const raw = execFileSync('git', ['status', '--porcelain=v1', '--untracked-files=all'], { encoding: 'utf8' });
          const paths = raw.split('\n').filter(Boolean).map((line) => line.slice(3)).sort();
          if (JSON.stringify(paths) !== JSON.stringify(expected)) throw new Error(`unexpected post-release paths: ${JSON.stringify(paths)}`);
          const numstat = execFileSync('git', ['diff', '--numstat', '--', ...expected], { encoding: 'utf8' }).split('\n').filter(Boolean);
          if (numstat.length !== expected.length) throw new Error('post-release numstat denominator');
          for (const row of numstat) {
            const [adds, deletes, path] = row.split('\t');
            if (adds !== '1' || deletes !== '1' || !expected.includes(path)) throw new Error(`non-timestamp post-release diff: ${row}`);
          }
          for (const path of jsonPaths) {
            const before = JSON.parse(execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }));
            const after = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (typeof before.generated !== 'string' || typeof after.generated !== 'string') throw new Error(`missing generated timestamp: ${path}`);
            if (!Number.isFinite(Date.parse(before.generated)) || !Number.isFinite(Date.parse(after.generated))) throw new Error(`invalid generated timestamp: ${path}`);
            delete before.generated;
            delete after.generated;
            if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error(`semantic JSON drift: ${path}`);
          }
          for (const path of markdownPaths) {
            const before = execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }).split('\n');
            const after = fs.readFileSync(path, 'utf8').split('\n');
            const normalize = (lines) => lines.map((line) => line.startsWith('Generated: ') ? 'Generated: <ISO>' : line);
            if (JSON.stringify(normalize(before)) !== JSON.stringify(normalize(after))) throw new Error(`semantic Markdown drift: ${path}`);
            const prior = before.find((line) => line.startsWith('Generated: '));
            const current = after.find((line) => line.startsWith('Generated: '));
            if (!prior || !current || !Number.isFinite(Date.parse(prior.slice(11))) || !Number.isFinite(Date.parse(current.slice(11)))) throw new Error(`invalid Markdown timestamp: ${path}`);
          }
          console.log('post-release volatility proof: PASS — 10/10 paths timestamp-only, semantic drift zero');
          NODE

          git restore --worktree -- \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/migration-review.md \
            build/migration-summary.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/scout-report.md \
            build/surface-graph.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Replay deterministically and publish under unchanged-head lease
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          observed="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$observed" = "$EXPECTED_START_SHA"
          git push origin "HEAD:${TARGET_BRANCH}"
          observed="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$observed" = "$PRODUCT_SHA"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/manifest.json', 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/class-receipt.json', 'utf8'));
          const materialization = {
            schema_version: 'ssc-rd05-wave02-terminal-closure-materializer-receipt@2',
            target_branch: process.env.TARGET_BRANCH,
            expected_start_sha: process.env.EXPECTED_START_SHA,
            product_sha: process.env.PRODUCT_SHA,
            permanent_path_count: 412,
            authored_source_zip_sha256: process.env.SOURCE_ZIP_SHA256,
            census_artifact_id: Number(process.env.CENSUS_ARTIFACT_ID),
            census_artifact_sha256: process.env.CENSUS_ARTIFACT_SHA256,
            census_manifest_entries: 398,
            census_manifest_sha256: process.env.CENSUS_MANIFEST_SHA256,
            product_manifest_entries: manifest.entry_count,
            product_manifest_sha256: manifest.combined_sha256,
            frozen_objects: receipt.counts.frozen_objects,
            terminal_objects: receipt.counts.terminal_objects,
            bounded_non_link_chains: receipt.counts.bounded_non_link_chains,
            open_chains: receipt.counts.open_chains,
            fixed_routes: receipt.counts.fixed_routes,
            focused_adversarial_mutations: 123,
            release_gate: 'pass',
            post_release_volatile_paths: 10,
            post_release_semantic_drift: 0,
            deterministic_replay: 'pass',
            unchanged_head_lease: 'pass',
            external_contacts: 0,
            external_reviews: 0,
            outside_human_dependency: false,
            publication_effect: 'none',
            adoption_effect: 'none',
            graph_effect: 'none'
          };
          fs.writeFileSync('ssc-rd05-terminal-closure-materializer-receipt.json', `${JSON.stringify(materialization, null, 2)}\n`);
          NODE

      - name: Upload exact RD-05 terminal closure receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd05-terminal-closure-materializer-v2
          path: ssc-rd05-terminal-closure-materializer-receipt.json
          if-no-files-found: error
          retention-days: 90
