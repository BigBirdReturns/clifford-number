name: Temporary PR2176 dotted contact boundary repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-dotted-boundary-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-dotted-contact-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "85ff2f185bf4e8c70404134c5707506ad20faf5f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-dotted-boundary-repair.yml"

      - name: Apply the narrative-evidence boundary repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')
          old_helper = r'''function isSentenceSeparatedNumericTail(value, separator) {
            return /^\d/u.test(normalizedWrappedNumericTail(value))
              && /[.!?。！？]\s*(?:[+\-−–—]\s*)?(?:\(\s*(?:[+\-−–—]\s*)?)?$/u.test(
                separator.normalize('NFKC')
              );
          }'''
          new_helper = r'''function hasNarrativeNumericContinuation(value) {
            return /^\d+(?:\s*\))?(?:\s+|(?=[\p{L}]))[\p{L}]/u.test(
              value.normalize('NFKC').trim()
            );
          }

          function isSentenceSeparatedNumericTail(value, separator, contextualTail) {
            return /^\d/u.test(normalizedWrappedNumericTail(value))
              && /[.!?。！？]\s*(?:[+\-−–—]\s*)?(?:\(\s*(?:[+\-−–—]\s*)?)?$/u.test(
                separator.normalize('NFKC')
              )
              && hasNarrativeNumericContinuation(contextualTail);
          }'''
          if library.count(old_helper) != 1:
              raise SystemExit('numeric sentence-boundary helper anchor did not match exactly once')
          library = library.replace(old_helper, new_helper, 1)

          old_call = 'isSentenceSeparatedNumericTail(tail, separator)'
          if library.count(old_call) != 2:
              raise SystemExit('numeric sentence-boundary call count was not exactly two')
          library = library.replace(
              old_call,
              'isSentenceSeparatedNumericTail(tail, separator, contextualTail)'
          )
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          phone_anchor = r'''assert.equal(
            redactContactData('Contact +81 3 6216 5111. (+42) attendees joined.'),
            'Contact [contact omitted]. (+42) attendees joined.',
            'parenthesized signed numeric prose after a phone must remain intact'
          );'''
          phone_replacement = phone_anchor + r'''
          assert.equal(
            redactContactData('Tel: +44 20 7123. 4567'),
            'Tel: [contact omitted]',
            'a dotted international phone group without narrative continuation must remain in the phone span'
          );'''
          if tests.count(phone_anchor) != 1:
              raise SystemExit('dotted-phone test anchor did not match exactly once')
          tests = tests.replace(phone_anchor, phone_replacement, 1)

          extension_anchor = r'''assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 1234. （－４２） attendees joined.'),
            'Tel: [contact omitted] ext [contact omitted]. （－４２） attendees joined.',
            'fullwidth parenthesized signed numeric prose after an extension must remain intact'
          );'''
          extension_replacement = extension_anchor + r'''
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 1234. 5678'),
            'Tel: [contact omitted] ext [contact omitted]',
            'a dotted grouped extension without narrative continuation must remain in the extension span'
          );'''
          if tests.count(extension_anchor) != 1:
              raise SystemExit('dotted-extension test anchor did not match exactly once')
          tests = tests.replace(extension_anchor, extension_replacement, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-dotted-boundary-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-dotted-boundary-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): distinguish dotted contacts from prose"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
