name: TEMP materialize RD-04 North Dakota current public-record-gap promotion v1

on:
  pull_request:
    branches:
      - agent/ssc-rd04-nd-current-public-record-gap-promotion-materializer-base-v1
    types: [opened, synchronize, reopened]
    paths:
      - '.tmp/rd04-nd-current-public-record-gap-promotion-v1/trigger.json'

permissions:
  contents: write

concurrency:
  group: temp-rd04-nd-current-public-record-gap-promotion-v1
  cancel-in-progress: false

env:
  CANONICAL_PARENT: 77aef3313e85e1fddc68805a9f22252ff147b4e8
  PROGRAM_COMMIT: bc2818f7415e9edb8ae6675c656764653dcada9c
  PROGRAM_PATH: .tmp/rd04-nd-current-public-record-gap-promotion-v1/materialize.py
  PROGRAM_BLOB: ff83c90e8a8fb7a57dddf808e670f727dbb18e94
  PROGRAM_BYTES: '25731'
  PROGRAM_SHA256: f0e96c11da4b40ee9fe53f0f2a61bb91f6d44e967ebd91e8cc0bdc78c7461a12
  CANDIDATE_MERGE: d94b5ecd4547c7f051593fe330600985afc5e41c
  CANDIDATE_PRODUCT_COMMIT: 741fef03cf9d869a3370607158ccd27c527b0746
  CANDIDATE_PRODUCT_TREE: b4323c3a03b51875a1b6c2f5784b92aa07c714cd
  VALIDATION_PRODUCT_COMMIT: 5fd3d17e2534d5a06f1d2d935cae54f609b3952a
  VALIDATION_PRODUCT_TREE: 4a8b28c6d3e00ac72e8a9b3f6769b50fc0e29259
  BASE_BRANCH: agent/ssc-rd04-nd-current-public-record-gap-promotion-materializer-base-v1
  HEAD_BRANCH: agent/ssc-rd04-nd-current-public-record-gap-promotion-materializer-trigger-v1
  PRODUCT_BRANCH: agent/ssc-rd04-nd-current-public-record-gap-promotion-v1
  WORKFLOW_PATH: .github/workflows/temp-materialize-ssc-rd04-nd-current-public-record-gap-promotion-v1.yml
  TRIGGER_PATH: .tmp/rd04-nd-current-public-record-gap-promotion-v1/trigger.json
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  MATRIX_BYTES: '485610'
  MATRIX_SHA256: 663f93d84f168bf6ccdd92eaee0deb47b109f4280e7b25613853c2c1a6be2b63
  CANDIDATE_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/promotion-candidate.json
  CANDIDATE_BLOB: c5af22ad9457f93d3a34734982434bbee764b051
  SOURCE_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/source-corpus.json
  SOURCE_BLOB: c4cf754c064e4cc707b7b55ca872eff3006afe07
  DECISION_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/field-decision.json
  DECISION_BLOB: 54ab12737d4bcfba8f79373bab826d72db469d8d
  CANDIDATE_MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/product-manifest.json
  CANDIDATE_MANIFEST_BLOB: cede396081eae25a6b388b5e7c3ab7105e2f6a05
  VALIDATION_PROTOCOL_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation/validated-candidate-protocol.json
  VALIDATION_PROTOCOL_BLOB: 9abd89f655573827bfabad60e0923e2f80a7f4aa
  CANDIDATE_VALIDATION_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation/candidate-validation.json
  CANDIDATE_VALIDATION_BLOB: 504c828de461d3933af7d755d15e254cd2261ccd
  CURRENT_ROW_SHA256: 18f9b127b61e45edafb64c78bc8c387175fffdb351156ccf9154158ca467d2dd
  CURRENT_TARGET_SHA256: cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe
  CURRENT_ROW_STATE_SHA256: 6a4c7d204c6c99a89f3c121065860806668c5da850f44c67fe42b4dc84b1b5c3
  PROPOSED_CELL_SHA256: 8700619932bd128250a308d5dcd7b1586a363ae3b78e4eb80c23bfb72c8a2e25
  CANDIDATE_PAYLOAD_SHA256: 40e1904b1d98bb3894a39be7e7028e201e906d2659343b67df1c6869bd81f71b
  PROMOTION_ID: RD04-ND-CURRENT-PUBLIC-RECORD-GAP-PROMOTION-V1
  VALIDATION_ARTIFACT_ID: '9044162097'
  VALIDATION_ARTIFACT_NAME: ssc-rd04-nd-current-public-record-gap-validation-v1
  VALIDATION_ARTIFACT_BYTES: '8035'
  VALIDATION_ARTIFACT_SHA256: 38da554f82b05dacae14428217d529e6457a0b3bdfc065aeaefa725764e32ccc
  OUT: /tmp/rd04-nd-current-public-record-gap-promotion-v1

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'agent/ssc-rd04-nd-current-public-record-gap-promotion-materializer-base-v1' &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-current-public-record-gap-promotion-materializer-trigger-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bind validation, materialize exact one-cell promotion, and publish
        id: materialize
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          stage=bootstrap

          seal() {
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )
          }

          finalize() {
            rc=$?
            trap - EXIT
            set +e
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            if [[ ! -s "$OUT/receipt.json" ]]; then
              jq -n \
                --arg stage "$stage" \
                --argjson exit_code "$rc" \
                --arg parent "$CANONICAL_PARENT" \
                --arg promotion "$PROMOTION_ID" \
                '{schema_version:"ssc-rd04-nd-current-public-record-gap-promotion-materializer@1",
                  state:"failed_closed",failed_or_final_stage:$stage,exit_code:$exit_code,
                  canonical_parent:$parent,promotion_id:$promotion,product_branch_moved:false,
                  permanent_paths_added:0,source_requests:0,route_executions:0,source_admissions:0,
                  field_terminalizations:0,matrix_updates:0,row_state_mutations:0,
                  row_terminalizations:0,class_closed:false,outside_human_dependency:false}' \
                > "$OUT/receipt.json"
            fi
            seal
            exit "$rc"
          }
          trap finalize EXIT

          stage=bind_exact_three_level_carrier
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git rev-parse "$EVENT_HEAD_SHA^")" = "$EVENT_BASE_SHA"
          test "$(git rev-parse "$EVENT_BASE_SHA^")" = "$PROGRAM_COMMIT"
          test "$(git rev-parse "$PROGRAM_COMMIT^")" = "$CANONICAL_PARENT"
          test "$(git rev-list --count "$CANONICAL_PARENT..$PROGRAM_COMMIT")" -eq 1
          test "$(git rev-list --count "$PROGRAM_COMMIT..$EVENT_BASE_SHA")" -eq 1
          test "$(git rev-list --count "$EVENT_BASE_SHA..$EVENT_HEAD_SHA")" -eq 1
          test "$(git diff --name-only "$CANONICAL_PARENT" "$PROGRAM_COMMIT")" = "$PROGRAM_PATH"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" "$PROGRAM_COMMIT")" = "$PROGRAM_PATH"
          test "$(git diff --name-only "$PROGRAM_COMMIT" "$EVENT_BASE_SHA")" = "$WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$PROGRAM_COMMIT" "$EVENT_BASE_SHA")" = "$WORKFLOW_PATH"
          test "$(git diff --name-only "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA")" = "$TRIGGER_PATH"
          test "$(git diff --name-only --diff-filter=A "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA")" = "$TRIGGER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" "$PROGRAM_COMMIT")"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$PROGRAM_COMMIT" "$EVENT_BASE_SHA")"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA")"
          git diff --check "$CANONICAL_PARENT" "$EVENT_HEAD_SHA"
          test "$(git rev-parse "HEAD:$PROGRAM_PATH")" = "$PROGRAM_BLOB"
          test "$(stat -c %s "$PROGRAM_PATH")" -eq "$PROGRAM_BYTES"
          test "$(sha256sum "$PROGRAM_PATH" | awk '{print $1}')" = "$PROGRAM_SHA256"
          python -m py_compile "$PROGRAM_PATH"
          PROGRAM_ABS="$(realpath "$PROGRAM_PATH")"
          cp "$TRIGGER_PATH" "$OUT/trigger.json"

          stage=bind_live_main_candidate_validation_and_matrix
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$CANONICAL_PARENT"
          test "$(git rev-parse "$CANONICAL_PARENT^1")" = "$CANDIDATE_MERGE"
          test "$(git rev-parse "$CANONICAL_PARENT^2")" = "$VALIDATION_PRODUCT_COMMIT"
          test "$(git rev-parse "$VALIDATION_PRODUCT_COMMIT^{tree}")" = "$VALIDATION_PRODUCT_TREE"
          test "$(git rev-parse "$CANDIDATE_MERGE^2")" = "$CANDIDATE_PRODUCT_COMMIT"
          test "$(git rev-parse "$CANDIDATE_PRODUCT_COMMIT^{tree}")" = "$CANDIDATE_PRODUCT_TREE"
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$MATRIX_BLOB"
          test "$(git rev-parse "origin/main:$CANDIDATE_PATH")" = "$CANDIDATE_BLOB"
          test "$(git rev-parse "origin/main:$SOURCE_PATH")" = "$SOURCE_BLOB"
          test "$(git rev-parse "origin/main:$DECISION_PATH")" = "$DECISION_BLOB"
          test "$(git rev-parse "origin/main:$CANDIDATE_MANIFEST_PATH")" = "$CANDIDATE_MANIFEST_BLOB"
          test "$(git rev-parse "origin/main:$VALIDATION_PROTOCOL_PATH")" = "$VALIDATION_PROTOCOL_BLOB"
          test "$(git rev-parse "origin/main:$CANDIDATE_VALIDATION_PATH")" = "$CANDIDATE_VALIDATION_BLOB"
          test -z "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH")"

          stage=authenticate_hosted_validation_artifact
          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID" \
            > "$OUT/validation-artifact-metadata.json"
          jq -e \
            --argjson id "$VALIDATION_ARTIFACT_ID" \
            --arg name "$VALIDATION_ARTIFACT_NAME" \
            --argjson bytes "$VALIDATION_ARTIFACT_BYTES" \
            --arg digest "sha256:$VALIDATION_ARTIFACT_SHA256" \
            '.id==$id and .name==$name and .size_in_bytes==$bytes and .expired==false and .digest==$digest' \
            "$OUT/validation-artifact-metadata.json" > /dev/null
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" \
            -o "$OUT/validation-artifact.zip"
          test "$(stat -c %s "$OUT/validation-artifact.zip")" -eq "$VALIDATION_ARTIFACT_BYTES"
          test "$(sha256sum "$OUT/validation-artifact.zip" | awk '{print $1}')" = "$VALIDATION_ARTIFACT_SHA256"
          unzip -t "$OUT/validation-artifact.zip" > "$OUT/validation-artifact-zip-test.txt"
          mkdir "$OUT/validation-artifact"
          unzip -q "$OUT/validation-artifact.zip" -d "$OUT/validation-artifact"
          test -s "$OUT/validation-artifact/SHA256SUMS"
          (cd "$OUT/validation-artifact" && sha256sum -c SHA256SUMS > "$OUT/validation-artifact-internal-checks.txt")
          jq -e '
            .state=="validated_candidate_requires_separate_promotion" and
            .canonical_parent=="d94b5ecd4547c7f051593fe330600985afc5e41c" and
            .candidate_id=="RD04-ND-CURRENT-WAIVER-PUBLIC-RECORD-GAP-CANDIDATE" and
            .current_cell_sha256=="cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe" and
            .proposed_cell_sha256=="8700619932bd128250a308d5dcd7b1586a363ae3b78e4eb80c23bfb72c8a2e25" and
            .source_ids_resolved==true and .validated_candidates==1 and .rejected_candidates==0 and
            .projected_terminal_cells==228 and .projected_still_open_cells==222 and
            .projected_open_substantive_cells==182 and .projected_terminal_units==10 and
            .projected_nd_terminal_fields==8 and .projected_nd_open_fields==1 and
            .projected_nd_row_state=="still_open" and
            .separate_promotion_product_authorized==true and .promotion_executed_here==false and
            .field_terminalizations==0 and .matrix_updates==0 and
            .row_state_mutations==0 and .row_terminalizations==0 and
            .class_closed==false and .outside_human_dependency==false
          ' "$OUT/validation-artifact/validation-receipt.json" > /dev/null

          stage=construct_exact_one_cell_promotion_product
          WORK="$(mktemp -d)"
          git worktree add --detach "$WORK" "$CANONICAL_PARENT"
          python "$PROGRAM_ABS" construct "$WORK" "$OUT/construction-receipt.json"
          cd "$WORK"
          EXPECTED_PATHS="$(printf '%s\n' \
            "$PRODUCT_ROOT/cell-promotion-ledger.json" \
            "$PRODUCT_ROOT/product-manifest.json" \
            "$PRODUCT_ROOT/promoted-partial-field-matrix.json" \
            "$PRODUCT_ROOT/promotion-decision.json" \
            "$PRODUCT_ROOT/promotion-input-custody.json" \
            "$PRODUCT_ROOT/promotion-receipt.json" \
            "$PRODUCT_ROOT/remaining-open-field-census.json" \
            "$PRODUCT_ROOT/summary.json" | LC_ALL=C sort)"
          test "$(find "$PRODUCT_ROOT" -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)" = "$EXPECTED_PATHS"
          test "$(git status --short --untracked-files=all | sed 's/^?? //' | LC_ALL=C sort)" = "$EXPECTED_PATHS"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PRODUCT_ROOT"
          git commit -m 'Promote North Dakota current waiver public-record gap cell'
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse 'HEAD^{tree}')"
          MATRIX_AFTER_BLOB="$(git rev-parse "HEAD:$PRODUCT_ROOT/promoted-partial-field-matrix.json")"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_PARENT"
          test "$(git rev-list --count "$CANONICAL_PARENT..HEAD")" -eq 1
          test "$(git diff --name-only "$CANONICAL_PARENT" HEAD | LC_ALL=C sort)" = "$EXPECTED_PATHS"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD | LC_ALL=C sort)" = "$EXPECTED_PATHS"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"
          printf '%s\n' "$PRODUCT_COMMIT" > "$OUT/product-commit.txt"
          printf '%s\n' "$PRODUCT_TREE" > "$OUT/product-tree.txt"
          printf '%s\n' "$MATRIX_AFTER_BLOB" > "$OUT/matrix-after-blob.txt"
          git diff --name-only "$CANONICAL_PARENT" HEAD > "$OUT/product-paths.txt"
          git show "HEAD:$PRODUCT_ROOT/product-manifest.json" > "$OUT/product-manifest.json"
          git show "HEAD:$PRODUCT_ROOT/promotion-receipt.json" > "$OUT/promotion-receipt.json"

          stage=run_complete_repository_qualification
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check > "$OUT/release-check.log" 2>&1
          git reset --hard "$PRODUCT_COMMIT"
          git clean -fdx
          test -z "$(git status --porcelain)"

          stage=reverify_committed_product
          python "$PROGRAM_ABS" verify "$PRODUCT_ROOT" "$OUT/reverification.json"
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js

          stage=publish_qualified_promotion_product
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$CANONICAL_PARENT"
          test -z "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH")"
          git push origin "$PRODUCT_COMMIT:refs/heads/$PRODUCT_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_COMMIT"

          stage=complete
          CONSTRUCTION="$(cat "$OUT/construction-receipt.json")"
          PROMOTION_RECEIPT="$(cat "$OUT/promotion-receipt.json")"
          jq -n \
            --arg parent "$CANONICAL_PARENT" \
            --arg commit "$PRODUCT_COMMIT" \
            --arg tree "$PRODUCT_TREE" \
            --arg branch "$PRODUCT_BRANCH" \
            --arg matrix_blob "$MATRIX_AFTER_BLOB" \
            --arg promotion "$PROMOTION_ID" \
            --argjson construction "$CONSTRUCTION" \
            --argjson promotion_receipt "$PROMOTION_RECEIPT" \
            '{schema_version:"ssc-rd04-nd-current-public-record-gap-promotion-materializer@1",
              state:"qualified_promotion_product_published",failed_or_final_stage:"complete",exit_code:0,
              canonical_parent:$parent,product_commit:$commit,product_tree:$tree,product_branch:$branch,
              product_branch_moved:true,promotion_id:$promotion,matrix_after_blob:$matrix_blob,
              payload_combined_sha256:$construction.payload_combined_sha256,
              matrix_after_sha256:$construction.matrix_after_sha256,
              target_cell_after_sha256:$construction.target_cell_after_sha256,
              row_state_cell_after_sha256:$construction.row_state_cell_after_sha256,
              permanent_paths_added:8,source_requests:0,route_executions:0,source_admissions:0,
              field_terminalizations:1,matrix_updates:1,row_state_mutations:0,row_terminalizations:0,
              north_dakota_terminal_fields:8,north_dakota_open_fields:1,north_dakota_row_state:"still_open",
              class_closed:false,outside_human_dependency:false,
              promotion_receipt:$promotion_receipt}' > "$OUT/receipt.json"
          cd - >/dev/null
          git worktree remove --force "$WORK"
          seal
          trap - EXIT
          printf '%s\n' 0 > "$OUT/EXIT_CODE"
          printf '%s\n' complete > "$OUT/STAGE"
          seal
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Preserve promotion materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-current-public-record-gap-promotion-materializer-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Enforce exact one-cell promotion publication
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.materialize.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e '
            .state=="qualified_promotion_product_published" and
            .failed_or_final_stage=="complete" and .exit_code==0 and
            .product_branch_moved==true and .permanent_paths_added==8 and
            .promotion_id=="RD04-ND-CURRENT-PUBLIC-RECORD-GAP-PROMOTION-V1" and
            .target_cell_after_sha256=="8700619932bd128250a308d5dcd7b1586a363ae3b78e4eb80c23bfb72c8a2e25" and
            .row_state_cell_after_sha256=="6a4c7d204c6c99a89f3c121065860806668c5da850f44c67fe42b4dc84b1b5c3" and
            .source_requests==0 and .route_executions==0 and .source_admissions==0 and
            .field_terminalizations==1 and .matrix_updates==1 and
            .row_state_mutations==0 and .row_terminalizations==0 and
            .north_dakota_terminal_fields==8 and .north_dakota_open_fields==1 and
            .north_dakota_row_state=="still_open" and
            .class_closed==false and .outside_human_dependency==false
          ' "$OUT/receipt.json" > /dev/null
