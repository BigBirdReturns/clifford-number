name: Materialize Counter-Selector Wave 10 Batch 03 blind review

on:
  push:
    branches:
      - 'agent/counter-selector-wave-10-blind-review'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-10.yml'
      - '.github/materializers/counter-selector-wave-10/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-10.yml'
      - '.github/materializers/counter-selector-wave-10/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-10-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-10-blind-review

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 10 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-10/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-10.tar.gz
          echo 'dd9331dda37a9878ad5c16586fcc791e4fd4cde0d6aeab986b6d8c51f14fb16b  /tmp/counter-selector-wave-10.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-10.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-10

      - name: Build, validate, and attack Batch 03 blind review
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-10.mjs
          node tools/validate-counter-selector-wave-10.mjs
          node test/counter-selector-wave-10.test.js

      - name: Commit exact permanent Wave 10 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-10/payload-00 \
            .github/materializers/counter-selector-wave-10/payload-01 \
            .github/materializers/counter-selector-wave-10/payload-02 \
            .github/materializers/counter-selector-wave-10/payload-03 \
            data/project/counter-selector-blind-review-b03-registry.json \
            data/project/counter-selector-review-disagreement-b03-ledger.json \
            data/project/counter-selector-wave-10-blind-review.json \
            data/project/counter-selector-wave-10-release-manifest.json \
            docs/methods/counter-selector-blind-review-b03.md \
            docs/milestones/counter-selector-wave-10.md \
            reports/core-thesis/counter-selector-wave-10/data.json \
            reports/core-thesis/counter-selector-wave-10/index.html \
            schemas/counter-selector-blind-review-b03.schema.json \
            test/counter-selector-wave-10.test.js \
            tools/build-counter-selector-wave-10.mjs \
            tools/validate-counter-selector-wave-10.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Execute Counter-Selector Wave 10 Batch 03 blind review'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 10 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-10.mjs
          node tools/validate-counter-selector-wave-10.mjs
          node test/counter-selector-wave-10.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent Wave 10 head
        run: git push origin HEAD:agent/counter-selector-wave-10-blind-review
