name: TEMP materialize M-04G global tide v2

on:
  push:
    branches:
      - agent/m04g-global-tide-materializer-v2
    paths:
      - .github/workflows/temporary-m04g-global-tide-materializer-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, qualify, and publish bounded global-tide candidate
        shell: bash
        env:
          EXPECTED_BASE: 4b3f5bedee1876160ed4ac2c92186ac4fafe1659
          CANDIDATE_BRANCH: candidate/m04g-global-tide-v2
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git checkout --detach "$EXPECTED_BASE"

          python - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path('data/project/m04g-source-ecology-v2-policy.json')
          lib_path = Path('tools/lib/m04g-source-ecology-v2.mjs')
          test_path = Path('test/m05-answerable-power-sprint-03-leg-07.test.js')

          policy = json.loads(policy_path.read_text())
          lib = lib_path.read_text()
          test = test_path.read_text()

          expected_tide = {
              'tide_id': 'GDELT-GLOBAL-SERIAL',
              'match': 'gdelt',
              'mode': 'globally_serialized',
              'max_concurrency': 1,
              'minimum_interval_ms': 6500,
              'deduplicate_identical_requests': True,
              'route_results_back_to_original_basins': True,
          }
          tides = policy.get('global_tides', [])
          if tides != [expected_tide]:
              raise SystemExit(f'global-tide policy drift: {tides!r}')
          policy['global_tides'] = [{
              'tide_id': 'GDELT-GLOBAL-SERIAL',
              'match': 'gdelt',
              'mode': 'globally_serialized',
              'request_strategy': 'union_query_parameter',
              'query_parameter': 'query',
              'query_operator': 'OR',
              'request_route_selector': 'global_multilateral_basin_then_first',
              'logical_projection_content': 'metadata_only',
              'max_physical_requests': 1,
              'max_concurrency': 1,
              'minimum_interval_ms': 6500,
              'deduplicate_identical_requests': True,
              'preserve_non_query_parameters': True,
              'route_results_back_to_original_basins': True,
          }]
          policy_path.write_text(json.dumps(policy, indent=2) + '\n')

          anchor = """export function executionContractFailures(summary){
            const failures=[];
            if(summary?.execution_complete!==true)failures.push('the frozen 96-route orbit did not complete');
            if(summary?.unclassified_failures!==0)failures.push(`${summary?.unclassified_failures??'unknown'} failures were not classified`);
            return failures;
          }
          """
          addition = anchor + r"""
          function routeMatchesGlobalTide(route,tide){
            const match=String(tide?.match||'').trim();
            if(!match)return false;
            try{return hostMatches(new URL(route.url).hostname,match)}catch{return false}
          }

          function globalTideParameterFingerprint(url,queryParameter){
            return JSON.stringify(
              [...url.searchParams.entries()]
                .filter(([key])=>key!==queryParameter)
                .sort(([aKey,aValue],[bKey,bValue])=>aKey.localeCompare(bKey)||aValue.localeCompare(bValue))
            );
          }

          export function buildGlobalTideRequestUrl(routes,definition){
            if(!Array.isArray(routes)||routes.length===0)throw new Error('Global tide requires at least one logical route');
            if(definition?.request_strategy!=='union_query_parameter'){
              throw new Error(`Unsupported global-tide request strategy: ${definition?.request_strategy||'missing'}`);
            }
            if(Number(definition.max_physical_requests||1)!==1)throw new Error('Global tide must permit exactly one physical request');
            const queryParameter=String(definition.query_parameter||'query');
            const queryOperator=String(definition.query_operator||'OR').toUpperCase();
            if(queryOperator!=='OR')throw new Error(`Unsupported global-tide query operator: ${queryOperator}`);
            const parsed=routes.map((route)=>new URL(route.url));
            const template=parsed[0];
            const endpoint=`${template.origin}${template.pathname}`;
            const templateFingerprint=globalTideParameterFingerprint(template,queryParameter);
            const queryTerms=[];
            parsed.forEach((url,index)=>{
              if(`${url.origin}${url.pathname}`!==endpoint){
                throw new Error(`Global-tide endpoint drift at ${routes[index].route_id}`);
              }
              if(definition.preserve_non_query_parameters!==false&&globalTideParameterFingerprint(url,queryParameter)!==templateFingerprint){
                throw new Error(`Global-tide non-query parameter drift at ${routes[index].route_id}`);
              }
              const term=String(url.searchParams.get(queryParameter)||'').trim();
              if(!term)throw new Error(`Global-tide query missing at ${routes[index].route_id}`);
              if(!queryTerms.includes(term))queryTerms.push(term);
            });
            const queryUnion=`(${queryTerms.map((term)=>JSON.stringify(term)).join(` ${queryOperator} `)})`;
            const requestUrl=new URL(template);
            requestUrl.searchParams.set(queryParameter,queryUnion);
            return {
              url:requestUrl.toString(),
              query_parameter:queryParameter,
              query_operator:queryOperator,
              query_terms:queryTerms,
              query_union:queryUnion
            };
          }

          export function planGlobalTides(routes,policy){
            const assigned=new Set();
            const tides=[];
            for(const definition of policy.global_tides||[]){
              if(definition?.mode!=='globally_serialized')continue;
              const matched=routes.filter((route)=>!assigned.has(route.route_id)&&routeMatchesGlobalTide(route,definition));
              if(!matched.length)continue;
              if(definition.route_results_back_to_original_basins===false){
                throw new Error(`Global tide ${definition.tide_id||definition.match} cannot preserve basin routing`);
              }
              if(definition.logical_projection_content!=='metadata_only'){
                throw new Error(`Global tide ${definition.tide_id||definition.match} must keep logical projections metadata-only`);
              }
              const requestRoute=definition.request_route_selector==='global_multilateral_basin_then_first'
                ? matched.find((route)=>route.basin_id==='G01-GLOBAL-MULTILATERAL')||matched[0]
                : matched[0];
              const request=buildGlobalTideRequestUrl(matched,definition);
              for(const route of matched)assigned.add(route.route_id);
              tides.push({
                tide_id:definition.tide_id||`GLOBAL-TIDE-${tides.length+1}`,
                mode:definition.mode,
                match:definition.match,
                request_route_id:requestRoute.route_id,
                request_url:request.url,
                query_parameter:request.query_parameter,
                query_operator:request.query_operator,
                query_terms:request.query_terms,
                query_union:request.query_union,
                route_ids:matched.map((route)=>route.route_id),
                routes:matched,
                definition
              });
            }
            return {tides,ordinary_routes:routes.filter((route)=>!assigned.has(route.route_id))};
          }

          export function fanOutGlobalTideObservation(tide,sharedObservation){
            return tide.routes.map((route)=>{
              const requestProjection=route.route_id===tide.request_route_id;
              const routeSuccess=sharedObservation.route_success===true;
              const contentSuccess=requestProjection&&sharedObservation.content_success===true;
              const metadataOnly=routeSuccess&&!contentSuccess;
              const sharedContentSha256=sharedObservation.result?.content_sha256||null;
              return {
                ...sharedObservation,
                route_id:route.route_id,
                basin_id:route.basin_id,
                hydrology_class:route.hydrology_class,
                original_url:route.url,
                content_success:contentSuccess,
                metadata_only:metadataOnly,
                result:sharedObservation.result?{
                  ...sharedObservation.result,
                  content_success:contentSuccess,
                  metadata_only:metadataOnly,
                  content_sha256:contentSuccess?sharedContentSha256:null,
                  summary:contentSuccess
                    ? sharedObservation.result.summary
                    : routeSuccess
                      ? 'Shared global-tide metadata only; basin-specific content relevance was not established.'
                      : sharedObservation.result.summary
                }:sharedObservation.result,
                candidate_results:requestProjection
                  ? sharedObservation.candidate_results
                  : (sharedObservation.candidate_results||[]).map((candidate)=>({
                    ...candidate,
                    content_success:false,
                    metadata_only:routeSuccess,
                    content_sha256:null,
                    summary:routeSuccess
                      ? 'Shared global-tide metadata only; basin-specific content relevance was not established.'
                      : candidate.summary
                  })),
                global_tide:{
                  tide_id:tide.tide_id,
                  mode:tide.mode,
                  request_route_id:tide.request_route_id,
                  request_url:tide.request_url,
                  query_term_count:tide.query_terms.length,
                  query_union_sha256:sha256(tide.query_union),
                  routed_route_count:tide.route_ids.length,
                  shared_result:true,
                  request_projection:requestProjection,
                  logical_projection:!requestProjection,
                  source_content_sha256:sharedContentSha256,
                  basin_specific_relevance_established:false,
                  content_counting_scope:contentSuccess
                    ? 'global_request_route_only'
                    : routeSuccess
                      ? 'metadata_only'
                      : 'failed'
                }
              };
            });
          }
          """
          if lib.count(anchor) != 1:
              raise SystemExit('execution-contract anchor mismatch')
          lib = lib.replace(anchor, addition, 1)

          old_execution = """  const gate=new HostGate();
            const observations=await mapLimit(discovery.routes,policy.execution.global_concurrency,(route)=>executeRoute(route,policy,gate));
          """
          new_execution = """  const gate=new HostGate();
            const tidePlan=planGlobalTides(discovery.routes,policy);
            const physicalRouteExecutions=tidePlan.ordinary_routes.length+tidePlan.tides.length;
            const observationByRouteId=new Map();
            const globalTideReceipts=[];
            for(const tide of tidePlan.tides){
              const sourceRoute=tide.routes.find((route)=>route.route_id===tide.request_route_id);
              const requestRoute={...sourceRoute,url:tide.request_url};
              const sharedObservation=await executeRoute(requestRoute,policy,gate);
              for(const observation of fanOutGlobalTideObservation(tide,sharedObservation)){
                observationByRouteId.set(observation.route_id,observation);
              }
              globalTideReceipts.push({
                tide_id:tide.tide_id,
                mode:tide.mode,
                request_route_id:tide.request_route_id,
                request_url:tide.request_url,
                query_parameter:tide.query_parameter,
                query_operator:tide.query_operator,
                query_terms:tide.query_terms,
                query_union_sha256:sha256(tide.query_union),
                routed_route_ids:tide.route_ids,
                logical_route_count:tide.route_ids.length,
                physical_route_executions:1,
                route_success:sharedObservation.route_success,
                content_success:sharedObservation.content_success,
                content_projection_count:sharedObservation.content_success?1:0,
                metadata_projection_count:sharedObservation.route_success?Math.max(0,tide.route_ids.length-1):0,
                failure:sharedObservation.failure||null,
                basin_specific_relevance_established:false
              });
            }
            const ordinaryObservations=await mapLimit(
              tidePlan.ordinary_routes,
              policy.execution.global_concurrency,
              (route)=>executeRoute(route,policy,gate)
            );
            for(const observation of ordinaryObservations)observationByRouteId.set(observation.route_id,observation);
            const observations=discovery.routes.map((route)=>observationByRouteId.get(route.route_id));
            if(observations.some((row)=>!row)){
              throw new Error('Global tide routing failed to preserve the frozen route denominator');
            }
          """
          if lib.count(old_execution) != 1:
              raise SystemExit('orbit execution anchor mismatch')
          lib = lib.replace(old_execution, new_execution, 1)

          old_summary = """  const summary={
            selected:observations.length,
            route_successes:routeSuccesses,
          """
          new_summary = """  const summary={
            selected:observations.length,
            physical_route_executions:physicalRouteExecutions,
            global_tide_executions:tidePlan.tides.length,
            global_tide_logical_routes:tidePlan.tides.reduce((sum,tide)=>sum+tide.route_ids.length,0),
            route_successes:routeSuccesses,
          """
          if lib.count(old_summary) != 1:
              raise SystemExit('summary anchor mismatch')
          lib = lib.replace(old_summary, new_summary, 1)

          old_receipt = "const receiptCore={schema_version:'m04g-source-ecology-v2-orbit@1',generated_at:new Date().toISOString(),registry_file:discovery.registry_file,registry_path:discovery.registry_path,policy_sha256:sha256(JSON.stringify(policy)),route_ids:discovery.routes.map((row)=>row.route_id),summary,by_basin:byBasin,failure_counts:failureCounts};"
          new_receipt = "const receiptCore={schema_version:'m04g-source-ecology-v2-orbit@1',generated_at:new Date().toISOString(),registry_file:discovery.registry_file,registry_path:discovery.registry_path,policy_sha256:sha256(JSON.stringify(policy)),route_ids:discovery.routes.map((row)=>row.route_id),summary,by_basin:byBasin,failure_counts:failureCounts,global_tides:globalTideReceipts};"
          if lib.count(old_receipt) != 1:
              raise SystemExit('receipt anchor mismatch')
          lib = lib.replace(old_receipt, new_receipt, 1)
          lib_path.write_text(lib)

          old_import = "import { classifyFailure, executionContractFailures } from '../tools/lib/m04g-source-ecology-v2.mjs';"
          new_import = "import { buildGlobalTideRequestUrl, classifyFailure, executionContractFailures, fanOutGlobalTideObservation, planGlobalTides } from '../tools/lib/m04g-source-ecology-v2.mjs';"
          if test.count(old_import) != 1:
              raise SystemExit('test import anchor mismatch')
          test = test.replace(old_import, new_import, 1)

          old_assert = "assert.ok(discovery.routes.some((row)=>/gdelt/i.test(row.url)||/gdelt/i.test(row.route_id)));"
          new_assert = old_assert + r"""
          const gdeltDefinition=policy.global_tides.find((row)=>row.tide_id==='GDELT-GLOBAL-SERIAL');
          assert.deepEqual(gdeltDefinition,{
            tide_id:'GDELT-GLOBAL-SERIAL',
            match:'gdelt',
            mode:'globally_serialized',
            request_strategy:'union_query_parameter',
            query_parameter:'query',
            query_operator:'OR',
            request_route_selector:'global_multilateral_basin_then_first',
            logical_projection_content:'metadata_only',
            max_physical_requests:1,
            max_concurrency:1,
            minimum_interval_ms:6500,
            deduplicate_identical_requests:true,
            preserve_non_query_parameters:true,
            route_results_back_to_original_basins:true
          });
          const tidePlan=planGlobalTides(discovery.routes,policy);
          assert.equal(tidePlan.tides.length,1);
          assert.equal(tidePlan.ordinary_routes.length,84);
          const [gdeltTide]=tidePlan.tides;
          assert.equal(gdeltTide.tide_id,'GDELT-GLOBAL-SERIAL');
          assert.equal(gdeltTide.request_route_id,'M04G-GP001');
          assert.equal(gdeltTide.route_ids.length,12);
          assert.equal(new Set([...gdeltTide.route_ids,...tidePlan.ordinary_routes.map((row)=>row.route_id)]).size,96);
          const expectedQueries=gdeltTide.routes.map((row)=>new URL(row.url).searchParams.get('query'));
          assert.equal(new Set(expectedQueries).size,12);
          assert.deepEqual(gdeltTide.query_terms,expectedQueries);
          assert.equal(gdeltTide.query_union,`(${expectedQueries.map((term)=>JSON.stringify(term)).join(' OR ')})`);
          const tideRequestUrl=new URL(gdeltTide.request_url);
          assert.equal(tideRequestUrl.origin,'https://api.gdeltproject.org');
          assert.equal(tideRequestUrl.pathname,'/api/v2/doc/doc');
          assert.equal(tideRequestUrl.searchParams.get('query'),gdeltTide.query_union);
          assert.equal(tideRequestUrl.searchParams.get('mode'),'artlist');
          assert.equal(tideRequestUrl.searchParams.get('format'),'json');
          assert.equal(tideRequestUrl.searchParams.get('maxrecords'),'10');
          assert.equal((gdeltTide.query_union.match(/ OR /g)||[]).length,11);
          assert.deepEqual(buildGlobalTideRequestUrl(gdeltTide.routes,gdeltDefinition).query_terms,expectedQueries);
          const driftUrl=new URL(gdeltTide.routes[1].url);
          driftUrl.searchParams.set('mode','timeline');
          assert.throws(
            ()=>buildGlobalTideRequestUrl(
              [gdeltTide.routes[0],{...gdeltTide.routes[1],url:driftUrl.toString()}],
              gdeltDefinition
            ),
            /non-query parameter drift/
          );
          const routedTide=fanOutGlobalTideObservation(gdeltTide,{
            route_id:gdeltTide.request_route_id,
            basin_id:'G01-GLOBAL-MULTILATERAL',
            hydrology_class:'ocean_discovery',
            original_url:gdeltTide.request_url,
            route_success:true,
            content_success:true,
            metadata_only:false,
            fallback_used:false,
            selected_candidate:0,
            result:{
              requested_url:gdeltTide.request_url,
              content_success:true,
              metadata_only:false,
              content_sha256:'fixture',
              summary:'fixture'
            },
            candidate_results:[{
              success:true,
              content_success:true,
              metadata_only:false,
              content_sha256:'fixture',
              summary:'fixture'
            }]
          });
          assert.equal(routedTide.length,12);
          assert.equal(new Set(routedTide.map((row)=>row.route_id)).size,12);
          assert.deepEqual(routedTide.map((row)=>row.route_id),gdeltTide.route_ids);
          assert.ok(routedTide.every((row)=>row.global_tide.shared_result===true));
          assert.ok(routedTide.every((row)=>row.global_tide.request_route_id==='M04G-GP001'));
          assert.ok(routedTide.every((row)=>row.global_tide.query_term_count===12));
          assert.equal(routedTide.filter((row)=>row.content_success).length,1);
          assert.equal(routedTide.filter((row)=>row.metadata_only).length,11);
          assert.ok(routedTide.every((row)=>row.global_tide.basin_specific_relevance_established===false));
          assert.ok(routedTide.filter((row)=>row.route_id!=='M04G-GP001').every((row)=>row.global_tide.logical_projection===true));
          assert.ok(routedTide.filter((row)=>row.route_id!=='M04G-GP001').every((row)=>row.result.content_sha256===null));
          assert.ok(routedTide.filter((row)=>row.route_id!=='M04G-GP001').every((row)=>row.result.content_success===false));
          assert.ok(routedTide.filter((row)=>row.route_id!=='M04G-GP001').every((row)=>row.candidate_results.every((candidate)=>candidate.content_success===false)));
          assert.ok(routedTide.every((row)=>row.result.requested_url===gdeltTide.request_url));
          const failedTide=fanOutGlobalTideObservation(gdeltTide,{
            route_id:gdeltTide.request_route_id,
            basin_id:'G01-GLOBAL-MULTILATERAL',
            hydrology_class:'ocean_discovery',
            original_url:gdeltTide.request_url,
            route_success:false,
            content_success:false,
            metadata_only:false,
            fallback_used:false,
            failure:'rate_limited',
            candidate_results:[{success:false,content_success:false,metadata_only:false,failure:'rate_limited'}]
          });
          assert.equal(failedTide.length,12);
          assert.ok(failedTide.every((row)=>row.route_success===false));
          assert.ok(failedTide.every((row)=>row.content_success===false));
          assert.ok(failedTide.every((row)=>row.metadata_only===false));
          assert.ok(failedTide.every((row)=>row.failure==='rate_limited'));
          """
          if test.count(old_assert) != 1:
              raise SystemExit('test assertion anchor mismatch')
          test = test.replace(old_assert, new_assert, 1)
          test_path.write_text(test)
          PY

          node --check tools/lib/m04g-source-ecology-v2.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07.test.js
          node tools/build-m05-answerable-power-sprint-03-leg-07.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-07.mjs
          node test/m05-answerable-power-sprint-03-leg-07.test.js
          npm run release:check

          mapfile -t generated < <(git diff --name-only "$EXPECTED_BASE" -- build)
          if (( ${#generated[@]} )); then
            printf 'restoring release-generated path: %s\n' "${generated[@]}"
          fi
          git restore --source="$EXPECTED_BASE" --worktree -- build
          git clean -fd -- build
          git diff --check

          rm -rf /tmp/m04g-global-tide-live
          node tools/run-m04g-source-ecology-v2.mjs --output-dir /tmp/m04g-global-tide-live
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const outputDir='/tmp/m04g-global-tide-live';
          const observations=JSON.parse(fs.readFileSync(`${outputDir}/m04g-source-ecology-v2-observations.json`,'utf8'));
          const receipt=JSON.parse(fs.readFileSync(`${outputDir}/m04g-source-ecology-v2-receipt.json`,'utf8'));
          assert.equal(receipt.summary.selected,96);
          assert.equal(receipt.summary.physical_route_executions,85);
          assert.equal(receipt.summary.global_tide_executions,1);
          assert.equal(receipt.summary.global_tide_logical_routes,12);
          assert.equal(receipt.summary.unclassified_failures,0);
          assert.equal(receipt.global_tides.length,1);
          const [tide]=receipt.global_tides;
          assert.equal(tide.tide_id,'GDELT-GLOBAL-SERIAL');
          assert.equal(tide.logical_route_count,12);
          assert.equal(tide.physical_route_executions,1);
          assert.equal(tide.query_terms.length,12);
          assert.equal(tide.route_success,true);
          assert.equal(tide.content_success,true);
          assert.equal(tide.content_projection_count,1);
          assert.equal(tide.metadata_projection_count,11);
          const rows=observations.filter((row)=>row.global_tide?.tide_id==='GDELT-GLOBAL-SERIAL');
          assert.equal(rows.length,12);
          assert.equal(new Set(rows.map((row)=>row.route_id)).size,12);
          assert.equal(new Set(rows.map((row)=>row.result?.requested_url)).size,1);
          assert.ok(rows.every((row)=>row.route_success===true));
          assert.equal(rows.filter((row)=>row.content_success).length,1);
          assert.equal(rows.filter((row)=>row.metadata_only).length,11);
          assert.ok(rows.every((row)=>row.global_tide.basin_specific_relevance_established===false));
          console.log(JSON.stringify({summary:receipt.summary,global_tide:tide},null,2));
          NODE

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "data/project/m04g-source-ecology-v2-policy.json"
          test "${changed[1]}" = "test/m05-answerable-power-sprint-03-leg-07.test.js"
          test "${changed[2]}" = "tools/lib/m04g-source-ecology-v2.mjs"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$CANDIDATE_BRANCH"
          git add data/project/m04g-source-ecology-v2-policy.json test/m05-answerable-power-sprint-03-leg-07.test.js tools/lib/m04g-source-ecology-v2.mjs
          git commit -m 'Repair M-04G global tide execution'
          git push --force origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - uses: actions/upload-artifact@v4
        with:
          name: m04g-global-tide-${{ github.run_id }}
          path: /tmp/m04g-global-tide-live/
          if-no-files-found: error
          retention-days: 30
