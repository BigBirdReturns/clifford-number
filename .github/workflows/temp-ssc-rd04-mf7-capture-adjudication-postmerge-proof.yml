name: TEMP prove canonical RD-04 seven-state capture adjudication

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: temp-ssc-rd04-mf7-capture-adjudication-postmerge-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - name: Prove exact canonical merge and rerun every gate
        run: |
          set -Eeuo pipefail
          RECEIPT=/tmp/ssc-rd04-mf7-capture-adjudication-postmerge-proof
          rm -rf "$RECEIPT"
          mkdir -p "$RECEIPT"

          git fetch --no-tags origin main
          MAIN=$(git rev-parse origin/main)
          test "$MAIN" = a49b18304a69e9637cd854d38e80b67d4165cc6c
          test "$(git rev-parse 'a49b18304a69e9637cd854d38e80b67d4165cc6c^1')" = 773bdf96026e9fe6d5e11f4d9dffa1629e2c0ea3
          test "$(git rev-parse 'a49b18304a69e9637cd854d38e80b67d4165cc6c^2')" = 187ffb0e45c8b3fbcf03929c3b898e917b62fc27
          test "$(git rev-parse '187ffb0e45c8b3fbcf03929c3b898e917b62fc27^')" = 773bdf96026e9fe6d5e11f4d9dffa1629e2c0ea3
          test "$(git rev-parse '187ffb0e45c8b3fbcf03929c3b898e917b62fc27^{tree}')" = fdc4acfb8b3381872c157d0bf9a8bd6947631bd3
          git merge-base --is-ancestor 187ffb0e45c8b3fbcf03929c3b898e917b62fc27 "$MAIN"

          mapfile -t PROOF_DELTA < <(git diff --name-only origin/main HEAD)
          test "${#PROOF_DELTA[@]}" -eq 1
          test "${PROOF_DELTA[0]}" = '.github/workflows/temp-ssc-rd04-mf7-capture-adjudication-postmerge-proof.yml'

          git diff --name-status 773bdf96026e9fe6d5e11f4d9dffa1629e2c0ea3 187ffb0e45c8b3fbcf03929c3b898e917b62fc27 > "$RECEIPT/product-name-status.txt"
          python - <<'PY'
          from pathlib import Path

          expected = {
              '.github/workflows/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.yml',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/authored-adjudication-decisions.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/capture-custody.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/capture-manifest.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/capture-route-results.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/index.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/pdf-visual-review-receipt.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/product-manifest.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/promoted-partial-field-matrix.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/remaining-open-field-census.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/route-adjudications.jsonl',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/summary.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication/terminal-target-cell-ledger.json',
              'docs/milestones/ssc-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.md',
              'schemas/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.schema.json',
              'test/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.test.js',
              'tools/build-status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.mjs',
              'tools/validate-status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.mjs',
          }
          rows = Path('/tmp/ssc-rd04-mf7-capture-adjudication-postmerge-proof/product-name-status.txt').read_text().splitlines()
          observed = set()
          for row in rows:
              status, path = row.split('\t', 1)
              if status != 'A':
                  raise SystemExit(f'non-addition product path: {row}')
              observed.add(path)
          if observed != expected:
              raise SystemExit(f'product path-set drift: {sorted(observed ^ expected)}')
          print('canonical_product_surface=18_addition_only')
          PY

          BUILDER=tools/build-status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.mjs
          VALIDATOR=tools/validate-status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.mjs
          TEST=test/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.test.js
          DATA=data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication
          SCHEMA=schemas/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.schema.json

          node --check "$BUILDER"
          node --check "$VALIDATOR"
          node --check "$TEST"
          node "$BUILDER" --check
          node "$VALIDATOR"
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          data = Path('data/intake/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication')
          schema = json.loads(Path('schemas/status-sovereignty-rd-wave03-rd04-ar-ga-md-nc-pa-ri-wv-capture-adjudication.schema.json').read_text())
          paths = sorted(data.glob('*.json'))
          if len(paths) != 11:
              raise SystemExit(f'JSON object denominator drift: {len(paths)}')
          validator = jsonschema.Draft202012Validator(schema)
          for path in paths:
              validator.validate(json.loads(path.read_text()))

          summary = json.loads((data / 'summary.json').read_text())
          assert summary['fixed_routes'] == 30
          assert summary['terminal_route_adjudications'] == 30
          assert summary['source_admissions'] == 22
          assert summary['target_cells'] == 21
          assert summary['observed_field_decisions'] == 14
          assert summary['not_publicly_recovered_field_decisions'] == 7
          assert summary['composition']['predecessor_terminal_cells'] == 190
          assert summary['composition']['newly_terminalized_cells'] == 21
          assert summary['composition']['terminal_cells_after'] == 211
          assert summary['composition']['still_open_cells_after'] == 239
          assert summary['composition']['terminal_substantive_cells_after'] == 108
          assert summary['composition']['still_open_substantive_cells_after'] == 192
          assert summary['composition']['target_rows_ready_for_separate_row_state_adjudication'] == 7
          assert summary['composition']['row_state_cells_terminalized'] == 0
          assert summary['composition']['terminal_units_after'] == 3
          assert summary['class_state'] == 'still_open'
          assert summary['class_closed'] is False
          assert summary['cumulative_ledger_effect'] == 'none'
          assert summary['outside_human_dependency'] is False
          assert summary['publication_effect'] == 'none'
          assert summary['adoption_effect'] == 'none'
          assert summary['graph_effect'] == 'none'
          print('closed_schema_validation=pass objects=11')
          print('canonical_adjudication=routes_30_sources_22_cells_21_terminal_211')
          PY
          node "$TEST" | tee "$RECEIPT/adversarial.txt"
          grep -qx 'adversarial_mutations_refused=663' "$RECEIPT/adversarial.txt"
          node tools/validate-no-magic-human-gate.mjs
          npm run release:check

          git restore --staged --worktree .
          git clean -fdx
          node "$BUILDER" --write
          node "$BUILDER" --check
          node "$VALIDATOR"
          node "$TEST"
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          python - <<'PY'
          import json
          from pathlib import Path

          receipt = {
              'schema_version': 'ssc-rd04-mf7-capture-adjudication-postmerge-proof@1',
              'canonical_main': 'a49b18304a69e9637cd854d38e80b67d4165cc6c',
              'canonical_parent': '773bdf96026e9fe6d5e11f4d9dffa1629e2c0ea3',
              'product_commit': '187ffb0e45c8b3fbcf03929c3b898e917b62fc27',
              'product_tree': 'fdc4acfb8b3381872c157d0bf9a8bd6947631bd3',
              'product_paths': 18,
              'fixed_routes': 30,
              'terminal_route_adjudications': 30,
              'source_admissions': 22,
              'target_cells': 21,
              'observed_field_decisions': 14,
              'not_publicly_recovered_field_decisions': 7,
              'terminal_cells_before': 190,
              'terminal_cells_after': 211,
              'still_open_substantive_cells_after': 192,
              'row_state_cells_still_open': 7,
              'adversarial_refusals': 663,
              'class_closed': False,
              'cumulative_ledger_effect': 'none',
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'focused_validation': 'pass',
              'closed_schema_objects': 11,
              'no_magic_human': 'pass',
              'complete_release_gate': 'pass',
              'clean_replay': 'pass',
              'status': 'complete',
          }
          Path('/tmp/ssc-rd04-mf7-capture-adjudication-postmerge-proof/proof.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Preserve canonical post-merge proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mf7-capture-adjudication-postmerge-proof
          path: /tmp/ssc-rd04-mf7-capture-adjudication-postmerge-proof
          if-no-files-found: error
          retention-days: 90
