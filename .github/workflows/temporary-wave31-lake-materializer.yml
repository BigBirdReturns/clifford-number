name: Temporary Wave 31 lake materializer

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/tmp/wave31-lake-materializer-trigger.json'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave31-lake-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave31-lake-materializer.yml'
          encoded_ref='agent%2Flake-allocator-war-public-routes-wave-31'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 31 lake workflow was not deleted before checkout' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-routes-wave-31
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize and seal Wave 31
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/run-wave31-lake-materializer.sh
