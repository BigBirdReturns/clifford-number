name: SSC RD-01 Wave 03 methodology-correction intake

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd01-methodology-correction/fixed-protocol-package.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd01-methodology-correction/field-matrix-contract.json'
      - 'data/intake/status-sovereignty-rd01-natsec100-outcome-controls.json'
      - 'data/project/ssc-residual-wave03/seeds/RD-01-C06.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'schemas/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs'
      - 'test/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd01-methodology-correction-intake.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd01-methodology-correction/fixed-protocol-package.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd01-methodology-correction/field-matrix-contract.json'
      - 'data/intake/status-sovereignty-rd01-natsec100-outcome-controls.json'
      - 'data/project/ssc-residual-wave03/seeds/RD-01-C06.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'schemas/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs'
      - 'test/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd01-methodology-correction-intake.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd01-wave03-methodology-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove frozen denominator and fixed protocol
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs
          node test/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore and deterministically replay intake derivation
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          node tools/build-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs --write
          node tools/validate-status-sovereignty-rd-wave03-rd01-methodology-correction-intake.mjs
          node test/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve fixed-protocol intake package
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-methodology-correction-intake
          path: |
            data/intake/status-sovereignty-rd-wave03-rd01-methodology-correction/fixed-protocol-package.json
            schemas/status-sovereignty-rd-wave03-rd01-methodology-correction-intake.schema.json
            docs/milestones/ssc-rd-wave03-rd01-methodology-correction-intake.md
          if-no-files-found: error
          retention-days: 90
