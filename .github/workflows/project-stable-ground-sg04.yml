name: Project stable-ground supersession 04

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg04*.json'
      - 'docs/milestones/project-stable-ground-sg04.md'
      - 'reports/core-thesis/stable-ground/sg04/**'
      - 'tools/build-project-stable-ground-sg04.mjs'
      - 'tools/validate-project-stable-ground-sg04.mjs'
      - 'test/project-stable-ground-sg04.test.js'
      - 'data/project/k0-*.json'
      - 'data/research/k0-role-neutral-*.json'
      - 'data/project/poof-clifford-*.json'
      - '.github/workflows/project-stable-ground-sg04.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg04*.json'
      - 'docs/milestones/project-stable-ground-sg04.md'
      - 'reports/core-thesis/stable-ground/sg04/**'
      - 'tools/build-project-stable-ground-sg04.mjs'
      - 'tools/validate-project-stable-ground-sg04.mjs'
      - 'test/project-stable-ground-sg04.test.js'
      - 'data/project/k0-*.json'
      - 'data/research/k0-role-neutral-*.json'
      - 'data/project/poof-clifford-*.json'
      - '.github/workflows/project-stable-ground-sg04.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate current SG-04
        run: |
          node tools/build-project-stable-ground-sg04.mjs
          node tools/validate-project-stable-ground-sg04.mjs
          node test/project-stable-ground-sg04.test.js
      - name: Validate preserved SG-01 through SG-03 history
        run: |
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
          node tools/validate-project-stable-ground-sg02.mjs
          node test/project-stable-ground-sg02.test.js
          node tools/validate-project-stable-ground-sg03.mjs
          node test/project-stable-ground-sg03.test.js
      - name: Revalidate K0, POOF, M-05, and DCA boundaries
        run: |
          node tools/validate-k0-role-neutral-wave-08.mjs
          node test/k0-role-neutral-wave-08.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-poof-constitutional-change.mjs
          node test/poof-constitutional-change.test.js
          node tools/validate-poof-clifford-ecology.mjs
          node test/poof-clifford-ecology.test.js
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-dca-h01.mjs
          node test/dca-h01.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic SG-04 products
        run: |
          git restore --staged --worktree .
          node tools/build-k0-role-neutral-wave-08.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/build-poof-clifford-ecology.mjs
          node tools/build-project-stable-ground-sg04.mjs
          npm run validate:stable-ground
          git diff --exit-code
          test -z "$(git status --porcelain)"
