name: TEMP qualify exact repaired PC-57 product tree

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc57-materializer-carrier
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      PARENT: bf48e7f424283232bae5060779d2d33e4d85bbcb
      PARENT_TREE: f764efc53e7eed82daa78950405389947795f9d0
      ARCHIVE_SHA256: a714b950dc0755b9e110b4d5e541175aea7cf1891ddaf5444cbe1c4a250ea03f
      ORIGINAL_MANIFEST_SHA256: 997e7bc5c3679a90b39a933d1c858d9d4e9a9984683d1fcdc2f3479bdca80f44
      REPAIRED_MANIFEST_GIT_BLOB: 96a2f9ba25e9861264ac57ea428a27d116646496
      REPAIR_PATCH_SHA256: 6fcad6dce9d42e69d17832967378d154feb9185e7a53bb6f331a7b2349f0459a
      REPAIR_RECEIPT_GIT_BLOB: a1dbabcddfb8e118c9893d606f18f8af1865cc29
      WORK: /tmp/pc57-qualified-product
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate, reconstruct, and repair exact product
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$WORK"
          mkdir -p "$WORK/receipt"

          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(sha256sum .tmp/pc57/product-manifest.json | awk '{print $1}')" = "$ORIGINAL_MANIFEST_SHA256"
          test "$(git hash-object .tmp/pc57/repaired-product-manifest.json)" = "$REPAIRED_MANIFEST_GIT_BLOB"
          test "$(sha256sum .tmp/pc57/clean-checkout-materialization.patch | awk '{print $1}')" = "$REPAIR_PATCH_SHA256"
          test "$(git hash-object .tmp/pc57/clean-checkout-repair-receipt.json)" = "$REPAIR_RECEIPT_GIT_BLOB"

          sha256sum -c <<'SUMS'
          dd2b0dd8965713cf7eff06a91672a303a2904e416704e173ab7aa5d6fe223791  .tmp/pc57/product.b64.00
          988cc395b7c27f70964ef6512fc58cfb2bd33d38319e098c3e3cc66b3ab01380  .tmp/pc57/product.b64.01
          c452b63b92c42ef4ae7ffebb3150f79586012d6819b33840f1c8b1486ae0790c  .tmp/pc57/product.b64.02
          26ddf26f43b67897186f3bd7ba3639053be71e0f2738f4855e46c9d3102c2f3c  .tmp/pc57/product.b64.03
          f761ce582bb536d5bccb689b6219bd6ad0be016672fbaff5a5ca0a49b299b7d8  .tmp/pc57/product.b64.04
          e074c3b4064ac2c69f273a2a73a4c7728ce3276dcf683b44f8de6b8a1366e5a9  .tmp/pc57/product.b64.05
          dead2fed57443eeaf6b4d5a06f77761760e474f5e9beef6fb98c0ea8b00e5bfd  .tmp/pc57/product.b64.06
          04170d1b25d6337e8588c8e13db16db04ce936614b06834b37919225afe1bddf  .tmp/pc57/product.b64.07
          0b9dafbe899b7882e5b4705a48238d30b21df9ede6287153bcef8547f42d8190  .tmp/pc57/product.b64.08
          SUMS
          for shard in .tmp/pc57/product.b64.0{0..8}; do tr -d '\r\n' < "$shard"; done | base64 -d > "$WORK/product.tar.gz"
          test "$(sha256sum "$WORK/product.tar.gz" | awk '{print $1}')" = "$ARCHIVE_SHA256"

          git worktree add --detach "$WORK/repo" "$PARENT"
          tar -xzf "$WORK/product.tar.gz" -C "$WORK/repo"
          cp .tmp/pc57/product-manifest.json "$WORK/receipt/original-product-manifest.json"
          cp .tmp/pc57/repaired-product-manifest.json "$WORK/receipt/repaired-product-manifest.json"
          cp .tmp/pc57/clean-checkout-materialization.patch "$WORK/receipt/clean-checkout-materialization.patch"
          cp .tmp/pc57/clean-checkout-repair-receipt.json "$WORK/receipt/clean-checkout-repair-receipt.json"

          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          work = Path('/tmp/pc57-qualified-product')
          repo = work / 'repo'
          receipt = work / 'receipt'
          original = json.loads((receipt / 'original-product-manifest.json').read_text())
          repaired = json.loads((receipt / 'repaired-product-manifest.json').read_text())
          assert original['schema_version'] == 'pc57-product-manifest@1'
          assert repaired['schema_version'] == 'pc57-repaired-product-manifest@1'
          assert original['parent_commit'] == repaired['parent_commit'] == 'bf48e7f424283232bae5060779d2d33e4d85bbcb'
          assert original['parent_tree'] == repaired['parent_tree'] == 'f764efc53e7eed82daa78950405389947795f9d0'
          assert original['permanent_paths'] == repaired['permanent_paths'] == 14
          assert repaired['repair']['repair_patch_sha256'] == '6fcad6dce9d42e69d17832967378d154feb9185e7a53bb6f331a7b2349f0459a'
          assert repaired['repair']['original_archive_sha256'] == 'a714b950dc0755b9e110b4d5e541175aea7cf1891ddaf5444cbe1c4a250ea03f'
          expected_changed = {
              'test/preference-custody-manifest-v55.test.js',
              'test/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.test.js'
          }
          assert set(repaired['repair']['changed_paths']) == expected_changed
          assert [entry['path'] for entry in original['files']] == [entry['path'] for entry in repaired['files']]
          assert len({entry['path'] for entry in original['files']}) == 14
          changed = set()
          for before, after in zip(original['files'], repaired['files']):
              path = repo / before['path']
              payload = path.read_bytes()
              assert len(payload) == before['bytes'], before['path']
              assert hashlib.sha256(payload).hexdigest() == before['sha256'], before['path']
              blob = subprocess.check_output(['git', '-C', str(repo), 'hash-object', str(path)], text=True).strip()
              assert blob == before['git_blob'], before['path']
              if before != after:
                  changed.add(before['path'])
          assert changed == expected_changed
          (receipt / 'product-paths.txt').write_text('\n'.join(entry['path'] for entry in repaired['files']) + '\n')
          PY

          git -C "$WORK/repo" apply --check "$WORK/receipt/clean-checkout-materialization.patch"
          git -C "$WORK/repo" apply "$WORK/receipt/clean-checkout-materialization.patch"

          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          work = Path('/tmp/pc57-qualified-product')
          repo = work / 'repo'
          repaired = json.loads((work / 'receipt/repaired-product-manifest.json').read_text())
          for entry in repaired['files']:
              path = repo / entry['path']
              payload = path.read_bytes()
              assert len(payload) == entry['bytes'], entry['path']
              assert hashlib.sha256(payload).hexdigest() == entry['sha256'], entry['path']
              blob = subprocess.check_output(['git', '-C', str(repo), 'hash-object', str(path)], text=True).strip()
              assert blob == entry['git_blob'], entry['path']
              assert entry['mode'] == '100644'
          PY

          cd "$WORK/repo"
          git add -- $(cat "$WORK/receipt/product-paths.txt")
          git diff --cached --name-status "$PARENT" > "$WORK/receipt/product-delta.tsv"
          test "$(wc -l < "$WORK/receipt/product-delta.tsv" | tr -d ' ')" = 14
          awk '$1 != "A" { exit 1 }' "$WORK/receipt/product-delta.tsv"
          git diff --cached --check
          git write-tree > "$WORK/receipt/product-tree.txt"

          git fetch origin main
          git diff --name-only "$PARENT" origin/main | sort -u > "$WORK/receipt/live-main-changed-paths.txt"
          sort -u "$WORK/receipt/product-paths.txt" > "$WORK/receipt/product-paths.sorted"
          comm -12 "$WORK/receipt/product-paths.sorted" "$WORK/receipt/live-main-changed-paths.txt" > "$WORK/receipt/live-main-overlap.txt"
          test ! -s "$WORK/receipt/live-main-overlap.txt"
          git rev-parse origin/main > "$WORK/receipt/live-main.txt"

      - name: Run focused and complete qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/repo"
          rm -rf build/research

          run_gate() {
            local name="$1"
            shift
            echo "==> $name"
            "$@" 2>&1 | tee "$WORK/receipt/${name}.log"
          }

          run_gate standalone-pc57 node test/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.test.js
          run_gate floor-v55 node test/preference-custody-manifest-v55.test.js

          : > "$WORK/receipt/historical-floors.log"
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            echo "==> $test_file" | tee -a "$WORK/receipt/historical-floors.log"
            node "$test_file" 2>&1 | tee -a "$WORK/receipt/historical-floors.log"
          done
          node test/preference-custody-manifest.test.js 2>&1 | tee -a "$WORK/receipt/historical-floors.log"

          run_gate no-magic-human node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js 2>&1 | tee -a "$WORK/receipt/no-magic-human.log"
          run_gate release-check npm run release:check

          git diff --cached --name-status "$PARENT" > "$WORK/receipt/final-product-delta.tsv"
          cmp "$WORK/receipt/product-delta.tsv" "$WORK/receipt/final-product-delta.tsv"
          git diff --cached --check
          test "$(git write-tree)" = "$(cat "$WORK/receipt/product-tree.txt")"

      - name: Publish immutable blobs and seal receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/repo"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          work = Path('/tmp/pc57-qualified-product')
          repo = work / 'repo'
          receipt_dir = work / 'receipt'
          manifest = json.loads((receipt_dir / 'repaired-product-manifest.json').read_text())
          published = []
          for entry in manifest['files']:
              payload = (repo / entry['path']).read_bytes()
              response = subprocess.check_output([
                  'gh', 'api', '--method', 'POST',
                  f"repos/{os.environ['GH_REPOSITORY']}/git/blobs",
                  '-f', 'encoding=base64',
                  '-f', f"content={base64.b64encode(payload).decode()}"
              ], text=True)
              blob = json.loads(response)['sha']
              assert blob == entry['git_blob'], (entry['path'], blob, entry['git_blob'])
              published.append({**entry, 'published_git_blob': blob})

          receipt = {
              'schema_version': 'pc57-qualified-repaired-product-tree-receipt@1',
              'status': 'qualified',
              'parent_commit': manifest['parent_commit'],
              'parent_tree': manifest['parent_tree'],
              'product_tree': (receipt_dir / 'product-tree.txt').read_text().strip(),
              'live_main': (receipt_dir / 'live-main.txt').read_text().strip(),
              'live_main_overlap_paths': [],
              'permanent_paths': len(published),
              'repaired_permanent_paths': manifest['repair']['changed_paths'],
              'repair_patch_sha256': manifest['repair']['repair_patch_sha256'],
              'files': published,
              'standalone_pc57': 'pass',
              'floor_v55': 'pass',
              'historical_preference_custody': 'pass',
              'base_preference_custody': 'pass',
              'no_magic_human': 'pass',
              'release_check': 'pass',
              'ref_updates': 0,
              'outside_human_dependency': False,
              'graph_effect': 'none'
          }
          (receipt_dir / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          sums = []
          for path in sorted(receipt_dir.iterdir()):
              if path.name == 'SHA256SUMS' or not path.is_file():
                  continue
              sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (receipt_dir / 'SHA256SUMS').write_text('\n'.join(sums) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pc57-qualified-repaired-product-tree
          path: /tmp/pc57-qualified-product/receipt
          if-no-files-found: error
