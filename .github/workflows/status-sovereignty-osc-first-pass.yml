name: Status-for-sovereignty Office of Strategic Capital denominator first pass

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-osc-first-pass.yml'
      - 'data/intake/status-sovereignty-osc-denominator-first-pass.json'
      - 'data/project/status-sovereignty-osc-denominator-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-osc-denominator-first-pass.schema.json'
      - 'docs/milestones/ssc-osc-denominator-first-pass.md'
      - 'tools/build-status-sovereignty-osc-first-pass.mjs'
      - 'tools/validate-status-sovereignty-osc-first-pass.mjs'
      - 'test/status-sovereignty-osc-first-pass.test.js'
      - 'build/core-thesis/status-sovereignty/osc-first-pass/**'
      - 'reports/core-thesis/status-sovereignty/osc-first-pass/**'
  push:
    branches:
      - main
      - 'agent/ssc-osc-denominator'
    paths:
      - '.github/workflows/status-sovereignty-osc-first-pass.yml'
      - 'data/intake/status-sovereignty-osc-denominator-first-pass.json'
      - 'data/project/status-sovereignty-osc-denominator-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-osc-denominator-first-pass.schema.json'
      - 'docs/milestones/ssc-osc-denominator-first-pass.md'
      - 'tools/build-status-sovereignty-osc-first-pass.mjs'
      - 'tools/validate-status-sovereignty-osc-first-pass.mjs'
      - 'test/status-sovereignty-osc-first-pass.test.js'
      - 'build/core-thesis/status-sovereignty/osc-first-pass/**'
      - 'reports/core-thesis/status-sovereignty/osc-first-pass/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the bounded OSC first pass
        run: |
          node tools/build-status-sovereignty-osc-first-pass.mjs
          node tools/validate-status-sovereignty-osc-first-pass.mjs
          node test/status-sovereignty-osc-first-pass.test.js
      - name: Require exact committed OSC products
        run: |
          git diff --exit-code -- \
            data/project/status-sovereignty-osc-denominator-first-pass-release-manifest.json \
            build/core-thesis/status-sovereignty/osc-first-pass/manifest.json \
            build/core-thesis/status-sovereignty/osc-first-pass/data.json \
            reports/core-thesis/status-sovereignty/osc-first-pass/data.json \
            reports/core-thesis/status-sovereignty/osc-first-pass/index.html
      - name: Prove publication exclusion
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/data/intake/status-sovereignty-osc-denominator-first-pass.json
          test ! -e dist/build/core-thesis/status-sovereignty/osc-first-pass
          test ! -e dist/reports/core-thesis/status-sovereignty/osc-first-pass
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic reconstruction
        run: |
          git restore --staged --worktree .
          node tools/build-status-sovereignty-osc-first-pass.mjs
          node tools/validate-status-sovereignty-osc-first-pass.mjs
          node test/status-sovereignty-osc-first-pass.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
