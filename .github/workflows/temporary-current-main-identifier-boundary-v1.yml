name: Temporary current-main identifier-boundary reparent v5

on:
  pull_request:
    paths:
      - '.github/current-main-identifier-boundary-trigger.txt'
      - '.github/workflows/temporary-current-main-identifier-boundary-v1.yml'

permissions:
  contents: write

concurrency:
  group: current-main-identifier-boundary-reparent-v5
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number' && github.event.pull_request.number == 2227
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAIN: 21b7be4cd4045529be198befaddd3a1d941143a1
      SOURCE_PARENT: cdc9d3670fb226e92ff90952c3f8a4392c532a26
      SOURCE_HEAD: 83a8ce7234a203f70be5e2e1cbb84fe665dd80b6
      CARRIER_PARENT: db24aa5bd392a359383d7b7d3434445217b87de4
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CARRIER_BRANCH: agent/current-main-identifier-context-v1
      BASE_LIBRARY: 5f68254d3e44de693e83503aed879160f9b7b997
      BASE_TEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PRODUCT_LIBRARY: e22bbb2899233ec1bf046cef79da20cb69797937
      PRODUCT_TEST: a3384f944235d9170b1cbf09779ab6898a21bccd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify and publish exact two-file product
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test '${{ github.event.pull_request.head.ref }}' = "$CARRIER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          expected_carrier="$(printf '%s\n' .github/current-main-identifier-boundary-trigger.txt .github/workflows/temporary-current-main-identifier-boundary-v1.yml | sort)"
          test "$(git diff --name-only HEAD^..HEAD | sort)" = "$expected_carrier"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          test "$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)" = "$SOURCE_HEAD"
          test "$(git rev-parse "$SOURCE_HEAD^")" = "$SOURCE_PARENT"
          test "$(git rev-list --count "$SOURCE_PARENT..$SOURCE_HEAD")" = 1
          test "$(git merge-base "$SOURCE_PARENT" "$MAIN")" = "$SOURCE_PARENT"

          expected_paths="$(printf '%s\n' test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs | sort)"
          expected_numstat="$(printf '103\t0\ttest/industrial-exhaust.test.js\n78\t9\ttools/lib/industrial-exhaust.mjs\n' | sort -k3)"
          test "$(git diff --name-only "$SOURCE_PARENT..$SOURCE_HEAD" | sort)" = "$expected_paths"
          test "$(git diff --numstat "$SOURCE_PARENT..$SOURCE_HEAD" | sort -k3)" = "$expected_numstat"
          test "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" = "$BASE_LIBRARY"
          test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" = "$BASE_TEST"
          test "$(git rev-parse "$SOURCE_HEAD:tools/lib/industrial-exhaust.mjs")" = "$PRODUCT_LIBRARY"
          test "$(git rev-parse "$SOURCE_HEAD:test/industrial-exhaust.test.js")" = "$PRODUCT_TEST"

          payload="$(mktemp -d)"
          work="$(mktemp -d)"
          cleanup() { git worktree remove --force "$work" >/dev/null 2>&1 || true; rm -rf "$payload" "$work"; }
          trap cleanup EXIT
          mkdir -p "$payload/tools/lib" "$payload/test"
          git show "$SOURCE_HEAD:tools/lib/industrial-exhaust.mjs" > "$payload/tools/lib/industrial-exhaust.mjs"
          git show "$SOURCE_HEAD:test/industrial-exhaust.test.js" > "$payload/test/industrial-exhaust.test.js"
          test "$(git hash-object "$payload/tools/lib/industrial-exhaust.mjs")" = "$PRODUCT_LIBRARY"
          test "$(git hash-object "$payload/test/industrial-exhaust.test.js")" = "$PRODUCT_TEST"

          git worktree add --detach "$work" "$MAIN"
          cp "$payload/tools/lib/industrial-exhaust.mjs" "$work/tools/lib/industrial-exhaust.mjs"
          cp "$payload/test/industrial-exhaust.test.js" "$work/test/industrial-exhaust.test.js"
          (
            cd "$work"
            test "$(git diff --name-only | sort)" = "$expected_paths"
            test "$(git diff --numstat | sort -k3)" = "$expected_numstat"
            git diff --check
            node --check tools/lib/industrial-exhaust.mjs
            node --check tools/crawl-industrial-exhaust.mjs
            node --check test/industrial-exhaust.test.js
            node test/industrial-exhaust.test.js
            node test/industrial-exhaust-artifacts.test.js
            npm run release:check
            git diff --check
          )
          git worktree remove --force "$work"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          test "$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)" = "$SOURCE_HEAD"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach --force "$MAIN"
          cp "$payload/tools/lib/industrial-exhaust.mjs" tools/lib/industrial-exhaust.mjs
          cp "$payload/test/industrial-exhaust.test.js" test/industrial-exhaust.test.js
          git add -- tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$expected_paths"
          test "$(git diff --cached --numstat | sort -k3)" = "$expected_numstat"
          git commit -m 'fix(crawler): close identifier-context review boundaries'
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$MAIN"
          test "$(git diff --name-only "$MAIN..$new_head" | sort)" = "$expected_paths"
          test "$(git diff --numstat "$MAIN..$new_head" | sort -k3)" = "$expected_numstat"
          test "$(git rev-parse "$new_head:tools/lib/industrial-exhaust.mjs")" = "$PRODUCT_LIBRARY"
          test "$(git rev-parse "$new_head:test/industrial-exhaust.test.js")" = "$PRODUCT_TEST"

          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$SOURCE_HEAD" origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          {
            printf 'receipt_version=current-main-identifier-boundary-reparent@5\n'
            printf 'carrier_head=%s\n' "$HEAD_SHA"
            printf 'run_id=%s\n' '${{ github.run_id }}'
            printf 'base=%s\n' "$MAIN"
            printf 'superseded_product_head=%s\n' "$SOURCE_HEAD"
            printf 'published_product_head=%s\n' "$new_head"
            printf 'library_blob=%s\n' "$PRODUCT_LIBRARY"
            printf 'test_blob=%s\n' "$PRODUCT_TEST"
            printf 'changed_paths:\n%s\n' "$expected_paths"
            printf 'numstat:\n%s\n' "$expected_numstat"
          } > /tmp/current-main-identifier-boundary-reparent-receipt.txt
          printf 'product_head=%s\n' "$new_head" >> "$GITHUB_OUTPUT"
          cat /tmp/current-main-identifier-boundary-reparent-receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: current-main-identifier-boundary-reparent-${{ steps.publish.outputs.product_head }}
          path: /tmp/current-main-identifier-boundary-reparent-receipt.txt
          if-no-files-found: error
          retention-days: 30
