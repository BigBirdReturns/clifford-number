name: Temporary current-main identifier-boundary P1 repair v14

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-current-main-identifier-boundary-v1.yml'

permissions:
  contents: write

concurrency:
  group: current-main-identifier-boundary-repair-v14
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number' && github.event.pull_request.number == 2227
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_BASE: 645b6e979d31679835329cd0694fedd6e0955a59
      PRODUCT_HEAD: 1b1ad30dbf44eb145b74de09252760aa8115dfb5
      CARRIER_PARENT: a7431b554aeda1d4e7470a00b117e145d3b5a8ad
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CARRIER_BRANCH: agent/current-main-identifier-context-v1
      BASE_LIBRARY: 5f68254d3e44de693e83503aed879160f9b7b997
      BASE_TEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      SOURCE_LIBRARY: 5434f1cd0403e3a82febfc3684f8333b43f6f0d0
      SOURCE_TEST: 48f89f0a058a0d0395cb45cf16c088c9a3812b9c
      PATCH_WORK: /tmp/identifier-boundary-patch-v14
      QUALIFICATION_WORK: /tmp/identifier-boundary-qualification-v14
      EXPECTED_PATHS_FILE: /tmp/identifier-boundary-paths-v14.txt
      EXPECTED_NUMSTAT_FILE: /tmp/identifier-boundary-numstat-v14.txt
      RECEIPT_FILE: /tmp/identifier-boundary-receipt-v14.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pin live main and verify every input lease
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test '${{ github.event.pull_request.head.ref }}' = "$CARRIER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git diff --name-only "$CARRIER_PARENT..HEAD")" = \
            '.github/workflows/temporary-current-main-identifier-boundary-v1.yml'

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "+refs/heads/$CARRIER_BRANCH:refs/remotes/origin/$CARRIER_BRANCH"
          RUN_MAIN="$(git rev-parse refs/remotes/origin/main)"
          LIVE_PRODUCT="$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)"
          LIVE_CARRIER="$(git rev-parse refs/remotes/origin/$CARRIER_BRANCH)"
          printf 'run_main=%s\nproduct=%s\ncarrier=%s\n' \
            "$RUN_MAIN" "$LIVE_PRODUCT" "$LIVE_CARRIER"
          printf 'RUN_MAIN=%s\n' "$RUN_MAIN" >> "$GITHUB_ENV"

          test "$LIVE_CARRIER" = "$HEAD_SHA"
          test "$LIVE_PRODUCT" = "$PRODUCT_HEAD"
          test "$(git rev-parse "$PRODUCT_HEAD^")" = "$SOURCE_BASE"
          test "$(git rev-list --count "$SOURCE_BASE..$PRODUCT_HEAD")" = 1
          git merge-base --is-ancestor "$SOURCE_BASE" "$RUN_MAIN"
          test "$(git rev-parse "$SOURCE_BASE:tools/lib/industrial-exhaust.mjs")" = "$BASE_LIBRARY"
          test "$(git rev-parse "$SOURCE_BASE:test/industrial-exhaust.test.js")" = "$BASE_TEST"
          test "$(git rev-parse "$RUN_MAIN:tools/lib/industrial-exhaust.mjs")" = "$BASE_LIBRARY"
          test "$(git rev-parse "$RUN_MAIN:test/industrial-exhaust.test.js")" = "$BASE_TEST"
          test "$(git rev-parse "$PRODUCT_HEAD:tools/lib/industrial-exhaust.mjs")" = "$SOURCE_LIBRARY"
          test "$(git rev-parse "$PRODUCT_HEAD:test/industrial-exhaust.test.js")" = "$SOURCE_TEST"

          printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs \
            | LC_ALL=C sort > "$EXPECTED_PATHS_FILE"
          test "$(git diff --name-only "$SOURCE_BASE..$PRODUCT_HEAD" | LC_ALL=C sort)" = \
            "$(cat "$EXPECTED_PATHS_FILE")"

      - name: Materialize scored-prefix and whitespace-boundary repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PATCH_WORK" "$QUALIFICATION_WORK"
          git worktree prune
          git worktree add --detach "$PATCH_WORK" "$PRODUCT_HEAD"

          python - "$PATCH_WORK/tools/lib/industrial-exhaust.mjs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = r"""function identifierProtectedPrefixEnd(candidate, groups, externalSuffix) {
            const observationGroup = trailingObservationGroup(candidate, groups, '', externalSuffix);
            let protectedEnd = candidate.length;
            let protectedScore = null;
            for (let last = 0;
              last < groups.length
                && last < MAX_PHONE_DIGIT_GROUPS
                && last < observationGroup;
              last += 1) {
              const { start, end } = phoneWindowBounds(candidate, groups, 0, last);
              const slice = candidate.slice(start, end);
              let score = phoneCandidateScore(slice, '');
              if (!score) continue;
              if (last === observationGroup - 1) score += 32;
              else if (last === groups.length - 1) score += 24;
              else score -= 24;
              if (protectedScore == null
                  || score > protectedScore
                  || (score === protectedScore && end > protectedEnd)) {
                protectedScore = score;
                protectedEnd = end;
              }
            }
            if (protectedScore != null) return protectedEnd;

            for (let first = 1; first < groups.length; first += 1) {
              const previousEnd = groups[first - 1].index + groups[first - 1][0].length;
              const groupStart = groups[first].index;
              const separator = candidate.slice(previousEnd, groupStart).normalize('NFKC');
              const hardBoundary = /[\/／]/u.test(separator)
                || /[.．]\s+/u.test(separator);
              if (!hardBoundary) continue;
              if (!canStartIndependentPhone(candidate, groups, first, '')) continue;
              return phoneWindowBounds(candidate, groups, first, first).start;
            }
            return candidate.length;
          }
          """
          new = r"""function identifierProtectedPrefixEnd(candidate, groups, externalSuffix) {
            const observationGroup = trailingObservationGroup(candidate, groups, '', externalSuffix);
            if (observationGroup <= 0) return candidate.length;

            const completeBounds = phoneWindowBounds(
              candidate,
              groups,
              0,
              observationGroup - 1
            );
            const completeCandidate = candidate.slice(
              completeBounds.start,
              completeBounds.end
            );
            if (phoneCandidateScore(completeCandidate, '')) return completeBounds.end;

            const scoredBoundaries = [];
            const unscoredBoundaries = [];
            for (let first = 1; first < observationGroup; first += 1) {
              const previousEnd = groups[first - 1].index + groups[first - 1][0].length;
              const groupStart = groups[first].index;
              const separator = candidate.slice(previousEnd, groupStart).normalize('NFKC');
              const hardBoundary = /[\/／]/u.test(separator)
                || /[.．]\s+/u.test(separator);
              const whitespaceBoundary = /\s/u.test(separator);
              if (!hardBoundary && !whitespaceBoundary) continue;
              if (!canStartIndependentPhone(candidate, groups, first, '')) continue;

              const { start } = phoneWindowBounds(candidate, groups, first, first);
              const protectedPrefix = candidate.slice(0, start).trimEnd();
              const prefixScore = phoneCandidateScore(protectedPrefix, '');
              const protectedDigits = protectedPrefix
                .normalize('NFKC')
                .replace(/\D/gu, '')
                .length;
              const proposal = { start, prefixScore, protectedDigits };
              if (prefixScore) scoredBoundaries.push(proposal);
              else if (hardBoundary || (first === 1 && protectedDigits >= 7)) {
                unscoredBoundaries.push(proposal);
              }
            }

            if (scoredBoundaries.length) {
              scoredBoundaries.sort((left, right) =>
                right.start - left.start
                  || right.prefixScore - left.prefixScore
                  || right.protectedDigits - left.protectedDigits);
              return scoredBoundaries[0].start;
            }
            if (unscoredBoundaries.length) {
              unscoredBoundaries.sort((left, right) => left.start - right.start);
              return unscoredBoundaries[0].start;
            }
            return candidate.length;
          }
          """
          if text.count(old) != 1:
              raise RuntimeError(f'identifier boundary anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python - "$PATCH_WORK/test/industrial-exhaust.test.js" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          marker = "for (const completeGroupedIdentifier of [\n"
          insert = r"""for (const [reviewBoundaryInput, expected] of [
            [
              'ID: 09012345678 / (03) 6216 8041',
              'ID: 09012345678 / [contact omitted]'
            ],
            [
              'ＩＤ：０９０１２３４５６７８／（０３） ６２１６ ８０４１',
              'ＩＤ：０９０１２３４５６７８／[contact omitted]'
            ],
            [
              'ID: 01 42 68 53 00 / (03) 6216 8041',
              'ID: 01 42 68 53 00 / [contact omitted]'
            ],
            [
              'ID: 12345678 03-6216-8041',
              'ID: 12345678 [contact omitted]'
            ],
            [
              'ID: 12345678 (03) 6216 8041',
              'ID: 12345678 [contact omitted]'
            ],
            [
              'ID: 09012345678 (03) 6216 8041',
              'ID: 09012345678 [contact omitted]'
            ]
          ]) {
            assert.equal(
              redactContactData(reviewBoundaryInput),
              expected,
              'validated boundaries must be selected before a later phone group can extend identifier scope'
            );
          }
          for (const unsplitWhitespaceIdentifier of [
            'ID: 1 212 555 1234',
            'ID: 999 212 555 1234',
            'ID: 12345678 87654321'
          ]) {
            assert.equal(
              redactContactData(unsplitWhitespaceIdentifier),
              unsplitWhitespaceIdentifier,
              'whitespace alone must not split a complete or insufficiently bounded numeric identifier'
            );
          }

          """
          if text.count(marker) != 1:
              raise RuntimeError(f'review-regression marker count: {text.count(marker)}')
          path.write_text(text.replace(marker, f'{insert}{marker}', 1), encoding='utf-8')
          PY

          cd "$PATCH_WORK"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(cat "$EXPECTED_PATHS_FILE")"
          git diff --check
          NEW_LIBRARY="$(git hash-object tools/lib/industrial-exhaust.mjs)"
          NEW_TEST="$(git hash-object test/industrial-exhaust.test.js)"
          printf 'new_library=%s\nnew_test=%s\n' "$NEW_LIBRARY" "$NEW_TEST"
          test "$NEW_LIBRARY" != "$SOURCE_LIBRARY"
          test "$NEW_TEST" != "$SOURCE_TEST"
          printf 'NEW_LIBRARY=%s\n' "$NEW_LIBRARY" >> "$GITHUB_ENV"
          printf 'NEW_TEST=%s\n' "$NEW_TEST" >> "$GITHUB_ENV"

      - name: Qualify exact product on pinned main
        shell: bash
        run: |
          set -euo pipefail
          cd "$PATCH_WORK"
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js

          git worktree add --detach "$QUALIFICATION_WORK" "$RUN_MAIN"
          cp "$PATCH_WORK/tools/lib/industrial-exhaust.mjs" "$QUALIFICATION_WORK/tools/lib/industrial-exhaust.mjs"
          cp "$PATCH_WORK/test/industrial-exhaust.test.js" "$QUALIFICATION_WORK/test/industrial-exhaust.test.js"
          cd "$QUALIFICATION_WORK"
          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "$NEW_LIBRARY"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "$NEW_TEST"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(cat "$EXPECTED_PATHS_FILE")"
          git diff --check
          git diff --numstat | LC_ALL=C sort -k3 > "$EXPECTED_NUMSTAT_FILE"
          test "$(sed '/^$/d' "$EXPECTED_NUMSTAT_FILE" | wc -l)" -eq 2
          printf '%s\n' 'qualified pinned-main numstat:'
          cat "$EXPECTED_NUMSTAT_FILE"

          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          npm run release:check

          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "$NEW_LIBRARY"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "$NEW_TEST"
          git diff --check -- tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          test "$(git diff --name-only -- \
            tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js | LC_ALL=C sort)" = \
            "$(cat "$EXPECTED_PATHS_FILE")"
          test "$(git diff --numstat -- \
            tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js | LC_ALL=C sort -k3)" = \
            "$(cat "$EXPECTED_NUMSTAT_FILE")"

      - name: Revalidate live leases and publish two-file product
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "+refs/heads/$CARRIER_BRANCH:refs/remotes/origin/$CARRIER_BRANCH"
          LIVE_MAIN="$(git rev-parse refs/remotes/origin/main)"
          LIVE_PRODUCT="$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)"
          LIVE_CARRIER="$(git rev-parse refs/remotes/origin/$CARRIER_BRANCH)"
          printf 'revalidated_main=%s\nproduct=%s\ncarrier=%s\n' \
            "$LIVE_MAIN" "$LIVE_PRODUCT" "$LIVE_CARRIER"
          test "$LIVE_MAIN" = "$RUN_MAIN"
          test "$LIVE_PRODUCT" = "$PRODUCT_HEAD"
          test "$LIVE_CARRIER" = "$HEAD_SHA"
          test "$(git rev-parse "$RUN_MAIN:tools/lib/industrial-exhaust.mjs")" = "$BASE_LIBRARY"
          test "$(git rev-parse "$RUN_MAIN:test/industrial-exhaust.test.js")" = "$BASE_TEST"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach --force "$RUN_MAIN"
          cp "$PATCH_WORK/tools/lib/industrial-exhaust.mjs" tools/lib/industrial-exhaust.mjs
          cp "$PATCH_WORK/test/industrial-exhaust.test.js" test/industrial-exhaust.test.js
          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "$NEW_LIBRARY"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "$NEW_TEST"
          git add -- tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$(cat "$EXPECTED_PATHS_FILE")"
          test "$(git diff --cached --numstat | LC_ALL=C sort -k3)" = "$(cat "$EXPECTED_NUMSTAT_FILE")"
          git commit -m 'fix(crawler): close scored and whitespace identifier boundaries'
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$RUN_MAIN"
          test "$(git rev-list --count "$RUN_MAIN..$NEW_HEAD")" = 1
          test "$(git diff --name-only "$RUN_MAIN..$NEW_HEAD" | LC_ALL=C sort)" = \
            "$(cat "$EXPECTED_PATHS_FILE")"
          test "$(git diff --numstat "$RUN_MAIN..$NEW_HEAD" | LC_ALL=C sort -k3)" = \
            "$(cat "$EXPECTED_NUMSTAT_FILE")"
          test "$(git rev-parse "$NEW_HEAD:tools/lib/industrial-exhaust.mjs")" = "$NEW_LIBRARY"
          test "$(git rev-parse "$NEW_HEAD:test/industrial-exhaust.test.js")" = "$NEW_TEST"

          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$PRODUCT_HEAD" \
            origin "HEAD:refs/heads/$PRODUCT_BRANCH"

          {
            printf 'receipt_version=current-main-identifier-boundary-repair@14\n'
            printf 'carrier_head=%s\n' "$HEAD_SHA"
            printf 'run_id=%s\n' '${{ github.run_id }}'
            printf 'base=%s\n' "$RUN_MAIN"
            printf 'superseded_product_head=%s\n' "$PRODUCT_HEAD"
            printf 'published_product_head=%s\n' "$NEW_HEAD"
            printf 'published_tree=%s\n' "$NEW_TREE"
            printf 'library_blob=%s\n' "$NEW_LIBRARY"
            printf 'test_blob=%s\n' "$NEW_TEST"
            printf 'changed_paths:\n%s\n' "$(cat "$EXPECTED_PATHS_FILE")"
            printf 'numstat:\n%s\n' "$(cat "$EXPECTED_NUMSTAT_FILE")"
            printf 'qualification=node-check+industrial-exhaust+artifacts+release-check+pinned-main-numstat+path-scoped-post-gate-custody\n'
          } > "$RECEIPT_FILE"
          printf 'product_head=%s\n' "$NEW_HEAD" >> "$GITHUB_OUTPUT"
          cat "$RECEIPT_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: current-main-identifier-boundary-repair-${{ steps.publish.outputs.product_head }}
          path: ${{ env.RECEIPT_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean worktrees
        if: always()
        shell: bash
        run: |
          git worktree remove --force "$PATCH_WORK" >/dev/null 2>&1 || true
          git worktree remove --force "$QUALIFICATION_WORK" >/dev/null 2>&1 || true
          rm -rf "$PATCH_WORK" "$QUALIFICATION_WORK"
