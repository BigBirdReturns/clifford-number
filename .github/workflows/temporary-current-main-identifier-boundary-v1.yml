name: Temporary current-main identifier-boundary reparent v4

on:
  pull_request:
    paths:
      - '.github/current-main-identifier-boundary-trigger.txt'
      - '.github/workflows/temporary-current-main-identifier-boundary-v1.yml'

permissions:
  contents: write

concurrency:
  group: current-main-identifier-boundary-reparent-v4
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number' && github.event.pull_request.number == 2227
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_MAIN: 21b7be4cd4045529be198befaddd3a1d941143a1
      EXPECTED_PRODUCT_PARENT: cdc9d3670fb226e92ff90952c3f8a4392c532a26
      EXPECTED_PRODUCT_HEAD: 83a8ce7234a203f70be5e2e1cbb84fe665dd80b6
      EXPECTED_CARRIER_PARENT: fdab932f05b0df42568d36684de35f7317afcb59
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CARRIER_BRANCH: agent/current-main-identifier-context-v1
      EXPECTED_MAIN_LIBRARY_BLOB: 5f68254d3e44de693e83503aed879160f9b7b997
      EXPECTED_MAIN_TEST_BLOB: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      EXPECTED_PRODUCT_LIBRARY_BLOB: e22bbb2899233ec1bf046cef79da20cb69797937
      EXPECTED_PRODUCT_TEST_BLOB: a3384f944235d9170b1cbf09779ab6898a21bccd
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate exact carrier, main, and product leases
        shell: bash
        run: |
          set -euo pipefail
          
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$PR_HEAD_REF" = "$CARRIER_BRANCH"
          test "$PR_NUMBER" = "2227"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CARRIER_PARENT"
          
          carrier_paths="$(git diff --name-only HEAD^..HEAD | LC_ALL=C sort)"
          expected_carrier_paths="$(printf '%s\n' \
            .github/current-main-identifier-boundary-trigger.txt \
            .github/workflows/temporary-current-main-identifier-boundary-v1.yml | LC_ALL=C sort)"
          test "$carrier_paths" = "$expected_carrier_paths"
          
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$EXPECTED_PRODUCT_HEAD"
          test "$(git rev-parse "${EXPECTED_PRODUCT_HEAD}^")" = "$EXPECTED_PRODUCT_PARENT"
          test "$(git rev-list --count "${EXPECTED_PRODUCT_PARENT}..${EXPECTED_PRODUCT_HEAD}")" = "1"
          test "$(git merge-base "$EXPECTED_PRODUCT_PARENT" "$EXPECTED_MAIN")" = "$EXPECTED_PRODUCT_PARENT"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_PRODUCT_HEAD")" = "$EXPECTED_PRODUCT_PARENT"
          
          expected_product_paths="$(printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs | LC_ALL=C sort)"
          product_paths="$(git diff --name-only "${EXPECTED_PRODUCT_PARENT}..${EXPECTED_PRODUCT_HEAD}" | LC_ALL=C sort)"
          test "$product_paths" = "$expected_product_paths"
          
          expected_product_numstat="$(printf '103\t0\ttest/industrial-exhaust.test.js\n78\t9\ttools/lib/industrial-exhaust.mjs\n' | LC_ALL=C sort -k3)"
          product_numstat="$(git diff --numstat "${EXPECTED_PRODUCT_PARENT}..${EXPECTED_PRODUCT_HEAD}" | LC_ALL=C sort -k3)"
          test "$product_numstat" = "$expected_product_numstat"
          
          test "$(git rev-parse "${EXPECTED_MAIN}:tools/lib/industrial-exhaust.mjs")" = "$EXPECTED_MAIN_LIBRARY_BLOB"
          test "$(git rev-parse "${EXPECTED_MAIN}:test/industrial-exhaust.test.js")" = "$EXPECTED_MAIN_TEST_BLOB"
          test "$(git rev-parse "${EXPECTED_PRODUCT_PARENT}:tools/lib/industrial-exhaust.mjs")" = "$EXPECTED_MAIN_LIBRARY_BLOB"
          test "$(git rev-parse "${EXPECTED_PRODUCT_PARENT}:test/industrial-exhaust.test.js")" = "$EXPECTED_MAIN_TEST_BLOB"
          test "$(git rev-parse "${EXPECTED_PRODUCT_HEAD}:tools/lib/industrial-exhaust.mjs")" = "$EXPECTED_PRODUCT_LIBRARY_BLOB"
          test "$(git rev-parse "${EXPECTED_PRODUCT_HEAD}:test/industrial-exhaust.test.js")" = "$EXPECTED_PRODUCT_TEST_BLOB"
          
          printf 'carrier_head=%s\n' "$PR_HEAD_SHA"
          printf 'current_main=%s\n' "$EXPECTED_MAIN"
          printf 'superseded_product_head=%s\n' "$EXPECTED_PRODUCT_HEAD"
          printf 'product_paths:\n%s\n' "$product_paths"
          printf 'product_numstat:\n%s\n' "$product_numstat"

      - name: Reparent, qualify, and publish one exact two-file product commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          
          expected_product_paths="$(printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs | LC_ALL=C sort)"
          expected_product_numstat="$(printf '103\t0\ttest/industrial-exhaust.test.js\n78\t9\ttools/lib/industrial-exhaust.mjs\n' | LC_ALL=C sort -k3)"
          
          artifact_root="$(mktemp -d)"
          qualification_root="$(mktemp -d)"
          qualification_dir="$qualification_root/repository"
          cleanup() {
            git worktree remove --force "$qualification_dir" >/dev/null 2>&1 || true
            rm -rf "$artifact_root" "$qualification_root"
          }
          trap cleanup EXIT
          
          mkdir -p "$artifact_root/tools/lib" "$artifact_root/test"
          git show "${EXPECTED_PRODUCT_HEAD}:tools/lib/industrial-exhaust.mjs" \
            > "$artifact_root/tools/lib/industrial-exhaust.mjs"
          git show "${EXPECTED_PRODUCT_HEAD}:test/industrial-exhaust.test.js" \
            > "$artifact_root/test/industrial-exhaust.test.js"
          
          test "$(git hash-object "$artifact_root/tools/lib/industrial-exhaust.mjs")" = "$EXPECTED_PRODUCT_LIBRARY_BLOB"
          test "$(git hash-object "$artifact_root/test/industrial-exhaust.test.js")" = "$EXPECTED_PRODUCT_TEST_BLOB"
          
          git worktree add --detach "$qualification_dir" "$EXPECTED_MAIN"
          cp "$artifact_root/tools/lib/industrial-exhaust.mjs" \
            "$qualification_dir/tools/lib/industrial-exhaust.mjs"
