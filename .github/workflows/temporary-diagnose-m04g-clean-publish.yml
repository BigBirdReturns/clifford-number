name: Temporary diagnose M-04G clean publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-diagnose-m04g-clean-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04g-global-circulation-clean-wave-02
          fetch-depth: 0
      - name: Install verified non-workflow products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/BigBirdReturns/clifford-number/actions/artifacts/8634151471/zip -o /tmp/program.zip
          rm -rf /tmp/program && mkdir -p /tmp/program
          unzip -q /tmp/program.zip -d /tmp/program
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          src=Path('/tmp/program'); manifest=json.loads((src/'MANIFEST.json').read_text())
          for row in manifest['files']:
            rel=row['path']
            if rel.startswith('.github/workflows/'): continue
            data=(src/rel).read_bytes(); assert len(data)==row['bytes']; assert hashlib.sha256(data).hexdigest()==row['sha256']
            dst=Path(rel); dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src/rel,dst)
          PY
      - name: Capture add, commit, and push transcript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          exec > >(tee /tmp/m04g-clean-publish-diagnostic.txt) 2>&1
          echo "event=$GITHUB_EVENT_NAME"
          echo "actor=$GITHUB_ACTOR"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          git remote -v
          git branch -vv
          git status --porcelain=v1 --untracked-files=all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- build/core-thesis/global-circulation/data.json data/intake/m04g-global-circulation-sources-01.json data/project/m04g-global-circulation-basins.json data/project/m04g-global-circulation-currents.json data/project/m04g-global-circulation-fanout.json data/project/m04g-global-circulation-methodology.json data/project/m04g-global-circulation-polls.json docs/methods/global-evidence-circulation.md docs/milestones/m04g-global-circulation-wave-02.md reports/core-thesis/global-circulation/data.json reports/core-thesis/global-circulation/index.html test/m04g-global-circulation.test.js tools/build-m04g-global-circulation.mjs tools/refresh-m04g-global-circulation.mjs tools/validate-m04g-global-circulation.mjs
          echo "add_exit=$?"
          git diff --cached --name-status
          git commit -m 'Build M-04G global circulation data plane'
          echo "commit_exit=$?"
          git log -1 --oneline
          git push origin HEAD:refs/heads/agent/m04g-global-circulation-clean-wave-02
          echo "push_exit=$?"
          git status --porcelain=v1 --untracked-files=all
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: m04g-clean-publish-diagnostic
          path: /tmp/m04g-clean-publish-diagnostic.txt
          if-no-files-found: error
