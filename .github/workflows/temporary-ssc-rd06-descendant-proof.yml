name: TEMP prove descendant-main RD-06 closure

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd06-descendant-proof.yml'
      - '.rd06-descendant-proof/**'

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: temp-ssc-rd06-descendant-proof
  cancel-in-progress: false

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-descendant-proof-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRODUCT_BRANCH: agent/ssc-rd06-wave02-terminal-promotion
      CLOSURE_PATH: data/project/ssc-residual-wave02/closures/RD-06-C01.json
      PROGRESS_PATH: data/research/status-sovereignty-residual-denominator-wave-02-progress.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prove RD-06 merge ancestry, tree identity, and later-main disjointness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch origin main "$PRODUCT_BRANCH"
          current_main="$(git rev-parse HEAD~2)"
          test "$current_main" = "$(git rev-parse origin/main)"
          product_head="$(git rev-parse "origin/${PRODUCT_BRANCH}")"

          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --head "$PRODUCT_BRANCH" --json number,headRefOid,baseRefName,mergeCommit,mergedAt,title > /tmp/rd06-descendant-prs.json
          python - <<'PY'
          import json,pathlib
          rows=json.load(open('/tmp/rd06-descendant-prs.json'))
          assert len(rows)==1, f'exactly one merged canonical RD-06 PR required, found {len(rows)}'
          pr=rows[0]
          assert pr['baseRefName']=='main' and pr['mergeCommit'] and pr['mergeCommit']['oid']
          pathlib.Path('/tmp/rd06-descendant-pr.json').write_text(json.dumps(pr,indent=2)+'\n')
          pathlib.Path('/tmp/rd06-merge-commit.txt').write_text(pr['mergeCommit']['oid']+'\n')
          PY
          pr_product="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-descendant-pr.json'))['headRefOid'])
          PY
          )"
          test "$pr_product" = "$product_head"
          merge_commit="$(cat /tmp/rd06-merge-commit.txt)"
          git merge-base --is-ancestor "$merge_commit" "$current_main"
          test "$(git rev-parse "${merge_commit}^{tree}")" = "$(git rev-parse "${product_head}^{tree}")"
          parents=( $(git show -s --format='%P' "$merge_commit") )
          test "${#parents[@]}" -eq 2
          case " ${parents[*]} " in *" $product_head "*) ;; *) exit 1 ;; esac
          first_parent="${parents[0]}"
          git diff --name-only "$first_parent..$merge_commit" | sort -u > /tmp/rd06-product-paths.txt
          git diff --name-only "$merge_commit..$current_main" | sort -u > /tmp/rd06-later-main-paths.txt
          comm -12 /tmp/rd06-product-paths.txt /tmp/rd06-later-main-paths.txt > /tmp/rd06-overlap-paths.txt
          test ! -s /tmp/rd06-overlap-paths.txt
          python - <<'PY'
          import pathlib,re
          paths=pathlib.Path('/tmp/rd06-product-paths.txt').read_text().splitlines()
          bad=[p for p in paths if re.search(r'(^|/)(temporary|carrier|materializer|trigger|\.rd06)',p,re.I) or p.startswith('.github/workflows/temporary')]
          assert not bad, f'transport path in canonical RD-06 product: {bad}'
          PY
          printf '%s\n' "$current_main" > /tmp/rd06-current-main.txt
          printf '%s\n' "$product_head" > /tmp/rd06-product-head.txt
          printf '%s\n' "$merge_commit" > /tmp/rd06-merge-commit-bound.txt
          printf '%s\n' "$first_parent" > /tmp/rd06-first-parent.txt

      - name: Validate additive atlas and authority on current main
        run: |
          set -Eeuo pipefail
          test -f "$CLOSURE_PATH"
          test -f "$PROGRESS_PATH"
          python - <<'PY'
          import json,pathlib
          closure=json.load(open('data/project/ssc-residual-wave02/closures/RD-06-C01.json'))
          assert closure['class_id']=='RD-06-C01' and closure['class_closed'] is True
          progress=json.load(open('data/research/status-sovereignty-residual-denominator-wave-02-progress.json'))
          ids=[r['class_id'] for r in progress['promoted_class_receipts']]
          assert ids.count('RD-04-C01')==1 and ids.count('RD-05-C03')==1 and ids.count('RD-06-C01')==1
          assert progress['counts']['closed_residual_classes']==3
          assert progress['counts']['open_residual_classes']==39
          for key in ['outside_human_dependencies','external_contacts','external_reviews','reviewed_disposition_changes','complete_compact_findings','racial_order_findings','prevalence_findings','coordination_findings','common_purpose_findings','graph_effects','publication_effects','adoption_effects']:
              assert progress['counts'][key]==0
          pathlib.Path('/tmp/rd06-atlas.json').write_text(json.dumps({'promoted_class_ids':ids,'open':39,'closed':3},indent=2)+'\n')
          PY
          node tools/validate-no-magic-human-gate.mjs | tee /tmp/rd06-no-magic-human.txt

      - name: Run every retained RD-06 focused check on current main
        run: |
          set -Eeuo pipefail
          : > /tmp/rd06-focused-checks.txt
          mapfile -t files < <(find tools test -type f \( -iname '*rd06*' -o -iname '*offeror*' -o -iname '*dcgsa*' \) | sort)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            case "$file" in
              test/*.js|test/*.mjs|tools/validate-*.mjs|tools/acquisition/*/validate-*.mjs)
                echo "RUN $file" | tee -a /tmp/rd06-focused-checks.txt
                node "$file" 2>&1 | tee -a /tmp/rd06-focused-checks.txt
                ;;
            esac
          done

      - name: Run complete repository release gate on current descendant
        run: |
          set -Eeuo pipefail
          npm run release:check | tee /tmp/rd06-release-check.txt
          test -z "$(git status --short)"

      - name: Seal descendant-safe exact-main proof
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rd06-descendant-proof
          mkdir -p /tmp/rd06-descendant-proof
          for file in current-main product-head merge-commit-bound first-parent product-paths later-main-paths overlap-paths atlas focused-checks release-check no-magic-human; do
            cp "/tmp/rd06-${file}.txt" "/tmp/rd06-descendant-proof/${file}.txt" 2>/dev/null || true
          done
          cp /tmp/rd06-descendant-pr.json /tmp/rd06-descendant-proof/merged-pr.json
          cp "$CLOSURE_PATH" /tmp/rd06-descendant-proof/closure-reference.json
          cp "$PROGRESS_PATH" /tmp/rd06-descendant-proof/wave02-progress.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-descendant-proof')
          read=lambda n:(root/n).read_text().strip()
          product_paths=(root/'product-paths.txt').read_text().splitlines()
          later_paths=(root/'later-main-paths.txt').read_text().splitlines()
          receipt={
            'schema_version':'ssc-rd06-wave02-descendant-postmerge-proof@1',
            'wave_id':'SSC-RD-W02','lane_id':'RD-06','class_id':'RD-06-C01','issue':791,
            'current_main':read('current-main.txt'),'product_head':read('product-head.txt'),'merge_commit':read('merge-commit-bound.txt'),'merge_first_parent':read('first-parent.txt'),
            'merge_tree_identical_to_product':True,'merge_is_ancestor_of_current_main':True,
            'product_path_count':len(product_paths),'later_main_path_count':len(later_paths),'overlap_path_count':0,
            'later_main_disjoint':True,'atlas':{'open':39,'closed':3},
            'focused_checks_passed':True,'complete_release_gate_passed':True,'no_magic_human_gate_passed':True,
            'authority':{'outside_human_dependency':False,'external_contacts':0,'external_reviews':0,'reviewed_disposition_changed':False,'publication_effect':'none','adoption_effect':'none','graph_effect':'none'}
          }
          (root/'proof.json').write_text(json.dumps(receipt,indent=2)+'\n')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='manifest.json'):
            b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows).encode()).hexdigest()
          (root/'manifest.json').write_text(json.dumps({'schema_version':'ssc-rd06-wave02-descendant-postmerge-proof-manifest@1','entry_count':len(rows),'entries':rows,'combined_sha256':combined},indent=2)+'\n')
          print(f'RD-06 descendant proof sealed: product {len(product_paths)} paths, later main {len(later_paths)} disjoint paths, {combined}')
          PY
          git diff --exit-code
          test -z "$(git status --short)"

      - name: Preserve descendant-safe proof
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-descendant-postmerge-proof-v1
          path: /tmp/rd06-descendant-proof
          if-no-files-found: error
          retention-days: 90
