name: TEMP recover RD-04 Montana review-repair payload

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-rd04-mt-promotion-review-repair-v2.yml'

permissions:
  contents: read

env:
  CARRIER_HEAD: ef73e44017cb95569b7876a37cb2bc3b4ef90e45
  CARRIER_BRANCH: agent/ssc-rd04-mt-promotion-review-repair-materializer-v1
  CARRIER_ROOT: .tmp/rd04-mt-promotion-review-repair-v1
  EXPECTED_WORKFLOW_XZ_SHA256: b22dab603a46888c581ccedda7a616995298e9155f290a87707893a4195ae2ba
  EXPECTED_WORKFLOW_SHA256: 05caa14cb4fe6fa094f6cd24a636188db37f3702fadad601c14d5494727800d4
  EXPECTED_SCHEMA_XZ_SHA256: d312cd9c02997cc9b9f2c7e4da3dc70c427ec43e49224788e9d6cd852a55f60d
  EXPECTED_SCHEMA_SHA256: eb33ccef7da61d28c24b81adde8b74900fce998aed651c25c7f0893bfe33b691
  OUT: /tmp/rd04-mt-review-repair-payload

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Recover exact carrier payload and report actual identities
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/chunks"
          rc=0

          git fetch --no-tags --force origin "+refs/heads/$CARRIER_BRANCH:refs/remotes/origin/$CARRIER_BRANCH" || rc=1
          carrier_actual="$(git rev-parse "refs/remotes/origin/$CARRIER_BRANCH" 2>/dev/null || true)"
          test "$carrier_actual" = "$CARRIER_HEAD" || rc=1

          git show "$CARRIER_HEAD:$CARRIER_ROOT/repaired-workflow.xz.b64" > "$OUT/chunks/repaired-workflow.xz.b64" || rc=1
          : > "$OUT/chunks/repaired-schema.xz.b64"
          : > "$OUT/chunk-inventory.tsv"
          for part in 00 01 02 03 04 05 06 07; do
            path="$CARRIER_ROOT/repaired-schema.xz.b64.part$part"
            file="$OUT/chunks/repaired-schema.xz.b64.part$part"
            git show "$CARRIER_HEAD:$path" > "$file" || rc=1
            printf '%s\t%s\t%s\t%s\n' \
              "$part" \
              "$(wc -c < "$file" | tr -d ' ')" \
              "$(sha256sum "$file" | cut -d' ' -f1)" \
              "$(tail -c 1 "$file" | od -An -tu1 | tr -d ' ')" \
              >> "$OUT/chunk-inventory.tsv"
            cat "$file" >> "$OUT/chunks/repaired-schema.xz.b64"
          done

          base64 -d "$OUT/chunks/repaired-workflow.xz.b64" > "$OUT/repaired-workflow.xz" || rc=1
          base64 -d "$OUT/chunks/repaired-schema.xz.b64" > "$OUT/repaired-schema.xz" || rc=1

          workflow_xz_sha="$(sha256sum "$OUT/repaired-workflow.xz" | cut -d' ' -f1)"
          schema_xz_sha="$(sha256sum "$OUT/repaired-schema.xz" | cut -d' ' -f1)"
          workflow_xz_valid=false
          schema_xz_valid=false
          workflow_sha=''
          schema_sha=''

          if xz -t "$OUT/repaired-workflow.xz"; then
            workflow_xz_valid=true
            xz -dc "$OUT/repaired-workflow.xz" > "$OUT/repaired-workflow.yml"
            workflow_sha="$(sha256sum "$OUT/repaired-workflow.yml" | cut -d' ' -f1)"
          else
            rc=1
          fi
          if xz -t "$OUT/repaired-schema.xz"; then
            schema_xz_valid=true
            xz -dc "$OUT/repaired-schema.xz" > "$OUT/repaired-schema.json"
            schema_sha="$(sha256sum "$OUT/repaired-schema.json" | cut -d' ' -f1)"
          else
            rc=1
          fi

          export carrier_actual workflow_xz_sha schema_xz_sha workflow_xz_valid schema_xz_valid workflow_sha schema_sha rc
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          receipt = {
              'state': 'payload_recovered' if os.environ['rc'] == '0' else 'payload_recovery_failed_closed',
              'carrier_head_expected': os.environ['CARRIER_HEAD'],
              'carrier_head_actual': os.environ['carrier_actual'],
              'workflow_xz_sha256_expected': os.environ['EXPECTED_WORKFLOW_XZ_SHA256'],
              'workflow_xz_sha256_actual': os.environ['workflow_xz_sha'],
              'workflow_xz_sha256_match': os.environ['workflow_xz_sha'] == os.environ['EXPECTED_WORKFLOW_XZ_SHA256'],
              'workflow_xz_valid': os.environ['workflow_xz_valid'] == 'true',
              'workflow_sha256_expected': os.environ['EXPECTED_WORKFLOW_SHA256'],
              'workflow_sha256_actual': os.environ['workflow_sha'],
              'workflow_sha256_match': os.environ['workflow_sha'] == os.environ['EXPECTED_WORKFLOW_SHA256'],
              'schema_xz_sha256_expected': os.environ['EXPECTED_SCHEMA_XZ_SHA256'],
              'schema_xz_sha256_actual': os.environ['schema_xz_sha'],
              'schema_xz_sha256_match': os.environ['schema_xz_sha'] == os.environ['EXPECTED_SCHEMA_XZ_SHA256'],
              'schema_xz_valid': os.environ['schema_xz_valid'] == 'true',
              'schema_sha256_expected': os.environ['EXPECTED_SCHEMA_SHA256'],
              'schema_sha256_actual': os.environ['schema_sha'],
              'schema_sha256_match': os.environ['schema_sha'] == os.environ['EXPECTED_SCHEMA_SHA256'],
              'source_requests': 0,
              'route_executions': 0,
              'product_effects': 0,
              'canonical_effects': 0,
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          exit "$rc"
      - name: Upload exact recovered payload and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-review-repair-payload
          path: /tmp/rd04-mt-review-repair-payload
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
