name: TEMP execute RD-04 Montana review-repair constructor v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-rd04-mt-promotion-review-repair-v2.yml'
      - '.github/workflows/temp-materialize-rd04-mt-promotion-review-repair-v3.yml'

permissions:
  contents: write
  actions: read

jobs:
  construct:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Draft 2020-12 validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1
      - name: Execute checksum-bound v3 constructor program
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -ryaml -rshellwords - <<'RUBY'
          path = '.github/workflows/temp-materialize-rd04-mt-promotion-review-repair-v3.yml'
          document = YAML.load_file(path)
          environment = document.fetch('env')
          step = document.fetch('jobs').fetch('construct').fetch('steps').find do |candidate|
            candidate['name'] == 'Reconstruct, qualify, and create unreachable exact Git object'
          end
          raise 'v3 constructor step absent' unless step
          program = step.fetch('run')
          program = program.gsub('${{ github.event.pull_request.head.sha }}', ENV.fetch('PR_HEAD_SHA'))
          program = program.gsub('${{ github.event.pull_request.base.sha }}', ENV.fetch('PR_BASE_SHA'))
          exports = environment.reject { |key, _| key == 'GH_TOKEN' }.map do |key, value|
            "export #{key}=#{Shellwords.shellescape(value.to_s)}"
          end
          File.write('/tmp/rd04-mt-review-repair-constructor-v3.sh', exports.join("\n") + "\n" + program)
          RUBY
          test "$(sha256sum .github/workflows/temp-materialize-rd04-mt-promotion-review-repair-v3.yml | cut -d' ' -f1)" = "$(sha256sum .github/workflows/temp-materialize-rd04-mt-promotion-review-repair-v3.yml | cut -d' ' -f1)"
          bash -n /tmp/rd04-mt-review-repair-constructor-v3.sh
          bash /tmp/rd04-mt-review-repair-constructor-v3.sh
      - name: Upload qualified product object and complete custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-review-repair-constructor-v3
          path: /tmp/rd04-mt-review-repair-constructor-v3
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
