name: TEMP materialize RD-04 Montana promotion review repair v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-rd04-mt-promotion-review-repair-v2.yml'

permissions:
  contents: write
  actions: read

env:
  CANONICAL_PARENT: 0840358962621b0be3db6864ecec763327f35903
  CANONICAL_PARENT_TREE: 38023f86bcc27527f9db8da9622bada00b3de542
  SUPERSEDED_PRODUCT: 85fad4f736a3639444edd2c522a67316dbade480
  SUPERSEDED_TREE: 5a27b91e3ce26f2435cb2df16915062f2c5d1801
  CARRIER_HEAD: ef73e44017cb95569b7876a37cb2bc3b4ef90e45
  CARRIER_BRANCH: agent/ssc-rd04-mt-promotion-review-repair-materializer-v1
  REPAIRED_WORKFLOW_XZ_SHA256: b22dab603a46888c581ccedda7a616995298e9155f290a87707893a4195ae2ba
  REPAIRED_WORKFLOW_SHA256: 05caa14cb4fe6fa094f6cd24a636188db37f3702fadad601c14d5494727800d4
  REPAIRED_SCHEMA_XZ_SHA256: d312cd9c02997cc9b9f2c7e4da3dc70c427ec43e49224788e9d6cd852a55f60d
  REPAIRED_SCHEMA_SHA256: eb33ccef7da61d28c24b81adde8b74900fce998aed651c25c7f0893bfe33b691
  PLANNED_MANIFEST_SHA256: a84414592e36853a00d1bdf18787a0b9dcf1b3731159c0e3e7855c3d6036ca2f
  PLANNED_COMBINED_SHA256: 3e7795b6bd18c5e22f8a21daf6fca240781ba376844fc5147ab3277c30314c21
  PRODUCT_BRANCH: agent/ssc-rd04-mt-row-state-reconciliation-review-repair-v2
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation
  PERMANENT_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.yml
  PERMANENT_SCHEMA: schemas/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.schema.json
  OUT: /tmp/rd04-mt-promotion-review-repair-v2
  WORK: /tmp/rd04-mt-review-repair-v2-work

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.25.1
      - name: Recover, qualify, and publish sole-parent successor
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT"

          write_failure() {
            rc=$?
            export FAILURE_RC="$rc"
            export FAILURE_LINE="${BASH_LINENO[0]:-0}"
            export FAILURE_COMMAND="${BASH_COMMAND:-unknown}"
            mkdir -p "$OUT"
            python - <<'PY' || true
          import json, os
          from pathlib import Path
          Path(os.environ['OUT'], 'failure.json').write_text(json.dumps({
              'state': 'failed_closed',
              'exit_code': int(os.environ.get('FAILURE_RC', '1')),
              'line': int(os.environ.get('FAILURE_LINE', '0')),
              'command': os.environ.get('FAILURE_COMMAND', 'unknown'),
              'canonical_parent': os.environ['CANONICAL_PARENT'],
              'superseded_product': os.environ['SUPERSEDED_PRODUCT'],
              'carrier_head': os.environ['CARRIER_HEAD'],
              'product_branch': os.environ['PRODUCT_BRANCH'],
              'source_requests': 0,
          }, indent=2) + '\n')
          PY
            exit "$rc"
          }
          trap write_failure ERR

          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor "$CANONICAL_PARENT" "$BASE_SHA"
          test "$(git rev-parse "$CANONICAL_PARENT^{tree}")" = "$CANONICAL_PARENT_TREE"
          test "$(git show -s --format='%P' "$SUPERSEDED_PRODUCT")" = "$CANONICAL_PARENT"
          test "$(git rev-parse "$SUPERSEDED_PRODUCT^{tree}")" = "$SUPERSEDED_TREE"
          git fetch --no-tags --force origin "+refs/heads/$CARRIER_BRANCH:refs/remotes/origin/$CARRIER_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$CARRIER_BRANCH")" = "$CARRIER_HEAD"
          printf '%s\n' carrier_authenticated > "$OUT/phase.txt"

          CARRIER_ROOT='.tmp/rd04-mt-promotion-review-repair-v1'
          git show "$CARRIER_HEAD:$CARRIER_ROOT/repaired-workflow.xz.b64" > /tmp/repaired-workflow.xz.b64
          base64 -d /tmp/repaired-workflow.xz.b64 > /tmp/repaired-workflow.xz
          : > /tmp/repaired-schema.xz.b64
          for part in 00 01 02 03 04 05 06 07; do
            git show "$CARRIER_HEAD:$CARRIER_ROOT/repaired-schema.xz.b64.part$part" >> /tmp/repaired-schema.xz.b64
          done
          base64 -d /tmp/repaired-schema.xz.b64 > /tmp/repaired-schema.xz
          test "$(sha256sum /tmp/repaired-workflow.xz | cut -d' ' -f1)" = "$REPAIRED_WORKFLOW_XZ_SHA256"
          test "$(sha256sum /tmp/repaired-schema.xz | cut -d' ' -f1)" = "$REPAIRED_SCHEMA_XZ_SHA256"
          xz -dc /tmp/repaired-workflow.xz > /tmp/repaired-workflow.yml
          xz -dc /tmp/repaired-schema.xz > /tmp/repaired-schema.json
          test "$(sha256sum /tmp/repaired-workflow.yml | cut -d' ' -f1)" = "$REPAIRED_WORKFLOW_SHA256"
          test "$(sha256sum /tmp/repaired-schema.json | cut -d' ' -f1)" = "$REPAIRED_SCHEMA_SHA256"
          printf '%s\n' repaired_payload_verified >> "$OUT/phase.txt"

          git worktree add --detach "$WORK" "$CANONICAL_PARENT"
          git show "$SUPERSEDED_PRODUCT:$PRODUCT_ROOT/product-manifest.json" > /tmp/original-manifest.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          root = Path(os.environ['WORK'])
          source = os.environ['SUPERSEDED_PRODUCT']
          manifest = json.load(open('/tmp/original-manifest.json'))
          paths = manifest['permanent_paths']
          assert len(paths) == 14 and len(set(paths)) == 14
          for rel in paths:
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(['git', 'show', f'{source}:{rel}'], cwd=root))
          (root / os.environ['PERMANENT_WORKFLOW']).write_bytes(Path('/tmp/repaired-workflow.yml').read_bytes())
          (root / os.environ['PERMANENT_SCHEMA']).write_bytes(Path('/tmp/repaired-schema.json').read_bytes())
          PY

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path(os.environ['WORK'])
          path = root / os.environ['PRODUCT_ROOT'] / 'product-manifest.json'
          manifest = json.loads(path.read_text())
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          for row in manifest['hashed_files']:
              data = (root / row['path']).read_bytes()
              row.update(bytes=len(data), sha256=sha(data), git_blob=blob(data))
          lines = sorted(
              f"{row['path']}\0{row['sha256']}\0{row['bytes']}\n"
              for row in manifest['hashed_files']
          )
          manifest['combined_sha256'] = sha(''.join(lines).encode())
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          identities = {
              'state': 'repaired_product_resealed',
              'workflow_sha256': sha((root / os.environ['PERMANENT_WORKFLOW']).read_bytes()),
              'schema_sha256': sha((root / os.environ['PERMANENT_SCHEMA']).read_bytes()),
              'manifest_sha256': sha(path.read_bytes()),
              'combined_sha256': manifest['combined_sha256'],
              'planned_manifest_sha256': os.environ['PLANNED_MANIFEST_SHA256'],
              'planned_combined_sha256': os.environ['PLANNED_COMBINED_SHA256'],
              'planned_manifest_match': sha(path.read_bytes()) == os.environ['PLANNED_MANIFEST_SHA256'],
              'planned_combined_match': manifest['combined_sha256'] == os.environ['PLANNED_COMBINED_SHA256'],
              'permanent_path_count': len(manifest['permanent_paths']),
              'hashed_file_count': len(manifest['hashed_files']),
          }
          assert identities['workflow_sha256'] == os.environ['REPAIRED_WORKFLOW_SHA256']
          assert identities['schema_sha256'] == os.environ['REPAIRED_SCHEMA_SHA256']
          assert identities['permanent_path_count'] == 14
          assert identities['hashed_file_count'] == 13
          Path(os.environ['OUT'], 'reseal-identities.json').write_text(json.dumps(identities, indent=2) + '\n')
          Path(os.environ['OUT'], 'permanent-paths.txt').write_text('\n'.join(sorted(manifest['permanent_paths'])) + '\n')
          PY
          printf '%s\n' product_reconstructed_and_resealed >> "$OUT/phase.txt"

          cd "$WORK"
          test "$(git status --porcelain=v1 --untracked-files=all | wc -l | tr -d ' ')" = 14
          test "$(git status --porcelain=v1 --untracked-files=all | grep -vc '^?? ')" = 0
          ruby -e "require 'yaml'; YAML.load_file(ARGV.fetch(0)); puts 'yaml_ok'" "$PERMANENT_WORKFLOW" > "$OUT/permanent-workflow-yaml.txt"
          node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.mjs --check | tee "$OUT/builder.json"
          node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.mjs --out "$OUT/validator.json"
          node --test test/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.test.js | tee "$OUT/adversarial.log"

          python - <<'PY' > "$OUT/schema-validation.txt"
          import copy, json, os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(os.environ['PRODUCT_ROOT'])
          schema = json.load(open(os.environ['PERMANENT_SCHEMA']))
          manifest = json.load(open(root / 'product-manifest.json'))
          instance = {
              'schema_version': 'ssc-rd04-mt-row-state-reconciliation-schema@1',
              'product_contract': {
                  'canonical_parent': os.environ['CANONICAL_PARENT'],
                  'canonical_parent_tree': os.environ['CANONICAL_PARENT_TREE'],
                  'permanent_path_count': 14,
                  'hashed_file_count': 13,
                  'matrix_transition': {
                      'predecessor_sha256': '9f9dc05a057396056771bb566c44e9c3779d8ef6b0d2c078f7ffff11d9c7e6cb',
                      'promoted_sha256': '12e52344af0c8ec3d845b6f05f8a20014fa84504d10dbc9ee0674d37715abe1d',
                      'changed_rows': 1,
                      'changed_cells': 1,
                      'substantive_cells_changed': 0,
                      'terminal_units_before': 11,
                      'terminal_units_after': 12,
                      'class_closed': False,
                  },
                  'authority_boundary': manifest['authority_boundary'],
              },
              'document_schemas': {
                  'input_custody': json.load(open(root / 'input-custody.json')),
                  'row_state_decision': json.load(open(root / 'row-state-decision.json')),
                  'row_state_ledger': json.load(open(root / 'row-state-ledger.json')),
                  'promoted_matrix': json.load(open(root / 'promoted-partial-field-matrix.json')),
                  'remaining_open_census': json.load(open(root / 'remaining-open-field-census.json')),
                  'row_state_summary': json.load(open(root / 'row-state-summary.json')),
                  'index': json.load(open(root / 'index.json')),
                  'product_manifest': manifest,
              },
          }
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          validator.validate(instance)
          mutations = [
              lambda x: x['document_schemas']['row_state_ledger'].__setitem__('row_state_mutation_count', 'corrupt'),
              lambda x: x['document_schemas']['row_state_ledger'].__setitem__('transition', None),
              lambda x: x['document_schemas']['promoted_matrix']['rows'][25].__setitem__('row_state', 'corrupt'),
              lambda x: x['document_schemas']['promoted_matrix']['counts'].__setitem__('terminal_cells', '230'),
              lambda x: x['document_schemas']['remaining_open_census'].__setitem__('open_cell_count', 219),
              lambda x: x['document_schemas']['remaining_open_census']['open_cells'][0].__setitem__('field_ordinal', 'corrupt'),
              lambda x: x['document_schemas']['row_state_summary']['counts'].__setitem__('terminal_units', 13),
              lambda x: x['document_schemas']['row_state_summary'].__setitem__('counts', None),
              lambda x: x['document_schemas']['index']['counts'].__setitem__('substantive_field_terminalizations', 1),
              lambda x: x['document_schemas']['product_manifest']['hashed_files'][0].__setitem__(
                  'path', x['document_schemas']['product_manifest']['hashed_files'][1]['path']
              ),
          ]
          for index, mutate in enumerate(mutations):
              candidate = copy.deepcopy(instance)
              mutate(candidate)
              if not list(validator.iter_errors(candidate)):
                  raise SystemExit(f'negative schema mutation accepted: {index}')
          def empty(value, inside_const=False):
              if isinstance(value, dict):
                  if not value and not inside_const:
                      return 1
                  return sum(empty(child, inside_const or key == 'const') for key, child in value.items())
              if isinstance(value, list):
                  return sum(empty(child, inside_const) for child in value)
              return 0
          if empty(schema):
              raise SystemExit('empty public schema node remains')
          print('schema_ok documents=8 negative_refusals=10 empty_nodes=0')
          PY

          npm run release:check > "$OUT/release-check.log" 2>&1
          printf '%s\n' hosted_qualification_passed >> "$OUT/phase.txt"

          while IFS= read -r rel; do
            git add -- "$rel"
          done < "$OUT/permanent-paths.txt"
          test "$(git diff --cached --name-only --diff-filter=A | LC_ALL=C sort)" = "$(cat "$OUT/permanent-paths.txt")"
          test -z "$(git diff --cached --name-only --diff-filter=MDTCRUXB)"
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Repair Montana promotion exact-object and schema admission'
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$(git show -s --format='%P' HEAD)" = "$CANONICAL_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r --diff-filter=A "$CANONICAL_PARENT" HEAD | LC_ALL=C sort)" = "$(cat "$OUT/permanent-paths.txt")"
          test -z "$(git diff-tree --no-commit-id --name-only -r --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"

          REMOTE_PRODUCT="$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)"
          test "$REMOTE_PRODUCT" = "$CANONICAL_PARENT"
          git push origin "$PRODUCT_COMMIT:refs/heads/$PRODUCT_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)" = "$PRODUCT_COMMIT"

          export PRODUCT_COMMIT PRODUCT_TREE BASE_SHA HEAD_SHA
          python - <<'PY'
          import json, os
          from pathlib import Path

          out = Path(os.environ['OUT'])
          identities = json.loads((out / 'reseal-identities.json').read_text())
          receipt = {
              'state': 'successor_branch_published',
              'canonical_parent': os.environ['CANONICAL_PARENT'],
              'canonical_parent_tree': os.environ['CANONICAL_PARENT_TREE'],
              'live_main_at_materialization': os.environ['BASE_SHA'],
              'materializer_head': os.environ['HEAD_SHA'],
              'carrier_head': os.environ['CARRIER_HEAD'],
              'superseded_product': os.environ['SUPERSEDED_PRODUCT'],
              'product_branch': os.environ['PRODUCT_BRANCH'],
              'product_commit': os.environ['PRODUCT_COMMIT'],
              'product_tree': os.environ['PRODUCT_TREE'],
              'workflow_sha256': identities['workflow_sha256'],
              'schema_sha256': identities['schema_sha256'],
              'manifest_sha256': identities['manifest_sha256'],
              'combined_sha256': identities['combined_sha256'],
              'planned_manifest_match': identities['planned_manifest_match'],
              'planned_combined_match': identities['planned_combined_match'],
              'permanent_path_count': 14,
              'hashed_file_count': 13,
              'source_requests': 0,
              'matrix_updates': 0,
              'row_state_mutations': 0,
              'canonical_effects': 0,
              'outside_human_dependency': False,
          }
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

          mkdir -p "$OUT/product"
          while IFS= read -r rel; do
            cp --parents "$rel" "$OUT/product"
          done < "$OUT/permanent-paths.txt"
          printf '%s\n' successor_branch_published >> "$OUT/phase.txt"
          cd "$OUT"
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload exact recovery and qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-promotion-review-repair-materializer-v2
          path: /tmp/rd04-mt-promotion-review-repair-v2
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
