name: TEMP export exact cleaned RD-02 terminal source

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-rd02-terminal-source-export-v1.yml'
      - '.rd02-terminal-source-export-v1/EXECUTE'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_HEAD: fd46638c2d60d2e06e51b1ea25ac5899168f6fd2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
      - name: Preserve exact cleaned source tree
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          out="$RUNNER_TEMP/rd02-terminal-clean-source"
          mkdir -p "$out"
          git archive --format=tar "$SOURCE_HEAD" | gzip -9 > "$out/clifford-number-clean-source.tar.gz"
          git ls-tree -r --name-only "$SOURCE_HEAD" > "$out/tracked-paths.txt"
          git ls-tree -r -l "$SOURCE_HEAD" > "$out/git-tree-manifest.txt"
          printf 'source_head=%s\nsource_tree=%s\ntracked_paths=%s\n' \
            "$SOURCE_HEAD" "$(git rev-parse "$SOURCE_HEAD^{tree}")" "$(wc -l < "$out/tracked-paths.txt" | tr -d ' ')" \
            > "$out/receipt.txt"
          (cd "$out" && sha256sum clifford-number-clean-source.tar.gz tracked-paths.txt git-tree-manifest.txt receipt.txt > SHA256SUMS)
          echo "EXPORT_DIR=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rd02-terminal-clean-source-fd466
          path: ${{ env.EXPORT_DIR }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
