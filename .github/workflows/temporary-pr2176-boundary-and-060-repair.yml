name: Temporary PR2176 boundary and 060 repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-boundary-and-060-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-boundary-and-060-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "444e2c28ba20fccc067033f36e3258d2d85e8811"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-boundary-and-060-repair.yml"

      - name: Repair whitespace, parenthetical, and 060 boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')

          broad_060 = r'''    && (/^0[1-9]\d{8}$/u.test(groups[0])
      || /^0(?:50|60|70|80|90)\d{8}$/u.test(groups[0]))'''
          precise_060 = r'''    && (/^0[1-9]\d{8}$/u.test(groups[0])
      || /^0(?:50|70|80|90)\d{8}$/u.test(groups[0])
      || /^060[1-9]\d{7}$/u.test(groups[0]))'''
          if library.count(broad_060) != 1:
              raise SystemExit('060 range anchor did not match exactly once')
          library = library.replace(broad_060, precise_060, 1)

          dotted_anchor = r'''  if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'))) {
    return false;
  }'''
          dotted_replacement = r'''  if (!/^(?:\s*\)\s*)?\.\s*$/u.test(separator.normalize('NFKC'))) {
    return false;
  }'''
          if library.count(dotted_anchor) != 1:
              raise SystemExit('dotted parenthetical anchor did not match exactly once')
          library = library.replace(dotted_anchor, dotted_replacement, 1)

          boundary_anchor = r'''    const previousCharacter = Array.from(prefix).at(-1) ?? '';
    const allowInitialGroup = !/[\p{L}\p{N}]/u.test(previousCharacter) || hasPhoneLabelPrefix(prefix);'''
          boundary_replacement = r'''    const separatedFromPrefix = /^\s/u.test(candidate);
    const previousCharacter = separatedFromPrefix ? '' : (Array.from(prefix).at(-1) ?? '');
    const allowInitialGroup = separatedFromPrefix
      || !/[\p{L}\p{N}]/u.test(previousCharacter)
      || hasPhoneLabelPrefix(prefix);'''
          if library.count(boundary_anchor) != 1:
              raise SystemExit('candidate adjacency anchor did not match exactly once')
          library = library.replace(boundary_anchor, boundary_replacement, 1)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')

          reserved_anchor = r'''for (const compactNumericIdentifier of [
  '1234567890',
  '00012345678',
  '2026081701','''
          reserved_replacement = r'''for (const compactNumericIdentifier of [
  '1234567890',
  '00012345678',
  '06001234567',
  '０６００１２３４５６７',
  '2026081701','''
          if tests.count(reserved_anchor) != 1:
              raise SystemExit('reserved 0600 test anchor did not match exactly once')
          tests = tests.replace(reserved_anchor, reserved_replacement, 1)

          adjacency_anchor = "assert.equal(redactContactData('電話番号：０３６２１６８０４１'), '電話番号：[contact omitted]');"
          adjacency_tests = dedent('''
          for (const [input, expected] of [
            ['Call 03-6216-5111', 'Call [contact omitted]'],
            ['Call 09012345678', 'Call [contact omitted]'],
            ['Phone: 03 6216 5111 or 090-1234-5678', 'Phone: [contact omitted] or [contact omitted]']
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'whitespace before a phone must establish a clean boundary after ordinary prose'
            );
          }
          ''')
          if tests.count(adjacency_anchor) != 1:
              raise SystemExit('whitespace-boundary test anchor did not match exactly once')
          tests = tests.replace(adjacency_anchor, adjacency_tests + adjacency_anchor, 1)

          parenthetical_anchor = dedent('''\
          assert.equal(
            redactContactData('Tel: +44 20 7123. 4567'),
            'Tel: [contact omitted]',
            'a dotted international phone group without narrative continuation must remain in the phone span'
          );
          ''')
          parenthetical_tests = dedent('''
          assert.equal(
            redactContactData('Contact +33 1 42 68 53. (00) attendees joined.'),
            'Contact [contact omitted]. (00) attendees joined.',
            'parenthesized numeric prose must override the dotted pair-group contact tie-break'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53．（００） attendees joined.'),
            'Contact [contact omitted]．（００） attendees joined.',
            'fullwidth parenthesized numeric prose must override the dotted pair-group contact tie-break'
          );
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 12 34 56 78. (00) attendees joined.'),
            'Tel: [contact omitted] ext [contact omitted]. (00) attendees joined.',
            'parenthesized numeric prose must remain outside a dotted pair-group extension'
          );
          ''')
          if tests.count(parenthetical_anchor) != 1:
              raise SystemExit('parenthetical boundary test anchor did not match exactly once')
          tests = tests.replace(parenthetical_anchor, parenthetical_tests + parenthetical_anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-boundary-and-060-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-boundary-and-060-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): preserve prose and 060 boundaries"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
