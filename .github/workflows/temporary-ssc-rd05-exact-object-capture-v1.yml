name: TEMP capture exact SSC RD-05 official-object candidates

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd05-exact-object-capture-base-v1
    paths:
      - '.github/tmp/ssc-rd05-exact-object-capture-v1.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-rd05-exact-object-capture-v1
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1dd7b50bd785289d17dacd64077bef1c2de90af4
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and execute checksum-bound capture program
        env:
          SCRIPT_B64_SHA256: 6519ec37237f85579bc7bbc4994bb4e000049438aa57546dba726fec6fdd3ff7
          SCRIPT_GZ_SHA256: a5481255f1de228a9a8179fda8b1fef1ead4b0111bd75e2f28ccca318125da74
          SCRIPT_SHA256: bac2573f4491fc473992a98e9731bd910fb4ef64a78b87d3952848239a621265
          RD05_OBJECT_CAPTURE_OUTPUT: ${{ github.workspace }}/rd05-exact-object-capture
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '1dd7b50bd785289d17dacd64077bef1c2de90af4'
          node tools/validate-no-magic-human-gate.mjs
          node tools/acquisition/status-sovereignty-rd-wave02-rd05/build-official-object-universe.mjs
          node tools/acquisition/status-sovereignty-rd-wave02-rd05/validate-official-object-universe.mjs
          node test/status-sovereignty-rd-wave02-rd05-official-object-universe.test.js
          git diff --exit-code

          printf '%s' '' > /tmp/rd05-capture.mjs.gz.b64
          test "$(sha256sum /tmp/rd05-capture.mjs.gz.b64 | awk '{print $1}')" = "$SCRIPT_B64_SHA256"
          base64 --decode /tmp/rd05-capture.mjs.gz.b64 > /tmp/rd05-capture.mjs.gz
          test "$(sha256sum /tmp/rd05-capture.mjs.gz | awk '{print $1}')" = "$SCRIPT_GZ_SHA256"
          gzip --decompress --stdout /tmp/rd05-capture.mjs.gz > /tmp/rd05-capture.mjs
          test "$(sha256sum /tmp/rd05-capture.mjs | awk '{print $1}')" = "$SCRIPT_SHA256"
          node --check /tmp/rd05-capture.mjs
          node /tmp/rd05-capture.mjs

          test "$(jq -r '.counts.object_receipts' rd05-exact-object-capture/summary.json)" = 58
          test "$(jq -r '.counts.reused_parent_receipts' rd05-exact-object-capture/summary.json)" = 10
          test "$(jq -r '.counts.requested_object_receipts' rd05-exact-object-capture/summary.json)" = 48
          test "$(jq -r '.authority.external_contacts' rd05-exact-object-capture/summary.json)" = 0
          test "$(jq -r '.authority.external_reviews' rd05-exact-object-capture/summary.json)" = 0
          test "$(jq -r '.class_closed' rd05-exact-object-capture/summary.json)" = false
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^?? rd05-exact-object-capture/' || true)"
      - name: Upload exact object-capture custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd05-exact-object-capture-v1
          path: rd05-exact-object-capture
          if-no-files-found: error
          retention-days: 90
