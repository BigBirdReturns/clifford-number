name: Status-for-sovereignty six-gate first-pass reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-six-gate-first-pass-reconciliation.yml'
      - 'data/intake/status-sovereignty-six-gate-first-pass-reconciliation.json'
      - 'data/project/status-sovereignty-six-gate-first-pass-reconciliation-release-manifest.json'
      - 'schemas/status-sovereignty-six-gate-first-pass-reconciliation.schema.json'
      - 'docs/milestones/ssc-six-gate-first-pass-reconciliation.md'
      - 'tools/build-status-sovereignty-six-gate-first-pass-reconciliation.mjs'
      - 'tools/validate-status-sovereignty-six-gate-first-pass-reconciliation.mjs'
      - 'test/status-sovereignty-six-gate-first-pass-reconciliation.test.js'
      - 'build/core-thesis/status-sovereignty/six-gate-first-pass/**'
      - 'reports/core-thesis/status-sovereignty/six-gate-first-pass/**'
  push:
    branches:
      - main
      - 'agent/ssc-six-gate-first-pass-reconciliation'
    paths:
      - '.github/workflows/status-sovereignty-six-gate-first-pass-reconciliation.yml'
      - 'data/intake/status-sovereignty-six-gate-first-pass-reconciliation.json'
      - 'data/project/status-sovereignty-six-gate-first-pass-reconciliation-release-manifest.json'
      - 'schemas/status-sovereignty-six-gate-first-pass-reconciliation.schema.json'
      - 'docs/milestones/ssc-six-gate-first-pass-reconciliation.md'
      - 'tools/build-status-sovereignty-six-gate-first-pass-reconciliation.mjs'
      - 'tools/validate-status-sovereignty-six-gate-first-pass-reconciliation.mjs'
      - 'test/status-sovereignty-six-gate-first-pass-reconciliation.test.js'
      - 'build/core-thesis/status-sovereignty/six-gate-first-pass/**'
      - 'reports/core-thesis/status-sovereignty/six-gate-first-pass/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the six-gate reconciliation
        run: |
          node tools/build-status-sovereignty-six-gate-first-pass-reconciliation.mjs
          node tools/validate-status-sovereignty-six-gate-first-pass-reconciliation.mjs
          node test/status-sovereignty-six-gate-first-pass-reconciliation.test.js
      - name: Require exact committed reconciliation products
        run: |
          git diff --exit-code -- \
            data/project/status-sovereignty-six-gate-first-pass-reconciliation-release-manifest.json \
            build/core-thesis/status-sovereignty/six-gate-first-pass/manifest.json \
            build/core-thesis/status-sovereignty/six-gate-first-pass/data.json \
            reports/core-thesis/status-sovereignty/six-gate-first-pass/data.json \
            reports/core-thesis/status-sovereignty/six-gate-first-pass/index.html
      - name: Prove publication exclusion
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/data/intake/status-sovereignty-six-gate-first-pass-reconciliation.json
          test ! -e dist/build/core-thesis/status-sovereignty/six-gate-first-pass
          test ! -e dist/reports/core-thesis/status-sovereignty/six-gate-first-pass
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic reconstruction
        run: |
          git restore --staged --worktree .
          node tools/build-status-sovereignty-six-gate-first-pass-reconciliation.mjs
          node tools/validate-status-sovereignty-six-gate-first-pass-reconciliation.mjs
          node test/status-sovereignty-six-gate-first-pass-reconciliation.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
