name: Counter-Selector Wave 03 Batch 01 acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-03.yml'
      - 'data/project/counter-selector-wave-03-batch-01.json'
      - 'data/project/counter-selector-artifact-acquisition-b01-registry.json'
      - 'data/project/counter-selector-blind-packet-registry.json'
      - 'data/project/counter-selector-wave-03-release-manifest.json'
      - 'schemas/counter-selector-artifact-acquisition.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition.md'
      - 'docs/milestones/counter-selector-wave-03-batch-01.md'
      - 'tools/build-counter-selector-wave-03.mjs'
      - 'tools/validate-counter-selector-wave-03.mjs'
      - 'test/counter-selector-wave-03.test.js'
      - 'reports/core-thesis/counter-selector-wave-03/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-03.yml'
      - 'data/project/counter-selector-wave-03-batch-01.json'
      - 'data/project/counter-selector-artifact-acquisition-b01-registry.json'
      - 'data/project/counter-selector-blind-packet-registry.json'
      - 'data/project/counter-selector-wave-03-release-manifest.json'
      - 'schemas/counter-selector-artifact-acquisition.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition.md'
      - 'docs/milestones/counter-selector-wave-03-batch-01.md'
      - 'tools/build-counter-selector-wave-03.mjs'
      - 'tools/validate-counter-selector-wave-03.mjs'
      - 'test/counter-selector-wave-03.test.js'
      - 'reports/core-thesis/counter-selector-wave-03/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 03 products
        run: node tools/build-counter-selector-wave-03.mjs
      - name: Validate acquisition contract
        run: node tools/validate-counter-selector-wave-03.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-03.test.js
      - name: Require exact committed Wave 03 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-artifact-acquisition-b01-registry.json \
            data/project/counter-selector-blind-packet-registry.json \
            data/project/counter-selector-wave-03-release-manifest.json \
            reports/core-thesis/counter-selector-wave-03/data.json \
            reports/core-thesis/counter-selector-wave-03/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 03 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-03.mjs
          node tools/validate-counter-selector-wave-03.mjs
          node test/counter-selector-wave-03.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
