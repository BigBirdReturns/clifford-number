name: Macro estate registry

on:
  pull_request:
    paths:
      - 'data/estates/**'
      - 'docs/estates.md'
      - 'data/intake/next-ten-estates/README.md'
      - 'data/intake/estate-expansion-01/README.md'
      - 'tools/build-estates.mjs'
      - 'tools/validate-estates.mjs'
      - 'tools/compile.mjs'
      - 'test/estates.test.js'
      - 'test/research-tracks.test.js'
      - '.github/workflows/estates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile and validate macro estates
        run: |
          npm run compile
          node tools/validate-estates.mjs
          node test/estates.test.js
          node test/research-tracks.test.js

      - name: Full release gate
        run: npm run release:check

      - name: Preserve estate registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-estates
          path: |
            data/estates/README.md
            data/estates/meta.json
            data/estates/definitions/*.json
            data/estates/case-map.jsonl
            data/estates/track-map.jsonl
            data/estates/slice-map.jsonl
            docs/estates.md
            build/estates/index.json
          if-no-files-found: error
