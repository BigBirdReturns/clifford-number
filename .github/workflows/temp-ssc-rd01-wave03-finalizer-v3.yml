name: TEMP finalize SSC RD-01 Wave-03 terminal closure v3

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-finalizer-v3.yml'
      - '.github/tmp/finalize-rd01-wave03-v2.sh'
      - '.ssc-rd01-wave03-finalizer-v3/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: temp-ssc-rd01-wave03-finalizer-v3
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: finalizer
        name: Materialize, qualify, merge, prove, and clean RD-01-C06
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINALIZER_PR: ${{ github.event.pull_request.number }}
        run: bash .github/tmp/finalize-rd01-wave03-v2.sh
      - name: Preserve exact finalizer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-finalizer-v3
          path: /tmp/ssc-rd01-wave03-finalizer-v2-receipt
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable finalizer checkpoint
        if: always()
        env:
          FINALIZER_OUTCOME: ${{ steps.finalizer.outcome }}
        run: |
          set -Eeuo pipefail
          REF='archive/ssc-rd01-wave03-finalizer-receipt'
          START=$(git ls-remote origin "refs/heads/$REF" | awk '{print $1}')
          test -n "$START"
          git fetch --no-tags origin "$REF"
          rm -rf /tmp/rd01-finalizer-receipt-branch
          git worktree add --detach /tmp/rd01-finalizer-receipt-branch "$START"
          cd /tmp/rd01-finalizer-receipt-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf reports/transport/ssc-rd01-wave03-finalizer-latest
          mkdir -p reports/transport/ssc-rd01-wave03-finalizer-latest
          cp -a /tmp/ssc-rd01-wave03-finalizer-v2-receipt/. reports/transport/ssc-rd01-wave03-finalizer-latest/
          printf 'workflow_outcome: %s\nrun_id: %s\nrun_attempt: %s\nhead_sha: %s\n' "$FINALIZER_OUTCOME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > reports/transport/ssc-rd01-wave03-finalizer-latest/workflow.txt
          git add reports/transport/ssc-rd01-wave03-finalizer-latest
          git commit -m 'Update RD-01 Wave-03 finalizer receipt'
          git push origin "HEAD:refs/heads/$REF" --force-with-lease="refs/heads/$REF:$START"
      - name: Enforce finalizer result
        if: always()
        env:
          FINALIZER_OUTCOME: ${{ steps.finalizer.outcome }}
        run: test "$FINALIZER_OUTCOME" = 'success'
