name: Temporary Wave 36 source publisher

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-source-publisher.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave36-source-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct, test, and publish the Wave 36 source layer
        shell: bash
        env:
          BRANCH: agent/lake-allocator-war-public-acquisition-wave-36
          BASE_COMMIT: 4e6f046eeb08ef38a85287ba09e64906c52571c6
          EXPECTED_B64_SHA256: fb188f3ccd45bfb1625b181c548d2ad1d2d989e79de65676aaedf530437e426c
          EXPECTED_GZIP_SHA256: 9c2d84e39ecaafb1c0d99e2c51e16acb785cde45aa7622d3f21b8c3bdd772bb7
          EXPECTED_PATCH_SHA256: a439014df2f94d00c29a1016932981b797e5fb3f4fe976699623bb77f55b42aa
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_COMMIT" HEAD)" = "$BASE_COMMIT"
          before="$(git rev-parse HEAD)"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          b64="$tmp/wave36-source.b64"
          gzip_path="$tmp/wave36-source.patch.gz"
          patch_path="$tmp/wave36-source.patch"

          cat \
            .github/tmp/wave36-source.patch.gz.b64.part-00 \
            .github/tmp/wave36-source.patch.gz.b64.part-01 \
            > "$b64"
          for i in $(seq -w 0 12); do
            cat ".github/tmp/wave36-rem.chunk-${i}" >> "$b64"
          done
          tail -c +6001 .github/tmp/wave36-source.patch.gz.b64.part-04 >> "$b64"

          test "$(wc -c < "$b64" | tr -d ' ')" = 49804
          test "$(sha256sum "$b64" | awk '{print $1}')" = "$EXPECTED_B64_SHA256"
          base64 -d "$b64" > "$gzip_path"
          test "$(sha256sum "$gzip_path" | awk '{print $1}')" = "$EXPECTED_GZIP_SHA256"
          gzip -t "$gzip_path"
          gzip -dc "$gzip_path" > "$patch_path"
          test "$(sha256sum "$patch_path" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

          git apply --check "$patch_path"
          git apply "$patch_path"
          rm -f .github/tmp/wave36-*

          node --check tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
          node --check tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
          node --check tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
          node --check test/lake-allocator-war-public-acquisition-wave-36.test.js
          node -e "const fs=require('fs'); for (const p of ['data/project/lake-allocator-war-public-acquisition-wave-36-policy.json','data/project/lake-allocator-war-public-acquisition-wave-36-plan.json']) JSON.parse(fs.readFileSync(p,'utf8'));"

          fixture="$tmp/fixture"
          mkdir -p "$fixture"
          tar --exclude=.git -cf - . | tar -xf - -C "$fixture"
          (
            cd "$fixture"
            LAW36_FIXTURE_MODE=1 LAW36_OBSERVED_AT=2026-08-02T00:00:00Z node tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
            node test/lake-allocator-war-public-acquisition-wave-36.test.js
          )

          expected="$tmp/expected-paths.txt"
          cat > "$expected" <<'EOF'
          .github/tmp/wave36-materialize-trigger.json
          .github/tmp/wave36-materialize.chunk-00
          .github/tmp/wave36-materialize.chunk-01
          .github/tmp/wave36-materialize.chunk-02
          .github/tmp/wave36-materialize.chunk-03
          .github/tmp/wave36-materialize.chunk-04
          .github/tmp/wave36-materialize.chunk-05
          .github/tmp/wave36-rem.chunk-00
          .github/tmp/wave36-rem.chunk-01
          .github/tmp/wave36-rem.chunk-02
          .github/tmp/wave36-rem.chunk-03
          .github/tmp/wave36-rem.chunk-04
          .github/tmp/wave36-rem.chunk-05
          .github/tmp/wave36-rem.chunk-06
          .github/tmp/wave36-rem.chunk-07
          .github/tmp/wave36-rem.chunk-08
          .github/tmp/wave36-rem.chunk-09
          .github/tmp/wave36-rem.chunk-10
          .github/tmp/wave36-rem.chunk-11
          .github/tmp/wave36-rem.chunk-12
          .github/tmp/wave36-source.patch.gz.b64.part-00
          .github/tmp/wave36-source.patch.gz.b64.part-01
          .github/tmp/wave36-source.patch.gz.b64.part-02
          .github/tmp/wave36-source.patch.gz.b64.part-03
          .github/tmp/wave36-source.patch.gz.b64.part-04
          BUILD-INSTRUCTIONS.md
          README.md
          data/project/lake-allocator-war-public-acquisition-wave-36-plan.json
          data/project/lake-allocator-war-public-acquisition-wave-36-policy.json
          data/project/lake-allocator-war-wave-21-policy.json
          data/project/lake-basin-registry.json
          data/project/lake-index-policy.json
          docs/methods/lake-allocator-war-public-acquisition-wave-36.md
          docs/milestones/lake-allocator-war-public-acquisition-wave-36.md
          package.json
          test/lake-allocator-war-public-acquisition-wave-36.test.js
          tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
          tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
          tools/install-lake-allocator-war-wave-21.mjs
          tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
          tools/validate-lake-allocator-war-wave-21.mjs
          EOF
          sed -i 's/^          //' "$expected"
          git diff --name-only "$before" | sort > "$tmp/actual-paths.txt"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$tmp/actual-paths.txt"

          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add -A
          git commit -m 'Install allocator-war public acquisition Wave 36 source layer'

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$before"
          git push origin "HEAD:$BRANCH"
