name: TEMP prove RD-04 North Dakota manifest-repair postmerge v1

on:
  pull_request:
    branches:
      - agent/ssc-rd04-nd-promotion-manifest-repair-postmerge-base-v1
    paths:
      - .trigger/ssc-rd04-nd-promotion-manifest-repair-postmerge-v1

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MERGE_COMMIT: bab9570ab043df7c5062e5a45a0717a82eed346b
      REPAIR_PARENT: 4eaa66d7a0f025e0c4ec797e9925634a22d9e49e
      REPAIR_COMMIT: 21d4f8433e49e8428d59fc37ad91b9ac77c835f5
      REPAIR_TREE: 74c43136c79700be7cacf9d983738743cec227b8
      PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion
      WORKFLOW_PATH: .github/workflows/temp-prove-ssc-rd04-nd-promotion-manifest-repair-postmerge-v1.yml
      TRIGGER_PATH: .trigger/ssc-rd04-nd-promotion-manifest-repair-postmerge-v1
      OUT: /tmp/ssc-rd04-nd-promotion-manifest-repair-postmerge-v1
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bind observer and exact canonical repair topology
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/native-artifact" "$OUT/rebuilt"
          EXPECTED_BASE='${{ github.event.pull_request.base.sha }}'
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$EXPECTED_HEAD^")" = "$EXPECTED_BASE"
          test "$(git rev-list --count "$EXPECTED_BASE..$EXPECTED_HEAD")" -eq 1
          test "$(git diff --name-only "$EXPECTED_BASE" "$EXPECTED_HEAD")" = "$TRIGGER_PATH"
          test "$(git rev-parse "$EXPECTED_BASE^")" = "$MERGE_COMMIT"
          test "$(git rev-list --count "$MERGE_COMMIT..$EXPECTED_BASE")" -eq 1
          test "$(git diff --name-only "$MERGE_COMMIT" "$EXPECTED_BASE")" = "$WORKFLOW_PATH"

          read -r P1 P2 EXTRA <<< "$(git show -s --format='%P' "$MERGE_COMMIT")"
          test "$P1" = "$REPAIR_PARENT"
          test "$P2" = "$REPAIR_COMMIT"
          test -z "${EXTRA:-}"
          test "$(git rev-parse "$REPAIR_COMMIT^")" = "$REPAIR_PARENT"
          test "$(git rev-parse "$REPAIR_COMMIT^{tree}")" = "$REPAIR_TREE"
          test "$(git rev-parse "$MERGE_COMMIT^{tree}")" = "$REPAIR_TREE"
          git diff --exit-code "$REPAIR_COMMIT" "$MERGE_COMMIT"

          cat > "$OUT/expected-repair-paths.txt" <<'PATHS'
          .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.yml
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/product-manifest.json
          test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js
          tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs
          PATHS
          LC_ALL=C sort -o "$OUT/expected-repair-paths.txt" "$OUT/expected-repair-paths.txt"
          git diff --name-only "$REPAIR_PARENT" "$REPAIR_COMMIT" | LC_ALL=C sort > "$OUT/observed-repair-paths.txt"
          git diff --name-only --diff-filter=M "$REPAIR_PARENT" "$REPAIR_COMMIT" | LC_ALL=C sort > "$OUT/observed-modified-paths.txt"
          cmp "$OUT/expected-repair-paths.txt" "$OUT/observed-repair-paths.txt"
          cmp "$OUT/expected-repair-paths.txt" "$OUT/observed-modified-paths.txt"
          test -z "$(git diff --name-only --diff-filter=ADTRCUXB "$REPAIR_PARENT" "$REPAIR_COMMIT")"
          git diff --check "$REPAIR_PARENT" "$REPAIR_COMMIT"

          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promoted-partial-field-matrix.json")" = 'c25a1ad8fdfe82f70f1ff71e61da6796be94c737'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promotion-input-custody.json")" = '7401d972c211b6558b5aa09fa59b6344c7a404d2'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promotion-decision.json")" = '7af836513c2eec2a58eea9fa6a95f71b9256748e'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/cell-promotion-ledger.json")" = 'b36b1f85e8d8d3054200bbf2824757e797f70f54'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/remaining-open-field-census.json")" = '474685d89edcd256995fc1fe220935703453eb3b'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/promotion-summary.json")" = 'b6e13e195eb21b4f4285139626baeb0d4bbf2464'
          test "$(git rev-parse "$REPAIR_COMMIT:$PRODUCT_ROOT/index.json")" = 'e38a652d93fbd3ae3094173fd5ff9b6cb36c3399'

          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          LIVE_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$MERGE_COMMIT" "$LIVE_MAIN"
          if test "$LIVE_MAIN" != "$MERGE_COMMIT"; then
            git diff --name-only "$MERGE_COMMIT" "$LIVE_MAIN" | LC_ALL=C sort > "$OUT/live-main-successor-paths.txt"
            if grep -Fxf "$OUT/expected-repair-paths.txt" "$OUT/live-main-successor-paths.txt"; then
              echo 'later main overlaps repaired custody paths' >&2
              exit 1
            fi
          else
            : > "$OUT/live-main-successor-paths.txt"
          fi
          printf '%s\n' "$LIVE_MAIN" > "$OUT/live-main.txt"

      - name: Authenticate native canonical-push repair artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 36); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGE_COMMIT&event=push&per_page=100" > "$OUT/runs.json"
            set +e
            python - "$OUT/runs.json" "$OUT/native-selection.json" <<'PY'
          import json,pathlib,sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          target=sorted([r for r in data.get('workflow_runs',[]) if r.get('name')=='Qualify RD-04 North Dakota promotion manifest-contract repair'],key=lambda r:r.get('id',0))
          active=[r for r in target if r.get('status') in {'queued','in_progress','waiting','pending','requested'}]
          latest=target[-1] if target else None
          value={'target_runs':[{k:r.get(k) for k in ('id','name','status','conclusion','event','head_sha','run_attempt')} for r in target],'active_target_runs':[{k:r.get(k) for k in ('id','status','conclusion')} for r in active],'latest_target_run':({k:latest.get(k) for k in ('id','name','status','conclusion','event','head_sha','run_attempt')} if latest else None)}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          if latest and latest.get('status')=='completed' and latest.get('conclusion')=='success' and not active: raise SystemExit(0)
          if latest and latest.get('status')=='completed' and latest.get('conclusion') not in {'success','skipped','neutral'}: raise SystemExit(2)
          raise SystemExit(1)
          PY
            status=$?
            set -e
            if test "$status" = 0; then
              RUN_ID="$(python -c 'import json; d=json.load(open("'"$OUT"'/native-selection.json")); print(d["latest_target_run"]["id"])')"
              printf '%s\n' "$RUN_ID" > "$OUT/native-run-id.txt"
              break
            fi
            test "$status" != 2
            sleep 10
          done
          test -s "$OUT/native-run-id.txt"
          RUN_ID="$(cat "$OUT/native-run-id.txt")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > "$OUT/native-artifacts.json"
          python - "$OUT/native-artifacts.json" "$OUT/native-artifact-selection.json" <<'PY'
          import json,pathlib,sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          rows=[a for a in data.get('artifacts',[]) if a.get('name')=='ssc-rd04-nd-current-public-record-gap-promotion-manifest-contract-repair-v1' and not a.get('expired')]
          assert len(rows)==1, rows
          pathlib.Path(sys.argv[2]).write_text(json.dumps(rows[0],indent=2,sort_keys=True)+'\n')
          PY
          ARTIFACT_ID="$(python -c 'import json; print(json.load(open("'"$OUT"'/native-artifact-selection.json"))["id"])')"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$OUT/native-artifact.zip"
          python - "$OUT/native-artifact-selection.json" "$OUT/native-artifact.zip" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          meta=json.loads(pathlib.Path(sys.argv[1]).read_text()); data=pathlib.Path(sys.argv[2]).read_bytes()
          assert len(data)==meta['size_in_bytes']; assert 'sha256:'+hashlib.sha256(data).hexdigest()==meta['digest']
          with zipfile.ZipFile(sys.argv[2]) as zf: assert zf.testzip() is None
          PY
          unzip -q "$OUT/native-artifact.zip" -d "$OUT/native-artifact"
          find "$OUT/native-artifact" -name SHA256SUMS -print0 | while IFS= read -r -d '' sums; do (cd "$(dirname "$sums")" && sha256sum -c "$(basename "$sums")"); done
          test "$(cat "$OUT/native-artifact/repair-commit.txt")" = "$REPAIR_COMMIT"
          python - "$OUT/native-artifact" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for name in ('validator.json','post-release-validator.json'):
              value=json.loads((root/name).read_text()); assert value['state']=='qualified_one_cell_promotion'; assert value['terminal_cells']==228 and value['open_cells']==222; assert value['nd_terminal_fields']==8 and value['nd_open_fields']==1; assert value['nd_row_state']=='still_open'
          adv=json.loads((root/'adversarial.json').read_text()); assert adv['refusals']==44
          PY

      - name: Reproduce repaired canonical custody
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKTREE=/tmp/ssc-rd04-nd-promotion-manifest-repair-canonical-worktree-v1
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "$MERGE_COMMIT"
          (
            cd "$WORKTREE"
            node tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs --out "$OUT/rebuilt" > "$OUT/rebuild.json"
            for name in promotion-input-custody.json promotion-decision.json cell-promotion-ledger.json promoted-partial-field-matrix.json remaining-open-field-census.json promotion-summary.json index.json; do cmp "$OUT/rebuilt/$name" "$PRODUCT_ROOT/$name"; done
            node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs > "$OUT/canonical-validator.json"
            node test/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.test.js > "$OUT/canonical-adversarial.json"
            jq -e '.refusals == 44' "$OUT/canonical-adversarial.json" >/dev/null
            npm run release:check > "$OUT/canonical-release.log" 2>&1
            git reset --hard "$MERGE_COMMIT"
            git clean -fdx
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            node tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion.mjs > "$OUT/canonical-post-release-validator.json"
            cmp "$OUT/canonical-validator.json" "$OUT/canonical-post-release-validator.json"
          )
          git worktree remove --force "$WORKTREE"

      - name: Seal terminal proof
        shell: bash
        run: |
          set -Eeuo pipefail
          python - "$OUT" <<'PY'
          import json,pathlib,sys
          out=pathlib.Path(sys.argv[1]); meta=json.loads((out/'native-artifact-selection.json').read_text())
          receipt={'schema_version':'ssc-rd04-nd-promotion-manifest-repair-postmerge-proof@1','state':'complete','canonical_merge':'bab9570ab043df7c5062e5a45a0717a82eed346b','repair_parent':'4eaa66d7a0f025e0c4ec797e9925634a22d9e49e','repair_commit':'21d4f8433e49e8428d59fc37ad91b9ac77c835f5','repair_tree':'74c43136c79700be7cacf9d983738743cec227b8','live_main':(out/'live-main.txt').read_text().strip(),'native_push_run':int((out/'native-run-id.txt').read_text()),'native_artifact_id':meta['id'],'native_artifact_bytes':meta['size_in_bytes'],'native_artifact_digest':meta['digest'],'terminal_cells':228,'still_open_cells':222,'terminal_substantive_cells':118,'still_open_substantive_cells':182,'terminal_units':10,'north_dakota_terminal_fields':8,'north_dakota_open_fields':1,'north_dakota_row_state':'still_open','repair_modified_paths':4,'repair_created_matrix_updates':0,'repair_created_row_state_mutations':0,'class_closed':False,'outside_human_dependency':False,'next_authorized_operation':'rebind_request_free_exact_current_row_state_validation_to_repaired_main'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-promotion-manifest-repair-postmerge-v1
          path: /tmp/ssc-rd04-nd-promotion-manifest-repair-postmerge-v1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Require terminal proof
        run: |
          test "$(jq -r .state "$OUT/receipt.json")" = complete
          test "$(jq -r .next_authorized_operation "$OUT/receipt.json")" = rebind_request_free_exact_current_row_state_validation_to_repaired_main
