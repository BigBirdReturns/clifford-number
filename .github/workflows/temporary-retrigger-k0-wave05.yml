name: Temporary retrigger K0 role-neutral Wave 05

on:
  push:
    branches:
      - agent/k0-role-neutral-wave-05
    paths:
      - '.github/workflows/temporary-retrigger-k0-wave05.yml'

permissions:
  contents: write

jobs:
  retrigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-05
          fetch-depth: 0
      - name: Remove dispatcher and retrigger the checksum-bound materializer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-retrigger-k0-wave05.yml
          printf '\n# retriggered after branch-state reconciliation\n' >> .github/workflows/temporary-materialize-k0-wave05.yml
          git add .github/workflows/temporary-materialize-k0-wave05.yml
          git commit -m "Retrigger K0 Wave 05 materialization"
          git push origin HEAD:agent/k0-role-neutral-wave-05
