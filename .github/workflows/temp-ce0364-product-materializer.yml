name: TEMP CE0364 product materializer

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-ce0364-product-materializer.yml'
      - '.github/scripts/temp-ce0364-materialize.py'

permissions:
  contents: write

concurrency:
  group: temp-ce0364-product-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/temp-ce0364-xbow-source-acquisition-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCRIPT_AUTHORED_BASE: e499eaeeb6bcdf64b76f0440c10e79ea1c064c4a
      EVENT_BLOB: 8c3a8dc17b9d28ba4ed330a82b50d3f7a5e5846c
      RECEIPT_BLOB: 54cee87a6615cbde7d26b92e00970f4835836bc8
      TEST_BLOB: 142517f0db5dc64ce9afbe3fd0daa1d32b1c0852
      SCRIPT_BLOB: 41d8a810f8bf13cd3d36a738b7db967e99247937
      PRODUCT_BRANCH: agent/ce0364-xbow-source-conflict-adjudication-20260908
      EXACT_CONTROLLER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize, qualify and publish one exact product branch
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf receipt
          mkdir -p receipt
          phase=failed
          stage=initialize
          finish() {
            code=$?
            trap - EXIT
            set +e
            printf '%s\n' "$phase" > receipt/phase.txt
            printf '%s\n' "$stage" > receipt/stage.txt
            printf '%s\n' "$code" > receipt/exit-code.txt
            find receipt -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > receipt/SHA256SUMS
            exit "$code"
          }
          trap finish EXIT

          stage=lease-controller
          test "$(git rev-parse HEAD)" = "$EXACT_CONTROLLER_HEAD"
          test "$(git hash-object .github/scripts/temp-ce0364-materialize.py)" = "$SCRIPT_BLOB"
          cp .github/scripts/temp-ce0364-materialize.py "$RUNNER_TEMP/ce0364-materialize.py"

          stage=lease-main
          leased_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${#leased_main}" -eq 40
          test -z "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH")"
          git fetch --no-tags origin main
          git checkout --detach "$leased_main"
          leased_tree="$(git rev-parse HEAD^{tree})"
          test "$(git hash-object data/intake/natsec100-pathways/chunk1/conversion_events.jsonl)" = "$EVENT_BLOB"
          test "$(git hash-object data/intake/natsec100-pathways/chunk1/receipts.jsonl)" = "$RECEIPT_BLOB"
          test "$(git hash-object test/natsec100-award-control.test.js)" = "$TEST_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s\n' "$leased_main" > receipt/leased-main.txt
          printf '%s\n' "$leased_tree" > receipt/leased-main-tree.txt

          stage=bind-runtime-materializer
          python3 - "$RUNNER_TEMP/ce0364-materialize.py" "$SCRIPT_AUTHORED_BASE" "$leased_main" <<'PY'
          import pathlib, sys
          target = pathlib.Path(sys.argv[1])
          old = f'EXPECTED_MAIN = "{sys.argv[2]}"'
          new = f'EXPECTED_MAIN = "{sys.argv[3]}"'
          text = target.read_text(encoding='utf-8')
          if text.count(old) != 1 or (new != old and new in text):
              raise SystemExit('runtime main-lease patch denominator mismatch')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY
          sha256sum "$RUNNER_TEMP/ce0364-materialize.py" > receipt/runtime-materializer-sha256.txt

          stage=materialize
          python3 "$RUNNER_TEMP/ce0364-materialize.py" | tee receipt/materialize.log

          stage=integrate-cross-corpus-denominator
          python3 - <<'PY'
          import json
          from pathlib import Path

          map_path = Path('data/research/clifford-cross-corpus-public-interest-map.json')
          source_map = json.loads(map_path.read_text(encoding='utf-8'))
          lanes = [lane for lane in source_map['lanes'] if lane.get('lane_id') == 'natsec100-defense-companies']
          if len(lanes) != 1:
              raise SystemExit('expected exactly one NatSec100 map lane')
          lane = lanes[0]
          if lane['counts'].get('receipts') != 16:
              raise SystemExit(f"NatSec100 map receipt denominator drifted: {lane['counts'].get('receipts')}")
          lane['counts']['receipts'] = 19
          for path in [
              'data/intake/natsec100-pathways/chunk1/receipts.jsonl',
              'data/research/natsec100-x-bow-award-adjudication.json',
          ]:
              if path not in lane['source_paths']:
                  lane['source_paths'].append(path)
          source_map['generated_at'] = '2026-09-08'
          map_path.write_text(json.dumps(source_map, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          record_path = Path('receipts/natsec100/ce0364-xbow-20260908/materialization-record.json')
          record = json.loads(record_path.read_text(encoding='utf-8'))
          for path in [
              'data/research/clifford-cross-corpus-public-interest-map.json',
              'build/cross-corpus-map/current.json',
          ]:
              if path not in record['intended_paths']:
                  record['intended_paths'].append(path)
          record['intended_paths'].sort()
          record['cross_corpus_receipt_denominator'] = {'before': 16, 'after': 19}
          record_path.write_text(json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY

          stage=focused-test
          node test/natsec100-award-control.test.js | tee receipt/focused-test.log

          stage=install
          npm ci --no-audit --no-fund > receipt/npm-ci.log 2>&1

          stage=release-check
          npm run release:check > receipt/release-check.log 2>&1

          stage=path-census
          git diff --check
          mapfile -t changed < <(git status --short --untracked-files=all | sed 's/^...//' | grep -v '^receipt/' | sort)
          printf '%s\n' "${changed[@]}" > receipt/changed-paths-before-commit.txt
          printf '%s\n' "${#changed[@]}" > receipt/changed-path-count.txt
          for candidate in "${changed[@]}"; do
            case "$candidate" in
              data/intake/natsec100-pathways/chunk1/conversion_events.jsonl|\
              data/intake/natsec100-pathways/chunk1/receipts.jsonl|\
              data/research/natsec100-x-bow-award-adjudication.json|\
              data/research/clifford-cross-corpus-public-interest-map.json|\
              build/cross-corpus-map/current.json|\
              test/natsec100-award-control.test.js|\
              receipts/natsec100/ce0364-xbow-20260908/*)
                ;;
              *)
                echo "Unexpected changed path: $candidate" >&2
                exit 1
                ;;
            esac
          done
          test "${#changed[@]}" -eq 18

          stage=commit
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git switch -c "$PRODUCT_BRANCH"
          git add -- \
            data/intake/natsec100-pathways/chunk1/conversion_events.jsonl \
            data/intake/natsec100-pathways/chunk1/receipts.jsonl \
            data/research/natsec100-x-bow-award-adjudication.json \
            data/research/clifford-cross-corpus-public-interest-map.json \
            build/cross-corpus-map/current.json \
            test/natsec100-award-control.test.js \
            receipts/natsec100/ce0364-xbow-20260908
          git diff --cached --check
          git commit -m "Adjudicate CE0364 X-Bow source conflict"
          product_head="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse HEAD^{tree})"
          product_parent="$(git rev-parse HEAD^)"
          test "$product_parent" = "$leased_main"
          git diff --name-only "$leased_main" HEAD | sort > receipt/changed-paths.txt
          test "$(wc -l < receipt/changed-paths.txt)" -eq 18
          printf '%s\n' "$product_head" > receipt/product-head.txt
          printf '%s\n' "$product_tree" > receipt/product-tree.txt
          printf '%s\n' "$product_parent" > receipt/product-parent.txt
          git show --stat --oneline --decorate=short HEAD > receipt/product-stat.txt

          stage=renew-main-lease
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$leased_main"
          test -z "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH")"

          stage=push-product
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          remote_product="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$remote_product" = "$product_head"
          printf '%s\n' "$remote_product" > receipt/remote-product-head.txt

          phase=success
          stage=complete

      - name: Upload checksum-bound materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ce0364-product-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt/
          if-no-files-found: error
          retention-days: 90
