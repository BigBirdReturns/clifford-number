name: Preference custody service-denominator assurance control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/service-denominator-assurance.fixture.json'
      - 'tools/lib/preference-service-denominator-assurance.mjs'
      - 'tools/compile-preference-service-denominator-assurance.mjs'
      - 'tools/validate-preference-service-denominator-assurance.mjs'
      - 'test/preference-service-denominator-assurance.test.js'
      - 'docs/preference-custody-service-denominator-assurance.md'
      - '.github/workflows/preference-service-denominator-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-denominator-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile eligibility, request, queue, rationing, denial, unserved, completion, and lineage worlds
        run: node tools/compile-preference-service-denominator-assurance.mjs
      - name: Validate denominator reconciliation, correction, and authority boundaries
        run: node tools/validate-preference-service-denominator-assurance.mjs
      - name: Exercise omission, loss, censoring, relabeling, completion, lineage, authority, and tamper fixtures
        run: node test/preference-service-denominator-assurance.test.js
      - name: Preserve deterministic service-denominator projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-service-denominator-assurance-pc31
          path: |
            build/research/preference-service-denominator-assurance.json
            build/research/preference-service-denominator-assurance.md
          if-no-files-found: error
