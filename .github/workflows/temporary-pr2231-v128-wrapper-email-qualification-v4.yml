name: Temporary PR 2231 V128 wrapper and embedded-email qualification V4 R4 recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v128-wrapper-email-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v128-v4-recovery:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v128-wrapper-email-qualification-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v128-wrapper-email-qualification-v4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute the current-head V128 recovery qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          export EXPECTED_CONTROLLER="$(git rev-parse HEAD)"
          payload_blob=233393286c479a29c46f02ce5a04c9de98794470
          payload_size=6404
          payload_sha256=09f363ac017f7ab1b00757af3add8579dc2c56d7d55b548d6e3022e6ec2929a2
          qualifier_blob=bc8ebd84f05e264137348a4997ccd84d6a628a6d
          qualifier_size=24881
          qualifier_sha256=9bfb5aef84e6d8384c1019c69a60d783a10044a65ce49ac92c41081c4e05a269
          envelope=/tmp/pr2231-v128-wrapper-email-controller-v4-recovery
          payload="$envelope/qualifier-v128-v4-recovery.sh.xz"
          qualifier="$envelope/qualifier-v128-v4-recovery.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-v128-current-head-recovery-r4\n' "$rc" > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          printf 'controller_branch=%s\nexpected_branch=%s\ncontroller_head=%s\nexpected_head=%s\n' \
            "${CONTROLLER_BRANCH:-}" "${EXPECTED_CONTROLLER_BRANCH:-}" \
            "$(git rev-parse HEAD)" "$EXPECTED_CONTROLLER"
          cp .github/temporary/pr2231-v128-qualifier-v4.sh.xz "$payload"
          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          xz -dc "$payload" > "$qualifier"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          printf 'payload_blob=%s\npayload_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\n' \
            "$payload_blob" "$payload_sha256" "$qualifier_blob" "$qualifier_sha256" \
            > "$envelope/qualifier-provenance.txt"
          bash "$qualifier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v128-wrapper-email-qualification-v4-r4-recovery
          path: |
            /tmp/pr2231-v128-qualification-v1
            /tmp/pr2231-v128-wrapper-email-controller-v4-recovery
          if-no-files-found: error
          retention-days: 90
