name: Preference custody real-case admission

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/real-cases/**'
      - 'tools/lib/preference-real-case.mjs'
      - 'tools/compile-preference-real-case.mjs'
      - 'tools/validate-preference-real-case.mjs'
      - 'test/preference-real-case.test.js'
      - 'docs/preference-custody-times-exploraition-admission.md'
      - '.github/workflows/preference-real-case.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile bounded Times ExplorAItion admission
        run: node tools/compile-preference-real-case.mjs
      - name: Validate publication and inference boundaries
        run: node tools/validate-preference-real-case.mjs
      - name: Exercise positive and adversarial admission fixtures
        run: node test/preference-real-case.test.js
      - name: Preserve deterministic admission projections
        uses: actions/upload-artifact@v4
        with:
          name: times-exploraition-preference-custody-admission
          path: |
            build/research/preference-real-cases/times-exploraition-admission.json
            build/research/preference-real-cases/times-exploraition-admission.md
          if-no-files-found: error
