name: Materialize Counter-Selector Wave 26

on:
  push:
    branches:
      - 'agent/counter-selector-wave-26-observability-pivot'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-26-observability-pivot
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact carrier and unpack Wave 26 estate
        run: |
          set -euo pipefail
          cat > /tmp/wave26-expected-blobs <<'EOF'
          c786bde7c661fc7fa4fc7368a2cce43ce10d71e7  .github/materializers/counter-selector-wave-26/payload-00
          ceb15eca9bd10aef4c529da60b3bc3a34d0c297b  .github/materializers/counter-selector-wave-26/payload-01
          55aa5eda7d2322ec599ad545b235e921d658964a  .github/materializers/counter-selector-wave-26/payload-02
          2ca9e51f95c2d836ae77f450e47fdd534426ed23  .github/materializers/counter-selector-wave-26/payload-03
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave26-expected-blobs
          cat .github/materializers/counter-selector-wave-26/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-26.tar.gz
          echo 'f6bfe530c3c8de4ed80804b0295a2bad9fb454f0196ef9f8d658225a36324be2  /tmp/counter-selector-wave-26.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-26.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-26
          rm -f .github/workflows/materialize-counter-selector-wave-26.yml
      - name: Build, validate, and attack Wave 26
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-26.mjs
          node tools/validate-counter-selector-wave-26.mjs
          node test/counter-selector-wave-26.test.js
      - name: Commit exact permanent Wave 26 estate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-26/payload-00 \
            .github/materializers/counter-selector-wave-26/payload-01 \
            .github/materializers/counter-selector-wave-26/payload-02 \
            .github/materializers/counter-selector-wave-26/payload-03 \
            .github/workflows/materialize-counter-selector-wave-26.yml \
            .github/workflows/counter-selector-wave-26.yml \
            data/project/counter-selector-wave-26-observability-pivot.json \
            data/project/counter-selector-wave-26-candidate-registry.json \
            data/project/counter-selector-wave-26-release-manifest.json \
            docs/methods/counter-selector-observability-pivot.md \
            docs/milestones/counter-selector-wave-26.md \
            reports/core-thesis/counter-selector-wave-26/data.json \
            reports/core-thesis/counter-selector-wave-26/index.html \
            schemas/counter-selector-observability-pivot.schema.json \
            test/counter-selector-wave-26.test.js \
            tools/build-counter-selector-wave-26.mjs \
            tools/validate-counter-selector-wave-26.mjs | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected staged paths' >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Seed Counter-Selector Wave 26 observability pivot'
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Wave 26 reconstruction
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-26.mjs
          node tools/validate-counter-selector-wave-26.mjs
          node test/counter-selector-wave-26.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Publish permanent Wave 26 head
        run: git push origin HEAD:agent/counter-selector-wave-26-observability-pivot
