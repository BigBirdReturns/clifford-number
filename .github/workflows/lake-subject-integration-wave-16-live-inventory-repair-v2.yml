name: Repair Wave 16 live inventory reconciliation v2

on:
  push:
    branches:
      - agent/lake-subject-integration-wave-16
    paths:
      - '.github/tmp/lake-subject-integration-wave-16-live-inventory-repair-v2-trigger.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply line-structured Wave 16 repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          generator = Path('tools/apply-lake-subject-integration-wave-16-sources.mjs')
          text = generator.read_text()
          if "const crossCorpusMapPath = 'data/research/clifford-cross-corpus-public-interest-map.json';" not in text:
              needle = """assert.equal(canonicalAdditions.length, policy.expected.new_canonical_records);
          assert.equal(organizationsDoc.organizations.length, policy.expected.canonical_organization_rows_after);
          writeJson('data/canonical/organizations.json', organizationsDoc);

          function effectiveTarget(decision) {"""
              replacement = """assert.equal(canonicalAdditions.length, policy.expected.new_canonical_records);
          assert.equal(organizationsDoc.organizations.length, policy.expected.canonical_organization_rows_after);
          writeJson('data/canonical/organizations.json', organizationsDoc);

          const crossCorpusMapPath = 'data/research/clifford-cross-corpus-public-interest-map.json';
          const crossCorpusMap = readJson(crossCorpusMapPath);
          assert.equal(crossCorpusMap.schema_version, 'clifford-cross-corpus-public-interest-map@1');
          assert.equal(crossCorpusMap.inventory?.canonical?.actors, actorsDoc.actors.length, 'cross-corpus actor inventory drift');
          assert.ok(
            [policy.baseline.canonical_organization_rows, policy.expected.canonical_organization_rows_after]
              .includes(crossCorpusMap.inventory?.canonical?.organizations),
            'cross-corpus organization inventory outside the bounded Wave 16 transition'
          );
          crossCorpusMap.generated_at = policy.as_of;
          crossCorpusMap.inventory.canonical.organizations = organizationsDoc.organizations.length;
          writeJson(crossCorpusMapPath, crossCorpusMap);

          function effectiveTarget(decision) {"""
              assert text.count(needle) == 1, {'generator_inventory_seam_occurrences': text.count(needle)}
              text = text.replace(needle, replacement)
              generator.write_text(text)

          policy_path = Path('data/project/lake-subject-integration-wave-16-policy.json')
          policy = json.loads(policy_path.read_text())
          inventory_path = 'data/research/clifford-cross-corpus-public-interest-map.json'
          if inventory_path not in policy['input_paths']:
              policy['input_paths'].append(inventory_path)
          policy['input_paths'] = sorted(policy['input_paths'])
          policy_path.write_text(json.dumps(policy, indent=2) + '\n')

          test_path = Path('test/lake-subject-integration-wave-16.test.js')
          test_text = test_path.read_text()
          if "const crossCorpusMap = readJson('data/research/clifford-cross-corpus-public-interest-map.json');" not in test_text:
              import_needle = "const organizations = readJson('data/canonical/organizations.json').organizations;\nconst activeIdentity = readJson('build/axm-identity.json');"
              import_replacement = "const organizations = readJson('data/canonical/organizations.json').organizations;\nconst crossCorpusMap = readJson('data/research/clifford-cross-corpus-public-interest-map.json');\nconst activeIdentity = readJson('build/axm-identity.json');"
              assert test_text.count(import_needle) == 1, {'test_inventory_import_occurrences': test_text.count(import_needle)}
              test_text = test_text.replace(import_needle, import_replacement)
          if 'assert.equal(crossCorpusMap.inventory.canonical.organizations, policy.expected.canonical_organization_rows_after);' not in test_text:
              assertion_needle = "assert.equal(catalog.counts.generic_unresolved_subject_references, 0);\n\nfunction claim(caseId, claimId) {"
              assertion_replacement = "assert.equal(catalog.counts.generic_unresolved_subject_references, 0);\nassert.equal(crossCorpusMap.inventory.canonical.organizations, policy.expected.canonical_organization_rows_after);\nassert.equal(crossCorpusMap.generated_at, policy.as_of);\n\nfunction claim(caseId, claimId) {"
              assert test_text.count(assertion_needle) == 1, {'test_inventory_assertion_occurrences': test_text.count(assertion_needle)}
              test_text = test_text.replace(assertion_needle, assertion_replacement)
          test_path.write_text(test_text)

          workflow = Path('.github/workflows/lake-subject-integration-wave-16.yml')
          lines = workflow.read_text().splitlines()
          group_indexes = [index for index, line in enumerate(lines) if line.startswith('  group: lake-subject-integration-wave-16-')]
          assert len(group_indexes) == 1, {'group_indexes': group_indexes}
          dollar = chr(36)
          lines[group_indexes[0]] = f'  group: lake-subject-integration-wave-16-{dollar}{{{{ github.event_name }}}}-{dollar}{{{{ github.head_ref || github.ref_name }}}}'

          mode_line = '          if test -f .github/tmp/lake-subject-integration-wave-16-trigger.json \\'
          push_mode_line = '          if test "$GITHUB_EVENT_NAME" = \'push\' \\'
          if mode_line in lines:
              index = lines.index(mode_line)
              assert index + 1 < len(lines) and 'pull_request' in lines[index + 1], lines[index:index + 2]
              lines[index:index + 2] = [push_mode_line, '            && test -f .github/tmp/lake-subject-integration-wave-16-trigger.json; then']
          else:
              assert push_mode_line in lines, 'push-only Wave 16 execution mode missing'

          def insert_after_once(anchor, addition):
              if addition in lines:
                  return
              indexes = [index for index, line in enumerate(lines) if line == anchor]
              assert len(indexes) == 1, {'anchor': anchor, 'indexes': indexes}
              lines.insert(indexes[0] + 1, addition)

          insert_after_once(
              "      - 'data/project/lake-subject-integration-wave-16-policy.json'",
              "      - 'data/research/clifford-cross-corpus-public-interest-map.json'"
          )
          insert_after_once(
              '            data/canonical/organizations.json \\',
              '            data/research/clifford-cross-corpus-public-interest-map.json \\'
          )
          insert_after_once(
              "              'data/canonical/organizations.json',",
              "              'data/research/clifford-cross-corpus-public-interest-map.json',"
          )
          workflow.write_text('\n'.join(lines) + '\n')
          PY
          node --check tools/apply-lake-subject-integration-wave-16-sources.mjs
          node --check test/lake-subject-integration-wave-16.test.js
          grep -Fq 'group: lake-subject-integration-wave-16-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}' .github/workflows/lake-subject-integration-wave-16.yml
          grep -Fq 'if test "$GITHUB_EVENT_NAME" = '\''push'\'' \' .github/workflows/lake-subject-integration-wave-16.yml
          rm -f \
            .github/tmp/lake-subject-integration-wave-16-concurrency-repair-trigger.json \
            .github/workflows/lake-subject-integration-wave-16-concurrency-repair.yml \
            .github/tmp/lake-subject-integration-wave-16-cross-corpus-repair-trigger.json \
            .github/workflows/lake-subject-integration-wave-16-cross-corpus-repair.yml \
            .github/tmp/lake-subject-integration-wave-16-live-inventory-repair-v2-trigger.json \
            .github/workflows/lake-subject-integration-wave-16-live-inventory-repair-v2.yml
          git diff --check
      - name: Commit and publish the repaired integration inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile Wave 16 live canonical inventory'
          git fetch origin agent/lake-subject-integration-wave-16
          test "$(git rev-parse origin/agent/lake-subject-integration-wave-16)" = "${{ github.sha }}"
          git push origin HEAD:agent/lake-subject-integration-wave-16
