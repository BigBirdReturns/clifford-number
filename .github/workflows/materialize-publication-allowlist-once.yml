name: Materialize publication allowlist once

on:
  pull_request:
    branches: [main]
    paths:
      - '.publication-allowlist-materialize'
      - '.github/scripts/materialize-publication-allowlist.py'
      - '.github/scripts/retire-public-graph-bridge.py'
      - '.github/scripts/tighten-publication-test-predicates.py'
      - '.github/workflows/materialize-publication-allowlist-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/publication-allowlist-poof-admission-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-allowlist-poof-admission-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply publication reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path('.github/scripts/materialize-publication-allowlist.py')
          text = target.read_text()
          replacements = {
            '"    networkMode: \'research\', networkView: { x: 0, y: 0, width: 1400, height: 900 }, networkModel: null\\n"': '"  networkMode: \'research\', networkView: { x: 0, y: 0, width: 1400, height: 900 }, networkModel: null\\n"',
            '"    networkMode: \'hops\', networkView: { x: 0, y: 0, width: 1400, height: 900 }, networkModel: null\\n"': '"  networkMode: \'hops\', networkView: { x: 0, y: 0, width: 1400, height: 900 }, networkModel: null\\n"',
            'assert "graph.json" not in read_text("app.js")': 'assert "loadJson(\'graph.json\')" not in read_text("app.js")',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'materializer anchor count for {old[:70]!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          old_assertion = 'if any(marker in read_text("app.js") for marker in ["graph.json", "researchNetworkModel", "legacyGraph"]):\n    raise RuntimeError("app.js still contains retired generic-graph runtime")\n'
          new_assertion = 'exec(compile(read_text(".github/scripts/retire-public-graph-bridge.py"), ".github/scripts/retire-public-graph-bridge.py", "exec"))\nif any(marker in read_text("app.js") for marker in ["loadJson(\'graph.json\')", "researchNetworkModel", "legacyGraph", "legacyNodes"]):\n    raise RuntimeError("app.js still contains retired generic-graph runtime")\n'
          if text.count(old_assertion) != 1:
              raise SystemExit(f'retirement assertion anchor count: {text.count(old_assertion)}')
          text = text.replace(old_assertion, new_assertion, 1)
          old_editorial_loop = '}.items():\n    replace_once("index.html", old, new)\n'
          new_editorial_loop = '''}.items():
    index_source = read_text("index.html")
    occurrence_count = index_source.count(old)
    if occurrence_count < 1:
        raise RuntimeError(f"index.html: missing editorial anchor: {old[:180]!r}")
    write_text("index.html", index_source.replace(old, new))
'''
          if text.count(old_editorial_loop) != 1:
              raise SystemExit(f'editorial loop anchor count: {text.count(old_editorial_loop)}')
          target.write_text(text.replace(old_editorial_loop, new_editorial_loop, 1))
          PY
          python3 -m py_compile .github/scripts/materialize-publication-allowlist.py .github/scripts/retire-public-graph-bridge.py .github/scripts/tighten-publication-test-predicates.py
          python3 .github/scripts/materialize-publication-allowlist.py
          python3 .github/scripts/tighten-publication-test-predicates.py
      - name: Prove focused constitutional and publication gates
        run: |
          node tools/validate-poof-constitutional-change.mjs origin/main
          node test/poof-constitutional-change.test.js
          node test/publication-manifest.test.js
          npm run ci:poof-ecology
          npm run release:check
          git diff --check
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove browser publication boundary
        run: node test/publication-pages-browser.test.js
      - name: Remove transient source machinery
        run: |
          rm -f .publication-allowlist-materialize
          rm -f .github/scripts/materialize-publication-allowlist.py
          rm -f .github/scripts/retire-public-graph-bridge.py
          rm -f .github/scripts/tighten-publication-test-predicates.py
      - name: Commit permanent publication surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce status-aware publication allowlist'
          git push origin HEAD:agent/publication-allowlist-poof-admission-v2
