name: M-05 claim-evidence promotion adjudication

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.json'
      - 'tools/lib/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.test.js'
      - '.github/workflows/m05-claim-evidence-promotion-adjudication.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.json'
      - 'tools/lib/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.test.js'
      - '.github/workflows/m05-claim-evidence-promotion-adjudication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate bounded claim-evidence promotion adjudication
        run: |
          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs
          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs
          node test/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic focused state
        run: |
          git restore --staged --worktree .
          node tools/validate-m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.mjs
          node test/m05-answerable-power-sprint-03-leg-07-claim-evidence-promotion-adjudication.test.js
          git diff --exit-code
