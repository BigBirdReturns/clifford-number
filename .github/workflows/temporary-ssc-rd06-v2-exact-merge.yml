name: TEMP merge exact proved RD-06 promotion v2

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd06-v2-exact-merge.yml'
      - '.rd06-v2-exact-merge/**'

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temp-ssc-rd06-v2-exact-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-v2-exact-merge-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROOF_BRANCH: agent/ssc-rd06-promotion-v2-proof-trigger
      PROOF_WORKFLOW_NAME: TEMP prove exact RD-06 promotion v2
      PROOF_ARTIFACT_NAME: ssc-rd06-wave02-promotion-proof-v2
      PRODUCT_BRANCH: agent/ssc-rd06-wave02-terminal-promotion-v2
      CANONICAL_PR_TITLE: SSC RD-06 Wave 02: close complete offeror-universe class
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact v2 proof and merge only the tested product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rd06-v2-merge
          mkdir -p /tmp/rd06-v2-merge/proof /tmp/rd06-v2-merge/receipt
          block(){ printf '%s\n' "$1" > /tmp/rd06-v2-merge/receipt/BLOCKED.txt; exit 0; }

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${PROOF_BRANCH}&status=completed&per_page=100" > /tmp/rd06-v2-merge/runs.json
          python - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path('/tmp/rd06-v2-merge/runs.json').read_text())
          pages=data if isinstance(data,list) else [data]; rows=[]
          for page in pages: rows.extend(page.get('workflow_runs',[]))
          matches=[r for r in rows if r.get('name')==os.environ['PROOF_WORKFLOW_NAME'] and r.get('head_branch')==os.environ['PROOF_BRANCH']]
          matches.sort(key=lambda r:r.get('created_at',''),reverse=True)
          if not matches: pathlib.Path('/tmp/rd06-v2-merge/receipt/BLOCKED.txt').write_text('no_completed_v2_proof\n')
          else:
              run=matches[0]; pathlib.Path('/tmp/rd06-v2-merge/proof-run.json').write_text(json.dumps(run,indent=2)+'\n'); pathlib.Path('/tmp/rd06-v2-merge/proof-run-id.txt').write_text(str(run['id'])+'\n')
              if run.get('conclusion')!='success': pathlib.Path('/tmp/rd06-v2-merge/receipt/BLOCKED.txt').write_text(f"v2_proof_{run.get('conclusion')}\n")
          PY
          if [ -f /tmp/rd06-v2-merge/receipt/BLOCKED.txt ]; then exit 0; fi
          run_id="$(cat /tmp/rd06-v2-merge/proof-run-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" > /tmp/rd06-v2-merge/artifacts.json
          python - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path('/tmp/rd06-v2-merge/artifacts.json').read_text())
          arts=[a for a in data.get('artifacts',[]) if a.get('name')==os.environ['PROOF_ARTIFACT_NAME'] and not a.get('expired')]
          if len(arts)!=1: pathlib.Path('/tmp/rd06-v2-merge/receipt/BLOCKED.txt').write_text(f'v2_proof_artifact_count_{len(arts)}\n')
          else:
              art=arts[0]; pathlib.Path('/tmp/rd06-v2-merge/proof-artifact.json').write_text(json.dumps(art,indent=2)+'\n'); pathlib.Path('/tmp/rd06-v2-merge/proof-artifact-id.txt').write_text(str(art['id'])+'\n')
          PY
          if [ -f /tmp/rd06-v2-merge/receipt/BLOCKED.txt ]; then exit 0; fi
          artifact_id="$(cat /tmp/rd06-v2-merge/proof-artifact-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/rd06-v2-merge/proof.zip
          expected="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-v2-merge/proof-artifact.json'))['digest'].split(':',1)[1])
          PY
          )"
          test "$(sha256sum /tmp/rd06-v2-merge/proof.zip | awk '{print $1}')" = "$expected" || block proof_digest_mismatch
          unzip -q /tmp/rd06-v2-merge/proof.zip -d /tmp/rd06-v2-merge/proof
          proof_file="$(find /tmp/rd06-v2-merge/proof -type f -name proof.json -print -quit)"; manifest_file="$(find /tmp/rd06-v2-merge/proof -type f -name manifest.json -print -quit)"
          test -n "$proof_file" || block proof_json_missing; test -n "$manifest_file" || block proof_manifest_missing
          cp "$proof_file" /tmp/rd06-v2-merge/receipt/proof.json; cp "$manifest_file" /tmp/rd06-v2-merge/receipt/proof-manifest.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-v2-merge/proof'); proof=json.load(open('/tmp/rd06-v2-merge/receipt/proof.json')); manifest=json.load(open('/tmp/rd06-v2-merge/receipt/proof-manifest.json'))
          assert proof['schema_version']=='ssc-rd06-wave02-promotion-proof-v2@1'
          assert proof['wave_id']=='SSC-RD-W02' and proof['lane_id']=='RD-06' and proof['class_id']=='RD-06-C01' and proof['issue']==791
          assert proof['temporary_or_transport_paths']==0 and proof['atlas_after_promotion']=={'open':39,'closed':3}
          assert proof['focused_checks_passed'] and proof['complete_release_gate_passed'] and proof['timestamp_only_volatility_proved'] and proof['deterministic_replay_passed'] and proof['no_magic_human_gate_passed']
          assert proof['authority']['outside_human_dependency'] is False and proof['authority']['external_contacts']==0 and proof['authority']['external_reviews']==0
          assert proof['authority']['publication_effect']=='none' and proof['authority']['adoption_effect']=='none' and proof['authority']['graph_effect']=='none'
          for row in manifest['entries']:
              p=root/row['path']; b=p.read_bytes(); assert len(b)==row['bytes'] and hashlib.sha256(b).hexdigest()==row['sha256']
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in manifest['entries']).encode()).hexdigest(); assert combined==manifest['combined_sha256']
          PY
          product_head="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-v2-merge/receipt/proof.json'))['product_head'])
          PY
          )"
          proved_main="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-v2-merge/receipt/proof.json'))['main_head_at_proof'])
          PY
          )"
          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"; current_product="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${PRODUCT_BRANCH}" --jq '.object.sha')"
          test "$current_main" = "$proved_main" || block main_advanced_after_v2_proof
          test "$current_product" = "$product_head" || block v2_product_head_changed

          gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$PRODUCT_BRANCH" --json number,headRefOid,baseRefName,isDraft,title > /tmp/rd06-v2-merge/prs.json
          count="$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/rd06-v2-merge/prs.json'))))
          PY
          )"
          if [ "$count" = 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$PRODUCT_BRANCH" --draft --title "$CANONICAL_PR_TITLE" --body-file - <<'EOF'
          Issue: #791
          Parent Wave 02: #785

          Exact volatility-safe current-main reconciliation of the audited RD-06-C01 offeror-universe terminal receipt. The checksum-bound v2 proof preserves the independent RD-04 and RD-05 receipts, advances the atlas to 39 open / 3 closed, proves release-generated changes are timestamp-only with zero semantic drift, and retains no transport path.

          No equal-support, superiority, foreclosure, coordination, common-purpose, publication, adoption, graph, contact, external-review, or outside-human authority is created.
          EOF
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$PRODUCT_BRANCH" --json number,headRefOid,baseRefName,isDraft,title > /tmp/rd06-v2-merge/prs.json
          fi
          python - <<'PY'
          import json,pathlib
          rows=json.load(open('/tmp/rd06-v2-merge/prs.json')); assert len(rows)==1, f'one v2 canonical PR required, found {len(rows)}'; row=rows[0]; assert row['baseRefName']=='main'; pathlib.Path('/tmp/rd06-v2-merge/pr-number.txt').write_text(str(row['number'])+'\n')
          PY
          pr="$(cat /tmp/rd06-v2-merge/pr-number.txt)"; actual="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"; test "$actual" = "$product_head" || block v2_canonical_pr_head_mismatch
          for attempt in $(seq 1 20); do mergeable="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')"; [ "$mergeable" != UNKNOWN ] && break; sleep 3; done
          [ "$mergeable" = MERGEABLE ] || block v2_canonical_pr_not_mergeable
          draft="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"; if [ "$draft" = true ]; then gh pr ready "$pr" --repo "$GITHUB_REPOSITORY"; fi
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$proved_main" || block main_advanced_immediately_before_v2_merge
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$product_head"
          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json number,mergedAt,mergeCommit,headRefOid,baseRefName > /tmp/rd06-v2-merge/receipt/merged-pr.json
          python - <<'PY'
          import json,pathlib
          pr=json.load(open('/tmp/rd06-v2-merge/receipt/merged-pr.json')); assert pr['mergedAt'] and pr['mergeCommit']['oid']; pathlib.Path('/tmp/rd06-v2-merge/merge-commit.txt').write_text(pr['mergeCommit']['oid']+'\n')
          PY
          merge_commit="$(cat /tmp/rd06-v2-merge/merge-commit.txt)"; git fetch origin main "$PRODUCT_BRANCH"; git merge-base --is-ancestor "$merge_commit" origin/main
          test "$(git rev-parse "${merge_commit}^{tree}")" = "$(git rev-parse "${product_head}^{tree}")" || block v2_merged_tree_mismatch
          parents="$(git show -s --format='%P' "$merge_commit")"; case " $parents " in *" $product_head "*) ;; *) block v2_merge_missing_product_parent ;; esac
          gh issue comment 791 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          RD-06-C01 is canonical at merge commit \`${merge_commit}\` from volatility-safe proved product \`${product_head}\`.

          The v2 proof retained a transport-free denominator, proved release-generated outputs timestamp-only with zero semantic drift, passed deterministic replay and all focused and complete gates, and advanced the atlas to **39 open / 3 closed**. The closure creates no equal-support, superiority, foreclosure, coordination, common-purpose, publication, adoption, or graph finding.
          EOF
          gh issue close 791 --repo "$GITHUB_REPOSITORY" --reason completed
          python - <<'PY'
          import json,pathlib
          proof=json.load(open('/tmp/rd06-v2-merge/receipt/proof.json')); pr=json.load(open('/tmp/rd06-v2-merge/receipt/merged-pr.json'))
          result={'schema_version':'ssc-rd06-wave02-exact-merge-v2@1','wave_id':'SSC-RD-W02','lane_id':'RD-06','class_id':'RD-06-C01','issue':791,'proof_run':json.load(open('/tmp/rd06-v2-merge/proof-run.json'))['id'],'proof_artifact':json.load(open('/tmp/rd06-v2-merge/proof-artifact.json'))['id'],'proved_main':proof['main_head_at_proof'],'product_head':proof['product_head'],'canonical_pr':pr['number'],'merge_commit':pr['mergeCommit']['oid'],'merged_at':pr['mergedAt'],'atlas_after_merge':{'open':39,'closed':3},'authority':proof['authority']}
          pathlib.Path('/tmp/rd06-v2-merge/receipt/result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Seal v2 merge or blocker receipt
        if: always()
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-v2-merge/receipt'); root.mkdir(parents=True,exist_ok=True); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='manifest.json'):
            b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows).encode()).hexdigest(); (root/'manifest.json').write_text(json.dumps({'schema_version':'ssc-rd06-wave02-exact-merge-v2-manifest@1','entry_count':len(rows),'entries':rows,'combined_sha256':combined},indent=2)+'\n'); print(f'RD-06 v2 merge receipt sealed: {combined}')
          PY

      - name: Preserve v2 merge or blocker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-exact-merge-v2
          path: /tmp/rd06-v2-merge/receipt
          if-no-files-found: error
          retention-days: 90
