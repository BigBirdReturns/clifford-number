name: TEMP materialize RD-04 seven-state row-state binary PR v4b

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temp-ssc-rd04-mf7-row-state-binary-materializer-pr-v4b
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'agent/ssc-rd04-mf7-row-state-binary-materializer-v4b'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require inert execution trigger
        run: |
          set -Eeuo pipefail
          test -f '.trigger/ssc-rd04-mf7-row-state-binary-materializer-v4b/EXECUTE'
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = '.github/workflows/temp-ssc-rd04-mf7-row-state-binary-materializer-pr-v4b.yml .github/workflows/temp-ssc-rd04-mf7-row-state-binary-materializer-v4b.yml .trigger/ssc-rd04-mf7-row-state-binary-materializer-v4b/EXECUTE '
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GH_REPOSITORY" --body "Binary PR-v4b materialization started on \`${GITHUB_SHA}\`. It will reconstruct the exact fourteen-path 211→218 derivative from immutable binary Git objects and fail closed before any permanent ref movement on mismatch."
      - id: materialize
        name: Recover immutable materializer and execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          MATERIALIZER_BLOB: 9c5d8e4f8346c785d8d0f24d21456e9d73a636f9
          MATERIALIZER_XZ_BYTES: '5968'
          MATERIALIZER_XZ_SHA256: c02f896680914b338ee11349afe123430048ca8f237ba878538a7fc6bbbc87e6
          MATERIALIZER_SH_BYTES: '18256'
          MATERIALIZER_SH_SHA256: 60d7acbbd7b43d8505ffc45eb9e99c8281236c32716c2781f5846e1ed4472145
        run: |
          set -Eeuo pipefail
          OUT=/tmp/rd04-mf7-materializer-pr-v4b
          rm -rf "$OUT"
          mkdir -p "$OUT"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPOSITORY/git/blobs/$MATERIALIZER_BLOB" \
            > "$OUT/blob.json"
          test "$(jq -r .encoding "$OUT/blob.json")" = base64
          jq -r .content "$OUT/blob.json" | tr -d '\n' | base64 -d > "$OUT/materializer.sh.xz"
          test "$(wc -c < "$OUT/materializer.sh.xz" | tr -d ' ')" = "$MATERIALIZER_XZ_BYTES"
          test "$(sha256sum "$OUT/materializer.sh.xz" | awk '{print $1}')" = "$MATERIALIZER_XZ_SHA256"
          test "$(git hash-object "$OUT/materializer.sh.xz")" = "$MATERIALIZER_BLOB"
          xz -dc "$OUT/materializer.sh.xz" > "$OUT/materializer.sh"
          test "$(wc -c < "$OUT/materializer.sh" | tr -d ' ')" = "$MATERIALIZER_SH_BYTES"
          test "$(sha256sum "$OUT/materializer.sh" | awk '{print $1}')" = "$MATERIALIZER_SH_SHA256"
          chmod 0755 "$OUT/materializer.sh"
          bash "$OUT/materializer.sh"
      - name: Report exact terminal outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          OUTCOME: ${{ steps.materialize.outcome }}
        run: |
          set -Eeuo pipefail
          BODY=/tmp/rd04-mf7-pr-v4b-comment.md
          if test "$OUTCOME" = success && test -f /tmp/rd04-mf7-row-state-materialization-v3/materialization-receipt.json; then
            python - <<'PY' > "$BODY"
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/rd04-mf7-row-state-materialization-v3/materialization-receipt.json').read_text())
          print('Binary PR-v4b materialization completed successfully.\n')
          print('```text')
          for key in ['canonical_parent','full_head','full_tree','ordinary_head','ordinary_tree','permanent_pr','archive_sha256','permanent_paths','ordinary_paths','target_rows','terminal_cells_before','terminal_cells_after','terminal_units_before','terminal_units_after','adversarial_refusals','class_closed','outside_human_dependency']:
              print(f'{key}: {r.get(key)}')
          print('```')
          print('\nThe permanent branch moved only after exact object, path, validation, release, replay, and lease gates passed.')
          PY
          else
            {
              echo 'Binary PR-v4b materialization failed closed.'
              echo
              echo '```text'
              echo "workflow_head: ${GITHUB_SHA}"
              echo "materializer_outcome: ${OUTCOME}"
              if test -f /tmp/rd04-mf7-row-state-materialization-v3/run.log; then tail -100 /tmp/rd04-mf7-row-state-materialization-v3/run.log; fi
              echo '```'
              echo
              echo 'No success is represented and no unverified product is authorized.'
            } > "$BODY"
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GH_REPOSITORY" --body-file "$BODY"
      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mf7-row-state-binary-materialization-pr-v4b
          path: |
            /tmp/rd04-mf7-materializer-pr-v4b
            /tmp/rd04-mf7-row-state-materialization-v3
          if-no-files-found: warn
          retention-days: 90
      - name: Refuse failed materialization
        if: always()
        env:
          OUTCOME: ${{ steps.materialize.outcome }}
        run: test "$OUTCOME" = success
