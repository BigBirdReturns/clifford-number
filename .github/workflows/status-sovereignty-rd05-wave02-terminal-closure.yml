name: Status sovereignty RD-05 Wave 02 terminal closure

on:
  pull_request:
    paths:
      - 'data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/**'
      - 'data/project/ssc-residual-wave02/closures/RD-05-C03.json'
      - 'data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/**'
      - 'docs/milestones/ssc-rd-wave02-rd05-recommendation-disposition.md'
      - 'schemas/status-sovereignty-rd-wave02-rd05-recommendation-disposition.schema.json'
      - 'test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js'
      - 'tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs'
      - '.github/workflows/status-sovereignty-rd05-wave02-terminal-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and validate exact terminal closure
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js
          jq -e '
            .terminal_state == "bounded_non_link" and
            .class_closed == true and
            .counts.frozen_objects == 58 and
            .counts.terminal_objects == 58 and
            .counts.bounded_non_link_chains == 4 and
            .counts.open_chains == 0 and
            .counts.fixed_routes == 49 and
            .counts.http_success_routes == 45 and
            .counts.terminal_non_success_routes == 4 and
            .counts.completed_recommendations == 0 and
            .counts.agency_responses == 0 and
            .counts.adopted_or_rejected_outputs == 0 and
            .counts.implementation_or_outcomes == 0 and
            .authority.outside_human_dependency == false and
            .authority.external_contacts == 0 and
            .authority.external_reviews == 0 and
            .authority.publication_effect == "none" and
            .authority.adoption_effect == "none" and
            .authority.graph_effect == "none"
          ' data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/summary.json >/dev/null
          jq -e '
            .class_id == "RD-05-C03" and
            .terminal_state == "bounded_non_link" and
            .class_closed == true and
            .source_custody.manifest_combined_sha256 == "0fb07dd92ff7e8c27a7e4b3e6b3db18842538516b1badd05afe194fd07446c32" and
            .product.manifest_combined_sha256 == "d9fcb123ad57bf86b355920702aa961e32c95a6a3b3237eb8ece91e863baca11" and
            .authority.outside_human_dependency == false and
            .authority.graph_effect == "none"
          ' data/project/ssc-residual-wave02/closures/RD-05-C03.json >/dev/null
          git diff --exit-code -- \
            data/project/ssc-residual-wave02/closures/RD-05-C03.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/candidate-exclusion-ledger.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/chain-terminal-ledger.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/class-receipt.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/manifest.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/summary.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/terminal-classification.json

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct deterministically from committed custody
        run: |
          set -Eeuo pipefail
          git restore --staged --worktree .
          node tools/build-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd05-recommendation-disposition.mjs
          node test/status-sovereignty-rd-wave02-rd05-recommendation-disposition.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code -- \
            data/project/ssc-residual-wave02/closures/RD-05-C03.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/candidate-exclusion-ledger.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/chain-terminal-ledger.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/class-receipt.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/manifest.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/summary.json \
            data/research/status-sovereignty-rd-wave02-rd05-recommendation-disposition/terminal-classification.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
