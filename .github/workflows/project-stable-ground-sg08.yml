name: Project stable-ground supersession 08

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg07*.json'
      - 'data/project/project-stable-ground-sg08*.json'
      - 'data/research/status-sovereignty-wave-01-targeted-acquisition*'
      - 'data/project/status-sovereignty*'
      - 'docs/milestones/project-stable-ground-sg08.md'
      - 'reports/core-thesis/stable-ground/sg08/**'
      - 'tools/*project-stable-ground-sg08*'
      - 'test/project-stable-ground-sg08.test.js'
      - '.github/workflows/project-stable-ground-sg07.yml'
      - '.github/workflows/project-stable-ground-sg08.yml'
      - '.github/workflows/status-sovereignty-wave-01-targeted-acquisition.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg07*.json'
      - 'data/project/project-stable-ground-sg08*.json'
      - 'data/research/status-sovereignty-wave-01-targeted-acquisition*'
      - 'data/project/status-sovereignty*'
      - 'docs/milestones/project-stable-ground-sg08.md'
      - 'reports/core-thesis/stable-ground/sg08/**'
      - 'tools/*project-stable-ground-sg08*'
      - 'test/project-stable-ground-sg08.test.js'
      - '.github/workflows/project-stable-ground-sg07.yml'
      - '.github/workflows/project-stable-ground-sg08.yml'
      - '.github/workflows/status-sovereignty-wave-01-targeted-acquisition.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate targeted acquisition and SG-08
        run: |
          npm run build:status-sovereignty
          npm run validate:status-sovereignty
          node test/status-sovereignty-wave-01.test.js
          node test/status-sovereignty-wave-01-review.test.js
          node test/status-sovereignty-wave-01-targeted-acquisition.test.js
          node test/status-sovereignty-compact.test.js
          node tools/build-poof-clifford-ecology.mjs
          node tools/build-project-stable-ground-sg08.mjs
          node tools/validate-project-stable-ground-sg07.mjs
          node test/project-stable-ground-sg07.test.js
          node tools/validate-project-stable-ground-sg08.mjs
          node test/project-stable-ground-sg08.test.js
      - name: Validate preserved SG-01 through SG-06 history
        run: |
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
          node tools/validate-project-stable-ground-sg02.mjs
          node test/project-stable-ground-sg02.test.js
          node tools/validate-project-stable-ground-sg03.mjs
          node test/project-stable-ground-sg03.test.js
          node tools/validate-project-stable-ground-sg04.mjs
          node test/project-stable-ground-sg04.test.js
          node tools/validate-project-stable-ground-sg05.mjs
          node test/project-stable-ground-sg05.test.js
          node tools/validate-project-stable-ground-sg06.mjs
          node test/project-stable-ground-sg06.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic current products and frozen history
        run: |
          git restore --staged --worktree .
          npm run build:status-sovereignty
          node tools/build-core-thesis.mjs
          node tools/build-dca-h01.mjs
          node tools/build-m05-answerable-power.mjs
          node tools/build-security-state-organism.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/build-poof-clifford-ecology.mjs
          node tools/build-project-stable-ground-sg08.mjs
          npm run validate:stable-ground
          git diff --exit-code -- \
            data/project/status-sovereignty-wave-01-targeted-acquisition-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-01-targeted-acquisition/manifest.json \
            build/core-thesis/status-sovereignty/wave-01-targeted-acquisition/data.json \
            reports/core-thesis/status-sovereignty/wave-01-targeted-acquisition/data.json \
            reports/core-thesis/status-sovereignty/wave-01-targeted-acquisition/index.html \
            data/project/status-sovereignty-release-manifest.json \
            data/project/poof-clifford-ecology-release-manifest.json \
            reports/core-thesis/poof-clifford-ecology/release-manifest.json \
            data/project/project-stable-ground-sg08-release-manifest.json \
            reports/core-thesis/stable-ground/sg08/checkpoint.json \
            reports/core-thesis/stable-ground/sg08/index.html
          git diff --exit-code -- \
            data/project/project-stable-ground-sg07.json \
            data/project/project-stable-ground-sg07-release-manifest.json \
            reports/core-thesis/stable-ground/sg07/checkpoint.json \
            reports/core-thesis/stable-ground/sg07/index.html
