name: Preference custody laboratory floor v23

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-criterion-score-use.mjs'
      - 'tools/validate-preference-criterion-score-use.mjs'
      - 'tools/compile-preference-custody-manifest-v23.mjs'
      - 'tools/validate-preference-custody-manifest-v23.mjs'
      - 'test/preference-criterion-score-use.test.js'
      - 'test/preference-custody-manifest-v23.test.js'
      - 'docs/preference-custody-criterion-score-use.md'
      - 'docs/preference-custody-laboratory-floor-v23.md'
      - '.github/workflows/preference-criterion-score-use.yml'
      - '.github/workflows/preference-custody-v23.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-25 and the compositional v23 floor
        run: |
          node tools/compile-preference-criterion-score-use.mjs
          node tools/compile-preference-custody-manifest-v23.mjs
      - name: Validate criterion-score-use and floor boundaries
        run: |
          node tools/validate-preference-criterion-score-use.mjs
          node tools/validate-preference-custody-manifest-v23.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-criterion-score-use.test.js
          node test/preference-custody-manifest-v23.test.js
      - name: Preserve deterministic v23 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v23
          path: |
            build/research/preference-criterion-score-use.json
            build/research/preference-criterion-score-use.md
            build/research/preference-custody-laboratory-floor-v23.json
            build/research/preference-custody-laboratory-floor-v23.md
          if-no-files-found: error
