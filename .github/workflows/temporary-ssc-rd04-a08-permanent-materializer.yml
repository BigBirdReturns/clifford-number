name: TEMP materialize SSC RD-04 A08 permanent receipt

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/temporary-ssc-rd04-a08-permanent-materializer.yml'
      - '.github/tmp/ssc-rd04-a08-permanent-payload.tar.gz.b64'
  push:
    branches:
      - agent/ssc-rd04-a08-internal-adjudication-permanent
    paths:
      - '.github/workflows/temporary-ssc-rd04-a08-permanent-materializer.yml'
      - '.github/tmp/ssc-rd04-a08-permanent-payload.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssc-rd04-a08-permanent-materializer-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: agent/ssc-rd04-a08-internal-adjudication-permanent
      CARRIER: .github/tmp/ssc-rd04-a08-permanent-payload.tar.gz.b64
      PERMANENT_WORKFLOW: .github/workflows/status-sovereignty-rd04-a08-internal-adjudication.yml
      PAYLOAD_SHA256: 854509fc8879377fcdfd70748c53909140c7f7ad722e84239d198a341c287db3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a08-internal-adjudication-permanent
          fetch-depth: 0
      - id: preflight
        name: Detect whether non-workflow materialization remains pending
        run: |
          if [[ -f "$CARRIER" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Non-workflow A08 product already materialized; no-op.'
          fi
      - if: steps.preflight.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: steps.preflight.outputs.run == 'true'
        name: Verify and extract exact product payload
        run: |
          set -Eeuo pipefail
          base64 --decode "$CARRIER" > /tmp/a08-product.tar.gz
          test "$(sha256sum /tmp/a08-product.tar.gz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          tar -xzf /tmp/a08-product.tar.gz
          cat > /tmp/a08-product-paths <<'PATHS'
          .github/workflows/status-sovereignty-rd04-a08-internal-adjudication.yml
          data/intake/status-sovereignty-rd04-a08-internal-adjudication/adjudications.json
          data/intake/status-sovereignty-rd04-a08-internal-adjudication/core.json
          data/intake/status-sovereignty-rd04-a08-internal-adjudication/execution-receipt.json
          data/intake/status-sovereignty-rd04-a08-internal-adjudication/failure-ledger.json
          data/intake/status-sovereignty-rd04-a08-internal-adjudication/internally-supported-receipts.json
          data/intake/status-sovereignty-rd04-a08-internal-adjudication/negative-controls.json
          data/intake/status-sovereignty-rd04-a08-internal-adjudication/rejected-or-unresolved-candidates.json
          data/project/status-sovereignty-rd04-a08-internal-adjudication-release-manifest.json
          docs/milestones/ssc-rd04-a08-internal-adjudication.md
          reports/core-thesis/status-sovereignty/rd04-a08-internal-adjudication/index.html
          schemas/status-sovereignty-rd04-a08-internal-adjudication.schema.json
          test/status-sovereignty-rd04-a08-internal-adjudication.test.js
          tools/build-status-sovereignty-rd04-a08-internal-adjudication.mjs
          tools/validate-status-sovereignty-rd04-a08-internal-adjudication.mjs
          PATHS
          sed -i 's/^          //' /tmp/a08-product-paths
          tail -n +2 /tmp/a08-product-paths > /tmp/a08-nonworkflow-paths
          while IFS= read -r file; do test -f "$file"; done < /tmp/a08-product-paths
      - if: steps.preflight.outputs.run == 'true'
        name: Prove complete deterministic product bytes
        run: |
          set -Eeuo pipefail
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/a08-product-paths > /tmp/a08-before.sha256
          node tools/build-status-sovereignty-rd04-a08-internal-adjudication.mjs
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/a08-product-paths > /tmp/a08-after.sha256
          diff -u /tmp/a08-before.sha256 /tmp/a08-after.sha256
          node tools/validate-no-magic-human-gate.mjs
          node tools/validate-status-sovereignty-rd04-a08-internal-adjudication.mjs
          node test/status-sovereignty-rd04-a08-internal-adjudication.test.js
      - if: steps.preflight.outputs.run == 'true'
        name: Push exact non-workflow product
        run: |
          set -Eeuo pipefail
          rm "$CARRIER" "$PERMANENT_WORKFLOW"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          while IFS= read -r file; do git add "$file"; done < /tmp/a08-nonworkflow-paths
          git add "$CARRIER"
          git commit -m 'Stage SSC RD-04 A08 permanent product'
          test -z "$(git diff --cached --name-only)"
          test ! -e "$PERMANENT_WORKFLOW"
          git push origin HEAD:"$BRANCH"
