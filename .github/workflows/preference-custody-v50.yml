name: Preference custody laboratory floor v50

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/**'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.mjs'
      - 'tools/validate-preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v50.mjs'
      - 'tools/validate-preference-custody-manifest-v50.mjs'
      - 'test/preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.test.js'
      - 'test/preference-custody-manifest-v50.test.js'
      - 'docs/preference-custody-review-scope-source-tree-generated-input-build-recipe-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v50.md'
      - '.github/workflows/preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.yml'
      - '.github/workflows/preference-custody-v50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  floor-v50:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile and validate PC-52 and floor v50
        run: |
          node tools/compile-preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.mjs
          node tools/validate-preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.mjs
          node test/preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.test.js
          node tools/compile-preference-custody-manifest-v50.mjs
          node tools/validate-preference-custody-manifest-v50.mjs
          node test/preference-custody-manifest-v50.test.js
      - name: Reconstruct every Preference Custody floor
        run: |
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
      - name: Enforce no-magic-human and repository release gates
        run: |
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v50
          path: |
            build/research/preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.json
            build/research/preference-linkage-review-scope-source-tree-generated-input-build-recipe-assurance.md
            build/research/preference-custody-laboratory-floor-v50.json
            build/research/preference-custody-laboratory-floor-v50.md
          if-no-files-found: error
