name: Preference custody network-formation control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/network-formation.fixture.json'
      - 'tools/lib/preference-network-formation.mjs'
      - 'tools/compile-preference-network-formation.mjs'
      - 'tools/validate-preference-network-formation.mjs'
      - 'test/preference-network-formation.test.js'
      - 'docs/preference-custody-network-formation.md'
      - '.github/workflows/preference-network-formation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-formation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile network dependence and collective-formation worlds
        run: node tools/compile-preference-network-formation.mjs
      - name: Validate graph, source, timing, private-public, visibility, and inference boundaries
        run: node tools/validate-preference-network-formation.mjs
      - name: Exercise conversion, cascade, broadcast, conformity, coordination, ranking, and tamper fixtures
        run: node test/preference-network-formation.test.js
      - name: Preserve deterministic network-formation projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-network-formation-pc11
          path: |
            build/research/preference-network-formation.json
            build/research/preference-network-formation.md
          if-no-files-found: error
