name: TEMP retire PC-28 transport and rebind current main

on:
  push:
    branches:
      - research/preference-topology-assurance-v1
    paths:
      - '.pc28-retire.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc28-retire-transport-and-rebind
  cancel-in-progress: false

jobs:
  retire-rebind-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-topology-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retire transport, rebind disjoint main, and qualify PC-28
        env:
          TARGET_BRANCH: research/preference-topology-assurance-v1
          FROZEN_BASE: 6f6dbeeacf9ac29c9c8ddb78e51d036b82026ee7
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$TARGET_BRANCH"
          git switch -C "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          start_main="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$FROZEN_BASE" "$start_main"

          cat > /tmp/pc28-permanent-paths <<'PATHS'
          .github/workflows/preference-custody-v26.yml
          .github/workflows/preference-topology-assurance.yml
          data/research/preference-custody/control-manifest-v26.json
          data/research/preference-custody/topology-assurance.fixture.json
          docs/preference-custody-laboratory-floor-v26.md
          docs/preference-custody-topology-assurance.md
          test/preference-custody-manifest-v26.test.js
          test/preference-topology-assurance.test.js
          tools/compile-preference-custody-manifest-v26.mjs
          tools/compile-preference-topology-assurance.mjs
          tools/lib/preference-custody-manifest-v26.mjs
          tools/lib/preference-topology-assurance.mjs
          tools/validate-preference-custody-manifest-v26.mjs
          tools/validate-preference-topology-assurance.mjs
          PATHS
          sed -i 's/^          //' /tmp/pc28-permanent-paths
          sort -o /tmp/pc28-permanent-paths /tmp/pc28-permanent-paths
          git diff --name-only "$FROZEN_BASE" "$start_main" | sort > /tmp/current-main-drift
          test -z "$(comm -12 /tmp/pc28-permanent-paths /tmp/current-main-drift)"

          rm -rf .pc28
          rm -f .pc28-retire.trigger
          git add -A -- .pc28 .pc28-retire.trigger
          git commit -m 'Retire temporary PC-28 checksum transport'

          git merge --no-ff "$start_main" -m 'Rebind PC-28 permanent surface to current main'
          rebound_head="$(git rev-parse HEAD)"

          node tools/compile-preference-topology-assurance.mjs
          node tools/validate-preference-topology-assurance.mjs
          node test/preference-topology-assurance.test.js
          node tools/compile-preference-custody-manifest-v26.mjs
          node tools/validate-preference-custody-manifest-v26.mjs
          node test/preference-custody-manifest-v26.test.js
          node tools/validate-no-magic-human-gate.mjs
          npm run release:check

          git restore --staged --worktree .
          git clean -fdx
          node tools/compile-preference-topology-assurance.mjs
          node tools/validate-preference-topology-assurance.mjs
          node test/preference-topology-assurance.test.js
          node tools/compile-preference-custody-manifest-v26.mjs
          node tools/validate-preference-custody-manifest-v26.mjs
          node test/preference-custody-manifest-v26.test.js
          git restore --staged --worktree .
          git clean -fdx
          test -z "$(git status --porcelain=v1)"

          git fetch --no-tags origin main
          end_main="$(git rev-parse origin/main)"
          test "$end_main" = "$start_main"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          START_MAIN="$start_main" REBOUND_HEAD="$rebound_head" node --input-type=module <<'NODE' > pc28-rebind-receipt.json
          const receipt = {
            schema_version: 'pc28-rebind-receipt@1',
            start_main: process.env.START_MAIN,
            rebound_head: process.env.REBOUND_HEAD,
            permanent_paths_expected: 14,
            temporary_payload_paths_retired: 5,
            outside_human_dependency: false,
            graph_effect: 'none'
          };
          process.stdout.write(`${JSON.stringify(receipt, null, 2)}\n`);
          NODE
      - name: Upload PC-28 rebind receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc28-rebind-receipt
          path: pc28-rebind-receipt.json
          if-no-files-found: error
          retention-days: 90
