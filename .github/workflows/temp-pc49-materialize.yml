name: TEMP export exact live-main source for PC-49 recovery

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/pc49-source-carrier'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact live main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true
      - name: Export exact tracked source tree
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          tracked="$(git ls-files | wc -l | tr -d ' ')"
          printf 'main_commit=%s\nmain_tree=%s\ntracked_paths=%s\n' "$commit" "$tree" "$tracked" | tee /tmp/pc49-current-main-receipt.txt
          git ls-files -z | tar --null -T - -czf /tmp/clifford-current-main.tar.gz
          sha256sum /tmp/clifford-current-main.tar.gz | tee /tmp/clifford-current-main.tar.gz.sha256
          wc -c /tmp/clifford-current-main.tar.gz | tee /tmp/clifford-current-main.tar.gz.bytes
      - name: Upload exact live-main source
        uses: actions/upload-artifact@v4
        with:
          name: pc49-current-main-source
          path: |
            /tmp/clifford-current-main.tar.gz
            /tmp/clifford-current-main.tar.gz.sha256
            /tmp/clifford-current-main.tar.gz.bytes
            /tmp/pc49-current-main-receipt.txt
          if-no-files-found: error
          include-hidden-files: true
