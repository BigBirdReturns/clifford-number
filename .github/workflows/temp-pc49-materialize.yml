name: TEMP diagnose PC-49 v3 newline boundaries

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/pc49-source-carrier'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checksum-bound carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record raw and reconstructed carrier identities
        run: |
          set -euo pipefail
          receipt=/tmp/pc49-v3-boundary-ledger.txt
          : > "$receipt"
          for path in \
            .pc49-carrier-v3/product.part00 \
            .pc49-carrier-v3/product.part01 \
            .pc49-carrier-v3/product.part02 \
            .pc49-carrier-v3/product.part03 \
            .pc49-carrier-v3/run.part00; do
            raw="$(sha256sum "$path" | awk '{print $1}')"
            plus="$( { cat "$path"; printf '\n'; } | sha256sum | awk '{print $1}')"
            printf 'path=%s raw=%s plus_newline=%s bytes=%s\n' "$path" "$raw" "$plus" "$(wc -c < "$path")" >> "$receipt"
          done

          matches=0
          for mask in $(seq 0 15); do
            candidate="/tmp/pc49-product-mask-${mask}.b64"
            : > "$candidate"
            for index in 0 1 2 3; do
              cat ".pc49-carrier-v3/product.part0${index}" >> "$candidate"
              if (( mask & (1 << index) )); then
                printf '\n' >> "$candidate"
              fi
            done
            digest="$(sha256sum "$candidate" | awk '{print $1}')"
            printf 'mask=%s digest=%s bytes=%s\n' "$mask" "$digest" "$(wc -c < "$candidate")" >> "$receipt"
            if [ "$digest" = "f1e3578abdbf404728e886f308c24281c4655e9ea59d04845d8823e51a08f579" ]; then
              matches=$((matches + 1))
              cp "$candidate" /tmp/pc49-product-matched.b64
              printf 'matched_mask=%s\n' "$mask" >> "$receipt"
            fi
          done
          printf 'match_count=%s\n' "$matches" >> "$receipt"

          for variant in raw plus_newline; do
            candidate="/tmp/pc49-run-${variant}.b64"
            cat .pc49-carrier-v3/run.part00 > "$candidate"
            if [ "$variant" = plus_newline ]; then printf '\n' >> "$candidate"; fi
            printf 'run_variant=%s base64_sha=%s bytes=%s\n' "$variant" "$(sha256sum "$candidate" | awk '{print $1}')" "$(wc -c < "$candidate")" >> "$receipt"
            set +e
            base64 -d "$candidate" > "/tmp/pc49-run-${variant}.sh" 2> "/tmp/pc49-run-${variant}.err"
            status=$?
            set -e
            printf 'run_variant=%s decode_status=%s decoded_sha=%s decoded_bytes=%s\n' "$variant" "$status" "$(sha256sum "/tmp/pc49-run-${variant}.sh" | awk '{print $1}')" "$(wc -c < "/tmp/pc49-run-${variant}.sh")" >> "$receipt"
          done
          cat "$receipt"
      - name: Upload complete boundary ledger
        uses: actions/upload-artifact@v4
        with:
          name: pc49-v3-boundary-ledger
          path: |
            /tmp/pc49-v3-boundary-ledger.txt
            /tmp/pc49-run-raw.err
            /tmp/pc49-run-plus_newline.err
          if-no-files-found: error
