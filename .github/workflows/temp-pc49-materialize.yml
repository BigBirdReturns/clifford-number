name: TEMP materialize qualified PC-49 product v3

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/pc49-source-carrier'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout checksum-bound carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact qualified carrier inputs
        run: |
          set -euo pipefail
          test "$(sha256sum .pc49-carrier-v3/product.part00 | awk '{print $1}')" = "2476656f9be5fe43415fa044834bc0dd662b3dcef5db59f67d24bad2e34a16e4"
          test "$(sha256sum .pc49-carrier-v3/product.part01 | awk '{print $1}')" = "17419fe8399295d831fd79748325932a98cb16a885d63c885ac9b9feb1e386f7"
          test "$(sha256sum .pc49-carrier-v3/product.part02 | awk '{print $1}')" = "ab467387b57a09346052fbe573f3f1549100091236c37f476308cde5af269131"
          test "$(sha256sum .pc49-carrier-v3/product.part03 | awk '{print $1}')" = "ed59e6b7670e718e675aae9157a701cffc58f8f6541dc2cfeebeefcf8c02d323"
          test "$(sha256sum .pc49-carrier-v3/run.part00 | awk '{print $1}')" = "692397591d98aeab0a12e40bb8780e70ec610c229fd690fd212dea449d16306a"

          cat \
            .pc49-carrier-v3/product.part00 \
            .pc49-carrier-v3/product.part01 \
            .pc49-carrier-v3/product.part02 \
            .pc49-carrier-v3/product.part03 \
            > /tmp/pc49-product.tar.gz.b64
          printf '\n' >> /tmp/pc49-product.tar.gz.b64
          test "$(sha256sum /tmp/pc49-product.tar.gz.b64 | awk '{print $1}')" = "f1e3578abdbf404728e886f308c24281c4655e9ea59d04845d8823e51a08f579"

          cat .pc49-carrier-v3/run.part00 > /tmp/pc49-run.sh.b64
          printf '\n' >> /tmp/pc49-run.sh.b64
          test "$(sha256sum /tmp/pc49-run.sh.b64 | awk '{print $1}')" = "a7b6426ea0cd3bca13d63b7184a0b144e429c297295aa86acfb710437f5edb74"
          base64 -d /tmp/pc49-run.sh.b64 > /tmp/pc49-run.sh
          test "$(sha256sum /tmp/pc49-run.sh | awk '{print $1}')" = "5cb101569f6630052cf154e1cf2704dbc0b4f094f677dfb8071096f2cd25e879"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/pc49-run.sh')
          text = path.read_text()
          old = 'PARENT=7f960c30b6c58c70e3a996d4239e363e50d848ef'
          new = 'PARENT=320287946785fba28b3f84850e90b16e849f7dbc'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected parent anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(sha256sum /tmp/pc49-run.sh | awk '{print $1}')" = "95fa0f259363c31c25ee35564e12ca93de85163402b3afdbced70b4b6fa7bd3a"
          chmod +x /tmp/pc49-run.sh
          sha256sum /tmp/pc49-product.tar.gz.b64 /tmp/pc49-run.sh.b64 /tmp/pc49-run.sh
      - name: Checkout exact current-main parent
        uses: actions/checkout@v4
        with:
          ref: 320287946785fba28b3f84850e90b16e849f7dbc
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, qualify, and publish exact PC-49 product
        run: bash /tmp/pc49-run.sh
      - name: Upload PC-49 materialization custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc49-materialization-custody-v3-current-main
          path: |
            /tmp/pc49-product-receipt.txt
            /tmp/pc49-materialization-diagnostic.txt
            /tmp/pc49-standalone.log
            /tmp/pc49-floor.log
            /tmp/pc49-release.log
            /tmp/pc49-push.log
          if-no-files-found: warn
