name: TEMP export PC-49 predecessor reference bundle

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/pc49-source-carrier'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact live main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collect bounded predecessor surfaces
        run: |
          set -euo pipefail
          mkdir -p /tmp/pc49-reference
          printf 'main_commit=%s\nmain_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > /tmp/pc49-reference/main-custody.txt
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          roots = [
              Path('.github/workflows'),
              Path('data/research/preference-custody'),
              Path('docs'),
              Path('test'),
              Path('tools'),
          ]
          needles = (
              'preference-custody-v45',
              'preference-custody-v46',
              'preference-custody-manifest-v45',
              'preference-custody-manifest-v46',
              'preference-linkage-event-estimand-scope-interpretation-assurance',
              'preference-linkage-interval-method-partition-replication-deployment-assurance',
          )
          destination = Path('/tmp/pc49-reference/repository')
          selected = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  rendered = path.as_posix()
                  if any(needle in rendered for needle in needles):
                      target = destination / path
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, target)
                      selected.append(rendered)
          Path('/tmp/pc49-reference/selected-paths.txt').write_text('\n'.join(sorted(selected)) + '\n')
          if not selected:
              raise SystemExit('reference selection is empty')
          print('\n'.join(sorted(selected)))
          PY
          find /tmp/pc49-reference/repository -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pc49-reference/reference-sha256.txt
      - name: Upload predecessor reference bundle
        uses: actions/upload-artifact@v4
        with:
          name: pc49-predecessor-reference
          path: /tmp/pc49-reference
          if-no-files-found: error
          include-hidden-files: true
