name: TEMP diagnose qualified PC-49 carrier v3

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/pc49-source-carrier'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checksum-bound carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record every carrier identity before enforcement
        run: |
          set -uo pipefail
          {
            echo 'raw_shards:'
            sha256sum \
              .pc49-carrier-v3/product.part00 \
              .pc49-carrier-v3/product.part01 \
              .pc49-carrier-v3/product.part02 \
              .pc49-carrier-v3/product.part03 \
              .pc49-carrier-v3/run.part00

            cat \
              .pc49-carrier-v3/product.part00 \
              .pc49-carrier-v3/product.part01 \
              .pc49-carrier-v3/product.part02 \
              .pc49-carrier-v3/product.part03 \
              > /tmp/pc49-product-no-terminal-newline.b64
            cp /tmp/pc49-product-no-terminal-newline.b64 /tmp/pc49-product-with-terminal-newline.b64
            printf '\n' >> /tmp/pc49-product-with-terminal-newline.b64
            echo 'product_reconstructions:'
            sha256sum /tmp/pc49-product-no-terminal-newline.b64 /tmp/pc49-product-with-terminal-newline.b64
            base64 -d /tmp/pc49-product-no-terminal-newline.b64 > /tmp/pc49-product-no-terminal-newline.tar.gz 2>/tmp/product-decode-a.err
            printf 'product_decode_without_terminal_newline=%s\n' "$?"
            base64 -d /tmp/pc49-product-with-terminal-newline.b64 > /tmp/pc49-product-with-terminal-newline.tar.gz 2>/tmp/product-decode-b.err
            printf 'product_decode_with_terminal_newline=%s\n' "$?"
            sha256sum /tmp/pc49-product-no-terminal-newline.tar.gz /tmp/pc49-product-with-terminal-newline.tar.gz 2>/dev/null || true

            cat .pc49-carrier-v3/run.part00 > /tmp/pc49-run-no-terminal-newline.b64
            cp /tmp/pc49-run-no-terminal-newline.b64 /tmp/pc49-run-with-terminal-newline.b64
            printf '\n' >> /tmp/pc49-run-with-terminal-newline.b64
            echo 'run_reconstructions:'
            sha256sum /tmp/pc49-run-no-terminal-newline.b64 /tmp/pc49-run-with-terminal-newline.b64
            base64 -d /tmp/pc49-run-no-terminal-newline.b64 > /tmp/pc49-run-no-terminal-newline.sh 2>/tmp/run-decode-a.err
            printf 'run_decode_without_terminal_newline=%s\n' "$?"
            base64 -d /tmp/pc49-run-with-terminal-newline.b64 > /tmp/pc49-run-with-terminal-newline.sh 2>/tmp/run-decode-b.err
            printf 'run_decode_with_terminal_newline=%s\n' "$?"
            sha256sum /tmp/pc49-run-no-terminal-newline.sh /tmp/pc49-run-with-terminal-newline.sh 2>/dev/null || true
            printf 'old_parent_count_without_terminal_newline=%s\n' "$(grep -c 'PARENT=7f960c30b6c58c70e3a996d4239e363e50d848ef' /tmp/pc49-run-no-terminal-newline.sh 2>/dev/null || true)"
            printf 'old_parent_count_with_terminal_newline=%s\n' "$(grep -c 'PARENT=7f960c30b6c58c70e3a996d4239e363e50d848ef' /tmp/pc49-run-with-terminal-newline.sh 2>/dev/null || true)"
          } | tee /tmp/pc49-carrier-preflight.txt
          exit 0
      - name: Upload carrier preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc49-carrier-preflight-v3
          path: |
            /tmp/pc49-carrier-preflight.txt
            /tmp/product-decode-a.err
            /tmp/product-decode-b.err
            /tmp/run-decode-a.err
            /tmp/run-decode-b.err
          if-no-files-found: error
