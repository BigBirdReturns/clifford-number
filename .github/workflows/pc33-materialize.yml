name: Temporary PC-33 exact product materializer

on:
  pull_request:
    paths:
      - '.pc33/payload.part-*'
      - '.github/workflows/pc33-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc33-exact-product-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-eligibility-outreach-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and extract the exact twelve-file PC-33 product
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import subprocess
          import tarfile

          expected_xz_sha256 = '60abb41e0d21580613afbf80c47db41e3beea632b94ead7778403c075dfe7ba3'
          expected_base64_sha256 = 'fc61f248c917495411984558d3b8c1d86b7e312d12e66b5f66523157ba967cd7'
          expected = {
              'data/research/preference-custody/eligibility-outreach-assurance.fixture.json': 'b68fed8622638506acdc9dbb01f77231b5160b39fddc7a9cf19ef5d6b4b1ea2e',
              'tools/lib/preference-eligibility-outreach-assurance.mjs': '20cede2ec171637008577c55d09fbd69ab8035391e3c42c15e648a4cc717122f',
              'tools/compile-preference-eligibility-outreach-assurance.mjs': '7ae562b41373bf430aee62679c283f8f349b9f12b7f8494f57ea557d21ce2c0f',
              'tools/validate-preference-eligibility-outreach-assurance.mjs': 'dad4a0381d0433d003e569518d1701d717fa9fb7a9c023da96b1d4d4323109c6',
              'test/preference-eligibility-outreach-assurance.test.js': '3b43802b2dfb407625f6849f8ac008b5d6844e9888ad9e6130ead8619be96655',
              'docs/preference-custody-eligibility-outreach-assurance.md': '5c166d106a72736842ffde09fa0ca887a20ffa98f9de2ac1c9227a96c1c1f20d',
              'data/research/preference-custody/control-manifest-v31.json': 'b7d53238243044cf811d4be19b622cf8faaa9dbaf24c7cf671c4f592040463d2',
              'tools/lib/preference-custody-manifest-v31.mjs': '05fcb2859554ba09cfbc73ef2ebe6d66cdf85e154ad9a209801ec72d7da397c7',
              'tools/compile-preference-custody-manifest-v31.mjs': '1c84e0e0c4268eb1071ff26500890c432f9848bf1b1fa28d302a4f5a70aa42c9',
              'tools/validate-preference-custody-manifest-v31.mjs': '1b0b99cba1533348d61e8f06ce2d6e973175f10bfe634e7f2b18cbbdc9e06b70',
              'test/preference-custody-manifest-v31.test.js': '2a73eeef4e81d08e97627375812f301b00df8b1e0b0bce71ae123a0542ef8c39',
              'docs/preference-custody-laboratory-floor-v31.md': '33126f6325513482d65ebc94e72cec5a171b2d5467410ffaea9906dab5d92a05',
          }

          parts = sorted(Path('.pc33').glob('payload.part-*'))
          required_parts = [f'payload.part-{index:02d}' for index in range(7)]
          if [path.name for path in parts] != required_parts:
              raise SystemExit(f'expected seven ordered payload shards, found {[path.name for path in parts]}')
          encoded = ''.join(''.join(path.read_text().split()) for path in parts)
          actual_base64_sha256 = hashlib.sha256(encoded.encode()).hexdigest()
          if actual_base64_sha256 != expected_base64_sha256:
              raise SystemExit(f'payload base64 SHA-256 mismatch: {actual_base64_sha256}')
          try:
              xz_bytes = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'invalid payload base64: {error}')
          actual_xz_sha256 = hashlib.sha256(xz_bytes).hexdigest()
          if actual_xz_sha256 != expected_xz_sha256:
              raise SystemExit(f'payload xz SHA-256 mismatch: {actual_xz_sha256}')

          with tarfile.open(fileobj=io.BytesIO(xz_bytes), mode='r:xz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f'archive path/order mismatch: {names}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member must be a regular file: {member.name}')
                  if Path(member.name).is_absolute() or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())

          observed = {}
          for name, required_sha256 in expected.items():
              raw = Path(name).read_bytes()
              actual_sha256 = hashlib.sha256(raw).hexdigest()
              if actual_sha256 != required_sha256:
                  raise SystemExit(f'file SHA-256 mismatch for {name}: {actual_sha256}')
              observed[name] = {'bytes': len(raw), 'sha256': actual_sha256}

          receipt = {
              'schema_version': 'pc33-materialization-receipt@1',
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'payload_base64_sha256': actual_base64_sha256,
              'payload_xz_sha256': actual_xz_sha256,
              'permanent_nonworkflow_file_count': len(expected),
              'files': observed,
              'outside_human_dependency': False,
          }
          Path('/tmp/pc33-materialization-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY2
      - name: Qualify standalone PC-33 and compositional floor v31
        run: |
          node tools/compile-preference-eligibility-outreach-assurance.mjs
          node tools/validate-preference-eligibility-outreach-assurance.mjs
          node test/preference-eligibility-outreach-assurance.test.js
          node tools/compile-preference-custody-manifest-v31.mjs
          node tools/validate-preference-custody-manifest-v31.mjs
          node test/preference-custody-manifest-v31.test.js
      - name: Regress historical Preference Custody floors and no-magic-human gate
        run: |
          set -euo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
      - name: Commit only the exact product and retire all seven payload shards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/research/preference-custody/eligibility-outreach-assurance.fixture.json \
            tools/lib/preference-eligibility-outreach-assurance.mjs \
            tools/compile-preference-eligibility-outreach-assurance.mjs \
            tools/validate-preference-eligibility-outreach-assurance.mjs \
            test/preference-eligibility-outreach-assurance.test.js \
            docs/preference-custody-eligibility-outreach-assurance.md \
            data/research/preference-custody/control-manifest-v31.json \
            tools/lib/preference-custody-manifest-v31.mjs \
            tools/compile-preference-custody-manifest-v31.mjs \
            tools/validate-preference-custody-manifest-v31.mjs \
            test/preference-custody-manifest-v31.test.js \
            docs/preference-custody-laboratory-floor-v31.md
          git rm -- \
            .pc33/payload.part-00 \
            .pc33/payload.part-01 \
            .pc33/payload.part-02 \
            .pc33/payload.part-03 \
            .pc33/payload.part-04 \
            .pc33/payload.part-05 \
            .pc33/payload.part-06
          python - <<'PY2'
          import subprocess
          expected = [
              '.pc33/payload.part-00',
              '.pc33/payload.part-01',
              '.pc33/payload.part-02',
              '.pc33/payload.part-03',
              '.pc33/payload.part-04',
              '.pc33/payload.part-05',
              '.pc33/payload.part-06',
              'data/research/preference-custody/control-manifest-v31.json',
              'data/research/preference-custody/eligibility-outreach-assurance.fixture.json',
              'docs/preference-custody-eligibility-outreach-assurance.md',
              'docs/preference-custody-laboratory-floor-v31.md',
              'test/preference-custody-manifest-v31.test.js',
              'test/preference-eligibility-outreach-assurance.test.js',
              'tools/compile-preference-custody-manifest-v31.mjs',
              'tools/compile-preference-eligibility-outreach-assurance.mjs',
              'tools/lib/preference-custody-manifest-v31.mjs',
              'tools/lib/preference-eligibility-outreach-assurance.mjs',
              'tools/validate-preference-custody-manifest-v31.mjs',
              'tools/validate-preference-eligibility-outreach-assurance.mjs',
          ]
          observed = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if observed != expected:
              raise SystemExit(f'staged path mismatch:\nexpected={expected}\nobserved={observed}')
          print(f'exact staged path set verified: {len(observed)} paths')
          PY2
          git commit -m 'Materialize PC-33 and Preference Custody floor v31'
          git push origin HEAD:research/preference-eligibility-outreach-assurance-v1
      - name: Preserve the exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc33-exact-materialization-receipt
          path: /tmp/pc33-materialization-receipt.json
          if-no-files-found: error
