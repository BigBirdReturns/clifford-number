name: Temporary PC-28 permanent-surface bootstrap

on:
  push:
    branches:
      - research/preference-topology-assurance-v1
    paths:
      - '.pc28/**'
      - '.github/workflows/pc28-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc28-permanent-surface-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-topology-assurance-v1
      - name: Materialize the checksum-bound PC-28 surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import tarfile

          expected_paths = [
              'data/research/preference-custody/topology-assurance.fixture.json',
              'tools/lib/preference-topology-assurance.mjs',
              'tools/compile-preference-topology-assurance.mjs',
              'tools/validate-preference-topology-assurance.mjs',
              'test/preference-topology-assurance.test.js',
              'docs/preference-custody-topology-assurance.md',
              'data/research/preference-custody/control-manifest-v26.json',
              'tools/lib/preference-custody-manifest-v26.mjs',
              'tools/compile-preference-custody-manifest-v26.mjs',
              'tools/validate-preference-custody-manifest-v26.mjs',
              'test/preference-custody-manifest-v26.test.js',
              'docs/preference-custody-laboratory-floor-v26.md',
          ]
          parts = sorted(Path('.pc28').glob('payload-*.txt'))
          if len(parts) != 5:
              raise SystemExit(f'expected five PC-28 payload parts, found {len(parts)}')

          encoded = ''.join(path.read_text().strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          expected_digest = '084ea1387b37fd035e4d9b1492516258b15082d0bfff8243d3cbc4520f0e4287'
          actual_digest = hashlib.sha256(payload).hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit(f'PC-28 payload digest mismatch: {actual_digest}')

          root = Path.cwd().resolve()
          materialized = {}
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              member_paths = [member.name for member in members if member.isfile()]
              if member_paths != expected_paths or len(members) != len(expected_paths):
                  raise SystemExit(f'PC-28 archive denominator mismatch: {member_paths}')
              for member in members:
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  materialized[target] = extracted.read()

          for target, content in materialized.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              print(f'materialized {target.relative_to(root)}')
          PY
      - name: Commit the permanent non-workflow PC-28 surface
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f \
            data/research/preference-custody/topology-assurance.fixture.json \
            tools/lib/preference-topology-assurance.mjs \
            tools/compile-preference-topology-assurance.mjs \
            tools/validate-preference-topology-assurance.mjs \
            test/preference-topology-assurance.test.js \
            docs/preference-custody-topology-assurance.md \
            data/research/preference-custody/control-manifest-v26.json \
            tools/lib/preference-custody-manifest-v26.mjs \
            tools/compile-preference-custody-manifest-v26.mjs \
            tools/validate-preference-custody-manifest-v26.mjs \
            test/preference-custody-manifest-v26.test.js \
            docs/preference-custody-laboratory-floor-v26.md
          if git diff --cached --quiet; then
            echo 'Permanent PC-28 non-workflow files already exist.'
          else
            git commit -m 'Implement PC-28 and compose Preference Custody floor v26'
            git push origin HEAD:research/preference-topology-assurance-v1
          fi
