name: TEMP autostart RD-06 fourth-closure export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-ssc-rd06-fourth-closure-export-control.yml'
      - '.github/workflows/temporary-ssc-rd06-fourth-closure-export-autostart.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the exact read-only exporter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/BigBirdReturns/clifford-number/actions/workflows/temporary-ssc-rd06-fourth-closure-export-control.yml/dispatches \
            --data '{"ref":"main"}'
          echo 'RD-06 fourth-closure export dispatched'
