name: Temporary repair K0 Wave 05 append-only validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-repair-k0-wave05-append-only.yml'
  push:
    branches: [agent/k0-role-neutral-wave-06]
    paths:
      - '.github/workflows/temporary-repair-k0-wave05-append-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply bounded append-only compatibility repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/validate-k0-wave05-field-adjudication.mjs')
          text = path.read_text()
          old = """  if (pendingMetric?.observed !== 0 || pendingMetric?.source !== 'data/research/k0-wave05-field-adjudication.json') fail('coverage pending-field metric drift');
            if (gap?.status !== 'resolved_at_maintainer_layer') fail('coverage Wave 05 gap state drift');
          """
          new = """  const wave05PendingSources = new Set([
              'data/research/k0-role-neutral-wave-05.json',
              'data/research/k0-wave05-field-adjudication.json'
            ]);
            if (!pendingMetric || !Number.isInteger(pendingMetric.observed) || pendingMetric.observed < 0 || typeof pendingMetric.source !== 'string' || pendingMetric.source.length < 1) fail('coverage pending-field metric drift');
            if (executedWaveIds.length === 5) {
              if (pendingMetric?.observed !== 0 || pendingMetric?.source !== 'data/research/k0-wave05-field-adjudication.json') fail('coverage pending-field metric drift');
            } else if (wave05PendingSources.has(pendingMetric?.source)) fail('coverage pending-field metric drift');
            if (gap?.status !== 'resolved_at_maintainer_layer') fail('coverage Wave 05 gap state drift');
          """
          if text.count(old) != 1:
            raise SystemExit(f'expected one replacement anchor, observed {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Build, validate, and exercise regressions
        run: |
          set -euo pipefail
          node tools/build-k0-wave05-field-adjudication.mjs
          node tools/validate-k0-wave05-field-adjudication.mjs
          node test/k0-wave05-field-adjudication.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-k0-role-neutral-wave-06.mjs
          node test/k0-role-neutral-wave-06.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
          npm run release:check

      - name: Prove deterministic repair products
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          paths = [
            'tools/validate-k0-wave05-field-adjudication.mjs',
            'data/project/k0-wave05-field-adjudication-release-manifest.json',
            'reports/core-thesis/answerable-power/k0-wave05-field-adjudication.json',
            'reports/core-thesis/answerable-power/k0-wave05-field-adjudication.html',
          ]
          before = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          subprocess.run(['node','tools/build-k0-wave05-field-adjudication.mjs'], check=True)
          after = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          assert before == after, {p: (before[p], after[p]) for p in paths if before[p] != after[p]}
          print(json.dumps({'deterministic': True, 'paths': paths}, indent=2))
          PY

      - name: Commit exact four-path compatibility repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/validate-k0-wave05-field-adjudication.mjs \
            data/project/k0-wave05-field-adjudication-release-manifest.json \
            reports/core-thesis/answerable-power/k0-wave05-field-adjudication.json \
            reports/core-thesis/answerable-power/k0-wave05-field-adjudication.html
          python - <<'PY'
          import subprocess
          expected = {
            'tools/validate-k0-wave05-field-adjudication.mjs',
            'data/project/k0-wave05-field-adjudication-release-manifest.json',
            'reports/core-thesis/answerable-power/k0-wave05-field-adjudication.json',
            'reports/core-thesis/answerable-power/k0-wave05-field-adjudication.html',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          assert not any(p.startswith('build/') or p.startswith('dist/') or p.startswith('.github/') for p in actual)
          print('exact staged denominator: 4 append-only compatibility paths')
          PY
          git diff --cached --check
          git commit -m 'Make Wave 05 field validation append-only'
          git push origin HEAD:agent/k0-role-neutral-wave-06
