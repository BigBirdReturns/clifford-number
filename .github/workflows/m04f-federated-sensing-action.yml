name: M-04F federated sensing and action fan-out

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m04f-federated-sensing-action-*.json'
      - 'data/intake/m04f-federated-sensing-action-*.json'
      - 'docs/milestones/m04f-federated-sensing-action-*.md'
      - 'tools/validate-m04f-federated-sensing-action.mjs'
      - 'test/m04f-federated-sensing-action.test.js'
      - '.github/workflows/m04f-federated-sensing-action.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m04f-federated-sensing-action-*.json'
      - 'data/intake/m04f-federated-sensing-action-*.json'
      - 'docs/milestones/m04f-federated-sensing-action-*.md'
      - 'tools/validate-m04f-federated-sensing-action.mjs'
      - 'test/m04f-federated-sensing-action.test.js'
      - '.github/workflows/m04f-federated-sensing-action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the bounded fan-out
        run: |
          node tools/validate-m04f-federated-sensing-action.mjs
          node test/m04f-federated-sensing-action.test.js
      - name: Fingerprint the governed Flock-shape surface
        run: |
          find \
            data/project/m04f-federated-sensing-action-*.json \
            data/intake/m04f-federated-sensing-action-*.json \
            docs/milestones/m04f-federated-sensing-action-*.md \
            tools/validate-m04f-federated-sensing-action.mjs \
            test/m04f-federated-sensing-action.test.js \
            .github/workflows/m04f-federated-sensing-action.yml \
            -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/m04f-fsa-before.sha256
      - name: Run the complete repository release gate
        run: npm run release:check
      - name: Prove governed bytes did not drift
        run: |
          find \
            data/project/m04f-federated-sensing-action-*.json \
            data/intake/m04f-federated-sensing-action-*.json \
            docs/milestones/m04f-federated-sensing-action-*.md \
            tools/validate-m04f-federated-sensing-action.mjs \
            test/m04f-federated-sensing-action.test.js \
            .github/workflows/m04f-federated-sensing-action.yml \
            -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/m04f-fsa-after.sha256
          diff -u /tmp/m04f-fsa-before.sha256 /tmp/m04f-fsa-after.sha256
          git restore --staged --worktree .
          node tools/validate-m04f-federated-sensing-action.mjs
          node test/m04f-federated-sensing-action.test.js
          git diff --exit-code
