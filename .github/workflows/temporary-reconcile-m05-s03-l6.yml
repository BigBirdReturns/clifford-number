name: Temporary reconcile M-05 Sprint 03 Leg 06

on:
  push:
    branches:
      - agent/m05-sprint-03-leg-06-value-recovery-transfer
    paths:
      - '.github/workflows/temporary-reconcile-m05-s03-l6.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-06-value-recovery-transfer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove PR merge and validate fresh main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/pulls/353 --jq .merged)" = "true"
          git fetch origin main
          git cat-file -e origin/main:data/project/m05-answerable-power-sprint-03-leg-06-value-recovery-transfer.json
          git cat-file -e origin/main:reports/core-thesis/answerable-power/sprint-03-leg-06.json
          git worktree add --detach /tmp/m05-s03-l6-main origin/main
          cd /tmp/m05-s03-l6-main
          node tools/build-m05-answerable-power-sprint-03-leg-06.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-06.mjs
          node test/m05-answerable-power-sprint-03-leg-06.test.js
          npm run release:check
      - name: Reconcile issue and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          gh issue comment 344 --body "## S03-L6 terminal reconciliation\n\nPR #353 is merged into main at \`${MAIN_SHA}\`. A fresh-main checkout passed the Leg 06 builder, validator, regression test, and complete repository release gate.\n\n\`\`\`text\nTARP CPP: observed bounded R7 positive control\nNATO NIF: public-LP equity architecture supported; realization and distribution open\nNSSIF: direct public-equity architecture supported; realization and distribution open\nCHIPS / Polar: contingent upside-sharing supported; trigger and receipt open\nNASA COTS: public capability and market creation supported; recipient residual right is a bounded non-link\npublic-data platform finance: public contribution visible; residual rights and affected-party distribution open\n\nTarget-sector realized R7: false\nAffected-party R7: false\nCross-sector transfer: retained_candidate_only\n\`\`\`"
          gh issue close 344 --reason completed
          git rm -f .github/workflows/temporary-reconcile-m05-s03-l6.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove temporary M-05 Sprint 03 Leg 06 reconciliation workflow'
          git push origin HEAD:agent/m05-sprint-03-leg-06-value-recovery-transfer
