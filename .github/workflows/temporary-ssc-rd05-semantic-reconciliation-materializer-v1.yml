          add('reconciliation removed', (s) => { s.product.reconciliations = []; });
          add('reconciliation object', (s) => { s.product.reconciliations[0].object_id = 'wrong'; });
          add('discharged action', (s) => { s.product.reconciliations[0].discharged_successor_action = 'wrong'; });
          add('denominator changed', (s) => { s.product.reconciliations[0].denominator_changed = true; });
