          npm run release:check

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const jsonPaths = [
            'build/axm-identity.json',
            'build/build-hop-report.json',
            'build/hop-graph.json',
            'build/migration-summary.json',
            'build/receipt-graph.json',
            'build/scores.json',
            'build/scout-report.json',
            'build/surface-graph.json'
          ];
          const markdownPaths = [
            'build/migration-review.md',
            'build/scout-report.md'
          ];
          const expected = [...jsonPaths, ...markdownPaths].sort();
          const raw = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'buffer' });
          const paths = raw.toString('utf8').split('\0').filter(Boolean).sort();
          if (JSON.stringify(paths) !== JSON.stringify(expected)) {
            throw new Error(`unexpected post-release paths: ${JSON.stringify(paths)}`);
          }
          const numstat = execFileSync('git', ['diff', '--numstat', '--', ...expected], { encoding: 'utf8' })
            .split('\n').filter(Boolean);
          if (numstat.length !== expected.length) throw new Error('post-release numstat denominator');
          for (const row of numstat) {
            const [adds, deletes, path] = row.split('\t');
            if (adds !== '1' || deletes !== '1' || !expected.includes(path)) {
              throw new Error(`non-timestamp post-release diff: ${row}`);
            }
          }
          for (const path of jsonPaths) {
            const before = JSON.parse(execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }));
            const after = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (typeof before.generated !== 'string' || typeof after.generated !== 'string') throw new Error(`missing generated timestamp: ${path}`);
            if (!Number.isFinite(Date.parse(before.generated)) || !Number.isFinite(Date.parse(after.generated))) throw new Error(`invalid generated timestamp: ${path}`);
            delete before.generated;
            delete after.generated;
            if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error(`semantic JSON drift: ${path}`);
          }
          for (const path of markdownPaths) {
            const before = execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }).split('\n');
            const after = fs.readFileSync(path, 'utf8').split('\n');
            const normalize = (lines) => lines.map((line) => line.startsWith('Generated: ') ? 'Generated: <ISO>' : line);
            if (JSON.stringify(normalize(before)) !== JSON.stringify(normalize(after))) throw new Error(`semantic Markdown drift: ${path}`);
            const beforeGenerated = before.find((line) => line.startsWith('Generated: '));
            const afterGenerated = after.find((line) => line.startsWith('Generated: '));
            if (!beforeGenerated || !afterGenerated || !Number.isFinite(Date.parse(beforeGenerated.slice(11))) || !Number.isFinite(Date.parse(afterGenerated.slice(11)))) throw new Error(`invalid Markdown generated timestamp: ${path}`);
          }
          console.log('post-release volatility proof: PASS — 10/10 paths timestamp-only, semantic drift zero');
