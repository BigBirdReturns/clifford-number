          add('remove object', (s) => { s.product.objects.pop(); });
          add('duplicate object', (s) => { s.product.objects[1].object_id = s.product.objects[0].object_id; });
          add('non-target drift', (s) => { s.product.objects[0].record_class = 'wrong'; });
          add('target class', (s) => { target(s).record_class = 'wrong'; });
          add('target title', (s) => { target(s).observed_title = 'wrong'; });
