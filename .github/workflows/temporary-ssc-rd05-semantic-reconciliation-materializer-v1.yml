            assert(receipt.authority.outside_human_dependency === false, 'receipt human dependency');
            assert(receipt.authority.publication_effect === 'none', 'receipt publication');
            assert(receipt.authority.adoption_effect === 'none', 'receipt adoption');
            assert(receipt.authority.graph_effect === 'none', 'receipt graph');
