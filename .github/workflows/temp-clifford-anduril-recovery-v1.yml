name: TEMP recover Clifford-Anduril bounded non-link

on:
  push:
    branches:
      - agent/temp-clifford-anduril-recovery-v1

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out recovery carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Recover or verify the exact bounded product
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          expected_parent='a76da0afd258cd9a3aa77f0a93633172469509dd'
          product='candidate/clifford-anduril-boundary-v1'
          source='agent/m05-sprint-02-leg-02-clifford-anduril'
          recovery='agent/temp-clifford-anduril-recovery-v1'
          title='Topology: close Matt Clifford × Anduril as a bounded non-link'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main

          pr_number=$(gh pr list --repo "$repo" --state all --limit 100 --json number,title,headRefName --jq '[.[] | select(.headRefName=="candidate/clifford-anduril-boundary-v1" or .title=="Topology: close Matt Clifford × Anduril as a bounded non-link")][0].number // empty')
          if test -n "$pr_number"; then
            merged=$(gh pr view "$pr_number" --repo "$repo" --json mergedAt --jq '.mergedAt // empty')
            if test -n "$merged"; then
              merge_sha=$(gh pr view "$pr_number" --repo "$repo" --json mergeCommit --jq '.mergeCommit.oid')
              git fetch --no-tags origin main
              git merge-base --is-ancestor "$merge_sha" origin/main
              for ref in \
                "$product" \
                "$source" \
                agent/temp-clifford-anduril-boundary-publisher-v1 \
                agent/temp-clifford-anduril-boundary-finalizer-v1 \
                agent/temp-clifford-anduril-terminal-v1 \
                agent/temp-export-main-a76da0-v1 \
                "$recovery"; do
                git push origin --delete "$ref" || true
              done
              echo "Already terminal at PR #$pr_number merge $merge_sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          current_main=$(git rev-parse origin/main)
          test "$current_main" = "$expected_parent"
          git fetch --no-tags origin "$source"
          source_sha=$(git rev-parse "origin/$source")

          fixed_paths=(
            build/axm-identity.json
            build/build-hop-report.json
            build/hop-graph.json
            build/migration-review.md
            build/migration-summary.json
            build/receipt-graph.json
            build/scores.json
            build/scout-report.json
            build/scout-report.md
            build/surface-graph.json
            data/canonical/aliases.json
            data/canonical/organizations.json
            data/ledger/claims.jsonl
            data/ledger/participation.jsonl
            data/ledger/receipts.jsonl
            data/ledger/surfaces.jsonl
            data/research/clifford-cross-corpus-public-interest-map.json
            test/compiler.test.js
            tools/validate-release.mjs
          )

          mapfile -t receipt_paths < <(git diff --name-only "$expected_parent" "$source_sha" -- receipts/topology/ | sort -u)
          test "${#receipt_paths[@]}" -eq 3
          for path in "${receipt_paths[@]}"; do
            test "$(git show "$source_sha:$path" | grep -Eic 'Anduril|Matt Clifford|TALOS|summit')" -gt 0
          done

          all_paths=("${fixed_paths[@]}" "${receipt_paths[@]}")
          test "${#all_paths[@]}" -eq 22
          for path in "${all_paths[@]}"; do
            git cat-file -e "$source_sha:$path"
          done

          git checkout -B "$product" "$expected_parent"
          git checkout "$source_sha" -- "${all_paths[@]}"
          mapfile -t changed < <(git diff --name-only --cached)
          test "${#changed[@]}" -eq 22
          if printf '%s\n' "${changed[@]}" | grep -E '^\.github/(workflows|temporary)/'; then
            echo 'transport entered the selected product paths' >&2
            exit 1
          fi
          git diff --cached --check

          npm run release:check

          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const base = 'a76da0afd258cd9a3aa77f0a93633172469509dd';
          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const readJsonl = p => fs.readFileSync(p, 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const showJson = p => JSON.parse(cp.execFileSync('git', ['show', `${base}:${p}`], { encoding: 'utf8' }));
          const showJsonl = p => cp.execFileSync('git', ['show', `${base}:${p}`], { encoding: 'utf8' }).split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const rows = (doc, key) => Array.isArray(doc) ? doc : doc[key];
          const added = (now, before, key) => {
            const prior = new Set(before.map(row => row[key]));
            return now.filter(row => !prior.has(row[key]));
          };
          const assert = (value, message) => { if (!value) throw new Error(message); };

          const hop = readJson('build/hop-graph.json');
          const surfaces = added(readJsonl('data/ledger/surfaces.jsonl'), showJsonl('data/ledger/surfaces.jsonl'), 'surface_id');
          const receipts = added(readJsonl('data/ledger/receipts.jsonl'), showJsonl('data/ledger/receipts.jsonl'), 'receipt_id');
          const claims = added(readJsonl('data/ledger/claims.jsonl'), showJsonl('data/ledger/claims.jsonl'), 'claim_id');
          const orgs = added(rows(readJson('data/canonical/organizations.json'), 'organizations'), rows(showJson('data/canonical/organizations.json'), 'organizations'), 'id');

          assert(hop.edges.length === 44, `expected unchanged 44-edge graph, found ${hop.edges.length}`);
          assert(surfaces.length === 4, `expected four added boundary surfaces, found ${surfaces.length}`);
          assert(receipts.length === 3, `expected three official extracts, found ${receipts.length}`);
          assert(claims.length === 2, `expected two public boundary claims, found ${claims.length}`);
          assert(orgs.length === 1, `expected one source-scoped organization, found ${orgs.length}`);
          assert(surfaces.every(row => row.hop_eligible === false && typeof row.hop_refusal_reason === 'string'), 'all added surfaces must remain explicit refusals');
          assert(!hop.edges.some(edge => {
            const hasClifford = edge.actor_a === 'matt-clifford' || edge.actor_b === 'matt-clifford';
            return hasClifford && (edge.surfaces ?? []).some(basis => String(basis.surface_id).toLowerCase().includes('anduril'));
          }), 'the candidate manufactured a Matt Clifford-Anduril hop');

          fs.writeFileSync('/tmp/summary.json', JSON.stringify({
            surface_ids: surfaces.map(row => row.surface_id),
            receipt_ids: receipts.map(row => row.receipt_id),
            claim_ids: claims.map(row => row.claim_id),
            organization_ids: orgs.map(row => row.id),
            actor_hop_edges: hop.edges.length,
          }, null, 2));
          NODE

          git add -A
          mapfile -t final_paths < <(git diff --name-only --cached)
          test "${#final_paths[@]}" -eq 22
          git diff --cached --check
          git commit -m 'topology: close Matt Clifford-Anduril as bounded non-link'
          product_sha=$(git rev-parse HEAD)
          product_tree=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git push --force-with-lease origin "HEAD:refs/heads/$product"

          pr_number=$(gh pr list --repo "$repo" --state all --limit 100 --json number,title,headRefName --jq '[.[] | select(.headRefName=="candidate/clifford-anduril-boundary-v1" or .title=="Topology: close Matt Clifford × Anduril as a bounded non-link")][0].number // empty')
          summary=$(cat /tmp/summary.json)
          body=$(cat <<EOF
          This is the terminal source-custody disposition for the exact Matt Clifford × Anduril question. Official UK transparency records preserve separate summit-related meetings eight days apart, while the official TALOS award record identifies Strategic Command and jHub rather than Matt Clifford. The transaction preserves those exact events as four explicit non-hop surfaces and refuses to combine them into a shared mechanism.

          The product adds three official source extracts, two public boundary claims, and one source-scoped organization. The compiled actor graph remains exactly 44 edges.

          \`\`\`json
          $summary
          \`\`\`

          Exact product:

          \`\`\`text
          commit $product_sha
          tree   $product_tree
          parent $expected_parent
          paths  22
          \`\`\`

          The current record does not prove absence of every private contact. It does not establish influence, procurement authority, agreement, coordination, motive, wrongdoing, common purpose, or causation.

          Evidence ledger: the evidence tier is official transparency and award records, canonical extracts, compiled graph output, and executable regression. The venue is this pull request and the public application. The target is the proposed Clifford-Anduril bridge. The upside is a reproducible negative answer that preserves the underlying events. The downside is incomplete visibility into private contact. The failure mode is combining separate meetings, institutional proximity, or a programme-level award into a suggestive arrow.

          The control question is whether any future proposed route identifies one dated instrument and direct participation receipts for both endpoints.
          EOF
          )

          if test -z "$pr_number"; then
            gh pr create --repo "$repo" --base main --head "$product" --title "$title" --body "$body" >/tmp/pr-url
            pr_number=$(gh pr list --repo "$repo" --state open --head "$product" --json number --jq '.[0].number')
          else
            gh pr edit "$pr_number" --repo "$repo" --title "$title" --body "$body"
          fi

          for attempt in $(seq 1 150); do
            gh api "repos/$repo/actions/runs?head_sha=$product_sha&per_page=100" > /tmp/pr-runs.json
            verdict=$(node <<'NODE'
            const fs = require('node:fs');
            const runs = JSON.parse(fs.readFileSync('/tmp/pr-runs.json','utf8')).workflow_runs;
            const expected = ['Release checks','Thesis state-market receipt custody','No magic human gate'];
            const latest = new Map();
            for (const run of runs) {
              if (!expected.includes(run.name)) continue;
              const prior = latest.get(run.name);
              if (!prior || run.run_number > prior.run_number) latest.set(run.name, run);
            }
            if (expected.some(name => !latest.has(name))) process.stdout.write('waiting');
            else if (expected.some(name => latest.get(name).status === 'completed' && !['success','neutral','skipped'].includes(latest.get(name).conclusion))) process.stdout.write('failed');
            else if (expected.every(name => latest.get(name).status === 'completed' && ['success','neutral','skipped'].includes(latest.get(name).conclusion))) process.stdout.write('passed');
            else process.stdout.write('waiting');
            NODE
            )
            case "$verdict" in
              passed) break ;;
              failed) cat /tmp/pr-runs.json; exit 1 ;;
              waiting) sleep 6 ;;
            esac
            if test "$attempt" -eq 150; then echo 'timed out waiting for exact-head admission checks' >&2; exit 1; fi
          done

          gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}} reviews(first:100){nodes{state}}}}}' -F owner='BigBirdReturns' -F name='clifford-number' -F number="$pr_number" > /tmp/reviews.json
          node <<'NODE'
          const fs = require('node:fs');
          const pr = JSON.parse(fs.readFileSync('/tmp/reviews.json','utf8')).data.repository.pullRequest;
          const unresolved = pr.reviewThreads.nodes.filter(row => !row.isResolved);
          const changes = pr.reviews.nodes.filter(row => row.state === 'CHANGES_REQUESTED');
          if (unresolved.length || changes.length) throw new Error(`unresolved review objections: threads=${unresolved.length}, requests=${changes.length}`);
          NODE

          gh api --method PUT "repos/$repo/pulls/$pr_number/merge" \
            -f sha="$product_sha" \
            -f merge_method='merge' \
            -f commit_title="$title" \
            -f commit_message='Preserve four exact official event surfaces and three receipts while refusing to combine separate meetings or a programme-level award into a Matt Clifford-Anduril hop. The actor graph remains unchanged at 44 edges.' > /tmp/merge.json
          test "$(jq -r '.merged' /tmp/merge.json)" = 'true'
          merge_sha=$(jq -r '.sha' /tmp/merge.json)

          retried=''
          for attempt in $(seq 1 150); do
            gh api "repos/$repo/actions/runs?head_sha=$merge_sha&per_page=100" > /tmp/post.json
            verdict=$(node <<'NODE'
            const fs = require('node:fs');
            const runs = JSON.parse(fs.readFileSync('/tmp/post.json','utf8')).workflow_runs;
            const expected = ['No magic human gate','Deploy surface-hop app to GitHub Pages'];
            const latest = new Map();
            for (const run of runs) {
              if (!expected.includes(run.name)) continue;
              const prior = latest.get(run.name);
              if (!prior || run.run_number > prior.run_number) latest.set(run.name, run);
            }
            if (expected.some(name => !latest.has(name))) process.stdout.write('waiting');
            else if (expected.every(name => latest.get(name).status === 'completed' && ['success','neutral','skipped'].includes(latest.get(name).conclusion))) process.stdout.write('passed');
            else if (expected.some(name => latest.get(name).status === 'completed' && !['success','neutral','skipped'].includes(latest.get(name).conclusion))) process.stdout.write('failed');
            else process.stdout.write('waiting');
            NODE
            )
            if test "$verdict" = 'passed'; then break; fi
            if test "$verdict" = 'failed' && test -z "$retried"; then
              while read -r run_id; do gh api --method POST "repos/$repo/actions/runs/$run_id/rerun-failed-jobs" || true; done < <(jq -r '.workflow_runs[] | select(.status=="completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | .id' /tmp/post.json)
              retried='yes'
            elif test "$verdict" = 'failed'; then
              cat /tmp/post.json
              exit 1
            fi
            sleep 8
            if test "$attempt" -eq 150; then echo 'timed out waiting for canonical deployment' >&2; exit 1; fi
          done

          message=$(cat <<EOF
          Canonical disposition: bounded non-link.

          PR #$pr_number merged as \`$merge_sha\` from exact product \`$product_sha\`. Official records preserve separate summit-related meetings and the TALOS award actors without placing Matt Clifford and Anduril on one shared bounded mechanism. Four explicit non-hop surfaces and three official receipts are public. The compiled actor graph remains at 44 edges.

          \`\`\`json
          $summary
          \`\`\`

          A future route requires one dated instrument and direct participation receipts for both endpoints. The current record does not establish private contact, influence, procurement authority, agreement, coordination, motive, wrongdoing, common purpose, or causation.
          EOF
          )
          gh issue comment 324 --repo "$repo" --body "$message" || true
          gh issue close 324 --repo "$repo" --reason completed || true
          gh issue comment 308 --repo "$repo" --body "$message" || true

          for ref in \
            "$product" \
            "$source" \
            agent/temp-clifford-anduril-boundary-publisher-v1 \
            agent/temp-clifford-anduril-boundary-finalizer-v1 \
            agent/temp-clifford-anduril-terminal-v1 \
            agent/temp-export-main-a76da0-v1 \
            "$recovery"; do
            git push origin --delete "$ref" || true
          done

          {
            echo '## Clifford-Anduril terminal receipt'
            echo
            echo '```text'
            echo "pull_request $pr_number"
            echo "product      $product_sha"
            echo "merge        $merge_sha"
            echo 'hop_edges    44'
            echo 'disposition  bounded_non_link'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
