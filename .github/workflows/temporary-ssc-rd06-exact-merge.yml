name: TEMP merge exact proved RD-06 promotion

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd06-exact-merge.yml'
      - '.rd06-exact-merge/**'

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temp-ssc-rd06-exact-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-exact-merge-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROOF_BRANCH: agent/ssc-rd06-promotion-proof-trigger-v1
      PROOF_WORKFLOW_NAME: TEMP prove exact RD-06 promotion head
      PROOF_ARTIFACT_NAME: ssc-rd06-wave02-promotion-proof-v1
      PRODUCT_BRANCH: agent/ssc-rd06-wave02-terminal-promotion
      CANONICAL_PR_TITLE: SSC RD-06 Wave 02: close complete offeror-universe class
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact proof and merge only the tested product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rd06-exact-merge
          mkdir -p /tmp/rd06-exact-merge/proof /tmp/rd06-exact-merge/receipt

          block() {
            printf '%s\n' "$1" > /tmp/rd06-exact-merge/receipt/BLOCKED.txt
            printf '%s\n' "$1"
            exit 0
          }

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${PROOF_BRANCH}&status=completed&per_page=100" \
            > /tmp/rd06-exact-merge/runs.json

          python - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path('/tmp/rd06-exact-merge/runs.json').read_text())
          pages=data if isinstance(data,list) else [data]
          rows=[]
          for page in pages: rows.extend(page.get('workflow_runs',[]))
          matches=[r for r in rows if r.get('name')==os.environ['PROOF_WORKFLOW_NAME'] and r.get('head_branch')==os.environ['PROOF_BRANCH']]
          matches.sort(key=lambda r:r.get('created_at',''),reverse=True)
          if not matches:
              pathlib.Path('/tmp/rd06-exact-merge/receipt/BLOCKED.txt').write_text('no_completed_promotion_proof_run\n')
          else:
              run=matches[0]
              pathlib.Path('/tmp/rd06-exact-merge/proof-run.json').write_text(json.dumps(run,indent=2)+'\n')
              pathlib.Path('/tmp/rd06-exact-merge/proof-run-id.txt').write_text(str(run['id'])+'\n')
              if run.get('conclusion')!='success':
                  pathlib.Path('/tmp/rd06-exact-merge/receipt/BLOCKED.txt').write_text(f"promotion_proof_{run.get('conclusion')}\n")
          PY
          if [ -f /tmp/rd06-exact-merge/receipt/BLOCKED.txt ]; then exit 0; fi

          proof_run="$(cat /tmp/rd06-exact-merge/proof-run-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${proof_run}/artifacts" > /tmp/rd06-exact-merge/artifacts.json
          python - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path('/tmp/rd06-exact-merge/artifacts.json').read_text())
          arts=[a for a in data.get('artifacts',[]) if a.get('name')==os.environ['PROOF_ARTIFACT_NAME'] and not a.get('expired')]
          if len(arts)!=1:
              pathlib.Path('/tmp/rd06-exact-merge/receipt/BLOCKED.txt').write_text(f'exact_proof_artifact_count_{len(arts)}\n')
          else:
              art=arts[0]
              pathlib.Path('/tmp/rd06-exact-merge/proof-artifact.json').write_text(json.dumps(art,indent=2)+'\n')
              pathlib.Path('/tmp/rd06-exact-merge/proof-artifact-id.txt').write_text(str(art['id'])+'\n')
          PY
          if [ -f /tmp/rd06-exact-merge/receipt/BLOCKED.txt ]; then exit 0; fi

          proof_artifact="$(cat /tmp/rd06-exact-merge/proof-artifact-id.txt)"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${proof_artifact}/zip" > /tmp/rd06-exact-merge/proof.zip
          expected_digest="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-exact-merge/proof-artifact.json'))['digest'].split(':',1)[1])
          PY
          )"
          test "$(sha256sum /tmp/rd06-exact-merge/proof.zip | awk '{print $1}')" = "$expected_digest" || block proof_artifact_digest_mismatch
          unzip -q /tmp/rd06-exact-merge/proof.zip -d /tmp/rd06-exact-merge/proof
          proof_file="$(find /tmp/rd06-exact-merge/proof -type f -name proof.json -print -quit)"
          manifest_file="$(find /tmp/rd06-exact-merge/proof -type f -name manifest.json -print -quit)"
          test -n "$proof_file" || block proof_json_missing
          test -n "$manifest_file" || block proof_manifest_missing
          cp "$proof_file" /tmp/rd06-exact-merge/receipt/proof.json
          cp "$manifest_file" /tmp/rd06-exact-merge/receipt/proof-manifest.json

          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-exact-merge/proof')
          proof=json.load(open('/tmp/rd06-exact-merge/receipt/proof.json'))
          manifest=json.load(open('/tmp/rd06-exact-merge/receipt/proof-manifest.json'))
          assert proof['schema_version']=='ssc-rd06-wave02-promotion-proof@1'
          assert proof['wave_id']=='SSC-RD-W02' and proof['lane_id']=='RD-06' and proof['class_id']=='RD-06-C01' and proof['issue']==791
          assert proof['temporary_or_transport_paths']==0
          assert proof['focused_checks_passed'] is True
          assert proof['complete_release_gate_passed'] is True
          assert proof['no_magic_human_gate_passed'] is True
          assert proof['atlas_after_promotion']=={'open':39,'closed':3}
          assert proof['authority']['outside_human_dependency'] is False
          assert proof['authority']['external_contacts']==0 and proof['authority']['external_reviews']==0
          assert proof['authority']['publication_effect']=='none' and proof['authority']['adoption_effect']=='none' and proof['authority']['graph_effect']=='none'
          for row in manifest['entries']:
              p=root/row['path']; data=p.read_bytes()
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in manifest['entries']).encode()).hexdigest()
          assert combined==manifest['combined_sha256']
          PY

          product_head="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-exact-merge/receipt/proof.json'))['product_head'])
          PY
          )"
          proved_main="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/rd06-exact-merge/receipt/proof.json'))['main_head_at_proof'])
          PY
          )"

          current_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          current_product="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${PRODUCT_BRANCH}" --jq '.object.sha')"
          test "$current_main" = "$proved_main" || block main_advanced_after_proof
          test "$current_product" = "$product_head" || block product_head_changed_after_proof

          gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$PRODUCT_BRANCH" --json number,headRefOid,baseRefName,isDraft,title > /tmp/rd06-exact-merge/canonical-prs.json
          pr_count="$(python - <<'PY'
          import json
          print(len(json.load(open('/tmp/rd06-exact-merge/canonical-prs.json'))))
          PY
          )"
          if [ "$pr_count" = 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$PRODUCT_BRANCH" --draft --title "$CANONICAL_PR_TITLE" --body-file - <<'EOF'
          Issue: #791
          Parent Wave 02: #785

          Exact current-main reconciliation of the audited RD-06-C01 offeror-universe terminal receipt. This candidate is mergeable only through the checksum-bound promotion proof. It preserves RD-04 and RD-05 as independent prior receipts and advances the atlas to 39 open / 3 closed.

          No equal-support, superiority, foreclosure, coordination, common-purpose, publication, adoption, graph, contact, external-review, or outside-human authority is created.
          EOF
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$PRODUCT_BRANCH" --json number,headRefOid,baseRefName,isDraft,title > /tmp/rd06-exact-merge/canonical-prs.json
          fi

          python - <<'PY'
          import json,pathlib,os
          rows=json.load(open('/tmp/rd06-exact-merge/canonical-prs.json'))
          assert len(rows)==1, f'exactly one canonical PR required, found {len(rows)}'
          row=rows[0]
          assert row['headRefOid']==os.environ.get('PRODUCT_HEAD_FOR_ASSERT', row['headRefOid'])
          assert row['baseRefName']=='main'
          pathlib.Path('/tmp/rd06-exact-merge/canonical-pr-number.txt').write_text(str(row['number'])+'\n')
          PY
          pr_number="$(cat /tmp/rd06-exact-merge/canonical-pr-number.txt)"
          actual_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$actual_head" = "$product_head" || block canonical_pr_head_mismatch

          for attempt in $(seq 1 20); do
            mergeable="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')"
            [ "$mergeable" != UNKNOWN ] && break
            sleep 3
          done
          [ "$mergeable" = MERGEABLE ] || block canonical_pr_not_mergeable

          is_draft="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" = true ]; then gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"; fi

          premerge_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$premerge_main" = "$proved_main" || block main_advanced_immediately_before_merge

          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$product_head"
          gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json number,mergedAt,mergeCommit,headRefOid,baseRefName > /tmp/rd06-exact-merge/receipt/merged-pr.json

          python - <<'PY'
          import json,pathlib
          pr=json.load(open('/tmp/rd06-exact-merge/receipt/merged-pr.json'))
          assert pr['mergedAt'] is not None
          assert pr['mergeCommit'] and pr['mergeCommit']['oid']
          pathlib.Path('/tmp/rd06-exact-merge/merge-commit.txt').write_text(pr['mergeCommit']['oid']+'\n')
          PY
          merge_commit="$(cat /tmp/rd06-exact-merge/merge-commit.txt)"
          git fetch origin main "$PRODUCT_BRANCH"
          git merge-base --is-ancestor "$merge_commit" origin/main
          test "$(git rev-parse "${merge_commit}^{tree}")" = "$(git rev-parse "${product_head}^{tree}")" || block merged_tree_differs_from_proved_product
          parents="$(git show -s --format='%P' "$merge_commit")"
          case " $parents " in *" $product_head "*) ;; *) block merged_commit_missing_proved_product_parent ;; esac

          gh issue comment 791 --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          RD-06-C01 is now canonical at merge commit \`${merge_commit}\` from exact proved product \`${product_head}\`.

          The checksum-bound promotion proof preserved the complete bidder/offeror universe receipt, a transport-free changed-path denominator, all focused and complete repository gates, and the additive Wave-02 atlas state of **39 open / 3 closed**. The closure remains bounded to the declared public offeror-universe obligation and creates no equal-support, superiority, foreclosure, coordination, common-purpose, publication, adoption, or graph finding.
          EOF
          gh issue close 791 --repo "$GITHUB_REPOSITORY" --reason completed

          python - <<'PY'
          import json,pathlib,datetime
          proof=json.load(open('/tmp/rd06-exact-merge/receipt/proof.json'))
          pr=json.load(open('/tmp/rd06-exact-merge/receipt/merged-pr.json'))
          result={
            'schema_version':'ssc-rd06-wave02-exact-merge-receipt@1',
            'wave_id':'SSC-RD-W02','lane_id':'RD-06','class_id':'RD-06-C01','issue':791,
            'proof_run':json.load(open('/tmp/rd06-exact-merge/proof-run.json'))['id'],
            'proof_artifact':json.load(open('/tmp/rd06-exact-merge/proof-artifact.json'))['id'],
            'proved_main':proof['main_head_at_proof'],'product_head':proof['product_head'],
            'canonical_pr':pr['number'],'merge_commit':pr['mergeCommit']['oid'],'merged_at':pr['mergedAt'],
            'atlas_after_merge':{'open':39,'closed':3},
            'authority':proof['authority'],
          }
          pathlib.Path('/tmp/rd06-exact-merge/receipt/result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Seal exact merge or blocker receipt
        if: always()
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd06-exact-merge/receipt')
          root.mkdir(parents=True,exist_ok=True)
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='manifest.json'):
              b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          combined=hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows).encode()).hexdigest()
          (root/'manifest.json').write_text(json.dumps({'schema_version':'ssc-rd06-wave02-exact-merge-manifest@1','entry_count':len(rows),'entries':rows,'combined_sha256':combined},indent=2)+'\n')
          print(f'RD-06 exact merge receipt sealed: {len(rows)} entries; {combined}')
          PY

      - name: Preserve exact merge or blocker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-exact-merge-v1
          path: /tmp/rd06-exact-merge/receipt
          if-no-files-found: error
          retention-days: 90
