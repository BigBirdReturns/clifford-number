name: TEMP seal PC-51 terminal census receipt

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: pc51-terminal-census-receipt-08288d
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      SELF_BRANCH: ${{ github.event.pull_request.head.ref }}
      SELF_HEAD: ${{ github.event.pull_request.head.sha }}
      SELF_PR: ${{ github.event.pull_request.number }}
      MERGE_SHA: 08288d7358bd9d2a14babd9893cecea61cdb7334
      PRODUCT_COMMIT: 030ece737067699236883bc1f1533af9866fa140
      PROOF_RUN: '31138928325'
      PROOF_ARTIFACT_ID: '8979188016'
      PROOF_ARTIFACT_DIGEST: sha256:1a18bfbde6aa970d85efc8648320fbfe05f796fa41e2435948e92a7b9d9e27b8
      FIRST_RETIREMENT_RUN: '31139456563'
      RECEIPT_DIR: /tmp/pc51-terminal-census-receipt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 08288d7358bd9d2a14babd9893cecea61cdb7334
          fetch-depth: 0

      - name: Verify proof, canonical ancestry, and pre-receipt zero state
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RECEIPT_DIR"
          git fetch --no-tags origin main "$MERGE_SHA" "$PRODUCT_COMMIT" >/dev/null 2>&1
          CURRENT_MAIN=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$MERGE_SHA" "$CURRENT_MAIN"
          printf '%s\n' "$CURRENT_MAIN" > "$RECEIPT_DIR/current-main.txt"

          gh api "/repos/${GH_REPOSITORY}/actions/runs/${PROOF_RUN}" > "$RECEIPT_DIR/proof-run.json"
          test "$(jq -r '.status' "$RECEIPT_DIR/proof-run.json")" = completed
          test "$(jq -r '.conclusion' "$RECEIPT_DIR/proof-run.json")" = success
          gh api "/repos/${GH_REPOSITORY}/actions/runs/${PROOF_RUN}/artifacts?per_page=100" \
            > "$RECEIPT_DIR/proof-artifacts.json"
          jq --argjson id "$PROOF_ARTIFACT_ID" '.artifacts[] | select(.id == $id)' \
            "$RECEIPT_DIR/proof-artifacts.json" > "$RECEIPT_DIR/proof-artifact.json"
          test "$(jq -r '.name' "$RECEIPT_DIR/proof-artifact.json")" = pc51-exact-postmerge-proof-08288d
          test "$(jq -r '.digest' "$RECEIPT_DIR/proof-artifact.json")" = "$PROOF_ARTIFACT_DIGEST"
          test "$(jq -r '.expired' "$RECEIPT_DIR/proof-artifact.json")" = false

          gh api "/repos/${GH_REPOSITORY}/actions/runs/${FIRST_RETIREMENT_RUN}" \
            > "$RECEIPT_DIR/first-retirement-run.json"
          test "$(jq -r '.status' "$RECEIPT_DIR/first-retirement-run.json")" = completed
          test "$(jq -r '.conclusion' "$RECEIPT_DIR/first-retirement-run.json")" = failure

          cat > "$RECEIPT_DIR/expected-paths.txt" <<'EOF'
          .github/workflows/preference-custody-v49.yml
          .github/workflows/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.yml
          data/research/preference-custody/control-manifest-v49.json
          data/research/preference-custody/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.fixture.json
          docs/preference-custody-laboratory-floor-v49.md
          docs/preference-custody-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.md
          test/preference-custody-manifest-v49.test.js
          test/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.test.js
          tools/compile-preference-custody-manifest-v49.mjs
          tools/compile-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          tools/lib/preference-custody-manifest-v49.mjs
          tools/lib/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          tools/validate-preference-custody-manifest-v49.mjs
          tools/validate-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          EOF
          sed -i 's/^          //' "$RECEIPT_DIR/expected-paths.txt"
          sort -o "$RECEIPT_DIR/expected-paths.txt" "$RECEIPT_DIR/expected-paths.txt"
          : > "$RECEIPT_DIR/live-main-blob-identities.tsv"
          while IFS= read -r path; do
            MERGE_BLOB=$(git rev-parse "$MERGE_SHA:$path")
            MAIN_BLOB=$(git rev-parse "$CURRENT_MAIN:$path")
            test "$MERGE_BLOB" = "$MAIN_BLOB"
            printf '%s\t%s\n' "$path" "$MAIN_BLOB" >> "$RECEIPT_DIR/live-main-blob-identities.tsv"
          done < "$RECEIPT_DIR/expected-paths.txt"

          gh api --paginate "/repos/${GH_REPOSITORY}/git/matching-refs/heads/agent/pc51" \
            --jq '.[] | [.ref,.object.sha] | @tsv' | sed 's#^refs/heads/##' | sort \
            > "$RECEIPT_DIR/pc51-refs-before-receipt.tsv"
          test "$(wc -l < "$RECEIPT_DIR/pc51-refs-before-receipt.tsv" | tr -d ' ')" -eq 1
          test "$(cut -f1 "$RECEIPT_DIR/pc51-refs-before-receipt.tsv")" = "$SELF_BRANCH"
          test "$(cut -f2 "$RECEIPT_DIR/pc51-refs-before-receipt.tsv")" = "$SELF_HEAD"

          gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("agent/pc51")) | [.number,.head.ref,.head.sha] | @tsv' \
            | sort -n > "$RECEIPT_DIR/open-pc51-prs-before-receipt.tsv"
          test "$(wc -l < "$RECEIPT_DIR/open-pc51-prs-before-receipt.tsv" | tr -d ' ')" -eq 1
          test "$(cut -f1 "$RECEIPT_DIR/open-pc51-prs-before-receipt.tsv")" = "$SELF_PR"
          test "$(cut -f2 "$RECEIPT_DIR/open-pc51-prs-before-receipt.tsv")" = "$SELF_BRANCH"
          test "$(cut -f3 "$RECEIPT_DIR/open-pc51-prs-before-receipt.tsv")" = "$SELF_HEAD"

      - name: Close and self-delete the receipt lane
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method PATCH "/repos/${GH_REPOSITORY}/pulls/${SELF_PR}" -f state=closed >/dev/null
          gh api --method DELETE "/repos/${GH_REPOSITORY}/git/refs/heads/${SELF_BRANCH}" >/dev/null

          gh api --paginate "/repos/${GH_REPOSITORY}/git/matching-refs/heads/agent/pc51" \
            --jq '.[] | [.ref,.object.sha] | @tsv' | sed 's#^refs/heads/##' | sort \
            > "$RECEIPT_DIR/pc51-refs-after.tsv"
          test ! -s "$RECEIPT_DIR/pc51-refs-after.tsv"

          gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("agent/pc51")) | [.number,.head.ref,.head.sha] | @tsv' \
            | sort -n > "$RECEIPT_DIR/open-pc51-prs-after.tsv"
          test ! -s "$RECEIPT_DIR/open-pc51-prs-after.tsv"

      - name: Seal terminal census receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RECEIPT_DIR/original-refs-retired.txt" <<'EOF'
          agent/pc51-array-key-repair-carrier
          agent/pc51-ci-repro-export
          agent/pc51-clean-checkout-observer
          agent/pc51-clean-checkout-repair
          agent/pc51-clean-checkout-repair-v2
          agent/pc51-consolidated-repair-carrier
          agent/pc51-consolidated-repair-carrier-v2
          agent/pc51-consolidated-repair-executor-v2
          agent/pc51-export-base
          agent/pc51-materializer
          agent/pc51-product-carrier
          agent/pc51-repaired-head-qualifier
          agent/pc51-source-export
          agent/pc51-terminal-controller
          agent/pc51-v48-inherited-consistency-probe
          EOF
          sed -i 's/^          //' "$RECEIPT_DIR/original-refs-retired.txt"
          sort -o "$RECEIPT_DIR/original-refs-retired.txt" "$RECEIPT_DIR/original-refs-retired.txt"

          CURRENT_MAIN=$(cat "$RECEIPT_DIR/current-main.txt")
          CURRENT_MAIN="$CURRENT_MAIN" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/pc51-terminal-census-receipt')
          receipt = {
              'schema_version': 'pc51-terminal-census-receipt@1',
              'status': 'complete',
              'issue': 1268,
              'product_pr': 1277,
              'canonical_merge': os.environ['MERGE_SHA'],
              'product_commit': os.environ['PRODUCT_COMMIT'],
              'current_main_at_terminal_census': os.environ['CURRENT_MAIN'],
              'proof_run': int(os.environ['PROOF_RUN']),
              'proof_artifact_id': int(os.environ['PROOF_ARTIFACT_ID']),
              'proof_artifact_digest': os.environ['PROOF_ARTIFACT_DIGEST'],
              'first_retirement_run': int(os.environ['FIRST_RETIREMENT_RUN']),
              'first_retirement_result': 'substantive_cleanup_complete_then_redundant_second_self_delete_returned_422',
              'original_refs_retired': (root / 'original-refs-retired.txt').read_text().splitlines(),
              'original_ref_count_retired': 15,
              'never_merge_prs_closed': [
                  {'number': 1287, 'head': '4580dde9de794ae9e69b2b17fbf1a0b99886624d'},
                  {'number': 1308, 'head': 'f66eaf7c2cfeaa5db1c07fb58de299cf48287b44'},
              ],
              'receipt_lane_branch': os.environ['SELF_BRANCH'],
              'receipt_lane_head': os.environ['SELF_HEAD'],
              'receipt_lane_pr': int(os.environ['SELF_PR']),
              'receipt_lane_self_deleted': True,
              'residual_pc51_refs': 0,
              'residual_open_pc51_prs': 0,
              'canonical_product_blob_matches_on_live_main': 14,
              'outside_human_dependency': False,
              'graph_effect': 'none',
          }
          (root / 'terminal-census-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          tar -C "$RECEIPT_DIR" -czf "$RECEIPT_DIR/pc51-terminal-census-receipt.tar.gz" \
            terminal-census-receipt.json proof-run.json proof-artifact.json \
            first-retirement-run.json expected-paths.txt live-main-blob-identities.tsv \
            current-main.txt original-refs-retired.txt pc51-refs-before-receipt.tsv \
            pc51-refs-after.tsv open-pc51-prs-before-receipt.tsv open-pc51-prs-after.tsv
          sha256sum "$RECEIPT_DIR/pc51-terminal-census-receipt.tar.gz" \
            > "$RECEIPT_DIR/pc51-terminal-census-receipt.tar.gz.sha256"
          cat "$RECEIPT_DIR/terminal-census-receipt.json"
          cat "$RECEIPT_DIR/pc51-terminal-census-receipt.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: pc51-terminal-census-receipt-08288d
          path: /tmp/pc51-terminal-census-receipt
          if-no-files-found: error
          retention-days: 90
