name: Preference custody laboratory floor v17

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-allocation-formula.mjs'
      - 'tools/validate-preference-allocation-formula.mjs'
      - 'tools/compile-preference-custody-manifest-v17.mjs'
      - 'tools/validate-preference-custody-manifest-v17.mjs'
      - 'test/preference-allocation-formula.test.js'
      - 'test/preference-custody-manifest-v17.test.js'
      - 'docs/preference-custody-allocation-formula.md'
      - 'docs/preference-custody-laboratory-floor-v17.md'
      - '.github/workflows/preference-allocation-formula.yml'
      - '.github/workflows/preference-custody-v17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-19 and the compositional v17 floor
        run: |
          node tools/compile-preference-allocation-formula.mjs
          node tools/compile-preference-custody-manifest-v17.mjs
      - name: Validate allocation-formula and floor boundaries
        run: |
          node tools/validate-preference-allocation-formula.mjs
          node tools/validate-preference-custody-manifest-v17.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-allocation-formula.test.js
          node test/preference-custody-manifest-v17.test.js
      - name: Preserve deterministic v17 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v17
          path: |
            build/research/preference-allocation-formula.json
            build/research/preference-allocation-formula.md
            build/research/preference-custody-laboratory-floor-v17.json
            build/research/preference-custody-laboratory-floor-v17.md
          if-no-files-found: error
