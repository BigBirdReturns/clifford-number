name: Temporary PR 2231 V121 semantic qualification R3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v121-semantic-qualification-r3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

