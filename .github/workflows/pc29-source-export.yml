name: Temporary PC-29 current-main source export

on:
  pull_request:
    paths:
      - '.github/workflows/pc29-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export exact Preference Custody development surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess
          import tarfile

          prefixes = (
              'data/research/preference-custody/',
              'data/research/performative-synthetic-constituencies/',
              'tools/compile-preference-',
              'tools/validate-preference-',
              'tools/lib/preference-',
              'tools/lib/performative-synthetic-constituency.mjs',
              'test/preference-',
              'docs/preference-',
              '.github/workflows/preference-',
              '.github/workflows/no-magic-human',
          )
          exact = {
              'package.json',
              'package-lock.json',
              'tools/run-complete-gate.mjs',
              'tools/validate-no-magic-human.mjs',
          }

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          files = []
          for name in tracked:
              path = Path(name)
              if name in exact or name.startswith(prefixes):
                  if path.is_file():
                      files.append(path)
          files = sorted(set(files), key=lambda p: str(p))
          if not files:
              raise SystemExit('no Preference Custody files selected')

          with tarfile.open('pc29-current-main-source.tgz', 'w:gz') as archive:
              for path in files:
                  archive.add(path, arcname=str(path), recursive=False)

          ledger = []
          for path in files:
              raw = path.read_bytes()
              ledger.append({
                  'path': str(path),
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })
          receipt = {
              'head_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'file_count': len(files),
              'files': ledger,
          }
          Path('pc29-current-main-source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          Path('pc29-current-main-source.files.txt').write_text('\n'.join(map(str, files)) + '\n')
          print(f'exported {len(files)} exact files from {receipt["head_sha"]}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pc29-current-main-source
          path: |
            pc29-current-main-source.tgz
            pc29-current-main-source.json
            pc29-current-main-source.files.txt
          if-no-files-found: error
