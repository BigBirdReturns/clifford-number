name: Preference custody interference and exposure-mapping control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/interference-mapping.fixture.json'
      - 'tools/lib/preference-interference-mapping.mjs'
      - 'tools/compile-preference-interference-mapping.mjs'
      - 'tools/validate-preference-interference-mapping.mjs'
      - 'test/preference-interference-mapping.test.js'
      - 'docs/preference-custody-interference-mapping.md'
      - '.github/workflows/preference-interference-mapping.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interference-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile assignment, network, channel, exposure, interference, treatment, and succession worlds
        run: node tools/compile-preference-interference-mapping.mjs
      - name: Validate exposure mapping, spillover, topology, saturation, lineage, and authority boundaries
        run: node tools/validate-preference-interference-mapping.mjs
      - name: Exercise peer, institutional, cross-cluster, hidden-edge, version, rewiring, saturation, authority, and tamper fixtures
        run: node test/preference-interference-mapping.test.js
      - name: Preserve deterministic interference-mapping projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-interference-mapping-pc27
          path: |
            build/research/preference-interference-mapping.json
            build/research/preference-interference-mapping.md
          if-no-files-found: error
