name: Counter-Selector Wave 04 blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-04.yml'
      - 'data/project/counter-selector-wave-04-blind-review.json'
      - 'data/project/counter-selector-blind-review-registry.json'
      - 'data/project/counter-selector-review-disagreement-ledger.json'
      - 'data/project/counter-selector-wave-04-release-manifest.json'
      - 'schemas/counter-selector-blind-review.schema.json'
      - 'docs/methods/counter-selector-blind-review.md'
      - 'docs/milestones/counter-selector-wave-04.md'
      - 'tools/build-counter-selector-wave-04.mjs'
      - 'tools/validate-counter-selector-wave-04.mjs'
      - 'test/counter-selector-wave-04.test.js'
      - 'reports/core-thesis/counter-selector-wave-04/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-04.yml'
      - 'data/project/counter-selector-wave-04-blind-review.json'
      - 'data/project/counter-selector-blind-review-registry.json'
      - 'data/project/counter-selector-review-disagreement-ledger.json'
      - 'data/project/counter-selector-wave-04-release-manifest.json'
      - 'schemas/counter-selector-blind-review.schema.json'
      - 'docs/methods/counter-selector-blind-review.md'
      - 'docs/milestones/counter-selector-wave-04.md'
      - 'tools/build-counter-selector-wave-04.mjs'
      - 'tools/validate-counter-selector-wave-04.mjs'
      - 'test/counter-selector-wave-04.test.js'
      - 'reports/core-thesis/counter-selector-wave-04/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 04 products
        run: node tools/build-counter-selector-wave-04.mjs
      - name: Validate blind-review contract
        run: node tools/validate-counter-selector-wave-04.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-04.test.js
      - name: Require exact committed Wave 04 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-blind-review-registry.json \
            data/project/counter-selector-review-disagreement-ledger.json \
            data/project/counter-selector-wave-04-release-manifest.json \
            reports/core-thesis/counter-selector-wave-04/data.json \
            reports/core-thesis/counter-selector-wave-04/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 04 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-04.mjs
          node tools/validate-counter-selector-wave-04.mjs
          node test/counter-selector-wave-04.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
