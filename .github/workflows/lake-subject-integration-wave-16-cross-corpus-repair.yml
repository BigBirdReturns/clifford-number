name: Repair Wave 16 live inventory reconciliation

on:
  push:
    branches:
      - agent/lake-subject-integration-wave-16
    paths:
      - '.github/tmp/lake-subject-integration-wave-16-cross-corpus-repair-trigger.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile live inventory and harden execution routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          generator = Path('tools/apply-lake-subject-integration-wave-16-sources.mjs')
          text = generator.read_text()
          needle = """assert.equal(canonicalAdditions.length, policy.expected.new_canonical_records);
          assert.equal(organizationsDoc.organizations.length, policy.expected.canonical_organization_rows_after);
          writeJson('data/canonical/organizations.json', organizationsDoc);

          function effectiveTarget(decision) {"""
          replacement = """assert.equal(canonicalAdditions.length, policy.expected.new_canonical_records);
          assert.equal(organizationsDoc.organizations.length, policy.expected.canonical_organization_rows_after);
          writeJson('data/canonical/organizations.json', organizationsDoc);

          const crossCorpusMapPath = 'data/research/clifford-cross-corpus-public-interest-map.json';
          const crossCorpusMap = readJson(crossCorpusMapPath);
          assert.equal(crossCorpusMap.schema_version, 'clifford-cross-corpus-public-interest-map@1');
          assert.equal(crossCorpusMap.inventory?.canonical?.actors, actorsDoc.actors.length, 'cross-corpus actor inventory drift');
          assert.ok(
            [policy.baseline.canonical_organization_rows, policy.expected.canonical_organization_rows_after]
              .includes(crossCorpusMap.inventory?.canonical?.organizations),
            'cross-corpus organization inventory outside the bounded Wave 16 transition'
          );
          crossCorpusMap.generated_at = policy.as_of;
          crossCorpusMap.inventory.canonical.organizations = organizationsDoc.organizations.length;
          writeJson(crossCorpusMapPath, crossCorpusMap);

          function effectiveTarget(decision) {"""
          assert text.count(needle) == 1, {'generator_inventory_seam_occurrences': text.count(needle)}
          generator.write_text(text.replace(needle, replacement))

          policy_path = Path('data/project/lake-subject-integration-wave-16-policy.json')
          policy = json.loads(policy_path.read_text())
          inventory_path = 'data/research/clifford-cross-corpus-public-interest-map.json'
          if inventory_path not in policy['input_paths']:
              policy['input_paths'].append(inventory_path)
          policy['input_paths'] = sorted(policy['input_paths'])
          policy_path.write_text(json.dumps(policy, indent=2) + '\n')

          test_path = Path('test/lake-subject-integration-wave-16.test.js')
          test_text = test_path.read_text()
          test_needle = """const organizations = readJson('data/canonical/organizations.json').organizations;
          const activeIdentity = readJson('build/axm-identity.json');"""
          test_replacement = """const organizations = readJson('data/canonical/organizations.json').organizations;
          const crossCorpusMap = readJson('data/research/clifford-cross-corpus-public-interest-map.json');
          const activeIdentity = readJson('build/axm-identity.json');"""
          assert test_text.count(test_needle) == 1, {'test_inventory_import_occurrences': test_text.count(test_needle)}
          test_text = test_text.replace(test_needle, test_replacement)
          assertion_needle = """assert.equal(catalog.counts.generic_unresolved_subject_references, 0);

          function claim(caseId, claimId) {"""
          assertion_replacement = """assert.equal(catalog.counts.generic_unresolved_subject_references, 0);
          assert.equal(crossCorpusMap.inventory.canonical.organizations, policy.expected.canonical_organization_rows_after);
          assert.equal(crossCorpusMap.generated_at, policy.as_of);

          function claim(caseId, claimId) {"""
          assert test_text.count(assertion_needle) == 1, {'test_inventory_assertion_occurrences': test_text.count(assertion_needle)}
          test_path.write_text(test_text.replace(assertion_needle, assertion_replacement))

          workflow = Path('.github/workflows/lake-subject-integration-wave-16.yml')
          workflow_text = workflow.read_text()
          dollar = chr(36)
          old_group = f'  group: lake-subject-integration-wave-16-{dollar}{{{{ github.head_ref || github.ref_name }}}}'
          new_group = f'  group: lake-subject-integration-wave-16-{dollar}{{{{ github.event_name }}}}-{dollar}{{{{ github.head_ref || github.ref_name }}}}'
          if old_group in workflow_text:
              workflow_text = workflow_text.replace(old_group, new_group)
          else:
              assert new_group in workflow_text, 'Wave 16 event-separated concurrency group missing'

          old_mode = """          if test -f .github/tmp/lake-subject-integration-wave-16-trigger.json \\
            && { test \"$GITHUB_EVENT_NAME\" = 'push' || test \"$GITHUB_EVENT_NAME\" = 'pull_request'; }; then"""
          new_mode = """          if test \"$GITHUB_EVENT_NAME\" = 'push' \\
            && test -f .github/tmp/lake-subject-integration-wave-16-trigger.json; then"""
          if old_mode in workflow_text:
              workflow_text = workflow_text.replace(old_mode, new_mode)
          else:
              assert new_mode in workflow_text, 'Wave 16 push-only materialization mode missing'

          pr_anchor = "      - 'data/project/lake-subject-integration-wave-16-policy.json'\n"
          pr_line = "      - 'data/research/clifford-cross-corpus-public-interest-map.json'\n"
          if pr_line not in workflow_text:
              assert workflow_text.count(pr_anchor) == 1
              workflow_text = workflow_text.replace(pr_anchor, pr_anchor + pr_line)

          hash_anchor = "            data/canonical/organizations.json \\\n"
          hash_line = "            data/research/clifford-cross-corpus-public-interest-map.json \\\n"
          if hash_line not in workflow_text:
              assert workflow_text.count(hash_anchor) == 1
              workflow_text = workflow_text.replace(hash_anchor, hash_anchor + hash_line)

          required_anchor = "              'data/canonical/organizations.json',\n"
          required_line = "              'data/research/clifford-cross-corpus-public-interest-map.json',\n"
          if required_line not in workflow_text:
              assert workflow_text.count(required_anchor) == 1
              workflow_text = workflow_text.replace(required_anchor, required_anchor + required_line)
          workflow.write_text(workflow_text)
          PY
          node --check tools/apply-lake-subject-integration-wave-16-sources.mjs
          node --check test/lake-subject-integration-wave-16.test.js
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/lake-subject-integration-wave-16.yml').read_text())
          PY
          rm -f \
            .github/tmp/lake-subject-integration-wave-16-concurrency-repair-trigger.json \
            .github/workflows/lake-subject-integration-wave-16-concurrency-repair.yml \
            .github/tmp/lake-subject-integration-wave-16-cross-corpus-repair-trigger.json \
            .github/workflows/lake-subject-integration-wave-16-cross-corpus-repair.yml
          git diff --check
      - name: Commit and publish the inventory repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile Wave 16 live canonical inventory'
          git fetch origin agent/lake-subject-integration-wave-16
          test "$(git rev-parse origin/agent/lake-subject-integration-wave-16)" = "${{ github.sha }}"
          git push origin HEAD:agent/lake-subject-integration-wave-16
