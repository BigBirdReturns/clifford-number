name: M-05 network-peer product materializer

on:
  push:
    branches:
      - agent/m05-s03-l7-network-peer-materializer-v1
    paths:
      - '.tmp/m05-network-peer/**'
      - '.github/workflows/m05-network-peer-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-network-peer-materializer-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize exact network-peer product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .tmp/m05-network-peer/materialize.mjs
