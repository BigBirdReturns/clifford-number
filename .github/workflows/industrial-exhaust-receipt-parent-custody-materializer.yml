name: Industrial-exhaust receipt parent-custody materializer

on:
  push:
    branches:
      - agent/industrial-exhaust-receipt-parent-custody-controller-v1
    paths:
      - .github/workflows/industrial-exhaust-receipt-parent-custody-materializer.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/industrial-exhaust-receipt-parent-custody-materializer.yml

permissions:
  contents: write

concurrency:
  group: industrial-exhaust-receipt-parent-custody-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/industrial-exhaust-receipt-parent-custody-controller-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reproduce, repair, qualify, and publish the bounded product
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='bd66952df64b7eef2e673af724e922ad3f6a719a'
          PRODUCT_BRANCH='agent/industrial-exhaust-receipt-parent-custody-v1'
          WORKFLOW_PATH='.github/workflows/industrial-exhaust-receipt-parent-custody-materializer.yml'
          LIB_PATH='tools/lib/industrial-exhaust-artifacts.mjs'
          TEST_PATH='test/industrial-exhaust-retained-store-custody.test.js'

          current_sha="$(git rev-parse HEAD)"
          test "$(git merge-base "$BASE_SHA" "$current_sha")" = "$BASE_SHA"
          mapfile -t controller_diff < <(git diff --name-only "$BASE_SHA" "$current_sha")
          test "${#controller_diff[@]}" -eq 1
          test "${controller_diff[0]}" = "$WORKFLOW_PATH"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

          printf '%s' '' | base64 -d | gzip -d > /tmp/materialize-parent-custody.py
          test "$(sha256sum /tmp/materialize-parent-custody.py | cut -d' ' -f1)" = '117b67fb8324b904e2465d0390d73c0c1297e3e2c139daff2fda61f6b8784204'
          python /tmp/materialize-parent-custody.py
          rm "$WORKFLOW_PATH"

          node --check "$LIB_PATH"
          node --check "$TEST_PATH"
          node "$TEST_PATH"
          node test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node tools/hydrate-industrial-exhaust.mjs --audit
          git diff --check

          mapfile -t product_diff < <(git diff --name-only "$BASE_SHA")
          test "${#product_diff[@]}" -eq 2
          test "${product_diff[0]}" = "$TEST_PATH"
          test "${product_diff[1]}" = "$LIB_PATH"
          mapfile -t worktree_status < <(git status --porcelain)
          test "${#worktree_status[@]}" -eq 3
          printf '%s\n' "${worktree_status[@]}" | grep -Fxq " D $WORKFLOW_PATH"
          printf '%s\n' "${worktree_status[@]}" | grep -Fxq " M $TEST_PATH"
          printf '%s\n' "${worktree_status[@]}" | grep -Fxq " M $LIB_PATH"

          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test -z "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH")"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          product_sha="$(
            printf '%s\n\n%s\n' \
              'fix(industrial-exhaust): bind receipt publication to directory custody' \
              'Anchor creation and no-overwrite publication to authenticated directory descriptors, synchronize directory entries, and reject parent replacement without external mutation.' \
              | git commit-tree "$tree_sha" -p "$BASE_SHA"
          )"
          mapfile -t committed_diff < <(git diff --name-only "$BASE_SHA" "$product_sha")
          test "${#committed_diff[@]}" -eq 2
          test "${committed_diff[0]}" = "$TEST_PATH"
          test "${committed_diff[1]}" = "$LIB_PATH"
          git diff --check "$BASE_SHA" "$product_sha"

          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git push origin "$product_sha:refs/heads/$PRODUCT_BRANCH"
          echo "PRODUCT_SHA=$product_sha"
