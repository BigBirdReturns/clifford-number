name: TEMP supervise and terminalize exact PC-58 transaction v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pc58-terminal-supervisor-v2
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      API_URL: ${{ github.api_url }}
      ISSUE: '1592'
      PRODUCT_PR: '1624'
      PRODUCT: '2536579f40f1ebd815adfd10a3258c737858aa65'
      PRODUCT_PARENT: '79a7e18bfd45f1b1d893fa8b9683710891d4bbca'
      PRODUCT_TREE: 'faade2f2232c55da296bc97a6a0977ed1f66d302'
      CANONICAL_MERGE: 'a592acea22c69a979f2a90c24a2bafb8c9445759'
      MERGE_FIRST_PARENT: 'b1d1d8afb6c957401a762bf9d0b2abc464bd5e07'
      PROOF_RUN: '31287624592'
      PROOF_ARTIFACT_ID: '9030468581'
      PROOF_ARTIFACT_DIGEST: 'sha256:6fb45a60f1e03cf2e043221c06074708d8567763b2c5dfa8a5d7804b721ef45c'
      PROOF_ZIP_SHA256: '6fb45a60f1e03cf2e043221c06074708d8567763b2c5dfa8a5d7804b721ef45c'
      PROOF_DIR: '/tmp/pc58-sealed-proof'
      CENSUS_DIR: '/tmp/pc58-terminal-census'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Authenticate proof and retire PC-58 execution surfaces
        shell: bash
        run: bash .tmp/pc58/terminalize.sh cleanup
      - name: Upload terminal census
        id: census
        uses: actions/upload-artifact@v4
        with:
          name: pc58-terminal-census
          path: /tmp/pc58-terminal-census
          if-no-files-found: error
          retention-days: 90
      - name: Write terminal receipt and close issue
        shell: bash
        env:
          CENSUS_ARTIFACT_ID: ${{ steps.census.outputs.artifact-id }}
          CENSUS_ARTIFACT_DIGEST: ${{ steps.census.outputs.artifact-digest }}
        run: bash .tmp/pc58/terminalize.sh receipt
