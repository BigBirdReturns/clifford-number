name: Temporary Wave 32 sealed-tree export

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/tmp/wave32-sealed-tree-export-trigger.json'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-wave32-sealed-tree-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave32-sealed-tree-export.yml'
          encoded_ref='agent%2Flake-allocator-war-snapshot-wave-32'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 32 sealed-tree workflow was not deleted before checkout' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-snapshot-wave-32
          fetch-depth: 0
      - name: Create exact Wave 32 source checkpoint archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/wave32-source-head.txt
          git status --porcelain > /tmp/wave32-source-status.txt
          tar --exclude='.git' -czf /tmp/wave32-source-tree.tar.gz .
          sha256sum /tmp/wave32-source-tree.tar.gz > /tmp/wave32-source-tree.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wave32-source-tree
          path: |
            /tmp/wave32-source-tree.tar.gz
            /tmp/wave32-source-tree.sha256
            /tmp/wave32-source-head.txt
            /tmp/wave32-source-status.txt
          if-no-files-found: error
          retention-days: 1
