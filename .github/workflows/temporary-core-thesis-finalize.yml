name: Temporary finalize core thesis realignment

on:
  push:
    branches:
      - agent/core-thesis-conversion-architecture-v2
    paths:
      - '.github/workflows/temporary-core-thesis-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: core-thesis-publication
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: '127'
      BRANCH: agent/core-thesis-conversion-architecture-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-thesis-conversion-architecture-v2
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile and validate the durable thesis
        run: |
          set -euo pipefail
          node tools/build-core-thesis.mjs
          node tools/validate-core-thesis.mjs
          node test/core-thesis.test.js
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('build/core-thesis/manifest.json', 'utf8'));
          const expected = {
            phases: 5,
            conversion_stages: 7,
            intentionality_levels: 6,
            archetypes: 10,
            report_contracts: 7,
            visualization_contracts: 7,
            estates: 24
          };
          if (JSON.stringify(manifest.counts) !== JSON.stringify(expected)) {
            throw new Error(`core-thesis counts drifted: ${JSON.stringify(manifest.counts)}`);
          }
          if (manifest.graph_effect !== 'none' || manifest.conclusion_generated !== false) {
            throw new Error('core-thesis boundary drifted');
          }
          NODE
      - name: Commit the permanent source and deterministic products
        run: |
          set -euo pipefail
          rm -f data/project/.core-thesis-branch-probe
          rm -f .github/workflows/temporary-core-thesis-materialize.yml
          rm -f .github/workflows/temporary-core-thesis-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize the durable core thesis and project realignment'
          fi
      - name: Run the complete release gate on the committed tree
        run: npm run release:check
      - name: Publish the exact branch state
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
      - name: Wait for exact-head pull-request checks
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            count=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name 2>/dev/null | jq 'length' || echo 0)
            if [ "$count" -gt 0 ]; then
              break
            fi
            sleep 5
          done
          gh pr checks "$PR_NUMBER" --repo "$REPO" --watch --fail-fast
      - name: Merge the reviewed engineering realignment
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$REPO" 2>/dev/null || true
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --delete-branch
      - name: Open the next implementation lanes
        run: |
          set -euo pipefail
          cat > /tmp/m04b.md <<'EOF'
          ## Objective

          Implement first-class, receipt-resolving objects for problem frames, role claims, option-set snapshots, conversion events, control rights, dependency and compulsion states, residual-value positions, intent records, and reversibility tests.

          ## Acceptance

          - Objects resolve to canonical claims, events, instruments, identities, and receipts.
          - Missing transitions remain open joins.
          - No object creates a graph edge or finding by itself.
          - At least the Anduril and Arcadia cases compile through the new kernel.

          ```text
          graph_effect: none
          conclusion_generated: false
          ```
          EOF
          gh issue create --repo "$REPO" --title 'M-04B · Build the conversion-ledger kernel' --body-file /tmp/m04b.md

          cat > /tmp/m04c.md <<'EOF'
          ## Objective

          Build the control-rights and exit atlas, then migrate the first comparative conversion reports: Anduril, Palantir, UK AI policy, Arcadia, and public money/industrial policy.

          ## Required surfaces

          - doctrine-to-deployment
          - option-set narrowing
          - role stacking
          - control rights
          - public risk and private residuals
          - compulsion, appeal, substitution, termination, and exit
          - falsifiers, ordinary comparators, and unsuccessful paths

          No report may self-promote or generate a conclusion.
          EOF
          gh issue create --repo "$REPO" --title 'M-04C · Build the control-rights atlas and migrate priority reports' --body-file /tmp/m04c.md
