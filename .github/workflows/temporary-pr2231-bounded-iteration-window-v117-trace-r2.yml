name: Temporary PR 2231 bounded-iteration-window V117 trace R2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  trace-bounded-iteration-v117:
    if: github.event.pull_request.head.ref == 'agent/pr2231-bounded-iteration-window-v117-trace-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      EXPECTED_MAIN: 771a64b6b467748d2f4df667b5f78e76f9432d69
      EXPECTED_PRODUCT: 0c0ec19938e76d83d646c79d02bea9a724e6773b
      EXPECTED_PRODUCT_TREE: 326186e534735e8fc108c3bb7cab115d5db08dce
      EXPECTED_LIBRARY: 123b88403265fa4193a44a97b27aebc7661c1528
      EXPECTED_TEST: a71e670bbf85a399e02a184e0a8fce19d127bfaf
      EXPECTED_REVIEW_ID: '5072486871'
      EXPECTED_REVIEW_COMMENT: '3899391565'
      CONTROLLER_BRANCH: agent/pr2231-bounded-iteration-window-v117-trace-r2
      CONTROLLER_WORKFLOW: .github/workflows/temporary-pr2231-bounded-iteration-window-v117-trace-r2.yml
      ARTIFACT_DIR: /tmp/pr2231-bounded-iteration-window-v117-trace-r2
    steps:
      - name: Check out exact trace controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and trace the failed V117 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d=/tmp/pr2231-v117-trace-envelope
          work=/tmp/pr2231-v117-trace-product
          rm -rf "$d" "$work" "$ARTIFACT_DIR"
          mkdir -p "$d" "$ARTIFACT_DIR"
          exec > >(tee "$ARTIFACT_DIR/trace-controller.log") 2>&1
          trap 'rc=$?; trap - EXIT; printf "trace_exit=%s\n" "$rc" > "$ARTIFACT_DIR/trace-status.env"; exit "$rc"' EXIT

          controller_head="$(git rev-parse HEAD)"
          controller_parent="$(git rev-parse HEAD^)"
          test "$controller_parent" = "$EXPECTED_MAIN"
          mapfile -t controller_paths < <(git diff --name-only "$EXPECTED_MAIN" "$controller_head")
          test "${#controller_paths[@]}" -eq 1
          test "${controller_paths[0]}" = "$CONTROLLER_WORKFLOW"

          gh api "repos/$REPO/pulls/$CONTROLLER_PR" > "$ARTIFACT_DIR/controller-pr-before.json"
          jq -e --arg head "$controller_head" --arg base "$EXPECTED_MAIN" '
            .state == "open"
            and .draft == true
            and .merged == false
            and .head.sha == $head
            and .base.sha == $base
          ' "$ARTIFACT_DIR/controller-pr-before.json" >/dev/null
          gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$ARTIFACT_DIR/product-pr-before.json"
          jq -e --arg head "$EXPECTED_PRODUCT" --arg base "$EXPECTED_MAIN" '
            .state == "open"
            and .draft == true
            and .merged == false
            and .head.sha == $head
            and .base.sha == $base
          ' "$ARTIFACT_DIR/product-pr-before.json" >/dev/null
          gh api "repos/$REPO/pulls/comments/$EXPECTED_REVIEW_COMMENT" \
            > "$ARTIFACT_DIR/review-comment-before.json"
          jq -e --argjson review "$EXPECTED_REVIEW_ID" --arg head "$EXPECTED_PRODUCT" '
            .pull_request_review_id == $review
            and .commit_id == $head
            and (.body | contains("Stop rebuilding the shrinking candidate in the iterative loop"))
          ' "$ARTIFACT_DIR/review-comment-before.json" >/dev/null

          : > "$d/v117-candidate.patch.b64"
          while IFS=: read -r blob size digest; do
            gh api "repos/$REPO/git/blobs/$blob" --jq .content \
              | tr -d '\n' | base64 -d > "$d/$blob.chunk"
            test "$(wc -c < "$d/$blob.chunk")" = "$size"
            test "$(sha256sum "$d/$blob.chunk" | awk '{print $1}')" = "$digest"
            test "$(git hash-object "$d/$blob.chunk")" = "$blob"
            cat "$d/$blob.chunk" >> "$d/v117-candidate.patch.b64"
          done <<'V117_TRACE_CHUNKS'
          dc1b343fea482a0c8a4c9753f21bae72e3f78cd1:1500:1a1737e08b9dadaeb87f0ead9bdd65646f4699e0d46f7706080523ddf4ceb8e8
          b25e1019a00437328666ae1c45d46a5783ed23fa:1500:09c4de150c3eca1bf5d5f146dedaf233d54197b96182bdc0afc9478810c66dee
          a3851eea2a02d79ea99f4e518568a687d55b693d:1500:8f4e42625e3573537aeaf3af49c9eda82ad2208fa877c4f2cb3c08ba0b4ca834
          6c0a9217d3c34be2461304e58d963bcc4dd50040:1500:d156b8f12e2e805831084f5b5aa5c478e85cb71e2359f6cf17d29dae27b710da
          18559d99a1f48c846f17d6eb68c8970b441f8bc9:1500:d7bc49c45adaa0cff81454b438748d6373af880a92a90194274dd295a1d21b34
          bb3204c6ac5fd5656a6e0a2c979a59487e82d626:1500:e1361650e89d2478b4e0ce58ddd31e79ccdc48ed69b7761c1a19f6cfe945fc4b
          9ee3194303e67e385e3b5fb00b007d2ae49e48a5:20:c09b8c2dd47df52a069907434c7204a0e9bc77c79f790ffc1b0526b00ea37e00
          V117_TRACE_CHUNKS
          test "$(wc -c < "$d/v117-candidate.patch.b64")" = '9020'
          base64 -d "$d/v117-candidate.patch.b64" > "$d/v117-candidate.patch"
          test "$(wc -c < "$d/v117-candidate.patch")" = '6764'
          test "$(sha256sum "$d/v117-candidate.patch" | awk '{print $1}')" = \
            'feecadc50dbafdc7e65cb052f02768e35de4fe429d32aadbe3887042771e0f85'
          test "$(git hash-object "$d/v117-candidate.patch")" = \
            '7564364b6512b3e79e2ca0c2ad7dc13200cc3b96'
          cp "$d/v117-candidate.patch" "$ARTIFACT_DIR/"

          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$EXPECTED_PRODUCT"
          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          git cat-file -e "$EXPECTED_PRODUCT^{commit}"
          test "$(git rev-parse "$EXPECTED_PRODUCT^{tree}")" = "$EXPECTED_PRODUCT_TREE"
          test "$(git rev-parse "$EXPECTED_PRODUCT:tools/lib/industrial-exhaust.mjs")" = "$EXPECTED_LIBRARY"
          test "$(git rev-parse "$EXPECTED_PRODUCT:test/industrial-exhaust.test.js")" = "$EXPECTED_TEST"
          git worktree add --detach "$work" "$EXPECTED_PRODUCT"
          cd "$work"
          test -z "$(git status --porcelain=v1)"
          cp tools/lib/industrial-exhaust.mjs "$ARTIFACT_DIR/baseline-industrial-exhaust.mjs"
          cp test/industrial-exhaust.test.js "$ARTIFACT_DIR/baseline-industrial-exhaust.test.js"

          git apply --check "$d/v117-candidate.patch"
          git apply "$d/v117-candidate.patch"
          git diff --check
          mapfile -t candidate_paths < <(git diff --name-only)
          test "${#candidate_paths[@]}" -eq 2
          test "${candidate_paths[0]}" = 'test/industrial-exhaust.test.js'
          test "${candidate_paths[1]}" = 'tools/lib/industrial-exhaust.mjs'
          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = \
            '56ec216c3b9d333238af20feef029a079e702b08'
          test "$(git hash-object test/industrial-exhaust.test.js)" = \
            '90d552d49fcf06610566d8d475dd0b268594f1b6'
          cp tools/lib/industrial-exhaust.mjs "$ARTIFACT_DIR/candidate-industrial-exhaust.mjs"
          cp test/industrial-exhaust.test.js "$ARTIFACT_DIR/candidate-industrial-exhaust.test.js"

          python - "$work" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          path = root / 'tools/lib/industrial-exhaust.mjs'
          source = path.read_text()
          source_needle = """  const sourceCandidate = candidate;
            const allGroups = [...sourceCandidate.matchAll(DIGIT_RUN_PATTERN)];
          """
          source_replacement = """  const sourceCandidate = candidate;
            const traceWindowProgression =
              process.env.PR2231_V117_TRACE === '1';
            const allGroups = [...sourceCandidate.matchAll(DIGIT_RUN_PATTERN)];
          """
          if source.count(source_needle) != 1:
              raise SystemExit('trace source-candidate lease failed')
          source = source.replace(source_needle, source_replacement, 1)

          decision_needle = """      if (windowEnd >= sourceCandidate.length) break;

                const safeGroup = Math.max(
                  firstGroup,
                  lastGroupExclusive - guardGroups
                );
                const safeEnd = allGroups[safeGroup].index - sourceOffset;
                const localRanges = Array.isArray(result)
                  ? result
                  : result.ranges;
                const boundedContinuation = !Array.isArray(result)
                  && result.next
                  && result.next.offset > 0
                  && result.next.offset <= localCandidate.length
                  && result.next.offset <= safeEnd
                  && localRanges.every(
                    range => range.end <= result.next.offset
                  );
                if (boundedContinuation) {
          """
          decision_replacement = """      const atSourceEnd = windowEnd >= sourceCandidate.length;
                const localRanges = Array.isArray(result)
                  ? result
                  : result.ranges;
                if (atSourceEnd) {
                  if (traceWindowProgression && sourceOffset < 256) {
                    console.error('V117_WINDOW_TRACE ' + JSON.stringify({
                      sourceOffset,
                      firstGroup,
                      remainingGroups,
                      windowGroupSpan,
                      lastGroupExclusive,
                      windowEnd,
                      atSourceEnd,
                      resultKind: Array.isArray(result) ? 'array' : 'continuation',
                      nextOffset: Array.isArray(result)
                        ? null
                        : result.next?.offset ?? null,
                      safeEnd: null,
                      rangeEnds: localRanges.map(range => range.end),
                      boundedContinuation: false
                    }));
                  }
                  break;
                }

                const safeGroup = Math.max(
                  firstGroup,
                  lastGroupExclusive - guardGroups
                );
                const safeEnd = allGroups[safeGroup].index - sourceOffset;
                const boundedContinuation = !Array.isArray(result)
                  && result.next
                  && result.next.offset > 0
                  && result.next.offset <= localCandidate.length
                  && result.next.offset <= safeEnd
                  && localRanges.every(
                    range => range.end <= result.next.offset
                  );
                if (traceWindowProgression && sourceOffset < 256) {
                  console.error('V117_WINDOW_TRACE ' + JSON.stringify({
                    sourceOffset,
                    firstGroup,
                    remainingGroups,
                    windowGroupSpan,
                    lastGroupExclusive,
                    windowEnd,
                    atSourceEnd,
                    resultKind: Array.isArray(result) ? 'array' : 'continuation',
                    nextOffset: Array.isArray(result)
                      ? null
                      : result.next?.offset ?? null,
                    safeEnd,
                    rangeEnds: localRanges.map(range => range.end),
                    boundedContinuation
                  }));
                }
                if (boundedContinuation) {
          """
          if source.count(decision_needle) != 1:
              raise SystemExit('trace decision lease failed')
          source = source.replace(decision_needle, decision_replacement, 1)
          path.write_text(source)
          PY
          node --check tools/lib/industrial-exhaust.mjs
          cp tools/lib/industrial-exhaust.mjs "$ARTIFACT_DIR/instrumented-industrial-exhaust.mjs"

          PR2231_V117_TRACE=1 timeout 45s node --input-type=module <<'NODE' \
            2>&1 | tee "$ARTIFACT_DIR/window-trace.log"
          import assert from 'node:assert/strict';
          import { performance } from 'node:perf_hooks';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          const unit = '09012345678/2026-08-17-03-6216-8041 ';
          const expectedUnit = '[contact omitted]/2026-08-17-[contact omitted] ';
          for (const repetitions of [16, 64, 256]) {
            const input = `Archive ${unit.repeat(repetitions)}`;
            const expected = `Archive ${expectedUnit.repeat(repetitions)}`;
            const started = performance.now();
            const output = redactContactData(input);
            const milliseconds = performance.now() - started;
            assert.equal(output, expected);
            console.log(JSON.stringify({ repetitions, milliseconds }));
          }
          console.log('TRACE_OUTPUT_SUCCESS');
          NODE

          cd "$GITHUB_WORKSPACE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$EXPECTED_PRODUCT"
          test "$(git ls-remote origin "refs/heads/$CONTROLLER_BRANCH" | awk '{print $1}')" = "$controller_head"
          gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$ARTIFACT_DIR/product-pr-after.json"
          jq -e --arg head "$EXPECTED_PRODUCT" --arg base "$EXPECTED_MAIN" '
            .state == "open"
            and .draft == true
            and .merged == false
            and .head.sha == $head
            and .base.sha == $base
          ' "$ARTIFACT_DIR/product-pr-after.json" >/dev/null
          {
            printf 'PUBLICATION_SKIPPED\n'
            printf 'PRODUCT_MUTATION_SKIPPED\n'
            printf 'REVIEW_MUTATION_SKIPPED\n'
            printf 'TRACE_SUCCESS\n'
          } | tee "$ARTIFACT_DIR/terminal.txt"

      - name: Upload V117 trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-bounded-iteration-window-v117-trace-r2
          path: /tmp/pr2231-bounded-iteration-window-v117-trace-r2
          if-no-files-found: error
          retention-days: 90
