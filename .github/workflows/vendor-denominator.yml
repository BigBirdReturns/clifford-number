name: Vendor denominator

on:
  pull_request:
    paths:
      - 'data/research/denominators/**'
      - 'data/research/thesis-evidence/**'
      - 'tools/lib/vendor-denominator.mjs'
      - 'tools/compile-vendor-denominator.mjs'
      - 'tools/validate-vendor-denominator.mjs'
      - 'test/vendor-denominator.test.js'
      - 'test/thesis-assembly.test.js'
      - 'docs/synthetic-population-vendor-denominator.md'
      - 'package.json'
      - '.github/workflows/vendor-denominator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-denominator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile blocked denominator ledger
        run: npm run compile:denominator
      - name: Validate source custody and promotion gate
        run: npm run validate:denominator
      - name: Compile updated thesis coverage state
        run: npm run compile:thesis
      - name: Validate updated thesis coverage state
        run: npm run validate:thesis
      - name: Exercise denominator and thesis boundaries
        run: |
          node test/vendor-denominator.test.js
          node test/thesis-assembly.test.js
      - name: Preserve deterministic recovery projections
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-population-denominator-lock
          path: |
            build/research/synthetic-population-vendor-denominator.json
            build/research/synthetic-population-vendor-denominator.md
            build/thesis/synthetic-population-infrastructure.json
            build/thesis/synthetic-population-infrastructure.md
          if-no-files-found: error
