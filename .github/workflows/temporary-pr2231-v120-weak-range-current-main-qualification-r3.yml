    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v120-weak-range-current-main-qualification-r3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

