name: Materialize Counter-Selector Wave 20

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-20.yml'
      - '.github/materializers/counter-selector-wave-20/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-20-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-20-exception-falsification

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify carrier and unpack exact Wave 20 estate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave20-expected-blobs <<'EOF'
          07e9db38390207be6afd3a8b76ce7da338d4fb7c  .github/materializers/counter-selector-wave-20/payload-000
          097b00fccaad0e7118ec374b3e7f7c9c67ca1671  .github/materializers/counter-selector-wave-20/payload-001
          ff70ba645f17c3bb8bb1234f0f28aef5f1a7a337  .github/materializers/counter-selector-wave-20/payload-002
          71795c4b025098cc02688ceb583af1af4946289c  .github/materializers/counter-selector-wave-20/payload-003
          56634ee283aaa3695048b079328e79671d4bb04d  .github/materializers/counter-selector-wave-20/payload-004-00
          5bccc7693dcb1748332929b8d85f2dce1f836c29  .github/materializers/counter-selector-wave-20/payload-004-01
          0e40c152f1600cab80e62c00be674632f9ebcaf3  .github/materializers/counter-selector-wave-20/payload-004-02
          f9449ce93155d8e297b161d66b0c04df48203b6c  .github/materializers/counter-selector-wave-20/payload-004-03
          f7efa4788178b6ac12cda81622065b4a72946e92  .github/materializers/counter-selector-wave-20/payload-004-04
          4b25f00403764e6713b599fc535fdfb8b3f66af5  .github/materializers/counter-selector-wave-20/payload-004-05
          b905c17a7b7fa574c776ed1a12ff55f142a456c1  .github/materializers/counter-selector-wave-20/payload-005
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave20-expected-blobs

          cat .github/materializers/counter-selector-wave-20/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-20.tar.gz
          echo '56d2aaa705056b3a1310ba121f359cf3f62b47475d92e8ceaa1a710642558a92  /tmp/counter-selector-wave-20.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-20.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-20

      - name: Build, validate, and attack Wave 20
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-20.mjs
          node tools/validate-counter-selector-wave-20.mjs
          node test/counter-selector-wave-20.test.js

      - name: Commit exact permanent non-workflow Wave 20 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/materializers/counter-selector-wave-20 \
            data/project/counter-selector-wave-20-exception-falsification.json \
            data/project/counter-selector-exception-falsification-registry.json \
            data/project/counter-selector-wave-20-external-review-export-registry.json \
            data/project/counter-selector-wave-20-release-manifest.json \
            schemas/counter-selector-exception-falsification.schema.json \
            docs/methods/counter-selector-exception-falsification.md \
            docs/milestones/counter-selector-wave-20.md \
            tools/build-counter-selector-wave-20.mjs \
            tools/validate-counter-selector-wave-20.mjs \
            test/counter-selector-wave-20.test.js \
            reports/core-thesis/counter-selector-wave-20/data.json \
            reports/core-thesis/counter-selector-wave-20/index.html
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-20/payload-000 \
            .github/materializers/counter-selector-wave-20/payload-001 \
            .github/materializers/counter-selector-wave-20/payload-002 \
            .github/materializers/counter-selector-wave-20/payload-003 \
            .github/materializers/counter-selector-wave-20/payload-004-00 \
            .github/materializers/counter-selector-wave-20/payload-004-01 \
            .github/materializers/counter-selector-wave-20/payload-004-02 \
            .github/materializers/counter-selector-wave-20/payload-004-03 \
            .github/materializers/counter-selector-wave-20/payload-004-04 \
            .github/materializers/counter-selector-wave-20/payload-004-05 \
            .github/materializers/counter-selector-wave-20/payload-005 \
            data/project/counter-selector-wave-20-exception-falsification.json \
            data/project/counter-selector-exception-falsification-registry.json \
            data/project/counter-selector-wave-20-external-review-export-registry.json \
            data/project/counter-selector-wave-20-release-manifest.json \
            schemas/counter-selector-exception-falsification.schema.json \
            docs/methods/counter-selector-exception-falsification.md \
            docs/milestones/counter-selector-wave-20.md \
            tools/build-counter-selector-wave-20.mjs \
            tools/validate-counter-selector-wave-20.mjs \
            test/counter-selector-wave-20.test.js \
            reports/core-thesis/counter-selector-wave-20/data.json \
            reports/core-thesis/counter-selector-wave-20/index.html | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Advance Counter-Selector Wave 20 exception falsification'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 20 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-20.mjs
          node tools/validate-counter-selector-wave-20.mjs
          node test/counter-selector-wave-20.test.js
          git diff --exit-code
          unexpected="$(git status --porcelain | grep -v '^?? .github/workflows/counter-selector-wave-20.yml$' || true)"
          test -z "$unexpected"
          rm -f .github/workflows/counter-selector-wave-20.yml

      - name: Publish permanent non-workflow Wave 20 head
        run: git push origin HEAD:agent/counter-selector-wave-20-exception-falsification
