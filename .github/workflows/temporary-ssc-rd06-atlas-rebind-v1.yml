name: TEMP rebind RD-06 to current Wave-02 atlas

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd06-atlas-rebind-base-v1
    paths:
      - '.github/tmp/ssc-rd06-atlas-rebind.trigger'

permissions:
  contents: write

concurrency:
  group: ssc-rd06-atlas-rebind-v1
  cancel-in-progress: false

jobs:
  rebind:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-atlas-rebind-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET_BRANCH: agent/ssc-rd-wave02-rd06-offeror-universe
      EXPECTED_TARGET: e6bf637f99e22fdb9ec9b5c86f9d9a611219a5d7
      EXPECTED_MAIN: eba618a72a71ebc52e3c3462e2f00cfa1010b7d6
    steps:
      - name: Checkout checksum-bound controller
        uses: actions/checkout@v4
        with:
          path: controller
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout exact clean RD-06 head
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd06-offeror-universe
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Rebind exact seven-path product
        run: |
          set -Eeuo pipefail
          test "$(git -C work rev-parse HEAD)" = "$EXPECTED_TARGET"
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET"
          test "$(git -C work ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

          cd work
          python ../controller/.github/tmp/ssc-rd06-atlas-rebind.py
          node tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          node test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check

          cat > /tmp/rd06-rebind-paths.txt <<'PATHS'
          data/project/ssc-residual-wave02/closures/RD-06-C01.json
          data/research/status-sovereignty-rd-wave02-rd06-offeror-universe/class-receipt.json
          data/research/status-sovereignty-rd-wave02-rd06-offeror-universe/manifest.json
          docs/milestones/ssc-rd-wave02-rd06-offeror-universe.md
          test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js
          tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          PATHS
          sed -i 's/^          //' /tmp/rd06-rebind-paths.txt
          sort /tmp/rd06-rebind-paths.txt > /tmp/rd06-expected-paths.txt
          git diff --name-only | sort > /tmp/rd06-observed-paths.txt
          cmp /tmp/rd06-expected-paths.txt /tmp/rd06-observed-paths.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --pathspec-from-file=/tmp/rd06-rebind-paths.txt
          git diff --cached --name-only | sort > /tmp/rd06-staged-paths.txt
          cmp /tmp/rd06-expected-paths.txt /tmp/rd06-staged-paths.txt
          git commit -m 'Rebind RD-06 closure to current Wave-02 atlas'
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run complete qualification and clean replay
        run: |
          set -Eeuo pipefail
          cd work
          npm run release:check
          git restore --staged --worktree .
          node tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          node test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js
          node tools/validate-no-magic-human-gate.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Push only under unchanged target and main leases
        run: |
          set -Eeuo pipefail
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET"
          test "$(git -C work ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          git -C work push origin "$PRODUCT_HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET"
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$PRODUCT_HEAD"

      - name: Preserve exact rebind receipt
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('work')
          receipt = json.loads((root / 'data/research/status-sovereignty-rd-wave02-rd06-offeror-universe/class-receipt.json').read_text())
          closure = json.loads((root / 'data/project/ssc-residual-wave02/closures/RD-06-C01.json').read_text())
          current = json.loads((root / 'data/research/status-sovereignty-residual-denominator-wave-02-current.json').read_text())
          effect = closure['residual_atlas_effect_if_promoted_after_rd04_rd05_and_rd01']
          out = {
            'schema_version': 'ssc-rd06-wave02-current-atlas-rebind@1',
            'prior_head': os.environ['EXPECTED_TARGET'],
            'product_head': os.environ['PRODUCT_HEAD'],
            'main_lease': os.environ['EXPECTED_MAIN'],
            'changed_paths': 7,
            'transport_paths': 0,
            'pre_promotion_open': current['counts']['open_residual_classes'],
            'pre_promotion_closed': current['counts']['closed_residual_classes'],
            'post_promotion_open': effect['open_after'],
            'post_promotion_closed': effect['closed_after'],
            'terminal_state': receipt['terminal_state'],
            'class_closed': receipt['class_closed'],
            'proposal_slots': receipt['counts']['proposal_slots'],
            'terminal_slots': receipt['counts']['identity_and_disposition_terminal_slots'],
            'manifest_combined_sha256': closure['product']['manifest_combined_sha256'],
            'outside_human_dependency': False,
            'external_contacts': 0,
            'external_reviews': 0,
            'publication_effect': 'none',
            'adoption_effect': 'none',
            'graph_effect': 'none'
          }
          Path('ssc-rd06-wave02-current-atlas-rebind.json').write_text(json.dumps(out, indent=2) + '\n')
          PY
          cat ssc-rd06-wave02-current-atlas-rebind.json

      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-current-atlas-rebind
          path: ssc-rd06-wave02-current-atlas-rebind.json
          if-no-files-found: error
          retention-days: 90
