name: Preference custody laboratory floor v16

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-collective-distribution.mjs'
      - 'tools/validate-preference-collective-distribution.mjs'
      - 'tools/compile-preference-custody-manifest-v16.mjs'
      - 'tools/validate-preference-custody-manifest-v16.mjs'
      - 'test/preference-collective-distribution.test.js'
      - 'test/preference-custody-manifest-v16.test.js'
      - 'docs/preference-custody-collective-distribution.md'
      - 'docs/preference-custody-laboratory-floor-v16.md'
      - '.github/workflows/preference-collective-distribution.yml'
      - '.github/workflows/preference-custody-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-18 and the compositional v16 floor
        run: |
          node tools/compile-preference-collective-distribution.mjs
          node tools/compile-preference-custody-manifest-v16.mjs
      - name: Validate collective-distribution and floor boundaries
        run: |
          node tools/validate-preference-collective-distribution.mjs
          node tools/validate-preference-custody-manifest-v16.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-collective-distribution.test.js
          node test/preference-custody-manifest-v16.test.js
      - name: Preserve deterministic v16 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v16
          path: |
            build/research/preference-collective-distribution.json
            build/research/preference-collective-distribution.md
            build/research/preference-custody-laboratory-floor-v16.json
            build/research/preference-custody-laboratory-floor-v16.md
          if-no-files-found: error
