name: Counter-Selector Wave 27 Batch A blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-27.yml'
      - 'data/project/counter-selector-wave-27-*.json'
      - 'schemas/counter-selector-observability-blind-review.schema.json'
      - 'docs/methods/counter-selector-observability-blind-review.md'
      - 'docs/milestones/counter-selector-wave-27.md'
      - 'tools/build-counter-selector-wave-27.mjs'
      - 'tools/validate-counter-selector-wave-27.mjs'
      - 'test/counter-selector-wave-27.test.js'
      - 'reports/core-thesis/counter-selector-wave-27/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-27.yml'
      - 'data/project/counter-selector-wave-27-*.json'
      - 'schemas/counter-selector-observability-blind-review.schema.json'
      - 'docs/methods/counter-selector-observability-blind-review.md'
      - 'docs/milestones/counter-selector-wave-27.md'
      - 'tools/build-counter-selector-wave-27.mjs'
      - 'tools/validate-counter-selector-wave-27.mjs'
      - 'test/counter-selector-wave-27.test.js'
      - 'reports/core-thesis/counter-selector-wave-27/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 27 products
        run: node tools/build-counter-selector-wave-27.mjs
      - name: Validate Batch A blind-review contract
        run: node tools/validate-counter-selector-wave-27.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-27.test.js
      - name: Require exact committed Wave 27 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-27-blind-packet-registry.json \
            data/project/counter-selector-wave-27-review-registry.json \
            data/project/counter-selector-wave-27-disagreement-ledger.json \
            data/project/counter-selector-wave-27-release-manifest.json \
            reports/core-thesis/counter-selector-wave-27/data.json \
            reports/core-thesis/counter-selector-wave-27/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 27 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-27.mjs
          node tools/validate-counter-selector-wave-27.mjs
          node test/counter-selector-wave-27.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
