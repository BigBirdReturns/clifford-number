name: Security-state organism evidence program

on:
  pull_request:
    paths:
      - 'data/project/security-state-*.json'
      - 'data/intake/security-state-organism-*.json'
      - 'docs/security-state-organism-program.md'
      - 'docs/milestones/m04b-*.md'
      - 'tools/build-security-state-organism.mjs'
      - 'tools/validate-security-state-organism.mjs'
      - 'tools/dispatch-security-state-organism.mjs'
      - 'test/security-state-organism.test.js'
      - 'reports/core-thesis/security-state-organism/**'
      - 'build/core-thesis/security-state-organism/**'
      - 'package.json'
      - 'tools/compile.mjs'
      - '.github/workflows/security-state-organism.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/security-state-*.json'
      - 'data/intake/security-state-organism-*.json'
      - 'docs/security-state-organism-program.md'
      - 'docs/milestones/m04b-*.md'
      - 'tools/build-security-state-organism.mjs'
      - 'tools/validate-security-state-organism.mjs'
      - 'tools/dispatch-security-state-organism.mjs'
      - 'test/security-state-organism.test.js'
      - 'reports/core-thesis/security-state-organism/**'
      - 'build/core-thesis/security-state-organism/**'
      - 'package.json'
      - 'tools/compile.mjs'
      - '.github/workflows/security-state-organism.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-state-organism-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the canonical evidence program
        run: |
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          M04B_REPOSITORY="$GITHUB_REPOSITORY" node tools/dispatch-security-state-organism.mjs --dry-run
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const receipt = read('build/core-thesis/security-state-organism/dispatch-receipt.json');
          const manifest = read('build/core-thesis/security-state-organism/manifest.json');
          const plan = read('build/core-thesis/security-state-organism/issue-plan.json');
          const digest = crypto.createHash('sha256').update(JSON.stringify(plan)).digest('hex');
          if (receipt.schema_version !== 'm04b-dispatch-receipt@2') throw new Error('dispatch receipt schema drift');
          if (receipt.mode !== 'dry-run') throw new Error('pull-request dispatch receipt must be dry-run');
          if (receipt.source_fingerprint !== manifest.source_fingerprint) throw new Error('dispatch receipt source fingerprint drift');
          if (receipt.issue_plan_digest !== digest) throw new Error('dispatch receipt issue-plan digest drift');
          if (receipt.planned?.issues !== 61 || receipt.planned?.estate_handoffs !== 24) throw new Error('dispatch receipt plan counts drift');
          if (receipt.boundaries?.graph_effect !== 'none' || receipt.boundaries?.conclusion_generated !== false || receipt.boundaries?.estate_completion_claimed !== false) throw new Error('dispatch receipt boundary drift');
          console.log(JSON.stringify({ ok: true, mode: receipt.mode, source_fingerprint: receipt.source_fingerprint, issue_plan_digest: receipt.issue_plan_digest, planned: receipt.planned }, null, 2));
          NODE
      - name: Run the complete repository release gate
        run: npm run release:check
      - name: Refuse deterministic builder-product drift
        run: |
          owned_paths=(
            build/core-thesis/security-state-organism/manifest.json
            build/core-thesis/security-state-organism/fanout.json
            build/core-thesis/security-state-organism/issue-plan.json
            build/core-thesis/security-state-organism/packets
            reports/core-thesis/security-state-organism/data.json
            reports/core-thesis/security-state-organism/index.html
          )
          git diff --name-status -- "${owned_paths[@]}" | tee "$RUNNER_TEMP/security-state-organism-drift.txt"
          git diff --exit-code -- "${owned_paths[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-state-organism-evidence-program
          path: |
            data/project/security-state-*.json
            data/intake/security-state-organism-*.json
            docs/security-state-organism-program.md
            docs/milestones/m04b-*.md
            build/core-thesis/security-state-organism/
            reports/core-thesis/security-state-organism/
            ${{ runner.temp }}/security-state-organism-drift.txt
          if-no-files-found: error
          retention-days: 90

  dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild exact issue plan
        run: node tools/build-security-state-organism.mjs
      - name: Upsert proof lanes and estate handoffs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          M04B_DISPATCH_MODE: apply
        run: node tools/dispatch-security-state-organism.mjs --apply
      - uses: actions/upload-artifact@v4
        with:
          name: security-state-organism-dispatch-receipt
          path: build/core-thesis/security-state-organism/dispatch-receipt.json
          if-no-files-found: error
          retention-days: 90
