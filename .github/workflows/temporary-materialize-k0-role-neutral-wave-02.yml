name: Temporary materialize K0 role-neutral Wave 02

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-role-neutral-wave-02.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-02
    paths:
      - '.github/workflows/temporary-materialize-k0-role-neutral-wave-02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand exact Wave 02 carrier
        run: |
          base64 -d .github/tmp/k0-role-neutral-wave-02-carrier.b64 > /tmp/k0-role-neutral-wave-02-carrier.tgz
          test "$(sha256sum /tmp/k0-role-neutral-wave-02-carrier.tgz | awk '{print $1}')" = "5e24eded013ec741d1636fa386b9e345b53dbf8f7672dec2accd6e4ca79a77c9"
          rm -rf /tmp/k0-role-neutral-wave-02-carrier
          mkdir -p /tmp/k0-role-neutral-wave-02-carrier
          tar -xzf /tmp/k0-role-neutral-wave-02-carrier.tgz -C /tmp/k0-role-neutral-wave-02-carrier
          node --check /tmp/k0-role-neutral-wave-02-carrier/materialize-k0-role-neutral-wave-02.mjs

      - name: Materialize and validate Wave 02
        run: |
          node /tmp/k0-role-neutral-wave-02-carrier/materialize-k0-role-neutral-wave-02.mjs
          node tools/build-k0-role-neutral-wave-02.mjs
          node tools/validate-k0-role-neutral-wave-02.mjs
          node test/k0-role-neutral-wave-02.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          node /tmp/k0-role-neutral-wave-02-carrier/materialize-k0-role-neutral-wave-02.mjs
          node tools/build-k0-role-neutral-wave-02.mjs
          node tools/validate-k0-role-neutral-wave-02.mjs
          node test/k0-role-neutral-wave-02.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Enforce permanent path denominator
        run: |
          python - <<'PYDENOM'
          import subprocess
          expected = {
              '.github/workflows/k0-role-neutral-wave-02.yml',
              'data/research/k0-role-neutral-wave-02.json',
              'docs/milestones/m05-k0-role-neutral-wave-02.md',
              'tools/build-k0-role-neutral-wave-02.mjs',
              'tools/validate-k0-role-neutral-wave-02.mjs',
              'test/k0-role-neutral-wave-02.test.js',
              'data/project/k0-role-neutral-wave-02-release-manifest.json',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-02.json',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-02.html',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/corpus-coverage.json',
              'data/research/selection-adversarial-reviews.json',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'reports/core-thesis/answerable-power/k0.json',
              'reports/core-thesis/answerable-power/k0.html',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM

      - name: Create exact blob receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBLOBS'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          paths = [
              '.github/workflows/k0-role-neutral-wave-02.yml',
              'data/research/k0-role-neutral-wave-02.json',
              'docs/milestones/m05-k0-role-neutral-wave-02.md',
              'tools/build-k0-role-neutral-wave-02.mjs',
              'tools/validate-k0-role-neutral-wave-02.mjs',
              'test/k0-role-neutral-wave-02.test.js',
              'data/project/k0-role-neutral-wave-02-release-manifest.json',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-02.json',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-02.html',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/corpus-coverage.json',
              'data/research/selection-adversarial-reviews.json',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'reports/core-thesis/answerable-power/k0.json',
              'reports/core-thesis/answerable-power/k0.html',
          ]

          def post(path, payload):
              req = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'k0-role-neutral-wave-02',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          rows = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = post(f'/repos/{repo}/git/blobs', {
                  'content': base64.b64encode(raw).decode(),
                  'encoding': 'base64',
              })
              index_row = subprocess.check_output(['git','ls-files','-s','--',path], text=True).strip()
              mode = index_row.split()[0] if index_row else '100644'
              rows.append({'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': mode})

          receipt = {
              'schema_version': 'k0-role-neutral-wave-02-transaction@1',
              'repository': repo,
              'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'updates': rows,
              'deletions': [
                  '.github/tmp/k0-role-neutral-wave-02-carrier.b64',
                  '.github/workflows/temporary-materialize-k0-role-neutral-wave-02.yml',
              ],
              'carrier_sha256': '5e24eded013ec741d1636fa386b9e345b53dbf8f7672dec2accd6e4ca79a77c9',
              'ref_updated': False,
              'publication_cleared': False,
              'graph_effect': 'none',
          }
          os.makedirs('/tmp/k0-wave02-export', exist_ok=True)
          with open('/tmp/k0-wave02-export/BLOB_RECEIPTS.json', 'w') as handle:
              json.dump(receipt, handle, indent=2)
              handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PYBLOBS

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-role-neutral-wave-02-validated-transaction
          path: /tmp/k0-wave02-export/BLOB_RECEIPTS.json
          if-no-files-found: error
          retention-days: 30
