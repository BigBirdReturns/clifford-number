name: K0 epistemic admissibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/intake/k0-*'
      - 'data/project/k0-*'
      - 'docs/methods/k0-*'
      - 'docs/milestones/m05-k0-*'
      - 'schemas/k0-*'
      - 'tools/*k0*'
      - 'test/k0-*'
      - 'reports/core-thesis/answerable-power/k0.*'
      - 'data/project/m05-answerable-power-story-registry.json'
      - 'data/project/m05-answerable-power-fanout.json'
      - 'data/canonical/corpus-selection.json'
      - 'data/research/corpus-coverage.json'
      - 'data/research/selection-adversarial-reviews.json'
      - 'package.json'
      - 'tools/validate-m05-answerable-power.mjs'
      - 'test/m05-answerable-power.test.js'
      - '.github/workflows/k0-epistemic-admissibility.yml'
  push:
    branches: [main]
    paths:
      - 'data/intake/k0-*'
      - 'data/project/k0-*'
      - 'docs/methods/k0-*'
      - 'docs/milestones/m05-k0-*'
      - 'schemas/k0-*'
      - 'tools/*k0*'
      - 'test/k0-*'
      - 'reports/core-thesis/answerable-power/k0.*'
      - 'data/project/m05-answerable-power-story-registry.json'
      - 'data/project/m05-answerable-power-fanout.json'
      - 'data/canonical/corpus-selection.json'
      - 'data/research/corpus-coverage.json'
      - 'data/research/selection-adversarial-reviews.json'
      - 'package.json'
      - 'tools/validate-m05-answerable-power.mjs'
      - 'test/m05-answerable-power.test.js'
      - '.github/workflows/k0-epistemic-admissibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test K0 and M-05 integration
        run: |
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic K0 and M-05 products
        run: |
          git restore --staged --worktree .
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
          git diff --exit-code
