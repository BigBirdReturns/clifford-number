name: Preference custody human-companion admission

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/real-cases/newsuk-nucleus-human-companion.json'
      - 'tools/lib/preference-human-companion.mjs'
      - 'tools/compile-preference-human-companion.mjs'
      - 'tools/validate-preference-human-companion.mjs'
      - 'test/preference-human-companion.test.js'
      - 'docs/preference-custody-newsuk-nucleus-human-companion.md'
      - '.github/workflows/preference-human-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile bounded human-companion admission
        run: node tools/compile-preference-human-companion.mjs
      - name: Validate negative-control and authority boundaries
        run: node tools/validate-preference-human-companion.mjs
      - name: Exercise positive, tamper, and laundering fixtures
        run: node test/preference-human-companion.test.js
      - name: Preserve deterministic human-companion projections
        uses: actions/upload-artifact@v4
        with:
          name: newsuk-nucleus-human-companion
          path: |
            build/research/preference-real-cases/newsuk-nucleus-human-companion.json
            build/research/preference-real-cases/newsuk-nucleus-human-companion.md
          if-no-files-found: error
