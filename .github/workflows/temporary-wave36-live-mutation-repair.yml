name: Temporary Wave 36 live mutation repair

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-live-mutation-repair.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave36-live-mutation-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave36-live-mutation-repair.yml'
          encoded_ref='agent%2Flake-allocator-war-public-acquisition-wave-36'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 36 mutation repair workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair no-op live-corpus mutations and publish
        shell: bash
        env:
          BRANCH: agent/lake-allocator-war-public-acquisition-wave-36
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/lake-allocator-war-public-acquisition-wave-36.test.js')
          text = path.read_text()
          replacements = {
              "mutateJsonl(CAPTURES, rows => { rows[0].response_ok = false; });":
                  "mutateJsonl(CAPTURES, rows => { const r=rows.find(x=>x.response_ok===true); assert.ok(r); r.response_ok=false; });",
              "mutateJsonl(CAPTURES, rows => { rows[0].marker_audit.passed = false; });":
                  "mutateJsonl(CAPTURES, rows => { const r=rows.find(x=>x.marker_audit?.passed===true); assert.ok(r); r.marker_audit.passed=false; });",
              "mutateJsonl(CAPTURES, rows => { rows[0].capture_state = 'captured_marker_mismatch'; });":
                  "mutateJsonl(CAPTURES, rows => { const r=rows.find(x=>x.response_ok===true && x.capture_state!=='captured_marker_mismatch'); assert.ok(r); r.capture_state='captured_marker_mismatch'; });",
              "mutateJsonl(RECORDS, rows => { rows[0].task_refs.pop(); });":
                  "mutateJsonl(RECORDS, rows => { const r=rows.find(x=>Array.isArray(x.task_refs) && x.task_refs.length>0); assert.ok(r); r.task_refs.pop(); });",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement target, found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

          node --check test/lake-allocator-war-public-acquisition-wave-36.test.js
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          fixture="$tmp/fixture"
          mkdir -p "$fixture"
          tar --exclude=.git -cf - . | tar -xf - -C "$fixture"
          (
            cd "$fixture"
            LAW36_FIXTURE_MODE=1 LAW36_OBSERVED_AT=2026-08-02T16:30:00Z node tools/acquire-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/build-lake-allocator-war-public-acquisition-wave-36.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
            node test/lake-allocator-war-public-acquisition-wave-36.test.js | tee "$tmp/mutations.log"
            grep -F 'adversarial mutations passed: 167' "$tmp/mutations.log"
          )

          test "$(git diff --name-only "$before")" = 'test/lake-allocator-war-public-acquisition-wave-36.test.js'
          git diff --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add test/lake-allocator-war-public-acquisition-wave-36.test.js
          git commit -m 'Repair Wave 36 live-corpus adversarial selectors'

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$before"
          git push origin "HEAD:$BRANCH"
