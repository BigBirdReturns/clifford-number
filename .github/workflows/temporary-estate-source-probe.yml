name: Temporary estate source probe

on:
  pull_request:
    paths:
      - '.github/temporary/probe-chunks-v2/**'
      - '.github/workflows/temporary-estate-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize the bounded probe payload
        run: |
          cat .github/temporary/probe-chunks-v2/chunk-*.b64 > /tmp/estate-probe-payload.tgz.b64
          printf '%s  %s\n' '25d24f5267200c89ee351558ed6c44ae3bf4ec62c9e89e9af517bd654f233a08' /tmp/estate-probe-payload.tgz.b64 | sha256sum --check --status
          base64 --decode /tmp/estate-probe-payload.tgz.b64 > /tmp/estate-probe-payload.tgz
          printf '%s  %s\n' '7e59f22651b39c55f5b468ae7e82daf368faa77d627ebdb2521fefcac64732f6' /tmp/estate-probe-payload.tgz | sha256sum --check --status
          tar -xzf /tmp/estate-probe-payload.tgz
      - name: Probe every declared source route
        env:
          ESTATE_PROBE_AT: '2026-07-23T03:20:00.000Z'
        run: |
          node tools/probe-estate-source-routes.mjs \
            --output build/estate-source-probe/observations.jsonl \
            --parallelism 8 \
            --timeout-ms 20000 \
            --max-bytes 262144
      - name: Validate and summarize bounded route states
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync('data/estates/source-route-catalog.json', 'utf8'));
          const rows = fs.readFileSync('build/estate-source-probe/observations.jsonl', 'utf8').trim().split(/\n/).filter(Boolean).map(JSON.parse);
          const allowed = new Set(['source_surface_observed','locator_observed','source_in_custody_live_route_unavailable','restricted_after_search','not_found_after_search','unavailable_after_search']);
          if (rows.length !== catalog.routes.length || rows.length !== 66) throw new Error(`expected 66 route observations, saw ${rows.length}`);
          if (new Set(rows.map(row => row.route_id)).size !== rows.length) throw new Error('duplicate route observation');
          const byId = new Map(rows.map(row => [row.route_id, row]));
          for (const route of catalog.routes) {
            const row = byId.get(route.route_id);
            if (!row) throw new Error(`missing ${route.route_id}`);
            if (!allowed.has(row.coverage_state)) throw new Error(`${route.route_id}: invalid state ${row.coverage_state}`);
            const expected = [...route.probe_urls].sort();
            const observed = [...row.probes.map(probe => probe.requested_url)].sort();
            if (JSON.stringify(expected) !== JSON.stringify(observed)) throw new Error(`${route.route_id}: URL coverage drifted`);
            for (const probe of row.probes) {
              const challenge = `${probe.final_url || ''} ${probe.html_title || ''}`;
              if (/request access|access denied|just a moment|attention required|unblock\./i.test(challenge) && probe.result !== 'restricted_after_search') {
                throw new Error(`${route.route_id}: challenge page misclassified as ${probe.result}`);
              }
            }
          }
          const counts = Object.fromEntries([...new Set(rows.map(row => row.coverage_state))].sort().map(state => [state, rows.filter(row => row.coverage_state === state).length]));
          fs.writeFileSync('build/estate-source-probe/summary.json', JSON.stringify({ routes: rows.length, counts }, null, 2) + '\n');
          console.log(JSON.stringify({ routes: rows.length, counts }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estate-source-probe
          path: build/estate-source-probe/
          if-no-files-found: warn
          retention-days: 2
