name: TEMP bridge RD-01 Wave-03 promotion workflow permission

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-promotion-handoff.yml'
      - '.github/tmp/rd01-wave03-promotion-handoff.sh'
      - '.ssc-rd01-wave03-promotion-handoff/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: ssc-rd01-wave03-promotion-workflow-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: handoff
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/tmp/rd01-wave03-promotion-handoff.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-rd01-wave03-promotion-handoff
          path: /tmp/ssc-rd01-wave03-promotion-handoff-receipt
          if-no-files-found: error
          retention-days: 90
      - name: Enforce handoff result
        if: always()
        env:
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
        run: test "$HANDOFF_OUTCOME" = 'success'
