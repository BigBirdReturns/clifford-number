name: Temporary PR 2231 V131 phone-label bare-host qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v131-phone-label-bare-host-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v131-phone-label-bare-host:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v131-phone-label-bare-host-qualification-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v131-phone-label-bare-host-qualification-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute the read-only V131 qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          export EXPECTED_CONTROLLER="$(git rev-parse HEAD)"
          payload_blob=5f3cd9477d3e345e5ef8a9f89fef7eb5af7c297e
          payload_size=7120
          payload_sha256=92026606e823d4cf1112039e8e3dae3c3930a9bb9313ec7b175b38f45f1e093c
          qualifier_blob=b51d7e406ce92e2ebc2e967925acc37132d20df7
          qualifier_size=28151
          qualifier_sha256=08c55e7cdb17c20fa9a34f8c61cf13a117e43dbbd24631ca9cf26ceaabae5800
          envelope=/tmp/pr2231-v131-phone-label-bare-host-controller-v1
          payload="$envelope/qualifier-v131.sh.xz"
          qualifier="$envelope/qualifier-v131.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-v131-phone-label-bare-host-controller-v1\n' "$rc" > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          printf 'controller_branch=%s\nexpected_branch=%s\ncontroller_head=%s\nexpected_head=%s\n' \
            "${CONTROLLER_BRANCH:-}" "${EXPECTED_CONTROLLER_BRANCH:-}" \
            "$(git rev-parse HEAD)" "$EXPECTED_CONTROLLER"
          cp .github/temporary/pr2231-v131-qualifier-v1.sh.xz "$payload"
          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          xz -dc "$payload" > "$qualifier"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          printf 'payload_blob=%s\npayload_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\n' \
            "$payload_blob" "$payload_sha256" "$qualifier_blob" "$qualifier_sha256" \
            > "$envelope/qualifier-provenance.txt"
          "$qualifier"

      - name: Upload V131 qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v131-phone-label-bare-host-qualification-v1
          path: |
            /tmp/pr2231-v131-phone-label-bare-host-controller-v1
            /tmp/pr2231-v131-phone-label-bare-host-qualification-v1
          if-no-files-found: warn
          retention-days: 30
