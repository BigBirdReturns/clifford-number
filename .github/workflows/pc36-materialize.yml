name: Temporary PC-36 exact product materializer

on:
  pull_request:
    paths:
      - '.pc36/payload.part-*'
      - '.github/workflows/pc36-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc36-exact-product-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-population-coverage-turnover-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and extract the exact twelve-file PC-36 product
        env:
          EXPECTED_XZ_SHA256: 72da8f580e9f00b5dff159af9ef4b1c3abc1262fc500d579f5f872feeb8c4f6d
          EXPECTED_BASE64_SHA256: b4817e49f539e6ee7e1c5ec6744846778c2090886151c88a0ff679f307959aa0
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile

          expected = json.loads("{\"data/research/preference-custody/population-coverage-turnover-assurance.fixture.json\":{\"bytes\":24500,\"sha256\":\"e224527cff23af1ceb40836a76fae92d888c5ea43bcc28fea54ff3b0e63e7341\"},\"tools/lib/preference-population-coverage-turnover-assurance.mjs\":{\"bytes\":28901,\"sha256\":\"e4f144bcc24955c03bccf7aa23c585a193e7bfd2c0218f8259d0705ff9b467bd\"},\"tools/compile-preference-population-coverage-turnover-assurance.mjs\":{\"bytes\":1201,\"sha256\":\"93afdabcd849fa93ba0fcbff151e5627b5123e080e39a2a775f431dd58bb49dc\"},\"tools/validate-preference-population-coverage-turnover-assurance.mjs\":{\"bytes\":592,\"sha256\":\"fccca7038cc1045712b2eb01e90d91f6f001caa5dc8f8b33c160f19a118e141d\"},\"test/preference-population-coverage-turnover-assurance.test.js\":{\"bytes\":5744,\"sha256\":\"736d6afe9093b022c78454b8b9f2c78478898b4a1573537b445991d13a423cda\"},\"docs/preference-custody-population-coverage-turnover-assurance.md\":{\"bytes\":830,\"sha256\":\"b18e96eab5104e8d42b64983f82b87b11409211cce3916ac2c00dcca7ed3dce3\"},\"data/research/preference-custody/control-manifest-v34.json\":{\"bytes\":12179,\"sha256\":\"050f807ae25457d4d3467b24c4f3b535a7ec2c9e3aab5f8d4a203ed6a250b01b\"},\"tools/lib/preference-custody-manifest-v34.mjs\":{\"bytes\":15723,\"sha256\":\"271fe343cf36beafea25683ab21e07566f9e86778c033419fcd9935aaf60d2a9\"},\"tools/compile-preference-custody-manifest-v34.mjs\":{\"bytes\":2073,\"sha256\":\"636375c25bfa3bb1d626a41cbf9d180e117f81e2399357108b5c9ebd90e86965\"},\"tools/validate-preference-custody-manifest-v34.mjs\":{\"bytes\":503,\"sha256\":\"60cadeff161adf96036a0b1d21012cf05b418da40a21047f766484cc27bc1ff3\"},\"test/preference-custody-manifest-v34.test.js\":{\"bytes\":8196,\"sha256\":\"335695be2be52e2d865925ce46314162e6bdcbb061565090cacfc8c9a73c71bc\"},\"docs/preference-custody-laboratory-floor-v34.md\":{\"bytes\":621,\"sha256\":\"a9af2fa44098c7129eeff6825837ac8ed421bdf55daa51556664d5b7d48f4db0\"}}")
          expected_shards = {"payload.part-00":"c8d649613b913bc1a88bcf5e9432c782df2eee12f69f319fe7d5b8ffa56bb0ab","payload.part-01":"a09534c7a22d4add8d1191ca4672b38287eb9e4aaa0500dd9e9181e59f230132","payload.part-02":"a9101f64903eb4ef41706e646862b0ea35faa2eb6b00c1495ebaef0e2f8550f5","payload.part-03":"34fe8b736fafce53ff89c991da6635ef573904e63d24adbfb9f2f0f1c796bfc0","payload.part-04":"3a6fc85c5c6062ceac94025978aa2f239b5d20646379e558f50fba36d62b8cf4"}
          parts = sorted(Path('.pc36').glob('payload.part-*'))
          required = [f'payload.part-{index:02d}' for index in range(5)]
          if [path.name for path in parts] != required:
              raise SystemExit(f'shard denominator mismatch: {[path.name for path in parts]}')
          normalized = {path.name: ''.join(path.read_text().split()) for path in parts}
          for name, digest in expected_shards.items():
              actual = hashlib.sha256(normalized[name].encode()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'shard SHA-256 mismatch: {name} {actual}')
          encoded = ''.join(normalized[name] for name in required)
          actual_base64_sha256 = hashlib.sha256(encoded.encode()).hexdigest()
          if actual_base64_sha256 != os.environ['EXPECTED_BASE64_SHA256']:
              raise SystemExit(f'base64 SHA-256 mismatch: {actual_base64_sha256}')
          xz_bytes = base64.b64decode(encoded, validate=True)
          actual_xz_sha256 = hashlib.sha256(xz_bytes).hexdigest()
          if actual_xz_sha256 != os.environ['EXPECTED_XZ_SHA256']:
              raise SystemExit(f'xz SHA-256 mismatch: {actual_xz_sha256}')
          with tarfile.open(fileobj=io.BytesIO(xz_bytes), mode='r:xz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f'archive path/order mismatch: {names}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member must be regular: {member.name}')
                  target = Path(member.name)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'archive member missing bytes: {member.name}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          observed = {}
          for name, record in expected.items():
              raw = Path(name).read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if digest != record['sha256'] or len(raw) != record['bytes']:
                  raise SystemExit(f'file custody mismatch: {name} {len(raw)} {digest}')
              observed[name] = {'bytes': len(raw), 'sha256': digest}
          receipt = {
              'schema_version': 'pc36-materialization-receipt@1',
              'source_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'payload_base64_sha256': actual_base64_sha256,
              'payload_xz_sha256': actual_xz_sha256,
              'permanent_nonworkflow_file_count': len(expected),
              'files': observed,
              'outside_human_dependency': False,
          }
          Path('/tmp/pc36-materialization-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Qualify standalone PC-36 and compositional floor v34
        run: |
          node tools/compile-preference-population-coverage-turnover-assurance.mjs
          node tools/validate-preference-population-coverage-turnover-assurance.mjs
          node test/preference-population-coverage-turnover-assurance.test.js
          node tools/compile-preference-custody-manifest-v34.mjs
          node tools/validate-preference-custody-manifest-v34.mjs
          node test/preference-custody-manifest-v34.test.js
      - name: Regress historical Preference Custody floors and no-magic-human gate
        run: |
          set -euo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
      - name: Commit only the exact product and retire all transport files
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/research/preference-custody/population-coverage-turnover-assurance.fixture.json \
            tools/lib/preference-population-coverage-turnover-assurance.mjs \
            tools/compile-preference-population-coverage-turnover-assurance.mjs \
            tools/validate-preference-population-coverage-turnover-assurance.mjs \
            test/preference-population-coverage-turnover-assurance.test.js \
            docs/preference-custody-population-coverage-turnover-assurance.md \
            data/research/preference-custody/control-manifest-v34.json \
            tools/lib/preference-custody-manifest-v34.mjs \
            tools/compile-preference-custody-manifest-v34.mjs \
            tools/validate-preference-custody-manifest-v34.mjs \
            test/preference-custody-manifest-v34.test.js \
            docs/preference-custody-laboratory-floor-v34.md
          git rm -- .github/workflows/pc36-materialize.yml \
            .pc36/payload.part-00 \
            .pc36/payload.part-01 \
            .pc36/payload.part-02 \
            .pc36/payload.part-03 \
            .pc36/payload.part-04
          python - <<'PY'
          import subprocess
          expected = sorted(["data/research/preference-custody/population-coverage-turnover-assurance.fixture.json", "tools/lib/preference-population-coverage-turnover-assurance.mjs", "tools/compile-preference-population-coverage-turnover-assurance.mjs", "tools/validate-preference-population-coverage-turnover-assurance.mjs", "test/preference-population-coverage-turnover-assurance.test.js", "docs/preference-custody-population-coverage-turnover-assurance.md", "data/research/preference-custody/control-manifest-v34.json", "tools/lib/preference-custody-manifest-v34.mjs", "tools/compile-preference-custody-manifest-v34.mjs", "tools/validate-preference-custody-manifest-v34.mjs", "test/preference-custody-manifest-v34.test.js", "docs/preference-custody-laboratory-floor-v34.md", ".github/workflows/pc36-materialize.yml", ".pc36/payload.part-00", ".pc36/payload.part-01", ".pc36/payload.part-02", ".pc36/payload.part-03", ".pc36/payload.part-04"])
          observed = sorted(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if observed != expected:
              raise SystemExit(f'staged path mismatch:\nexpected={expected}\nobserved={observed}')
          print(f'exact staged path set verified: {len(observed)} paths')
          PY
          git commit -m 'Materialize PC-36 and Preference Custody floor v34'
          git push --force-with-lease=refs/heads/research/preference-population-coverage-turnover-assurance-v1:"$source_head" origin HEAD:refs/heads/research/preference-population-coverage-turnover-assurance-v1
      - name: Preserve exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc36-exact-materialization-receipt
          path: /tmp/pc36-materialization-receipt.json
          if-no-files-found: error
