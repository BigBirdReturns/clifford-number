name: Counter-Selector Wave 05 post-review gap audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-05.yml'
      - 'data/project/counter-selector-wave-05-*.json'
      - 'data/project/counter-selector-post-review-gap-registry.json'
      - 'schemas/counter-selector-post-review-gap.schema.json'
      - 'docs/methods/counter-selector-post-review-gap.md'
      - 'docs/milestones/counter-selector-wave-05.md'
      - 'tools/build-counter-selector-wave-05.mjs'
      - 'tools/validate-counter-selector-wave-05.mjs'
      - 'test/counter-selector-wave-05.test.js'
      - 'reports/core-thesis/counter-selector-wave-05/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-05.yml'
      - 'data/project/counter-selector-wave-05-*.json'
      - 'data/project/counter-selector-post-review-gap-registry.json'
      - 'schemas/counter-selector-post-review-gap.schema.json'
      - 'docs/methods/counter-selector-post-review-gap.md'
      - 'docs/milestones/counter-selector-wave-05.md'
      - 'tools/build-counter-selector-wave-05.mjs'
      - 'tools/validate-counter-selector-wave-05.mjs'
      - 'test/counter-selector-wave-05.test.js'
      - 'reports/core-thesis/counter-selector-wave-05/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 05 products
        run: node tools/build-counter-selector-wave-05.mjs
      - name: Validate post-review gap contract
        run: node tools/validate-counter-selector-wave-05.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-05.test.js
      - name: Require exact committed Wave 05 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-post-review-gap-registry.json \
            data/project/counter-selector-wave-05-supersession.json \
            data/project/counter-selector-wave-05-release-manifest.json \
            reports/core-thesis/counter-selector-wave-05/data.json \
            reports/core-thesis/counter-selector-wave-05/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 05 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-05.mjs
          node tools/validate-counter-selector-wave-05.mjs
          node test/counter-selector-wave-05.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
