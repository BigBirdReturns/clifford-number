name: TEMP acquire School.House IRS candidate latest filing XML v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-irs-candidate-latest-filing-xml-v4.yml'
      - '.schoolhouse-irs-candidate-latest-filing-xml-v4/**'
  workflow_dispatch:

concurrency:
  group: schoolhouse-irs-candidate-latest-filing-xml-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-irs-candidate-latest-filing-xml-v4')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact carrier and runner before any request
        shell: bash
        run: |
          set -Eeuxo pipefail
          PARENT='773bdf96026e9fe6d5e11f4d9dffa1629e2c0ea3'
          ROOT='.schoolhouse-irs-candidate-latest-filing-xml-v4'
          EXECUTE="$ROOT/EXECUTE"
          BUNDLE="$ROOT/acquire.py.gz.b64"
          WORKFLOW='.github/workflows/temp-schoolhouse-irs-candidate-latest-filing-xml-v4.yml'
          GZIP="$RUNNER_TEMP/acquire-schoolhouse-irs-candidate-latest-filing-xml-v4.py.gz"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-irs-candidate-latest-filing-xml-v4.py"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$PARENT"
          test "$(git merge-base HEAD origin/main)" = "$PARENT"

          mapfile -t CHANGED < <(git diff --name-only "$PARENT"..HEAD | sort)
          EXPECTED=(
            '.github/workflows/temp-schoolhouse-irs-candidate-latest-filing-xml-v4.yml'
            '.schoolhouse-irs-candidate-latest-filing-xml-v4/EXECUTE'
            '.schoolhouse-irs-candidate-latest-filing-xml-v4/acquire.py.gz.b64'
          )
          test "${#CHANGED[@]}" -eq 3
          for i in "${!EXPECTED[@]}"; do test "${CHANGED[$i]}" = "${EXPECTED[$i]}"; done
          git diff --exit-code -- "$WORKFLOW" "$EXECUTE" "$BUNDLE"

          test "$(git rev-parse "$PARENT:data/intake/schoolhouse-irs-candidate-filing-index-census/filing-index-matches.jsonl")" = '6fdf8f0510c80b4a0e7d438dd03fc18fee0dd8e9'
          test "$(git rev-parse "$PARENT:data/intake/schoolhouse-irs-candidate-filing-index-census/summary.json")" = '699842a7518cbddc51e25305e8a65a8417860ee7'
          test "$(git rev-parse "$PARENT:data/intake/schoolhouse-irs-candidate-filing-index-census/route-policy.json")" = '99a7376ff408b6856f479d779716061f14d52e05'

          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = '571ef7ee3f95761d7574b38228e077592d841ccaf54e90e4e6d9cd31058e3113'
          base64 -d "$BUNDLE" > "$GZIP"
          test "$(sha256sum "$GZIP" | awk '{print $1}')" = '2fb7fb2a962db2806937d05ed76b193f2aa762b64c43bd0b74575072a0dcfe49'
          gzip -dc "$GZIP" > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = 'cd3271073327c0b679e8e322cdb8ab4452107fd0b3507b8ddf7f896ca2da4c86'
          python -m py_compile "$RUNNER"
          python "$RUNNER" --self-test

          for line in \
            'acquire=schoolhouse-irs-candidate-latest-filing-xml-v4' \
            "canonical_parent=$PARENT" \
            'runner_source_sha256=cd3271073327c0b679e8e322cdb8ab4452107fd0b3507b8ddf7f896ca2da4c86' \
            'runner_gzip_sha256=2fb7fb2a962db2806937d05ed76b193f2aa762b64c43bd0b74575072a0dcfe49' \
            'runner_bundle_sha256=571ef7ee3f95761d7574b38228e077592d841ccaf54e90e4e6d9cd31058e3113' \
            'sealed_candidate_rows=641' \
            'sealed_candidate_eins=438' \
            'filing_index_match_rows=486' \
            'candidate_eins_with_filing_rows=92' \
            'selected_latest_xml_routes=92' \
            'official_archive_urls=67' \
            'maximum_total_requests=360' \
            'range_only_archive_access=true' \
            'batch_zip_fetches=0' \
            'result_spawned_requests=0' \
            'raw_xml_retained=false' \
            'raw_term_text_retained=false' \
            'observed_organization_name_values_retained=0' \
            'officer_or_person_name_values_retained=0' \
            'identity_admitted=false' \
            'relationship_admitted=false' \
            'negative_existence_claim_created=false' \
            'outside_human_dependency=false' \
            'publication_effect=none' \
            'adoption_effect=none' \
            'graph_effect=none'; do
            grep -Fx "$line" "$EXECUTE"
          done

      - name: Execute exact range-only latest-filing XML screen
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/schoolhouse-irs-candidate-latest-filing-xml-v4"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-irs-candidate-latest-filing-xml-v4.py"
          LOG="$RUNNER_TEMP/schoolhouse-irs-candidate-latest-filing-xml-v4.log"
          rm -rf "$OUT"
          python "$RUNNER" --repo-root "$GITHUB_WORKSPACE" --output "$OUT" 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          mkdir -p "$OUT"
          printf '%s\n' "$status" > "$OUT/RUNNER_EXIT_CODE"
          cp "$LOG" "$OUT/RUNNER-OUTPUT.log"
          exit "$status"

      - name: Upload terminal privacy-minimized artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-candidate-latest-filing-xml-v4
          path: ${{ runner.temp }}/schoolhouse-irs-candidate-latest-filing-xml-v4
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Require complete denominator and zero authority expansion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/schoolhouse-irs-candidate-latest-filing-xml-v4"
          test "$(cat "$ROOT/RUNNER_EXIT_CODE")" = '0'
          (cd "$ROOT" && sha256sum -c SHA256SUMS)
          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json, sys

          root=Path(sys.argv[1])
          load=lambda n:json.loads((root/n).read_text())
          rows=lambda n:[json.loads(x) for x in (root/n).read_text().splitlines() if x.strip()]
          s=load('summary.json'); p=load('route-policy.json'); a=load('adjudication.json')
          src=load('source-receipt.json'); m=load('artifact-manifest.json')
          selection=rows('selection.jsonl'); catalogs=rows('archive-catalog.jsonl'); results=rows('xml-results.jsonl')

          assert s['schema_version']=='schoolhouse-irs-candidate-latest-filing-xml-v4@1'
          assert (s['sealed_candidate_rows'],s['sealed_candidate_eins'],s['filing_index_match_rows'],s['candidate_eins_with_filing_rows'])==(641,438,486,92)
          assert s['selected_latest_xml_routes']==len(selection)==len(results)==92
          assert len({r['ein'] for r in selection})==len({r['object_id'] for r in selection})==92
          assert all(r['selection_rule']=='maximum_index_year_then_object_id_per_candidate_ein' for r in selection)
          assert all(r['raw_index_taxpayer_name_retained'] is False and r['observed_xml_organization_name_values_retained']==0 for r in selection)
          assert s['official_archive_urls_declared']==src['archive_url_count']==67
          assert 0 < s['official_archive_urls_attempted']==len(catalogs) <= 67
          assert s['request_count']<=360 and s['aggregate_response_bytes']<=2147483648
          assert sum(s['terminal_state_counts'].values())==92
          assert s['batch_zip_fetches']==s['result_spawned_requests']==s['query_submissions']==s['forms_submitted']==0
          assert s['raw_xml_retained'] is False and s['raw_term_text_retained'] is False
          assert s['observed_organization_name_values_retained']==s['officer_or_person_name_values_retained']==0
          assert s['street_address_rows_retained']==s['contact_detail_rows_retained']==s['preparer_rows_retained']==s['private_support_rows']==0
          assert s['identities_admitted']==s['relationships_admitted']==s['negative_existence_claims_created']==0
          assert s['outside_human_dependency'] is False
          assert s['publication_effect']==s['adoption_effect']==s['graph_effect']=='none'

          forbidden={'observed_organization_name','organization_name','filing_organization_name','matched_text','raw_xml','raw_term_text','officer_name','person_name','street_address','mailing_address','postal_code','email','phone','preparer_name'}
          terminal={'screened_official_xml','member_not_found_complete_archive_catalog','archive_catalog_incomplete_target_unresolved','duplicate_archive_member_matches','xml_parse_error','member_acquisition_or_integrity_error'}
          target_ids={'schoolhouse_compact','school_house_spaced','school_house_dotted','bravo_victor','bvvc'}
          mechanism_ids={'fiscal_sponsor','fiscal_sponsorship','sponsored_project','related_organization','related_party'}
          for r in results:
              assert r['state'] in terminal and not (forbidden & set(r))
              assert r['observed_organization_name_values_retained']==r['officer_or_person_name_values_retained']==0
              assert r['raw_xml_retained'] is False and r['raw_term_text_retained'] is False and r['batch_zip_retained'] is False
              assert r['street_address_rows_retained']==r['contact_detail_rows_retained']==r['preparer_rows_retained']==r['private_support_rows']==0
              assert r['identity_admitted'] is False and r['relationship_admitted'] is False and r['negative_existence_claim_created'] is False
              assert r['outside_human_dependency'] is False and r['publication_effect']==r['adoption_effect']==r['graph_effect']=='none'
              assert set(r.get('target_term_ids',[]))<=target_ids
              assert set(r.get('mechanism_term_ids',[]))<=mechanism_ids

          assert p['selection_contract']['selected_latest_xml_routes']==92
          assert p['request_bounds']['range_requests_only_for_archives'] is True and p['request_bounds']['maximum_total_requests']==360
          assert p['retention']['observed_organization_name_values_retained']==0 and p['retention']['raw_xml_retained'] is False
          assert p['interpretation']['candidate_name_alignment_is_not_public_schoolhouse_identity'] is True
          assert a['observed_organization_name_values_retained']==0 and a['public_schoolhouse_identity_admitted'] is False
          assert a['fiscal_sponsor_relationship_admitted'] is False
          assert a['grant_or_funding_relationship_admitted'] is False
          assert a['governance_or_control_relationship_admitted'] is False
          assert a['negative_existence_claim_created'] is False
          assert src['range_only_archive_access'] is True and src['batch_zip_downloaded'] is False and src['raw_xml_retained'] is False
          assert m['counts']['selection_rows']==m['counts']['xml_result_rows']==92 and m['raw_source_retained'] is False
          assert not any(x.is_file() and x.suffix.lower() in {'.xml','.zip'} for x in root.rglob('*'))

          print(json.dumps({
            'selected':92,
            'screened':s['successful_xml_screens'],
            'name_alignment':s['candidate_legal_name_alignment_rows'],
            'target_hits':s['target_term_hit_xml_rows'],
            'mechanism_hits':s['mechanism_term_hit_xml_rows'],
            'requests':s['request_count'],
          },sort_keys=True))
          PY
