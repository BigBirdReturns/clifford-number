name: TEMP acquire School.House IRS candidate latest filing XML v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-irs-candidate-latest-filing-xml-v4.yml'
      - '.schoolhouse-irs-candidate-latest-filing-xml-v4/**'
  workflow_dispatch:

concurrency:
  group: schoolhouse-irs-candidate-latest-filing-xml-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-irs-candidate-latest-filing-xml-v4')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact v4 acquisition carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical predecessor, exact carrier, and runner custody
        shell: bash
        run: |
          set -Eeuo pipefail
          PARENT='773bdf96026e9fe6d5e11f4d9dffa1629e2c0ea3'
          PARENT_TREE='73d54e1b38eeaff00425108b43294876cc634510'
          ROOT='.schoolhouse-irs-candidate-latest-filing-xml-v4'
          EXECUTE="$ROOT/EXECUTE"
          BUNDLE="$ROOT/acquire.py.gz.b64"
          WORKFLOW='.github/workflows/temp-schoolhouse-irs-candidate-latest-filing-xml-v4.yml'
          GZIP="$RUNNER_TEMP/acquire-schoolhouse-irs-candidate-latest-filing-xml-v4.py.gz"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-irs-candidate-latest-filing-xml-v4.py"

          git fetch --no-tags origin main "$PARENT"
          test "$(git rev-parse origin/main)" = "$PARENT"
          test "$(git rev-parse "$PARENT^{tree}")" = "$PARENT_TREE"
          test "$(git merge-base HEAD origin/main)" = "$PARENT"

          mapfile -t CHANGED < <(git diff --name-only "$PARENT"..HEAD | sort)
          EXPECTED=(
            '.github/workflows/temp-schoolhouse-irs-candidate-latest-filing-xml-v4.yml'
            '.schoolhouse-irs-candidate-latest-filing-xml-v4/EXECUTE'
            '.schoolhouse-irs-candidate-latest-filing-xml-v4/acquire.py.gz.b64'
          )
          test "${#CHANGED[@]}" -eq 3
          for i in "${!EXPECTED[@]}"; do test "${CHANGED[$i]}" = "${EXPECTED[$i]}"; done
          git diff --exit-code -- "$WORKFLOW" "$EXECUTE" "$BUNDLE"

          test "$(git rev-parse "$PARENT:data/intake/schoolhouse-irs-candidate-filing-index-census/filing-index-matches.jsonl")" = '6fdf8f0510c80b4a0e7d438dd03fc18fee0dd8e9'
          test "$(git rev-parse "$PARENT:data/intake/schoolhouse-irs-candidate-filing-index-census/summary.json")" = '699842a7518cbddc51e25305e8a65a8417860ee7'
          test "$(git rev-parse "$PARENT:data/intake/schoolhouse-irs-candidate-filing-index-census/route-policy.json")" = '99a7376ff408b6856f479d779716061f14d52e05'

          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = 'bc25cd5b71f254c8e0cbafa28056acc17fe2546aded0ce8cb748ab3f4cc65b3b'
          base64 -d "$BUNDLE" > "$GZIP"
          test "$(sha256sum "$GZIP" | awk '{print $1}')" = '2fb7fb2a962db2806937d05ed76b193f2aa762b64c43bd0b74575072a0dcfe49'
          gzip -dc "$GZIP" > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = 'cd3271073327c0b679e8e322cdb8ab4452107fd0b3507b8ddf7f896ca2da4c86'
          python -m py_compile "$RUNNER"
          python "$RUNNER" --self-test

          grep -Fx 'acquire=schoolhouse-irs-candidate-latest-filing-xml-v4' "$EXECUTE"
          grep -Fx "canonical_parent=$PARENT" "$EXECUTE"
          grep -Fx "canonical_parent_tree=$PARENT_TREE" "$EXECUTE"
          grep -Fx 'sealed_candidate_rows=641' "$EXECUTE"
          grep -Fx 'sealed_candidate_eins=438' "$EXECUTE"
          grep -Fx 'filing_index_match_rows=486' "$EXECUTE"
          grep -Fx 'candidate_eins_with_filing_rows=92' "$EXECUTE"
          grep -Fx 'selected_latest_xml_routes=92' "$EXECUTE"
          grep -Fx 'official_archive_urls=67' "$EXECUTE"
          grep -Fx 'maximum_total_requests=360' "$EXECUTE"
          grep -Fx 'range_only_archive_access=true' "$EXECUTE"
          grep -Fx 'batch_zip_fetches=0' "$EXECUTE"
          grep -Fx 'result_spawned_requests=0' "$EXECUTE"
          grep -Fx 'raw_xml_retained=false' "$EXECUTE"
          grep -Fx 'raw_term_text_retained=false' "$EXECUTE"
          grep -Fx 'observed_organization_name_values_retained=0' "$EXECUTE"
          grep -Fx 'officer_or_person_name_values_retained=0' "$EXECUTE"
          grep -Fx 'identity_admitted=false' "$EXECUTE"
          grep -Fx 'relationship_admitted=false' "$EXECUTE"
          grep -Fx 'negative_existence_claim_created=false' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"
          grep -Fx 'publication_effect=none' "$EXECUTE"
          grep -Fx 'adoption_effect=none' "$EXECUTE"
          grep -Fx 'graph_effect=none' "$EXECUTE"

      - name: Execute exact range-only latest-filing XML v4 screen
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/schoolhouse-irs-candidate-latest-filing-xml-v4"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-irs-candidate-latest-filing-xml-v4.py"
          rm -rf "$OUT"
          python "$RUNNER" --repo-root "$GITHUB_WORKSPACE" --output "$OUT" \
            2>&1 | tee "$RUNNER_TEMP/schoolhouse-irs-candidate-latest-filing-xml-v4.log"
          status=${PIPESTATUS[0]}
          mkdir -p "$OUT"
          printf '%s\n' "$status" > "$OUT/RUNNER_EXIT_CODE"
          cp "$RUNNER_TEMP/schoolhouse-irs-candidate-latest-filing-xml-v4.log" "$OUT/RUNNER-OUTPUT.log"
          exit "$status"

      - name: Upload terminal privacy-repaired artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-candidate-latest-filing-xml-v4
          path: ${{ runner.temp }}/schoolhouse-irs-candidate-latest-filing-xml-v4
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Require complete v4 denominator and zero retained filing-name values
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/schoolhouse-irs-candidate-latest-filing-xml-v4"
          test -f "$ROOT/RUNNER_EXIT_CODE"
          test "$(cat "$ROOT/RUNNER_EXIT_CODE")" = '0'
          for file in \
            selection.jsonl archive-catalog.jsonl xml-results.jsonl \
            source-receipt.json route-policy.json adjudication.json \
            summary.json artifact-manifest.json SHA256SUMS; do
            test -f "$ROOT/$file"
          done
          (cd "$ROOT" && sha256sum -c SHA256SUMS)

          python - "$ROOT" <<'PY'
          from pathlib import Path
          import json, sys

          root = Path(sys.argv[1])
          load = lambda name: json.loads((root / name).read_text())
          rows = lambda name: [json.loads(line) for line in (root / name).read_text().splitlines() if line.strip()]
          summary = load('summary.json')
          policy = load('route-policy.json')
          adjudication = load('adjudication.json')
          source = load('source-receipt.json')
          manifest = load('artifact-manifest.json')
          selection = rows('selection.jsonl')
          catalogs = rows('archive-catalog.jsonl')
          results = rows('xml-results.jsonl')

          assert summary['schema_version'] == 'schoolhouse-irs-candidate-latest-filing-xml-v4@1'
          assert summary['sealed_candidate_rows'] == 641
          assert summary['sealed_candidate_eins'] == 438
          assert summary['filing_index_match_rows'] == 486
          assert summary['candidate_eins_with_filing_rows'] == 92
          assert summary['selected_latest_xml_routes'] == len(selection) == len(results) == 92
          assert len({row['ein'] for row in selection}) == 92
          assert len({row['object_id'] for row in selection}) == 92
          assert all(row['selection_rule'] == 'maximum_index_year_then_object_id_per_candidate_ein' for row in selection)
          assert all(row['raw_index_taxpayer_name_retained'] is False for row in selection)
          assert all(row['observed_xml_organization_name_values_retained'] == 0 for row in selection)

          assert summary['official_archive_urls_declared'] == source['archive_url_count'] == 67
          assert 0 < summary['official_archive_urls_attempted'] == len(catalogs) <= 67
          assert summary['request_count'] <= 360
          assert summary['aggregate_response_bytes'] <= 2147483648
          assert sum(summary['terminal_state_counts'].values()) == 92
          assert summary['batch_zip_fetches'] == 0
          assert summary['result_spawned_requests'] == 0
          assert summary['query_submissions'] == summary['forms_submitted'] == 0
          assert summary['raw_xml_retained'] is False
          assert summary['raw_term_text_retained'] is False
          assert summary['observed_organization_name_values_retained'] == 0
          assert summary['officer_or_person_name_values_retained'] == 0
          assert summary['street_address_rows_retained'] == 0
          assert summary['contact_detail_rows_retained'] == 0
          assert summary['preparer_rows_retained'] == 0
          assert summary['private_support_rows'] == 0
          assert summary['identities_admitted'] == 0
          assert summary['relationships_admitted'] == 0
          assert summary['negative_existence_claims_created'] == 0
          assert summary['outside_human_dependency'] is False
          assert summary['publication_effect'] == summary['adoption_effect'] == summary['graph_effect'] == 'none'

          allowed_target_ids = {'schoolhouse_compact','school_house_spaced','school_house_dotted','bravo_victor','bvvc'}
          allowed_mechanism_ids = {'fiscal_sponsor','fiscal_sponsorship','sponsored_project','related_organization','related_party'}
          forbidden = {
              'observed_organization_name','organization_name','filing_organization_name',
              'matched_text','raw_xml','raw_term_text','officer_name','person_name',
              'street_address','mailing_address','postal_code','email','phone','preparer_name'
          }
          terminal_states = {
              'screened_official_xml','member_not_found_complete_archive_catalog',
              'archive_catalog_incomplete_target_unresolved','duplicate_archive_member_matches',
              'xml_parse_error','member_acquisition_or_integrity_error'
          }
          for row in results:
              assert row['state'] in terminal_states
              assert not (forbidden & set(row))
              assert row['observed_organization_name_values_retained'] == 0
              assert row['officer_or_person_name_values_retained'] == 0
              assert row['raw_xml_retained'] is False
              assert row['raw_term_text_retained'] is False
              assert row['batch_zip_retained'] is False
              assert row['street_address_rows_retained'] == 0
              assert row['contact_detail_rows_retained'] == 0
              assert row['preparer_rows_retained'] == 0
              assert row['private_support_rows'] == 0
              assert row['identity_admitted'] is False
              assert row['relationship_admitted'] is False
              assert row['negative_existence_claim_created'] is False
              assert row['outside_human_dependency'] is False
              assert row['publication_effect'] == row['adoption_effect'] == row['graph_effect'] == 'none'
              assert set(row.get('target_term_ids', [])) <= allowed_target_ids
              assert set(row.get('mechanism_term_ids', [])) <= allowed_mechanism_ids

          assert policy['selection_contract']['selected_latest_xml_routes'] == 92
          assert policy['request_bounds']['range_requests_only_for_archives'] is True
          assert policy['request_bounds']['maximum_total_requests'] == 360
          assert policy['retention']['observed_organization_name_values_retained'] == 0
          assert policy['retention']['raw_xml_retained'] is False
          assert policy['interpretation']['candidate_name_alignment_is_not_public_schoolhouse_identity'] is True
          assert adjudication['observed_organization_name_values_retained'] == 0
          assert adjudication['public_schoolhouse_identity_admitted'] is False
          assert adjudication['fiscal_sponsor_relationship_admitted'] is False
          assert adjudication['grant_or_funding_relationship_admitted'] is False
          assert adjudication['governance_or_control_relationship_admitted'] is False
          assert adjudication['negative_existence_claim_created'] is False
          assert source['range_only_archive_access'] is True
          assert source['batch_zip_downloaded'] is False
          assert source['raw_xml_retained'] is False
          assert manifest['counts']['selection_rows'] == 92
          assert manifest['counts']['xml_result_rows'] == 92
          assert manifest['raw_source_retained'] is False

          assert not any(path.suffix.lower() in {'.xml','.zip'} for path in root.rglob('*') if path.is_file())
          print(json.dumps({
              'selected_latest_xml_routes': 92,
              'successful_xml_screens': summary['successful_xml_screens'],
              'candidate_name_alignment_rows': summary['candidate_legal_name_alignment_rows'],
              'target_term_hit_xml_rows': summary['target_term_hit_xml_rows'],
              'mechanism_term_hit_xml_rows': summary['mechanism_term_hit_xml_rows'],
              'observed_organization_name_values_retained': 0,
              'request_count': summary['request_count'],
          }, sort_keys=True))
          PY
