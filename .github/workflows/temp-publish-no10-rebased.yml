name: TEMP publish rebased No. 10 broad-adjacency correction

on:
  push:
    branches:
      - agent/no10-broad-adjacency-rebase-11dd282
    paths:
      - .github/workflows/temp-publish-no10-rebased.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_SHA: 11dd282b7dadd5b7751c1bc9ad12af03449f2185
      BASE_TREE: c4cf7c27cf5b6f7d5ee57b219a3f3dac29448934
      PAYLOAD_BRANCH: agent/clifford-next-frontier-export-7a4007f
      CONTROLLER_BRANCH: agent/no10-broad-adjacency-rebase-11dd282
      PRODUCT_BRANCH: agent/no10-broad-adjacency-boundary-product
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate and execute bounded publisher
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$CONTROLLER_BRANCH:.github/temporary/no10-publish.sh" > /tmp/no10-publish.sh
          echo '61301f2f61a37b23082e7f01bdd0fe4dd2110677e0d84420e14e3e1089ecb6ed  /tmp/no10-publish.sh' | sha256sum -c -
          bash -n /tmp/no10-publish.sh
          bash /tmp/no10-publish.sh

      - name: Upload qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no10-broad-adjacency-boundary-rebased-qualification
          if-no-files-found: warn
          path: |
            /tmp/no10-boundary.patch
            /tmp/no10-pages-validator.patch
            /tmp/no10-sg12-custody-repair.patch
            /tmp/source-paths.txt
            /tmp/generated-paths.txt
            /tmp/temporal-generated-paths.txt
            /tmp/product-paths.txt
            /tmp/staged-product-paths.txt
            /tmp/canonical-release.log
            /tmp/product-release.log
            /tmp/clean-release.log
            /tmp/canonical-answerable-power.json
            /tmp/product-answerable-power.json
            /tmp/product-commit.txt
            /tmp/product-tree.txt
