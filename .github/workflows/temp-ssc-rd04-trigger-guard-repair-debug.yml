name: TEMP diagnose RD-04 trigger-guard repair

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd04-trigger-guard-repair-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_MAIN_FLOOR: b9d09c28bcaa0b00c699ff40e893df7b9675ff0f
      TARGET_BRANCH: agent/ssc-rd04-wave03-trigger-path-validator-repair-product-v1
      TARGET_LEASE: b9d09c28bcaa0b00c699ff40e893df7b9675ff0f
      CARRIER_PATH: .ssc-rd04-trigger-guard-repair/carrier.b64
      CARRIER_B64_SHA256: 37e171dd694e511c4b1cb171515685c430b7052721ebbdf4dc9e21f1ac36e8d3
      CARRIER_TAR_SHA256: cccec760a7acd895bfeb1b907aa7cb31449f41ecba443ef3dd388dbbb3062028
      PATHS_SHA256: 51c03b0f79a93357366b8203d237e94ebd88027982bc953bded905bc5eaf3693
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace every prequalification assertion
        shell: bash
        run: |
          set -Eeuxo pipefail
          RECEIPT=/tmp/ssc-rd04-trigger-guard-repair-debug
          PACKAGE=/tmp/ssc-rd04-trigger-guard-repair-debug-package
          WORK=/tmp/ssc-rd04-trigger-guard-repair-debug-worktree
          ARCHIVE=/tmp/ssc-rd04-trigger-guard-repair-debug.tar.xz
          rm -rf "$RECEIPT" "$PACKAGE" "$WORK" "$ARCHIVE"
          mkdir -p "$RECEIPT" "$PACKAGE"

          cat > "$RECEIPT/expected-paths.txt" <<'EOF'
          data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/intake-product-manifest.json
          test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js
          tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          EOF
          sed -i 's/^          //' "$RECEIPT/expected-paths.txt"
          sha256sum "$RECEIPT/expected-paths.txt"
          test "$(sha256sum "$RECEIPT/expected-paths.txt" | awk '{print $1}')" = "$PATHS_SHA256"

          cat > "$RECEIPT/permanent-product-paths.txt" <<'EOF'
          .github/workflows/status-sovereignty-rd-wave03-rd04-state-implementation-intake.yml
          data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/field-matrix-contract.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/intake-product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/source-census-protocol.json
          data/project/ssc-residual-wave03/seeds/RD-04-C02.json
          docs/milestones/ssc-rd-wave03-rd04-state-implementation-intake.md
          schemas/status-sovereignty-rd-wave03-rd04-state-implementation-intake.schema.json
          test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js
          tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py
          tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          EOF
          sed -i 's/^          //' "$RECEIPT/permanent-product-paths.txt"
          sort -o "$RECEIPT/permanent-product-paths.txt" "$RECEIPT/permanent-product-paths.txt"

          cp "$CARRIER_PATH" "$RECEIPT/package.tar.xz.b64"
          sha256sum "$RECEIPT/package.tar.xz.b64"
          test "$(sha256sum "$RECEIPT/package.tar.xz.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 --decode "$RECEIPT/package.tar.xz.b64" > "$ARCHIVE"
          sha256sum "$ARCHIVE"
          test "$(sha256sum "$ARCHIVE" | awk '{print $1}')" = "$CARRIER_TAR_SHA256"
          tar -tJf "$ARCHIVE" > "$RECEIPT/archive-paths.txt"
          diff -u "$RECEIPT/expected-paths.txt" "$RECEIPT/archive-paths.txt"
          tar -xJf "$ARCHIVE" -C "$PACKAGE"
          find "$PACKAGE" -type f -print | sort
          test "$(find "$PACKAGE" -type f | wc -l | tr -d ' ')" = 3
          test "$(find "$PACKAGE" -type l | wc -l | tr -d ' ')" = 0

          git fetch --no-tags origin main "$TARGET_BRANCH"
          LIVE_MAIN=$(git rev-parse origin/main)
          LIVE_TARGET=$(git rev-parse "origin/$TARGET_BRANCH")
          printf 'live_main=%s\nlive_target=%s\n' "$LIVE_MAIN" "$LIVE_TARGET"
          test "$LIVE_TARGET" = "$TARGET_LEASE"
          git merge-base --is-ancestor "$BASE_MAIN_FLOOR" "$LIVE_MAIN"
          git diff --name-only "$BASE_MAIN_FLOOR..$LIVE_MAIN" | sort > "$RECEIPT/main-increment-paths.txt"
          cat "$RECEIPT/main-increment-paths.txt"
          comm -12 "$RECEIPT/permanent-product-paths.txt" "$RECEIPT/main-increment-paths.txt" | tee "$RECEIPT/overlap.txt"
          test ! -s "$RECEIPT/overlap.txt"

          git worktree add --detach "$WORK" "$LIVE_MAIN"
          cp -a "$PACKAGE"/. "$WORK"/
          cd "$WORK"
          while IFS= read -r path; do git add -- "$path"; done < "$RECEIPT/expected-paths.txt"
          git diff --cached --name-status
          git diff --cached --name-only | sort > "$RECEIPT/actual-paths.txt"
          diff -u "$RECEIPT/expected-paths.txt" "$RECEIPT/actual-paths.txt"
          test "$(git diff --cached --name-status | awk '$1 != "M" {n++} END {print n+0}')" = 0
          if grep -E '(^|/)(tmp|transport)(/|$)|carrier|materializer|trigger' "$RECEIPT/actual-paths.txt"; then exit 1; fi
          echo prequalification_assertions_complete
