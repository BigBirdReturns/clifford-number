name: TEMP adjudicate RD-04 North Dakota FY2026 fixed public protocol terminally v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-base-v2
    paths:
      - '.tmp/rd04-nd-fy2026-fixed-protocol-terminal-adjudication-v2/trigger.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: temp-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-v2
  cancel-in-progress: false

jobs:
  adjudicate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'agent/ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-base-v2' &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-trigger-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CURRENT_PARENT: cffe670fef5c006c7e963421d9fd18c29ed40fba
      PREVIOUS_RD04_PARENT: aa1c0c3f741bf2fb7aa923a4008e5bc927dca032
      PC59_PRODUCT_HEAD: 80a9898890c2a8b271d4d36f74d37c1975149b25
      MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
      EXPECTED_MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
      EXPECTED_TARGET_CELL_SHA256: cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe
      EXPECTED_ROW_STATE_CELL_SHA256: 6a4c7d204c6c99a89f3c121065860806668c5da850f44c67fe42b4dc84b1b5c3
      ARCHIVE_PREFIX: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication
      ARCHIVE_DISPOSITION_BLOB: 942ac9fd34ee0857aa66b941c579487b01dd9d70
      ARCHIVE_CELL_CUSTODY_BLOB: 04e405425082714c5f6b4ac83de9351a41a27b38
      WORKFLOW_PATH: .github/workflows/temp-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-v2.yml
      TRIGGER_PATH: .tmp/rd04-nd-fy2026-fixed-protocol-terminal-adjudication-v2/trigger.json
      BASE_BRANCH: agent/ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-base-v2
      HEAD_BRANCH: agent/ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-trigger-v2
      REFRESH_ARTIFACT_ID: '9041971925'
      REFRESH_ARTIFACT_BYTES: '22990'
      REFRESH_ARTIFACT_SHA256: 764c617dd6e8510d4aacca46c06fb2275eaaffa54aebd5302b15ae54aa50c065
      REFRESH_EXECUTION_RECEIPT_SHA256: a0babfb626b91a766c64132f211d6e156328cee663a5ed710bc063ecd69d4cb6
      REFRESH_ROUTE_RECEIPT_SHA256: 5e543af1eb7ed95f1e37dad429cb3ef5a51b834cfb23511a358e71f3393afbbd
      REFRESH_REQUEST_LEDGER_SHA256: dde96eb0ebe3b53dca7b82ed50c79f7733ec1f29e73fcc41cd4465905b0301c5
      REFRESH_LOCATOR_INVENTORY_SHA256: bef7edec65c05ca3aa030f33afd2a403672d4199f056e7478f44d4dcd133c074
      REFRESH_BODY_SHA256: dcab625aeeebc30b1cf38dd32f67f0cb766a8e33735694b00f041e03d446476f
      REFRESH_CONSUMING_HEAD: 421d3f517d824a75f21eacb18c192f8bb7fe3d00
      REFRESH_CONSUMED_LOCK: lock/ssc-rd04-nd-fy2026-current-index-refresh-execution-v1-consumed
      REFRESH_EXECUTABLE_LOCK: lock/ssc-rd04-nd-fy2026-current-index-refresh-execution-v1
      TARGET_CANDIDATE_ID: RD04-ND-FY2026-FIXED-PROTOCOL-TARGET-CELL-CANDIDATE-V2
      ROW_CANDIDATE_ID: RD04-ND-FY2026-FIXED-PROTOCOL-ROW-STATE-CANDIDATE-V2
      OUT: /tmp/ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-v2
      WORK: /tmp/ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-v2-work

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Adjudicate exact fixed public-record denominator without source contact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT" "$WORK/refresh"
          printf '%s\n' topology > "$OUT/STAGE"
          printf '%s\n' 1 > "$OUT/EXIT_CODE"

          seal() {
            (cd "$OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          }

          fail() {
            local stage="$1" reason="$2"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            printf '%s\n' 1 > "$OUT/EXIT_CODE"
            python - "$OUT/receipt.json" "$stage" "$reason" <<'PY'
          import json,sys
          path,stage,reason=sys.argv[1:]
          obj={
            "schema_version":"ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-receipt@2",
            "state":"failed_closed","failed_or_final_stage":stage,"exit_code":1,"reason":reason,
            "source_requests":0,"route_executions":0,"source_admissions":0,"field_decisions":0,
            "bounded_promotion_candidates":0,"selected_followup_routes":0,"field_terminalizations":0,
            "matrix_updates":0,"row_state_mutations":0,"class_closed":False,
            "cumulative_ledger_effect":"none","outside_human_dependency":False,
            "publication_effect":"none","adoption_effect":"none","graph_effect":"none",
            "additional_execution_authorized":False
          }
          open(path,'w',encoding='utf-8').write(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY
            seal
            exit 1
          }

          test "$EVENT_NAME" = pull_request || fail topology event_not_pull_request
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY" || fail topology head_repository_mismatch
          test "$BASE_REF" = "$BASE_BRANCH" || fail topology base_branch_mismatch
          test "$HEAD_REF" = "$HEAD_BRANCH" || fail topology head_branch_mismatch
          test "$(git rev-parse HEAD)" = "$HEAD_SHA" || fail topology checkout_head_mismatch
          test "$(git rev-parse HEAD^)" = "$BASE_SHA" || fail topology head_parent_mismatch
          test "$(git rev-parse "$BASE_SHA^")" = "$CURRENT_PARENT" || fail topology base_parent_mismatch
          mapfile -t base_paths < <(git diff --name-only "$CURRENT_PARENT" "$BASE_SHA")
          mapfile -t trigger_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          test "${#base_paths[@]}" = 1 || fail topology base_path_count_mismatch
          test "${base_paths[0]}" = "$WORKFLOW_PATH" || fail topology base_path_mismatch
          test "${#trigger_paths[@]}" = 1 || fail topology trigger_path_count_mismatch
          test "${trigger_paths[0]}" = "$TRIGGER_PATH" || fail topology trigger_path_mismatch
          git diff --check "$CURRENT_PARENT" "$HEAD_SHA"

          git fetch --quiet origin main "$REFRESH_CONSUMED_LOCK" "$REFRESH_EXECUTABLE_LOCK"
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$LIVE_MAIN" = "$CURRENT_PARENT" || fail topology live_main_moved
          read -r merge_parent_1 merge_parent_2 merge_parent_extra <<< "$(git show -s --format='%P' "$CURRENT_PARENT")"
          test "$merge_parent_1" = "$PREVIOUS_RD04_PARENT" || fail topology pc59_merge_first_parent_mismatch
          test "$merge_parent_2" = "$PC59_PRODUCT_HEAD" || fail topology pc59_merge_second_parent_mismatch
          test -z "${merge_parent_extra:-}" || fail topology pc59_merge_parent_count_mismatch

          expected_pc59_paths=(
            .github/workflows/preference-custody-v57.yml
            .github/workflows/preference-linkage-repository-owner-login-canonical-profile-api-location-account-type-state-suspension-assurance.yml
            data/research/preference-custody/control-manifest-v57.json
            data/research/preference-custody/preference-linkage-repository-owner-login-canonical-profile-api-location-account-type-state-suspension-assurance.fixture.json
            docs/preference-custody-laboratory-floor-v57.md
            docs/preference-custody-repository-owner-login-canonical-profile-api-location-account-type-state-suspension-assurance.md
            test/preference-custody-manifest-v57.test.js
            test/preference-linkage-repository-owner-login-canonical-profile-api-location-account-type-state-suspension-assurance.test.js
            tools/compile-preference-custody-manifest-v57.mjs
            tools/compile-preference-linkage-repository-owner-login-canonical-profile-api-location-account-type-state-suspension-assurance.mjs
            tools/lib/preference-custody-manifest-v57.mjs
            tools/lib/preference-linkage-repository-owner-login-canonical-profile-api-location-account-type-state-suspension-assurance.mjs
            tools/validate-preference-custody-manifest-v57.mjs
            tools/validate-preference-linkage-repository-owner-login-canonical-profile-api-location-account-type-state-suspension-assurance.mjs
          )
          mapfile -t actual_pc59_status < <(git diff --name-status "$PREVIOUS_RD04_PARENT" "$CURRENT_PARENT")
          test "${#actual_pc59_status[@]}" = 14 || fail topology pc59_path_count_mismatch
          mapfile -t actual_pc59_paths < <(printf '%s\n' "${actual_pc59_status[@]}" | awk -F '\t' '$1=="A"{print $2}' | LC_ALL=C sort)
          mapfile -t expected_pc59_paths_sorted < <(printf '%s\n' "${expected_pc59_paths[@]}" | LC_ALL=C sort)
          test "${#actual_pc59_paths[@]}" = 14 || fail topology pc59_delta_not_addition_only
          test "$(printf '%s\n' "${actual_pc59_paths[@]}")" = "$(printf '%s\n' "${expected_pc59_paths_sorted[@]}")" || fail topology pc59_path_set_mismatch
          printf '%s\n' "${actual_pc59_status[@]}" > "$OUT/pc59-intervening-paths.txt"

          test "$(git rev-parse "origin/$REFRESH_CONSUMED_LOCK")" = "$REFRESH_CONSUMING_HEAD" || fail topology consumed_lock_mismatch
          test "$(git rev-parse "origin/$REFRESH_EXECUTABLE_LOCK")" = "$PREVIOUS_RD04_PARENT" || fail topology executable_lock_not_retired
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$EXPECTED_MATRIX_BLOB" || fail topology matrix_blob_moved

          ARCHIVE_DISPOSITION="$ARCHIVE_PREFIX/north-dakota-disposition.json"
          ARCHIVE_CELL_CUSTODY="$ARCHIVE_PREFIX/current-cell-custody.json"
          test "$(git rev-parse "origin/main:$ARCHIVE_DISPOSITION")" = "$ARCHIVE_DISPOSITION_BLOB" || fail topology archive_disposition_blob_mismatch
          test "$(git rev-parse "origin/main:$ARCHIVE_CELL_CUSTODY")" = "$ARCHIVE_CELL_CUSTODY_BLOB" || fail topology archive_cell_custody_blob_mismatch
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-mi-nm-request-archive-north-dakota-disposition@1" and
            .archive_observation.member_count==19 and .archive_observation.north_dakota_scoped_member_count==0 and
            .current_state_after.field_state=="still_open" and .current_state_after.field_terminal==false and
            .effects.archive_inventory_source_admissions==1 and .effects.member_document_source_admissions==0 and
            .effects.new_route_executions==0 and .effects.new_source_requests==0 and
            .effects.field_classifications==0 and .effects.field_terminalizations==0 and
            .effects.matrix_updates==0 and .effects.row_state_mutations==0 and .effects.class_closed==false and
            .independent_current_index_protocol.fixed_routes==1 and
            .independent_current_index_protocol.route_executions_authorized_by_this_product==0
          ' "$ARCHIVE_DISPOSITION" > /dev/null || fail topology archive_disposition_semantics_mismatch
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-mi-nm-request-archive-current-cell-custody@1" and
            .matrix.git_blob_sha=="19357f8214ab2710bc5e75b3fae8c7fb09ff1654" and
            .north_dakota.target_cell_sha256=="cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe" and
            .north_dakota.row_state_cell_sha256=="6a4c7d204c6c99a89f3c121065860806668c5da850f44c67fe42b4dc84b1b5c3" and
            .north_dakota.row_state=="still_open" and .north_dakota.terminal_fields==7 and .north_dakota.open_fields==2 and
            .north_dakota.target_cell_state=="still_open" and .north_dakota.target_cell_terminal==false and
            .north_dakota.row_state_cell_state=="still_open" and .north_dakota.row_state_cell_terminal==false
          ' "$ARCHIVE_CELL_CUSTODY" > /dev/null || fail topology archive_cell_custody_semantics_mismatch
          cp "$ARCHIVE_DISPOSITION" "$OUT/archive-north-dakota-disposition.json"
          cp "$ARCHIVE_CELL_CUSTODY" "$OUT/archive-current-cell-custody.json"

          python - "$MATRIX_PATH" "$EXPECTED_TARGET_CELL_SHA256" "$EXPECTED_ROW_STATE_CELL_SHA256" > "$OUT/current-cell-proof.json" <<'PY'
          import hashlib,json,sys
          path,target_expected,row_expected=sys.argv[1:]
          doc=json.load(open(path,encoding='utf-8'))
          rows=[r for r in doc['rows'] if r.get('unit_id')=='US-STATE-ND']; assert len(rows)==1
          row=rows[0]
          target=[c for c in row['cells'] if c.get('field_id')=='abawd_or_work_requirement_waiver_state_and_governing_period']; assert len(target)==1; target=target[0]
          rowcell=[c for c in row['cells'] if c.get('field_id')=='field_and_row_terminal_state']; assert len(rowcell)==1; rowcell=rowcell[0]
          canon=lambda x: json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          target_sha=hashlib.sha256(canon(target)).hexdigest(); row_sha=hashlib.sha256(canon(rowcell)).hexdigest()
          assert target_sha==target_expected and row_sha==row_expected
          assert row['row_state']=='still_open' and row['terminal_fields']==7 and row['open_fields']==2
          assert target['state']=='still_open' and target['terminal'] is False and target['value'] is None
          assert rowcell['state']=='still_open' and rowcell['terminal'] is False and rowcell['value'] is None
          print(json.dumps({
            'unit_id':'US-STATE-ND','row_state':row['row_state'],'terminal_fields':7,'open_fields':2,
            'target_cell_sha256':target_sha,'target_cell_state':target['state'],'target_cell_terminal':False,'target_cell_value':None,
            'row_state_cell_sha256':row_sha,'row_state_cell_state':rowcell['state'],'row_state_cell_terminal':False,'row_state_cell_value':None
          },indent=2,sort_keys=True))
          PY
          printf '%s\n' "$CURRENT_PARENT" > "$OUT/live-main.txt"
          printf '%s\n' "$EXPECTED_MATRIX_BLOB" > "$OUT/live-matrix-blob.txt"

          jq -e --arg parent "$CURRENT_PARENT" --arg previous "$PREVIOUS_RD04_PARENT" --arg product "$PC59_PRODUCT_HEAD" --arg base "$BASE_SHA" --arg matrix "$EXPECTED_MATRIX_BLOB" --arg target "$EXPECTED_TARGET_CELL_SHA256" --arg row "$EXPECTED_ROW_STATE_CELL_SHA256" --arg archive_d "$ARCHIVE_DISPOSITION_BLOB" --arg archive_c "$ARCHIVE_CELL_CUSTODY_BLOB" --arg artifact "$REFRESH_ARTIFACT_SHA256" --arg exec "$REFRESH_EXECUTION_RECEIPT_SHA256" --arg route "$REFRESH_ROUTE_RECEIPT_SHA256" --arg ledger "$REFRESH_REQUEST_LEDGER_SHA256" --arg inventory "$REFRESH_LOCATOR_INVENTORY_SHA256" --arg body "$REFRESH_BODY_SHA256" --arg consuming "$REFRESH_CONSUMING_HEAD" '
            .schema_version=="ssc-rd04-nd-fy2026-fixed-protocol-terminal-adjudication-trigger@2" and
            .issue==1017 and .expected_parent==$parent and .previous_rd04_parent==$previous and
            .pc59_product_head==$product and .workflow_base==$base and .matrix_blob==$matrix and
            .target_cell_sha256==$target and .row_state_cell_sha256==$row and
            .archive_disposition_blob==$archive_d and .archive_current_cell_custody_blob==$archive_c and
            .refresh_artifact_id==9041971925 and .refresh_artifact_bytes==22990 and
            .refresh_artifact_sha256==$artifact and .refresh_execution_receipt_sha256==$exec and
            .refresh_route_receipt_sha256==$route and .refresh_physical_request_ledger_sha256==$ledger and
            .refresh_locator_inventory_sha256==$inventory and .refresh_body_sha256==$body and
            .refresh_consuming_head==$consuming and .source_requests==0 and .route_executions==0 and
            .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and
            .class_closed==false and .outside_human_dependency==false
          ' "$TRIGGER_PATH" > /dev/null || fail topology trigger_contract_mismatch
          cp "$TRIGGER_PATH" "$OUT/trigger.json"

          printf '%s\n' authenticate_refresh_artifact > "$OUT/STAGE"
          META="$WORK/refresh-meta.json"
          ZIP="$WORK/refresh.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFRESH_ARTIFACT_ID}" > "$META"
          test "$(jq -r .id "$META")" = "$REFRESH_ARTIFACT_ID" || fail authenticate_refresh_artifact artifact_id_mismatch
          test "$(jq -r .size_in_bytes "$META")" = "$REFRESH_ARTIFACT_BYTES" || fail authenticate_refresh_artifact artifact_size_mismatch
          test "$(jq -r .digest "$META")" = "sha256:${REFRESH_ARTIFACT_SHA256}" || fail authenticate_refresh_artifact artifact_metadata_digest_mismatch
          test "$(jq -r .expired "$META")" = false || fail authenticate_refresh_artifact artifact_expired
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFRESH_ARTIFACT_ID}/zip" > "$ZIP"
          test "$(stat -c %s "$ZIP")" = "$REFRESH_ARTIFACT_BYTES" || fail authenticate_refresh_artifact artifact_download_size_mismatch
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$REFRESH_ARTIFACT_SHA256" || fail authenticate_refresh_artifact artifact_download_digest_mismatch
          unzip -tq "$ZIP" > "$OUT/refresh-zip-test.txt" || fail authenticate_refresh_artifact artifact_zip_invalid
          unzip -q "$ZIP" -d "$WORK/refresh"
          test "$(wc -l < "$WORK/refresh/SHA256SUMS")" = 16 || fail authenticate_refresh_artifact checksum_row_count_mismatch
          (cd "$WORK/refresh" && sha256sum -c SHA256SUMS > "$OUT/refresh-internal-check.txt") || fail authenticate_refresh_artifact artifact_internal_checksum_failure
          test "$(sha256sum "$WORK/refresh/execution-receipt.json" | awk '{print $1}')" = "$REFRESH_EXECUTION_RECEIPT_SHA256" || fail authenticate_refresh_artifact execution_receipt_digest_mismatch
          test "$(sha256sum "$WORK/refresh/route-receipt.json" | awk '{print $1}')" = "$REFRESH_ROUTE_RECEIPT_SHA256" || fail authenticate_refresh_artifact route_receipt_digest_mismatch
          test "$(sha256sum "$WORK/refresh/physical-request-ledger.json" | awk '{print $1}')" = "$REFRESH_REQUEST_LEDGER_SHA256" || fail authenticate_refresh_artifact request_ledger_digest_mismatch
          test "$(sha256sum "$WORK/refresh/locator-inventory.json" | awk '{print $1}')" = "$REFRESH_LOCATOR_INVENTORY_SHA256" || fail authenticate_refresh_artifact locator_inventory_digest_mismatch
          test "$(stat -c %s "$WORK/refresh/transport/response-body.bin")" = 63505 || fail authenticate_refresh_artifact body_size_mismatch
          test "$(sha256sum "$WORK/refresh/transport/response-body.bin" | awk '{print $1}')" = "$REFRESH_BODY_SHA256" || fail authenticate_refresh_artifact body_digest_mismatch

          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-current-index-refresh-execution@1" and
            .state=="complete" and .failed_or_final_stage=="complete" and .exit_code==0 and
            .execution_head=="421d3f517d824a75f21eacb18c192f8bb7fe3d00" and
            .execution_parent=="aa1c0c3f741bf2fb7aa923a4008e5bc927dca032" and
            .fixed_route_count==1 and .terminal_route_count==1 and .physical_requests==1 and
            .http_status==200 and .body_bytes==63505 and
            .body_sha256=="dcab625aeeebc30b1cf38dd32f67f0cb766a8e33735694b00f041e03d446476f" and
            .byte_identical_to_baseline==true and
            .route_terminal_state=="terminal_http_success_body_captured" and
            .result_spawned_requests==0 and .source_admissions==0 and
            .field_classifications==0 and .field_terminalizations==0 and
            .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false and
            .cumulative_ledger_effect=="none" and .outside_human_dependency==false and
            .publication_effect=="none" and .adoption_effect=="none" and .graph_effect=="none" and
            .additional_execution_authorized==false
          ' "$WORK/refresh/execution-receipt.json" > /dev/null || fail authenticate_refresh_artifact execution_receipt_semantics_mismatch
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-current-index-refresh-route-receipt@1" and
            .route_id=="RD04-ND-FNA-TIME-LIMIT-WAIVER-INDEX-CANONICAL-2025-2029-REFRESH-2026-08-09-001" and
            .requested_url=="https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029" and
            .effective_url=="https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029" and
            .http_status==200 and .content_type=="text/html" and .location==null and
            .body_bytes==63505 and .body_sha256=="dcab625aeeebc30b1cf38dd32f67f0cb766a8e33735694b00f041e03d446476f" and
            .baseline_body_bytes==63505 and .baseline_body_sha256=="dcab625aeeebc30b1cf38dd32f67f0cb766a8e33735694b00f041e03d446476f" and
            .byte_identical_to_baseline==true and .physical_requests==1 and
            .followed_redirects==0 and .result_spawned_requests==0 and
            .terminal_state=="terminal_http_success_body_captured" and
            .source_admissions==0 and .field_classifications==0 and .field_terminalizations==0 and
            .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false and
            .additional_execution_authorized==false
          ' "$WORK/refresh/route-receipt.json" > /dev/null || fail authenticate_refresh_artifact route_receipt_semantics_mismatch
          jq -e '
            .schema_version=="ssc-rd04-physical-request-ledger@1" and .physical_requests==1 and
            (.requests|length)==1 and .requests[0].ordinal==1 and .requests[0].method=="GET" and
            .requests[0].url=="https://www.fna.usda.gov/snap/waivers/timelimit/2025-2029" and
            .requests[0].status==200 and .requests[0].terminal_state=="terminal_http_success_body_captured"
          ' "$WORK/refresh/physical-request-ledger.json" > /dev/null || fail authenticate_refresh_artifact request_ledger_semantics_mismatch
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-current-index-refresh-inventory@1" and
            .inspection_performed==true and .anchor_count==146 and .fy2026_archive_locator_count==3 and
            (.fy2026_archive_locators|length)==3 and
            ([.fy2026_archive_locators[].absolute_url]|sort)==([
              "https://www.fna.usda.gov/sites/default/files/resource-files/FY2026-ABAWD-State-Requests-and-Data-AK-KY-7-2026.zip",
