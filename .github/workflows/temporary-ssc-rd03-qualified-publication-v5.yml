name: TEMP publish qualified RD-03 terminal closure v5

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd03-qualified-publication-v5.yml'
      - '.rd03-qualified-publication-v5/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd03-qualified-publication-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd03-qualified-publication-trigger-v5'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare exact-index publication transaction
        run: |
          set -Eeuo pipefail
          cp .github/tmp/publish-rd03-qualified-v3.sh /tmp/publish-rd03-qualified-v5.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/publish-rd03-qualified-v5.sh')
          s=p.read_text()
          old='''tar -xzf "$qualified/permanent-product.tar.gz" -C .
          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/rd03-product-paths.actual"
          cmp "$qualified/product-paths.txt" "$RUNNER_TEMP/rd03-product-paths.actual"
          '''
          new='''tar -xzf "$qualified/permanent-product.tar.gz" -C .
          census_root='data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/source-custody/public-record-census-v1'
          execution_receipt='data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/public-record-census-execution-receipt.json'
          r019='data/intake/status-sovereignty-rd-wave02-rd03-negotiated-terms/source-custody/public-record-census-v1/routes/RD03-CENSUS-R019/attempt-1/body.bin'
          git add -- \\
            "$census_root" \\
            "$execution_receipt" \\
            .github/workflows/status-sovereignty-rd-wave02-rd03-negotiated-terms.yml \\
            docs/milestones/ssc-rd-wave02-rd03-negotiated-terms.md \\
            schemas/status-sovereignty-rd-wave02-rd03-negotiated-terms.schema.json \\
            test/status-sovereignty-rd-wave02-rd03-negotiated-terms.test.js \\
            tools/build-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs \\
            tools/validate-status-sovereignty-rd-wave02-rd03-negotiated-terms.mjs \\
            data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms \\
            data/project/ssc-residual-wave02/closures/RD-03-C04.json
          test -f "$r019"
          test "$(wc -c < "$r019")" = 5234
          echo 'ca367be4eaba072d50128f104dd70d7338942ecac932e34925862893cf6b77c9  '"$r019" | sha256sum -c -
          test "$(git hash-object "$r019")" = '40827488d04ea18c9609559592d49e3d93aeac9a'
          if ! git diff --cached --name-only -- "$r019" | grep -Fxq "$r019"; then
            blob="$(git hash-object -w -- "$r019")"
            test "$blob" = '40827488d04ea18c9609559592d49e3d93aeac9a'
            git update-index --add --cacheinfo "100644,$blob,$r019"
          fi
          expected_stage="$(printf '100644 %s 0\t%s' '40827488d04ea18c9609559592d49e3d93aeac9a' "$r019")"
          test "$(git ls-files --stage -- "$r019")" = "$expected_stage"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/rd03-product-paths.actual"
          if ! cmp "$qualified/product-paths.txt" "$RUNNER_TEMP/rd03-product-paths.actual"; then
            diff -u "$qualified/product-paths.txt" "$RUNNER_TEMP/rd03-product-paths.actual" || true
            git diff --cached --name-status
            exit 1
          fi
          '''
          if old not in s:
              raise SystemExit('publication staging block not found')
          p.write_text(s.replace(old,new,1))
          PY
          chmod +x /tmp/publish-rd03-qualified-v5.sh
      - name: Execute exact qualified publication transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: /tmp/publish-rd03-qualified-v5.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-qualified-publication-v5
          path: ${{ env.PUBLICATION_RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 90
