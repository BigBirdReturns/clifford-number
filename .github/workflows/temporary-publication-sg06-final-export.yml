name: Temporary SG-05 historical-workflow repair staging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-publication-sg06-final-export.yml'
      - '.github/tmp/sg06-historical-workflow-fix.patch.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-sg06-final-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build validated workflow-neutral replacement SG-06 successor
        run: |
          set -euo pipefail
          FINAL='076c7c2d43250d226f4b9de311427307e4cb3d98'
          FIRST='8de31382f9e9c00a285cc093b548b19bc436a8de'
          STAGING='agent/publication-sg06-second-historical-workflow-staging'

          printf '%s  %s\n' 'd91aad627ccdffa129cdcddb3217a8185baec63dfa8b362174fac8d941bf8715' .github/tmp/sg06-historical-workflow-fix.patch.xz.b64 | sha256sum --check --strict
          base64 --decode .github/tmp/sg06-historical-workflow-fix.patch.xz.b64 > /tmp/sg06-historical-workflow-fix.patch.xz
          printf '%s  %s\n' '61caddae4eb3f31bd82e006fbb80696598bf6a56bf8d739e46e9ad7dc18f2e27' /tmp/sg06-historical-workflow-fix.patch.xz | sha256sum --check --strict
          xz --decompress --stdout /tmp/sg06-historical-workflow-fix.patch.xz > /tmp/sg06-historical-workflow-fix.patch
          printf '%s  %s\n' '4216fae3705ca97c96831a596bb6387de4520657a5a954da5ce5d7322fe828bd' /tmp/sg06-historical-workflow-fix.patch | sha256sum --check --strict

          git cat-file -e "${FINAL}^{commit}"
          git cat-file -e "${FIRST}^{commit}"
          git checkout --detach "$FINAL"
          git apply --check /tmp/sg06-historical-workflow-fix.patch
          git apply /tmp/sg06-historical-workflow-fix.patch

          node tools/build-pages.mjs
          node tools/build-standalone.mjs
          node tools/build-project-stable-ground-sg06.mjs
          node tools/validate-project-stable-ground-sg05.mjs
          node test/project-stable-ground-sg05.test.js
          node tools/validate-project-stable-ground-sg06.mjs
          node test/project-stable-ground-sg06.test.js
          npm run release:check

          python3 - <<'PY'
          import subprocess
          volatile = [
              'build/axm-identity.json','build/build-hop-report.json','build/hop-graph.json',
              'build/migration-review.md','build/migration-summary.json','build/receipt-graph.json',
              'build/scores.json','build/scout-report.json','build/scout-report.md','build/surface-graph.json',
          ]
          for path in volatile:
              diff = subprocess.run(['git','diff','--unified=0','--',path], check=True, text=True, capture_output=True).stdout
              if not diff:
                  continue
              lines = [line[1:].strip() for line in diff.splitlines() if line.startswith(('+','-')) and not line.startswith(('+++','---'))]
              if len(lines) != 2 or not all(line.startswith('"generated": "') or line.startswith('Generated: ') for line in lines):
                  raise RuntimeError(f'unexpected volatile mutation in {path}: {lines}')
          PY
          git restore --source="$FINAL" -- \
            build/axm-identity.json build/build-hop-report.json build/hop-graph.json \
            build/migration-review.md build/migration-summary.json build/receipt-graph.json \
            build/scores.json build/scout-report.json build/scout-report.md build/surface-graph.json

          cat > /tmp/expected-repair <<'PATHS'
          .github/workflows/project-stable-ground-sg05.yml
          .github/workflows/project-stable-ground-sg06.yml
          data/project/project-stable-ground-sg06-release-manifest.json
          reports/core-thesis/stable-ground/sg06/checkpoint.json
          reports/core-thesis/stable-ground/sg06/index.html
          PATHS
          sort -o /tmp/expected-repair /tmp/expected-repair
          git diff --name-only | sort > /tmp/observed-repair
          diff -u /tmp/expected-repair /tmp/observed-repair
          git diff --check

          git restore --source="$FIRST" -- .github/workflows/project-stable-ground-sg05.yml
          git rm .github/workflows/project-stable-ground-sg06.yml
          git add -A
          git reset --soft "$FIRST"

          cat > /tmp/expected-second <<'PATHS'
          data/project/project-stable-ground-current.json
          data/project/project-stable-ground-governor.json
          data/project/project-stable-ground-sg06-release-manifest.json
          data/project/project-stable-ground-sg06.json
          docs/milestones/project-stable-ground-sg06.md
          reports/core-thesis/stable-ground/sg06/checkpoint.json
          reports/core-thesis/stable-ground/sg06/index.html
          test/project-stable-ground-sg05.test.js
          test/project-stable-ground-sg06.test.js
          tools/build-project-stable-ground-sg06.mjs
          tools/validate-project-stable-ground-sg04.mjs
          tools/validate-project-stable-ground-sg05.mjs
          tools/validate-project-stable-ground-sg06.mjs
          PATHS
          sort -o /tmp/expected-second /tmp/expected-second
          git diff --cached --name-only "$FIRST" | sort > /tmp/observed-second
          diff -u /tmp/expected-second /tmp/observed-second

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Append stable-ground supersession SG-06'
          replacement="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/${STAGING}:"$FIRST" origin HEAD:"$STAGING"
          printf 'workflow_neutral_replacement=%s\n' "$replacement"
