name: Temporary SG-05 historical-workflow repair staging

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-publication-sg06-final-export.yml'
      - '.github/tmp/sg06-historical-workflow-fix.patch.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-sg06-historical-workflow-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-sg06-final-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build validated workflow-neutral replacement SG-06 successor
        run: |
          set -euo pipefail
          CARRIER='.github/tmp/sg06-historical-workflow-fix.patch.xz.b64'
          ROOT='/tmp/sg06-historical-workflows'

          printf '%s  %s\n' '697aa4d687df0a8089874cc2968187d436bbb8bbcae5941d1623d33612595a16' "$CARRIER" | sha256sum --check --strict
          base64 --decode "$CARRIER" > /tmp/sg06-historical-workflows.tar.xz
          printf '%s  %s\n' '661c93e2222b7f4e73d861de019c3445f6b707419cee6b72a7e80aad893a6d74' /tmp/sg06-historical-workflows.tar.xz | sha256sum --check --strict
          xz --decompress --stdout /tmp/sg06-historical-workflows.tar.xz > /tmp/sg06-historical-workflows.tar
          printf '%s  %s\n' 'c03db0a53d2992e32b25bbaa4c1df2379d583f7423f91f464271a1e4236110aa' /tmp/sg06-historical-workflows.tar | sha256sum --check --strict

          printf '%s\n' project-stable-ground-sg05.yml project-stable-ground-sg06.yml repair.sh | sort > /tmp/expected-members
          tar -tf /tmp/sg06-historical-workflows.tar | sort > /tmp/observed-members
          diff -u /tmp/expected-members /tmp/observed-members
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          tar -xf /tmp/sg06-historical-workflows.tar -C "$ROOT"

          printf '%s  %s\n' '3c366df8c94caded415fed603a396432ca2fc7b0a1199237c582ff28dd3abd45' "$ROOT/project-stable-ground-sg05.yml" | sha256sum --check --strict
          printf '%s  %s\n' 'e1e2f58f53cdd59d0edb22a8c99e72252f2c5268f27864b300ccc2c2ab2d65b8' "$ROOT/project-stable-ground-sg06.yml" | sha256sum --check --strict
          printf '%s  %s\n' '6d1f9c4b535f3bc2fbcccc54d5894e3f0570a6c89bd4b2055b4da92c9d46b84d' "$ROOT/repair.sh" | sha256sum --check --strict
          chmod +x "$ROOT/repair.sh"
          CARRIER_ROOT="$ROOT" "$ROOT/repair.sh"
