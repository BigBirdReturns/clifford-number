name: Preference custody laboratory floor v33

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-population-frame-assurance.mjs'
      - 'tools/validate-preference-population-frame-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v33.mjs'
      - 'tools/validate-preference-custody-manifest-v33.mjs'
      - 'test/preference-population-frame-assurance.test.js'
      - 'test/preference-custody-manifest-v33.test.js'
      - 'docs/preference-custody-population-frame-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v33.md'
      - '.github/workflows/preference-population-frame-assurance.yml'
      - '.github/workflows/preference-custody-v33.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  floor-v33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          node tools/compile-preference-population-frame-assurance.mjs
          node tools/compile-preference-custody-manifest-v33.mjs
      - run: |
          node tools/validate-preference-population-frame-assurance.mjs
          node tools/validate-preference-custody-manifest-v33.mjs
      - run: |
          node test/preference-population-frame-assurance.test.js
          node test/preference-custody-manifest-v33.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v33
          path: |
            build/research/preference-population-frame-assurance.json
            build/research/preference-population-frame-assurance.md
            build/research/preference-custody-laboratory-floor-v33.json
            build/research/preference-custody-laboratory-floor-v33.md
          if-no-files-found: error
