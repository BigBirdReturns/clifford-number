name: Temporary materialize M-04B decisive acquisition wave 02

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/temporary/m04b-wave-02/**'
      - '.github/workflows/temporary-m04b-wave-02.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04b-wave-02-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize exact source-bounded wave
        run: |
          node .github/temporary/m04b-wave-02/materialize.mjs
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          M04B_REPOSITORY="$GITHUB_REPOSITORY" node tools/dispatch-security-state-organism.mjs --dry-run
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Remove one-shot carrier and rerun complete gate
        run: |
          rm -rf .github/temporary/m04b-wave-02
          rm -f .github/workflows/temporary-m04b-wave-02.yml
          npm run release:check
      - name: Restore out-of-scope generated projections
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess, sys
          allowed_exact = {
            'data/intake/security-state-organism-evidence-intake.json',
            'data/intake/security-state-organism-source-routes.json',
            'data/intake/security-state-organism-decisive-acquisition-wave-02.json',
            'data/project/security-state-work-packages.json',
            'data/project/security-state-estate-alignment.json',
            'tools/validate-security-state-organism.mjs',
            'test/security-state-organism.test.js',
            'docs/milestones/m04b-decisive-acquisition-wave-02.md',
            '.github/workflows/temporary-m04b-wave-02.yml',
          }
          allowed_prefix = (
            'build/core-thesis/security-state-organism/',
            'reports/core-thesis/security-state-organism/',
            '.github/temporary/m04b-wave-02/',
          )
          def rows(): return subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          def path_of(row): return row[3:].split(' -> ', 1)[-1]
          current = rows()
          print('all changed paths before scope reconciliation:')
          print('\n'.join(path_of(row) for row in current))
          for row in current:
            target = path_of(row)
            if target in allowed_exact or target.startswith(allowed_prefix):
              continue
            status = row[:2]
            print(f'restoring out-of-scope projection: {status} {target}')
            if status == '??':
              p = pathlib.Path(target)
              if p.is_dir(): shutil.rmtree(p)
              elif p.exists() or p.is_symlink(): p.unlink()
            else:
              subprocess.run(['git','restore','--worktree','--staged','--',target], check=True)
          remaining = rows()
          bad = [path_of(row) for row in remaining if path_of(row) not in allowed_exact and not path_of(row).startswith(allowed_prefix)]
          print('remaining scoped paths:')
          print('\n'.join(path_of(row) for row in remaining))
          if bad:
            print('unreconciled out-of-scope drift:', *bad, sep='\n', file=sys.stderr)
            sys.exit(1)
          PY
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          M04B_REPOSITORY="$GITHUB_REPOSITORY" node tools/dispatch-security-state-organism.mjs --dry-run
          git diff --exit-code -- \
            build/core-thesis/security-state-organism/manifest.json \
            build/core-thesis/security-state-organism/fanout.json \
            build/core-thesis/security-state-organism/issue-plan.json \
            build/core-thesis/security-state-organism/packets \
            reports/core-thesis/security-state-organism/data.json \
            reports/core-thesis/security-state-organism/index.html
          git diff --check
      - name: Commit verified permanent wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/temporary/m04b-wave-02 \
            .github/workflows/temporary-m04b-wave-02.yml \
            data/intake/security-state-organism-evidence-intake.json \
            data/intake/security-state-organism-source-routes.json \
            data/intake/security-state-organism-decisive-acquisition-wave-02.json \
            data/project/security-state-work-packages.json \
            data/project/security-state-estate-alignment.json \
            tools/validate-security-state-organism.mjs \
            test/security-state-organism.test.js \
            docs/milestones/m04b-decisive-acquisition-wave-02.md \
            build/core-thesis/security-state-organism \
            reports/core-thesis/security-state-organism
          git commit -m "Execute M-04B decisive acquisition wave 02"
          target="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target"
