name: Temporary materialize M-04F epistemic-jurisdiction v2

on:
  push:
    branches:
      - agent/m04f-epistemic-jurisdiction-v2
    paths:
      - '.github/temporary/m04f-epistemic-jurisdiction-v2/**'
      - '.github/workflows/temporary-m04f-epistemic-jurisdiction-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04f-v2-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-epistemic-jurisdiction-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble and verify exact source payload
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          root = Path('.github/temporary/m04f-epistemic-jurisdiction-v2')
          expected = {
              'payload-00.txt': 'c67909d5320796e86e57fc4fdba78ad2655c01686b30a6cf90e07ec4b79e5eee',
              'payload-01.txt': '9c116925db6adb453f9f02c7c0293319ffb207d155acca3f092e3cd31053359d',
              'payload-02.txt': '397fd5682381a72fb920b9c71b83927617a2a092e3ca42ae33b7d34caab5da59',
              'payload-03.txt': 'f51cc00e77c246b68ac2e88a2e09fd901843f5f0e49fd451fdd264144731f483',
              'payload-04.txt': 'c318dfb3dd58fdbaca46f24a64c3829ee746466b7b74a5548264a2197cf3101e',
              'payload-05.txt': '4ad33a0b12534ec3cf30d76f516c778bccb8b19f8f5965879a9adfaf42af0405',
          }
          chunks = []
          actual_names = sorted(p.name for p in root.glob('payload-*.txt'))
          if actual_names != list(expected):
              raise SystemExit(f'payload names mismatch: {actual_names}')
          for name, digest in expected.items():
              raw = (root / name).read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              print(f'{name}: {len(raw)} bytes sha256={actual}')
              if actual != digest:
                  raise SystemExit(f'{name}: checksum mismatch')
              chunks.append(raw.decode('ascii'))
          encoded = ''.join(chunks)
          if len(encoded) != 44360:
              raise SystemExit(f'base64 length mismatch: {len(encoded)}')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != '33bab9bbd6a520527b8ae56015ada28591a0c36328d4a2ad1bb6c34c0d224206':
              raise SystemExit('assembled base64 checksum mismatch')
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != 33270:
              raise SystemExit(f'payload length mismatch: {len(payload)}')
          if hashlib.sha256(payload).hexdigest() != 'a6a66b552df19a54d8056d950dde36671f4fc106fac97d265f098030241534af':
              raise SystemExit('payload checksum mismatch')
          Path('/tmp/m04f-v2-source.tgz').write_bytes(payload)
          PY
          tar -tzf /tmp/m04f-v2-source.tgz
      - name: Extract and run focused M-04F gates
        run: |
          tar -xzf /tmp/m04f-v2-source.tgz -C .
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          git diff --check
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          allowed_exact = {
              '.github/workflows/m04f-epistemic-jurisdiction.yml',
              'data/project/m04f-epistemic-jurisdiction-core.json',
              'data/project/m04f-epistemic-jurisdiction-axes.json',
              'data/project/m04f-epistemic-jurisdiction-tests-classes.json',
              'data/project/m04f-epistemic-jurisdiction-fanout.json',
              'data/project/m04f-epistemic-jurisdiction-estate.json',
              'data/intake/m04f-epistemic-jurisdiction-sources-01.json',
              'data/intake/m04f-epistemic-jurisdiction-sources-02.json',
              'data/intake/m04f-epistemic-jurisdiction-systems.json',
              'data/intake/m04f-epistemic-jurisdiction-wave-01.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-dcgs-a2-procurement-gate.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-army-palantir-enterprise.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-army-ngc2.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-ice-icm-immigrationos.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-nhs-foundry-fdp.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-brave1.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-erebor.json',
              'data/intake/m04f-epistemic-jurisdiction-matrix-palantir-constitution-ontology.json',
              'tools/build-m04f-epistemic-jurisdiction.mjs',
              'tools/validate-m04f-epistemic-jurisdiction.mjs',
              'test/m04f-epistemic-jurisdiction.test.js',
              'docs/milestones/m04f-epistemic-jurisdiction.md',
              'docs/methods/pattern-to-proof.md',
          }
          allowed_prefix = (
              'build/core-thesis/epistemic-jurisdiction/',
              'reports/core-thesis/epistemic-jurisdiction/',
          )
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          bad = []
          for row in rows:
              path = row[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefix):
                  continue
              bad.append(path)
          for path in bad:
              tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', '--', path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if tracked:
                  subprocess.run(['git', 'restore', '--staged', '--worktree', '--', path], check=True)
              else:
                  target = Path(path)
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
          if bad:
              print('restored unrelated drift:')
              print('\n'.join(bad))
          PY
      - name: Rebuild final products and publish permanent estate
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            data/project/m04f-epistemic-jurisdiction-core.json \
            data/project/m04f-epistemic-jurisdiction-axes.json \
            data/project/m04f-epistemic-jurisdiction-tests-classes.json \
            data/project/m04f-epistemic-jurisdiction-fanout.json \
            data/project/m04f-epistemic-jurisdiction-estate.json \
            data/intake/m04f-epistemic-jurisdiction-sources-01.json \
            data/intake/m04f-epistemic-jurisdiction-sources-02.json \
            data/intake/m04f-epistemic-jurisdiction-systems.json \
            data/intake/m04f-epistemic-jurisdiction-matrix-*.json \
            data/intake/m04f-epistemic-jurisdiction-wave-01.json \
            tools/build-m04f-epistemic-jurisdiction.mjs \
            tools/validate-m04f-epistemic-jurisdiction.mjs \
            test/m04f-epistemic-jurisdiction.test.js \
            docs/milestones/m04f-epistemic-jurisdiction.md \
            docs/methods/pattern-to-proof.md \
            build/core-thesis/epistemic-jurisdiction \
            reports/core-thesis/epistemic-jurisdiction
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo 'No permanent changes were staged' >&2
            exit 20
          fi
          git commit -m 'Install M-04F epistemic jurisdiction estate'
          git push origin HEAD:agent/m04f-epistemic-jurisdiction-v2
