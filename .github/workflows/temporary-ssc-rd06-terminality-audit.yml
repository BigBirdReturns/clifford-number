name: TEMP audit RD-06 Wave 02 terminality

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd06-terminality-audit.yml'
      - '.rd06-terminality-audit/**'

permissions:
  contents: read

concurrency:
  group: temp-ssc-rd06-terminality-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-terminal-audit-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bind exact research head and topology
        run: |
          set -Eeuo pipefail
          git fetch origin main agent/ssc-rd-wave02-rd06-offeror-universe
          research_head="$(git rev-parse origin/agent/ssc-rd-wave02-rd06-offeror-universe)"
          merge_base="$(git merge-base origin/agent/ssc-rd-wave02-rd06-offeror-universe HEAD)"
          test "$research_head" = "$merge_base"
          test "$(git rev-list --count origin/agent/ssc-rd-wave02-rd06-offeror-universe..HEAD)" = 2
          printf '%s\n' "$research_head" > /tmp/rd06-research-head.txt
          printf '%s\n' "$(git rev-parse origin/main)" > /tmp/rd06-main-head.txt
          node tools/validate-no-magic-human-gate.mjs

      - name: Run every retained RD-06 focused validator and test
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(find tools test -type f \( -iname '*rd06*' -o -iname '*offeror*' -o -iname '*dcgsa*' \) | sort)
          test "${#files[@]}" -gt 0
          : > /tmp/rd06-focused-checks.txt
          for file in "${files[@]}"; do
            case "$file" in
              test/*.js|test/*.mjs|tools/validate-*.mjs|tools/acquisition/*/validate-*.mjs)
                echo "RUN $file" | tee -a /tmp/rd06-focused-checks.txt
                node "$file" 2>&1 | tee -a /tmp/rd06-focused-checks.txt
                ;;
            esac
          done

      - name: Build exact terminality and changed-path receipt
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rd06-terminality
          mkdir -p /tmp/rd06-terminality
          cp /tmp/rd06-research-head.txt /tmp/rd06-terminality/research-head.txt
          cp /tmp/rd06-main-head.txt /tmp/rd06-terminality/main-head.txt
          cp /tmp/rd06-focused-checks.txt /tmp/rd06-terminality/focused-checks.txt
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('.')
          out = pathlib.Path('/tmp/rd06-terminality')
          research_head = (out / 'research-head.txt').read_text().strip()
          main_head = (out / 'main-head.txt').read_text().strip()

          def run(*args):
              return subprocess.run(args, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()

          merge_base = run('git', 'merge-base', 'origin/main', research_head)
          changed = run('git', 'diff', '--name-only', f'{merge_base}..{research_head}').splitlines()
          temporary_pattern = re.compile(r'(^|/)(temporary|carrier|materializer|trigger|\\.rd06)|^\\.github/workflows/temporary', re.I)
          temporary = [p for p in changed if temporary_pattern.search(p)]

          products = {}
          closure_candidates = []
          for path in sorted(root.rglob('*.json')):
              rel = path.as_posix()
              if not any(token in rel.lower() for token in ('rd06', 'rd-06', 'offeror', 'dcgsa')):
                  continue
              try:
                  value = json.loads(path.read_text())
              except Exception:
                  continue
              if not isinstance(value, dict):
                  continue
              identity = [value.get('class_id'), value.get('lane_id'), value.get('issue')]
              if not ('RD-06-C01' in identity or 'RD-06' in identity or 791 in identity or 'rd06' in rel.lower() or 'offeror' in rel.lower()):
                  continue
              summary = {}
              for key in ('schema_version','wave_id','lane_id','class_id','issue','status','terminal_state','class_closed','counts','current_result','authority','boundaries'):
                  if key in value:
                      summary[key] = value[key]
              products[rel] = summary
              if value.get('class_closed') is True or (isinstance(value.get('current_result'), dict) and value['current_result'].get('class_closed') is True):
                  closure_candidates.append(rel)

          expected_closure = 'data/project/ssc-residual-wave02/closures/RD-06-C01.json'
          closure_reference_present = pathlib.Path(expected_closure).is_file()
          terminal_receipt_present = bool(closure_candidates)
          readiness = {
              'focused_checks_passed': True,
              'terminal_class_receipt_present': terminal_receipt_present,
              'closure_reference_present': closure_reference_present,
              'transport_free_research_diff': len(temporary) == 0,
              'ready_for_current_main_reconciliation': terminal_receipt_present and closure_reference_present and len(temporary) == 0,
          }
          receipt = {
              'schema_version': 'ssc-rd06-wave02-terminality-audit@1',
              'wave_id': 'SSC-RD-W02',
              'lane_id': 'RD-06',
              'class_id': 'RD-06-C01',
              'issue': 791,
              'research_head': research_head,
              'main_head_at_audit': main_head,
              'research_merge_base_with_main': merge_base,
              'changed_path_count': len(changed),
              'changed_paths': changed,
              'temporary_or_transport_paths': temporary,
              'candidate_product_count': len(products),
              'candidate_products': products,
              'closure_candidate_paths': closure_candidates,
              'readiness': readiness,
              'authority': {
                  'outside_human_dependency': False,
                  'external_contacts': 0,
                  'external_reviews': 0,
                  'reviewed_disposition_changed': False,
                  'publication_effect': 'none',
                  'adoption_effect': 'none',
                  'graph_effect': 'none',
              },
          }
          (out / 'terminality-audit.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (out / 'changed-paths.txt').write_text('\n'.join(changed) + ('\n' if changed else ''))
          (out / 'transport-paths.txt').write_text('\n'.join(temporary) + ('\n' if temporary else ''))
          print(json.dumps(readiness, indent=2))
          PY

      - name: Seal audit manifest
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('/tmp/rd06-terminality')
          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'manifest.json'):
              data = path.read_bytes()
              rows.append({'path': str(path.relative_to(root)), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          combined = hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows).encode()).hexdigest()
          manifest = {'schema_version':'ssc-rd06-wave02-terminality-audit-manifest@1','entry_count':len(rows),'entries':rows,'combined_sha256':combined}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'RD-06 terminality audit sealed: {len(rows)} entries; {combined}')
          PY
          git diff --exit-code
          test -z "$(git status --short)"

      - name: Preserve exact RD-06 terminality audit
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-terminality-audit-v1
          path: /tmp/rd06-terminality
          if-no-files-found: error
          retention-days: 90
