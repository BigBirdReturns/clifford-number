name: Preference custody record-linkage temporal-succession assurance control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/record-linkage-temporal-succession-assurance.fixture.json'
      - 'tools/lib/preference-record-linkage-temporal-succession-assurance.mjs'
      - 'tools/compile-preference-record-linkage-temporal-succession-assurance.mjs'
      - 'tools/validate-preference-record-linkage-temporal-succession-assurance.mjs'
      - 'test/preference-record-linkage-temporal-succession-assurance.test.js'
      - 'docs/preference-custody-record-linkage-temporal-succession-assurance.md'
      - '.github/workflows/preference-record-linkage-temporal-succession-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-linkage-temporal-succession-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile linkage, namespace, temporal-identity, succession, and version worlds
        run: node tools/compile-preference-record-linkage-temporal-succession-assurance.mjs
      - name: Validate linkage, namespace, temporal, succession, correction, and authority boundaries
        run: node tools/validate-preference-record-linkage-temporal-succession-assurance.mjs
      - name: Exercise namespace, alias, temporal, recycling, succession, versioning, authority, and tamper fixtures
        run: node test/preference-record-linkage-temporal-succession-assurance.test.js
      - name: Preserve deterministic PC-39 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-record-linkage-temporal-succession-assurance-pc39
          path: |
            build/research/preference-record-linkage-temporal-succession-assurance.json
            build/research/preference-record-linkage-temporal-succession-assurance.md
          if-no-files-found: error
