      - name: Execute exact IANA-bootstrap and domain-RDAP census
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/schoolhouse-domain-rdap-census-v1"
          RUNNER="$RUNNER_TEMP/acquire-schoolhouse-domain-rdap.py"
          LOG="$RUNNER_TEMP/schoolhouse-domain-rdap-census-v1.log"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python "$RUNNER" --output "$OUT" 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$OUT/RUNNER_EXIT_CODE"
          cp "$LOG" "$OUT/RUNNER-OUTPUT.log"
          printf 'runner_source_bytes=38189\n' > "$OUT/RUNNER-CUSTODY"
          printf 'runner_source_sha256=084b2ef861fa6387be670dfdbb7f5efdeb2c4de2389da04d1f7ab8c0c90c3896\n' >> "$OUT/RUNNER-CUSTODY"
          printf 'carrier_head=%s\n' "$GITHUB_SHA" >> "$OUT/RUNNER-CUSTODY"
          exit "$status"

