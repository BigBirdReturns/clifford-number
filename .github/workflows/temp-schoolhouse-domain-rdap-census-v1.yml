          assert authority['public_schoolhouse_legal_identity'] == 'unresolved'

          assert domain['raw_bootstrap_response_retained'] is False
          assert domain['raw_rdap_response_retained'] is False
          assert domain['registrant_person_name_values_retained'] == 0
          assert domain['address_rows_retained'] == 0
          assert domain['postal_code_rows_retained'] == 0
          assert domain['telephone_or_fax_values_retained'] == 0
