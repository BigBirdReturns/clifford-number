name: Lake index census

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/tmp/lake-index-trigger.json'
      - '.github/workflows/lake-index-census.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lake-index-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-index-census
          fetch-depth: 0
      - name: Detect a live census request
        id: request
        shell: bash
        run: |
          if test -f .github/tmp/lake-index-trigger.json; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.request.outputs.present == 'true'
        with:
          node-version: '24'
      - name: Observe the open-pull-request shadow
        if: steps.request.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs
      - name: Build, classify, and validate the current-tree lake census
        if: steps.request.outputs.present == 'true'
        run: |
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node test/lake-index.test.js
          node tools/shard-lake-index.mjs
          node tools/validate-lake-index-shards.mjs
          node test/lake-index.test.js
      - name: Prove deterministic line-addressable products
        if: steps.request.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find build/lake-index -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/lake-index-first.sha256
          sha256sum \
            reports/lake-index-census.md \
            reports/lake-index-gap-summary.md >> /tmp/lake-index-first.sha256
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          sha256sum --check --strict /tmp/lake-index-first.sha256
          node tools/validate-lake-index-shards.mjs
          node test/lake-index.test.js
          git diff --check
      - name: Enforce the exact generated change set
        if: steps.request.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp
          python - <<'PY'
          import subprocess

          expected = {
              '.github/tmp/lake-index-trigger.json',
              'build/lake-index.json',
              'build/lake-object-index.json',
              'build/lake-index-gaps.json',
              'build/lake-index-gap-summary.json',
              'build/lake-index/manifest.json',
              'build/lake-index/summary.json',
              'build/lake-index/files.jsonl',
              'build/lake-index/objects.jsonl',
              'build/lake-index/receipts.jsonl',
              'build/lake-index/receipt-locators.jsonl',
              'build/lake-index/receipt-hashes.jsonl',
              'build/lake-index/receipt-semantics.json',
              'build/lake-index/programs.json',
              'build/lake-index/cases.json',
              'build/lake-index/reports.json',
              'build/lake-index/path-gaps.jsonl',
              'build/lake-index/id-gaps.jsonl',
              'build/lake-index/receipt-gaps.jsonl',
              'build/lake-index/branch-shadow.jsonl',
              'build/lake-index/missing-path-tokens.json',
              'build/lake-index/gap-summary.json',
              'data/project/lake-open-pr-shadow.json',
              'reports/lake-index-census.md',
              'reports/lake-index-gap-summary.md',
          }
          raw = subprocess.check_output([
              'git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'
          ])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          actual = set()
          for entry in entries:
              status = entry[:2]
              assert 'R' not in status and 'C' not in status, entry
              actual.add(entry[3:])
          assert actual == expected, {
              'unexpected': sorted(actual - expected),
              'missing': sorted(expected - actual),
          }
          PY
      - name: Commit the durable census
        if: steps.request.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile lake receipt semantics'
          git push origin HEAD:agent/lake-index-census
