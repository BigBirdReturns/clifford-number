name: TEMP repair PC-51 clean-checkout ordering v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pc51-clean-checkout-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OLD_PRODUCT: 7802dcc91ca45d564a72f87c99183a6ed196e6fb
      PRODUCT_PARENT: 5b841fcfe6d30929e0adfbb36548224d8d1959e8
      PRODUCT_BRANCH: agent/pc51-materializer
      REPAIRED_PATH: test/preference-custody-manifest-v49.test.js
      REPAIRED_BYTES: '24002'
      REPAIRED_SHA256: f197498c5070071e3f241a34c3a90b4742b53dff3c23a26ee40fa81bec383014
      REPAIRED_BLOB: ccfad0438fe80e89a189d77a30325383c45acebf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct exact one-file repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$OLD_PRODUCT"
          git reset --hard "$OLD_PRODUCT"
          git clean -fdx
          python - <<'PY'
          from pathlib import Path
          p = Path('test/preference-custody-manifest-v49.test.js')
          text = p.read_text()
          old_import = """import {
            compilePreferenceCustodyManifestV49,
            loadPreferenceCustodySourceBundleV48,
            validatePreferenceCustodyManifestV49,
            validatePreferenceCustodyManifestV49Build
          } from '../tools/lib/preference-custody-manifest-v49.mjs';
          """
          new_import = """import {
            compilePreferenceCustodyManifestV49,
            loadPreferenceCustodySourceBundleV48,
            validatePreferenceCustodyManifestV49,
            validatePreferenceCustodyManifestV49Build
          } from '../tools/lib/preference-custody-manifest-v49.mjs';
          import {
            compilePreferenceCustodyManifestV48
          } from '../tools/lib/preference-custody-manifest-v48.mjs';
          import {
            compilePreferenceLinkageSourceReviewReproducibleBuildArtifactProvenanceExecutionAttestationAssurance
          } from '../tools/lib/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs';
          """
          old_setup = """const manifest = readJson(resolve(root, 'data/research/preference-custody/control-manifest-v49.json'));
          const baseBuild = readJson(resolve(root, 'build/research/preference-custody-laboratory-floor-v48.json'));
          const targetFixture = readJson(resolve(root, `data/research/preference-custody/${slug}.fixture.json`));
          const targetBuild = readJson(resolve(root, `build/research/${slug}.json`));
          const baseSources = loadPreferenceCustodySourceBundleV48(root);
          const build = compilePreferenceCustodyManifestV49(manifest, baseBuild, targetBuild, targetFixture, baseSources);
          """
          new_setup = """const manifest = readJson(resolve(root, 'data/research/preference-custody/control-manifest-v49.json'));
          const targetFixture = readJson(resolve(root, `data/research/preference-custody/${slug}.fixture.json`));
          const targetBuild =
            compilePreferenceLinkageSourceReviewReproducibleBuildArtifactProvenanceExecutionAttestationAssurance(
              targetFixture
            );
          const baseSources = loadPreferenceCustodySourceBundleV48(root);
          const baseV47Build = readJson(
            resolve(root, 'build/research/preference-custody-laboratory-floor-v47.json')
          );
          const baseBuild = compilePreferenceCustodyManifestV48(
            baseSources.manifest,
            baseV47Build,
            baseSources.targetBuild,
            baseSources.targetFixture,
            baseSources.v47Sources
          );
          const build = compilePreferenceCustodyManifestV49(
            manifest,
            baseBuild,
            targetBuild,
            targetFixture,
            baseSources
          );
          """
          if text.count(old_import) != 1:
              raise SystemExit('expected exact v49 import block once')
          if text.count(old_setup) != 1:
              raise SystemExit('expected exact v49 setup block once')
          p.write_text(text.replace(old_import, new_import, 1).replace(old_setup, new_setup, 1))
          PY
          test "$(wc -c < "$REPAIRED_PATH" | tr -d ' ')" = "$REPAIRED_BYTES"
          test "$(sha256sum "$REPAIRED_PATH" | awk '{print $1}')" = "$REPAIRED_SHA256"
          test "$(git hash-object "$REPAIRED_PATH")" = "$REPAIRED_BLOB"
          mapfile -t changed < <(git diff --name-only "$OLD_PRODUCT")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$REPAIRED_PATH"
      - name: Build deterministic clean product commit
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          git add "$REPAIRED_PATH"
          TREE=$(git write-tree)
          export GIT_AUTHOR_NAME='PC-51 transaction controller'
          export GIT_AUTHOR_EMAIL='pc51-controller@users.noreply.github.com'
          export GIT_AUTHOR_DATE='2026-08-06T14:00:00Z'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          NEW_COMMIT=$(printf '%s\n' 'Repair PC-51 clean-checkout historical-floor ordering' | git commit-tree "$TREE" -p "$PRODUCT_PARENT")
          test "$(git rev-parse "${NEW_COMMIT}^")" = "$PRODUCT_PARENT"
          test "$(git rev-list --count "$PRODUCT_PARENT..$NEW_COMMIT")" -eq 1
          mapfile -t paths < <(git diff --name-only "$PRODUCT_PARENT" "$NEW_COMMIT")
          test "${#paths[@]}" -eq 14
          if printf '%s\n' "${paths[@]}" | grep -Eq '(^|/)(temp|carrier|shard|controller|marker|pulse|receipt|diagnostic)([-_.]|/)|^\.pc51/'; then
            exit 1
          fi
          printf 'tree=%s\nnew_commit=%s\n' "$TREE" "$NEW_COMMIT" | tee /tmp/pc51-repair-v2.env
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "new_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          git checkout --detach "$NEW_COMMIT"
          git clean -fdx
      - name: Qualify clean-checkout repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e build/research/preference-custody-laboratory-floor-v48.json
          test ! -e build/research/preference-custody-laboratory-floor-v49.json
          node test/preference-custody-manifest-v49.test.js
          git clean -fdx
          node tools/compile-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
          node tools/validate-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
          node test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js
          node tools/compile-preference-custody-manifest-v48.mjs
          node tools/validate-preference-custody-manifest-v48.mjs
          node test/preference-custody-manifest-v48.test.js
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          git clean -fdx
          node tools/compile-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          node tools/validate-preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.mjs
          node test/preference-linkage-source-review-reproducible-build-artifact-provenance-execution-attestation-assurance.test.js
          node tools/compile-preference-custody-manifest-v49.mjs
          node tools/validate-preference-custody-manifest-v49.mjs
          node test/preference-custody-manifest-v49.test.js
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
      - name: Publish or verify exact repaired product
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COMMIT: ${{ steps.build.outputs.new_commit }}
          NEW_TREE: ${{ steps.build.outputs.tree }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE=$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')
          SELECTED=''
          if [[ "$REMOTE" = "$OLD_PRODUCT" ]]; then
            git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$OLD_PRODUCT" origin "$NEW_COMMIT:refs/heads/$PRODUCT_BRANCH"
            SELECTED="$NEW_COMMIT"
          else
            test -n "$REMOTE"
            git fetch --no-tags origin "$REMOTE"
            test "$(git rev-parse "${REMOTE}^")" = "$PRODUCT_PARENT"
            test "$(git rev-list --count "$PRODUCT_PARENT..$REMOTE")" -eq 1
            test "$(git rev-parse "$REMOTE:$REPAIRED_PATH")" = "$REPAIRED_BLOB"
            test "$(git diff --name-only "$PRODUCT_PARENT" "$REMOTE" | wc -l | tr -d ' ')" -eq 14
            SELECTED="$REMOTE"
          fi
          ACTUAL=$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')
          test "$ACTUAL" = "$SELECTED"
          cat > /tmp/pc51-repair-v2-receipt.txt <<EOF
          schema_version: pc51-clean-checkout-repair-v2@1
          frozen_parent: $PRODUCT_PARENT
          prior_product: $OLD_PRODUCT
          locally_constructed_commit: $NEW_COMMIT
          locally_constructed_tree: $NEW_TREE
          selected_product_commit: $SELECTED
          repaired_test_blob: $REPAIRED_BLOB
          repaired_test_sha256: $REPAIRED_SHA256
          permanent_paths: 14
          direct_clean_checkout: pass
          historical_floor_reconstruction: pass
          no_magic_human: pass
          complete_release_gate: pass
          outside_human_dependency: false
          graph_effect: none
          EOF
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/1268/comments" \
            -f body="PC-51 clean-checkout repair v2 qualified and published/verified exact product commit \`${SELECTED}\`, local deterministic candidate \`${NEW_COMMIT}\`, tree \`${NEW_TREE}\`; repaired blob \`${REPAIRED_BLOB}\`; direct clean checkout, historical floors, no-magic-human, and complete release gate passed. Controller run: \`${GITHUB_RUN_ID}\`."
      - uses: actions/upload-artifact@v4
        with:
          name: pc51-clean-checkout-repair-v2
          path: /tmp/pc51-repair-v2-receipt.txt
          if-no-files-found: error
          retention-days: 90
