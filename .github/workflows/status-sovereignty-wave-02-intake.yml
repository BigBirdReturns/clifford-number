name: Status-for-sovereignty Wave 02 intake

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/intake/status-sovereignty-wave-02-*'
      - 'data/project/status-sovereignty-wave-02-intake-release-manifest.json'
      - 'schemas/status-sovereignty-wave-02-intake.schema.json'
      - 'docs/milestones/m05-status-sovereignty-wave-02-intake.md'
      - 'tools/*status-sovereignty-wave-02-intake*'
      - 'test/status-sovereignty-wave-02-intake.test.js'
      - 'build/core-thesis/status-sovereignty/wave-02-intake/**'
      - 'reports/core-thesis/status-sovereignty/wave-02-intake/**'
      - '.github/workflows/status-sovereignty-wave-02-intake.yml'
  push:
    branches: [main]
    paths:
      - 'data/intake/status-sovereignty-wave-02-*'
      - 'data/project/status-sovereignty-wave-02-intake-release-manifest.json'
      - 'schemas/status-sovereignty-wave-02-intake.schema.json'
      - 'docs/milestones/m05-status-sovereignty-wave-02-intake.md'
      - 'tools/*status-sovereignty-wave-02-intake*'
      - 'test/status-sovereignty-wave-02-intake.test.js'
      - 'build/core-thesis/status-sovereignty/wave-02-intake/**'
      - 'reports/core-thesis/status-sovereignty/wave-02-intake/**'
      - '.github/workflows/status-sovereignty-wave-02-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and attack Wave 02 intake
        run: |
          node tools/build-status-sovereignty-wave-02-intake.mjs
          node tools/validate-status-sovereignty-wave-02-intake.mjs
          node test/status-sovereignty-wave-02-intake.test.js
      - name: Revalidate frozen Wave 01 and SG-08 parents
        run: |
          npm run validate:status-sovereignty
          node test/status-sovereignty-wave-01.test.js
          node test/status-sovereignty-wave-01-review.test.js
          node test/status-sovereignty-wave-01-targeted-acquisition.test.js
          node test/status-sovereignty-compact.test.js
          node tools/validate-project-stable-ground-sg08.mjs
          node test/project-stable-ground-sg08.test.js
      - name: Prove Pages exclusion
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/data/intake/status-sovereignty-wave-02-source-denominator.json
          test ! -e dist/data/intake/status-sovereignty-wave-02-candidate-observations.json
          test ! -e dist/data/intake/status-sovereignty-wave-02-structural-synthesis.md
          test ! -e dist/build/core-thesis/status-sovereignty/wave-02-intake
          test ! -e dist/reports/core-thesis/status-sovereignty/wave-02-intake
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic intake products without promoting them
        run: |
          set -Eeuo pipefail
          products=(
            data/project/status-sovereignty-wave-02-intake-release-manifest.json
            build/core-thesis/status-sovereignty/wave-02-intake/manifest.json
            build/core-thesis/status-sovereignty/wave-02-intake/data.json
            reports/core-thesis/status-sovereignty/wave-02-intake/data.json
            reports/core-thesis/status-sovereignty/wave-02-intake/index.html
          )
          sha256sum "${products[@]}" > /tmp/ssc-wave02-intake-products.sha256
          rm -rf \
            data/project/status-sovereignty-wave-02-intake-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-02-intake \
            reports/core-thesis/status-sovereignty/wave-02-intake
          node tools/build-status-sovereignty-wave-02-intake.mjs
          sha256sum --check --strict /tmp/ssc-wave02-intake-products.sha256
          node tools/validate-status-sovereignty-wave-02-intake.mjs
          rm -rf \
            data/project/status-sovereignty-wave-02-intake-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-02-intake \
            reports/core-thesis/status-sovereignty/wave-02-intake
          test -z "$(git status --porcelain)"
