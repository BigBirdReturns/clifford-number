name: M-04E constitutional class and counterpower estate

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m04e-constitutional-awareness-*.json'
      - 'data/intake/m04e-constitutional-awareness-*.json'
      - 'tools/build-m04e-constitutional-awareness.mjs'
      - 'tools/validate-m04e-constitutional-awareness.mjs'
      - 'test/m04e-constitutional-awareness.test.js'
      - 'docs/milestones/m04e-constitutional-class-awareness.md'
      - 'build/core-thesis/constitutional-awareness/**'
      - 'reports/core-thesis/constitutional-awareness/**'
      - '.github/workflows/m04e-constitutional-awareness.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m04e-constitutional-awareness-*.json'
      - 'data/intake/m04e-constitutional-awareness-*.json'
      - 'tools/build-m04e-constitutional-awareness.mjs'
      - 'tools/validate-m04e-constitutional-awareness.mjs'
      - 'test/m04e-constitutional-awareness.test.js'
      - 'docs/milestones/m04e-constitutional-class-awareness.md'
      - 'build/core-thesis/constitutional-awareness/**'
      - 'reports/core-thesis/constitutional-awareness/**'
      - '.github/workflows/m04e-constitutional-awareness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build constitutional-class estate
        run: node tools/build-m04e-constitutional-awareness.mjs
      - name: Validate methodology, records, and report
        run: |
          node tools/validate-m04e-constitutional-awareness.mjs
          node test/m04e-constitutional-awareness.test.js
      - name: Refuse deterministic drift in estate products
        run: git diff --exit-code -- build/core-thesis/constitutional-awareness reports/core-thesis/constitutional-awareness
      - name: Run complete repository release gate
        run: npm run release:check
