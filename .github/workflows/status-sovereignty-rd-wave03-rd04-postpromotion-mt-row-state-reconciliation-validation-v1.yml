name: Validate RD-04 Montana row-state reconciliation candidate v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/current-row-custody.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/row-state-validation.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/validated-row-state-protocol.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/summary.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/product-manifest.json'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-mt-row-state-reconciliation-v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/current-row-custody.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/row-state-validation.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/validated-row-state-protocol.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/summary.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/product-manifest.json'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-mt-row-state-reconciliation-v1.py'

permissions:
  contents: read

env:
  CANONICAL_PARENT: e62de80e187f9be037cbdd3a4b942b5840d223de
  CANONICAL_PARENT_TREE: 0d1f8369e2c68d18b11a8f375903ff597ea8ccdb
  ADMITTED_VALIDATION_PRODUCT: a933ceacbfd9753401a7e9875c9f3048237c2014
  ADMITTED_VALIDATION_PRODUCT_TREE: 53fffef006eccb181ed4f00ea606e49b74b83a60
  ADMITTED_VALIDATION_MERGE: 5cbe9d8628efbc8c9fa85027876be77e77fbf0ef
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/promoted-partial-field-matrix.json
  MATRIX_BLOB: 6ba11a6025021e9df8ac6535be8c42499654c233
  VALIDATOR: tools/validate-status-sovereignty-rd-wave03-rd04-mt-row-state-reconciliation-v1.py
  OUT: /tmp/rd04-mt-row-state-validation-control-repair-v1

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind canonical validation, repair topology, and live-base matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = pull_request ]; then
            REPAIR_COMMIT='${{ github.event.pull_request.head.sha }}'
            BASE_SHA='${{ github.event.pull_request.base.sha }}'
            test "$(git rev-parse HEAD)" = "$REPAIR_COMMIT"
            git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
            test "$BASE_SHA" = "$(git rev-parse origin/main)"
          else
            read -r P1 P2 EXTRA <<< "$(git show -s --format='%P' HEAD)"
            test -n "$P1" && test -n "$P2" && test -z "${EXTRA:-}"
            BASE_SHA="$P1"; REPAIR_COMMIT="$P2"
          fi
          test "$(git show -s --format='%P' "$ADMITTED_VALIDATION_PRODUCT")" = "$CANONICAL_PARENT"
          test "$(git rev-parse "$ADMITTED_VALIDATION_PRODUCT^{tree}")" = "$ADMITTED_VALIDATION_PRODUCT_TREE"
          test "$(git show -s --format='%P' "$REPAIR_COMMIT")" = "$ADMITTED_VALIDATION_MERGE"
          git merge-base --is-ancestor "$ADMITTED_VALIDATION_MERGE" "$BASE_SHA"
          test "$(git rev-parse "$CANONICAL_PARENT^{tree}")" = "$CANONICAL_PARENT_TREE"
          test "$(git rev-parse "$BASE_SHA:$MATRIX_PATH")" = "$MATRIX_BLOB"
          test "$(git rev-parse "$REPAIR_COMMIT:$MATRIX_PATH")" = "$MATRIX_BLOB"

          REPAIR_PATHS="$(printf '%s\n' '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1.yml' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/product-manifest.json')"
          PRODUCT_PATHS="$(printf '%s\n' '.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1.yml' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/current-row-custody.json' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/product-manifest.json' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/row-state-validation.json' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/summary.json' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/validated-row-state-protocol.json' 'tools/validate-status-sovereignty-rd-wave03-rd04-mt-row-state-reconciliation-v1.py')"
          UNCHANGED_PATHS="$(printf '%s\n' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/current-row-custody.json' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/row-state-validation.json' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/summary.json' 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/validated-row-state-protocol.json' 'tools/validate-status-sovereignty-rd-wave03-rd04-mt-row-state-reconciliation-v1.py')"

          test "$(git diff --name-only "$ADMITTED_VALIDATION_MERGE" "$REPAIR_COMMIT" | LC_ALL=C sort)" = "$REPAIR_PATHS"
          test "$(git diff --name-only --diff-filter=M "$ADMITTED_VALIDATION_MERGE" "$REPAIR_COMMIT" | LC_ALL=C sort)" = "$REPAIR_PATHS"
          test -z "$(git diff --name-only --diff-filter=ADTRCUXB "$ADMITTED_VALIDATION_MERGE" "$REPAIR_COMMIT")"
          git diff --check "$ADMITTED_VALIDATION_MERGE" "$REPAIR_COMMIT"

          git diff --name-only "$ADMITTED_VALIDATION_MERGE" "$BASE_SHA" | LC_ALL=C sort > "$OUT/intervening-paths.txt"
          printf '%s\n' "$PRODUCT_PATHS" > "$OUT/product-paths.txt"
          printf '%s\n' "$REPAIR_PATHS" > "$OUT/repair-paths.txt"
          test -z "$(comm -12 "$OUT/product-paths.txt" "$OUT/intervening-paths.txt")"

          while IFS= read -r PRODUCT_PATH; do
            test "$(git rev-parse "$BASE_SHA:$PRODUCT_PATH")" = "$(git rev-parse "$ADMITTED_VALIDATION_MERGE:$PRODUCT_PATH")"
          done <<< "$PRODUCT_PATHS"
          while IFS= read -r UNCHANGED_PATH; do
            test "$(git rev-parse "$REPAIR_COMMIT:$UNCHANGED_PATH")" = "$(git rev-parse "$ADMITTED_VALIDATION_MERGE:$UNCHANGED_PATH")"
          done <<< "$UNCHANGED_PATHS"

          if [ "$EVENT" = push ]; then
            test "$(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)" = "$REPAIR_PATHS"
            while IFS= read -r REPAIR_PATH; do
              test "$(git rev-parse "HEAD:$REPAIR_PATH")" = "$(git rev-parse "$REPAIR_COMMIT:$REPAIR_PATH")"
            done <<< "$REPAIR_PATHS"
          fi
      - name: Validate unchanged candidate and repaired control surface
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile "$VALIDATOR"
          VALIDATION_HEAD="$(git rev-parse HEAD)" python "$VALIDATOR" | tee "$OUT/validation-receipt.json"
          jq -e '.state == "qualified_request_free_montana_row_state_candidate" and .adversarial_refusals == 26 and .projected_terminal_cells == 230 and .projected_terminal_units == 12 and .promotion_executed_here == false and .class_closed == false' "$OUT/validation-receipt.json" >/dev/null
          npm run release:check > "$OUT/release-check.log" 2>&1
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain)"
          VALIDATION_HEAD="$(git rev-parse HEAD)" python "$VALIDATOR" > "$OUT/post-release-validation-receipt.json"
          cmp "$OUT/validation-receipt.json" "$OUT/post-release-validation-receipt.json"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve exact Montana validation control-repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-reconciliation-validation-control-repair-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
