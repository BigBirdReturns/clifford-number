name: Status-for-sovereignty SSC-F02 SNAP institutional gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-f02-snap.yml'
      - 'data/intake/status-sovereignty-f02-snap-gate-first-pass.json'
      - 'data/project/status-sovereignty-f02-snap-gate-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-institutional-gate-first-pass.schema.json'
      - 'docs/milestones/ssc-f02-snap-gate-first-pass.md'
      - 'tools/build-status-sovereignty-f02-snap.mjs'
      - 'tools/validate-status-sovereignty-f02-snap.mjs'
      - 'test/status-sovereignty-f02-snap.test.js'
      - 'build/core-thesis/status-sovereignty/f02-snap/**'
      - 'reports/core-thesis/status-sovereignty/f02-snap/**'
  push:
    branches:
      - main
      - 'agent/ssc-f02-institutional-gate'
    paths:
      - '.github/workflows/status-sovereignty-f02-snap.yml'
      - 'data/intake/status-sovereignty-f02-snap-gate-first-pass.json'
      - 'data/project/status-sovereignty-f02-snap-gate-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-institutional-gate-first-pass.schema.json'
      - 'docs/milestones/ssc-f02-snap-gate-first-pass.md'
      - 'tools/build-status-sovereignty-f02-snap.mjs'
      - 'tools/validate-status-sovereignty-f02-snap.mjs'
      - 'test/status-sovereignty-f02-snap.test.js'
      - 'build/core-thesis/status-sovereignty/f02-snap/**'
      - 'reports/core-thesis/status-sovereignty/f02-snap/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the bounded SNAP gate first pass
        run: |
          node tools/build-status-sovereignty-f02-snap.mjs
          node tools/validate-status-sovereignty-f02-snap.mjs
          node test/status-sovereignty-f02-snap.test.js
      - name: Require exact committed SNAP products
        run: |
          git diff --exit-code -- \
            data/project/status-sovereignty-f02-snap-gate-first-pass-release-manifest.json \
            build/core-thesis/status-sovereignty/f02-snap/manifest.json \
            build/core-thesis/status-sovereignty/f02-snap/data.json \
            reports/core-thesis/status-sovereignty/f02-snap/data.json \
            reports/core-thesis/status-sovereignty/f02-snap/index.html
      - name: Prove publication exclusion
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/data/intake/status-sovereignty-f02-snap-gate-first-pass.json
          test ! -e dist/build/core-thesis/status-sovereignty/f02-snap
          test ! -e dist/reports/core-thesis/status-sovereignty/f02-snap
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic reconstruction
        run: |
          git restore --staged --worktree .
          node tools/build-status-sovereignty-f02-snap.mjs
          node tools/validate-status-sovereignty-f02-snap.mjs
          node test/status-sovereignty-f02-snap.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
