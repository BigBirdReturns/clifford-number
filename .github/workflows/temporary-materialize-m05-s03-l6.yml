name: Temporary materialize M-05 Sprint 03 Leg 06

on:
  push:
    branches:
      - agent/m05-sprint-03-leg-06-value-recovery-transfer
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-06-value-recovery-transfer.json'
      - 'data/intake/m05-answerable-power-sprint-03-leg-06-value-recovery-sources.json'
      - 'tools/build-m05-answerable-power-sprint-03-leg-06.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-06.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-06.test.js'
      - '.github/workflows/temporary-materialize-m05-s03-l6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-06-value-recovery-transfer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate value-recovery transfer test
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-06.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-06.mjs
          node test/m05-answerable-power-sprint-03-leg-06.test.js
      - name: Commit generated products
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/core-thesis/answerable-power/sprint-03-leg-06.json reports/core-thesis/answerable-power/sprint-03-leg-06.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build M-05 Sprint 03 Leg 06 reports'
          git push origin HEAD:agent/m05-sprint-03-leg-06-value-recovery-transfer
