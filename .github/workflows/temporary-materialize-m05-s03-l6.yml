name: Temporary materialize M-05 Sprint 03 Leg 06

on:
  push:
    branches:
      - agent/m05-sprint-03-leg-06-public-value-recovery
    paths:
      - '.github/workflows/temporary-materialize-m05-s03-l6.yml'
      - 'tmp/m05-s03-l6-part-*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-06-public-value-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Decode permanent source surface
        run: |
          cat tmp/m05-s03-l6-part-*.b64 | base64 -d > /tmp/m05-s03-l6.tgz
          test "$(sha256sum /tmp/m05-s03-l6.tgz | awk '{print $1}')" = "9e716cbd634b0a226dd29d372251cbf6a472bcb1183c9c3c6bb2920f923ab671"
          tar -xzf /tmp/m05-s03-l6.tgz
      - name: Build and validate value-recovery transfer test
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-06.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-06.mjs
          node test/m05-answerable-power-sprint-03-leg-06.test.js
      - name: Commit generated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/project/m05-answerable-power-sprint-03-leg-06-value-recovery-transfer.json \
            docs/milestones/m05-answerable-power-sprint-03-leg-06.md \
            tools/build-m05-answerable-power-sprint-03-leg-06.mjs \
            tools/validate-m05-answerable-power-sprint-03-leg-06.mjs \
            test/m05-answerable-power-sprint-03-leg-06.test.js \
            reports/core-thesis/answerable-power/sprint-03-leg-06.json \
            reports/core-thesis/answerable-power/sprint-03-leg-06.html
          git commit -m "Add M-05 Sprint 03 value-recovery transfer test"
          git push origin HEAD:agent/m05-sprint-03-leg-06-public-value-recovery
