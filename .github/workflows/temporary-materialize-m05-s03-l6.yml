name: Temporary materialize M-05 Sprint 03 Leg 06

on:
  push:
    branches: [agent/m05-sprint-03-leg-06-value-recovery-transfer]
    paths:
      - '.github/workflows/temporary-materialize-m05-s03-l6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-06-value-recovery-transfer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and verify payload
        run: |
          cat .github/m05-s03-l6-payload.part0* | tr -d '\n' > /tmp/m05-s03-l6.b64
          base64 -d /tmp/m05-s03-l6.b64 > /tmp/m05-s03-l6.tar.gz
          echo '9383d72d6df2330c8a020801a27cc57d07651b62e971a64fdd396100b0ef7eae  /tmp/m05-s03-l6.tar.gz' | sha256sum -c -
          tar -xzf /tmp/m05-s03-l6.tar.gz -C .
      - name: Build, validate, test, and release-check
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-06.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-06.mjs
          node test/m05-answerable-power-sprint-03-leg-06.test.js
          npm run release:check
      - name: Commit permanent Leg 06 surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/m05-answerable-power.yml
          git add data/intake/m05-answerable-power-sprint-03-leg-06-value-recovery-sources.json
          git add data/project/m05-answerable-power-sprint-03-leg-06-value-recovery-transfer.json
          git add docs/milestones/m05-answerable-power-sprint-03-leg-06.md
          git add tools/build-m05-answerable-power-sprint-03-leg-06.mjs
          git add tools/validate-m05-answerable-power-sprint-03-leg-06.mjs
          git add test/m05-answerable-power-sprint-03-leg-06.test.js
          git add reports/core-thesis/answerable-power/sprint-03-leg-06.json
          git add reports/core-thesis/answerable-power/sprint-03-leg-06.html
          git commit -m 'Materialize M-05 Sprint 03 Leg 06 value-recovery transfer test'
          git push origin HEAD:agent/m05-sprint-03-leg-06-value-recovery-transfer
