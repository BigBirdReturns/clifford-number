name: Temporary PR 2231 V130 origin-authority publisher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/temporary-pr2231-v130-origin-authority-publisher-v1.yml

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

jobs:
  publish-v130-origin-authority:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover publisher program
        env:
          PUBLISHER_XZ_SHA256: ea899b4448cb5d2aca1d4949759ba372d620f94af6c7d99a5749a841bfb48397
        run: |
          cat > /tmp/pr2231-v130-publisher.sh.xz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/pr2231-v130-publisher.sh.xz.b64 > /tmp/pr2231-v130-publisher.sh.xz
          test "$(sha256sum /tmp/pr2231-v130-publisher.sh.xz | awk '{print $1}')" = "$PUBLISHER_XZ_SHA256"
          xz -dc /tmp/pr2231-v130-publisher.sh.xz > /tmp/pr2231-v130-publisher.sh
          chmod +x /tmp/pr2231-v130-publisher.sh
          bash -n /tmp/pr2231-v130-publisher.sh

      - name: Reconstruct, requalify, and atomically publish exact V130
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_PR: ${{ github.event.pull_request.number }}
          CONTROLLER_BRANCH: ${{ github.head_ref }}
          EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v130-origin-authority-publisher-v1
        run: bash /tmp/pr2231-v130-publisher.sh

      - name: Upload V130 publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v130-origin-authority-publication-v1
          path: /tmp/pr2231-v130-origin-authority-publisher-v1
          if-no-files-found: error
          retention-days: 30
