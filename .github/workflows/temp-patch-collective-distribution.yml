name: TEMP patch collective-distribution notice isolation

on:
  push:
    branches:
      - research/preference-collective-distribution-v1
    paths:
      - 'tools/temp-patch-collective-distribution.mjs'
      - '.github/workflows/temp-patch-collective-distribution.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tools/temp-patch-collective-distribution.mjs'
      - '.github/workflows/temp-patch-collective-distribution.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-retire:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-collective-distribution-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact notice-isolation repair
        run: node tools/temp-patch-collective-distribution.mjs
      - name: Qualify focused collective-distribution control
        run: |
          node tools/compile-preference-collective-distribution.mjs
          node tools/validate-preference-collective-distribution.mjs
          node test/preference-collective-distribution.test.js
      - name: Retire temporary transport and publish repair
        run: |
          rm -f build/research/preference-collective-distribution.json
          rm -f build/research/preference-collective-distribution.md
          rm tools/temp-patch-collective-distribution.mjs
          rm .github/workflows/temp-patch-collective-distribution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Isolate collective-distribution mechanisms from notice failure'
          git push origin HEAD:research/preference-collective-distribution-v1
