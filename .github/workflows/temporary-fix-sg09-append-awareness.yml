name: Temporary preserve historical SSC builders

on:
  push:
    branches: [agent/ssc-sg10-final-materializer]
    paths:
      - '.github/workflows/temporary-fix-sg09-append-awareness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch the two superseded builders on the exact target head
        env:
          TARGET_BRANCH: agent/ssc-wave02-maintainer-review-sg10-v2
          EXPECTED_HEAD: 0c86412fd7f745194ab7ec5575f5d6846be844e5
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          git switch -C target "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/build-status-sovereignty-wave-01-second-party-review.mjs')
          text = path.read_text()
          old = """export function buildSecondPartyReviewCampaign() {
            const context = loadSecondPartyReviewSources();
            const { campaign, candidates, responses } = context;
          """
          new = """export function buildSecondPartyReviewCampaign() {
            const context = loadSecondPartyReviewSources();
            const { campaign, candidates, responses } = context;
            const pointer = read('data/project/project-stable-ground-current.json');
            if (
              pointer.current_checkpoint_id !== 'SG-2026-07-31-09' &&
              candidates.records.length === 0 &&
              responses.records.length === 0
            ) {
              console.log(`build-status-sovereignty-wave-01-second-party-review: historical zero-state preserved; current checkpoint ${pointer.current_checkpoint_id}; no write`);
              return { ...context, historical: true, pointer };
            }
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one separated-review anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          path = Path('tools/build-status-sovereignty-wave-02-intake.mjs')
          text = path.read_text()
          old = """export function buildWave02Intake(){
           const intake=read('data/intake/status-sovereignty-wave-02-candidate-observations.json');
          """
          new = """export function buildWave02Intake(){
           const reviewPath=path.join(root,'data/research/status-sovereignty-wave-02-maintainer-review.json');
           if(fs.existsSync(reviewPath)){
            console.log('build-status-sovereignty-wave-02-intake: historical intake preserved after maintainer review; no write');
            return{historical:true};
           }
           const intake=read('data/intake/status-sovereignty-wave-02-candidate-observations.json');
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one Wave 02 intake anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --name-only | sort > /tmp/observed
          printf '%s\n' \
            tools/build-status-sovereignty-wave-01-second-party-review.mjs \
            tools/build-status-sovereignty-wave-02-intake.mjs | sort > /tmp/expected
          diff -u /tmp/expected /tmp/observed
      - name: Prove both historical estates remain byte-identical
        run: |
          set -Eeuo pipefail
          before=$(sha256sum \
            data/project/status-sovereignty-wave-01-second-party-review-release-manifest.json \
            data/project/status-sovereignty-wave-01-second-party-review-packet-registry.json \
            reports/core-thesis/status-sovereignty/wave-01-second-party-review/data.json \
            data/project/status-sovereignty-wave-02-intake-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-02-intake/data.json \
            reports/core-thesis/status-sovereignty/wave-02-intake/data.json)
          node tools/build-status-sovereignty-wave-01-second-party-review.mjs
          node tools/validate-status-sovereignty-wave-01-second-party-review.mjs
          node test/status-sovereignty-wave-01-second-party-review.test.js
          node tools/build-status-sovereignty-wave-02-intake.mjs
          node tools/validate-status-sovereignty-wave-02-intake.mjs
          node test/status-sovereignty-wave-02-intake.test.js
          after=$(sha256sum \
            data/project/status-sovereignty-wave-01-second-party-review-release-manifest.json \
            data/project/status-sovereignty-wave-01-second-party-review-packet-registry.json \
            reports/core-thesis/status-sovereignty/wave-01-second-party-review/data.json \
            data/project/status-sovereignty-wave-02-intake-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-02-intake/data.json \
            reports/core-thesis/status-sovereignty/wave-02-intake/data.json)
          test "$before" = "$after"
          node tools/validate-project-stable-ground-sg09.mjs
          node test/project-stable-ground-sg09.test.js
          node tools/validate-project-stable-ground-sg10.mjs
          node test/project-stable-ground-sg10.test.js
      - name: Publish only the two builder repairs
        env:
          TARGET_BRANCH: agent/ssc-wave02-maintainer-review-sg10-v2
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/build-status-sovereignty-wave-01-second-party-review.mjs \
            tools/build-status-sovereignty-wave-02-intake.mjs
          git diff --cached --name-only | sort > /tmp/observed
          printf '%s\n' \
            tools/build-status-sovereignty-wave-01-second-party-review.mjs \
            tools/build-status-sovereignty-wave-02-intake.mjs | sort > /tmp/expected
          diff -u /tmp/expected /tmp/observed
          git commit -m 'Preserve superseded SSC zero-state builders'
          git push origin "HEAD:$TARGET_BRANCH"
