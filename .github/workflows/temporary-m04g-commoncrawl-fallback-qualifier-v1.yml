name: TEMP M-04G Common Crawl fallback qualifier

on:
  push:
    branches:
      - agent/m04g-commoncrawl-fallback-materializer-v1

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_MAIN: e02e2fafcdfdf8360d53b3cfdb498dddde26d6e6
      EXPECTED_TREE: de62918a1154692d3e4bf149b3f886c6aff5527f
      CANDIDATE_BRANCH: candidate/m04g-commoncrawl-fallback-v1
      EXPECTED_ROUTE_DENOMINATOR: "96"
      EXPECTED_BASIN_DENOMINATOR: "12"
      BASELINE_ROUTE_SUCCESSES: "51"
      BASELINE_CONTENT_SUCCESSES: "51"
      BASELINE_HEALTHY_BASINS: "7"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify exact transport parent and canonical base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test -z "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH")"

      - name: Reset to exact canonical product base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

      - name: Apply deterministic policy repair
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/materializer.b64 <<'PAYLOAD'
          H4sIAAAAAAAC/9VXXW/bNhR996/gsgfZqCw5adNmKVys6Npuw7ANaN+SQqWpa5stRaokFcdo8993SUqybMtugu1leUhsXvLwfh6e
          /PhDWhmdzrhMQd4QqXIY8KJU2hJqDOCfuVYFiZzhMqykxmrObPS82Tg33U1zs7GU1C67NvcdrQOmpLFEK2XJlJRaMTAmYat8OHpe
          20olOFv/7c5PPUzySXE5dEdiEuXU0hTPfQJm02LyZDE2qtIMxsCUUIv1+OZsHBCST0bJqIW1YOwhUGdDsPMxlWYFms4EIAh+GptS
          c2nHk8djAYvx5FnitiKyw93yF2F/f/fXn0lJtYHh3CQaaP6GC3i3lmy4iQlvq+z8Iho5gJDVBL5UVNR7EsOWUNDsBrThSuL2o0H+
          fOo8qXFygPJ1FysHqQouqVU6Jl8HhMBtiXmDPNOqwkguyU9P4+7yjBoucfn0LN7fnZWgw45LcuHspQa89waCPeM5nrS6AmejQqhV
          bchBgMVgLsmcCtMx51zjBdmN4gyyWSU+Z+i44HJR7xzcbYLbStISqLDLDAtgNWU2WQg1o6K+zlTMdVWmqYWYTJJn5w9Dcd9B2j2c
          p/fF0WjFyPIsGNZ1WmNM66Ztlgr7sWkdV5uCWra8JBGXOdwmTBWFkkzTlUiUXkSx33HrLmGV1iDZGsvkV7nkRVVk2KdYDPS/cAU8
          n0yc0fICMCl+7fFkEhaptVCU1m0b3DXzgQkXM8o+P9Cn5hiCXeFX4o+5n0oLPLi0tjSXadoLkDJf7bkKoxrXJwuwS5Xj4bev37eL
          YQAyJrAAaCqrGbqZediMISfgWGwAME+zte/v87MnZxcXfv0Of39w8dYBwy03Fnvt16YQHIwjh7qmuJqV9XIy5wKTO0QEpIzViExf
          IIWtEp8eMp1OO9UMi4PdVvHjtH9hIkAukBXQ7EsTvfIpIq9cjjxqwy9UOEZZBxQTDVpiW+B42d9cIg57L3O/YXjA+8hjdJhEKhuI
          ZAMek/EpstHbX17/8X7bMcmWSmMbGmzyhQPpdcKU+AE6gOQR9i9G3cndaK84b5r22omtbbvvl2a7sb9fnvbK47VpYI/Up9/hSpol
          n9vhtl+HnoMOhSc7fBwjex9gpN5TWyz0wLs23B+Ti3sc76P/OJD6vU8ffB2OA/2v3wYUDivNLfQqBy8wnASTCz5f16aYyEqImJyN
