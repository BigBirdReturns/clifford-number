name: Temporary PR 2231 V120 weak-range current-main qualification R6

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v120-weak-range-current-main-qualification-r6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v120-r6:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v120-weak-range-current-main-qualification-r6'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v120-weak-range-current-main-qualification-r6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute exact V120 read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          export GIT_TERMINAL_PROMPT=0

          repo=BigBirdReturns/clifford-number
          prior_controller=97eccfb49b9e58defd1681309dc3a2b67b24ec78
          prior_branch=agent/pr2231-v120-weak-range-current-main-qualification-r5
          prior_artifact_id=9816203050
          prior_artifact_size=37560
          prior_artifact_sha256=652d39911671fc02244702f3f74853a51d9e1f996fa189ad2f555496743b81f8
          prior_qualifier_size=22074
          prior_qualifier_blob=dcc74ef011ddd9e1639a8981d0be35653f6f83c4
          prior_qualifier_sha256=26038cc7dc09ad3a80d56c279f5db6a167c76d093afd2a102ea7f34aa4455f4d
          qualifier_size=22085
          qualifier_blob=d14835e638fc9ce8ce211c72df0181f9600c862f
          qualifier_sha256=3e9ffaa92f86758a6e18db80a8a423585dd46900cceb36381fdf195029ce79d5
          envelope=/tmp/pr2231-v120-weak-range-current-main-controller-envelope-r6
          prior_zip="$envelope/r5-artifact.zip"
          prior_qualifier="$envelope/qualifier-v120-r5.sh"
          qualifier="$envelope/qualifier-v120-r6.sh"
          wrapper_log="$envelope/controller-wrapper.log"
          artifact=/tmp/pr2231-v120-weak-range-current-main-qualification-r6

          rm -rf "$envelope" "$artifact"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only\npublication=skipped\nproduct_mutation=none\nreview_mutation=none\n' "$rc" \
              > "$envelope/controller-status.env"
            manifest_tmp="$envelope/.envelope-manifest.tmp"
            find "$envelope" -type f \
              ! -name envelope-manifest.txt \
              ! -name envelope-sha256.txt \
              ! -name .envelope-manifest.tmp \
              -printf '%P\t%s\n' | sort > "$manifest_tmp"
            mv "$manifest_tmp" "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          failed_pr_json=$(gh api "repos/$repo/pulls/2504")
          test "$(jq -r '.head.sha' <<<"$failed_pr_json")" = "$prior_controller"
          test "$(jq -r '.head.ref' <<<"$failed_pr_json")" = "$prior_branch"
          test "$(jq -r '.draft' <<<"$failed_pr_json")" = true
          test "$(jq -r '.merged' <<<"$failed_pr_json")" = false
          failed_run_json=$(gh api "repos/$repo/actions/runs/33547828477")
          test "$(jq -r '.head_sha' <<<"$failed_run_json")" = "$prior_controller"
          test "$(jq -r '.status' <<<"$failed_run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$failed_run_json")" = failure
          failed_jobs_json=$(gh api "repos/$repo/actions/runs/33547828477/jobs")
          test "$(jq -r '.jobs[] | select(.id == 99989626682) | .conclusion' <<<"$failed_jobs_json")" = failure
          failed_artifacts_json=$(gh api "repos/$repo/actions/runs/33547828477/artifacts")
          test "$(jq -r --argjson id "$prior_artifact_id" '.artifacts[] | select(.id == $id) | .size_in_bytes' <<<"$failed_artifacts_json")" = "$prior_artifact_size"
          test "$(jq -r --argjson id "$prior_artifact_id" '.artifacts[] | select(.id == $id) | .digest' <<<"$failed_artifacts_json")" = "sha256:$prior_artifact_sha256"
          printf 'failed_controller_pr=2504\nfailed_controller=%s\nfailed_run=33547828477\nfailed_job=99989626682\nfailed_artifact=%s\nfailed_artifact_digest=sha256:%s\nfailure_mode=git_diff_abbreviation_8_vs_archived_7\n' \
            "$prior_controller" "$prior_artifact_id" "$prior_artifact_sha256" \
            > "$envelope/r5-failure-lease.txt"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$repo/actions/artifacts/$prior_artifact_id/zip" \
            -o "$prior_zip"
          test "$(wc -c < "$prior_zip")" = "$prior_artifact_size"
          test "$(sha256sum "$prior_zip" | awk '{print $1}')" = "$prior_artifact_sha256"
          unzip -p "$prior_zip" \
            'pr2231-v120-weak-range-current-main-controller-envelope-r5/qualifier-v120-r5.sh' \
            > "$prior_qualifier"
          test "$(wc -c < "$prior_qualifier")" = "$prior_qualifier_size"
          test "$(git hash-object "$prior_qualifier")" = "$prior_qualifier_blob"
          test "$(sha256sum "$prior_qualifier" | awk '{print $1}')" = "$prior_qualifier_sha256"

          python - "$prior_qualifier" "$qualifier" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          replacements = [
              (
                  'controller_workflow=.github/workflows/temporary-pr2231-v120-weak-range-current-main-qualification-r5.yml',
                  'controller_workflow=.github/workflows/temporary-pr2231-v120-weak-range-current-main-qualification-r6.yml',
              ),
              (
                  'root=/tmp/pr2231-v120-weak-range-current-main-r5',
                  'root=/tmp/pr2231-v120-weak-range-current-main-r6',
              ),
              (
                  'artifact=/tmp/pr2231-v120-weak-range-current-main-qualification-r5',
                  'artifact=/tmp/pr2231-v120-weak-range-current-main-qualification-r6',
              ),
              (
                  'git -C "$successor" diff --cached > "$artifact/candidate.patch"',
                  'git -C "$successor" diff --cached --abbrev=7 > "$artifact/candidate.patch"',
              ),
              (
                  'export GIT_AUTHOR_DATE=2026-09-01T19:30:00Z',
                  'export GIT_AUTHOR_DATE=2026-09-01T19:45:00Z',
              ),
              (
                  'export GIT_COMMITTER_DATE=2026-09-01T19:30:00Z',
                  'export GIT_COMMITTER_DATE=2026-09-01T19:45:00Z',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'R6 replacement count {count}, expected 1: {old[:96]!r}')
              source = source.replace(old, new)
          Path(sys.argv[2]).write_text(source)
          PY

          chmod 0755 "$prior_qualifier" "$qualifier"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          bash -n "$qualifier"
          printf 'qualifier_parent_blob=%s\nqualifier_parent_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\ntransport_artifact=%s\ntransport_artifact_sha256=%s\n' \
            "$prior_qualifier_blob" "$prior_qualifier_sha256" "$qualifier_blob" "$qualifier_sha256" \
            "$prior_artifact_id" "$prior_artifact_sha256" \
            > "$envelope/qualifier-provenance.txt"

          set +e
          bash "$qualifier"
          qualifier_rc=$?
          set -e
          exit "$qualifier_rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v120-weak-range-current-main-qualification-r6
          path: |
            /tmp/pr2231-v120-weak-range-current-main-qualification-r6
            /tmp/pr2231-v120-weak-range-current-main-controller-envelope-r6
          if-no-files-found: error
          retention-days: 90
