name: Reporter briefing publication contract

on:
  pull_request:
    paths:
      - 'cases/**/briefing.json'
      - 'cases/**/case.json'
      - 'cases/**/claims.jsonl'
      - 'cases/**/events.jsonl'
      - 'cases/**/receipts.jsonl'
      - 'cases/**/trails.jsonl'
      - 'data/intake/**/evidence-trails.jsonl'
      - 'data/intake/**/trail-frontier.jsonl'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'src/ui-utils.js'
      - 'src/i18n.js'
      - 'package.json'
      - 'tools/lib/reporter-briefing.mjs'
      - 'tools/lib/reporter-briefing-html.mjs'
      - 'tools/lib/reporter-briefing.css'
      - 'tools/compile-reporter-briefings.mjs'
      - 'tools/build-report-frontier.mjs'
      - 'tools/compile.mjs'
      - 'tools/lib/case-ledger.mjs'
      - 'tools/build-public-catalog.mjs'
      - 'tools/build-pages.mjs'
      - 'tools/build-standalone.mjs'
      - 'tools/validate-pages.mjs'
      - 'tools/validate-reporter-briefing-pages.mjs'
      - 'tools/verify-reporter-briefings-browser.cjs'
      - 'test/case-ledger.test.js'
      - 'test/reporter-briefing.test.js'
      - 'test/report-frontier.test.js'
      - 'schemas/reporter-briefing.schema.json'
      - 'docs/reporter-briefings.md'
      - 'docs/report-waterline.md'
      - 'docs/adr-reporter-briefing-platform.md'
      - '.github/workflows/reporter-briefings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile the public corpus, reports, and frontier
        run: |
          set +e
          npm run compile > /tmp/reporter-briefings-compile.log 2>&1
          status=$?
          tail -n 260 /tmp/reporter-briefings-compile.log
          exit "$status"

      - name: Verify structured reports, review queues, and waterline
        run: |
          node test/reporter-briefing.test.js
          node test/report-frontier.test.js

      - name: Compile publication prerequisites
        run: |
          npm run compile:denominator
          npm run compile:case-packets
          npm run compile:thesis

      - name: Build and validate Pages and standalone output
        run: |
          set +e
          {
            npm run build:pages &&
            npm run build:standalone &&
            npm run validate:pages &&
            node tools/validate-reporter-briefing-pages.mjs
          } > /tmp/reporter-briefings-build.log 2>&1
          status=$?
          tail -n 260 /tmp/reporter-briefings-build.log
          exit "$status"

      - name: Install declared browser verification dependency
        run: |
          npm install --no-package-lock
          node -e "const version = require('./node_modules/playwright/package.json').version; if (version !== '1.55.0') throw new Error('expected playwright 1.55.0, got ' + version);"
          npx playwright install --with-deps chromium

      - name: Start the static public application
        run: |
          node tools/serve-static.mjs 8080 > /tmp/reporter-briefings-server.log 2>&1 &
          echo $! > /tmp/reporter-briefings-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reporter-briefings-server.log
          exit 1

      - name: Verify structured report to claim and receipt in Chromium
        run: |
          node --check tools/verify-reporter-briefings-browser.cjs
          timeout 240s node tools/verify-reporter-briefings-browser.cjs

      - name: Preserve deterministic publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporter-briefings-browser
          path: |
            briefs/*.html
            build/briefings/index.json
            build/briefings/*.json
            build/cases/*.json
            build/cases/index.json
            build/public-catalog.json
            build/report-frontier.json
            build/review/reporter-briefing-queue.json
            build/metrics/reporter-briefings-browser.json
            build/metrics/reporter-briefing-first.png
            build/metrics/reporter-briefing-evidence-first.png
            /tmp/reporter-briefings-compile.log
            /tmp/reporter-briefings-build.log
            /tmp/reporter-briefings-server.log
          if-no-files-found: warn
