name: TEMP qualify exact PC-54 product tree

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc54-qualified-tree-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      QUALIFIED_SOURCE_PARENT: 1e52a58be874538509d6c0d3c06adc12fc53cad7
      QUALIFIED_SOURCE_TREE: f2b948e6ff29779accb3dea8ceed143775237d28
      ARCHIVE_BYTES: '21820'
      ARCHIVE_SHA256: 4a6adb27b6dc1c87a17140af531449fe4ed7e7f16b2f4b4130b1111fc25bf437
      PATH_COUNT: '14'
      RECEIPT_DIR: /tmp/pc54-qualified-product-tree
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct and authenticate exact product
        shell: bash
        run: |
          set -Eeuo pipefail
          CARRIER_HEAD=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          CURRENT_MAIN=$(git rev-parse origin/main)
          CARRIER_BASE=$(git merge-base "$CARRIER_HEAD" "$CURRENT_MAIN")
          git merge-base --is-ancestor "$QUALIFIED_SOURCE_PARENT" "$CURRENT_MAIN"
          test "$(git rev-parse "$QUALIFIED_SOURCE_PARENT^{tree}")" = "$QUALIFIED_SOURCE_TREE"

          mkdir -p /tmp/pc54-carrier "$RECEIPT_DIR"
          cp .pc54-carrier/manifest.json /tmp/pc54-carrier/manifest.json
          cat .pc54-carrier/part-*.b64 > /tmp/pc54-carrier/product.tar.xz.b64
          base64 --decode /tmp/pc54-carrier/product.tar.xz.b64 > /tmp/pc54-carrier/product.tar.xz
          test "$(wc -c < /tmp/pc54-carrier/product.tar.xz | tr -d ' ')" = "$ARCHIVE_BYTES"
          test "$(sha256sum /tmp/pc54-carrier/product.tar.xz | awk '{print $1}')" = "$ARCHIVE_SHA256"

          cat > /tmp/pc54-carrier/expected-carrier-paths.txt <<'EOF'
          .github/workflows/temp-pc54-materializer.yml
          .pc54-carrier/manifest.json
          .pc54-carrier/part-00.b64
          .pc54-carrier/part-01.b64
          .pc54-carrier/part-02.b64
          EOF
          sed -i 's/^          //' /tmp/pc54-carrier/expected-carrier-paths.txt
          git diff --name-only "$CARRIER_BASE" "$CARRIER_HEAD" | sort > /tmp/pc54-carrier/observed-carrier-paths.txt
          diff -u /tmp/pc54-carrier/expected-carrier-paths.txt /tmp/pc54-carrier/observed-carrier-paths.txt

          python - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root=Path('/tmp/pc54-carrier')
          manifest=json.loads((root/'manifest.json').read_text())
          expected={'schema_version','qualified_source_parent','qualified_source_tree','path_count','path_list_sha256','files','outside_human_dependency','graph_effect','archive_bytes','archive_sha256'}
          if set(manifest)!=expected: raise SystemExit('manifest keys mismatch')
          if manifest['schema_version']!='pc54-product-manifest@1': raise SystemExit('manifest schema mismatch')
          if manifest['qualified_source_parent']!=os.environ['QUALIFIED_SOURCE_PARENT']: raise SystemExit('source parent mismatch')
          if manifest['qualified_source_tree']!=os.environ['QUALIFIED_SOURCE_TREE']: raise SystemExit('source tree mismatch')
          if manifest['path_count']!=int(os.environ['PATH_COUNT']): raise SystemExit('path count mismatch')
          if manifest['archive_bytes']!=int(os.environ['ARCHIVE_BYTES']) or manifest['archive_sha256']!=os.environ['ARCHIVE_SHA256']: raise SystemExit('archive identity mismatch')
          if manifest['outside_human_dependency'] is not False or manifest['graph_effect']!='none': raise SystemExit('authority mismatch')
          files=manifest['files']; paths=[entry['path'] for entry in files]
          if len(files)!=manifest['path_count'] or paths!=sorted(paths) or len(set(paths))!=len(paths): raise SystemExit('path denominator mismatch')
          path_bytes=''.join(path+'\n' for path in paths).encode()
          if hashlib.sha256(path_bytes).hexdigest()!=manifest['path_list_sha256']: raise SystemExit('path list mismatch')
          (root/'product-paths.txt').write_bytes(path_bytes)
          with tarfile.open(root/'product.tar.xz','r:xz') as archive:
              members=archive.getmembers()
              if [m.name for m in members]!=paths: raise SystemExit('archive membership mismatch')
              if any(not m.isfile() for m in members): raise SystemExit('non-file archive member')
          PY

          git diff --name-only "$QUALIFIED_SOURCE_PARENT" "$CURRENT_MAIN" | sort > /tmp/pc54-carrier/main-successor-paths.txt
          comm -12 /tmp/pc54-carrier/product-paths.txt /tmp/pc54-carrier/main-successor-paths.txt > /tmp/pc54-carrier/overlap.txt
          test ! -s /tmp/pc54-carrier/overlap.txt
          while IFS= read -r path; do
            if git cat-file -e "$CURRENT_MAIN:$path" 2>/dev/null; then echo "product path exists on current main: $path" >&2; exit 1; fi
          done < /tmp/pc54-carrier/product-paths.txt
          printf '%s\n' "$CARRIER_HEAD" > /tmp/pc54-carrier/carrier-head.txt
          printf '%s\n' "$CARRIER_BASE" > /tmp/pc54-carrier/carrier-base.txt
          printf '%s\n' "$CURRENT_MAIN" > /tmp/pc54-carrier/current-main.txt

      - name: Materialize and verify exact bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          CURRENT_MAIN=$(cat /tmp/pc54-carrier/current-main.txt)
          git reset --hard "$CURRENT_MAIN"
          git clean -fdx
          tar -xJf /tmp/pc54-carrier/product.tar.xz
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('/tmp/pc54-carrier/manifest.json').read_text())
          for entry in manifest['files']:
              raw=Path(entry['path']).read_bytes()
              if len(raw)!=entry['bytes']: raise SystemExit(f"byte mismatch {entry['path']}")
              if hashlib.sha256(raw).hexdigest()!=entry['sha256']: raise SystemExit(f"sha mismatch {entry['path']}")
              blob=subprocess.check_output(['git','hash-object','--stdin'],input=raw).decode().strip()
              if blob!=entry['git_blob_sha1']: raise SystemExit(f"blob mismatch {entry['path']}")
          PY
          git add --pathspec-from-file=/tmp/pc54-carrier/product-paths.txt
          git diff --cached --name-status "$CURRENT_MAIN" > /tmp/pc54-carrier/product-delta.tsv
          test "$(wc -l < /tmp/pc54-carrier/product-delta.tsv | tr -d ' ')" = "$PATH_COUNT"
          awk '$1 != "A" { exit 1 }' /tmp/pc54-carrier/product-delta.tsv
          cut -f2 /tmp/pc54-carrier/product-delta.tsv | sort > /tmp/pc54-carrier/staged-paths.txt
          diff -u /tmp/pc54-carrier/product-paths.txt /tmp/pc54-carrier/staged-paths.txt
          git diff --cached --check
          git write-tree > /tmp/pc54-carrier/local-product-tree.txt

      - name: Prove direct clean-checkout construction
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build/research
          node test/preference-custody-manifest-v52.test.js

      - name: Run focused PC-54 and floor-v52 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          node tools/compile-preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.mjs
          node tools/validate-preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.mjs
          node test/preference-linkage-repository-commit-parent-merge-topology-tree-path-mode-blob-diff-identity-assurance.test.js
          node tools/compile-preference-custody-manifest-v52.mjs
          node tools/validate-preference-custody-manifest-v52.mjs
          node test/preference-custody-manifest-v52.test.js

      - name: Reconstruct every floor and complete repository gates
        shell: bash
        run: |
          set -Eeuo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check

      - name: Publish non-workflow blobs and seal exact tree receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPOSITORY']
          manifest=json.loads(Path('/tmp/pc54-carrier/manifest.json').read_text())
          current_main=Path('/tmp/pc54-carrier/current-main.txt').read_text().strip()
          parent_tree=subprocess.check_output(['git','rev-parse',f'{current_main}^{{tree}}'],text=True).strip()
          def post(url,payload):
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'pc54-qualified-tree'})
              with urllib.request.urlopen(req,timeout=180) as response:return json.load(response)
          files=[]
          for entry in manifest['files']:
              item={**entry,'remote_git_blob_sha1':None}
              if not entry['path'].startswith('.github/workflows/'):
                  raw=Path(entry['path']).read_bytes()
                  result=post(f'https://api.github.com/repos/{repo}/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
                  if result.get('sha')!=entry['git_blob_sha1']: raise SystemExit(f"remote blob mismatch {entry['path']}")
                  item['remote_git_blob_sha1']=result['sha']
              files.append(item)
          receipt={
            'schema_version':'pc54-qualified-product-tree-receipt@1',
            'qualified_source_parent':os.environ['QUALIFIED_SOURCE_PARENT'],
            'qualified_source_tree':os.environ['QUALIFIED_SOURCE_TREE'],
            'publication_parent':current_main,
            'publication_parent_tree':parent_tree,
            'carrier_head':Path('/tmp/pc54-carrier/carrier-head.txt').read_text().strip(),
            'carrier_base':Path('/tmp/pc54-carrier/carrier-base.txt').read_text().strip(),
            'product_tree':Path('/tmp/pc54-carrier/local-product-tree.txt').read_text().strip(),
            'path_count':manifest['path_count'],
            'archive_bytes':manifest['archive_bytes'],
            'archive_sha256':manifest['archive_sha256'],
            'path_list_sha256':manifest['path_list_sha256'],
            'files':files,
            'direct_clean_checkout':'pass','standalone_pc54':'pass','floor_v52':'pass','historical_floor_reconstruction':'pass','base_preference_custody':'pass','no_magic_human':'pass','release_check':'pass','ref_updates':0,'outside_human_dependency':False,'graph_effect':'none'
          }
          root=Path(os.environ['RECEIPT_DIR']);root.mkdir(parents=True,exist_ok=True)
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (root/'product-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'product.tar.xz').write_bytes(Path('/tmp/pc54-carrier/product.tar.xz').read_bytes())
          (root/'product-paths.txt').write_bytes(Path('/tmp/pc54-carrier/product-paths.txt').read_bytes())
          print(json.dumps(receipt,indent=2))
          PY
          sha256sum "$RECEIPT_DIR"/* > "$RECEIPT_DIR/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: pc54-qualified-product-tree
          path: /tmp/pc54-qualified-product-tree
          if-no-files-found: error
          retention-days: 90
