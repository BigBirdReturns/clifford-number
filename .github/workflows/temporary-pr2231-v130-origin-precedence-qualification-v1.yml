name: Temporary PR 2231 V130 origin-precedence qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v130-origin-precedence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v130-origin-precedence:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v130-origin-precedence-qualification-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v130-origin-precedence-qualification-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute V130 read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          export EXPECTED_CONTROLLER="$(git rev-parse HEAD)"
          envelope=/tmp/pr2231-v130-origin-precedence-controller-v1
          payload="$envelope/qualifier.sh.xz"
          qualifier="$envelope/qualifier.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-v130-origin-precedence-controller\n' "$rc" > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          cp .github/temporary/pr2231-v130-origin-precedence-qualifier-v1.sh.xz "$payload"
          test "$(wc -c < "$payload")" = 5724
          test "$(git hash-object "$payload")" = e2299b160a85f7a01368e7bb65629a0439a71507
          test "$(sha256sum "$payload" | awk '{print $1}')" = 74653e4088801bb0cc02b90feda6c2da75c068386d862cb05cea72130ade21d8
          xz -dc "$payload" > "$qualifier"
          test "$(wc -c < "$qualifier")" = 25088
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = 836b176138f6885ba5ab83d8c6e7c57a04da07ff6b68e089ffb9c644474ef3ae
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          bash "$qualifier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v130-origin-precedence-qualification-v1
          path: |
            /tmp/pr2231-v130-origin-precedence-controller-v1
            /tmp/pr2231-v130-origin-precedence-qualification-v1
          if-no-files-found: warn
          retention-days: 14
