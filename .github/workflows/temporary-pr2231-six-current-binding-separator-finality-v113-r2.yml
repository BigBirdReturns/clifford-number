name: Temporary PR 2231 six-current-binding separator finality V113 R2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-six-current-binding-separator-finality-v113-r2.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-six-current-binding-separator-finality-v113-r2
  cancel-in-progress: false

jobs:
  qualify-six-current-binding-separator-finality:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      CONTROLLER_WORKFLOW: '.github/workflows/temporary-pr2231-six-current-binding-separator-finality-v113-r2.yml'
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: 53aa560c583b943b1aacdfff425423f9812752bb
      EXPECTED_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_TREE: 74d7bab76498a1dd2e7705fbd73b43e45402b24f
      EXPECTED_LIBRARY: 99ddf7d069203ccd0afbda6bd0c860f54473b347
      EXPECTED_TEST: 664e4f949a53b44acb2760cd4e083236b5616c2e
      REVIEW_BINDINGS: >-
        PRRT_kwDOTGqftc6dept0:3888440222
        PRRT_kwDOTGqftc6dfK4F:3888640534
        PRRT_kwDOTGqftc6dfLu0:3888645507
        PRRT_kwDOTGqftc6di_ww:3890125090
        PRRT_kwDOTGqftc6di_wy:3890125092
        PRRT_kwDOTGqftc6dnFe0:3891723035
      QUALIFIER_BLOB: c56eaae12bff81026a123439be915bf8b72baf0d
      EXPECTED_GZIP_SHA256: 598a8ba2ec9c5298ad3f3e8150fe1992dfc9d16c5609880cff14126c95b0c744
      EXPECTED_QUALIFIER_SHA256: 23b1ee481ff74bab5553c05490fabb74833084ce5617206b87e7b35f801afabd
      ARTIFACT_DIR: /tmp/pr2231-six-current-binding-separator-finality-v113-r2
      PRODUCT_WT: /tmp/pr2231-six-current-binding-separator-finality-product-v113-r2
      MAIN_WT: /tmp/pr2231-six-current-binding-separator-finality-main-v113-r2
      QUALIFIED_DIR: /tmp/pr2231-six-current-binding-separator-finality-qualified-v113-r2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and execute immutable read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          qualifier_gz=/tmp/pr2231-six-current-binding-separator-finality-v113-r2.sh.gz
          qualifier=/tmp/pr2231-six-current-binding-separator-finality-v113-r2.sh
          gh api "repos/$REPO/git/blobs/$QUALIFIER_BLOB" --jq '.content' \
            | tr -d '\n' | base64 -d > "$qualifier_gz"
          printf '%s  %s\n' "$EXPECTED_GZIP_SHA256" "$qualifier_gz" \
            | sha256sum -c -
          gzip -dc "$qualifier_gz" > "$qualifier"
          printf '%s  %s\n' "$EXPECTED_QUALIFIER_SHA256" "$qualifier" \
            | sha256sum -c -
          chmod +x "$qualifier"
          "$qualifier"

      - name: Emit qualification diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          upload=/tmp/pr2231-six-current-binding-separator-finality-v113-r2-upload
          qualifier=/tmp/pr2231-six-current-binding-separator-finality-v113-r2.sh
          rm -rf "$upload"
          mkdir -p "$ARTIFACT_DIR" "$upload"
          if [[ -f "$qualifier" ]]; then
            cp "$qualifier" "$ARTIFACT_DIR/qualifier-v113-r2.sh"
            sha256sum "$qualifier" > "$ARTIFACT_DIR/qualifier-v113-r2.sha256"
          fi
          printf '%s\n' "$QUALIFIER_BLOB" > "$ARTIFACT_DIR/qualifier-git-blob.txt"
          printf '%s\n' "$EXPECTED_GZIP_SHA256" > "$ARTIFACT_DIR/qualifier-gzip-sha256.txt"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$ARTIFACT_DIR/artifact-manifest.txt"
          cp -a "$ARTIFACT_DIR"/. "$upload"/
          find "$upload" -maxdepth 1 -type f -printf '%f\t%s\n' \
            | sort > "$upload/upload-manifest.txt"
          {
            printf '%s\n' '### PR 2231 six-current-binding separator finality V113 R2'
            for receipt in qualification-terminal.txt summary.json \
              predecessor-reproduction.jsonl direct-matrix.jsonl \
              focused-product.log product-release-check.log \
              focused-main-transplant.log main-release-check.log \
              candidate-commit.txt candidate-paths.txt controller-paths.txt \
              review-comments-before.tsv review-thread-ledger-before.jsonl \
              review-comments-after.tsv review-thread-ledger-after.jsonl \
              artifact-manifest.txt qualifier-v113-r2.sha256; do
              printf '\n#### %s\n\n```text\n' "$receipt"
              [[ ! -f "$ARTIFACT_DIR/$receipt" ]] \
                || tail -n 420 "$ARTIFACT_DIR/$receipt"
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-six-current-binding-separator-finality-v113-r2
          path: /tmp/pr2231-six-current-binding-separator-finality-v113-r2-upload
          retention-days: 90
