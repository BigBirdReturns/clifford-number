name: Temporary PR 2231 day-first date V105 publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-day-first-date-v104.yml'
      - '.github/tmp/pr2231-day-first-date-v104.sh.gz'

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-day-first-date-v105-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      EXPECTED_MAIN: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PRODUCT: 618d7f4fff23ea44d396f1476477e0163a1c50f1
      EXPECTED_PRODUCT_TREE: ec2c1fdf2bc9e7b05d9fe1ec40f22c56e9ae4184
      EXPECTED_LIBRARY_BLOB: d02ac8fdb1dad6777d6a722a097706c5660ebe8a
      EXPECTED_TEST_BLOB: 1d8fd285563eea4121bbe178a4b54eb715af3ac0
      EXPECTED_REVIEW_THREAD: PRRT_kwDOTGqftc6dept0
      EXPECTED_REVIEW_COMMENT: '3888440222'
      EXPECTED_CANDIDATE_TREE: 7ae48a2dc664c98f0e39f693d13a63fb4ee82224
      EXPECTED_CANDIDATE_LIBRARY_BLOB: 5e753c9c32cba270ea79b6299fc35db94cd0928f
      EXPECTED_CANDIDATE_TEST_BLOB: 069349ea792a8da8c5d67831ac2e73efc0ee82e9
      PUBLISH: 'true'
      ARTIFACT_DIR: /tmp/pr2231-day-first-date-finality-v105

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qualify and publish exact two-file successor
        shell: bash
        run: gzip -dc .github/tmp/pr2231-day-first-date-v104.sh.gz | bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-day-first-date-finality-v105
          path: /tmp/pr2231-day-first-date-finality-v105
          retention-days: 90
