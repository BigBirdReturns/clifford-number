name: Temporary PR2176 adjacency and parenthetical repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - '.github/workflows/temporary-pr2176-adjacency-parenthetical-repair.yml'

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-adjacency-parenthetical-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6cc284ae4058efdd4ed7badc89e45426fd1fdb86"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-adjacency-parenthetical-repair.yml"
      - name: Apply repair or write diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import traceback

          diagnostic = Path('.github/pr2176-adjacency-parenthetical-repair-diagnostic.txt')
          diagnostic.unlink(missing_ok=True)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label} anchor count was {count}, expected 1')
              return text.replace(old, new, 1)

          def insert_after_assertion(text, message, block, label):
              message_index = text.find(message)
              if message_index < 0:
                  raise RuntimeError(f'{label} message marker was absent')
              statement_end = text.find('\n);', message_index)
              if statement_end < 0:
                  raise RuntimeError(f'{label} assertion terminator was absent')
              insertion = statement_end + len('\n);')
              return text[:insertion] + '\n' + block + text[insertion:]

          try:
              library_path = Path('tools/lib/industrial-exhaust.mjs')
              library = library_path.read_text(encoding='utf-8')

              old_dotted = r'''function isDottedContactContinuation(value, separator, groups, index) {
            const normalizedTail = normalizedWrappedNumericTail(value);
            if (/^(?:19|20)\d{2}$/u.test(normalizedTail)) return false;
            if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'))) {
              return false;
            }
            if (/^\d{3,4}$/u.test(normalizedTail)) return true;
            if (!/^\d{2}$/u.test(normalizedTail) || index < 3) return false;
            return groups.slice(index - 3, index + 1).every(group =>
              /^\d{2}$/u.test(group[0].normalize('NFKC'))
            );
          }'''
              new_dotted = r'''function isDottedContactContinuation(value, separator, groups, index, contextualTail) {
            const normalizedTail = normalizedWrappedNumericTail(value);
            const normalizedSeparator = separator.normalize('NFKC');
            if (/^(?:19|20)\d{2}$/u.test(normalizedTail)) return false;
            if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(normalizedSeparator)) return false;
            if (/\(\s*$/u.test(normalizedSeparator)
                && hasNarrativeNumericContinuation(contextualTail)) return false;
            if (/^\d{3,4}$/u.test(normalizedTail)) return true;
            if (!/^\d{2}$/u.test(normalizedTail) || index < 3) return false;
            return groups.slice(index - 3, index + 1).every(group =>
              /^\d{2}$/u.test(group[0].normalize('NFKC'))
            );
          }'''
              library = replace_once(library, old_dotted, new_dotted, 'dotted helper')

              call_anchor = 'isDottedContactContinuation(tail, separator, groups, index)'
              if library.count(call_anchor) != 2:
                  raise RuntimeError('dotted continuation call count was not two')
              library = library.replace(
                  call_anchor,
                  'isDottedContactContinuation(tail, separator, groups, index, contextualTail)'
              )

              old_callback = r'''  const phoneRedacted = emailRedacted.replace(PHONE_SPAN_PATTERN, (candidate, offset, input) => {
            const prefix = redactionPrefixContext(input, offset);
            const suffix = input.slice(offset + candidate.length, offset + candidate.length + 64);
            const previousCharacter = Array.from(prefix).at(-1) ?? '';
            const allowInitialGroup = !/[\p{L}\p{N}]/u.test(previousCharacter) || hasPhoneLabelPrefix(prefix);
            return redactPhoneSubspans(candidate, prefix, suffix, allowInitialGroup);
          });'''
              new_callback = r'''  const phoneRedacted = emailRedacted.replace(PHONE_SPAN_PATTERN, (candidate, offset, input) => {
            const firstContactCharacter = candidate.search(/[+＋(（0-9０-９]/u);
            const contactOffset = offset + Math.max(0, firstContactCharacter);
            const prefix = redactionPrefixContext(input, contactOffset);
            const suffix = input.slice(offset + candidate.length, offset + candidate.length + 64);
            const adjacentCharacter = Array.from(input.slice(0, contactOffset)).at(-1) ?? '';
            const allowInitialGroup = !/[\p{L}\p{N}]/u.test(adjacentCharacter) || hasPhoneLabelPrefix(prefix);
            return redactPhoneSubspans(candidate, prefix, suffix, allowInitialGroup);
          });'''
              library = replace_once(library, old_callback, new_callback, 'redaction callback')

              test_path = Path('test/industrial-exhaust.test.js')
              tests = test_path.read_text(encoding='utf-8')

              adjacency_tests = r'''for (const [input, expected] of [
            ['Call 03-6216-5111', 'Call [contact omitted]'],
            ['Call 09012345678', 'Call [contact omitted]'],
            [
              'Phone: 03 6216 5111 or 090-1234-5678',
              'Phone: [contact omitted] or [contact omitted]'
            ],
            ['連絡先は 03-6216-5111', '連絡先は [contact omitted]']
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'whitespace-separated domestic phones must remain independently eligible for redaction'
            );
          }'''
              tests = insert_after_assertion(
                  tests,
                  'phone labels must continue to redact compact domestic numbers',
                  adjacency_tests,
                  'domestic adjacency tests'
              )

              parenthetical_tests = r'''assert.equal(
            redactContactData('Contact +33 1 42 68 53. (00) attendees joined.'),
            'Contact [contact omitted]. (00) attendees joined.',
            'parenthesized numeric prose must override a dotted two-digit pair-group tie-break'
          );
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 12 34 56 78. (00) attendees joined.'),
            'Tel: [contact omitted] ext [contact omitted]. (00) attendees joined.',
            'parenthesized numeric prose must override a dotted pair-group extension tie-break'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53. (00)'),
            'Contact [contact omitted]',
            'a parenthesized two-digit tail without narrative continuation may remain part of the phone'
          );'''
              tests = insert_after_assertion(
                  tests,
                  'narrative text after a two-digit pair-group phone ending must not expose that group',
                  parenthetical_tests,
                  'parenthetical pair-group tests'
              )

              library_path.write_text(library, encoding='utf-8')
              test_path.write_text(tests, encoding='utf-8')
          except Exception:
              diagnostic.write_text(traceback.format_exc(), encoding='utf-8')
          PY
      - name: Validate repair or append diagnostic
        shell: bash
        run: |
          set -uo pipefail
          if test -f .github/pr2176-adjacency-parenthetical-repair-diagnostic.txt; then
            exit 0
          fi
          {
            node --check tools/lib/industrial-exhaust.mjs &&
            node --check tools/crawl-industrial-exhaust.mjs &&
            node --check test/industrial-exhaust.test.js &&
            node test/industrial-exhaust.test.js &&
            git diff --check
          } > /tmp/pr2176-validation.log 2>&1
          status=$?
          if test "$status" -ne 0; then
            {
              printf 'validation_exit=%s\n' "$status"
              cat /tmp/pr2176-validation.log
            } > .github/pr2176-adjacency-parenthetical-repair-diagnostic.txt
          fi
          exit 0
      - name: Publish repair or diagnostic and remove runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-adjacency-parenthetical-repair.yml
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-adjacency-parenthetical-repair.yml
          if test -f .github/pr2176-adjacency-parenthetical-repair-diagnostic.txt; then
            git add .github/pr2176-adjacency-parenthetical-repair-diagnostic.txt
            message="Publish PR2176 adjacency repair diagnostic"
          else
            message="Redact separated domestic phones and preserve parenthesized prose"
          fi
          git diff --cached --check
          git commit -m "$message"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
