name: Counter-Selector Wave 29 public resumability audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-29.yml'
      - 'data/project/counter-selector-wave-29-*.json'
      - 'schemas/counter-selector-resumability-audit.schema.json'
      - 'docs/methods/counter-selector-public-resumability-audit.md'
      - 'docs/milestones/counter-selector-wave-29.md'
      - 'tools/build-counter-selector-wave-29.mjs'
      - 'tools/validate-counter-selector-wave-29.mjs'
      - 'test/counter-selector-wave-29.test.js'
      - 'reports/core-thesis/counter-selector-wave-29/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-29.yml'
      - 'data/project/counter-selector-wave-29-*.json'
      - 'schemas/counter-selector-resumability-audit.schema.json'
      - 'docs/methods/counter-selector-public-resumability-audit.md'
      - 'docs/milestones/counter-selector-wave-29.md'
      - 'tools/build-counter-selector-wave-29.mjs'
      - 'tools/validate-counter-selector-wave-29.mjs'
      - 'test/counter-selector-wave-29.test.js'
      - 'reports/core-thesis/counter-selector-wave-29/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 29 products
        run: node tools/build-counter-selector-wave-29.mjs
      - name: Validate resumability-audit contract
        run: node tools/validate-counter-selector-wave-29.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-29.test.js
      - name: Require exact committed Wave 29 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-29-resumability-registry.json \
            data/project/counter-selector-wave-29-disagreement-ledger.json \
            data/project/counter-selector-wave-29-release-manifest.json \
            reports/core-thesis/counter-selector-wave-29/data.json \
            reports/core-thesis/counter-selector-wave-29/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 29 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-29.mjs
          node tools/validate-counter-selector-wave-29.mjs
          node test/counter-selector-wave-29.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
