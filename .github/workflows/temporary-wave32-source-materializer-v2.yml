name: Temporary Wave 32 source materializer v2

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/tmp/wave32-source-trigger.json'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave32-source-materializer-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Await transport-workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave32-source-materializer-v2.yml'
          encoded_ref='agent%2Flake-allocator-war-snapshot-wave-32'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 32 source workflow v2 was not deleted before checkout' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-snapshot-wave-32
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct and publish ordinary Wave 32 source files
        run: bash tools/run-wave32-source-materializer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wave32-permanent-workflow
          path: |
            /tmp/wave32-permanent-workflow.yml
            /tmp/wave32-permanent-workflow.sha256
          if-no-files-found: error
          retention-days: 1
