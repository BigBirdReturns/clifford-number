name: TEMP prove repaired canonical RD-04 five-state merge 0a40

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: rd04-five-state-postmerge-proof-0a40-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  prove:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ssc-rd04-five-state-postmerge-proof-0a40'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact one-commit one-path proof carrier
        shell: bash
        env:
          CANONICAL_REPAIR_MERGE: '0a4091391e4c17c64683bd91f6a739a2a0a152fc'
          CARRIER_PATH: '.github/workflows/temp-ssc-rd04-five-state-postmerge-proof-0a40.yml'
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$CANONICAL_REPAIR_MERGE"
          test "$(git rev-list --count "$CANONICAL_REPAIR_MERGE"..HEAD)" = 1
          test "$(git diff --name-only "$CANONICAL_REPAIR_MERGE" HEAD)" = "$CARRIER_PATH"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.ref }}' = main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'

      - name: Prove repaired canonical lineage, native workflow, and replay
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_PRODUCT_MAIN: 'd26cb838df12a877840ebe71eb9388d44b6ceaf9'
          PRODUCT: '3c0c2bc18cac5b35baa4afe3bf2c6c7f250b9f94'
          PRODUCT_MERGE: '94937e425b38908e45b1288bcea69c7c33d00c77'
          PRODUCT_TREE: 'd6154ce261f8c5d6df71185ffe50040e2afc33fe'
          REPAIR_COMMIT: '068dbc8d528c0b3e5a37070ffe9b0e408999eda3'
          REPAIR_MERGE: '0a4091391e4c17c64683bd91f6a739a2a0a152fc'
          WORKFLOW_PATH: '.github/workflows/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.yml'
          WORKFLOW_BLOB: '6528a01f20a8b076d4ed07b9497e136d3479c388'
          WORKFLOW_BYTES: '6987'
          WORKFLOW_SHA256: '5b4514e03ac1a54065fd1e9fe99ad7e13769aa5579bc3b970a6fe640dfad3d23'
          STANDING_WORKFLOW: 'status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.yml'
          FINAL_QUALIFIER_ARTIFACT: '9006811040'
          FINAL_QUALIFIER_ZIP_BYTES: '3224081'
          FINAL_QUALIFIER_ZIP_SHA256: '0dbfd2931a54d68f70c51ab30b660dd12493c51799609552b13a35407d637d6a'
        run: |
          set -Eeuo pipefail
          OUT=/tmp/rd04-five-state-postmerge-proof-0a40
          WT=/tmp/rd04-five-state-postmerge-worktree-0a40
          rm -rf "$OUT" "$WT"
          mkdir -p "$OUT/final-qualification"
          exec > >(tee "$OUT/proof.log") 2>&1

          git fetch --force --no-tags origin main
          test "$(git rev-parse origin/main)" = "$REPAIR_MERGE"

          set -- $(git rev-list --parents -n 1 "$PRODUCT_MERGE")
          test "$#" = 3
          test "$1" = "$PRODUCT_MERGE"
          test "$2" = "$PRE_PRODUCT_MAIN"
          test "$3" = "$PRODUCT"

          set -- $(git rev-list --parents -n 1 "$REPAIR_COMMIT")
          test "$#" = 2
          test "$1" = "$REPAIR_COMMIT"
          test "$2" = "$PRODUCT_MERGE"

          set -- $(git rev-list --parents -n 1 "$REPAIR_MERGE")
          test "$#" = 3
          test "$1" = "$REPAIR_MERGE"
          test "$2" = "$PRODUCT_MERGE"
          test "$3" = "$REPAIR_COMMIT"

          test "$(git show -s --format=%T "$PRODUCT")" = "$PRODUCT_TREE"
          test "$(git show -s --format=%T "$PRODUCT_MERGE")" = "$PRODUCT_TREE"
          REPAIR_TREE=$(git show -s --format=%T "$REPAIR_COMMIT")
          MERGE_TREE=$(git show -s --format=%T "$REPAIR_MERGE")
          test "$REPAIR_TREE" = "$MERGE_TREE"
          test -z "$(git diff --name-only "$REPAIR_COMMIT" "$REPAIR_MERGE")"
          test "$(git diff --name-only "$PRODUCT_MERGE" "$REPAIR_MERGE")" = "$WORKFLOW_PATH"
          test "$(git diff --name-status "$PRODUCT_MERGE" "$REPAIR_MERGE")" = "M	$WORKFLOW_PATH"
          test "$(git rev-parse "$REPAIR_MERGE:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB"
          test "$(git cat-file -s "$WORKFLOW_BLOB")" = "$WORKFLOW_BYTES"
          git cat-file blob "$WORKFLOW_BLOB" > "$OUT/repaired-workflow.yml"
          test "$(sha256sum "$OUT/repaired-workflow.yml" | awk '{print $1}')" = "$WORKFLOW_SHA256"

          gh api "repos/$GITHUB_REPOSITORY/pulls/1391" > "$OUT/product-pr.json"
          jq -e --arg merge "$PRODUCT_MERGE" --arg product "$PRODUCT" '
            .state == "closed" and .merged == true and
            .merge_commit_sha == $merge and .head.sha == $product and
            .commits == 1 and .changed_files == 14
          ' "$OUT/product-pr.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/pulls/1399" > "$OUT/repair-pr.json"
          jq -e --arg merge "$REPAIR_MERGE" --arg repair "$REPAIR_COMMIT" '
            .state == "closed" and .merged == true and
            .merge_commit_sha == $merge and .head.sha == $repair and
            .commits == 1 and .changed_files == 1
          ' "$OUT/repair-pr.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FINAL_QUALIFIER_ARTIFACT/zip" > "$OUT/final-qualification.zip"
          test "$(wc -c < "$OUT/final-qualification.zip" | tr -d ' ')" = "$FINAL_QUALIFIER_ZIP_BYTES"
          test "$(sha256sum "$OUT/final-qualification.zip" | awk '{print $1}')" = "$FINAL_QUALIFIER_ZIP_SHA256"
          unzip -q "$OUT/final-qualification.zip" -d "$OUT/final-qualification"
          (cd "$OUT/final-qualification" && sha256sum -c SHA256SUMS)
          jq -e '
            .qualification == "pass" and
            .product_commit == "3c0c2bc18cac5b35baa4afe3bf2c6c7f250b9f94" and
            .product_tree == "d6154ce261f8c5d6df71185ffe50040e2afc33fe" and
            .final_blob_identities_verified == 14 and
            .nested_unknown_key_refusals == 8 and
            .open_object_schemas == 0 and
            .adversarial_refusals == 532 and
            .matrix_updates == 0 and
            .source_requests == 0 and
            .complete_release_gate == "pass" and
            .clean_replay == "pass"
          ' "$OUT/final-qualification/qualification.json" >/dev/null

          python - "$OUT/final-qualification/final-blob-ledger.json" "$PRODUCT_MERGE" "$REPAIR_MERGE" "$WORKFLOW_PATH" "$WORKFLOW_BLOB" "$OUT/canonical-blob-ledger.json" <<'PYBLOBS'
          import json,pathlib,subprocess,sys
          entries=json.loads(pathlib.Path(sys.argv[1]).read_text())['entries']
          product_merge,repair_merge,workflow_path,workflow_blob=sys.argv[2:6]
          output=pathlib.Path(sys.argv[6])
          rows=[]
          for entry in entries:
              path=entry['path']
              old_blob=subprocess.check_output(['git','rev-parse',f'{product_merge}:{path}'],text=True).strip()
              new_blob=subprocess.check_output(['git','rev-parse',f'{repair_merge}:{path}'],text=True).strip()
              assert old_blob==entry['git_blob'],path
              if path==workflow_path:
                  assert new_blob==workflow_blob and new_blob!=old_blob,path
              else:
                  assert new_blob==old_blob,path
              rows.append({**entry,'product_merge_blob':old_blob,'repair_merge_blob':new_blob,'preserved':path!=workflow_path})
          assert len(rows)==14
          assert sum(row['preserved'] for row in rows)==13
          output.write_text(json.dumps({'schema_version':'ssc-rd04-five-state-repaired-canonical-blob-proof@1','entries':rows},indent=2,sort_keys=True)+'\n')
          print('canonical_blob_preservation=pass unchanged=13 repaired_workflow=1')
          PYBLOBS

          NATIVE_RUN=''
          NATIVE_CONCLUSION=''
          for attempt in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$STANDING_WORKFLOW/runs?branch=main&event=push&per_page=20" > "$OUT/standing-runs.json"
            NATIVE_RUN=$(jq -r --arg merge "$REPAIR_MERGE" '[.workflow_runs[] | select(.head_sha == $merge)] | sort_by(.created_at) | reverse | .[0].id // empty' "$OUT/standing-runs.json")
            if test -n "$NATIVE_RUN"; then
              STATUS=$(jq -r --argjson id "$NATIVE_RUN" '.workflow_runs[] | select(.id == $id) | .status' "$OUT/standing-runs.json")
              NATIVE_CONCLUSION=$(jq -r --argjson id "$NATIVE_RUN" '.workflow_runs[] | select(.id == $id) | .conclusion // empty' "$OUT/standing-runs.json")
              if test "$STATUS" = completed; then break; fi
            fi
            sleep 4
          done
          test -n "$NATIVE_RUN"
          test "$NATIVE_CONCLUSION" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN/jobs?per_page=100" > "$OUT/standing-jobs.json"
          jq -e '.jobs | length == 1 and .[0].name == "validate" and .[0].status == "completed" and .[0].conclusion == "success"' "$OUT/standing-jobs.json" >/dev/null

          git worktree add --detach "$WT" "$REPAIR_MERGE"
          cd "$WT"
          test "$(git rev-parse HEAD)" = "$REPAIR_MERGE"
          test "$(git show -s --format=%T HEAD)" = "$MERGE_TREE"
          node --check tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs | tee "$OUT/build-check.log"
          node tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs | tee "$OUT/product-validation.log"
          node test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js | tee "$OUT/adversarial.log"
          grep -Fq 'rd04_five_state_source_field_adversarial=pass mutations_refused=532' "$OUT/adversarial.log"

          python - <<'PYSCHEMA' | tee "$OUT/schema-closure.log"
          import copy,json,pathlib
          from jsonschema import Draft202012Validator
          root=pathlib.Path('.')
          data=root/'data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication'
          schema=json.loads((root/'schemas/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.schema.json').read_text())
          validator=Draft202012Validator(schema)
          files=['capture-custody.json','source-adjudications.json','field-adjudications.json','pdf-review-receipts.json','promotion-candidate-protocol.json','selected-followup-protocol.json','index.json','product-manifest.json']
          refusals=0
          for name in files:
              value=json.loads((data/name).read_text())
              validator.validate(value)
              mutated=copy.deepcopy(value)
              if 'capture_counts' in mutated: mutated['capture_counts']['unreviewed_authority']=True
              elif 'decisions' in mutated: mutated['decisions'][0]['unreviewed_authority']=True
              elif 'reviews' in mutated: mutated['reviews'][0]['unreviewed_authority']=True
              elif 'candidates' in mutated: mutated['candidates'][0]['unreviewed_authority']=True
              elif 'routes' in mutated: mutated['routes'][0]['unreviewed_authority']=True
              elif 'counts' in mutated: mutated['counts']['unreviewed_authority']=True
              elif 'entries' in mutated: mutated['entries'][0]['unreviewed_authority']=True
              else: raise AssertionError(name)
              assert list(validator.iter_errors(mutated)),name
              refusals+=1
          missing=[]
          def walk(value,path='$'):
              if isinstance(value,dict):
                  if (value.get('type')=='object' or 'properties' in value) and value.get('additionalProperties') is not False and value.get('unevaluatedProperties') is not False:
                      missing.append(path)
                  for key,child in value.items(): walk(child,path+'/'+key)
              elif isinstance(value,list):
                  for index,child in enumerate(value): walk(child,path+f'/{index}')
          walk(schema)
          assert not missing,missing
          print(f'closed_schema_validation=pass objects={len(files)} nested_unknown_key_refusals={refusals} open_object_schemas={len(missing)}')
          PYSCHEMA

          node tools/validate-no-magic-human-gate.mjs | tee "$OUT/no-magic-human.log"
          npm run release:check | tee "$OUT/release-check.log"

          git restore --staged --worktree .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs --write | tee "$OUT/replay-write.log"
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs | tee "$OUT/replay-build.log"
          node tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs | tee "$OUT/replay-validation.log"
          node test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js | tee "$OUT/replay-adversarial.log"
          grep -Fq 'rd04_five_state_source_field_adversarial=pass mutations_refused=532' "$OUT/replay-adversarial.log"
          node tools/validate-no-magic-human-gate.mjs | tee "$OUT/replay-no-magic-human.log"
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          cd "$GITHUB_WORKSPACE"
          jq -n \
            --arg schema_version 'ssc-rd04-five-state-repaired-canonical-postmerge-proof@1' \
            --arg proof 'pass' \
            --arg proof_head "$GITHUB_SHA" \
            --arg product_merge "$PRODUCT_MERGE" \
            --arg product_commit "$PRODUCT" \
            --arg product_tree "$PRODUCT_TREE" \
            --arg repair_commit "$REPAIR_COMMIT" \
            --arg repair_merge "$REPAIR_MERGE" \
            --arg repair_merge_tree "$MERGE_TREE" \
            --arg repaired_workflow_blob "$WORKFLOW_BLOB" \
            --arg repaired_workflow_sha256 "$WORKFLOW_SHA256" \
            --arg native_conclusion "$NATIVE_CONCLUSION" \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --argjson native_run "$NATIVE_RUN" \
            '{
              schema_version:$schema_version,
              proof:$proof,
              workflow_run:$workflow_run,
              proof_head:$proof_head,
              product_merge:$product_merge,
              product_commit:$product_commit,
              product_tree:$product_tree,
              repair_commit:$repair_commit,
              canonical_repair_merge:$repair_merge,
              canonical_repair_merge_tree:$repair_merge_tree,
              repaired_workflow_blob:$repaired_workflow_blob,
              repaired_workflow_sha256:$repaired_workflow_sha256,
              permanent_product_paths:14,
              unchanged_product_blobs:13,
              repaired_workflow_blobs:1,
              native_standing_workflow_run:$native_run,
              native_standing_workflow_conclusion:$native_conclusion,
              closed_schema_objects:8,
              nested_unknown_key_refusals:8,
              open_object_schemas:0,
              adversarial_refusals:532,
              source_requests:0,
              matrix_updates:0,
              no_magic_human:"pass",
              complete_release_gate:"pass",
              clean_replay:"pass",
              outside_human_dependency:false,
              publication_effect:"none",
              adoption_effect:"none",
              graph_effect:"none"
            }' > "$OUT/proof.json"

          find "$OUT" -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | while IFS= read -r name; do
            sha256sum "$OUT/$name"
          done | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - name: Preserve repaired canonical proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-five-state-repaired-canonical-postmerge-proof-0a40
          path: /tmp/rd04-five-state-postmerge-proof-0a40
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Require successful repaired canonical proof
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.proof.outcome }}
        run: test "$OUTCOME" = success
