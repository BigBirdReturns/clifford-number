name: Temporary observation recovery adversarial diagnostic v37

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-observation-recovery-adversarial-diagnostic-v37.yml'

permissions:
  contents: read
  issues: read

concurrency:
  group: observation-recovery-adversarial-diagnostic-v37
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'BigBirdReturns/clifford-number' && github.event.pull_request.number == 2227
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: 2469a23db69e0b2bc325133d0619cc88e1c89ab2
      SOURCE_PARENT: 2d2c7b6cd7517ca25854e481b21774a697d0e76b
      SOURCE_HEAD: 456ee43cb8a0d3c1afeeed8b9f7342219a3fac05
      EXPECTED_PRODUCT: 456ee43cb8a0d3c1afeeed8b9f7342219a3fac05
      CARRIER_PARENT: 11ff1ecd41b14ff4b0b79a5733ddaa81a0bdaf55
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CARRIER_BRANCH: agent/current-main-identifier-context-v1
      BASE_LIBRARY: 5f68254d3e44de693e83503aed879160f9b7b997
      BASE_TEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      SOURCE_LIBRARY: dbf28c75e6681ca06915ccc2e85062f67382175f
      SOURCE_TEST: 08b3cd4014b916d1ac5845c73c59f7d55dbae7ef
      RECOVERY_COMMENT_ID: '5400057410'
      PATCH_SHA256: 7988d991b5141ad7a7a0b79c5203be0279348f1d6d737c5656178c61ccdff2ea
      PATCH_BYTES: '3812'
      EXPECTED_PATCH_TREE: 32f5cbc1407c054dafd47356d04ff45d7b980906
      EXPECTED_PATCH_LIBRARY: 36ddfe7ea06b1e4676dd0b6bb5c57dc2c64568e1
      EXPECTED_PATCH_TEST: 220c2b3852d26b77cfde830d79278f192e029535
      SOURCE_WORK: /tmp/observation-recovery-source-v37
      PATCH_FILE: /tmp/observation-recovery-v37.patch
      RECEIPT_FILE: /tmp/observation-recovery-adversarial-v37.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate exact read-only leases
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test '${{ github.event.pull_request.head.ref }}' = "$CARRIER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git diff --name-only "$CARRIER_PARENT..HEAD")" = '.github/workflows/temporary-observation-recovery-adversarial-diagnostic-v37.yml'

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "+refs/heads/$CARRIER_BRANCH:refs/remotes/origin/$CARRIER_BRANCH"
          LIVE_MAIN="$(git rev-parse refs/remotes/origin/main)"
          LIVE_PRODUCT="$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)"
          LIVE_CARRIER="$(git rev-parse refs/remotes/origin/$CARRIER_BRANCH)"
          printf 'main=%s\nproduct=%s\ncarrier=%s\n' "$LIVE_MAIN" "$LIVE_PRODUCT" "$LIVE_CARRIER"
          test "$LIVE_MAIN" = "$EXPECTED_MAIN"
          test "$LIVE_PRODUCT" = "$EXPECTED_PRODUCT"
          test "$LIVE_CARRIER" = "$HEAD_SHA"
          test "$(git rev-parse "$SOURCE_HEAD^")" = "$SOURCE_PARENT"
          test "$(git rev-parse "$LIVE_MAIN:tools/lib/industrial-exhaust.mjs")" = "$BASE_LIBRARY"
          test "$(git rev-parse "$LIVE_MAIN:test/industrial-exhaust.test.js")" = "$BASE_TEST"
          test "$(git rev-parse "$SOURCE_HEAD:tools/lib/industrial-exhaust.mjs")" = "$SOURCE_LIBRARY"
          test "$(git rev-parse "$SOURCE_HEAD:test/industrial-exhaust.test.js")" = "$SOURCE_TEST"

      - name: Reconstruct exact recovery candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_WORK"
          git worktree prune
          git worktree add --detach "$SOURCE_WORK" "$SOURCE_HEAD"

          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request

          url = (
              'https://api.github.com/repos/BigBirdReturns/clifford-number/'
              f'issues/comments/{os.environ["RECOVERY_COMMENT_ID"]}'
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'X-GitHub-Api-Version': '2022-11-28'
              }
          )
          with urllib.request.urlopen(request) as response:
              body = json.load(response)['body']

          encoded_chunks = re.findall(
              r'(?m)^\d+\.\s+`([A-Za-z0-9+/=]+)`\s*$',
              body
          )
          if len(encoded_chunks) != 6:
              raise SystemExit(f'expected 6 recovery chunks, found {len(encoded_chunks)}')
          compressed = base64.b64decode(''.join(encoded_chunks), validate=True)
          if len(compressed) != int(os.environ['PATCH_BYTES']):
              raise SystemExit(f'unexpected compressed size: {len(compressed)}')
          digest = hashlib.sha256(compressed).hexdigest()
          if digest != os.environ['PATCH_SHA256']:
              raise SystemExit(f'unexpected compressed digest: {digest}')
          pathlib.Path('/tmp/observation-recovery-v37.patch.gz').write_bytes(compressed)
          pathlib.Path(os.environ['PATCH_FILE']).write_bytes(gzip.decompress(compressed))
          PY

          cd "$SOURCE_WORK"
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git am "$PATCH_FILE"

          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PATCH_TREE"
          test "$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)" = "$EXPECTED_PATCH_LIBRARY"
          test "$(git rev-parse HEAD:test/industrial-exhaust.test.js)" = "$EXPECTED_PATCH_TEST"
          test "$(git diff --name-only "$SOURCE_HEAD..HEAD" | LC_ALL=C sort)" = "$(printf '%s\n' test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs | LC_ALL=C sort)"
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js

      - name: Run controlling and adversarial boundary matrix
        shell: bash
        env:
          DIAGNOSTIC_LIBRARY: /tmp/observation-recovery-source-v37/tools/lib/industrial-exhaust.mjs
        run: |
          set -euo pipefail
          RECEIPT_FILE="$RECEIPT_FILE" node .github/diagnostics/observation-recovery-adversarial-v37.mjs

      - name: Run focused suites
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_WORK"
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check "$SOURCE_HEAD..HEAD"

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-recovery-adversarial-v37
          path: /tmp/observation-recovery-adversarial-v37.json
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git worktree remove --force "$SOURCE_WORK" >/dev/null 2>&1 || true
          rm -rf "$SOURCE_WORK" /tmp/observation-recovery-v37.patch.gz "$PATCH_FILE"
