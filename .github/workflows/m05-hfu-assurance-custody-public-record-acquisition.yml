name: M-05 HFU assurance and custody public-record acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-five-domain-implementation-frontier.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-hfu-share-exit-receipt-candidate.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-foodinho-compliance-public-record-acquisition.json'
      - 'tools/lib/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.test.js'
      - '.github/workflows/m05-hfu-assurance-custody-public-record-acquisition.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-five-domain-implementation-frontier.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-hfu-share-exit-receipt-candidate.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-foodinho-compliance-public-record-acquisition.json'
      - 'tools/lib/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.test.js'
      - '.github/workflows/m05-hfu-assurance-custody-public-record-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate HFU assurance and custody public-record acquisition
        run: |
          node --check tools/lib/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs
          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs
          node test/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic focused state
        run: |
          git restore --staged --worktree .
          node tools/validate-m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.mjs
          node test/m05-answerable-power-sprint-03-leg-07-hfu-assurance-custody-public-record-acquisition.test.js
          git diff --exit-code
