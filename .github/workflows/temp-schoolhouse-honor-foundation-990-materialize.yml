name: TEMP retire School.House Form 990 transport refs

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schoolhouse-honor-foundation-990-terminal-cleanup-v1
  cancel-in-progress: false

jobs:
  retire:
    if: github.head_ref == 'agent/schoolhouse-honor-foundation-990-materializer-v1' && github.event.pull_request.number == 1210
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact cleanup carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify merged authority and retire every temporary ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          MERGE_SHA='118af97aae3e1472331ba1e77e03a4bcc7a9e74e'
          PRODUCT_SHA='f96745620bad39b5c33a8cfc594b9048ab5cf5b8'
          CARRIER_BRANCH='agent/schoolhouse-honor-foundation-990-materializer-v1'
          PRODUCT_BRANCH='agent/schoolhouse-honor-foundation-990-custody-product-v1'

          declare -A EXPECTED=()
          EXPECTED['agent/schoolhouse-honor-foundation-990-census-v1']='f60ebdd31a489384a783c562c1d8e185543d58fa'
          EXPECTED['agent/schoolhouse-honor-foundation-990-index-resolution-v1']='a4fbee683c4b9c28b4c30fbe106b9f9e409aa1dd'
          EXPECTED['agent/schoolhouse-honor-foundation-990-official-xml-v1']='2e1457613b2d30385ab5314c1babd6568581468a'
          EXPECTED['agent/schoolhouse-honor-foundation-990-official-xml-replay-v1']='34aa675b124d18ce5eda98fa1465576ace748681'
          EXPECTED["$PRODUCT_BRANCH"]="$PRODUCT_SHA"
          EXPECTED["$CARRIER_BRANCH"]='${{ github.event.pull_request.head.sha }}'

          test "${GITHUB_HEAD_REF}" = "$CARRIER_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --prune --no-tags origin main
          git merge-base --is-ancestor "$MERGE_SHA" origin/main

          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/1214" --jq '.merged')" = true
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/1214" --jq '.merge_commit_sha')" = "$MERGE_SHA"
          for number in 1200 1201 1204 1207; do
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '.state')" = closed
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/$number" --jq '.merged')" = false
          done

          for branch in "${!EXPECTED[@]}"; do
            observed=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            test "$observed" = "${EXPECTED[$branch]}"
          done

          for branch in \
            'agent/schoolhouse-honor-foundation-990-census-v1' \
            'agent/schoolhouse-honor-foundation-990-index-resolution-v1' \
            'agent/schoolhouse-honor-foundation-990-official-xml-v1' \
            'agent/schoolhouse-honor-foundation-990-official-xml-replay-v1' \
            "$PRODUCT_BRANCH"
          do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
            ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1
          done

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/pulls/1210" -f state=closed >/dev/null
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/$CARRIER_BRANCH"
          ! git ls-remote --exit-code --heads origin "refs/heads/$CARRIER_BRANCH" >/dev/null 2>&1

          printf '%s\n' \
            'merged_authority_verified=true' \
            'temporary_pull_requests_closed=5' \
            'temporary_refs_deleted=6' \
            'outside_human_dependency=false'
