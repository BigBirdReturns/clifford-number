name: TEMP materialize School.House related-charity Form 990 custody

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: schoolhouse-honor-foundation-990-materializer-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/schoolhouse-honor-foundation-990-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Export base, current-main, and qualified-product inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='1f04c0abbf89f1529dfd428389392b3425499bc3'
          PRODUCT='06c23806d88b370f0f3122e68b768b626735aef2'
          OUT='/tmp/schoolhouse-honor-foundation-990-rebase-inputs'
          git fetch --prune --no-tags origin main
          MAIN=$(git rev-parse origin/main)
          rm -rf "$OUT"
          mkdir -p "$OUT/base" "$OUT/main" "$OUT/product"

          COMMON=(
            'data/intake/bvvc-defense-capital/README.md'
            'data/intake/bvvc-defense-capital/acquisition-frontier.json'
            'data/intake/bvvc-defense-capital/coverage-matrix.json'
            'data/intake/bvvc-defense-capital/manifest.json'
            'data/intake/bvvc-defense-capital/schoolhouse.json'
            'tools/validate-bvvc-defense-capital.mjs'
          )
          PRODUCT_ONLY=(
            'data/intake/bvvc-defense-capital/schoolhouse-honor-foundation-990-attempt-results.jsonl'
            'data/intake/bvvc-defense-capital/schoolhouse-honor-foundation-990-custody.json'
            'data/intake/bvvc-defense-capital/schoolhouse-honor-foundation-990-filing-results.jsonl'
            'data/intake/bvvc-defense-capital/schoolhouse-honor-foundation-990-index-resolutions.jsonl'
            'data/intake/bvvc-defense-capital/schoolhouse-honor-foundation-990-structural-signals.jsonl'
            'data/intake/bvvc-defense-capital/schoolhouse-honor-foundation-990-term-hits.jsonl'
            'data/intake/bvvc-defense-capital/source-inventory-17.jsonl'
            'tools/validate-schoolhouse-honor-foundation-990-custody.mjs'
          )

          export_one() {
            local ref="$1"
            local root="$2"
            local path="$3"
            mkdir -p "$root/$(dirname "$path")"
            git show "$ref:$path" > "$root/$path"
          }

          for path in "${COMMON[@]}"; do
            export_one "$BASE" "$OUT/base" "$path"
            export_one "$MAIN" "$OUT/main" "$path"
            export_one "$PRODUCT" "$OUT/product" "$path"
          done
          export_one "$MAIN" "$OUT/main" 'data/intake/bvvc-defense-capital/source-inventory-17.jsonl'
          for path in "${PRODUCT_ONLY[@]}"; do
            export_one "$PRODUCT" "$OUT/product" "$path"
          done

          git diff --binary "$BASE".."$PRODUCT" -- data/intake/bvvc-defense-capital tools/validate-bvvc-defense-capital.mjs tools/validate-schoolhouse-honor-foundation-990-custody.mjs > "$OUT/product.patch"
          git diff --binary "$BASE".."$MAIN" -- data/intake/bvvc-defense-capital tools/validate-bvvc-defense-capital.mjs > "$OUT/main-since-base.patch"
          printf '{"base":"%s","main":"%s","product":"%s","outside_human_dependency":false}\n' "$BASE" "$MAIN" "$PRODUCT" > "$OUT/refs.json"
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS"

      - name: Upload exact rebase inputs
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-honor-foundation-990-rebase-inputs
          path: /tmp/schoolhouse-honor-foundation-990-rebase-inputs
          if-no-files-found: error
          retention-days: 30
