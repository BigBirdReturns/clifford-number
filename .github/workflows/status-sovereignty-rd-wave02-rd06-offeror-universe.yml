name: SSC RD-06 Wave 02 terminal offeror universe

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd06-offeror-universe.yml'
      - 'data/intake/status-sovereignty-rd06-dcgsa-support-exit.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd06-offeror-universe/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-06-C01.json'
      - 'data/project/ssc-residual-wave02/closures/RD-06-C01.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-rd-wave02-rd06-offeror-universe/**'
      - 'schemas/status-sovereignty-rd-wave02-rd06-offeror-universe.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs'
      - 'test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd06-offeror-universe.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave02-rd06-offeror-universe.yml'
      - 'data/intake/status-sovereignty-rd06-dcgsa-support-exit.json'
      - 'data/intake/status-sovereignty-rd-wave02-rd06-offeror-universe/**'
      - 'data/project/ssc-residual-wave02/seeds/RD-06-C01.json'
      - 'data/project/ssc-residual-wave02/closures/RD-06-C01.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'data/research/status-sovereignty-rd-wave02-rd06-offeror-universe/**'
      - 'schemas/status-sovereignty-rd-wave02-rd06-offeror-universe.schema.json'
      - 'tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs'
      - 'test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js'
      - 'docs/milestones/ssc-rd-wave02-rd06-offeror-universe.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd06-wave02-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove exact terminal RD-06 product
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          node test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore volatile generated outputs and replay
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          node tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs --check
          node tools/validate-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs
          node test/status-sovereignty-rd-wave02-rd06-offeror-universe.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve terminal RD-06 product
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-terminal-offeror-universe
          path: |
            data/intake/status-sovereignty-rd-wave02-rd06-offeror-universe/public-record-census-execution-receipt.json
            data/project/ssc-residual-wave02/closures/RD-06-C01.json
            data/research/status-sovereignty-rd-wave02-rd06-offeror-universe
            schemas/status-sovereignty-rd-wave02-rd06-offeror-universe.schema.json
            docs/milestones/ssc-rd-wave02-rd06-offeror-universe.md
          if-no-files-found: error
          retention-days: 90
