name: Finalize Dialog product with history-complete estate checks

on:
  push:
    branches:
      - agent/dialog-directory-boundary-current-main-v1

permissions:
  contents: write

concurrency:
  group: finalize-dialog-history-complete-estate-checks
  cancel-in-progress: false

env:
  SOURCE_BASE_SHA: 4b86a2c7c4ad637ba9754ea6dab8452eb2a4c9ea
  QUALIFIED_DIALOG_TREE: c494c43c99b887033c08ec7b469a1decae0c3312
  PRODUCT_BRANCH: candidate/dialog-directory-boundary-v14
  MATERIALIZER_PATH: tools/materialize-dialog-directory-boundary-v1.py
  WORKFLOW_PATH: .github/workflows/materialize-dialog-directory-boundary-current-main-v1.yml

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dialog-directory-boundary-current-main-v1
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture exact transport and qualified product lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git fetch --no-tags origin \
            "refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"

          actual_paths="$(git diff --name-only "$SOURCE_BASE_SHA"...HEAD | sort)"
          expected_paths="$(printf '%s\n' "$MATERIALIZER_PATH" "$WORKFLOW_PATH" | sort)"
          if [ "$actual_paths" != "$expected_paths" ]; then
            echo 'transport branch contains an unexpected path set' >&2
            printf '%s\n' "$actual_paths" >&2
            exit 1
          fi

          cp "$MATERIALIZER_PATH" /tmp/finalize-dialog-estate-checkouts.py
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$SOURCE_BASE_SHA"
          PRODUCT_LEASE="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)"
          test -n "$PRODUCT_LEASE"
          test "$(git rev-parse "$PRODUCT_LEASE^{tree}")" = "$QUALIFIED_DIALOG_TREE"
          test "$(git rev-parse "$PRODUCT_LEASE^")" = "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "PRODUCT_LEASE=$PRODUCT_LEASE" >> "$GITHUB_ENV"
          git checkout --detach "$PRODUCT_LEASE"

      - name: Bind both estate workflows to full history
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/finalize-dialog-estate-checkouts.py
          observed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/estate-closure-aperture.yml' \
            '.github/workflows/estate-frontier-game-trails.yml' | sort)"
          test "$observed" = "$expected"
          git diff --check

      - name: Run the complete repository release gate
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check

      - name: Publish one clean current-main product commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$BASE_SHA"
          current_product="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)"
          test "$current_product" = "$PRODUCT_LEASE"

          git add \
            .github/workflows/estate-closure-aperture.yml \
            .github/workflows/estate-frontier-game-trails.yml
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/estate-closure-aperture.yml' \
            '.github/workflows/estate-frontier-game-trails.yml' | sort)"
          test "$staged" = "$expected"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE="$(git write-tree)"
          PRODUCT="$(printf '%s\n' \
            'topology: split Dialog evidence and bind history-complete estate checks' \
            | git commit-tree "$TREE" -p "$BASE_SHA")"

          test "$(git rev-parse "$PRODUCT^")" = "$BASE_SHA"
          if git ls-tree -r --name-only "$PRODUCT" \
            | grep -E '(^\.github/workflows/materialize-dialog-directory-boundary-current-main-v1\.yml$|^tools/materialize-dialog-directory-boundary-v1\.py$)'; then
            echo 'transport file remained in product tree' >&2
            exit 1
          fi
          changed="$(git diff-tree --no-commit-id --name-only -r "$PRODUCT" | wc -l | tr -d ' ')"
          test "$changed" = '31'

          echo "product_sha=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "product_tree=$TREE" >> "$GITHUB_OUTPUT"
          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$PRODUCT_LEASE" \
            origin "$PRODUCT:refs/heads/$PRODUCT_BRANCH"

      - name: Report exact product
        shell: bash
        run: |
          {
            echo '## Dialog product with history-complete estate checks'
            echo
            echo "- parent: \`$BASE_SHA\`"
            echo "- product: \`${{ steps.publish.outputs.product_sha }}\`"
            echo "- tree: \`${{ steps.publish.outputs.product_tree }}\`"
            echo '- Dialog qualified tree preserved before the two-workflow repair'
            echo '- standing workflow changes: `2`'
            echo '- product paths: `31`'
            echo '- complete release gate: passed'
            echo '- target PR: `#1965`'
          } >> "$GITHUB_STEP_SUMMARY"
