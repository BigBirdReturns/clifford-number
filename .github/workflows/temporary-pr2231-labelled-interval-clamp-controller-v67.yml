name: Temporary PR 2231 labelled interval clamp controller v67
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-labelled-interval-clamp-controller-v67.yml'
      - '.github/tmp/pr2231-labelled-interval-clamp-v67-repair.py'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: pr2231-labelled-interval-clamp-v67
  cancel-in-progress: false
jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-labelled-interval-clamp-controller-v67
      REPAIR_PATH: .github/tmp/pr2231-labelled-interval-clamp-v67-repair.py
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      CTREE: f7fc52609c1c6b42921c7a4db6e20c4e54c1f99e
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: cd2cd6994c065991c317e7daa8ff082b49de4a27
      PTREE: 185f9503d418b6f47012cb77acfec9d5afacaccf
      PLIB: cc281e18f2262b379a2497c5a6e61e72b3e234b6
      PTEST: 81335bca1b5791ba68962d3e29fd1610399676ca
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify and publish labelled interval clamp repair
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-v67-source
          Q=/tmp/pr2231-v67-main
          R=/tmp/pr2231-v67-receipt.txt
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" 'value mismatch'
          }
          leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }

          stage controller-envelope
          eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          eq controller-branch '${{ github.head_ref }}' "$CBRANCH"
          eq controller-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" $'.github/tmp/pr2231-labelled-interval-clamp-v67-repair.py\n.github/workflows/temporary-pr2231-labelled-interval-clamp-controller-v67.yml'
          python3 -m py_compile "$REPAIR_PATH"

          stage frozen-inputs
          leases
          eq controller-remote "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          eq product-paths "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage exact-product-witnesses
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';
          const positive = [
            'Mobile number: 2125551234 2026-08-17 555-1212 90 people 666-1212',
            'Mobile number: [contact omitted] 2026-08-17 [contact omitted] 90 people [contact omitted]'
          ];
          const defect = [
            'Phone: 09012345678 12:30:45 555-1212',
            'Phone: [contact omitted] 12:30:45 [contact omitted]'
          ];
          const positiveActual = redact(positive[0]);
          const defectActual = redact(defect[0]);
          console.log(JSON.stringify({ kind: 'positive', actual: positiveActual, required: positive[1] }));
          console.log(JSON.stringify({ kind: 'defect', actual: defectActual, required: defect[1] }));
          assert.equal(positiveActual, positive[1], 'current product must retain recursive label custody');
          assert.notEqual(defectActual, defect[1], 'current product must retain the interval-start defect');
          NODE

          stage apply-and-qualify
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          eq repair-paths "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"

          stage exact-main-release
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          eq qualified-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage construct-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: clamp labelled phone intervals after observations'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          eq qualified-parent "$(git rev-parse HEAD^)" "$CPARENT"
          eq qualified-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          eq qualified-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"

          stage revalidate-and-publish
          cd "$GITHUB_WORKSPACE"
          leases
          eq final-main "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          eq final-product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          eq final-main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          eq final-main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          eq final-product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          eq final-product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$AHEAD"
          eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ALIB"
          eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ATEST"
          printf 'QUALIFICATION_SUCCESS\nbase=%s\nold_product=%s\nnew_product=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$CPARENT" "$PHEAD" "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-labelled-interval-clamp-v67
          path: /tmp/pr2231-v67-receipt.txt
          if-no-files-found: error
          retention-days: 90
