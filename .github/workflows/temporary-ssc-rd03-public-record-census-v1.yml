name: TEMP capture fixed RD-03 public-record census

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd03-public-record-census-v1.yml'
      - '.rd03-public-record-census/**'

permissions:
  contents: read

concurrency:
  group: temp-ssc-rd03-public-record-census-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd03-public-record-census-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate fixed plan, denominator, and exact research lease
        run: |
          set -Eeuo pipefail
          python .rd03-public-record-census/preflight.py

      - name: Execute all fixed routes with bounded retry custody
        env:
          CENSUS_ROOT: /tmp/rd03-public-record-census
        run: |
          set -Eeuo pipefail
          rm -rf "$CENSUS_ROOT"
          mkdir -p "$CENSUS_ROOT"
          cp .rd03-public-record-census/plan.json "$CENSUS_ROOT/plan.json"
          python .rd03-public-record-census/capture.py

      - name: Derive acquisition-only term and candidate indexes
        env:
          CENSUS_ROOT: /tmp/rd03-public-record-census
        run: |
          set -Eeuo pipefail
          python .rd03-public-record-census/derive.py

      - name: Validate exact bounded census and clean repository state
        env:
          CENSUS_ROOT: /tmp/rd03-public-record-census
        run: |
          set -Eeuo pipefail
          python .rd03-public-record-census/validate.py
          node tools/validate-no-magic-human-gate.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve fixed RD-03 public-record census
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-wave02-public-record-census-v1
          path: /tmp/rd03-public-record-census
          if-no-files-found: error
          retention-days: 90
