name: TEMP export exact RD-01 Wave-03 promotion source

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-promotion-source-export.yml'
      - '.ssc-rd01-wave03-promotion-source-export/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical closure and export exact promotion sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO="$GITHUB_REPOSITORY"
          OUT='/tmp/ssc-rd01-wave03-promotion-source'
          rm -rf "$OUT"
          mkdir -p "$OUT/files"
          PR=$(gh api "repos/$REPO/pulls/1022")
          test "$(jq -r .merged <<<"$PR")" = 'true'
          MERGE_SHA=$(jq -r .merge_commit_sha <<<"$PR")
          TAG_SHA=$(gh api "repos/$REPO/git/ref/tags/ssc-rd01-wave03-postmerge-proved" --jq .object.sha)
          test "$TAG_SHA" = "$MERGE_SHA"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          git fetch --no-tags origin "$MAIN_SHA" "$MERGE_SHA" 'fb7e84dfd54f741e96748dc0c626aa390bac25f7' '72abc35c408d172d9be33b619b630a96ac317193'
          git merge-base --is-ancestor "$MERGE_SHA" "$MAIN_SHA"
          git diff --name-only '72abc35c408d172d9be33b619b630a96ac317193..fb7e84dfd54f741e96748dc0c626aa390bac25f7' | sort -u > "$OUT/wave02-sixth-promotion-paths.txt"
          test "$(wc -l < "$OUT/wave02-sixth-promotion-paths.txt" | tr -d ' ')" -eq 12
          while IFS= read -r path; do
            test -f "$path"
            mkdir -p "$OUT/files/$(dirname "$path")"
            cp "$path" "$OUT/files/$path"
          done < "$OUT/wave02-sixth-promotion-paths.txt"
          find data schemas tools test docs .github/workflows -type f \( -iname '*rd-wave03-rd01*terminal*' -o -iname '*rd01*wave03*terminal*' -o -iname '*residual-denominator-wave-03*' -o -iname '*residual-wave03*' -o -iname '*wave-02-reconciliation*' \) | sort -u > "$OUT/context-paths.txt"
          while IFS= read -r path; do
            test -f "$path" || continue
            mkdir -p "$OUT/files/$(dirname "$path")"
            cp "$path" "$OUT/files/$path"
          done < "$OUT/context-paths.txt"
          grep -RIl --exclude-dir=node_modules --exclude-dir=.git -E 'RD-01-C06|closed_residual_classes|open_residual_classes|promoted.*class|promotion' data schemas tools test docs .github/workflows | sort -u > "$OUT/semantic-candidates.txt"
          while IFS= read -r path; do
            test -f "$path" || continue
            mkdir -p "$OUT/files/$(dirname "$path")"
            cp "$path" "$OUT/files/$path"
          done < "$OUT/semantic-candidates.txt"
          find "$OUT/files" -type f -printf '%P\n' | sort -u > "$OUT/export-paths.txt"
          (cd "$OUT/files" && sha256sum $(cat "$OUT/export-paths.txt")) > "$OUT/export-file-sha256.txt"
          tar -C "$OUT" -czf /tmp/ssc-rd01-wave03-promotion-source.tar.gz files wave02-sixth-promotion-paths.txt context-paths.txt semantic-candidates.txt export-paths.txt export-file-sha256.txt
          sha256sum /tmp/ssc-rd01-wave03-promotion-source.tar.gz > "$OUT/archive-sha256.txt"
          printf 'main_sha=%s\nrd01_merge_sha=%s\npostmerge_marker=%s\n' "$MAIN_SHA" "$MERGE_SHA" "$TAG_SHA" > "$OUT/lineage.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-promotion-source
          path: |
            /tmp/ssc-rd01-wave03-promotion-source.tar.gz
            /tmp/ssc-rd01-wave03-promotion-source/**
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable exact source export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REF='archive/ssc-rd01-wave03-promotion-source-v1'
          START=$(git ls-remote origin "refs/heads/$REF" | awk '{print $1}')
          if [[ -z "$START" ]]; then
            START=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$REF" -f sha="$START" >/dev/null
          fi
          git fetch --no-tags origin "$REF"
          rm -rf /tmp/rd01-promotion-source-branch
          git worktree add --detach /tmp/rd01-promotion-source-branch "origin/$REF"
          cd /tmp/rd01-promotion-source-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf reports/transport/ssc-rd01-wave03-promotion-source-v1
          mkdir -p reports/transport/ssc-rd01-wave03-promotion-source-v1
          cp -a /tmp/ssc-rd01-wave03-promotion-source/. reports/transport/ssc-rd01-wave03-promotion-source-v1/
          cp /tmp/ssc-rd01-wave03-promotion-source.tar.gz reports/transport/ssc-rd01-wave03-promotion-source-v1/
          git add reports/transport/ssc-rd01-wave03-promotion-source-v1
          git commit -m 'Update exact RD-01 Wave-03 promotion source export'
          git push origin "HEAD:refs/heads/$REF" --force-with-lease="refs/heads/$REF:$START"
