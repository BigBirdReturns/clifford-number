name: Temporary PC-35 exact product materializer

on:
  pull_request:
    paths:
      - '.pc35/payload.part-*'
      - '.github/workflows/pc35-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc35-exact-product-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-population-frame-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and extract the exact twelve-file PC-35 product
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import subprocess
          import tarfile

          expected_xz_sha256 = '26181de23aaa7c0cc144414a09ab0560db532e0b336e59418bb2e8db7adcb313'
          expected_base64_sha256 = 'b705a26883d1252673c147fd04c354035c10605d862cc7b28744fa63ef7b489a'
          expected = {
              'data/research/preference-custody/population-frame-assurance.fixture.json': 'baf6bd769962912ea9b7d1b6be23b69bbf5b0e96eab9804a79f074a1ff0b1904',
              'tools/lib/preference-population-frame-assurance.mjs': 'ce7b5de363d70c7caaa79b8effdd3f56f359c36ffbce88e86bf37af63cb0254d',
              'tools/compile-preference-population-frame-assurance.mjs': '0ae74f0375363803d6a0286b91d7c31a4eb1e235e36a7a1b0209fb727bd63e45',
              'tools/validate-preference-population-frame-assurance.mjs': 'bcf8a016880a68c0fd028d3436cd2605e822d409583d50ad087f086f960a5838',
              'test/preference-population-frame-assurance.test.js': '43023b0e54cd9c397046c133cf373326ebeac5a3a2783155c835566c078a12cc',
              'docs/preference-custody-population-frame-assurance.md': '9614ed3333e6d4d92cb9800ea476ce1f47b8aaad9d7090c0d38f1217f530a47d',
              'data/research/preference-custody/control-manifest-v33.json': '4f9ea4f624936c7e5cc9b57e5c48844c7382f4c50a5936b2b93fa6a753b748be',
              'tools/lib/preference-custody-manifest-v33.mjs': '7a3636a2eddd0b9ea17ec18b57dd56975badec2828e03a4e6f99080e5864b6e9',
              'tools/compile-preference-custody-manifest-v33.mjs': 'ae22f7cc65a1647ed99a04d2d3dcd9906aeff632a4afb6ef002b5b1a8e4b5255',
              'tools/validate-preference-custody-manifest-v33.mjs': '3b06658969af9619e81c1584ff3e32471caf6d34d50db5e5963af8139abc6d55',
              'test/preference-custody-manifest-v33.test.js': 'd74fc3f1f33c1770ee5215ac2b43db2f656dab902467be2ffd3b8a65452ef75c',
              'docs/preference-custody-laboratory-floor-v33.md': '32c012f56ecb36d216c19d45553f5b193ee3c2e7b1a6bce5b68800c3a8233162',
          }

          parts = sorted(Path('.pc35').glob('payload.part-*'))
          required_parts = [f'payload.part-{index:02d}' for index in range(6)]
          if [path.name for path in parts] != required_parts:
              raise SystemExit(f'expected six ordered payload shards, found {[path.name for path in parts]}')
          encoded = ''.join(''.join(path.read_text().split()) for path in parts)
          actual_base64_sha256 = hashlib.sha256(encoded.encode()).hexdigest()
          if actual_base64_sha256 != expected_base64_sha256:
              raise SystemExit(f'payload base64 SHA-256 mismatch: {actual_base64_sha256}')
          try:
              xz_bytes = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'invalid payload base64: {error}')
          actual_xz_sha256 = hashlib.sha256(xz_bytes).hexdigest()
          if actual_xz_sha256 != expected_xz_sha256:
              raise SystemExit(f'payload xz SHA-256 mismatch: {actual_xz_sha256}')

          with tarfile.open(fileobj=io.BytesIO(xz_bytes), mode='r:xz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f'archive path/order mismatch: {names}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member must be a regular file: {member.name}')
                  if Path(member.name).is_absolute() or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())

          observed = {}
          for name, required_sha256 in expected.items():
              raw = Path(name).read_bytes()
              actual_sha256 = hashlib.sha256(raw).hexdigest()
              if actual_sha256 != required_sha256:
                  raise SystemExit(f'file SHA-256 mismatch for {name}: {actual_sha256}')
              observed[name] = {'bytes': len(raw), 'sha256': actual_sha256}

          receipt = {
              'schema_version': 'pc35-materialization-receipt@1',
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'payload_base64_sha256': actual_base64_sha256,
              'payload_xz_sha256': actual_xz_sha256,
              'permanent_nonworkflow_file_count': len(expected),
              'files': observed,
              'outside_human_dependency': False,
          }
          Path('/tmp/pc35-materialization-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY2
      - name: Qualify standalone PC-35 and compositional floor v33
        run: |
          node tools/compile-preference-population-frame-assurance.mjs
          node tools/validate-preference-population-frame-assurance.mjs
          node test/preference-population-frame-assurance.test.js
          node tools/compile-preference-custody-manifest-v33.mjs
          node tools/validate-preference-custody-manifest-v33.mjs
          node test/preference-custody-manifest-v33.test.js
      - name: Regress historical Preference Custody floors and no-magic-human gate
        run: |
          set -euo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
      - name: Commit only the exact product and retire all six payload shards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/research/preference-custody/population-frame-assurance.fixture.json \
            tools/lib/preference-population-frame-assurance.mjs \
            tools/compile-preference-population-frame-assurance.mjs \
            tools/validate-preference-population-frame-assurance.mjs \
            test/preference-population-frame-assurance.test.js \
            docs/preference-custody-population-frame-assurance.md \
            data/research/preference-custody/control-manifest-v33.json \
            tools/lib/preference-custody-manifest-v33.mjs \
            tools/compile-preference-custody-manifest-v33.mjs \
            tools/validate-preference-custody-manifest-v33.mjs \
            test/preference-custody-manifest-v33.test.js \
            docs/preference-custody-laboratory-floor-v33.md
          git rm -- \
            .pc35/payload.part-00 \
            .pc35/payload.part-01 \
            .pc35/payload.part-02 \
            .pc35/payload.part-03 \
            .pc35/payload.part-04 \
            .pc35/payload.part-05
          python - <<'PY2'
          import subprocess
          expected = ['.pc35/payload.part-00', '.pc35/payload.part-01', '.pc35/payload.part-02', '.pc35/payload.part-03', '.pc35/payload.part-04', '.pc35/payload.part-05', 'data/research/preference-custody/population-frame-assurance.fixture.json', 'tools/lib/preference-population-frame-assurance.mjs', 'tools/compile-preference-population-frame-assurance.mjs', 'tools/validate-preference-population-frame-assurance.mjs', 'test/preference-population-frame-assurance.test.js', 'docs/preference-custody-population-frame-assurance.md', 'data/research/preference-custody/control-manifest-v33.json', 'tools/lib/preference-custody-manifest-v33.mjs', 'tools/compile-preference-custody-manifest-v33.mjs', 'tools/validate-preference-custody-manifest-v33.mjs', 'test/preference-custody-manifest-v33.test.js', 'docs/preference-custody-laboratory-floor-v33.md']
          observed = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if observed != sorted(expected):
              raise SystemExit(f'staged path mismatch:\nexpected={sorted(expected)}\nobserved={observed}')
          print(f'exact staged path set verified: {len(observed)} paths')
          PY2
          git commit -m 'Materialize PC-35 and Preference Custody floor v33'
          git push origin HEAD:research/preference-population-frame-assurance-v1
      - name: Preserve the exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc35-exact-materialization-receipt
          path: /tmp/pc35-materialization-receipt.json
          if-no-files-found: error
