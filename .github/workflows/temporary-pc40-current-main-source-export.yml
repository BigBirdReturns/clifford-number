name: TEMP export exact PC-40 review head source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc40-current-main-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af682044dd73e83d51c2161cf04eee071e649ec0
          fetch-depth: 1
      - name: Export exact PC-40 review head
        run: |
          set -Eeuo pipefail
          expected=af682044dd73e83d51c2161cf04eee071e649ec0
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$expected"
          out=/tmp/pc40-review-head-source
          mkdir -p "$out"
          printf '%s\n' "$observed" > "$out/source-head.sha"
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './dist/*' \
            -printf '%P\n' | LC_ALL=C sort > "$out/source-paths.txt"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            -czf "$out/source.tar.gz" .
          stat -c '%s' "$out/source.tar.gz" > "$out/source.bytes"
          sha256sum "$out/source.tar.gz" > "$out/source.sha256"
          test "$(wc -l < "$out/source-paths.txt" | tr -d ' ')" -gt 4000
      - uses: actions/upload-artifact@v4
        with:
          name: pc40-review-head-source
          path: /tmp/pc40-review-head-source
          if-no-files-found: error
          retention-days: 7
