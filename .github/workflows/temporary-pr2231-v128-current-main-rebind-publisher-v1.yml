name: Temporary PR 2231 V128 publication receipt recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v128-current-main-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  confirm-v128-publication:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v128-current-main-rebind-publisher-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm the exact prior leased publication and requalify its bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C

          repo=BigBirdReturns/clifford-number
          product_pr=2231
          product_branch=agent/current-main-identifier-context-product-v1
          qualifier_branch=agent/pr2231-v128-current-main-rebind-qualification-v1
          controller_branch=agent/pr2231-v128-current-main-rebind-publisher-v1

          main=5b992ba8b7573cc9a859ac0dcb0d5edd20ea81ed
          main_tree=6ca3a5dd146ac9e8a0860de4e25ee5242a5152ff
          old_product=73e4501c6da942ba326ecf146df1a71bbf953b25
          product=7d5d43d4215eb621f361a1e4c834e994fe98c136
          product_tree=8252807a4b840ba20d69cd478c8fdb53a851a826
          library=cdf13a780f97f42c64bdac2e745da52be44850a1
          focused_test=711003e4ce56e99cf51ceb0d8fd03df1e4473c31

          qualifier_controller=391578a83776ee1031d33ede5b8815ddcccabb74
          qualifier_run=33667441792
          qualifier_job=100372553230
          qualifier_artifact=9861189921
          qualifier_digest=sha256:59b44b5e2a7b27ae8b1d46f15ea3a97626b570d1adfb15636c349187da7b9a39
          qualifier_size=39736

          publication_controller=af4a2b1d60ee23571b0046df0031ae290e38fc53
          publication_run=33668116209
          publication_job=100374746574
          publication_artifact=9861418910
          publication_digest=sha256:50988abfc8dfd54e76df8252824b2628e27163f0c7d91e137fd715bd2f91686c
          publication_size=17363

          threads=(
            PRRT_kwDOTGqftc6eVVFm
            PRRT_kwDOTGqftc6eYaRa
            PRRT_kwDOTGqftc6eYaRe
            PRRT_kwDOTGqftc6eZWl3
            PRRT_kwDOTGqftc6eZhAV
          )

          root=/tmp/pr2231-v128-publication-receipt-recovery-v1
          qualifier_receipt="$root/qualifier"
          publication_receipt="$root/publication"
          work="$root/work"
          artifact="$root/artifact"
          rm -rf "$root"
          mkdir -p "$qualifier_receipt" "$publication_receipt" "$artifact"
          exec > >(tee "$artifact/recovery.log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=post-publication-receipt-recovery\n' "$rc" > "$artifact/outer-status.env"
            find "$artifact" -type f -printf '%f\t%s\n' | sort > "$artifact/file-manifest.txt"
            find "$artifact" -type f ! -name sha256-manifest.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$artifact/sha256-manifest.txt"
            exit "$rc"
          }
          trap preserve EXIT

          stable_product() {
            gh api "repos/$repo/pulls/$product_pr" \
              | jq -S '{number,state,draft,merged,head:.head.sha,base:.base.sha,commits,changed_files,title}'
          }

          assert_thread_unresolved() {
            local id=$1
            local resolved
            resolved=$(gh api graphql -F id="$id" \
              -f query='query($id:ID!){node(id:$id){... on PullRequestReviewThread{isResolved}}}' \
              --jq '.data.node.isResolved')
            test "$resolved" = false
          }

          verify_artifact() {
            local id=$1 run=$2 name=$3 size=$4 digest=$5 target=$6 archive="$root/$1.zip"
            metadata=$(gh api "repos/$repo/actions/artifacts/$id")
            test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$run"
            test "$(jq -r '.name' <<<"$metadata")" = "$name"
            test "$(jq -r '.size_in_bytes' <<<"$metadata")" = "$size"
            test "$(jq -r '.digest' <<<"$metadata")" = "$digest"
            test "$(jq -r '.expired' <<<"$metadata")" = false
            gh api "repos/$repo/actions/artifacts/$id/zip" > "$archive"
            test "$(sha256sum "$archive" | awk '{print "sha256:"$1}')" = "$digest"
            unzip -q "$archive" -d "$target"
          }

          test "$CONTROLLER_BRANCH" = "$controller_branch"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          test "$(git rev-parse "$main^{tree}")" = "$main_tree"
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" = "$main"
          test "$(gh api "repos/$repo/git/ref/heads/$product_branch" --jq '.object.sha')" = "$product"
          test "$(gh api "repos/$repo/git/ref/heads/$qualifier_branch" --jq '.object.sha')" = "$qualifier_controller"

          run_json=$(gh api "repos/$repo/actions/runs/$qualifier_run")
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$qualifier_controller"
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          job_json=$(gh api "repos/$repo/actions/jobs/$qualifier_job")
          test "$(jq -r '.run_id' <<<"$job_json")" = "$qualifier_run"
          test "$(jq -r '.conclusion' <<<"$job_json")" = success
          verify_artifact "$qualifier_artifact" "$qualifier_run" \
            pr2231-v128-current-main-rebind-qualification-v1 "$qualifier_size" \
            "$qualifier_digest" "$qualifier_receipt"
          test "$(awk -F= '$1=="candidate_commit"{print $2}' "$qualifier_receipt/candidate-identity.env")" = "$product"
          test "$(awk -F= '$1=="candidate_tree"{print $2}' "$qualifier_receipt/candidate-identity.env")" = "$product_tree"
          grep -Fxq QUALIFICATION_SUCCESS "$qualifier_receipt/qualification-terminal.txt"

          prior_run=$(gh api "repos/$repo/actions/runs/$publication_run")
          test "$(jq -r '.head_sha' <<<"$prior_run")" = "$publication_controller"
          test "$(jq -r '.status' <<<"$prior_run")" = completed
          test "$(jq -r '.conclusion' <<<"$prior_run")" = failure
          prior_job=$(gh api "repos/$repo/actions/jobs/$publication_job")
          test "$(jq -r '.run_id' <<<"$prior_job")" = "$publication_run"
          test "$(jq -r '.conclusion' <<<"$prior_job")" = failure
          verify_artifact "$publication_artifact" "$publication_run" \
            pr2231-v128-qualified-current-main-publisher-v1 "$publication_size" \
            "$publication_digest" "$publication_receipt"
          test "$(awk -F= '$1=="outer_status"{print $2}' "$publication_receipt/outer-status.env")" = 1
          grep -Fq "${old_product:0:8}...${product:0:8}" "$publication_receipt/publisher.log"
          grep -Fq "$product -> $product_branch (forced update)" "$publication_receipt/publisher.log"

          stable_product > "$artifact/product-before.json"
          product_json=$(gh api "repos/$repo/pulls/$product_pr")
          test "$(jq -r '.head.sha' <<<"$product_json")" = "$product"
          test "$(jq -r '.state' <<<"$product_json")" = open
          test "$(jq -r '.draft' <<<"$product_json")" = true
          test "$(jq -r '.merged' <<<"$product_json")" = false
          test "$(jq -r '.commits' <<<"$product_json")" = 1
          test "$(jq -r '.changed_files' <<<"$product_json")" = 2
          for id in "${threads[@]}"; do
            assert_thread_unresolved "$id"
          done

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/v128-recovery-main" \
            "refs/heads/$product_branch:refs/remotes/origin/v128-recovery-product"
          test "$(git rev-parse refs/remotes/origin/v128-recovery-main)" = "$main"
          test "$(git rev-parse refs/remotes/origin/v128-recovery-product)" = "$product"
          test "$(git rev-parse "$product^")" = "$main"
          test "$(git rev-parse "$product^{tree}")" = "$product_tree"
          test "$(git rev-parse "$product:tools/lib/industrial-exhaust.mjs")" = "$library"
          test "$(git rev-parse "$product:test/industrial-exhaust.test.js")" = "$focused_test"
          test "$(git show -s --format=%B "$product")" = $'chore: rebind V127 product to current main\n\nRetain the qualified V127 classifier and focused-test blobs over current main without semantic changes.'
          mapfile -t paths < <(git diff-tree --no-commit-id --name-only -r "$product" | sort)
          test "${#paths[@]}" = 2
          test "${paths[0]}" = test/industrial-exhaust.test.js
          test "${paths[1]}" = tools/lib/industrial-exhaust.mjs

          git worktree add --detach "$work" "$product"
          node --check "$work/tools/lib/industrial-exhaust.mjs"
          (cd "$work" && node --test test/industrial-exhaust*.test.js) | tee "$artifact/focused.log"
          (cd "$work" && npm run release:check) | tee "$artifact/release.log"

          test "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" = "$main"
          test "$(gh api "repos/$repo/git/ref/heads/$product_branch" --jq '.object.sha')" = "$product"
          test "$(gh api "repos/$repo/git/ref/heads/$qualifier_branch" --jq '.object.sha')" = "$qualifier_controller"
          test "$(gh api "repos/$repo/git/ref/heads/$controller_branch" --jq '.object.sha')" = "$EXPECTED_CONTROLLER"
          stable_product > "$artifact/product-after.json"
          cmp "$artifact/product-before.json" "$artifact/product-after.json"
          for id in "${threads[@]}"; do
            assert_thread_unresolved "$id"
          done

          printf 'qualifier_controller=%s\nqualifier_run=%s\nqualifier_job=%s\nqualifier_artifact=%s\nqualifier_digest=%s\npublication_controller=%s\npublication_run=%s\npublication_job=%s\npublication_artifact=%s\npublication_digest=%s\nold_product=%s\nproduct=%s\nparent=%s\ntree=%s\nlibrary_blob=%s\ntest_blob=%s\n' \
            "$qualifier_controller" "$qualifier_run" "$qualifier_job" "$qualifier_artifact" "$qualifier_digest" \
            "$publication_controller" "$publication_run" "$publication_job" "$publication_artifact" "$publication_digest" \
            "$old_product" "$product" "$main" "$product_tree" "$library" "$focused_test" \
            | tee "$artifact/recovery-identity.env"

          printf '%s\n' \
            PRIOR_LEASED_PRODUCT_PUBLICATION_CONFIRMED \
            PRODUCT_ALREADY_EXACT \
            PRODUCT_MUTATION_SKIPPED \
            REVIEW_MUTATION_SKIPPED \
            DRAFT_MUTATION_SKIPPED \
            MERGE_SKIPPED \
            QUALIFICATION_SUCCESS \
            | tee "$artifact/recovery-terminal.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v128-publication-receipt-recovery-v1
          path: /tmp/pr2231-v128-publication-receipt-recovery-v1/artifact
          if-no-files-found: error
          retention-days: 90
