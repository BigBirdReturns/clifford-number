name: Status-for-sovereignty SSC-F04 ACES governance denominator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-f04-aces.yml'
      - 'data/research/status-sovereignty-f04-aces-governance-first-pass.json'
      - 'data/project/status-sovereignty-f04-aces-governance-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-governance-denominator-first-pass.schema.json'
      - 'docs/milestones/ssc-f04-aces-governance-first-pass.md'
      - 'tools/build-status-sovereignty-f04-aces-governance.mjs'
      - 'tools/validate-status-sovereignty-f04-aces-governance.mjs'
      - 'test/status-sovereignty-f04-aces-governance.test.js'
      - 'build/core-thesis/status-sovereignty/f04-aces/**'
      - 'reports/core-thesis/status-sovereignty/f04-aces/**'
  push:
    branches:
      - main
      - 'agent/ssc-f04-governance-denominator'
    paths:
      - '.github/workflows/status-sovereignty-f04-aces.yml'
      - 'data/research/status-sovereignty-f04-aces-governance-first-pass.json'
      - 'data/project/status-sovereignty-f04-aces-governance-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-governance-denominator-first-pass.schema.json'
      - 'docs/milestones/ssc-f04-aces-governance-first-pass.md'
      - 'tools/build-status-sovereignty-f04-aces-governance.mjs'
      - 'tools/validate-status-sovereignty-f04-aces-governance.mjs'
      - 'test/status-sovereignty-f04-aces-governance.test.js'
      - 'build/core-thesis/status-sovereignty/f04-aces/**'
      - 'reports/core-thesis/status-sovereignty/f04-aces/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the bounded ACES first pass
        run: |
          node tools/build-status-sovereignty-f04-aces-governance.mjs
          node tools/validate-status-sovereignty-f04-aces-governance.mjs
          node test/status-sovereignty-f04-aces-governance.test.js
      - name: Require exact committed ACES products
        run: |
          git diff --exit-code -- \
            data/project/status-sovereignty-f04-aces-governance-first-pass-release-manifest.json \
            build/core-thesis/status-sovereignty/f04-aces/manifest.json \
            build/core-thesis/status-sovereignty/f04-aces/data.json \
            reports/core-thesis/status-sovereignty/f04-aces/data.json \
            reports/core-thesis/status-sovereignty/f04-aces/index.html
      - name: Prove publication exclusion
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/data/research/status-sovereignty-f04-aces-governance-first-pass.json
          test ! -e dist/build/core-thesis/status-sovereignty/f04-aces
          test ! -e dist/reports/core-thesis/status-sovereignty/f04-aces
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic reconstruction
        run: |
          git restore --staged --worktree .
          node tools/build-status-sovereignty-f04-aces-governance.mjs
          node tools/validate-status-sovereignty-f04-aces-governance.mjs
          node test/status-sovereignty-f04-aces-governance.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
