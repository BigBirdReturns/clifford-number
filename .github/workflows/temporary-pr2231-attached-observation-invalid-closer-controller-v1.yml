name: Temporary PR 2231 attached observation invalid closer controller v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-attached-observation-invalid-closer-v1-repair.py'
      - '.github/workflows/temporary-pr2231-attached-observation-invalid-closer-controller-v1.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-attached-observation-invalid-closer-v1
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-attached-observation-invalid-closer-controller-v1
      REPAIR_PATH: .github/tmp/pr2231-attached-observation-invalid-closer-v1-repair.py
      REPAIR_BLOB: 8e9da6b7a0e2857f95cb07553d408dcf5d20347d
      CPARENT: 564da53a373bfee43b026d7ed0ba0022bcc38633
      CTREE: 2e0ba796bf4648e899e8c425ce00fa9bbdb2c7cc
      CBASEPARENT: 01428cde971ffe0d995a60c80c153eded9b7e6b1
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 08bbe6c2a06007aa9b51784d537afb2145c4becc
      PTREE: 49c99d3e5f84998bdc820378c2e2645e49d48b76
      PLIB: a998d31ef669c84c4ae3907c07ffe3a67ba55592
      PTEST: e4b24deda3de14140466f499418f1bd60baadad5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Qualify and publish attached-observation invalid-closer repair
        shell: bash
        run: |
          set -euo pipefail

          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-attached-observation-source
          Q=/tmp/pr2231-attached-observation-main
          A=/tmp/pr2231-attached-observation-artifact
          R="$A/receipt.txt"
          mkdir -p "$A"
          : >"$R"

          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }
          retain_workspace() {
            if [ -d "$S" ]; then
              git -C "$S" diff --binary -- \
                tools/lib/industrial-exhaust.mjs \
                test/industrial-exhaust.test.js \
                > "$A/candidate.patch" 2>/dev/null || true
              cp "$S/tools/lib/industrial-exhaust.mjs" \
                "$A/industrial-exhaust.mjs" 2>/dev/null || true
              cp "$S/test/industrial-exhaust.test.js" \
                "$A/industrial-exhaust.test.js" 2>/dev/null || true
            fi
          }
          trap retain_workspace EXIT

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq controller-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'.github/tmp/pr2231-attached-observation-invalid-closer-v1-repair.py\n.github/workflows/temporary-pr2231-attached-observation-invalid-closer-controller-v1.yml'
          require_eq repair-blob \
            "$(git rev-parse "HEAD:$REPAIR_PATH")" "$REPAIR_BLOB"
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq main-parent "$(git rev-parse "$CPARENT^")" "$CBASEPARENT"
          require_eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-main-merge-base "$(git merge-base "$PHEAD" "$CPARENT")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths \
            "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage exact-product-reproduction
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const input =
            'Phone: 09012345678 2026-08-17)3.14 03-6216-8041';
          const expected =
            'Phone: [contact omitted] 2026-08-17)3.14 [contact omitted]';
          const actual = redact(input);
          console.log(JSON.stringify({
            kind: 'exact-predecessor-reproduction',
            input,
            actual,
            expected
          }));
          assert.notEqual(
            actual,
            expected,
            'exact head must reproduce the attached-observation P1 before mutation'
          );
          assert.ok(
            !actual.includes('3.14'),
            'the predecessor must lose custody of the attached decimal'
          );
          assert.ok(
            actual.includes('2026-08-17)3.'),
            'the predecessor must restart inside the attached decimal'
          );

          const retainedControls = [
            [
              'one-use lease remains nonrenewable',
              'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212',
              'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212'
            ],
            [
              'initial wrapped local interval remains retained',
              'Phone: (555-1212) 03-6216-8041',
              'Phone: [contact omitted] [contact omitted]'
            ],
            [
              'external square wrapper retains strong observation custody',
              'Phone: [03-62165111 people] 12:30:45 555-1212',
              'Phone: [03-62165111 people] 12:30:45 555-1212'
            ],
            [
              'unwrapped strong observations retain complete custody',
              'Phone: 2026-08-17 2027-09-18',
              'Phone: 2026-08-17 2027-09-18'
            ],
            [
              'dotted intrinsic phone outranks decimal-prefix observation',
              'Phone: 03.6216.8041',
              'Phone: [contact omitted]'
            ]
          ];
          for (const [name, source, wanted] of retainedControls) {
            const rendered = redact(source);
            console.log(JSON.stringify({
              kind: 'retained-current-control',
              name,
              source,
              rendered,
              wanted
            }));
            assert.equal(rendered, wanted, name);
          }
          NODE

          stage apply-repair-and-direct-controls
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          require_eq repair-paths \
            "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          RLIB="$(git hash-object tools/lib/industrial-exhaust.mjs)"
          RTEST="$(git hash-object test/industrial-exhaust.test.js)"
          printf 'repaired-library-blob=%s\nrepaired-test-blob=%s\n' \
            "$RLIB" "$RTEST" | tee -a "$R"
          [ "$RLIB" != "$PLIB" ] || fail repaired-library-blob 'library did not change'
          [ "$RTEST" != "$PTEST" ] || fail repaired-test-blob 'test did not change'

          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const repairedCases = [
            [
              'ASCII decimal attached after invalid closer',
              'Phone: 09012345678 2026-08-17)3.14 03-6216-8041',
              'Phone: [contact omitted] 2026-08-17)3.14 [contact omitted]'
            ],
            [
              'ASCII date attached after mismatched closer',
              'Phone: 09012345678 2026-08-17]2027-09-18 03-6216-8041',
              'Phone: [contact omitted] 2026-08-17]2027-09-18 [contact omitted]'
            ],
            [
              'fullwidth decimal attached after invalid closer',
              '電話：０９０１２３４５６７８ ２０２６－０８－１７）３．１４ ０３－６２１６－８０４１',
              '電話：[contact omitted] ２０２６－０８－１７）３．１４ [contact omitted]'
            ],
            [
              'unlabelled attached observation cannot mint weak-phone authority',
              'Archive 09012345678 2026-08-17)3.14 555-1212',
              'Archive [contact omitted] 2026-08-17)3.14 555-1212'
            ],
            [
              'attached intrinsic phone after invalid closer remains admitted',
              'Phone: 09012345678 2026-08-17)03-6216-8041',
              'Phone: [contact omitted] 2026-08-17)[contact omitted]'
            ],
            [
              'attached bare tail after invalid closer remains refused',
              'Archive 09012345678 2026-08-17)12345678',
              'Archive [contact omitted] 2026-08-17)12345678'
            ],
            [
              'one-use lease remains nonrenewable',
              'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212',
              'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212'
            ],
            [
              'initial wrapped local interval remains retained',
              'Phone: (555-1212) 03-6216-8041',
              'Phone: [contact omitted] [contact omitted]'
            ],
            [
              'external square wrapper retains strong observation custody',
              'Phone: [03-62165111 people] 12:30:45 555-1212',
              'Phone: [03-62165111 people] 12:30:45 555-1212'
            ],
            [
              'unwrapped strong observations retain complete custody',
              'Phone: 2026-08-17 2027-09-18',
              'Phone: 2026-08-17 2027-09-18'
            ],
            [
              'dotted intrinsic phone outranks decimal-prefix observation',
              'Phone: 03.6216.8041',
              'Phone: [contact omitted]'
            ]
          ];
          for (const [name, source, wanted] of repairedCases) {
            const rendered = redact(source);
            console.log(JSON.stringify({
              kind: 'repaired-transition',
              name,
              source,
              rendered,
              wanted
            }));
            assert.equal(rendered, wanted, name);
          }
          NODE

          stage repaired-industrial-exhaust-suites
          mapfile -t suites < <(
            find test -maxdepth 1 -type f \
              -name 'industrial-exhaust*.test.js' -print | LC_ALL=C sort
          )
          test "${#suites[@]}" -ge 3
          printf '%s\n' "${suites[@]}" | tee "$A/suites.txt"
          for suite in "${suites[@]}"; do
            printf 'RUNNING %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done

          stage exact-main-transplant-and-release
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq transplant-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          for suite in "${suites[@]}"; do
            printf 'TRANSPLANT %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done
          npm run release:check 2>&1 | tee -a "$R"

          cp tools/lib/industrial-exhaust.mjs "$A/repaired-industrial-exhaust.mjs"
          cp test/industrial-exhaust.test.js "$A/repaired-industrial-exhaust.test.js"
          git restore --worktree --staged -- .
          git clean -fd >/dev/null 2>&1 || true
          cp "$A/repaired-industrial-exhaust.mjs" tools/lib/industrial-exhaust.mjs
          cp "$A/repaired-industrial-exhaust.test.js" test/industrial-exhaust.test.js
          require_eq restored-product-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq restored-library-blob \
            "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq restored-test-blob \
            "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"

          stage construct-clean-product
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git -c user.name='BigBirdReturns' \
              -c user.email='bigbirdreturns@proton.me' \
              commit -m 'fix: preserve attached observations after invalid closers'
          NEW="$(git rev-parse HEAD)"
          NTREE="$(git rev-parse HEAD^{tree})"
          NLIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          NTEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq new-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq new-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq new-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq new-library-blob "$NLIB" "$RLIB"
          require_eq new-test-blob "$NTEST" "$RTEST"
          printf 'new-product=%s\nnew-tree=%s\nnew-library-blob=%s\nnew-test-blob=%s\n' \
            "$NEW" "$NTREE" "$NLIB" "$NTEST" | tee -a "$R"

          stage final-live-lease-revalidation
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-controller-head \
            "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-main-head \
            "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq final-main-lib \
            "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq final-main-test \
            "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq final-product-head \
            "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq final-product-lib \
            "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq final-product-test \
            "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq final-product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq final-product-paths \
            "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage lease-guarded-publication
          git -C "$Q" push origin \
            "$NEW:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin \
            "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head \
            "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$NEW"
          require_eq published-parent "$(git rev-parse "$NEW^")" "$CPARENT"
          require_eq published-tree "$(git rev-parse "$NEW^{tree}")" "$NTREE"
          require_eq published-library-blob \
            "$(git rev-parse "$NEW:tools/lib/industrial-exhaust.mjs")" "$NLIB"
          require_eq published-test-blob \
            "$(git rev-parse "$NEW:test/industrial-exhaust.test.js")" "$NTEST"
          require_eq published-count "$(git rev-list --count "$CPARENT..$NEW")" '1'
          require_eq published-paths \
            "$(git diff --name-only "$CPARENT..$NEW" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          printf '\nQUALIFICATION_SUCCESS product=%s tree=%s library=%s test=%s\n' \
            "$NEW" "$NTREE" "$NLIB" "$NTEST" | tee -a "$R"

      - name: Retain qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-attached-observation-invalid-closer-v1
          path: /tmp/pr2231-attached-observation-artifact
          if-no-files-found: error
