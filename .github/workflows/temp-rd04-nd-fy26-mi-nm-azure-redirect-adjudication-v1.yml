name: TEMP adjudicate RD-04 North Dakota FY2026 MI-NM Azure redirect v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.tmp/rd04-nd-fy26-mi-nm-azure-redirect-adjudication-v1/trigger.json'

permissions:
  actions: read
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CONTROLLER_PATH: .tmp/rd04-nd-fy26-mi-nm-azure-redirect-adjudication-v1/controller.sh
      CONTROLLER_BLOB: 08c93973b91866a4531cce07d9f3ea8eed9ec5e8
      CONTROLLER_BYTES: '24834'
      CONTROLLER_SHA256: 7fa66e4818859707ddeb94de571b61b6b38b539d64d9f7d39ebb27f140961c43
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Authenticate exact ordinary Git redirect controller
        run: |
          set -Eeuo pipefail
          test -f "$CONTROLLER_PATH"
          test "$(stat -c %s "$CONTROLLER_PATH")" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$CONTROLLER_PATH" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          test "$(git hash-object "$CONTROLLER_PATH")" = "$CONTROLLER_BLOB"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CONTROLLER_COMMIT="$(git rev-parse "$BASE_SHA^")"
          test "$(git rev-parse "$CONTROLLER_COMMIT:$CONTROLLER_PATH")" = "$CONTROLLER_BLOB"
          bash -n "$CONTROLLER_PATH"

      - name: Adjudicate exact consumed origin redirect without source contact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash "$CONTROLLER_PATH"

      - name: Preserve exact request-free Azure redirect adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-fy26-mi-nm-azure-redirect-adjudication-v1
          path: ${{ runner.temp }}/ssc-rd04-nd-fy26-mi-nm-azure-redirect-adjudication-v1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Enforce terminal request-free Azure route selection
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/ssc-rd04-nd-fy26-mi-nm-azure-redirect-adjudication-v1"
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          jq -e '
            .state=="complete" and
            .failed_or_final_stage=="complete" and
            .exit_code==0 and
            .current_parent=="7d6f9895595a62b6a6cfb3205d03c3d9e50fce33" and
            .matrix_blob=="19357f8214ab2710bc5e75b3fae8c7fb09ff1654" and
            .current_cell_sha256=="cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe" and
            .source_artifact_id==9041349436 and
            .source_artifact_sha256=="f99ffd00090b199f78b409192cb4e27d4b8cc4196a76a5d78e850b6f5496db25" and
            .source_exit_sentinel==1 and
            .source_typed_receipt_exit_code==0 and
            .source_top_level_checksum_rows==31 and
            .source_nested_checksum_rows==17 and
            .source_requests==0 and
            .route_executions==0 and
            .source_admissions==0 and
            .field_decisions==1 and
            .promotion_candidates==0 and
            .held_open_fields==1 and
            .selected_followup_routes==1 and
            .field_terminalizations==0 and
            .matrix_updates==0 and
            .row_state_mutations==0 and
            .class_closed==false and
            .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and
            .publication_effect=="none" and
            .adoption_effect=="none" and
            .graph_effect=="none" and
            .additional_execution_authorized==true and
            .additional_execution_scope=="RD04-ND-FY2026-REQUEST-SUPPORT-ZIP-MI-NM-AZURE-001"
          ' "$OUT/receipt.json" > /dev/null
          jq -e '
            .source_artifact_id==9041349436 and
            .origin_observation.route_id=="RD04-ND-FY2026-REQUEST-SUPPORT-ZIP-MI-NM-ORIGIN-001" and
            .origin_observation.http_status==302 and
            .origin_observation.physical_requests==1 and
            .origin_observation.followed_redirects==0 and
            .origin_observation.body_bytes==0 and
            .origin_observation.body_sha256=="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" and
            .origin_observation.server=="AkamaiGHost" and
            .origin_observation.content_length==0 and
            .origin_observation.target_contacted==false and
            .origin_observation.terminal_state=="redirect_refused_terminal" and
            .target_classification=="server_directed_transport_locator_only" and
            .target_url=="https://fna-bwbufwdzbabpezgc.z01.azurefd.us/sites/default/files/resource-files/FY2026-ABAWD-State-Requests-and-Data-MI-NM-7-2026.zip" and
            .target_host=="fna-bwbufwdzbabpezgc.z01.azurefd.us" and
            .path_preserved==true and
            .wildcard_host_authority==false and
            .sibling_path_authority==false and
            .substantive_effect=="none"
          ' "$OUT/redirect-adjudication.json" > /dev/null
          jq -e '
            .route_id=="RD04-ND-FY2026-REQUEST-SUPPORT-ZIP-MI-NM-AZURE-001" and
            .url=="https://fna-bwbufwdzbabpezgc.z01.azurefd.us/sites/default/files/resource-files/FY2026-ABAWD-State-Requests-and-Data-MI-NM-7-2026.zip" and
            .method=="GET" and
            .attempts==1 and
            .exact_host=="fna-bwbufwdzbabpezgc.z01.azurefd.us" and
            .maximum_followed_redirects==0 and
            .maximum_body_bytes==100000000 and
            .require_zip_magic_on_http_200==true and
            .same_host_expansion==0 and
            .sibling_path_expansion==0 and
            .result_spawned_requests==0 and
            .source_admissions==0 and
            .field_terminalizations==0 and
            .matrix_updates==0 and
            .row_state_mutations==0 and
            .class_closed==false and
            .outside_human_dependency==false
          ' "$OUT/selected-protocol.json" > /dev/null
          jq -e '
            .row_state=="still_open" and
            .terminal_fields==7 and
            .open_fields==2 and
            .field_state=="still_open" and
            .field_terminal==false and
            .field_value==null and
            .cell_sha256=="cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe"
          ' "$OUT/current-cell-proof.json" > /dev/null
          (cd "$OUT" && sha256sum -c SHA256SUMS)
