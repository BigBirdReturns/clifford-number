name: Temporary PR 2231 V120 weak-range qualification R1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v120-weak-range-qualification-r1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v120:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v120-weak-range-qualification-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v120-weak-range-qualification-r1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and execute exact V120 read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          repo=BigBirdReturns/clifford-number
          root=/tmp/pr2231-v120-weak-range-envelope
          artifact=/tmp/pr2231-v120-weak-range-qualification-r1
          payload="$root/qualifier-v120.sh.xz"
          qualifier="$root/qualifier-v120.sh"
          wrapper_log="$root/v120-controller-wrapper.log"
          rm -rf "$root" "$artifact"
          mkdir -p "$root"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            mkdir -p "$artifact/controller-envelope"
            test ! -f "$payload" || install -m 0644 "$payload" "$artifact/controller-envelope/qualifier-v120.sh.xz"
            test ! -f "$qualifier" || install -m 0755 "$qualifier" "$artifact/controller-envelope/qualifier-v120.sh"
            install -m 0644 "$wrapper_log" "$artifact/controller-envelope/v120-controller-wrapper.log"
            printf '%s\n' \
              'controller_envelope=v120-weak-range-qualification-r1' \
              "outer_status=$rc" \
              'mode=read-only' \
              'product_mutation=none' \
              'review_mutation=none' \
              > "$artifact/controller-envelope/v120-controller-status.env"
            find "$artifact" -type f -printf '%P\t%s\n' | sort \
              > "$artifact/controller-envelope/v120-final-manifest.txt"
            exit "$rc"
          }
          trap preserve EXIT

          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          test "$(git rev-parse HEAD^)" = 771a64b6b467748d2f4df667b5f78e76f9432d69
          test "$CONTROLLER_BRANCH" = "$EXPECTED_CONTROLLER_BRANCH"

          compressed_blob=9a30e1040fe4b9ce7a2446af1f91d6ef6371a2d6
          gh api "repos/$repo/git/blobs/$compressed_blob" --jq '.content' \
            | tr -d '\n' | base64 -d > "$payload"
          test "$(wc -c < "$payload")" = 5340
          test "$(git hash-object "$payload")" = "$compressed_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = 7096bf755597fb0ef4311f9fe3d38f74172cd43127fad6d864c5c2acd8b3d36d
          xz -t "$payload"
          xz -dc "$payload" > "$qualifier"
          chmod 0755 "$qualifier"
          test "$(wc -c < "$qualifier")" = 21179
          test "$(git hash-object "$qualifier")" = 417dfa633b820ff2543e9804cf4c19644907889a
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = 1a0bf9a6646d73d87be02a1e22525d42bc57cb4d53c968c4e808c2c5faa2b339
          bash -n "$qualifier"

          set +e
          bash "$qualifier"
          qualifier_rc=$?
          set -e
          exit "$qualifier_rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v120-weak-range-qualification-r1
          path: /tmp/pr2231-v120-weak-range-qualification-r1
          if-no-files-found: error
          retention-days: 90
