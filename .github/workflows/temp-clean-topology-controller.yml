name: TEMP main estate baseline diagnostic

on:
  push:
    branches:
      - agent/topology-admission-frontier-clean-controller-v1

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile and test exact main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base_sha="$(git rev-parse origin/main)"
          test "$base_sha" = 'fd34ca0a2726ff6972ccbc32ea7e5e13101b161b'
          git checkout --detach "$base_sha"
          npm run compile
          node test/estates.test.js
