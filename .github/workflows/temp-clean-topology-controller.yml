name: TEMP clean exact-stint topology frontier

on:
  push:
    branches:
      - agent/topology-admission-frontier-clean-controller-v1

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize and validate clean product
        shell: bash
        env:
          SOURCE_SHA: 51b8a8d1ed342fc7ee157e31f3a41645bb0f1d00
          EXPECTED_TARGET_HEAD: 55ffac16851697ff9cf8492bc9f989e28a0d2a47
          TARGET_BRANCH: agent/topology-admission-frontier-v1
        run: |
          set -euo pipefail
          cp tools/temp-clean-topology-controller.py /tmp/temp-clean-topology-controller.py
          mkdir -p /tmp/source-files/tools /tmp/source-files/test
          for path in \
            tools/build-topology-admission-frontier.mjs \
            test/topology-admission-frontier.test.js
          do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/${path}" \
              -o "/tmp/source-files/${path}"
          done
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/temp-clean-topology-controller.py')
          text = path.read_text(encoding='utf-8')
          old = "    data = subprocess.check_output(['git', 'show', f'{source_sha}:{path}'])\n"
          new = "    data = Path('/tmp/source-files', path).read_bytes()\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'source-loader denominator mismatch: {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git fetch --no-tags origin main "$TARGET_BRANCH"
          base_sha="$(git rev-parse origin/main)"
          test "$base_sha" = 'fd34ca0a2726ff6972ccbc32ea7e5e13101b161b'
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "$EXPECTED_TARGET_HEAD"
          git checkout --detach "$base_sha"
          python /tmp/temp-clean-topology-controller.py

          chmod +x tools/compile.mjs tools/build-topology-admission-frontier.mjs
          node --check tools/lib/hops.mjs
          node --check tools/build-topology-admission-frontier.mjs
          node --check tools/compile.mjs
          node test/hop-stints.test.js
          node test/topology-admission-frontier.test.js
          npm run compile
          node test/hop-stints.test.js
          node test/topology-admission-frontier.test.js
          npm run release:check

          git add \
            .github/workflows/ci.yml \
            data/ledger/surfaces.jsonl \
            test/hop-stints.test.js \
            test/topology-admission-frontier.test.js \
            tools/build-topology-admission-frontier.mjs \
            tools/compile.mjs \
            tools/lib/hops.mjs

          expected_paths="$(cat <<'EOF'
          .github/workflows/ci.yml
          data/ledger/surfaces.jsonl
          test/hop-stints.test.js
          test/topology-admission-frontier.test.js
          tools/build-topology-admission-frontier.mjs
          tools/compile.mjs
          tools/lib/hops.mjs
          EOF
          )"
          actual_paths="$(git diff --cached --name-only)"
          test "$actual_paths" = "$expected_paths"
          test "$(git ls-files -s tools/compile.mjs | awk '{print $1}')" = '100755'
          test "$(git ls-files -s tools/build-topology-admission-frontier.mjs | awk '{print $1}')" = '100755'

          rm -rf topology-product
          mkdir -p topology-product
          while IFS= read -r path; do
            mkdir -p "topology-product/$(dirname "$path")"
            cp -p "$path" "topology-product/$path"
          done <<< "$expected_paths"

          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'expected_target_head=%s\n' "$EXPECTED_TARGET_HEAD"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'paths:\n%s\n' "$expected_paths"
            printf 'modes_and_hashes:\n'
            while IFS= read -r path; do
              stat -c '%a %n' "$path"
              sha256sum "$path"
            done <<< "$expected_paths"
          } > topology-product-manifest.txt
          git diff --cached --binary --full-index > topology-product.patch
          tar --numeric-owner --owner=0 --group=0 -czf topology-product.tar.gz \
            topology-product topology-product-manifest.txt topology-product.patch
      - name: Upload validated product tree
        uses: actions/upload-artifact@v4
        with:
          name: topology-admission-frontier-validated-tree
          path: topology-product.tar.gz
          if-no-files-found: error
          retention-days: 1
