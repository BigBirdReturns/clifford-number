name: TEMP prove canonical RD-04 next-frontier protocol v1

on:
  push:
    branches:
      - 'agent/ssc-rd04-next-frontier-protocol-postmerge-proof-v1'

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

env:
  PRODUCT_BRANCH: agent/ssc-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol-v1
  SLUG: status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol

concurrency:
  group: temp-ssc-rd04-next-frontier-protocol-postmerge-proof-v1
  cancel-in-progress: true

jobs:
  prove:
    if: github.ref_name == 'agent/ssc-rd04-next-frontier-protocol-postmerge-proof-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Require inert proof trigger
        run: |
          set -Eeuo pipefail
          if test -f '.trigger/ssc-rd04-next-frontier-protocol-postmerge-proof-v1/EXECUTE'; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          else
            echo 'execute=false' >> "$GITHUB_OUTPUT"
            echo 'registration_only=true'
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.execute == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.execute == 'true'
        with:
          python-version: '3.13'
      - name: Install pinned proof dependencies
        if: steps.gate.outputs.execute == 'true'
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - id: proof
        name: Prove canonical merge, product gates, and clean temporary estate
        if: steps.gate.outputs.execute == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1
          WT=/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1-worktree
          rm -rf "$OUT" "$WT"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/run.log") 2>&1
          git fetch --force origin main "$PRODUCT_BRANCH"
          LIVE_MAIN=$(git rev-parse origin/main)
          PRODUCT_HEAD=$(git rev-parse FETCH_HEAD)
          PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&head=${GITHUB_REPOSITORY_OWNER}:${PRODUCT_BRANCH}&per_page=100")
          printf '%s\n' "$PR_JSON" > "$OUT/product-prs.json"
          python - <<'PY' > "$OUT/product-pr.json"
          import json,sys
          from pathlib import Path
          rows=json.loads(Path('/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1/product-prs.json').read_text())
          rows=[row for row in rows if row.get('merged_at') and row.get('head',{}).get('ref')=='agent/ssc-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol-v1']
          if len(rows)!=1: raise SystemExit(f'expected exactly one merged product PR, found {len(rows)}')
          print(json.dumps(rows[0],indent=2))
          PY
          PR_NUMBER=$(jq -r .number "$OUT/product-pr.json")
          PR_HEAD=$(jq -r .head.sha "$OUT/product-pr.json")
          MERGE_SHA=$(jq -r .merge_commit_sha "$OUT/product-pr.json")
          test "$PR_HEAD" = "$PRODUCT_HEAD"
          test -n "$MERGE_SHA"
          git cat-file -e "${MERGE_SHA}^{commit}"
          PRODUCT_PARENT=$(git rev-parse "${PRODUCT_HEAD}^")
          PRODUCT_TREE=$(git rev-parse "${PRODUCT_HEAD}^{tree}")
          MERGE_TREE=$(git rev-parse "${MERGE_SHA}^{tree}")
          read -r -a PARENTS <<< "$(git show -s --format=%P "$MERGE_SHA")"
          test "${#PARENTS[@]}" -eq 2
          test "${PARENTS[0]}" = "$PRODUCT_PARENT"
          test "${PARENTS[1]}" = "$PRODUCT_HEAD"
          test "$MERGE_TREE" = "$PRODUCT_TREE"
          git diff --exit-code "$PRODUCT_HEAD" "$MERGE_SHA"
          git merge-base --is-ancestor "$MERGE_SHA" "$LIVE_MAIN"

          cat > "$OUT/expected-paths.txt" <<'EOF'
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/frontier-selection.json
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/official-locator-inventory.json
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/predecessor-custody.json
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/route-discovery-protocol.json
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/route-query-contract.json
          data/intake/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol/summary.json
          docs/milestones/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol.md
          schemas/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol.schema.json
          test/status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol.test.js
          tools/acquisition/status-sovereignty-rd-wave03-rd04-next-frontier/plan-official-route-discovery.py
          tools/build-status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol.mjs
          EOF
          sed -i 's/^          //' "$OUT/expected-paths.txt"
          git diff --name-only "$PRODUCT_PARENT" "$MERGE_SHA" | sort > "$OUT/actual-paths.txt"
          diff -u "$OUT/expected-paths.txt" "$OUT/actual-paths.txt"
          git diff --name-status "$PRODUCT_PARENT" "$MERGE_SHA" > "$OUT/name-status.txt"
          test "$(wc -l < "$OUT/name-status.txt" | tr -d ' ')" -eq 13
          test "$(awk '$1 != "A" {n++} END {print n+0}' "$OUT/name-status.txt")" -eq 0
          test -z "$(grep -E '(^|/)(\.transport|\.trigger)(/|$)|(^|/)\.github/workflows/' "$OUT/actual-paths.txt" || true)"

          if test "$LIVE_MAIN" != "$MERGE_SHA"; then
            git diff --name-only "$MERGE_SHA" "$LIVE_MAIN" | sort > "$OUT/live-successor-paths.txt"
            comm -12 "$OUT/expected-paths.txt" "$OUT/live-successor-paths.txt" > "$OUT/live-overlap.txt"
            test ! -s "$OUT/live-overlap.txt"
          else
            : > "$OUT/live-successor-paths.txt"
            : > "$OUT/live-overlap.txt"
          fi

          git worktree add --detach "$WT" "$MERGE_SHA"
          cd "$WT"
          node --check "tools/build-${SLUG}.mjs"
          node --check "tools/validate-${SLUG}.mjs"
          node --check "test/${SLUG}.test.js"
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd04-next-frontier/plan-official-route-discovery.py
          node "tools/build-${SLUG}.mjs" --check
          node "tools/validate-${SLUG}.mjs" | tee "$OUT/focused.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          slug='status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol'
          root=Path('.')
          schema=json.loads((root/f'schemas/{slug}.schema.json').read_text())
          validator=jsonschema.Draft202012Validator(schema)
          data=root/f'data/intake/{slug}'
          names=['frontier-selection.json','predecessor-custody.json','official-locator-inventory.json','route-query-contract.json','route-discovery-protocol.json','summary.json']
          for name in names: validator.validate(json.loads((data/name).read_text()))
          print('closed_schema_validation=pass objects=6')
          PY
          node "test/${SLUG}.test.js" | tee "$OUT/adversarial.txt"
          python tools/acquisition/status-sovereignty-rd-wave03-rd04-next-frontier/plan-official-route-discovery.py --json > "$OUT/plan.json"
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          npm run release:check
          git reset --hard HEAD
          git clean -fdx
          node "tools/build-${SLUG}.mjs" --write
          node "tools/build-${SLUG}.mjs" --check
          node "tools/validate-${SLUG}.mjs"
          node "test/${SLUG}.test.js"
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cd "$GITHUB_WORKSPACE"

          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          out=Path('/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1')
          wt=Path('/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1-worktree')
          slug='status-sovereignty-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol'
          data=wt/'data/intake'/slug
          selection=json.loads((data/'frontier-selection.json').read_text())
          summary=json.loads((data/'summary.json').read_text())
          match=re.search(r'adversarial_refusals=(\d+)',(out/'adversarial.txt').read_text())
          if not match: raise SystemExit('missing adversarial refusal count')
          pr=json.loads((out/'product-pr.json').read_text())
          receipt={'schema_version':'ssc-rd04-next-frontier-protocol-postmerge-proof@1','pull_request':pr['number'],'canonical_parent':os.environ['PRODUCT_PARENT'],'product_head':os.environ['PRODUCT_HEAD'],'product_tree':os.environ['PRODUCT_TREE'],'canonical_merge':os.environ['MERGE_SHA'],'canonical_merge_tree':os.environ['MERGE_TREE'],'live_main_at_proof':os.environ['LIVE_MAIN'],'permanent_paths':out.joinpath('actual-paths.txt').read_text().splitlines(),'permanent_path_count':13,'live_successor_overlap_count':0,'selected_state_ids':selection['selected_state_ids'],'selected_field_ids':selection['selected_field_ids'],'selected_substantive_cell_count':selection['selected_substantive_cell_count'],'protocol_obligations':summary['protocol_obligations'],'fixed_repository_route_cells':summary['fixed_repository_route_cells'],'bounded_official_route_discovery_cells':summary['bounded_official_route_discovery_cells'],'closed_schema_objects':6,'adversarial_refusals':int(match.group(1)),'focused_validation':'pass','no_magic_human':'pass','complete_release_gate':'pass','clean_deterministic_replay':'pass','source_requests_executed':0,'source_admissions':0,'field_mutations':0,'row_state_mutations':0,'class_closed':False,'outside_human_dependency':False,'cumulative_ledger_effect':'none','publication_effect':'none','adoption_effect':'none','graph_effect':'none'}
          out.joinpath('postmerge-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY

          # Retire only known execution refs after the canonical receipt exists.
          RELATED=(
            agent/ssc-rd04-next-frontier-survey-v1
            agent/ssc-rd04-next-frontier-protocol-recovery-v3
            agent/ssc-rd04-next-frontier-protocol-orchestrator-v4
            agent/ssc-rd-wave03-rd04-next-minimum-frontier-route-discovery-protocol-v1
          )
          : > "$OUT/reset-refs.txt"
          for ref in "${RELATED[@]}"; do
            old=$(git ls-remote --heads origin "refs/heads/$ref" | awk '{print $1}')
            if test -n "$old"; then
              git push origin "$LIVE_MAIN:refs/heads/$ref" --force-with-lease="refs/heads/$ref:$old"
              printf '%s %s -> %s\n' "$ref" "$old" "$LIVE_MAIN" >> "$OUT/reset-refs.txt"
            fi
          done
          gh pr close 1317 --repo "$GITHUB_REPOSITORY" --comment "Closed without merge after canonical next-frontier protocol publication and independent post-merge proof. This export lane remains read-only and has no separate evidentiary or product authority." || true
      - name: Preserve exact proof receipt
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-next-frontier-protocol-postmerge-proof-v1
          path: /tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1
          if-no-files-found: warn
          retention-days: 90
      - name: Report exact proof outcome
        if: always() && steps.gate.outputs.execute == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1
          BODY="$OUT/issue-comment.md"
          if test "$OUTCOME" = success && test -f "$OUT/postmerge-receipt.json"; then
            python - <<'PY' > "$BODY"
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1/postmerge-receipt.json');r=json.loads(p.read_text())
          print('Canonical RD-04 next-frontier route-discovery protocol post-merge proof completed successfully.\n')
          print('```text')
          for key in ['pull_request','canonical_parent','product_head','product_tree','canonical_merge','canonical_merge_tree','live_main_at_proof','permanent_path_count','live_successor_overlap_count','selected_substantive_cell_count','protocol_obligations','fixed_repository_route_cells','bounded_official_route_discovery_cells','closed_schema_objects','adversarial_refusals','complete_release_gate','clean_deterministic_replay','source_requests_executed','source_admissions','field_mutations','row_state_mutations','class_closed','outside_human_dependency']:
              print(f'{key}: {r[key]}')
          print(f"selected_states: {' '.join(r['selected_state_ids'])}")
          print(f"selected_fields: {' '.join(r['selected_field_ids'])}")
          print(f"reset_refs: {sum(1 for line in Path('/tmp/ssc-rd04-next-frontier-protocol-postmerge-proof-v1/reset-refs.txt').read_text().splitlines() if line)}")
          print(f"receipt_sha256: {hashlib.sha256(p.read_bytes()).hexdigest()}")
          print('```')
          print('\nThe merge is canonical, workflow-free, and protocol-only. Known execution refs were neutralized after proof, and the read-only export PR was closed unmerged. RD-04-C02 and the cumulative ledger remain open; the next authorized transaction is the bounded route-discovery acquisition.')
          PY
          else
            {
              echo 'Canonical RD-04 next-frontier protocol post-merge proof failed closed.'
              echo
              echo '```text'
              echo "proof_head: $GITHUB_SHA"
              echo "proof_outcome: $OUTCOME"
              if test -f "$OUT/run.log"; then tail -320 "$OUT/run.log"; fi
              echo '```'
              echo
              echo 'No cleanup, acquisition, or additional authority is represented.'
            } > "$BODY"
          fi
          gh issue comment 1017 --repo "$GH_REPOSITORY" --body-file "$BODY"
      - name: Refuse failed proof
        if: always() && steps.gate.outputs.execute == 'true'
        env:
          OUTCOME: ${{ steps.proof.outcome }}
        run: test "$OUTCOME" = success
