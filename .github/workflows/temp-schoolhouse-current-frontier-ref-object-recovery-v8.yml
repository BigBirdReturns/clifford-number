name: TEMP recover School.House current-frontier package across all refs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-current-frontier-ref-object-recovery-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolhouse-current-frontier-ref-object-recovery-v8-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-current-frontier-ref-object-recovery-v8')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch all refs and scan every plausible carrier object
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='1e52a58be874538509d6c0d3c06adc12fc53cad7'
          WORKFLOW='.github/workflows/temp-schoolhouse-current-frontier-ref-object-recovery-v8.yml'
          OUT="$RUNNER_TEMP/schoolhouse-current-frontier-ref-object-recovery-v8"
          B64="$OUT/recovery.py.xz.b64"
          XZ="$OUT/recovery.py.xz"
          SCRIPT="$OUT/recovery.py"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          printf 'initializing-ref-object-recovery-v8\n' > "$OUT/STAGE"
          printf 'source_requests=0\nregistry_queries=0\nform_submissions=0\ncontacts=0\npayments=0\nuploads=0\n' > "$OUT/BOUNDARY"

          finalize() {
            rc="$?"
            trap - EXIT
            printf '%s\n' "$rc" > "$OUT/RECOVERY_EXIT_CODE"
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          printf 'proving-one-workflow-and-fetching-all-refs\n' > "$OUT/STAGE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = '1'
          mapfile -t paths < <(git diff --name-only "$BASE"..HEAD)
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = "$WORKFLOW"
          git diff --check "$BASE"..HEAD
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$BASE" "$(git rev-parse origin/main)"
          git fetch --force --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pull/*/head'
          git fetch --force --tags origin '+refs/tags/*:refs/tags/*'
          git show-ref > "$OUT/all-refs.txt"

          printf 'reconstructing-recovery-program\n' > "$OUT/STAGE"
          cat > "$B64" <<'EOF_RECOVERY_B64'
