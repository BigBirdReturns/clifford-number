name: TEMP rebind K0 full-history release products

on:
  push:
    branches:
      - candidate/electric-twin-class-rights-adjudication-v5
    paths:
      - '.github/workflows/temporary-k0-full-history-rebind.yml'

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: candidate/electric-twin-class-rights-adjudication-v5
          fetch-depth: 0
          show-progress: false
      - name: Repair checkout depth, regenerate custody products, and publish
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="candidate/electric-twin-class-rights-adjudication-v5"
          TEMP_WORKFLOW=".github/workflows/temporary-k0-full-history-rebind.yml"
          K0_WORKFLOW=".github/workflows/k0-epistemic-admissibility.yml"
          K0_MANIFEST="data/project/k0-epistemic-admissibility-release-manifest.json"
          K0_REPORT="reports/core-thesis/answerable-power/k0.json"
          K0_HTML="reports/core-thesis/answerable-power/k0.html"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/k0-epistemic-admissibility.yml')
          text = path.read_text()
          old = "      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n"
          new = "      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - uses: actions/setup-node@v4\n"
          if text.count(old) != 1:
              raise SystemExit(f'K0 checkout stanza drifted: expected one shallow stanza, found {text.count(old)}')
          if new in text:
              raise SystemExit('K0 workflow already contains the full-history stanza')
          path.write_text(text.replace(old, new))
          PY

          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js

          npm run release:check

          OUT="/tmp/k0-full-history-rebind"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$K0_WORKFLOW" "$OUT/k0-workflow.yml"
          cp "$K0_MANIFEST" "$OUT/k0-manifest.json"
          cp "$K0_REPORT" "$OUT/k0-report.json"
          cp "$K0_HTML" "$OUT/k0.html"

          git restore --staged --worktree -- .
          cp "$OUT/k0-workflow.yml" "$K0_WORKFLOW"
          cp "$OUT/k0-manifest.json" "$K0_MANIFEST"
          cp "$OUT/k0-report.json" "$K0_REPORT"
          cp "$OUT/k0.html" "$K0_HTML"
          rm "$TEMP_WORKFLOW"

          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js

          expected="$(printf '%s\n' \
            "$K0_WORKFLOW" \
            "$TEMP_WORKFLOW" \
            "$K0_MANIFEST" \
            "$K0_HTML" \
            "$K0_REPORT" | sort)"
          actual="$(git status --porcelain | cut -c4- | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected K0 rebind paths:"
            git status --short
            exit 1
          }

          git diff --check
          git add -A -- \
            "$K0_WORKFLOW" \
            "$TEMP_WORKFLOW" \
            "$K0_MANIFEST" \
            "$K0_HTML" \
            "$K0_REPORT"
          test -z "$(git diff --name-only)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: give K0 release gate full history"

          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
