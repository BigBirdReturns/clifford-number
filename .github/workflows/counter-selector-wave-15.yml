name: Counter-Selector Wave 15 attribution census

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-15.yml'
      - 'data/project/counter-selector-wave-15-attribution-census.json'
      - 'data/project/counter-selector-attribution-census.json'
      - 'data/project/counter-selector-wave-15-release-manifest.json'
      - 'schemas/counter-selector-attribution-census.schema.json'
      - 'docs/methods/counter-selector-attribution-census.md'
      - 'docs/milestones/counter-selector-wave-15.md'
      - 'tools/build-counter-selector-wave-15.mjs'
      - 'tools/validate-counter-selector-wave-15.mjs'
      - 'test/counter-selector-wave-15.test.js'
      - 'reports/core-thesis/counter-selector-wave-15/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-15-attribution-census'
    paths:
      - '.github/workflows/counter-selector-wave-15.yml'
      - 'data/project/counter-selector-wave-15-attribution-census.json'
      - 'data/project/counter-selector-attribution-census.json'
      - 'data/project/counter-selector-wave-15-release-manifest.json'
      - 'schemas/counter-selector-attribution-census.schema.json'
      - 'docs/methods/counter-selector-attribution-census.md'
      - 'docs/milestones/counter-selector-wave-15.md'
      - 'tools/build-counter-selector-wave-15.mjs'
      - 'tools/validate-counter-selector-wave-15.mjs'
      - 'test/counter-selector-wave-15.test.js'
      - 'reports/core-thesis/counter-selector-wave-15/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 15 products
        run: node tools/build-counter-selector-wave-15.mjs
      - name: Validate attribution census
        run: node tools/validate-counter-selector-wave-15.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-15.test.js
      - name: Require exact committed Wave 15 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-attribution-census.json \
            data/project/counter-selector-wave-15-release-manifest.json \
            reports/core-thesis/counter-selector-wave-15/data.json \
            reports/core-thesis/counter-selector-wave-15/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 15 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-15.mjs
          node tools/validate-counter-selector-wave-15.mjs
          node test/counter-selector-wave-15.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
