name: PR2208 plural-base and title-clause launcher v4

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr2208-pronoun-entity-finalizer.yml'

permissions:
  contents: read

concurrency:
  group: pr2208-plural-title-launcher-v4-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  patch-qualify-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/pr2194-fresh-sentence-followup-controller-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CONTROLLER_BRANCH: agent/pr2194-fresh-sentence-followup-controller-v1
      RESULT_BRANCH: agent/pr2194-fresh-sentence-followup-v1
      ANCHOR_BRANCH: agent/pr2208-plural-title-product-anchor-v1
      EXPECTED_RESULT_HEAD: 5d872f183572fa3538856a6b97f4a9a4b4845b92
      EXPECTED_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute and anchor the guarded finalizer payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr2208-institutional-clause-finalizer.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = '        run: |\n'
          assert source.count(marker) == 1, 'finalizer payload marker changed'

          lines = []
          for line in source.split(marker, 1)[1].splitlines():
              if line.strip() and not line.startswith('          '):
                  break
              lines.append(line)

          assert lines and any(line.strip() for line in lines), 'finalizer payload missing'
          assert all(not line.strip() or line.startswith('          ') for line in lines), (
              'finalizer payload escaped its YAML block'
          )
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          Path('/tmp/pr2208-finalizer.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/pr2208-finalizer.sh

          product_sha="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse refs/remotes/origin/main)"
          git push --force origin "HEAD:refs/heads/$ANCHOR_BRANCH"
          test "$(git ls-remote origin "refs/heads/$ANCHOR_BRANCH" | cut -f1)" = "$product_sha"
          printf 'PR2208_PRODUCT_SHA=%s\nPR2208_PRODUCT_TREE=%s\n' \
            "$product_sha" "$product_tree"
