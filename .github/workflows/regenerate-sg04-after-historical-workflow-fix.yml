name: Regenerate SG-04 custody after historical workflow repair

on:
  push:
    branches:
      - agent/sg04-exact-recovery
    paths:
      - '.github/workflows/regenerate-sg04-after-historical-workflow-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/clifford-number
          ref: agent/k0-role-neutral-wave-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate SG-04 release custody
        shell: bash
        run: |
          set -euo pipefail
          expected_head='a2d6218fe1401028311f7b9b9be489fddcbe732d'
          test "$(git rev-parse HEAD)" = "$expected_head"
          node tools/build-project-stable-ground-sg04.mjs
          node tools/validate-project-stable-ground-sg04.mjs
          node test/project-stable-ground-sg04.test.js
          npm run release:check
          python3 - <<'PY'
          import subprocess

          volatile = [
              'build/axm-identity.json',
              'build/build-hop-report.json',
              'build/hop-graph.json',
              'build/migration-review.md',
              'build/migration-summary.json',
              'build/receipt-graph.json',
              'build/scores.json',
              'build/scout-report.json',
              'build/scout-report.md',
              'build/surface-graph.json',
          ]
          allowed_outputs = {
              'data/project/project-stable-ground-sg04-release-manifest.json',
              'reports/core-thesis/stable-ground/sg04/checkpoint.json',
              'reports/core-thesis/stable-ground/sg04/index.html',
          }
          changed_paths = subprocess.run(
              ['git', 'diff', '--name-only'],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          unexpected = sorted(set(changed_paths) - set(volatile) - allowed_outputs)
          if unexpected:
              raise RuntimeError(f'unexpected regeneration paths: {unexpected}')
          for path in sorted(set(changed_paths) & set(volatile)):
              diff = subprocess.run(
                  ['git', 'diff', '--unified=0', '--', path],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              changed_lines = [
                  line[1:].strip()
                  for line in diff.splitlines()
                  if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))
              ]
              if len(changed_lines) != 2 or not all(
                  line.startswith('"generated": "') or line.startswith('Generated: ')
                  for line in changed_lines
              ):
                  raise RuntimeError(f'unexpected compiler mutation in {path}: {changed_lines}')
          PY
          git restore -- \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/migration-review.md \
            build/migration-summary.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/scout-report.md \
            build/surface-graph.json
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            data/project/project-stable-ground-sg04-release-manifest.json \
            reports/core-thesis/stable-ground/sg04/checkpoint.json \
            reports/core-thesis/stable-ground/sg04/index.html | sort)"
          git diff --check
      - name: Publish regenerated non-workflow outputs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='a2d6218fe1401028311f7b9b9be489fddcbe732d'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/project/project-stable-ground-sg04-release-manifest.json \
            reports/core-thesis/stable-ground/sg04/checkpoint.json \
            reports/core-thesis/stable-ground/sg04/index.html
          git commit -m 'Refresh SG-04 custody after historical workflow repair'
          git push --force-with-lease=refs/heads/agent/k0-role-neutral-wave-08:"$expected_head" origin HEAD:agent/k0-role-neutral-wave-08

# Explicit execution marker.
