name: Counter-Selector Wave 07 Batch 02 acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-07.yml'
      - 'data/project/counter-selector-wave-07-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b02-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b02.json'
      - 'schemas/counter-selector-batch02-acquisition.schema.json'
      - 'docs/methods/counter-selector-batch02-acquisition.md'
      - 'docs/milestones/counter-selector-wave-07.md'
      - 'tools/build-counter-selector-wave-07.mjs'
      - 'tools/validate-counter-selector-wave-07.mjs'
      - 'test/counter-selector-wave-07.test.js'
      - 'reports/core-thesis/counter-selector-wave-07/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-07.yml'
      - 'data/project/counter-selector-wave-07-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b02-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b02.json'
      - 'schemas/counter-selector-batch02-acquisition.schema.json'
      - 'docs/methods/counter-selector-batch02-acquisition.md'
      - 'docs/milestones/counter-selector-wave-07.md'
      - 'tools/build-counter-selector-wave-07.mjs'
      - 'tools/validate-counter-selector-wave-07.mjs'
      - 'test/counter-selector-wave-07.test.js'
      - 'reports/core-thesis/counter-selector-wave-07/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 07 products
        run: node tools/build-counter-selector-wave-07.mjs
      - name: Validate Batch 02 acquisition contract
        run: node tools/validate-counter-selector-wave-07.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-07.test.js
      - name: Require exact committed Wave 07 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-artifact-acquisition-b02-registry.json \
            data/project/counter-selector-blind-packet-registry-b02.json \
            data/project/counter-selector-wave-07-release-manifest.json \
            reports/core-thesis/counter-selector-wave-07/data.json \
            reports/core-thesis/counter-selector-wave-07/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 07 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-07.mjs
          node tools/validate-counter-selector-wave-07.mjs
          node test/counter-selector-wave-07.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
