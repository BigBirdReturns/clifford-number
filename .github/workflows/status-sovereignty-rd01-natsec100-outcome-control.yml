name: Status-for-sovereignty RD-01 NatSec100 outcome control

on:
  pull_request:
    paths:
      - 'data/intake/status-sovereignty-rd01-natsec100-outcome-control.json'
      - 'schemas/status-sovereignty-rd01-natsec100-outcome-control.schema.json'
      - 'docs/milestones/ssc-rd01-natsec100-outcome-control.md'
      - 'tools/build-status-sovereignty-rd01-natsec100-outcome-control.mjs'
      - 'tools/validate-status-sovereignty-rd01-natsec100-outcome-control.mjs'
      - 'test/status-sovereignty-rd01-natsec100-outcome-control.test.js'
      - '.github/workflows/status-sovereignty-rd01-natsec100-outcome-control.yml'
      - 'data/project/status-sovereignty-rd01-natsec100-outcome-control-release-manifest.json'
      - 'build/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/**'
      - 'reports/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/**'
  push:
    branches: [main]
    paths:
      - 'data/intake/status-sovereignty-rd01-natsec100-outcome-control.json'
      - 'schemas/status-sovereignty-rd01-natsec100-outcome-control.schema.json'
      - 'docs/milestones/ssc-rd01-natsec100-outcome-control.md'
      - 'tools/build-status-sovereignty-rd01-natsec100-outcome-control.mjs'
      - 'tools/validate-status-sovereignty-rd01-natsec100-outcome-control.mjs'
      - 'test/status-sovereignty-rd01-natsec100-outcome-control.test.js'
      - '.github/workflows/status-sovereignty-rd01-natsec100-outcome-control.yml'
      - 'data/project/status-sovereignty-rd01-natsec100-outcome-control-release-manifest.json'
      - 'build/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/**'
      - 'reports/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and validate the bounded NatSec100 pilot
        run: |
          node tools/build-status-sovereignty-rd01-natsec100-outcome-control.mjs
          node tools/validate-status-sovereignty-rd01-natsec100-outcome-control.mjs
          node test/status-sovereignty-rd01-natsec100-outcome-control.test.js
      - name: Require exact committed products
        run: |
          git diff --exit-code -- \
            data/project/status-sovereignty-rd01-natsec100-outcome-control-release-manifest.json \
            build/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/manifest.json \
            build/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/data.json \
            reports/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/data.json \
            reports/core-thesis/status-sovereignty/rd01-natsec100-outcome-control/index.html
      - name: Prove publication exclusion
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -d dist/data/intake
          test ! -e dist/build/core-thesis/status-sovereignty/rd01-natsec100-outcome-control
          test ! -e dist/reports/core-thesis/status-sovereignty/rd01-natsec100-outcome-control
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic reconstruction
        run: |
          git restore --staged --worktree .
          node tools/build-status-sovereignty-rd01-natsec100-outcome-control.mjs
          node tools/validate-status-sovereignty-rd01-natsec100-outcome-control.mjs
          node test/status-sovereignty-rd01-natsec100-outcome-control.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
