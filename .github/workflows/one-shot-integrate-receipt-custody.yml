name: One-shot receipt-custody integration

on:
  pull_request:
    paths:
      - 'tools/integrate-state-market-receipt-custody.py'
      - 'tools/update-receipt-custody-map.py'
      - '.github/workflows/one-shot-integrate-receipt-custody.yml'
      - 'data/ledger/receipts.jsonl'
      - 'receipts/thesis-state-market/**'
      - 'data/research/thesis-case-packets/**'
      - 'data/research/thesis-evidence/**'
      - 'data/research/clifford-cross-corpus-public-interest-map.json'
      - 'tools/lib/thesis-case-packet.mjs'
      - 'tools/validate-thesis-case-packets.mjs'
      - 'tools/validate-pages.mjs'
      - 'test/thesis-case-packet.test.js'
      - 'test/thesis-state-market-receipts.test.js'
      - 'package.json'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/thesis-state-market-receipt-custody
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Complete the source and publication contracts
        run: |
          python tools/integrate-state-market-receipt-custody.py
          python tools/update-receipt-custody-map.py
      - name: Compile and validate case packets
        run: |
          npm run compile:case-packets
          npm run validate:case-packets
      - name: Compile and validate the thesis ceiling
        run: |
          npm run compile:thesis
          npm run validate:thesis
      - name: Validate immutable receipt custody
        run: npm run validate:state-market-receipts
      - name: Run the complete repository release gate
        run: npm run release:check
      - name: Commit only the verified final tree
        run: |
          rm -f tools/update-receipt-custody-map.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete state-market receipt custody integration"
          git push origin HEAD:agent/thesis-state-market-receipt-custody
