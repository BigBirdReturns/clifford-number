name: One-shot receipt-custody integration

on:
  push:
    branches:
      - agent/thesis-state-market-receipt-custody
  pull_request:
    paths:
      - 'tools/integrate-state-market-receipt-custody.py'
      - '.github/workflows/one-shot-integrate-receipt-custody.yml'
      - 'data/ledger/receipts.jsonl'
      - 'receipts/thesis-state-market/**'
      - 'data/research/thesis-case-packets/**'
      - 'data/research/thesis-evidence/**'
      - 'tools/lib/thesis-case-packet.mjs'
      - 'tools/validate-thesis-case-packets.mjs'
      - 'tools/validate-pages.mjs'
      - 'test/thesis-case-packet.test.js'
      - 'test/thesis-state-market-receipts.test.js'
      - 'package.json'

permissions:
  contents: write

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply the integration in a disposable worktree
        env:
          RECEIPT_CUSTODY_DRY_RUN: '1'
        run: python tools/integrate-state-market-receipt-custody.py
      - name: Compile case packets
        run: npm run compile:case-packets 2>&1 | tee compile-case-packets.log
      - name: Validate case packets
        run: npm run validate:case-packets 2>&1 | tee validate-case-packets.log
      - name: Compile thesis coverage
        run: npm run compile:thesis 2>&1 | tee compile-thesis.log
      - name: Validate thesis ceiling
        run: npm run validate:thesis 2>&1 | tee validate-thesis.log
      - name: Validate receipt custody
        run: npm run validate:state-market-receipts 2>&1 | tee validate-receipts.log
      - name: Run repository release gate
        run: npm run release:check 2>&1 | tee release-check.log
      - name: Preserve the verified integration tree and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-custody-integration-diagnostics
          path: |
            package.json
            data/research/thesis-evidence/synthetic-population-infrastructure.json
            tools/validate-thesis-case-packets.mjs
            tools/validate-pages.mjs
            test/thesis-case-packet.test.js
            test/thesis-state-market-receipts.test.js
            docs/thesis-state-market-receipt-custody.md
            .github/workflows/thesis-state-market-receipts.yml
            *-case-packets.log
            *-thesis.log
            validate-receipts.log
            release-check.log
            build/thesis/case-packet-index.json
            build/thesis/case-packet-index.md
            build/thesis/case-packets/*.json
            build/thesis/case-packets/*.md
            build/thesis/synthetic-population-infrastructure.json
            build/thesis/synthetic-population-infrastructure.md
          if-no-files-found: warn

  apply:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/thesis-state-market-receipt-custody
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Complete source, test, documentation, and workflow contracts
        run: python tools/integrate-state-market-receipt-custody.py
      - name: Compile case packets
        run: npm run compile:case-packets
      - name: Validate case packets
        run: npm run validate:case-packets
      - name: Compile thesis coverage
        run: npm run compile:thesis
      - name: Validate thesis ceiling
        run: npm run validate:thesis
      - name: Validate receipt custody
        run: npm run validate:state-market-receipts
      - name: Run repository release gate
        run: npm run release:check
      - name: Commit the integrated tranche
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete state-market receipt custody integration"
          git push origin HEAD:agent/thesis-state-market-receipt-custody
