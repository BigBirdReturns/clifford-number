name: Temporary materialize M-05 Sprint 03 Leg 05

on:
  push:
    branches:
      - agent/m05-sprint-03-leg-05-public-platform-exit-v2
    paths:
      - '.github/workflows/temporary-materialize-m05-s03-l5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-05-public-platform-exit-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Decode permanent source surface
        env:
          PAYLOAD_B64: [... ELLIPSIZATION ...]
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/m05-s03-l5.tgz
          test "$(sha256sum /tmp/m05-s03-l5.tgz | awk '{print $1}')" = "5cb8832a00572d9fd76d829fcfce9212856b0c05568e9e5d1d0996caad31f4b9"
          tar -xzf /tmp/m05-s03-l5.tgz
      - name: Build and validate public-platform exit test
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-05.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-05.mjs
          node test/m05-answerable-power-sprint-03-leg-05.test.js
      - name: Commit generated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/m05-answerable-power.yml \
            data/project/m05-answerable-power-sprint-03-leg-05-public-platform-exit.json \
            docs/milestones/m05-answerable-power-sprint-03-leg-05.md \
            tools/build-m05-answerable-power-sprint-03-leg-05.mjs \
            tools/validate-m05-answerable-power-sprint-03-leg-05.mjs \
            test/m05-answerable-power-sprint-03-leg-05.test.js \
            reports/core-thesis/answerable-power/sprint-03-leg-05.json \
            reports/core-thesis/answerable-power/sprint-03-leg-05.html
          git commit -m "Add M-05 Sprint 03 public-platform exit test"
          git push origin HEAD:agent/m05-sprint-03-leg-05-public-platform-exit-v2
