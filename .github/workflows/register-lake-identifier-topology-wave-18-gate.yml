name: Register Wave 18 in canonical release gate

on:
  push:
    branches:
      - agent/lake-identifier-topology-wave-18
    paths:
      - '.github/tmp/register-lake-identifier-topology-wave-18-gate-trigger.json'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Register Wave 18 validator and regression
        shell: bash
        run: |
          set -euo pipefail
          original_sha=$(git rev-parse HEAD)
          node - <<'NODE'
          const fs = require('fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const scriptName = 'validate:lake-identifier-topology-wave-18';
          const command = 'node tools/validate-lake-identifier-topology-wave-18.mjs && node test/lake-identifier-topology-wave-18.test.js';
          pkg.scripts[scriptName] = command;
          const anchor = 'npm run validate:lake-residual-frontier-wave-17';
          const addition = `${anchor} && npm run ${scriptName}`;
          if (!pkg.scripts.check.includes(`npm run ${scriptName}`)) {
            if (!pkg.scripts.check.includes(anchor)) throw new Error('Wave 17 release-gate anchor missing');
            pkg.scripts.check = pkg.scripts.check.replace(anchor, addition);
          }
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          node -e "const p=require('./package.json'); if (!p.scripts['validate:lake-identifier-topology-wave-18']) process.exit(1); if (!p.scripts.check.includes('npm run validate:lake-identifier-topology-wave-18')) process.exit(1);"
          rm -f .github/tmp/register-lake-identifier-topology-wave-18-gate-trigger.json
          rm -f .github/workflows/register-lake-identifier-topology-wave-18-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check
          git commit -m 'Register identifier topology Wave 18 in release gate'
          git fetch origin agent/lake-identifier-topology-wave-18
          test "$(git rev-parse origin/agent/lake-identifier-topology-wave-18)" = "$original_sha"
          git push origin HEAD:agent/lake-identifier-topology-wave-18
