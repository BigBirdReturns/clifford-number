name: Temporary PR 2231 source-contiguous callback observations V114

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-source-contiguous-callback-v114.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-source-contiguous-callback-v114
  cancel-in-progress: false

jobs:
  qualify-source-contiguous-callbacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: cfd1e459efc07f57cab7117200a4a4b962fd1bac
      EXPECTED_TREE: 17d5350c902e47f129fae0282735b4acbeff381c
      EXPECTED_LIBRARY: dab48bfba026dc1629a4384a26d98c13366b0ea3
      EXPECTED_TEST: 8fad1d2be93f9a286f9b95bb35751d3e908c4834
      REVIEW_CONTROLLER_PR: '2403'
      REVIEW_CONTROLLER_HEAD: 254c54ba12382ac2dd40f2129abc86c5a145d193
      REVIEW_RUN: '33332368912'
      REVIEW_ARTIFACT: '9738015605'
      REVIEW_ARTIFACT_DIGEST: sha256:ecd47420f5d6fe261465214e7c7f63fd282d9a37dbad8150a52c679f0c3c1c50
      SOURCE_CONTROLLER_PR: '2404'
      SOURCE_CONTROLLER: edf861c84350477198857adc5471178875454b5d
      SOURCE_WORKFLOW_PATH: .github/workflows/temporary-pr2231-source-contiguous-callback-v112.yml
      SOURCE_WORKFLOW_BLOB: fa4dd6ec81fb204c4e2b44f2028da897b9aaffc6
      SOURCE_FAILURE_RUN: '33332885484'
      SOURCE_FAILURE_ARTIFACT: '9738153169'
      SOURCE_FAILURE_ARTIFACT_DIGEST: sha256:7862b47f3a8f7801fc9a094dd48d0194e5ee936169c612d5fcaadf16196982b7
      REPAIR_CONTROLLER_PR: '2405'
      REPAIR_CONTROLLER: 2a1e09c120a5c4549b8774e696cf8f65907f69b3
      REPAIR_WORKFLOW_PATH: .github/workflows/temporary-pr2231-source-contiguous-callback-v113.yml
      REPAIR_WORKFLOW_BLOB: 4f94b2048a3eb9b597ba696e5a7aae06f235b720
      REPAIR_FAILURE_RUN: '33334405916'
      REPAIR_FAILURE_ARTIFACT: '9738594226'
      REPAIR_FAILURE_ARTIFACT_DIGEST: sha256:90a1db803702fab630daf978407f902dbc988787ae2474a5320b36e95ad3aaf7
      PRODUCT_WT: /tmp/pr2231-source-contiguous-product-v114
      MAIN_WT: /tmp/pr2231-source-contiguous-main-v114
      QUALIFIED_DIR: /tmp/pr2231-source-contiguous-qualified-v114
      ARTIFACT_DIR: /tmp/pr2231-source-contiguous-v114

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize and execute corrected V112 qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          source_receipts=/tmp/pr2231-source-contiguous-v114-source
          source_yaml=/tmp/pr2231-source-contiguous-v112.yml
          materialized=/tmp/pr2231-source-contiguous-v114.sh
          rm -rf "${source_receipts}" "${source_yaml}" "${materialized}" "${materialized}.repair.json"
          mkdir -p "${source_receipts}"

          [[ "$(git rev-parse "${SOURCE_CONTROLLER}^{commit}")" == "${SOURCE_CONTROLLER}" ]]
          [[ "$(git rev-parse "${SOURCE_CONTROLLER}:${SOURCE_WORKFLOW_PATH}")" == "${SOURCE_WORKFLOW_BLOB}" ]]
          [[ "$(git rev-parse "${REPAIR_CONTROLLER}^{commit}")" == "${REPAIR_CONTROLLER}" ]]
          [[ "$(git rev-parse "${REPAIR_CONTROLLER}:${REPAIR_WORKFLOW_PATH}")" == "${REPAIR_WORKFLOW_BLOB}" ]]
          git show "${SOURCE_CONTROLLER}:${SOURCE_WORKFLOW_PATH}" > "${source_yaml}"

          gh api "repos/${REPO}/pulls/${SOURCE_CONTROLLER_PR}" > "${source_receipts}/source-controller-pr.json"
          gh api "repos/${REPO}/actions/runs/${SOURCE_FAILURE_RUN}" > "${source_receipts}/source-failure-run.json"
          gh api "repos/${REPO}/actions/artifacts/${SOURCE_FAILURE_ARTIFACT}" > "${source_receipts}/source-failure-artifact.json"
          gh api "repos/${REPO}/pulls/${REPAIR_CONTROLLER_PR}" > "${source_receipts}/repair-controller-pr.json"
          gh api "repos/${REPO}/actions/runs/${REPAIR_FAILURE_RUN}" > "${source_receipts}/repair-failure-run.json"
          gh api "repos/${REPO}/actions/artifacts/${REPAIR_FAILURE_ARTIFACT}" > "${source_receipts}/repair-failure-artifact.json"

          jq -e --arg head "${SOURCE_CONTROLLER}" --arg base "${EXPECTED_MAIN}" '.state == "open" and .draft == true and .merged == false and .head.sha == $head and .base.sha == $base and .commits == 1 and .changed_files == 1' "${source_receipts}/source-controller-pr.json" >/dev/null
          jq -e --argjson id "${SOURCE_FAILURE_RUN}" --arg head "${SOURCE_CONTROLLER}" '.id == $id and .head_sha == $head and .event == "pull_request" and .status == "completed" and .conclusion == "failure"' "${source_receipts}/source-failure-run.json" >/dev/null
          jq -e --argjson id "${SOURCE_FAILURE_ARTIFACT}" --argjson run "${SOURCE_FAILURE_RUN}" --arg head "${SOURCE_CONTROLLER}" --arg digest "${SOURCE_FAILURE_ARTIFACT_DIGEST}" '.id == $id and .expired == false and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $head' "${source_receipts}/source-failure-artifact.json" >/dev/null
          jq -e --arg head "${REPAIR_CONTROLLER}" --arg base "${EXPECTED_MAIN}" '.state == "open" and .draft == true and .merged == false and .head.sha == $head and .base.sha == $base and .commits == 1 and .changed_files == 1' "${source_receipts}/repair-controller-pr.json" >/dev/null
          jq -e --argjson id "${REPAIR_FAILURE_RUN}" --arg head "${REPAIR_CONTROLLER}" '.id == $id and .head_sha == $head and .event == "pull_request" and .status == "completed" and .conclusion == "failure"' "${source_receipts}/repair-failure-run.json" >/dev/null
          jq -e --argjson id "${REPAIR_FAILURE_ARTIFACT}" --argjson run "${REPAIR_FAILURE_RUN}" --arg head "${REPAIR_CONTROLLER}" --arg digest "${REPAIR_FAILURE_ARTIFACT_DIGEST}" '.id == $id and .expired == false and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $head' "${source_receipts}/repair-failure-artifact.json" >/dev/null

          python - "${source_yaml}" "${materialized}" <<'PY_MATERIALIZE'
          from pathlib import Path
          import json
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          lines = source.read_text().splitlines()

          run_markers = [
              index for index, line in enumerate(lines)
              if line == '        run: |'
              and index >= 2
              and lines[index - 2] == '      - name: Execute read-only qualification'
          ]
          if len(run_markers) != 1:
              raise SystemExit(
                  f'execute run block: expected one marker, found {len(run_markers)}'
              )

          start = run_markers[0] + 1
          end = next(
              (
                  index for index in range(start, len(lines))
                  if lines[index].startswith('      - name:')
                  or lines[index].startswith('      - uses:')
              ),
              len(lines)
          )

          script_lines = []
          for source_index, line in enumerate(lines[start:end], start=start + 1):
              if line == '':
                  script_lines.append('')
                  continue
              if not line.startswith('          '):
                  raise SystemExit(
                      f'run block indentation escaped at source line {source_index}'
                  )
              script_lines.append(line[10:])

          repair_receipt = []
          markers = (
              'old = """    const nextSource = next < groups.length',
              'new = """    const nextSource = next < groups.length'
          )
          for marker in markers:
              matches = [
                  index for index, line in enumerate(script_lines)
                  if line == marker
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f'{marker}: expected one extracted match, found {len(matches)}'
                  )
              marker_index = matches[0]
              closing_index = next(
                  (
                      index for index in range(marker_index + 1, len(script_lines))
                      if script_lines[index] == '"""'
                  ),
                  None
              )
              if closing_index is None:
                  raise SystemExit(f'{marker}: closing triple quote not found')
              for index in range(marker_index + 1, closing_index):
                  script_lines[index] = f'  {script_lines[index]}'
              repair_receipt.append({
                  'marker': marker,
                  'start_line': marker_index + 1,
                  'closing_line': closing_index + 1,
                  'adjusted_lines': closing_index - marker_index - 1
              })

          bootstrap = 'mkdir -p "$QUALIFIED_DIR" "$ARTIFACT_DIR/receipts"'
          bootstrap_matches = [
              index for index, line in enumerate(script_lines)
              if line == bootstrap
          ]
          if len(bootstrap_matches) != 1:
              raise SystemExit(
                  f'receipt bootstrap: expected one match, found {len(bootstrap_matches)}'
              )
          bootstrap_index = bootstrap_matches[0]
          receipt_copy = (
              'tar -C "$SOURCE_RECEIPTS_DIR" -cf - . '
              '| tar -C "$ARTIFACT_DIR/receipts" -xf -'
          )
          script_lines.insert(bootstrap_index + 1, receipt_copy)

          output.write_text('\n'.join(script_lines) + '\n')
          receipt = Path(f'{output}.repair.json')
          receipt.write_text(json.dumps({
              'source_workflow': str(source),
              'materialized_script': str(output),
              'repairs': repair_receipt,
              'receipt_bootstrap': {
                  'injected': True,
                  'after_line': bootstrap_index + 1,
                  'command': receipt_copy
              }
          }, indent=2) + '\n')
          PY_MATERIALIZE

          repair_receipt="${materialized}.repair.json"
          [[ -f "${repair_receipt}" ]]
          jq -e '(.repairs | length) == 2 and .receipt_bootstrap.injected == true' "${repair_receipt}" >/dev/null
          install -m 0644 "${repair_receipt}" "${source_receipts}/materialization-repair.json"
          sha256sum "${source_yaml}" > "${source_receipts}/source-workflow.sha256"
          sha256sum "${materialized}" > "${source_receipts}/materialized-script.sha256"
          printf '%s\n' \
            "source_controller=${SOURCE_CONTROLLER}" \
            "source_workflow_blob=${SOURCE_WORKFLOW_BLOB}" \
            "source_failure_run=${SOURCE_FAILURE_RUN}" \
            "source_failure_artifact=${SOURCE_FAILURE_ARTIFACT}" \
            "source_failure_artifact_digest=${SOURCE_FAILURE_ARTIFACT_DIGEST}" \
            "repair_controller=${REPAIR_CONTROLLER}" \
            "repair_workflow_blob=${REPAIR_WORKFLOW_BLOB}" \
            "repair_failure_run=${REPAIR_FAILURE_RUN}" \
            "repair_failure_artifact=${REPAIR_FAILURE_ARTIFACT}" \
            "repair_failure_artifact_digest=${REPAIR_FAILURE_ARTIFACT_DIGEST}" \
            > "${source_receipts}/source.env"

          export SOURCE_RECEIPTS_DIR="${source_receipts}"
          bash "${materialized}"

      - name: Emit qualification receipts
        if: always()
        shell: bash
        run: |
          upload=/tmp/pr2231-source-contiguous-v114-upload
          rm -rf "${upload}"
          mkdir -p "${ARTIFACT_DIR}" "${upload}"
          find "${ARTIFACT_DIR}" -type f -printf '%P\t%s\n' | sort > "${ARTIFACT_DIR}/artifact-manifest.txt"
          tar -C "${ARTIFACT_DIR}" -cf - . | tar -C "${upload}" -xf -
          {
            printf '%s\n' '### PR 2231 source-contiguous callback qualification V114'
            for receipt in result.txt predecessor-reproduction.json \
              direct-matrix.json candidate.env candidate-paths.txt \
              candidate-patch.sha256 focused-product.log \
              product-release-check.log focused-main-transplant.log \
              main-release-check.log receipts/source.env \
              receipts/materialization-repair.json \
              receipts/materialized-script.sha256 \
              artifact-manifest.txt; do
              printf '\n#### %s\n\n```text\n' "${receipt}"
              if [[ -f "${ARTIFACT_DIR}/${receipt}" ]]; then
                tail -n 420 "${ARTIFACT_DIR}/${receipt}"
              fi
              printf '%s\n' '```'
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-source-contiguous-callback-v114
          path: /tmp/pr2231-source-contiguous-v114-upload
          retention-days: 90
