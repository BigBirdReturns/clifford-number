name: TEMP prove RD-04 Montana edge-census canonical merge v2

on:
  pull_request:
    branches: [observer/ssc-rd04-mt-edge-census-postmerge-base-v2]
    types: [opened, synchronize, reopened]
    paths: ['.tmp/rd04-mt-edge-census-postmerge-v2/trigger.json']

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: temp-rd04-mt-edge-census-postmerge-v2
  cancel-in-progress: false

env:
  CANONICAL_PARENT: e62de80e187f9be037cbdd3a4b942b5840d223de
  VALIDATION_BASE: bc3cf04459bb0d18829f376c9b937693b521e444
  VALIDATION_PRODUCT: a933ceacbfd9753401a7e9875c9f3048237c2014
  VALIDATION_PRODUCT_TREE: 53fffef006eccb181ed4f00ea606e49b74b83a60
  VALIDATION_MERGE: 5cbe9d8628efbc8c9fa85027876be77e77fbf0ef
  MATRIX_REPAIR_PRODUCT: a26be29f081c20b9f2d0adeeaf25c4a434064999
  MATRIX_REPAIR_PRODUCT_TREE: 4bb0367b873dac25b4b36f78256ac65cd615b32c
  MATRIX_REPAIR_MERGE: 7d06800b6899add8beff7891a526abec843bb8d9
  EDGE_WORKFLOW_COMMIT: 00036a809fb0e55a0427d7deb4d2cef2d5655d1d
  EDGE_REPAIR_HEAD: 3aed7331a5f4b75618e9357bc7061e8ce1ad0064
  EDGE_REPAIR_TREE: 38023f86bcc27527f9db8da9622bada00b3de542
  CANONICAL_MERGE: 0840358962621b0be3db6864ecec763327f35903
  PRODUCT_PR: '1866'
  PRODUCT_RUN: '31413447117'
  RELEASE_RUN: '31413447102'
  NO_MAGIC_RUN: '31413447152'
  PRODUCT_ARTIFACT_ID: '9072500310'
  PRODUCT_ARTIFACT_NAME: ssc-rd04-mt-row-state-reconciliation-validation-edge-census-repair-v1
  PRODUCT_ARTIFACT_SHA256: c255a62a6cafa08c3497c1fce74559405b8515006939ef4dbc495a801307dec6
  PRODUCT_RECEIPT_SHA256: 9cee31e9e726817e1ed8c5f822898ea41d04d11e5308988623b1309da2695705
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-row-state-reconciliation/promoted-partial-field-matrix.json
  MATRIX_BLOB: 6ba11a6025021e9df8ac6535be8c42499654c233
  WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1.yml
  WORKFLOW_BLOB: 610d88e5b30d3e44579b02fd264fdb09e1475511
  MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/product-manifest.json
  MANIFEST_BLOB: 3d29b059372af4676b61f90da7552983b614c8c6
  VALIDATOR: tools/validate-status-sovereignty-rd-wave03-rd04-mt-row-state-reconciliation-v1.py
  VALIDATOR_BLOB: 5e3413f2349f8867d222a9ede3c6cc9573e473b6
  RD01_WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd01-methodology-correction-terminal.yml
  RD01_WORKFLOW_BLOB: 7e15a050c59f857ab280f7b0cc170c2a6af1fe7a
  OBSERVER_WORKFLOW: .github/workflows/temp-rd04-mt-edge-census-postmerge-v2.yml
  TRIGGER_PATH: .tmp/rd04-mt-edge-census-postmerge-v2/trigger.json
  OUT: /tmp/rd04-mt-edge-census-postmerge-v2
  WORK: /tmp/rd04-mt-edge-census-postmerge-v2-work

jobs:
  prove:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'observer/ssc-rd04-mt-edge-census-postmerge-base-v2' &&
      github.event.pull_request.head.ref == 'observer/ssc-rd04-mt-edge-census-postmerge-trigger-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prove topology, native-run classification, artifact custody, and replay
        id: prove
        continue-on-error: true
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT/api" "$OUT/product-artifact"

          api() {
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git show -s --format='%P' "$EVENT_HEAD")" = "$EVENT_BASE"
          test "$(git show -s --format='%P' "$EVENT_BASE")" = "$CANONICAL_MERGE"
          test "$(git diff --name-only "$CANONICAL_MERGE" "$EVENT_BASE")" = "$OBSERVER_WORKFLOW"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_MERGE" "$EVENT_BASE")" = "$OBSERVER_WORKFLOW"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_MERGE" "$EVENT_BASE")"
          test "$(git diff --name-only "$EVENT_BASE" "$EVENT_HEAD")" = "$TRIGGER_PATH"
          test "$(git diff --name-only --diff-filter=A "$EVENT_BASE" "$EVENT_HEAD")" = "$TRIGGER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$EVENT_BASE" "$EVENT_HEAD")"
          git diff --check "$CANONICAL_MERGE" "$EVENT_HEAD"

          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          LIVE_MAIN="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$CANONICAL_MERGE" "$LIVE_MAIN"
          printf '%s\n' "$LIVE_MAIN" > "$OUT/live-main.txt"

          test "$(git show -s --format='%P' "$VALIDATION_PRODUCT")" = "$CANONICAL_PARENT"
          test "$(git rev-parse "$VALIDATION_PRODUCT^{tree}")" = "$VALIDATION_PRODUCT_TREE"
          test "$(git show -s --format='%P' "$VALIDATION_MERGE")" = "$VALIDATION_BASE $VALIDATION_PRODUCT"
          test "$(git show -s --format='%P' "$MATRIX_REPAIR_PRODUCT")" = "$VALIDATION_MERGE"
          test "$(git rev-parse "$MATRIX_REPAIR_PRODUCT^{tree}")" = "$MATRIX_REPAIR_PRODUCT_TREE"
          test "$(git show -s --format='%P' "$MATRIX_REPAIR_MERGE")" = "$VALIDATION_MERGE $MATRIX_REPAIR_PRODUCT"
          test "$(git show -s --format='%P' "$EDGE_WORKFLOW_COMMIT")" = "$MATRIX_REPAIR_MERGE"
          test "$(git show -s --format='%P' "$EDGE_REPAIR_HEAD")" = "$EDGE_WORKFLOW_COMMIT"
          test "$(git rev-parse "$EDGE_REPAIR_HEAD^{tree}")" = "$EDGE_REPAIR_TREE"
          test "$(git show -s --format='%P' "$CANONICAL_MERGE")" = "$MATRIX_REPAIR_MERGE $EDGE_REPAIR_HEAD"

          PRODUCT_PATHS="$(printf '%s\n' \
            "$WORKFLOW_PATH" \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/current-row-custody.json' \
            "$MANIFEST_PATH" \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/row-state-validation.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/summary.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/validated-row-state-protocol.json' \
            "$VALIDATOR" | LC_ALL=C sort)"
          REPAIR_PATHS="$(printf '%s\n' "$WORKFLOW_PATH" "$MANIFEST_PATH" | LC_ALL=C sort)"
          UNCHANGED_PATHS="$(printf '%s\n' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/current-row-custody.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/row-state-validation.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/summary.json' \
            'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/validated-row-state-protocol.json' \
            "$VALIDATOR" | LC_ALL=C sort)"
          PROTECTED_PATHS="$(printf '%s\n%s\n' "$PRODUCT_PATHS" "$MATRIX_PATH" | LC_ALL=C sort -u)"
          printf '%s\n' "$PRODUCT_PATHS" > "$OUT/product-paths.txt"
          printf '%s\n' "$REPAIR_PATHS" > "$OUT/repair-paths.txt"
          printf '%s\n' "$UNCHANGED_PATHS" > "$OUT/unchanged-paths.txt"
          printf '%s\n' "$PROTECTED_PATHS" > "$OUT/protected-paths.txt"

          test "$(git diff --name-only "$MATRIX_REPAIR_MERGE" "$EDGE_WORKFLOW_COMMIT")" = "$WORKFLOW_PATH"
          test "$(git diff --name-only "$EDGE_WORKFLOW_COMMIT" "$EDGE_REPAIR_HEAD")" = "$MANIFEST_PATH"
          test "$(git diff --name-only "$MATRIX_REPAIR_MERGE" "$EDGE_REPAIR_HEAD" | LC_ALL=C sort)" = "$REPAIR_PATHS"
          test "$(git diff --name-only --diff-filter=M "$MATRIX_REPAIR_MERGE" "$EDGE_REPAIR_HEAD" | LC_ALL=C sort)" = "$REPAIR_PATHS"
          test -z "$(git diff --name-only --diff-filter=ADTRCUXB "$MATRIX_REPAIR_MERGE" "$EDGE_REPAIR_HEAD")"
          test "$(git diff --name-only "$MATRIX_REPAIR_MERGE" "$CANONICAL_MERGE" | LC_ALL=C sort)" = "$REPAIR_PATHS"
          test "$(git diff --name-only --diff-filter=M "$MATRIX_REPAIR_MERGE" "$CANONICAL_MERGE" | LC_ALL=C sort)" = "$REPAIR_PATHS"
          test -z "$(git diff --name-only --diff-filter=ADTRCUXB "$MATRIX_REPAIR_MERGE" "$CANONICAL_MERGE")"
          git diff --check "$MATRIX_REPAIR_MERGE" "$CANONICAL_MERGE"

          while IFS= read -r PATHNAME; do
            test "$(git rev-parse "$CANONICAL_MERGE:$PATHNAME")" = "$(git rev-parse "$EDGE_REPAIR_HEAD:$PATHNAME")"
          done < "$OUT/repair-paths.txt"
          while IFS= read -r PATHNAME; do
            test "$(git rev-parse "$EDGE_REPAIR_HEAD:$PATHNAME")" = "$(git rev-parse "$MATRIX_REPAIR_MERGE:$PATHNAME")"
            test "$(git rev-parse "$CANONICAL_MERGE:$PATHNAME")" = "$(git rev-parse "$MATRIX_REPAIR_MERGE:$PATHNAME")"
            test "$(git rev-parse "$LIVE_MAIN:$PATHNAME")" = "$(git rev-parse "$CANONICAL_MERGE:$PATHNAME")"
          done < "$OUT/unchanged-paths.txt"

          test "$(git rev-parse "$CANONICAL_MERGE:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB"
          test "$(git rev-parse "$LIVE_MAIN:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB"
          test "$(git rev-parse "$CANONICAL_MERGE:$MANIFEST_PATH")" = "$MANIFEST_BLOB"
          test "$(git rev-parse "$LIVE_MAIN:$MANIFEST_PATH")" = "$MANIFEST_BLOB"
          test "$(git rev-parse "$CANONICAL_MERGE:$VALIDATOR")" = "$VALIDATOR_BLOB"
          test "$(git rev-parse "$MATRIX_REPAIR_MERGE:$RD01_WORKFLOW_PATH")" = "$RD01_WORKFLOW_BLOB"
          test "$(git rev-parse "$CANONICAL_MERGE:$RD01_WORKFLOW_PATH")" = "$RD01_WORKFLOW_BLOB"
          test "$(git rev-parse "$LIVE_MAIN:$RD01_WORKFLOW_PATH")" = "$RD01_WORKFLOW_BLOB"
          test -z "$(git diff --name-only "$MATRIX_REPAIR_MERGE" "$CANONICAL_MERGE" -- "$RD01_WORKFLOW_PATH")"

          for COMMIT in "$VALIDATION_BASE" "$VALIDATION_PRODUCT" "$VALIDATION_MERGE" "$MATRIX_REPAIR_PRODUCT" "$MATRIX_REPAIR_MERGE" "$EDGE_REPAIR_HEAD" "$CANONICAL_MERGE" "$LIVE_MAIN"; do
            test "$(git rev-parse "$COMMIT:$MATRIX_PATH")" = "$MATRIX_BLOB"
          done

          first_parent_edge_census() {
            local START="$1" END="$2" PREFIX="$3"
            local CHAIN="$OUT/$PREFIX-first-parent-commits.txt"
            local EDGES="$OUT/$PREFIX-first-parent-edge-paths.tsv"
            local UNSORTED="$OUT/$PREFIX-first-parent-paths.unsorted"
            local PATHS="$OUT/$PREFIX-first-parent-paths.txt"
            : > "$CHAIN"; : > "$EDGES"; : > "$UNSORTED"; : > "$PATHS"
            if [ "$START" = "$END" ]; then return; fi
            git merge-base --is-ancestor "$START" "$END"
            git rev-list --first-parent --reverse "$START..$END" > "$CHAIN"
            local PREV="$START" NEXT CHANGED
            while IFS= read -r NEXT; do
              test "$(git rev-parse "$NEXT^1")" = "$PREV"
              while IFS= read -r CHANGED; do
                test -n "$CHANGED"
                printf '%s\t%s\t%s\n' "$PREV" "$NEXT" "$CHANGED" >> "$EDGES"
                printf '%s\n' "$CHANGED" >> "$UNSORTED"
              done < <(git diff --name-only "$PREV" "$NEXT")
              PREV="$NEXT"
            done < "$CHAIN"
            test "$PREV" = "$END"
            LC_ALL=C sort -u "$UNSORTED" > "$PATHS"
          }

          first_parent_edge_census "$CANONICAL_PARENT" "$VALIDATION_BASE" historical
          printf '%s\n' data/crawl/candidates.jsonl data/crawl/rejections.jsonl data/crawl/state.json > "$OUT/expected-historical-paths.txt"
          cmp "$OUT/expected-historical-paths.txt" "$OUT/historical-first-parent-paths.txt"
          test -z "$(comm -12 "$OUT/protected-paths.txt" "$OUT/historical-first-parent-paths.txt")"
          first_parent_edge_census "$CANONICAL_MERGE" "$LIVE_MAIN" postmerge
          test -z "$(comm -12 "$OUT/protected-paths.txt" "$OUT/postmerge-first-parent-paths.txt")"

          FIXTURE="$(mktemp -d)"
          git -C "$FIXTURE" init -q
          git -C "$FIXTURE" config user.name fixture
          git -C "$FIXTURE" config user.email fixture@example.invalid
          printf 'canonical\n' > "$FIXTURE/product-path"
          git -C "$FIXTURE" add product-path
          GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' git -C "$FIXTURE" commit -qm base
          START="$(git -C "$FIXTURE" rev-parse HEAD)"
          printf 'changed\n' > "$FIXTURE/product-path"
          git -C "$FIXTURE" add product-path
          GIT_AUTHOR_DATE='2000-01-01T00:00:01Z' GIT_COMMITTER_DATE='2000-01-01T00:00:01Z' git -C "$FIXTURE" commit -qm touch
          printf 'canonical\n' > "$FIXTURE/product-path"
          git -C "$FIXTURE" add product-path
          GIT_AUTHOR_DATE='2000-01-01T00:00:02Z' GIT_COMMITTER_DATE='2000-01-01T00:00:02Z' git -C "$FIXTURE" commit -qm restore
          END="$(git -C "$FIXTURE" rev-parse HEAD)"
          test -z "$(git -C "$FIXTURE" diff --name-only "$START" "$END")"
          git -C "$FIXTURE" rev-list --first-parent --reverse "$START..$END" > "$OUT/regression-commits.txt"
          : > "$OUT/regression-paths.unsorted"
          PREV="$START"
          while IFS= read -r NEXT; do
            test "$(git -C "$FIXTURE" rev-parse "$NEXT^1")" = "$PREV"
            git -C "$FIXTURE" diff --name-only "$PREV" "$NEXT" >> "$OUT/regression-paths.unsorted"
            PREV="$NEXT"
          done < "$OUT/regression-commits.txt"
          LC_ALL=C sort -u "$OUT/regression-paths.unsorted" > "$OUT/regression-paths.txt"
          test "$(cat "$OUT/regression-paths.txt")" = product-path
          printf '%s\n' endpoint_diff_empty=true edge_census_detected=product-path > "$OUT/regression-receipt.txt"
          rm -rf "$FIXTURE"

          api "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr.json"
          api "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PRODUCT_PR/comments?per_page=100" > "$OUT/api/product-comments.json"
          api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EDGE_REPAIR_HEAD&per_page=100" > "$OUT/api/product-runs.json"
          api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CANONICAL_MERGE&per_page=100" > "$OUT/api/merge-runs.json"
          api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCT_RUN/artifacts" > "$OUT/api/product-artifacts.json"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @- https://api.github.com/graphql > "$OUT/api/review-threads.json" <<'JSON'
          {"query":"query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}","variables":{"owner":"BigBirdReturns","name":"clifford-number","number":1866}}
          JSON

          python - <<'PY' > "$OUT/rd01-failed-run-ids.txt"
          import json, os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          product=os.environ['EDGE_REPAIR_HEAD']; merge=os.environ['CANONICAL_MERGE']
          pr=json.loads((out/'api/product-pr.json').read_text())
          assert pr['number']==1866 and pr['state']=='closed' and pr['merged'] is True
          assert pr['head']['sha']==product and pr['base']['sha']==os.environ['MATRIX_REPAIR_MERGE']
          assert pr['merge_commit_sha']==merge
          comments=json.loads((out/'api/product-comments.json').read_text())
          dispositions=[x for x in comments if x.get('user',{}).get('login')=='chatgpt-codex-connector[bot]' and "Didn't find any major issues" in x.get('body','') and '3aed7331a5' in x.get('body','')]
          assert dispositions
          (out/'codex-dispositions.json').write_text(json.dumps(dispositions,indent=2,sort_keys=True)+'\n')
          threads=json.loads((out/'api/review-threads.json').read_text())['data']['repository']['pullRequest']['reviewThreads']['nodes']
          assert not [x for x in threads if not x['isResolved']]
          (out/'review-thread-ledger.json').write_text(json.dumps({'total':len(threads),'unresolved':0},indent=2,sort_keys=True)+'\n')
          expected={31413447117:'Validate RD-04 Montana row-state reconciliation candidate v1',31413447102:'Release checks',31413447152:'No magic human gate'}
          runs=json.loads((out/'api/product-runs.json').read_text())['workflow_runs']; by={x['id']:x for x in runs}
          ledger=[]
          for run_id,name in expected.items():
            run=by[run_id]; assert run['name']==name and run['head_sha']==product and run['status']=='completed' and run['conclusion']=='success'
            ledger.append({k:run.get(k) for k in ['id','name','event','status','conclusion']})
          (out/'product-run-ledger.json').write_text(json.dumps(sorted(ledger,key=lambda x:x['id']),indent=2,sort_keys=True)+'\n')
          merge_runs=[x for x in json.loads((out/'api/merge-runs.json').read_text())['workflow_runs'] if x.get('head_sha')==merge and x.get('event')=='push']
          expected_failed={31414306126,31414728993,31414828266,31415206928}
          failed=[x for x in merge_runs if x.get('conclusion')!='success']
          assert {x['id'] for x in failed}==expected_failed
          assert all(x['path']==os.environ['RD01_WORKFLOW_PATH'] and x['workflow_id']==327362630 and x['status']=='completed' and x['conclusion']=='failure' for x in failed)
          successful=[x for x in merge_runs if x.get('conclusion')=='success']
          required_success={31414308166,31414308370,31414308857}
          assert required_success <= {x['id'] for x in successful}
          assert all(x['status']=='completed' for x in successful)
          (out/'native-push-ledger-prejobs.json').write_text(json.dumps({'failed':failed,'successful':successful},indent=2,sort_keys=True)+'\n')
          for run_id in sorted(expected_failed): print(run_id)
          artifacts=json.loads((out/'api/product-artifacts.json').read_text())['artifacts']
          matches=[x for x in artifacts if x['id']==9072500310]
          assert len(matches)==1
          artifact=matches[0]
          assert artifact['name']==os.environ['PRODUCT_ARTIFACT_NAME'] and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['PRODUCT_ARTIFACT_SHA256'] and artifact['workflow_run']['head_sha']==product
          (out/'product-artifact-api.json').write_text(json.dumps(artifact,indent=2,sort_keys=True)+'\n')
          PY

          while IFS= read -r RUN_ID; do
            api "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$OUT/api/native-$RUN_ID-jobs.json"
          done < "$OUT/rd01-failed-run-ids.txt"

          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          ids=[int(x) for x in (out/'rd01-failed-run-ids.txt').read_text().split()]
          jobs={}
          for run_id in ids:
            data=json.loads((out/f'api/native-{run_id}-jobs.json').read_text())
            assert data['total_count']==0 and data['jobs']==[]
            jobs[str(run_id)]={'total_count':0,'jobs':[]}
          pre=json.loads((out/'native-push-ledger-prejobs.json').read_text())
          ledger={
            'schema_version':'ssc-rd04-mt-edge-census-native-push-ledger@2',
            'canonical_merge':os.environ['CANONICAL_MERGE'],
            'state':'three_success_classes_and_exact_unchanged_zero_job_rd01_failures',
            'successful_runs':pre['successful'],
            'classified_failed_runs':pre['failed'],
            'failed_run_jobs':jobs,
            'rd01_workflow_path':os.environ['RD01_WORKFLOW_PATH'],
            'rd01_workflow_git_blob':os.environ['RD01_WORKFLOW_BLOB'],
            'rd01_workflow_unchanged_across_merge':True,
          }
          (out/'native-push-ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          PY

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCT_ARTIFACT_ID/zip" \
            -o "$OUT/product-artifact.zip"
          test "$(sha256sum "$OUT/product-artifact.zip" | awk '{print $1}')" = "$PRODUCT_ARTIFACT_SHA256"
          unzip -t "$OUT/product-artifact.zip" > "$OUT/product-artifact-zip-test.txt"
          unzip -q "$OUT/product-artifact.zip" -d "$OUT/product-artifact"
          (cd "$OUT/product-artifact" && sha256sum -c SHA256SUMS > "$OUT/product-artifact-checks.txt")
          test "$(sha256sum "$OUT/product-artifact/validation-receipt.json" | awk '{print $1}')" = "$PRODUCT_RECEIPT_SHA256"
          test "$(sha256sum "$OUT/product-artifact/post-release-validation-receipt.json" | awk '{print $1}')" = "$PRODUCT_RECEIPT_SHA256"
          cmp "$OUT/product-artifact/validation-receipt.json" "$OUT/product-artifact/post-release-validation-receipt.json"
