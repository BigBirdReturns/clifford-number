name: Finalize exact cross-case mention denominator Wave 09

on:
  push:
    branches:
      - agent/lake-cross-case-mention-denominator-wave-09
    paths:
      - '.github/tmp/lake-cross-case-mention-denominator-wave-09-finalize-trigger.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lake-cross-case-mention-denominator-wave-09-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: state
        name: Record exact source head
        run: echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct the permanent workflow ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lake-cross-case-mention-denominator-wave-09.yml')
          text = path.read_text()
          old = '''          node tools/build-lake-cross-case-mention-denominator-wave-09.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/reconcile-lake-cross-case-mention-denominator-wave-09.mjs
          sha256sum --check --strict /tmp/lake-cross-case-wave-09-post.sha256
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-cross-case-mention-denominator-wave-09.mjs
          node test/lake-cross-case-mention-denominator-wave-09.test.js
          npm run release:check
          git diff --check
'''
          new = '''          npm run release:check
          git add -A
          git restore --worktree .
          git clean -fd
          node tools/build-lake-open-pr-shadow.mjs
          node tools/build-lake-cross-case-mention-denominator-wave-09.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/reconcile-lake-cross-case-mention-denominator-wave-09.mjs
          sha256sum --check --strict /tmp/lake-cross-case-wave-09-post.sha256
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-cross-case-mention-denominator-wave-09.mjs
          node test/lake-cross-case-mention-denominator-wave-09.test.js
          git diff --check
'''
          if old not in text:
              raise SystemExit('permanent Wave 09 ordering target missing')
          path.write_text(text.replace(old, new))
          PY
      - name: Apply source contract and build deterministic Wave 09 products
        shell: bash
        run: |
          set -euo pipefail
          node tools/apply-lake-cross-case-mention-denominator-wave-09.mjs --phase=source
          node tools/build-lake-cross-case-mention-denominator-wave-09.mjs
          sha256sum \
            build/cross-case-mention-lexicon-wave-09.json \
            data/project/lake-cross-case-mention-registry-wave-09.jsonl \
            data/project/lake-cross-case-mentioned-entity-registry-wave-09.jsonl \
            data/project/lake-cross-case-mention-pair-denominator-wave-09.jsonl \
            data/project/lake-cross-case-mention-decision-registry-wave-09.jsonl \
            build/cross-case-mention-decision-index-wave-09.json \
            data/project/lake-cross-case-mention-denominator-wave-09.json \
            build/lake-actions/cross-case-mention-denominator-wave-09.json \
            reports/lake-cross-case-mention-denominator-wave-09.md > /tmp/w09-first.sha256
          node tools/build-lake-cross-case-mention-denominator-wave-09.mjs
          sha256sum --check --strict /tmp/w09-first.sha256
          git add -A
      - name: Run the pre-registration complete release gate
        run: npm run release:check
      - name: Preserve source and generated bytes before first reconciliation
        run: |
          git add -A
          git restore --worktree .
          git clean -fd
      - name: Build and validate the first reconciled lake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/build-lake-open-pr-shadow.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/reconcile-lake-cross-case-mention-denominator-wave-09.mjs
          node tools/validate-lake-cross-case-mention-denominator-wave-09.mjs
          node test/lake-cross-case-mention-denominator-wave-09.test.js
      - name: Register Wave 09 permanently and run the canonical gate
        run: |
          node tools/apply-lake-cross-case-mention-denominator-wave-09.mjs --phase=gate
          git add -A
          npm run release:check
      - name: Preserve permanent-gate outputs and rebuild the lake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git restore --worktree .
          git clean -fd
          node tools/build-lake-open-pr-shadow.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/reconcile-lake-cross-case-mention-denominator-wave-09.mjs
          node tools/validate-lake-cross-case-mention-denominator-wave-09.mjs
          node test/lake-cross-case-mention-denominator-wave-09.test.js
      - name: Prove final release-first then lake determinism
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          find build/lake-index -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/w09-post.sha256
          sha256sum \
            build/cross-case-mention-lexicon-wave-09.json \
            data/project/lake-cross-case-mention-registry-wave-09.jsonl \
            data/project/lake-cross-case-mentioned-entity-registry-wave-09.jsonl \
            data/project/lake-cross-case-mention-pair-denominator-wave-09.jsonl \
            data/project/lake-cross-case-mention-decision-registry-wave-09.jsonl \
            build/cross-case-mention-decision-index-wave-09.json \
            data/project/lake-cross-case-mention-denominator-wave-09.json \
            build/lake-actions/cross-case-mention-denominator-wave-09.json \
            build/lake-actions/cross-case-mention-denominator-wave-09-reconciliation.json \
            reports/lake-index-census.md \
            reports/lake-index-gap-summary.md \
            reports/lake-basin-index.md \
            reports/lake-cross-case-mention-denominator-wave-09.md \
            reports/lake-cross-case-mention-denominator-wave-09-reconciliation.md >> /tmp/w09-post.sha256
          npm run release:check
          git add -A
          git restore --worktree .
          git clean -fd
          node tools/build-lake-open-pr-shadow.mjs
          node tools/build-lake-cross-case-mention-denominator-wave-09.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/reconcile-lake-cross-case-mention-denominator-wave-09.mjs
          sha256sum --check --strict /tmp/w09-post.sha256
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-cross-case-mention-denominator-wave-09.mjs
          node test/lake-cross-case-mention-denominator-wave-09.test.js
          git diff --check
      - name: Remove temporary transport files
        run: |
          rm -f \
            .github/tmp/lake-cross-case-mention-denominator-wave-09-trigger.json \
            .github/tmp/lake-cross-case-mention-denominator-wave-09-finalize-trigger.json \
            .github/workflows/lake-cross-case-mention-denominator-wave-09-finalize.yml
      - name: Commit and push the clean materialized checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute exact cross-case mention denominator Wave 09'
          git fetch origin agent/lake-cross-case-mention-denominator-wave-09
          test "$(git rev-parse origin/agent/lake-cross-case-mention-denominator-wave-09)" = "${{ steps.state.outputs.original_sha }}"
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-cross-case-mention-denominator-wave-09.mjs
          npm run validate:cross-case-mentions
          git push origin HEAD:agent/lake-cross-case-mention-denominator-wave-09
