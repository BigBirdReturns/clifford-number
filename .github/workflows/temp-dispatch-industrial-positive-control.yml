name: TEMP dispatch industrial positive control

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-dispatch-industrial-positive-control.yml'

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/dispatch-industrial-positive-control-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Preflight exact main and dispatch the existing crawler
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 56596519121c689074d29205205fc46c96a0ccec
          CONTROLLER_REF: agent/dispatch-industrial-positive-control-20260908
          TARGET_WORKFLOW: crawl-industrial-exhaust.yml
          TARGET_SOURCE: dentsu_inc_en_news
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/industrial-positive-control-dispatch"
          receipt="$RUNNER_TEMP/industrial-positive-control-dispatch"

          controller_head="$(git rev-parse HEAD)"
          controller_parent="$(git rev-parse HEAD^)"
          test "$controller_head" = "${{ github.event.pull_request.head.sha }}"
          test "$controller_parent" = "$EXPECTED_MAIN"

          git diff --name-only "$EXPECTED_MAIN...$controller_head" > "$receipt/changed-paths.txt"
          test "$(wc -l < "$receipt/changed-paths.txt" | tr -d ' ')" = '1'
          test "$(cat "$receipt/changed-paths.txt")" = '.github/workflows/temp-dispatch-industrial-positive-control.yml'

          live_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main" = "$EXPECTED_MAIN"

          open_candidates="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '[.[] | select(.head.ref | startswith("automation-crawl-"))] | length' | awk '{s+=$1} END {print s+0}')"
          test "$open_candidates" = '0'

          started_at="$(date -u +%FT%TZ)"
          jq -n --arg ref main --arg source "$TARGET_SOURCE" '{ref:$ref,inputs:{source:$source}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" --input -

          run_json=''
          for _ in $(seq 1 60); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=workflow_dispatch&per_page=20" \
              | jq -c --arg started "$started_at" --arg sha "$EXPECTED_MAIN" \
                '[.workflow_runs[] | select(.created_at >= $started and .head_sha == $sha)] | sort_by(.created_at) | last // empty')"
            if test -n "$run_json" && test "$run_json" != 'null'; then
              break
            fi
            sleep 2
          done
          test -n "$run_json"
          test "$run_json" != 'null'

          run_id="$(jq -r '.id' <<<"$run_json")"
          run_event="$(jq -r '.event' <<<"$run_json")"
          run_head="$(jq -r '.head_sha' <<<"$run_json")"
          test "$run_event" = 'workflow_dispatch'
          test "$run_head" = "$EXPECTED_MAIN"

          jq -n \
            --arg schema 'scheduled-crawl-positive-control-dispatch@1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg expected_main "$EXPECTED_MAIN" \
            --arg controller_ref "$CONTROLLER_REF" \
            --arg controller_head "$controller_head" \
            --arg target_workflow "$TARGET_WORKFLOW" \
            --arg target_source "$TARGET_SOURCE" \
            --arg started_at "$started_at" \
            --argjson run "$run_json" \
            '{schema_version:$schema,repository:$repository,expected_main:$expected_main,controller_ref:$controller_ref,controller_head:$controller_head,target_workflow:$target_workflow,target_source:$target_source,dispatched_at:$started_at,workflow_run:{id:$run.id,event:$run.event,status:$run.status,conclusion:$run.conclusion,head_sha:$run.head_sha,head_branch:$run.head_branch,created_at:$run.created_at,html_url:$run.html_url}}' \
            > "$receipt/DISPATCH.json"
          (cd "$receipt" && sha256sum DISPATCH.json changed-paths.txt > SHA256SUMS)
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Upload exact dispatch receipt
        uses: actions/upload-artifact@v4
        with:
          name: industrial-positive-control-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/industrial-positive-control-dispatch
          if-no-files-found: error
          retention-days: 30

      - name: Retire the one-use controller ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_REF: agent/dispatch-industrial-positive-control-20260908
        run: |
          set -Eeuo pipefail
          observed="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROLLER_REF" --jq '.object.sha')"
          test "$observed" = "${{ github.event.pull_request.head.sha }}"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CONTROLLER_REF"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTROLLER_REF" >/dev/null 2>&1; then
            echo 'controller ref still exists' >&2
            exit 1
          fi
