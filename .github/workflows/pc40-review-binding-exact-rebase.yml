name: Temporary PC-40 review-binding exact rebase

on:
  pull_request:
    paths:
      - '.github/workflows/pc40-review-binding-exact-rebase.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc40-review-binding-exact-rebase
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc40-review-binding-rebase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair snapshot binding and construct the exact current-main product
        env:
          TARGET_BRANCH: research/preference-linkage-confidence-adjudication-assurance-v1
          EXPECTED_TARGET_HEAD: af682044dd73e83d51c2161cf04eee071e649ec0
          QUALIFIED_PARENT: 8a2aa74ea43827447ee8557c41fdc059d2f76a3c
        run: |
          set -euo pipefail

          git fetch origin main "$TARGET_BRANCH" agent/pc40-review-binding-rebase --no-tags
          source_head=$(git rev-parse HEAD)
          test "$(git rev-parse origin/agent/pc40-review-binding-rebase)" = "$source_head"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET_HEAD"
          publication_base=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$QUALIFIED_PARENT" "$publication_base"

          git checkout --detach "$EXPECTED_TARGET_HEAD"

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_text(text.replace(old, new))

          library = 'tools/lib/preference-custody-manifest-v38.mjs'
          replace_once(
              library,
              'export function validatePreferenceCustodyManifestV38Build(compiled) {\n',
              'export function validatePreferenceCustodyManifestV38Build(compiled, manifest, baseBuild, confidenceBuild, confidenceFixture) {\n'
          )
          replace_once(
              library,
              """  for (const key of ['base_floor_snapshot_sha256', 'extension_snapshot_sha256', 'base_controls_sha256', 'base_promotion_requirements_sha256']) if (!/^[0-9a-f]{64}$/.test(text(composition[key]))) errors.push(`compiled v38 invalid hash: ${key}`);
          const compiledBaseControls = array(compiled?.controls).slice(0, 39);
          """,
              """  for (const key of ['base_floor_snapshot_sha256', 'extension_snapshot_sha256', 'base_controls_sha256', 'base_promotion_requirements_sha256']) if (!/^[0-9a-f]{64}$/.test(text(composition[key]))) errors.push(`compiled v38 invalid hash: ${key}`);
          if (!manifest) errors.push('compiled v38 manifest source is required');
          if (!baseBuild) errors.push('compiled v38 base source is required');
          if (!confidenceBuild) errors.push('compiled v38 PC-40 source is required');
          if (!confidenceFixture) errors.push('compiled v38 PC-40 fixture source is required');
          if (manifest && baseBuild && confidenceBuild && confidenceFixture) {
            try {
              const expectedBuild = compilePreferenceCustodyManifestV38(manifest, baseBuild, confidenceBuild, confidenceFixture);
              if (composition.base_floor_snapshot_sha256 !== sha256(baseBuild)) errors.push('compiled v38 base floor snapshot hash mismatch');
              if (composition.extension_snapshot_sha256 !== sha256(confidenceBuild)) errors.push('compiled v38 extension snapshot hash mismatch');
              if (stable(compiled) !== stable(expectedBuild)) errors.push('compiled v38 build does not deterministically reconstruct from supplied sources');
            } catch (error) {
              errors.push(`compiled v38 source reconstruction failed: ${error instanceof Error ? error.message : String(error)}`);
            }
          }
          const compiledBaseControls = array(compiled?.controls).slice(0, 39);
          """
          )

          validator = 'tools/validate-preference-custody-manifest-v38.mjs'
          replace_once(
              validator,
              """const manifestPath = process.argv[2] ?? 'data/research/preference-custody/control-manifest-v38.json';
          const buildPath = process.argv[3] ?? 'build/research/preference-custody-laboratory-floor-v38.json';
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const build = JSON.parse(readFileSync(buildPath, 'utf8'));
          const errors = [...validatePreferenceCustodyManifestV38(manifest), ...validatePreferenceCustodyManifestV38Build(build)];
          """,
              """const manifestPath = process.argv[2] ?? 'data/research/preference-custody/control-manifest-v38.json';
          const buildPath = process.argv[3] ?? 'build/research/preference-custody-laboratory-floor-v38.json';
          const baseBuildPath = process.argv[4] ?? 'build/research/preference-custody-laboratory-floor-v37.json';
          const confidenceBuildPath = process.argv[5] ?? 'build/research/preference-linkage-confidence-adjudication-assurance.json';
          const confidenceFixturePath = process.argv[6] ?? 'data/research/preference-custody/linkage-confidence-adjudication-assurance.fixture.json';
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const build = JSON.parse(readFileSync(buildPath, 'utf8'));
          const baseBuild = JSON.parse(readFileSync(baseBuildPath, 'utf8'));
          const confidenceBuild = JSON.parse(readFileSync(confidenceBuildPath, 'utf8'));
          const confidenceFixture = JSON.parse(readFileSync(confidenceFixturePath, 'utf8'));
          const errors = [
            ...validatePreferenceCustodyManifestV38(manifest),
            ...validatePreferenceCustodyManifestV38Build(build, manifest, baseBuild, confidenceBuild, confidenceFixture)
          ];
          """
          )

          test_file = 'test/preference-custody-manifest-v38.test.js'
          replace_once(
              test_file,
              """} from '../tools/lib/preference-custody-manifest-v38.mjs';

          execFileSync""",
              """} from '../tools/lib/preference-custody-manifest-v38.mjs';
          import { compilePreferenceLinkageConfidenceAdjudicationAssuranceFixture } from '../tools/lib/preference-linkage-confidence-adjudication-assurance.mjs';

          execFileSync"""
          )
          replace_once(
              test_file,
              """const base = JSON.parse(readFileSync('build/research/preference-custody-laboratory-floor-v37.json', 'utf8'));
          const build = JSON.parse(readFileSync('build/research/preference-custody-laboratory-floor-v38.json', 'utf8'));
          """,
              """const base = JSON.parse(readFileSync('build/research/preference-custody-laboratory-floor-v37.json', 'utf8'));
          const confidenceBuild = JSON.parse(readFileSync('build/research/preference-linkage-confidence-adjudication-assurance.json', 'utf8'));
          const confidenceFixture = JSON.parse(readFileSync('data/research/preference-custody/linkage-confidence-adjudication-assurance.fixture.json', 'utf8'));
          const build = JSON.parse(readFileSync('build/research/preference-custody-laboratory-floor-v38.json', 'utf8'));
          """
          )
          replace_once(
              test_file,
              'assert.deepEqual(validatePreferenceCustodyManifestV38Build(build), []);',
              'assert.deepEqual(validatePreferenceCustodyManifestV38Build(build, manifest, base, confidenceBuild, confidenceFixture), []);'
          )
          replace_once(
              test_file,
              """assert.equal(build.composition.base_controls_sha256.length, 64);
          assert.equal(build.composition.base_promotion_requirements_sha256.length, 64);
          """,
              """assert.equal(build.composition.base_floor_snapshot_sha256.length, 64);
          assert.equal(build.composition.extension_snapshot_sha256.length, 64);
          assert.equal(build.composition.base_controls_sha256.length, 64);
          assert.equal(build.composition.base_promotion_requirements_sha256.length, 64);
          """
          )
          replace_once(
              test_file,
              """const clone = value => structuredClone(value);
          const manifestMutations = [
          """,
              """const clone = value => structuredClone(value);
          assert.ok(validatePreferenceCustodyManifestV38Build(build).length > 0, 'source artifacts are required');
          const revisedBase = clone(base);
          revisedBase.interpretation_contract.copy_ready_caveat += ' Revised source snapshot.';
          assert.ok(
            validatePreferenceCustodyManifestV38Build(build, manifest, revisedBase, confidenceBuild, confidenceFixture).length > 0,
            'valid revised base source paired with stale floor build'
          );
          const revisedConfidenceFixture = clone(confidenceFixture);
          revisedConfidenceFixture.captured_at = '2026-08-04';
          const revisedConfidenceBuild = compilePreferenceLinkageConfidenceAdjudicationAssuranceFixture(revisedConfidenceFixture);
          assert.ok(
            validatePreferenceCustodyManifestV38Build(build, manifest, base, revisedConfidenceBuild, revisedConfidenceFixture).length > 0,
            'valid revised PC-40 source paired with stale floor build'
          );
          const manifestMutations = [
          """
          )
          replace_once(
              test_file,
              """  ['composition extension id', value => { value.composition.extension_control_id = 'PC-39'; }],
            ['base requirement count', value => { value.composition.base_promotion_requirement_count = 1436; }],
          """,
              """  ['composition extension id', value => { value.composition.extension_control_id = 'PC-39'; }],
            ['base snapshot hash binding', value => { value.composition.base_floor_snapshot_sha256 = '0'.repeat(64); }],
            ['extension snapshot hash binding', value => { value.composition.extension_snapshot_sha256 = 'f'.repeat(64); }],
            ['base requirement count', value => { value.composition.base_promotion_requirement_count = 1436; }],
          """
          )
          replace_once(test_file, 'assert.equal(manifestMutations.length + buildMutations.length, 43);', 'assert.equal(manifestMutations.length + buildMutations.length, 45);')
          replace_once(
              test_file,
              '  assert.ok(validatePreferenceCustodyManifestV38Build(value).length > 0, label);',
              '  assert.ok(validatePreferenceCustodyManifestV38Build(value, manifest, base, confidenceBuild, confidenceFixture).length > 0, label);'
          )
          replace_once(
              test_file,
              "console.log('Preference custody floor v38 adversarial tests: PASS (43 mutations)');",
              "console.log('Preference custody floor v38 adversarial tests: PASS (45 mutations plus source-binding succession checks)');"
          )
          PY

          repair_paths=(
            test/preference-custody-manifest-v38.test.js
            tools/lib/preference-custody-manifest-v38.mjs
            tools/validate-preference-custody-manifest-v38.mjs
          )
          mapfile -t observed_repair < <(git diff --name-only | sort)
          mapfile -t expected_repair < <(printf '%s\n' "${repair_paths[@]}" | sort)
          test "$(printf '%s\n' "${observed_repair[@]}")" = "$(printf '%s\n' "${expected_repair[@]}")"

          paths=(
            .github/workflows/preference-custody-v38.yml
            .github/workflows/preference-linkage-confidence-adjudication-assurance.yml
            data/research/preference-custody/control-manifest-v38.json
            data/research/preference-custody/linkage-confidence-adjudication-assurance.fixture.json
            docs/preference-custody-laboratory-floor-v38.md
            docs/preference-custody-linkage-confidence-adjudication-assurance.md
            test/preference-custody-manifest-v38.test.js
            test/preference-linkage-confidence-adjudication-assurance.test.js
            tools/compile-preference-custody-manifest-v38.mjs
            tools/compile-preference-linkage-confidence-adjudication-assurance.mjs
            tools/lib/preference-custody-manifest-v38.mjs
            tools/lib/preference-linkage-confidence-adjudication-assurance.mjs
            tools/validate-preference-custody-manifest-v38.mjs
            tools/validate-preference-linkage-confidence-adjudication-assurance.mjs
          )

          printf '%s\n' "${paths[@]}" | sort > /tmp/pc40-final-paths.expected
          git diff --name-only "$QUALIFIED_PARENT..$publication_base" | sort -u > /tmp/pc40-main-advance-paths.txt
          comm -12 /tmp/pc40-final-paths.expected /tmp/pc40-main-advance-paths.txt > /tmp/pc40-overlap.txt
          test ! -s /tmp/pc40-overlap.txt

          export GIT_INDEX_FILE=/tmp/pc40-review-binding-index
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$publication_base"
          git add -- "${paths[@]}"
          product_tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          product_commit=$(printf '%s\n' 'Preference Custody: bind PC-40 floor snapshots to supplied sources' | git commit-tree "$product_tree" -p "$publication_base")
          unset GIT_INDEX_FILE

          mapfile -t observed_paths < <(git diff-tree --no-commit-id --name-only -r "$product_commit" | sort)
          mapfile -t expected_paths < <(printf '%s\n' "${paths[@]}" | sort)
          test "$(printf '%s\n' "${observed_paths[@]}")" = "$(printf '%s\n' "${expected_paths[@]}")"
          test "${#observed_paths[@]}" -eq 14
          test "$(git rev-parse "$product_commit^")" = "$publication_base"

          git reset --hard "$product_commit"

          node tools/compile-preference-linkage-confidence-adjudication-assurance.mjs
          node tools/validate-preference-linkage-confidence-adjudication-assurance.mjs
          node test/preference-linkage-confidence-adjudication-assurance.test.js
          node tools/compile-preference-custody-manifest-v38.mjs
          node tools/validate-preference-custody-manifest-v38.mjs
          node test/preference-custody-manifest-v38.test.js
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
          test -z "$(git status --porcelain)"

          git fetch origin main "$TARGET_BRANCH" agent/pc40-review-binding-rebase --no-tags
          test "$(git rev-parse origin/main)" = "$publication_base"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET_HEAD"
          test "$(git rev-parse origin/agent/pc40-review-binding-rebase)" = "$source_head"

          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_HEAD" origin "$product_commit:refs/heads/$TARGET_BRANCH"

          export SOURCE_HEAD="$source_head"
          export PUBLICATION_BASE="$publication_base"
          export PRIOR_TARGET_HEAD="$EXPECTED_TARGET_HEAD"
          export PRODUCT_COMMIT="$product_commit"
          export PRODUCT_TREE="$product_tree"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          paths = Path('/tmp/pc40-final-paths.expected').read_text().splitlines()
          files = {}
          for path in paths:
              raw = Path(path).read_bytes()
              files[path] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          canonical = json.dumps(files, sort_keys=True, separators=(',', ':')).encode()
          receipt = {
              'schema_version': 'pc40-review-binding-exact-rebase-receipt@1',
              'source_head': os.environ['SOURCE_HEAD'],
              'qualified_parent': '8a2aa74ea43827447ee8557c41fdc059d2f76a3c',
              'publication_parent': os.environ['PUBLICATION_BASE'],
              'prior_target_head': os.environ['PRIOR_TARGET_HEAD'],
              'product_commit': os.environ['PRODUCT_COMMIT'],
              'product_tree': os.environ['PRODUCT_TREE'],
              'permanent_path_count': len(paths),
              'repair_paths': [
                  'test/preference-custody-manifest-v38.test.js',
                  'tools/lib/preference-custody-manifest-v38.mjs',
                  'tools/validate-preference-custody-manifest-v38.mjs'
              ],
              'main_advance_paths': Path('/tmp/pc40-main-advance-paths.txt').read_text().splitlines(),
              'overlap_paths': Path('/tmp/pc40-overlap.txt').read_text().splitlines(),
              'files': files,
              'file_manifest_sha256': hashlib.sha256(canonical).hexdigest(),
              'focused_pc40': 'pass',
              'floor_v38_mutations': 45,
              'historical_preference_custody_floors': 'pass',
              'no_magic_human': 'pass',
              'release_check': 'pass',
              'outside_human_dependency': False,
              'graph_effect': 'none'
          }
          Path('/tmp/pc40-review-binding-exact-rebase-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Preserve exact repair and rebase receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc40-review-binding-exact-rebase-receipt
          path: |
            /tmp/pc40-review-binding-exact-rebase-receipt.json
            /tmp/pc40-final-paths.expected
            /tmp/pc40-main-advance-paths.txt
            /tmp/pc40-overlap.txt
          if-no-files-found: error
          retention-days: 90
