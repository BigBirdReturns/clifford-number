name: Status-for-sovereignty Wave 01 targeted acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/research/status-sovereignty-wave-01-targeted-acquisition*'
      - 'data/project/status-sovereignty-wave-01-targeted-acquisition-release-manifest.json'
      - 'schemas/status-sovereignty-targeted-acquisition.schema.json'
      - 'docs/milestones/m05-status-sovereignty-wave-01-targeted-acquisition.md'
      - 'tools/*status-sovereignty-wave-01-targeted-acquisition*'
      - 'test/status-sovereignty-wave-01-targeted-acquisition.test.js'
      - 'tools/build-pages.mjs'
      - 'tools/validate-pages.mjs'
      - 'package.json'
      - '.github/workflows/status-sovereignty-wave-01-targeted-acquisition.yml'
  push:
    branches: [main]
    paths:
      - 'data/research/status-sovereignty-wave-01-targeted-acquisition*'
      - 'data/project/status-sovereignty-wave-01-targeted-acquisition-release-manifest.json'
      - 'schemas/status-sovereignty-targeted-acquisition.schema.json'
      - 'docs/milestones/m05-status-sovereignty-wave-01-targeted-acquisition.md'
      - 'tools/*status-sovereignty-wave-01-targeted-acquisition*'
      - 'test/status-sovereignty-wave-01-targeted-acquisition.test.js'
      - 'tools/build-pages.mjs'
      - 'tools/validate-pages.mjs'
      - 'package.json'
      - '.github/workflows/status-sovereignty-wave-01-targeted-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate targeted acquisition
        run: |
          npm run build:status-sovereignty-wave-01-targeted-acquisition
          npm run validate:status-sovereignty-wave-01-targeted-acquisition
          node test/status-sovereignty-wave-01-targeted-acquisition.test.js
      - name: Revalidate frozen Wave 01 review
        run: |
          npm run validate:status-sovereignty-wave-01
          npm run validate:status-sovereignty-wave-01-review
          node test/status-sovereignty-wave-01.test.js
          node test/status-sovereignty-wave-01-review.test.js
      - name: Prove publication hold
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic acquisition products
        run: |
          git restore --staged --worktree .
          npm run build:status-sovereignty-wave-01-targeted-acquisition
          npm run validate:status-sovereignty-wave-01-targeted-acquisition
          git diff --exit-code -- \
            data/project/status-sovereignty-wave-01-targeted-acquisition-release-manifest.json \
            build/core-thesis/status-sovereignty/wave-01-targeted-acquisition/manifest.json \
            build/core-thesis/status-sovereignty/wave-01-targeted-acquisition/data.json \
            reports/core-thesis/status-sovereignty/wave-01-targeted-acquisition/data.json \
            reports/core-thesis/status-sovereignty/wave-01-targeted-acquisition/index.html
