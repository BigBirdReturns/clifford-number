name: Counter-Selector Wave 09 Batch 03 acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-09.yml'
      - 'data/project/counter-selector-wave-09-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b03-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b03.json'
      - 'schemas/counter-selector-artifact-acquisition-b03.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition-b03.md'
      - 'docs/milestones/counter-selector-wave-09.md'
      - 'tools/build-counter-selector-wave-09.mjs'
      - 'tools/validate-counter-selector-wave-09.mjs'
      - 'test/counter-selector-wave-09.test.js'
      - 'reports/core-thesis/counter-selector-wave-09/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-09-b03-acquisition'
    paths:
      - '.github/workflows/counter-selector-wave-09.yml'
      - 'data/project/counter-selector-wave-09-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b03-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b03.json'
      - 'schemas/counter-selector-artifact-acquisition-b03.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition-b03.md'
      - 'docs/milestones/counter-selector-wave-09.md'
      - 'tools/build-counter-selector-wave-09.mjs'
      - 'tools/validate-counter-selector-wave-09.mjs'
      - 'test/counter-selector-wave-09.test.js'
      - 'reports/core-thesis/counter-selector-wave-09/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 09 products
        run: node tools/build-counter-selector-wave-09.mjs
      - name: Validate Batch 03 acquisition contract
        run: node tools/validate-counter-selector-wave-09.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-09.test.js
      - name: Require exact committed Wave 09 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-artifact-acquisition-b03-registry.json \
            data/project/counter-selector-blind-packet-registry-b03.json \
            data/project/counter-selector-wave-09-release-manifest.json \
            reports/core-thesis/counter-selector-wave-09/data.json \
            reports/core-thesis/counter-selector-wave-09/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 09 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-09.mjs
          node tools/validate-counter-selector-wave-09.mjs
          node test/counter-selector-wave-09.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
