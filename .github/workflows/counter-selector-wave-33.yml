name: Counter-Selector Wave 33 package truth table

on:
  pull_request:
    paths:
      - 'data/project/counter-selector-wave-33-*.json'
      - 'schemas/counter-selector-package-truth-table.schema.json'
      - 'docs/methods/counter-selector-handoff-package-truth-table.md'
      - 'docs/milestones/counter-selector-wave-33.md'
      - 'tools/*counter-selector-wave-33*'
      - 'test/counter-selector-wave-33.test.js'
      - 'reports/core-thesis/counter-selector-wave-33/**'
      - '.github/workflows/counter-selector-wave-33.yml'
  push:
    branches:
      - 'agent/counter-selector-wave-33-package-truth-table'
    paths:
      - 'data/project/counter-selector-wave-33-*.json'
      - 'schemas/counter-selector-package-truth-table.schema.json'
      - 'docs/methods/counter-selector-handoff-package-truth-table.md'
      - 'docs/milestones/counter-selector-wave-33.md'
      - 'tools/*counter-selector-wave-33*'
      - 'test/counter-selector-wave-33.test.js'
      - 'reports/core-thesis/counter-selector-wave-33/**'
      - '.github/workflows/counter-selector-wave-33.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 33 products
        run: node tools/build-counter-selector-wave-33.mjs
      - name: Validate package-truth-table contract
        run: node tools/validate-counter-selector-wave-33.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-33.test.js
      - name: Require exact committed Wave 33 products
        run: git diff --exit-code -- data/project/counter-selector-wave-33-package-registry.json data/project/counter-selector-wave-33-release-manifest.json reports/core-thesis/counter-selector-wave-33/data.json reports/core-thesis/counter-selector-wave-33/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 33 deterministically
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-33.mjs
          node tools/validate-counter-selector-wave-33.mjs
          node test/counter-selector-wave-33.test.js
          git diff --exit-code -- data/project/counter-selector-wave-33-package-registry.json data/project/counter-selector-wave-33-release-manifest.json reports/core-thesis/counter-selector-wave-33/data.json reports/core-thesis/counter-selector-wave-33/index.html
          test -z "$(git status --porcelain)"
