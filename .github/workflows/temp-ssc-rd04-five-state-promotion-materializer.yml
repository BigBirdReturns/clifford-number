name: TEMP materialize exact RD-04 four-cell promotion

on:
  push:
    branches: [agent/ssc-rd04-five-state-promotion-materializer-v1]
    paths:
      - '.github/workflows/temp-ssc-rd04-five-state-promotion-materializer.yml'
      - '.tmp/ssc-rd04-five-state-promotion-materializer/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-ssc-rd04-five-state-promotion-materializer.yml'
      - '.tmp/ssc-rd04-five-state-promotion-materializer/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: temp-ssc-rd04-five-state-promotion-materializer
  cancel-in-progress: true

env:
  PRODUCT_PARENT: 86937ea02e7e10223d0854240cd4e0cc9b6716a4
  PRODUCT_BRANCH: agent/ssc-rd04-five-state-promotion-product-v1
  ARCHIVE_BYTES: '45104'
  ARCHIVE_SHA256: d7ee41597453a7c4eaa6a1de0bdb0808ae98ebc878d68e20fff7f5728a718b05

jobs:
  materialize:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'agent/ssc-rd04-five-state-promotion-materializer-v1') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ssc-rd04-five-state-promotion-materializer-v1' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'agent/ssc-rd04-five-state-promotion-materializer-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Reconstruct and authenticate exact product
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$PRODUCT_PARENT"
          test "$(git merge-base HEAD "$PRODUCT_PARENT")" = "$PRODUCT_PARENT"
          cat >/tmp/carrier-paths <<'EOF'
          .github/workflows/temp-ssc-rd04-five-state-promotion-materializer.yml
          .tmp/ssc-rd04-five-state-promotion-materializer/payload-00.b64
          .tmp/ssc-rd04-five-state-promotion-materializer/payload-01.b64
          .tmp/ssc-rd04-five-state-promotion-materializer/payload-02.b64
          .tmp/ssc-rd04-five-state-promotion-materializer/payload-03.b64
          .tmp/ssc-rd04-five-state-promotion-materializer/payload-04.b64
          EOF
          git diff --name-only "$PRODUCT_PARENT" HEAD | sort >/tmp/actual-carrier-paths
          diff -u /tmp/carrier-paths /tmp/actual-carrier-paths
          git diff --check "$PRODUCT_PARENT" HEAD
          cat >/tmp/chunk-sums <<'EOF'
          d3e7ee9c26dfe557ec08458a7b9fc284f07de0cb8bf5095aee6edc9e0bdc309b  .tmp/ssc-rd04-five-state-promotion-materializer/payload-00.b64
          a80195e6feb31bee4202e6b1fa9cc45ab28d79061957a61ccfd5a5fedfe7a6a6  .tmp/ssc-rd04-five-state-promotion-materializer/payload-01.b64
          949cc89ba9a35fff63283a5ebc010262b8cf36694a5effea02d59d221d4c9af1  .tmp/ssc-rd04-five-state-promotion-materializer/payload-02.b64
          d9a450cc508cbe6eda74b078972d1b90e391bf1d592492668197f143a98087da  .tmp/ssc-rd04-five-state-promotion-materializer/payload-03.b64
          a3d2630960e55c8f2f27114c22d1dd4be7ca70c02b44f4a36428e93b76f8a6a3  .tmp/ssc-rd04-five-state-promotion-materializer/payload-04.b64
          EOF
          sha256sum -c /tmp/chunk-sums
          cat .tmp/ssc-rd04-five-state-promotion-materializer/payload-*.b64 | base64 -d >/tmp/product.tar.xz
          test "$(stat -c %s /tmp/product.tar.xz)" = "$ARCHIVE_BYTES"
          test "$(sha256sum /tmp/product.tar.xz | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          rm -rf /tmp/product && mkdir /tmp/product
          tar -xJf /tmp/product.tar.xz -C /tmp/product
          cat >/tmp/product-paths <<'EOF'
          .github/workflows/status-sovereignty-rd-wave03-rd04-five-state-promotion.yml
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/cell-promotion-ledger.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/index.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promoted-partial-field-matrix.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-decisions.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-input-custody.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-summary.json
          data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/remaining-open-field-census.json
          docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md
          schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json
          test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js
          tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          EOF
          (cd /tmp/product && find . -type f -printf '%P\n' | sort) >/tmp/actual-product-paths
          diff -u /tmp/product-paths /tmp/actual-product-paths
          while IFS= read -r path; do ! git cat-file -e "$PRODUCT_PARENT:$path" 2>/dev/null; done </tmp/product-paths
          cat >/tmp/product-sums <<'EOF'
          4313cd204c0159a1fbbee09829a88621908f0a517f7472aea9a72924e572fd77  .github/workflows/status-sovereignty-rd-wave03-rd04-five-state-promotion.yml
          9c8785b51a3c753d593fa07ea9aef49de7534fbec305c2b785e53ec1e97303b0  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/cell-promotion-ledger.json
          7c76c7782dc118f8e94500a5eeca08c95d411c467dd2e251b6024e21baf1f33d  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/index.json
          516806153ddca774b695a85f162bd18134e5f5d722a7b34a23384141ae25fe27  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/product-manifest.json
          46885a3fedfabb0fb6154500982d8234dc4fa67834f8d000f5749ec15914705c  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promoted-partial-field-matrix.json
          df55121a68fe602488be77b87359533749e3ccefc20c20802081f3b60eb3a107  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-decisions.json
          bef82827ba54e4edcc5c3676abf32fa2ef91171bd02e23c8dcfa16b556e5f5db  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-input-custody.json
          89cef0ab5aeafdcf12fa12fce00c4e819be0ba9e1f6b1f1a6a26ad56c50c34c9  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/promotion-summary.json
          ce1581ad8d8e7f0f9fbdb02b4e7510d6b7505825d91c4d97c08b60d9c8ac7ad0  data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion/remaining-open-field-census.json
          f51043a4d647e8575b3e841da64fdd37866ea8407b24662c8d7555267031f43f  docs/milestones/ssc-rd-wave03-rd04-five-state-promotion.md
          ab80ff2eae1d283c089743d977712d78907f9104b557b5ce72dc43f355ac8809  schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json
          8bf490d4cf6cef3379e48919ceb62f7b0a0994d1de031d7c106078172b1d4d23  test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js
          db53d0ca1b5bcba07eccd5b0979a38d87e81a0e307d3fd62259f41da617749ff  tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          d5d7f573cf3a14c505b30b73cd2664b0e2db235213c0a137e90b6af8a8817ba8  tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          EOF
          (cd /tmp/product && sha256sum -c /tmp/product-sums)
          cp -a /tmp/product/. "$GITHUB_WORKSPACE/"

      - name: Initialize fail-closed materialization ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/materialization
          python - <<'PYLEDGER'
          import json, os
          from pathlib import Path
          Path('/tmp/materialization/status.json').write_text(json.dumps({
              'schema_version': 'ssc-rd04-five-state-promotion-materialization-status@1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'canonical_parent': os.environ['PRODUCT_PARENT'],
              'product_branch': os.environ['PRODUCT_BRANCH'],
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'materializer_head': os.environ['GITHUB_SHA'],
              'qualification_state': 'pending',
              'candidate_created': False,
              'ref_updated': False,
              'authority': 'none',
          }, indent=2, sort_keys=True) + '\n')
          PYLEDGER

      - name: Install exact-parent dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Verify product syntax and deterministic bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          sha256sum -c /tmp/product-sums

      - name: Validate recursive product schema
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python - <<'PYSCHEMA'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('schemas/status-sovereignty-rd-wave03-rd04-five-state-promotion.schema.json').read_text())
          v=Draft202012Validator(schema)
          root=Path('data/intake/status-sovereignty-rd-wave03-rd04-five-state-promotion')
          for p in sorted(root.glob('*.json')):
              errors=sorted(v.iter_errors(json.loads(p.read_text())),key=lambda e:list(e.path))
              if errors: raise SystemExit(f'{p}: {errors[0].message} at {list(errors[0].path)}')
          print('recursive_schema_validation=pass')
          PYSCHEMA

      - name: Run product validator and adversarial replay
        shell: bash
        run: |
          set -Eeuo pipefail
          node tools/validate-status-sovereignty-rd-wave03-rd04-five-state-promotion.mjs
          node test/status-sovereignty-rd-wave03-rd04-five-state-promotion.test.js

      - name: Preserve no-magic-human floor
        shell: bash
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js

      - name: Run complete repository release check
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run release:check

      - name: Create exact candidate and receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          parent=os.environ['PRODUCT_PARENT']; branch=os.environ['PRODUCT_BRANCH']
          paths=Path('/tmp/product-paths').read_text().splitlines(); root=Path(os.environ['GITHUB_WORKSPACE'])
          def api(method,path,payload=None,allow=False):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',data=None if payload is None else json.dumps(payload).encode(),method=method)
              for k,v in {'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}.items(): req.add_header(k,v)
              try:
                  with urllib.request.urlopen(req) as r: return r.status,json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  if allow:
                      try: body=json.loads(body)
                      except Exception: body={'raw':body}
                      return e.code,body
                  raise SystemExit(f'{method} {path}: {e.code} {body}')
          _,ref=api('GET','/git/ref/heads/main')
          if ref['object']['sha']!=parent: raise SystemExit('main moved')
          _,pc=api('GET',f'/git/commits/{parent}'); base_tree=pc['tree']['sha']
          entries=[]; files=[]
          for path in paths:
              data=(root/path).read_bytes(); _,blob=api('POST','/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
              files.append({'path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':blob['sha']})
          _,tree=api('POST','/git/trees',{'base_tree':base_tree,'tree':entries})
          _,commit=api('POST','/git/commits',{'message':'Promote four validated RD-04 state-field cells','tree':tree['sha'],'parents':[parent]})
          candidate=commit['sha']
          status,response=api('POST','/git/refs',{'ref':f'refs/heads/{branch}','sha':candidate},allow=True)
          receipt={'schema_version':'ssc-rd04-five-state-promotion-materialization@1','repository':repo,'canonical_parent':parent,'base_tree':base_tree,'candidate_commit':candidate,'candidate_tree':tree['sha'],'product_branch':branch,'ref_update_status':status,'ref_updated':200<=status<300,'ref_response':response,'workflow_run':int(os.environ['GITHUB_RUN_ID']),'materializer_head':os.environ['GITHUB_SHA'],'archive_bytes':int(os.environ['ARCHIVE_BYTES']),'archive_sha256':os.environ['ARCHIVE_SHA256'],'permanent_paths':14,'files':files,'terminal_cells_before':218,'terminal_cells_after':222,'still_open_substantive_cells_before':192,'still_open_substantive_cells_after':188,'row_terminalizations':0,'class_closed':False,'cumulative_ledger_effect':'none','outside_human_dependency':False,'publication_effect':'none','adoption_effect':'none','graph_effect':'none'}
          out=Path('/tmp/materialization'); out.mkdir(exist_ok=True)
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'candidate-sha.txt').write_text(candidate+'\n'); (out/'candidate-tree.txt').write_text(tree['sha']+'\n'); (out/'parent-sha.txt').write_text(parent+'\n'); (out/'product-archive.tar.xz').write_bytes(Path('/tmp/product.tar.xz').read_bytes())
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          (cd /tmp/materialization && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS)

      - name: Seal fail-closed failure receipt
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/materialization
          python - <<'PYFAIL'
          import json, os
          from pathlib import Path
          path=Path('/tmp/materialization/status.json')
          current=json.loads(path.read_text()) if path.exists() else {}
          current.update({
              'schema_version': 'ssc-rd04-five-state-promotion-materialization-status@1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'canonical_parent': os.environ['PRODUCT_PARENT'],
              'product_branch': os.environ['PRODUCT_BRANCH'],
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'materializer_head': os.environ['GITHUB_SHA'],
              'qualification_state': 'failed',
              'candidate_created': False,
              'ref_updated': False,
              'authority': 'none',
          })
          path.write_text(json.dumps(current, indent=2, sort_keys=True) + '\n')
          PYFAIL
          (cd /tmp/materialization && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS)

      - name: Upload materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-five-state-promotion-materialization
          path: /tmp/materialization
          if-no-files-found: error
          retention-days: 90

      - name: Report outcome
        if: always()
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -Eeuo pipefail
          if test -f /tmp/materialization/receipt.json; then
            jq -r '"RD-04 four-cell promotion materialization completed.\n\n```text\ncanonical_parent: \(.canonical_parent)\ncandidate_commit: \(.candidate_commit)\ncandidate_tree: \(.candidate_tree)\npermanent_paths: \(.permanent_paths)\nterminal_cells: \(.terminal_cells_before) -> \(.terminal_cells_after)\nopen_substantive_cells: \(.still_open_substantive_cells_before) -> \(.still_open_substantive_cells_after)\nref_updated: \(.ref_updated)\n```\n\nThis receipt creates one separate candidate only. It grants no row, class, cumulative-ledger, publication, adoption, or graph authority."' /tmp/materialization/receipt.json >/tmp/comment.md
          else
            echo 'RD-04 four-cell promotion materialization failed closed; no candidate or additional authority is represented.' >/tmp/comment.md
          fi
          gh issue comment 1017 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
