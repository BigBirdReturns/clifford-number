name: Thesis case packets

on:
  pull_request:
    paths:
      - 'data/research/thesis-case-packets/**'
      - 'data/research/thesis-evidence/**'
      - 'tools/lib/thesis-case-packet.mjs'
      - 'tools/compile-thesis-case-packets.mjs'
      - 'tools/validate-thesis-case-packets.mjs'
      - 'test/thesis-case-packet.test.js'
      - 'test/thesis-assembly.test.js'
      - 'docs/thesis-case-packets.md'
      - 'package.json'
      - '.github/workflows/thesis-case-packets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thesis-case-packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile bounded case-intake packets
        run: npm run compile:case-packets
      - name: Validate intake and promotion boundaries
        run: npm run validate:case-packets
      - name: Compile updated thesis coverage state
        run: npm run compile:thesis
      - name: Validate thesis remains evidence-free
        run: npm run validate:thesis
      - name: Exercise case-intake fixtures
        run: node test/thesis-case-packet.test.js
      - name: Exercise thesis-state fixtures
        run: node test/thesis-assembly.test.js
      - name: Preserve deterministic intake projections
        uses: actions/upload-artifact@v4
        with:
          name: thesis-state-market-case-intake
          path: |
            build/thesis/case-packet-index.json
            build/thesis/case-packet-index.md
            build/thesis/case-packets/*.json
            build/thesis/case-packets/*.md
            build/thesis/synthetic-population-infrastructure.json
            build/thesis/synthetic-population-infrastructure.md
          if-no-files-found: error
