name: M-05 Sprint 08 A1 support lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-08-*.json'
      - 'docs/methods/answerable-power-a1-support-lifecycle.md'
      - 'docs/milestones/m05-answerable-power-sprint-08.md'
      - 'tools/m05-a1-support-lifecycle.mjs'
      - 'tools/build-m05-answerable-power-sprint-08.mjs'
      - 'tools/validate-m05-answerable-power-sprint-08.mjs'
      - 'test/m05-a1-support-lifecycle.test.js'
      - 'test/m05-answerable-power-sprint-08.test.js'
      - 'reports/core-thesis/answerable-power/sprint-08.*'
      - '.github/ISSUE_TEMPLATE/apc-a1-support-*.yml'
      - '.github/workflows/m05-answerable-power-sprint-08.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-08-*.json'
      - 'docs/methods/answerable-power-a1-support-lifecycle.md'
      - 'docs/milestones/m05-answerable-power-sprint-08.md'
      - 'tools/m05-a1-support-lifecycle.mjs'
      - 'tools/build-m05-answerable-power-sprint-08.mjs'
      - 'tools/validate-m05-answerable-power-sprint-08.mjs'
      - 'test/m05-a1-support-lifecycle.test.js'
      - 'test/m05-answerable-power-sprint-08.test.js'
      - 'reports/core-thesis/answerable-power/sprint-08.*'
      - '.github/ISSUE_TEMPLATE/apc-a1-support-*.yml'
      - '.github/workflows/m05-answerable-power-sprint-08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test Sprint 08
        run: |
          node tools/build-m05-answerable-power-sprint-08.mjs
          node tools/validate-m05-answerable-power-sprint-08.mjs
          node test/m05-a1-support-lifecycle.test.js
          node test/m05-answerable-power-sprint-08.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Sprint 08 products
        run: |
          git restore --staged --worktree .
          node tools/build-m05-answerable-power-sprint-08.mjs
          node tools/validate-m05-answerable-power-sprint-08.mjs
          node test/m05-a1-support-lifecycle.test.js
          node test/m05-answerable-power-sprint-08.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
