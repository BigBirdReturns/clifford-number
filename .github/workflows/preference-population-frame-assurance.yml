name: Preference custody population-frame assurance control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/population-frame-assurance.fixture.json'
      - 'tools/lib/preference-population-frame-assurance.mjs'
      - 'tools/compile-preference-population-frame-assurance.mjs'
      - 'tools/validate-preference-population-frame-assurance.mjs'
      - 'test/preference-population-frame-assurance.test.js'
      - 'docs/preference-custody-population-frame-assurance.md'
      - '.github/workflows/preference-population-frame-assurance.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  population-frame-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node tools/compile-preference-population-frame-assurance.mjs
      - run: node tools/validate-preference-population-frame-assurance.mjs
      - run: node test/preference-population-frame-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-population-frame-assurance-pc35
          path: |
            build/research/preference-population-frame-assurance.json
            build/research/preference-population-frame-assurance.md
          if-no-files-found: error
