name: M-05 request-envelope product materializer

on:
  push:
    branches:
      - agent/m05-s03-l7-request-envelope-materializer-v6
    paths:
      - '.tmp/m05-request-envelope-materializer/**'
      - '.github/workflows/m05-request-envelope-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-request-envelope-materializer-v6
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize exact request-envelope product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .tmp/m05-request-envelope-materializer/materialize.mjs
