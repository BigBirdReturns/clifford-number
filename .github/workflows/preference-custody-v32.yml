name: Preference custody laboratory floor v32

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-source-population-rule-assurance.mjs'
      - 'tools/validate-preference-source-population-rule-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v32.mjs'
      - 'tools/validate-preference-custody-manifest-v32.mjs'
      - 'test/preference-source-population-rule-assurance.test.js'
      - 'test/preference-custody-manifest-v32.test.js'
      - 'docs/preference-custody-source-population-rule-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v32.md'
      - '.github/workflows/preference-source-population-rule-assurance.yml'
      - '.github/workflows/preference-custody-v32.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  floor-v32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          node tools/compile-preference-source-population-rule-assurance.mjs
          node tools/compile-preference-custody-manifest-v32.mjs
      - run: |
          node tools/validate-preference-source-population-rule-assurance.mjs
          node tools/validate-preference-custody-manifest-v32.mjs
      - run: |
          node test/preference-source-population-rule-assurance.test.js
          node test/preference-custody-manifest-v32.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v32
          path: |
            build/research/preference-source-population-rule-assurance.json
            build/research/preference-source-population-rule-assurance.md
            build/research/preference-custody-laboratory-floor-v32.json
            build/research/preference-custody-laboratory-floor-v32.md
          if-no-files-found: error
