name: SSC RD-04 SNAP search replay A03

on:
  push:
    branches:
      - 'agent/ssc-rd04-snap-search-replay-a03'
    paths:
      - '.github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml'
      - 'data/intake/status-sovereignty-rd04-snap-search-replay-a03/**'
      - 'data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json'
      - 'tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py'
      - 'tools/build-status-sovereignty-rd04-snap-search-replay-a03.py'
      - 'build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
      - 'reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml'
      - 'data/intake/status-sovereignty-rd04-snap-search-replay-a03/**'
      - 'data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json'
      - 'tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py'
      - 'tools/build-status-sovereignty-rd04-snap-search-replay-a03.py'
      - 'build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
      - 'reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 200 frozen query receipts and deterministic projections
        run: python tools/build-status-sovereignty-rd04-snap-search-replay-a03.py --repo-root . --check
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Preserve exact A03 products
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-snap-search-replay-a03
          path: |
            data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json
            build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03
            reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03
          if-no-files-found: error
