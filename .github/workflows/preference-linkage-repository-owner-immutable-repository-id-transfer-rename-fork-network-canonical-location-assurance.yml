name: Preference linkage repository owner, immutable repository ID, transfer, rename, fork network, and canonical location assurance

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.fixture.json'
      - 'tools/lib/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs'
      - 'tools/compile-preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs'
      - 'tools/validate-preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs'
      - 'test/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.test.js'
      - 'docs/preference-custody-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.md'
      - '.github/workflows/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc56:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile, validate, and test PC-56
        run: |
          node tools/compile-preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs
          node tools/validate-preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs
          node test/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance
          path: |
            build/research/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.json
            build/research/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.md
          if-no-files-found: error
