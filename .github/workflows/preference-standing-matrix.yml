name: Preference representation validation authority matrix

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/representation-validation-authority-matrix.json'
      - 'data/research/preference-custody/real-cases/times-exploraition-admission.json'
      - 'data/research/preference-custody/real-cases/newsuk-nucleus-human-companion.json'
      - 'data/research/preference-custody/real-cases/yougov-parallax-hybrid-architecture.json'
      - 'data/research/preference-custody/real-cases/twineo-originalvoices-representation-custody.json'
      - 'tools/lib/preference-real-case.mjs'
      - 'tools/lib/preference-human-companion.mjs'
      - 'tools/lib/preference-hybrid-architecture.mjs'
      - 'tools/lib/preference-representation-custody.mjs'
      - 'tools/lib/preference-standing-matrix.mjs'
      - 'tools/compile-preference-standing-matrix.mjs'
      - 'tools/validate-preference-standing-matrix.mjs'
      - 'test/preference-standing-matrix.test.js'
      - 'docs/preference-custody-representation-validation-authority-matrix.md'
      - '.github/workflows/preference-standing-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile representation validation and authority matrix
        run: node tools/compile-preference-standing-matrix.mjs
      - name: Validate orthogonality and source boundaries
        run: node tools/validate-preference-standing-matrix.mjs
      - name: Exercise promotion ranking and tamper fixtures
        run: node test/preference-standing-matrix.test.js
      - name: Preserve deterministic matrix projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-standing-matrix
          path: |
            build/research/preference-real-cases/representation-validation-authority-matrix.json
            build/research/preference-real-cases/representation-validation-authority-matrix.md
          if-no-files-found: error
