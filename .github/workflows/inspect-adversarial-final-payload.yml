name: Inspect adversarial final payload

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp/inspect-final-payload.trigger'
      - '.github/workflows/inspect-adversarial-final-payload.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and recover retained source payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import itertools
          import lzma
          import tarfile
          from io import BytesIO
          from pathlib import Path

          paths = sorted(Path('.github/tmp').glob('final-source-part-*.b64'))
          parts = [b''.join(path.read_bytes().split()) for path in paths]
          print('chunk_lengths', [len(part) for part in parts])
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def test(candidate, label):
              try:
                  compressed = base64.b64decode(candidate, validate=True)
                  payload = lzma.decompress(compressed)
              except Exception:
                  return None
              print('RECOVERED', label)
              print('base64_sha256', hashlib.sha256(candidate).hexdigest(), 'base64_bytes', len(candidate))
              print('compressed_sha256', hashlib.sha256(compressed).hexdigest(), 'compressed_bytes', len(compressed))
              print('payload_sha256', hashlib.sha256(payload).hexdigest(), 'payload_bytes', len(payload))
              Path('/tmp/final-source.recovered.tar').write_bytes(payload)
              try:
                  with tarfile.open(fileobj=BytesIO(payload), mode='r:*') as archive:
                      names = archive.getnames()
                  print('tar_entries', len(names))
                  for name in names[:300]: print(name)
              except Exception as exc:
                  print('payload_not_tar', type(exc).__name__, str(exc))
              return payload

          original = b''.join(parts)
          if test(original, 'unmodified') is not None:
              raise SystemExit(0)

          # The retained transport has one 14,999-byte part and one 15,001-byte part.
          # Test only boundary-local repairs: insert one base64 symbol at a boundary
          # adjacent to the short part and remove one symbol at a boundary adjacent
          # to the long part. XZ integrity is the acceptance oracle.
          short_index = next(i for i, part in enumerate(parts) if len(part) == 14999)
          long_index = next(i for i, part in enumerate(parts) if len(part) == 15001)
          insert_boundaries = sorted(set([
              sum(map(len, parts[:short_index])),
              sum(map(len, parts[:short_index + 1])),
          ]))
          long_start = sum(map(len, parts[:long_index]))
          long_end = long_start + len(parts[long_index])
          remove_positions = sorted(set([
              long_start,
              long_start + 1,
              long_end - 2,
              long_end - 1,
          ]))
          print('short_index', short_index, 'long_index', long_index)
          print('insert_boundaries', insert_boundaries, 'remove_positions', remove_positions)

          attempts = 0
          for insert_at, remove_at, symbol in itertools.product(insert_boundaries, remove_positions, alphabet):
              reduced = original[:remove_at] + original[remove_at + 1:]
              adjusted_insert = insert_at - (1 if remove_at < insert_at else 0)
              candidate = reduced[:adjusted_insert] + bytes([symbol]) + reduced[adjusted_insert:]
              attempts += 1
              payload = test(candidate, f'insert={insert_at}:{chr(symbol)} remove={remove_at}:{chr(original[remove_at])}')
              if payload is not None:
                  print('attempts', attempts)
                  raise SystemExit(0)
          print('NO_BOUNDARY_RECOVERY', attempts)
          raise SystemExit(2)
          PY
