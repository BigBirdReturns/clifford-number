name: Inspect adversarial final payload

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp/inspect-final-payload.trigger'
      - '.github/workflows/inspect-adversarial-final-payload.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and identify retained payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          import re
          from pathlib import Path

          def decode(parts, label):
              paths = sorted(Path('.github/tmp').glob(parts))
              assert paths, (label, 'no chunks')
              raw = b''.join(path.read_bytes() for path in paths)
              compact = b''.join(raw.split())
              invalid = sorted(set(re.sub(rb'[A-Za-z0-9+/=]', b'', compact)))
              print(f'{label}: chunks={len(paths)} raw_bytes={len(raw)} compact_bytes={len(compact)} mod4={len(compact)%4} invalid={invalid!r}')
              for path in paths:
                  body = b''.join(path.read_bytes().split())
                  bad = sorted(set(re.sub(rb'[A-Za-z0-9+/=]', b'', body)))
                  print(f'  {path.name}: bytes={len(body)} mod4={len(body)%4} invalid={bad!r} prefix={body[:16]!r} suffix={body[-16:]!r}')
              assert not invalid, (label, invalid)
              compressed = base64.b64decode(compact, validate=True)
              Path(f'/tmp/{label}.xz').write_bytes(compressed)
              print(f'{label}: compressed_sha256={hashlib.sha256(compressed).hexdigest()} compressed_bytes={len(compressed)}')
              try:
                  payload = lzma.decompress(compressed)
              except Exception as exc:
                  print(f'{label}: DECOMPRESS_FAILED {type(exc).__name__}: {exc}')
                  return False
              Path(f'/tmp/{label}.payload').write_bytes(payload)
              print(f'{label}: payload_sha256={hashlib.sha256(payload).hexdigest()} payload_bytes={len(payload)}')
              return True

          source_ok = decode('final-source-part-*.b64', 'final-source')
          delta_ok = decode('final-delta-part-*.b64', 'final-delta')
          Path('/tmp/payload-status').write_text(f'source_ok={int(source_ok)}\ndelta_ok={int(delta_ok)}\n')
          PY
          cat /tmp/payload-status
          for label in final-source final-delta; do
            test -f "/tmp/${label}.payload" || continue
            echo "--- ${label} file type ---"
            file "/tmp/${label}.payload"
            echo "--- ${label} prefix ---"
            od -An -tx1 -N64 "/tmp/${label}.payload"
            if tar -tf "/tmp/${label}.payload" >"/tmp/${label}-list.txt" 2>/dev/null; then
              echo "${label^^}_IS_TAR"
              wc -l "/tmp/${label}-list.txt"
              sed -n '1,240p' "/tmp/${label}-list.txt"
            else
              echo "--- ${label} textual prefix ---"
              strings -n 8 "/tmp/${label}.payload" | sed -n '1,300p'
            fi
          done
