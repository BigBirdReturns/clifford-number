name: Inspect adversarial final payload

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp/inspect-final-payload.trigger'
      - '.github/workflows/inspect-adversarial-final-payload.yml'
  push:
    branches:
      - agent/adversarial-release-integrity
    paths:
      - '.github/tmp/inspect-final-payload.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and identify retained payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          import re
          from pathlib import Path

          def decode(parts, label):
              paths = sorted(Path('.github/tmp').glob(parts))
              assert paths, (label, 'no chunks')
              raw = b''.join(path.read_bytes() for path in paths)
              compact = b''.join(raw.split())
              invalid = sorted(set(re.sub(rb'[A-Za-z0-9+/=]', b'', compact)))
              print(f'{label}: chunks={len(paths)} raw_bytes={len(raw)} compact_bytes={len(compact)} mod4={len(compact)%4} invalid={invalid!r}')
              for path in paths:
                  data = path.read_bytes()
                  body = b''.join(data.split())
                  bad = sorted(set(re.sub(rb'[A-Za-z0-9+/=]', b'', body)))
                  print(f'  {path.name}: raw={len(data)} compact={len(body)} mod4={len(body)%4} invalid={bad!r} prefix={body[:16]!r} suffix={body[-16:]!r}')
              assert not invalid, (label, invalid)
              compressed = base64.b64decode(compact, validate=True)
              payload = lzma.decompress(compressed)
              Path(f'/tmp/{label}.xz').write_bytes(compressed)
              Path(f'/tmp/{label}.payload').write_bytes(payload)
              print(f'{label}: compressed_sha256={hashlib.sha256(compressed).hexdigest()} compressed_bytes={len(compressed)} payload_sha256={hashlib.sha256(payload).hexdigest()} payload_bytes={len(payload)}')

          decode('final-source-part-*.b64', 'final-source')
          decode('final-delta-part-*.b64', 'final-delta')
          PY
          echo '--- file types ---'
          file /tmp/final-source.payload /tmp/final-delta.payload
          echo '--- prefixes ---'
          od -An -tx1 -N64 /tmp/final-source.payload
          od -An -tx1 -N64 /tmp/final-delta.payload
          echo '--- tar listings when applicable ---'
          if tar -tf /tmp/final-source.payload >/tmp/source-list.txt 2>/dev/null; then
            echo SOURCE_IS_TAR
            wc -l /tmp/source-list.txt
            sed -n '1,200p' /tmp/source-list.txt
          fi
          if tar -tf /tmp/final-delta.payload >/tmp/delta-list.txt 2>/dev/null; then
            echo DELTA_IS_TAR
            wc -l /tmp/delta-list.txt
            sed -n '1,200p' /tmp/delta-list.txt
          fi
          echo '--- textual prefixes when applicable ---'
          strings -n 8 /tmp/final-source.payload | sed -n '1,160p'
          strings -n 8 /tmp/final-delta.payload | sed -n '1,240p'
