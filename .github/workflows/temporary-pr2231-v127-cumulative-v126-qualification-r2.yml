name: Temporary PR 2231 V127 cumulative V126 qualification R2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v127-cumulative-v126-r2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v127-r2:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v127-cumulative-v126-qualification-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v127-cumulative-v126-qualification-r2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute the corrected read-only V127 qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          repo=BigBirdReturns/clifford-number
          payload_blob=65b28c7aaa55acc4b3f0b2e65886252b11e5a591
          payload_size=6416
          payload_sha256=c9f174154ce1c29fd9d9f724c75d0c1638c2f18926ec5a8cc6e5c1a34c145fdf
          qualifier_blob=82ae9edf0296c5a39c26fc2c887e129436a03775
          qualifier_size=27597
          qualifier_sha256=162d93ae813b1614ba6a2d6c96231fe933751e778df3bec0c509ea3eeaf36827
          envelope=/tmp/pr2231-v127-cumulative-v126-controller-r2
          payload="$envelope/qualifier-v127-r2.sh.xz"
          qualifier="$envelope/qualifier-v127-r2.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-cumulative-qualification-r2\n' "$rc" > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          test "$CONTROLLER_BRANCH" = "$EXPECTED_CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          gh api "repos/$repo/git/blobs/$payload_blob" --jq '.content' \
            | tr -d '\n' | base64 -d > "$payload"
          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          xz -dc "$payload" > "$qualifier"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          printf 'payload_blob=%s\npayload_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\ncorrected_url_job=%s\n' \
            "$payload_blob" "$payload_sha256" "$qualifier_blob" "$qualifier_sha256" 100160814554 \
            > "$envelope/qualifier-provenance.txt"
          bash "$qualifier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v127-cumulative-v126-qualification-r2
          path: |
            /tmp/pr2231-v127-cumulative-v126-qualification-v1
            /tmp/pr2231-v127-cumulative-v126-controller-r2
          if-no-files-found: error
          retention-days: 90
