name: Preference custody laboratory floor v59

on:
  pull_request:
    paths:
      - '.github/workflows/preference-custody-v59.yml'
      - 'data/research/preference-custody/control-manifest-v59.json'
      - 'docs/preference-custody-laboratory-floor-v59.md'
      - 'test/preference-custody-manifest-v59.test.js'
      - 'tools/compile-preference-custody-manifest-v59.mjs'
      - 'tools/lib/preference-custody-manifest-v59.mjs'
      - 'tools/validate-preference-custody-manifest-v59.mjs'
      - '.github/workflows/preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.yml'
      - 'data/research/preference-custody/preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.fixture.json'
      - 'docs/preference-custody-repository-owner-login-unicode-casefold-alias-reuse-assurance.md'
      - 'test/preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.test.js'
      - 'tools/compile-preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.mjs'
      - 'tools/lib/preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.mjs'
      - 'tools/validate-preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/preference-custody-v59.yml'
      - 'data/research/preference-custody/control-manifest-v59.json'
      - 'docs/preference-custody-laboratory-floor-v59.md'
      - 'test/preference-custody-manifest-v59.test.js'
      - 'tools/compile-preference-custody-manifest-v59.mjs'
      - 'tools/lib/preference-custody-manifest-v59.mjs'
      - 'tools/validate-preference-custody-manifest-v59.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile, validate, and test floor v59
        run: |
          node tools/compile-preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.mjs
          node tools/validate-preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.mjs
          node test/preference-linkage-repository-owner-login-unicode-casefold-alias-reuse-assurance.test.js
          node tools/compile-preference-custody-manifest-v59.mjs
          node tools/validate-preference-custody-manifest-v59.mjs
          node test/preference-custody-manifest-v59.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
      - name: Preserve deterministic floor-v59 build
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-floor-v59
          path: |
            build/research/preference-custody-laboratory-floor-v59.json
            build/research/preference-custody-laboratory-floor-v59.md
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
