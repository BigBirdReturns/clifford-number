name: TEMP replay exact 2026 School.House related-charity Form 990 member

on:
  pull_request:
    paths:
      - '.github/workflows/temp-schoolhouse-honor-foundation-990-official-xml-replay.yml'
      - '.schoolhouse-honor-foundation-990-official-xml-replay/EXECUTE'
      - '.schoolhouse-honor-foundation-990-official-xml-replay/capture.py.gz.b64'
  workflow_dispatch:

concurrency:
  group: temp-schoolhouse-honor-foundation-990-official-xml-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact replay head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate replay custody
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_MAIN='1f04c0abbf89f1529dfd428389392b3425499bc3'
          BUNDLE='.schoolhouse-honor-foundation-990-official-xml-replay/capture.py.gz.b64'
          EXECUTE='.schoolhouse-honor-foundation-990-official-xml-replay/EXECUTE'
          WORKFLOW='.github/workflows/temp-schoolhouse-honor-foundation-990-official-xml-replay.yml'
          RUNNER='/tmp/capture-schoolhouse-honor-foundation-990-official-xml-replay.py'
          EXPECTED_RUNNER_SHA='9392399ee813436e687bc11e104c1ff8f877bb6b8e4d128d09192331c6546826'
          EXPECTED_BUNDLE_SHA='73860eef519e9661bfae50d528197187b5415ae28744b9161224aefe865f7a7a'

          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          MERGE_BASE=$(git merge-base HEAD origin/main)
          printf 'main_sha=%s\nmerge_base=%s\n' "$MAIN_SHA" "$MERGE_BASE"
          git merge-base --is-ancestor "$BASE_MAIN" "$MAIN_SHA"
          test "$MERGE_BASE" = "$BASE_MAIN"

          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          grep -Fx "runner_sha256=$EXPECTED_RUNNER_SHA" "$EXECUTE"
          grep -Fx "bundle_sha256=$EXPECTED_BUNDLE_SHA" "$EXECUTE"
          grep -Fx "base_main=$BASE_MAIN" "$EXECUTE"
          grep -Fx 'baseline_workflow_run_id=31046749910' "$EXECUTE"
          grep -Fx 'baseline_artifact_id=8946750753' "$EXECUTE"
          grep -Fx 'baseline_artifact_digest=sha256:bbcf217317fa5b3b9d68b28c0c5b9ab6c34a10ed1e09a247f9582c4f4203977d' "$EXECUTE"
          grep -Fx 'baseline_error_message_sha256=9e8cf12812ac8d870cdb87e8e93437612d15085fea8e97ad1b93a0d29cf766e1' "$EXECUTE"
          grep -Fx 'expected_ein=462952873' "$EXECUTE"
          grep -Fx 'object_id=202641259349300124' "$EXECUTE"
          grep -Fx 'batch_id=2026_TEOS_XML_05A' "$EXECUTE"
          grep -Fx 'maximum_total_requests=1' "$EXECUTE"
          grep -Fx 'maximum_parallel_workers=1' "$EXECUTE"
          grep -Fx 'maximum_zip_bytes_per_batch=2000000000' "$EXECUTE"
          grep -Fx 'maximum_xml_bytes_per_filing=100000000' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"

          mapfile -t CHANGED < <(git diff --name-only "$BASE_MAIN"..HEAD | sort)
          EXPECTED=(
            '.github/workflows/temp-schoolhouse-honor-foundation-990-official-xml-replay.yml'
            '.schoolhouse-honor-foundation-990-official-xml-replay/EXECUTE'
            '.schoolhouse-honor-foundation-990-official-xml-replay/capture.py.gz.b64'
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          for i in "${!EXPECTED[@]}"; do
            test "${CHANGED[$i]}" = "${EXPECTED[$i]}"
          done
          git diff --exit-code -- "$BUNDLE" "$EXECUTE" "$WORKFLOW"

          base64 -d "$BUNDLE" | gzip -dc > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA"
          python -m py_compile "$RUNNER"

      - name: Execute one exact serialized replay
        shell: bash
        run: |
          set -Eeuo pipefail

          OUT='/tmp/schoolhouse-honor-foundation-990-official-xml-replay'
          rm -rf "$OUT"
          python /tmp/capture-schoolhouse-honor-foundation-990-official-xml-replay.py --output "$OUT"

          for file in \
            batch-attempts.jsonl \
            filing-receipts.jsonl \
            term-hits.jsonl \
            structural-signals.jsonl \
            summary.json \
            route-policy.json \
            adjudication.json \
            artifact-manifest.json \
            SHA256SUMS; do
            test -f "$OUT/$file"
          done

          (cd "$OUT" && sha256sum -c SHA256SUMS)
          cat "$OUT/summary.json"
          cat "$OUT/batch-attempts.jsonl"
          cat "$OUT/filing-receipts.jsonl"
          cat "$OUT/structural-signals.jsonl"
          cat "$OUT/term-hits.jsonl"

          count_rows() { awk 'NF { count++ } END { print count + 0 }' "$1"; }

          jq -e '
            .acquisition_phase == "bounded_exact_member_replay" and
            .baseline_workflow_run_id == 31046749910 and
            .baseline_artifact_id == 8946750753 and
            .baseline_artifact_digest == "sha256:bbcf217317fa5b3b9d68b28c0c5b9ab6c34a10ed1e09a247f9582c4f4203977d" and
            .declared_filings == 1 and
            .official_batch_requests == 1 and
            .official_batch_attempt_rows == 1 and
            .terminal_filing_rows == 1 and
            (.successful_filing_rows + .source_unavailable_filing_rows) == 1 and
            .structural_signal_rows == .successful_filing_rows and
            .term_hit_rows == (.direct_subject_or_mechanism_term_hit_rows + .candidate_person_context_hit_rows) and
            .exact_member_unavailable_after_replay_rows >= 0 and
            .exact_member_unavailable_after_replay_rows <= 1 and
            .raw_zip_retained == false and
            .raw_xml_retained == false and
            .full_visible_text_retained == false and
            .source_value_text_retained == false and
            .street_address_rows_retained == 0 and
            .contact_detail_rows_retained == 0 and
            .private_support_rows == 0 and
            .identities_admitted == 0 and
            .relationships_admitted == 0 and
            .negative_existence_claims_created == 0 and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none"
          ' "$OUT/summary.json"

          test "$(count_rows "$OUT/batch-attempts.jsonl")" -eq 1
          test "$(count_rows "$OUT/filing-receipts.jsonl")" -eq 1
          test "$(count_rows "$OUT/structural-signals.jsonl")" -eq "$(jq -r '.structural_signal_rows' "$OUT/summary.json")"
          test "$(count_rows "$OUT/term-hits.jsonl")" -eq "$(jq -r '.term_hit_rows' "$OUT/summary.json")"

          jq -s -e '
            length == 1 and
            all(
              .acquisition_phase == "bounded_exact_member_replay" and
              .baseline_workflow_run_id == 31046749910 and
              .baseline_artifact_id == 8946750753 and
              .baseline_artifact_digest == "sha256:bbcf217317fa5b3b9d68b28c0c5b9ab6c34a10ed1e09a247f9582c4f4203977d" and
              .baseline_error_message_sha256 == "9e8cf12812ac8d870cdb87e8e93437612d15085fea8e97ad1b93a0d29cf766e1" and
              .processing_year == 2026 and
              .object_id == "202641259349300124" and
              .xml_batch_id == "2026_TEOS_XML_05A" and
              .request_method == "GET" and
              .raw_zip_retained == false and
              .raw_xml_retained == false and
              .street_address_rows_retained == 0 and
              .contact_detail_rows_retained == 0 and
              .private_support_rows == 0 and
              .identity_admitted == false and
              .relationship_admitted == false and
              .negative_existence_claim_created == false and
              .outside_human_dependency == false and
              .publication_effect == "none" and
              .adoption_effect == "none" and
              .graph_effect == "none" and
              .promotes_to == "candidate_only"
            )
          ' "$OUT/batch-attempts.jsonl"

          jq -s -e '
            length == 1 and
            all(
              .acquisition_phase == "bounded_exact_member_replay" and
              .expected_ein == "462952873" and
              .object_id == "202641259349300124" and
              .xml_batch_id == "2026_TEOS_XML_05A" and
              .raw_zip_retained == false and
              .raw_xml_retained == false and
              .full_visible_text_retained == false and
              .source_value_text_retained == false and
              .street_address_rows_retained == 0 and
              .contact_detail_rows_retained == 0 and
              .private_support_rows == 0 and
              .identity_admitted == false and
              .relationship_admitted == false and
              .negative_existence_claim_created == false and
              .outside_human_dependency == false and
              .publication_effect == "none" and
              .adoption_effect == "none" and
              .graph_effect == "none" and
              .promotes_to == "candidate_only"
            )
          ' "$OUT/filing-receipts.jsonl"

          jq -e '
            .selection_contract.declared_filings == 1 and
            .selection_contract.expected_ein == "462952873" and
            .selection_contract.object_id == "202641259349300124" and
            .selection_contract.only_baseline_failed_route_replayed == true and
            .selection_contract.no_alternate_source_routes == true and
            .selection_contract.no_result_spawned_routes == true and
            .selection_contract.no_person_selected_because_of_private_contact == true and
            .request_bounds.request_methods == ["GET"] and
            .request_bounds.maximum_total_requests == 1 and
            .request_bounds.maximum_parallel_workers == 1 and
            .request_bounds.maximum_zip_bytes_per_batch == 2000000000 and
            .request_bounds.maximum_xml_bytes_per_filing == 100000000 and
            .request_bounds.interactive_search_submissions == 0 and
            .request_bounds.forms_submitted == 0 and
            .request_bounds.external_discovered_links_fetched == 0 and
            .retention.raw_zip_retained == false and
            .retention.raw_xml_retained == false and
            .retention.full_visible_text_retained == false and
            .retention.source_value_text_retained == false and
            .retention.zip_member_names_retained == false and
            .retention.street_address_rows_retained == 0 and
            .retention.contact_detail_rows_retained == 0 and
            .retention.private_support_rows == 0 and
            .interpretation.person_name_is_context_only == true and
            .interpretation.direct_term_hits_require_complete_schedule_context == true and
            .interpretation.zero_term_hits_are_not_absence_evidence == true and
            .interpretation.provider_errors_are_not_absence_evidence == true and
            .interpretation.zero_exact_member_matches_after_one_replay_are_not_absence_evidence == true and
            .interpretation.schedule_presence_is_not_relationship_evidence == true and
            .interpretation.no_identity_or_relationship_may_be_admitted_by_this_acquisition == true and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none"
          ' "$OUT/route-policy.json"

          jq -e '
            .declared_filings == 1 and
            .legal_identity_admitted == false and
            .fiscal_sponsor_relationship_admitted == false and
            .related_party_relationship_admitted == false and
            .negative_existence_claim_created == false and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none" and
            .promotes_to == "candidate_only"
          ' "$OUT/adjudication.json"

      - name: Upload terminal exact-replay artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schoolhouse-honor-foundation-990-official-xml-replay
          path: /tmp/schoolhouse-honor-foundation-990-official-xml-replay
          if-no-files-found: error
          retention-days: 90
