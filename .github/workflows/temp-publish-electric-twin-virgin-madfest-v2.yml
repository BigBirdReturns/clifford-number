name: TEMP rebind Electric Twin Virgin MADFest topology

on:
  push:
    branches:
      - agent/electric-twin-funding-primary-source-transport-v1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebind, qualify, and publish one clean product commit
        shell: bash
        env:
          CANDIDATE_BRANCH: candidate/electric-twin-virgin-madfest-topology-v1
          EXPECTED_OLD_CANDIDATE: e3a8919f7e26fc0fefb210ad3add2843e992150c
        run: |
          set -euo pipefail
          base64 -d .github/temporary/apply-electric-twin-virgin-madfest-v1.mjs.gz.b64 \
            | gzip -d > /tmp/apply-electric-twin-virgin-madfest-v1.mjs
          echo '9e7dc408890f52cf499ae47b3f3e52f3d457e17ae1f89631255f5aba40277ecc  /tmp/apply-electric-twin-virgin-madfest-v1.mjs' | sha256sum -c -
          node --check /tmp/apply-electric-twin-virgin-madfest-v1.mjs

          git fetch --no-tags origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')" = "$EXPECTED_OLD_CANDIDATE"
          rm -rf /tmp/electric-twin-virgin-madfest-product
          git worktree add --detach /tmp/electric-twin-virgin-madfest-product "$BASE_SHA"
          cd /tmp/electric-twin-virgin-madfest-product
          git checkout -B "$CANDIDATE_BRANCH"
          test -z "$(git status --porcelain)"

          node /tmp/apply-electric-twin-virgin-madfest-v1.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path

          def read_json(path):
              return json.loads(Path(path).read_text())

          def count_jsonl(path):
              return sum(1 for line in Path(path).read_text().splitlines() if line.strip())

          path = Path('data/research/clifford-cross-corpus-public-interest-map.json')
          doc = read_json(path)
          scout_count = len(read_json('build/scout-report.json').get('findings', []))
          canonical = doc['inventory']['canonical']
          canonical['actors'] = len(read_json('data/canonical/actors.json')['actors'])
          canonical['organizations'] = len(read_json('data/canonical/organizations.json')['organizations'])
          canonical['surfaces'] = count_jsonl('data/ledger/surfaces.jsonl')
          canonical['participations'] = count_jsonl('data/ledger/participation.jsonl')
          canonical['receipts'] = count_jsonl('data/ledger/receipts.jsonl')
          canonical['compiled_hop_edges'] = len(read_json('build/hop-graph.json').get('edges', []))
          doc['inventory']['discovery_queue']['scout_findings'] = scout_count
          lane = next(row for row in doc['lanes'] if row['lane_id'] == 'official-research-fanout')
          lane['counts']['scout_findings'] = scout_count
          path.write_text(json.dumps(doc, indent=2) + '\n')
          PY

          npm run release:check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildAdjacency, shortestPath } from './tools/lib/hops.mjs';
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const json = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const jsonl = p => fs.readFileSync(p, 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const surfaceId = 'electric-twin-virgin-madfest-session-2026-07-08';
          const receiptId = 'madfest-electric-twin-virgin-session-2026-07-08';
          const hop = json('build/hop-graph.json');
          const scores = json('build/scores.json');
          const parts = jsonl('data/ledger/participation.jsonl').filter(r => r.surface_id === surfaceId);
          const pair = e => [e.actor_a, e.actor_b].sort().join('|');
          const expected = [
            'ben-warner|james-tyrrell',
            'ben-warner|michael-barber-virgin',
            'james-tyrrell|michael-barber-virgin',
          ].sort();
          const edges = hop.edges.filter(e => e.surfaces.some(s => s.surface_id === surfaceId));
          assert(edges.length === 3, 'expected exactly three MADFest bases');
          assert(JSON.stringify(edges.map(pair).sort()) === JSON.stringify(expected), 'MADFest pair-set drift');
          assert(JSON.stringify(parts.filter(r => r.participant_type === 'actor').map(r => r.actor_id).sort()) ===
            JSON.stringify(['ben-warner', 'james-tyrrell', 'michael-barber-virgin']), 'actor denominator drift');
          assert(JSON.stringify(parts.filter(r => r.participant_type === 'organization').map(r => r.organization_id).sort()) ===
            JSON.stringify(['electric-twin', 'virgin']), 'organization denominator drift');
          const topology = buildAdjacency(hop.edges);
          for (const actorId of ['james-tyrrell', 'michael-barber-virgin']) {
            assert(scores.actors.find(r => r.actor_id === actorId)?.clifford_number === 3, `${actorId} score drift`);
            assert(JSON.stringify(shortestPath(topology, actorId, 'matt-clifford').actor_path) ===
              JSON.stringify([actorId, 'ben-warner', 'marc-warner', 'matt-clifford']), `${actorId} route drift`);
            assert(shortestPath(topology, actorId, 'matt-clifford', { asOf: '2026-07-08' }).number === null,
              `${actorId} received a false contemporaneous route`);
          }
          const receipt = jsonl('data/ledger/receipts.jsonl').find(r => r.receipt_id === receiptId);
          assert(receipt?.archive?.ref ===
            'sha256:5cbbcb8f7fa18c0c29e2f97dea26ebb1608b02a28463c1af5e48a7b6e5451c13', 'receipt digest drift');
          assert(receipt?.shared_stage_confirmed === true && receipt?.agenda_listing_alone_treated_as_attendance === false,
            'attendance boundary drift');
          assert(receipt?.virgin_identity_scope === 'source_name_only' && receipt?.virgin_legal_entity_resolved === false,
            'Virgin identity boundary drift');
          NODE

          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          cat > /tmp/expected-paths <<'EOF'
          build/axm-identity.json
          build/build-hop-report.json
          build/hop-graph.json
          build/migration-review.md
          build/migration-summary.json
          build/receipt-graph.json
          build/scores.json
          build/scout-report.json
          build/scout-report.md
          build/surface-graph.json
          data/canonical/actors.json
          data/canonical/aliases.json
          data/canonical/organizations.json
          data/ledger/claims.jsonl
          data/ledger/participation.jsonl
          data/ledger/receipts.jsonl
          data/ledger/surfaces.jsonl
          data/research/clifford-cross-corpus-public-interest-map.json
          receipts/topology/madfest-electric-twin-virgin-session-2026-07-08.md
          test/compiler.test.js
          tools/validate-release.mjs
          EOF
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          if grep -E '(^|/)\.github(/|$)' /tmp/actual-paths; then
            echo 'transport path entered permanent product' >&2
            exit 1
          fi

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')" = "$EXPECTED_OLD_CANDIDATE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'topology: admit Electric Twin and Virgin MADFest session'
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = '1'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$EXPECTED_OLD_CANDIDATE" origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          {
            echo '## Rebound Electric Twin × Virgin MAD//Fest product'
            echo
            echo '```text'
            echo "commit $(git rev-parse HEAD)"
            echo "tree   $(git rev-parse HEAD^{tree})"
            echo "parent $(git rev-parse HEAD^)"
            echo "replaced $EXPECTED_OLD_CANDIDATE"
            echo 'delta  actors +2 | organizations +1 | surfaces +1 | participation +5 | receipts +1 | claims +2 | edges +3 | refusals +0'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
