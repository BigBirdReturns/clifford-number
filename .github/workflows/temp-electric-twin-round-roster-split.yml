name: Temporary Electric Twin round-roster split materializer

on:
  push:
    branches:
      - agent/electric-twin-funding-primary-source-transport-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact transport ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild, qualify, publish, and retire transport
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_MAIN="14538b35f9051d21bb431533f38e0b6a512d3606"
          EXPECTED_OLD_PRODUCT="6bc32f87e34120a02aabc2afe6fab2cedccee690"
          PRODUCT_BRANCH="candidate/electric-twin-funding-primary-source-v1"
          TRANSPORT_BRANCH="agent/electric-twin-funding-primary-source-transport-v1"
          HELPER_PATH=".github/temporary/apply-electric-twin-round-roster-split.py"
          HELPER="$(mktemp)"
          trap 'rm -f "$HELPER"' EXIT

          git fetch origin main "$PRODUCT_BRANCH" "$TRANSPORT_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$PRODUCT_BRANCH)" = "$EXPECTED_OLD_PRODUCT"
          git show "origin/$TRANSPORT_BRANCH:$HELPER_PATH" > "$HELPER"
          python -m py_compile "$HELPER"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$PRODUCT_BRANCH" "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"

          python "$HELPER"
          npm run release:check

          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          def rows(path):
              return [json.loads(line) for line in Path(path).read_text(encoding='utf-8').splitlines() if line.strip()]

          old_receipt = 'tech-eu-electric-twin-seed-round-2026-02-12'
          new_receipt = 'alex-cooper-linkedin-electric-twin-investor-roster-2026-02-12'
          round_surface_id = 'electric-twin-seed-round-2026-02-11'
          roster_surface_id = 'electric-twin-investor-roster-observation-2026-02-12'

          surfaces = rows('data/ledger/surfaces.jsonl')
          participation = rows('data/ledger/participation.jsonl')
          receipts = rows('data/ledger/receipts.jsonl')
          hop = json.loads(Path('build/hop-graph.json').read_text(encoding='utf-8'))
          surface_graph = json.loads(Path('build/surface-graph.json').read_text(encoding='utf-8'))
          receipt_graph = json.loads(Path('build/receipt-graph.json').read_text(encoding='utf-8'))
          scout = json.loads(Path('build/scout-report.json').read_text(encoding='utf-8'))
          public_map = json.loads(Path('data/research/clifford-cross-corpus-public-interest-map.json').read_text(encoding='utf-8'))
          baseline = json.loads(subprocess.check_output(
              ['git', 'show', '14538b35f9051d21bb431533f38e0b6a512d3606:build/hop-graph.json'],
              text=True,
          ))

          terminal = {
              'surfaces': len(surfaces),
              'participations': len(participation),
              'receipts': len(receipts),
              'hop_edges': len(hop.get('edges', [])),
              'rejected_hop_surfaces': len(hop.get('rejected_hop_surfaces', [])),
              'rejected_hop_pairs': len(hop.get('rejected_hop_pairs', [])),
              'scout_findings': len(scout.get('findings', [])),
          }
          expected_terminal = {
              'surfaces': 23,
              'participations': 189,
              'receipts': 55,
              'hop_edges': 27,
              'rejected_hop_surfaces': 17,
              'rejected_hop_pairs': 0,
              'scout_findings': 140,
          }
          assert terminal == expected_terminal, (terminal, expected_terminal)
          assert public_map['inventory']['canonical'] == {
              'actors': 139,
              'organizations': 25,
              'surfaces': 23,
              'participations': 189,
              'receipts': 55,
              'compiled_hop_edges': 27,
          }

          receipt_ids = [row['receipt_id'] for row in receipts]
          assert old_receipt not in receipt_ids
          assert receipt_ids.count(new_receipt) == 1
          assert not Path('receipts/topology/tech-eu-electric-twin-seed-round-2026-02-12.md').exists()
          assert Path('receipts/topology/alex-cooper-linkedin-electric-twin-investor-roster-2026-02-12.md').exists()
          compiled_receipt_ids = [row['receipt_id'] for row in receipt_graph.get('receipts', [])]
          assert old_receipt not in compiled_receipt_ids
          assert compiled_receipt_ids.count(new_receipt) == 1

          surface_by_id = {row['surface_id']: row for row in surface_graph.get('surfaces', [])}
          round_surface = surface_by_id[round_surface_id]
          roster_surface = surface_by_id[roster_surface_id]
          assert round_surface['hop_eligible'] is False
          assert round_surface['hop_refusal_reason'] == 'single_named_actor_on_round_specific_source'
          assert round_surface['receipt_ids'] == ['electric-twin-seed-round-announcement-2026-02-11']
          round_actors = [row['actor_id'] for row in round_surface.get('participants', []) if row.get('participant_type') == 'actor']
          assert round_actors == ['marc-andreessen']
          assert roster_surface['hop_eligible'] is True
          assert roster_surface['surface_type'] == 'employment_investment_surface'
          assert roster_surface['secondary_surface_types'] == ['directory_roster_surface', 'surface_factory_capital_layer']
          assert roster_surface['time_start'] == roster_surface['time_end'] == '2026-02-12'
          assert roster_surface['receipt_ids'] == [new_receipt]
          roster_actors = sorted(row['actor_id'] for row in roster_surface.get('participants', []) if row.get('participant_type') == 'actor')
          assert roster_actors == ['cal-henderson', 'eric-salama', 'louis-mosley', 'marc-andreessen', 'tom-shinner']
          assert len(roster_surface.get('participants', [])) == 10

          round_bases = [
              basis
              for edge in hop.get('edges', [])
              for basis in edge.get('surfaces', [])
              if basis.get('surface_id') == round_surface_id
          ]
          roster_bases = [
              basis
              for edge in hop.get('edges', [])
              for basis in edge.get('surfaces', [])
              if basis.get('surface_id') == roster_surface_id
          ]
          assert round_bases == []
          assert len(roster_bases) == 10
          assert all(basis.get('evidence_class') == 'primary_public' for basis in roster_bases)
          assert all(basis.get('receipt_ids') == [new_receipt] for basis in roster_bases)
          assert all(basis.get('valid_from') == basis.get('valid_until') == '2026-02-12' for basis in roster_bases)
          roster_edges = [
              edge for edge in hop.get('edges', [])
              if any(basis.get('surface_id') == roster_surface_id for basis in edge.get('surfaces', []))
          ]
          assert len(roster_edges) == 10
          assert all(edge.get('evidence_weight') == 1.25 for edge in roster_edges)

          pairs = lambda graph: sorted(
              tuple(sorted((edge['actor_a'], edge['actor_b'])))
              for edge in graph.get('edges', [])
          )
          assert pairs(hop) == pairs(baseline)
          print('terminal=' + json.dumps(terminal, sort_keys=True))
          print('edge_set_unchanged=true')
          print('round_specific_hop_refused=true')
          print('roster_actor_bases=10')
          PY

          git diff --check
          git add -A
          git diff --cached --check

          python - <<'PY'
          import subprocess

          expected = {
              'build/axm-identity.json',
              'build/build-hop-report.json',
              'build/hop-graph.json',
              'build/migration-review.md',
              'build/migration-summary.json',
              'build/receipt-graph.json',
              'build/scores.json',
              'build/scout-report.json',
              'build/scout-report.md',
              'build/surface-graph.json',
              'data/ledger/participation.jsonl',
              'data/ledger/receipts.jsonl',
              'data/ledger/surfaces.jsonl',
              'data/research/clifford-cross-corpus-public-interest-map.json',
              'receipts/topology/alex-cooper-linkedin-electric-twin-investor-roster-2026-02-12.md',
              'receipts/topology/tech-eu-electric-twin-seed-round-2026-02-12.md',
              'test/compiler.test.js',
              'tools/validate-release.mjs',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(repr({
                  'missing_paths': sorted(expected - changed),
                  'unexpected_paths': sorted(changed - expected),
                  'changed_paths': sorted(changed),
              }))
          if any(path.startswith('.github/') for path in changed):
              raise SystemExit('transport path entered permanent product')
          print('product_paths=' + repr(sorted(changed)))
          PY

          git commit -m "topology: separate Electric Twin round and investor roster"
          PRODUCT_SHA="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = "18"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$EXPECTED_OLD_PRODUCT"

          git push --force origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_SHA"
          git push --force origin "$EXPECTED_MAIN:refs/heads/$TRANSPORT_BRANCH"

          printf 'PRODUCT_SHA=%s\n' "$PRODUCT_SHA"
          printf 'PRODUCT_TREE=%s\n' "$PRODUCT_TREE"
          printf 'PRODUCT_PATHS=18\n'
          printf 'RELEASE_PASS=true\n'
          printf 'EDGE_SET_UNCHANGED=true\n'
          printf 'ROUND_SPECIFIC_HOP_REFUSED=true\n'
          printf 'TRANSPORT_RETIRED=true\n'
