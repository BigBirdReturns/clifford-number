name: Preference custody laboratory floor v37

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-record-linkage-temporal-succession-assurance.mjs'
      - 'tools/validate-preference-record-linkage-temporal-succession-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v37.mjs'
      - 'tools/validate-preference-custody-manifest-v37.mjs'
      - 'test/preference-record-linkage-temporal-succession-assurance.test.js'
      - 'test/preference-custody-manifest-v37.test.js'
      - 'docs/preference-custody-record-linkage-temporal-succession-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v37.md'
      - '.github/workflows/preference-record-linkage-temporal-succession-assurance.yml'
      - '.github/workflows/preference-custody-v37.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile PC-39 and the compositional v37 floor
        run: |
          node tools/compile-preference-record-linkage-temporal-succession-assurance.mjs
          node tools/compile-preference-custody-manifest-v37.mjs
      - name: Validate record-linkage assurance and floor boundaries
        run: |
          node tools/validate-preference-record-linkage-temporal-succession-assurance.mjs
          node tools/validate-preference-custody-manifest-v37.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-record-linkage-temporal-succession-assurance.test.js
          node test/preference-custody-manifest-v37.test.js
      - name: Preserve deterministic v37 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v37
          path: |
            build/research/preference-record-linkage-temporal-succession-assurance.json
            build/research/preference-record-linkage-temporal-succession-assurance.md
            build/research/preference-custody-laboratory-floor-v37.json
            build/research/preference-custody-laboratory-floor-v37.md
          if-no-files-found: error
