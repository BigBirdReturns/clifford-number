name: Status sovereignty RD Wave 03 RD-04 five-state source-field adjudication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-five-state-source-field-adjudication.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-five-state-source-field-adjudication.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.schema.json'
      - 'test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - name: Re-verify retained acquisition artifact on product PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/rd04-five-state-capture
          rm -rf "$OUT" && mkdir -p "$OUT"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9002226845/zip > "$OUT/artifact.zip"
          test "$(wc -c < "$OUT/artifact.zip" | tr -d ' ')" = 1201940
          test "$(sha256sum "$OUT/artifact.zip" | awk '{print $1}')" = 0ddb75c966d20bf9d05385adce6960b06b8c96c3696aed55bafabc853f9e2b63
          unzip -q "$OUT/artifact.zip" -d "$OUT/unpacked"
          python - <<'PYVERIFY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/rd04-five-state-capture/unpacked/ssc-rd04-next-frontier-route-discovery-acquisition-v1')
          man=json.loads((root/'manifest.json').read_text())
          assert man['entry_count']==60
          combined=hashlib.sha256()
          for e in man['entries']:
              b=(root/e['path']).read_bytes()
              assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
              combined.update(e['path'].encode()+b'\0'+e['sha256'].encode()+b'\n')
          assert combined.hexdigest()=='5c850c7e4dc0644204a8cda60b9a540a0851e1e428ad2069373a56ef4db84358'
          assert (root/'SHA256SUMS').read_text()==''.join(f"{e['sha256']}  {e['path']}\n" for e in man['entries'])
          print('capture_artifact_verification=pass entries=60')
          PYVERIFY
      - name: Validate exact product and closed schema family
        run: |
          node --check tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js
          python - <<'PYSCHEMA'
          import copy,json,pathlib
          from jsonschema import Draft202012Validator
          root=pathlib.Path('.')
          schema=json.loads((root/'schemas/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.schema.json').read_text())
          validator=Draft202012Validator(schema)
          data=root/'data/intake/status-sovereignty-rd-wave03-rd04-fl-mt-nd-or-wi-source-field-adjudication'
          files=['capture-custody.json','source-adjudications.json','field-adjudications.json','pdf-review-receipts.json','promotion-candidate-protocol.json','selected-followup-protocol.json','index.json','product-manifest.json']
          refusals=0
          for name in files:
              value=json.loads((data/name).read_text())
              validator.validate(value)
              mutated=copy.deepcopy(value)
              if 'capture_counts' in mutated: mutated['capture_counts']['unreviewed_authority']=True
              elif 'decisions' in mutated: mutated['decisions'][0]['unreviewed_authority']=True
              elif 'reviews' in mutated: mutated['reviews'][0]['unreviewed_authority']=True
              elif 'candidates' in mutated: mutated['candidates'][0]['unreviewed_authority']=True
              elif 'routes' in mutated: mutated['routes'][0]['unreviewed_authority']=True
              elif 'counts' in mutated: mutated['counts']['unreviewed_authority']=True
              elif 'entries' in mutated: mutated['entries'][0]['unreviewed_authority']=True
              else: raise AssertionError(name)
              assert list(validator.iter_errors(mutated)), name
              refusals+=1
          print(f'closed_schema_validation=pass objects={len(files)} nested_unknown_key_refusals={refusals}')
          PYSCHEMA
          node tools/validate-no-magic-human-gate.mjs
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove clean deterministic replay
        run: |
          git restore --staged --worktree .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs --write
          node tools/build-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node tools/validate-status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-five-state-source-field-adjudication.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
