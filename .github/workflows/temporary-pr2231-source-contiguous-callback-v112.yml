name: Temporary PR 2231 source-contiguous callback V112

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-pr2231-source-contiguous-callback-v112.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-source-contiguous-callback-v112
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      CONTROLLER_WORKFLOW: .github/workflows/temporary-pr2231-source-contiguous-callback-v112.yml
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: 53aa560c583b943b1aacdfff425423f9812752bb
      EXPECTED_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_TREE: 74d7bab76498a1dd2e7705fbd73b43e45402b24f
      EXPECTED_LIBRARY: 99ddf7d069203ccd0afbda6bd0c860f54473b347
      EXPECTED_TEST: 664e4f949a53b44acb2760cd4e083236b5616c2e
      SOURCE_COMMENT: '5473589549'
      REVIEW_BINDINGS: >-
        PRRT_kwDOTGqftc6dept0:3888440222 PRRT_kwDOTGqftc6dfK4F:3888640534
        PRRT_kwDOTGqftc6dfK4H:3888640536 PRRT_kwDOTGqftc6dfLu0:3888645507
        PRRT_kwDOTGqftc6di_ww:3890125090 PRRT_kwDOTGqftc6di_wy:3890125092
      ARTIFACT_DIR: /tmp/pr2231-source-contiguous-callback-v112
      PRODUCT_WT: /tmp/pr2231-source-contiguous-callback-product-v112
      MAIN_WT: /tmp/pr2231-source-contiguous-callback-main-v112
      QUALIFIED_DIR: /tmp/pr2231-source-contiguous-callback-qualified-v112

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover and execute read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          d=/tmp/pr2231-v112-source
          rm -rf "$d"
          mkdir -p "$d"
          cat > "$d/qualifier.sh.gz.b64" <<'QUALIFIER_B64'
          
          QUALIFIER_B64
          base64 -d "$d/qualifier.sh.gz.b64" > "$d/qualifier.sh.gz"
          echo 'a74f40932b578570b933c579f6803a0b1cda5a4503a5b84f2562300c13180c05  /tmp/pr2231-v112-source/qualifier.sh.gz' | sha256sum -c -
          gzip -dc "$d/qualifier.sh.gz" > "$d/qualifier.sh"
          echo 'abdbf945ff58b13bcc33bf354849d684ab0305d31b915de20d680119cd1fe11f  /tmp/pr2231-v112-source/qualifier.sh' | sha256sum -c -
          chmod +x "$d/qualifier.sh"
          "$d/qualifier.sh"

      - name: Retain source and reconstruction inputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$ARTIFACT_DIR"
          [[ ! -f /tmp/pr2231-v112-source/qualifier.sh ]] || cp /tmp/pr2231-v112-source/qualifier.sh "$ARTIFACT_DIR/qualifier-v112.sh"
          [[ ! -f /tmp/pr2231-v112-source-contiguity.patch ]] || cp /tmp/pr2231-v112-source-contiguity.patch "$ARTIFACT_DIR/source-contiguity.patch"
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\t%s\n' | sort > "$ARTIFACT_DIR/artifact-manifest.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-source-contiguous-callback-v112
          path: /tmp/pr2231-source-contiguous-callback-v112
          retention-days: 90
