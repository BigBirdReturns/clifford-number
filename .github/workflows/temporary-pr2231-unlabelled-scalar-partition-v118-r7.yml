name: Temporary PR 2231 unlabelled scalar-partition V118 R7 qualifier

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  qualify-unlabelled-scalar-partition-v118-r7:
    if: github.event.pull_request.head.ref == 'agent/pr2231-unlabelled-scalar-partition-v118-qualifier-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: agent/pr2231-unlabelled-scalar-partition-v118-qualifier-v7
      CONTROLLER_WORKFLOW: .github/workflows/temporary-pr2231-unlabelled-scalar-partition-v118-r7.yml
      EXPECTED_MAIN: 771a64b6b467748d2f4df667b5f78e76f9432d69
      EXPECTED_PRODUCT: 0c0ec19938e76d83d646c79d02bea9a724e6773b
      EXPECTED_PRODUCT_TREE: 326186e534735e8fc108c3bb7cab115d5db08dce
      EXPECTED_LIBRARY: 123b88403265fa4193a44a97b27aebc7661c1528
      EXPECTED_TEST: a71e670bbf85a399e02a184e0a8fce19d127bfaf
      EXPECTED_REVIEW_ID: '5072486871'
      EXPECTED_REVIEW_COMMENT: '3899391565'
      EXPECTED_PATCH_BLOB: 3cee9edc8ab2976dad9b1578433b0e116adf94ed
      EXPECTED_PATCH_SHA256: 12e099998370d7df416f7e0872fbda8bcf13f58c4a9e990226d9ad04d25e2421
      EXPECTED_CANDIDATE_LIBRARY: 666f4b53fa676c6cfedd27748988301fcfe67efe
      EXPECTED_CANDIDATE_TEST: 3a8f092bba87f14d4870c656a2a887e73eec39b7
      EXPECTED_CANDIDATE_LIBRARY_SHA256: f8e36b516e25ffef801fc87af08ca2ae5bdbe246144f602708207826c666852e
      EXPECTED_CANDIDATE_TEST_SHA256: 925626a9a9d77aa40d97d3c0826f52615de0d4eccfac5b6c824f283e881f61fc
      QUALIFIER_XZ_BLOB: db6a666b0fd37e72db23a3e7719f3095df448469
      QUALIFIER_XZ_BYTES: '4412'
      QUALIFIER_XZ_SHA256: 511b28ee160aa9f9ed871514aeab9491ab748d443d6ec25baec5aa848bcc040c
      QUALIFIER_BLOB: 114f6981d3f7e291f97175bba8a3e0be7d3fdfc0
      QUALIFIER_BYTES: '21521'
      QUALIFIER_SHA256: b84e0d94820bd3a6724eeab4174cb1b05996dafd2df68a73fe649c8e7810033f
      PATCH_BYTES: '4665'
      ARTIFACT_DIR: /tmp/pr2231-unlabelled-scalar-partition-v118-r7-qualification
    steps:
      - name: Check out exact controller head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute content-addressed read-only V118 R7 qualifier
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_PR: ${{ github.event.pull_request.number }}
          EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          d=/tmp/pr2231-v118-r7-envelope
          outer=/tmp/pr2231-v118-r7-wrapper
          rm -rf "$d" "$outer" "$ARTIFACT_DIR"
          mkdir -p "$d" "$outer"
          exec > >(tee "$outer/wrapper.log") 2>&1
          trap 'rc=$?; trap - EXIT; printf "wrapper_exit=%s\n" "$rc" > "$outer/wrapper-status.env"; exit "$rc"' EXIT

          gh api "repos/$REPO/git/blobs/$QUALIFIER_XZ_BLOB" --jq .content \
            | tr -d '\n' | base64 -d > "$d/qualifier-v118-r7.sh.xz"
          test "$(wc -c < "$d/qualifier-v118-r7.sh.xz")" = "$QUALIFIER_XZ_BYTES"
          test "$(sha256sum "$d/qualifier-v118-r7.sh.xz" | awk '{print $1}')" = "$QUALIFIER_XZ_SHA256"
          test "$(git hash-object "$d/qualifier-v118-r7.sh.xz")" = "$QUALIFIER_XZ_BLOB"
          xz -t "$d/qualifier-v118-r7.sh.xz"
          xz -dc "$d/qualifier-v118-r7.sh.xz" > "$d/qualifier-v118-r7.sh"
          test "$(wc -c < "$d/qualifier-v118-r7.sh")" = "$QUALIFIER_BYTES"
          test "$(sha256sum "$d/qualifier-v118-r7.sh" | awk '{print $1}')" = "$QUALIFIER_SHA256"
          test "$(git hash-object "$d/qualifier-v118-r7.sh")" = "$QUALIFIER_BLOB"
          bash -n "$d/qualifier-v118-r7.sh"

          gh api "repos/$REPO/git/blobs/$EXPECTED_PATCH_BLOB" --jq .content \
            | tr -d '\n' | base64 -d > "$d/pr2231-v118.patch"
          test "$(wc -c < "$d/pr2231-v118.patch")" = "$PATCH_BYTES"
          test "$(sha256sum "$d/pr2231-v118.patch" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          test "$(git hash-object "$d/pr2231-v118.patch")" = "$EXPECTED_PATCH_BLOB"

          set +e
          PATCH_FILE="$d/pr2231-v118.patch" bash "$d/qualifier-v118-r7.sh"
          qualifier_rc=$?
          set -e
          mkdir -p "$ARTIFACT_DIR"
          cp "$d/qualifier-v118-r7.sh" "$ARTIFACT_DIR/qualifier-v118-r7.sh"
          cp "$d/qualifier-v118-r7.sh.xz" "$ARTIFACT_DIR/qualifier-v118-r7.sh.xz"
          cp "$outer/wrapper.log" "$ARTIFACT_DIR/wrapper.log"
          printf 'qualifier_exit=%s\n' "$qualifier_rc" > "$ARTIFACT_DIR/wrapper-qualifier-status.env"
          sha256sum "$d/qualifier-v118-r7.sh" "$d/qualifier-v118-r7.sh.xz" \
            > "$ARTIFACT_DIR/qualifier-v118-r7.sha256"
          exit "$qualifier_rc"

      - name: Upload terminal V118 R7 qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-unlabelled-scalar-partition-v118-r7
          path: |
            /tmp/pr2231-unlabelled-scalar-partition-v118-r7-qualification
            /tmp/pr2231-v118-r7-wrapper
          if-no-files-found: error
          retention-days: 90
