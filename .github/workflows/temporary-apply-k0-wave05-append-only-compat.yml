name: Temporary apply K0 Wave 05 append-only compatibility

on:
  push:
    branches:
      - agent/k0-role-neutral-wave-05
    paths:
      - '.github/workflows/temporary-apply-k0-wave05-append-only-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply compatibility patch and validate
        run: |
          set -euo pipefail
          python tools/temporary-k0-wave05-append-only-compat.py
          node tools/build-k0-role-neutral-wave-04.mjs
          node tools/build-k0-wave04-field-adjudication.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-role-neutral-wave-04.mjs
          node test/k0-role-neutral-wave-04.test.js
          node tools/validate-k0-wave04-field-adjudication.mjs
          node test/k0-wave04-field-adjudication.test.js
          node tools/validate-k0-role-neutral-wave-05.mjs
          node test/k0-role-neutral-wave-05.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct deterministic compatibility tree
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          git clean -fd
          python tools/temporary-k0-wave05-append-only-compat.py
          node tools/build-k0-role-neutral-wave-04.mjs
          node tools/build-k0-wave04-field-adjudication.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-role-neutral-wave-04.mjs
          node test/k0-role-neutral-wave-04.test.js
          node tools/validate-k0-wave04-field-adjudication.mjs
          node test/k0-wave04-field-adjudication.test.js
          node tools/validate-k0-role-neutral-wave-05.mjs
          node test/k0-role-neutral-wave-05.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Enforce exact permanent path denominator
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'tools/validate-k0-role-neutral-wave-04.mjs',
              'test/k0-role-neutral-wave-04.test.js',
              'data/project/k0-role-neutral-wave-04-release-manifest.json',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-04.json',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-04.html',
              'tools/validate-k0-wave04-field-adjudication.mjs',
              'test/k0-wave04-field-adjudication.test.js',
              'data/project/k0-wave04-field-adjudication-release-manifest.json',
              'reports/core-thesis/answerable-power/k0-wave04-field-adjudication.json',
              'reports/core-thesis/answerable-power/k0-wave04-field-adjudication.html',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'reports/core-thesis/answerable-power/k0.json',
              'reports/core-thesis/answerable-power/k0.html',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PY

      - name: Commit permanent compatibility tree and remove transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/validate-k0-role-neutral-wave-04.mjs \
            test/k0-role-neutral-wave-04.test.js \
            data/project/k0-role-neutral-wave-04-release-manifest.json \
            reports/core-thesis/answerable-power/k0-role-neutral-wave-04.json \
            reports/core-thesis/answerable-power/k0-role-neutral-wave-04.html \
            tools/validate-k0-wave04-field-adjudication.mjs \
            test/k0-wave04-field-adjudication.test.js \
            data/project/k0-wave04-field-adjudication-release-manifest.json \
            reports/core-thesis/answerable-power/k0-wave04-field-adjudication.json \
            reports/core-thesis/answerable-power/k0-wave04-field-adjudication.html \
            data/project/k0-epistemic-admissibility-release-manifest.json \
            reports/core-thesis/answerable-power/k0.json \
            reports/core-thesis/answerable-power/k0.html
          git rm \
            .github/workflows/temporary-apply-k0-wave05-append-only-compat.yml \
            .github/workflows/temporary-k0-wave05-append-only-compat.yml \
            tools/temporary-k0-wave05-append-only-compat.py
          git diff --cached --check
          git commit -m 'Make Wave 04 validators append-only'
          git push origin HEAD:agent/k0-role-neutral-wave-05
