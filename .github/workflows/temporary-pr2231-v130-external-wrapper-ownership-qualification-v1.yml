name: Temporary PR 2231 V130 external-wrapper qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v130-external-wrapper-read-only-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v130-external-wrapper:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v130-external-wrapper-ownership-qualification-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v130-external-wrapper-ownership-qualification-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute the exact V130 read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          envelope=/tmp/pr2231-v130-external-wrapper-controller-envelope-v1
          payload="$envelope/qualifier-v130.sh.xz"
          qualifier="$envelope/qualifier-v130.sh"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          exec > >(tee -a "$envelope/controller.log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-qualification\n' "$rc" > "$envelope/controller-status.env"
            (cd "$envelope" && find . -type f -printf '%P\t%s\n' | sort) > "$envelope/envelope-manifest.txt"
            (cd "$envelope" && find . -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum) > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          test "$CONTROLLER_BRANCH" = "$EXPECTED_CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          cat <<'QUALIFIER_XZ_B64' | base64 -d > "$payload"
