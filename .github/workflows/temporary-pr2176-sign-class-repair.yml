name: Temporary PR2176 sign-class repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-sign-class-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-sign-class-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1b1476f37eb1dd02ef1404ac5b21e27aeac06386"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-sign-class-repair.yml"

      - name: Align numeric-tail signs with scanner separators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')
          old_sign_class = r'[+\-−–—]'
          new_sign_class = r'[+\-‐‑‒–—−－]'
          if library.count(old_sign_class) != 2:
              raise SystemExit('numeric-tail sign class did not occur exactly twice')
          library = library.replace(old_sign_class, new_sign_class)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = "assert.equal(\n  redactContactData('Tel: +44 20 7123. 4567'),"
          addition = dedent('''
          for (const acceptedDashSign of ['‐', '‑', '‒']) {
            assert.equal(
              redactContactData(`Contact +81 3 6216 5111. ${acceptedDashSign}４２ attendees joined.`),
              `Contact [contact omitted]. ${acceptedDashSign}４２ attendees joined.`,
              'every dash accepted by the scanner must also be accepted as a numeric-tail sign'
            );
            assert.equal(
              redactContactData(`Tel: +44 20 7123 4567 ext 1234. (${acceptedDashSign}４２) attendees joined.`),
              `Tel: [contact omitted] ext [contact omitted]. (${acceptedDashSign}４２) attendees joined.`,
              'parenthesized numeric prose must preserve every dash accepted by the extension scanner'
            );
          }
          ''')
          if tests.count(test_anchor) != 1:
              raise SystemExit('sign-class test insertion anchor did not match exactly once')
          tests = tests.replace(test_anchor, addition + test_anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-sign-class-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-sign-class-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): align numeric-tail sign classes"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
