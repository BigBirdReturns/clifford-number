name: TEMP materialize RD-04 eight-state minimum-frontier protocol v4

on:
  push:
    branches:
      - 'agent/ssc-rd04-mf8-protocol-materializer-v2'

permissions:
  contents: write
  issues: write

concurrency:
  group: temp-ssc-rd04-mf8-protocol-materializer-v2
  cancel-in-progress: true

jobs:
  materialize:
    if: github.ref_name == 'agent/ssc-rd04-mf8-protocol-materializer-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - id: materialize
        name: Recover immutable controller and execute exact transaction
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ARCHIVE_GIT_BLOB: f76674753c9e2e64183fcda0ff16bb8b948a1c81
          ARCHIVE_BYTES: '20748'
          ARCHIVE_SHA256: 3afa1a777dab75415cafc8a4b317a10771de0f5eb74ccbef5a18f6b4ae5c208f
          EMPIRICAL_MERGE: a464dbbd96c365a7c040e17847486c5b3ba05c27
          TARGET_BRANCH: agent/ssc-rd-wave03-rd04-fl-mo-mt-ne-nv-nd-or-wi-minimum-frontier-protocol-v1
          STANDING_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd04-fl-mo-mt-ne-nv-nd-or-wi-minimum-frontier-protocol.yml
        run: |
          set -Eeuo pipefail
          BOOT=/tmp/ssc-rd04-mf8-controller-v2
          rm -rf "$BOOT"
          mkdir -p "$BOOT"
          cat > "$BOOT/controller-shards.tsv" <<'EOF_SHARDS'
          part-00.bin 6289cd093707f073ec61533df407aebd05dc0aea 1536 202121aa791052a4fb0ce2640cc4abb7d909c07af357a478f90d30d4d7e71799
          part-01.bin 6ae83c8c7b20b66b9c987c9156eca036a9db0051 1536 528234d35c7b94d236e484feac7de6c59699de3fbc6450ff0a1f606a5596c57c
          part-02.bin bf8900391fb61539c154a184e95283435de46305 1320 ea8cb0fd5a9d6e43e89e2b7620bdca42b11a135e804a3b9050cb222dc8e7df68
          EOF_SHARDS
          : > "$BOOT/controller.sh.xz"
          while read -r name blob bytes digest; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GH_REPOSITORY/git/blobs/$blob" \
              > "$BOOT/$name.json"
            test "$(jq -r .encoding "$BOOT/$name.json")" = base64
            jq -r .content "$BOOT/$name.json" | tr -d '\n' | base64 -d > "$BOOT/$name"
            test "$(wc -c < "$BOOT/$name" | tr -d ' ')" = "$bytes"
            test "$(sha256sum "$BOOT/$name" | awk '{print $1}')" = "$digest"
            test "$(git hash-object "$BOOT/$name")" = "$blob"
            cat "$BOOT/$name" >> "$BOOT/controller.sh.xz"
          done < "$BOOT/controller-shards.tsv"
          test "$(wc -c < "$BOOT/controller.sh.xz" | tr -d ' ')" = 4392
          test "$(sha256sum "$BOOT/controller.sh.xz" | awk '{print $1}')" = 3b4e3e50707bd801accb983a96b431fff66c0f3fc86486b927b5029301fc08ba
          test "$(git hash-object "$BOOT/controller.sh.xz")" = b9ab5308a2d2b0ec75a7f0a4fd052ba391a5394d
          xz -dc "$BOOT/controller.sh.xz" > "$BOOT/controller.sh"
          test "$(wc -c < "$BOOT/controller.sh" | tr -d ' ')" = 15046
          test "$(sha256sum "$BOOT/controller.sh" | awk '{print $1}')" = 801af2fdc17c4ce362583ac5079e53de40103ca03e68f248c855307529d526a0
          bash -n "$BOOT/controller.sh"
          chmod 0755 "$BOOT/controller.sh"
          bash "$BOOT/controller.sh"
      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mf8-protocol-materialization-v2
          path: |
            /tmp/ssc-rd04-mf8-controller-v2
            /tmp/ssc-rd04-mf8-protocol-materializer-v1
          if-no-files-found: warn
          retention-days: 90
      - name: Report terminal outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          OUTCOME: ${{ steps.materialize.outcome }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/ssc-rd04-mf8-protocol-materializer-v1
          BODY=/tmp/ssc-rd04-mf8-v2-comment.md
          if test "$OUTCOME" = success && test -f "$OUT/materialization-receipt.json"; then
            python - <<'PY' > "$BODY"
          import json, os
          from pathlib import Path
          r=json.loads(Path('/tmp/ssc-rd04-mf8-protocol-materializer-v1/materialization-receipt.json').read_text())
          print('RD-04 eight-state minimum-frontier protocol V2 materialized successfully.\n')
          print('```text')
          print(f"workflow_run: {os.environ['GITHUB_RUN_ID']}")
          print(f"carrier_head: {os.environ['GITHUB_SHA']}")
          for k in ['canonical_parent','canonical_parent_tree','ordinary_head','ordinary_tree','standing_workflow_blob','archive_git_blob','transport_shards','permanent_paths','ordinary_paths','fixed_routes','target_states','target_cells','adversarial_refusals','class_closed','outside_human_dependency']:
              print(f'{k}: {r[k]}')
          print('```')
          print('\nThe ordinary branch moved only after exact controller, fourteen-shard archive, predecessor, schema, adversarial, no-magic-human, complete-release, replay, path, and live-main lease gates passed. The standing workflow remains pending byte-identical connector composition.')
          PY
          else
            {
              echo 'RD-04 eight-state minimum-frontier protocol V2 failed closed.'
              echo
              echo '```text'
              echo "workflow_run: $GITHUB_RUN_ID"
              echo "carrier_head: $GITHUB_SHA"
              echo "outcome: $OUTCOME"
              test -f "$OUT/failure.txt" && cat "$OUT/failure.txt"
              test -f "$OUT/run.log" && tail -260 "$OUT/run.log"
              echo '```'
              echo
              echo 'No unverified product or evidentiary authority is represented.'
            } > "$BODY"
          fi
          gh issue comment 1017 --repo "$GH_REPOSITORY" --body-file "$BODY"
      - name: Refuse failed materialization
        if: always()
        env:
          OUTCOME: ${{ steps.materialize.outcome }}
        run: test "$OUTCOME" = success
