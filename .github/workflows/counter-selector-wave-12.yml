name: Counter-Selector Wave 12 Batch 05 acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-12.yml'
      - 'data/project/counter-selector-wave-12-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b05-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b05.json'
      - 'schemas/counter-selector-artifact-acquisition-b05.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition-b05.md'
      - 'docs/milestones/counter-selector-wave-12.md'
      - 'tools/build-counter-selector-wave-12.mjs'
      - 'tools/validate-counter-selector-wave-12.mjs'
      - 'test/counter-selector-wave-12.test.js'
      - 'reports/core-thesis/counter-selector-wave-12/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-12-b05-acquisition'
    paths:
      - '.github/workflows/counter-selector-wave-12.yml'
      - 'data/project/counter-selector-wave-12-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b05-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b05.json'
      - 'schemas/counter-selector-artifact-acquisition-b05.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition-b05.md'
      - 'docs/milestones/counter-selector-wave-12.md'
      - 'tools/build-counter-selector-wave-12.mjs'
      - 'tools/validate-counter-selector-wave-12.mjs'
      - 'test/counter-selector-wave-12.test.js'
      - 'reports/core-thesis/counter-selector-wave-12/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 12 products
        run: node tools/build-counter-selector-wave-12.mjs
      - name: Validate Batch 05 acquisition contract
        run: node tools/validate-counter-selector-wave-12.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-12.test.js
      - name: Require exact committed Wave 12 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-artifact-acquisition-b05-registry.json \
            data/project/counter-selector-blind-packet-registry-b05.json \
            data/project/counter-selector-wave-12-release-manifest.json \
            reports/core-thesis/counter-selector-wave-12/data.json \
            reports/core-thesis/counter-selector-wave-12/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 12 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-12.mjs
          node tools/validate-counter-selector-wave-12.mjs
          node test/counter-selector-wave-12.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
