name: TEMP materialize Wave-03 remaining intake rebuild v1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ssc-rd-wave03-remaining-intake-rebuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.base.ref == 'agent/ssc-wave03-remaining-intake-rebuild-base-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-wave03-remaining-intake-rebuild-trigger-v1'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lane: 'RD-04'
            target_branch: 'agent/ssc-rd-wave03-rd04-state-implementation'
            target_lease: '2e007a337897b4e67f618c20cd698b86a2c240c0'
            seed: 'data/project/ssc-residual-wave03/seeds/RD-04-C02.json'
            contract: 'data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/field-matrix-contract.json'
            package: 'data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/fixed-protocol-package.json'
            schema: 'schemas/status-sovereignty-rd-wave03-rd04-state-implementation-intake.schema.json'
            docs: 'docs/milestones/ssc-rd-wave03-rd04-state-implementation-intake.md'
            builder: 'tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs'
            validator: 'tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs'
            test_file: 'test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js'
            unit_count: 50
            cell_count: 450
            route_count: 207
          - lane: 'RD-05'
            target_branch: 'agent/ssc-rd-wave03-rd05-member-participation'
            target_lease: 'aa72bd3706f2a5c2ee0e36a3ee0c1cd544c24017'
            seed: 'data/project/ssc-residual-wave03/seeds/RD-05-C02.json'
            contract: 'data/intake/status-sovereignty-rd-wave03-rd05-member-participation/field-matrix-contract.json'
            package: 'data/intake/status-sovereignty-rd-wave03-rd05-member-participation/fixed-protocol-package.json'
            schema: 'schemas/status-sovereignty-rd-wave03-rd05-member-participation-intake.schema.json'
            docs: 'docs/milestones/ssc-rd-wave03-rd05-member-participation-intake.md'
            builder: 'tools/build-status-sovereignty-rd-wave03-rd05-member-participation-intake.mjs'
            validator: 'tools/validate-status-sovereignty-rd-wave03-rd05-member-participation-intake.mjs'
            test_file: 'test/status-sovereignty-rd-wave03-rd05-member-participation-intake.test.js'
            unit_count: 17
            cell_count: 170
            route_count: 161
          - lane: 'RD-06'
            target_branch: 'agent/ssc-rd-wave03-rd06-evaluation-custody'
            target_lease: '38082e5e9843aa6d09a42581593f77622f81b821'
            seed: 'data/project/ssc-residual-wave03/seeds/RD-06-C04.json'
            contract: 'data/intake/status-sovereignty-rd-wave03-rd06-evaluation-custody/field-matrix-contract.json'
            package: 'data/intake/status-sovereignty-rd-wave03-rd06-evaluation-custody/fixed-protocol-package.json'
            schema: 'schemas/status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.schema.json'
            docs: 'docs/milestones/ssc-rd-wave03-rd06-evaluation-custody-intake.md'
            builder: 'tools/build-status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.mjs'
            validator: 'tools/validate-status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.mjs'
            test_file: 'test/status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.test.js'
            unit_count: 8
            cell_count: 80
            route_count: 40
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARRIER_ROOT: 'data/project/transport/ssc-wave03-remaining-intake-rebuild-v1/product'
      RECEIPT_ROOT: ${{ runner.temp }}/ssc-rd-wave03-remaining-intake-rebuild-v1
      PACKAGE_ROOT: ${{ runner.temp }}/ssc-rd-wave03-remaining-intake-rebuild-v1/package
      PACKAGE_B64_BYTES: 23456
      PACKAGE_B64_SHA256: 1b6b36ed063f8b8926fe56bb3a6a97e4a96fd2b22a6a5052676ad88e9f8f8e36
      PACKAGE_XZ_BYTES: 17592
      PACKAGE_XZ_SHA256: d40657b48e61058b16da598b57146c32fddd741b94a41f3bd521290abfe0ea99
      PATH_LIST_SHA256: a9d01509f6896b6f5fa5389e5655ae56cf4f6414707bc0ae53cf326e01898785
      FILE_MANIFEST_SHA256: af80d0fb8be504843e2ba29b64a442cdcda3df273a7f775a752f6fa47bc2e557
    steps:
      - name: Check out trusted materializer base
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-wave03-remaining-intake-rebuild-base-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, qualify, and publish exact lane product
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          TARGET_BRANCH: ${{ matrix.target_branch }}
          TARGET_LEASE: ${{ matrix.target_lease }}
          SEED_PATH: ${{ matrix.seed }}
          CONTRACT_PATH: ${{ matrix.contract }}
          OUTPUT_PACKAGE_PATH: ${{ matrix.package }}
          SCHEMA_PATH: ${{ matrix.schema }}
          DOCS_PATH: ${{ matrix.docs }}
          BUILDER_PATH: ${{ matrix.builder }}
          VALIDATOR_PATH: ${{ matrix.validator }}
          TEST_PATH: ${{ matrix.test_file }}
          UNIT_COUNT: ${{ matrix.unit_count }}
          CELL_COUNT: ${{ matrix.cell_count }}
          ROUTE_COUNT: ${{ matrix.route_count }}
        run: |
          set -Eeuo pipefail
          RECEIPT="$RECEIPT_ROOT/$LANE"
          rm -rf "$RECEIPT" "$PACKAGE_ROOT"
          mkdir -p "$RECEIPT" "$PACKAGE_ROOT/root"
          exec > >(tee "$RECEIPT/execution.log") 2>&1
          STAGE=init
          finish() {
            rc=$?
            printf 'status=%s\nstage=%s\nexit_code=%s\nutc=%s\n' \
              "$([[ $rc -eq 0 ]] && echo complete || echo failed_closed)" \
              "$STAGE" "$rc" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RECEIPT/checkpoint.txt"
            exit "$rc"
          }
          trap finish EXIT

          STAGE=verify-carrier-shards
          python - "$CARRIER_ROOT" "$PACKAGE_ROOT/product.b64" <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          expected = {
              '000.b64': (4096, '06eeac5f90e53623f54a967575e04cfc97d12f726293893e5ae260bb338bded1'),
              '001.b64': (4096, '5ff351f0891e2c6ac3accc231bb76b3496646eea38dde1bd36f246cc55c9be2e'),
              '002.b64': (4096, '04854d078a02d4008b6b7ac2babb7e50e84f2501acebdbda968506d80067de96'),
              '003.b64': (4096, '8f5fdd0212d0ba7cd56d54996edfbcfc8707e7f785cd27e02c8c5bae6e4cb8ef'),
              '004.b64': (4096, 'f3eb2e26bfa29d3cb00489ef16f4dc8d27484980bc432d48996a90b8bb7ddf8f'),
              '005.b64': (2976, '8a390801b6c394ab755126505a4e46ef9062cefc7331be81fcc2a271718d7322'),
          }
          actual = sorted(path.name for path in root.glob('*.b64'))
          if actual != sorted(expected):
              raise SystemExit(f'shard denominator mismatch: {actual}')
          chunks = []
          for name in sorted(expected):
              data = b''.join((root / name).read_bytes().split())
              size, digest = expected[name]
              actual_digest = sha256(data).hexdigest()
              print(f'{name}: bytes={len(data)} sha256={actual_digest}')
              if len(data) != size or actual_digest != digest:
                  raise SystemExit(f'shard mismatch: {name}')
              chunks.append(data)
          out.write_bytes(b''.join(chunks))
          PY
          test "$(stat -c '%s' "$PACKAGE_ROOT/product.b64")" -eq "$PACKAGE_B64_BYTES"
          test "$(sha256sum "$PACKAGE_ROOT/product.b64" | awk '{print $1}')" = "$PACKAGE_B64_SHA256"
          base64 -d "$PACKAGE_ROOT/product.b64" > "$PACKAGE_ROOT/product.tar.xz"
          test "$(stat -c '%s' "$PACKAGE_ROOT/product.tar.xz")" -eq "$PACKAGE_XZ_BYTES"
          test "$(sha256sum "$PACKAGE_ROOT/product.tar.xz" | awk '{print $1}')" = "$PACKAGE_XZ_SHA256"

          STAGE=verify-product-package
          python - "$PACKAGE_ROOT/product.tar.xz" "$PACKAGE_ROOT/root" "$RECEIPT" <<'PY'
          from hashlib import sha256
          from pathlib import Path, PurePosixPath
          import io, json, lzma, sys, tarfile

          archive_path = Path(sys.argv[1])
          root = Path(sys.argv[2])
          receipt = Path(sys.argv[3])
          expected_paths = ['data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/field-matrix-contract.json', 'data/intake/status-sovereignty-rd-wave03-rd05-member-participation/field-matrix-contract.json', 'data/intake/status-sovereignty-rd-wave03-rd06-evaluation-custody/field-matrix-contract.json', 'data/project/ssc-residual-wave03/seeds/RD-04-C02.json', 'data/project/ssc-residual-wave03/seeds/RD-05-C02.json', 'data/project/ssc-residual-wave03/seeds/RD-06-C04.json', 'docs/milestones/ssc-rd-wave03-rd04-state-implementation-intake.md', 'docs/milestones/ssc-rd-wave03-rd05-member-participation-intake.md', 'docs/milestones/ssc-rd-wave03-rd06-evaluation-custody-intake.md', 'test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js', 'test/status-sovereignty-rd-wave03-rd05-member-participation-intake.test.js', 'test/status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.test.js', 'tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs', 'tools/build-status-sovereignty-rd-wave03-rd05-member-participation-intake.mjs', 'tools/build-status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.mjs', 'tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs', 'tools/validate-status-sovereignty-rd-wave03-rd05-member-participation-intake.mjs', 'tools/validate-status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.mjs']
          raw = archive_path.read_bytes()
          decompressed = lzma.decompress(raw)
          rows = []
          with tarfile.open(fileobj=io.BytesIO(decompressed), mode='r:') as tf:
              members = tf.getmembers()
              paths = []
              for member in members:
                  posix = PurePosixPath(member.name)
                  if posix.is_absolute() or '..' in posix.parts or not member.isfile():
                      raise SystemExit(f'unsafe or non-regular member: {member.name}')
                  data = tf.extractfile(member).read()
                  target = root / Path(*posix.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  paths.append(member.name)
                  rows.append({'path': member.name, 'bytes': len(data), 'sha256': sha256(data).hexdigest()})
          paths = sorted(paths)
          rows = sorted(rows, key=lambda row: row['path'])
          if paths != expected_paths:
              raise SystemExit(f'package path denominator mismatch: {paths}')
          path_bytes = ''.join(path + '\n' for path in paths).encode()
          manifest_bytes = (json.dumps(rows, indent=2) + '\n').encode()
          (receipt / 'source-paths.txt').write_bytes(path_bytes)
          (receipt / 'source-file-manifest.json').write_bytes(manifest_bytes)
          print(f'source_paths={len(paths)} path_sha256={sha256(path_bytes).hexdigest()} manifest_sha256={sha256(manifest_bytes).hexdigest()}')
          PY
          test "$(sha256sum "$RECEIPT/source-paths.txt" | awk '{print $1}')" = "$PATH_LIST_SHA256"
          test "$(sha256sum "$RECEIPT/source-file-manifest.json" | awk '{print $1}')" = "$FILE_MANIFEST_SHA256"

          STAGE=bind-live-leases
          git fetch --no-tags origin main "$TARGET_BRANCH"
          LIVE_MAIN=$(git rev-parse origin/main)
          TARGET_NOW=$(git rev-parse "origin/$TARGET_BRANCH")
          test "$TARGET_NOW" = "$TARGET_LEASE"
          git merge-base --is-ancestor 2374980372d98e7f9ca68fe373d25c9bb812c374 "$LIVE_MAIN"
          printf 'lane=%s\nlive_main=%s\ntarget_branch=%s\ntarget_lease=%s\n' \
            "$LANE" "$LIVE_MAIN" "$TARGET_BRANCH" "$TARGET_NOW" > "$RECEIPT/leases.txt"
          git checkout --detach "$LIVE_MAIN"

          write_path_lists() {
            printf '%s\n' \
              "$SEED_PATH" "$CONTRACT_PATH" "$DOCS_PATH" "$BUILDER_PATH" "$VALIDATOR_PATH" "$TEST_PATH" \
              "$OUTPUT_PACKAGE_PATH" "$SCHEMA_PATH" | sort > "$RECEIPT/expected-final-paths.txt"
            printf '%s\n' \
              "$SEED_PATH" "$CONTRACT_PATH" "$DOCS_PATH" "$BUILDER_PATH" "$VALIDATOR_PATH" "$TEST_PATH" | sort > "$RECEIPT/expected-source-paths.txt"
          }
          write_path_lists
          test "$(wc -l < "$RECEIPT/expected-final-paths.txt" | tr -d ' ')" -eq 8
          test "$(wc -l < "$RECEIPT/expected-source-paths.txt" | tr -d ' ')" -eq 6
          while IFS= read -r path; do test ! -e "$path"; done < "$RECEIPT/expected-final-paths.txt"

          install_sources() {
            while IFS= read -r path; do
              test -f "$PACKAGE_ROOT/root/$path"
              mkdir -p "$(dirname "$path")"
              cp "$PACKAGE_ROOT/root/$path" "$path"
            done < "$RECEIPT/expected-source-paths.txt"
          }
          run_focused() {
            node --check "$BUILDER_PATH"
            node --check "$VALIDATOR_PATH"
            node --check "$TEST_PATH"
            node "$BUILDER_PATH" --check
            node "$VALIDATOR_PATH"
            node "$TEST_PATH"
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
          }

          STAGE=qualify-full-product
          install_sources
          node "$BUILDER_PATH" --write
          run_focused
          git ls-files --others --exclude-standard | sort > "$RECEIPT/candidate-paths.txt"
          cmp "$RECEIPT/expected-final-paths.txt" "$RECEIPT/candidate-paths.txt"
          git diff --check
          npm run release:check

          STAGE=clean-replay
          git restore --worktree -- .
          git clean -fdx
          install_sources
          node "$BUILDER_PATH" --write
          run_focused
          git ls-files --others --exclude-standard | sort > "$RECEIPT/replay-paths.txt"
          cmp "$RECEIPT/expected-final-paths.txt" "$RECEIPT/replay-paths.txt"
          git diff --check

          STAGE=commit-product
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -d '\n' git add -- < "$RECEIPT/expected-final-paths.txt"
          git commit -m "Freeze $LANE Wave-03 fixed public-record intake protocol"
          PRODUCT_HEAD=$(git rev-parse HEAD)
          PRODUCT_TREE=$(git rev-parse HEAD^{tree})
          git diff --name-status "$LIVE_MAIN" HEAD > "$RECEIPT/product-name-status.txt"
          test "$(wc -l < "$RECEIPT/product-name-status.txt" | tr -d ' ')" -eq 8
          test "$(awk '$1 != "A" {n++} END {print n+0}' "$RECEIPT/product-name-status.txt")" -eq 0
          cut -f2- "$RECEIPT/product-name-status.txt" | sort > "$RECEIPT/product-paths.txt"
          cmp "$RECEIPT/expected-final-paths.txt" "$RECEIPT/product-paths.txt"

          STAGE=publish-under-leases
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$LIVE_MAIN"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_LEASE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_LEASE"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$PRODUCT_HEAD"
          printf 'status=complete\nlane=%s\nlive_main=%s\nproduct_head=%s\nproduct_tree=%s\ntarget_branch=%s\npermanent_paths=8\nunits=%s\ncells=%s\nfixed_routes=%s\noutside_human_dependency=false\ngraph_effect=none\npackage_xz_sha256=%s\nsource_file_manifest_sha256=%s\n' \
            "$LANE" "$LIVE_MAIN" "$PRODUCT_HEAD" "$PRODUCT_TREE" "$TARGET_BRANCH" \
            "$UNIT_COUNT" "$CELL_COUNT" "$ROUTE_COUNT" "$PACKAGE_XZ_SHA256" "$FILE_MANIFEST_SHA256" > "$RECEIPT/final.txt"
          STAGE=complete
      - name: Preserve exact lane materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave03-${{ matrix.lane }}-remaining-intake-rebuild-v1
          path: ${{ runner.temp }}/ssc-rd-wave03-remaining-intake-rebuild-v1/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 90
