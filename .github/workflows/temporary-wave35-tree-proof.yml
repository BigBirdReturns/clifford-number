name: Temporary Wave 35 sealed-tree proof

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/workflows/temporary-wave35-tree-proof.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-wave35-sealed-tree-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave35-tree-proof.yml'
          encoded_ref='agent%2Flake-allocator-war-join-requirements-wave-35'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 35 tree-proof workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-join-requirements-wave-35
          fetch-depth: 0

      - name: Prove the sealed Wave 35 tree and workflow blob
        shell: bash
        run: |
          set -euo pipefail
          expected_tree='f11064d693f38f360fae33c375f0811a38a36f32'
          expected_workflow_blob='cee4547fa210d6f3a28cf0570d2ec7e25eeaab79'
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          actual_workflow_blob="$(git hash-object .github/workflows/lake-allocator-war-join-requirements-wave-35.yml)"
          [[ "$actual_tree" == "$expected_tree" ]] || { echo "sealed tree mismatch: expected=$expected_tree actual=$actual_tree" >&2; exit 1; }
          [[ "$actual_workflow_blob" == "$expected_workflow_blob" ]] || { echo "workflow blob mismatch: expected=$expected_workflow_blob actual=$actual_workflow_blob" >&2; exit 1; }
          test -z "$(git status --porcelain)"
          echo "Wave 35 sealed tree verified: $actual_tree"
          echo "Wave 35 workflow blob verified: $actual_workflow_blob"
