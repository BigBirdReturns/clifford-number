name: Temporary PR 2231 cross-callback wrapper lease diagnostic v69
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-cross-callback-wrapper-lease-diagnostic-v69.yml'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr2231-cross-callback-wrapper-lease-diagnostic-v69
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CBRANCH: agent/pr2231-cross-callback-wrapper-lease-diagnostic-v69
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      CTREE: f7fc52609c1c6b42921c7a4db6e20c4e54c1f99e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 28428b8b7f7fe105a2e44cfbdf0028b2c0a3a9ab
      PTREE: 0463a8ff9e3923e7fcd2b6fca712b305eccc7dea
      PLIB: 07dc09a44b3c2a092d351d4ad91367a6de72a65b
      PTEST: 3970d3d97cfc3941bda8ecc844d229a5fc00f41d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnose true narrative-wrapper custody
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          W=/tmp/pr2231-v69-product
          R=/tmp/pr2231-v69-wrapper-lease-diagnostic.txt
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          require_eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ]
          }

          stage exact-envelope-and-leases
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq controller-paths "$(git diff --name-only "$CPARENT..HEAD")" \
            '.github/workflows/temporary-pr2231-cross-callback-wrapper-lease-diagnostic-v69.yml'
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
            "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage exact-product-instrumentation
          rm -rf "$W"
          git worktree prune
          git worktree add --detach "$W" "$PHEAD"
          cd "$W"
          cat >> tools/lib/industrial-exhaust.mjs <<'EXPORTS'

          export {
            PHONE_SPAN_PATTERN,
            createCrossCallbackExplicitPhoneLabelLease,
            crossCallbackExplicitPhoneLabelBridge,
            redactPhoneSpanCandidate
          };
          EXPORTS
          require_eq instrumentation-paths "$(git diff --name-only "$PHEAD")" \
            'tools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs

          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import {
            PHONE_SPAN_PATTERN,
            createCrossCallbackExplicitPhoneLabelLease,
            crossCallbackExplicitPhoneLabelBridge,
            redactContactData as redact,
            redactPhoneSpanCandidate
          } from './tools/lib/industrial-exhaust.mjs';

          function inspect(input) {
            PHONE_SPAN_PATTERN.lastIndex = 0;
            const matches = [...input.matchAll(PHONE_SPAN_PATTERN)];
            assert.ok(matches.length >= 2, `two candidates required: ${input}`);
            const first = matches[0];
            const second = matches[1];
            const firstResult = redactPhoneSpanCandidate(first[0], first.index, input, false);
            const lease = firstResult.ranges
              ? createCrossCallbackExplicitPhoneLabelLease(
                  first[0], first.index, firstResult.ranges,
                  firstResult.explicitPhoneLabelContext
                )
              : null;
            const bridge = crossCallbackExplicitPhoneLabelBridge(
              lease, second[0], second.index, input
            );
            return { matches, first, second, firstResult, lease, bridge };
          }

          for (const [name, input, expected] of [
            ['ordinary bridge', 'Phone: 09012345678 12:30:45 555-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted]'],
            ['intrinsic phone parentheses', 'Phone: (09012345678) 12:30:45 555-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted]']
          ]) {
            const state = inspect(input);
            const actual = redact(input);
            console.log(JSON.stringify({ kind: 'range-positive-control', name, input,
              firstCandidate: state.first[0], firstRanges: state.firstResult.ranges,
              lease: state.lease, bridge: state.bridge, actual, expected }));
            assert.ok(Array.isArray(state.firstResult.ranges));
            assert.ok(state.firstResult.ranges.length > 0);
            assert.ok(state.lease);
            assert.ok(state.bridge);
            assert.equal(actual, expected);
          }

          const targets = [
            ['ASCII narrative wrapper', '(Phone: 09012345678) 12:30:45 555-1212', '(Phone: [contact omitted]) 12:30:45 [contact omitted]', '12:30:45'],
            ['plus narrative wrapper', '(Phone: +81 90 1234 5678) 12:30:45 555-1212', '(Phone: [contact omitted]) 12:30:45 [contact omitted]', '12:30:45'],
            ['fullwidth narrative wrapper', '（電話：０９０１２３４５６７８） １２：３０：４５ ５５５－１２１２', '（電話：[contact omitted]） １２：３０：４５ [contact omitted]', '12:30:45'],
            ['ASCII narrative wrapper before unit observation', '(Phone: 09012345678) 90 people 555-1212', '(Phone: [contact omitted]) 90 people [contact omitted]', '90 people']
          ];
          for (const [name, input, required, observation] of targets) {
            const state = inspect(input);
            const actual = redact(input);
            const normalized = actual.normalize('NFKC');
            console.log(JSON.stringify({ kind: 'true-wrapper-witness', name, input,
              candidates: state.matches.map(match => ({ text: match[0], index: match.index })),
              firstOutput: state.firstResult.output,
              firstRanges: state.firstResult.ranges,
              explicitPhoneLabelContext: state.firstResult.explicitPhoneLabelContext,
              lease: state.lease, bridge: state.bridge, actual, required }));
            assert.match(state.firstResult.output, /\[contact omitted\]/u);
            assert.equal(state.firstResult.explicitPhoneLabelContext, true);
            assert.equal(state.firstResult.ranges, null);
            assert.equal(state.lease, null);
            assert.equal(state.bridge, null);
            assert.notEqual(actual, required);
            assert.match(normalized, /555-1212/u);
            assert.ok(normalized.includes(observation));
          }

          console.log(JSON.stringify({ kind: 'diagnostic-summary',
            positiveWitnesses: targets.length, negativeControls: 0,
            mechanism: 'true narrative-wrapper rendering drops range custody; formatted-time and unit-observation callbacks expose the later local phone' }));
          NODE

          stage final-product-leases
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq final-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq final-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          printf 'DIAGNOSTIC_COMPLETE\nproduct=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$PHEAD" "$PTREE" "$PLIB" "$PTEST" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-cross-callback-wrapper-lease-diagnostic-v69
          path: /tmp/pr2231-v69-wrapper-lease-diagnostic.txt
          if-no-files-found: error
          retention-days: 90
