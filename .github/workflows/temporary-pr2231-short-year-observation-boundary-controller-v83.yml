name: Temporary PR 2231 short-year observation boundary controller v83

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-short-year-observation-boundary-v83-repair.py'
      - '.github/workflows/temporary-pr2231-short-year-observation-boundary-controller-v83.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-short-year-observation-boundary-v83
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-short-year-observation-boundary-controller-v83
      REPAIR_PATH: .github/tmp/pr2231-short-year-observation-boundary-v83-repair.py
      REPAIR_BLOB: 0f5dfcb0922774711b2f0cc8a222babc2069a51c
      CPARENT: 564da53a373bfee43b026d7ed0ba0022bcc38633
      CTREE: 2e0ba796bf4648e899e8c425ce00fa9bbdb2c7cc
      CBASEPARENT: 01428cde971ffe0d995a60c80c153eded9b7e6b1
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 27da1b37e606d87af8cea175995d2ba49e859369
      PPARENT: 564da53a373bfee43b026d7ed0ba0022bcc38633
      PTREE: 90f1556d017a2763bb3800479384c46f6f000bbc
      PLIB: daadf5c66839e6e2c74792a02706704eee98e698
      PTEST: c43624859ba307792a12b1b0986300540a66399e
      RLIB: df1c93e21e451f7444fa01c57f8c80473fdc7a5b
      RTEST: 6ca162940c7058b7ce5eba4de6bbc3af85b7db15
      PREDBRANCH: agent/pr2231-short-year-phone-precedence-controller-v1
      PREDHEAD: 2144ee71afaa42bd3fdcbbcc73c40b88c9744fe6
      PREDREPAIR_PATH: .github/tmp/pr2231-short-year-phone-precedence-v1-repair.py
      PREDREPAIR_BLOB: 2e48b8e914a900e9a97815b86da8f1a09cae6733

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Qualify and publish short-year observation boundary repair
        shell: bash
        run: |
          set -euo pipefail

          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-v83-source
          Q=/tmp/pr2231-v83-main
          A=/tmp/pr2231-v83-artifact
          R="$A/receipt.txt"
          mkdir -p "$A"
          : >"$R"

          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$PREDBRANCH:refs/remotes/origin/$PREDBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }
          retain_workspace() {
            if [ -d "$S" ]; then
              git -C "$S" diff --binary -- \
                tools/lib/industrial-exhaust.mjs \
                test/industrial-exhaust.test.js \
                > "$A/candidate.patch" 2>/dev/null || true
              cp "$S/tools/lib/industrial-exhaust.mjs" \
                "$A/industrial-exhaust.mjs" 2>/dev/null || true
              cp "$S/test/industrial-exhaust.test.js" \
                "$A/industrial-exhaust.test.js" 2>/dev/null || true
            fi
          }
          trap retain_workspace EXIT

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq controller-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'.github/tmp/pr2231-short-year-observation-boundary-v83-repair.py\n.github/workflows/temporary-pr2231-short-year-observation-boundary-controller-v83.yml'
          require_eq repair-blob \
            "$(git rev-parse "HEAD:$REPAIR_PATH")" "$REPAIR_BLOB"
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq main-parent "$(git rev-parse "$CPARENT^")" "$CBASEPARENT"
          require_eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$PPARENT"
          require_eq product-main-merge-base "$(git merge-base "$PHEAD" "$CPARENT")" "$PPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$PPARENT..$PHEAD")" '1'
          require_eq product-paths \
            "$(git diff --name-only "$PPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq predecessor-controller-head \
            "$(git rev-parse refs/remotes/origin/$PREDBRANCH)" "$PREDHEAD"
          require_eq predecessor-repair-blob \
            "$(git rev-parse "$PREDHEAD:$PREDREPAIR_PATH")" "$PREDREPAIR_BLOB"

          stage exact-product-regression-witnesses
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const predecessorCases = [
            ['unit observation train becomes synthetic phone', 'Archive 3.12.03 62-16 20 people', 'Archive 3.12.[contact omitted] people'],
            ['labelled unit train becomes synthetic phone', 'Phone: 03-6216-8041 3.12.03 62-16 20 people', 'Phone: [contact omitted] 3.12.[contact omitted] people'],
            ['fullwidth unit train becomes synthetic phone', '電話：３．１２．０３ ６２－１６ ２０ 人', '電話：３．１２．[contact omitted] 人'],
            ['later short-year date donates groups', 'Archive 3.12.03 62 16 17.08.26', 'Archive 3.12.[contact omitted].08.26'],
            ['separate decimal donates groups', 'Archive 3.12.03 6216.8041', 'Archive 3.12.[contact omitted]'],
            ['unit-bearing value at proposed start becomes phone', 'Archive 3.12.03-62165111 people', 'Archive 3.12.[contact omitted] people']
          ];
          for (const [name, input, expected] of predecessorCases) {
            const actual = redact(input);
            console.log(JSON.stringify({
              kind: 'exact-predecessor-reproduction', name, input, actual, expected
            }));
            assert.equal(actual, expected, name);
          }

          const predecessorControls = [
            ['domestic continuation remains live', 'Phone: 03-6216-8041 3.12.03-6216-8041', 'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['mobile continuation remains live', 'Phone: 03-6216-8041 3.12.090-1234-5678', 'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['compact continuation remains live', 'Phone: 03-6216-8041 3.12.050-12345678', 'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['pair-grouped continuation remains live', 'Archive 3.12.03 62-16 80-41', 'Archive 3.12.[contact omitted]'],
            ['dotted continuation remains live', 'Archive 3.12.03.6216.8041', 'Archive 3.12.[contact omitted]'],
            ['separated short-year date remains complete', 'Phone: 03-6216-8041 17.08.26 03-6216-8041', 'Phone: [contact omitted] 17.08.26 [contact omitted]'],
            ['invalid-month decimal route remains live', 'Phone: 03-6216-8041 3.14.03-6216-8041', 'Phone: [contact omitted] 3.14.[contact omitted]'],
            ['unit observation custody remains qualified', 'Phone: 09012345678 2026-08-17)03-62165111 people 03-6216-8041', 'Phone: [contact omitted] 2026-08-17)03-62165111 people [contact omitted]'],
            ['nonleading date custody remains qualified', 'Phone: 12:30:45 2026-08-17 555-1212', 'Phone: 12:30:45 2026-08-17 555-1212'],
            ['one-use lease remains nonrenewable', 'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212']
          ];
          for (const [name, input, expected] of predecessorControls) {
            assert.equal(redact(input), expected, name);
          }
          console.log(`EXACT_PREDECESSOR_FAILURES=${predecessorCases.length}`);
          NODE

          stage apply-repair-and-targeted-controls
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          require_eq repair-paths \
            "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          require_eq repaired-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq repaired-test "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"

          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { performance } from 'node:perf_hooks';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const repairedCases = [
            ['unit observation train remains source-faithful', 'Archive 3.12.03 62-16 20 people', 'Archive 3.12.03 62-16 20 people'],
            ['label cannot cross the observation train', 'Phone: 03-6216-8041 3.12.03 62-16 20 people', 'Phone: [contact omitted] 3.12.03 62-16 20 people'],
            ['fullwidth observation train remains source-faithful', '電話：３．１２．０３ ６２－１６ ２０ 人', '電話：３．１２．０３ ６２－１６ ２０ 人'],
            ['later short-year date stops continuation', 'Archive 3.12.03 62 16 17.08.26', 'Archive 3.12.03 62 16 17.08.26'],
            ['separate decimal stops continuation', 'Archive 3.12.03 6216.8041', 'Archive 3.12.03 6216.8041'],
            ['unit-bearing proposed start retains custody', 'Archive 3.12.03-62165111 people', 'Archive 3.12.03-62165111 people'],
            ['domestic continuation remains live', 'Phone: 03-6216-8041 3.12.03-6216-8041', 'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['mobile continuation remains live', 'Phone: 03-6216-8041 3.12.090-1234-5678', 'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['compact continuation remains live', 'Phone: 03-6216-8041 3.12.050-12345678', 'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['fullwidth mobile continuation remains live', '電話：０３－６２１６－８０４１ ３．１２．０９０－１２３４－５６７８', '電話：[contact omitted] ３．１２．[contact omitted]'],
            ['pair-grouped continuation remains live', 'Archive 3.12.03 62-16 80-41', 'Archive 3.12.[contact omitted]'],
            ['dotted continuation remains live', 'Archive 3.12.03.6216.8041', 'Archive 3.12.[contact omitted]'],
            ['separated short-year date remains complete', 'Phone: 03-6216-8041 17.08.26 03-6216-8041', 'Phone: [contact omitted] 17.08.26 [contact omitted]'],
            ['separated three-digit year remains complete', 'Phone: 03-6216-8041 17.08.090 03-6216-8041', 'Phone: [contact omitted] 17.08.090 [contact omitted]'],
            ['four-digit attached date remains complete', 'Phone: 03-6216-8041 17.08.2026.03-6216-8041', 'Phone: [contact omitted] 17.08.2026.[contact omitted]'],
            ['invalid-month decimal route remains live', 'Phone: 03-6216-8041 3.14.03-6216-8041', 'Phone: [contact omitted] 3.14.[contact omitted]'],
            ['unit observation custody remains qualified', 'Phone: 09012345678 2026-08-17)03-62165111 people 03-6216-8041', 'Phone: [contact omitted] 2026-08-17)03-62165111 people [contact omitted]'],
            ['nonleading date custody remains qualified', 'Phone: 12:30:45 2026-08-17 555-1212', 'Phone: 12:30:45 2026-08-17 555-1212'],
            ['one-use lease remains nonrenewable', 'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212'],
            ['terminal closer sentence expiry remains qualified', 'Context (Phone: 09012345678.) 12:30:45 555-1212', 'Context (Phone: [contact omitted].) 12:30:45 555-1212']
          ];
          for (const [name, input, expected] of repairedCases) {
            const actual = redact(input);
            console.log(JSON.stringify({
              kind: 'repaired-transition', name, input, actual, expected
            }));
            assert.equal(actual, expected, name);
          }

          const witness = 'Archive 3.12.03 62-16 20 people';
          const performanceInput = Array.from({ length: 1000 }, () => witness).join(' ');
          redact(performanceInput);
          const started = performance.now();
          const performanceOutput = redact(performanceInput);
          const elapsedMs = performance.now() - started;
          assert.equal(performanceOutput, performanceInput, 'large observation train must remain source-faithful');
          assert.ok(elapsedMs < 5000, `bounded continuation scan exceeded limit: ${elapsedMs.toFixed(1)}ms`);
          console.log(JSON.stringify({
            kind: 'bounded-short-year-continuation', witnesses: 1000, elapsed_ms: elapsedMs
          }));
          console.log(`REPAIRED_TRANSITION_CASES=${repairedCases.length}`);
          NODE

          stage repaired-industrial-exhaust-suites
          mapfile -t suites < <(
            find test -maxdepth 1 -type f \
              -name 'industrial-exhaust*.test.js' -print | LC_ALL=C sort
          )
          test "${#suites[@]}" -ge 3
          printf '%s\n' "${suites[@]}" | tee "$A/suites.txt"
          for suite in "${suites[@]}"; do
            printf 'RUNNING %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done

          stage current-main-transplant-and-release
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq transplant-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq transplant-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq transplant-test "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"
          git diff --check
          for suite in "${suites[@]}"; do
            printf 'TRANSPLANT %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq post-release-lib "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq post-release-test "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"

          stage construct-qualified-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: stop short-year phone continuations at observations'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq qualified-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq qualified-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq qualified-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq qualified-lib "$ALIB" "$RLIB"
          require_eq qualified-test "$ATEST" "$RTEST"
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' \
            "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
          git show --format=fuller --stat HEAD > "$A/qualified-commit.txt"
          git format-patch -1 --stdout > "$A/qualified-product.patch"

          stage final-lease-revalidation-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-predecessor-controller \
            "$(git rev-parse refs/remotes/origin/$PREDBRANCH)" "$PREDHEAD"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin \
            "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$AHEAD"
          require_eq published-parent "$(git rev-parse "$AHEAD^")" "$CPARENT"
          require_eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          require_eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ALIB"
          require_eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ATEST"
          printf 'QUALIFICATION_SUCCESS\nold=%s\nnew=%s\nparent=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$PHEAD" "$AHEAD" "$CPARENT" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-short-year-observation-boundary-v83
          path: /tmp/pr2231-v83-artifact
          if-no-files-found: error
          retention-days: 90
