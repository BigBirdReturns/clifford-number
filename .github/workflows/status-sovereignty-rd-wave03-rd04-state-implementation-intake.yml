name: SSC RD-04 Wave 03 fifty-state implementation intake

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-state-implementation-intake.yml'
      - '.ssc-rd04-wave03-source-census-trigger/EXECUTE'
      - 'data/project/ssc-residual-wave03/seeds/RD-04-C02.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/**'
      - 'data/intake/status-sovereignty-f02-snap-gate-first-pass.json'
      - 'data/intake/status-sovereignty-rd04-snap-state-remedy.json'
      - 'data/project/ssc-residual-wave02/closures/RD-04-C01.json'
      - 'data/research/status-sovereignty-rd-wave02-rd04-version-history/class-receipt.json'
      - 'schemas/status-sovereignty-rd-wave03-rd04-state-implementation-intake.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs'
      - 'test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py'
      - 'docs/milestones/ssc-rd-wave03-rd04-state-implementation-intake.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-state-implementation-intake.yml'
      - 'data/project/ssc-residual-wave03/seeds/RD-04-C02.json'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/**'
      - 'data/intake/status-sovereignty-f02-snap-gate-first-pass.json'
      - 'data/intake/status-sovereignty-rd04-snap-state-remedy.json'
      - 'data/project/ssc-residual-wave02/closures/RD-04-C01.json'
      - 'data/research/status-sovereignty-rd-wave02-rd04-version-history/class-receipt.json'
      - 'schemas/status-sovereignty-rd-wave03-rd04-state-implementation-intake.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs'
      - 'test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py'
      - 'docs/milestones/ssc-rd-wave03-rd04-state-implementation-intake.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd04-wave03-state-implementation-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate fifty states, 450 cells, 204 routes, and exact product custody
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js
          node tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          node test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py --validate-only
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore volatile outputs and replay exact intake derivation
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs --write
          node tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          node test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py --validate-only
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve exact intake custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-wave03-state-implementation-intake
          path: |
            data/project/ssc-residual-wave03/seeds/RD-04-C02.json
            data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/field-matrix-contract.json
            data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/source-census-protocol.json
            data/intake/status-sovereignty-rd-wave03-rd04-state-implementation/intake-product-manifest.json
            schemas/status-sovereignty-rd-wave03-rd04-state-implementation-intake.schema.json
            docs/milestones/ssc-rd-wave03-rd04-state-implementation-intake.md
          if-no-files-found: error
          retention-days: 90

  capture:
    if: startsWith(github.head_ref, 'agent/ssc-rd-wave03-rd04-source-census-trigger-')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Revalidate the exact 204-route protocol before requests
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
          node test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py --validate-only
          node tools/validate-no-magic-human-gate.mjs

      - name: Execute the fixed fifty-state source census
        run: python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-source-census.py --output /tmp/ssc-rd04-wave03-source-census-v1

      - name: Preserve route bodies, candidates, receipts, and artifact manifest
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-wave03-source-census-v1
          path: /tmp/ssc-rd04-wave03-source-census-v1
          if-no-files-found: error
          retention-days: 90
