name: Preference custody equilibrium assurance control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/equilibrium-assurance.fixture.json'
      - 'tools/lib/preference-equilibrium-assurance.mjs'
      - 'tools/compile-preference-equilibrium-assurance.mjs'
      - 'tools/validate-preference-equilibrium-assurance.mjs'
      - 'test/preference-equilibrium-assurance.test.js'
      - 'docs/preference-custody-equilibrium-assurance.md'
      - '.github/workflows/preference-equilibrium-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equilibrium-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile market, saturation, capacity, price, response, substitution, equilibrium, welfare, and succession worlds
        run: node tools/compile-preference-equilibrium-assurance.mjs
      - name: Validate counterfactual, access, strategic-response, welfare, replication, correction, and authority boundaries
        run: node tools/validate-preference-equilibrium-assurance.mjs
      - name: Exercise saturation, capacity, price, response, substitution, equilibrium, succession, authority, and tamper fixtures
        run: node test/preference-equilibrium-assurance.test.js
      - name: Preserve deterministic equilibrium-assurance projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-equilibrium-assurance-pc29
          path: |
            build/research/preference-equilibrium-assurance.json
            build/research/preference-equilibrium-assurance.md
          if-no-files-found: error
