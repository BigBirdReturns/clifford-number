name: Temporary PC-31 exact product materializer

on:
  pull_request:
    paths:
      - '.pc31/payload.part-*'
      - '.github/workflows/pc31-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc31-exact-product-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-service-denominator-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and extract the exact twelve-file PC-31 product
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import subprocess
          import tarfile

          expected_xz_sha256 = 'd29ac4483bc470910ff2676d87e51d1759bab939d20298682502365b900f1a5e'
          expected_base64_sha256 = 'd05256a8ec7d70564fa2c75734b4828a4f5d04e1a29f910eb4ecc48d3ddacfeb'
          expected = {
              'data/research/preference-custody/service-denominator-assurance.fixture.json': 'fed927f3e3d7789a041e520f65bbadb1fe20563f412d4dab5162f9fa679b1b41',
              'tools/lib/preference-service-denominator-assurance.mjs': '5c3784db9b42cd8f22add7a0cab9ce78dad142a904af360f5f2346e0ef9c3aaf',
              'tools/compile-preference-service-denominator-assurance.mjs': 'eb48bf759c7d884a87e113a81fc281a921db5144e90743a7d9268c80c9523942',
              'tools/validate-preference-service-denominator-assurance.mjs': 'ec17ae4468795ca50fceaeea95e0549a4c5e55564359bd73c9561196c9c8ffc4',
              'test/preference-service-denominator-assurance.test.js': '6eebb6738a879f3a2b9c7f8bb6a4c3503f2790bfdfd85dfe0c1536ec6824fa82',
              'docs/preference-custody-service-denominator-assurance.md': '274e332532774f1560ee797ffe9837c79faa871e729944a88c3e214f25862473',
              'data/research/preference-custody/control-manifest-v29.json': '5f32b1930fee1c51428013502f27bcc8699f74417aa4ea7fa4ca43457c60eed8',
              'tools/lib/preference-custody-manifest-v29.mjs': 'ec3f047dcfb8a72fbfc782e02369cce2b375225c5fa5a267cb9b41ec4de0d044',
              'tools/compile-preference-custody-manifest-v29.mjs': 'e0a786158b1d84470ac02d18a0a19235428657b1a268f00ecebb2ed163f5a509',
              'tools/validate-preference-custody-manifest-v29.mjs': '90dd58da29da03feb89471cf6809a540e0371d2dd0ebc0a285f0651ee8dabd20',
              'test/preference-custody-manifest-v29.test.js': '753c7e766d9cfe3e1dada24ca79de59609c42d75a2964fd92a77d03acf572c91',
              'docs/preference-custody-laboratory-floor-v29.md': 'd9b5f63269a1e736b59af46ce47b417fb187ee4619ed4052d73550d6077a4033',
          }

          parts = sorted(Path('.pc31').glob('payload.part-*'))
          required_parts = [f'payload.part-{index:02d}' for index in range(6)]
          if [path.name for path in parts] != required_parts:
              raise SystemExit(f'expected six ordered payload shards, found {[path.name for path in parts]}')
          encoded = ''.join(''.join(path.read_text().split()) for path in parts)
          if hashlib.sha256(encoded.encode()).hexdigest() != expected_base64_sha256:
              raise SystemExit('payload base64 SHA-256 mismatch')
          try:
              xz_bytes = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'invalid payload base64: {error}')
          actual_xz_sha256 = hashlib.sha256(xz_bytes).hexdigest()
          if actual_xz_sha256 != expected_xz_sha256:
              raise SystemExit(f'payload xz SHA-256 mismatch: {actual_xz_sha256}')

          with tarfile.open(fileobj=io.BytesIO(xz_bytes), mode='r:xz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f'archive path/order mismatch: {names}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member must be a regular file: {member.name}')
                  if Path(member.name).is_absolute() or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())

          observed = {}
          for name, required_sha256 in expected.items():
              raw = Path(name).read_bytes()
              actual_sha256 = hashlib.sha256(raw).hexdigest()
              if actual_sha256 != required_sha256:
                  raise SystemExit(f'file SHA-256 mismatch for {name}: {actual_sha256}')
              observed[name] = {'bytes': len(raw), 'sha256': actual_sha256}

          receipt = {
              'schema_version': 'pc31-materialization-receipt@1',
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'payload_xz_sha256': actual_xz_sha256,
              'permanent_nonworkflow_file_count': len(expected),
              'files': observed,
              'outside_human_dependency': False,
          }
          Path('/tmp/pc31-materialization-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Qualify standalone PC-31 and compositional floor v29
        run: |
          node tools/compile-preference-service-denominator-assurance.mjs
          node tools/validate-preference-service-denominator-assurance.mjs
          node test/preference-service-denominator-assurance.test.js
          node tools/compile-preference-custody-manifest-v29.mjs
          node tools/validate-preference-custody-manifest-v29.mjs
          node test/preference-custody-manifest-v29.test.js
      - name: Regress historical Preference Custody floors and no-magic-human gate
        run: |
          set -euo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
      - name: Commit only the exact product and retire all six payload shards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/research/preference-custody/service-denominator-assurance.fixture.json \
            tools/lib/preference-service-denominator-assurance.mjs \
            tools/compile-preference-service-denominator-assurance.mjs \
            tools/validate-preference-service-denominator-assurance.mjs \
            test/preference-service-denominator-assurance.test.js \
            docs/preference-custody-service-denominator-assurance.md \
            data/research/preference-custody/control-manifest-v29.json \
            tools/lib/preference-custody-manifest-v29.mjs \
            tools/compile-preference-custody-manifest-v29.mjs \
            tools/validate-preference-custody-manifest-v29.mjs \
            test/preference-custody-manifest-v29.test.js \
            docs/preference-custody-laboratory-floor-v29.md
          git rm -- \
            .pc31/payload.part-00 \
            .pc31/payload.part-01 \
            .pc31/payload.part-02 \
            .pc31/payload.part-03 \
            .pc31/payload.part-04 \
            .pc31/payload.part-05
          python - <<'PY'
          import subprocess
          expected = [
              '.pc31/payload.part-00',
              '.pc31/payload.part-01',
              '.pc31/payload.part-02',
              '.pc31/payload.part-03',
              '.pc31/payload.part-04',
              '.pc31/payload.part-05',
              'data/research/preference-custody/control-manifest-v29.json',
              'data/research/preference-custody/service-denominator-assurance.fixture.json',
              'docs/preference-custody-laboratory-floor-v29.md',
              'docs/preference-custody-service-denominator-assurance.md',
              'test/preference-custody-manifest-v29.test.js',
              'test/preference-service-denominator-assurance.test.js',
              'tools/compile-preference-custody-manifest-v29.mjs',
              'tools/compile-preference-service-denominator-assurance.mjs',
              'tools/lib/preference-custody-manifest-v29.mjs',
              'tools/lib/preference-service-denominator-assurance.mjs',
              'tools/validate-preference-custody-manifest-v29.mjs',
              'tools/validate-preference-service-denominator-assurance.mjs',
          ]
          observed = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if observed != expected:
              raise SystemExit(f'staged path mismatch:\nexpected={expected}\nobserved={observed}')
          print(f'exact staged path set verified: {len(observed)} paths')
          PY
          git commit -m 'Materialize PC-31 and Preference Custody floor v29'
          git push origin HEAD:research/preference-service-denominator-assurance-v1
      - name: Preserve the exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc31-exact-materialization-receipt
          path: /tmp/pc31-materialization-receipt.json
          if-no-files-found: error
