name: Preference custody laboratory floor v31

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-identity-boundary-assurance.mjs'
      - 'tools/validate-preference-identity-boundary-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v31.mjs'
      - 'tools/validate-preference-custody-manifest-v31.mjs'
      - 'test/preference-identity-boundary-assurance.test.js'
      - 'test/preference-custody-manifest-v31.test.js'
      - 'docs/preference-custody-identity-boundary-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v31.md'
      - '.github/workflows/preference-identity-boundary-assurance.yml'
      - '.github/workflows/preference-custody-v31.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile PC-33 and the compositional v31 floor
        run: |
          node tools/compile-preference-identity-boundary-assurance.mjs
          node tools/compile-preference-custody-manifest-v31.mjs
      - name: Validate identity-boundary assurance and floor boundaries
        run: |
          node tools/validate-preference-identity-boundary-assurance.mjs
          node tools/validate-preference-custody-manifest-v31.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-identity-boundary-assurance.test.js
          node test/preference-custody-manifest-v31.test.js
      - name: Preserve deterministic v31 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v31
          path: |
            build/research/preference-identity-boundary-assurance.json
            build/research/preference-identity-boundary-assurance.md
            build/research/preference-custody-laboratory-floor-v31.json
            build/research/preference-custody-laboratory-floor-v31.md
          if-no-files-found: error
