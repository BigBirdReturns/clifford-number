name: M-04G global evidence circulation

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m04g-global-circulation-*.json'
      - 'data/intake/m04g-global-circulation-*.json'
      - 'docs/methods/global-evidence-circulation.md'
      - 'docs/milestones/m04g-global-circulation-*.md'
      - 'tools/*m04g-global-circulation*.mjs'
      - 'test/m04g-global-circulation.test.js'
      - 'build/core-thesis/global-circulation/**'
      - 'reports/core-thesis/global-circulation/**'
      - '.github/workflows/m04g-global-circulation.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m04g-global-circulation-*.json'
      - 'data/intake/m04g-global-circulation-*.json'
      - 'docs/methods/global-evidence-circulation.md'
      - 'docs/milestones/m04g-global-circulation-*.md'
      - 'tools/*m04g-global-circulation*.mjs'
      - 'test/m04g-global-circulation.test.js'
      - 'build/core-thesis/global-circulation/**'
      - 'reports/core-thesis/global-circulation/**'
      - '.github/workflows/m04g-global-circulation.yml'
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 6 * * *'
    - cron: '17 12 * * *'
    - cron: '17 18 * * *'
    - cron: '43 2 * * 1'
    - cron: '53 4 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate, bootstrap, apac, emea, americas, global, ocean, aquifer, or all'
        required: true
        default: validate
        type: choice
        options: [validate, bootstrap, apac, emea, americas, global, ocean, aquifer, all]
      limit:
        description: 'maximum polls per basin'
        required: false
        default: '20'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: m04g-global-circulation-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || inputs.mode || 'validation' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test global circulation
        run: |
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node test/m04g-global-circulation.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic global products
        run: |
          git restore --staged --worktree .
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node test/m04g-global-circulation.test.js
          git diff --exit-code

  plan:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'validate')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      classes: ${{ steps.plan.outputs.classes }}
    steps:
      - id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          event='${{ github.event_name }}'
          schedule='${{ github.event.schedule }}'
          mode='${{ inputs.mode }}'
          all_basins=['G01-GLOBAL-MULTILATERAL','G02-NORTH-AMERICA','G03-LATIN-AMERICA-CARIBBEAN','G04-EU-CONTINENTAL','G05-UK-IRELAND-NORDICS','G06-EASTERN-EUROPE-EURASIA','G07-MENA','G08-SUB-SAHARAN-AFRICA','G09-SOUTH-ASIA','G10-EAST-ASIA','G11-SOUTHEAST-ASIA','G12-OCEANIA-PACIFIC']
          arcs={
            'apac':['G09-SOUTH-ASIA','G10-EAST-ASIA','G11-SOUTHEAST-ASIA','G12-OCEANIA-PACIFIC'],
            'emea':['G04-EU-CONTINENTAL','G05-UK-IRELAND-NORDICS','G06-EASTERN-EUROPE-EURASIA','G07-MENA','G08-SUB-SAHARAN-AFRICA'],
            'americas':['G02-NORTH-AMERICA','G03-LATIN-AMERICA-CARIBBEAN'],
            'global':['G01-GLOBAL-MULTILATERAL'],
          }
          classes='all'; basins=all_basins
          if event=='schedule':
            mapping={'17 0 * * *':'apac','17 6 * * *':'emea','17 12 * * *':'americas','17 18 * * *':'global'}
            if schedule in mapping: basins=arcs[mapping[schedule]]; classes='freshwater_authoritative'
            elif schedule=='43 2 * * 1': basins=all_basins; classes='ocean_discovery'
            elif schedule=='53 4 1 * *': basins=all_basins; classes='aquifer_archival_or_restricted'
          elif event=='workflow_dispatch':
            if mode in arcs: basins=arcs[mode]; classes='freshwater_authoritative'
            elif mode=='ocean': basins=all_basins; classes='ocean_discovery'
            elif mode=='aquifer': basins=all_basins; classes='aquifer_archival_or_restricted'
            else: basins=all_basins; classes='all'
          matrix={'include':[{
            'basin':basin,
            'classes':classes,
            'stagger_ms':all_basins.index(basin)*6000
          } for basin in basins]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as fh:
            fh.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
            fh.write('expected='+str(len(basins))+'\n')
            fh.write('classes='+classes+'\n')
          PY

  orbit:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: build/global-circulation/state
          key: m04g-global-${{ matrix.basin }}-${{ github.run_id }}
          restore-keys: |
            m04g-global-${{ matrix.basin }}-
      - name: Validate and circle basin
        run: |
          node tools/build-m04g-global-circulation.mjs
          node tools/validate-m04g-global-circulation.mjs
          node tools/refresh-m04g-global-circulation.mjs \
            --basin '${{ matrix.basin }}' \
            --class '${{ matrix.classes }}' \
            --limit '${{ inputs.limit || '20' }}' \
            --initial-delay-ms '${{ matrix.stagger_ms }}' \
            --strict-min-success 1 \
            --output-dir 'build/global-circulation/${{ matrix.basin }}'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/global-circulation/state
          key: m04g-global-${{ matrix.basin }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m04g-global-${{ matrix.basin }}-${{ github.run_id }}
          path: build/global-circulation/${{ matrix.basin }}
          if-no-files-found: error
          retention-days: 90

  orbit-proof:
    if: always() && needs.plan.result == 'success'
    needs: [plan, orbit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: m04g-global-*-${{ github.run_id }}
          path: artifacts
      - name: Reconcile expected basin denominator and source health
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
          ORBIT_RESULT: ${{ needs.orbit.result }}
          CLASSES: ${{ needs.plan.outputs.classes }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          roots=[p for p in Path('artifacts').iterdir() if p.is_dir()] if Path('artifacts').exists() else []
          rows=[]
          for root in sorted(roots):
            manifests=list(root.rglob('orbit-manifest.json'))
            if not manifests: continue
            payload=json.loads(manifests[0].read_text())
            payload['artifact_dir']=root.name
            rows.append(payload)
          policy=json.loads(Path('data/project/m04g-global-circulation-source-health-policy.json').read_text())
          acceptance=policy['acceptance_contract']
          expected=int(os.environ['EXPECTED'])
          totals={key:0 for key in ['selected','route_succeeded','content_succeeded','metadata_only','failed','degraded','candidates','unclassified_failures']}
          failure_classes={}
          healthy_basins=0
          for row in rows:
            counts=row.get('counts',{})
            for key in totals: totals[key]+=int(counts.get(key,0) or 0)
            if row.get('basin_health',{}).get('coverage_healthy'): healthy_basins+=1
            for key,value in row.get('failure_class_counts',{}).items(): failure_classes[key]=failure_classes.get(key,0)+int(value)
          selected=totals['selected']
          route_rate=round(totals['route_succeeded']/selected,4) if selected else 0
          content_rate=round(totals['content_succeeded']/selected,4) if selected else 0
          execution_complete=len(rows)==expected and os.environ['ORBIT_RESULT']=='success'
          health_evaluated=os.environ['CLASSES']=='all'
          coverage_healthy=(
            health_evaluated and
            route_rate>=acceptance['minimum_global_route_success_rate'] and
            content_rate>=acceptance['minimum_global_content_success_rate'] and
            healthy_basins==expected and
            totals['unclassified_failures']==0
          )
          proof={
            'schema':'m04g-global-orbit-proof@2',
            'run_id':'${{ github.run_id }}',
            'head_sha':'${{ github.sha }}',
            'event':'${{ github.event_name }}',
            'schedule':'${{ github.event.schedule }}',
            'classes':os.environ['CLASSES'],
            'expected_basins':expected,
            'observed_basins':len(rows),
            'orbit_job_result':os.environ['ORBIT_RESULT'],
            'totals':totals,
            'global_route_success_rate':route_rate,
            'global_content_success_rate':content_rate,
            'healthy_basins':healthy_basins,
            'failure_class_counts':failure_classes,
            'health_evaluated':health_evaluated,
            'state_separation':{
              'execution_complete':execution_complete,
              'coverage_healthy':coverage_healthy,
              'evidence_sufficient':False,
            },
            'basins':rows,
            'complete':execution_complete,
            'boundaries':{
              'metadata_fingerprint_proves_content_access':False,
              'coverage_healthy_proves_evidence_sufficient':False,
              'promotes_to':'candidate_only',
              'graph_effect':'none',
              'conclusion_generated':False,
              'estate_completion_claimed':False,
            },
          }
          Path('orbit-proof').mkdir()
          Path('orbit-proof/orbit-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          Path('orbit-proof/orbit-proof.sha256').write_text(hashlib.sha256(Path('orbit-proof/orbit-proof.json').read_bytes()).hexdigest()+'  orbit-proof.json\n')
          print(json.dumps(proof,indent=2))
          if not proof['complete']: raise SystemExit('incomplete global orbit')
          PY
      - name: Publish orbit receipt to the master ledger
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          proof=json.loads(Path('orbit-proof/orbit-proof.json').read_text())
          digest=hashlib.sha256(Path('orbit-proof/orbit-proof.json').read_bytes()).hexdigest()
          state=proof['state_separation']
          totals=proof['totals']
          lines=[
            f"<!-- m04g-global-orbit-proof:{proof['run_id']} -->",
            "## M-04G global orbit proof",
            "",
            f"- Run: https://github.com/${{ github.repository }}/actions/runs/{proof['run_id']}",
            f"- Head: `{proof['head_sha']}`",
            f"- Event: `{proof['event']}`",
            f"- Classes: `{proof['classes']}`",
            f"- Basin denominator: `{proof['observed_basins']}/{proof['expected_basins']}`",
            f"- Orbit job: `{proof['orbit_job_result']}`",
            f"- Execution complete: `{str(state['execution_complete']).lower()}`",
            f"- Coverage healthy: `{str(state['coverage_healthy']).lower()}`",
            f"- Evidence sufficient: `{str(state['evidence_sufficient']).lower()}`",
            f"- Route success: `{totals['route_succeeded']}/{totals['selected']}` (`{proof['global_route_success_rate']}`)",
            f"- Content success: `{totals['content_succeeded']}/{totals['selected']}` (`{proof['global_content_success_rate']}`)",
            f"- Metadata only: `{totals['metadata_only']}`",
            f"- Failed: `{totals['failed']}`",
            f"- Healthy basins: `{proof['healthy_basins']}/{proof['expected_basins']}`",
            f"- Proof SHA-256: `{digest}`",
            "",
            "| Basin | Selected | Route | Content | Metadata | Failed | Healthy |",
            "|---|---:|---:|---:|---:|---:|---|",
          ]
          for row in proof['basins']:
            counts=row.get('counts',{})
            healthy=row.get('basin_health',{}).get('coverage_healthy',False)
            lines.append(f"| `{row.get('basin')}` | {counts.get('selected',0)} | {counts.get('route_succeeded',0)} | {counts.get('content_succeeded',0)} | {counts.get('metadata_only',0)} | {counts.get('failed',0)} | `{str(healthy).lower()}` |")
          lines += [
            "",
            "```text",
            "execution completeness ≠ coverage health",
            "coverage health ≠ evidentiary sufficiency",
            "metadata fingerprint ≠ content access",
            "",
            "promotes_to: candidate_only",
            "graph_effect: none",
            "conclusion_generated: false",
            "estate_completion_claimed: false",
            "```",
          ]
          Path('orbit-proof/issue-comment.md').write_text('\n'.join(lines)+'\n')
          PY
          gh issue comment 278 --repo '${{ github.repository }}' --body-file orbit-proof/issue-comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: m04g-global-orbit-proof-${{ github.run_id }}
          path: orbit-proof
          if-no-files-found: error
          retention-days: 180
