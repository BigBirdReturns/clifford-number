name: Temporary materialize K0 Wave 07
# Assemble the exact verified materializer script, verify its bytes, and execute it.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave07.yml'
  push:
    branches: [agent/k0-role-neutral-wave-07]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-07
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assemble, verify, and execute exact materializer
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .github/tmp -maxdepth 1 -name 'k0-wave07-materializer-script-part-*.sh' -type f | sort)
          test "${#parts[@]}" -eq 10
          cat "${parts[@]}" > /tmp/k0-wave07-materializer.sh
          test "$(sha256sum /tmp/k0-wave07-materializer.sh | awk '{print $1}')" = "2c344d0f64815f098decb2f29f6065aced8a273511ef9ef65c22dd0c3417b8fb"
          chmod +x /tmp/k0-wave07-materializer.sh
          /tmp/k0-wave07-materializer.sh
