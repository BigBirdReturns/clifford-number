name: Preference custody laboratory floor v28

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-market-service-assurance.mjs'
      - 'tools/validate-preference-market-service-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v28.mjs'
      - 'tools/validate-preference-custody-manifest-v28.mjs'
      - 'test/preference-market-service-assurance.test.js'
      - 'test/preference-custody-manifest-v28.test.js'
      - 'docs/preference-custody-market-service-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v28.md'
      - '.github/workflows/preference-market-service-assurance.yml'
      - '.github/workflows/preference-custody-v28.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile PC-30 and the compositional v28 floor
        run: |
          node tools/compile-preference-market-service-assurance.mjs
          node tools/compile-preference-custody-manifest-v28.mjs
      - name: Validate market-service and floor boundaries
        run: |
          node tools/validate-preference-market-service-assurance.mjs
          node tools/validate-preference-custody-manifest-v28.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-market-service-assurance.test.js
          node test/preference-custody-manifest-v28.test.js
      - name: Preserve deterministic v28 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v28
          path: |
            build/research/preference-market-service-assurance.json
            build/research/preference-market-service-assurance.md
            build/research/preference-custody-laboratory-floor-v28.json
            build/research/preference-custody-laboratory-floor-v28.md
          if-no-files-found: error
