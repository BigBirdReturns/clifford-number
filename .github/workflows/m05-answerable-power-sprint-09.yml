name: M-05 Sprint 09 Question 4 field campaign

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-09-*.json'
      - 'docs/methods/answerable-power-question-4-field-campaign.md'
      - 'docs/milestones/m05-answerable-power-sprint-09.md'
      - 'tools/build-m05-answerable-power-sprint-09.mjs'
      - 'tools/validate-m05-answerable-power-sprint-09.mjs'
      - 'test/m05-answerable-power-sprint-09.test.js'
      - 'reports/core-thesis/answerable-power/sprint-09.*'
      - '.github/workflows/m05-answerable-power-sprint-09.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-09-*.json'
      - 'docs/methods/answerable-power-question-4-field-campaign.md'
      - 'docs/milestones/m05-answerable-power-sprint-09.md'
      - 'tools/build-m05-answerable-power-sprint-09.mjs'
      - 'tools/validate-m05-answerable-power-sprint-09.mjs'
      - 'test/m05-answerable-power-sprint-09.test.js'
      - 'reports/core-thesis/answerable-power/sprint-09.*'
      - '.github/workflows/m05-answerable-power-sprint-09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test Sprint 09
        run: |
          node tools/build-m05-answerable-power-sprint-09.mjs
          node tools/validate-m05-answerable-power-sprint-09.mjs
          node test/m05-answerable-power-sprint-09.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Sprint 09 products
        run: |
          git restore --staged --worktree .
          node tools/build-m05-answerable-power-sprint-09.mjs
          node tools/validate-m05-answerable-power-sprint-09.mjs
          node test/m05-answerable-power-sprint-09.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
