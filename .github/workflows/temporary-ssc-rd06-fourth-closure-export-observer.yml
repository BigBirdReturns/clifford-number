name: TEMP observe RD-06 fourth-closure export

on:
  workflow_run:
    workflows: ['TEMP RD-06 fourth-closure export control']
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish exact run result and optional artifact pointer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -Eeuo pipefail
          artifacts="$(gh api "repos/BigBirdReturns/clifford-number/actions/runs/$RUN_ID/artifacts")"
          artifact_id="$(jq -r '[.artifacts[] | select(.name == "ssc-rd06-wave02-fourth-closure-export")][0].id // "none"' <<<"$artifacts")"
          artifact_digest="$(jq -r '[.artifacts[] | select(.name == "ssc-rd06-wave02-fourth-closure-export")][0].digest // "none"' <<<"$artifacts")"
          artifact_size="$(jq -r '[.artifacts[] | select(.name == "ssc-rd06-wave02-fourth-closure-export")][0].size_in_bytes // 0' <<<"$artifacts")"
          gh issue comment 791 --repo BigBirdReturns/clifford-number --body "RD-06 fourth-closure export observer receipt

\`\`\`text
run id:        $RUN_ID
run head:      $RUN_HEAD
conclusion:    $RUN_CONCLUSION
artifact id:   $artifact_id
artifact size: $artifact_size
artifact digest:
$artifact_digest
\`\`\`

This is an execution receipt only. It creates no external contact, review, finding, publication, adoption, or graph effect."
