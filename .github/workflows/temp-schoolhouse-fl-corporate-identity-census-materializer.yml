name: TEMP materialize School.House Florida corporate identity census custody

on:
  pull_request:
    branches: [main]
    paths:
      - '.schoolhouse-fl-corporate-identity-census-materializer/**'
      - '.github/workflows/temp-schoolhouse-fl-corporate-identity-census-materializer.yml'

concurrency:
  group: schoolhouse-fl-corporate-identity-census-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct, reproduce, gate, and publish exact product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          EXECUTE='.schoolhouse-fl-corporate-identity-census-materializer/EXECUTE'
          BUNDLE='.schoolhouse-fl-corporate-identity-census-materializer/builder.mjs.gz.b64'
          GZIP='/tmp/build-schoolhouse-fl-corporate-identity-census-custody.mjs.gz'
          UNPATCHED_BUILDER='/tmp/build-schoolhouse-fl-corporate-identity-census-custody.unpatched.mjs'
          BUILDER='/tmp/build-schoolhouse-fl-corporate-identity-census-custody.mjs'
          ARTIFACT='/tmp/schoolhouse-fl-corporate-identity-census'
          PRODUCT='/tmp/schoolhouse-fl-corporate-identity-census-product'
          REPRO='/tmp/schoolhouse-fl-corporate-identity-census-reproduction'
          RECEIPT='/tmp/schoolhouse-fl-corporate-identity-census-materialization-receipt'
          SAFE_MAIN='e46d4aa98955e890a1bd2820dc43c52bc256490e'
          SAFE_TREE='f6110927bb6a0241169f1e915db732e41fcb52cf'
          TARGET='agent/schoolhouse-fl-corporate-identity-census-product-v1'

          cat > /tmp/expected-product-paths <<'PATHS'
          data/intake/bvvc-defense-capital/README.md
          data/intake/bvvc-defense-capital/acquisition-frontier.json
          data/intake/bvvc-defense-capital/coverage-matrix.json
          data/intake/bvvc-defense-capital/manifest.json
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-adjudication.json
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-candidate-records.jsonl
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-custody.json
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-member-receipts.jsonl
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-range-request-receipts.jsonl
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-remote-zip-index.json
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-source-receipt.json
          data/intake/bvvc-defense-capital/schoolhouse-fl-corporate-identity-census-target-matrix.json
          data/intake/bvvc-defense-capital/schoolhouse.json
          data/intake/bvvc-defense-capital/source-inventory-19.jsonl
          tools/build-schoolhouse-fl-corporate-identity-census-custody.mjs
          tools/validate-bvvc-defense-capital.mjs
          tools/validate-schoolhouse-honor-foundation-990-custody.mjs
          PATHS
          sed -i 's/^          //' /tmp/expected-product-paths
          sort -u -o /tmp/expected-product-paths /tmp/expected-product-paths
          test "$(wc -l < /tmp/expected-product-paths | tr -d ' ')" = '17'

          test -s "$EXECUTE" && test -s "$BUNDLE"
          grep -Fx 'materialize=schoolhouse-fl-corporate-identity-census-custody-v1' "$EXECUTE"
          grep -Fx "known_safe_main=$SAFE_MAIN" "$EXECUTE"
          grep -Fx "known_safe_tree=$SAFE_TREE" "$EXECUTE"
          grep -Fx 'materialize_from_live_main=true' "$EXECUTE"
          grep -Fx 'acquisition_workflow_run_id=31056239350' "$EXECUTE"
          grep -Fx 'acquisition_workflow_head=fab302a769eff491f0caa363a3a565ec828e32e6' "$EXECUTE"
          grep -Fx 'acquisition_artifact_id=8950526654' "$EXECUTE"
          grep -Fx 'acquisition_artifact_digest=sha256:98925c7a750f23cf8ed10fb1123ed0d79d78dcca79d4c67a2b0e26ed86146746' "$EXECUTE"
          grep -Fx 'acquisition_artifact_manifest_sha256=51b7f22eb650d5f00c1de1aa1bd39cf7308bdecdf5994e339d4e277e466db388' "$EXECUTE"
          grep -Fx 'acquisition_sha256sums_sha256=856cb0f0461c37fbab6b07cd5c68988c1b6dd14a13a642400c338c1bb0169f34' "$EXECUTE"
          grep -Fx 'prior_unauthenticated_workflow_run_id=31055609795' "$EXECUTE"
          grep -Fx 'prior_unauthenticated_state=provider_http_403_before_source_scan' "$EXECUTE"
          grep -Fx 'builder_bundle_sha256=23a48b82e4496aff96d16ea6d6c0742d402f9ef6ef02f2cee9f09087388112e3' "$EXECUTE"
          grep -Fx 'builder_gzip_sha256=cc8ee0f5a2892c6a1483deeb5c38c4fadd83701c6522e57099a1175b4f74ea4e' "$EXECUTE"
          grep -Fx 'builder_source_sha256=b4a09687b5d9f9a69885fd5b0893d323243f808a5ef7084bb64af1182b0382a1' "$EXECUTE"
          grep -Fx 'builder_parent_commit_occurrences=1' "$EXECUTE"
          grep -Fx 'builder_parent_tree_occurrences=1' "$EXECUTE"
          grep -Fx "target_product_branch=$TARGET" "$EXECUTE"
          grep -Fx 'expected_permanent_paths=17' "$EXECUTE"
          grep -Fx 'source_inventory_rows=478' "$EXECUTE"
          grep -Fx 'coverage_denominator_rows=29' "$EXECUTE"
          grep -Fx 'explicit_gap_rows=16' "$EXECUTE"
          grep -Fx 'source_rows_scanned=12808196' "$EXECUTE"
          grep -Fx 'candidate_rows=300' "$EXECUTE"
          grep -Fx 'corporate_name_schoolhouse_phrase_rows=278' "$EXECUTE"
          grep -Fx 'corporate_name_exact_public_brand_base_rows=4' "$EXECUTE"
          grep -Fx 'corporate_name_schoolhouse_1776_rows=0' "$EXECUTE"
          grep -Fx 'source_listed_person_match_rows=22' "$EXECUTE"
          grep -Fx 'name_and_person_overlap_rows=0' "$EXECUTE"
          grep -Fx 'identity_admitted_rows=0' "$EXECUTE"
          grep -Fx 'negative_existence_claims_created=0' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"
          grep -Fx 'publication_effect=none' "$EXECUTE"
          grep -Fx 'adoption_effect=none' "$EXECUTE"
          grep -Fx 'graph_effect=none' "$EXECUTE"

          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = '23a48b82e4496aff96d16ea6d6c0742d402f9ef6ef02f2cee9f09087388112e3'
          base64 -d "$BUNDLE" > "$GZIP"
          test "$(sha256sum "$GZIP" | awk '{print $1}')" = 'cc8ee0f5a2892c6a1483deeb5c38c4fadd83701c6522e57099a1175b4f74ea4e'
          gzip -dc "$GZIP" > "$UNPATCHED_BUILDER"
          test "$(sha256sum "$UNPATCHED_BUILDER" | awk '{print $1}')" = 'b4a09687b5d9f9a69885fd5b0893d323243f808a5ef7084bb64af1182b0382a1'
          test "$(grep -o "$SAFE_MAIN" "$UNPATCHED_BUILDER" | wc -l | tr -d ' ')" = '1'
          test "$(grep -o "$SAFE_TREE" "$UNPATCHED_BUILDER" | wc -l | tr -d ' ')" = '1'
          node --check "$UNPATCHED_BUILDER"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8950526654" --jq '.digest // ""')" = 'sha256:98925c7a750f23cf8ed10fb1123ed0d79d78dcca79d4c67a2b0e26ed86146746'
          rm -rf "$ARTIFACT" "$RECEIPT"
          mkdir -p "$ARTIFACT" "$RECEIPT"
          gh run download 31056239350 \
            --repo "$GITHUB_REPOSITORY" \
            --name schoolhouse-fl-corporate-identity-census \
            --dir "$ARTIFACT"
          test "$(sha256sum "$ARTIFACT/artifact-manifest.json" | awk '{print $1}')" = '51b7f22eb650d5f00c1de1aa1bd39cf7308bdecdf5994e339d4e277e466db388'
          test "$(sha256sum "$ARTIFACT/SHA256SUMS" | awk '{print $1}')" = '856cb0f0461c37fbab6b07cd5c68988c1b6dd14a13a642400c338c1bb0169f34'
          test "$(cat "$ARTIFACT/RUNNER_EXIT_CODE")" = '0'
          (cd "$ARTIFACT" && sha256sum -c SHA256SUMS)
          test ! -e "$ARTIFACT"/cordata.zip
          test "$(find "$ARTIFACT" -type f \( -name '*.zip' -o -name '*.deflate' -o -name '*.compressed' \) | wc -l | tr -d ' ')" = '0'

          MATERIALIZATION_PASS=0
          while :; do
            MATERIALIZATION_PASS=$((MATERIALIZATION_PASS + 1))
            test "$MATERIALIZATION_PASS" -le 3

            git fetch --no-tags origin main "$SAFE_MAIN"
            LIVE_MAIN="$(git rev-parse origin/main^{commit})"
            LIVE_TREE="$(git rev-parse "$LIVE_MAIN^{tree}")"
            test "$(git rev-parse "$SAFE_MAIN^{commit}")" = "$SAFE_MAIN"
            test "$(git rev-parse "$SAFE_MAIN^{tree}")" = "$SAFE_TREE"
            git merge-base --is-ancestor "$SAFE_MAIN" "$LIVE_MAIN"

            git diff --name-only --no-renames "$SAFE_MAIN..$LIVE_MAIN" | sort -u > /tmp/live-main-advance-paths
            comm -12 /tmp/expected-product-paths /tmp/live-main-advance-paths > /tmp/live-main-overlap-paths
            test ! -s /tmp/live-main-overlap-paths

            cp "$UNPATCHED_BUILDER" "$BUILDER"
            python - "$BUILDER" "$SAFE_MAIN" "$LIVE_MAIN" "$SAFE_TREE" "$LIVE_TREE" <<'PYPATCH'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old_commit, new_commit, old_tree, new_tree = sys.argv[2:]
          source = path.read_text()
          assert source.count(old_commit) == 1, source.count(old_commit)
          assert source.count(old_tree) == 1, source.count(old_tree)
          if new_commit != old_commit:
              assert source.count(new_commit) == 0, source.count(new_commit)
              source = source.replace(old_commit, new_commit)
          if new_tree != old_tree:
              assert source.count(new_tree) == 0, source.count(new_tree)
              source = source.replace(old_tree, new_tree)
          path.write_text(source)
          PYPATCH
            PATCHED_BUILDER_SHA="$(sha256sum "$BUILDER" | awk '{print $1}')"
            node --check "$BUILDER"

            git worktree remove --force "$PRODUCT" 2>/dev/null || true
            git worktree remove --force "$REPRO" 2>/dev/null || true
            rm -rf "$PRODUCT" "$REPRO"
            git worktree add --detach "$PRODUCT" "$LIVE_MAIN"
            git worktree add --detach "$REPRO" "$LIVE_MAIN"
            install -m 0644 "$BUILDER" "$PRODUCT/tools/build-schoolhouse-fl-corporate-identity-census-custody.mjs"
            install -m 0644 "$BUILDER" "$REPRO/tools/build-schoolhouse-fl-corporate-identity-census-custody.mjs"

            (
              cd "$PRODUCT"
              node tools/build-schoolhouse-fl-corporate-identity-census-custody.mjs "$ARTIFACT" | tee "$RECEIPT/build-output.json"
              node --check tools/build-schoolhouse-fl-corporate-identity-census-custody.mjs
              node --check tools/validate-bvvc-defense-capital.mjs
              node --check tools/validate-schoolhouse-honor-foundation-990-custody.mjs
              node tools/validate-bvvc-defense-capital.mjs
              node tools/validate-schoolhouse-honor-foundation-990-custody.mjs
              node test/person-routers.test.js
              npm run release:check

              git diff --name-only --no-renames "$LIVE_MAIN" | sort -u > /tmp/tracked-after-gate-paths
              comm -23 /tmp/tracked-after-gate-paths /tmp/expected-product-paths > /tmp/nonproduct-tracked-paths
              while IFS= read -r generated_path; do
                test -z "$generated_path" || git restore --source="$LIVE_MAIN" --worktree --staged -- "$generated_path"
              done < /tmp/nonproduct-tracked-paths

              git ls-files --others --exclude-standard | sort -u > /tmp/untracked-after-gate-paths
              comm -23 /tmp/untracked-after-gate-paths /tmp/expected-product-paths > /tmp/unexpected-untracked-paths
              test ! -s /tmp/unexpected-untracked-paths

              while IFS= read -r product_path; do git add -- "$product_path"; done < /tmp/expected-product-paths
              git diff --cached --name-only --no-renames | sort -u > /tmp/staged-product-paths
              diff -u /tmp/expected-product-paths /tmp/staged-product-paths
              test "$(wc -l < /tmp/staged-product-paths | tr -d ' ')" = '17'
              test "$(grep -c '^\.github/workflows/' /tmp/staged-product-paths || true)" = '0'
              test "$(grep -c '^\.' /tmp/staged-product-paths || true)" = '0'
            )

            (
              cd "$REPRO"
              node tools/build-schoolhouse-fl-corporate-identity-census-custody.mjs "$ARTIFACT" > /tmp/reproduction-build-output.json
              node tools/validate-bvvc-defense-capital.mjs
              node tools/validate-schoolhouse-honor-foundation-990-custody.mjs
            )
            diff -u "$RECEIPT/build-output.json" /tmp/reproduction-build-output.json
            while IFS= read -r product_path; do
              cmp "$PRODUCT/$product_path" "$REPRO/$product_path"
            done < /tmp/expected-product-paths

            git fetch --no-tags origin main
            OBSERVED_MAIN="$(git rev-parse origin/main^{commit})"
            if test "$OBSERVED_MAIN" != "$LIVE_MAIN"; then
              git merge-base --is-ancestor "$LIVE_MAIN" "$OBSERVED_MAIN"
              git diff --name-only --no-renames "$LIVE_MAIN..$OBSERVED_MAIN" | sort -u > /tmp/during-gate-advance-paths
              comm -12 /tmp/expected-product-paths /tmp/during-gate-advance-paths > /tmp/during-gate-overlap-paths
              test ! -s /tmp/during-gate-overlap-paths
              continue
            fi
            break
          done

          cd "$PRODUCT"
          while IFS= read -r product_path; do sha256sum "$product_path"; done < /tmp/expected-product-paths > /tmp/product-SHA256SUMS
          sha256sum -c /tmp/product-SHA256SUMS

          git config user.name 'School.House Florida Corporate Census Materializer'
          git config user.email 'actions@users.noreply.github.com'
          while IFS= read -r product_path; do git add -- "$product_path"; done < /tmp/expected-product-paths
          git diff --cached --name-only --no-renames | sort -u > /tmp/staged-product-paths
          diff -u /tmp/expected-product-paths /tmp/staged-product-paths
          git commit -m 'Preserve complete School.House Florida corporate identity census'

          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^1)" = "$LIVE_MAIN"
          test "$(git rev-list --count "$LIVE_MAIN..HEAD")" = '1'
          git diff-tree --no-commit-id --name-only -r HEAD | sort -u > /tmp/committed-product-paths
          diff -u /tmp/expected-product-paths /tmp/committed-product-paths
          test -z "$(git status --porcelain)"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main^{commit})" = "$LIVE_MAIN"
          git push --force origin "HEAD:refs/heads/$TARGET"

          cp /tmp/expected-product-paths "$RECEIPT/permanent-paths.txt"
          cp /tmp/product-SHA256SUMS "$RECEIPT/product-SHA256SUMS"
          cp /tmp/live-main-advance-paths "$RECEIPT/safe-anchor-to-parent-paths.txt"
          cp /tmp/staged-product-paths "$RECEIPT/staged-product-paths.txt"
          cat > "$RECEIPT/materialization.txt" <<RECEIPT_DATA
          materializer_workflow_run_id=$GITHUB_RUN_ID
          materializer_workflow_head=$GITHUB_SHA
          known_safe_main=$SAFE_MAIN
          known_safe_tree=$SAFE_TREE
          canonical_parent_commit=$LIVE_MAIN
          canonical_parent_tree=$LIVE_TREE
          materialization_passes=$MATERIALIZATION_PASS
          patched_builder_sha256=$PATCHED_BUILDER_SHA
          product_commit=$PRODUCT_COMMIT
          product_tree=$PRODUCT_TREE
          product_branch=$TARGET
          permanent_paths=17
          carrier_paths=0
          acquisition_workflow_run_id=31056239350
          acquisition_workflow_head=fab302a769eff491f0caa363a3a565ec828e32e6
          acquisition_artifact_id=8950526654
          acquisition_artifact_digest=sha256:98925c7a750f23cf8ed10fb1123ed0d79d78dcca79d4c67a2b0e26ed86146746
          source_inventory_rows=478
          coverage_denominator_rows=29
          explicit_gap_rows=16
          source_rows_scanned=12808196
          candidate_rows=300
          corporate_name_schoolhouse_phrase_rows=278
          corporate_name_exact_public_brand_base_rows=4
          corporate_name_schoolhouse_1776_rows=0
          source_listed_person_match_rows=22
          name_and_person_overlap_rows=0
          identity_admitted_rows=0
          negative_existence_claims_created=0
          outside_human_dependency=false
          publication_effect=none
          adoption_effect=none
          graph_effect=none
          RECEIPT_DATA
          sed -i 's/^          //' "$RECEIPT/materialization.txt"
          (
            cd "$RECEIPT"
            sha256sum \
              build-output.json \
              materialization.txt \
              permanent-paths.txt \
              product-SHA256SUMS \
              safe-anchor-to-parent-paths.txt \
              staged-product-paths.txt \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schoolhouse-fl-corporate-identity-census-materialization-receipt
          path: /tmp/schoolhouse-fl-corporate-identity-census-materialization-receipt
          if-no-files-found: warn
          retention-days: 90
