name: Export exact RD-04 North Dakota canonical matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ssc-rd04-nd-row-state-validation-v2-materializer.yml'

permissions:
  contents: read

env:
  FROZEN_MAIN: bab9570ab043df7c5062e5a45a0717a82eed346b
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-promotion/promoted-partial-field-matrix.json
  CONTROLLER_PATH: .github/workflows/ssc-rd04-nd-row-state-validation-v2-materializer.yml
  OUT: /tmp/ssc-rd04-nd-row-state-validation-v2-matrix-export

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-row-state-validation-v2-materializer-v1' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Bind exact one-path read-only carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.sha }}' = "$FROZEN_MAIN"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$FROZEN_MAIN"
          test "$(git rev-list --count "$FROZEN_MAIN..HEAD")" -eq 1
          test "$(git diff --name-only "$FROZEN_MAIN" HEAD)" = "$CONTROLLER_PATH"
          test "$(git diff --name-only --diff-filter=A "$FROZEN_MAIN" HEAD)" = "$CONTROLLER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$FROZEN_MAIN" HEAD)"
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$FROZEN_MAIN"
      - name: Export exact canonical matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "$MATRIX_PATH" "$OUT/promoted-partial-field-matrix.json"
          test "$(stat -c %s "$OUT/promoted-partial-field-matrix.json")" -eq 495400
          test "$(sha256sum "$OUT/promoted-partial-field-matrix.json" | awk '{print $1}')" = '1878270c1c34d1a96b28eb0ee26eff5b1b3b6c8d74a56026c293544c7925d824'
          git rev-parse "$FROZEN_MAIN^{tree}" > "$OUT/canonical-main-tree.txt"
          git show -s --format='%P' "$FROZEN_MAIN" > "$OUT/canonical-main-parents.txt"
          (cd "$OUT" && sha256sum promoted-partial-field-matrix.json canonical-main-tree.txt canonical-main-parents.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve exact matrix export
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-row-state-validation-v2-matrix-export
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
