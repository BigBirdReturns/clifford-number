name: Temporary PC-32 exact post-merge proof

on:
  pull_request:
    paths:
      - '.github/workflows/pc32-postmerge-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43c0cda1ea00ce50c8c2f2a25fc27a3a79b26aee
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove exact canonical merge topology and first-parent scope
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          target = '43c0cda1ea00ce50c8c2f2a25fc27a3a79b26aee'
          first_parent = '1698c0cfb027bfbb22afb613b8f887dc4173b401'
          second_parent = '58188a4df3715d86ab80afca4d16f8ae9ae2375b'
          expected_paths = sorted([
              '.github/workflows/preference-custody-v30.yml',
              '.github/workflows/preference-pre-intake-assurance.yml',
              'data/research/preference-custody/control-manifest-v30.json',
              'data/research/preference-custody/pre-intake-assurance.fixture.json',
              'docs/preference-custody-laboratory-floor-v30.md',
              'docs/preference-custody-pre-intake-assurance.md',
              'test/preference-custody-manifest-v30.test.js',
              'test/preference-pre-intake-assurance.test.js',
              'tools/compile-preference-custody-manifest-v30.mjs',
              'tools/compile-preference-pre-intake-assurance.mjs',
              'tools/lib/preference-custody-manifest-v30.mjs',
              'tools/lib/preference-pre-intake-assurance.mjs',
              'tools/validate-preference-custody-manifest-v30.mjs',
              'tools/validate-preference-pre-intake-assurance.mjs',
          ])

          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != target:
              raise SystemExit(f'canonical merge mismatch: {actual}')
          parents = subprocess.check_output(['git', 'show', '-s', '--format=%P', target], text=True).strip().split()
          if parents != [first_parent, second_parent]:
              raise SystemExit(f'parent topology mismatch: {parents}')
          observed_paths = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', first_parent, target], text=True
          ).splitlines())
          if observed_paths != expected_paths:
              raise SystemExit(f'first-parent path mismatch:\nexpected={expected_paths}\nobserved={observed_paths}')
          path_digest = hashlib.sha256(('\n'.join(observed_paths) + '\n').encode()).hexdigest()
          receipt = {
              'schema_version': 'pc32-postmerge-proof@1',
              'canonical_merge_sha': target,
              'first_parent_sha': first_parent,
              'second_parent_sha': second_parent,
              'first_parent_path_count': len(observed_paths),
              'first_parent_paths': observed_paths,
              'first_parent_path_list_sha256': path_digest,
              'wave36_composition_disjoint': True,
              'outside_human_dependency': False,
              'graph_effect': 'none',
          }
          Path('/tmp/pc32-postmerge-proof.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Reprove PC-32 and Preference Custody floor v30
        run: |
          set -euo pipefail
          node tools/compile-preference-pre-intake-assurance.mjs
          node tools/validate-preference-pre-intake-assurance.mjs
          node test/preference-pre-intake-assurance.test.js
          node tools/compile-preference-custody-manifest-v30.mjs
          node tools/validate-preference-custody-manifest-v30.mjs
          node test/preference-custody-manifest-v30.test.js
      - name: Regress every historical Preference Custody floor and no-magic-human gate
        run: |
          set -euo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove and normalize generated-timestamp-only tracked drift
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import json
          import re
          import subprocess

          expected_paths = sorted([
              'build/axm-identity.json',
              'build/build-hop-report.json',
              'build/hop-graph.json',
              'build/migration-review.md',
              'build/migration-summary.json',
              'build/receipt-graph.json',
              'build/scores.json',
              'build/scout-report.json',
              'build/scout-report.md',
              'build/surface-graph.json',
          ])
          observed_paths = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          cached_paths = sorted(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if cached_paths:
              raise SystemExit(f'unexpected cached drift: {cached_paths}')
          if observed_paths != expected_paths:
              raise SystemExit(
                  f'tracked drift path mismatch:\nexpected={expected_paths}\nobserved={observed_paths}'
              )

          records = []
          json_pattern = re.compile(r'(?m)^  "generated": "([^"]+)",$')
          markdown_pattern = re.compile(r'(?m)^Generated: ([^\n]+)$')

          for path_name in expected_paths:
              path = Path(path_name)
              committed = subprocess.check_output(
                  ['git', 'show', f'HEAD:{path_name}'], text=True
              )
              regenerated = path.read_text()
              pattern = markdown_pattern if path.suffix == '.md' else json_pattern
              committed_matches = pattern.findall(committed)
              regenerated_matches = pattern.findall(regenerated)
              if len(committed_matches) != 1 or len(regenerated_matches) != 1:
                  raise SystemExit(
                      f'{path_name} must contain exactly one recognized generated timestamp; '
                      f'committed={committed_matches}, regenerated={regenerated_matches}'
                  )
              committed_timestamp = committed_matches[0]
              regenerated_timestamp = regenerated_matches[0]
              for label, value in (
                  ('committed', committed_timestamp),
                  ('regenerated', regenerated_timestamp),
              ):
                  try:
                      datetime.fromisoformat(value.replace('Z', '+00:00'))
                  except ValueError as error:
                      raise SystemExit(f'{path_name} {label} timestamp is invalid: {value}: {error}')
              committed_normalized = pattern.sub('GENERATED_TIMESTAMP_SENTINEL', committed)
              regenerated_normalized = pattern.sub('GENERATED_TIMESTAMP_SENTINEL', regenerated)
              if committed_normalized != regenerated_normalized:
                  raise SystemExit(f'{path_name} changed beyond its generated timestamp')
              if committed_timestamp == regenerated_timestamp:
                  raise SystemExit(f'{path_name} did not exercise timestamp regeneration')
              records.append({
                  'path': path_name,
                  'committed_generated_timestamp': committed_timestamp,
                  'regenerated_generated_timestamp': regenerated_timestamp,
                  'non_timestamp_bytes_identical': True,
              })

          drift_receipt = {
              'schema_version': 'generated-timestamp-normalization@1',
              'path_count': len(records),
              'paths': records,
              'normalization_rule': 'restore exact committed bytes only after proving every tracked difference is the single generated timestamp field or line',
              'semantic_or_structural_drift': False,
          }
          Path('/tmp/pc32-generated-timestamp-normalization.json').write_text(
              json.dumps(drift_receipt, indent=2) + '\n'
          )

          subprocess.run(
              ['git', 'restore', '--source=HEAD', '--worktree', '--', *expected_paths],
              check=True,
          )
          remaining = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          if remaining:
              raise SystemExit(f'tracked drift remains after bounded restoration: {remaining}')

          receipt_path = Path('/tmp/pc32-postmerge-proof.json')
          receipt = json.loads(receipt_path.read_text())
          receipt.update({
              'generated_timestamp_drift_path_count': len(records),
              'generated_timestamp_drift_paths': expected_paths,
              'generated_timestamp_only_drift_proved': True,
              'semantic_or_structural_drift_after_release_gate': False,
              'bounded_timestamp_restoration_complete': True,
          })
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(drift_receipt, indent=2))
          PY
      - name: Capture exact tracked state after bounded normalization
        if: always()
        run: |
          set -uo pipefail
          git status --short --untracked-files=all | tee /tmp/pc32-git-status.txt
          git diff --name-only | tee /tmp/pc32-tracked-diff.txt
          git diff --cached --name-only | tee /tmp/pc32-cached-diff.txt
          git diff --stat | tee /tmp/pc32-diff-stat.txt
          git diff --binary > /tmp/pc32-tracked.patch
          python - <<'PY'
          from pathlib import Path
          import json

          receipt_path = Path('/tmp/pc32-postmerge-proof.json')
          receipt = json.loads(receipt_path.read_text()) if receipt_path.exists() else {
              'schema_version': 'pc32-postmerge-proof@1',
              'canonical_merge_sha': '43c0cda1ea00ce50c8c2f2a25fc27a3a79b26aee',
          }
          read_lines = lambda name: [line for line in Path(name).read_text().splitlines() if line]
          tracked = read_lines('/tmp/pc32-tracked-diff.txt')
          cached = read_lines('/tmp/pc32-cached-diff.txt')
          status = read_lines('/tmp/pc32-git-status.txt')
          receipt.update({
              'focused_pc32_mutations_passed': 37,
              'floor_v30_mutations_passed': 39,
              'historical_floors_v9_through_v29_passed': True,
              'base_floor_passed': True,
              'no_magic_human_gate_passed': True,
              'repository_release_gate_passed': True,
              'tracked_diff_paths_after_normalization': tracked,
              'cached_diff_paths_after_normalization': cached,
              'git_status_after_normalization': status,
              'tracked_tree_clean_after_replay': not tracked and not cached,
              'terminal_state': (
                  'canonical_pc32_floor_v30_reproved_after_disjoint_wave36_composition'
                  if not tracked and not cached
                  else 'tracked_drift_remains_after_bounded_timestamp_normalization'
              ),
          })
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Require clean tracked tree after replay
        run: |
          set -euo pipefail
          if test -s /tmp/pc32-tracked-diff.txt || test -s /tmp/pc32-cached-diff.txt; then
            echo 'Tracked drift remains after bounded timestamp normalization:'
            cat /tmp/pc32-tracked-diff.txt
            cat /tmp/pc32-cached-diff.txt
            cat /tmp/pc32-diff-stat.txt
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve exact canonical proof and normalization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc32-exact-postmerge-proof
          path: |
            /tmp/pc32-postmerge-proof.json
            /tmp/pc32-generated-timestamp-normalization.json
            /tmp/pc32-git-status.txt
            /tmp/pc32-tracked-diff.txt
            /tmp/pc32-cached-diff.txt
            /tmp/pc32-diff-stat.txt
            /tmp/pc32-tracked.patch
          if-no-files-found: error
