name: Temporary PR 2231 V120 qualified publisher V1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v120-qualified-publisher-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish-v120:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v120-qualified-publisher-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v120-qualified-publisher-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute exact qualified publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          envelope=/tmp/pr2231-v120-qualified-publisher-controller-envelope-v1
          publisher_xz="$envelope/publisher-v1.sh.xz"
          publisher="$envelope/publisher-v1.sh"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          exec > >(tee "$envelope/controller.log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=qualified-compare-and-swap-publication\n' "$rc" > "$envelope/controller-status.env"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            find "$envelope" -type f -printf '%P\t%s\n' | sort > "$envelope/envelope-manifest.txt"
            exit "$rc"
          }
          trap preserve EXIT

