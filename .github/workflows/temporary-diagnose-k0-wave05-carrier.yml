name: Temporary repair K0 Wave 05 carrier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave05-carrier.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-05
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave05-carrier.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-05
          fetch-depth: 0
      - name: Apply the unique valid carrier reconstruction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, hashlib, tarfile

          target = '191727093d18d1df7684f0b57883544f935f481aa67c9125d2f0693437221aca'
          expected_names = [
              'materialize-k0-role-neutral-wave-05.mjs',
              'payload/.github/workflows/k0-role-neutral-wave-05.yml',
              'payload/data/research/k0-role-neutral-wave-05.json',
              'payload/docs/milestones/m05-k0-role-neutral-wave-05.md',
              'payload/test/k0-role-neutral-wave-05.test.js',
              'payload/tools/build-k0-role-neutral-wave-05.mjs',
              'payload/tools/validate-k0-role-neutral-wave-05.mjs',
          ]
          paths = sorted(Path('.github/tmp').glob('k0-wave05-materializer-part-*.b64'))
          assert len(paths) == 4, paths
          chunks = [b''.join(path.read_bytes().split()) for path in paths]

          def verify(encoded: bytes):
              decoded = base64.b64decode(encoded, validate=True)
              assert hashlib.sha256(decoded).hexdigest() == target
              with tarfile.open(fileobj=BytesIO(decoded), mode='r:gz') as archive:
                  assert archive.getnames() == expected_names, archive.getnames()
                  for member in archive.getmembers():
                      if member.isfile():
                          handle = archive.extractfile(member)
                          assert handle is not None
                          while handle.read(1024 * 1024):
                              pass
              return decoded

          merged = b''.join(chunks)
          try:
              verify(merged)
              print('carrier already equals unique recovered archive')
              raise SystemExit(0)
          except Exception:
              pass

          assert len(chunks[0]) == 5499, len(chunks[0])
          assert len(merged) == 20099, len(merged)
          repaired = chunks[0][:293] + b'O' + chunks[0][293:]
          decoded = verify(b''.join([repaired, *chunks[1:]]))
          paths[0].write_bytes(repaired)
          print(f'repaired fragment-00 at byte 293; archive bytes={len(decoded)} sha256={target}')
          PY

          if git diff --quiet -- .github/tmp/k0-wave05-materializer-part-00.b64; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tmp/k0-wave05-materializer-part-00.b64
          git commit -m 'Repair exact Wave 05 carrier fragment'
          git push origin HEAD:agent/k0-role-neutral-wave-05
