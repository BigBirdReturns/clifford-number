name: Temporary diagnose K0 Wave 05 carrier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave05-carrier.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-05
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave05-carrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-05
      - name: Search one-character repairs for a valid gzip tar archive
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, hashlib, tarfile, time

          paths = sorted(Path('.github/tmp').glob('k0-wave05-materializer-part-*.b64'))
          assert len(paths) == 4, paths
          chunks = [b''.join(path.read_bytes().split()) for path in paths]
          assert len(chunks[0]) % 4 == 3
          assert all(len(chunk) % 4 == 0 for chunk in chunks[1:])
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          tail = b''.join(chunks[1:])
          target = '229b15062e72d756d7fbda7eec1c6345530f00edfe4462cff403826be00b76a5'
          found = []
          started = time.time()

          for pos in range(len(chunks[0]) + 1):
              prefix = chunks[0][:pos]
              suffix = chunks[0][pos:]
              for char in alphabet:
                  encoded = prefix + bytes([char]) + suffix + tail
                  try:
                      decoded = base64.b64decode(encoded, validate=True)
                      with tarfile.open(fileobj=BytesIO(decoded), mode='r:gz') as archive:
                          names = archive.getnames()
                          members = archive.getmembers()
                          for member in members:
                              if member.isfile():
                                  handle = archive.extractfile(member)
                                  if handle is not None:
                                      while handle.read(1024 * 1024):
                                          pass
                  except Exception:
                      continue
                  digest = hashlib.sha256(decoded).hexdigest()
                  found.append((pos, chr(char), digest, len(decoded), names))
                  print(f'VALID pos={pos} char={chr(char)!r} sha256={digest} bytes={len(decoded)} names={names}')
              if pos % 500 == 0:
                  print(f'progress pos={pos} elapsed={time.time()-started:.1f}s')

          print(f'valid repair candidates={len(found)}')
          exact = [row for row in found if row[2] == target]
          print(f'frozen-hash candidates={exact}')
          assert found, 'no one-character insertion yields a valid gzip tar archive'
          PY
