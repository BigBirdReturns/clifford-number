name: Temporary diagnose K0 Wave 05 aggregate state

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave05-carrier.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-05
    paths:
      - '.github/workflows/temporary-diagnose-k0-wave05-carrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-05
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize and expose aggregate Wave 05 values
        run: |
          set -euo pipefail
          cat .github/tmp/k0-wave05-materializer-part-*.b64 | base64 -d > /tmp/k0-wave05-materializer.tgz
          test "$(sha256sum /tmp/k0-wave05-materializer.tgz | awk '{print $1}')" = "191727093d18d1df7684f0b57883544f935f481aa67c9125d2f0693437221aca"
          rm -rf /tmp/k0-wave05-materializer
          mkdir -p /tmp/k0-wave05-materializer
          tar -xzf /tmp/k0-wave05-materializer.tgz -C /tmp/k0-wave05-materializer
          node /tmp/k0-wave05-materializer/materialize-k0-role-neutral-wave-05.mjs
          node tools/build-k0-role-neutral-wave-05.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          python - <<'PY'
          import json
          coverage = json.load(open('data/research/corpus-coverage.json'))
          reviews = json.load(open('data/research/selection-adversarial-reviews.json'))
          neutral = json.load(open('data/research/k0-role-neutral-denominator.json'))
          row = next(x for x in coverage['lanes'] if x['lane_id'] == 'epistemic-admissibility-ceiling-events')
          metric = next((x for x in row.get('metrics', []) if x.get('metric_id') == 'candidate_records_pending_field_audit'), None)
          gap04 = next((x for x in row.get('known_gaps', []) if x.get('gap_id') == 'k0-wave04-field-adjudication-open'), None)
          gap05 = next((x for x in row.get('known_gaps', []) if x.get('gap_id') == 'k0-wave05-field-adjudication-open'), None)
          review = next(x for x in reviews['reviews'] if x['lane_id'] == 'epistemic-admissibility-ceiling-events')
          print('metric=', json.dumps(metric, indent=2))
          print('gap04=', json.dumps(gap04, indent=2))
          print('gap05=', json.dumps(gap05, indent=2))
          print('neutral.status=', neutral.get('status'))
          print('neutral.execution=', json.dumps(neutral.get('execution'), indent=2))
          print('review.execution=', json.dumps(review.get('role_neutral_execution'), indent=2))
          PY
          grep -n -A8 -B3 "pendingFieldMetric" tools/validate-k0-epistemic-admissibility.mjs
