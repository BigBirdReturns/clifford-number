name: Temporary finalize M-05 Sprint 03 Leg 06

on:
  push:
    branches:
      - agent/m05-sprint-03-leg-06-value-recovery-transfer
    paths:
      - '.github/workflows/temporary-finalize-m05-s03-l6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-03-leg-06-value-recovery-transfer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate permanent Leg 06 products
        run: |
          node tools/build-m05-answerable-power-sprint-03-leg-06.mjs
          node tools/validate-m05-answerable-power-sprint-03-leg-06.mjs
          node test/m05-answerable-power-sprint-03-leg-06.test.js
      - name: Remove temporary transport and commit permanent surface
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/core-thesis/answerable-power/sprint-03-leg-06.json reports/core-thesis/answerable-power/sprint-03-leg-06.html
          git rm -f .github/workflows/temporary-materialize-m05-s03-l6.yml .github/workflows/temporary-finalize-m05-s03-l6.yml docs/milestones/.m05-s03-l6-trigger docs/milestones/m05-answerable-power-sprint-03-leg-06-review.md || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize M-05 Sprint 03 Leg 06'
          git push origin HEAD:agent/m05-sprint-03-leg-06-value-recovery-transfer
