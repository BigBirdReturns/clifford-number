name: Temporary PR 2231 V129 exact leased publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-v129-exact-leased-publisher
  cancel-in-progress: false

jobs:
  publish-v129:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v129-source-custody-publisher-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v129-source-custody-publisher-v1
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute exact V129 replay and leased publication
        shell: bash
        run: bash .github/scripts/pr2231-v129-publisher-v1.sh

      - name: Retain V129 publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v129-exact-leased-publication-v1
          path: /tmp/pr2231-v129-publisher-v1
          if-no-files-found: error
          retention-days: 90
