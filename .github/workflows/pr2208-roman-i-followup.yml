name: PR2208 pronoun-title boundary repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr2208-roman-i-followup.yml'

permissions:
  contents: read

concurrency:
  group: pr2208-pronoun-title-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  patch-qualify-publish:
    if: ${{ github.event.pull_request.head.ref == 'agent/pr2194-fresh-sentence-followup-controller-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CONTROLLER_BRANCH: agent/pr2194-fresh-sentence-followup-controller-v1
      RESULT_BRANCH: agent/pr2194-fresh-sentence-followup-v1
      EXPECTED_BASE_HEAD: eef55693745f299330323296b700d8c4f7a2c23a
      EXPECTED_PRODUCT_HEAD: c80f3ab9ebaca6ac38aaef97fb978b655ad5cc3e
      EXPECTED_TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild the exact two-file candidate on live main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_HEAD"
          git fetch origin \
            'refs/heads/main:refs/remotes/origin/main' \
            "refs/heads/$CONTROLLER_BRANCH:refs/remotes/origin/$CONTROLLER_BRANCH" \
            "refs/heads/$RESULT_BRANCH:refs/remotes/origin/$RESULT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/$CONTROLLER_BRANCH)" = "$EXPECTED_TRIGGER_HEAD"
          test "$(git rev-parse refs/remotes/origin/$RESULT_BRANCH)" = "$EXPECTED_PRODUCT_HEAD"

          git checkout -B pr2208-pronoun-title-candidate refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_HEAD"

          python - <<'PY'
          from pathlib import Path

          source_path = Path('tools/lib/industrial-exhaust.mjs')
          source = source_path.read_text()
          helper_marker = "\nfunction isNarrativePeriodAbbreviation(value, contextStart, periodIndex, boundaryEnd) {"
          assert source.count(helper_marker) == 1, 'narrative abbreviation helper marker changed'
          helpers = r"""
          function isLikelyNamedEntityContinuation(value) {
            const normalized = value.normalize('NFKC').trim();
            const labelMatch = normalized.match(
              /(?:\s+(?:tel(?:ephone)?|phone|mobile|cell|fax|contact)(?:\s+(?:number|no))?\s*[:.]?\s*|(?:電話(?:番号)?|携帯(?:電話)?|ファックス|連絡先|お問い合わせ先)\s*[:.]?\s*)$/iu
            );
            const phrase = (labelMatch
              ? normalized.slice(0, labelMatch.index)
              : normalized).trim();
            if (!phrase || /[.!?。！？]/u.test(phrase)) return false;

            const words = phrase.split(/\s+/u);
            if (words.length < 2 || words.length > 10) return false;
            const connectorPattern = /^(?:a|an|and|at|by|for|from|in|of|on|the|to|with|&)$/iu;
            const nameTokenPattern = /^[\p{Lu}\p{Lt}\d][\p{L}\p{M}\p{N}&'’\-]*$/u;
            if (!words.every(word => connectorPattern.test(word) || nameTokenPattern.test(word))) {
              return false;
            }

            const suffix = words.at(-1).toLocaleLowerCase('en-US');
            const hasInstitutionalSuffix = /^(?:academy|agency|army|association|bank|battalion|brigade|center|centre|club|collective|command|company|corp|corporation|council|department|district|division|fleet|force|foundation|fund|group|holdings|initiative|institute|institution|lab|labs|laboratory|media|museum|network|office|organization|organisation|partners|people|project|records|regiment|services|society|solutions|squadron|studio|systems|team|trust|ventures|wing|works)$/u.test(
              suffix
            );
            if (hasInstitutionalSuffix) return true;

            const hasMixedCaseTitleToken = words.slice(1).some(word =>
              nameTokenPattern.test(word) && /\p{Ll}/u.test(word)
            );
            return Boolean(labelMatch) && words.length >= 3 && hasMixedCaseTitleToken;
          }

          function isPronounSentenceLead(value) {
            const normalized = value.normalize('NFKC').trimStart();
            if (/^(?:i|we|you|he|she|they|it|this|that|these|those)['’](?:m|s|re|ve|ll|d)(?=$|[^\p{L}])/iu.test(normalized)) {
              return true;
            }

            const leadMatch = normalized.match(
              /^(?:i|we|you|he|she|they|it|this|that|these|those)(?:\s+|$)/iu
            );
            if (!leadMatch) return false;
            const followingTokens = normalized.slice(leadMatch[0].length)
              .match(/[\p{L}]+/gu)?.slice(0, 4) ?? [];
            if (!followingTokens.length) return false;

            const firstToken = followingTokens[0];
            const normalizedFirst = firstToken.toLocaleLowerCase('en-US');
            if (firstToken === normalizedFirst) return true;

            const predicatePattern = /^(?:am|are|is|was|were|be|been|being|have|has|had|having|will|would|shall|should|can|could|may|might|must|do|does|did|doing|say|says|said|saying|call|calls|called|calling|ask|asks|asked|asking|need|needs|needed|needing|want|wants|wanted|wanting|use|uses|used|using|see|sees|saw|seen|seeing|think|thinks|thought|thinking|move|moves|moved|moving|live|lives|lived|living|work|works|worked|working|send|sends|sent|sending|contact|contacts|contacted|contacting|email|emails|emailed|emailing|text|texts|texted|texting|dial|dials|dialed|dialing|reply|replies|replied|replying|write|writes|wrote|written|writing|read|reads|reading|find|finds|found|finding|get|gets|got|getting|care|cares|cared|caring|help|helps|helped|helping|lead|leads|led|leading|provide|provides|provided|providing|offer|offers|offered|offering|remain|remains|remained|remaining|matter|matters|mattered|mattering|seem|seems|seemed|seeming|become|becomes|became|becoming|make|makes|made|making|take|takes|took|taken|taking|give|gives|gave|given|giving|know|knows|knew|known|knowing|look|looks|looked|looking|come|comes|came|coming|go|goes|went|gone|going|keep|keeps|kept|keeping|let|lets|letting|support|supports|supported|supporting|serve|serves|served|serving|build|builds|built|building|run|runs|ran|running)$/u;
            return followingTokens.some(token =>
              predicatePattern.test(token.toLocaleLowerCase('en-US'))
            );
          }

          function startsFreshSentenceAfterAbbreviation(value) {
            const normalized = value.normalize('NFKC').trimStart();
            if (isLikelyNamedEntityContinuation(normalized)) return false;

            const lead = (normalized.match(/^[\p{L}]+/u)?.[0] ?? '')
              .toLocaleLowerCase('en-US');
            if (/^(?:i|we|you|he|she|they|it|this|that|these|those)$/u.test(lead)) {
              return isPronounSentenceLead(normalized);
            }
            return /^(?:then|please|afterward|meanwhile|however|therefore|otherwise|instead|finally)$/u.test(
              lead
            );
          }
          """
          source = source.replace(helper_marker, helpers + helper_marker, 1)

          old_remainder = r"""  const remainder = value.slice(boundaryEnd);
            const hasRemainder = /\S/u.test(remainder);
            if (hasRemainder && !isTelephoneLabelRemainder(remainder)) return true;"""
          new_remainder = r"""  const remainder = value.slice(boundaryEnd);
            const hasRemainder = /\S/u.test(remainder);
            if (hasRemainder && startsFreshSentenceAfterAbbreviation(remainder)) return false;
            if (hasRemainder && !isTelephoneLabelRemainder(remainder)) return true;"""
          assert source.count(old_remainder) == 1, 'abbreviation remainder gate changed'
          source_path.write_text(source.replace(old_remainder, new_remainder, 1))

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text()
          marker = '// period abbreviation classification must remain lexical and context-bounded'
          assert tests.count(marker) == 1, 'test insertion marker changed'
          additions = r"""
          for (const [input, expected] of [
            [
              'Broken (He moved to the U.S. Then call +81 3 6216 5111)',
              'Broken (He moved to the U.S. Then call [contact omitted]'
            ],
            [
              'Broken (I said no. Please call +81 3 6216 5111)',
              'Broken (I said no. Please call [contact omitted]'
            ],
            [
              'Broken (Ask Dr. Then call +81 3 6216 5111)',
              'Broken (Ask Dr. Then call [contact omitted]'
            ],
            [
              'Broken (At 9 a.m. However contact +81 3 6216 5111)',
              'Broken (At 9 a.m. However contact [contact omitted]'
            ],
            [
              'Broken（He moved to the Ｕ．Ｓ． Then call ＋８１ ３ ６２１６ ５１１１）',
              'Broken（He moved to the Ｕ．Ｓ． Then call [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. THEN CALL +81 3 6216 5111)',
              'Broken (He moved to the U.S. THEN CALL [contact omitted]'
            ],
            [
              'Broken (I said no. PLEASE CALL +81 3 6216 5111)',
              'Broken (I said no. PLEASE CALL [contact omitted]'
            ],
            [
              'Broken (At 9 a.m. HOWEVER CONTACT +81 3 6216 5111)',
              'Broken (At 9 a.m. HOWEVER CONTACT [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. I called +81 3 6216 5111)',
              'Broken (He moved to the U.S. I called [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. I CALLED +81 3 6216 5111)',
              'Broken (He moved to the U.S. I CALLED [contact omitted]'
            ],
            [
              "Broken (He moved to the U.S. I'm calling +81 3 6216 5111)",
              "Broken (He moved to the U.S. I'm calling [contact omitted]"
            ],
            [
              'Broken (He moved to the U.S. I’ve called +81 3 6216 5111)',
              'Broken (He moved to the U.S. I’ve called [contact omitted]'
            ],
            [
              "Broken (He moved to the U.S. I'LL CALL +81 3 6216 5111)",
              "Broken (He moved to the U.S. I'LL CALL [contact omitted]"
            ],
            [
              'Broken（He moved to the Ｕ．Ｓ． Ｉ＇ｍ calling ＋８１ ３ ６２１６ ５１１１）',
              'Broken（He moved to the Ｕ．Ｓ． Ｉ＇ｍ calling [contact omitted]'
            ],
            [
              "Broken (He moved to the U.S. We're calling +81 3 6216 5111)",
              "Broken (He moved to the U.S. We're calling [contact omitted]"
            ],
            [
              "Broken (He moved to the U.S. THEY'LL CALL +81 3 6216 5111)",
              "Broken (He moved to the U.S. THEY'LL CALL [contact omitted]"
            ],
            [
              'Broken (He moved to the U.S. SHE CALLED +81 3 6216 5111)',
              'Broken (He moved to the U.S. SHE CALLED [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. WE CARE +81 3 6216 5111)',
              'Broken (He moved to the U.S. WE CARE [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. IT WORKS AT +81 3 6216 5111)',
              'Broken (He moved to the U.S. IT WORKS AT [contact omitted]'
            ],
            [
              'Broken (He moved to the U.S. THIS COMPANY CALLED +81 3 6216 5111)',
              'Broken (He moved to the U.S. THIS COMPANY CALLED [contact omitted]'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'a grammatical fresh-sentence lead after an abbreviation must reset wrapper ownership before the phone'
            );
          }

          for (const [input, expected] of [
            [
              'Context (U.S. Treasury Phone: +81 3 6216 5111)',
              'Context (U.S. Treasury Phone: [contact omitted])'
            ],
            [
              'Context (At 9 a.m. meeting Phone: +81 3 6216 5111)',
              'Context (At 9 a.m. meeting Phone: [contact omitted])'
            ],
            [
              'Context (Acme Inc. office Phone: +81 3 6216 5111)',
              'Context (Acme Inc. office Phone: [contact omitted])'
            ],
            [
              'Context (Acme Inc. Contact Center Phone: +81 3 6216 5111)',
              'Context (Acme Inc. Contact Center Phone: [contact omitted])'
            ],
            [
              'Context (Acme Inc. Call Center Phone: +81 3 6216 5111)',
              'Context (Acme Inc. Call Center Phone: [contact omitted])'
            ],
            [
              'Context (U.S. Open Phone: +81 3 6216 5111)',
              'Context (U.S. Open Phone: [contact omitted])'
            ],
            [
              'Context (U.S. I Corps Phone: +1 253 477 8777)',
              'Context (U.S. I Corps Phone: [contact omitted])'
            ],
            [
              'Context (U.S. I CORPS Phone: +1 253 477 8777)',
              'Context (U.S. I CORPS Phone: [contact omitted])'
            ],
            [
              'Context (U.S. I Army Phone: +1 703 695 0640)',
              'Context (U.S. I Army Phone: [contact omitted])'
            ],
            [
              'Context（Ｕ．Ｓ． Ｉ Corps Phone: ＋１ ２５３ ４７７ ８７７７）',
              'Context（Ｕ．Ｓ． Ｉ Corps Phone: [contact omitted]）'
            ],
            [
              'Context (U.S. IT Department Phone: +1 253 477 8777)',
              'Context (U.S. IT Department Phone: [contact omitted])'
            ],
            [
              'Context (U.S. IT DEPARTMENT Phone: +1 253 477 8777)',
              'Context (U.S. IT DEPARTMENT Phone: [contact omitted])'
            ],
            [
              'Context (U.S. IT Services Phone: +1 253 477 8777)',
              'Context (U.S. IT Services Phone: [contact omitted])'
            ],
            [
              'Context（Ｕ．Ｓ． ＩＴ Department Phone: ＋１ ２５３ ４７７ ８７７７）',
              'Context（Ｕ．Ｓ． ＩＴ Department Phone: [contact omitted]）'
            ],
            [
              'Context (Acme Inc. We Care Center Phone: +1 253 477 8777)',
              'Context (Acme Inc. We Care Center Phone: [contact omitted])'
            ],
            [
              'Context (U.S. We the People Foundation Phone: +1 253 477 8777)',
              'Context (U.S. We the People Foundation Phone: [contact omitted])'
            ],
            [
              'Context (U.S. She Leads Africa Phone: +1 253 477 8777)',
              'Context (U.S. She Leads Africa Phone: [contact omitted])'
            ],
            [
              'Context (U.S. This Is Us Foundation Phone: +1 253 477 8777)',
              'Context (U.S. This Is Us Foundation Phone: [contact omitted])'
            ],
            [
              'Context (U.S. Please Touch Museum Phone: +1 253 477 8777)',
              'Context (U.S. Please Touch Museum Phone: [contact omitted])'
            ],
            [
              'Context (Acme Inc. WE CARE CENTER Phone: +1 253 477 8777)',
              'Context (Acme Inc. WE CARE CENTER Phone: [contact omitted])'
            ],
            [
              'Context（Acme Inc. Ｗｅ Ｃａｒｅ Ｃｅｎｔｅｒ Phone: ＋１ ２５３ ４７７ ８７７７）',
              'Context（Acme Inc. Ｗｅ Ｃａｒｅ Ｃｅｎｔｅｒ Phone: [contact omitted]）'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'named entities and ordinary abbreviation continuations must retain their legitimately owned wrapper closer'
            );
          }

          """
          test_path.write_text(tests.replace(marker, additions + marker, 1))
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            test/industrial-exhaust.test.js \
            tools/lib/industrial-exhaust.mjs | sort)"
          test "$changed" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m 'fix(crawler): distinguish pronoun clauses from entity titles'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_HEAD"
          git push \
            --force-with-lease="refs/heads/$RESULT_BRANCH:$EXPECTED_PRODUCT_HEAD" \
            origin "HEAD:refs/heads/$RESULT_BRANCH"
