name: Repair Wave 16 current-resolution index access

on:
  push:
    branches:
      - agent/lake-subject-integration-wave-16
    paths:
      - '.github/tmp/lake-subject-integration-wave-16-current-entry-repair-trigger.json'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Repair the live resolution index access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build-lake-subject-integration-wave-16.mjs')
          text = path.read_text()
          old = "const wave16ResolutionEntries = localResolutionIndex.current_entries\n  .filter(entry => entry.source_path === policy.paths.local_resolution_registry)"
          new = "const wave16ResolutionEntries = [...localResolutionIndex.current_by_case_and_local.values()]\n  .filter(entry => entry.source_path === policy.paths.local_resolution_registry)"
          assert text.count(old) == 1, {'expected_occurrences': 1, 'actual': text.count(old)}
          path.write_text(text.replace(old, new))
          PY
          node --check tools/build-lake-subject-integration-wave-16.mjs
          rm -f \
            .github/tmp/lake-subject-integration-wave-16-current-entry-repair-trigger.json \
            .github/workflows/lake-subject-integration-wave-16-current-entry-repair.yml
          git diff --check
      - name: Commit and publish the interface repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Wave 16 current resolution index access'
          git fetch origin agent/lake-subject-integration-wave-16
          test "$(git rev-parse origin/agent/lake-subject-integration-wave-16)" = "${{ github.sha }}"
          git push origin HEAD:agent/lake-subject-integration-wave-16
