name: Launch POOF constitutional hardening

on:
  pull_request:
    branches: [main]
    paths:
      - '.poof-constitutional-hardening-launch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/poof-clifford-ecology'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/poof-clifford-ecology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the compile-checked constitutional hardening codemod
        run: |
          python3 -m py_compile .github/scripts/apply-poof-constitutional-hardening.py
          python3 .github/scripts/apply-poof-constitutional-hardening.py
      - name: Build and validate hardened ecology
        run: |
          npm run ci:poof-ecology
          git diff --check
      - name: Remove launch machinery and leave final-check marker
        run: |
          rm -f .poof-constitutional-hardening-trigger
          rm -f .poof-constitutional-hardening-launch
          rm -f .github/workflows/poof-constitutional-hardening-once.yml
          rm -f .github/workflows/poof-constitutional-hardening-launch.yml
          rm -f .github/scripts/apply-poof-constitutional-hardening.py
          cat > docs/poof-clifford-hardening-finalize.md <<'EOF'
          # POOF constitutional hardening finalization marker

          This temporary file exists only to permit one connector-authored deletion commit after the generated hardening commit. Its deletion triggers the ordinary PR validation workflows on the final hardened tree. It is outside the frozen ecology release scope.
          EOF
      - name: Commit hardened source and generated products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden POOF constitutional effect and projection law"
          git push origin HEAD:agent/poof-clifford-ecology
