name: Temporary publication 450 and SG-05 materializer

on:
  push:
    branches:
      - agent/publication-allowlist-poof-admission-v2
    paths:
      - '.github/workflows/temporary-publication450-sg05.yml'
      - '.github/tmp/publication450-sg05-launch'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication450-sg05-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-allowlist-poof-admission-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Execute exact publication and stable-ground transition
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: bash .github/scripts/run-publication450-sg05.sh 2>&1 | tee /tmp/publication450-sg05.log
      - name: Preserve materialization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication450-sg05-log-${{ github.run_id }}
          path: /tmp/publication450-sg05.log
          if-no-files-found: warn
          retention-days: 14
