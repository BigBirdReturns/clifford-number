name: Status sovereignty RD-01 Wave 02 terminal closure

on:
  pull_request:
    paths:
      - 'data/intake/status-sovereignty-rd-wave02-rd01-legal-entity/**'
      - 'data/project/ssc-residual-wave02/closures/RD-01-C03.json'
      - 'data/research/status-sovereignty-rd-wave02-rd01-legal-entity/**'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'docs/milestones/ssc-rd-wave02-rd01-legal-entity.md'
      - 'schemas/status-sovereignty-rd-wave02-rd01-legal-entity.schema.json'
      - 'schemas/status-sovereignty-residual-denominator-wave-02-current.schema.json'
      - 'test/status-sovereignty-rd-wave02-rd01-legal-entity.test.js'
      - 'test/status-sovereignty-residual-denominator-wave-02-current.test.js'
      - 'tools/build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs'
      - 'tools/validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs'
      - 'tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs'
      - 'tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs'
      - '.github/workflows/status-sovereignty-rd01-wave02-terminal-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and validate exact RD-01 closure
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node tools/build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node test/status-sovereignty-rd-wave02-rd01-legal-entity.test.js
          node tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs --check
          node tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          node test/status-sovereignty-residual-denominator-wave-02-current.test.js
          jq -e '
            .class_id == "RD-01-C03" and
            .terminal_state == "bounded_source_unavailable" and
            .class_closed == true and
            .counts.frozen_rows == 102 and
            .counts.final_http_success_routes == 612 and
            .counts.legal_entities_resolved == 48 and
            .counts.identity_ambiguous == 44 and
            .counts.identity_source_unavailable == 10 and
            .unresolved_limit.automatic_third_pass_authorized == false and
            .authority.outside_human_dependency == false and
            .authority.external_contacts == 0 and
            .authority.external_reviews == 0 and
            .authority.common_control_finding == false and
            .authority.graph_effect == "none"
          ' data/research/status-sovereignty-rd-wave02-rd01-legal-entity/class-receipt.json >/dev/null
          jq -e '
            .counts.canonical_residual_classes == 42 and
            (.counts.closed_residual_classes + .counts.open_residual_classes) == 42 and
            .counts.terminal_class_receipts == (.promoted_class_receipts | length) and
            .counts.closed_residual_classes == (.promoted_class_receipts | length) and
            .current_result.classes_closed == .counts.closed_residual_classes and
            .current_result.classes_open == .counts.open_residual_classes and
            (.current_result.closed_class_ids | index("RD-01-C03")) != null and
            ([
              .promoted_class_receipts[] |
              select(
                .lane_id == "RD-01" and
                .class_id == "RD-01-C03" and
                .issue == 786 and
                .source_pr == 801 and
                .merge_commit == "64af19ce7f860a7024a37ba5b6eef796b57c87b1" and
                .terminal_state == "bounded_source_unavailable" and
                .manifest_combined_sha256 == "7d5cc33a8fb8fc759dd2794076ffcd7ca4e1ad9c463f49593459edfca793a798" and
                .class_closed == true
              )
            ] | length) == 1 and
            .counts.outside_human_dependencies == 0 and
            .counts.external_contacts == 0 and
            .counts.external_reviews == 0 and
            .current_result.outside_human_dependency == false and
            .current_result.graph_effect == "none" and
            .current_result.publication_effect == "none" and
            .current_result.adoption_effect == "none"
          ' data/research/status-sovereignty-residual-denominator-wave-02-current.json >/dev/null
          git diff --exit-code -- data/intake/status-sovereignty-rd-wave02-rd01-legal-entity/source-custody/legal-entity-protocol-v1/artifact-index.json data/project/ssc-residual-wave02/closures/RD-01-C03.json data/research/status-sovereignty-rd-wave02-rd01-legal-entity data/research/status-sovereignty-residual-denominator-wave-02-current.json

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct deterministically from committed custody
        run: |
          set -Eeuo pipefail
          git restore --staged --worktree .
          node tools/build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node test/status-sovereignty-rd-wave02-rd01-legal-entity.test.js
          node tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs --check
          node tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          node test/status-sovereignty-residual-denominator-wave-02-current.test.js
          node tools/validate-no-magic-human-gate.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve exact closure receipt
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const closure = JSON.parse(fs.readFileSync('data/project/ssc-residual-wave02/closures/RD-01-C03.json', 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('data/research/status-sovereignty-rd-wave02-rd01-legal-entity/class-receipt.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('data/research/status-sovereignty-residual-denominator-wave-02-current.json', 'utf8'));
          const promoted = current.promoted_class_receipts.filter((entry) => entry.class_id === 'RD-01-C03');
          fs.writeFileSync('ssc-rd01-wave02-terminal-closure-receipt.json', JSON.stringify({
            schema_version: 'ssc-rd01-wave02-hosted-receipt@2',
            head: process.env.GITHUB_SHA,
            class_id: receipt.class_id,
            terminal_state: receipt.terminal_state,
            class_closed: receipt.class_closed,
            frozen_rows: receipt.counts.frozen_rows,
            final_http_success_routes: receipt.counts.final_http_success_routes,
            legal_entities_resolved: receipt.counts.legal_entities_resolved,
            identity_ambiguous: receipt.counts.identity_ambiguous,
            identity_source_unavailable: receipt.counts.identity_source_unavailable,
            manifest_combined_sha256: closure.product.manifest_combined_sha256,
            wave02_current_closed: current.counts.closed_residual_classes,
            wave02_current_open: current.counts.open_residual_classes,
            wave02_canonical_total: current.counts.canonical_residual_classes,
            rd01_promoted_receipt_count: promoted.length,
            rd01_promoted_in_current_ledger: promoted.length === 1,
            cumulative_ledger_update_required_after_merge: false,
            outside_human_dependency: false,
            external_contacts: 0,
            external_reviews: 0,
            publication_effect: 'none',
            adoption_effect: 'none',
            graph_effect: 'none'
          }, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave02-terminal-closure-receipt
          path: ssc-rd01-wave02-terminal-closure-receipt.json
          if-no-files-found: error
          retention-days: 90
