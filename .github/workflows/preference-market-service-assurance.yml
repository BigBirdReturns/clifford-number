name: Preference custody market-service assurance control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/market-service-assurance.fixture.json'
      - 'tools/lib/preference-market-service-assurance.mjs'
      - 'tools/compile-preference-market-service-assurance.mjs'
      - 'tools/validate-preference-market-service-assurance.mjs'
      - 'test/preference-market-service-assurance.test.js'
      - 'docs/preference-custody-market-service-assurance.md'
      - '.github/workflows/preference-market-service-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-service-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile market boundary, capacity, price, access, denominator, quality, and lineage worlds
        run: node tools/compile-preference-market-service-assurance.mjs
      - name: Validate counterfactual, capacity, access, denominator, quality, correction, and authority boundaries
        run: node tools/validate-preference-market-service-assurance.mjs
      - name: Exercise boundary, capacity, price, access, denominator, quality, lineage, authority, and tamper fixtures
        run: node test/preference-market-service-assurance.test.js
      - name: Preserve deterministic market-service assurance projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-market-service-assurance-pc30
          path: |
            build/research/preference-market-service-assurance.json
            build/research/preference-market-service-assurance.md
          if-no-files-found: error
