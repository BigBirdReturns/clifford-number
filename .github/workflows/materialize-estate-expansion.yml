name: Materialize estate expansion

on:
  pull_request:
    paths:
      - 'data/intake/estate-expansion-01/materialize.tar.gz.b64'
      - '.github/workflows/materialize-estate-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Extract deterministic expansion package
        run: |
          base64 -d data/intake/estate-expansion-01/materialize.tar.gz.b64 > /tmp/estate-expansion.tar.gz
          tar -xzf /tmp/estate-expansion.tar.gz
          node tools/build-estate-expansion.mjs
          node tools/validate-estate-expansion.mjs
          node test/estate-expansion.test.js

      - name: Commit materialized package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intake/estate-expansion-01 tools/build-estate-expansion.mjs tools/validate-estate-expansion.mjs tools/compile.mjs test/estate-expansion.test.js test/research-tracks.test.js .github/workflows/estate-expansion.yml
          git commit -m 'Materialize estate expansion' || exit 0
          git push origin HEAD:${{ github.head_ref }}
