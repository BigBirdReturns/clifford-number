name: Materialize estate expansion

on:
  pull_request:
    paths:
      - '.github/workflows/materialize-estate-expansion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-estate-expansion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Reassemble and verify deterministic expansion package
        run: |
          cat data/intake/estate-expansion-01/materialize.part-* > /tmp/estate-expansion.tar.gz.b64
          test "$(wc -c < /tmp/estate-expansion.tar.gz.b64)" = "47608"
          test "$(sha256sum /tmp/estate-expansion.tar.gz.b64 | cut -d' ' -f1)" = "f0d557880cb62f2d24a65525ac705a74b92162bd309092141eb67911b77a7cbf"
          base64 -d /tmp/estate-expansion.tar.gz.b64 > /tmp/estate-expansion.tar.gz
          test "$(sha256sum /tmp/estate-expansion.tar.gz | cut -d' ' -f1)" = "cf3cedd31a584083c6dda8722031f5d4ffb4004582366dedcec778fc36a3f7c7"
          tar -tzf /tmp/estate-expansion.tar.gz >/dev/null
          tar -xzf /tmp/estate-expansion.tar.gz
          node tools/build-estate-expansion.mjs
          node tools/validate-estate-expansion.mjs
          node test/estate-expansion.test.js

      - name: Write materialized package through the contents API
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          files = [
              'data/intake/estate-expansion-01/README.md',
              'data/intake/estate-expansion-01/completion.json',
              'data/intake/estate-expansion-01/next-ten.json',
              'data/intake/estate-expansion-01/triage.json',
              'data/intake/estate-expansion-01/sources.jsonl',
              'data/intake/estate-expansion-01/manifest.json',
              'tools/build-estate-expansion.mjs',
              'tools/validate-estate-expansion.mjs',
              'tools/compile.mjs',
              'test/estate-expansion.test.js',
              'test/research-tracks.test.js',
              '.github/workflows/estate-expansion.yml',
          ]
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'clifford-number-estate-materializer',
          }

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          for path in files:
              encoded_path = urllib.parse.quote(path, safe='/')
              base_url = f'https://api.github.com/repos/{repo}/contents/{encoded_path}'
              current_sha = None
              try:
                  current = request(f'{base_url}?ref={urllib.parse.quote(branch, safe="")}')
                  current_sha = current.get('sha')
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              payload = {
                  'message': f'Materialize estate expansion: {path}',
                  'content': base64.b64encode(pathlib.Path(path).read_bytes()).decode(),
                  'branch': branch,
              }
              if current_sha:
                  payload['sha'] = current_sha
              result = request(base_url, method='PUT', payload=payload)
              print(path, result['commit']['sha'])
          PY
