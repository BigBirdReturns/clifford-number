              ('RD04-W03-PPN-ND-FU-002', 'https://www.nd.gov/dhs/policymanuals/SNAP/Content/History/403%20Geographic%20Waiver/403%20History%20Log.htm', '4d8eda2c6f512d784cca2430bfcf2ef04beef438c1616762c55604d599de9c57'),
