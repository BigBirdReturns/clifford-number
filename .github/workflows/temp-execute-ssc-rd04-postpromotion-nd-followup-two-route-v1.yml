      - name: Upload exact two-route transport custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-nd-followup-two-route-execution-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-nd-followup-two-route-execution-v1
          if-no-files-found: error
          retention-days: 90
