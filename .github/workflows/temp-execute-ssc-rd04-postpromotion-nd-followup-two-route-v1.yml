              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'protocol_path': os.environ['PROTOCOL_PATH'],
              'protocol_blob': os.environ['PROTOCOL_BLOB'],
              'fixed_route_count': 2,
              'maximum_attempts_per_route': 1,
              'maximum_total_physical_requests': physical_budget,
              'physical_requests_executed': physical_count,
              'initiated_route_attempts': sum(result['attempts'] for result in results),
              'captured_route_ids': [result['route_id'] for result in results],
              'terminal_route_ids': [result['route_id'] for result in results if result['terminal_state'] is not None],
              'results': results,
              'result_spawned_requests': 0,
