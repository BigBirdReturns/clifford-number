name: Status-for-sovereignty SSC-F13 DCGS-A counterfactual-foreclosure denominator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-f13-dcgsa.yml'
      - 'data/intake/status-sovereignty-f13-dcgsa-first-pass.json'
      - 'data/project/status-sovereignty-f13-dcgsa-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-counterfactual-foreclosure-first-pass.schema.json'
      - 'docs/milestones/ssc-f13-dcgsa-first-pass.md'
      - 'tools/build-status-sovereignty-f13-dcgsa.mjs'
      - 'tools/validate-status-sovereignty-f13-dcgsa.mjs'
      - 'test/status-sovereignty-f13-dcgsa.test.js'
      - 'build/core-thesis/status-sovereignty/f13-dcgsa/**'
      - 'reports/core-thesis/status-sovereignty/f13-dcgsa/**'
  push:
    branches:
      - main
      - 'agent/ssc-f13-dcgsa-foreclosure'
    paths:
      - '.github/workflows/status-sovereignty-f13-dcgsa.yml'
      - 'data/intake/status-sovereignty-f13-dcgsa-first-pass.json'
      - 'data/project/status-sovereignty-f13-dcgsa-first-pass-release-manifest.json'
      - 'schemas/status-sovereignty-counterfactual-foreclosure-first-pass.schema.json'
      - 'docs/milestones/ssc-f13-dcgsa-first-pass.md'
      - 'tools/build-status-sovereignty-f13-dcgsa.mjs'
      - 'tools/validate-status-sovereignty-f13-dcgsa.mjs'
      - 'test/status-sovereignty-f13-dcgsa.test.js'
      - 'build/core-thesis/status-sovereignty/f13-dcgsa/**'
      - 'reports/core-thesis/status-sovereignty/f13-dcgsa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the bounded DCGS-A first pass
        run: |
          node tools/build-status-sovereignty-f13-dcgsa.mjs
          node tools/validate-status-sovereignty-f13-dcgsa.mjs
          node test/status-sovereignty-f13-dcgsa.test.js
      - name: Require exact committed DCGS-A products
        run: |
          git diff --exit-code -- \
            data/project/status-sovereignty-f13-dcgsa-first-pass-release-manifest.json \
            build/core-thesis/status-sovereignty/f13-dcgsa/manifest.json \
            build/core-thesis/status-sovereignty/f13-dcgsa/data.json \
            reports/core-thesis/status-sovereignty/f13-dcgsa/data.json \
            reports/core-thesis/status-sovereignty/f13-dcgsa/index.html
      - name: Prove publication exclusion
        run: |
          npm run build:pages
          npm run build:standalone
          npm run validate:pages
          test ! -e dist/data/intake/status-sovereignty-f13-dcgsa-first-pass.json
          test ! -e dist/build/core-thesis/status-sovereignty/f13-dcgsa
          test ! -e dist/reports/core-thesis/status-sovereignty/f13-dcgsa
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic reconstruction
        run: |
          git restore --staged --worktree .
          node tools/build-status-sovereignty-f13-dcgsa.mjs
          node tools/validate-status-sovereignty-f13-dcgsa.mjs
          node test/status-sovereignty-f13-dcgsa.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
