name: Preference custody provenance-recovery control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/provenance-recovery.fixture.json'
      - 'tools/lib/preference-provenance-recovery.mjs'
      - 'tools/compile-preference-provenance-recovery.mjs'
      - 'tools/validate-preference-provenance-recovery.mjs'
      - 'test/preference-provenance-recovery.test.js'
      - 'docs/preference-custody-provenance-recovery.md'
      - '.github/workflows/preference-provenance-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile provenance attack and recovery worlds
        run: node tools/compile-preference-provenance-recovery.mjs
      - name: Validate artifact, trust, detection, containment, replay, and consequence boundaries
        run: node tools/validate-preference-provenance-recovery.mjs
      - name: Exercise clean, spoofing, poisoning, injection, stale, credential, abstention, silent, and tamper fixtures
        run: node test/preference-provenance-recovery.test.js
      - name: Preserve deterministic provenance-recovery projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-provenance-recovery-pc14
          path: |
            build/research/preference-provenance-recovery.json
            build/research/preference-provenance-recovery.md
          if-no-files-found: error
