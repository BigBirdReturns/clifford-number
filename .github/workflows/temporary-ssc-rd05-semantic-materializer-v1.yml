name: TEMP materialize SSC RD-05 semantic classification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd05-semantic-materializer-base-v1
    paths:
      - '.github/tmp/ssc-rd05-semantic-materializer-v1.trigger'

permissions:
  actions: read
  contents: write

concurrency:
  group: ssc-rd05-semantic-materializer-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: agent/ssc-rd-wave02-rd05-recommendation-disposition
      EXPECTED_START_SHA: 74dc76adee359b7f4c6b58fa898d2ecf3c2c0222
      SOURCE_TAR_SHA256: 7369fca74fb9548b7ba06eaa256e51a81a8106869c6e26523d4ec85b806fe5f5
      SOURCE_TAR_BYTES: '22652'
      SOURCE_BLOB_01: 1b7804fe70ac6888be38c8f8c52317fb39cdd74d
      SOURCE_BLOB_02: 989bbe0c80b4ec73f277601423426446f28123f5
      SOURCE_BLOB_03: 4e568a9423332fd450a5a26d2fe15af24fc2f21f
      SOURCE_BLOB_04: 9f460ea3ea72abad14e81ac8fa32767cf6113f20
      BUILDER_PATH: tools/acquisition/status-sovereignty-rd-wave02-rd05/build-object-semantic-classification.mjs
      VALIDATOR_PATH: tools/acquisition/status-sovereignty-rd-wave02-rd05/validate-object-semantic-classification.mjs
      TEST_PATH: test/status-sovereignty-rd-wave02-rd05-object-semantic-classification.test.js
      RULES_PATH: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/object-semantic-rules.json
      OUTPUT_PATH: data/intake/status-sovereignty-rd-wave02-rd05-recommendation-disposition/object-semantic-classification.json
      BUILDER_SHA256: eac69f9fdca9e89075f1a0abde625de4e073061f284360353d2a17c69b6b64d3
      VALIDATOR_SHA256: 36630ba1a90d9af8d8db94c6617fdaae9414d1268425811f822b6d7a3056dc5d
      TEST_SHA256: 0f5725127d858595462d90b30330d57d1a1b6bbfc86e3cefdc25eeb6d676184d
      RULES_SHA256: 2430933e1f616dfdc3d754285fac3be9768f1576619246437d5ec0f3a98845bd
      OUTPUT_SHA256: bd20e741f516841704d481bb4d907200223e745c522d112811c3a43837cba922
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd05-recommendation-disposition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, validate, qualify, and publish exact five-path semantic product
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_START_SHA"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_START_SHA"

          if test -f tools/validate-no-magic-human-gate.mjs; then
            node tools/validate-no-magic-human-gate.mjs
          fi

          mkdir -p /tmp/rd05-semantic-source
          : > /tmp/rd05-semantic-source.tar.gz
          for blob in "$SOURCE_BLOB_01" "$SOURCE_BLOB_02" "$SOURCE_BLOB_03" "$SOURCE_BLOB_04"; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "/tmp/${blob}.chunk"
            test "$(git hash-object "/tmp/${blob}.chunk")" = "$blob"
            cat "/tmp/${blob}.chunk" >> /tmp/rd05-semantic-source.tar.gz
          done

          test "$(wc -c < /tmp/rd05-semantic-source.tar.gz | tr -d ' ')" = "$SOURCE_TAR_BYTES"
          test "$(sha256sum /tmp/rd05-semantic-source.tar.gz | awk '{print $1}')" = "$SOURCE_TAR_SHA256"
          tar -xzf /tmp/rd05-semantic-source.tar.gz -C /tmp/rd05-semantic-source

          test "$(sha256sum "/tmp/rd05-semantic-source/$BUILDER_PATH" | awk '{print $1}')" = "$BUILDER_SHA256"
          test "$(sha256sum "/tmp/rd05-semantic-source/$VALIDATOR_PATH" | awk '{print $1}')" = "$VALIDATOR_SHA256"
          test "$(sha256sum "/tmp/rd05-semantic-source/$TEST_PATH" | awk '{print $1}')" = "$TEST_SHA256"

          mkdir -p "$(dirname "$BUILDER_PATH")" "$(dirname "$TEST_PATH")" "$(dirname "$RULES_PATH")"
          cp "/tmp/rd05-semantic-source/$BUILDER_PATH" "$BUILDER_PATH"
          cp "/tmp/rd05-semantic-source/$VALIDATOR_PATH" "$VALIDATOR_PATH"
          cp "/tmp/rd05-semantic-source/$TEST_PATH" "$TEST_PATH"

          node "$BUILDER_PATH"
          test "$(sha256sum "$RULES_PATH" | awk '{print $1}')" = "$RULES_SHA256"
          test "$(sha256sum "$OUTPUT_PATH" | awk '{print $1}')" = "$OUTPUT_SHA256"
          node "$VALIDATOR_PATH"
          node "$TEST_PATH"

          cat > /tmp/expected-rd05-semantic-paths.txt <<EOF
          $OUTPUT_PATH
          $RULES_PATH
          $TEST_PATH
          $BUILDER_PATH
          $VALIDATOR_PATH
          EOF
          sort -o /tmp/expected-rd05-semantic-paths.txt /tmp/expected-rd05-semantic-paths.txt
          git status --porcelain=v1 --untracked-files=all | cut -c4- | sort > /tmp/actual-rd05-semantic-paths.txt
          diff -u /tmp/expected-rd05-semantic-paths.txt /tmp/actual-rd05-semantic-paths.txt
          test "$(wc -l < /tmp/actual-rd05-semantic-paths.txt | tr -d ' ')" = '5'

          git add -- "$RULES_PATH" "$OUTPUT_PATH" "$BUILDER_PATH" "$VALIDATOR_PATH" "$TEST_PATH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Classify RD-05 frozen official objects semantically'
          PRODUCT_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_START_SHA"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > /tmp/product-paths.txt
          diff -u /tmp/expected-rd05-semantic-paths.txt /tmp/product-paths.txt

          npm run release:check

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const jsonPaths = [
            'build/axm-identity.json',
            'build/build-hop-report.json',
            'build/hop-graph.json',
            'build/migration-summary.json',
            'build/receipt-graph.json',
            'build/scores.json',
            'build/scout-report.json',
            'build/surface-graph.json'
          ];
          const markdownPaths = [
            'build/migration-review.md',
            'build/scout-report.md'
          ];
          const expected = [...jsonPaths, ...markdownPaths].sort();
          const status = execFileSync('git', ['status', '--porcelain=v1', '--untracked-files=all'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          const paths = status.map((line) => line.slice(3)).sort();
          if (JSON.stringify(paths) !== JSON.stringify(expected)) {
            throw new Error(`unexpected post-release paths: ${JSON.stringify(paths)}`);
          }
          const numstat = execFileSync('git', ['diff', '--numstat', '--', ...expected], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          if (numstat.length !== expected.length) throw new Error('post-release numstat denominator');
          for (const row of numstat) {
            const [adds, deletes, path] = row.split('\t');
            if (adds !== '1' || deletes !== '1' || !expected.includes(path)) {
              throw new Error(`non-timestamp post-release diff: ${row}`);
            }
          }
          for (const path of jsonPaths) {
            const before = JSON.parse(execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }));
            const after = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (typeof before.generated !== 'string' || typeof after.generated !== 'string') {
              throw new Error(`missing generated timestamp: ${path}`);
            }
            if (!Number.isFinite(Date.parse(before.generated)) || !Number.isFinite(Date.parse(after.generated))) {
              throw new Error(`invalid generated timestamp: ${path}`);
            }
            delete before.generated;
            delete after.generated;
            if (JSON.stringify(before) !== JSON.stringify(after)) {
              throw new Error(`semantic JSON drift: ${path}`);
            }
          }
          for (const path of markdownPaths) {
            const before = execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' }).split('\n');
            const after = fs.readFileSync(path, 'utf8').split('\n');
            const normalize = (lines) => lines.map((line) => line.startsWith('Generated: ') ? 'Generated: <ISO>' : line);
            if (JSON.stringify(normalize(before)) !== JSON.stringify(normalize(after))) {
              throw new Error(`semantic Markdown drift: ${path}`);
            }
            const beforeGenerated = before.find((line) => line.startsWith('Generated: '));
            const afterGenerated = after.find((line) => line.startsWith('Generated: '));
            if (!beforeGenerated || !afterGenerated ||
                !Number.isFinite(Date.parse(beforeGenerated.slice(11))) ||
                !Number.isFinite(Date.parse(afterGenerated.slice(11)))) {
              throw new Error(`invalid Markdown generated timestamp: ${path}`);
            }
          }
          console.log('post-release volatility proof: PASS — 10/10 paths timestamp-only, semantic drift zero');
          NODE

          git restore --worktree -- \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/migration-review.md \
            build/migration-summary.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/scout-report.md \
            build/surface-graph.json
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          node "$BUILDER_PATH"
          node "$VALIDATOR_PATH"
          node "$TEST_PATH"
          test "$(sha256sum "$RULES_PATH" | awk '{print $1}')" = "$RULES_SHA256"
          test "$(sha256sum "$OUTPUT_PATH" | awk '{print $1}')" = "$OUTPUT_SHA256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_START_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$PRODUCT_SHA"

          cat > ssc-rd05-semantic-materializer-receipt.json <<EOF
          {
            "schema_version": "ssc-rd05-semantic-materializer-receipt@1",
            "target_branch": "$TARGET_BRANCH",
            "expected_start_sha": "$EXPECTED_START_SHA",
            "product_sha": "$PRODUCT_SHA",
            "permanent_path_count": 5,
            "source_tar_sha256": "$SOURCE_TAR_SHA256",
            "source_tar_bytes": $SOURCE_TAR_BYTES,
            "rules_sha256": "$RULES_SHA256",
            "classification_sha256": "$OUTPUT_SHA256",
            "frozen_object_denominator": 58,
            "semantic_classifications_complete": 58,
            "completed_recommendation_objects": 0,
            "open_recommendation_disposition_chains": 5,
            "successor_action_rows": 8,
            "adversarial_mutations": 42,
            "release_gate": "pass",
            "post_release_volatile_paths": 10,
            "post_release_semantic_drift": 0,
            "deterministic_replay": "pass",
            "unchanged_head_lease": "pass",
            "external_contacts": 0,
            "external_reviews": 0,
            "outside_human_dependency": false,
            "publication_effect": "none",
            "adoption_effect": "none",
            "graph_effect": "none"
          }
          EOF
      - name: Upload exact RD-05 semantic materializer receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd05-semantic-materializer-v1
          path: ssc-rd05-semantic-materializer-receipt.json
          if-no-files-found: error
          retention-days: 90
