name: TEMP materialize exact-stint topology frontier

on:
  push:
    branches:
      - agent/topology-admission-frontier-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/topology-admission-frontier-v1
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize and validate product files
        shell: bash
        run: |
          python tools/temp-materialize-topology-frontier.py
          chmod +x tools/compile.mjs tools/build-topology-admission-frontier.mjs
          node --check tools/build-topology-admission-frontier.mjs
          node --check tools/lib/hops.mjs
          node test/hop-stints.test.js
          node test/topology-admission-frontier.test.js
          npm run compile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml data/ledger/surfaces.jsonl \
            tools/compile.mjs tools/build-topology-admission-frontier.mjs \
            tools/lib/hops.mjs test/hop-stints.test.js \
            test/topology-admission-frontier.test.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'topology: compile exact-stint admission frontier [skip ci]'
          git push origin HEAD:agent/topology-admission-frontier-v1
