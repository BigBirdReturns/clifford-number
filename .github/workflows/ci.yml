name: Release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  release-check:
    if: github.head_ref != 'agent/status-sovereignty-wave01-review-loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run repository release gate
        shell: bash
        run: |
          set +e
          npm run release:check > /tmp/release-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/release-check.log').read_text(errors='replace').splitlines()
          relevant = [line.strip() for line in lines if re.search(r'AssertionError|ERR_ASSERTION|failed|Error:|SyntaxError|not found|must |does not|cannot ', line, re.I)]
          tail = [line.strip() for line in lines[-14:] if line.strip()]
          print('CI_DIAG ' + ' | '.join((relevant[-8:] + tail)[-16:])[:7000])
          PY
          fi
          exit "$status"

  materialize-ssc-wave01-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/status-sovereignty-wave01-review-loader'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/status-sovereignty-wave01-review-loader
          fetch-depth: 0
      - name: Recover checksum-bound carrier from transport PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments?per_page=100"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          comments=json.load(urllib.request.urlopen(req))
          parts=[]
          for row in comments:
              body=row.get('body','')
              lines=body.splitlines()
              if lines and lines[0].startswith('SSC-SG07B-CARRIER-PART-'):
                  parts.append((lines[0],''.join(lines[1:]).strip()))
          parts.sort()
          if len(parts)!=16: raise RuntimeError(f'expected 16 carrier comments, observed {len(parts)}')
          expected=[f'SSC-SG07B-CARRIER-PART-{i:02d}' for i in range(16)]
          observed=[name for name,_ in parts]
          if observed!=expected: raise RuntimeError(f'carrier comment denominator drift: {observed}')
          raw=base64.b64decode(''.join(part for _,part in parts),validate=True)
          open('/tmp/ssc-wave01-review-carrier.tar.xz','wb').write(raw)
          PY
      - name: Verify carrier and publish non-workflow transition
        shell: bash
        run: |
          set -euo pipefail
          base='a9cb4c707a1cc6afb51d0fd20b0375e0cf2373b7'
          target='agent/status-sovereignty-wave01-maintainer-review'
          expected_archive='c11e469a5eaf65388c6c1110644ed6b53cc1c7ff8c91e244e93446bdf903a5c1'
          expected_paths='fec1fc6ac3ef2e538be23ea162960e1a61dc59a45b8cb7024a31112ac2744224'
          printf '%s  %s\n' "$expected_archive" /tmp/ssc-wave01-review-carrier.tar.xz | sha256sum -c -
          rm -rf /tmp/ssc-review-payload /tmp/ssc-review-work
          mkdir -p /tmp/ssc-review-payload
          tar -xJf /tmp/ssc-wave01-review-carrier.tar.xz -C /tmp/ssc-review-payload
          test "$(cat /tmp/ssc-review-payload/BASE.txt)" = "$base"
          test "$(cat /tmp/ssc-review-payload/LOCAL_TRANSITION.txt)" = 'f5516e2d0232b44b3f8f51c717cbf75a9580087a'
          test "$(wc -l < /tmp/ssc-review-payload/TRANSITION_PATHS.txt)" -eq 53
          test "$(sha256sum /tmp/ssc-review-payload/TRANSITION_PATHS.txt | cut -d' ' -f1)" = "$expected_paths"
          test "$(wc -l < /tmp/ssc-review-payload/BINDING_PATHS.txt)" -eq 5
          git fetch origin main "$target"
          test "$(git rev-parse origin/main)" = "$base"
          old_head="$(git rev-parse "origin/$target")"
          test "$old_head" = "$base"
          git worktree add --detach /tmp/ssc-review-work "$base"
          cd /tmp/ssc-review-work
          while IFS= read -r rel; do
            case "$rel" in
              .github/workflows/project-stable-ground-sg06.yml|\
              .github/workflows/project-stable-ground-sg07.yml|\
              .github/workflows/status-sovereignty-compact.yml|\
              .github/workflows/status-sovereignty-wave-01-maintainer-review.yml|\
              .github/workflows/status-sovereignty-wave-01.yml) continue ;;
            esac
            mkdir -p "$(dirname "$rel")"
            cp "/tmp/ssc-review-payload/transition/$rel" "$rel"
          done < /tmp/ssc-review-payload/TRANSITION_PATHS.txt
          grep -vE '^\.github/workflows/(project-stable-ground-sg06|project-stable-ground-sg07|status-sovereignty-compact|status-sovereignty-wave-01-maintainer-review|status-sovereignty-wave-01)\.yml$' /tmp/ssc-review-payload/TRANSITION_PATHS.txt | sort > /tmp/expected-paths
          git diff --name-only | sort > /tmp/observed-paths
          diff -u /tmp/expected-paths /tmp/observed-paths
          test "$(wc -l < /tmp/observed-paths)" -eq 48
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Seed SSC-H01 Wave 01 maintainer-review transition'
          git push --force-with-lease="refs/heads/$target:$old_head" origin "HEAD:refs/heads/$target"
