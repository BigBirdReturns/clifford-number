name: Release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-check:
    if: github.head_ref != 'agent/status-sovereignty-wave01-review-loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run repository release gate
        shell: bash
        run: |
          set +e
          npm run release:check > /tmp/release-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/release-check.log').read_text(errors='replace').splitlines()
          relevant = [line.strip() for line in lines if re.search(r'AssertionError|ERR_ASSERTION|failed|Error:|SyntaxError|not found|must |does not|cannot ', line, re.I)]
          tail = [line.strip() for line in lines[-14:] if line.strip()]
          message = ' | '.join((relevant[-8:] + tail)[-16:])
          print('CI_DIAG ' + message[:7000])
          PY
          fi
          exit "$status"

  materialize-ssc-wave01-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/status-sovereignty-wave01-review-loader'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/status-sovereignty-wave01-review-loader
          fetch-depth: 0
      - name: Verify carrier and publish non-workflow transition
        shell: bash
        run: |
          set -euo pipefail
          base='a9cb4c707a1cc6afb51d0fd20b0375e0cf2373b7'
          target='agent/status-sovereignty-wave01-maintainer-review'
          expected_archive='080e0274694e73575ea5d1ea91cec3504c48d5162cf98a97bb049ac823e263c1'
          expected_paths='81ee979d3c88dc8dcf00d63a2bb0f21af64d763d4dbbc659eb0239dc9751252e'

          mapfile -t chunks < <(find .github/tmp/ssc-wave01-review -maxdepth 1 -type f -name 'part-*.b64' | sort)
          test "${#chunks[@]}" -eq 5
          cat "${chunks[@]}" | tr -d '\n' | base64 --decode > /tmp/ssc-wave01-review-carrier.tar.xz
          printf '%s  %s\n' "$expected_archive" /tmp/ssc-wave01-review-carrier.tar.xz | sha256sum -c -

          rm -rf /tmp/ssc-wave01-review-payload /tmp/ssc-wave01-review-work
          mkdir -p /tmp/ssc-wave01-review-payload
          tar -xJf /tmp/ssc-wave01-review-carrier.tar.xz -C /tmp/ssc-wave01-review-payload
          test "$(cat /tmp/ssc-wave01-review-payload/BASE.txt)" = "$base"
          test "$(cat /tmp/ssc-wave01-review-payload/PLACEHOLDER.txt)" = 'ffffffffffffffffffffffffffffffffffffffff'
          test "$(wc -l < /tmp/ssc-wave01-review-payload/TRANSITION_PATHS.txt)" -eq 51
          test "$(sha256sum /tmp/ssc-wave01-review-payload/TRANSITION_PATHS.txt | cut -d' ' -f1)" = "$expected_paths"

          git fetch origin main "$target"
          test "$(git rev-parse origin/main)" = "$base"
          old_head="$(git rev-parse "origin/$target")"
          test "$old_head" = "$base"
          git worktree add --detach /tmp/ssc-wave01-review-work "$base"
          cd /tmp/ssc-wave01-review-work

          while IFS= read -r rel; do
            case "$rel" in
              .github/workflows/project-stable-ground-sg06.yml|\
              .github/workflows/project-stable-ground-sg07.yml|\
              .github/workflows/status-sovereignty-compact.yml|\
              .github/workflows/status-sovereignty-wave-01-review.yml|\
              .github/workflows/status-sovereignty-wave-01.yml)
                continue
                ;;
            esac
            mkdir -p "$(dirname "$rel")"
            cp "/tmp/ssc-wave01-review-payload/transition/$rel" "$rel"
          done < /tmp/ssc-wave01-review-payload/TRANSITION_PATHS.txt

          grep -vE '^\.github/workflows/(project-stable-ground-sg06|project-stable-ground-sg07|status-sovereignty-compact|status-sovereignty-wave-01-review|status-sovereignty-wave-01)\.yml$' \
            /tmp/ssc-wave01-review-payload/TRANSITION_PATHS.txt | sort > /tmp/expected-paths
          git diff --name-only | sort > /tmp/observed-paths
          diff -u /tmp/expected-paths /tmp/observed-paths
          test "$(wc -l < /tmp/observed-paths)" -eq 46
          git diff --check

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Seed SSC-H01 Wave 01 maintainer-review transition'
          git push --force-with-lease="refs/heads/$target:$old_head" origin "HEAD:refs/heads/$target"
