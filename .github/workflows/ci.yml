name: Release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture release-check result
        id: release-check
        shell: bash
        run: |
          set +e
          npm run release:check > /tmp/release-check.log 2>&1
          status=$?
          tail -n 160 /tmp/release-check.log > /tmp/release-check-tail.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload release-check failure tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-tail
          path: /tmp/release-check-tail.log
          retention-days: 1
      - name: Fail when release checks fail
        if: steps.release-check.outputs.status != '0'
        run: exit 1
