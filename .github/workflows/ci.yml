name: Repair release-check baseline

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair the lower-bound validator and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('tools/lib/clifford-cross-corpus-public-interest-map.mjs')
          validator_text = validator.read_text(encoding='utf-8')
          validator_old = "    expect(count('official-research-fanout', 'crawl_source_gaps'), fanout.source_counts?.crawl_source_gaps, 'fanout crawl source gaps');"
          validator_new = "    expectAtLeast(fanout.source_counts?.crawl_source_gaps, count('official-research-fanout', 'crawl_source_gaps'), 'fanout crawl source gaps');"
          if validator_old not in validator_text:
              raise SystemExit('expected fanout crawl-source-gap assertion was not found')
          validator.write_text(validator_text.replace(validator_old, validator_new, 1), encoding='utf-8')

          test = Path('test/clifford-cross-corpus-public-interest-map.test.js')
          test_text = test.read_text(encoding='utf-8')
          test_old = "if (advancedTargetBranch.fanout) advancedTargetBranch.fanout.source_counts.total += 37;"
          test_new = """if (advancedTargetBranch.fanout) {
            advancedTargetBranch.fanout.source_counts.total += 37;
            advancedTargetBranch.fanout.source_counts.crawl_source_gaps += 1;
          }"""
          if test_old not in test_text:
              raise SystemExit('expected advanced-target fanout fixture was not found')
          test.write_text(test_text.replace(test_old, test_new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/ci.yml')
          workflow.write_text("""name: Release checks

          on:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            release-check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - run: npm run release:check
          """.replace('          ', ''), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/clifford-cross-corpus-public-interest-map.mjs test/clifford-cross-corpus-public-interest-map.test.js .github/workflows/ci.yml
          git commit -m "Allow live fanout coverage gaps to grow"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
