name: Release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run release checks and print only the failure tail
        shell: bash
        run: |
          set -o pipefail
          npm run release:check > /tmp/release-check.log 2>&1 || {
            tail -n 120 /tmp/release-check.log
            exit 1
          }
