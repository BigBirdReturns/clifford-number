name: Release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run repository release gate
        shell: bash
        run: |
          set +e
          npm run release:check > /tmp/release-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/release-check.log').read_text(errors='replace').splitlines()
          relevant = [line.strip() for line in lines if re.search(r'AssertionError|ERR_ASSERTION|failed|Error:|SyntaxError|not found|must |does not|cannot ', line, re.I)]
          tail = [line.strip() for line in lines[-14:] if line.strip()]
          message = ' | '.join((relevant[-8:] + tail)[-16:])
          print('CI_DIAG ' + message[:7000])
          PY
          fi
          exit "$status"
      - name: Run topology admission frontier mutation tests
        run: node test/topology-admission-frontier.test.js
      - name: Run scheduled crawler promotion contract tests
        run: node test/scheduled-crawl-promotion.test.js
      - name: Run scheduled crawler PR identity contract tests
        run: node test/scheduled-crawl-pr-identity.test.js
      - name: Run scheduled crawler admission observation tests
        run: node test/scheduled-crawl-admission.test.js
      - name: Run scheduled crawler resumption tests
        run: node test/scheduled-crawl-resumption.test.js
      - name: Smoke public inspection routes
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist > /tmp/clifford-number-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/clifford-number-server.log
            exit 1
          fi

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "::error::No supported Chromium browser is installed on the runner."
            exit 1
          fi

          CLIFFORD_CHROME="$chrome" node tools/smoke-public-routes.mjs \
            --base-url http://127.0.0.1:8080/
