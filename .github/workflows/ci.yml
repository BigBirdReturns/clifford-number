name: Release checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded Action Plan repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          carrier = Path('.github/workflows/temp-action-plan-receipt-seam.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = carrier.index(marker) + len(marker)
          end = carrier.index("\n          PY\n", start)
          lines = carrier[start:end].splitlines()
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(source, 'action-plan-receipt-repair.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Reconcile generated topology counts
        shell: bash
        run: |
          node tools/compile.mjs
          python - <<'PY'
          from pathlib import Path
          import json
          cross_path = Path('data/research/clifford-cross-corpus-public-interest-map.json')
          cross = json.loads(cross_path.read_text())
          scout = json.loads(Path('build/scout-report.json').read_text())
          scout_count = len(scout.get('findings', []))
          cross['inventory']['discovery_queue']['scout_findings'] = scout_count
          lane = next(row for row in cross['lanes'] if row['lane_id'] == 'official-research-fanout')
          lane['counts']['scout_findings'] = scout_count
          cross_path.write_text(json.dumps(cross, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Run repository release gate
        shell: bash
        run: |
          set +e
          npm run release:check > /tmp/release-check.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/release-check.log').read_text(errors='replace').splitlines()
          relevant = [line.strip() for line in lines if re.search(r'AssertionError|ERR_ASSERTION|failed|Error:|SyntaxError|not found|must |does not|cannot |expected ', line, re.I)]
          tail = [line.strip() for line in lines[-20:] if line.strip()]
          print('CI_DIAG ' + ' | '.join((relevant[-10:] + tail)[-20:])[:7000])
          PY
          fi
          exit "$status"
      - name: Commit canonical product and remove temporary execution surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/temp-action-plan-receipt-seam.yml
          git add \
            app.js \
            data/ledger/claims.jsonl \
            data/ledger/participation.jsonl \
            data/ledger/receipts.jsonl \
            data/ledger/surfaces.jsonl \
            data/research/clifford-cross-corpus-public-interest-map.json \
            data/research/clifford-thiel-trump-wrap-up.json \
            data/research/corpus-coverage.json \
            receipts/topology/gov-ai-opportunities-action-plan-terms-2024-07-26.md \
            test/compiler.test.js \
            test/ui-contract.test.js \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/public-catalog.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/surface-graph.json
          git commit -m "topology: separate Action Plan development from dated response"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
