name: Preference custody laboratory floor v11

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-custody.mjs'
      - 'tools/lib/preference-equifinality.mjs'
      - 'tools/lib/preference-attrition.mjs'
      - 'tools/lib/preference-subgroup.mjs'
      - 'tools/lib/preference-standing.mjs'
      - 'tools/lib/preference-agenda.mjs'
      - 'tools/lib/preference-package.mjs'
      - 'tools/lib/preference-succession.mjs'
      - 'tools/lib/preference-dynamic-change.mjs'
      - 'tools/lib/preference-network-formation.mjs'
      - 'tools/lib/preference-deliberative-formation.mjs'
      - 'tools/lib/preference-epistemic-quality.mjs'
      - 'tools/lib/preference-custody-manifest.mjs'
      - 'tools/lib/preference-custody-manifest-v9.mjs'
      - 'tools/lib/preference-custody-manifest-v10.mjs'
      - 'tools/lib/preference-custody-manifest-v11.mjs'
      - 'tools/compile-preference-epistemic-quality.mjs'
      - 'tools/validate-preference-epistemic-quality.mjs'
      - 'tools/compile-preference-custody-manifest-v11.mjs'
      - 'tools/validate-preference-custody-manifest-v11.mjs'
      - 'test/preference-epistemic-quality.test.js'
      - 'test/preference-custody-manifest-v11.test.js'
      - 'docs/preference-custody-epistemic-quality.md'
      - 'docs/preference-custody-laboratory-floor-v11.md'
      - '.github/workflows/preference-custody-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-13 and the compositional v11 floor
        run: |
          node tools/compile-preference-epistemic-quality.mjs
          node tools/compile-preference-custody-manifest-v11.mjs
      - name: Validate epistemic and floor boundaries
        run: |
          node tools/validate-preference-epistemic-quality.mjs
          node tools/validate-preference-custody-manifest-v11.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-epistemic-quality.test.js
          node test/preference-custody-manifest-v11.test.js
      - name: Preserve deterministic v11 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v11
          path: |
            build/research/preference-epistemic-quality.json
            build/research/preference-epistemic-quality.md
            build/research/preference-custody-laboratory-floor-v11.json
            build/research/preference-custody-laboratory-floor-v11.md
          if-no-files-found: error
