name: Temporary Wave 37 residual-obligation materializer

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave37-materializer.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave37-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave37-materializer.yml'
          encoded_ref='agent%2Flake-allocator-war-residual-obligations-wave-37'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 37 materializer workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-residual-obligations-wave-37
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize, qualify, reconstruct, and publish Wave 37
        shell: bash
        env:
          BRANCH: agent/lake-allocator-war-residual-obligations-wave-37
          BASE_COMMIT: 2b286dd377373cd3a213bcb042c831a402e177f8
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          test "$(git merge-base "$BASE_COMMIT" "$before")" = "$BASE_COMMIT"

          tree_hash() {
            git add -A
            git write-tree
          }

          lake_pass() {
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/stabilize-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-semantics.mjs
            node tools/stabilize-lake-receipt-custody-wave-20.mjs
            node tools/stabilize-lake-allocator-war-wave-21.mjs
            node tools/build-lake-gap-summary.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-receipt-semantics.mjs
            node tools/validate-lake-gap-summary.mjs
            node tools/reconcile-lake-identifier-topology-wave-18.mjs
            node tools/reconcile-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-custody-wave-20.mjs
            node tools/reconcile-lake-allocator-war-wave-21.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
          }

          shard_and_validate() {
            node tools/shard-lake-index.mjs
            node tools/validate-lake-index-shards.mjs
            node tools/build-lake-basin-index.mjs
            node tools/validate-lake-basin-index.mjs
          }

          focused_validate() {
            node tools/validate-lake-residual-frontier-wave-17.mjs
            node tools/validate-lake-identifier-topology-wave-18.mjs
            node test/lake-identifier-topology-wave-18.test.js
            node tools/validate-lake-generator-contracts-wave-19.mjs
            node tools/validate-lake-receipt-custody-wave-20.mjs
            node tools/validate-lake-allocator-war-wave-21.mjs
            node tools/validate-lake-allocator-war-bounded-source-snapshots-wave-32.mjs
            node tools/validate-lake-allocator-war-structural-parses-wave-33.mjs
            node tools/validate-lake-allocator-war-schema-joins-wave-34.mjs
            node tools/validate-lake-allocator-war-join-requirements-wave-35.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
            npm run validate:lake-allocator-war-residual-obligations-wave-37
          }

          node --check tools/build-lake-allocator-war-residual-obligations-wave-37.mjs
          node --check tools/validate-lake-allocator-war-residual-obligations-wave-37.mjs
          node --check tools/install-lake-allocator-war-residual-obligations-wave-37.mjs
          node --check test/lake-allocator-war-residual-obligations-wave-37.test.js

          node tools/install-lake-allocator-war-residual-obligations-wave-37.mjs
          install1="$(tree_hash)"
          node tools/install-lake-allocator-war-residual-obligations-wave-37.mjs
          install2="$(tree_hash)"
          test "$install1" = "$install2"
          echo "Wave 37 installer fixed point: $install2"

          node tools/build-lake-allocator-war-residual-obligations-wave-37.mjs
          node test/lake-allocator-war-residual-obligations-wave-37.test.js
          build1="$(tree_hash)"
          node tools/build-lake-allocator-war-residual-obligations-wave-37.mjs
          node test/lake-allocator-war-residual-obligations-wave-37.test.js
          build2="$(tree_hash)"
          test "$build1" = "$build2"
          echo "Wave 37 builder fixed point: $build2"

          lake_pass
          pre1="$(tree_hash)"
          lake_pass
          pre2="$(tree_hash)"
          lake_pass
          pre3="$(tree_hash)"
          test "$pre2" = "$pre3"
          echo "Wave 37 pre-release fixed point: $pre3"

          shard_and_validate
          focused_validate
          npm run release:check

          lake_pass
          post1="$(tree_hash)"
          lake_pass
          post2="$(tree_hash)"
          test "$post1" = "$post2"
          echo "Wave 37 post-release fixed point: $post2"

          shard_and_validate
          focused_validate
          git diff --check

          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize allocator-war residual obligations Wave 37'
          product_commit="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"

          git reset --hard HEAD
          git clean -fd
          test ! -e .github/workflows/temporary-wave37-materializer.yml
          node tools/install-lake-allocator-war-residual-obligations-wave-37.mjs
          node tools/build-lake-allocator-war-residual-obligations-wave-37.mjs
          git add -A
          lake_pass
          restored1="$(tree_hash)"
          lake_pass
          restored2="$(tree_hash)"
          test "$restored1" = "$restored2"
          shard_and_validate
          focused_validate
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$product_tree"
          echo "Wave 37 restored epoch: $restored2"

          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$before"
          git push origin "HEAD:$BRANCH"
          echo "Wave 37 product commit: $product_commit"
          echo "Wave 37 product tree: $product_tree"
