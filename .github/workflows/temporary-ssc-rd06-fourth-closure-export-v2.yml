name: TEMP RD-06 fourth-closure export v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.rd06-fourth-closure-control/TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-rd06-fourth-closure-export-v2
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact default-branch controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: controller
          fetch-depth: 1

      - name: Checkout exact canonical RD-06 branch
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd06-offeror-universe
          path: work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconcile, qualify, and export exact seven-file product
        run: |
          set -Eeuo pipefail
          python controller/.github/tmp/ssc-rd06-fourth-closure-export-v2.py \
            work \
            /tmp/ssc-rd06-wave02-fourth-closure-export

      - name: Upload exact reconciled files
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-fourth-closure-export-v2
          path: /tmp/ssc-rd06-wave02-fourth-closure-export
          if-no-files-found: error
          retention-days: 90
