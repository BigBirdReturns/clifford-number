name: Temporary PR2176 060 range repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-060-range-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-060-range-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "eb1e4bd0050b168da8d815995bae865768021176"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-060-range-repair.yml"

      - name: Restrict 060 recognition to the designated range
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')
          old = r'''    && (/^0[1-9]\d{8}$/u.test(groups[0])
      || /^0(?:50|60|70|80|90)\d{8}$/u.test(groups[0]))'''
          new = r'''    && (/^0[1-9]\d{8}$/u.test(groups[0])
      || /^0(?:50|70|80|90)\d{8}$/u.test(groups[0])
      || /^060[1-9]\d{7}$/u.test(groups[0]))'''
          if library.count(old) != 1:
              raise SystemExit('060 range anchor did not match exactly once')
          library = library.replace(old, new, 1)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          anchor = r'''for (const compactNumericIdentifier of [
  '1234567890',
  '00012345678',
  '2026081701','''
          replacement = r'''for (const compactNumericIdentifier of [
  '1234567890',
  '00012345678',
  '06001234567',
  '０６００１２３４５６７',
  '2026081701','''
          if tests.count(anchor) != 1:
              raise SystemExit('reserved 0600 test anchor did not match exactly once')
          tests = tests.replace(anchor, replacement, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-060-range-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-060-range-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): restrict 060 mobile range"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
