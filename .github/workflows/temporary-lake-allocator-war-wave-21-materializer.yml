name: Temporary allocator-war Wave 21 materializer

on:
  pull_request:
    branches:
      - agent/lake-receipt-custody-wave-20
    paths:
      - '.github/tmp/lake-allocator-war-wave-21-trigger.json'
      - '.github/workflows/temporary-lake-allocator-war-wave-21-materializer.yml'
      - 'data/project/lake-allocator-war-wave-21-policy.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-lake-allocator-war-wave-21-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require exact Wave 21 source line
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/tmp/lake-allocator-war-wave-21-trigger.json
          test "$(git merge-base --is-ancestor a09cf6a000947ed9847e6585d65dd36db764013a HEAD; echo $?)" = "0"
          git cat-file -e a908ac9a60c20d279624f9624a1fe6f4b5d96bdf^{commit}
          git cat-file -e 0d6a841df0077343dea628e9262708642d61a310^{commit}
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate sealed Wave 20 baseline
        run: npm run release:check

      - name: Install authority surfaces and build source products
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/install-lake-allocator-war-wave-21.mjs
          node --check tools/build-lake-allocator-war-wave-21.mjs
          node --check tools/reconcile-lake-allocator-war-wave-21.mjs
          node --check tools/stabilize-lake-allocator-war-wave-21.mjs
          node --check tools/validate-lake-allocator-war-wave-21.mjs
          node tools/install-lake-allocator-war-wave-21.mjs
          node tools/install-lake-allocator-war-wave-21.mjs
          node tools/build-lake-allocator-war-wave-21.mjs
          node tools/build-lake-allocator-war-wave-21.mjs
          rm -f .github/tmp/lake-allocator-war-wave-21-trigger.json
          rm -f .github/workflows/temporary-lake-allocator-war-wave-21-materializer.yml
          git add -A
          git diff --check

      - name: Observe current pull-request shadow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs

      - name: Reconcile three-pass lake fixed point
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "allocator-war Wave 21 fixed-point pass $pass"
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/stabilize-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-semantics.mjs
            node tools/stabilize-lake-receipt-custody-wave-20.mjs
            node tools/stabilize-lake-allocator-war-wave-21.mjs
            node tools/build-lake-gap-summary.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-receipt-semantics.mjs
            node tools/validate-lake-gap-summary.mjs
            if [ "$pass" = "1" ]; then
              node -e 'const fs=require("fs");const gaps=JSON.parse(fs.readFileSync("build/lake-index-gaps.json","utf8"));const summary=JSON.parse(fs.readFileSync("build/lake-index-gap-summary.json","utf8"));const rows={WAVE21_DIAGNOSTIC_UNINDEXED:gaps.unindexed_machine_ids_unadjudicated,WAVE21_DIAGNOSTIC_SOURCE_ONLY:gaps.source_ids_without_projection_unadjudicated,WAVE21_DIAGNOSTIC_DIVERGENCE:gaps.divergent_identifier_projections_unadjudicated,WAVE21_DIAGNOSTIC_UNOWNED:summary.top_unowned_paths??[],WAVE21_DIAGNOSTIC_UNREACHABLE:summary.priority_queues?.p3_index_and_publication_gaps?.counts??{}};for(const [label,value] of Object.entries(rows)){console.log(label);console.log(JSON.stringify(value,null,2));}'
            fi
            node tools/reconcile-lake-identifier-topology-wave-18.mjs
            node tools/reconcile-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-custody-wave-20.mjs
            node tools/reconcile-lake-allocator-war-wave-21.mjs
            git add -A
          done

      - name: Shard and validate the committed lake epoch
        shell: bash
        run: |
          set -euo pipefail
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node tools/validate-lake-generator-contracts-wave-19.mjs
          node tools/validate-lake-receipt-custody-wave-20.mjs
          node tools/validate-lake-allocator-war-wave-21.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-identifier-topology-wave-18.test.js
          node test/lake-generator-contracts-wave-19.test.js
          node test/lake-receipt-custody-wave-20.test.js
          node test/lake-allocator-war-wave-21.test.js
          git add -A
          git diff --check

      - name: Run complete repository gate
        run: npm run release:check

      - name: Restore and revalidate the staged lake epoch
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree .
          git clean -fd
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node tools/validate-lake-generator-contracts-wave-19.mjs
          node tools/validate-lake-receipt-custody-wave-20.mjs
          node tools/validate-lake-allocator-war-wave-21.mjs
          node test/lake-allocator-war-wave-21.test.js
          git diff --check

      - name: Commit and push transport-free Wave 21 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/tmp/lake-allocator-war-wave-21-trigger.json
          test ! -e .github/workflows/temporary-lake-allocator-war-wave-21-materializer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate allocator-war waterline into the evidence lake'
          git fetch origin agent/lake-allocator-war-wave-21
          test "$(git rev-parse origin/agent/lake-allocator-war-wave-21)" = "$original_sha"
          git push origin HEAD:agent/lake-allocator-war-wave-21
