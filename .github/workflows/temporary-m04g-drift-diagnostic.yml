name: Temporary diagnose M-04G post-release drift

on:
  push:
    branches:
      - agent/m04g-evidence-hydrology-inland-sea
    paths:
      - '.github/workflows/temporary-m04g-drift-diagnostic.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-m04g-drift-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04g-evidence-hydrology-inland-sea
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize recovered source payload
        run: |
          python - <<'PY'
          import base64, io, json, tarfile
          from pathlib import Path
          root = Path('.github/temporary/m04g-evidence-hydrology')
          encoded = ''.join((root / f'part-{index:02d}').read_text().strip() for index in range(10))
          repairs = json.loads((root / 'repair-00.txt').read_text())
          repairs[-1]['replacement'] = repairs[-1]['replacement'][:10283]
          for repair in sorted(repairs, key=lambda item: item['start'], reverse=True):
              encoded = encoded[:repair['start']] + repair['replacement'] + encoded[repair['end']:]
          payload = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              archive.extractall('.')
          PY
      - name: Run focused and release gates
        run: |
          node tools/build-m04g-evidence-hydrology.mjs
          node tools/validate-m04g-evidence-hydrology.mjs
          node test/m04g-evidence-hydrology.test.js
          node tools/refresh-m04g-evidence-hydrology.mjs --dry-run --class all --limit 100
          npm run release:check
      - name: Restore unrelated generated drift
        run: |
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          exact = {
              '.github/workflows/m04g-evidence-hydrology.yml',
              'data/project/m04g-evidence-hydrology-methodology.json',
              'data/project/m04g-evidence-hydrology-catchments.json',
              'data/project/m04g-evidence-hydrology-pilot-polls.json',
              'data/project/m04g-evidence-hydrology-fanout.json',
              'data/intake/m04g-evidence-hydrology-sources-01.json',
              'docs/methods/evidence-hydrology.md',
              'docs/milestones/m04g-evidence-hydrology-inland-sea-wave-01.md',
              'tools/build-m04g-evidence-hydrology.mjs',
              'tools/validate-m04g-evidence-hydrology.mjs',
              'tools/refresh-m04g-evidence-hydrology.mjs',
              'test/m04g-evidence-hydrology.test.js',
              'build/core-thesis/evidence-hydrology/data.json',
              'reports/core-thesis/evidence-hydrology/data.json',
              'reports/core-thesis/evidence-hydrology/index.html',
              '.github/workflows/temporary-m04g-evidence-hydrology-materialize.yml',
              '.github/workflows/temporary-m04g-drift-diagnostic.yml',
          }
          prefixes = ('.github/temporary/m04g-evidence-hydrology/',)
          def allowed(path): return path in exact or path.startswith(prefixes)
          for row in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines():
              path = row[3:].split(' -> ',1)[-1]
              if allowed(path): continue
              target = Path(path)
              tracked = subprocess.run(['git','ls-files','--error-unmatch','--',path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode == 0
              if tracked: subprocess.run(['git','restore','--staged','--worktree','--',path],check=True)
              elif target.is_dir(): shutil.rmtree(target)
              elif target.exists(): target.unlink()
          PY
      - name: Capture focused rerun and drift
        run: |
          set +e
          : > /tmp/m04g-drift-diagnostic.txt
          node tools/build-m04g-evidence-hydrology.mjs >> /tmp/m04g-drift-diagnostic.txt 2>&1
          echo "build_exit=$?" >> /tmp/m04g-drift-diagnostic.txt
          node tools/validate-m04g-evidence-hydrology.mjs >> /tmp/m04g-drift-diagnostic.txt 2>&1
          echo "validate_exit=$?" >> /tmp/m04g-drift-diagnostic.txt
          node test/m04g-evidence-hydrology.test.js >> /tmp/m04g-drift-diagnostic.txt 2>&1
          echo "test_exit=$?" >> /tmp/m04g-drift-diagnostic.txt
          node tools/refresh-m04g-evidence-hydrology.mjs --dry-run --class all --limit 100 >> /tmp/m04g-drift-diagnostic.txt 2>&1
          echo "refresh_exit=$?" >> /tmp/m04g-drift-diagnostic.txt
          echo '--- git diff --check ---' >> /tmp/m04g-drift-diagnostic.txt
          git diff --check >> /tmp/m04g-drift-diagnostic.txt 2>&1
          echo "diff_check_exit=$?" >> /tmp/m04g-drift-diagnostic.txt
          echo '--- git status --porcelain=v1 --untracked-files=all ---' >> /tmp/m04g-drift-diagnostic.txt
          git status --porcelain=v1 --untracked-files=all >> /tmp/m04g-drift-diagnostic.txt
          echo '--- git diff --name-status ---' >> /tmp/m04g-drift-diagnostic.txt
          git diff --name-status >> /tmp/m04g-drift-diagnostic.txt
          echo '--- git diff --stat ---' >> /tmp/m04g-drift-diagnostic.txt
          git diff --stat >> /tmp/m04g-drift-diagnostic.txt
          cat /tmp/m04g-drift-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: m04g-drift-diagnostic
          path: /tmp/m04g-drift-diagnostic.txt
          if-no-files-found: error
      - name: Export exact verified permanent inland-sea program
        uses: actions/upload-artifact@v4
        with:
          name: m04g-verified-program
          path: |
            .github/workflows/m04g-evidence-hydrology.yml
            data/project/m04g-evidence-hydrology-methodology.json
            data/project/m04g-evidence-hydrology-catchments.json
            data/project/m04g-evidence-hydrology-pilot-polls.json
            data/project/m04g-evidence-hydrology-fanout.json
            data/intake/m04g-evidence-hydrology-sources-01.json
            docs/methods/evidence-hydrology.md
            docs/milestones/m04g-evidence-hydrology-inland-sea-wave-01.md
            tools/build-m04g-evidence-hydrology.mjs
            tools/validate-m04g-evidence-hydrology.mjs
            tools/refresh-m04g-evidence-hydrology.mjs
            test/m04g-evidence-hydrology.test.js
            build/core-thesis/evidence-hydrology/data.json
            reports/core-thesis/evidence-hydrology/data.json
            reports/core-thesis/evidence-hydrology/index.html
          if-no-files-found: error
          include-hidden-files: true
