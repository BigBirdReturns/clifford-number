name: Temporary Wave 38 product materializer

on:
  push:
    branches:
      - agent/lake-allocator-war-priority-one-execution-wave-38
    paths:
      - '.github/workflows/temporary-wave38-materializer.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-wave38-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Await temporary workflow deletion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='.github/workflows/temporary-wave38-materializer.yml'
          encoded_ref='agent%2Flake-allocator-war-priority-one-execution-wave-38'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${encoded_ref}"
          for attempt in $(seq 1 180); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api")"
            [[ "$status" == '404' ]] && exit 0
            [[ "$status" == '200' ]] || { echo "unexpected GitHub contents status: $status" >&2; exit 1; }
            sleep 2
          done
          echo 'temporary Wave 38 workflow was not deleted before checkout' >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-priority-one-execution-wave-38
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct, qualify, audit, and publish Wave 38
        shell: bash
        env:
          BRANCH: agent/lake-allocator-war-priority-one-execution-wave-38
          BASE_COMMIT: 3a7f0a620691f156c932f37069e7a69442ec95df
          CARRIER_SHA256: 0a8cee6909e77a18f4c0cbde5e38bed73d495b1b7b591860134fe211be4fdef3
          ARCHIVE_SHA256: 3d044d1b48cb5874ad7a143a079e2384a9a46639f34e5f50344e877bf0096810
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          test "$(git merge-base "$BASE_COMMIT" "$before")" = "$BASE_COMMIT"
          test ! -e .github/workflows/temporary-wave38-materializer.yml
          test -f .github/tmp/wave38-source.b64

          echo "${CARRIER_SHA256}  .github/tmp/wave38-source.b64" | sha256sum -c -
          base64 -d .github/tmp/wave38-source.b64 > /tmp/wave38-source.tar.gz
          echo "${ARCHIVE_SHA256}  /tmp/wave38-source.tar.gz" | sha256sum -c -

          cat > /tmp/wave38-expected-source-paths.txt <<'PATHS'
          data/project/lake-allocator-war-priority-one-execution-wave-38-manifest.json
          data/project/lake-allocator-war-priority-one-execution-wave-38-plan.json
          data/project/lake-allocator-war-priority-one-execution-wave-38-policy.json
          docs/methods/lake-allocator-war-priority-one-execution-wave-38.md
          docs/milestones/lake-allocator-war-priority-one-execution-wave-38.md
          test/lake-allocator-war-priority-one-execution-wave-38.test.js
          tools/build-lake-allocator-war-priority-one-execution-wave-38.mjs
          tools/install-lake-allocator-war-priority-one-execution-wave-38.mjs
          tools/validate-lake-allocator-war-priority-one-execution-wave-38.mjs
          PATHS
          sed -i 's/^[[:space:]]*//' /tmp/wave38-expected-source-paths.txt
          sort -o /tmp/wave38-expected-source-paths.txt /tmp/wave38-expected-source-paths.txt
          tar -tzf /tmp/wave38-source.tar.gz | sed 's#^\./##' | grep -v '/$' | sort > /tmp/wave38-actual-source-paths.txt
          diff -u /tmp/wave38-expected-source-paths.txt /tmp/wave38-actual-source-paths.txt
          tar -xzf /tmp/wave38-source.tar.gz -C .
          rm .github/tmp/wave38-source.b64

          node --check tools/build-lake-allocator-war-priority-one-execution-wave-38.mjs
          node --check tools/validate-lake-allocator-war-priority-one-execution-wave-38.mjs
          node --check tools/install-lake-allocator-war-priority-one-execution-wave-38.mjs
          node --check test/lake-allocator-war-priority-one-execution-wave-38.test.js
          node -e "for (const p of ['data/project/lake-allocator-war-priority-one-execution-wave-38-manifest.json','data/project/lake-allocator-war-priority-one-execution-wave-38-plan.json','data/project/lake-allocator-war-priority-one-execution-wave-38-policy.json']) JSON.parse(require('fs').readFileSync(p,'utf8'));"

          tree_hash() {
            git add -A
            git write-tree
          }

          lake_pass() {
            node tools/build-lake-index.mjs
            node tools/stabilize-lake-index.mjs
            node tools/stabilize-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-semantics.mjs
            node tools/stabilize-lake-receipt-custody-wave-20.mjs
            node tools/stabilize-lake-allocator-war-wave-21.mjs
            node tools/build-lake-gap-summary.mjs
            node tools/validate-lake-index.mjs
            node tools/validate-lake-receipt-semantics.mjs
            node tools/validate-lake-gap-summary.mjs
            node tools/reconcile-lake-identifier-topology-wave-18.mjs
            node tools/reconcile-lake-generator-contracts-wave-19.mjs
            node tools/reconcile-lake-receipt-custody-wave-20.mjs
            node tools/reconcile-lake-allocator-war-wave-21.mjs
            node tools/validate-lake-allocator-war-public-acquisition-wave-36.mjs
          }

          shard_and_validate() {
            node tools/shard-lake-index.mjs
            node tools/validate-lake-index-shards.mjs
            node tools/build-lake-basin-index.mjs
            node tools/validate-lake-basin-index.mjs
          }

          focused_validate() {
            node tools/validate-lake-residual-frontier-wave-17.mjs
            node tools/validate-lake-identifier-topology-wave-18.mjs
            node test/lake-identifier-topology-wave-18.test.js
            node tools/validate-lake-generator-contracts-wave-19.mjs
            node tools/validate-lake-receipt-custody-wave-20.mjs
            node tools/validate-lake-allocator-war-wave-21.mjs
            npm run validate:lake-allocator-war-estate-execution-wave-22
            npm run validate:lake-allocator-war-lead-acquisition-wave-23
            npm run validate:lake-allocator-war-lead-execution-wave-24
            npm run validate:lake-allocator-war-denominator-closure-wave-25
            npm run validate:lake-allocator-war-targeted-closure-wave-26
            npm run validate:lake-allocator-war-wave26-source-custody-repair
            npm run validate:lake-allocator-war-public-interest-downstream-wave-27
            npm run validate:lake-allocator-war-public-interest-implementation-wave-28
            npm run validate:lake-allocator-war-public-interest-execution-wave-29
            npm run validate:lake-allocator-war-gap-fanout-wave-30
            npm run validate:lake-allocator-war-public-route-execution-wave-31
            npm run validate:lake-allocator-war-bounded-source-snapshots-wave-32
            npm run validate:lake-allocator-war-structural-parses-wave-33
            npm run validate:lake-allocator-war-schema-joins-wave-34
            npm run validate:lake-allocator-war-join-requirements-wave-35
            npm run validate:lake-allocator-war-public-acquisition-wave-36
            npm run validate:lake-allocator-war-residual-obligations-wave-37
            npm run validate:lake-allocator-war-priority-one-execution-wave-38
          }

          stabilize_epoch() {
            node tools/install-lake-allocator-war-priority-one-execution-wave-38.mjs
            install1="$(tree_hash)"
            node tools/install-lake-allocator-war-priority-one-execution-wave-38.mjs
            install2="$(tree_hash)"
            test "$install1" = "$install2"
            echo "Wave 38 installer fixed point: $install2"

            node tools/build-lake-allocator-war-priority-one-execution-wave-38.mjs
            node test/lake-allocator-war-priority-one-execution-wave-38.test.js
            build1="$(tree_hash)"
            node tools/build-lake-allocator-war-priority-one-execution-wave-38.mjs
            node test/lake-allocator-war-priority-one-execution-wave-38.test.js
            build2="$(tree_hash)"
            test "$build1" = "$build2"
            echo "Wave 38 builder fixed point: $build2"

            lake_pass
            pass1="$(tree_hash)"
            lake_pass
            pass2="$(tree_hash)"
            lake_pass
            pass3="$(tree_hash)"
            test "$pass2" = "$pass3"
            echo "Wave 38 lake fixed point: $pass3"

            shard_and_validate
            focused_validate
            npm run release:check

            lake_pass
            post1="$(tree_hash)"
            lake_pass
            post2="$(tree_hash)"
            test "$post1" = "$post2"
            shard_and_validate
            focused_validate
            git diff --check
          }

          stabilize_epoch
          qualified_tree="$(tree_hash)"
          git diff --cached --check

          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Materialize allocator-war priority-one source-system execution Wave 38'

          product_commit="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$product_tree" = "$qualified_tree"
          test ! -e .github/workflows/temporary-wave38-materializer.yml
          test ! -e .github/tmp/wave38-source.b64
          test -z "$(git status --porcelain)"

          git reset --hard HEAD
          git clean -fd
          stabilize_epoch
          git add -A
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" != "$product_tree"

          cat > /tmp/wave38-expected-self-reference-paths.txt <<'PATHS'
          build/axm-identity.json
          build/build-hop-report.json
          build/canonical-subject-projection-wave-13.json
          build/hop-graph.json
          build/lake-actions/canonical-subject-projection-wave-13.json
          build/lake-actions/subject-integration-wave-16.json
          build/lake-index/basin-manifest.json
          build/lake-index/basin-membership.jsonl
          build/lake-index/basins.json
          build/lake-index/files.jsonl
          build/lake-index/gap-summary.json
          build/lake-index/manifest.json
          build/lake-index/objects.jsonl
          build/lake-index/summary.json
          build/migration-review.md
          build/migration-summary.json
          build/receipt-graph.json
          build/scores.json
          build/scout-report.json
          build/scout-report.md
          build/subject-integration-wave-16.json
          build/surface-graph.json
          reports/lake-canonical-subject-projection-wave-13.md
          reports/lake-index-census.md
          reports/lake-index-gap-summary.md
          reports/lake-subject-integration-wave-16.md
          PATHS
          sed -i 's/^[[:space:]]*//' /tmp/wave38-expected-self-reference-paths.txt
          sort -o /tmp/wave38-expected-self-reference-paths.txt /tmp/wave38-expected-self-reference-paths.txt
          git diff --cached --name-only | sort > /tmp/wave38-actual-self-reference-paths.txt
          diff -u /tmp/wave38-expected-self-reference-paths.txt /tmp/wave38-actual-self-reference-paths.txt
          echo 'Wave 38 post-commit self-reference closure: 26 expected generated paths'

          git reset --hard HEAD
          git clean -fd
          test "$(git rev-parse HEAD)" = "$product_commit"
          test "$(git rev-parse 'HEAD^{tree}')" = "$product_tree"
          test -z "$(git status --porcelain)"

          git push \
            --force-with-lease="refs/heads/${BRANCH}:${before}" \
            origin \
            "HEAD:refs/heads/${BRANCH}"
          echo "Wave 38 source head: $before"
          echo "Wave 38 product commit: $product_commit"
          echo "Wave 38 product tree: $product_tree"
          echo "Wave 38 post-commit candidate tree: $candidate_tree"

      - name: Preserve Wave 38 failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo 'HEAD:'
            git rev-parse HEAD || true
            echo 'STATUS:'
            git status --short || true
            echo 'DIFF STAT:'
            git diff --stat || true
            echo 'CACHED DIFF STAT:'
            git diff --cached --stat || true
            echo 'CACHED NAMES:'
            git diff --cached --name-status || true
            echo 'ACTUAL SELF-REFERENCE PATHS:'
            cat /tmp/wave38-actual-self-reference-paths.txt 2>/dev/null || true
          } > /tmp/wave38-materializer-diagnostics.txt
          cat /tmp/wave38-materializer-diagnostics.txt

      - name: Upload Wave 38 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wave38-materializer-diagnostics
          path: /tmp/wave38-materializer-diagnostics.txt
          if-no-files-found: warn
          retention-days: 1
