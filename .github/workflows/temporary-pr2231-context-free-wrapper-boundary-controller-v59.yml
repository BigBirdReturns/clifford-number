name: Temporary PR 2231 context-free wrapper boundary controller v59
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-context-free-wrapper-boundary-controller-v59.yml'
      - '.github/tmp/pr2231-context-free-wrapper-boundary-v59-repair.py'
permissions:
  contents: write
  issues: read
  pull-requests: read
concurrency:
  group: pr2231-context-free-wrapper-boundary-v59
  cancel-in-progress: false
jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-context-free-wrapper-boundary-controller-v59
      WORKFLOW_PATH: .github/workflows/temporary-pr2231-context-free-wrapper-boundary-controller-v59.yml
      REPAIR_PATH: .github/tmp/pr2231-context-free-wrapper-boundary-v59-repair.py
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 64cf378d5bb7b39b9d496f554a887076cf3d637b
      PLIB: 476ed485878026ae89682eb692b7802ad7fa37ec
      PTEST: 964c44006a528234dc0962ba7524c10281c9d81d
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify and publish context-free boundary proof
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-v59-source
          Q=/tmp/pr2231-v59-main
          R=/tmp/pr2231-v59-receipt.txt
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s actual=%s expected=%s\n' "$label" "$actual" "$expected" | tee -a "$R"
            [ "$actual" = "$expected" ] || fail "$label" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-branch '${{ github.head_ref }}' "$CBRANCH"
          require_eq controller-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" $'.github/tmp/pr2231-context-free-wrapper-boundary-v59-repair.py\n.github/workflows/temporary-pr2231-context-free-wrapper-boundary-controller-v59.yml'
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-remote "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          MAIN="$(git rev-parse refs/remotes/origin/main)"
          require_eq main "$MAIN" "$CPARENT"
          require_eq main-lib "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" "$BTEST"

          stage exact-head-defect-reproduction
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const chain = 'GUID '.repeat(4000);
          const defects = [
            [
              'split-four-four',
              `Archive ${chain}(record id: 1234) 5678`,
              `Archive ${chain}(record id: 1234) 5678`
            ],
            [
              'intrinsic-after-short-prefix',
              `Archive ${chain}(record id: 1234) 050-12345678`,
              `Archive ${chain}(record id: 1234) [contact omitted]`
            ],
            [
              'observation-after-short-prefix',
              `Archive ${chain}(record id: 1234) 2027-09-18`,
              `Archive ${chain}(record id: 1234) 2027-09-18`
            ],
            [
              'two-intrinsic-segments',
              `Archive ${chain}(record id: 050-12345678) 03-6216-8041`,
              `Archive ${chain}(record id: [contact omitted]) [contact omitted]`
            ]
          ];
          for (const [name, input, expected] of defects) {
            const actual = redact(input);
            console.log(JSON.stringify({
              defect: name,
              actualTail: actual.slice(-240),
              expectedTail: expected.slice(-240),
              redactions: (actual.match(/\[contact omitted\]/gu) ?? []).length
            }));
            assert.notEqual(actual, expected, `${name} must fail on the exact predecessor`);
          }
          assert.equal(
            redact(`Archive ${chain}(record id: 09012345678 2026-08-17-)03-6216-8041) 12345678`),
            `Archive ${chain}(record id: [contact omitted] 2026-08-17-)[contact omitted] 12345678`,
            'the predecessor must retain its reported v57 repair'
          );
          assert.equal(
            redact('Context (Phone: (03) ) 6216 5111'),
            'Context (Phone: [contact omitted])',
            'the predecessor must retain canonical crossed-closer grouping'
          );
          NODE

          stage exact-two-file-repair
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          git diff --check
          require_eq repair-paths "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage repaired-transition-and-focused-suites
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { performance } from 'node:perf_hooks';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const chain = 'GUID '.repeat(4000);
          const cases = [
            [
              'split-four-four',
              `Archive ${chain}(record id: 1234) 5678`,
              `Archive ${chain}(record id: 1234) 5678`
            ],
            [
              'split-six-two',
              `Archive ${chain}(record id: 123456) 78`,
              `Archive ${chain}(record id: 123456) 78`
            ],
            [
              'first-seven-tail-one',
              `Archive ${chain}(record id: 1234567) 8`,
              `Archive ${chain}(record id: [contact omitted]) 8`
            ],
            [
              'fullwidth-split-four-four',
              `Archive ${chain}（record id: １２３４） ５６７８`,
              `Archive ${chain}（record id: １２３４） ５６７８`
            ],
            [
              'intrinsic-after-short-prefix',
              `Archive ${chain}(record id: 1234) 050-12345678`,
              `Archive ${chain}(record id: 1234) [contact omitted]`
            ],
            [
              'observation-after-short-prefix',
              `Archive ${chain}(record id: 1234) 2027-09-18`,
              `Archive ${chain}(record id: 1234) 2027-09-18`
            ],
            [
              'two-intrinsic-segments',
              `Archive ${chain}(record id: 050-12345678) 03-6216-8041`,
              `Archive ${chain}(record id: [contact omitted]) [contact omitted]`
            ],
            [
              'explicit-phone-label-crossing',
              'Phone: (1234) 5678',
              'Phone: [contact omitted]'
            ],
            [
              'reported-v57-control',
              `Archive ${chain}(record id: 09012345678 2026-08-17-)03-6216-8041) 12345678`,
              `Archive ${chain}(record id: [contact omitted] 2026-08-17-)[contact omitted] 12345678`
            ],
            [
              'crossed-domestic-closer-control',
              'Context (Phone: (03) ) 6216 5111',
              'Context (Phone: [contact omitted])'
            ],
            [
              'post-wrapper-intrinsic-control',
              `Archive ${chain}(record id: 09012345678 2026-08-17-)03-6216-8041) 050-12345678`,
              `Archive ${chain}(record id: [contact omitted] 2026-08-17-)[contact omitted] [contact omitted]`
            ],
            [
              'determinate-control',
              'Archive (record id: 1234) 5678',
              'Archive (record id: 1234) 5678'
            ]
          ];
          for (const [name, input, expected] of cases) {
            const actual = redact(input);
            console.log(JSON.stringify({
              name,
              actualTail: actual.slice(-260),
              expectedTail: expected.slice(-260),
              redactions: (actual.match(/\[contact omitted\]/gu) ?? []).length
            }));
            assert.equal(actual, expected, name);
          }

          const timings = [];
          for (const count of [250, 500, 1000, 2000]) {
            const input = `Phone: (1234567${')1'.repeat(count)}`;
            const started = performance.now();
            const actual = redact(input);
            const elapsedMs = performance.now() - started;
            const record = {
              count,
              elapsedMs: Number(elapsedMs.toFixed(3)),
              inputLength: input.length,
              outputLength: actual.length
            };
            timings.push(record);
            console.log(JSON.stringify({ benchmark: 'removed-closer-scan', ...record }));
          }
          assert.ok(
            timings.at(-1).elapsedMs < 5000,
            'the bounded 2,000-closer diagnostic must complete without pathological delay'
          );
          NODE
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"

          stage live-main-transplant-and-release-qualification
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$MAIN"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq qualified-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check

          stage construct-qualified-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: require context-free proof across wrapper boundaries'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq qualified-parent "$(git rev-parse HEAD^)" "$MAIN"
          require_eq qualified-count "$(git rev-list --count "$MAIN..HEAD")" '1'
          require_eq qualified-commit-paths "$(git diff --name-only "$MAIN..HEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
          git diff --numstat "$MAIN..HEAD" | LC_ALL=C sort -k3 | tee -a "$R"

          stage final-lease-revalidation-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$MAIN"
          require_eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-main-lib "$(git rev-parse "$MAIN:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq final-main-test "$(git rev-parse "$MAIN:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq final-product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq final-product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$AHEAD"
          require_eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          require_eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ALIB"
          require_eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ATEST"
          printf 'QUALIFICATION_SUCCESS\nbase=%s\nold_product=%s\nnew_product=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$MAIN" "$PHEAD" "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-context-free-wrapper-boundary-v59
          path: /tmp/pr2231-v59-receipt.txt
          if-no-files-found: error
          retention-days: 90
