name: Temporary export recovered SG-10 payload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-export-ssc-wave02-review-sg10-v2.yml'
      - '.github/tmp/ssc-w02-sg10.part-00.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/ssc-sg10-payload-recovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-sg10-payload-recovery
          fetch-depth: 1
      - name: Decode exact SG-10 payload
        run: |
          set -Eeuo pipefail
          git hash-object .github/tmp/ssc-w02-sg10.part-00.b64
          base64 --decode .github/tmp/ssc-w02-sg10.part-00.b64 > /tmp/sg10-payload.tar.xz
          sha256sum .github/tmp/ssc-w02-sg10.part-00.b64 /tmp/sg10-payload.tar.xz
          tar -tJf /tmp/sg10-payload.tar.xz > /tmp/sg10-payload-paths.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-sg10-payload
          path: |
            /tmp/sg10-payload.tar.xz
            /tmp/sg10-payload-paths.txt
          if-no-files-found: error
          retention-days: 1
