name: TEMP recover RD-03 authored package from history

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd03-authored-package-diagnostic-v1.yml'
      - '.github/tmp/recover-rd03-authored-package.py'
      - '.rd03-authored-diagnostic/**'

permissions:
  contents: read

concurrency:
  group: temp-ssc-rd03-authored-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd03-authored-package-diagnostic-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_CARRIER_HEAD: 02ea4361a38b860a56be29bb86733f761bcfca30
      OVERWRITE_COMMIT: f4ff1c089a9f55c588e77d320a729d1dc8240070
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd03-terminal-materializer-base-v1
          fetch-depth: 0

      - name: Recover complete files and retained package history
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CARRIER_HEAD"
          node tools/validate-no-magic-human-gate.mjs
          git show "origin/agent/ssc-rd03-authored-package-diagnostic-base-v1:.github/tmp/recover-rd03-authored-package.py" \
            > /tmp/recover-rd03-authored-package.py
          python /tmp/recover-rd03-authored-package.py
          node tools/validate-no-magic-human-gate.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-authored-package-recovery-v3
          path: /tmp/rd03-authored-recovery
          if-no-files-found: error
          retention-days: 90
