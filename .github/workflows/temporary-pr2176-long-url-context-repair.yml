name: Temporary PR2176 long URL-context repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-long-url-context-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-long-url-context-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "851790ca2fd01ee3daa2de98486df494c6ae2113"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-long-url-context-repair.yml"

      - name: Preserve the complete current token in prefix context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')
          helper_anchor = r'''function redactPhoneSubspans(candidate, externalPrefix, externalSuffix, allowInitialGroup = true) {'''
          helper = r'''function redactionPrefixContext(input, offset) {
            const preceding = input.slice(0, offset);
            const boundedStart = Math.max(0, preceding.length - 64);
            const currentToken = preceding.match(/\S+$/u)?.[0] ?? '';
            const tokenStart = currentToken ? preceding.length - currentToken.length : preceding.length;
            return preceding.slice(Math.min(boundedStart, tokenStart));
          }

          function redactPhoneSubspans(candidate, externalPrefix, externalSuffix, allowInitialGroup = true) {'''
          if library.count(helper_anchor) != 1:
              raise SystemExit('redaction-prefix helper anchor did not match exactly once')
          library = library.replace(helper_anchor, helper, 1)

          old_prefix = "    const prefix = input.slice(Math.max(0, offset - 64), offset);"
          new_prefix = "    const prefix = redactionPrefixContext(input, offset);"
          if library.count(old_prefix) != 1:
              raise SystemExit('redaction-prefix call anchor did not match exactly once')
          library = library.replace(old_prefix, new_prefix, 1)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          anchor = r'''assert.equal(
            redactContactData('https://example.test/ 01 42 68 53 00'),
            'https://example.test/ [contact omitted]',
            'URL protection must end at whitespace so a later independent phone is still redacted'
          );'''
          replacement = anchor + r'''
          for (const longNumericUrl of [
            `https://example.test/${'long-segment/'.repeat(12)}01/42/68/53/00`,
            `www.example.test/${'long-segment/'.repeat(12)}03/6216/5111`,
            `https://example.test/${'long-segment/'.repeat(12)}+44/20/7123/4567`
          ]) {
            assert.equal(
              redactContactData(longNumericUrl),
              longNumericUrl,
              'numeric URL paths must remain intact when the scheme is more than 64 characters behind the candidate'
            );
          }'''
          if tests.count(anchor) != 1:
              raise SystemExit('long URL-context test anchor did not match exactly once')
          tests = tests.replace(anchor, replacement, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-long-url-context-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-long-url-context-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): preserve long numeric URL tokens"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
