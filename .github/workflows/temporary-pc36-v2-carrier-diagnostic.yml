name: TEMP diagnose PC-36 v2 carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc36-v2-carrier-diagnostic.yml'
      - '.pc36v2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc36-permanent-materializer
          fetch-depth: 1
      - name: Export hosted v2 carrier without mutating it
        run: |
          set -Eeuo pipefail
          out=/tmp/pc36-v2-diagnostic
          mkdir -p "$out/shards"
          mapfile -t parts < <(find .pc36v2 -maxdepth 1 -type f -name 'payload-*.b64' | sort)
          printf '%s\n' "${parts[@]}" > "$out/shard-paths.txt"
          cp "${parts[@]}" "$out/shards/"
          wc -c "${parts[@]}" > "$out/shard-sizes.txt"
          sha256sum "${parts[@]}" > "$out/shard-sha256.txt"
          carrier="$out/pc36-product.tar.gz.b64"
          : > "$carrier"
          for part in "${parts[@]}"; do tr -d '\r\n\t ' < "$part" >> "$carrier"; done
          stat -c '%s' "$carrier" > "$out/carrier-bytes.txt"
          sha256sum "$carrier" > "$out/carrier-sha256.txt"
          set +e
          base64 --decode "$carrier" > "$out/pc36-product.tar.gz" 2> "$out/decode.stderr"
          printf '%s\n' "$?" > "$out/decode.status"
          set -e
          printf 'exported %s shards\n' "${#parts[@]}"
          cat "$out/shard-sizes.txt"
          cat "$out/carrier-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pc36-v2-carrier-diagnostic
          path: /tmp/pc36-v2-diagnostic
          if-no-files-found: error
          retention-days: 7
