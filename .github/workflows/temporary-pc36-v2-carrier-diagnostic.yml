name: TEMP diagnose PC-36 v2 carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc36-v2-carrier-diagnostic.yml'
      - '.pc36v2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc36-permanent-materializer
          fetch-depth: 1
      - name: Verify exact v2 carrier
        run: |
          set -Eeuo pipefail
          out=/tmp/pc36-v2-diagnostic
          mkdir -p "$out"
          mapfile -t parts < <(find .pc36v2 -maxdepth 1 -type f -name 'payload-*.b64' | sort)
          printf '%s\n' "${parts[@]}" > "$out/shard-paths.txt"
          wc -c "${parts[@]}" > "$out/shard-sizes.txt"
          sha256sum "${parts[@]}" > "$out/shard-sha256.txt"
          test "${#parts[@]}" = 12
          carrier="$out/pc36-product.tar.gz.b64"
          : > "$carrier"
          for part in "${parts[@]}"; do tr -d '\r\n\t ' < "$part" >> "$carrier"; done
          observed_bytes="$(stat -c '%s' "$carrier")"
          observed_sha="$(sha256sum "$carrier" | awk '{print $1}')"
          printf '%s\n' "$observed_bytes" > "$out/carrier-bytes.txt"
          printf '%s\n' "$observed_sha" > "$out/carrier-sha256.txt"
          printf 'carrier bytes: expected=32932 observed=%s\n' "$observed_bytes"
          printf 'carrier sha256: expected=db69a4612ddf8b7957e9bd655df04886b9679faea391d300c19cd5f9707b1205 observed=%s\n' "$observed_sha"
          test "$observed_bytes" = 32932
          test "$observed_sha" = db69a4612ddf8b7957e9bd655df04886b9679faea391d300c19cd5f9707b1205
          base64 --decode "$carrier" > "$out/pc36-product.tar.gz"
          tar_sha="$(sha256sum "$out/pc36-product.tar.gz" | awk '{print $1}')"
          printf '%s\n' "$tar_sha" > "$out/tar-sha256.txt"
          printf 'tar sha256: expected=603fcf186af572be28043a226994059b5a829c6f59e328bcea008359fae5d126 observed=%s\n' "$tar_sha"
          test "$tar_sha" = 603fcf186af572be28043a226994059b5a829c6f59e328bcea008359fae5d126
          tar -tzf "$out/pc36-product.tar.gz" | sed 's#^\./##' | sed '/\/$/d' | sort > "$out/paths.txt"
          test "$(wc -l < "$out/paths.txt" | tr -d ' ')" = 14
      - uses: actions/upload-artifact@v4
        with:
          name: pc36-v2-carrier-diagnostic
          path: /tmp/pc36-v2-diagnostic
          if-no-files-found: error
          retention-days: 7
