name: Temporary Wave 22 ancestry fetch diagnostic

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - '.github/tmp/wave22-ancestry-fetch-diagnostic-trigger.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Prove explicit feature-branch recovery
        shell: bash
        run: |
          set -euo pipefail
          base='ec730441e4779b24226f12f556707f4a89b7fe3f'
          remote_head="refs/remotes/origin/${GITHUB_HEAD_REF}"
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "checkout_head=$(git rev-parse HEAD)"
          echo "shallow_before=$(git rev-parse --is-shallow-repository)"
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo 'base_before=present'
          else
            echo 'base_before=absent'
          fi
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_HEAD_REF}:${remote_head}"
          echo "remote_head_sha=$(git rev-parse "${remote_head}")"
          echo "shallow_after=$(git rev-parse --is-shallow-repository)"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" "$remote_head"
          echo 'explicit_head_ref_ancestry=passed'
