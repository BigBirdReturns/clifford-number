name: Temporary repair SG-03 historical cleanliness

on:
  pull_request_target:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: repair-sg03-historical-cleanliness
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 405 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/k0-role-neutral-wave-08'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/clifford-number
          ref: agent/k0-role-neutral-wave-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify event head and patch the historical workflow
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          old_head="$(git rev-parse HEAD)"
          test "$old_head" = "$EXPECTED_HEAD"
          printf '%s\n' "$old_head" > /tmp/old-head
          git merge-base --is-ancestor 4930f542b345829d41f2ab35145fbcce95709d6d HEAD

          if grep -q 'Verify and restore timestamp-only compiler products' .github/workflows/project-stable-ground-sg03.yml; then
            echo 'SG-03 historical cleanliness repair already present'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/project-stable-ground-sg03.yml')
          text = path.read_text()
          old = '''      - name: Refuse historical-check mutation
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
'''
          new = '''      - name: Verify and restore timestamp-only compiler products
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import subprocess

          volatile = [
              'build/axm-identity.json',
              'build/build-hop-report.json',
              'build/hop-graph.json',
              'build/migration-review.md',
              'build/migration-summary.json',
              'build/receipt-graph.json',
              'build/scores.json',
              'build/scout-report.json',
              'build/scout-report.md',
              'build/surface-graph.json',
          ]
          for item in volatile:
              diff = subprocess.run(
                  ['git', 'diff', '--unified=0', '--', item],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              if not diff:
                  continue
              changed = [
                  line[1:].strip()
                  for line in diff.splitlines()
                  if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))
              ]
              if len(changed) != 2 or not all(
                  line.startswith('"generated": "') or line.startswith('Generated: ')
                  for line in changed
              ):
                  raise RuntimeError(f'unexpected compiler diff in {item}: {changed}')
          PYTHON
          git restore --worktree -- \\
            build/axm-identity.json \\
            build/build-hop-report.json \\
            build/hop-graph.json \\
            build/migration-review.md \\
            build/migration-summary.json \\
            build/receipt-graph.json \\
            build/scores.json \\
            build/scout-report.json \\
            build/scout-report.md \\
            build/surface-graph.json
          git diff --exit-code
          test -z "$(git status --porcelain)"
'''
          if text.count(old) != 1:
              raise RuntimeError(f'historical cleanliness anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate SG-04 custody and run the complete gate
        run: |
          set -euo pipefail
          node tools/build-project-stable-ground-sg04.mjs
          node tools/validate-project-stable-ground-sg03.mjs
          node test/project-stable-ground-sg03.test.js
          node tools/validate-project-stable-ground-sg04.mjs
          node test/project-stable-ground-sg04.test.js
          npm run release:check
      - name: Restore verified timestamp-only release products
        run: |
          set -euo pipefail
          old_head="$(cat /tmp/old-head)"
          python3 - <<'PY'
          import subprocess

          volatile = [
              'build/axm-identity.json',
              'build/build-hop-report.json',
              'build/hop-graph.json',
              'build/migration-review.md',
              'build/migration-summary.json',
              'build/receipt-graph.json',
              'build/scores.json',
              'build/scout-report.json',
              'build/scout-report.md',
              'build/surface-graph.json',
          ]
          for item in volatile:
              diff = subprocess.run(
                  ['git', 'diff', '--unified=0', '--', item],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              if not diff:
                  continue
              changed = [
                  line[1:].strip()
                  for line in diff.splitlines()
                  if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))
              ]
              if len(changed) != 2 or not all(
                  line.startswith('"generated": "') or line.startswith('Generated: ')
                  for line in changed
              ):
                  raise RuntimeError(f'unexpected compiler diff in {item}: {changed}')
          PY
          git restore --source="$old_head" --worktree -- \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/migration-review.md \
            build/migration-summary.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/scout-report.md \
            build/surface-graph.json
      - name: Constrain and publish the repaired two-commit lineage
        run: |
          set -euo pipefail
          old_head="$(cat /tmp/old-head)"
          printf '%s\n' \
            '.github/workflows/project-stable-ground-sg03.yml' \
            'data/project/project-stable-ground-sg04-release-manifest.json' \
            'reports/core-thesis/stable-ground/sg04/checkpoint.json' \
            'reports/core-thesis/stable-ground/sg04/index.html' \
            | sort > /tmp/expected-paths
          git diff --name-only | sort > /tmp/observed-paths
          diff -u /tmp/expected-paths /tmp/observed-paths
          git add -A
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft e9b85b31281db02ce3f9a9a84dd7aea34b714849
          git diff --cached --check
          test ! -e .github/tmp/sg04-source.tar.gz.b64
          test ! -e .github/tmp/sg04-materializer-diagnostic.log
          git commit -m 'Complete K0 query battery and append SG-04'
          git push --force-with-lease=refs/heads/agent/k0-role-neutral-wave-08:"$old_head" origin HEAD:agent/k0-role-neutral-wave-08
