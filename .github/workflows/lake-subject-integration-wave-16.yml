name: Evidence lake subject integration Wave 16

on:
  push:
    branches:
      - agent/lake-subject-integration-wave-16
    paths:
      - '.github/tmp/lake-subject-integration-wave-16-trigger.json'
  pull_request:
    branches:
      - agent/lake-unresolved-subject-adjudication-wave-15
    paths:
      - 'data/project/lake-subject-integration-wave-16-policy.json'
      - 'data/project/lake-local-canonical-resolution-registry-wave-16.jsonl'
      - 'data/project/lake-subject-object-registry-wave-16.jsonl'
      - 'data/project/lake-canonical-identity-extension-registry-wave-16.jsonl'
      - 'data/project/lake-subject-integration-wave-16.json'
      - 'tools/apply-lake-subject-integration-wave-16-sources.mjs'
      - 'tools/apply-lake-subject-integration-wave-16.mjs'
      - 'tools/lib/subject-object-resolution.mjs'
      - 'tools/project-lake-subject-objects-wave-16.mjs'
      - 'tools/build-lake-subject-integration-wave-16.mjs'
      - 'tools/reconcile-lake-subject-integration-wave-16.mjs'
      - 'tools/validate-lake-subject-integration-wave-16.mjs'
      - 'test/lake-subject-integration-wave-16.test.js'
      - 'test/lake-canonical-subject-projection-wave-13.test.js'
      - 'test/case-ledger.test.js'
      - 'tools/compile.mjs'
      - '.github/workflows/lake-subject-integration-wave-16.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lake-subject-integration-wave-16-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Determine execution mode
        id: mode
        shell: bash
        run: |
          echo "original_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test -f .github/tmp/lake-subject-integration-wave-16-trigger.json \
            && { test "$GITHUB_EVENT_NAME" = 'push' || test "$GITHUB_EVENT_NAME" = 'pull_request'; }; then
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
          else
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore committed bytes
        run: |
          git restore --staged --worktree .
          git clean -fd
      - name: Validate the historical baseline before source integration
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check
          git restore --staged --worktree .
          git clean -fd
          sha256sum \
            build/exact-canonical-subject-projection-wave-14.json \
            build/lake-actions/exact-canonical-subject-wave-14.json \
            build/lake-actions/exact-canonical-subject-wave-14-reconciliation.json \
            data/project/lake-exact-canonical-subject-wave-14.json \
            data/project/lake-unresolved-subject-registry-wave-14.jsonl \
            build/unresolved-subject-adjudication-wave-15.json \
            build/lake-actions/unresolved-subject-adjudication-wave-15.json \
            build/lake-actions/unresolved-subject-adjudication-wave-15-reconciliation.json \
            data/project/lake-unresolved-subject-adjudication-wave-15.json \
            data/project/lake-unresolved-subject-adjudication-registry-wave-15.jsonl > /tmp/lake-subject-wave-16-sealed.sha256
      - name: Build deterministic Wave 16 source integration
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/apply-lake-subject-integration-wave-16-sources.mjs
          sha256sum \
            data/canonical/organizations.json \
            data/project/lake-canonical-subject-projection-wave-13-policy.json \
            data/project/lake-local-canonical-resolution-registry-wave-16.jsonl \
            data/project/lake-subject-object-registry-wave-16.jsonl \
            build/lake-actions/subject-integration-source-mutation-wave-16.json > /tmp/lake-subject-wave-16-source-first.sha256
          node tools/apply-lake-subject-integration-wave-16-sources.mjs
          sha256sum --check --strict /tmp/lake-subject-wave-16-source-first.sha256
          sha256sum --check --strict /tmp/lake-subject-wave-16-sealed.sha256
          git add -A
          git diff --check
      - name: Apply Wave 16 lake authority and documentation
        if: steps.mode.outputs.materialize == 'true'
        run: |
          node tools/apply-lake-subject-integration-wave-16.mjs
          git add -A
          git diff --check
      - name: Run the complete repository release gate with Wave 16 active
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check
          sha256sum --check --strict /tmp/lake-subject-wave-16-sealed.sha256
          node test/lake-canonical-subject-projection-wave-13.test.js
          node test/lake-subject-integration-wave-16.test.js
          git diff --check
      - name: Validate an already materialized committed head
        if: steps.mode.outputs.materialize != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check
          git reset --hard HEAD
          git clean -fd
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-canonical-subject-projection-wave-13.mjs
          node tools/validate-lake-subject-integration-wave-16.mjs
          node test/lake-canonical-subject-projection-wave-13.test.js
          node test/lake-subject-integration-wave-16.test.js
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"
      - name: Stabilize the exact staged tree before the lake census
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          rm -f .github/tmp/lake-subject-integration-wave-16-trigger.json
          git add -A
          git restore --worktree .
          git clean -fd
      - name: Observe current open-PR shadow
        if: steps.mode.outputs.materialize == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-lake-open-pr-shadow.mjs
      - name: Build and reconcile the integrated lake
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/reconcile-lake-canonical-subject-projection-wave-13.mjs
          node tools/reconcile-lake-subject-integration-wave-16.mjs
          git add -A
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/validate-lake-canonical-subject-projection-wave-13.mjs
          node tools/validate-lake-subject-integration-wave-16.mjs
          node test/lake-index.test.js
          node test/lake-canonical-subject-projection-wave-13.test.js
          node test/lake-subject-integration-wave-16.test.js
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node test/lake-basin-index.test.js
      - name: Prove deterministic post-reconciliation products
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find build/lake-index -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/lake-subject-wave-16-post.sha256
          sha256sum \
            data/project/lake-local-canonical-resolution-registry-wave-16.jsonl \
            data/project/lake-subject-object-registry-wave-16.jsonl \
            data/project/lake-canonical-identity-extension-registry-wave-16.jsonl \
            data/project/lake-subject-integration-wave-16.json \
            build/subject-integration-wave-16.json \
            build/lake-actions/subject-integration-wave-16.json \
            build/lake-actions/subject-integration-wave-16-reconciliation.json \
            build/canonical-subject-projection-wave-13.json \
            build/lake-actions/canonical-subject-projection-wave-13-reconciliation.json \
            reports/lake-subject-integration-wave-16.md \
            reports/lake-subject-integration-wave-16-reconciliation.md >> /tmp/lake-subject-wave-16-post.sha256
          node tools/project-lake-subject-objects-wave-16.mjs --target=cases
          node tools/project-lake-subject-objects-wave-16.mjs --target=catalog
          node tools/build-lake-canonical-subject-projection-wave-13.mjs
          node tools/build-lake-subject-integration-wave-16.mjs
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          node tools/reconcile-lake-canonical-subject-projection-wave-13.mjs
          node tools/reconcile-lake-subject-integration-wave-16.mjs
          git add -A
          node tools/build-lake-index.mjs
          node tools/stabilize-lake-index.mjs
          node tools/reconcile-lake-receipt-semantics.mjs
          node tools/build-lake-gap-summary.mjs
          node tools/validate-lake-index.mjs
          node tools/validate-lake-receipt-semantics.mjs
          node tools/validate-lake-gap-summary.mjs
          node tools/validate-lake-canonical-subject-projection-wave-13.mjs
          node tools/validate-lake-subject-integration-wave-16.mjs
          node tools/shard-lake-index.mjs
          node tools/build-lake-basin-index.mjs
          sha256sum --check --strict /tmp/lake-subject-wave-16-post.sha256
          sha256sum --check --strict /tmp/lake-subject-wave-16-sealed.sha256
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node test/lake-subject-integration-wave-16.test.js
          git diff --check
      - name: Enforce Wave 16 source and generated-output boundaries
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess

          required = {
              '.github/tmp/lake-subject-integration-wave-16-trigger.json',
              'BUILD-INSTRUCTIONS.md',
              'README.md',
              'data/canonical/organizations.json',
              'data/project/lake-canonical-subject-projection-wave-13-policy.json',
              'data/project/lake-index-policy.json',
              'data/project/lake-local-canonical-resolution-registry-wave-16.jsonl',
              'data/project/lake-subject-object-registry-wave-16.jsonl',
              'data/project/lake-canonical-identity-extension-registry-wave-16.jsonl',
              'data/project/lake-subject-integration-wave-16.json',
          }
          allowed_sources = required | {'data/project/lake-open-pr-shadow.json'}
          generated_prefixes = ('build/', 'reports/', 'briefs/', 'estates/', 'gametrails/')
          generated_root = re.compile(r'^(?:Clifford-.*\.html|[^/]+-standalone\.html)$')
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          actual = set()
          for entry in entries:
              status = entry[:2]
              assert 'R' not in status and 'C' not in status, entry
              actual.add(entry[3:])
          unexpected = sorted(path for path in actual
              if path not in allowed_sources
              and not path.startswith(generated_prefixes)
              and not generated_root.match(path))
          assert required <= actual, {'missing_required_wave_16_changes': sorted(required - actual)}
          assert not unexpected, {'undeclared_source_changes': unexpected}
          print({'required_changes': len(required), 'actual_changes': len(actual), 'generated_changes': len(actual - allowed_sources)})
          PY
      - name: Commit and push the integrated Wave 16 checkpoint
        if: steps.mode.outputs.materialize == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute live subject integration Wave 16'
          git fetch origin agent/lake-subject-integration-wave-16
          test "$(git rev-parse origin/agent/lake-subject-integration-wave-16)" = "${{ steps.mode.outputs.original_sha }}"
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          git push origin HEAD:agent/lake-subject-integration-wave-16
