name: Preference custody laboratory floor v21

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-comprehension-assurance.mjs'
      - 'tools/validate-preference-comprehension-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v21.mjs'
      - 'tools/validate-preference-custody-manifest-v21.mjs'
      - 'test/preference-comprehension-assurance.test.js'
      - 'test/preference-custody-manifest-v21.test.js'
      - 'docs/preference-custody-comprehension-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v21.md'
      - '.github/workflows/preference-comprehension-assurance.yml'
      - '.github/workflows/preference-custody-v21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-23 and the compositional v21 floor
        run: |
          node tools/compile-preference-comprehension-assurance.mjs
          node tools/compile-preference-custody-manifest-v21.mjs
      - name: Validate comprehension-assurance and floor boundaries
        run: |
          node tools/validate-preference-comprehension-assurance.mjs
          node tools/validate-preference-custody-manifest-v21.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-comprehension-assurance.test.js
          node test/preference-custody-manifest-v21.test.js
      - name: Preserve deterministic v21 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v21
          path: |
            build/research/preference-comprehension-assurance.json
            build/research/preference-comprehension-assurance.md
            build/research/preference-custody-laboratory-floor-v21.json
            build/research/preference-custody-laboratory-floor-v21.md
          if-no-files-found: error
