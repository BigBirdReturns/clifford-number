name: TEMP materialize SSC RD-01 terminal closure v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd01-permanent-materializer-base-v1
    paths:
      - '.github/tmp/ssc-rd01-permanent-materializer-v1.trigger'

permissions:
  actions: read
  contents: write

concurrency:
  group: ssc-rd01-permanent-materializer-v2
  cancel-in-progress: false

env:
  EXPECTED_MAIN: dcc64cb395368070c8fa0ca3834afda26e2c0caf
  EXPECTED_RESEARCH: 72e657baa024e0e90cca5bfc532f8350fe6bca60
  TARGET_BRANCH: agent/ssc-rd-wave02-rd01-legal-entity
  RESEARCH_ARCHIVE_BRANCH: archive/ssc-rd01-research-head-72e657
  PACKAGE_B64_SHA256: bd37425b3f936369196d10307bc32b33d9765e835738563c887082028d2c19bb
  PACKAGE_TGZ_SHA256: 7affdafb780f90fab813b93480f346ecd65391d560eaad94499346b9769e004c
  PRODUCT_MANIFEST_SHA256: 7d5cc33a8fb8fc759dd2794076ffcd7ca4e1ad9c463f49593459edfca793a798
  STAGE1_ARTIFACT_ID: '8866039696'
  STAGE1_ZIP_SHA256: ac81681b0f080715326bf7b4d8bc8225e7f69d52c0b2b4e73b9f57dc90c335aa
  BASE_ARTIFACT_ID: '8866950187'
  BASE_ZIP_SHA256: e961aeed386e7ca1709369b096f39794003d88ec7bb03f0e34b68af690ffd09f
  REPLAY_ARTIFACT_ID: '8867425854'
  REPLAY_ZIP_SHA256: 6dc7ac0c52fe28b1e46debf746c60dbffa408550c2b688c2607c2be24c84cec8

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout checksum-bound controller
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd01-permanent-materializer-base-v1
          path: controller
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout exact pinned main
        uses: actions/checkout@v4
        with:
          ref: dcc64cb395368070c8fa0ca3834afda26e2c0caf
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze exact refs and create two-parent integration
        run: |
          set -Eeuo pipefail
          test "$(git -C work rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git -C work ls-remote --heads origin "refs/heads/$RESEARCH_ARCHIVE_BRANCH" | awk '{print $1}')" = "$EXPECTED_RESEARCH"
          test "$(git -C work ls-remote --heads origin refs/heads/agent/ssc-rd01-permanent-materializer-base-v1 | awk '{print $1}')" = "$(git -C controller rev-parse HEAD)"
          git -C work fetch --no-tags origin "refs/heads/$RESEARCH_ARCHIVE_BRANCH"
          test "$(git -C work rev-parse FETCH_HEAD)" = "$EXPECTED_RESEARCH"
          git -C work cat-file -e "$EXPECTED_RESEARCH^{commit}"
          git -C work config user.name github-actions[bot]
          git -C work config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C work checkout -b rd01-permanent-materialization "$EXPECTED_MAIN"
          git -C work merge --no-ff --no-edit "$EXPECTED_RESEARCH"
          integration="$(git -C work rev-parse HEAD)"
          read -r commit first second extra < <(git -C work rev-list --parents -n 1 HEAD)
          test "$commit" = "$integration"
          test "$first" = "$EXPECTED_MAIN"
          test "$second" = "$EXPECTED_RESEARCH"
          test -z "${extra:-}"
          echo "INTEGRATION_COMMIT=$integration" >> "$GITHUB_ENV"
          echo "INTEGRATION_TREE=$(git -C work show -s --format=%T HEAD)" >> "$GITHUB_ENV"

      - name: Reconstruct exact permanent package from five fixed parts
        run: |
          set -Eeuo pipefail
          parts=(
            controller/.github/tmp/ssc-rd01-permanent-package-v1.part-00.b64
            controller/.github/tmp/ssc-rd01-permanent-package-v1.part-01.b64
            controller/.github/tmp/ssc-rd01-permanent-package-v1.part-02.b64
            controller/.github/tmp/ssc-rd01-permanent-package-v1.part-03.b64
            controller/.github/tmp/ssc-rd01-permanent-package-v1.part-04.b64
          )
          sizes=(4096 4096 4096 4096 1012)
          : > /tmp/rd01-permanent-package.b64
          for i in "${!parts[@]}"; do
            test -f "${parts[$i]}"
            test "$(wc -c < "${parts[$i]}" | tr -d ' ')" = "${sizes[$i]}"
            cat "${parts[$i]}" >> /tmp/rd01-permanent-package.b64
          done
          test "$(wc -c < /tmp/rd01-permanent-package.b64 | tr -d ' ')" = '17396'
          echo "$PACKAGE_B64_SHA256  /tmp/rd01-permanent-package.b64" | sha256sum --check --strict
          base64 --decode /tmp/rd01-permanent-package.b64 > /tmp/rd01-permanent-package.tar.gz
          echo "$PACKAGE_TGZ_SHA256  /tmp/rd01-permanent-package.tar.gz" | sha256sum --check --strict
          test "$(tar -tzf /tmp/rd01-permanent-package.tar.gz | wc -l | tr -d ' ')" = '6'
          tar -xzf /tmp/rd01-permanent-package.tar.gz -C work
          standing='work/.github/workflows/status-sovereignty-rd01-wave02-terminal-closure.yml'
          test -f "$standing"
          cp "$standing" /tmp/rd01-standing-workflow.yml
          test -s /tmp/rd01-standing-workflow.yml
          test -f work/docs/milestones/ssc-rd-wave02-rd01-legal-entity.md
          test -f work/schemas/status-sovereignty-rd-wave02-rd01-legal-entity.schema.json
          test -f work/test/status-sovereignty-rd-wave02-rd01-legal-entity.test.js
          test -f work/tools/build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          test -f work/tools/validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs

      - name: Recover three exact source artifacts into permanent custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          source_root='work/data/intake/status-sovereignty-rd-wave02-rd01-legal-entity/source-custody/legal-entity-protocol-v1'
          mkdir -p "$source_root"
          download() {
            id="$1"
            sha="$2"
            destination="$3"
            curl --fail --location --retry 4 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/BigBirdReturns/clifford-number/actions/artifacts/$id/zip" \
              --output "$destination"
            echo "$sha  $destination" | sha256sum --check --strict
          }
          download "$STAGE1_ARTIFACT_ID" "$STAGE1_ZIP_SHA256" "$source_root/stage1-candidate-census-v1.zip"
          download "$BASE_ARTIFACT_ID" "$BASE_ZIP_SHA256" "$source_root/terminal-census-v1.zip"
          download "$REPLAY_ARTIFACT_ID" "$REPLAY_ZIP_SHA256" "$source_root/failed-route-replay-v1.zip"

      - name: Build, validate, and commit exact nineteen-path Actions product
        run: |
          set -Eeuo pipefail
          cd work
          node tools/validate-no-magic-human-gate.mjs
          node tools/build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node test/status-sovereignty-rd-wave02-rd01-legal-entity.test.js
          node tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs --check
          node tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          node test/status-sovereignty-residual-denominator-wave-02-current.test.js
          test "$(jq -r '.combined_sha256' data/research/status-sovereignty-rd-wave02-rd01-legal-entity/manifest.json)" = "$PRODUCT_MANIFEST_SHA256"

          rm .github/workflows/status-sovereignty-rd01-wave02-terminal-closure.yml

          cat > /tmp/rd01-actions-paths.txt <<'PATHS'
          data/intake/status-sovereignty-rd-wave02-rd01-legal-entity/source-custody/legal-entity-protocol-v1/artifact-index.json
          data/intake/status-sovereignty-rd-wave02-rd01-legal-entity/source-custody/legal-entity-protocol-v1/failed-route-replay-v1.zip
          data/intake/status-sovereignty-rd-wave02-rd01-legal-entity/source-custody/legal-entity-protocol-v1/stage1-candidate-census-v1.zip
          data/intake/status-sovereignty-rd-wave02-rd01-legal-entity/source-custody/legal-entity-protocol-v1/terminal-census-v1.zip
          data/project/ssc-residual-wave02/closures/RD-01-C03.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/candidate-index.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/class-receipt.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/comparison.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/failed-route-universe.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/final-route-state-index.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/manifest.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/protocol.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/summary.json
          data/research/status-sovereignty-rd-wave02-rd01-legal-entity/terminal-classification.json
          docs/milestones/ssc-rd-wave02-rd01-legal-entity.md
          schemas/status-sovereignty-rd-wave02-rd01-legal-entity.schema.json
          test/status-sovereignty-rd-wave02-rd01-legal-entity.test.js
          tools/build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          tools/validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          PATHS
          sed -i 's/^          //' /tmp/rd01-actions-paths.txt
          test "$(wc -l < /tmp/rd01-actions-paths.txt | tr -d ' ')" = '19'
          while IFS= read -r path; do test -f "$path"; done < /tmp/rd01-actions-paths.txt

          git add --pathspec-from-file=/tmp/rd01-actions-paths.txt
          git diff --cached --name-only | sort > /tmp/rd01-staged-paths.txt
          sort /tmp/rd01-actions-paths.txt > /tmp/rd01-expected-paths.txt
          cmp /tmp/rd01-expected-paths.txt /tmp/rd01-staged-paths.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all | awk '$1=="??" {print substr($0,4)}' | grep -v -F -f /tmp/rd01-expected-paths.txt || true)"

          git commit -m 'Close RD-01 legal-entity resolution class product'
          product="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$INTEGRATION_COMMIT"
          git diff --name-only "$INTEGRATION_COMMIT" "$product" | sort > /tmp/rd01-product-paths.txt
          cmp /tmp/rd01-expected-paths.txt /tmp/rd01-product-paths.txt
          echo "PRODUCT_COMMIT=$product" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"

      - name: Run complete repository qualification and deterministic replay
        run: |
          set -Eeuo pipefail
          cd work
          npm run release:check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const allowed = [
            'build/axm-identity.json',
            'build/build-hop-report.json',
            'build/hop-graph.json',
            'build/migration-review.md',
            'build/migration-summary.json',
            'build/receipt-graph.json',
            'build/scores.json',
            'build/scout-report.json',
            'build/scout-report.md',
            'build/surface-graph.json'
          ].sort();
          const status = execFileSync('git', ['status','--porcelain=v1','--untracked-files=all'], { encoding: 'utf8' })
            .split('\n').filter(Boolean);
          const paths = status.map((line) => line.slice(3)).sort();
          if (paths.length && JSON.stringify(paths) !== JSON.stringify(allowed)) {
            throw new Error(`unexpected post-release paths: ${JSON.stringify(paths)}`);
          }
          console.log(`post-release bounded volatility: ${paths.length} allowed paths`);
          NODE
          git restore --staged --worktree .

          cp /tmp/rd01-standing-workflow.yml .github/workflows/status-sovereignty-rd01-wave02-terminal-closure.yml
          node tools/build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node tools/validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs
          node test/status-sovereignty-rd-wave02-rd01-legal-entity.test.js
          node tools/build-status-sovereignty-residual-denominator-wave-02-current.mjs --check
          node tools/validate-status-sovereignty-residual-denominator-wave-02-current.mjs
          node test/status-sovereignty-residual-denominator-wave-02-current.test.js
          node tools/validate-no-magic-human-gate.mjs
          test "$(jq -r '.combined_sha256' data/research/status-sovereignty-rd-wave02-rd01-legal-entity/manifest.json)" = "$PRODUCT_MANIFEST_SHA256"
          rm .github/workflows/status-sovereignty-rd01-wave02-terminal-closure.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          cp /tmp/rd01-standing-workflow.yml "$GITHUB_WORKSPACE/ssc-rd01-standing-workflow.yml"
          test -s "$GITHUB_WORKSPACE/ssc-rd01-standing-workflow.yml"

      - name: Upload exact standing workflow source
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-standing-workflow-source
          path: ssc-rd01-standing-workflow.yml
          if-no-files-found: error
          retention-days: 90

      - name: Push under exact target-base and research leases
        run: |
          set -Eeuo pipefail
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git -C work ls-remote --heads origin "refs/heads/$RESEARCH_ARCHIVE_BRANCH" | awk '{print $1}')" = "$EXPECTED_RESEARCH"
          git -C work push origin "$PRODUCT_COMMIT:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_MAIN"
          test "$(git -C work ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$PRODUCT_COMMIT"

      - name: Preserve exact nineteen-path materialization receipt
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'work';
          const receipt = JSON.parse(fs.readFileSync(`${root}/data/research/status-sovereignty-rd-wave02-rd01-legal-entity/class-receipt.json`, 'utf8'));
          const closure = JSON.parse(fs.readFileSync(`${root}/data/project/ssc-residual-wave02/closures/RD-01-C03.json`, 'utf8'));
          const materialization = {
            schema_version: 'ssc-rd01-wave02-split-permanent-materialization@1',
            pinned_main: process.env.EXPECTED_MAIN,
            research_parent: process.env.EXPECTED_RESEARCH,
            research_archive_branch: process.env.RESEARCH_ARCHIVE_BRANCH,
            integration_commit: process.env.INTEGRATION_COMMIT,
            integration_tree: process.env.INTEGRATION_TREE,
            actions_product_commit: process.env.PRODUCT_COMMIT,
            actions_product_tree: process.env.PRODUCT_TREE,
            target_branch: process.env.TARGET_BRANCH,
            total_permanent_increment_paths: 20,
            actions_product_paths: 19,
            connector_workflow_paths: 1,
            standing_workflow_path: '.github/workflows/status-sovereignty-rd01-wave02-terminal-closure.yml',
            standing_workflow_pending_connector: true,
            product_manifest_sha256: closure.product.manifest_combined_sha256,
            terminal_state: receipt.terminal_state,
            class_closed: receipt.class_closed,
            frozen_rows: receipt.counts.frozen_rows,
            terminal_rows: receipt.counts.terminal_rows,
            final_http_success_routes: receipt.counts.final_http_success_routes,
            legal_entities_resolved: receipt.counts.legal_entities_resolved,
            identity_ambiguous: receipt.counts.identity_ambiguous,
            identity_source_unavailable: receipt.counts.identity_source_unavailable,
            changed_rows_after_replay: receipt.counts.changed_rows_after_replay,
            focused_adversarial_mutations: 77,
            release_gate: 'pass',
            deterministic_replay: 'pass',
            target_base_lease: true,
            research_lease: true,
            outside_human_dependency: false,
            external_contacts: 0,
            external_reviews: 0,
            publication_effect: 'none',
            adoption_effect: 'none',
            graph_effect: 'none'
          };
          fs.writeFileSync('ssc-rd01-wave02-split-materialization.json', JSON.stringify(materialization, null, 2) + '\n');
          NODE
          cat ssc-rd01-wave02-split-materialization.json

      - name: Upload exact split-materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave02-split-materialization
          path: ssc-rd01-wave02-split-materialization.json
          if-no-files-found: error
          retention-days: 90
