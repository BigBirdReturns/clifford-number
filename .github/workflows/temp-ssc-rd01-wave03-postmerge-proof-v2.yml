name: TEMP prove canonical SSC RD-01 Wave-03 closure v2

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-postmerge-proof-v2.yml'
      - '.ssc-rd01-wave03-postmerge-proof-v2/TRIGGER'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove canonical merge, exact surface, and authority boundary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO="$GITHUB_REPOSITORY"
          PR=$(gh api "repos/$REPO/pulls/1022")
          test "$(jq -r .merged <<<"$PR")" = 'true'
          MERGE_SHA=$(jq -r .merge_commit_sha <<<"$PR")
          EXPECTED_HEAD=$(jq -r .head.sha <<<"$PR")
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          git fetch --no-tags origin "$MERGE_SHA" "$MAIN_SHA" "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$MERGE_SHA" "$MAIN_SHA"
          test "$(git rev-list --parents -n1 "$MERGE_SHA" | wc -w)" -eq 3
          FIRST_PARENT=$(git rev-parse "$MERGE_SHA^1")
          SECOND_PARENT=$(git rev-parse "$MERGE_SHA^2")
          test "$SECOND_PARENT" = "$EXPECTED_HEAD"
          git diff --name-status "$FIRST_PARENT..$MERGE_SHA" > /tmp/rd01-canonical-name-status.txt
          test "$(wc -l < /tmp/rd01-canonical-name-status.txt | tr -d ' ')" -eq 24
          test "$(awk '$1 != "A" {n++} END {print n+0}' /tmp/rd01-canonical-name-status.txt)" -eq 0
          if cut -f2- /tmp/rd01-canonical-name-status.txt | grep -E '(^|/)(transport|tmp)(/|$)|(^|/)\.ssc-|temp-|materializer|trigger'; then
            exit 1
          fi
          test -f .github/workflows/status-sovereignty-rd-wave03-rd01-methodology-correction-terminal.yml
          mapfile -t builds < <(find tools -maxdepth 1 -type f -name 'build-*rd-wave03-rd01-methodology-correction*terminal*.mjs' | sort)
          mapfile -t validators < <(find tools -maxdepth 1 -type f -name 'validate-*rd-wave03-rd01-methodology-correction*terminal*.mjs' | sort)
          mapfile -t tests < <(find test -maxdepth 1 -type f -name '*rd-wave03-rd01-methodology-correction*terminal*.test.js' | sort)
          test "${#builds[@]}" -ge 1
          test "${#validators[@]}" -ge 1
          test "${#tests[@]}" -ge 1
          for f in "${builds[@]}"; do node "$f" --check; done
          for f in "${validators[@]}"; do node "$f"; done
          for f in "${tests[@]}"; do node "$f"; done
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check
          git restore --worktree -- .
          git clean -fd
          for f in "${builds[@]}"; do node "$f" --check; done
          for f in "${validators[@]}"; do node "$f"; done
          for f in "${tests[@]}"; do node "$f"; done
          node tools/validate-no-magic-human-gate.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          ISSUE_STATE=$(gh api "repos/$REPO/issues/1014" --jq .state)
          test "$ISSUE_STATE" = 'closed'
          jq -n --arg merge "$MERGE_SHA" --arg main "$MAIN_SHA" --arg first "$FIRST_PARENT" --arg second "$SECOND_PARENT" '{status:"canonical_rd01_wave03_reproved",merge_sha:$merge,current_main:$main,first_parent:$first,second_parent:$second,permanent_paths:24,terminal_state:"bounded_source_unavailable",terminal_cells:24,observed_cells:16,source_unavailable_cells:8,external_contacts:0,external_reviews:0,outside_human_dependency:false,cumulative_promotion:"separate"}' > /tmp/rd01-wave03-postmerge-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-postmerge-proof-v2
          path: |
            /tmp/rd01-wave03-postmerge-proof.json
            /tmp/rd01-canonical-name-status.txt
          if-no-files-found: error
          retention-days: 90
