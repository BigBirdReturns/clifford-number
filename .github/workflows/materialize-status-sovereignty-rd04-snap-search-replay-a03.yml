name: Materialize SSC RD-04 SNAP search replay A03

on:
  push:
    branches:
      - 'agent/ssc-rd04-snap-search-replay-a03'
    paths:
      - '.github/workflows/materialize-status-sovereignty-rd04-snap-search-replay-a03.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  capture:
    name: capture-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '00-10', start: 0, end: 10 }
          - { label: '10-20', start: 10, end: 20 }
          - { label: '20-30', start: 20, end: 30 }
          - { label: '30-40', start: 30, end: 40 }
          - { label: '40-50', start: 40, end: 50 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore bounded acquisition script
        run: |
          base64 --decode data/transport/ssc-rd04-a03-acquire.py.gz.b64 | gunzip > /tmp/acquire.py
          python -m py_compile /tmp/acquire.py
      - name: Execute frozen state-query slice
        run: |
          python /tmp/acquire.py \
            --repo-root . \
            --output-root out \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }} \
            --delay 0.75
      - name: Preserve raw responses and terminal receipts
        uses: actions/upload-artifact@v4
        with:
          name: rd04-a03-${{ matrix.label }}
          path: out
          if-no-files-found: error
          retention-days: 30

  materialize:
    name: materialize-transport-free-product
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover all five acquisition artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rd04-a03-*
          path: collected
          merge-multiple: true
      - name: Restore retained acquisition and deterministic builder
        run: |
          base64 --decode data/transport/ssc-rd04-a03-acquire.py.gz.b64 | gunzip > tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py
          base64 --decode data/transport/ssc-rd04-a03-build.py.gz.b64 | gunzip > tools/build-status-sovereignty-rd04-snap-search-replay-a03.py
          chmod +x tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py tools/build-status-sovereignty-rd04-snap-search-replay-a03.py
          python -m py_compile tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py tools/build-status-sovereignty-rd04-snap-search-replay-a03.py
      - name: Install read-only exact-head workflow and retire transport
        run: |
          cat > .github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml <<'WORKFLOW'
          name: SSC RD-04 SNAP search replay A03

          on:
            push:
              branches:
                - 'agent/ssc-rd04-snap-search-replay-a03'
              paths:
                - '.github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml'
                - 'data/intake/status-sovereignty-rd04-snap-search-replay-a03/**'
                - 'data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json'
                - 'tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'tools/build-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
                - 'reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
            pull_request:
              paths:
                - '.github/workflows/status-sovereignty-rd04-snap-search-replay-a03.yml'
                - 'data/intake/status-sovereignty-rd04-snap-search-replay-a03/**'
                - 'data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json'
                - 'tools/acquire-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'tools/build-status-sovereignty-rd04-snap-search-replay-a03.py'
                - 'build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
                - 'reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03/**'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 120
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Validate 200 frozen query receipts and deterministic projections
                  run: python tools/build-status-sovereignty-rd04-snap-search-replay-a03.py --repo-root . --check
                - name: Run complete repository release gate
                  run: npm run release:check
                - name: Preserve exact A03 products
                  uses: actions/upload-artifact@v4
                  with:
                    name: ssc-rd04-snap-search-replay-a03
                    path: |
                      data/project/status-sovereignty-rd04-snap-search-replay-a03-release-manifest.json
                      build/core-thesis/status-sovereignty/rd04-snap-search-replay-a03
                      reports/core-thesis/status-sovereignty/rd04-snap-search-replay-a03
                    if-no-files-found: error
          WORKFLOW
          rm -f .github/workflows/materialize-status-sovereignty-rd04-snap-search-replay-a03.yml
          rm -f data/transport/ssc-rd04-a03-acquire.py.gz.b64 data/transport/ssc-rd04-a03-build.py.gz.b64
      - name: Build and validate exact A03 replay product
        run: |
          python tools/build-status-sovereignty-rd04-snap-search-replay-a03.py \
            --repo-root . \
            --materialize \
            --collected collected
          python tools/build-status-sovereignty-rd04-snap-search-replay-a03.py --repo-root . --check
          npm run release:check
          git diff --check
      - name: Publish only the transport-free exact product
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize SSC RD-04 A03 frozen search replay"
          git push origin "HEAD:${BRANCH}"
