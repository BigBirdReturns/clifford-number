name: TEMP execute RD-04 North Dakota FY 2026 quarter status PDFs v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-execute-ssc-rd04-nd-current-waiver-fy26-quarter-status-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CARRIER_PARENT: a592acea22c69a979f2a90c24a2bafb8c9445759
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  PROTOCOL_ARTIFACT_ID: '9030737206'
  PROTOCOL_ARTIFACT_BYTES: '22143'
  PROTOCOL_ARTIFACT_SHA256: 9a2bef93d96ee9e0912d51452af4d3cb4f83b786b5f0aa2257127e7cca2646e3
  REPAIR_RECEIPT_SHA256: 5e3deadcdd471bf8378fc7cb095dd73047490d5d4172e883bab88bbb2dc215f4
  SEMANTIC_RECEIPT_SHA256: 7744338500a3c7e08909471fe8d8fdedf1bd27ccc11bb41b9618965eacbee433
  FIELD_ADJUDICATION_SHA256: b7810cf3fa6c08d30d361ee9eee6f7c7b682363f745377a1c628589e94f9d46e
  PROTOCOL_SHA256: b4844c1f3e01fd30f8c55b5f8430d2e1b2fa113e8dca99de5a21a677f88a3f95
  PROGRAM_B64_BYTES: '6768'
  PROGRAM_B64_SHA256: 174ace1e2d229ffc2169efb40cb8d7828df90bb72b14af68ef2db584d9b70a46
  PROGRAM_XZ_BYTES: '5032'
  PROGRAM_XZ_SHA256: 6e32d9210cffb973153ddb9dc8bf34fd5a284bf7995cd67fe853c096d3e84185
  PROGRAM_BYTES: '20910'
  PROGRAM_SHA256: e26b586a6ab66b6d79af563344d7663e2edb777dab02de51cd589eece6a4ebda
  TARGET_BRANCH: agent/ssc-rd04-nd-current-waiver-fy26-quarter-status-transport-v1
  WORKFLOW_PATH: .github/workflows/temp-execute-ssc-rd04-nd-current-waiver-fy26-quarter-status-v1.yml
  OUTPUT_DIR: /tmp/ssc-rd04-nd-current-waiver-fy26-quarter-status-transport-v1

concurrency:
  group: temp-execute-rd04-nd-current-waiver-fy26-quarter-status-v1
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-current-waiver-fy26-quarter-status-transport-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute exact three-PDF transport
        id: execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          PROTOCOL="$OUT/protocol"
          PROGRAM="$OUT/transport-program.py"
          rm -rf "$OUT"
          mkdir -p "$OUT" "$PROTOCOL"
          stage=bootstrap
          exec > >(tee "$OUT/transport.log") 2>&1

          finalize() {
            rc=$?
            trap - EXIT
            set +e
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            if [ ! -f "$OUT/execution-receipt.json" ]; then
              jq -n \
                --arg stage "$stage" \
                --argjson rc "$rc" \
                --arg artifact "$PROTOCOL_ARTIFACT_ID" \
                '{
                  schema_version:"ssc-rd04-nd-current-waiver-fy26-quarter-status-three-route-transport@1",
                  state:"failed_closed",failed_or_final_stage:$stage,exit_code:$rc,
                  protocol_artifact_id:($artifact|tonumber),fixed_routes:3,
                  initiated_route_attempts:0,terminal_routes:0,physical_requests:0,
                  source_admissions:0,field_classifications:0,field_terminalizations:0,
                  matrix_updates:0,row_state_mutations:0,class_closed:false,
                  cumulative_ledger_effect:"none",outside_human_dependency:false,
                  publication_effect:"none",adoption_effect:"none",graph_effect:"none",
                  additional_execution_authorized:false
                }' > "$OUT/execution-receipt.json"
            fi
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          stage=bind_exact_carrier_and_unchanged_live_matrix
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REF" = "$TARGET_BRANCH"
          test "$HEAD_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git rev-list --count "$CARRIER_PARENT"..HEAD)" -eq 1
          test "$(git diff --name-only "$CARRIER_PARENT" HEAD)" = "$WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$CARRIER_PARENT" HEAD)" = "$WORKFLOW_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CARRIER_PARENT" HEAD)"
          git diff --check "$CARRIER_PARENT" HEAD
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$CARRIER_PARENT" origin/main
          LIVE_MAIN="$(git rev-parse origin/main)"
          LIVE_TREE="$(git rev-parse 'origin/main^{tree}')"
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$MATRIX_BLOB"
          export CANONICAL_PARENT="$LIVE_MAIN"
          export CANONICAL_TREE="$LIVE_TREE"
          printf '%s\n' "$LIVE_MAIN" > "$OUT/live-main.txt"
          printf '%s\n' "$LIVE_TREE" > "$OUT/live-main-tree.txt"

          stage=authenticate_exact_three_route_protocol
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROTOCOL_ARTIFACT_ID" \
            > "$OUT/protocol-artifact.json"
          jq -e \
            --argjson id "$PROTOCOL_ARTIFACT_ID" \
            --argjson bytes "$PROTOCOL_ARTIFACT_BYTES" \
            --arg digest "sha256:$PROTOCOL_ARTIFACT_SHA256" \
            '.id==$id and .expired==false and .size_in_bytes==$bytes and .digest==$digest' \
            "$OUT/protocol-artifact.json" > /dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROTOCOL_ARTIFACT_ID/zip" \
            > "$OUT/protocol.zip"
          test "$(stat -c %s "$OUT/protocol.zip")" -eq "$PROTOCOL_ARTIFACT_BYTES"
          test "$(sha256sum "$OUT/protocol.zip" | awk '{print $1}')" = "$PROTOCOL_ARTIFACT_SHA256"
          unzip -t "$OUT/protocol.zip" > "$OUT/protocol-zip-test.txt"
          unzip -q "$OUT/protocol.zip" -d "$PROTOCOL"
          (cd "$PROTOCOL" && sha256sum -c SHA256SUMS)
          test "$(cat "$PROTOCOL/STAGE")" = complete
          test "$(cat "$PROTOCOL/EXIT_CODE")" = 0
          test "$(sha256sum "$PROTOCOL/repair-receipt.json" | awk '{print $1}')" = "$REPAIR_RECEIPT_SHA256"
          test "$(sha256sum "$PROTOCOL/result/receipt.json" | awk '{print $1}')" = "$SEMANTIC_RECEIPT_SHA256"
          test "$(sha256sum "$PROTOCOL/result/field-adjudication.json" | awk '{print $1}')" = "$FIELD_ADJUDICATION_SHA256"
          test "$(sha256sum "$PROTOCOL/result/selected-followup-protocol.json" | awk '{print $1}')" = "$PROTOCOL_SHA256"
          jq -e '
            .state=="complete" and .source_admissions==3 and .source_rejections==1 and
            .promotion_candidates==0 and .held_open_fields==1 and .selected_followup_routes==3 and
            .source_requests==0 and .route_executions==0 and .field_terminalizations==0 and
            .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false and
            .next_authorized_operation=="execute exactly the three FY 2026 quarter status PDF routes once; do not rerun the four FNA page routes"
          ' "$PROTOCOL/repair-receipt.json" > /dev/null
          jq -e '
            .promotion_candidate==false and
            .disposition=="current_federal_status_index_and_exact_fy26_quarter_documents_located_but_state_documents_uncaptured_hold_open" and
            .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false
          ' "$PROTOCOL/result/field-adjudication.json" > /dev/null
          cp "$PROTOCOL/result/selected-followup-protocol.json" "$OUT/selected-followup-protocol.json"

          stage=reconstruct_exact_transport_program
          cat > "$OUT/transport-program.py.xz.b64" <<'B64'
          /Td6WFoAAATm1rRGBMDoJq6jASEBHAAAAAAAAHTWXnzgUa0TYF0AMxyKIm+qRDZEplCCiBA/HcteNA9ZSlkioc1ma7kETnOlALiQUUY0QFqE5cpPvqzX7lv1
