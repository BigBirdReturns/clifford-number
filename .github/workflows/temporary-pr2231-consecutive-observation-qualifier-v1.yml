name: Temporary PR 2231 consecutive observation qualifier v1
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-consecutive-observation-qualifier-v1.yml'
permissions:
  contents: read
concurrency:
  group: pr2231-consecutive-observation-qualifier-v1
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONTROLLER_BRANCH: agent/pr2231-consecutive-observation-qualifier-v1
      CONTROLLER_BASE: 8bcba99c90c5356b32fe2f0dcecc7ce7bc301b35
      EXPECTED_MAIN: e3877ad68e860c0b62632230f499544eadd44bb8
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      EXPECTED_PRODUCT_HEAD: 20805a634d9cd4ef2e0091506a614593b105dc1c
      EXPECTED_PRODUCT_PARENT: 482db6e3ff25fa6d085a59f8677d9a0b33c5804b
      EXPECTED_PRODUCT_LIB: d825c94f2dfe5ef2bd64d483a2feb9dfa0a5c645
      EXPECTED_PRODUCT_TEST: 34ae708c4934834334839552d7603e48e3db4ea4
      EXPECTED_MAIN_LIB: 5f68254d3e44de693e83503aed879160f9b7b997
      EXPECTED_MAIN_TEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify exact two-file successor
        shell: bash
        run: bash .github/pr2231/consecutive-observation-qualify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-consecutive-observation-qualified-v1
          path: /tmp/pr2231-consecutive-observation-qualified-v1
          if-no-files-found: warn
          retention-days: 90
