name: One-shot POOF ecology materializer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/poof-ecology-materialize.yml'
      - '.bootstrap/poof-clifford-ecology/part-07.b64'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/poof-clifford-ecology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Decode and verify source patch
        run: |
          test "$(find .bootstrap/poof-clifford-ecology -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 7
          for f in .bootstrap/poof-clifford-ecology/part-*.b64; do
            printf '%s  ' "$f"
            tr -d '\n\r' < "$f" | sha256sum | cut -d' ' -f1
          done
          test "$(tr -d '\n\r' < .bootstrap/poof-clifford-ecology/part-01.b64 | sha256sum | cut -d' ' -f1)" = '227cfcf10ffdce78dff76affc4ba6bbbdcc4cb310ad0b395b570672de32ea42b'
          test "$(tr -d '\n\r' < .bootstrap/poof-clifford-ecology/part-02.b64 | sha256sum | cut -d' ' -f1)" = '706092cde4f35e1d49e0e68e3d96afd37bbe069831e0113411ae10f89a0a483a'
          test "$(tr -d '\n\r' < .bootstrap/poof-clifford-ecology/part-03.b64 | sha256sum | cut -d' ' -f1)" = '176a8f9e1d6cead610243b2b5305d6929199205f55bb3701806eee048b69f373'
          test "$(tr -d '\n\r' < .bootstrap/poof-clifford-ecology/part-04.b64 | sha256sum | cut -d' ' -f1)" = 'f0516e799839797a0ac76caa4792017c1fe7817fd651e907c94862d64fef5f96'
          test "$(tr -d '\n\r' < .bootstrap/poof-clifford-ecology/part-05.b64 | sha256sum | cut -d' ' -f1)" = 'c154c44e6c2f7230ab144f1a67ad1e6ea7e726d8b61f40b1dc955ae26ade6363'
          test "$(tr -d '\n\r' < .bootstrap/poof-clifford-ecology/part-06.b64 | sha256sum | cut -d' ' -f1)" = 'bb077d72738a87831977ad9fd89031ab7e9e3f7f6c9c11fe7004ed610fb5f44f'
          test "$(tr -d '\n\r' < .bootstrap/poof-clifford-ecology/part-07.b64 | sha256sum | cut -d' ' -f1)" = '43fbbf514306866a44ed1af0237bbb78bcf30fc181debcb98bd972e297da50a6'
          cat .bootstrap/poof-clifford-ecology/part-*.b64 \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/poof-clifford-ecology.patch
          echo '34744d87daf8f884710d12024e76592d0f094664c14deaff297c83538148bf2c  /tmp/poof-clifford-ecology.patch' | sha256sum --check
          git apply --check /tmp/poof-clifford-ecology.patch
      - name: Materialize source and deterministic products
        run: |
          git apply /tmp/poof-clifford-ecology.patch
          node tools/build-core-thesis.mjs
          node tools/build-m05-answerable-power.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/build-poof-clifford-ecology.mjs
          npm run ci:poof-ecology
          git diff --check
      - name: Remove bootstrap transport and publish branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .bootstrap/poof-clifford-ecology
          rm -f .github/workflows/poof-ecology-bootstrap-export.yml
          rm -f .github/workflows/poof-ecology-materialize.yml
          git add -A
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.invalid'
          git commit -m 'Build POOF and Clifford constitutional ecology'
          git push origin HEAD:agent/poof-clifford-ecology
