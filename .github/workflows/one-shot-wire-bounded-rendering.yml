name: One-shot wire bounded rendering

on:
  push:
    branches:
      - agent/aperture-bounded-rendering

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aperture-bounded-rendering
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add permanent bounded-rendering gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          package = json.loads(path.read_text(encoding='utf-8'))
          additions = [
              'node test/visual-aperture-windowing.test.js',
              'node test/visual-aperture-bounded-contract.test.js',
          ]
          tests = package['scripts']['test']
          for command in additions:
              if command not in tests:
                  tests = f'{tests} && {command}'
          package['scripts']['test'] = tests
          package['scripts']['validate:pages'] = 'node tools/validate-pages.mjs && node tools/validate-aperture-bounded-pages.mjs'
          path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY
          node test/visual-aperture-windowing.test.js
          node test/visual-aperture-bounded-contract.test.js
          npm run release:check
      - name: Commit the verified gate
        run: |
          rm .github/workflows/one-shot-wire-bounded-rendering.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json .github/workflows/one-shot-wire-bounded-rendering.yml
          git commit -m "Run bounded rendering in the ordinary release gate"
          git push origin HEAD:agent/aperture-bounded-rendering
