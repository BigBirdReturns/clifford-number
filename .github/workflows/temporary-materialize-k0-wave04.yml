name: Temporary materialize K0 role-neutral Wave 04

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave04.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-04
    paths:
      - '.github/workflows/temporary-materialize-k0-wave04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand exact Wave 04 materializer
        run: |
          cat .github/tmp/k0-wave04-materializer-part-*.b64 | base64 -d > /tmp/k0-wave04-materializer.tgz
          test "$(sha256sum /tmp/k0-wave04-materializer.tgz | awk '{print $1}')" = "b7c8e21029194ff9afee6e6d4ee5d0320d1f5668c936326fa04d2b8eaaface5c"
          rm -rf /tmp/k0-wave04-materializer
          mkdir -p /tmp/k0-wave04-materializer
          tar -xzf /tmp/k0-wave04-materializer.tgz -C /tmp/k0-wave04-materializer

      - name: Materialize and validate Wave 04
        run: |
          node /tmp/k0-wave04-materializer/materialize-k0-role-neutral-wave-04.mjs
          node tools/build-k0-role-neutral-wave-04.mjs
          node tools/validate-k0-role-neutral-wave-04.mjs
          node test/k0-role-neutral-wave-04.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          node /tmp/k0-wave04-materializer/materialize-k0-role-neutral-wave-04.mjs
          node tools/build-k0-role-neutral-wave-04.mjs
          node tools/validate-k0-role-neutral-wave-04.mjs
          node test/k0-role-neutral-wave-04.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Enforce permanent path denominator
        run: |
          python - <<'PYDENOM'
          import subprocess
          expected = {
              '.github/workflows/k0-role-neutral-wave-04.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/project/k0-role-neutral-wave-04-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-04.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-04.md',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-04.html',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-04.json',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-04.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/build-k0-role-neutral-wave-04.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-04.mjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM

      - name: Create exact blobs and export transaction receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBLOBS'
          import base64, json, os, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          paths = [
              '.github/workflows/k0-role-neutral-wave-04.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/project/k0-role-neutral-wave-04-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-04.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-04.md',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-04.html',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-04.json',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-04.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/build-k0-role-neutral-wave-04.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-04.mjs',
          ]
          def post(path, payload):
              req = urllib.request.Request(api + path, data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'k0-role-neutral-wave-04',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          rows = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = post(f'/repos/{repo}/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              index_row = subprocess.check_output(['git','ls-files','-s','--',path], text=True).strip()
              mode = index_row.split()[0] if index_row else '100644'
              rows.append({'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': mode})
          receipt = {
              'schema_version': 'k0-role-neutral-wave-04-transaction@1',
              'repository': repo,
              'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'updates': rows,
              'deletions': [
                  '.github/tmp/k0-wave04-materializer-part-00.b64',
                  '.github/tmp/k0-wave04-materializer-part-01.b64',
                  '.github/tmp/k0-wave04-materializer-part-02.b64',
                  '.github/tmp/k0-wave04-materializer-part-03.b64',
                  '.github/workflows/temporary-materialize-k0-wave04.yml',
              ],
              'materializer_sha256': 'b7c8e21029194ff9afee6e6d4ee5d0320d1f5668c936326fa04d2b8eaaface5c',
              'query_templates_executed': 5,
              'retained_records': 32,
              'included_events': 0,
              'publication_cleared': False,
              'graph_effect': 'none',
              'ref_updated': False,
          }
          os.makedirs('/tmp/k0-wave04-export', exist_ok=True)
          with open('/tmp/k0-wave04-export/BLOB_RECEIPTS.json', 'w') as handle:
              json.dump(receipt, handle, indent=2); handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PYBLOBS

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-role-neutral-wave-04-validated-transaction
          path: /tmp/k0-wave04-export/BLOB_RECEIPTS.json
          if-no-files-found: error
          retention-days: 30
