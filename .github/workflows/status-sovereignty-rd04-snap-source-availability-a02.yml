name: SSC RD-04 SNAP source-availability acquisition 02

on:
  push:
    branches:
      - 'agent/ssc-rd04-snap-state-source-availability-a02'
    paths:
      - '.github/workflows/status-sovereignty-rd04-snap-source-availability-a02.yml'
      - 'data/intake/status-sovereignty-rd04-snap-source-availability-a02/**'
      - 'data/project/status-sovereignty-rd04-snap-source-availability-a02-release-manifest.json'
      - 'schemas/status-sovereignty-rd04-snap-source-availability-a02-*.schema.json'
      - 'docs/milestones/ssc-rd04-snap-source-availability-a02.md'
      - 'tools/lib/status-sovereignty-rd04-snap-source-availability-a02-*.mjs'
      - 'tools/build-status-sovereignty-rd04-snap-source-availability-a02.mjs'
      - 'tools/validate-status-sovereignty-rd04-snap-source-availability-a02.mjs'
      - 'test/status-sovereignty-rd04-snap-source-availability-a02.test.js'
      - 'build/core-thesis/status-sovereignty/rd04-snap-source-availability-a02/**'
      - 'reports/core-thesis/status-sovereignty/rd04-snap-source-availability-a02/**'
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd04-snap-source-availability-a02.yml'
      - 'data/intake/status-sovereignty-rd04-snap-source-availability-a02/**'
      - 'data/project/status-sovereignty-rd04-snap-source-availability-a02-release-manifest.json'
      - 'schemas/status-sovereignty-rd04-snap-source-availability-a02-*.schema.json'
      - 'docs/milestones/ssc-rd04-snap-source-availability-a02.md'
      - 'tools/lib/status-sovereignty-rd04-snap-source-availability-a02-*.mjs'
      - 'tools/build-status-sovereignty-rd04-snap-source-availability-a02.mjs'
      - 'tools/validate-status-sovereignty-rd04-snap-source-availability-a02.mjs'
      - 'test/status-sovereignty-rd04-snap-source-availability-a02.test.js'
      - 'build/core-thesis/status-sovereignty/rd04-snap-source-availability-a02/**'
      - 'reports/core-thesis/status-sovereignty/rd04-snap-source-availability-a02/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build deterministic provisional fifty-state catalogue score
        run: node tools/build-status-sovereignty-rd04-snap-source-availability-a02.mjs
      - name: Refuse generated drift
        run: |
          git diff --exit-code -- \
            data/project/status-sovereignty-rd04-snap-source-availability-a02-release-manifest.json \
            build/core-thesis/status-sovereignty/rd04-snap-source-availability-a02 \
            reports/core-thesis/status-sovereignty/rd04-snap-source-availability-a02
      - name: Validate source catalogue, provisional score, search custody, and authority
        run: node tools/validate-status-sovereignty-rd04-snap-source-availability-a02.mjs
      - name: Exercise positive and adversarial fixtures
        run: node test/status-sovereignty-rd04-snap-source-availability-a02.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Preserve exact acquisition outputs
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-snap-source-availability-a02
          path: |
            data/project/status-sovereignty-rd04-snap-source-availability-a02-release-manifest.json
            build/core-thesis/status-sovereignty/rd04-snap-source-availability-a02
            reports/core-thesis/status-sovereignty/rd04-snap-source-availability-a02
          if-no-files-found: error
