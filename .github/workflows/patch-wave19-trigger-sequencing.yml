name: Patch Wave 19 trigger sequencing

on:
  push:
    branches:
      - agent/lake-generator-contracts-wave-19
    paths:
      - '.github/tmp/patch-wave19-trigger-sequencing-trigger.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Stage the materialization trigger deletion before the canonical gate
        shell: bash
        run: |
          set -euo pipefail
          original_sha=$(git rev-parse HEAD)
          python - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/lake-generator-contracts-wave-19.yml')
          text = workflow.read_text()
          old = """          npm run release:check
          git reset --hard HEAD
          git clean -fd
"""
          new = """          rm -f .github/tmp/lake-generator-contracts-wave-19-trigger.json
          git add -A .github/tmp/lake-generator-contracts-wave-19-trigger.json
          npm run release:check
          git restore --worktree .
          git clean -fd
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one Wave 19 baseline block, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1))

          trigger_path = Path('.github/tmp/lake-generator-contracts-wave-19-trigger.json')
          trigger = json.loads(trigger_path.read_text())
          trigger['attempt'] = int(trigger.get('attempt', 0)) + 1
          trigger['purpose'] = (
              'Execute the final Wave 19 sealed-maintenance rebuild after staging trigger deletion '
              'before the canonical release gate. Reconcile permanent workflow and package changes, '
              'preserve 18 contracts, 411 closures, 1907 registered variants, and create no identity, '
              'truth, publication, relationship, participation, graph, hop, or human-permission effect.'
          )
          trigger_path.write_text(json.dumps(trigger, indent=2) + '\n')
          PY
          rm -f .github/tmp/patch-wave19-trigger-sequencing-trigger.json
          rm -f .github/workflows/patch-wave19-trigger-sequencing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check
          git commit -m 'Stage Wave 19 trigger deletion before release gate'
          git fetch origin agent/lake-generator-contracts-wave-19
          test "$(git rev-parse origin/agent/lake-generator-contracts-wave-19)" = "$original_sha"
          git push origin HEAD:agent/lake-generator-contracts-wave-19
