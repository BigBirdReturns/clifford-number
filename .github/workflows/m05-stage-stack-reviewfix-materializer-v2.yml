name: M-05 stage-stack review-fix materializer v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.tmp/m05-stage-stack-reviewfix-v2/**'
      - '.github/workflows/m05-stage-stack-reviewfix-materializer-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-stage-stack-reviewfix-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, qualify, and publish the exact two-file successor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_BRANCH: agent/m05-s03-l7-stage-stack-postmerge-repair-v1
          PRODUCT_HEAD: 17d3d0eb865adda1b0d84ec9fbd83dcb82074317
          ARCHIVE_SHA256: 18a470b160ee301e14413edd41f596fb5c9624a8601c5054fe51456ef4edcb38
          VALIDATOR_BLOB: c29a806f15d05413499d07ff6dd186dfc542b150
          TEST_BLOB: 499272ec9f42f4fe6fd2d8d129d573bd2069dac7
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/reviewfix.b64"
          archive="$RUNNER_TEMP/reviewfix.tar.xz"
          extract="$RUNNER_TEMP/reviewfix"
          work="$RUNNER_TEMP/product"
          cat .tmp/m05-stage-stack-reviewfix-v2/payload.part-* > "$payload"
          base64 --decode "$payload" > "$archive"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$extract"
          mapfile -t actual < <(tar -tJf "$archive" | sed 's#^\./##' | grep -v '/$' | sort)
          mapfile -t expected < <(printf '%s\n' \
            'test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js' \
            'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs' | sort)
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          tar -xJf "$archive" -C "$extract" --no-same-owner --no-same-permissions
          test "$(git hash-object "$extract/tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs")" = "$VALIDATOR_BLOB"
          test "$(git hash-object "$extract/test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js")" = "$TEST_BLOB"

          remote_head="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)"
          test "$remote_head" = "$PRODUCT_HEAD"
          git fetch --no-tags origin "refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/m05-product"
          test "$(git rev-parse refs/remotes/origin/m05-product)" = "$PRODUCT_HEAD"
          git worktree add --detach "$work" "$PRODUCT_HEAD"
          for rel in "${expected[@]}"; do
            cp "$extract/$rel" "$work/$rel"
          done
          cd "$work"

          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-provenance-object-custody.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-provenance-object-custody.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-connection-authentication-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-connection-authentication-custody-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-observation-time-custody-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-temporal-reconciliation-admission-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-temporal-reconciliation-admission-amendment.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js
          npm run release:check
          git diff --check

          git add -- \
            tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs \
            test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "$(printf '%s\n' "${staged[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          test "$(git hash-object tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.mjs)" = "$VALIDATOR_BLOB"
          test "$(git hash-object test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-amendment.test.js)" = "$TEST_BLOB"
          git config user.name 'BigBirdReturns'
          git config user.email 'bigbirdreturns@proton.me'
          git commit -m '[M-05 S03-L7] Close stage-stack positive-path review seams'
          new_head="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_HEAD"

          remote_head="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | cut -f1)"
          test "$remote_head" = "$PRODUCT_HEAD"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          printf 'published_head=%s\npublished_tree=%s\n' "$new_head" "$new_tree"
