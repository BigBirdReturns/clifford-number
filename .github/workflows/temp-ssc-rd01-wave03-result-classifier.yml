name: TEMP classify SSC RD-01 Wave-03 verification result

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-result-classifier.yml'
      - '.github/tmp/classify-rd01-wave03-verification.sh'
      - '.ssc-rd01-wave03-result-classifier/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/tmp/classify-rd01-wave03-verification.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-result-classifier
          path: /tmp/ssc-rd01-wave03-result-classifier-receipt
          if-no-files-found: error
          retention-days: 90
