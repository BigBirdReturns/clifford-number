name: Project stable-ground supersession 03 · historical

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg03*.json'
      - 'reports/core-thesis/stable-ground/sg03/**'
      - 'tools/validate-project-stable-ground-sg03.mjs'
      - 'test/project-stable-ground-sg03.test.js'
      - '.github/workflows/project-stable-ground-sg03.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg03*.json'
      - 'reports/core-thesis/stable-ground/sg03/**'
      - 'tools/validate-project-stable-ground-sg03.mjs'
      - 'test/project-stable-ground-sg03.test.js'
      - '.github/workflows/project-stable-ground-sg03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate immutable SG-03 record and supersession custody
        run: |
          node tools/validate-project-stable-ground-sg03.mjs
          node test/project-stable-ground-sg03.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore verified timestamp-only compiler products
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          volatile = [
              'build/axm-identity.json',
              'build/build-hop-report.json',
              'build/hop-graph.json',
              'build/migration-review.md',
              'build/migration-summary.json',
              'build/receipt-graph.json',
              'build/scores.json',
              'build/scout-report.json',
              'build/scout-report.md',
              'build/surface-graph.json',
          ]
          changed_paths = subprocess.run(
              ['git', 'diff', '--name-only'],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          unexpected_paths = sorted(set(changed_paths) - set(volatile))
          if unexpected_paths:
              raise RuntimeError(f'unexpected repository mutation after release gate: {unexpected_paths}')
          for path in changed_paths:
              diff = subprocess.run(
                  ['git', 'diff', '--unified=0', '--', path],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              changed_lines = [
                  line[1:].strip()
                  for line in diff.splitlines()
                  if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))
              ]
              if len(changed_lines) != 2 or not all(
                  line.startswith('"generated": "') or line.startswith('Generated: ')
                  for line in changed_lines
              ):
                  raise RuntimeError(f'unexpected compiler mutation in {path}: {changed_lines}')
          PY
          git restore -- \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/migration-review.md \
            build/migration-summary.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/scout-report.md \
            build/surface-graph.json
      - name: Refuse historical-check mutation
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
