name: Project stable-ground supersession 03 · historical

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg03*.json'
      - 'reports/core-thesis/stable-ground/sg03/**'
      - 'tools/validate-project-stable-ground-sg03.mjs'
      - 'test/project-stable-ground-sg03.test.js'
      - '.github/workflows/project-stable-ground-sg03.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg03*.json'
      - 'reports/core-thesis/stable-ground/sg03/**'
      - 'tools/validate-project-stable-ground-sg03.mjs'
      - 'test/project-stable-ground-sg03.test.js'
      - '.github/workflows/project-stable-ground-sg03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate immutable SG-03 record and supersession custody
        run: |
          node tools/validate-project-stable-ground-sg03.mjs
          node test/project-stable-ground-sg03.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Refuse historical-check mutation
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
