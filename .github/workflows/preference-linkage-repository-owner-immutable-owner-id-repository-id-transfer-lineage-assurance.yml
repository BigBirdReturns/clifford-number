name: Preference linkage immutable owner and repository IDs, transfer event, and current lineage assurance

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.fixture.json'
      - 'tools/lib/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.mjs'
      - 'tools/compile-preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.mjs'
      - 'tools/validate-preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.mjs'
      - 'test/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.test.js'
      - 'docs/preference-custody-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.md'
      - '.github/workflows/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc57:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Compile, validate, and test PC-57
        run: |
          node tools/compile-preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.mjs
          node tools/validate-preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.mjs
          node test/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance
          path: |
            build/research/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.json
            build/research/preference-linkage-repository-owner-immutable-owner-id-repository-id-transfer-lineage-assurance.md
          if-no-files-found: error
