name: Counter-Selector Wave 22 external execution

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-22.yml'
      - 'data/project/counter-selector-wave-22-*.json'
      - 'schemas/counter-selector-external-gate-execution.schema.json'
      - 'docs/methods/counter-selector-external-gate-execution.md'
      - 'docs/milestones/counter-selector-wave-22.md'
      - 'tools/build-counter-selector-wave-22.mjs'
      - 'tools/validate-counter-selector-wave-22.mjs'
      - 'test/counter-selector-wave-22.test.js'
      - 'reports/core-thesis/counter-selector-wave-22/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-22-external-execution'
    paths:
      - '.github/workflows/counter-selector-wave-22.yml'
      - 'data/project/counter-selector-wave-22-*.json'
      - 'schemas/counter-selector-external-gate-execution.schema.json'
      - 'docs/methods/counter-selector-external-gate-execution.md'
      - 'docs/milestones/counter-selector-wave-22.md'
      - 'tools/build-counter-selector-wave-22.mjs'
      - 'tools/validate-counter-selector-wave-22.mjs'
      - 'test/counter-selector-wave-22.test.js'
      - 'reports/core-thesis/counter-selector-wave-22/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 22 products
        run: node tools/build-counter-selector-wave-22.mjs
      - name: Validate external-execution contract
        run: node tools/validate-counter-selector-wave-22.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-22.test.js
      - name: Require exact committed Wave 22 products
        run: |
          git diff --exit-code --             data/project/counter-selector-wave-22-request-receipt-registry.json             data/project/counter-selector-wave-22-release-manifest.json             reports/core-thesis/counter-selector-wave-22/data.json             reports/core-thesis/counter-selector-wave-22/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 22 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-22.mjs
          node tools/validate-counter-selector-wave-22.mjs
          node test/counter-selector-wave-22.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
