name: Evidence-grounded judgment authority

on:
  push:
    branches:
      - agent/evidence-grounded-judgment-authority
    paths:
      - '.github/tmp/evidence-grounded-judgment-trigger.json'
  pull_request:
    branches:
      - main
    paths:
      - 'BUILD-INSTRUCTIONS.md'
      - 'package.json'
      - 'data/project/evidence-grounded-judgment-authority.json'
      - 'data/project/lake-judgment-shadow-snapshot.json'
      - 'data/project/human-permission-gate-audit-policy.json'
      - 'docs/methods/evidence-grounded-judgment-authority.md'
      - 'tools/build-evidence-grounded-judgments.mjs'
      - 'tools/augment-evidence-grounded-judgments-with-lake.mjs'
      - 'tools/validate-evidence-grounded-judgments.mjs'
      - 'tools/validate-evidence-grounded-lake-judgments.mjs'
      - 'tools/build-human-permission-gate-audit.mjs'
      - 'tools/validate-human-permission-gate-audit.mjs'
      - 'test/evidence-grounded-judgments.test.js'
      - 'test/human-permission-gate-audit.test.js'
      - 'tools/compile.mjs'
      - '.github/workflows/evidence-grounded-judgment-authority.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: evidence-grounded-judgment-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  judgment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Determine validation and materialization mode
        id: mode
        shell: bash
        run: |
          if test -f .github/tmp/evidence-grounded-judgment-trigger.json; then
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'materialize=true' >> "$GITHUB_OUTPUT"
          elif test "$GITHUB_EVENT_NAME" = 'pull_request' || test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'; then
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
          else
            echo 'validate=false' >> "$GITHUB_OUTPUT"
            echo 'materialize=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.validate == 'true'
        with:
          node-version: '24'
      - name: Apply an optional checked source migration
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/tmp/apply-judgment-source-migration.mjs; then
            node .github/tmp/apply-judgment-source-migration.mjs
          fi
      - name: Run the complete repository release gate
        if: steps.mode.outputs.validate == 'true'
        run: npm run release:check
      - name: Restore committed bytes before focused pull-request validation
        if: steps.mode.outputs.validate == 'true' && steps.mode.outputs.materialize != 'true'
        run: git restore --staged --worktree .
      - name: Build and validate evidence-grounded judgments
        if: steps.mode.outputs.validate == 'true'
        run: |
          node tools/build-evidence-grounded-judgments.mjs
          node tools/augment-evidence-grounded-judgments-with-lake.mjs
          node tools/validate-evidence-grounded-judgments.mjs
          node tools/validate-evidence-grounded-lake-judgments.mjs
          node test/evidence-grounded-judgments.test.js
          node tools/build-human-permission-gate-audit.mjs
          node tools/validate-human-permission-gate-audit.mjs
          node test/human-permission-gate-audit.test.js
      - name: Prove deterministic judgment and audit products
        if: steps.mode.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            build/evidence-grounded-judgments.json \
            build/human-permission-gate-audit.json \
            reports/evidence-grounded-judgments.md \
            reports/evidence-grounded-lake-decisions.md \
            reports/human-permission-gate-audit.md > /tmp/judgments-first.sha256
          node tools/build-evidence-grounded-judgments.mjs
          node tools/augment-evidence-grounded-judgments-with-lake.mjs
          node tools/validate-evidence-grounded-judgments.mjs
          node tools/validate-evidence-grounded-lake-judgments.mjs
          node test/evidence-grounded-judgments.test.js
          node tools/build-human-permission-gate-audit.mjs
          node tools/validate-human-permission-gate-audit.mjs
          node test/human-permission-gate-audit.test.js
          sha256sum --check --strict /tmp/judgments-first.sha256
          git diff --check
          if test '${{ steps.mode.outputs.materialize }}' != 'true'; then
            git diff --exit-code
          fi
      - name: Enforce required migration and generated allowlist
        if: steps.mode.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/tmp/judgment-source-migration-paths.json; then
            cp .github/tmp/judgment-source-migration-paths.json /tmp/judgment-source-migration-paths.json
          else
            printf '%s\n' '{"changed_paths":[]}' > /tmp/judgment-source-migration-paths.json
          fi
          rm -f \
            .github/tmp/evidence-grounded-judgment-trigger.json \
            .github/tmp/apply-judgment-source-migration.mjs \
            .github/tmp/judgment-source-migration-paths.json
          python - <<'PY'
          import json
          import subprocess

          migration = json.load(open('/tmp/judgment-source-migration-paths.json'))
          transport_deletions = {
              '.github/tmp/evidence-grounded-judgment-trigger.json',
          }
          for optional in [
              '.github/tmp/apply-judgment-source-migration.mjs',
              '.github/tmp/judgment-source-migration-paths.json',
          ]:
              tracked = subprocess.run(['git', 'ls-files', '--error-unmatch', optional], capture_output=True).returncode == 0
              if tracked:
                  transport_deletions.add(optional)
          required = set(migration.get('changed_paths', [])) | transport_deletions
          generated_allowlist = {
              'briefs/anduril-access-ownership.html',
              'briefs/arcadia-field-autopsy.html',
              'build/axm-identity.json',
              'build/briefings/anduril-access-ownership.json',
              'build/briefings/arcadia-field-autopsy.json',
              'build/briefings/index.json',
              'build/build-hop-report.json',
              'build/core-thesis/estate-lens-audit/estates/local-development-estate.json',
              'build/core-thesis/estate-lens-audit/estates/public-money-industrial-policy-estate.json',
              'build/core-thesis/estate-lens-audit/estates/state-municipal-authority-estate.json',
              'build/core-thesis/estate-lens-audit/estates/us-defense-estate.json',
              'build/core-thesis/estate-lens-audit/estates/venture-capital-corporate-control-estate.json',
              'build/core-thesis/security-state-organism/dispatch-receipt.json',
              'build/evidence-grounded-judgments.json',
              'build/hop-graph.json',
              'build/human-permission-gate-audit.json',
              'build/migration-review.md',
              'build/migration-summary.json',
              'build/receipt-graph.json',
              'build/report-frontier.json',
              'build/review/reporter-briefing-queue.json',
              'build/scores.json',
              'build/scout-report.json',
              'build/scout-report.md',
              'build/surface-graph.json',
              'reports/core-thesis/unmapped-sections/estates/local-development-estate.json',
              'reports/core-thesis/unmapped-sections/estates/public-money-industrial-policy-estate.json',
              'reports/core-thesis/unmapped-sections/estates/state-municipal-authority-estate.json',
              'reports/core-thesis/unmapped-sections/estates/us-defense-estate.json',
              'reports/core-thesis/unmapped-sections/estates/venture-capital-corporate-control-estate.json',
              'reports/evidence-grounded-judgments.md',
              'reports/evidence-grounded-lake-decisions.md',
              'reports/human-permission-gate-audit.md',
              'reports/index.html',
          }
          allowed = required | generated_allowlist

          raw = subprocess.check_output([
              'git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'
          ])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          actual = set()
          for entry in entries:
              status = entry[:2]
              assert 'R' not in status and 'C' not in status, entry
              actual.add(entry[3:])

          assert required <= actual, {
              'missing_required_source_or_transport_changes': sorted(required - actual),
          }
          assert actual <= allowed, {
              'undeclared_generated_or_source_changes': sorted(actual - allowed),
          }
          print(json.dumps({
              'required_changes': len(required),
              'actual_changes': len(actual),
              'allowed_generated_changes_observed': len(actual - required),
          }, indent=2))
          PY
      - name: Commit the judgment frontier
        if: steps.mode.outputs.materialize == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize evidence-grounded judgment authority'
          git pull --rebase origin agent/evidence-grounded-judgment-authority
          node tools/validate-evidence-grounded-judgments.mjs
          node tools/validate-evidence-grounded-lake-judgments.mjs
          node tools/validate-human-permission-gate-audit.mjs
          git push origin HEAD:agent/evidence-grounded-judgment-authority
