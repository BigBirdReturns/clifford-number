name: Evidence-grounded judgment authority

on:
  push:
    branches:
      - agent/evidence-grounded-judgment-authority
    paths:
      - '.github/tmp/evidence-grounded-judgment-trigger.json'
  pull_request:
    branches:
      - main
    paths:
      - 'data/project/evidence-grounded-judgment-authority.json'
      - 'data/project/lake-judgment-shadow-snapshot.json'
      - 'docs/methods/evidence-grounded-judgment-authority.md'
      - 'tools/build-evidence-grounded-judgments.mjs'
      - 'tools/augment-evidence-grounded-judgments-with-lake.mjs'
      - 'tools/validate-evidence-grounded-judgments.mjs'
      - 'tools/validate-evidence-grounded-lake-judgments.mjs'
      - 'test/evidence-grounded-judgments.test.js'
      - 'tools/compile.mjs'
      - '.github/workflows/evidence-grounded-judgment-authority.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: evidence-grounded-judgment-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  judgment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-grounded-judgment-authority
          fetch-depth: 0
      - name: Detect a live materialization request
        id: request
        shell: bash
        run: |
          if test -f .github/tmp/evidence-grounded-judgment-trigger.json; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.request.outputs.present == 'true'
        with:
          node-version: '24'
      - name: Run the complete repository release gate
        if: steps.request.outputs.present == 'true'
        run: npm run release:check
      - name: Restore the exact committed branch before focused reconstruction
        if: steps.request.outputs.present == 'true'
        run: git restore --staged --worktree .
      - name: Build and validate evidence-grounded judgments
        if: steps.request.outputs.present == 'true'
        run: |
          node tools/build-evidence-grounded-judgments.mjs
          node tools/augment-evidence-grounded-judgments-with-lake.mjs
          node tools/validate-evidence-grounded-judgments.mjs
          node tools/validate-evidence-grounded-lake-judgments.mjs
          node test/evidence-grounded-judgments.test.js
      - name: Prove deterministic judgment products
        if: steps.request.outputs.present == 'true'
        run: |
          sha256sum \
            build/evidence-grounded-judgments.json \
            reports/evidence-grounded-judgments.md \
            reports/evidence-grounded-lake-decisions.md > /tmp/judgments-first.sha256
          node tools/build-evidence-grounded-judgments.mjs
          node tools/augment-evidence-grounded-judgments-with-lake.mjs
          node tools/validate-evidence-grounded-judgments.mjs
          node tools/validate-evidence-grounded-lake-judgments.mjs
          node test/evidence-grounded-judgments.test.js
          sha256sum --check --strict /tmp/judgments-first.sha256
          git diff --check
      - name: Enforce exact generated change set
        if: steps.request.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/evidence-grounded-judgment-trigger.json
          python - <<'PY'
          import subprocess
          expected = {
              '.github/tmp/evidence-grounded-judgment-trigger.json',
              'build/evidence-grounded-judgments.json',
              'reports/evidence-grounded-judgments.md',
              'reports/evidence-grounded-lake-decisions.md',
          }
          raw = subprocess.check_output([
              'git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'
          ])
          entries = [entry for entry in raw.decode().split('\0') if entry]
          actual = set()
          for entry in entries:
              status = entry[:2]
              assert 'R' not in status and 'C' not in status, entry
              actual.add(entry[3:])
          assert actual == expected, {
              'unexpected': sorted(actual - expected),
              'missing': sorted(expected - actual),
          }
          PY
      - name: Commit the judgment frontier
        if: steps.request.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Execute evidence-grounded judgment fan-out'
          git push origin HEAD:agent/evidence-grounded-judgment-authority
