name: Validate RD-04 North Dakota current public-record-gap candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-nd-current-public-record-gap-validation.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation/**'

permissions:
  contents: read

env:
  CANONICAL_PARENT: d94b5ecd4547c7f051593fe330600985afc5e41c
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  MATRIX_SHA256: 663f93d84f168bf6ccdd92eaee0deb47b109f4280e7b25613853c2c1a6be2b63
  CANDIDATE_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/promotion-candidate.json
  CANDIDATE_BLOB: c5af22ad9457f93d3a34734982434bbee764b051
  SOURCE_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/source-corpus.json
  SOURCE_BLOB: c4cf754c064e4cc707b7b55ca872eff3006afe07
  DECISION_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/field-decision.json
  DECISION_BLOB: 54ab12737d4bcfba8f79373bab826d72db469d8d
  CANDIDATE_MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-adjudication/product-manifest.json
  CANDIDATE_MANIFEST_BLOB: cede396081eae25a6b388b5e7c3ab7105e2f6a05
  VALIDATION_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-current-public-record-gap-validation
  WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-nd-current-public-record-gap-validation.yml
  OUT: /tmp/rd04-nd-current-public-record-gap-validation

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate exact current cell, provenance closure, and projection
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$BASE_SHA" = "$CANONICAL_PARENT"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_PARENT"
          test "$(git rev-list --count "$CANONICAL_PARENT..HEAD")" -eq 1
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$CANONICAL_PARENT"
          EXPECTED="$(printf '%s\n' \
            "$WORKFLOW_PATH" \
            "$VALIDATION_ROOT/candidate-validation.json" \
            "$VALIDATION_ROOT/current-cell-custody.json" \
            "$VALIDATION_ROOT/product-manifest.json" \
            "$VALIDATION_ROOT/summary.json" \
            "$VALIDATION_ROOT/validated-candidate-protocol.json" | LC_ALL=C sort)"
          test "$(git diff --name-only "$CANONICAL_PARENT" HEAD | LC_ALL=C sort)" = "$EXPECTED"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD | LC_ALL=C sort)" = "$EXPECTED"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"
          git diff --check "$CANONICAL_PARENT" HEAD
          test "$(git rev-parse "origin/main:$MATRIX_PATH")" = "$MATRIX_BLOB"
          test "$(git rev-parse "origin/main:$CANDIDATE_PATH")" = "$CANDIDATE_BLOB"
          test "$(git rev-parse "origin/main:$SOURCE_PATH")" = "$SOURCE_BLOB"
          test "$(git rev-parse "origin/main:$DECISION_PATH")" = "$DECISION_BLOB"
          test "$(git rev-parse "origin/main:$CANDIDATE_MANIFEST_PATH")" = "$CANDIDATE_MANIFEST_BLOB"
          python - "$OUT/validation-receipt.json" <<'PYVAL'
          from __future__ import annotations
          import hashlib,json,os,pathlib,subprocess,sys
          out=pathlib.Path(sys.argv[1])
          def load(path): return json.loads(pathlib.Path(path).read_text())
          def canon(v): return json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          def sha(b): return hashlib.sha256(b).hexdigest()
          matrix_bytes=pathlib.Path(os.environ['MATRIX_PATH']).read_bytes()
          assert len(matrix_bytes)==485610 and sha(matrix_bytes)==os.environ['MATRIX_SHA256']
          matrix=json.loads(matrix_bytes)
          assert matrix['counts']['materialized_cells']==450
          assert matrix['counts']['terminal_cells']==227
          assert matrix['counts']['still_open_cells']==223
          assert matrix['counts']['terminal_substantive_cells']==117
          assert matrix['counts']['still_open_substantive_cells']==183
          assert matrix['counts']['terminal_units']==10
          assert matrix['counts']['class_closed'] is False
          nd=[r for r in matrix['rows'] if r['unit_id']=='US-STATE-ND']; assert len(nd)==1; nd=nd[0]
          assert sha(canon(nd))=='18f9b127b61e45edafb64c78bc8c387175fffdb351156ccf9154158ca467d2dd'
          assert nd['row_state']=='still_open' and nd['terminal_fields']==7 and nd['open_fields']==2
          target=[c for c in nd['cells'] if c['field_id']=='abawd_or_work_requirement_waiver_state_and_governing_period']; assert len(target)==1; target=target[0]
          row_state=[c for c in nd['cells'] if c['field_id']=='field_and_row_terminal_state']; assert len(row_state)==1; row_state=row_state[0]
          assert sha(canon(target))=='cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe'
          assert sha(canon(row_state))=='6a4c7d204c6c99a89f3c121065860806668c5da850f44c67fe42b4dc84b1b5c3'
          assert target['state']=='still_open' and target['terminal'] is False
          candidate=load(os.environ['CANDIDATE_PATH']); source=load(os.environ['SOURCE_PATH']); decision=load(os.environ['DECISION_PATH'])
          assert candidate['candidate_id']=='RD04-ND-CURRENT-WAIVER-PUBLIC-RECORD-GAP-CANDIDATE'
          assert candidate['current_cell_sha256']==sha(canon(target))
          assert candidate['current_state']=='still_open' and candidate['target_state']=='not_publicly_recovered'
          assert candidate['validation_state']=='unvalidated_exact_current_cell' and candidate['promotion_authorized'] is False
          assert candidate['row_state_transition_in_candidate'] is False
          assert sha(canon(candidate['proposed_cell']))==candidate['proposed_cell_sha256']=='8700619932bd128250a308d5dcd7b1586a363ae3b78e4eb80c23bfb72c8a2e25'
          required=candidate['proposed_cell']['evidence_source_ids']; defined=[r['source_id'] for r in source['source_records']]
          assert len(required)==len(set(required))==7 and len(defined)==len(set(defined))==7
          assert set(required)==set(defined)==set(candidate['evidence_source_resolution']['required_source_ids'])
          assert candidate['evidence_source_resolution']['all_required_source_ids_defined'] is True
          assert source['candidate_evidence_source_ids_resolved'] is True and source['source_record_count']==7
          assert sum(1 for r in source['source_records'] if r['admission_state']=='admitted_here')==1
          assert decision['decision_id']==candidate['decision_id']
          assert decision['typed_gap']==candidate['proposed_cell']['typed_gap']
          assert decision['value']==candidate['proposed_cell']['value']
          assert decision['separate_exact_current_cell_validation_required'] is True
          cv=load(os.environ['VALIDATION_ROOT']+'/candidate-validation.json')
          cc=load(os.environ['VALIDATION_ROOT']+'/current-cell-custody.json')
          vp=load(os.environ['VALIDATION_ROOT']+'/validated-candidate-protocol.json')
          sm=load(os.environ['VALIDATION_ROOT']+'/summary.json')
          assert cv['validation_result']['state']=='validated_exact_current_cell'
          assert cv['validation_result']['candidate_source_provenance_closed'] is True
          assert cv['validation_result']['separate_promotion_product_authorized'] is True
          assert cv['projected_separate_promotion']['counts']=={'materialized_cells':450,'terminal_cells':228,'still_open_cells':222,'terminal_substantive_cells':118,'still_open_substantive_cells':182,'terminal_units':10,'class_closed':False}
          assert cv['projected_separate_promotion']['north_dakota']=={'terminal_fields':8,'open_fields':1,'row_state':'still_open'}
          assert cv['projected_separate_promotion']['field_terminalizations']==1 and cv['projected_separate_promotion']['matrix_updates']==1
          assert cv['projected_separate_promotion']['row_state_mutations']==cv['projected_separate_promotion']['row_terminalizations']==0
          assert cc['candidate_matches_live_current_cell'] is True
          assert vp['separate_promotion_product_authorized'] is True and vp['promotion_executed_here'] is False
          assert vp['row_state_transition_authorized'] is False
          assert sm['promotion_authorized'] is True and sm['promotion_executed_here'] is False
          receipt={'schema_version':'ssc-rd04-nd-current-public-record-gap-hosted-validation@1','state':'validated_candidate_requires_separate_promotion','canonical_parent':os.environ['CANONICAL_PARENT'],'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'candidate_id':candidate['candidate_id'],'current_cell_sha256':candidate['current_cell_sha256'],'proposed_cell_sha256':candidate['proposed_cell_sha256'],'source_ids_resolved':True,'validated_candidates':1,'rejected_candidates':0,'projected_terminal_cells':228,'projected_still_open_cells':222,'projected_open_substantive_cells':182,'projected_terminal_units':10,'projected_nd_terminal_fields':8,'projected_nd_open_fields':1,'projected_nd_row_state':'still_open','separate_promotion_product_authorized':True,'promotion_executed_here':False,'field_terminalizations':0,'matrix_updates':0,'row_state_mutations':0,'row_terminalizations':0,'class_closed':False,'outside_human_dependency':False}
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PYVAL
          npm run release:check > "$OUT/release-check.log" 2>&1
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain)"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Preserve hosted validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-current-public-record-gap-validation-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
