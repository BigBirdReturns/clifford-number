name: Temporary publish M-04F Wave 03 stratigraphy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-m04f-wave03-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-wave03-evidentiary-stratigraphy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble, extract, and repair
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          root = Path('.github/temporary/m04f-wave03')
          encoded = ''.join(''.join((root / f'part-{i:02d}.txt').read_text().split()) for i in range(8))
          assert len(encoded) == 47200
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'd59c2a9f9a00c3357a0ad9db76d22fc84215e4acd5aea939343e2cf8f95cf4ea'
          payload = base64.b64decode(encoded, validate=True)
          assert len(payload) == 35399
          assert hashlib.sha256(payload).hexdigest() == '358b36ab28bf1c789b522e201cdb7e0aa8afa45d182f4e9639e3fd02a8a403d4'
          Path('/tmp/m04f-wave03-source.tgz').write_bytes(payload)
          PY
          tar -xzf /tmp/m04f-wave03-source.tgz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build-m04f-epistemic-jurisdiction.mjs')
          text = path.read_text()
          old = "  records: records.filter(record => baseSystemsDoc.systems.some(system => system.system_id === record.system_id)),"
          new = "  records: baselineRecords.map(record => ({ ...record, stratigraphy: stratify(record) })),"
          if old not in text: raise SystemExit('Wave 01 selector not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate exact estate and full release
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          npm run release:check
      - name: Remove unrelated drift and workflow-path change
        run: |
          git restore -- .github/workflows/m04f-epistemic-jurisdiction.yml
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          exact = {
            'data/intake/m04f-epistemic-jurisdiction-sources-04.json','data/intake/m04f-epistemic-jurisdiction-wave-03.json',
            'data/intake/m04f-epistemic-jurisdiction-wave-01.json','data/project/m04f-evidentiary-stratigraphy.json',
            'data/project/m04f-epistemic-jurisdiction-fanout-wave-03.json','data/project/m04f-epistemic-jurisdiction-estate.json',
            'docs/milestones/m04f-evidence-lake-wave-03-stratigraphy.md','test/m04f-epistemic-jurisdiction.test.js',
            'tools/build-m04f-epistemic-jurisdiction.mjs','tools/validate-m04f-epistemic-jurisdiction.mjs'
          }
          prefixes=('build/core-thesis/epistemic-jurisdiction/','reports/core-thesis/epistemic-jurisdiction/')
          for row in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
            p=row[3:].split(' -> ')[-1]
            if p in exact or p.startswith(prefixes): continue
            tracked=subprocess.run(['git','ls-files','--error-unmatch','--',p],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
            if tracked: subprocess.run(['git','restore','--staged','--worktree','--',p],check=True)
            else:
              t=Path(p)
              if t.is_dir(): shutil.rmtree(t)
              elif t.exists(): t.unlink()
          PY
      - name: Rebuild final products
        run: |
          node tools/build-m04f-epistemic-jurisdiction.mjs
          node tools/validate-m04f-epistemic-jurisdiction.mjs
          node test/m04f-epistemic-jurisdiction.test.js
          git diff --check
      - name: Commit and push durable estate
        run: |
          target='agent/m04f-wave03-evidentiary-stratigraphy'
          remote_sha="$(git rev-parse "origin/$target")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/intake/m04f-epistemic-jurisdiction-sources-04.json data/intake/m04f-epistemic-jurisdiction-wave-03.json data/intake/m04f-epistemic-jurisdiction-wave-01.json data/project/m04f-evidentiary-stratigraphy.json data/project/m04f-epistemic-jurisdiction-fanout-wave-03.json data/project/m04f-epistemic-jurisdiction-estate.json docs/milestones/m04f-evidence-lake-wave-03-stratigraphy.md test/m04f-epistemic-jurisdiction.test.js tools/build-m04f-epistemic-jurisdiction.mjs tools/validate-m04f-epistemic-jurisdiction.mjs build/core-thesis/epistemic-jurisdiction reports/core-thesis/epistemic-jurisdiction
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'No durable changes'; exit 1; }
          git commit -m 'Install M-04F Wave 03 evidentiary stratigraphy'
          git push --force-with-lease="refs/heads/$target:$remote_sha" origin "HEAD:refs/heads/$target"
