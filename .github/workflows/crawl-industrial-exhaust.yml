name: First-party industrial-exhaust intake

on:
  pull_request:
    paths:
      - '.github/workflows/crawl-industrial-exhaust.yml'
      - 'tools/temporary-pr2190-adjacent-wrapper-repair.py'

permissions:
  contents: write

concurrency:
  group: first-party-industrial-exhaust-pr2190-repair
  cancel-in-progress: false

jobs:
  repair-pr2190-adjacent-wrapper-ownership:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/pr2176-postmerge-wrapper-balance-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr2176-postmerge-wrapper-balance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, verify, and publish the clean two-path repair
        shell: bash
        run: |
          set -euo pipefail
          target_branch='agent/pr2176-postmerge-wrapper-balance-v1'
          clean_head='d501cfa7d755cffbb957e84e5cee01717cc607fc'
          repair_program='tools/temporary-pr2190-adjacent-wrapper-repair.py'
          temporary_push_workflow='.github/workflows/temporary-pr2190-adjacent-wrapper-repair.yml'
          expected_remote_head="$(git rev-parse HEAD)"

          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = 'e9dbb36e276c1198d3c59aa2d70759356bb06e99'
          test "$(git hash-object test/industrial-exhaust.test.js)" = 'a04eae7270d777e7becd74ed6762f37fda9f8d8a'
          python "${repair_program}"

          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/lib/industrial-exhaust-artifacts.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check tools/hydrate-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node --check test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          git checkout "${clean_head}" -- .github/workflows/crawl-industrial-exhaust.yml
          rm -f "${repair_program}" "${temporary_push_workflow}"

          expected_paths=$'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          actual_paths="$(git diff --name-only "${clean_head}" | sort)"
          test "${actual_paths}" = "${expected_paths}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(crawler): discard surplus phone wrapper closers'
          git push --force-with-lease="refs/heads/${target_branch}:${expected_remote_head}" \
            origin "HEAD:refs/heads/${target_branch}"
