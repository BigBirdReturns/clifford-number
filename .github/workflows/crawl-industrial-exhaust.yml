name: First-party industrial-exhaust intake

# Capture and triage only. Corporate publications remain attributed first-party
# statements and cannot mutate canonical graph, claim, score, case, or actor state.
on:
  pull_request:
    paths:
      - '.github/workflows/crawl-industrial-exhaust.yml'
      - 'data/exhaust/**'
      - 'tools/crawl-industrial-exhaust.mjs'
      - 'tools/hydrate-industrial-exhaust.mjs'
      - 'tools/lib/industrial-exhaust.mjs'
      - 'tools/lib/industrial-exhaust-artifacts.mjs'
      - 'test/industrial-exhaust.test.js'
      - 'test/industrial-exhaust-artifacts.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/crawl-industrial-exhaust.yml'
      - 'data/exhaust/README.md'
      - 'data/exhaust/sources.json'
      - 'data/exhaust/watch-terms.json'
      - 'data/exhaust/artifact-sources.json'
      - 'tools/crawl-industrial-exhaust.mjs'
      - 'tools/hydrate-industrial-exhaust.mjs'
      - 'tools/lib/industrial-exhaust.mjs'
      - 'tools/lib/industrial-exhaust-artifacts.mjs'
      - 'test/industrial-exhaust.test.js'
      - 'test/industrial-exhaust-artifacts.test.js'
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Optional exact source id
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: first-party-industrial-exhaust-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and adversarial intake tests
        run: |
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/lib/industrial-exhaust-artifacts.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check tools/hydrate-industrial-exhaust.mjs
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
      - name: Audit configured first-party surfaces
        run: |
          node tools/crawl-industrial-exhaust.mjs --audit
          node tools/hydrate-industrial-exhaust.mjs --audit
      - name: Live read-only feed and artifact smoke test
        env:
          EXHAUST_TIMEOUT_MS: '30000'
          EXHAUST_MAX_FEED_BYTES: '5000000'
          EXHAUST_ARTIFACT_MAX_BYTES: '6000000'
          EXHAUST_ARTIFACT_DELAY_MS: '250'
        run: |
          node tools/crawl-industrial-exhaust.mjs --dry-run --strict
          node tools/hydrate-industrial-exhaust.mjs --dry-run --strict --limit=20

  repair-pr2190-terminal-wrapper-v2:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/pr2176-postmerge-wrapper-balance-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the live repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr2176-postmerge-wrapper-balance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, validate, and publish structural terminal-wrapper classification
        shell: bash
        run: |
          set -euo pipefail
          target_branch='agent/pr2176-postmerge-wrapper-balance-v1'
          clean_workflow_head='88b4d9cefa8b5fc22f646b13bba1e7956bb23f7a'
          expected_remote_head="$(git rev-parse HEAD)"

          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')
          old = dedent(r'''
              const normalizedCandidate = candidate.normalize('NFKC');
              const openingParentheses = (normalizedCandidate.match(/\(/gu) ?? []).length;
              const closingParentheses = (normalizedCandidate.match(/\)/gu) ?? []).length;
              const unmatchedTrailingWrapper = normalizedCandidate.endsWith(')')
                && closingParentheses > openingParentheses;
          ''').rstrip()
          new = dedent(r'''
              const normalizedCandidate = candidate.normalize('NFKC');
              const normalizedCharacters = Array.from(normalizedCandidate);
              const terminalCharacter = normalizedCharacters.at(-1) ?? '';
              let openParentheses = 0;
              for (const character of normalizedCharacters.slice(0, -1)) {
                if (character === '(') openParentheses += 1;
                else if (character === ')' && openParentheses > 0) openParentheses -= 1;
              }
              const unmatchedTrailingWrapper = terminalCharacter === ')' && openParentheses === 0;
          ''').rstrip()
          if old in library:
              if library.count(old) != 1:
                  raise RuntimeError(f'count-based wrapper block appeared {library.count(old)} times')
              library = library.replace(old, new, 1)
          elif 'const normalizedCharacters = Array.from(normalizedCandidate);' not in library:
              raise RuntimeError('terminal-wrapper classifier is in an unrecognized state')
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          sentinel = 'a matched terminal phone-format parenthesis must not be restored because an earlier close is malformed'
          if sentinel not in tests:
              marker = "\nconsole.log('industrial-exhaust tests passed');"
              if tests.count(marker) != 1:
                  raise RuntimeError(f'test trailer marker count was {tests.count(marker)}, expected 1')
              block = dedent(r'''

              assert.equal(
                redactContactData('Phone +81) 3 6216 (5111)'),
                'Phone [contact omitted]',
                'a matched terminal phone-format parenthesis must not be restored because an earlier close is malformed'
              );
              assert.equal(
                redactContactData('referenceA+81 3 6216 5111)'),
                'referenceA+81 3 6216 5111)',
                'an unchanged attached identifier must never gain a duplicate terminal wrapper'
              );
              ''')
              tests = tests.replace(marker, f'{block}{marker}', 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/lib/industrial-exhaust-artifacts.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check tools/hydrate-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node --check test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          git checkout "${clean_workflow_head}" -- .github/workflows/crawl-industrial-exhaust.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lib/industrial-exhaust.mjs \
            test/industrial-exhaust.test.js \
            .github/workflows/crawl-industrial-exhaust.yml
          git diff --cached --check
          git commit -m 'fix(crawler): classify terminal phone wrappers structurally'
          git push --force-with-lease="refs/heads/${target_branch}:${expected_remote_head}" \
            origin "HEAD:refs/heads/${target_branch}"

  crawl:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Harvest immutable first-party feed observations
        env:
          EXHAUST_TIMEOUT_MS: '30000'
          EXHAUST_MAX_FEED_BYTES: '5000000'
        run: |
          SOURCE_ARG=''
          if [ -n "${{ inputs.source || '' }}" ]; then SOURCE_ARG="--source=${{ inputs.source }}"; fi
          node tools/crawl-industrial-exhaust.mjs --strict $SOURCE_ARG
      - name: Discover and hydrate bounded publisher artifacts
        env:
          EXHAUST_TIMEOUT_MS: '30000'
          EXHAUST_ARTIFACT_MAX_BYTES: '6000000'
          EXHAUST_ARTIFACT_DELAY_MS: '350'
        run: node tools/hydrate-industrial-exhaust.mjs --strict --limit=50
      - name: Re-run intake firewall
        run: |
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
      - name: Commit intake only
        run: |
          git config user.name "clifford-exhaust-bot"
          git config user.email "clifford-exhaust-bot@users.noreply.github.com"
          git add data/exhaust receipts/exhaust
          git diff --cached --quiet && exit 0
          git commit -m "crawl: first-party industrial exhaust ($(date -u +%F))"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0 || sleep $((i*3)); done
          echo "push failed after retries"; exit 1
