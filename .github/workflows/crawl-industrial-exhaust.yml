name: First-party industrial-exhaust intake

# Capture and triage only. Corporate publications remain attributed first-party
# statements and cannot mutate canonical graph, claim, score, case, or actor state.
on:
  pull_request:
    paths:
      - '.github/workflows/crawl-industrial-exhaust.yml'
      - 'data/exhaust/**'
      - 'tools/crawl-industrial-exhaust.mjs'
      - 'tools/lib/industrial-exhaust.mjs'
      - 'test/industrial-exhaust.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/crawl-industrial-exhaust.yml'
      - 'data/exhaust/README.md'
      - 'data/exhaust/sources.json'
      - 'data/exhaust/watch-terms.json'
      - 'tools/crawl-industrial-exhaust.mjs'
      - 'tools/lib/industrial-exhaust.mjs'
      - 'test/industrial-exhaust.test.js'
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Optional exact source id
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: first-party-industrial-exhaust-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and adversarial intake tests
        run: |
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node test/industrial-exhaust.test.js
      - name: Audit configured first-party feeds
        run: node tools/crawl-industrial-exhaust.mjs --audit
      - name: Live read-only feed smoke test
        env:
          EXHAUST_TIMEOUT_MS: '30000'
          EXHAUST_MAX_FEED_BYTES: '5000000'
        run: node tools/crawl-industrial-exhaust.mjs --dry-run --strict

  repair-pr2176-boundaries:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 2176 &&
      github.event.pull_request.head.ref == 'agent/dentsu-industrial-exhaust-review-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the live PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, validate, and publish the boundary repair
        shell: bash
        run: |
          set -euo pipefail
          target_branch='agent/dentsu-industrial-exhaust-review-fixes'
          clean_workflow_head='478373bba4f9c01e56ab1f05993d33f1348e1004'
          diagnostic='.github/pr2176-product-boundary-repair-diagnostic.txt'

          git fetch origin "${target_branch}"
          expected_remote_head="$(git rev-parse "origin/${target_branch}")"
          git checkout -B "${target_branch}" "${expected_remote_head}"
          rm -f "${diagnostic}"

          set +e
          python - <<'PY' > /tmp/pr2176-patch.log 2>&1
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label} anchor count was {count}, expected 1')
              return text.replace(old, new, 1)

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')

          old_signature = 'function isDottedContactContinuation(value, separator, groups, index) {'
          new_signature = 'function isDottedContactContinuation(value, separator, groups, index, contextualTail) {'
          if old_signature in library:
              library = replace_once(library, old_signature, new_signature, 'dotted signature')

              old_tail_line = "  const normalizedTail = normalizedWrappedNumericTail(value);\n"
              new_tail_line = (
                  "  const normalizedTail = normalizedWrappedNumericTail(value);\n"
                  "  const normalizedSeparator = separator.normalize('NFKC');\n"
              )
              library = replace_once(library, old_tail_line, new_tail_line, 'normalized separator')

              old_guard = r'''  if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'))) {
            return false;
          }
          '''
              new_guard = r'''  if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(normalizedSeparator)) return false;
          if (/\(\s*$/u.test(normalizedSeparator)
              && hasNarrativeNumericContinuation(contextualTail)) return false;
          '''
              library = replace_once(library, old_guard, new_guard, 'dotted guard')

              old_call = 'isDottedContactContinuation(tail, separator, groups, index)'
              if library.count(old_call) != 2:
                  raise RuntimeError(f'dotted call count was {library.count(old_call)}, expected 2')
              library = library.replace(
                  old_call,
                  'isDottedContactContinuation(tail, separator, groups, index, contextualTail)'
              )
          elif new_signature not in library:
              raise RuntimeError('dotted helper is in an unrecognized state')

          old_prefix = "    const prefix = redactionPrefixContext(input, offset);\n"
          new_prefix = (
              "    const firstContactCharacter = candidate.search(/[+＋(（0-9０-９]/u);\n"
              "    const contactOffset = offset + Math.max(0, firstContactCharacter);\n"
              "    const prefix = redactionPrefixContext(input, contactOffset);\n"
          )
          old_boundary = r'''    const previousCharacter = Array.from(prefix).at(-1) ?? '';
          const allowInitialGroup = !/[\p{L}\p{N}]/u.test(previousCharacter) || hasPhoneLabelPrefix(prefix);
          '''
          new_boundary = r'''    const adjacentCharacter = Array.from(input.slice(0, contactOffset)).at(-1) ?? '';
          const allowInitialGroup = !/[\p{L}\p{N}]/u.test(adjacentCharacter) || hasPhoneLabelPrefix(prefix);
          '''
          if old_prefix in library:
              library = replace_once(library, old_prefix, new_prefix, 'phone contact offset')
              library = replace_once(library, old_boundary, new_boundary, 'phone adjacency')
          elif 'const contactOffset = offset + Math.max(0, firstContactCharacter);' not in library:
              raise RuntimeError('redaction callback is in an unrecognized state')

          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          sentinel = 'phone eligibility must be evaluated at the actual first phone marker'
          if sentinel not in tests:
              marker = "\nconsole.log('industrial-exhaust tests passed');"
              if tests.count(marker) != 1:
                  raise RuntimeError('test trailer marker must appear exactly once')
              block = r'''
          for (const [input, expected] of [
            ['Call 03-6216-5111', 'Call [contact omitted]'],
            ['Call 09012345678', 'Call [contact omitted]'],
            ['Phone: 03 6216 5111 or 090-1234-5678', 'Phone: [contact omitted] or [contact omitted]']
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'phone eligibility must be evaluated at the actual first phone marker rather than leading matched whitespace'
            );
          }
          assert.equal(
            redactContactData('release09012345678'),
            'release09012345678',
            'a compact phone-shaped identifier attached to prose must remain intact'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53. (00) attendees joined.'),
            'Contact [contact omitted]. (00) attendees joined.',
            'parenthesized narrative evidence must override dotted pair-group continuation'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53．（００） attendees joined.'),
            'Contact [contact omitted]．（００） attendees joined.',
            'fullwidth parenthesized narrative evidence must override dotted pair-group continuation'
          );
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 12 34 56 78. (00) attendees joined.'),
            'Tel: [contact omitted] ext [contact omitted]. (00) attendees joined.',
            'parenthesized narrative evidence must remain outside a dotted pair-group extension'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53. (00)'),
            'Contact [contact omitted]',
            'a parenthesized two-digit tail without narrative continuation may remain contact formatting'
          );
          '''
              tests = tests.replace(marker, f'\n{block}{marker}', 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          patch_status=$?

          validation_status=0
          if test "${patch_status}" -eq 0; then
            {
              node --check tools/lib/industrial-exhaust.mjs &&
              node --check tools/crawl-industrial-exhaust.mjs &&
              node --check test/industrial-exhaust.test.js &&
              node test/industrial-exhaust.test.js &&
              git diff --check
            } > /tmp/pr2176-validation.log 2>&1
            validation_status=$?
          fi
          set -e

          if test "${patch_status}" -ne 0 || test "${validation_status}" -ne 0; then
            {
              printf 'patch_status=%s\nvalidation_status=%s\n' "${patch_status}" "${validation_status}"
              printf '\n--- patch log ---\n'
              cat /tmp/pr2176-patch.log
              printf '\n--- validation log ---\n'
              test -f /tmp/pr2176-validation.log && cat /tmp/pr2176-validation.log || true
            } > "${diagnostic}"
            git checkout -- tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          fi

          git checkout "${clean_workflow_head}" -- .github/workflows/crawl-industrial-exhaust.yml
          rm -f .github/workflows/pr2176-product-boundary-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/crawl-industrial-exhaust.yml \
            .github/workflows/pr2176-product-boundary-repair.yml \
            tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js

          if test -f "${diagnostic}"; then
            git add "${diagnostic}"
            commit_message='chore(ci): publish PR2176 boundary repair diagnostic'
          else
            commit_message='fix(crawler): honor true phone boundaries'
          fi

          git diff --cached --check
          git commit -m "${commit_message}"
          git push --force-with-lease="refs/heads/${target_branch}:${expected_remote_head}" \
            origin "HEAD:refs/heads/${target_branch}"

  crawl:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Harvest immutable first-party feed observations
        env:
          EXHAUST_TIMEOUT_MS: '30000'
          EXHAUST_MAX_FEED_BYTES: '5000000'
        run: |
          SOURCE_ARG=''
          if [ -n "${{ inputs.source || '' }}" ]; then SOURCE_ARG="--source=${{ inputs.source }}"; fi
          node tools/crawl-industrial-exhaust.mjs --strict $SOURCE_ARG
      - name: Re-run intake firewall
        run: node test/industrial-exhaust.test.js
      - name: Commit intake only
        run: |
          git config user.name "clifford-exhaust-bot"
          git config user.email "clifford-exhaust-bot@users.noreply.github.com"
          git add data/exhaust receipts/exhaust
          git diff --cached --quiet && exit 0
          git commit -m "crawl: first-party industrial exhaust ($(date -u +%F))"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0 || sleep $((i*3)); done
          echo "push failed after retries"; exit 1
