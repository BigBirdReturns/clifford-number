name: Temporary rebuild K0 cross-wave compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-rebuild-k0-wave01-compat.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-02
    paths:
      - '.github/workflows/temporary-rebuild-k0-wave01-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild and validate cross-wave K0 state
        run: |
          node tools/build-k0-role-neutral-wave-02.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-role-neutral-wave-01.mjs
          node test/k0-role-neutral-wave-01.test.js
          node tools/validate-k0-role-neutral-wave-02.mjs
          node test/k0-role-neutral-wave-02.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct and prove deterministic products
        run: |
          git restore --staged --worktree .
          git clean -fd
          node tools/build-k0-role-neutral-wave-02.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-role-neutral-wave-01.mjs
          node test/k0-role-neutral-wave-01.test.js
          node tools/validate-k0-role-neutral-wave-02.mjs
          node test/k0-role-neutral-wave-02.test.js
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Enforce generated path denominator
        run: |
          python - <<'PYDENOM'
          import subprocess
          expected = {
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'reports/core-thesis/answerable-power/k0.json',
              'reports/core-thesis/answerable-power/k0.html',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM

      - name: Create exact blob receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBLOBS'
          import base64
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          paths = [
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'reports/core-thesis/answerable-power/k0.json',
              'reports/core-thesis/answerable-power/k0.html',
          ]

          def post(path, payload):
              req = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'k0-cross-wave-compat',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          rows = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = post(f'/repos/{repo}/git/blobs', {
                  'content': base64.b64encode(raw).decode(),
                  'encoding': 'base64',
              })
              rows.append({'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': '100644'})

          receipt = {
              'schema_version': 'k0-cross-wave-compat-transaction@1',
              'repository': repo,
              'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'updates': rows,
              'deletions': ['.github/workflows/temporary-rebuild-k0-wave01-compat.yml'],
              'wave_01_append_only': True,
              'publication_cleared': False,
              'graph_effect': 'none',
          }
          os.makedirs('/tmp/k0-cross-wave-export', exist_ok=True)
          with open('/tmp/k0-cross-wave-export/BLOB_RECEIPTS.json', 'w') as handle:
              json.dump(receipt, handle, indent=2)
              handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PYBLOBS

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-cross-wave-compat-validated-transaction
          path: /tmp/k0-cross-wave-export/BLOB_RECEIPTS.json
          if-no-files-found: error
          retention-days: 30
