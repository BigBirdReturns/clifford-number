name: Temporary PR 2231 wrapped observation custody controller v72
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-wrapped-observation-custody-v72-repair.py'
      - '.github/workflows/temporary-pr2231-wrapped-observation-custody-controller-v72.yml'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: pr2231-wrapped-observation-custody-v72
  cancel-in-progress: false
jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-wrapped-observation-custody-controller-v72
      REPAIR_PATH: .github/tmp/pr2231-wrapped-observation-custody-v72-repair.py
      REPAIR_BLOB: 8d66679fa47b8f076dcc9567310fab33bdf7ab52
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      CTREE: f7fc52609c1c6b42921c7a4db6e20c4e54c1f99e
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 8aae3b90e7506856f41e96e14c6e4727872779b8
      PTREE: 51280c27645796b084617c074cb3345241342db9
      PLIB: 994ad06d13e8ea0df28b988d7ec21ddfcd1d640b
      PTEST: 2629ce7d8942f75687772426c11c70bfe8fa8973
      V71BRANCH: agent/pr2231-nested-phone-label-wrapper-controller-v71
      V71HEAD: 7f056dd03e348db9d2fed99a910f20d92e75df02
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify and publish wrapped observation custody repair
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-v72-source
          Q=/tmp/pr2231-v72-main
          R=/tmp/pr2231-v72-receipt.txt
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$V71BRANCH:refs/remotes/origin/$V71BRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq controller-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'.github/tmp/pr2231-wrapped-observation-custody-v72-repair.py\n.github/workflows/temporary-pr2231-wrapped-observation-custody-controller-v72.yml'
          require_eq repair-blob "$(git rev-parse "HEAD:$REPAIR_PATH")" "$REPAIR_BLOB"
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq v71-head "$(git rev-parse refs/remotes/origin/$V71BRANCH)" "$V71HEAD"

          stage exact-product-regression-witness
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const phoneInput = 'Phone: ((09012345678)) 12:30:45 555-1212';
          const phoneRequired = 'Phone: ([contact omitted]) 12:30:45 [contact omitted]';
          assert.equal(redact(phoneInput), phoneRequired);

          const dateInput = 'Phone: ((2026-08-17)) 12:30:45 555-1212';
          const dateActual = redact(dateInput);
          console.log(JSON.stringify({ kind: 'exact-p2-witness', input: dateInput, actual: dateActual }));
          assert.equal(
            dateActual,
            'Phone: ([contact omitted]) 12:30:45 [contact omitted]'
          );
          assert.notEqual(dateActual, dateInput);
          NODE

          stage apply-repair-and-targeted-controls
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          require_eq repair-paths "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const positives = [
            ['nested compact phone', 'Phone: ((09012345678)) 12:30:45 555-1212', 'Phone: ([contact omitted]) 12:30:45 [contact omitted]'],
            ['plus-prefixed phone', 'Phone: (+81 90 1234 5678) 12:30:45 555-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted]'],
            ['fullwidth plus-prefixed phone', '電話：（＋８１ ９０ １２３４ ５６７８） １２：３０：４５ ５５５－１２１２', '電話：[contact omitted] １２：３０：４５ [contact omitted]'],
            ['unit bridge after phone', 'Phone: ((09012345678)) 90 people 555-1212', 'Phone: ([contact omitted]) 90 people [contact omitted]'],
            ['weak range-shaped phone', 'Phone: ((03-62165111)) 12:30:45 555-1212', 'Phone: ([contact omitted]) 12:30:45 [contact omitted]']
          ];
          for (const [name, input, expected] of positives) {
            const actual = redact(input);
            console.log(JSON.stringify({ kind: 'positive', name, input, actual, expected }));
            assert.equal(actual, expected, name);
          }

          const observations = [
            ['nested ISO date', 'Phone: ((2026-08-17)) 12:30:45 555-1212'],
            ['fullwidth nested ISO date', '電話：（（２０２６－０８－１７）） １２：３０：４５ ５５５－１２１２'],
            ['nested long decimal', 'Phone: ((1234567.890123)) 12:30:45 555-1212'],
            ['nested unit observation', 'Phone: ((90 people)) 12:30:45 555-1212']
          ];
          for (const [name, input] of observations) {
            const actual = redact(input);
            console.log(JSON.stringify({ kind: 'observation-refusal', name, input, actual }));
            assert.equal(actual, input, name);
          }

          const refusals = [
            ['closed square wrapper', 'Phone: [((09012345678))] 12:30:45 555-1212', '12:30:45', '5551212'],
            ['URL-embedded label', 'https://example.test/phone: ((09012345678)) 12:30:45 555-1212', '12:30:45', '5551212'],
            ['unlabelled wrapper', 'Archive ((09012345678)) 12:30:45 555-1212', '12:30:45', '5551212'],
            ['fresh sentence', 'Phone: ((09012345678)). 12:30:45 555-1212', '12:30:45', '5551212']
          ];
          for (const [name, input, observation, laterDigits] of refusals) {
            const actual = redact(input);
            const normalized = actual.normalize('NFKC');
            console.log(JSON.stringify({ kind: 'boundary-refusal', name, input, actual }));
            assert.ok(normalized.includes(observation), `${name}: observation must survive`);
            assert.ok(normalized.replace(/\D/gu, '').includes(laterDigits), `${name}: later phone must remain`);
            assert.equal((actual.match(/\[contact omitted\]/gu) ?? []).length, 1, `${name}: only first phone may redact`);
          }
          NODE

          stage repaired-suites
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"

          stage exact-main-transplant-and-release
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq transplant-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage construct-qualified-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: preserve wrapped observation custody'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq qualified-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq qualified-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq qualified-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' \
            "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"

          stage final-lease-revalidation-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-v71 "$(git rev-parse refs/remotes/origin/$V71BRANCH)" "$V71HEAD"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$AHEAD"
          require_eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          require_eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ALIB"
          require_eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ATEST"
          printf 'QUALIFICATION_SUCCESS\nold=%s\nnew=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$PHEAD" "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-wrapped-observation-custody-v72
          path: /tmp/pr2231-v72-receipt.txt
          if-no-files-found: error
          retention-days: 90
