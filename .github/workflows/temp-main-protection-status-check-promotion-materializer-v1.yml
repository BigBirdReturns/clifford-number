name: Materialize checks-first scheduled promotion repair

on:
  push:
    branches:
      - agent/main-protection-status-check-promotion-materializer-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BASE: d727d71268e0c7b4a3eaba924a03add68c96bbb9
      PRODUCT_BRANCH: agent/main-protection-status-check-promotion-v1
      CONTROLLER_BRANCH: agent/main-protection-status-check-promotion-materializer-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lease exact main and refuse preexisting product ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          if git ls-remote --exit-code --heads origin "refs/heads/$PRODUCT_BRANCH" >/dev/null 2>&1; then
            echo "::error::Product branch already exists: $PRODUCT_BRANCH"
            exit 1
          fi
      - name: Materialize exact four-file repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          payloads = {".github/scripts/promote-scheduled-crawl.sh":"",".github/workflows/crawl-industrial-exhaust.yml":"",".github/workflows/crawl-official.yml":"","test/scheduled-crawl-promotion.test.js":""}
          for path, encoded in payloads.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          Path('.github/scripts/promote-scheduled-crawl.sh').chmod(0o755)
          PY
          git diff --check
          expected="$(mktemp)"
          actual="$(mktemp)"
          cat > "$expected" <<'EOF'
          .github/scripts/promote-scheduled-crawl.sh
          .github/workflows/crawl-industrial-exhaust.yml
          .github/workflows/crawl-official.yml
          test/scheduled-crawl-promotion.test.js
          EOF
          git diff --name-only | sort > "$actual"
          diff -u "$expected" "$actual"
          bash -n .github/scripts/promote-scheduled-crawl.sh
          node test/scheduled-crawl-promotion.test.js
      - name: Publish one direct-child product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigBirdReturns"
          git config user.email "bigbirdreturns@proton.me"
          git add -- \
            .github/scripts/promote-scheduled-crawl.sh \
            .github/workflows/crawl-industrial-exhaust.yml \
            .github/workflows/crawl-official.yml \
            test/scheduled-crawl-promotion.test.js
          git diff --cached --check
          git commit -m "Protect scheduled crawlers with checks-first fast-forward"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse "$candidate^")" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git push origin "$candidate:refs/heads/$PRODUCT_BRANCH"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$candidate"
          printf 'PRODUCT_SHA=%s\n' "$candidate"
      - name: Retire controller ref
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin ":refs/heads/$CONTROLLER_BRANCH"
