name: Temporary apply PR 410 review fixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/apply-pr410-review-fixes.py'
      - '.github/workflows/temporary-apply-pr410-review-fixes.yml'
  push:
    branches: [agent/poof-clifford-ecology]
    paths:
      - '.github/scripts/apply-pr410-review-fixes.py'
      - '.github/workflows/temporary-apply-pr410-review-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr410-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/poof-clifford-ecology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact review fixes
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-pr410-review-fixes.py --self-test
          python3 .github/scripts/apply-pr410-review-fixes.py "$PWD"
      - name: Build and validate the fixed ecology
        run: |
          set -euo pipefail
          node tools/build-core-thesis.mjs
          node tools/validate-core-thesis.mjs
          node test/core-thesis.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-poof-clifford-ecology.mjs
          node tools/validate-poof-constitutional-change.mjs
          node test/poof-constitutional-change.test.js
          node tools/validate-poof-clifford-ecology.mjs
          node test/poof-clifford-ecology.test.js
      - name: Install browser harness and run interaction regressions
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node test/poof-clifford-ecology-browser.test.js
          rm -f build/poof-clifford-ecology/browser-qa.json
      - name: Preserve fixed-tree patch and run complete release gate
        run: |
          set -euo pipefail
          git diff --binary > /tmp/pr410-review-fixes.patch
          test -s /tmp/pr410-review-fixes.patch
          npm run release:check
      - name: Reconstruct the exact fixed tree
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          git clean -fd -e node_modules/
          git apply /tmp/pr410-review-fixes.patch
          node tools/build-core-thesis.mjs
          node tools/build-m05-answerable-power.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/build-poof-clifford-ecology.mjs
          node tools/validate-poof-constitutional-change.mjs
          node test/poof-constitutional-change.test.js
          node tools/validate-poof-clifford-ecology.mjs
          node test/poof-clifford-ecology.test.js
          git diff --binary > /tmp/pr410-review-fixes-rebuilt.patch
          cmp /tmp/pr410-review-fixes.patch /tmp/pr410-review-fixes-rebuilt.patch
      - name: Commit permanent fixes and remove transport
        run: |
          set -euo pipefail
          rm -f build/poof-clifford-ecology/browser-qa.json
          git rm .github/scripts/apply-pr410-review-fixes.py
          git rm .github/workflows/temporary-apply-pr410-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Address POOF ecology review findings"
          git push origin HEAD:agent/poof-clifford-ecology
