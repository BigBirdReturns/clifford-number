name: Counter-Selector Wave 06 custody and finality frontier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-06.yml'
      - 'data/project/counter-selector-wave-06-*.json'
      - 'data/project/counter-selector-custody-finality-registry.json'
      - 'schemas/counter-selector-custody-finality.schema.json'
      - 'docs/methods/counter-selector-custody-finality.md'
      - 'docs/milestones/counter-selector-wave-06.md'
      - 'tools/build-counter-selector-wave-06.mjs'
      - 'tools/validate-counter-selector-wave-06.mjs'
      - 'test/counter-selector-wave-06.test.js'
      - 'reports/core-thesis/counter-selector-wave-06/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-06.yml'
      - 'data/project/counter-selector-wave-06-*.json'
      - 'data/project/counter-selector-custody-finality-registry.json'
      - 'schemas/counter-selector-custody-finality.schema.json'
      - 'docs/methods/counter-selector-custody-finality.md'
      - 'docs/milestones/counter-selector-wave-06.md'
      - 'tools/build-counter-selector-wave-06.mjs'
      - 'tools/validate-counter-selector-wave-06.mjs'
      - 'test/counter-selector-wave-06.test.js'
      - 'reports/core-thesis/counter-selector-wave-06/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 06 products
        run: node tools/build-counter-selector-wave-06.mjs
      - name: Validate custody and finality contract
        run: node tools/validate-counter-selector-wave-06.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-06.test.js
      - name: Require exact committed Wave 06 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-custody-finality-registry.json \
            data/project/counter-selector-wave-06-acquisition-routes.json \
            data/project/counter-selector-wave-06-release-manifest.json \
            reports/core-thesis/counter-selector-wave-06/data.json \
            reports/core-thesis/counter-selector-wave-06/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 06 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-06.mjs
          node tools/validate-counter-selector-wave-06.mjs
          node test/counter-selector-wave-06.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
