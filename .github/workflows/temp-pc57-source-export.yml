name: TEMP export exact current main for PC-57 construction

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: bf48e7f424283232bae5060779d2d33e4d85bbcb
      OUT: /tmp/pc57-exact-current-main-source
      CARRIER_PATH: .github/workflows/temp-pc57-source-export.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify bounded carrier and archive exact source parent
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT"
          git fetch --no-tags origin main "$EXPECTED_PARENT"

          git rev-parse HEAD > "$OUT/carrier-head.txt"
          git show -s --format='%P' HEAD > "$OUT/carrier-head-parents.txt"
          git merge-base "$EXPECTED_PARENT" HEAD > "$OUT/merge-base.txt"
          test "$(cat "$OUT/merge-base.txt")" = "$EXPECTED_PARENT"

          git diff --name-status "$EXPECTED_PARENT" HEAD > "$OUT/carrier-delta.tsv"
          git diff --name-only "$EXPECTED_PARENT" HEAD | sort -u > "$OUT/carrier-paths.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          paths = [line for line in (out / 'carrier-paths.txt').read_text().splitlines() if line]
          expected = [os.environ['CARRIER_PATH']]
          if paths != expected:
              raise SystemExit(f'carrier path mismatch: observed={paths!r} expected={expected!r}')
          PY

          parent_tree=$(git rev-parse "$EXPECTED_PARENT^{tree}")
          shown_tree=$(git show -s --format='%T' "$EXPECTED_PARENT")
          printf '%s\n' "$parent_tree" > "$OUT/tree.txt"
          test "$parent_tree" = "$shown_tree"
          printf '%s\n' "$EXPECTED_PARENT" > "$OUT/commit.txt"
          git ls-tree -r --full-tree "$EXPECTED_PARENT" > "$OUT/tree.tsv"
          git archive --format=tar "$EXPECTED_PARENT" | gzip -n -9 > "$OUT/source.tar.gz"
          sha256sum "$OUT/source.tar.gz" > "$OUT/source.tar.gz.sha256"
          sha256sum "$OUT"/commit.txt "$OUT"/tree.txt "$OUT"/tree.tsv "$OUT"/carrier-head.txt "$OUT"/carrier-head-parents.txt "$OUT"/merge-base.txt "$OUT"/carrier-delta.tsv "$OUT"/carrier-paths.txt > "$OUT/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: pc57-exact-current-main-source
          path: /tmp/pc57-exact-current-main-source
          if-no-files-found: error
          retention-days: 90
