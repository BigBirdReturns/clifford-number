name: Industrial-exhaust receipt procfs platform-lease custody controller v1

on:
  push:
    branches:
      - agent/industrial-exhaust-receipt-procfs-platform-lease-controller-v1
    paths:
      - .github/workflows/industrial-exhaust-receipt-procfs-platform-lease-controller-v1.yml

permissions:
  contents: write

concurrency:
  group: industrial-exhaust-receipt-procfs-platform-lease-controller-v1
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/industrial-exhaust-receipt-procfs-platform-lease-controller-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reproduce and repair procfs platform-lease custody
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA='2d2c7b6cd7517ca25854e481b21774a697d0e76b'
          PRODUCT_BRANCH='agent/industrial-exhaust-receipt-procfs-platform-lease-v1'
          WORKFLOW_PATH='.github/workflows/industrial-exhaust-receipt-procfs-platform-lease-controller-v1.yml'
          TMP_ROOT='.github/tmp/industrial-exhaust-procfs-platform-lease'
          LIB_PATH='tools/lib/industrial-exhaust-artifacts.mjs'
          TEST_PATH='test/industrial-exhaust-retained-store-custody.test.js'

          current_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$BASE_SHA" "$current_sha"

          expected_controller_paths=(
            "${TMP_ROOT}-lib-patch.part-00"
            "${TMP_ROOT}-lib-patch.part-01"
            "${TMP_ROOT}-lib-patch.part-02"
            "${TMP_ROOT}-lib-patch.part-03"
            "${TMP_ROOT}-test-patch.part-00"
            "${TMP_ROOT}-test-patch.part-01"
            "$WORKFLOW_PATH"
          )
          mapfile -t controller_diff < <(git diff --name-only "$BASE_SHA" "$current_sha")
          test "${#controller_diff[@]}" -eq "${#expected_controller_paths[@]}"
          for index in "${!expected_controller_paths[@]}"; do
            test "${controller_diff[$index]}" = "${expected_controller_paths[$index]}"
          done

          cat "${TMP_ROOT}-test-patch.part-00" \
              "${TMP_ROOT}-test-patch.part-01" \
              > /tmp/industrial-exhaust-procfs-platform-lease-test-patch.py
          cat "${TMP_ROOT}-lib-patch.part-00" \
              "${TMP_ROOT}-lib-patch.part-01" \
              "${TMP_ROOT}-lib-patch.part-02" \
              "${TMP_ROOT}-lib-patch.part-03" \
              > /tmp/industrial-exhaust-procfs-platform-lease-lib-patch.py
          python -m py_compile \
            /tmp/industrial-exhaust-procfs-platform-lease-test-patch.py \
            /tmp/industrial-exhaust-procfs-platform-lease-lib-patch.py
          python /tmp/industrial-exhaust-procfs-platform-lease-test-patch.py

          if node "$TEST_PATH"; then
            echo 'predecessor unexpectedly enforced the procfs platform lease' >&2
            exit 1
          else
            echo 'predecessor procfs platform-lease custody defect reproduced'
          fi

          python /tmp/industrial-exhaust-procfs-platform-lease-lib-patch.py

          node --check "$LIB_PATH"
          node --check "$TEST_PATH"
          node "$TEST_PATH"
          node test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node tools/hydrate-industrial-exhaust.mjs --audit
          git diff --check

          rm "$WORKFLOW_PATH" "${expected_controller_paths[@]:0:6}"

          mapfile -t product_diff < <(git diff --name-only "$BASE_SHA")
          test "${#product_diff[@]}" -eq 2
          test "${product_diff[0]}" = "$TEST_PATH"
          test "${product_diff[1]}" = "$LIB_PATH"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          new_sha="$(
            printf '%s\n\n%s\n' \
              'fix(industrial-exhaust): lease procfs publication platform' \
              'Pin and revalidate the mount namespace, canonical procfs mount, and descriptor-root identity around every bridge-mediated receipt operation.' \
              | git commit-tree "$tree_sha" -p "$BASE_SHA"
          )"

          mapfile -t final_diff < <(git diff --name-only "$BASE_SHA" "$new_sha")
          test "${#final_diff[@]}" -eq 2
          test "${final_diff[0]}" = "$TEST_PATH"
          test "${final_diff[1]}" = "$LIB_PATH"
          git diff --check "$BASE_SHA" "$new_sha"

          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$BASE_SHA"

          git push \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:" \
            origin \
            "${new_sha}:refs/heads/${PRODUCT_BRANCH}"
