name: Temporary PR2176 URL-context preservation repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/temporary-pr2176-url-context-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-url-context-preservation-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the exact entry state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9a61bb58485f67ec66fd0aaefd2e911d4caa6494"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temporary-pr2176-url-context-repair.yml"

      - name: Apply the URL-token preservation guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')
          old_anchor = r'''  const labelled = hasPhoneLabelPrefix(prefix);
            const international = isInternationalPhoneCandidate(normalized);'''
          new_anchor = r'''  const labelled = hasPhoneLabelPrefix(prefix);
            const numericUrlContext = /(?:https?:\/\/|www\.)[^\s]*$/iu.test(
              prefix.normalize('NFKC')
            );
            if (numericUrlContext) return 0;
            const international = isInternationalPhoneCandidate(normalized);'''
          if library.count(old_anchor) != 1:
              raise SystemExit('URL-context scoring anchor did not match exactly once')
          library = library.replace(old_anchor, new_anchor, 1)
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')
          anchor = r'''assert.equal(
            redactContactData('01 2026 08 17'),
            '01 2026 08 17',
            'a spaced numeric sequence containing a year must not be treated as a pair-grouped domestic phone'
          );'''
          replacement = anchor + r'''
          for (const numericUrl of [
            'https://example.test/01/42/68/53/00',
            'www.example.test/03/6216/5111',
            'https://example.test/+44/20/7123/4567'
          ]) {
            assert.equal(
              redactContactData(numericUrl),
              numericUrl,
              'numeric URL paths must remain intact rather than being classified as telephone spans'
            );
          }
          assert.equal(
            redactContactData('https://example.test/ 01 42 68 53 00'),
            'https://example.test/ [contact omitted]',
            'URL protection must end at whitespace so a later independent phone is still redacted'
          );'''
          if tests.count(anchor) != 1:
              raise SystemExit('URL-context test anchor did not match exactly once')
          tests = tests.replace(anchor, replacement, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate the focused repair
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

      - name: Publish the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"
          rm .github/workflows/temporary-pr2176-url-context-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/temporary-pr2176-url-context-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): preserve numeric URL tokens"
          git push --force-with-lease=refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head} origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
