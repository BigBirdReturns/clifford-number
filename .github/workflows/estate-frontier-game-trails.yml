name: Estate frontier and game-trail overlap pass

on:
  pull_request:
    paths:
      - 'data/estates/**'
      - 'data/gametrails/**'
      - 'data/milestones/estate-frontier-game-trails-v1.json'
      - 'docs/estates.md'
      - 'docs/milestones/estate-frontier-game-trails-v1.md'
      - 'gametrail-handoffs/**'
      - 'gametrails/**'
      - 'src/gametrail-aperture*'
      - 'tools/build-estate-frontier-surveys.mjs'
      - 'tools/validate-estate-frontier-surveys.mjs'
      - 'tools/build-estate-game-trails.mjs'
      - 'tools/validate-estate-game-trails.mjs'
      - 'tools/render-gametrail-aperture.mjs'
      - 'tools/validate-gametrail-aperture-pages.mjs'
      - 'tools/verify-gametrail-aperture-browser.cjs'
      - 'tools/compile.mjs'
      - 'tools/build-pages.mjs'
      - 'tools/build-standalone.mjs'
      - 'tools/validate-pages.mjs'
      - 'test/estate-frontier-surveys.test.js'
      - 'test/estate-game-trails.test.js'
      - 'tools/build-estates.mjs'
      - 'index.html'
      - 'reports/index.html'
      - 'src/estate-aperture-template.html'
      - 'README.md'
      - 'package.json'
      - '.github/workflows/estate-closure-aperture.yml'
      - '.github/workflows/estate-fanout.yml'
      - '.github/workflows/estate-frontier-game-trails.yml'
  push:
    branches:
      - main
    paths:
      - 'data/estates/**'
      - 'data/gametrails/**'
      - 'data/milestones/estate-frontier-game-trails-v1.json'
      - 'docs/milestones/estate-frontier-game-trails-v1.md'
      - 'gametrail-handoffs/**'
      - 'gametrails/**'
      - 'src/gametrail-aperture*'
      - 'tools/build-estate-frontier-surveys.mjs'
      - 'tools/build-estate-game-trails.mjs'
      - 'tools/render-gametrail-aperture.mjs'
      - '.github/workflows/estate-frontier-game-trails.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-frontier-game-trails-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compile the twenty-four-estate frontier
        run: |
          set +e
          npm run compile > /tmp/estate-frontier-compile.log 2>&1
          status=$?
          tail -n 300 /tmp/estate-frontier-compile.log
          exit "$status"

      - name: Validate survey and traversal law
        run: |
          npm run validate:estate-frontier-surveys
          npm run validate:estate-game-trails
          node test/estate-frontier-surveys.test.js
          node test/estate-game-trails.test.js
          node tools/validate-gametrail-aperture-pages.mjs
          node - <<'NODE'
          const m = require('./build/estate-closures/manifest.json');
          if (m.counts.estates !== 14 || m.counts.tasks !== 143 || m.counts.surface_complete_tasks !== 14) {
            throw new Error(`M-01 closure drifted: ${JSON.stringify(m.counts)}`);
          }
          NODE

      - name: Run the complete repository release gate
        run: |
          set +e
          npm run release:check > /tmp/estate-frontier-release.log 2>&1
          status=$?
          tail -n 360 /tmp/estate-frontier-release.log
          exit "$status"

      - name: Refuse deterministic drift
        run: |
          git diff --exit-code -- \
            build/estates \
            build/estate-frontier \
            build/estate-game-trails \
            build/estate-closures \
            estates/data.json \
            estates/index.html \
            estates/trails.json \
            gametrails/data.json \
            gametrails/index.html \
            gametrail-handoffs

      - name: Install declared browser dependency
        run: |
          npm install --no-package-lock
          node -e "const version = require('./node_modules/playwright/package.json').version; if (version !== '1.55.0') throw new Error('expected playwright 1.55.0, got ' + version);"
          npx playwright install --with-deps chromium

      - name: Start the static public application
        run: |
          node tools/serve-static.mjs 8080 > /tmp/gametrail-aperture-server.log 2>&1 &
          echo $! > /tmp/estate-frontier-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/gametrails/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gametrail-aperture-server.log
          exit 1

      - name: Verify Game-Trail Aperture in Chromium
        run: |
          node --check tools/verify-gametrail-aperture-browser.cjs
          timeout 300s node tools/verify-gametrail-aperture-browser.cjs

      - name: Preserve M-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-frontier-game-trails-milestone
          path: |
            data/estates/definitions/*.json
            data/estates/surveys/*.json
            data/estates/source-route-registry.json
            data/gametrails/*.json*
            data/milestones/estate-frontier-game-trails-v1.json
            docs/milestones/estate-frontier-game-trails-v1.md
            build/estates/index.json
            build/estate-frontier/
            build/estate-closures/
            build/estate-game-trails/
            gametrails/data.json
            gametrails/index.html
            gametrail-handoffs/*.md
            build/metrics/gametrail-aperture-browser.json
            build/metrics/gametrail-aperture-desktop.png
            build/metrics/gametrail-aperture-frontier.png
            build/metrics/gametrail-aperture-mobile.png
            build/metrics/gametrail-aperture-export.json
            dist/Clifford-Game-Trail-Aperture-standalone.html
            /tmp/estate-frontier-compile.log
            /tmp/estate-frontier-release.log
            /tmp/gametrail-aperture-server.log
          if-no-files-found: warn
          retention-days: 90

  close-survey-milestone:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MILESTONE_TITLE: M-02 · Estate Frontier Survey and Game-Trail Overlap Pass
      SUMMARY_TITLE: '[M-02 milestone] Estate frontier survey and game-trail overlap pass'
    steps:
      - uses: actions/checkout@v4

      - name: Create or refresh M-02 milestone
        id: milestone
        shell: bash
        run: |
          number="$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq ".[] | select(.title == env.MILESTONE_TITLE) | .number" | head -n 1)"
          description='Surveys ten additional macro estates and reruns 35 preserved trails plus all current estate source and custody frontiers. The pass ends at candidate-only overlap, bounded non-overlap, or unresolved boundaries; estates remain open.'
          if [ -z "$number" ]; then
            number="$(gh api --method POST "repos/$GH_REPO/milestones" -f title="$MILESTONE_TITLE" -f description="$description" --jq '.number')"
          else
            gh api --method PATCH "repos/$GH_REPO/milestones/$number" -f state='open' -f description="$description" >/dev/null
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Record and close the bounded survey pass
        shell: bash
        run: |
          number="$(gh issue list --repo "$GH_REPO" --state all --limit 500 --json number,title --jq ".[] | select(.title == env.SUMMARY_TITLE) | .number" | head -n 1)"
          body_file='docs/milestones/estate-frontier-game-trails-v1.md'
          if [ -z "$number" ]; then
            url="$(gh issue create --repo "$GH_REPO" --title "$SUMMARY_TITLE" --body-file "$body_file" --milestone "$MILESTONE_TITLE")"
            number="${url##*/}"
          else
            gh issue edit "$number" --repo "$GH_REPO" --body-file "$body_file" --milestone "$MILESTONE_TITLE"
          fi
          gh issue close "$number" --repo "$GH_REPO" --reason completed || true

      - name: Open or refresh twenty-four continuing estate lanes
        shell: bash
        run: |
          for body in gametrail-handoffs/*.md; do
            title="[M-02 game trail] $(sed -n '1s/^# M-02 game-trail lane: //p' "$body")"
            number="$(gh issue list --repo "$GH_REPO" --state all --limit 500 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
            if [ -z "$number" ]; then
              gh issue create --repo "$GH_REPO" --title "$title" --body-file "$body"
            else
              gh issue edit "$number" --repo "$GH_REPO" --body-file "$body"
            fi
          done

      - name: Close the completed survey milestone
        shell: bash
        run: |
          gh api --method PATCH "repos/$GH_REPO/milestones/${{ steps.milestone.outputs.number }}" \
            -f state='closed' \
            -f description='Completed on main. Ten frontier estates surveyed and prepared; 35 preserved trails rerun across 24 estates; 308 total trails compiled; 24 continuing evidence-acquisition lanes opened. No estate completion claimed.' >/dev/null