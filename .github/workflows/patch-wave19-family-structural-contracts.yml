name: Patch Wave 19 family structural contracts

on:
  push:
    branches:
      - agent/lake-generator-contracts-wave-19
    paths:
      - '.github/tmp/patch-wave19-family-structural-contracts-trigger.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Separate family structure from exact-path hash enforcement
        shell: bash
        run: |
          set -euo pipefail
          original_sha=$(git rev-parse HEAD)
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path_text, old, new):
              path = Path(path_text)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))

          policy_path = Path('data/project/lake-generator-contracts-wave-19-policy.json')
          policy = json.loads(policy_path.read_text())
          policy['decision_law']['exact_path_contracts_bind_object_hash'] = True
          policy['decision_law']['projection_family_contracts_bind_structural_variant'] = True
          policy['decision_law']['family_payload_hash_change_alone_is_not_contract_drift'] = True
          policy['boundaries']['exact_path_object_hash_enforced'] = True
          policy['boundaries']['family_payload_hash_equality_required'] = False
          policy['boundaries']['family_structural_variant_enforced'] = True
          policy_path.write_text(json.dumps(policy, indent=2) + '\n')

          materializer = 'tools/materialize-lake-generator-contracts-wave-19.mjs'
          replace_once(
              materializer,
              "const contracts = preflight.contracts.map(contract => {\n  const variantCounts = new Map();",
              "const contracts = preflight.contracts.map(contract => {\n  const objectHashEnforced = contract.scope_type === 'exact_projection_path';\n  const variantCounts = new Map();"
          )
          replace_once(
              materializer,
              "      const serialized = [compound, occurrence.path, template, occurrence.object_hash].join('\\0');",
              "      const serialized = objectHashEnforced\n        ? [compound, occurrence.path, template, occurrence.object_hash].join('\\0')\n        : [compound, occurrence.path, template].join('\\0');"
          )
          replace_once(
              materializer,
              "    const [compound, projectionPath, template, objectHash] = serialized.split('\\0');",
              "    const [compound, projectionPath, template, objectHash = null] = serialized.split('\\0');"
          )
          replace_once(
              materializer,
              "      variant_key: stableKey('LAKEW19VAR', [contract.generator_contract_id, compound, projectionPath, template, objectHash]),",
              "      variant_key: stableKey('LAKEW19VAR', objectHashEnforced\n        ? [contract.generator_contract_id, compound, projectionPath, template, objectHash]\n        : [contract.generator_contract_id, compound, projectionPath, template, 'STRUCTURAL_FAMILY_VARIANT']),"
          )
          replace_once(
              materializer,
              "      object_hash: objectHash,\n      occurrence_count: occurrenceCount",
              "      ...(objectHashEnforced ? { object_hash: objectHash } : {}),\n      object_hash_enforced: objectHashEnforced,\n      occurrence_count: occurrenceCount"
          )
          replace_once(
              materializer,
              "      variant_selector: 'id_key + id_value + projection_path + pointer_template + object_hash',\n      variant_namespace: `${contract.scope_type}:${contract.scope_value}`,",
              "      variant_selector: objectHashEnforced\n        ? 'id_key + id_value + projection_path + pointer_template + object_hash'\n        : 'id_key + id_value + projection_path + pointer_template',\n      variant_namespace: `${contract.scope_type}:${contract.scope_value}`,\n      object_hash_enforced: objectHashEnforced,\n      payload_hash_policy: objectHashEnforced ? 'exact_hash_registered' : 'family_structural_boundary',"
          )
          replace_once(
              materializer,
              "Every open Wave 18 generator-contract action is assigned to a named exact-path or\nprojection-family sidecar contract. Each contract registers the current projection\npath, pointer-template, and object-hash variants. A new variant must be added through\nan append-preserving superseding contract before release.\n\nCross-family typed views remain distinct and are never forced into byte equality.",
              "Every open Wave 18 generator-contract action is assigned to a named exact-path or\nprojection-family sidecar contract. Exact-path contracts bind projection path, pointer\ntemplate, and object hash. Projection-family contracts bind structural path and pointer\nvariants; a payload-hash change inside the declared family boundary is not itself drift.\nA new exact-path hash or family structural variant requires append-preserving supersession.\n\nCross-family typed views remain distinct and are never forced into byte equality."
          )
          replace_once(
              materializer,
              "families receive explicit schema or version boundaries. The registry closes the\nbounded action queue while retaining raw typed divergence where it is legitimate.",
              "families receive structural schema or version boundaries that do not freeze every\npayload byte. The registry closes the bounded action queue while retaining raw typed\ndivergence where it is legitimate."
          )

          reconciler = 'tools/reconcile-lake-generator-contracts-wave-19.mjs'
          replace_once(
              reconciler,
              "for (const contract of registry.contracts) {\n  const currentCounts = new Map();",
              "for (const contract of registry.contracts) {\n  const objectHashEnforced = contract.serialization_contract.object_hash_enforced === true;\n  const currentCounts = new Map();"
          )
          replace_once(
              reconciler,
              "      const serialized = [compound, occurrence.path, pointerTemplate(occurrence.pointer), occurrence.object_hash].join('\\0');",
              "      const template = pointerTemplate(occurrence.pointer);\n      const serialized = objectHashEnforced\n        ? [compound, occurrence.path, template, occurrence.object_hash].join('\\0')\n        : [compound, occurrence.path, template].join('\\0');"
          )
          replace_once(
              reconciler,
              "  const registeredCounts = new Map(contract.variants.map(variant => [\n    [`${variant.id_key}:${variant.id_value}`, variant.projection_path, variant.pointer_template, variant.object_hash].join('\\0'),\n    variant.occurrence_count\n  ]));",
              "  const registeredCounts = new Map(contract.variants.map(variant => [\n    objectHashEnforced\n      ? [`${variant.id_key}:${variant.id_value}`, variant.projection_path, variant.pointer_template, variant.object_hash].join('\\0')\n      : [`${variant.id_key}:${variant.id_value}`, variant.projection_path, variant.pointer_template].join('\\0'),\n    variant.occurrence_count\n  ]));\n  assert.equal(contract.serialization_contract.object_hash_enforced, objectHashEnforced, `${contract.generator_contract_key}: hash-enforcement mode drift`);\n  assert.ok(contract.variants.every(variant => variant.object_hash_enforced === objectHashEnforced), `${contract.generator_contract_key}: variant hash-enforcement drift`);"
          )
          replace_once(
              reconciler,
              "    current_variant_match: true,\n    graph_effect: 'none'",
              "    current_variant_match: true,\n    object_hash_enforced: objectHashEnforced,\n    graph_effect: 'none'"
          )
          replace_once(
              reconciler,
              "Each current variant is registered by exact path, pointer template, and object hash. A new variant requires append-preserving supersession before release.",
              "Exact-path variants are registered by path, pointer template, and object hash. Projection-family variants are registered structurally by path and pointer template, so payload-hash changes inside a declared family boundary do not create a recursive self-hash. New exact-path hashes or family structural variants require append-preserving supersession before release."
          )

          validator = 'tools/validate-lake-generator-contracts-wave-19.mjs'
          replace_once(
              validator,
              "for (const contract of registry.contracts) {\n  const currentCounts = new Map();",
              "for (const contract of registry.contracts) {\n  const objectHashEnforced = contract.serialization_contract.object_hash_enforced === true;\n  const currentCounts = new Map();"
          )
          replace_once(
              validator,
              "      const serialized = [compound, occurrence.path, pointerTemplate(occurrence.pointer), occurrence.object_hash].join('\\0');",
              "      const template = pointerTemplate(occurrence.pointer);\n      const serialized = objectHashEnforced\n        ? [compound, occurrence.path, template, occurrence.object_hash].join('\\0')\n        : [compound, occurrence.path, template].join('\\0');"
          )
          replace_once(
              validator,
              "  const registeredCounts = new Map(contract.variants.map(variant => [\n    [`${variant.id_key}:${variant.id_value}`, variant.projection_path, variant.pointer_template, variant.object_hash].join('\\0'),\n    variant.occurrence_count\n  ]));",
              "  const registeredCounts = new Map(contract.variants.map(variant => [\n    objectHashEnforced\n      ? [`${variant.id_key}:${variant.id_value}`, variant.projection_path, variant.pointer_template, variant.object_hash].join('\\0')\n      : [`${variant.id_key}:${variant.id_value}`, variant.projection_path, variant.pointer_template].join('\\0'),\n    variant.occurrence_count\n  ]));"
          )
          replace_once(
              validator,
              "  if (JSON.stringify([...currentCounts.entries()].sort()) !== JSON.stringify([...registeredCounts.entries()].sort())) fail(`${contract.generator_contract_key}: registered variant drift`);\n  if (contract.serialization_contract.cross_family_hash_equality_required !== false) fail(`${contract.generator_contract_key}: cross-family equality boundary drift`);",
              "  if (JSON.stringify([...currentCounts.entries()].sort()) !== JSON.stringify([...registeredCounts.entries()].sort())) fail(`${contract.generator_contract_key}: registered variant drift`);\n  if (contract.variants.some(variant => variant.object_hash_enforced !== objectHashEnforced)) fail(`${contract.generator_contract_key}: variant hash-enforcement mode drift`);\n  if (!objectHashEnforced && contract.variants.some(variant => Object.hasOwn(variant, 'object_hash'))) fail(`${contract.generator_contract_key}: family contract retained payload hash enforcement`);\n  if (contract.serialization_contract.cross_family_hash_equality_required !== false) fail(`${contract.generator_contract_key}: cross-family equality boundary drift`);"
          )

          test_path = 'test/lake-generator-contracts-wave-19.test.js'
          replace_once(
              test_path,
              "assert.equal(registry.contracts.filter(row => row.contract_kind === 'exact_path_uniqueness_or_version').length, 12);\nassert.equal(registry.contracts.filter(row => row.contract_kind === 'family_schema_or_version').length, 6);",
              "const exactContracts = registry.contracts.filter(row => row.contract_kind === 'exact_path_uniqueness_or_version');\nconst familyContracts = registry.contracts.filter(row => row.contract_kind === 'family_schema_or_version');\nassert.equal(exactContracts.length, 12);\nassert.equal(familyContracts.length, 6);\nassert.ok(exactContracts.every(row => row.serialization_contract.object_hash_enforced === true));\nassert.ok(exactContracts.every(row => row.variants.every(variant => variant.object_hash_enforced === true && typeof variant.object_hash === 'string')));\nassert.ok(familyContracts.every(row => row.serialization_contract.object_hash_enforced === false));\nassert.ok(familyContracts.every(row => row.variants.every(variant => variant.object_hash_enforced === false && !Object.hasOwn(variant, 'object_hash'))));"
          )
          PY
          rm -f .github/tmp/patch-wave19-family-structural-contracts-trigger.json
          rm -f .github/workflows/patch-wave19-family-structural-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check
          git commit -m 'Separate family structure from exact hash contracts'
          git fetch origin agent/lake-generator-contracts-wave-19
          test "$(git rev-parse origin/agent/lake-generator-contracts-wave-19)" = "$original_sha"
          git push origin HEAD:agent/lake-generator-contracts-wave-19
