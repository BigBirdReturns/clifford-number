      - name: Upload exact post-merge proof
        id: proof
        uses: actions/upload-artifact@v4
        with:
          name: pc62-exact-postmerge-proof
          path: /tmp/pc62-exact-postmerge-proof
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Authenticate proof, retire transactions, and seal census
        shell: bash
        env:
          MERGE: ${{ steps.merge.outputs.merge }}
          PROOF_ID: ${{ steps.proof.outputs.artifact-id }}
          PROOF_DIGEST_OUTPUT: ${{ steps.proof.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          gh api "/repos/$GH_REPOSITORY/actions/artifacts/$PROOF_ID" > "$CENSUS/proof-artifact.json"
          test "$(jq -r .id "$CENSUS/proof-artifact.json")" = "$PROOF_ID"
          test "$(jq -r .workflow_run.id "$CENSUS/proof-artifact.json")" = "$GITHUB_RUN_ID"
          case "$PROOF_DIGEST_OUTPUT" in sha256:*) normalized="$PROOF_DIGEST_OUTPUT" ;; *) normalized="sha256:$PROOF_DIGEST_OUTPUT" ;; esac
          test "$(jq -r .digest "$CENSUS/proof-artifact.json")" = "$normalized"
          test "$(jq -r .expired "$CENSUS/proof-artifact.json")" = false

          gh api --method GET "/repos/$GH_REPOSITORY/pulls" -f state=open -F per_page=100 > "$CENSUS/open-prs-before.json"
          jq '[.[]|select(.head.ref|startswith("agent/pc62"))|{number,head_ref:.head.ref,head_sha:.head.sha}]' "$CENSUS/open-prs-before.json" > "$CENSUS/prs-to-close.json"
          : > "$CENSUS/closed-prs.tsv"
          while IFS=$'\t' read -r number ref sha; do
            [ -n "$number" ] || continue
            gh api --method PATCH "/repos/$GH_REPOSITORY/pulls/$number" -f state=closed > "$CENSUS/closed-pr-$number.json"
            test "$(jq -r .state "$CENSUS/closed-pr-$number.json")" = closed
            test "$(jq -r .merged "$CENSUS/closed-pr-$number.json")" = false
            printf '%s\t%s\t%s\n' "$number" "$ref" "$sha" >> "$CENSUS/closed-prs.tsv"
          done < <(jq -r '.[]|[.number,.head_ref,.head_sha]|@tsv' "$CENSUS/prs-to-close.json")

          if ! gh api "/repos/$GH_REPOSITORY/git/matching-refs/heads/agent/pc62" > "$CENSUS/refs-before.json" 2>/dev/null; then printf '[]\n' > "$CENSUS/refs-before.json"; fi
          jq '[.[]|{ref,sha:.object.sha}]' "$CENSUS/refs-before.json" > "$CENSUS/refs-to-delete.json"
          : > "$CENSUS/deleted-refs.tsv"
          while IFS=$'\t' read -r ref sha; do
            [ -n "$ref" ] || continue
            api_ref=${ref#refs/}
            test "$(gh api "/repos/$GH_REPOSITORY/git/ref/$api_ref" --jq .object.sha)" = "$sha"
            gh api --method DELETE "/repos/$GH_REPOSITORY/git/refs/$api_ref"
            printf '%s\t%s\n' "$ref" "$sha" >> "$CENSUS/deleted-refs.tsv"
          done < <(jq -r '.[]|[.ref,.sha]|@tsv' "$CENSUS/refs-to-delete.json")

          for attempt in $(seq 1 80); do
            if ! gh api "/repos/$GH_REPOSITORY/git/matching-refs/heads/agent/pc62" > "$CENSUS/refs-after.json" 2>/dev/null; then printf '[]\n' > "$CENSUS/refs-after.json"; fi
            gh api --method GET "/repos/$GH_REPOSITORY/pulls" -f state=open -F per_page=100 > "$CENSUS/open-prs-after.json"
            refs_left=$(jq 'length' "$CENSUS/refs-after.json")
            prs_left=$(jq '[.[]|select(.head.ref|startswith("agent/pc62"))]|length' "$CENSUS/open-prs-after.json")
            [ "$refs_left" = 0 ] && [ "$prs_left" = 0 ] && break
            sleep 3
          done
          test "$refs_left" = 0
          test "$prs_left" = 0

          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          LIVE=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$MERGE" "$LIVE"
          : > "$CENSUS/live-main-product-blobs.tsv"
          while IFS= read -r path; do
            m=$(git rev-parse "$MERGE:$path"); l=$(git rev-parse "$LIVE:$path")
            test "$m" = "$l"
            printf '%s\t%s\n' "$path" "$l" >> "$CENSUS/live-main-product-blobs.tsv"
          done < "$WORK/product-paths.txt"
          refs_retired=$(wc -l < "$CENSUS/deleted-refs.tsv" | tr -d ' ')
          prs_closed=$(wc -l < "$CENSUS/closed-prs.tsv" | tr -d ' ')
          jq -n \
            --arg schema_version 'pc62-terminal-census@1' \
            --arg status complete \
            --arg product "$PRODUCT" \
            --arg merge "$MERGE" \
            --arg live "$LIVE" \
            --arg artifact "$PROOF_ID" \
            --arg digest "$normalized" \
            --arg refs "$refs_retired" \
            --arg prs "$prs_closed" \
            '{schema_version:$schema_version,status:$status,product_commit:$product,canonical_merge:$merge,live_main:$live,proof_artifact:{id:($artifact|tonumber),digest:$digest,authenticated:true},refs_retired:($refs|tonumber),execution_prs_closed_without_merge:($prs|tonumber),remaining_agent_pc62_refs:0,remaining_open_pc62_transaction_prs:0,permanent_product_paths:14,permanent_product_blob_matches:14,merge_operations_after_canonical_merge:0,product_semantics_changed:false,graph_effect:"none"}' > "$CENSUS/census.json"
          (
            cd "$CENSUS"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload terminal census
        id: census
        uses: actions/upload-artifact@v4
        with:
          name: pc62-terminal-census
          path: /tmp/pc62-terminal-census
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

