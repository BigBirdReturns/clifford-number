name: Preference custody hard-to-enumerate missingness assurance control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/hard-to-enumerate-missingness-assurance.fixture.json'
      - 'tools/lib/preference-hard-to-enumerate-missingness-assurance.mjs'
      - 'tools/compile-preference-hard-to-enumerate-missingness-assurance.mjs'
      - 'tools/validate-preference-hard-to-enumerate-missingness-assurance.mjs'
      - 'test/preference-hard-to-enumerate-missingness-assurance.test.js'
      - 'docs/preference-custody-hard-to-enumerate-missingness-assurance.md'
      - '.github/workflows/preference-hard-to-enumerate-missingness-assurance.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  hard-to-enumerate-missingness-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node tools/compile-preference-hard-to-enumerate-missingness-assurance.mjs
      - run: node tools/validate-preference-hard-to-enumerate-missingness-assurance.mjs
      - run: node test/preference-hard-to-enumerate-missingness-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-hard-to-enumerate-missingness-assurance-pc37
          path: |
            build/research/preference-hard-to-enumerate-missingness-assurance.json
            build/research/preference-hard-to-enumerate-missingness-assurance.md
          if-no-files-found: error
