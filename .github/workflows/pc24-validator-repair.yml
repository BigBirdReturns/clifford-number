name: Temporary PC-24 validator repair

on:
  pull_request:
    paths:
      - '.github/workflows/pc24-validator-repair.yml'
      - 'tools/lib/preference-instrument-validity.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-instrument-validity-v1
      - name: Repair domain-overlap and assistance diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/lib/preference-instrument-validity.mjs')
          source = path.read_text()

          partition = "  if (!sameMembers([...array(construct.covered_domains), ...array(construct.excluded_domains)], baseline.reference_domains)) errors.push(`world ${worldId} construct domain coverage must partition the reference domains`);\n"
          overlap = partition + "  if (array(construct.covered_domains).some(domain => array(construct.excluded_domains).includes(domain))) errors.push(`world ${worldId} construct domains must not overlap`);\n"
          if 'construct domains must not overlap' not in source:
              if partition not in source:
                  raise SystemExit('construct partition validator anchor not found')
              source = source.replace(partition, overlap, 1)

          old_assistance = "  if (population.assisted_count !== Math.max(administration.model_assistance_count, items.teaching_to_test_count)) errors.push(`world ${worldId} assisted population must reconcile to the dominant assistance or instructional exposure count`);\n"
          new_assistance = "  if (population.assisted_count !== Math.max(administration.model_assistance_count, items.teaching_to_test_count)) errors.push(`world ${worldId} assisted population cannot be smaller than model assistance or instructional exposure and must reconcile to the dominant count`);\n"
          if old_assistance in source:
              source = source.replace(old_assistance, new_assistance, 1)
          elif new_assistance not in source:
              raise SystemExit('assistance validator anchor not found')

          path.write_text(source)
          PY
      - name: Commit bounded validator repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/lib/preference-instrument-validity.mjs
          if git diff --cached --quiet; then
            echo 'No validator repair required.'
          else
            git commit -m 'Enforce PC-24 domain disjointness and assistance diagnostics'
            git push origin HEAD:research/preference-instrument-validity-v1
          fi
