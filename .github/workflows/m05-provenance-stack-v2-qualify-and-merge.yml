name: M-05 ten-layer provenance-stack exact-head qualifier

on:
  push:
    branches:
      - agent/m05-s03-l7-provenance-stack-v2-materializer-v1
    paths:
      - '.github/workflows/m05-provenance-stack-v2-qualify-and-merge.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: m05-provenance-stack-v2-exact-head-qualifier
  cancel-in-progress: false

jobs:
  qualify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: '2195'
      ISSUE: '345'
      EXPECTED_HEAD_BRANCH: 'agent/m05-s03-l7-intel-realization-acquisition-provenance-stack-v2'
      STACK_PATH: 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack-v2.json'
      STACK_VALIDATOR: 'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack-v2.mjs'
      STACK_TEST: 'test/m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack-v2.test.js'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze PR identity and exact four-path denominator
        id: freeze
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json state,headRefName,headRefOid,baseRefName,baseRefOid,mergeable > /tmp/pr.json
          gh api "repos/$REPO/branches/main" > /tmp/main.json
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/pr.json')),m=JSON.parse(fs.readFileSync('/tmp/main.json'));
          if(p.state!=='OPEN'||p.headRefName!==process.env.EXPECTED_HEAD_BRANCH||p.baseRefName!=='main'||p.baseRefOid!==m.commit.sha)throw new Error(`identity or lease drift ${JSON.stringify({p,main:m.commit.sha})}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`head=${p.headRefOid}\nbase=${p.baseRefOid}\n`);
          NODE
          gh api "repos/$REPO/pulls/$PR/files?per_page=100" --paginate > /tmp/files.json
          node <<'NODE'
          const rows=JSON.parse(require('fs').readFileSync('/tmp/files.json'));
          const expected=[
            '.github/workflows/m05-intel-realization-acquisition-provenance-stack-v2.yml',
            'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack-v2.json',
            'test/m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack-v2.test.js',
            'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack-v2.mjs'
          ].sort(),actual=rows.map(x=>x.filename).sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)||rows.some(x=>x.status!=='added'))throw new Error(`path denominator drift ${JSON.stringify(rows.map(x=>({path:x.filename,status:x.status})))}`);
          NODE
      - name: Await all exact-head PR workflows
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 300); do
            gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" > /tmp/runs.json
            if node <<'NODE'
          const fs=require('fs'),runs=JSON.parse(fs.readFileSync('/tmp/runs.json')).workflow_runs;
          const expected=['M-05 Intel realization acquisition provenance stack v2','Release checks','M-05 story ecology and answerable power','Core thesis and estate alignment','No magic human gate'];
          const latest=new Map();for(const r of runs.filter(r=>expected.includes(r.name))){const old=latest.get(r.name);if(!old||r.id>old.id)latest.set(r.name,r)}
          const bad=[...latest.values()].filter(r=>r.status==='completed'&&r.conclusion!=='success');if(bad.length){console.error(JSON.stringify(bad));process.exit(2)}
          if(!expected.every(n=>latest.get(n)?.status==='completed'&&latest.get(n)?.conclusion==='success'))process.exit(1);
          fs.writeFileSync('/tmp/qualified-runs.json',JSON.stringify(expected.map(n=>{const r=latest.get(n);return{name:n,id:r.id,head_sha:r.head_sha,conclusion:r.conclusion}}),null,2));
          NODE
            then break; else code=$?; [ "$code" -eq 2 ] && exit 1; fi
            [ "$attempt" -eq 300 ] && { echo timeout >&2; exit 1; }
            sleep 10
          done
      - name: Recheck immutable head and main lease
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
          BASE_SHA: ${{ steps.freeze.outputs.base }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json state,headRefOid,baseRefOid,mergeable > /tmp/final.json
          gh api "repos/$REPO/branches/main" > /tmp/main-final.json
          node <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('/tmp/final.json')),m=JSON.parse(fs.readFileSync('/tmp/main-final.json'));
          if(p.state!=='OPEN'||p.headRefOid!==process.env.HEAD_SHA||p.baseRefOid!==process.env.BASE_SHA||m.commit.sha!==process.env.BASE_SHA)throw new Error('final lease drift');
          if(!['MERGEABLE','UNKNOWN'].includes(p.mergeable))throw new Error(`mergeability ${p.mergeable}`);
          NODE
      - name: Record qualification and mark ready
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_SHA"
          tree=$(git show -s --format=%T "$HEAD_SHA")
          gh pr view "$PR" --repo "$REPO" --json body -q .body > /tmp/body.md
          cat >> /tmp/body.md <<EOF

All five applicable pull-request workflows passed on exact head \`$HEAD_SHA\`, tree \`$tree\`:

\`\`\`json
$(cat /tmp/qualified-runs.json)
\`\`\`

The focused workflow independently validated all ten component layers and their adversarial suites, the predecessor nine-layer stack, the successor ten-layer stack, all exact source-segment and claim-to-accounting-field joins, the complete repository release gate, and deterministic replay. The branch remained a four-file additive transaction over the exact canonical base.
EOF
          gh pr edit "$PR" --repo "$REPO" --body-file /tmp/body.md
          gh pr ready "$PR" --repo "$REPO"
      - name: Merge exact head
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=merge -f sha="$HEAD_SHA" \
            -f commit_title='[M-05 S03-L7] Freeze ten-layer provenance stack v2 (#2195)' \
            -f commit_message='Require every Intel realization-stage source receipt to carry the complete ten-layer acquisition, publisher-authority, and claim-extraction stack with all exact source-segment and accounting-field joins, while preserving zero observed receipts, no answer change, no graph effect, and issue #345 as open.' > /tmp/merge.json
          node -e "const x=require('/tmp/merge.json');if(!x.merged)throw new Error(JSON.stringify(x))"
      - name: Verify canonical merge and replay complete successor stack
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
          BASE_SHA: ${{ steps.freeze.outputs.base }}
        run: |
          set -euo pipefail
          merge=$(node -p "require('/tmp/merge.json').sha")
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$merge"
          head_tree=$(git show -s --format=%T "$HEAD_SHA")
          merge_tree=$(git show -s --format=%T "$merge")
          test "$head_tree" = "$merge_tree"
          test "$(git show -s --format=%P "$merge")" = "$BASE_SHA $HEAD_SHA"
          git switch --detach "$merge"
          node <<'NODE'
          const fs=require('fs'),{spawnSync}=require('child_process'),stack=JSON.parse(fs.readFileSync(process.env.STACK_PATH,'utf8'));
          for(const layer of stack.layers){for(const target of [layer.validator.path,layer.test.path]){const r=spawnSync(process.execPath,[target],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}}
          for(const target of ['tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack.mjs','test/m05-answerable-power-sprint-03-leg-07-intel-realization-acquisition-provenance-stack.test.js',process.env.STACK_VALIDATOR,process.env.STACK_TEST]){const r=spawnSync(process.execPath,[target],{stdio:'inherit'});if(r.status!==0)process.exit(r.status||1)}
          NODE
          npm run release:check
          echo "$merge" > /tmp/merge-sha
          echo "$merge_tree" > /tmp/merge-tree
      - name: Record canonical transaction on issue 345
        env:
          HEAD_SHA: ${{ steps.freeze.outputs.head }}
          BASE_SHA: ${{ steps.freeze.outputs.base }}
        run: |
          set -euo pipefail
          merge=$(cat /tmp/merge-sha); tree=$(cat /tmp/merge-tree)
          cat > /tmp/comment.md <<EOF
PR #2195 is now the canonical ten-layer acquisition and claim-provenance stack for the Intel realization chain. It merged exact qualified head \`$HEAD_SHA\` into \`main\` through merge commit \`$merge\`, preserving product tree \`$tree\` and exact parent order \`$BASE_SHA $HEAD_SHA\`.

The successor manifest preserves the nine acquisition, custody, origin, transport, request, peer, time, and publisher-authority layers and makes exact claim extraction layer ten. Every asserted transaction, federal-cash, public-account, and distribution field must now carry the exact source segment, parser and configuration, OCR or transcription receipt when used, raw and normalized claim sets, ordered transformation ledger, contradiction ledger, adjudication state, complete claim-to-accounting-field map, and the unchanged complete provenance stack. The manifest contains ten ordered layers and ten exact cross-layer joins.

A partial claim map, unmapped accounting field, parser or OCR output without its source segment, orphan layer, dangling digest, layer-order mutation, or cross-body reuse without identical join keys fails closed. The publisher-authority record joins to claim extraction, and claim extraction joins back to the accounting stage and stage receipt.

All five pull-request workflows passed on the exact head:

\`\`\`json
$(cat /tmp/qualified-runs.json)
\`\`\`

The controller replayed all ten component validators and adversarial suites, the predecessor nine-layer stack, the successor ten-layer stack, and the complete repository release gate on the canonical merge commit.

This remains an admission-control transaction. It establishes no Intel sale, transfer, dividend, warrant exercise, federal cash receipt, TAS/BETC booking, distribution ledger, effective answer, graph effect, cross-domain completion, project completion, or issue-closure authority. The ordinary acquisition gate remains \`2026-08-27T00:00:00Z\`.

The evidentiary ledger is exact Git-object and semantic custody for ten layers, exact source-segment and parser custody, raw-to-normalized transformation and contradiction ledgers, complete claim-to-accounting-field mapping, ten cross-layer digest joins, deterministic validation, and adversarial partial-map, orphan-layer, coordinated-rewrite, and byte-rewrite testing; the venue is PRs #2180 through #2195, canonical \`main\`, and this issue; the target is the gap between the complete acquisition stack and the field claims asserted from its sources; the upside is mechanically complete source-to-field provenance; the downside is zero empirical Intel realization or distribution receipts; and the failure mode is treating a valid acquisition stack without its exact claim-extraction layer as a complete accounting receipt. The controlling question is whether the first post-gate Intel source can satisfy the complete ten-layer stack and every source-segment-to-accounting-field join before advancing transaction, gross federal receipt, TAS/BETC booking, complete-denominator, distribution, answer, graph, completion, or issue-closure state.
EOF
          gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/comment.md
