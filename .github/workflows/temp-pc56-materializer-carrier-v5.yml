name: TEMP qualify exact repaired PC-56 product tree v5

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc56-materializer-carrier-v5
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      PRODUCT: cb15d5f6663fe398d0a493e16e100a507eb7246d
      PRODUCT_PARENT: 21afd8b3da1b7d06d2dada51929c63b60d6da66c
      PRODUCT_TREE: 3b2bfd2916f86d59adad372c07c5942f676f6aab
      PATCH_PATH: .tmp/pc56/lineage-completeness.patch
      PATCH_SHA256: a859b6fff137ede565450770f009077591335be7c71fb713d08c436c808f5f13
      LIB: tools/lib/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.mjs
      LIB_SHA256: b1db010a6bf9b4c3d261c01dd71ad75546401a50750b5e4266f95e5a34d6aaec
      LIB_BLOB: b270b0a7cca84befefc1c3c41b6bcca03a53e3ee
      TEST: test/preference-linkage-repository-owner-immutable-repository-id-transfer-rename-fork-network-canonical-location-assurance.test.js
      TEST_SHA256: 79da1542e10dd94dff4f070b6e5a4f34d9832bf2d9bb2feabcedfde1b5980a2e
      TEST_BLOB: d0ac434d35f0dc91043ec93c48cb35e1cecdf0a0
      RECEIPT: /tmp/pc56-lineage-completeness-repair
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply exact bounded lifecycle repair
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RECEIPT"
          test "$(sha256sum "$PATCH_PATH" | cut -d' ' -f1)" = "$PATCH_SHA256"
          cp "$PATCH_PATH" "$RECEIPT/repair.patch"
          git fetch --no-tags origin "$PRODUCT" "$PRODUCT_PARENT"
          git checkout --detach "$PRODUCT"
          test "$(git show -s --format='%P' HEAD)" = "$PRODUCT_PARENT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          git diff --name-status "$PRODUCT_PARENT" "$PRODUCT" > "$RECEIPT/original-product-delta.tsv"
          test "$(wc -l < "$RECEIPT/original-product-delta.tsv" | tr -d ' ')" = 14
          awk '$1 != "A" { exit 1 }' "$RECEIPT/original-product-delta.tsv"
          git apply --check "$RECEIPT/repair.patch"
          git apply "$RECEIPT/repair.patch"
          git diff --check
          git diff --name-only | sort > "$RECEIPT/changed-paths.txt"
          printf '%s\n%s\n' "$TEST" "$LIB" | sort > "$RECEIPT/expected-paths.txt"
          cmp "$RECEIPT/changed-paths.txt" "$RECEIPT/expected-paths.txt"
          test "$(sha256sum "$LIB" | cut -d' ' -f1)" = "$LIB_SHA256"
          test "$(sha256sum "$TEST" | cut -d' ' -f1)" = "$TEST_SHA256"
          test "$(git hash-object "$LIB")" = "$LIB_BLOB"
          test "$(git hash-object "$TEST")" = "$TEST_BLOB"
          node --check "$LIB"
          node --check "$TEST"

      - name: Run focused and complete qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/research
          node "$TEST"
          node test/preference-custody-manifest-v54.test.js
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check

      - name: Publish immutable repaired blobs and seal receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          : > "$RECEIPT/files.tsv"
          for path in "$LIB" "$TEST"; do
            encoded=$(base64 -w0 "$path")
            blob=$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}' | gh api --method POST "/repos/${GH_REPOSITORY}/git/blobs" --input - --jq .sha)
            expected=$(git hash-object "$path")
            test "$blob" = "$expected"
            printf '%s\t%s\t%s\t%s\n' "$path" "$(wc -c < "$path" | tr -d ' ')" "$(sha256sum "$path" | cut -d' ' -f1)" "$blob" >> "$RECEIPT/files.tsv"
          done
          jq -n \
            --arg status qualified \
            --arg product_before "$PRODUCT" \
            --arg product_parent "$PRODUCT_PARENT" \
            --arg product_tree_before "$PRODUCT_TREE" \
            --arg patch_sha256 "$PATCH_SHA256" \
            --arg library_blob "$LIB_BLOB" \
            --arg test_blob "$TEST_BLOB" \
            '{schema_version:"pc56-lineage-completeness-repair@1",status:$status,product_before:$product_before,product_parent:$product_parent,product_tree_before:$product_tree_before,patch_sha256:$patch_sha256,changed_paths:2,lifecycle_safeguards_bound:16,library_blob:$library_blob,test_blob:$test_blob,focused_pc56:"pass",floor_v54:"pass",historical_floors:"pass",base_preference_custody:"pass",no_magic_human:"pass",release_check:"pass",ref_updates:0,outside_human_dependency:false,graph_effect:"none"}' \
            > "$RECEIPT/receipt.json"
          sha256sum "$RECEIPT"/* > "$RECEIPT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: pc56-lineage-completeness-repair
          path: /tmp/pc56-lineage-completeness-repair
          if-no-files-found: error
          retention-days: 90
