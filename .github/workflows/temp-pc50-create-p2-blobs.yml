name: TEMP qualify and materialize exact PC-50 P2 repair blobs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pc50-p2-exact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify-and-create-blobs:
    if: github.head_ref == 'agent/pc50-product-carrier'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Reconstruct exact four-file repair archive
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, json, shutil, tarfile

          carrier = Path('.pc50-carrier/p2-exact')
          manifest_bytes = (carrier / 'manifest.json').read_bytes()
          manifest = json.loads(manifest_bytes)
          if manifest.get('schema_version') != 'pc50-p2-exact-carrier@1':
              raise SystemExit('unexpected carrier schema')
          if manifest.get('original_product_commit') != '63c3c8eda8144ec7596efc88a6d7b56239249a58':
              raise SystemExit('original product commit drift')
          if manifest.get('original_product_tree') != '772abfbb3285284a5e6f3056592ac65acef4eff1':
              raise SystemExit('original product tree drift')
          if manifest.get('qualified_parent_commit') != 'd87172a41e88c1709b37a114b50df733545126c8':
              raise SystemExit('qualified parent drift')
          if manifest.get('changed_permanent_files') != 4:
              raise SystemExit('repair denominator drift')

          parts = manifest.get('parts', [])
          if len(parts) != 11:
              raise SystemExit('repair shard denominator mismatch')
          chunks = []
          for index, part in enumerate(parts):
              expected = f'part{index:02d}'
              if part.get('path') != expected:
                  raise SystemExit(f'repair shard order mismatch: {part}')
              raw = (carrier / expected).read_bytes()
              if len(raw) != part['chars'] or hashlib.sha256(raw).hexdigest() != part['sha256']:
                  raise SystemExit(f'repair shard mismatch: {expected}')
              chunks.append(raw)
          encoded = b''.join(chunks)
          if len(encoded) != manifest['base64_chars'] or hashlib.sha256(encoded).hexdigest() != manifest['base64_sha256']:
              raise SystemExit('aggregate repair base64 mismatch')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != manifest['archive_bytes'] or hashlib.sha256(archive).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('repair archive mismatch')

          root = Path('/tmp/pc50-p2-exact')
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(parents=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as package:
              members = [member for member in package.getmembers() if member.isfile()]
              expected_paths = [row['path'] for row in manifest['files']]
              if [member.name for member in members] != expected_paths:
                  raise SystemExit('repair archive path mismatch')
              for member, expected in zip(members, manifest['files'], strict=True):
                  if member.name.startswith('/') or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe repair path: {member.name}')
                  data = package.extractfile(member).read()
                  digest = hashlib.sha256(data).hexdigest()
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if len(data) != expected['bytes'] or digest != expected['sha256'] or blob != expected['git_blob_sha1']:
                      raise SystemExit(f'exact repaired file mismatch: {member.name}')
                  target = root / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          Path('/tmp/pc50-p2-exact.tar.gz').write_bytes(archive)
          Path('/tmp/pc50-p2-manifest.json').write_bytes(manifest_bytes)
          print(json.dumps({
              'archive_bytes': len(archive),
              'archive_sha256': hashlib.sha256(archive).hexdigest(),
              'repair_files': len(manifest['files']),
          }, indent=2))
          PY

      - name: Checkout exact original PC-50 product head
        uses: actions/checkout@v4
        with:
          ref: 63c3c8eda8144ec7596efc88a6d7b56239249a58
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and verify exact four-file repair
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^{commit})" = "63c3c8eda8144ec7596efc88a6d7b56239249a58"
          test "$(git rev-parse HEAD^{tree})" = "772abfbb3285284a5e6f3056592ac65acef4eff1"
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path('/tmp/pc50-p2-exact')
          manifest = json.loads(Path('/tmp/pc50-p2-manifest.json').read_text())
          for row in manifest['files']:
              source = root / row['path']
              target = Path(row['path'])
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          manifest = json.loads(Path('/tmp/pc50-p2-manifest.json').read_text())
          expected = sorted(row['path'] for row in manifest['files'])
          actual = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'repair path mismatch: {actual}')
          PY
          git diff --check
          for file in \
            tools/lib/preference-custody-manifest-v48.mjs \
            tools/lib/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs \
            test/preference-custody-manifest-v48.test.js \
            test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js; do
            node --check "$file"
          done

      - name: Qualify repaired standalone PC-50
        run: |
          set -Eeuo pipefail
          {
            node tools/compile-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
            node tools/validate-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
            node test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js
          } 2>&1 | tee /tmp/pc50-p2-standalone.log

      - name: Qualify repaired floor v48 and complete ancestry
        run: |
          set -Eeuo pipefail
          {
            node tools/compile-preference-custody-manifest-v48.mjs
            node tools/validate-preference-custody-manifest-v48.mjs
            node test/preference-custody-manifest-v48.test.js
          } 2>&1 | tee /tmp/pc50-p2-floor-v48.log

      - name: Enforce no-magic-human gate
        run: |
          set -Eeuo pipefail
          {
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
          } 2>&1 | tee /tmp/pc50-p2-no-magic-human.log

      - name: Create exact repaired Git blobs without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, urllib.error, urllib.request

          manifest = json.loads(Path('/tmp/pc50-p2-manifest.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def api(payload):
              url = f'https://api.github.com/repos/{repo}/git/blobs'
              body = json.dumps(payload, separators=(',', ':')).encode()
              request = urllib.request.Request(url, data=body, method='POST')
              request.add_header('Accept', 'application/vnd.github+json')
              request.add_header('Authorization', f'Bearer {token}')
              request.add_header('X-GitHub-Api-Version', '2022-11-28')
              request.add_header('User-Agent', 'pc50-p2-exact-blob-materializer')
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'GitHub blob API failed HTTP {exc.code}: {exc.read().decode(errors="replace")}')

          remote = []
          for row in manifest['files']:
              data = Path(row['path']).read_bytes()
              response = api({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              if response.get('sha') != row['git_blob_sha1']:
                  raise SystemExit(f'remote blob mismatch: {row["path"]}')
              remote.append({
                  'path': row['path'],
                  'bytes': row['bytes'],
                  'sha256': row['sha256'],
                  'git_blob_sha1': response['sha'],
              })
          receipt = {
              'schema_version': 'pc50-p2-exact-remote-blob-receipt@1',
              'carrier_head': os.environ['CARRIER_HEAD'],
              'original_product_commit': manifest['original_product_commit'],
              'original_product_tree': manifest['original_product_tree'],
              'qualified_parent_commit': manifest['qualified_parent_commit'],
              'archive_sha256': manifest['archive_sha256'],
              'changed_permanent_files': len(remote),
              'remote_blobs': remote,
              'ref_updated': False,
              'outside_human_dependency': False,
              'graph_effect': 'none',
          }
          Path('/tmp/pc50-p2-remote-blob-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({
              'archive_sha256': receipt['archive_sha256'],
              'changed_permanent_files': receipt['changed_permanent_files'],
              'ref_updated': receipt['ref_updated'],
          }, indent=2))
          PY

      - name: Upload exact PC-50 P2 repair custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc50-p2-exact-repair-custody
          path: |
            /tmp/pc50-p2-exact.tar.gz
            /tmp/pc50-p2-manifest.json
            /tmp/pc50-p2-remote-blob-receipt.json
            /tmp/pc50-p2-standalone.log
            /tmp/pc50-p2-floor-v48.log
            /tmp/pc50-p2-no-magic-human.log
          if-no-files-found: warn
          retention-days: 90
