name: TEMP qualify and materialize PC-50 proxy-trap repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pc50-proxy-trap-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify-and-create-blobs:
    if: github.head_ref == 'agent/pc50-product-carrier'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Reconstruct and verify exact four-file repair archive
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, io, json, tarfile

          encoded = b''.join(Path('.pc50-carrier/proxy-repair.tar.gz.b64').read_bytes().split())
          if len(encoded) != 34256:
              raise SystemExit(f'base64 length mismatch: {len(encoded)}')
          if hashlib.sha256(encoded).hexdigest() != '1c5260a9cd1b05088dd258d5dcfd770489364f873630c7a1a29ae902ae2f2898':
              raise SystemExit('base64 SHA-256 mismatch')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != 25690:
              raise SystemExit(f'archive length mismatch: {len(archive)}')
          if hashlib.sha256(archive).hexdigest() != 'a1fb1b00722e4e9e1beb1a8c73950ca02fd55db9b3aac540e317dae82bb79881':
              raise SystemExit('archive SHA-256 mismatch')

          expected = [
              {'path':'test/preference-custody-manifest-v48.test.js','bytes':20099,'sha256':'90395bf18d2b89a42fe50f5fb7b49e00679501b08d3cf230cc8575698fac8af4','blob':'6622a7b131f655959b25ef091efbe8333a4cbe2e'},
              {'path':'test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js','bytes':17007,'sha256':'bfa36dca4464dada5b2fa25a9e05548857edeb733fc2262b219affa8eaa679bf','blob':'38d5f14b6be88041ba517a6a2dfc967f34c72c0f'},
              {'path':'tools/lib/preference-custody-manifest-v48.mjs','bytes':46613,'sha256':'c03cae9b4e9dc212b300a24c09e45e35beb0a32945073f7642fb24a7666d3f89','blob':'c81443cf7fc081384f8094387e5cccbe2126c7c2'},
              {'path':'tools/lib/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs','bytes':46367,'sha256':'e6a6468fde1e2e4c9b4ec10845f2454fa97493ffc614a89b00afa8148bd7058d','blob':'d64982afbb9b340e9e59f4cefd6ae001e242ff9f'},
          ]
          root = Path('/tmp/pc50-proxy-repair-root')
          root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as package:
              members = [member for member in package.getmembers() if member.isfile()]
              if [member.name for member in members] != [row['path'] for row in expected]:
                  raise SystemExit('archive path ledger mismatch')
              for member, meta in zip(members, expected, strict=True):
                  if member.name.startswith('/') or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  data = package.extractfile(member).read()
                  digest = hashlib.sha256(data).hexdigest()
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if len(data) != meta['bytes'] or digest != meta['sha256'] or blob != meta['blob']:
                      raise SystemExit(f'exact repair file mismatch: {member.name}')
                  destination = root / member.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
          Path('/tmp/pc50-proxy-repair.tar.gz').write_bytes(archive)
          Path('/tmp/pc50-proxy-repair-file-receipt.json').write_text(json.dumps(expected, indent=2) + '\n')
          PY

      - name: Checkout exact clean PC-50 product head
        uses: actions/checkout@v4
        with:
          ref: 754dbb2e7c0df78ead6916f166c6b9e0402f48e3
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and verify exact proxy-trap repair
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^{commit})" = "754dbb2e7c0df78ead6916f166c6b9e0402f48e3"
          test "$(git rev-parse HEAD^{tree})" = "de46a69c1d786e1befa2ca16b76757b1be168887"
          while read -r path; do cp "/tmp/pc50-proxy-repair-root/$path" "$path"; done <<'EOF'
          test/preference-custody-manifest-v48.test.js
          test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js
          tools/lib/preference-custody-manifest-v48.mjs
          tools/lib/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
          EOF
          cat > /tmp/pc50-proxy-repair-paths.txt <<'EOF'
          test/preference-custody-manifest-v48.test.js
          test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js
          tools/lib/preference-custody-manifest-v48.mjs
          tools/lib/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
          EOF
          git diff --name-only | sort > /tmp/pc50-proxy-repair-actual-paths.txt
          diff -u /tmp/pc50-proxy-repair-paths.txt /tmp/pc50-proxy-repair-actual-paths.txt
          git diff --check
          while read -r file; do node --check "$file"; done < /tmp/pc50-proxy-repair-paths.txt

      - name: Qualify repaired standalone PC-50
        run: |
          set -Eeuo pipefail
          {
            node tools/compile-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
            node tools/validate-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
            node test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js
          } 2>&1 | tee /tmp/pc50-proxy-repair-standalone.log

      - name: Qualify repaired floor v48 and complete ancestry
        run: |
          set -Eeuo pipefail
          {
            node tools/compile-preference-custody-manifest-v48.mjs
            node tools/validate-preference-custody-manifest-v48.mjs
            node test/preference-custody-manifest-v48.test.js
          } 2>&1 | tee /tmp/pc50-proxy-repair-floor-v48.log

      - name: Enforce no-magic-human gate
        run: |
          set -Eeuo pipefail
          {
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
          } 2>&1 | tee /tmp/pc50-proxy-repair-no-magic-human.log

      - name: Create exact repaired Git blobs without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, os, urllib.error, urllib.request

          expected = json.loads(Path('/tmp/pc50-proxy-repair-file-receipt.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def create_blob(data):
              url = f'https://api.github.com/repos/{repo}/git/blobs'
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}, separators=(',', ':')).encode()
              request = urllib.request.Request(url, data=body, method='POST')
              request.add_header('Accept', 'application/vnd.github+json')
              request.add_header('Authorization', f'Bearer {token}')
              request.add_header('X-GitHub-Api-Version', '2022-11-28')
              request.add_header('User-Agent', 'pc50-proxy-repair-blob-materializer')
              try:
                  with urllib.request.urlopen(request, timeout=120) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'GitHub blob API failed HTTP {exc.code}: {exc.read().decode(errors="replace")}')
          remote = []
          for meta in expected:
              data = Path(meta['path']).read_bytes()
              response = create_blob(data)
              if response.get('sha') != meta['blob']:
                  raise SystemExit(f'remote blob mismatch: {meta["path"]}')
              remote.append({'path':meta['path'],'bytes':meta['bytes'],'sha256':meta['sha256'],'git_blob_sha1':response['sha']})
          receipt = {
              'schema_version':'pc50-proxy-repair-remote-blob-receipt@1',
              'carrier_head':os.environ['CARRIER_HEAD'],
              'prior_product_commit':'754dbb2e7c0df78ead6916f166c6b9e0402f48e3',
              'prior_product_tree':'de46a69c1d786e1befa2ca16b76757b1be168887',
              'qualified_parent_commit':'d87172a41e88c1709b37a114b50df733545126c8',
              'archive_sha256':'a1fb1b00722e4e9e1beb1a8c73950ca02fd55db9b3aac540e317dae82bb79881',
              'changed_permanent_files':len(remote),
              'remote_blobs':remote,
              'ref_updated':False,
              'outside_human_dependency':False,
              'graph_effect':'none',
          }
          Path('/tmp/pc50-proxy-repair-remote-blob-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Upload exact PC-50 proxy-trap repair custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc50-proxy-trap-repair-custody
          path: |
            /tmp/pc50-proxy-repair.tar.gz
            /tmp/pc50-proxy-repair-file-receipt.json
            /tmp/pc50-proxy-repair-remote-blob-receipt.json
            /tmp/pc50-proxy-repair-standalone.log
            /tmp/pc50-proxy-repair-floor-v48.log
            /tmp/pc50-proxy-repair-no-magic-human.log
          if-no-files-found: warn
          retention-days: 90
