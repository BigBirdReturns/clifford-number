name: Temporary PR 2231 V132 external-wrapper cumulative qualification R2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v132-external-wrapper-cumulative-r2-read-only-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v132-external-wrapper-cumulative-r2:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v132-external-wrapper-cumulative-qualification-r2-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v132-external-wrapper-cumulative-qualification-r2-v1
      QUALIFIER_XZ_SHA256: e0c37f15977fbc8c0dc555e73f9b945c8cb3cb911f59eeff2aa3c320205343f8
      QUALIFIER_SHA256: 6973fedb359f70a7fc3e58b80725bb1f6ead7ee5d9d103a63f53b382c01fccf6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize exact V132 R2 read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          payload=.github/temporary/pr2231-v132-external-wrapper-cumulative-qualifier-r2-v1.sh.xz.b64
          base64 -d "$payload" > /tmp/pr2231-v132-r2-qualifier.sh.xz
          test "$(sha256sum /tmp/pr2231-v132-r2-qualifier.sh.xz | awk '{print $1}')" = "$QUALIFIER_XZ_SHA256"
          xz -dc /tmp/pr2231-v132-r2-qualifier.sh.xz > /tmp/pr2231-v132-r2-qualifier.sh
          test "$(sha256sum /tmp/pr2231-v132-r2-qualifier.sh | awk '{print $1}')" = "$QUALIFIER_SHA256"
          chmod 0755 /tmp/pr2231-v132-r2-qualifier.sh
          bash -n /tmp/pr2231-v132-r2-qualifier.sh

      - name: Execute exact V132 R2 read-only qualifier
        shell: bash
        run: bash /tmp/pr2231-v132-r2-qualifier.sh

      - name: Upload V132 R2 qualification ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v132-external-wrapper-cumulative-qualification-r2-v1
          path: /tmp/pr2231-v132-external-wrapper-cumulative-qualification-r2-v1
          if-no-files-found: error
          retention-days: 30
