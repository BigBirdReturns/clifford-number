name: Project stable-ground supersession 05 · historical

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg05*.json'
      - 'data/project/project-stable-ground-sg06*.json'
      - 'docs/milestones/project-stable-ground-sg05.md'
      - 'reports/core-thesis/stable-ground/sg05/**'
      - 'tools/validate-project-stable-ground-sg05.mjs'
      - 'test/project-stable-ground-sg05.test.js'
      - '.github/workflows/project-stable-ground-sg05.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-governor.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg05*.json'
      - 'data/project/project-stable-ground-sg06*.json'
      - 'docs/milestones/project-stable-ground-sg05.md'
      - 'reports/core-thesis/stable-ground/sg05/**'
      - 'tools/validate-project-stable-ground-sg05.mjs'
      - 'test/project-stable-ground-sg05.test.js'
      - '.github/workflows/project-stable-ground-sg05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate preserved SG-05 history
        run: |
          node tools/validate-project-stable-ground-sg05.mjs
          node test/project-stable-ground-sg05.test.js
      - name: Validate preserved SG-01 through SG-04 history
        run: |
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
          node tools/validate-project-stable-ground-sg02.mjs
          node test/project-stable-ground-sg02.test.js
          node tools/validate-project-stable-ground-sg03.mjs
          node test/project-stable-ground-sg03.test.js
          node tools/validate-project-stable-ground-sg04.mjs
          node test/project-stable-ground-sg04.test.js
      - name: Revalidate SSC-H01 and Wave 01 boundaries
        run: |
          node tools/validate-status-sovereignty-wave-01.mjs
          node test/status-sovereignty-wave-01.test.js
          node tools/validate-status-sovereignty-compact.mjs
          node test/status-sovereignty-compact.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove historical SG-05 bytes remain untouched
        run: |
          git restore --staged --worktree .
          node tools/validate-project-stable-ground-alignment.mjs
          node test/project-stable-ground-alignment.test.js
          node tools/validate-project-stable-ground-sg02.mjs
          node test/project-stable-ground-sg02.test.js
          node tools/validate-project-stable-ground-sg03.mjs
          node test/project-stable-ground-sg03.test.js
          node tools/validate-project-stable-ground-sg04.mjs
          node test/project-stable-ground-sg04.test.js
          node tools/validate-project-stable-ground-sg05.mjs
          node test/project-stable-ground-sg05.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
