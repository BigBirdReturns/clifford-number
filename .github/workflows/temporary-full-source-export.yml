name: Temporary full source export

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-full-source-export.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-estate-milestone-apply
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-estates-and-open-aperture
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize exact Estate Aperture milestone source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/estate-milestone-diagnostics /tmp/estate-milestone-validation /tmp/estate-milestone-publish
          {
            echo 'chunk diagnostics'
            find .github/temporary/estate-milestone-source-v1 -maxdepth 1 -type f -name 'chunk-*.b64' -print | sort | while read -r file; do
              printf '%s bytes=' "$file"
              wc -c < "$file"
              printf 'blob_sha='
              git hash-object "$file"
            done
          } > /tmp/estate-milestone-diagnostics/chunks.txt
          cat .github/temporary/estate-milestone-source-v1/chunk-*.b64 > /tmp/estate-milestone-source.b64
          sha256sum /tmp/estate-milestone-source.b64 > /tmp/estate-milestone-diagnostics/combined-b64.sha256
          base64 --decode /tmp/estate-milestone-source.b64 > /tmp/estate-milestone-source.tgz
          wc -c /tmp/estate-milestone-source.b64 /tmp/estate-milestone-source.tgz > /tmp/estate-milestone-diagnostics/decode.txt
          sha256sum /tmp/estate-milestone-source.tgz >> /tmp/estate-milestone-diagnostics/decode.txt
          printf '%s  %s\n' '15d2380b3176a6ebcb3f76f4977bda91918c13c6da79bf2b722f481d108aa043' /tmp/estate-milestone-source.tgz | sha256sum --check
          tar -xzf /tmp/estate-milestone-source.tgz -C .
          sed -i 's/[[:blank:]]\+$//' docs/milestones/estate-aperture-v1.md
          rm -rf .github/temporary
          rm -f .github/workflows/temporary-full-source-export.yml
          rm -f .github/workflows/temporary-estate-source-probe.yml
          rm -f .github/workflows/temporary-apply-estate-milestone.yml

      - name: Preserve transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-milestone-transport-diagnostics
          path: /tmp/estate-milestone-diagnostics/
          if-no-files-found: warn
          retention-days: 2

      - name: Compile milestone products
        shell: bash
        run: |
          set -o pipefail
          npm run compile 2>&1 | tee /tmp/estate-milestone-validation/01-compile.log

      - name: Validate estate closure contracts
        shell: bash
        run: |
          set -o pipefail
          {
            npm run validate:estate-closures
            node test/estate-closures.test.js
            node test/estate-aperture.test.js
            node test/estates.test.js
            node test/estate-fanout.test.js
          } 2>&1 | tee /tmp/estate-milestone-validation/02-estate-contracts.log

      - name: Build and validate publication products
        shell: bash
        run: |
          set -o pipefail
          {
            npm run compile:denominator
            npm run validate:denominator
            npm run compile:case-packets
            npm run validate:case-packets
            npm run compile:thesis
            npm run validate:thesis
            npm run build:pages
            npm run build:standalone
            npm run validate:pages
          } 2>&1 | tee /tmp/estate-milestone-validation/03-publication.log

      - name: Run full release gate
        shell: bash
        run: |
          set -o pipefail
          npm run release:check 2>&1 | tee /tmp/estate-milestone-validation/04-release.log

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-milestone-validation-diagnostics
          path: /tmp/estate-milestone-validation/
          if-no-files-found: warn
          retention-days: 2

      - name: Publish permanent milestone source
        shell: bash
        run: |
          set +e
          {
            test ! -d .github/temporary
            echo "temporary_directory_status=$?"
            find .github/workflows -maxdepth 1 -type f -name 'temporary-*' -print
          } > /tmp/estate-milestone-publish/01-boundary.log 2>&1

          rm -rf build/research build/thesis
          git restore --worktree --source=HEAD -- \
            build/axm-identity.json \
            build/build-hop-report.json \
            build/hop-graph.json \
            build/migration-review.md \
            build/migration-summary.json \
            build/receipt-graph.json \
            build/scores.json \
            build/scout-report.json \
            build/scout-report.md \
            build/surface-graph.json \
            > /tmp/estate-milestone-publish/02-restore.log 2>&1
          restore_status=$?

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A > /tmp/estate-milestone-publish/03-add.log 2>&1
          add_status=$?
          git status --short > /tmp/estate-milestone-publish/04-status.log 2>&1
          git diff --cached --stat > /tmp/estate-milestone-publish/05-stat.log 2>&1
          git diff --cached --check > /tmp/estate-milestone-publish/06-check.log 2>&1
          check_status=$?

          commit_status=0
          push_status=0
          if [ "$restore_status" -eq 0 ] && [ "$add_status" -eq 0 ] && [ "$check_status" -eq 0 ]; then
            git commit -m 'Ship Estate Aperture v1 milestone' > /tmp/estate-milestone-publish/07-commit.log 2>&1
            commit_status=$?
            if [ "$commit_status" -eq 0 ]; then
              git push origin HEAD:agent/close-estates-and-open-aperture > /tmp/estate-milestone-publish/08-push.log 2>&1
              push_status=$?
            fi
          fi
          printf 'restore=%s\nadd=%s\ncheck=%s\ncommit=%s\npush=%s\n' \
            "$restore_status" "$add_status" "$check_status" "$commit_status" "$push_status" \
            > /tmp/estate-milestone-publish/00-statuses.log
          cat /tmp/estate-milestone-publish/00-statuses.log
          cat /tmp/estate-milestone-publish/06-check.log
          cat /tmp/estate-milestone-publish/07-commit.log 2>/dev/null
          cat /tmp/estate-milestone-publish/08-push.log 2>/dev/null
          if [ "$restore_status" -ne 0 ] || [ "$add_status" -ne 0 ] || [ "$check_status" -ne 0 ] || [ "$commit_status" -ne 0 ] || [ "$push_status" -ne 0 ]; then
            exit 1
          fi

      - name: Preserve publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-milestone-publish-diagnostics
          path: /tmp/estate-milestone-publish/
          if-no-files-found: warn
          retention-days: 2
