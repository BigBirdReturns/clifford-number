name: TEMP materialize RD-01 Wave-03 cumulative promotion

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-promotion-materializer.yml'
      - '.github/tmp/build-rd01-wave03-promotion-package.py'
      - '.github/tmp/materialize-rd01-wave03-promotion.sh'
      - '.ssc-rd01-wave03-promotion-materializer/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: ssc-rd01-wave03-promotion-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: materializer
        name: Build, qualify, replay, publish, and compose promotion
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/tmp/materialize-rd01-wave03-promotion.sh
      - name: Preserve exact materializer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-promotion-materializer
          path: /tmp/ssc-rd01-wave03-promotion-materializer-receipt
          if-no-files-found: error
          retention-days: 90
      - name: Publish durable materializer checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATERIALIZER_OUTCOME: ${{ steps.materializer.outcome }}
        run: |
          set -Eeuo pipefail
          REF='archive/ssc-rd01-wave03-promotion-materializer-receipt'
          START=$(git ls-remote origin "refs/heads/$REF" | awk '{print $1}')
          if [[ -z "$START" ]]; then
            START=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$REF" -f sha="$START" >/dev/null
          fi
          git fetch --no-tags origin "$REF"
          rm -rf /tmp/rd01-promotion-materializer-receipt-branch
          git worktree add --detach /tmp/rd01-promotion-materializer-receipt-branch "origin/$REF"
          cd /tmp/rd01-promotion-materializer-receipt-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf reports/transport/ssc-rd01-wave03-promotion-materializer-latest
          mkdir -p reports/transport/ssc-rd01-wave03-promotion-materializer-latest
          cp -a /tmp/ssc-rd01-wave03-promotion-materializer-receipt/. reports/transport/ssc-rd01-wave03-promotion-materializer-latest/
          printf 'workflow_outcome: %s\nrun_id: %s\nrun_attempt: %s\nhead_sha: %s\n' "$MATERIALIZER_OUTCOME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > reports/transport/ssc-rd01-wave03-promotion-materializer-latest/workflow.txt
          git add reports/transport/ssc-rd01-wave03-promotion-materializer-latest
          git commit -m 'Update RD-01 Wave-03 promotion materializer receipt'
          git push origin "HEAD:refs/heads/$REF" --force-with-lease="refs/heads/$REF:$START"
      - name: Enforce materializer result
        if: always()
        env:
          MATERIALIZER_OUTCOME: ${{ steps.materializer.outcome }}
        run: test "$MATERIALIZER_OUTCOME" = 'success'
