name: Temporary materialize M-04B decisive acquisition wave 01

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/temporary/m04b-wave-01/**'
      - '.github/workflows/temporary-m04b-wave-01.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m04b-wave-01-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize exact source-bounded wave
        run: |
          node .github/temporary/m04b-wave-01/materialize.mjs
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          M04B_REPOSITORY="$GITHUB_REPOSITORY" node tools/dispatch-security-state-organism.mjs --dry-run
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Remove one-shot carrier and rerun final gates
        run: |
          rm -rf .github/temporary/m04b-wave-01
          rm -f .github/workflows/temporary-m04b-wave-01.yml
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          M04B_REPOSITORY="$GITHUB_REPOSITORY" node tools/dispatch-security-state-organism.mjs --dry-run
          npm run release:check
          git diff --check
      - name: Restore out-of-scope generated projections
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess, sys
          allowed_exact = {
            'data/intake/security-state-organism-evidence-intake.json',
            'data/intake/security-state-organism-source-routes.json',
            'data/intake/security-state-organism-decisive-acquisition-wave-01.json',
            'data/project/security-state-work-packages.json',
            'tools/validate-security-state-organism.mjs',
            'test/security-state-organism.test.js',
            'docs/milestones/m04b-decisive-acquisition-wave-01.md',
            '.github/workflows/temporary-m04b-wave-01.yml',
          }
          allowed_prefix = (
            'build/core-thesis/security-state-organism/',
            'reports/core-thesis/security-state-organism/',
            '.github/temporary/m04b-wave-01/',
          )
          def rows():
            return subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          def path_of(row):
            value = row[3:]
            return value.split(' -> ', 1)[-1]
          current = rows()
          paths = [path_of(row) for row in current]
          bad_rows = [row for row in current if (lambda p: p not in allowed_exact and not p.startswith(allowed_prefix))(path_of(row))]
          print('all changed paths before scope reconciliation:')
          print('\n'.join(paths))
          for row in bad_rows:
            status = row[:2]
            target = path_of(row)
            print(f'restoring out-of-scope projection: {status} {target}')
            if status == '??':
              p = pathlib.Path(target)
              if p.is_dir(): shutil.rmtree(p)
              elif p.exists() or p.is_symlink(): p.unlink()
            else:
              subprocess.run(['git','restore','--worktree','--staged','--',target], check=True)
          remaining = rows()
          remaining_bad = [path_of(row) for row in remaining if (lambda p: p not in allowed_exact and not p.startswith(allowed_prefix))(path_of(row))]
          print('remaining scoped paths:')
          print('\n'.join(path_of(row) for row in remaining))
          if remaining_bad:
            print('unreconciled out-of-scope drift:', *remaining_bad, sep='\n', file=sys.stderr)
            sys.exit(1)
          PY
          node tools/build-security-state-organism.mjs
          node tools/validate-security-state-organism.mjs
          node test/security-state-organism.test.js
          M04B_REPOSITORY="$GITHUB_REPOSITORY" node tools/dispatch-security-state-organism.mjs --dry-run
          git diff --check
      - name: Commit verified permanent wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/temporary/m04b-wave-01 \
            .github/workflows/temporary-m04b-wave-01.yml \
            data/intake/security-state-organism-evidence-intake.json \
            data/intake/security-state-organism-source-routes.json \
            data/intake/security-state-organism-decisive-acquisition-wave-01.json \
            data/project/security-state-work-packages.json \
            tools/validate-security-state-organism.mjs \
            test/security-state-organism.test.js \
            docs/milestones/m04b-decisive-acquisition-wave-01.md \
            build/core-thesis/security-state-organism \
            reports/core-thesis/security-state-organism
          git commit -m "Execute M-04B decisive acquisition wave 01"
          target="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target"
