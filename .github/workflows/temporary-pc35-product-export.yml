name: TEMP export exact PC-35 product

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc35-product-export.yml'
      - '.pc35-product-export.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-identity-boundary-assurance-v6
          fetch-depth: 1
      - name: Export exact carrier with diagnostics
        run: |
          set -Eeuo pipefail
          out=/tmp/pc35-export
          mkdir -p "$out/shards"
          mapfile -t parts < <(find .pc35 -maxdepth 1 -type f -name 'payload-*.b64' | sort)
          printf '%s\n' "${parts[@]}" > "$out/shard-paths.txt"
          cp "${parts[@]}" "$out/shards/"
          wc -c "${parts[@]}" > "$out/shard-sizes.txt"
          sha256sum "${parts[@]}" > "$out/shard-sha256.txt"
          carrier="$out/pc35-product.tar.gz.b64"
          : > "$carrier"
          for part in "${parts[@]}"; do tr -d '\r\n\t ' < "$part" >> "$carrier"; done
          stat -c '%s' "$carrier" > "$out/carrier-bytes.txt"
          sha256sum "$carrier" > "$out/carrier-sha256.txt"
          git rev-parse HEAD > "$out/source-head.txt"
          set +e
          base64 --decode "$carrier" > "$out/pc35-product.tar.gz" 2> "$out/base64-decode.stderr"
          decode_status=$?
          printf '%s\n' "$decode_status" > "$out/base64-decode.status"
          if test "$decode_status" = 0; then
            sha256sum "$out/pc35-product.tar.gz" > "$out/pc35-product.sha256"
            tar -tzf "$out/pc35-product.tar.gz" > "$out/tar-list.raw" 2> "$out/tar-list.stderr"
            tar_status=$?
            printf '%s\n' "$tar_status" > "$out/tar-list.status"
            if test "$tar_status" = 0; then
              sed 's#^\./##' "$out/tar-list.raw" | sed '/\/$/d' | sort > "$out/paths.txt"
            fi
          fi
          set -e
          cat "$out/shard-sizes.txt"
          cat "$out/carrier-bytes.txt"
          cat "$out/carrier-sha256.txt"
          test "${#parts[@]}" = 6
      - uses: actions/upload-artifact@v4
        with:
          name: pc35-carrier-diagnostic
          path: /tmp/pc35-export
          if-no-files-found: error
          retention-days: 7
