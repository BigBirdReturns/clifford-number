name: Temporary export exact SSC SG-10 target tree

on:
  push:
    branches: [agent/ssc-sg10-final-materializer]
    paths:
      - '.github/workflows/temporary-materialize-ssc-sg10-final.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-ssc-sg10-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact target commit and tree receipts
        env:
          TARGET_BRANCH: agent/ssc-wave02-maintainer-review-sg10-v2
          EXPECTED_HEAD: 8665d17120b936a1bc6cfee42d01a405cbdb11b6
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          actual=$(git rev-parse "origin/$TARGET_BRANCH")
          test "$actual" = "$EXPECTED_HEAD"
          tree=$(git rev-parse "$actual^{tree}")
          echo "TARGET_COMMIT=$actual"
          echo "TARGET_TREE=$tree"
          git diff-tree --no-commit-id --name-only -r "$actual" | sort
          test "$(git diff-tree --no-commit-id --name-only -r "$actual" | wc -l)" -eq 9
