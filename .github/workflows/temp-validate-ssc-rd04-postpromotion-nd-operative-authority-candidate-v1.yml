              'graph_effect': 'none',
              'promotion_authority_created': False,
              'next_authorized_operation': 'construct a separate permanent one-cell promotion product over this exact parent, candidate, source, and validation receipt; exclude the waiver-period hold',
          }

          payload = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          (out / 'validation-receipt.json').write_text(payload)
          (out / 'validation-receipt-sha256.txt').write_text(hashlib.sha256(payload.encode()).hexdigest() + '\n')
          (out / 'input-inventory.json').write_text(json.dumps(inventory, indent=2, sort_keys=True) + '\n')
          (out / 'candidate-validation.json').write_text(json.dumps(validation, indent=2, sort_keys=True) + '\n')
          print('rd04_nd_operative_authority_validation=pass candidates=1 held=1 matrix=226/450')
          PY

          stage=reconfirm_live_main
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CURRENT_MAIN"
          stage=complete
          trap - ERR
          printf '%s\n' 0 > "$OUT/EXIT_CODE"
          printf '%s\n' complete > "$OUT/STAGE"

      - name: Upload exact validation custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-nd-operative-authority-validation-v1
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-nd-operative-authority-validation-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Report typed validation result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          R="$RUNNER_TEMP/ssc-rd04-postpromotion-nd-operative-authority-validation-v1/validation-receipt.json"
          test -s "$R"
          {
            printf '%s\n\n' 'RD-04 North Dakota operative-authority candidate reached a typed exact-current-cell validation result.'
            printf '%s\n' '```text'
            printf 'state: %s\n' "$(jq -r .state "$R")"
            printf 'stage: %s\n' "$(jq -r .failed_or_final_stage "$R")"
            printf 'execution_parent: %s\n' "$(jq -r .execution_parent "$R")"
            printf 'candidate_count: %s\n' "$(jq -r .candidate_count "$R")"
            printf 'admissible_candidate_count: %s\n' "$(jq -r .admissible_candidate_count "$R")"
            printf 'validated_open_cell_count: %s\n' "$(jq -r .validated_open_cell_count "$R")"
            printf 'excluded_held_cell_count: %s\n' "$(jq -r .excluded_held_cell_count "$R")"
            printf 'terminal_cells_before: %s\n' "$(jq -r '.matrix_transition_if_separately_promoted.terminal_cells_before // "none"' "$R")"
            printf 'terminal_cells_after_if_promoted: %s\n' "$(jq -r '.matrix_transition_if_separately_promoted.terminal_cells_after // "none"' "$R")"
            printf 'open_substantive_cells_after_if_promoted: %s\n' "$(jq -r '.matrix_transition_if_separately_promoted.open_substantive_cells_after // "none"' "$R")"
            printf 'matrix_updates: %s\n' "$(jq -r .matrix_updates "$R")"
            printf 'field_terminalizations: %s\n' "$(jq -r .field_terminalizations "$R")"
            printf 'row_state_mutations: %s\n' "$(jq -r .row_state_mutations "$R")"
            printf 'class_closed: %s\n' "$(jq -r .class_closed "$R")"
            printf '%s\n\n' '```'
            printf '%s\n' 'This lane creates validation custody only. A separate permanent one-cell product remains required, and the waiver-period hold remains outside its denominator.'
          } > /tmp/rd04-nd-operative-authority-validation-result.md
          gh issue comment 1017 --repo "$GITHUB_REPOSITORY" --body-file /tmp/rd04-nd-operative-authority-validation-result.md

      - name: Preserve fail-closed conclusion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-nd-operative-authority-validation-v1"
          R="$OUT/validation-receipt.json"
          test "${{ steps.validation.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e \
            --arg parent "$CURRENT_MAIN" \
            --arg matrix "$MATRIX_BLOB" \
            --arg candidate "$CANDIDATE_BLOB" \
            --arg fields "$FIELD_BLOB" \
            --arg capture "$CAPTURE_BLOB" \
            --arg sources "$SOURCE_BLOB" \
            --arg html "$HTML_BLOB" \
            --arg duplication "$DUPLICATION_BLOB" \
            --arg manifest "$MANIFEST_BLOB" \
            --arg proof_digest "$POSTMERGE_ARTIFACT_DIGEST" \
            --arg proof_receipt "$POSTMERGE_RECEIPT_SHA256" \
            '.state=="validated" and
             .failed_or_final_stage=="complete" and
             .exit_code==0 and
             .execution_parent==$parent and
             .postmerge_proof.artifact_digest==$proof_digest and
             .postmerge_proof.receipt_sha256==$proof_receipt and
             .input_inventory.matrix.git_blob==$matrix and
             .input_inventory.candidate_protocol.git_blob==$candidate and
             .input_inventory.field_adjudications.git_blob==$fields and
             .input_inventory.capture_custody.git_blob==$capture and
             .input_inventory.source_adjudications.git_blob==$sources and
             .input_inventory.html_review_receipts.git_blob==$html and
             .input_inventory.transport_duplication_ledger.git_blob==$duplication and
             .input_inventory.product_manifest.git_blob==$manifest and
             .candidate_count==1 and
             .admissible_candidate_count==1 and
             .validated_open_cell_count==1 and
             .excluded_held_cell_count==1 and
             .candidate_validation.current_cell_canonical_sha256=="1e857cb90de38207a82ca2f844083ea56ef8d616c0aa229d135b0bb53f0cc382" and
             .excluded_held_decision.current_cell_canonical_sha256=="cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe" and
             .excluded_held_decision.disposition=="temporal_or_scope_ambiguity_hold_open" and
             .matrix_transition_if_separately_promoted.terminal_cells_before==226 and
             .matrix_transition_if_separately_promoted.terminal_cells_after==227 and
             .matrix_transition_if_separately_promoted.open_substantive_cells_before==184 and
             .matrix_transition_if_separately_promoted.open_substantive_cells_after==183 and
             .matrix_transition_if_separately_promoted.terminal_units_after==10 and
             .matrix_transition_if_separately_promoted.nd_row_state_after=="still_open" and
             .source_requests==0 and
             .route_executions==0 and
             .source_admissions_created==0 and
             .matrix_updates==0 and
             .field_terminalizations==0 and
             .row_state_mutations==0 and
             .class_closed==false and
             .cumulative_ledger_effect=="none" and
             .outside_human_dependency==false and
             .publication_effect=="none" and
             .adoption_effect=="none" and
             .graph_effect=="none" and
             .promotion_authority_created==false' \
            "$R" > /dev/null
