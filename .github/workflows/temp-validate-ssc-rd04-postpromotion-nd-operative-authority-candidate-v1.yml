                  'artifact_bytes': int(os.environ['POSTMERGE_ARTIFACT_BYTES']),
                  'artifact_digest': os.environ['POSTMERGE_ARTIFACT_DIGEST'],
                  'receipt_sha256': os.environ['POSTMERGE_RECEIPT_SHA256'],
              },
              'input_inventory': inventory,
              'candidate_count': 1,
              'admissible_candidate_count': 1,
              'validated_open_cell_count': 1,
              'excluded_held_cell_count': 1,
              'candidate_validation': validation,
              'excluded_held_decision': {
                  'decision_id': held['decision_id'],
                  'field_id': held['field_id'],
                  'disposition': held['disposition'],
                  'current_cell_state': waiver_cell['state'],
                  'current_cell_terminal': waiver_cell['terminal'],
                  'current_cell_canonical_sha256': waiver_cell_sha,
