name: Counter-Selector Wave 11 Batch 04 acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-11.yml'
      - 'data/project/counter-selector-wave-11-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b04-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b04.json'
      - 'schemas/counter-selector-artifact-acquisition-b04.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition-b04.md'
      - 'docs/milestones/counter-selector-wave-11.md'
      - 'tools/build-counter-selector-wave-11.mjs'
      - 'tools/validate-counter-selector-wave-11.mjs'
      - 'test/counter-selector-wave-11.test.js'
      - 'reports/core-thesis/counter-selector-wave-11/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-11-b04-acquisition'
    paths:
      - '.github/workflows/counter-selector-wave-11.yml'
      - 'data/project/counter-selector-wave-11-*.json'
      - 'data/project/counter-selector-artifact-acquisition-b04-registry.json'
      - 'data/project/counter-selector-blind-packet-registry-b04.json'
      - 'schemas/counter-selector-artifact-acquisition-b04.schema.json'
      - 'docs/methods/counter-selector-artifact-acquisition-b04.md'
      - 'docs/milestones/counter-selector-wave-11.md'
      - 'tools/build-counter-selector-wave-11.mjs'
      - 'tools/validate-counter-selector-wave-11.mjs'
      - 'test/counter-selector-wave-11.test.js'
      - 'reports/core-thesis/counter-selector-wave-11/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 11 products
        run: node tools/build-counter-selector-wave-11.mjs
      - name: Validate Batch 04 acquisition contract
        run: node tools/validate-counter-selector-wave-11.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-11.test.js
      - name: Require exact committed Wave 11 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-artifact-acquisition-b04-registry.json \
            data/project/counter-selector-blind-packet-registry-b04.json \
            data/project/counter-selector-wave-11-release-manifest.json \
            reports/core-thesis/counter-selector-wave-11/data.json \
            reports/core-thesis/counter-selector-wave-11/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 11 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-11.mjs
          node tools/validate-counter-selector-wave-11.mjs
          node test/counter-selector-wave-11.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
