name: TEMP materialize exact RD-06 terminal closure

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd06-terminal-materializer-v1.yml'
      - '.rd06-terminal/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-ssc-rd06-terminal-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd06-terminal-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_BRANCH: agent/ssc-rd-wave02-rd06-offeror-universe
      CARRIER_BRANCH: agent/ssc-rd06-terminal-materializer-base-v1
      CENSUS_ARTIFACT_ID: 8866994583
      CENSUS_ARTIFACT_SHA256: ecc0825cee7baa3eab942e670b11b898b2aa991c738a117a5900ff65289f111f
      CENSUS_MANIFEST_SHA256: ad9f4275277e3d434f2bc772f3a2cfef01529ed6e747f3e18abc7e556c865ba6
      CENSUS_DEST: data/intake/status-sovereignty-rd-wave02-rd06-offeror-universe/source-custody/public-record-census-v1
      EXECUTION_RECEIPT_PATH: data/intake/status-sovereignty-rd-wave02-rd06-offeror-universe/public-record-census-execution-receipt.json
      PRODUCT_ROOT: data/research/status-sovereignty-rd-wave02-rd06-offeror-universe
      CLOSURE_REFERENCE_PATH: data/project/ssc-residual-wave02/closures/RD-06-C01.json
      SOURCE_ZIP_SHA256: 528c990ceb97656786fabed03050a4ce526309910dbb952d9553fafb69dd605f
      SOURCE_BASE64_SHA256: 8d9cc4e022ddcd0353e07075776876ace3e3d403dfb31370bf213cec15aeee5a
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd-wave02-rd06-offeror-universe
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconstruct and execute checksum-bound materializer
        run: |
          set -Eeuo pipefail
          export EXPECTED_START_SHA="$(git rev-parse HEAD)"
          observed_target="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test -n "$EXPECTED_START_SHA"
          test "$observed_target" = "$EXPECTED_START_SHA"
          echo "execution-time exact lease: ${EXPECTED_START_SHA}"

          git fetch origin "refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"
          : > /tmp/rd06-materialize.b64
          expected_bytes=(6000 6000 2788)
          expected_sha=(
            95674e3ec625451a8d35e000d32824205749d65fc1d17fc18a92ac7f7d840d43
            1e80e99eaac0b458ffd2e9489d30c7618ab83bd4b0edcc0aff9456f70955323f
            a3eae1794dd68c81f55fa253468b2191e07a52fb67bc5caf58c50a833c12e87e
          )
          for index in 0 1 2; do
            part="$(printf '%02d' "$index")"
            git show "origin/${CARRIER_BRANCH}:.rd06-terminal/materializer/part-${part}.b64" > "/tmp/rd06-materialize-part-${part}.b64"
            test "$(wc -c < "/tmp/rd06-materialize-part-${part}.b64" | tr -d ' ')" = "${expected_bytes[$index]}"
            test "$(sha256sum "/tmp/rd06-materialize-part-${part}.b64" | awk '{print $1}')" = "${expected_sha[$index]}"
            cat "/tmp/rd06-materialize-part-${part}.b64" >> /tmp/rd06-materialize.b64
          done
          test "$(wc -c < /tmp/rd06-materialize.b64 | tr -d ' ')" = '14788'
          test "$(sha256sum /tmp/rd06-materialize.b64 | awk '{print $1}')" = '4b86eedec4f402d370608628b296eb5a955f94537e393aafb9fb3c66677f0e97'
          base64 --decode /tmp/rd06-materialize.b64 > /tmp/rd06-materialize.sh
          test "$(wc -c < /tmp/rd06-materialize.sh | tr -d ' ')" = '11090'
          test "$(sha256sum /tmp/rd06-materialize.sh | awk '{print $1}')" = 'c8b084488e17c5e12847ba7f5064a4f49c28a18843caa81b3d272e122d923201'
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/rd06-materialize.sh')
          text = path.read_text()

          repository_expression = '$' + '{{ github.repository }}'
          assert text.count(repository_expression) == 1, text.count(repository_expression)
          text = text.replace(repository_expression, 'BigBirdReturns/clifford-number')

          marker = 'rm -rf /tmp/rd06-census /tmp/rd06-census.zip'
          assert text.count(marker) == 1, text.count(marker)
          repair = r'''python - <<'INNER_PY'
          from pathlib import Path
          import re

          builder = Path('/tmp/rd06-authored/tools/build-status-sovereignty-rd-wave02-rd06-offeror-universe.mjs')
          source = builder.read_text()
          pattern = re.compile(
              r"ok\(\s*seed\.closure_target\s*===\s*[^,]+,\s*['\"]seed closure target changed['\"]\s*\);",
              re.MULTILINE | re.DOTALL,
          )
          matches = list(pattern.finditer(source))
          assert len(matches) == 1, len(matches)
          replacement = "ok(seed.closure_target === 'bidder, offeror, architecture, subcontractor, withdrawal, and nonresponsive public universe', 'seed closure target changed');"
          repaired = pattern.sub(replacement, source, count=1)
          assert repaired.count('seed closure target changed') == 1
          assert repaired.count('bidder, offeror, architecture, subcontractor, withdrawal, and nonresponsive public universe') >= 1
          assert 'complete bidder, offeror, architecture, subcontractor, withdrawal, and nonresponsive universe' in repaired
          builder.write_text(repaired)
          INNER_PY
          '''
          text = text.replace(marker, repair + marker)
          path.write_text(text)
          assert repository_expression not in path.read_text()
          assert path.read_text().count('seed closure target changed') >= 1
          PY
          bash -n /tmp/rd06-materialize.sh
          bash -x /tmp/rd06-materialize.sh

      - name: Preserve terminal materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-terminal-materialization
          path: /tmp/rd06-terminal-receipt
          if-no-files-found: error
          retention-days: 90
