name: Temporary PR 2231 V128 wrapper and embedded-email qualification V2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v128-wrapper-email-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v128:
    if: github.event.pull_request.head.ref == 'agent/pr2231-v128-wrapper-email-qualification-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CONTROLLER: ${{ github.event.pul_request.head.sha }}
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      CONTROLLER_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_CONTROLLER_BRANCH: agent/pr2231-v128-wrapper-email-qualification-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover and execute the read-only V128 qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          repo=BigBirdReturns/clifford-number
          payload_blob=31064470130136f98443babc8fefd6a4fa91ac7b
          payload_size=6368
          payload_sha256=13aff2ae6c6490f9c1004d963bd1019f129ff2d6c9b5914ab0df7a9181e13f87
          qualifier_blob=3c468ed8a2f0ba0cf0f3faa6b973fb85eae67915
          qualifier_size=24757
          qualifier_sha256=72b645d3903b377a4b2513eb417164a7c8dbcafae60a7d8ff2a01b2cf9570087
          envelope=/tmp/pr2231-v128-wrapper-email-controller-v2
          payload="$envelope/qualifier-v128.sh.xz"
          qualifier="$envelope/qualifier-v128.sh"
          wrapper_log="$envelope/controller.log"
          rm -rf "$envelope"
          mkdir -p "$envelope"
          : > "$wrapper_log"
          exec > >(tee -a "$wrapper_log") 2>&1

          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'outer_status=%s\nmode=read-only-v128-qualification-v2\n' "$rc" > "$envelope/controller-status.env"
            find "$envelope" -type f -printf '%P\t%s\n' | sort > "$envelope/envelope-manifest.txt"
            find "$envelope" -type f ! -name envelope-sha256.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$envelope/envelope-sha256.txt"
            exit "$rc"
          }
          trap preserve EXIT

          test "$CONTROLLER_BRANCH" = "$EXPECTED_CONTROLLER_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          gh api "repos/$repo/git/blobs/$payload_blob" --jq '.content' \
            | tr -d '\n' | base64 -d > "$payload"
          test "$(wc -c < "$payload")" = "$payload_size"
          test "$(git hash-object "$payload")" = "$payload_blob"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$payload_sha256"
          xz -dc "$payload" > "$qualifier"
          test "$(wc -c < "$qualifier")" = "$qualifier_size"
          test "$(git hash-object "$qualifier")" = "$qualifier_blob"
          test "$(sha256sum "$qualifier" | awk '{print $1}')" = "$qualifier_sha256"
          chmod 0755 "$qualifier"
          bash -n "$qualifier"
          printf 'payload_blob=%s\npayload_sha256=%s\nqualifier_blob=%s\nqualifier_sha256=%s\n' \
            "$payload_blob" "$payload_sha256" "$qualifier_blob" "$qualifier_sha256" \
            > "$envelope/qualifier-provenance.txt"
          bash "$qualifier"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v128-wrapper-email-qualification-v2
          path: |
            /tmp/pr2231-v128-qualification-v1
            /tmp/pr2231-v128-wrapper-email-controller-v2
          if-no-files-found: error
          retention-days: 90
