name: M-05 admission-execution product materializer

on:
  push:
    branches:
      - agent/m05-s03-l7-admission-execution-materializer-v1
    paths:
      - '.tmp/m05-admission-execution/**'
      - '.github/workflows/m05-admission-execution-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-admission-execution-materializer-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove carrier syntax
        run: node --check .tmp/m05-admission-execution/materialize.mjs
      - name: Materialize exact admission-execution product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .tmp/m05-admission-execution/materialize.mjs
