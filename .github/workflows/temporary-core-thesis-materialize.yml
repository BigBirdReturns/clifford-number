name: Temporary materialize core thesis atlas

on:
  push:
    branches:
      - agent/core-thesis-conversion-architecture-v2
    paths:
      - '.github/workflows/temporary-core-thesis-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-core-thesis-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-thesis-conversion-architecture-v2
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate the durable thesis
        run: |
          set -euo pipefail
          node tools/build-core-thesis.mjs
          node tools/validate-core-thesis.mjs
          node test/core-thesis.test.js
      - name: Commit deterministic products and remove transport
        run: |
          set -euo pipefail
          rm -f data/project/.core-thesis-branch-probe
          rm -f .github/workflows/temporary-core-thesis-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize the core thesis and estate alignment atlas'
      - name: Run the complete release gate on the committed tree
        run: npm run release:check
      - name: Push the permanent branch state
        run: git push origin HEAD:agent/core-thesis-conversion-architecture-v2
