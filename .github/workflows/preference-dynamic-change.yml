name: Preference custody dynamic-change control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/dynamic-change.fixture.json'
      - 'tools/lib/preference-dynamic-change.mjs'
      - 'tools/compile-preference-dynamic-change.mjs'
      - 'tools/validate-preference-dynamic-change.mjs'
      - 'test/preference-dynamic-change.test.js'
      - 'docs/preference-custody-dynamic-change.md'
      - '.github/workflows/preference-dynamic-change.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile dynamic preference-change worlds
        run: node tools/compile-preference-dynamic-change.mjs
      - name: Validate longitudinal identity, measurement, exposure, and inference boundaries
        run: node tools/validate-preference-dynamic-change.mjs
      - name: Exercise conversion, composition, drift, compliance, imputation, and tamper fixtures
        run: node test/preference-dynamic-change.test.js
      - name: Preserve deterministic dynamic-change projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-dynamic-change-pc10
          path: |
            build/research/preference-dynamic-change.json
            build/research/preference-dynamic-change.md
          if-no-files-found: error
