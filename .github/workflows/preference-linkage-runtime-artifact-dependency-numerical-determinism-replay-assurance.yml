name: Preference linkage runtime artifact dependency numerical determinism replay assurance

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.fixture.json'
      - 'tools/lib/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs'
      - 'tools/compile-preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs'
      - 'tools/validate-preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs'
      - 'test/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.test.js'
      - 'docs/preference-custody-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.md'
      - '.github/workflows/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc49:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile, validate, and test PC-49
        run: |
          node tools/compile-preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs
          node tools/validate-preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs
          node test/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance
          path: |
            build/research/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.json
            build/research/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.md
          if-no-files-found: error
