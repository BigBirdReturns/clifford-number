name: Temporary PC-40 exact product materializer

on:
  pull_request:
    paths:
      - '.pc40/payload.b64'
      - '.pc40/payload.tail'
      - '.github/workflows/pc40-exact-product-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc40-exact-product-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc40-exact-product-materializer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and extract the exact twelve-file PC-40 product
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import subprocess
          import tarfile

          expected_base = 'de0b6eede3c9561d9cd5728c198fc62263b67b6d'
          expected_prefix_chars = 20116
          expected_prefix_sha256 = 'd9f87f6718170c921874feff3d3dc9b9cca51051c12e4b98559753a69d71b89a'
          expected_tail_chars = 1668
          expected_tail_sha256 = '02f312f5fb233614d319cf34d3b7fe13589df2663f93bfae8ab7baec78f5939c'
          expected_base64_chars = 21784
          expected_base64_sha256 = 'f2003caa535bc2c26df156a88de666885f4b7b1bf3ee3a280dac7d5abd7df474'
          expected_archive_bytes = 16336
          expected_archive_sha256 = '21452c3235b534c37a49f26df2a95d5edaa16e10cc7beaf4f4aa894752c70d97'
          expected = {
              'data/research/preference-custody/control-manifest-v38.json': (12153, '5e0d011fbd0129806d8ea5bccac096e5a602f57e53cd463fdeae7897ae023016'),
              'data/research/preference-custody/linkage-confidence-adjudication-assurance.fixture.json': (22839, 'bde1f9bbcfbf10bc3abc2510af4872f44df655e36148f880f52a50dad1900c82'),
              'docs/preference-custody-laboratory-floor-v38.md': (931, '2714e64a27b460bbfc6ba63fce3d27dfe479db705dbe20132ccc0af7f880a019'),
              'docs/preference-custody-linkage-confidence-adjudication-assurance.md': (929, '8349a4dc086ac1bfe88c301344439a9c59a5dcac792dcf8664239f99d38fee67'),
              'test/preference-custody-manifest-v38.test.js': (8166, 'df9ce7b351e5aa34aaf4ef611b12431149a37782d681cc2ceb0687992f30daf5'),
              'test/preference-linkage-confidence-adjudication-assurance.test.js': (9977, 'a75e9a164034fb37ebf0fdb706ffda3dcaf63a3d14a59b022a13e48e4b526de7'),
              'tools/compile-preference-custody-manifest-v38.mjs': (1706, '298e9f8f390aaa0421cacabc068a9fac5de3320339c4a0b3233e268d39fbe458'),
              'tools/compile-preference-linkage-confidence-adjudication-assurance.mjs': (1181, 'd8f58a255f5f1ad16031e53c8c5e87ec8bf0c4fe615a49d2063291ea5fe52f4d'),
              'tools/lib/preference-custody-manifest-v38.mjs': (20540, '66019565a6f7d94997ba07177b754b3b86a321f149caf8e0630627eb1e4827ef'),
              'tools/lib/preference-linkage-confidence-adjudication-assurance.mjs': (42703, 'c658a9a19c6ad624547fd2564ee126d4fe3141b12a5120cbda6c547e90aef84c'),
              'tools/validate-preference-custody-manifest-v38.mjs': (799, '1b6207ce70f1e0b3d55d9d3b8ca71c2713862076c2949086cf51e45bcbb53cc5'),
              'tools/validate-preference-linkage-confidence-adjudication-assurance.mjs': (991, '702998ea405faaa86a31962d392a44627d472d21b12125ff4b6166c6c250f5bb'),
          }

          prefix = ''.join(Path('.pc40/payload.b64').read_text().split())
          tail = ''.join(Path('.pc40/payload.tail').read_text().split())
          if len(prefix) != expected_prefix_chars:
              raise SystemExit(f'payload prefix character-count mismatch: {len(prefix)}')
          actual_prefix_sha256 = hashlib.sha256(prefix.encode()).hexdigest()
          if actual_prefix_sha256 != expected_prefix_sha256:
              raise SystemExit(f'payload prefix SHA-256 mismatch: {actual_prefix_sha256}')
          if len(tail) != expected_tail_chars:
              raise SystemExit(f'payload tail character-count mismatch: {len(tail)}')
          actual_tail_sha256 = hashlib.sha256(tail.encode()).hexdigest()
          if actual_tail_sha256 != expected_tail_sha256:
              raise SystemExit(f'payload tail SHA-256 mismatch: {actual_tail_sha256}')
          encoded = prefix + tail
          if len(encoded) != expected_base64_chars:
              raise SystemExit(f'combined payload character-count mismatch: {len(encoded)}')
          actual_base64_sha256 = hashlib.sha256(encoded.encode()).hexdigest()
          if actual_base64_sha256 != expected_base64_sha256:
              raise SystemExit(f'payload base64 SHA-256 mismatch: {actual_base64_sha256}')
          try:
              archive_bytes = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'invalid payload base64: {error}')
          if len(archive_bytes) != expected_archive_bytes:
              raise SystemExit(f'archive byte-count mismatch: {len(archive_bytes)}')
          actual_archive_sha256 = hashlib.sha256(archive_bytes).hexdigest()
          if actual_archive_sha256 != expected_archive_sha256:
              raise SystemExit(f'archive SHA-256 mismatch: {actual_archive_sha256}')

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:xz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f'archive path/order mismatch: {names}')
              for member in members:
                  member_path = Path(member.name)
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member must be a regular file: {member.name}')
                  if member_path.is_absolute() or '..' in member_path.parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())

          observed = {}
          for name, (required_bytes, required_sha256) in expected.items():
              raw = Path(name).read_bytes()
              actual_sha256 = hashlib.sha256(raw).hexdigest()
              if len(raw) != required_bytes:
                  raise SystemExit(f'file byte-count mismatch for {name}: {len(raw)}')
              if actual_sha256 != required_sha256:
                  raise SystemExit(f'file SHA-256 mismatch for {name}: {actual_sha256}')
              observed[name] = {'bytes': len(raw), 'sha256': actual_sha256}

          source_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'schema_version': 'pc40-exact-materialization-receipt@1',
              'source_head': source_head,
              'canonical_parent': expected_base,
              'payload_prefix_chars': len(prefix),
              'payload_prefix_sha256': actual_prefix_sha256,
              'payload_tail_chars': len(tail),
              'payload_tail_sha256': actual_tail_sha256,
              'payload_base64_chars': len(encoded),
              'payload_base64_sha256': actual_base64_sha256,
              'payload_archive_bytes': len(archive_bytes),
              'payload_archive_sha256': actual_archive_sha256,
              'permanent_nonworkflow_file_count': len(expected),
              'files': observed,
              'outside_human_dependency': False,
              'graph_effect': 'none',
          }
          Path('/tmp/pc40-materialization-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Qualify standalone PC-40 and compositional floor v38
        run: |
          set -euo pipefail
          node tools/compile-preference-linkage-confidence-adjudication-assurance.mjs
          node tools/validate-preference-linkage-confidence-adjudication-assurance.mjs
          node test/preference-linkage-confidence-adjudication-assurance.test.js
          node tools/compile-preference-custody-manifest-v38.mjs
          node tools/validate-preference-custody-manifest-v38.mjs
          node test/preference-custody-manifest-v38.test.js
      - name: Regress historical Preference Custody floors and no-magic-human
        run: |
          set -euo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
      - name: Publish only the exact transport-free twelve-file product
        run: |
          set -euo pipefail
          source_head=$(git rev-parse HEAD)
          base=de0b6eede3c9561d9cd5728c198fc62263b67b6d
          target=research/preference-linkage-confidence-adjudication-assurance-v1

          git fetch origin main agent/pc40-exact-product-materializer --no-tags
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git rev-parse origin/agent/pc40-exact-product-materializer)" = "$source_head"
          if git ls-remote --exit-code --heads origin "$target" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi

          paths=(
            data/research/preference-custody/control-manifest-v38.json
            data/research/preference-custody/linkage-confidence-adjudication-assurance.fixture.json
            docs/preference-custody-laboratory-floor-v38.md
            docs/preference-custody-linkage-confidence-adjudication-assurance.md
            test/preference-custody-manifest-v38.test.js
            test/preference-linkage-confidence-adjudication-assurance.test.js
            tools/compile-preference-custody-manifest-v38.mjs
            tools/compile-preference-linkage-confidence-adjudication-assurance.mjs
            tools/lib/preference-custody-manifest-v38.mjs
            tools/lib/preference-linkage-confidence-adjudication-assurance.mjs
            tools/validate-preference-custody-manifest-v38.mjs
            tools/validate-preference-linkage-confidence-adjudication-assurance.mjs
          )

          export GIT_INDEX_FILE=/tmp/pc40-index
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$base"
          git add -- "${paths[@]}"
          product_tree=$(git write-tree)
          product_commit=$(printf '%s\n' 'Materialize PC-40 nonworkflow product for Preference Custody floor v38' | git commit-tree "$product_tree" -p "$base")

          mapfile -t observed < <(git diff-tree --no-commit-id --name-only -r "$product_commit" | sort)
          mapfile -t expected < <(printf '%s\n' "${paths[@]}" | sort)
          test "$(printf '%s\n' "${observed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          test "${#observed[@]}" -eq 12
          test "$(git rev-parse "$product_commit^")" = "$base"

          unset GIT_INDEX_FILE
          git push origin "$product_commit:refs/heads/$target"
          printf '%s\n' "$product_commit" > /tmp/pc40-product-commit.txt
          printf '%s\n' "$product_tree" > /tmp/pc40-product-tree.txt
          printf '%s\n' "$base" > /tmp/pc40-product-parent.txt
          printf '%s\n' "${observed[@]}" > /tmp/pc40-product-paths.txt
      - name: Preserve exact materialization receipts
        uses: actions/upload-artifact@v4
        with:
          name: pc40-exact-materialization-receipt
          path: |
            /tmp/pc40-materialization-receipt.json
            /tmp/pc40-product-commit.txt
            /tmp/pc40-product-tree.txt
            /tmp/pc40-product-parent.txt
            /tmp/pc40-product-paths.txt
          if-no-files-found: error
          retention-days: 90
