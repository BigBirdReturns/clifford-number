name: Temporary PR 2231 V118 identifier observation partition qualifier R1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/temporary-pr2231-v118-identifier-observation-partition-qualifier-r1.yml

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pr2231-v118-identifier-observation-partition-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v118:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      EXPECTED_MAIN: 771a64b6b467748d2f4df667b5f78e76f9432d69
      EXPECTED_PRODUCT: 6c4acfb15047dcc6a28dca87732fe2c4c7e7b1e6
      EXPECTED_PRODUCT_TREE: d0e42c6312bda625474e557a691b1b2b981e9902
      EXPECTED_LIBRARY: 5582c5310f6413de43c13a151abddc84cb206c8d
      EXPECTED_TEST: 02794c0c3f18f439871cd3695c8fd9d77d083549
      REVIEW_ID: '5074298652'
      REVIEW_COMMENT_ID: '3901036540'
      REVIEW_THREAD_ID: PRRT_kwDOTGqftc6d-sYp
      CONTROLLER_BRANCH: agent/pr2231-v118-identifier-observation-partition-qualifier-r1
      CONTROLLER_PATH: .github/workflows/temporary-pr2231-v118-identifier-observation-partition-qualifier-r1.yml
      ARTIFACT_DIR: /tmp/pr2231-v118-identifier-observation-partition-r1

    steps:
      - name: Check out exact product head
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/clifford-number
          ref: 6c4acfb15047dcc6a28dca87732fe2c4c7e7b1e6
          path: product
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute exact read-only V118 qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/candidate"
          exec > >(tee "$ARTIFACT_DIR/qualification.log") 2>&1
          preserve() {
            rc=$?
            trap - EXIT
            set +e
            printf 'qualification_exit=%s\npublication=skipped\nproduct_mutation=false\nreview_mutation=false\nreadiness_mutation=false\nmerge_mutation=false\n' "$rc" > "$ARTIFACT_DIR/status.env"
            find "$ARTIFACT_DIR" -type f -printf '%P\t%s\n' | sort > "$ARTIFACT_DIR/final-manifest.txt"
            exit "$rc"
          }
          trap preserve EXIT

          controller_pr='${{ github.event.pull_request.number }}'
          controller_head='${{ github.event.pull_request.head.sha }}'
          test "${{ github.event.pull_request.head.ref }}" = "$CONTROLLER_BRANCH"

          live_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main" = "$EXPECTED_MAIN"
          gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$ARTIFACT_DIR/product-before.json"
          gh api "repos/$REPO/pulls/$controller_pr" > "$ARTIFACT_DIR/controller-before.json"
          jq -e --arg head "$EXPECTED_PRODUCT" --arg base "$EXPECTED_MAIN" --arg branch "$PRODUCT_BRANCH" '
            .state == "open" and .draft == true and .merged == false
            and .head.sha == $head and .head.ref == $branch
            and .base.sha == $base and .commits == 1 and .changed_files == 2
          ' "$ARTIFACT_DIR/product-before.json" >/dev/null
          jq -e --arg head "$controller_head" --arg base "$EXPECTED_MAIN" --arg branch "$CONTROLLER_BRANCH" '
            .state == "open" and .draft == true and .merged == false
            and .head.sha == $head and .head.ref == $branch
            and .base.sha == $base and .commits == 1 and .changed_files == 1
          ' "$ARTIFACT_DIR/controller-before.json" >/dev/null

          gh api "repos/$REPO/pulls/comments/$REVIEW_COMMENT_ID" > "$ARTIFACT_DIR/review-comment-before.json"
          jq -e --arg commit "$EXPECTED_PRODUCT" --argjson review "$REVIEW_ID" '
            .pull_request_review_id == $review
            and .commit_id == $commit
            and (.body | contains("Preserve observations before accepting identifier partitions"))
          ' "$ARTIFACT_DIR/review-comment-before.json" >/dev/null
          gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on PullRequestReviewThread { id isResolved isOutdated comments(first: 20) { nodes { databaseId } } } } }' -F id="$REVIEW_THREAD_ID" > "$ARTIFACT_DIR/review-thread-before.json"
          jq -e --arg id "$REVIEW_THREAD_ID" --argjson comment "$REVIEW_COMMENT_ID" '
            .data.node.id == $id and .data.node.isResolved == false
            and .data.node.isOutdated == false
            and any(.data.node.comments.nodes[]; .databaseId == $comment)
          ' "$ARTIFACT_DIR/review-thread-before.json" >/dev/null

          cd product
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test "$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)" = "$EXPECTED_LIBRARY"
          test "$(git rev-parse HEAD:test/industrial-exhaust.test.js)" = "$EXPECTED_TEST"
          test "$(git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_PRODUCT" | sort | paste -sd ',' -)" = 'test/industrial-exhaust.test.js,tools/lib/industrial-exhaust.mjs'

          node --input-type=module <<'NODE' | tee "$ARTIFACT_DIR/predecessor-reproduction.json"
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';
          const input = 'ID: 123-45678/3.14/(03) 6216 8041';
          const actual = redactContactData(input);
          const reviewed = 'ID: 123-45678/[contact omitted]';
          assert.equal(actual, reviewed, 'exact owner head must reproduce the reviewed observation-loss defect');
          console.log(JSON.stringify({ input, actual, reviewed, reproduced: true }, null, 2));
          NODE

          python3 - <<'PY'
          from pathlib import Path

          library = Path('tools/lib/industrial-exhaust.mjs')
          source = library.read_text()
          marker = '  if (unoverriddenIdentifierContext && initialPartitionTransition) {'
          if source.count(marker) != 1:
              raise SystemExit(f'unexpected identifier partition marker count: {source.count(marker)}')
          insertion = '''  // Identifier-specific progression owns a complete competing observation
          // before the generic partition may interpret any of its groups as
          // contact data. The accepted later interval must begin at or beyond
          // the exact observation endpoint proved by the identifier path.
          const identifierOwnedTransitionBeforePartition = unoverriddenIdentifierContext
            ? identifierOwnedObservationPhoneTransition(
                candidate,
                groups,
                externalPrefix,
                externalSuffix,
                indeterminatePhoneContext
              )
            : null;
          if (identifierOwnedTransitionBeforePartition) {
            const { observation, laterPhone } = identifierOwnedTransitionBeforePartition;
            if (laterPhone.start < observation.end) return [];
            const prefixBeforeRemainder = `${externalPrefix}${candidate.slice(
              0,
              laterPhone.start
            )}[contact omitted]`;
            if (laterPhone.end >= candidate.length) return [laterPhone];
            return {
              ranges: [laterPhone],
              next: {
                offset: laterPhone.end,
                externalPrefix: prefixBeforeRemainder,
                externalSuffix,
                allowInitialGroup: true,
                indeterminatePhoneContext:
                  laterPhone.suppressRemainderIndeterminatePhoneContext
                    ? false
                    : indeterminatePhoneContext,
                inheritedExplicitPhoneLabelContext: false
              }
            };
          }

          '''
          source = source.replace(marker, insertion + marker, 1)
          library.write_text(source)

          test = Path('test/industrial-exhaust.test.js')
          test_source = test.read_text()
          sentinel = '// PR2231 V118 identifier-partition observation finality'
          if sentinel in test_source:
              raise SystemExit('V118 test block already present')
          test_source += r'''

          // PR2231 V118 identifier-partition observation finality
          for (const [name, input, expected] of [
            [
              'hyphen-grouped identifier preserves a decimal before a parenthesized phone',
              'ID: 123-45678/3.14/(03) 6216 8041',
              'ID: 123-45678/3.14/[contact omitted]'
            ],
            [
              'hyphen-grouped identifier preserves an ISO date before a parenthesized phone',
              'ID: 123-45678/2026-08-17/(03) 6216 8041',
              'ID: 123-45678/2026-08-17/[contact omitted]'
            ],
            [
              'space-grouped identifier preserves a unit observation before a parenthesized phone',
              'ID: 1234 5678/2026 people/(03) 6216 8041',
              'ID: 1234 5678/2026 people/[contact omitted]'
            ],
            [
              'fullwidth grouped identifier preserves a decimal before a parenthesized phone',
              'ＩＤ：１２３－４５６７８／３．１４／（０３） ６２１６ ８０４１',
              'ＩＤ：１２３－４５６７８／３．１４／[contact omitted]'
            ],
            [
              'direct parenthesized phone remains independently redactable after an identifier',
              'ID: 123-45678/(03) 6216 8041',
              'ID: 123-45678/[contact omitted]'
            ],
            [
              'bare numeric tail gains no authority through an intervening decimal',
              'ID: 123-45678/3.14/12345678',
              'ID: 123-45678/3.14/12345678'
            ]
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              `${name}: identifier custody must end before a complete observation and only a disjoint validated phone may enter rendering`
            );
          }
          '''
          test.write_text(test_source)
          PY

          cp tools/lib/industrial-exhaust.mjs "$ARTIFACT_DIR/candidate/industrial-exhaust.mjs"
          cp test/industrial-exhaust.test.js "$ARTIFACT_DIR/candidate/industrial-exhaust.test.js"
          git diff -- tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js > "$ARTIFACT_DIR/v118.patch"
          test -s "$ARTIFACT_DIR/v118.patch"

          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node --input-type=module <<'NODE' | tee "$ARTIFACT_DIR/direct-matrix.json"
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';
          const cases = [
            ['ID: 123-45678/3.14/(03) 6216 8041', 'ID: 123-45678/3.14/[contact omitted]'],
            ['ID: 123-45678/2026-08-17/(03) 6216 8041', 'ID: 123-45678/2026-08-17/[contact omitted]'],
            ['ID: 1234 5678/2026 people/(03) 6216 8041', 'ID: 1234 5678/2026 people/[contact omitted]'],
            ['ＩＤ：１２３－４５６７８／３．１４／（０３） ６２１６ ８０４１', 'ＩＤ：１２３－４５６７８／３．１４／[contact omitted]'],
            ['ID: 123-45678/(03) 6216 8041', 'ID: 123-45678/[contact omitted]'],
            ['ID: 123-45678/3.14/12345678', 'ID: 123-45678/3.14/12345678'],
            ['Phone: ID: +33 1.42.68.53.00 / 03-6216-8041', 'Phone: ID: [contact omitted] / [contact omitted]'],
            ['Visit 192.0.2.1/+81 3 6216 5111', 'Visit 192.0.2.1/+81 3 6216 5111']
          ];
          const results = cases.map(([input, expected]) => {
            const actual = redactContactData(input);
            assert.equal(actual, expected, input);
            return { input, expected, actual, pass: true };
          });
          console.log(JSON.stringify(results, null, 2));
          NODE

          : > "$ARTIFACT_DIR/focused.log"
          for test_file in test/industrial-exhaust*.test.js; do
            printf 'RUN %s\n' "$test_file" | tee -a "$ARTIFACT_DIR/focused.log"
            node "$test_file" 2>&1 | tee -a "$ARTIFACT_DIR/focused.log"
          done
          npm run release:check 2>&1 | tee "$ARTIFACT_DIR/release.log"

          git reset --hard "$EXPECTED_PRODUCT"
          git clean -fd
          cp "$ARTIFACT_DIR/candidate/industrial-exhaust.mjs" tools/lib/industrial-exhaust.mjs
          cp "$ARTIFACT_DIR/candidate/industrial-exhaust.test.js" test/industrial-exhaust.test.js
          mapfile -t changed_paths < <(git diff --name-only | sort)
          test "${#changed_paths[@]}" -eq 2
          printf '%s\n' "${changed_paths[@]}" > "$ARTIFACT_DIR/candidate-paths.txt"
          printf '%s\n' test/industrial-exhaust.test.js tools/lib/industrial-exhaust.mjs | sort > "$ARTIFACT_DIR/expected-paths.txt"
          diff -u "$ARTIFACT_DIR/expected-paths.txt" "$ARTIFACT_DIR/candidate-paths.txt"

          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          candidate_tree="$(git write-tree)"
          candidate_commit="$(printf '%s\n\n%s\n' 'fix: preserve observations before identifier partitions' 'Give complete observations exclusive source custody before identifier-partition telephone admission.' | git commit-tree "$candidate_tree" -p "$EXPECTED_MAIN")"
          candidate_library="$(git rev-parse "$candidate_commit:tools/lib/industrial-exhaust.mjs")"
          candidate_test="$(git rev-parse "$candidate_commit:test/industrial-exhaust.test.js")"
          test "$(git rev-parse "$candidate_commit^")" = "$EXPECTED_MAIN"
          test "$(git diff --name-only "$EXPECTED_MAIN" "$candidate_commit" | sort | paste -sd ',' -)" = 'test/industrial-exhaust.test.js,tools/lib/industrial-exhaust.mjs'
          {
            printf 'candidate_commit=%s\n' "$candidate_commit"
            printf 'parent=%s\n' "$EXPECTED_MAIN"
            printf 'tree=%s\n' "$candidate_tree"
            printf 'library_blob=%s\n' "$candidate_library"
            printf 'test_blob=%s\n' "$candidate_test"
            printf 'library_sha256=%s\n' "$(sha256sum tools/lib/industrial-exhaust.mjs | awk '{print $1}')"
            printf 'test_sha256=%s\n' "$(sha256sum test/industrial-exhaust.test.js | awk '{print $1}')"
          } | tee "$ARTIFACT_DIR/candidate.env"

          cd ..
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api "repos/$REPO/pulls/$PRODUCT_PR" > "$ARTIFACT_DIR/product-after.json"
          gh api "repos/$REPO/pulls/comments/$REVIEW_COMMENT_ID" > "$ARTIFACT_DIR/review-comment-after.json"
          gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on PullRequestReviewThread { id isResolved isOutdated comments(first: 20) { nodes { databaseId } } } } }' -F id="$REVIEW_THREAD_ID" > "$ARTIFACT_DIR/review-thread-after.json"
          jq '{state,draft,merged,head_ref:.head.ref,head_sha:.head.sha,base_ref:.base.ref,base_sha:.base.sha,commits,changed_files}' "$ARTIFACT_DIR/product-before.json" > "$ARTIFACT_DIR/product-before-stable.json"
          jq '{state,draft,merged,head_ref:.head.ref,head_sha:.head.sha,base_ref:.base.ref,base_sha:.base.sha,commits,changed_files}' "$ARTIFACT_DIR/product-after.json" > "$ARTIFACT_DIR/product-after-stable.json"
          cmp "$ARTIFACT_DIR/product-before-stable.json" "$ARTIFACT_DIR/product-after-stable.json"
          cmp "$ARTIFACT_DIR/review-comment-before.json" "$ARTIFACT_DIR/review-comment-after.json"
          cmp "$ARTIFACT_DIR/review-thread-before.json" "$ARTIFACT_DIR/review-thread-after.json"
          printf 'PUBLICATION_SKIPPED\nQUALIFICATION_SUCCESS\n' | tee "$ARTIFACT_DIR/terminal.txt"

      - name: Upload V118 qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-v118-identifier-observation-partition-r1
          path: /tmp/pr2231-v118-identifier-observation-partition-r1
          if-no-files-found: error
          retention-days: 90
