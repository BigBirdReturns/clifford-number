name: M-05 story ecology and answerable power

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-*.json'
      - 'data/intake/m05-answerable-power-*.json'
      - 'docs/methods/answerable-power-story-ecology.md'
      - 'docs/milestones/m05-answerable-power-*.md'
      - 'tools/*m05-answerable-power*.mjs'
      - 'test/m05-answerable-power.test.js'
      - 'test/m05-answerable-power-sprint-01.test.js'
      - 'test/m05-answerable-power-sprint-02-leg-01.test.js'
      - 'reports/core-thesis/answerable-power/**'
      - '.github/workflows/m05-answerable-power.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-*.json'
      - 'data/intake/m05-answerable-power-*.json'
      - 'docs/methods/answerable-power-story-ecology.md'
      - 'docs/milestones/m05-answerable-power-*.md'
      - 'tools/*m05-answerable-power*.mjs'
      - 'test/m05-answerable-power.test.js'
      - 'test/m05-answerable-power-sprint-01.test.js'
      - 'test/m05-answerable-power-sprint-02-leg-01.test.js'
      - 'reports/core-thesis/answerable-power/**'
      - '.github/workflows/m05-answerable-power.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test M-05
        run: |
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/build-m05-answerable-power-sprint-01.mjs
          node tools/validate-m05-answerable-power-sprint-01.mjs
          node test/m05-answerable-power-sprint-01.test.js
          node tools/build-m05-answerable-power-sprint-02-leg-01.mjs
          node tools/validate-m05-answerable-power-sprint-02-leg-01.mjs
          node test/m05-answerable-power-sprint-02-leg-01.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic products
        run: |
          git restore --staged --worktree .
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/build-m05-answerable-power-sprint-01.mjs
          node tools/validate-m05-answerable-power-sprint-01.mjs
          node test/m05-answerable-power-sprint-01.test.js
          node tools/build-m05-answerable-power-sprint-02-leg-01.mjs
          node tools/validate-m05-answerable-power-sprint-02-leg-01.mjs
          node test/m05-answerable-power-sprint-02-leg-01.test.js
          git diff --exit-code
