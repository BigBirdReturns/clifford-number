name: Apply POOF shallow-base hardening once

on:
  pull_request:
    branches: [main]
    paths:
      - '.poof-shallow-base-hardening-launch'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/poof-clifford-ecology'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/poof-clifford-ecology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply shallow-base constitutional hardening
        run: |
          python3 -m py_compile .github/scripts/apply-poof-shallow-base-hardening.py
          python3 .github/scripts/apply-poof-shallow-base-hardening.py
      - name: Prove constitutional and release gates
        run: |
          node tools/validate-poof-constitutional-change.mjs origin/main
          node test/poof-constitutional-change.test.js
          npm run ci:poof-ecology
          npm run release:check
          git diff --check
      - name: Remove transient source machinery
        run: |
          rm -f .poof-shallow-base-hardening-launch
          rm -f .github/scripts/apply-poof-shallow-base-hardening.py
      - name: Commit shallow-checkout hardening and regenerated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make POOF constitutional custody shallow-checkout safe"
          git push origin HEAD:agent/poof-clifford-ecology
