name: Temporary Wave 36 carrier export

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-wave36-carrier-export.yml'
      - '.github/tmp/wave36-*'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temporary-wave36-carrier-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lake-allocator-war-public-acquisition-wave-36
          fetch-depth: 0

      - name: Inventory Wave 36 carriers
        shell: bash
        run: |
          set -euo pipefail
          find .github/tmp -maxdepth 1 -type f -name 'wave36-*' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee wave36-carrier-sha256.txt
          test -s wave36-carrier-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wave36-carriers
          path: |
            .github/tmp/wave36-*
            wave36-carrier-sha256.txt
          if-no-files-found: error
          retention-days: 1
