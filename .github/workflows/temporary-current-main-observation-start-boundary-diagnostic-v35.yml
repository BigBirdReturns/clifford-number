name: Temporary current-main observation start-boundary diagnostic v35

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-current-main-observation-start-boundary-diagnostic-v35.yml'

permissions:
  contents: read

concurrency:
  group: current-main-observation-start-boundary-diagnostic-v35
  cancel-in-progress: false

jobs:
  reproduce:
    if: github.repository == 'BigBirdReturns/clifford-number' && github.event.pull_request.number == 2227
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_MAIN: 2d2c7b6cd7517ca25854e481b21774a697d0e76b
      PRODUCT_HEAD: 456ee43cb8a0d3c1afeeed8b9f7342219a3fac05
      CARRIER_PARENT: d5f597400102ab7a73440ab6ff2b494a08ea3219
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CARRIER_BRANCH: agent/current-main-identifier-context-v1
      PRODUCT_LIBRARY: dbf28c75e6681ca06915ccc2e85062f67382175f
      PRODUCT_TEST: 08b3cd4014b916d1ac5845c73c59f7d55dbae7ef
      PRODUCT_WORK: /tmp/observation-start-boundary-product-v35
      RECEIPT_FILE: /tmp/observation-start-boundary-diagnostic-v35.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate exact diagnostic leases
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test '${{ github.event.pull_request.head.ref }}' = "$CARRIER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$CARRIER_PARENT"
          test "$(git diff --name-only "$CARRIER_PARENT..HEAD")" = '.github/workflows/temporary-current-main-observation-start-boundary-diagnostic-v35.yml'

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "+refs/heads/$CARRIER_BRANCH:refs/remotes/origin/$CARRIER_BRANCH"
          LIVE_MAIN="$(git rev-parse refs/remotes/origin/main)"
          LIVE_PRODUCT="$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)"
          LIVE_CARRIER="$(git rev-parse refs/remotes/origin/$CARRIER_BRANCH)"
          printf 'main=%s\nproduct=%s\ncarrier=%s\n' "$LIVE_MAIN" "$LIVE_PRODUCT" "$LIVE_CARRIER"
          test "$LIVE_MAIN" = "$EXPECTED_MAIN"
          test "$LIVE_PRODUCT" = "$PRODUCT_HEAD"
          test "$LIVE_CARRIER" = "$HEAD_SHA"
          test "$(git rev-parse "$PRODUCT_HEAD^")" = "$EXPECTED_MAIN"
          test "$(git rev-parse "$PRODUCT_HEAD:tools/lib/industrial-exhaust.mjs")" = "$PRODUCT_LIBRARY"
          test "$(git rev-parse "$PRODUCT_HEAD:test/industrial-exhaust.test.js")" = "$PRODUCT_TEST"

      - name: Reproduce observation-start aliasing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PRODUCT_WORK"
          git worktree prune
          git worktree add --detach "$PRODUCT_WORK" "$PRODUCT_HEAD"
          cd "$PRODUCT_WORK"

          RECEIPT_FILE="$RECEIPT_FILE" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          const cases = [
            {
              name: 'ascii-hyphen-date-then-pair-grouped-phone',
              input: 'Phone: 09012345678 2026-08-17 01 42 68 53 00',
              expected: 'Phone: [contact omitted] 2026-08-17 [contact omitted]'
            },
            {
              name: 'ascii-period-date-then-pair-grouped-phone',
              input: 'Phone: 09012345678 2026.08.17.03 62 16 80 41',
              expected: 'Phone: [contact omitted] 2026.08.17.[contact omitted]'
            },
            {
              name: 'fullwidth-date-then-pair-grouped-phone',
              input: '電話番号：０９０１２３４５６７８ ２０２６－０８－１７ ０３ ６２ １６ ８０ ４１',
              expected: '電話番号：[contact omitted] ２０２６－０８－１７ [contact omitted]'
            },
            {
              name: 'bounded-context-date-then-pair-grouped-phone',
              input: `Phone ${'GUID '.repeat(4000)}record id: 09012345678 2026-08-17 01 42 68 53 00`,
              expected: `Phone ${'GUID '.repeat(4000)}record id: [contact omitted] 2026-08-17 [contact omitted]`
            }
          ];

          const results = cases.map(testCase => ({
            ...testCase,
            actual: redactContactData(testCase.input)
          }));

          for (const result of results) {
            assert.notEqual(
              result.actual,
              result.expected,
              `${result.name}: exact head no longer reproduces the start-boundary defect`
            );
            assert.match(
              result.actual.normalize('NFKC'),
              /2026-\[contact omitted\]/u,
              `${result.name}: the reproduced output must show the date split at its month`
            );
            console.log(JSON.stringify({
              name: result.name,
              expected_tail: result.expected.slice(-120),
              actual_tail: result.actual.slice(-120)
            }));
          }

          for (const control of [
            {
              input: 'Phone: 09012345678 2026-08-17 03-6216-8041',
              expected: 'Phone: [contact omitted] 2026-08-17 [contact omitted]'
            },
            {
              input: 'Phone: 09012345678 2026-08-17 1 212 555 1234',
              expected: 'Phone: [contact omitted] 2026-08-17 [contact omitted]'
            }
          ]) {
            assert.equal(redactContactData(control.input), control.expected);
          }

          fs.writeFileSync(process.env.RECEIPT_FILE, `${JSON.stringify({
            receipt_version: 'observation-start-boundary-diagnostic@35',
            main: process.env.EXPECTED_MAIN,
            product_head: process.env.PRODUCT_HEAD,
            library_blob: process.env.PRODUCT_LIBRARY,
            test_blob: process.env.PRODUCT_TEST,
            cases: results.map(result => ({
              name: result.name,
              expected_tail: result.expected.slice(-160),
              actual_tail: result.actual.slice(-160)
            })),
            controls: 'hyphenated-domestic-and-north-american-pass'
          }, null, 2)}\n`);
          NODE

      - name: Upload diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: observation-start-boundary-diagnostic-v35
          path: /tmp/observation-start-boundary-diagnostic-v35.json
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git worktree remove --force "$PRODUCT_WORK" >/dev/null 2>&1 || true
          rm -rf "$PRODUCT_WORK"
