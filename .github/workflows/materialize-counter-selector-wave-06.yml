name: Materialize Counter-Selector Wave 06 custody frontier

on:
  push:
    branches:
      - 'agent/counter-selector-wave-06-custody-finality'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-06.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-06.yml'
      - '.github/materializers/counter-selector-wave-06/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-06-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-06-custody-finality

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 06 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-06/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-06.tar.gz
          echo '7d2147a9c3036a9ae567d10faae1e03496e7160c0cce8b8095c9754ba4b9d2e0  /tmp/counter-selector-wave-06.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-06.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-06

      - name: Build, validate, and attack custody frontier
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-06.mjs
          node tools/validate-counter-selector-wave-06.mjs
          node test/counter-selector-wave-06.test.js

      - name: Commit exact non-workflow Wave 06 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-06/payload-00 \
            .github/materializers/counter-selector-wave-06/payload-01 \
            .github/materializers/counter-selector-wave-06/payload-02 \
            .github/materializers/counter-selector-wave-06/payload-03 \
            .github/materializers/counter-selector-wave-06/payload-04 \
            .github/materializers/counter-selector-wave-06/payload-05 \
            data/project/counter-selector-wave-06-custody-finality.json \
            data/project/counter-selector-wave-06-source-registry.json \
            schemas/counter-selector-custody-finality.schema.json \
            docs/methods/counter-selector-custody-finality.md \
            docs/milestones/counter-selector-wave-06.md \
            tools/build-counter-selector-wave-06.mjs \
            tools/validate-counter-selector-wave-06.mjs \
            test/counter-selector-wave-06.test.js \
            data/project/counter-selector-custody-finality-registry.json \
            data/project/counter-selector-wave-06-acquisition-routes.json \
            data/project/counter-selector-wave-06-release-manifest.json \
            reports/core-thesis/counter-selector-wave-06/data.json \
            reports/core-thesis/counter-selector-wave-06/index.html | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Refine Counter-Selector same-matter custody and finality frontier'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 06 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-06.mjs
          node tools/validate-counter-selector-wave-06.mjs
          node test/counter-selector-wave-06.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish non-workflow Wave 06 head
        run: git push origin HEAD:agent/counter-selector-wave-06-custody-finality
