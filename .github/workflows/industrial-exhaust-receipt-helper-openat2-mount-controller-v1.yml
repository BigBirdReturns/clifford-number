          INSTRUMENTATION_PATCH='/tmp/openat2-patches/instrumentation_patch.py'
          REPAIR_PATCH='/tmp/openat2-patches/repair_patch.py'
          python -m py_compile "$TEST_PATCH" "$INSTRUMENTATION_PATCH" "$REPAIR_PATCH"
          python "$TEST_PATCH"
          python "$INSTRUMENTATION_PATCH"
          set +e
          node "$TEST_PATH" > /tmp/industrial-exhaust-openat2-mount-predecessor.log 2>&1
          predecessor_status=$?
          set -e
          test "$predecessor_status" -ne 0
          grep -F 'index mount crossing may not publish into an alternate subtree' /tmp/industrial-exhaust-openat2-mount-predecessor.log
          echo 'predecessor nested-mount wrong-subtree publication reproduced'
          python "$REPAIR_PATCH"
          node --check "$LIB_PATH"
          node --check "$TEST_PATH"
          node "$TEST_PATH"
          node test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js
          node tools/hydrate-industrial-exhaust.mjs --audit
          git diff --check
          rm "$WORKFLOW_PATH"
          mapfile -t product_diff < <(git diff --name-only "$BASE_SHA")
          test "${#product_diff[@]}" -eq 2
          test "${product_diff[0]}" = "$TEST_PATH"
          test "${product_diff[1]}" = "$LIB_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          tree_sha="$(git write-tree)"
          new_sha="$(printf '%s\n\n%s\n' 'fix(industrial-exhaust): reject receipt mount crossings with openat2' 'Require openat2 no-cross-device resolution for every receipt path open and bind parent proof to the admitted root mount.' | git commit-tree "$tree_sha" -p "$BASE_SHA")"
          mapfile -t final_diff < <(git diff --name-only "$BASE_SHA" "$new_sha")
          test "${#final_diff[@]}" -eq 2
          test "${final_diff[0]}" = "$TEST_PATH"
          test "${final_diff[1]}" = "$LIB_PATH"
          git diff --check "$BASE_SHA" "$new_sha"
          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$BASE_SHA"
          git push --force-with-lease="refs/heads/${PRODUCT_BRANCH}:" origin "${new_sha}:refs/heads/${PRODUCT_BRANCH}"
