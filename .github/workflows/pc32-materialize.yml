name: Temporary PC-32 exact product materializer

on:
  pull_request:
    paths:
      - '.pc32/payload.part-*'
      - '.github/workflows/pc32-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc32-exact-product-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-pre-intake-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and extract the exact twelve-file PC-32 product
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import json
          import subprocess
          import tarfile

          expected_xz_sha256 = 'b2afad945e1815f0e063423d868b8440e995db8f4cde3cd45630bd3f1d047786'
          expected_base64_sha256 = '43cc7d0ebc8b0ef43e61b19cb9b0b117060e550384859a302befe0378389fbbd'
          expected = {
              'data/research/preference-custody/pre-intake-assurance.fixture.json': '0a642311727399f2ade96dd1bbcaf1e56059b33c321d1cd3cd0b5e0671a71c76',
              'tools/lib/preference-pre-intake-assurance.mjs': '2b6b45d6b121d2297401651889a41481e529e9568c94d3e804332d821a545c0d',
              'tools/compile-preference-pre-intake-assurance.mjs': 'c5e4e79741d41dd873494d483f2146d3411e4153da983eb3e037ce325c1292e4',
              'tools/validate-preference-pre-intake-assurance.mjs': '7263fe01a9d95fbb9254995233fc6283db0c8faba0c1303618e4685ead67b0fb',
              'test/preference-pre-intake-assurance.test.js': '94fc15797aeabce271280549b1106dd94d30509513a5c180cf9e7c7ac12e2c7c',
              'docs/preference-custody-pre-intake-assurance.md': '0bda13e139ce8c20a5196d9bd7d0ede196be213cf1f09117a804d267d8d70bcc',
              'data/research/preference-custody/control-manifest-v30.json': '1a90520cbff9e5aa47d3395a4b6e4d6b6463e2802467f56f5236d07705ec53b4',
              'tools/lib/preference-custody-manifest-v30.mjs': 'db99fc558eda032d947b01ca37917e59c760ac16621df26a2448881de7c414ce',
              'tools/compile-preference-custody-manifest-v30.mjs': 'd036306c4ec37b65f363ed5c3aab5bf960d24b73392fdf50bca057aa4088df87',
              'tools/validate-preference-custody-manifest-v30.mjs': '46d23cad4e086d674ce35a99026242527168c625a2983f63f5da90a582c905b6',
              'test/preference-custody-manifest-v30.test.js': '435fb94242e23d22835ce41c3e6cf2a9402be8e9da18a3e09a815fec958fb1bb',
              'docs/preference-custody-laboratory-floor-v30.md': 'c549229e3725754a6a316c672ab7f4a53e95120b388498a544422eea98d1ce46',
          }

          parts = sorted(Path('.pc32').glob('payload.part-*'))
          required_parts = [f'payload.part-{index:02d}' for index in range(4)]
          if [path.name for path in parts] != required_parts:
              raise SystemExit(f'expected four ordered payload shards, found {[path.name for path in parts]}')
          encoded = ''.join(''.join(path.read_text().split()) for path in parts)
          if hashlib.sha256(encoded.encode()).hexdigest() != expected_base64_sha256:
              raise SystemExit('payload base64 SHA-256 mismatch')
          try:
              xz_bytes = base64.b64decode(encoded, validate=True)
          except Exception as error:
              raise SystemExit(f'invalid payload base64: {error}')
          actual_xz_sha256 = hashlib.sha256(xz_bytes).hexdigest()
          if actual_xz_sha256 != expected_xz_sha256:
              raise SystemExit(f'payload xz SHA-256 mismatch: {actual_xz_sha256}')

          with tarfile.open(fileobj=io.BytesIO(xz_bytes), mode='r:xz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if names != list(expected):
                  raise SystemExit(f'archive path/order mismatch: {names}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member must be a regular file: {member.name}')
                  if Path(member.name).is_absolute() or '..' in Path(member.name).parts:
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'archive member has no bytes: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())

          observed = {}
          for name, required_sha256 in expected.items():
              raw = Path(name).read_bytes()
              actual_sha256 = hashlib.sha256(raw).hexdigest()
              if actual_sha256 != required_sha256:
                  raise SystemExit(f'file SHA-256 mismatch for {name}: {actual_sha256}')
              observed[name] = {'bytes': len(raw), 'sha256': actual_sha256}

          receipt = {
              'schema_version': 'pc32-materialization-receipt@1',
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'payload_xz_sha256': actual_xz_sha256,
              'permanent_nonworkflow_file_count': len(expected),
              'files': observed,
              'outside_human_dependency': False,
          }
          Path('/tmp/pc32-materialization-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Qualify standalone PC-32 and compositional floor v30
        run: |
          node tools/compile-preference-pre-intake-assurance.mjs
          node tools/validate-preference-pre-intake-assurance.mjs
          node test/preference-pre-intake-assurance.test.js
          node tools/compile-preference-custody-manifest-v30.mjs
          node tools/validate-preference-custody-manifest-v30.mjs
          node test/preference-custody-manifest-v30.test.js
      - name: Regress historical Preference Custody floors and no-magic-human gate
        run: |
          set -euo pipefail
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
      - name: Commit only the exact product and retire all four payload shards
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            data/research/preference-custody/pre-intake-assurance.fixture.json \
            tools/lib/preference-pre-intake-assurance.mjs \
            tools/compile-preference-pre-intake-assurance.mjs \
            tools/validate-preference-pre-intake-assurance.mjs \
            test/preference-pre-intake-assurance.test.js \
            docs/preference-custody-pre-intake-assurance.md \
            data/research/preference-custody/control-manifest-v30.json \
            tools/lib/preference-custody-manifest-v30.mjs \
            tools/compile-preference-custody-manifest-v30.mjs \
            tools/validate-preference-custody-manifest-v30.mjs \
            test/preference-custody-manifest-v30.test.js \
            docs/preference-custody-laboratory-floor-v30.md
          git rm -- \
            .pc32/payload.part-00 \
            .pc32/payload.part-01 \
            .pc32/payload.part-02 \
            .pc32/payload.part-03
          python - <<'PY'
          import subprocess
          expected = [
              '.pc32/payload.part-00',
              '.pc32/payload.part-01',
              '.pc32/payload.part-02',
              '.pc32/payload.part-03',
              'data/research/preference-custody/control-manifest-v30.json',
              'data/research/preference-custody/pre-intake-assurance.fixture.json',
              'docs/preference-custody-laboratory-floor-v30.md',
              'docs/preference-custody-pre-intake-assurance.md',
              'test/preference-custody-manifest-v30.test.js',
              'test/preference-pre-intake-assurance.test.js',
              'tools/compile-preference-custody-manifest-v30.mjs',
              'tools/compile-preference-pre-intake-assurance.mjs',
              'tools/lib/preference-custody-manifest-v30.mjs',
              'tools/lib/preference-pre-intake-assurance.mjs',
              'tools/validate-preference-custody-manifest-v30.mjs',
              'tools/validate-preference-pre-intake-assurance.mjs',
          ]
          observed = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if observed != expected:
              raise SystemExit(f'staged path mismatch:\nexpected={expected}\nobserved={observed}')
          print(f'exact staged path set verified: {len(observed)} paths')
          PY
          git commit -m 'Materialize PC-32 and Preference Custody floor v30'
          git push origin HEAD:research/preference-pre-intake-assurance-v1
      - name: Preserve the exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc32-exact-materialization-receipt
          path: /tmp/pc32-materialization-receipt.json
          if-no-files-found: error
