name: Status sovereignty RD Wave 03 RD-04 CA-SD-WA successor protocol

on:
  push:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-ca-sd-wa-successor-protocol.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd04/run-ca-sd-wa-successor-protocol.py'
      - 'test/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.test.js'
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.yml'
      - '.ssc-rd04-wave03-ca-sd-wa-successor-trigger/EXECUTE'
      - 'data/intake/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol/**'
      - 'docs/milestones/ssc-rd-wave03-rd04-ca-sd-wa-successor-protocol.md'
      - 'schemas/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs'
      - 'tools/acquisition/status-sovereignty-rd-wave03-rd04/run-ca-sd-wa-successor-protocol.py'
      - 'test/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate fixed thirty-route and nine-cell product
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.test.js
          python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd04/run-ca-sd-wa-successor-protocol.py
          node tools/build-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs
          node test/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.test.js
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-ca-sd-wa-successor-protocol.py --validate-only
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          root = Path('.')
          schema = json.loads((root / 'schemas/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.schema.json').read_text())
          data = root / 'data/intake/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol'
          files = sorted(data.glob('*.json'))
          assert len(files) == 7, len(files)
          for file in files:
              jsonschema.validate(json.loads(file.read_text()), schema)
          print('rd04_ca_sd_wa_closed_schema_family=pass')
          print('schema_objects_validated=7')
          PY
          node tools/validate-no-magic-human-gate.mjs
          npm run release:check
      - name: Replay exact derivation
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs --write
          node tools/build-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.mjs
          node test/status-sovereignty-rd-wave03-rd04-ca-sd-wa-successor-protocol.test.js
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-ca-sd-wa-successor-protocol.py --validate-only
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
  capture:
    if: startsWith(github.head_ref, 'agent/ssc-rd04-wave03-ca-sd-wa-successor-trigger-')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require one inert trigger and exact protocol
        run: |
          set -Eeuo pipefail
          test -f .ssc-rd04-wave03-ca-sd-wa-successor-trigger/EXECUTE
          python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-ca-sd-wa-successor-protocol.py --validate-only
      - name: Execute only the frozen thirty routes
        run: python tools/acquisition/status-sovereignty-rd-wave03-rd04/run-ca-sd-wa-successor-protocol.py --output /tmp/ssc-rd04-wave03-ca-sd-wa-successor-v1
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-wave03-ca-sd-wa-successor-v1
          path: /tmp/ssc-rd04-wave03-ca-sd-wa-successor-v1
          if-no-files-found: error
          retention-days: 90
