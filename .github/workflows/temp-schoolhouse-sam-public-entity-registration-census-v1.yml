                                      break
                                  next_page = next_control(page)
                                  if next_page is None:
                                      if candidate_count_for_query(query_id) > candidates_before:
                                          terminal_state = "terminal_public_search_rendered"
                                      elif query["json_response_count"] > 0 or inspected > 0:
                                          terminal_state = (
