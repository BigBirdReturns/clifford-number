name: TEMP clean final SSC RD-01 Wave-03 lanes

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-final-cleanup.yml'
      - '.ssc-rd01-wave03-final-cleanup/TRIGGER'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical marker and close every remaining temporary lane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          REPO="$GITHUB_REPOSITORY"
          FINAL_TAG='ssc-rd01-wave03-cumulative-postmerge-proved'
          TAG_SHA=$(gh api "repos/$REPO/git/ref/tags/$FINAL_TAG" --jq .object.sha)
          test "${#TAG_SHA}" -eq 40
          PR_NUMBER=$(gh pr list --repo "$REPO" --state merged --head 'agent/ssc-rd01-wave03-cumulative-promotion-v1' --json number --jq 'sort_by(.number) | last | .number // empty')
          test -n "$PR_NUMBER"
          test "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .merge_commit_sha)" = "$TAG_SHA"
          mkdir -p /tmp/ssc-rd01-wave03-final-cleanup
          gh pr list --repo "$REPO" --state open --limit 200 --json number,headRefName,title --jq '.[] | select(.headRefName|startswith("agent/ssc-rd01-wave03-")) | [.number,.headRefName,.title] | @tsv' > /tmp/ssc-rd01-wave03-final-cleanup/open-before.tsv
          while IFS=$'\t' read -r number head title; do
            [[ -z "$number" ]] && continue
            [[ "$number" = "$CURRENT_PR" ]] && continue
            gh pr close "$number" --repo "$REPO" --comment "Retired unmerged after canonical RD-01-C06 terminal closure and Wave-03 cumulative promotion at $TAG_SHA."
          done < /tmp/ssc-rd01-wave03-final-cleanup/open-before.tsv
          gh pr list --repo "$REPO" --state open --limit 200 --json number,headRefName,title --jq '.[] | select(.headRefName|startswith("agent/ssc-rd01-wave03-")) | [.number,.headRefName,.title] | @tsv' > /tmp/ssc-rd01-wave03-final-cleanup/open-after-before-self.tsv
          OTHER_COUNT=$(awk -F'\t' -v current="$CURRENT_PR" '$1 != current {n++} END {print n+0}' /tmp/ssc-rd01-wave03-final-cleanup/open-after-before-self.tsv)
          test "$OTHER_COUNT" -eq 0
          printf 'canonical_marker=%s\npermanent_promotion_pr=%s\ncurrent_cleanup_pr=%s\nother_open_temp_prs=0\n' "$TAG_SHA" "$PR_NUMBER" "$CURRENT_PR" > /tmp/ssc-rd01-wave03-final-cleanup/receipt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-final-cleanup
          path: /tmp/ssc-rd01-wave03-final-cleanup
          if-no-files-found: error
          retention-days: 90
      - name: Close this cleanup carrier unmerged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: gh pr close "$CURRENT_PR" --repo "$GITHUB_REPOSITORY" --comment 'Final cleanup complete; this never-merge carrier is now retired.'
