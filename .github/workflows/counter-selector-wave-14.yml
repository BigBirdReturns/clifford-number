name: Counter-Selector Wave 14 Batch 05 blind review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-14.yml'
      - 'data/project/counter-selector-wave-14-blind-review.json'
      - 'data/project/counter-selector-blind-review-b05-registry.json'
      - 'data/project/counter-selector-review-disagreement-b05-ledger.json'
      - 'data/project/counter-selector-wave-14-release-manifest.json'
      - 'schemas/counter-selector-blind-review-b05.schema.json'
      - 'docs/methods/counter-selector-blind-review-b05.md'
      - 'docs/milestones/counter-selector-wave-14.md'
      - 'tools/build-counter-selector-wave-14.mjs'
      - 'tools/validate-counter-selector-wave-14.mjs'
      - 'test/counter-selector-wave-14.test.js'
      - 'reports/core-thesis/counter-selector-wave-14/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-14-b05-blind-review'
    paths:
      - '.github/workflows/counter-selector-wave-14.yml'
      - 'data/project/counter-selector-wave-14-blind-review.json'
      - 'data/project/counter-selector-blind-review-b05-registry.json'
      - 'data/project/counter-selector-review-disagreement-b05-ledger.json'
      - 'data/project/counter-selector-wave-14-release-manifest.json'
      - 'schemas/counter-selector-blind-review-b05.schema.json'
      - 'docs/methods/counter-selector-blind-review-b05.md'
      - 'docs/milestones/counter-selector-wave-14.md'
      - 'tools/build-counter-selector-wave-14.mjs'
      - 'tools/validate-counter-selector-wave-14.mjs'
      - 'test/counter-selector-wave-14.test.js'
      - 'reports/core-thesis/counter-selector-wave-14/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 14 products
        run: node tools/build-counter-selector-wave-14.mjs
      - name: Validate Batch 05 blind-review contract
        run: node tools/validate-counter-selector-wave-14.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-14.test.js
      - name: Require exact committed Wave 14 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-blind-review-b05-registry.json \
            data/project/counter-selector-review-disagreement-b05-ledger.json \
            data/project/counter-selector-wave-14-release-manifest.json \
            reports/core-thesis/counter-selector-wave-14/data.json \
            reports/core-thesis/counter-selector-wave-14/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 14 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-14.mjs
          node tools/validate-counter-selector-wave-14.mjs
          node test/counter-selector-wave-14.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
