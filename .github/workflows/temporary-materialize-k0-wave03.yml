name: Temporary materialize K0 role-neutral Wave 03

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave03.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-03
    paths:
      - '.github/workflows/temporary-materialize-k0-wave03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand exact Wave 03 materializer
        run: |
          base64 -d .github/tmp/k0-wave03-materializer.b64 > /tmp/k0-wave03-materializer.tgz
          test "$(sha256sum /tmp/k0-wave03-materializer.tgz | awk '{print $1}')" = "51b43d6772b0be8c0312e3fd24de339d5d230711b852f4dacb863364a8fe7b33"
          rm -rf /tmp/k0-wave03-materializer
          mkdir -p /tmp/k0-wave03-materializer
          tar -xzf /tmp/k0-wave03-materializer.tgz -C /tmp/k0-wave03-materializer
          python - <<'PYPATCH'
          from hashlib import sha256
          from pathlib import Path
          p = Path('/tmp/k0-wave03-materializer/materialize-k0-role-neutral-wave-03.mjs')
          s = p.read_text()
          old = """aggregateValidator = replaceOnce(aggregateValidator,
  \"if (report.current_result.role_neutral_universe_execution_started !== true || report.counts.role_neutral_query_executions !== 8 || report.counts.role_neutral_retained_records !== 17 || report.counts.role_neutral_candidate_records !== 8)\",
  \"if (report.current_result.role_neutral_universe_execution_started !== true || report.counts.role_neutral_query_executions !== 12 || report.counts.role_neutral_retained_records !== 24 || report.counts.role_neutral_candidate_records !== 13 || report.counts.role_neutral_wave_03_retained_records !== 7)\",
  'validator report counts');"""
          new = """aggregateValidator = replaceOnce(aggregateValidator,
  \"if (report.current_result.role_neutral_universe_execution_started !== true || report.counts.role_neutral_query_executions !== 8 || report.counts.role_neutral_retained_records !== 17 || report.counts.role_neutral_candidate_records !== 8 || report.counts.role_neutral_positive_controls !== 3 || report.counts.role_neutral_coverage_controls !== 1 || report.counts.role_neutral_requires_additional_acquisition !== 1 || report.counts.role_neutral_resolved_additional_acquisition !== 2 || report.counts.role_neutral_wave_02_retained_records !== 7) fail('report role-neutral execution drift');\",
  \"if (report.current_result.role_neutral_universe_execution_started !== true || report.counts.role_neutral_query_executions !== 12 || report.counts.role_neutral_retained_records !== 24 || report.counts.role_neutral_candidate_records !== 13 || report.counts.role_neutral_positive_controls !== 3 || report.counts.role_neutral_negative_controls !== 3 || report.counts.role_neutral_coverage_controls !== 2 || report.counts.role_neutral_requires_additional_acquisition !== 1 || report.counts.role_neutral_resolved_additional_acquisition !== 2 || report.counts.role_neutral_wave_02_retained_records !== 7 || report.counts.role_neutral_wave_03_query_executions !== 4 || report.counts.role_neutral_wave_03_retained_records !== 7 || report.counts.role_neutral_wave_03_candidate_records !== 5) fail('report role-neutral execution drift');\",
  'validator report counts');"""
          assert s.count(old) == 1, 'stale-anchor patch denominator drift'
          p.write_text(s.replace(old, new))
          assert sha256(p.read_bytes()).hexdigest() == 'a8baed2a03a8c8a9b5469765c3d1d8d32b023bc2885683f61f98376fe89610d7'
          PYPATCH

      - name: Materialize and validate Wave 03
        run: |
          node /tmp/k0-wave03-materializer/materialize-k0-role-neutral-wave-03.mjs
          node tools/build-k0-role-neutral-wave-03.mjs
          node tools/validate-k0-role-neutral-wave-03.mjs
          node test/k0-role-neutral-wave-03.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          node /tmp/k0-wave03-materializer/materialize-k0-role-neutral-wave-03.mjs
          node tools/build-k0-role-neutral-wave-03.mjs
          node tools/validate-k0-role-neutral-wave-03.mjs
          node test/k0-role-neutral-wave-03.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Enforce permanent path denominator
        run: |
          python - <<'PYDENOM'
          import subprocess
          expected = {
              '.github/workflows/k0-role-neutral-wave-03.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/project/k0-role-neutral-wave-03-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-03.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-03.md',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-03.html',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-03.json',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-03.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/build-k0-role-neutral-wave-03.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-03.mjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM

      - name: Create exact blobs and export transaction receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBLOBS'
          import base64, json, os, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          paths = [
              '.github/workflows/k0-role-neutral-wave-03.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/project/k0-role-neutral-wave-03-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-03.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-03.md',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-03.html',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-03.json',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-03.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/build-k0-role-neutral-wave-03.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-03.mjs',
          ]
          def post(path, payload):
              req = urllib.request.Request(api + path, data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'k0-role-neutral-wave-03',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          rows = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = post(f'/repos/{repo}/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              index_row = subprocess.check_output(['git','ls-files','-s','--',path], text=True).strip()
              mode = index_row.split()[0] if index_row else '100644'
              rows.append({'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': mode})
          receipt = {
              'schema_version': 'k0-role-neutral-wave-03-transaction@1',
              'repository': repo,
              'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'updates': rows,
              'deletions': [
                  '.github/tmp/k0-wave03-materializer.b64',
                  '.github/workflows/temporary-materialize-k0-wave03.yml',
                  '.github/workflows/temporary-diagnose-k0-wave03.yml',
                  '.github/workflows/temporary-capture-k0-wave03-materializer.yml',
              ],
              'materializer_sha256': '51b43d6772b0be8c0312e3fd24de339d5d230711b852f4dacb863364a8fe7b33',
              'effective_materializer_sha256': 'a8baed2a03a8c8a9b5469765c3d1d8d32b023bc2885683f61f98376fe89610d7',
              'query_templates_executed': 4,
              'retained_records': 24,
              'included_events': 0,
              'publication_cleared': False,
              'graph_effect': 'none',
              'ref_updated': False,
          }
          os.makedirs('/tmp/k0-wave03-export', exist_ok=True)
          with open('/tmp/k0-wave03-export/BLOB_RECEIPTS.json', 'w') as handle:
              json.dump(receipt, handle, indent=2); handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PYBLOBS

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-role-neutral-wave-03-validated-transaction
          path: /tmp/k0-wave03-export/BLOB_RECEIPTS.json
          if-no-files-found: error
          retention-days: 30
