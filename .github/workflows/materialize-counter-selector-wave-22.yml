name: Materialize Counter-Selector Wave 22

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-22.yml'
  push:
    branches:
      - 'agent/counter-selector-wave-22-external-execution'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-22.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-22-external-execution
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact carrier and unpack Wave 22 estate
        run: |
          set -euo pipefail
          payload=.github/materializers/counter-selector-wave-22/payload.b64
          actual="$(git hash-object "$payload")"
          test "$actual" = "d9910f73351134e3be0d22bf46f480d2ec84841f" || {
            echo "carrier blob mismatch: expected=d9910f73351134e3be0d22bf46f480d2ec84841f actual=$actual" >&2
            exit 1
          }
          base64 --decode "$payload" > /tmp/counter-selector-wave-22.tar.gz
          echo '1cc2a08f68882394fcfd65e666a5d2d857638975ad9401ac2226694ed25d66d1  /tmp/counter-selector-wave-22.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-22.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-22
      - name: Build, validate, and attack Wave 22
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-22.mjs
          node tools/validate-counter-selector-wave-22.mjs
          node test/counter-selector-wave-22.test.js
      - name: Commit exact permanent non-workflow Wave 22 estate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-22/payload.b64 \
            data/project/counter-selector-wave-22-external-execution.json \
            data/project/counter-selector-wave-22-release-manifest.json \
            data/project/counter-selector-wave-22-request-receipt-registry.json \
            docs/methods/counter-selector-external-gate-execution.md \
            docs/milestones/counter-selector-wave-22.md \
            reports/core-thesis/counter-selector-wave-22/data.json \
            reports/core-thesis/counter-selector-wave-22/index.html \
            schemas/counter-selector-external-gate-execution.schema.json \
            test/counter-selector-wave-22.test.js \
            tools/build-counter-selector-wave-22.mjs \
            tools/validate-counter-selector-wave-22.mjs | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected staged paths' >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Execute Counter-Selector Wave 22 external gates'
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Wave 22 reconstruction
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-22.mjs
          node tools/validate-counter-selector-wave-22.mjs
          node test/counter-selector-wave-22.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Publish permanent non-workflow Wave 22 head
        run: git push origin HEAD:agent/counter-selector-wave-22-external-execution
