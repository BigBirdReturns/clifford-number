name: Inspect SG-04 materializer runs

on:
  push:
    branches:
      - agent/sg04-exact-recovery
    paths:
      - '.github/workflows/inspect-sg04-materializer-runs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sg04-exact-recovery
          fetch-depth: 0
      - name: Query production materializer runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sg04-materializer-runs
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/temporary-k0-sg04-materializer.yml/runs?event=pull_request_target&per_page=30" \
            > /tmp/sg04-materializer-runs/runs.json
          jq '[.workflow_runs[] | {id, run_number, event, status, conclusion, head_sha, created_at, updated_at, html_url}]' \
            /tmp/sg04-materializer-runs/runs.json \
            > /tmp/sg04-materializer-runs/summary.json
          cat /tmp/sg04-materializer-runs/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: sg04-materializer-runs-${{ github.run_id }}
          path: /tmp/sg04-materializer-runs/
          if-no-files-found: error
          retention-days: 2
      - name: Publish inspection pointer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/tmp
          printf 'run_id: %s\nartifact: sg04-materializer-runs-%s\n' '${{ github.run_id }}' '${{ github.run_id }}' > .github/tmp/sg04-materializer-runs-pointer.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tmp/sg04-materializer-runs-pointer.txt
          git commit -m 'Record SG-04 materializer run inspection custody'
          git push origin HEAD:agent/sg04-exact-recovery
