name: TEMP finalize SSC RD-01 Wave-03 terminal closure

on:
  pull_request:
    paths:
      - '.github/workflows/temp-ssc-rd01-wave03-finalizer.yml'
      - '.github/tmp/finalize-rd01-wave03.sh'
      - '.ssc-rd01-wave03-finalizer/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: write
  issues: write

concurrency:
  group: temp-ssc-rd01-wave03-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Qualify, merge, prove, and clean RD-01-C06
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINALIZER_PR: ${{ github.event.pull_request.number }}
        run: bash .github/tmp/finalize-rd01-wave03.sh
      - name: Preserve exact finalizer receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd01-wave03-finalizer
          path: /tmp/ssc-rd01-wave03-finalizer-receipt
          if-no-files-found: error
          retention-days: 90
