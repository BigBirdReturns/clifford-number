name: PR 2176 narrative-year boundary repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/pr2176-narrative-year-repair.yml

permissions:
  contents: write

concurrency:
  group: pr2176-narrative-year-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and validate narrative-year boundaries
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "481bf57cd956235ff142928024761a848b3273e1"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "07c8aba58a32c409820eb477c7f590ef8f8ea2c2"
          test "$(git hash-object tools/crawl-industrial-exhaust.mjs)" = "22c4cc8a53058bbb128d064850c2a7c71a4367de"
          test "$(git ls-files -s tools/crawl-industrial-exhaust.mjs | awk '{print $1}')" = "100755"

          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_between(text, start_anchor, end_anchor, replacement, label):
              start = text.find(start_anchor)
              if start < 0:
                  raise SystemExit(f'{label}: start anchor not found')
              end = text.find(end_anchor, start)
              if end < 0:
                  raise SystemExit(f'{label}: end anchor not found')
              return text[:start] + replacement + text[end:]

          source_path = Path('tools/lib/industrial-exhaust.mjs')
          source = source_path.read_text()

          group_anchor = (
              "function normalizedDigitGroups(value) {\n"
              "  return value.normalize('NFKC').match(/\\d+/gu) ?? [];\n"
              "}\n"
          )
          if source.count(group_anchor) != 1:
              raise SystemExit(f'year helper anchor count: {source.count(group_anchor)}')
          year_helpers = dedent(r'''

          function normalizedWrappedNumericTail(value) {
            return value.normalize('NFKC').trim()
              .replace(/^\(\s*/u, '')
              .replace(/\s*\)$/u, '');
          }

          function isSentenceSeparatedYear(value, separator) {
            return YEAR_LIKE_PATTERN.test(normalizedWrappedNumericTail(value))
              && /[.!?。！？]\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'));
          }
          ''')
          source = source.replace(group_anchor, group_anchor + year_helpers)

          trailing_function = dedent(r'''function trailingObservationGroup(candidate, groups, externalPrefix, externalSuffix) {
            const normalizedSuffix = externalSuffix.normalize('NFKC').slice(0, 64);
            if (PHONE_EXTENSION_SUFFIX_PATTERN.test(normalizedSuffix)) return groups.length;
            const minimumPriorDigits = 7;

            for (let index = 1; index < groups.length && index <= MAX_PHONE_DIGIT_GROUPS; index += 1) {
              const start = groups[index].index;
              const previousEnd = groups[index - 1].index + groups[index - 1][0].length;
              const separator = candidate.slice(previousEnd, start);
              if (!/\s/u.test(separator)) continue;

              const phonePrefix = candidate.slice(0, start).trimEnd();
              const priorDigits = phonePrefix.normalize('NFKC').replace(/\D/gu, '').length;
              const prefixScore = phoneCandidateScore(phonePrefix, externalPrefix);
              if (priorDigits < minimumPriorDigits || !prefixScore) continue;

              const tail = candidate.slice(start).trim().normalize('NFKC');
              const normalizedTail = normalizedWrappedNumericTail(tail);
              const contextualTail = `${candidate.slice(start).trimStart()}${normalizedSuffix}`.normalize('NFKC');
              if (DATE_LIKE_PATTERN.test(normalizedTail)
                  || FORMATTED_NUMERIC_OBSERVATION_PATTERN.test(contextualTail)
                  || NUMERIC_OBSERVATION_PATTERN.test(contextualTail)
                  || isSentenceSeparatedYear(tail, separator)) return index;
            }
            return groups.length;
          }

          ''')
          source = replace_between(
              source,
              'function trailingObservationGroup(',
              'function phoneWindowBounds(',
              trailing_function,
              'trailing observation function'
          )

          extension_function = dedent(r'''function redactPhoneExtensionCandidate(candidate, marker, offset, input) {
            const extension = candidate.slice(marker.length);
            const groups = [...extension.matchAll(DIGIT_RUN_PATTERN)];
            if (!groups.length) return candidate;

            const normalizedSuffix = input
              .slice(offset + candidate.length, offset + candidate.length + 64)
              .normalize('NFKC');
            let lastGroup = groups.length - 1;
            for (let index = 1; index < groups.length; index += 1) {
              const start = groups[index].index;
              const previousEnd = groups[index - 1].index + groups[index - 1][0].length;
              const separator = extension.slice(previousEnd, start);
              if (!/\s/u.test(separator)) continue;

              const tail = extension.slice(start).trim().normalize('NFKC');
              const normalizedTail = normalizedWrappedNumericTail(tail);
              const contextualTail = `${extension.slice(start).trimStart()}${normalizedSuffix}`.normalize('NFKC');
              if (isSentenceSeparatedYear(tail, separator)
                  || DATE_LIKE_PATTERN.test(normalizedTail)
                  || FORMATTED_NUMERIC_OBSERVATION_PATTERN.test(contextualTail)
                  || NUMERIC_OBSERVATION_PATTERN.test(contextualTail)) {
                lastGroup = index - 1;
                break;
              }
            }

            const redactionEnd = groups[lastGroup].index + groups[lastGroup][0].length;
            return `${marker}[contact omitted]${extension.slice(redactionEnd)}`;
          }

          ''')
          source = replace_between(
              source,
              'function redactPhoneExtensionCandidate(',
              'function canStartIndependentPhone(',
              extension_function,
              'extension function'
          )
          source_path.write_text(source)

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text()

          old_observations = "  '123 people', '1234 impressions', '3.14', '1,234', '10-20', '12:30', '2026', '2026-08-17'\n"
          new_observations = "  '123 people', '1234 impressions', '3.14', '1,234', '10-20', '12:30', '2026-08-17'\n"
          if tests.count(old_observations) != 1:
              raise SystemExit(f'trailing observation list count: {tests.count(old_observations)}')
          tests = tests.replace(old_observations, new_observations)

          old_year_list = dedent(r'''for (const completeYearEndingPhone of [
            '+86 138 0013 2026',
            '+358 100 0000 2000'
          ]) {''')
          new_year_list = dedent(r'''for (const completeYearEndingPhone of [
            '+86 138 0013 2026',
            '+358 100 0000 2000',
            '+62 812 34 5678 2026',
            '+81 3 6216 5111 2026'
          ]) {''')
          if tests.count(old_year_list) != 1:
              raise SystemExit(f'complete year phone list count: {tests.count(old_year_list)}')
          tests = tests.replace(old_year_list, new_year_list)

          extension_year_anchor = dedent(r'''assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 1234 5678. 2026 results improved.'),
            'Tel: [contact omitted] ext [contact omitted]. 2026 results improved.',
            'a sentence-separated year after a grouped extension must remain intact'
          );
          ''')
          parenthesized_tests = dedent(r'''assert.equal(
            redactContactData('Contact +672 1234. (2026) results improved.'),
            'Contact [contact omitted]. (2026) results improved.',
            'a parenthesized sentence-separated year after a short phone must remain intact'
          );
          assert.equal(
            redactContactData('Contact +672 1234. （2026） results improved.'),
            'Contact [contact omitted]. （2026） results improved.',
            'a fullwidth-parenthesized sentence-separated year must remain intact'
          );
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 1234 5678. (2026) results improved.'),
            'Tel: [contact omitted] ext [contact omitted]. (2026) results improved.',
            'a parenthesized sentence-separated year after a grouped extension must remain intact'
          );
          assert.equal(
            redactContactData('Contact +672 1234 (2026) results improved.'),
            'Contact [contact omitted] results improved.',
            'without a narrative boundary, a year-like terminal group remains part of the contact span'
          );
          ''')
          if tests.count(extension_year_anchor) != 1:
              raise SystemExit(f'parenthesized year insertion count: {tests.count(extension_year_anchor)}')
          tests = tests.replace(extension_year_anchor, extension_year_anchor + parenthesized_tests)
          test_path.write_text(tests)
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node test/industrial-exhaust.test.js
          git diff --check

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          let generatedCases = 0;
          for (let year = 2000; year <= 2026; year += 1) {
            for (const completePhone of [
              `+62 812 34 5678 ${year}`,
              `+81 3 6216 5111 ${year}`,
              `+86 138 0013 ${year}`,
              `+672 1234 (${year})`
            ]) {
              assert.equal(redactContactData(completePhone), '[contact omitted]', completePhone);
              generatedCases += 1;
            }

            for (const [input, expected] of [
              [
                `Contact +672 1234. ${year} results improved.`,
                `Contact [contact omitted]. ${year} results improved.`
              ],
              [
                `Contact +672 1234. (${year}) results improved.`,
                `Contact [contact omitted]. (${year}) results improved.`
              ],
              [
                `Contact +672 1234. （${year}） results improved.`,
                `Contact [contact omitted]. （${year}） results improved.`
              ],
              [
                `Tel: +44 20 7123 4567 ext 1234 5678. (${year}) results improved.`,
                `Tel: [contact omitted] ext [contact omitted]. (${year}) results improved.`
              ]
            ]) {
              assert.equal(redactContactData(input), expected, input);
              generatedCases += 1;
            }
          }
          console.log(`generated narrative-year suite passed: ${generatedCases} cases`);
          NODE

          rm .github/workflows/pr2176-narrative-year-repair.yml
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/pr2176-narrative-year-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(crawler): require narrative year boundaries"
          git push origin "HEAD:$GITHUB_REF_NAME"
