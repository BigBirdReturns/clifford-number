name: NEVER MERGE - M-05 request-envelope admission controller

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m05-request-envelope-admission-controller.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m05-request-envelope-admission-controller
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_HEAD: agent/m05-s03-l7-intel-realization-request-envelope-custody-v1
      EXPECTED_MAIN: 7e4228dd97168bbd2d3df14261bf85a54e758034
      ISSUE_NUMBER: '345'
    steps:
      - name: Locate exact permanent pull request
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target_json="$(gh pr list --repo "$REPO" --state open --head "$TARGET_HEAD" --json number,headRefOid,isDraft,baseRefOid,title)"
          count="$(jq 'length' <<<"$target_json")"
          test "$count" -eq 1
          pr="$(jq -r '.[0].number' <<<"$target_json")"
          sha="$(jq -r '.[0].headRefOid' <<<"$target_json")"
          base="$(jq -r '.[0].baseRefOid' <<<"$target_json")"
          title="$(jq -r '.[0].title' <<<"$target_json")"
          test "$base" = "$EXPECTED_MAIN"
          test "$title" = '[M-05 S03-L7] Bind exact request-selection envelope'
          printf 'pr=%s\nsha=%s\n' "$pr" "$sha" >> "$GITHUB_OUTPUT"

      - name: Enforce exact four-file denominator
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.target.outputs.pr }}'
          actual="$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[].filename' | LC_ALL=C sort)"
          expected="$(cat <<'EOF' | LC_ALL=C sort
          .github/workflows/m05-intel-realization-request-envelope-custody-amendment.yml
          data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.json
          test/m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.test.js
          tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.mjs
          EOF
          )"
          test "$actual" = "$expected"

      - name: Wait for exact-head qualification matrix
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.target.outputs.sha }}'
          required=(
            'M-05 Intel realization request-envelope custody amendment'
            'Release checks'
            'M-05 story ecology and answerable power'
            'Core thesis and estate alignment'
            'No magic human gate'
          )
          deadline=$((SECONDS+2400))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=pull_request&per_page=100")"
            pending=0
            for name in "${required[@]}"; do
              row="$(jq -c --arg name "$name" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last // null' <<<"$runs")"
              if [[ "$row" == null ]]; then
                pending=1
                continue
              fi
              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "workflow failed: $name => $conclusion" >&2
                exit 1
              fi
              if [[ "$status" != completed ]]; then
                pending=1
              fi
            done
            if (( pending == 0 )); then
              exit 0
            fi
            sleep 15
          done
          echo 'qualification matrix timed out' >&2
          exit 1

      - name: Recheck leases and merge exact head
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.target.outputs.pr }}'
          sha='${{ steps.target.outputs.sha }}'
          current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          current_head="$(gh api "repos/$REPO/git/ref/heads/$TARGET_HEAD" --jq '.object.sha')"
          test "$current_main" = "$EXPECTED_MAIN"
          test "$current_head" = "$sha"
          draft="$(gh pr view "$pr" --repo "$REPO" --json isDraft --jq '.isDraft')"
          if [[ "$draft" == true ]]; then
            gh pr ready "$pr" --repo "$REPO"
          fi
          gh pr merge "$pr" --repo "$REPO" --merge --match-head-commit "$sha"
          merge="$(gh pr view "$pr" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$merge"
          head_tree="$(gh api "repos/$REPO/git/commits/$sha" --jq '.tree.sha')"
          merge_tree="$(gh api "repos/$REPO/git/commits/$merge" --jq '.tree.sha')"
          test "$head_tree" = "$merge_tree"
          printf 'merge=%s\ntree=%s\n' "$merge" "$merge_tree" >> "$GITHUB_OUTPUT"

      - name: Record canonical transaction on issue 345
        shell: bash
        run: |
          set -euo pipefail
          pr='${{ steps.target.outputs.pr }}'
          sha='${{ steps.target.outputs.sha }}'
          merge='${{ steps.merge.outputs.merge }}'
          tree='${{ steps.merge.outputs.tree }}'
          contract="$(gh api "repos/$REPO/contents/data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.json?ref=$merge" --jq '.sha')"
          validator="$(gh api "repos/$REPO/contents/tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.mjs?ref=$merge" --jq '.sha')"
          test_blob="$(gh api "repos/$REPO/contents/test/m05-answerable-power-sprint-03-leg-07-intel-realization-request-envelope-custody-amendment.test.js?ref=$merge" --jq '.sha')"
          workflow="$(gh api "repos/$REPO/contents/.github/workflows/m05-intel-realization-request-envelope-custody-amendment.yml?ref=$merge" --jq '.sha')"
          body="$(cat <<EOF
          PR #$pr is now the canonical exact request-selection-envelope admission control for the Intel realization chain. Exact qualified head \`$sha\` merged through \`$merge\`, preserving product tree \`$tree\`.

          The four canonical product blobs are contract \`$contract\`, validator \`$validator\`, adversarial test \`$test_blob\`, and workflow \`$workflow\`. All five exact-head workflows passed before merge: the focused request-envelope workflow, Release checks, M-05 story ecology and answerable power, Core thesis and estate alignment, and No magic human gate.

          The amendment binds request method, exact target bytes, the complete network-emitted header set, request-body custody, anonymous credential and cookie scope, conditional and range state, complete range reassembly, response Vary selection, and the effective request-envelope digest. It refuses URL identity, hidden client defaults, duplicate-header collapse, normalized targets, 304 responses without a source body, incomplete ranges, Vary star, and credential- or cookie-dependent retrieval as complete public-source custody.

          This remains an admission-control transaction. It establishes no Intel sale, federal cash receipt, TAS/BETC booking, distribution, effective answer, graph effect, cross-domain completion, project completion, or issue-closure authority. The ordinary gate remains 2026-08-27T00:00:00Z. The controlling question is whether the first later Intel record can reproduce the exact anonymous request and exact authenticated response before satisfying the transaction, gross-receipt, public-account, denominator, and distribution joins.
          EOF
          )"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$body"

      - name: Retire this never-merge carrier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh pr close '${{ github.event.pull_request.number }}' --repo "$REPO" --comment 'Carrier completed its sole admission-control role and is retired without merge.'
