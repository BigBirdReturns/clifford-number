name: Counter-Selector Wave 21 gate exhaustion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-21.yml'
      - 'data/project/counter-selector-wave-21-*.json'
      - 'schemas/counter-selector-gate-exhaustion.schema.json'
      - 'docs/methods/counter-selector-gate-exhaustion.md'
      - 'docs/milestones/counter-selector-wave-21.md'
      - 'docs/requests/counter-selector-wave-21-*.md'
      - 'tools/build-counter-selector-wave-21.mjs'
      - 'tools/validate-counter-selector-wave-21.mjs'
      - 'test/counter-selector-wave-21.test.js'
      - 'reports/core-thesis/counter-selector-wave-21/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-21-gate-exhaustion'
    paths:
      - '.github/workflows/counter-selector-wave-21.yml'
      - 'data/project/counter-selector-wave-21-*.json'
      - 'schemas/counter-selector-gate-exhaustion.schema.json'
      - 'docs/methods/counter-selector-gate-exhaustion.md'
      - 'docs/milestones/counter-selector-wave-21.md'
      - 'docs/requests/counter-selector-wave-21-*.md'
      - 'tools/build-counter-selector-wave-21.mjs'
      - 'tools/validate-counter-selector-wave-21.mjs'
      - 'test/counter-selector-wave-21.test.js'
      - 'reports/core-thesis/counter-selector-wave-21/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 21 products
        run: node tools/build-counter-selector-wave-21.mjs
      - name: Validate remaining-gate contract
        run: node tools/validate-counter-selector-wave-21.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-21.test.js
      - name: Require exact committed Wave 21 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-21-gate-registry.json \
            data/project/counter-selector-wave-21-archive-request-registry.json \
            data/project/counter-selector-wave-21-external-review-registry.json \
            data/project/counter-selector-wave-21-release-manifest.json \
            reports/core-thesis/counter-selector-wave-21/data.json \
            reports/core-thesis/counter-selector-wave-21/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 21 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-21.mjs
          node tools/validate-counter-selector-wave-21.mjs
          node test/counter-selector-wave-21.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
