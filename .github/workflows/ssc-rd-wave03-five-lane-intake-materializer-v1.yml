name: TEMP materialize Wave-03 five-lane intake protocols

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ssc-rd-wave03-five-lane-intake-materializer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.base.ref == 'agent/ssc-rd-wave03-five-lane-intake-materializer-base-v1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd-wave03-five-lane-intake-materializer-trigger-v1'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - lane: RD-02
            target_branch: agent/ssc-rd-wave03-rd02-portfolio-lifecycle
            expected_head: 431f94963c369f982d262e96ed378806862539aa
            slug: status-sovereignty-rd-wave03-rd02-portfolio-lifecycle
            expected_total_paths: 7
            expected_nonworkflow_paths: 6
            builder: tools/build-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
            validator: tools/validate-status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.mjs
            test: test/status-sovereignty-rd-wave03-rd02-portfolio-lifecycle-intake.test.js
          - lane: RD-03
            target_branch: agent/ssc-rd-wave03-rd03-lifecycle-recovery
            expected_head: 06345049d48b0e5b0a2703751d820bb380b9ff88
            slug: status-sovereignty-rd-wave03-rd03-lifecycle-recovery
            expected_total_paths: 7
            expected_nonworkflow_paths: 6
            builder: tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs
            validator: tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.mjs
            test: test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery-intake.test.js
          - lane: RD-04
            target_branch: agent/ssc-rd-wave03-rd04-state-implementation
            expected_head: 2e007a337897b4e67f618c20cd698b86a2c240c0
            slug: status-sovereignty-rd-wave03-rd04-state-implementation
            expected_total_paths: 7
            expected_nonworkflow_paths: 6
            builder: tools/build-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
            validator: tools/validate-status-sovereignty-rd-wave03-rd04-state-implementation-intake.mjs
            test: test/status-sovereignty-rd-wave03-rd04-state-implementation-intake.test.js
          - lane: RD-05
            target_branch: agent/ssc-rd-wave03-rd05-member-participation
            expected_head: aa72bd3706f2a5c2ee0e36a3ee0c1cd544c24017
            slug: status-sovereignty-rd-wave03-rd05-member-participation
            expected_total_paths: 8
            expected_nonworkflow_paths: 7
            builder: tools/build-status-sovereignty-rd-wave03-rd05-member-participation-intake.mjs
            validator: tools/validate-status-sovereignty-rd-wave03-rd05-member-participation-intake.mjs
            test: test/status-sovereignty-rd-wave03-rd05-member-participation-intake.test.js
          - lane: RD-06
            target_branch: agent/ssc-rd-wave03-rd06-evaluation-custody
            expected_head: 38082e5e9843aa6d09a42581593f77622f81b821
            slug: status-sovereignty-rd-wave03-rd06-evaluation-custody
            expected_total_paths: 8
            expected_nonworkflow_paths: 7
            builder: tools/build-status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.mjs
            validator: tools/validate-status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.mjs
            test: test/status-sovereignty-rd-wave03-rd06-evaluation-custody-intake.test.js
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out trusted materializer base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct, qualify, and publish exact non-workflow product
        env:
          LANE: ${{ matrix.lane }}
          TARGET_BRANCH: ${{ matrix.target_branch }}
          EXPECTED_HEAD: ${{ matrix.expected_head }}
          SLUG: ${{ matrix.slug }}
          EXPECTED_TOTAL_PATHS: ${{ matrix.expected_total_paths }}
          EXPECTED_NONWORKFLOW_PATHS: ${{ matrix.expected_nonworkflow_paths }}
          BUILDER: ${{ matrix.builder }}
          VALIDATOR: ${{ matrix.validator }}
          TEST_FILE: ${{ matrix.test }}
          MAIN_ANCESTOR: 150f1693c70ce3699428c58c2687851a1ced39f7
          BASE64_SHA256: 120e98824f5f4617fc912ebf2129a314185dcd6dd65e43463a790eb936585809
          PRODUCT_SHA256: dacdfd9c3fb75dd1011908109868c169782569f3413dd1cb8b9d22f7f9157990
          PATH_LIST_SHA256: 8c64907fbd431557b91257f606c9224c06321b3eb33370f342397f897b5418e4
        run: bash .transport/ssc-rd-wave03-five-lane-intake-v1/materialize.sh
      - name: Upload lane materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave03-${{ matrix.lane }}-intake-materializer-v1
          path: ${{ runner.temp }}/receipts/${{ matrix.lane }}-intake-materializer.json
          if-no-files-found: error
