name: Preference custody laboratory floor v35

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-*.mjs'
      - 'tools/compile-preference-hard-to-enumerate-missingness-assurance.mjs'
      - 'tools/validate-preference-hard-to-enumerate-missingness-assurance.mjs'
      - 'tools/compile-preference-custody-manifest-v35.mjs'
      - 'tools/validate-preference-custody-manifest-v35.mjs'
      - 'test/preference-hard-to-enumerate-missingness-assurance.test.js'
      - 'test/preference-custody-manifest-v35.test.js'
      - 'docs/preference-custody-hard-to-enumerate-missingness-assurance.md'
      - 'docs/preference-custody-laboratory-floor-v35.md'
      - '.github/workflows/preference-hard-to-enumerate-missingness-assurance.yml'
      - '.github/workflows/preference-custody-v35.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  floor-v35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          node tools/compile-preference-hard-to-enumerate-missingness-assurance.mjs
          node tools/compile-preference-custody-manifest-v35.mjs
      - run: |
          node tools/validate-preference-hard-to-enumerate-missingness-assurance.mjs
          node tools/validate-preference-custody-manifest-v35.mjs
      - run: |
          node test/preference-hard-to-enumerate-missingness-assurance.test.js
          node test/preference-custody-manifest-v35.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v35
          path: |
            build/research/preference-hard-to-enumerate-missingness-assurance.json
            build/research/preference-hard-to-enumerate-missingness-assurance.md
            build/research/preference-custody-laboratory-floor-v35.json
            build/research/preference-custody-laboratory-floor-v35.md
          if-no-files-found: error
