name: Next ten estates

on:
  pull_request:
    paths:
      - 'data/intake/next-ten-estates/**'
      - 'tools/build-next-ten-estates.mjs'
      - 'tools/validate-next-ten-estates.mjs'
      - 'test/next-ten-estates.test.js'
      - 'test/research-tracks.test.js'
      - 'tools/compile.mjs'
      - '.github/workflows/next-ten-estates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate estate corpus
        run: |
          node tools/build-next-ten-estates.mjs
          node tools/validate-next-ten-estates.mjs
          node test/next-ten-estates.test.js
          node test/research-tracks.test.js

      - name: Full release gate
        run: npm run release:check

      - name: Preserve raw estate corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-ten-estates
          path: |
            data/intake/next-ten-estates/README.md
            data/intake/next-ten-estates/estates.jsonl
            data/intake/next-ten-estates/sources.jsonl
            data/intake/next-ten-estates/manifest.json
            data/intake/next-ten-estates/raw/*.json
          if-no-files-found: error
