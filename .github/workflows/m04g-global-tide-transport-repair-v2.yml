name: TEMP repair M-04G global-tide qualifier transport v2

on:
  push:
    branches:
      - agent/m04g-global-tide-materializer-v1
    paths:
      - .github/workflows/m04g-global-tide-transport-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert standing fixture-build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/m04g-global-tide-materializer-v1.yml')
          lines = path.read_text().splitlines()
          needle = '          node test/m05-answerable-power-sprint-03-leg-07.test.js'
          if lines.count(needle) != 1:
              raise SystemExit(f'qualifier test command count={lines.count(needle)}')
          build = '          node tools/build-m05-answerable-power-sprint-03-leg-07.mjs'
          validate = '          node tools/validate-m05-answerable-power-sprint-03-leg-07.mjs'
          if build in lines or validate in lines:
              raise SystemExit('qualifier prerequisites already present')
          index = lines.index(needle)
          lines[index:index] = [build, validate]
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          grep -Fxq '          node tools/build-m05-answerable-power-sprint-03-leg-07.mjs' .github/workflows/m04g-global-tide-materializer-v1.yml
          grep -Fxq '          node tools/validate-m05-answerable-power-sprint-03-leg-07.mjs' .github/workflows/m04g-global-tide-materializer-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/m04g-global-tide-materializer-v1.yml
          git commit -m 'Repair M-04G global-tide qualifier prerequisites'
          git push origin HEAD:agent/m04g-global-tide-materializer-v1
