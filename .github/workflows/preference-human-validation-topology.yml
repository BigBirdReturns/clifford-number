name: Preference custody human-validation topology

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/human-validation-topology.json'
      - 'data/research/preference-custody/real-cases/times-exploraition-admission.json'
      - 'data/research/preference-custody/real-cases/newsuk-nucleus-human-companion.json'
      - 'data/research/preference-custody/real-cases/yougov-parallax-hybrid-architecture.json'
      - 'tools/lib/preference-real-case.mjs'
      - 'tools/lib/preference-human-companion.mjs'
      - 'tools/lib/preference-hybrid-architecture.mjs'
      - 'tools/lib/preference-human-validation-topology.mjs'
      - 'tools/compile-preference-human-validation-topology.mjs'
      - 'tools/validate-preference-human-validation-topology.mjs'
      - 'test/preference-human-validation-topology.test.js'
      - 'docs/preference-custody-human-validation-topology.md'
      - '.github/workflows/preference-human-validation-topology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile real-case human-validation topology
        run: node tools/compile-preference-human-validation-topology.mjs
      - name: Validate topology and source-evidence boundaries
        run: node tools/validate-preference-human-validation-topology.mjs
      - name: Exercise topology, promotion, and tamper fixtures
        run: node test/preference-human-validation-topology.test.js
      - name: Preserve deterministic topology projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-human-validation-topology
          path: |
            build/research/preference-real-cases/human-validation-topology.json
            build/research/preference-real-cases/human-validation-topology.md
          if-no-files-found: error
