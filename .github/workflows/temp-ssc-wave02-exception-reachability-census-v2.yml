name: TEMP SSC Wave-02 scoped exception reachability census v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temp-ssc-wave02-exception-reachability-census-v2.yml'

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: ssc-wave02-exception-reachability-census-v2
  cancel-in-progress: false

jobs:
