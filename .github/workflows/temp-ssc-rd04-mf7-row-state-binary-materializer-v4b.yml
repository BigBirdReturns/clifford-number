name: TEMP execute repaired RD-04 seven-state row-state binary materializer v5

on:
  push:
    branches:
      - 'agent/ssc-rd04-mf7-row-state-binary-materializer-v4b'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temp-ssc-rd04-mf7-row-state-repaired-push-v5
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'push' && github.ref_name == 'agent/ssc-rd04-mf7-row-state-binary-materializer-v4b'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact carrier head and surface
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f '.trigger/ssc-rd04-mf7-row-state-binary-materializer-v4b/EXECUTE'
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ' ')" = '.github/workflows/temp-ssc-rd04-mf7-row-state-binary-materializer-pr-v4b.yml .github/workflows/temp-ssc-rd04-mf7-row-state-binary-materializer-v4b.yml .trigger/ssc-rd04-mf7-row-state-binary-materializer-v4b/EXECUTE '
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - id: locate
        name: Locate fresh never-merge carrier PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          OWNER=${GH_REPOSITORY%%/*}
          PR=$(gh api "repos/$GH_REPOSITORY/pulls?state=open&head=$OWNER:${GITHUB_REF_NAME}" --jq '.[0].number // empty')
          test -n "$PR"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          gh pr comment "$PR" --repo "$GH_REPOSITORY" --body "Repaired push-v5 materialization started on exact carrier head \`${GITHUB_SHA}\`. The runner verified the three-path carrier surface and is now recovering the immutable materializer before the exact archive, schema, adversarial, release, replay, and lease gates."
      - id: materialize
        name: Recover, repair, and execute immutable materializer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          MATERIALIZER_BLOB: 6e2a8bc84bc47a2c99e8052eb7183690eef08d2d
          MATERIALIZER_XZ_BYTES: '5956'
          MATERIALIZER_XZ_SHA256: 07d1517c61c8987f718d7d9b29f3bed3547324b53cb90ef98617b71af6a44add
          MATERIALIZER_SOURCE_BYTES: '18258'
          MATERIALIZER_SOURCE_SHA256: 8c68d07d8388bc177270ceecc4af8a5715f52997d67229afca4b2d82bbe06d14
          REPAIRED_SOURCE_BYTES: '18256'
          REPAIRED_SOURCE_SHA256: 60d7acbbd7b43d8505ffc45eb9e99c8281236c32716c2781f5846e1ed4472145
        run: |
          set -Eeuo pipefail
          OUT=/tmp/rd04-mf7-repaired-push-v5
          RESULT=/tmp/rd04-mf7-row-state-materialization-v3
          rm -rf "$OUT" "$RESULT"
          mkdir -p "$OUT"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPOSITORY/git/blobs/$MATERIALIZER_BLOB" \
            > "$OUT/blob.json"
          test "$(jq -r .encoding "$OUT/blob.json")" = base64
          jq -r .content "$OUT/blob.json" | tr -d '\n' | base64 -d > "$OUT/materializer.sh.xz"
          test "$(wc -c < "$OUT/materializer.sh.xz" | tr -d ' ')" = "$MATERIALIZER_XZ_BYTES"
          test "$(sha256sum "$OUT/materializer.sh.xz" | awk '{print $1}')" = "$MATERIALIZER_XZ_SHA256"
          test "$(git hash-object "$OUT/materializer.sh.xz")" = "$MATERIALIZER_BLOB"
          xz -dc "$OUT/materializer.sh.xz" > "$OUT/materializer.original.sh"
          test "$(wc -c < "$OUT/materializer.original.sh" | tr -d ' ')" = "$MATERIALIZER_SOURCE_BYTES"
          test "$(sha256sum "$OUT/materializer.original.sh" | awk '{print $1}')" = "$MATERIALIZER_SOURCE_SHA256"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source_path = Path('/tmp/rd04-mf7-repaired-push-v5/materializer.original.sh')
          target_path = Path('/tmp/rd04-mf7-repaired-push-v5/materializer.sh')
          text = source_path.read_text()
          needle = r'\\0'
          replacement = r'\0'
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'Git-object header escape denominator drift: {count}')
          repaired = text.replace(needle, replacement)
          body = repaired.encode()
          if len(body) != int(os.environ['REPAIRED_SOURCE_BYTES']):
              raise SystemExit(f'repaired source byte drift: {len(body)}')
          digest = hashlib.sha256(body).hexdigest()
          if digest != os.environ['REPAIRED_SOURCE_SHA256']:
              raise SystemExit(f'repaired source digest drift: {digest}')
          target_path.write_bytes(body)
          target_path.chmod(0o755)
          print('materializer_escape_repair=pass replacements=2')
          PY
          bash "$OUT/materializer.sh"
          if ! test -f "$RESULT/materialization-receipt.json"; then
            RECEIPT=$(find "$RESULT" -maxdepth 1 -type f -name '*receipt*.json' -print -quit)
            test -n "$RECEIPT"
            cp "$RECEIPT" "$RESULT/materialization-receipt.json"
          fi
      - name: Report exact terminal outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SELF_PR: ${{ steps.locate.outputs.pr }}
          OUTCOME: ${{ steps.materialize.outcome }}
        run: |
          set -Eeuo pipefail
          BODY=/tmp/rd04-mf7-repaired-push-v5-comment.md
          RECEIPT=/tmp/rd04-mf7-row-state-materialization-v3/materialization-receipt.json
          if test "$OUTCOME" = success && test -f "$RECEIPT"; then
            python - <<'PY' > "$BODY"
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/rd04-mf7-row-state-materialization-v3/materialization-receipt.json').read_text())
          print('Repaired push-v5 materialization completed successfully.\n')
          print('```text')
          for key in ['canonical_parent','full_head','full_tree','ordinary_head','ordinary_tree','permanent_pr','archive_sha256','permanent_paths','ordinary_paths','target_rows','terminal_cells_before','terminal_cells_after','terminal_units_before','terminal_units_after','adversarial_refusals','class_closed','outside_human_dependency']:
              print(f'{key}: {r.get(key)}')
          print('```')
          print('\nThe permanent branch moved only after exact archive, object, path, validation, release, replay, and lease gates passed.')
          PY
          else
            {
              echo 'Repaired push-v5 materialization failed closed.'
              echo
              echo '```text'
              echo "carrier_head: ${GITHUB_SHA}"
              echo "materializer_outcome: ${OUTCOME}"
              if test -f /tmp/rd04-mf7-row-state-materialization-v3/run.log; then
                tail -140 /tmp/rd04-mf7-row-state-materialization-v3/run.log
              fi
              echo '```'
              echo
              echo 'No success is represented and no unverified product is authorized.'
            } > "$BODY"
          fi
          if test -n "$SELF_PR"; then
            gh pr comment "$SELF_PR" --repo "$GH_REPOSITORY" --body-file "$BODY"
          fi
      - name: Preserve exact repaired materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mf7-row-state-repaired-push-v5
          path: |
            /tmp/rd04-mf7-repaired-push-v5
            /tmp/rd04-mf7-row-state-materialization-v3
          if-no-files-found: warn
          retention-days: 90
      - name: Refuse failed materialization
        if: always()
        env:
          OUTCOME: ${{ steps.materialize.outcome }}
        run: test "$OUTCOME" = success
