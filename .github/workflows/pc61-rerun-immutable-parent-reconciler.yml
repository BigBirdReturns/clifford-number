name: PC-61 immutable-parent reconciler rerun

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pc61-rerun-immutable-parent-reconciler.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: pc61-terminal-reconciliation-global
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPOSITORY: ${{ github.repository }}
  ISSUE: '1822'
  SOURCE_BRANCH: 'agent/pc61-terminal-reconcile-v5'
  RERUN_BRANCH: 'agent/pc61-terminal-reconcile-v5-rerun'
  OUT: '/tmp/pc61-v5-rerun'

jobs:
  rerun:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pc61-terminal-reconcile-v5-rerun'
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind terminal receipt or rerun exact immutable-parent controller
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA" HEAD

          receipt_count() {
            gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$ISSUE/comments?per_page=100" \
              | jq '[.[][] | select(.body|startswith("## PC-61 terminal receipt"))] | length'
          }
          refs_count() {
            if gh api "/repos/$GH_REPOSITORY/git/matching-refs/heads/agent/pc61" > "$OUT/refs.json" 2>/dev/null; then jq 'length' "$OUT/refs.json"; else echo 0; fi
          }
          open_pr_count() {
            gh api --method GET "/repos/$GH_REPOSITORY/pulls" -f state=open -F per_page=100 \
              | jq '[.[] | select(.head.ref|startswith("agent/pc61"))] | length'
          }

          receipts=$(receipt_count)
          refs=$(refs_count)
          prs=$(open_pr_count)
          if [ "$receipts" -ge 1 ] && [ "$refs" -le 1 ] && [ "$prs" -le 1 ]; then
            jq -n --arg receipts "$receipts" --arg refs "$refs" --arg prs "$prs" '{schema_version:"pc61-v5-rerun@1",status:"terminal_receipt_already_present",rerun_executed:false,terminal_receipts:($receipts|tonumber),observed_refs:($refs|tonumber),observed_open_prs:($prs|tonumber)}' > "$OUT/receipt.json"
            exit 0
          fi

          owner=${GH_REPOSITORY%%/*}
          gh api --method GET "/repos/$GH_REPOSITORY/pulls" -f state=all -f head="$owner:$SOURCE_BRANCH" -F per_page=100 > "$OUT/source-prs.json"
          test "$(jq 'length' "$OUT/source-prs.json")" -ge 1
          jq 'sort_by(.number) | last' "$OUT/source-prs.json" > "$OUT/source-pr.json"
          SOURCE_HEAD=$(jq -r .head.sha "$OUT/source-pr.json")
          test -n "$SOURCE_HEAD"

          run_id=''
          for attempt in $(seq 1 120); do
            gh api "/repos/$GH_REPOSITORY/actions/runs?head_sha=$SOURCE_HEAD&event=pull_request&per_page=100" > "$OUT/source-runs.json"
            run_id=$(jq -r '[.workflow_runs[] | select(.name=="PC-61 immutable-parent terminal reconciler")] | sort_by(.run_number) | last | .id // empty' "$OUT/source-runs.json")
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" > "$OUT/source-run-id.txt"

          for attempt in $(seq 1 1680); do
            gh api "/repos/$GH_REPOSITORY/actions/runs/$run_id" > "$OUT/source-run.json"
            [ "$(jq -r .status "$OUT/source-run.json")" = completed ] && break
            receipts=$(receipt_count)
            [ "$receipts" -ge 1 ] && break
            sleep 15
          done

          receipts=$(receipt_count)
          if [ "$receipts" -ge 1 ]; then
            jq -n --arg source "$run_id" '{schema_version:"pc61-v5-rerun@1",status:"source_controller_terminalized",source_run:($source|tonumber),rerun_executed:false}' > "$OUT/receipt.json"
            exit 0
          fi
          test "$(jq -r .status "$OUT/source-run.json")" = completed
          conclusion=$(jq -r .conclusion "$OUT/source-run.json")
          case "$conclusion" in
            failure|cancelled|timed_out|action_required|stale) ;;
            *) echo "source controller is not eligible for rerun: $conclusion" >&2; exit 1 ;;
          esac
          source_attempt=$(jq -r .run_attempt "$OUT/source-run.json")
          gh api --method POST "/repos/$GH_REPOSITORY/actions/runs/$run_id/rerun" > "$OUT/rerun-response.json"

          terminal=false
          final_conclusion=''
          for attempt in $(seq 1 1920); do
            receipts=$(receipt_count)
            if [ "$receipts" -ge 1 ]; then terminal=true; break; fi
            gh api "/repos/$GH_REPOSITORY/actions/runs/$run_id" > "$OUT/rerun-current.json"
            if [ "$(jq -r .status "$OUT/rerun-current.json")" = completed ] && [ "$(jq -r .run_attempt "$OUT/rerun-current.json")" -gt "$source_attempt" ]; then
              final_conclusion=$(jq -r .conclusion "$OUT/rerun-current.json")
              break
            fi
            sleep 15
          done
          receipts=$(receipt_count)
          [ "$receipts" -ge 1 ] && terminal=true
          jq -n --arg source "$run_id" --argjson terminal "$terminal" --arg conclusion "$final_conclusion" '{schema_version:"pc61-v5-rerun@1",status:(if $terminal then "terminal" else "rerun_completed_without_terminal_receipt" end),source_run:($source|tonumber),rerun_executed:true,terminal:$terminal,final_conclusion:$conclusion}' > "$OUT/receipt.json"
          test "$terminal" = true

      - name: Preserve v5 rerun evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc61-immutable-parent-reconciler-rerun
          path: /tmp/pc61-v5-rerun
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Retire rerun carrier after terminal receipt
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          receipts=$(gh api --paginate --slurp "/repos/$GH_REPOSITORY/issues/$ISSUE/comments?per_page=100" | jq '[.[][] | select(.body|startswith("## PC-61 terminal receipt"))] | length')
          test "$receipts" -ge 1
          gh api --method PATCH "/repos/$GH_REPOSITORY/pulls/${{ github.event.pull_request.number }}" -f state=closed > /tmp/pc61-v5-rerun-pr-closed.json || true
          gh api --method DELETE "/repos/$GH_REPOSITORY/git/refs/heads/$RERUN_BRANCH" || true
