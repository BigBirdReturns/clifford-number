name: Apply Wave 39 review fixes

on:
  pull_request:
    paths:
      - '.ci/review-fix/counter-selector-wave-39-review.part-*'
      - '.github/workflows/apply-counter-selector-wave-39-review-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply exact review repair and qualify final product
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EXPECTED_PARENT: a0ad6efb0365e7ac905e85bbef85d11b1df25ac9
          CANONICAL_BASE: 8a2aa74ea43827447ee8557c41fdc059d2f76a3c
          PATCH_SHA256: 6a7b4a057267f1e61686fb85966dc43ad261c8ca4aa9beb2292eba53d0ac593f
        run: |
          set -euo pipefail
          git config user.name 'Wave 39 review repair'
          git config user.email 'wave39-review-repair@users.noreply.github.com'

          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"

          cat .ci/review-fix/counter-selector-wave-39-review.part-* \
            | base64 -d > /tmp/counter-selector-wave-39-review-fix.tar.xz
          echo "$PATCH_SHA256  /tmp/counter-selector-wave-39-review-fix.tar.xz" \
            | sha256sum -c -

          rm -rf /tmp/wave39-review-fix
          mkdir -p /tmp/wave39-review-fix
          tar -xJf /tmp/counter-selector-wave-39-review-fix.tar.xz \
            -C /tmp/wave39-review-fix

          cat > /tmp/wave39-review-paths.txt <<'EOF'
          data/project/counter-selector-wave-39-control-registry.json
          data/project/counter-selector-wave-39-digest-selected-restore.json
          data/project/counter-selector-wave-39-release-manifest.json
          docs/milestones/counter-selector-wave-39.md
          reports/core-thesis/counter-selector-wave-39/data.json
          schemas/counter-selector-digest-selected-restore.schema.json
          test/counter-selector-wave-39.test.js
          tools/validate-counter-selector-wave-39.mjs
          EOF
          sed -i 's/^          //' /tmp/wave39-review-paths.txt
          find /tmp/wave39-review-fix -type f -printf '%P\n' \
            | LC_ALL=C sort > /tmp/wave39-review-archive-paths.txt
          diff -u /tmp/wave39-review-paths.txt /tmp/wave39-review-archive-paths.txt

          cp -a /tmp/wave39-review-fix/. .
          rm -f .ci/review-fix/counter-selector-wave-39-review.part-00 \
                .ci/review-fix/counter-selector-wave-39-review.part-01 \
                .ci/review-fix/counter-selector-wave-39-review.part-02 \
                .ci/review-fix/counter-selector-wave-39-review.part-03 \
                .github/workflows/apply-counter-selector-wave-39-review-fixes.yml
          rmdir .ci/review-fix 2>/dev/null || true
          rmdir .ci 2>/dev/null || true

          node tools/build-counter-selector-wave-39.mjs
          node tools/validate-counter-selector-wave-39.mjs
          node test/counter-selector-wave-39.test.js

          git add -A
          git diff --cached --check
          git diff --cached --name-only "$EXPECTED_PARENT" \
            | LC_ALL=C sort > /tmp/wave39-review-staged-paths.txt
          diff -u /tmp/wave39-review-paths.txt /tmp/wave39-review-staged-paths.txt

          git commit -m 'Wave 39: pin source custody and narrow priority claim'
          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"

          cat > /tmp/wave39-permanent-paths.txt <<'EOF'
          .github/workflows/counter-selector-wave-39.yml
          data/project/counter-selector-wave-39-control-registry.json
          data/project/counter-selector-wave-39-digest-selected-restore.json
          data/project/counter-selector-wave-39-release-manifest.json
          docs/methods/counter-selector-digest-selected-restore.md
          docs/milestones/counter-selector-wave-39.md
          reports/core-thesis/counter-selector-wave-39/data.json
          reports/core-thesis/counter-selector-wave-39/index.html
          schemas/counter-selector-digest-selected-restore.schema.json
          test/counter-selector-wave-39.test.js
          tools/build-counter-selector-wave-39.mjs
          tools/validate-counter-selector-wave-39.mjs
          EOF
          sed -i 's/^          //' /tmp/wave39-permanent-paths.txt
          git diff --name-only "$CANONICAL_BASE..$PRODUCT_COMMIT" \
            | LC_ALL=C sort > /tmp/wave39-final-paths.txt
          diff -u /tmp/wave39-permanent-paths.txt /tmp/wave39-final-paths.txt

          rm -rf /tmp/wave39-review-gate
          git worktree add --detach /tmp/wave39-review-gate "$PRODUCT_COMMIT"
          (
            cd /tmp/wave39-review-gate
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            npm run release:check
            git restore --staged --worktree .
            node tools/build-counter-selector-wave-39.mjs
            node tools/validate-counter-selector-wave-39.mjs
            node test/counter-selector-wave-39.test.js
            test -z "$(git status --porcelain)"
          )
          git worktree remove /tmp/wave39-review-gate
          test -z "$(git status --porcelain)"

          python3 - <<PY
          import json
          from pathlib import Path
          receipt = {
              'schema_version': 'counter-selector-wave-39-review-repair-receipt@1',
              'base_commit': '$CANONICAL_BASE',
              'review_parent': '$EXPECTED_PARENT',
              'product_commit': '$PRODUCT_COMMIT',
              'product_tree': '$PRODUCT_TREE',
              'patch_sha256': '$PATCH_SHA256',
              'changed_product_paths': Path('/tmp/wave39-review-paths.txt').read_text().splitlines(),
              'permanent_paths': Path('/tmp/wave39-permanent-paths.txt').read_text().splitlines(),
              'priority_claim': 'one observed public checkpoint control',
              'source_mapping': 'exact control/source-id/url/artifact-scope pinned',
              'adversarial_mutations': 187,
              'complete_release_gate': 'passed',
              'deterministic_reconstruction': 'passed',
              'temporary_paths_survive': False,
          }
          Path('/tmp/counter-selector-wave-39-review-repair.json').write_text(
              json.dumps(receipt, indent=2) + '\n'
          )
          PY

          git push --force-with-lease="refs/heads/$BRANCH_NAME:$(git rev-parse HEAD^)" \
            origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Preserve exact review-repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-selector-wave-39-review-repair-${{ github.run_id }}
          path: /tmp/counter-selector-wave-39-review-repair.json
          if-no-files-found: error
