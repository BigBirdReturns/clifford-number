name: TEMP export RD-04 Montana validation controller v1

on:
  pull_request:
    branches:
      - agent/ssc-rd04-mt-row-state-validation-controller-diagnostic-base-v1
    types: [opened, synchronize, reopened]
    paths:
      - '.tmp/rd04-mt-row-state-validation-materializer/controller-diagnostic-trigger.json'

permissions:
  contents: read

concurrency:
  group: temp-rd04-mt-row-state-validation-controller-export-v1
  cancel-in-progress: false

env:
  PAYLOAD: .tmp/rd04-mt-row-state-validation-materializer/package.tar.gz.b64
  OUT: /tmp/rd04-mt-row-state-validation-controller-export-v1
  PACKAGE: /tmp/rd04-mt-row-state-validation-controller-package-v1
  PAYLOAD_B64_BYTES: '14740'
  PAYLOAD_B64_SHA256: d19b30d285e725f0cba1844864f9a8a4d543e46de2ff66484e3a9b710b9771aa
  PAYLOAD_GZIP_BYTES: '11054'
  PAYLOAD_GZIP_SHA256: db899783e6a52055842ba9748b9ea1996d5bfa5b7806db374fbf127723c2c3ba
  PAYLOAD_TAR_BYTES: '61440'
  PAYLOAD_TAR_SHA256: d81a4cc83d47f192995a9bf32aed803f4f5c878799558ce906fc166ada7af559
  CONTROLLER_BYTES: '9075'
  CONTROLLER_SHA256: 5b9b91cf7e30af38ca4fcec137b8a43d5e3e9c3c3c21e259b6aa21a1bf9d1674

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'agent/ssc-rd04-mt-row-state-validation-controller-diagnostic-base-v1' &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-mt-row-state-validation-controller-diagnostic-trigger-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Authenticate exact one-path diagnostic carrier
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CARRIER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$CARRIER_BASE_SHA"
          test "$(git rev-list --count "$CARRIER_BASE_SHA..HEAD")" -eq 1
          printf '%s\n' '.tmp/rd04-mt-row-state-validation-materializer/controller-diagnostic-trigger.json' > /tmp/expected-paths.txt
          git diff --name-only "$CARRIER_BASE_SHA" HEAD | LC_ALL=C sort > /tmp/actual-paths.txt
          cmp /tmp/expected-paths.txt /tmp/actual-paths.txt
          test "$(git diff --name-only --diff-filter=A "$CARRIER_BASE_SHA" HEAD | wc -l)" -eq 1
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CARRIER_BASE_SHA" HEAD)"
          git diff --check "$CARRIER_BASE_SHA" HEAD

      - name: Verify and export exact controller without execution
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$PACKAGE"
          mkdir -p "$OUT" "$PACKAGE"
          test "$(stat -c %s "$PAYLOAD")" -eq "$PAYLOAD_B64_BYTES"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$PAYLOAD_B64_SHA256"
          base64 --decode "$PAYLOAD" > /tmp/rd04-mt-row-state-validation-controller-package.tar.gz
          test "$(stat -c %s /tmp/rd04-mt-row-state-validation-controller-package.tar.gz)" -eq "$PAYLOAD_GZIP_BYTES"
          test "$(sha256sum /tmp/rd04-mt-row-state-validation-controller-package.tar.gz | awk '{print $1}')" = "$PAYLOAD_GZIP_SHA256"
          gzip -dc /tmp/rd04-mt-row-state-validation-controller-package.tar.gz > /tmp/rd04-mt-row-state-validation-controller-package.tar
          test "$(stat -c %s /tmp/rd04-mt-row-state-validation-controller-package.tar)" -eq "$PAYLOAD_TAR_BYTES"
          test "$(sha256sum /tmp/rd04-mt-row-state-validation-controller-package.tar | awk '{print $1}')" = "$PAYLOAD_TAR_SHA256"
          python - <<'PY'
          import json
          import os
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path('/tmp/rd04-mt-row-state-validation-controller-package.tar')
          package = Path(os.environ['PACKAGE'])
          out = Path(os.environ['OUT'])
          with tarfile.open(archive, 'r:') as tf:
              members = tf.getmembers()
              assert members
              listing = []
              for member in members:
                  path = PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile()
                  listing.append({'name': member.name, 'bytes': member.size})
              tf.extractall(package)
          controller = package / 'controller.py'
          shutil.copyfile(controller, out / 'controller.py')
          (out / 'package-members.json').write_text(
              json.dumps(listing, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          receipt = {
              'schema_version': 'ssc-rd04-mt-row-state-validation-controller-export@1',
              'state': 'exact_controller_exported_without_execution',
              'event_head_sha': os.environ['GITHUB_SHA'],
              'payload_b64_sha256': os.environ['PAYLOAD_B64_SHA256'],
              'payload_gzip_sha256': os.environ['PAYLOAD_GZIP_SHA256'],
              'payload_tar_sha256': os.environ['PAYLOAD_TAR_SHA256'],
              'controller_bytes': int(os.environ['CONTROLLER_BYTES']),
              'controller_sha256': os.environ['CONTROLLER_SHA256'],
              'controller_executed': False,
              'source_requests': 0,
              'route_executions': 0,
              'product_branch_writes': 0,
              'matrix_updates': 0,
              'row_state_mutations': 0,
          }
          (out / 'export-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          test "$(stat -c %s "$OUT/controller.py")" -eq "$CONTROLLER_BYTES"
          test "$(sha256sum "$OUT/controller.py" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          python -m py_compile "$OUT/controller.py"
          (cd "$OUT" && sha256sum controller.py export-receipt.json package-members.json > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Preserve exact controller export
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-validation-controller-export-v1
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 9

      - name: Enforce zero-execution diagnostic authority
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .schema_version == "ssc-rd04-mt-row-state-validation-controller-export@1" and
            .state == "exact_controller_exported_without_execution" and
            .controller_executed == false and
            .source_requests == 0 and
            .route_executions == 0 and
            .product_branch_writes == 0 and
            .matrix_updates == 0 and
            .row_state_mutations == 0
          ' "$OUT/export-receipt.json" >/dev/null
          git status --porcelain=v1 | test ! -s /dev/stdin
