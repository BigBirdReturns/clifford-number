name: TEMP probe SSC RD-04 A06 CalFresh Decision Registry

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd04-a06-registry-probe-base
    paths:
      - '.github/tmp/ssc-rd04-a06-registry-probe.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-rd04-a06-registry-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a06-registry-probe-base
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute frozen query and count-only form-semantics diagnostics
        run: node .github/tmp/ssc-rd04-a06-registry-semantics.mjs
      - name: Upload exact A06 registry semantics receipt
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-a06-registry-semantics
          path: a06-semantics
          if-no-files-found: error
          retention-days: 30
