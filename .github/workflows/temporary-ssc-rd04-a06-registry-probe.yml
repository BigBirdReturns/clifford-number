name: TEMP probe SSC RD-04 A06 CalFresh Decision Registry

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd04-a06-registry-probe-base
    paths:
      - '.github/tmp/ssc-rd04-a06-registry-probe.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-rd04-a06-registry-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a06-registry-probe-base
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute the frozen registry query once
        run: |
          set -Eeuo pipefail
          mkdir -p a06-probe

          registry='https://acms.dss.ca.gov/acms/page.request.do?page=public.decisionRegistry'
          curl \
            --compressed --location --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 2 --max-time 180 \
            --user-agent 'clifford-number-public-record-acquisition/1.0' \
            --cookie-jar a06-probe/cookies.txt \
            --dump-header a06-probe/registry-page-headers.txt \
            --output a06-probe/registry-page.html \
            "$registry"

          curl \
            --get --compressed --location --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 2 --max-time 300 \
            --user-agent 'clifford-number-public-record-acquisition/1.0' \
            --header 'Accept: application/json, text/javascript, */*; q=0.01' \
            --header 'X-Requested-With: XMLHttpRequest' \
            --referer "$registry" \
            --cookie a06-probe/cookies.txt \
            --data-urlencode 'isForSearch=1' \
            --data-urlencode 'releasedAfter=07/01/2025' \
            --data-urlencode 'releasedBefore=06/30/2026' \
            --data-urlencode 'programType=2' \
            --data-urlencode 'captcha=bypass' \
            --data-urlencode 'captchaHash=bypass' \
            --dump-header a06-probe/query-response-headers.txt \
            --output a06-probe/query-response.bin \
            --write-out '%{http_code}\n%{url_effective}\n%{content_type}\n' \
            "$registry" > a06-probe/query-curl-meta.txt

          rm -f a06-probe/cookies.txt

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const root = 'a06-probe';
          const raw = fs.readFileSync(`${root}/query-response.bin`);
          const text = raw.toString('utf8');
          const curlMeta = fs.readFileSync(`${root}/query-curl-meta.txt`, 'utf8').trim().split(/\n/);
          const [statusText, finalUrl, contentType] = curlMeta;
          const status = Number(statusText);
          if (status !== 200) throw new Error(`registry query HTTP status ${statusText}`);
          if (/^\s*</.test(text)) throw new Error('registry query returned HTML instead of JSON');
          let rows;
          try { rows = JSON.parse(text); } catch (error) { throw new Error(`registry query JSON parse failed: ${error.message}`); }
          if (!Array.isArray(rows)) throw new Error('registry query response is not an array');

          const required = [
            'releaseDate', 'program', 'disposition', 'issueCodes', 'responsibleAgency',
            'orgArName', 'language', 'shnNumber', 'isArchived'
          ];
          const start = Date.UTC(2025, 6, 1);
          const end = Date.UTC(2026, 5, 30);
          const identities = new Map();
          const duplicateIdentities = [];
          const malformed = [];
          const dispositions = {};
          const archiveStates = {};
          const normalized = [];

          function parseDate(value) {
            const match = String(value ?? '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!match) return null;
            const [, mm, dd, yyyy] = match;
            const date = Date.UTC(Number(yyyy), Number(mm) - 1, Number(dd));
            return Number.isFinite(date) ? date : null;
          }

          for (let index = 0; index < rows.length; index += 1) {
            const row = rows[index];
            const errors = [];
            if (!row || typeof row !== 'object' || Array.isArray(row)) {
              malformed.push({ index, errors: ['row_not_object'] });
              continue;
            }
            for (const key of required) if (!(key in row)) errors.push(`missing_${key}`);
            if (String(row.program ?? '').trim() !== 'CalFresh') errors.push(`program_${String(row.program ?? '')}`);
            const released = parseDate(row.releaseDate);
            if (released === null) errors.push(`release_date_${String(row.releaseDate ?? '')}`);
            else if (released < start || released > end) errors.push(`release_date_outside_${row.releaseDate}`);

            const archived = row.isArchived === true || row.isArchived === 'true';
            const nonarchived = row.isArchived === false || row.isArchived === 'false';
            if (!archived && !nonarchived) errors.push(`archive_state_${String(row.isArchived ?? '')}`);
            const idField = archived ? 'registryId' : 'decisionId';
            const id = String(row[idField] ?? '').trim();
            if (!id) errors.push(`missing_${idField}`);
            const identity = `${archived ? 'archived:true:registry' : 'archived:false:decision'}:${id}`;

            if (errors.length) malformed.push({ index, identity, errors });
            const prior = identities.get(identity);
            if (prior) duplicateIdentities.push({ identity, first_index: prior.index, duplicate_index: index, same_row: JSON.stringify(prior.row) === JSON.stringify(row) });
            else identities.set(identity, { index, row });

            const disposition = String(row.disposition ?? '').trim() || '<empty>';
            dispositions[disposition] = (dispositions[disposition] ?? 0) + 1;
            const archiveKey = archived ? 'archived' : nonarchived ? 'current' : 'malformed';
            archiveStates[archiveKey] = (archiveStates[archiveKey] ?? 0) + 1;
            const downloadUrl = archived
              ? `https://acms.dss.ca.gov/acms/page.request.do?page=public.decisionRegistryDownload&registry=${encodeURIComponent(id)}&archived=true`
              : `https://acms.dss.ca.gov/acms/page.request.do?page=public.decisionRegistryDownload&decision=${encodeURIComponent(id)}&archived=false`;
            normalized.push({ index, identity, id_field: idField, id, download_url: downloadUrl, row });
          }

          normalized.sort((a, b) => a.identity.localeCompare(b.identity) || a.index - b.index);
          const sha256 = crypto.createHash('sha256').update(raw).digest('hex');
          const query = {
            schema_version: 'ssc-rd04-a06-frozen-query@1',
            issue: 721,
            endpoint: 'https://acms.dss.ca.gov/acms/page.request.do?page=public.decisionRegistry',
            ordered_parameters: [
              ['isForSearch', '1'],
              ['releasedAfter', '07/01/2025'],
              ['releasedBefore', '06/30/2026'],
              ['programType', '2'],
              ['captcha', 'bypass'],
              ['captchaHash', 'bypass']
            ],
            unfiltered_dimensions: ['disposition', 'responsibleAgency', 'issueCodes', 'shnNumber', 'organizationalAr'],
            parent_main: '80f6f10e0a0a631dd89d7b92df24fd1ffd2d1589',
            parent_release_sha256: 'b3f36dff2969d95767e6f0d564f7d3744bd72de98cf2b758d4729c6bc0de50c4'
          };
          const summary = {
            schema_version: 'ssc-rd04-a06-registry-probe@1',
            query,
            response: {
              http_status: status,
              final_url: finalUrl,
              content_type: contentType,
              bytes: raw.length,
              sha256
            },
            counts: {
              rows_returned: rows.length,
              normalized_rows: normalized.length,
              unique_identities: identities.size,
              duplicate_identities: duplicateIdentities.length,
              malformed_rows: malformed.length,
              a05_decisions_released: 10582,
              registry_minus_a05_aggregate: rows.length - 10582
            },
            dispositions: Object.fromEntries(Object.entries(dispositions).sort()),
            archive_states: archiveStates,
            authority: {
              complete_frozen_query_response: duplicateIdentities.length === 0 && malformed.length === 0,
              complete_fy_decision_universe: false,
              case_level_join: false,
              implementation_or_restoration: false,
              external_review: false,
              graph_effect: 'none'
            }
          };

          fs.writeFileSync(`${root}/frozen-query.json`, `${JSON.stringify(query, null, 2)}\n`);
          fs.writeFileSync(`${root}/normalized-rows.json`, `${JSON.stringify(normalized, null, 2)}\n`);
          fs.writeFileSync(`${root}/duplicate-identities.json`, `${JSON.stringify(duplicateIdentities, null, 2)}\n`);
          fs.writeFileSync(`${root}/malformed-rows.json`, `${JSON.stringify(malformed, null, 2)}\n`);
          fs.writeFileSync(`${root}/summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary.counts));
          if (malformed.length) throw new Error(`registry response has ${malformed.length} malformed rows`);
          if (duplicateIdentities.length) throw new Error(`registry response has ${duplicateIdentities.length} duplicate identities`);
          NODE
      - name: Upload exact A06 registry probe
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-a06-registry-probe
          path: a06-probe
          if-no-files-found: error
          retention-days: 30
