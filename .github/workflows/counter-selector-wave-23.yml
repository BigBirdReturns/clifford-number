name: Counter-Selector Wave 23 full-record corroboration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-23.yml'
      - 'data/project/counter-selector-wave-23-*.json'
      - 'schemas/counter-selector-full-record-corroboration.schema.json'
      - 'docs/methods/counter-selector-full-record-corroboration.md'
      - 'docs/milestones/counter-selector-wave-23.md'
      - 'tools/build-counter-selector-wave-23.mjs'
      - 'tools/validate-counter-selector-wave-23.mjs'
      - 'test/counter-selector-wave-23.test.js'
      - 'reports/core-thesis/counter-selector-wave-23/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-23.yml'
      - 'data/project/counter-selector-wave-23-*.json'
      - 'schemas/counter-selector-full-record-corroboration.schema.json'
      - 'docs/methods/counter-selector-full-record-corroboration.md'
      - 'docs/milestones/counter-selector-wave-23.md'
      - 'tools/build-counter-selector-wave-23.mjs'
      - 'tools/validate-counter-selector-wave-23.mjs'
      - 'test/counter-selector-wave-23.test.js'
      - 'reports/core-thesis/counter-selector-wave-23/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 23 products
        run: node tools/build-counter-selector-wave-23.mjs
      - name: Validate full-record corroboration contract
        run: node tools/validate-counter-selector-wave-23.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-23.test.js
      - name: Require exact committed Wave 23 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-23-corroboration-registry.json \
            data/project/counter-selector-wave-23-release-manifest.json \
            reports/core-thesis/counter-selector-wave-23/data.json \
            reports/core-thesis/counter-selector-wave-23/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 23 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-23.mjs
          node tools/validate-counter-selector-wave-23.mjs
          node test/counter-selector-wave-23.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
