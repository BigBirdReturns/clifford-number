name: TEMP prove exact SSC RD-06 Wave 02 offeror matrix v1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd06-wave02-exact-head-proof-base-v1
    paths:
      - '.github/tmp/ssc-rd06-wave02-exact-head-proof-v1.trigger'

permissions:
  contents: read

concurrency:
  group: ssc-rd06-wave02-exact-head-proof-v1
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54854462decbf3b93ab9dd36a35fd4da00981081
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild, validate, and adversarially test the exact eight-slot matrix
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '54854462decbf3b93ab9dd36a35fd4da00981081'
          node tools/validate-no-magic-human-gate.mjs
          node tools/acquisition/status-sovereignty-rd-wave02-rd06/build-offeror-field-matrix.mjs
          node tools/acquisition/status-sovereignty-rd-wave02-rd06/validate-offeror-field-matrix.mjs
          node test/status-sovereignty-rd-wave02-rd06-offeror-field-matrix.test.js
          git diff --exit-code
      - name: Prove immutable proposal-slot and authority denominators
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const path = 'data/intake/status-sovereignty-rd-wave02-rd06-offeror-universe/field-matrix.json';
          const body = fs.readFileSync(path);
          const value = JSON.parse(body.toString('utf8'));
          if (value.class_id !== 'RD-06-C01' || value.issue !== 791) throw new Error('lane identity');
          if (!Array.isArray(value.proposal_slots) || value.proposal_slots.length !== 8) throw new Error(`proposal slots ${value.proposal_slots?.length}`);
          if (!Array.isArray(value.required_fields) || value.required_fields.length !== 10) throw new Error(`required fields ${value.required_fields?.length}`);
          const named = value.proposal_slots.filter((row) => row.identity_state === 'publicly_named').length;
          const unresolved = value.proposal_slots.filter((row) => row.identity_state === 'identity_unresolved').length;
          const awardees = value.proposal_slots.filter((row) => row.fields?.proposal_status?.value?.award === true).length;
          if (named !== 3 || unresolved !== 5 || awardees !== 2) throw new Error(`named/unresolved/awardees ${named}/${unresolved}/${awardees}`);
          if (value.counts?.named_rejected_offerors !== 1) throw new Error('named rejected offeror denominator');
          if (value.counts?.fixed_protocol_completed_slots !== 0 || value.counts?.closed_slots !== 0 || value.counts?.class_closed !== 0) throw new Error('premature closure');
          if (value.current_result?.fixed_protocol_complete !== false || value.current_result?.class_closed !== false) throw new Error('result closure');
          if (value.counts?.external_contacts !== 0 || value.counts?.external_reviews !== 0) throw new Error('outside activity');
          if (value.current_result?.publication_effect !== 'none' || value.current_result?.adoption_effect !== 'none' || value.current_result?.graph_effect !== 'none') throw new Error('effect authority');
          console.log(JSON.stringify({
            path,
            bytes: body.length,
            sha256: crypto.createHash('sha256').update(body).digest('hex'),
            proposal_slots: 8,
            named_public_identities: named,
            unresolved_identity_slots: unresolved,
            awardees,
            named_rejected_offerors: 1,
            required_fields: value.required_fields.length
          }));
          NODE
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reproduce exact bytes after complete gate
        run: |
          set -Eeuo pipefail
          git restore --staged --worktree .
          node tools/validate-no-magic-human-gate.mjs
          node tools/acquisition/status-sovereignty-rd-wave02-rd06/build-offeror-field-matrix.mjs
          node tools/acquisition/status-sovereignty-rd-wave02-rd06/validate-offeror-field-matrix.mjs
          node test/status-sovereignty-rd-wave02-rd06-offeror-field-matrix.test.js
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Emit exact RD-06 proof receipt
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const path = 'data/intake/status-sovereignty-rd-wave02-rd06-offeror-universe/field-matrix.json';
          const body = fs.readFileSync(path);
          const value = JSON.parse(body.toString('utf8'));
          const receipt = {
            schema_version: 'ssc-rd06-wave02-exact-head-proof@1',
            issue: 791,
            class_id: 'RD-06-C01',
            exact_head: '54854462decbf3b93ab9dd36a35fd4da00981081',
            matrix: {
              path,
              bytes: body.length,
              sha256: crypto.createHash('sha256').update(body).digest('hex'),
              proposal_slots: value.proposal_slots.length,
              named_public_identities: value.counts.named_public_identities,
              unresolved_identity_slots: value.counts.unresolved_identity_slots,
              awardees: value.counts.awardees,
              named_rejected_offerors: value.counts.named_rejected_offerors,
              required_fields: value.required_fields.length
            },
            gates: {
              no_magic_human: 'pass',
              deterministic_builder: 'pass',
              structural_validator: 'pass',
              adversarial_suite: 'pass',
              exact_byte_replay: 'pass',
              complete_repository_release_gate: 'pass'
            },
            authority: {
              fixed_protocol_complete: false,
              class_closed: false,
              substantive_finding_created: false,
              external_contacts: 0,
              external_reviews: 0,
              publication_effect: 'none',
              adoption_effect: 'none',
              graph_effect: 'none'
            }
          };
          fs.writeFileSync('ssc-rd06-wave02-exact-head-proof.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
      - name: Upload exact RD-06 proof
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd06-wave02-exact-head-proof-v1
          path: ssc-rd06-wave02-exact-head-proof.json
          if-no-files-found: error
          retention-days: 90
