name: Preference custody epistemic-quality control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/epistemic-quality.fixture.json'
      - 'tools/lib/preference-epistemic-quality.mjs'
      - 'tools/compile-preference-epistemic-quality.mjs'
      - 'tools/validate-preference-epistemic-quality.mjs'
      - 'test/preference-epistemic-quality.test.js'
      - 'docs/preference-custody-epistemic-quality.md'
      - '.github/workflows/preference-epistemic-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  epistemic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile epistemic-quality worlds
        run: node tools/compile-preference-epistemic-quality.mjs
      - name: Validate source, integrity, visibility, proposal, and authority boundaries
        run: node tools/validate-preference-epistemic-quality.mjs
      - name: Exercise diversity, laundering, monoculture, cascade, suppression, integrity, and tamper fixtures
        run: node test/preference-epistemic-quality.test.js
      - name: Preserve deterministic epistemic-quality projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-epistemic-quality-pc13
          path: |
            build/research/preference-epistemic-quality.json
            build/research/preference-epistemic-quality.md
          if-no-files-found: error
