name: TEMP prove exact PC-50 canonical merge a564

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pc50-postmerge-proof-a564-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove-canonical-merge:
    if: github.head_ref == 'agent/pc50-postmerge-proof-a564'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact canonical PC-50 merge
        uses: actions/checkout@v4
        with:
          ref: a564aeb99bed19c1f0b0d216c08f08f6b422bc0e
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify topology, exact paths, and Git blob identities
        run: |
          set -Eeuo pipefail
          merge=a564aeb99bed19c1f0b0d216c08f08f6b422bc0e
          base=51b9a58b13fe10587280c027740188061b6e02f5
          product=f7a9ebe30330ae9149a96051d6ebb1b1f63ec193
          qualified=d87172a41e88c1709b37a114b50df733545126c8
          product_tree=ad80bb9458dfa4c02a3f5587b725d9ae00c24ca5

          test "$(git rev-parse HEAD^{commit})" = "$merge"
          test "$(git rev-list --parents -n 1 "$merge" | wc -w)" -eq 3
          test "$(git rev-parse "$merge^1")" = "$base"
          test "$(git rev-parse "$merge^2")" = "$product"
          test "$(git rev-parse "$product^1")" = "$qualified"
          test "$(git rev-parse "$product^{tree}")" = "$product_tree"

          cat > /tmp/pc50-product-paths.txt <<'EOF'
          .github/workflows/preference-custody-v48.yml
          .github/workflows/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.yml
          data/research/preference-custody/control-manifest-v48.json
          data/research/preference-custody/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.fixture.json
          docs/preference-custody-laboratory-floor-v48.md
          docs/preference-custody-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.md
          test/preference-custody-manifest-v48.test.js
          test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js
          tools/compile-preference-custody-manifest-v48.mjs
          tools/compile-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
          tools/lib/preference-custody-manifest-v48.mjs
          tools/lib/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
          tools/validate-preference-custody-manifest-v48.mjs
          tools/validate-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
          EOF
          sort /tmp/pc50-product-paths.txt -o /tmp/pc50-product-paths.txt
          test "$(wc -l < /tmp/pc50-product-paths.txt)" -eq 14

          sed 's/^/A\t/' /tmp/pc50-product-paths.txt > /tmp/pc50-expected-name-status.txt
          git diff --name-status "$base" "$merge" | sort > /tmp/pc50-actual-name-status.txt
          diff -u /tmp/pc50-expected-name-status.txt /tmp/pc50-actual-name-status.txt

          while read -r path; do
            merge_blob=$(git rev-parse "$merge:$path")
            product_blob=$(git rev-parse "$product:$path")
            test "$merge_blob" = "$product_blob"
          done < /tmp/pc50-product-paths.txt

          if git diff --name-only "$base" "$merge" | grep -E '(^|/)(carrier|materializer|controller|diagnostic|trigger|marker|pulse|receipt|shard|package)([./_-]|$)'; then
            echo 'transport or control path leaked into canonical product' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          merge = 'a564aeb99bed19c1f0b0d216c08f08f6b422bc0e'
          base = '51b9a58b13fe10587280c027740188061b6e02f5'
          product = 'f7a9ebe30330ae9149a96051d6ebb1b1f63ec193'
          qualified = 'd87172a41e88c1709b37a114b50df733545126c8'
          paths = Path('/tmp/pc50-product-paths.txt').read_text().splitlines()

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          receipt = {
              'schema_version': 'pc50-exact-postmerge-proof@1',
              'canonical_merge': merge,
              'canonical_merge_tree': git('rev-parse', f'{merge}^{{tree}}'),
              'base_parent': base,
              'product_parent': product,
              'qualified_product_parent': qualified,
              'product_tree': git('rev-parse', f'{product}^{{tree}}'),
              'parent_count': len(git('rev-list', '--parents', '-n', '1', merge).split()) - 1,
              'permanent_path_count': len(paths),
              'permanent_paths': [
                  {
                      'path': path,
                      'canonical_blob': git('rev-parse', f'{merge}:{path}'),
                      'product_blob': git('rev-parse', f'{product}:{path}'),
                  }
                  for path in paths
              ],
              'transport_paths': 0,
              'outside_human_dependency': False,
              'graph_effect': 'none',
          }
          Path('/tmp/pc50-exact-postmerge-proof.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({
              'canonical_merge': receipt['canonical_merge'],
              'canonical_merge_tree': receipt['canonical_merge_tree'],
              'parent_count': receipt['parent_count'],
              'permanent_path_count': receipt['permanent_path_count'],
          }, indent=2))
          PY

      - name: Replay standalone PC-50 and floor v48
        run: |
          set -Eeuo pipefail
          {
            node tools/compile-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
            node tools/validate-preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.mjs
            node test/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.test.js
            node tools/compile-preference-custody-manifest-v48.mjs
            node tools/validate-preference-custody-manifest-v48.mjs
            node test/preference-custody-manifest-v48.test.js
          } 2>&1 | tee /tmp/pc50-exact-postmerge-focused.log

      - name: Reconstruct every Preference Custody floor
        run: |
          set -Eeuo pipefail
          {
            for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
              node "$test_file"
            done
            node test/preference-custody-manifest.test.js
          } 2>&1 | tee /tmp/pc50-exact-postmerge-history.log

      - name: Enforce no-magic-human and complete release gates
        run: |
          set -Eeuo pipefail
          {
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
            npm run release:check
          } 2>&1 | tee /tmp/pc50-exact-postmerge-release.log

      - name: Upload exact canonical-merge proof
        uses: actions/upload-artifact@v4
        with:
          name: pc50-exact-postmerge-proof-a564
          path: |
            /tmp/pc50-exact-postmerge-proof.json
            /tmp/pc50-product-paths.txt
            /tmp/pc50-expected-name-status.txt
            /tmp/pc50-actual-name-status.txt
            /tmp/pc50-exact-postmerge-focused.log
            /tmp/pc50-exact-postmerge-history.log
            /tmp/pc50-exact-postmerge-release.log
            build/research/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.json
            build/research/preference-linkage-executable-artifact-build-dependency-environment-runtime-identity-assurance.md
            build/research/preference-custody-laboratory-floor-v48.json
            build/research/preference-custody-laboratory-floor-v48.md
          if-no-files-found: error
          retention-days: 90
