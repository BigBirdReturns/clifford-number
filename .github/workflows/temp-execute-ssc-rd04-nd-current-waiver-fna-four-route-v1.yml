          xz -dc "$OUT/transport-program.py.xz" > "$PROGRAM"
          test "$(stat -c %s "$PROGRAM")" -eq "$PROGRAM_BYTES"
          test "$(sha256sum "$PROGRAM" | awk '{print $1}')" = "$PROGRAM_SHA256"
          python -m py_compile "$PROGRAM"

          stage=execute_exact_four_routes
          python "$PROGRAM" "$PROTOCOL/selected-followup-protocol.json" "$OUT"

          stage=complete
          test "$(git rev-parse origin/main)" = "$CANONICAL_PARENT"
          jq -e '
            .state=="transport_complete" and .failed_or_final_stage=="complete" and .exit_code==0 and
            .fixed_routes==4 and .initiated_route_attempts==4 and .terminal_routes==4 and
            .physical_requests>=4 and .physical_requests<=24 and .same_host_expansion==0 and
            .result_spawned_requests==0 and .source_admissions==0 and .field_classifications==0 and
            .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and
            .class_closed==false and .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and .publication_effect=="none" and
            .adoption_effect=="none" and .graph_effect=="none" and
            .additional_execution_authorized==false
          ' "$OUT/execution-receipt.json" > /dev/null

      - name: Preserve exact four-route transport artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-current-waiver-fna-four-route-transport-v1
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Enforce terminal transport custody
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          test "${{ steps.execute.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          jq -e '
            .state=="transport_complete" and .failed_or_final_stage=="complete" and .exit_code==0 and
            .canonical_parent=="b1d1d8afb6c957401a762bf9d0b2abc464bd5e07" and
            .canonical_tree=="64f5b5e9e9d72bdf86ef6cf14d728b2ae996f834" and
            .protocol_artifact_id==9029362471 and .fixed_routes==4 and
            .initiated_route_attempts==4 and .terminal_routes==4 and
            .physical_requests>=4 and .physical_requests<=24 and .same_host_expansion==0 and
            .result_spawned_requests==0 and .source_admissions==0 and .field_classifications==0 and
            .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and
            .class_closed==false and .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and .publication_effect=="none" and
            .adoption_effect=="none" and .graph_effect=="none" and
            .additional_execution_authorized==false
          ' "$OUT/execution-receipt.json" > /dev/null
          (cd "$OUT" && sha256sum -c SHA256SUMS)
