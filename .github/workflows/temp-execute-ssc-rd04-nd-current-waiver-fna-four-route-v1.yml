name: TEMP execute RD-04 North Dakota FNA four-route follow-up v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-execute-ssc-rd04-nd-current-waiver-fna-four-route-v1.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CANONICAL_PARENT: b1d1d8afb6c957401a762bf9d0b2abc464bd5e07
  CANONICAL_TREE: 64f5b5e9e9d72bdf86ef6cf14d728b2ae996f834
  PROTOCOL_ARTIFACT_ID: '9029362471'
  PROTOCOL_ARTIFACT_BYTES: '6210523'
  PROTOCOL_ARTIFACT_SHA256: ffc95827c6747eee4a3b054740610bb30529652ae0eb488984a84f6e80f945a3
  PROTOCOL_RECEIPT_SHA256: b10eb3ba6b2c3dede0fcfc50ac5000ef517141d69029a7c08d29356ebdecd4c3
  PROTOCOL_SHA256: 8959e089855b322383b0fe2b8fb99201e11ba0915d858ca71246e04f07903cd7
  PROTOCOL_BYTES: '2497'
  PROGRAM_XZ_BYTES: '5280'
  PROGRAM_XZ_SHA256: d3edbce86664fcbb314532028ef3e70bbaa2e782c5ed12f0da78782e05910c94
  PROGRAM_BYTES: '20413'
  PROGRAM_SHA256: 68618342b04074389d8ea95f1e6f524182a62b3afe9a2ce596116102db51c5a9
  TARGET_BRANCH: agent/ssc-rd04-nd-current-waiver-fna-four-route-execution-v1
  WORKFLOW_PATH: .github/workflows/temp-execute-ssc-rd04-nd-current-waiver-fna-four-route-v1.yml
  OUTPUT_DIR: /tmp/ssc-rd04-nd-current-waiver-fna-four-route-transport-v1

concurrency:
  group: temp-execute-rd04-nd-current-waiver-fna-four-route-v1
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-current-waiver-fna-four-route-execution-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute exact four-route transport
        id: execute
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$OUTPUT_DIR"
          PROTOCOL="$OUT/protocol"
          PROGRAM="$OUT/transport-program.py"
          rm -rf "$OUT"
          mkdir -p "$OUT" "$PROTOCOL"
          stage=bootstrap
          exec > >(tee "$OUT/transport.log") 2>&1

          finalize() {
            local rc=$?
            trap - EXIT
            set +e
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            if [ ! -f "$OUT/execution-receipt.json" ]; then
              jq -n \
                --arg state failed_closed \
                --arg failed_stage "$stage" \
                --argjson exit_code "$rc" \
                --arg canonical_parent "$CANONICAL_PARENT" \
                --arg protocol_artifact "$PROTOCOL_ARTIFACT_ID" \
                '{
                  schema_version:"ssc-rd04-nd-current-waiver-fna-four-route-transport@1",
                  state:$state,failed_or_final_stage:$failed_stage,exit_code:$exit_code,
                  canonical_parent:$canonical_parent,protocol_artifact_id:($protocol_artifact|tonumber),
                  fixed_routes:4,initiated_route_attempts:0,physical_requests:0,terminal_routes:0,
                  result_spawned_requests:0,source_admissions:0,field_classifications:0,
                  field_terminalizations:0,matrix_updates:0,row_state_mutations:0,class_closed:false,
                  cumulative_ledger_effect:"none",outside_human_dependency:false,
                  publication_effect:"none",adoption_effect:"none",graph_effect:"none",
                  additional_execution_authorized:false
                }' > "$OUT/execution-receipt.json"
            fi
            (
              cd "$OUT"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          stage=bind_exact_carrier_and_live_main
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REF" = "$TARGET_BRANCH"
          test "$HEAD_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_PARENT"
          test "$(git rev-list --count "$CANONICAL_PARENT"..HEAD)" -eq 1
          test "$(git diff --name-only "$CANONICAL_PARENT" HEAD)" = "$WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD)" = "$WORKFLOW_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"
          test "$(git rev-parse "$CANONICAL_PARENT^{tree}")" = "$CANONICAL_TREE"
          git diff --check "$CANONICAL_PARENT" HEAD
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse origin/main)" = "$CANONICAL_PARENT"

          stage=authenticate_selected_protocol
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROTOCOL_ARTIFACT_ID" \
            > "$OUT/protocol-artifact.json"
          jq -e \
            --argjson id "$PROTOCOL_ARTIFACT_ID" \
            --argjson bytes "$PROTOCOL_ARTIFACT_BYTES" \
            --arg digest "sha256:$PROTOCOL_ARTIFACT_SHA256" \
            '.id==$id and .expired==false and .size_in_bytes==$bytes and .digest==$digest' \
            "$OUT/protocol-artifact.json" > /dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROTOCOL_ARTIFACT_ID/zip" \
            > "$OUT/protocol.zip"
          test "$(stat -c %s "$OUT/protocol.zip")" -eq "$PROTOCOL_ARTIFACT_BYTES"
          test "$(sha256sum "$OUT/protocol.zip" | awk '{print $1}')" = "$PROTOCOL_ARTIFACT_SHA256"
          unzip -t "$OUT/protocol.zip" > "$OUT/protocol-zip-test.txt"
          unzip -q "$OUT/protocol.zip" -d "$PROTOCOL"
          (cd "$PROTOCOL" && sha256sum -c SHA256SUMS)
          test "$(cat "$PROTOCOL/STAGE")" = complete
          test "$(cat "$PROTOCOL/EXIT_CODE")" = 0
          test "$(stat -c %s "$PROTOCOL/selected-followup-protocol.json")" -eq "$PROTOCOL_BYTES"
          test "$(sha256sum "$PROTOCOL/selected-followup-protocol.json" | awk '{print $1}')" = "$PROTOCOL_SHA256"
          test "$(sha256sum "$PROTOCOL/receipt.json" | awk '{print $1}')" = "$PROTOCOL_RECEIPT_SHA256"
          jq -e '
            .state=="complete" and .promotion_candidates==0 and .held_open_fields==1 and
            .selected_followup_routes==4 and .source_requests==0 and .route_executions==0 and
            .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and
            .class_closed==false and
            .next_authorized_operation=="execute the four exact FNA routes once; do not re-run the seventy-five-route census"
          ' "$PROTOCOL/receipt.json" > /dev/null

