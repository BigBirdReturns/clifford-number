name: TEMP acquire School.House related-charity official Form 990 XML

on:
  pull_request:
    paths:
      - '.github/workflows/temp-schoolhouse-honor-foundation-990-official-xml.yml'
      - '.schoolhouse-honor-foundation-990-official-xml/EXECUTE'
      - '.schoolhouse-honor-foundation-990-official-xml/capture.py.gz.b64'
  workflow_dispatch:

concurrency:
  group: temp-schoolhouse-honor-foundation-990-official-xml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact official-XML acquisition head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate parent, resolved IRS routes, and runner custody
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_MAIN='d87172a41e88c1709b37a114b50df733545126c8'
          BUNDLE='.schoolhouse-honor-foundation-990-official-xml/capture.py.gz.b64'
          EXECUTE='.schoolhouse-honor-foundation-990-official-xml/EXECUTE'
          WORKFLOW='.github/workflows/temp-schoolhouse-honor-foundation-990-official-xml.yml'
          RUNNER='/tmp/capture-schoolhouse-honor-foundation-990-official-xml.py'
          EXPECTED_RUNNER_SHA='cafb3c26715b5e0054f17aa64a762334bc07392d5451e9852e92fea05255d7e1'
          EXPECTED_BUNDLE_SHA='8b5734816040a64e8cf7e81937bb44dcd2d62fb8885e5c020c2e81b7b58a13f4'

          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          MERGE_BASE=$(git merge-base HEAD origin/main)
          printf 'main_sha=%s\nmerge_base=%s\n' "$MAIN_SHA" "$MERGE_BASE"
          git merge-base --is-ancestor "$BASE_MAIN" "$MAIN_SHA"
          test "$MERGE_BASE" = "$BASE_MAIN"

          test "$(sha256sum "$BUNDLE" | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          grep -Fx "runner_sha256=$EXPECTED_RUNNER_SHA" "$EXECUTE"
          grep -Fx "bundle_sha256=$EXPECTED_BUNDLE_SHA" "$EXECUTE"
          grep -Fx "base_main=$BASE_MAIN" "$EXECUTE"
          grep -Fx 'prior_failed_workflow_run_id=31044808840' "$EXECUTE"
          grep -Fx 'prior_failed_artifact_id=8946051286' "$EXECUTE"
          grep -Fx 'prior_failed_artifact_digest=sha256:0b25fd3ecc7da6ac6dd58febc077dad04d20a0ee8048a9be3eb42097b939add9' "$EXECUTE"
          grep -Fx 'index_resolution_workflow_run_id=31045790391' "$EXECUTE"
          grep -Fx 'index_resolution_artifact_id=8946384314' "$EXECUTE"
          grep -Fx 'index_resolution_artifact_digest=sha256:fbebded26ae37fa4614bdb9f7f79a716153e30234faa0370e7c7b68e2358e3ce' "$EXECUTE"
          grep -Fx 'expected_ein=462952873' "$EXECUTE"
          grep -Fx 'declared_filing_rows=3' "$EXECUTE"
          grep -Fx 'object_ids=202432149349300938,202521839349300822,202641259349300124' "$EXECUTE"
          grep -Fx 'batch_ids=2024_TEOS_XML_08A,2025_TEOS_XML_06A,2026_TEOS_XML_05A' "$EXECUTE"
          grep -Fx 'maximum_total_requests=3' "$EXECUTE"
          grep -Fx 'maximum_parallel_workers=1' "$EXECUTE"
          grep -Fx 'maximum_zip_bytes_per_batch=2147483648' "$EXECUTE"
          grep -Fx 'maximum_xml_bytes_per_filing=104857600' "$EXECUTE"
          grep -Fx 'outside_human_dependency=false' "$EXECUTE"

          mapfile -t CHANGED < <(git diff --name-only "$BASE_MAIN"..HEAD | sort)
          EXPECTED=(
            '.github/workflows/temp-schoolhouse-honor-foundation-990-official-xml.yml'
            '.schoolhouse-honor-foundation-990-official-xml/EXECUTE'
            '.schoolhouse-honor-foundation-990-official-xml/capture.py.gz.b64'
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          for i in "${!EXPECTED[@]}"; do
            test "${CHANGED[$i]}" = "${EXPECTED[$i]}"
          done
          git diff --exit-code -- "$BUNDLE" "$EXECUTE" "$WORKFLOW"

          base64 -d "$BUNDLE" | gzip -dc > "$RUNNER"
          test "$(sha256sum "$RUNNER" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA"
          python -m py_compile "$RUNNER"

      - name: Execute bounded three-batch official IRS XML acquisition
        shell: bash
        run: |
          set -Eeuo pipefail

          OUT='/tmp/schoolhouse-honor-foundation-990-official-xml'
          rm -rf "$OUT"
          python /tmp/capture-schoolhouse-honor-foundation-990-official-xml.py --output "$OUT"

          for file in \
            batch-attempts.jsonl \
            filing-receipts.jsonl \
            term-hits.jsonl \
            structural-signals.jsonl \
            summary.json \
            route-policy.json \
            adjudication.json \
            artifact-manifest.json \
            SHA256SUMS; do
            test -f "$OUT/$file"
          done

          (cd "$OUT" && sha256sum -c SHA256SUMS)
          cat "$OUT/summary.json"
          cat "$OUT/filing-receipts.jsonl"
          cat "$OUT/structural-signals.jsonl"
          cat "$OUT/term-hits.jsonl"

          jq -e '
            .declared_filings == 3 and
            .official_batch_requests == 3 and
            .official_batch_attempt_rows == 3 and
            .terminal_filing_rows == 3 and
            (.successful_filing_rows + .source_unavailable_filing_rows) == 3 and
            .successful_filing_rows >= 0 and
            .successful_filing_rows <= 3 and
            .structural_signal_rows == .successful_filing_rows and
            .term_hit_rows >= 0 and
            .term_hit_rows == (.direct_subject_or_mechanism_term_hit_rows + .candidate_person_context_hit_rows) and
            .screened_text_characters >= 0 and
            .total_xml_elements >= 0 and
            .raw_zip_retained == false and
            .raw_xml_retained == false and
            .full_visible_text_retained == false and
            .source_value_text_retained == false and
            .street_address_rows_retained == 0 and
            .contact_detail_rows_retained == 0 and
            .private_support_rows == 0 and
            .identities_admitted == 0 and
            .relationships_admitted == 0 and
            .negative_existence_claims_created == 0 and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none"
          ' "$OUT/summary.json"

          test "$(grep -cve '^$' "$OUT/batch-attempts.jsonl")" -eq 3
          test "$(grep -cve '^$' "$OUT/filing-receipts.jsonl")" -eq 3
          test "$(grep -cve '^$' "$OUT/structural-signals.jsonl")" -eq "$(jq -r '.structural_signal_rows' "$OUT/summary.json")"
          test "$(grep -cve '^$' "$OUT/term-hits.jsonl")" -eq "$(jq -r '.term_hit_rows' "$OUT/summary.json")"

          jq -s -e '
            length == 3 and
            all(
              .request_method == "GET" and
              .expected_ein? // "462952873" | true
            )
          ' "$OUT/batch-attempts.jsonl"

          jq -s -e '
            length == 3 and
            all(
              .expected_ein == "462952873" and
              .raw_zip_retained == false and
              .raw_xml_retained == false and
              .full_visible_text_retained == false and
              .source_value_text_retained == false and
              .street_address_rows_retained == 0 and
              .contact_detail_rows_retained == 0 and
              .private_support_rows == 0 and
              .identity_admitted == false and
              .relationship_admitted == false and
              .negative_existence_claim_created == false and
              .outside_human_dependency == false and
              .publication_effect == "none" and
              .adoption_effect == "none" and
              .graph_effect == "none" and
              .promotes_to == "candidate_only"
            )
          ' "$OUT/filing-receipts.jsonl"

          jq -s -e '
            all(
              .structural_presence_is_not_relationship_evidence == true and
              .street_address_rows_retained == 0 and
              .contact_detail_rows_retained == 0 and
              .private_support_rows == 0 and
              .identity_admitted == false and
              .relationship_admitted == false and
              .negative_existence_claim_created == false and
              .outside_human_dependency == false and
              .publication_effect == "none" and
              .adoption_effect == "none" and
              .graph_effect == "none" and
              .promotes_to == "candidate_only"
            )
          ' "$OUT/structural-signals.jsonl"

          jq -s -e '
            all(
              .source_value_retained == false and
              .street_address_retained == false and
              .contact_details_retained == false and
              .private_support_rows == 0 and
              .identity_admitted == false and
              .relationship_admitted == false and
              .negative_existence_claim_created == false and
              .outside_human_dependency == false and
              .publication_effect == "none" and
              .adoption_effect == "none" and
              .graph_effect == "none" and
              .promotes_to == "candidate_only"
            )
          ' "$OUT/term-hits.jsonl"

          jq -e '
            .selection_contract.declared_filings == 3 and
            .selection_contract.expected_ein == "462952873" and
            .selection_contract.no_result_spawned_routes == true and
            .selection_contract.no_person_selected_because_of_private_contact == true and
            .request_bounds.request_methods == ["GET"] and
            .request_bounds.maximum_total_requests == 3 and
            .request_bounds.maximum_parallel_workers == 1 and
            .request_bounds.maximum_zip_bytes_per_batch == 2147483648 and
            .request_bounds.maximum_xml_bytes_per_filing == 104857600 and
            .request_bounds.interactive_search_submissions == 0 and
            .request_bounds.forms_submitted == 0 and
            .request_bounds.external_discovered_links_fetched == 0 and
            .retention.raw_zip_retained == false and
            .retention.raw_xml_retained == false and
            .retention.full_visible_text_retained == false and
            .retention.source_value_text_retained == false and
            .retention.street_address_rows_retained == 0 and
            .retention.contact_detail_rows_retained == 0 and
            .retention.private_support_rows == 0 and
            .interpretation.person_name_is_context_only == true and
            .interpretation.direct_term_hits_require_complete_schedule_context == true and
            .interpretation.zero_term_hits_are_not_absence_evidence == true and
            .interpretation.provider_errors_are_not_absence_evidence == true and
            .interpretation.schedule_presence_is_not_relationship_evidence == true and
            .interpretation.no_identity_or_relationship_may_be_admitted_by_this_acquisition == true and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none"
          ' "$OUT/route-policy.json"

          jq -e '
            .declared_filings == 3 and
            .legal_identity_admitted == false and
            .fiscal_sponsor_relationship_admitted == false and
            .related_party_relationship_admitted == false and
            .negative_existence_claim_created == false and
            .outside_human_dependency == false and
            .publication_effect == "none" and
            .adoption_effect == "none" and
            .graph_effect == "none" and
            .promotes_to == "candidate_only"
          ' "$OUT/adjudication.json"

      - name: Upload terminal official-XML artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schoolhouse-honor-foundation-990-official-xml
          path: /tmp/schoolhouse-honor-foundation-990-official-xml
          if-no-files-found: error
          retention-days: 90
