name: Temporary PR 2231 V101 publisher source export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-pr2231-current-line-v101-script-export.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr2231-v101-publisher-source-export
  cancel-in-progress: false

jobs:
  export-exact-source:
    if: github.event.pull_request.number == 2391
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SCRIPT_BLOB: 49148c09e709eb751d2121c7ec23085bf9b5b009
      EXPECTED_SCRIPT_SHA256: 893de54ad342a6661399baa9e5ff9c3c3402537bd0e8574b16396f89d8e64f19
      ARTIFACT_DIR: /tmp/pr2231-v101-publisher-source-export

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Export and bind exact publisher source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          script_path='.github/tmp/pr2231-current-line-v101-publisher.sh.gz'
          actual_blob="$(git hash-object "$script_path")"
          test "$actual_blob" = "$EXPECTED_SCRIPT_BLOB"
          gzip -dc "$script_path" > "$ARTIFACT_DIR/pr2231-current-line-v101-publisher.sh"
          actual_sha256="$(sha256sum "$ARTIFACT_DIR/pr2231-current-line-v101-publisher.sh" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SCRIPT_SHA256"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > "$ARTIFACT_DIR/controller.sha"
          printf '%s\n' "$actual_blob" > "$ARTIFACT_DIR/script.blob"
          printf '%s\n' "$actual_sha256" > "$ARTIFACT_DIR/script.sha256"
          printf '%s\n' EXPORT_SUCCESS > "$ARTIFACT_DIR/result.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v101-publisher-source-export
          path: /tmp/pr2231-v101-publisher-source-export
          retention-days: 30
