name: TEMP execute RD-04 North Dakota FY2026 Q3 waiver-status PDF v2

on:
  pull_request:
    branches:
      - agent/ssc-rd04-nd-current-waiver-fy26q3-execution-base-v2
    types: [opened, synchronize, reopened]
    paths:
      - '.trigger/ssc-rd04-nd-current-waiver-fy26q3-execution-v2'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-execute-ssc-rd04-nd-current-waiver-fy26q3-v2
  cancel-in-progress: false

env:
  CURRENT_MAIN: a592acea22c69a979f2a90c24a2bafb8c9445759
  PRIOR_RD04_MAIN: b1d1d8afb6c957401a762bf9d0b2abc464bd5e07
  MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
  MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
  EXECUTION_WORKFLOW_PATH: .github/workflows/temp-execute-ssc-rd04-nd-current-waiver-fy26q3-v2.yml
  EXECUTION_TRIGGER_PATH: .trigger/ssc-rd04-nd-current-waiver-fy26q3-execution-v2
  LOCK_REF: refs/heads/lock/ssc-rd04-nd-current-waiver-fy26q3-execution-v1
  ADJUDICATION_ARTIFACT_ID: '9030322465'
  ADJUDICATION_ARTIFACT_BYTES: '24896603'
  ADJUDICATION_ARTIFACT_DIGEST: sha256:b44e183c8e44f31cae5aee0c41f98915f3853c6d62fa65c256c5fb329f3b0b71
  ADJUDICATION_RECEIPT_SHA256: baf86ea4a91d0ade25d27080bfbdf4162875ebf9916659743d5188a5fc56042b
  FOLLOWUP_PROTOCOL_SHA256: 1e134e5996b6754e7c74f4e15d47fd9276679fe7c5ceebdbd82696959416a9e7
  ROUTE_ID: RD04-ND-CURRENT-WAIVER-FY26Q3-001
  ROUTE_URL: https://www.fna.usda.gov/sites/default/files/resource-files/FY26-Quarter-3-ABAWD-Waiver-Status.pdf

jobs:
  execute:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-current-waiver-fy26q3-execution-trigger-v2')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute exact FY2026 Quarter 3 PDF route once
        id: execution
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-nd-current-waiver-fy26q3-execution-v2"
          ADJ="$OUT/adjudication"
          rm -rf "$OUT"
          mkdir -p "$OUT" "$ADJ"
          exec > >(tee "$OUT/execution.log") 2>&1
          stage=bootstrap

          fail_receipt() {
            local rc=$1
            if [[ ! -s "$OUT/execution-receipt.json" ]]; then
              jq -n \
                --arg stage "$stage" \
                --argjson code "$rc" \
                --arg parent "$CURRENT_MAIN" \
                --arg prior "$PRIOR_RD04_MAIN" \
                --arg route "$ROUTE_ID" \
                --arg lock "$LOCK_REF" \
                '{schema_version:"ssc-rd04-nd-current-waiver-fy26q3-execution@2",state:"failed_closed",failed_or_final_stage:$stage,exit_code:$code,execution_parent:$parent,prior_rd04_parent:$prior,lock_ref:$lock,fixed_route_ids:[$route],fixed_route_count:1,terminal_route_count:0,physical_requests:0,source_admissions:0,field_terminalizations:0,matrix_updates:0,row_state_mutations:0,class_closed:false,cumulative_ledger_effect:"none",outside_human_dependency:false,publication_effect:"none",adoption_effect:"none",graph_effect:"none",additional_execution_authorized:false}' > "$OUT/execution-receipt.json"
            fi
          }
          finish() {
            local rc=$?
            trap - EXIT
            set +e
            fail_receipt "$rc"
            printf '%s\n' "$rc" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
            exit "$rc"
          }
          trap finish EXIT
          on_error() { local rc=$?; trap - ERR; set +e; fail_receipt "$rc"; exit "$rc"; }
          trap on_error ERR
          set -Eeuo pipefail

          stage=bind_execution_topology
          BASE="$(git rev-parse HEAD^)"
          test "$(git rev-parse "$BASE^")" = "$CURRENT_MAIN"
          test "$(git rev-list --count "$CURRENT_MAIN".."$BASE")" -eq 1
          test "$(git rev-list --count "$BASE"..HEAD)" -eq 1
          test "$(git diff --name-only "$CURRENT_MAIN" "$BASE")" = "$EXECUTION_WORKFLOW_PATH"
          test "$(git diff --name-only --diff-filter=A "$CURRENT_MAIN" "$BASE")" = "$EXECUTION_WORKFLOW_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CURRENT_MAIN" "$BASE")"
          test "$(git diff --name-only "$BASE" HEAD)" = "$EXECUTION_TRIGGER_PATH"
          test "$(git diff --name-only --diff-filter=A "$BASE" HEAD)" = "$EXECUTION_TRIGGER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$BASE" HEAD)"
          git diff --check "$CURRENT_MAIN" HEAD
          printf '%s\n' "$BASE" > "$OUT/execution-base-commit.txt"
          printf '%s\n' "$(git rev-parse HEAD)" > "$OUT/execution-trigger-head.txt"

          stage=bind_live_main_lock_and_matrix
          git fetch --no-tags --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+${LOCK_REF}:refs/remotes/origin/rd04-fy26q3-lock"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CURRENT_MAIN"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CURRENT_MAIN"
          test "$(git rev-parse refs/remotes/origin/rd04-fy26q3-lock)" = "$(git rev-parse HEAD)"
          test "$(git ls-remote --heads origin "$LOCK_REF" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PRIOR_RD04_MAIN" "$CURRENT_MAIN"
          test "$(git rev-parse "$CURRENT_MAIN:$MATRIX_PATH")" = "$MATRIX_BLOB"
          test "$(git rev-parse "$PRIOR_RD04_MAIN:$MATRIX_PATH")" = "$MATRIX_BLOB"
          printf '%s\n' "$(git rev-parse "$CURRENT_MAIN^{tree}")" > "$OUT/current-main-tree.txt"
          printf '%s\n' "$MATRIX_BLOB" > "$OUT/current-matrix-blob.txt"
          printf '%s\n' "$(git rev-parse HEAD)" > "$OUT/execution-lock-head.txt"
          python - "$MATRIX_PATH" <<'PYMATRIX'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value['counts']['terminal_cells'] == 227
          assert value['counts']['still_open_cells'] == 223
          assert value['counts']['terminal_substantive_cells'] == 117
          assert value['counts']['still_open_substantive_cells'] == 183
          assert value['counts']['terminal_units'] == 10
          assert value['counts']['class_closed'] is False
          row = next(item for item in value['rows'] if item['unit_id'] == 'US-STATE-ND')
          assert row['row_state'] == 'still_open'
          assert row['terminal_fields'] == 7
          assert row['open_fields'] == 2
          cell = next(item for item in row['cells'] if item['field_id'] == 'abawd_or_work_requirement_waiver_state_and_governing_period')
          assert cell['state'] == 'still_open'
          assert cell['terminal'] is False
          assert cell['value'] is None
          assert cell['evidence_source_ids'] == []
          assert cell['typed_gap'] == 'no_admitted_state_implementation_source_yet'
          PYMATRIX

          stage=authenticate_controlling_adjudication
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ADJUDICATION_ARTIFACT_ID" > "$OUT/adjudication-artifact.json"
          jq -e --argjson id "$ADJUDICATION_ARTIFACT_ID" --argjson bytes "$ADJUDICATION_ARTIFACT_BYTES" --arg digest "$ADJUDICATION_ARTIFACT_DIGEST" \
            '.id==$id and .size_in_bytes==$bytes and .digest==$digest and .expired==false' "$OUT/adjudication-artifact.json" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ADJUDICATION_ARTIFACT_ID/zip" > "$OUT/adjudication.zip"
          test "$(stat -c %s "$OUT/adjudication.zip")" = "$ADJUDICATION_ARTIFACT_BYTES"
          test "sha256:$(sha256sum "$OUT/adjudication.zip" | awk '{print $1}')" = "$ADJUDICATION_ARTIFACT_DIGEST"
          unzip -t "$OUT/adjudication.zip" > "$OUT/adjudication-zip-test.txt"
          unzip -q "$OUT/adjudication.zip" -d "$ADJ"
          (cd "$ADJ" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$ADJ/receipt.json" | awk '{print $1}')" = "$ADJUDICATION_RECEIPT_SHA256"
          test "$(sha256sum "$ADJ/selected-followup-protocol.json" | awk '{print $1}')" = "$FOLLOWUP_PROTOCOL_SHA256"
          jq -e --arg prior "$PRIOR_RD04_MAIN" \
            '.schema_version=="ssc-rd04-nd-current-waiver-fna-adjudication@1" and .state=="complete" and .canonical_parent==$prior and .execution_artifact==9030165959 and .promotion_candidates==0 and .held_open_fields==1 and .selected_followup_routes==1 and .source_requests==0 and .route_executions==0 and .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and .class_closed==false' "$ADJ/receipt.json" >/dev/null
          jq -e --arg route "$ROUTE_ID" --arg url "$ROUTE_URL" \
            '.schema_version=="ssc-rd04-nd-current-waiver-fy26q3-followup-protocol@1" and .route_count==1 and .source_requests_executed_here==0 and .result_spawned_requests==0 and .same_host_expansion==0 and .routes[0].route_id==$route and .routes[0].url==$url and .routes[0].attempts==1 and .routes[0].redirects=="manual_same_host_only" and .routes[0].maximum_body_bytes==12000000 and .routes[0].expected_content_family=="application/pdf"' "$ADJ/selected-followup-protocol.json" >/dev/null

          stage=pre_request_reconciliation
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CURRENT_MAIN"
          test "$(git ls-remote --heads origin "$LOCK_REF" | awk '{print $1}')" = "$(git rev-parse HEAD)"

          stage=execute_exact_pdf_route
          python - "$OUT" <<'PYEXEC'
          import hashlib, json, os, pathlib, ssl, subprocess, sys, time
          import urllib.error, urllib.parse, urllib.request

          out = pathlib.Path(sys.argv[1])
          route_id = os.environ['ROUTE_ID']
          initial = os.environ['ROUTE_URL']
          allowed = {'fna.usda.gov', 'www.fna.usda.gov'}
          limit = 12_000_000

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              NoRedirect(),
          )
          current = initial
          hops = []
          physical = 0
          terminal = None

          for index in range(6):
              parsed = urllib.parse.urlsplit(current)
              if parsed.scheme != 'https' or (parsed.hostname or '').lower() not in allowed:
                  terminal = {
                      'terminal_state': 'refused_before_request',
                      'reason': 'scheme_or_host_outside_frozen_allowlist',
                      'final_url': current,
                      'http_status': None,
                      'body_bytes': 0,
                      'body_sha256': None,
                      'content_type': None,
                      'pdf_magic': False,
                  }
                  break

              request = urllib.request.Request(
                  current,
                  method='GET',
                  headers={
                      'User-Agent': 'BigBirdReturns-RD04-bounded-pdf-capture/2.0',
                      'Accept': 'application/pdf,*/*;q=0.1',
                      'Accept-Encoding': 'identity',
                      'Cache-Control': 'no-cache',
                  },
              )
              physical += 1
              started = time.time()
              try:
                  response = opener.open(request, timeout=90)
                  status = int(response.status)
                  headers = response.headers
                  body = response.read(limit + 1)
                  effective = response.geturl()
              except urllib.error.HTTPError as exc:
                  status = int(exc.code)
                  headers = exc.headers
                  body = exc.read(limit + 1)
                  effective = exc.geturl()
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'
                  hops.append({
                      'hop': index,
                      'requested_url': current,
                      'transport_error': error,
                      'elapsed_ms': round((time.time() - started) * 1000),
                  })
                  terminal = {
                      'terminal_state': 'terminal_transport_without_http_status',
                      'reason': error,
                      'final_url': current,
                      'http_status': None,
                      'body_bytes': 0,
                      'body_sha256': None,
                      'content_type': None,
                      'pdf_magic': False,
                  }
                  break

              digest = hashlib.sha256(body).hexdigest()
              content_type = headers.get_content_type() if hasattr(headers, 'get_content_type') else headers.get('Content-Type')
              location = headers.get('Location')
              magic = body.startswith(b'%PDF-')
              body_path = out / f'hop-{index:02d}-body.bin'
              body_path.write_bytes(body)
              hop = {
                  'hop': index,
                  'requested_url': current,
                  'effective_url': effective,
                  'http_status': status,
                  'elapsed_ms': round((time.time() - started) * 1000),
                  'location': location,
                  'headers': [
                      {'name': key.lower(), 'value': value}
                      for key, value in sorted(headers.items(), key=lambda item: (item[0].lower(), item[1]))
                  ],
                  'body_path': body_path.name,
                  'body_bytes': len(body),
                  'body_sha256': digest,
                  'content_type': content_type,
                  'body_limit_exceeded': len(body) > limit,
                  'pdf_magic': magic,
              }
              hops.append(hop)
              (out / f'hop-{index:02d}-receipt.json').write_text(
                  json.dumps(hop, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )

              if len(body) > limit:
                  terminal = {
                      'terminal_state': 'body_limit_exceeded_terminal',
                      'reason': 'maximum_body_bytes_exceeded',
                      'final_url': effective,
                      'http_status': status,
                      'body_bytes': len(body),
                      'body_sha256': digest,
                      'content_type': content_type,
                      'pdf_magic': magic,
                  }
                  break

              if 300 <= status <= 399:
                  if not location:
                      terminal = {
                          'terminal_state': 'http_redirect_without_location_terminal',
                          'reason': 'redirect_missing_location',
                          'final_url': effective,
                          'http_status': status,
                          'body_bytes': len(body),
                          'body_sha256': digest,
                          'content_type': content_type,
                          'pdf_magic': magic,
                      }
                      break
                  next_url = urllib.parse.urljoin(effective, location)
                  next_parts = urllib.parse.urlsplit(next_url)
                  if next_parts.scheme != 'https' or (next_parts.hostname or '').lower() not in allowed:
                      terminal = {
                          'terminal_state': 'redirect_refused_terminal',
                          'reason': 'redirect_target_outside_frozen_allowlist',
                          'final_url': effective,
                          'redirect_target': next_url,
                          'http_status': status,
                          'body_bytes': len(body),
                          'body_sha256': digest,
                          'content_type': content_type,
                          'pdf_magic': magic,
                      }
                      break
                  current = next_url
                  continue

              state = (
                  'http_success_pdf_captured'
                  if 200 <= status <= 299 and magic
                  else 'http_success_non_pdf_body_captured'
                  if 200 <= status <= 299
                  else 'http_non_success_terminal'
              )
              terminal = {
                  'terminal_state': state,
                  'reason': None,
                  'final_url': effective,
                  'http_status': status,
                  'body_bytes': len(body),
                  'body_sha256': digest,
                  'content_type': content_type,
                  'pdf_magic': magic,
              }
              break

          if terminal is None:
              terminal = {
                  'terminal_state': 'redirect_hop_limit_terminal',
                  'reason': 'maximum_redirect_hops_exhausted',
                  'final_url': current,
                  'http_status': None,
                  'body_bytes': 0,
                  'body_sha256': None,
                  'content_type': None,
                  'pdf_magic': False,
              }

          route = {
              'route_id': route_id,
              'requested_url': initial,
              'hops': hops,
              **terminal,
          }
          receipt = {
              'schema_version': 'ssc-rd04-nd-current-waiver-fy26q3-execution@2',
              'state': 'complete',
              'failed_or_final_stage': 'complete',
              'exit_code': 0,
              'issue': 1017,
              'lane_id': 'RD-04',
              'class_id': 'RD-04-C02',
              'execution_parent': os.environ['CURRENT_MAIN'],
              'prior_rd04_parent': os.environ['PRIOR_RD04_MAIN'],
              'execution_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'lock_ref': os.environ['LOCK_REF'],
              'adjudication_artifact': int(os.environ['ADJUDICATION_ARTIFACT_ID']),
              'adjudication_artifact_digest': os.environ['ADJUDICATION_ARTIFACT_DIGEST'],
              'adjudication_receipt_sha256': os.environ['ADJUDICATION_RECEIPT_SHA256'],
              'followup_protocol_sha256': os.environ['FOLLOWUP_PROTOCOL_SHA256'],
              'matrix_blob': os.environ['MATRIX_BLOB'],
              'fixed_route_ids': [route_id],
              'fixed_route_count': 1,
              'terminal_route_count': 1,
              'physical_requests': physical,
              'route': route,
              'result_spawned_requests': 0,
              'automatic_source_admissions': 0,
              'automatic_field_classifications': 0,
              'automatic_row_terminalizations': 0,
              'automatic_class_closures': 0,
              'source_admissions': 0,
              'field_terminalizations': 0,
              'matrix_updates': 0,
              'row_state_mutations': 0,
              'class_closed': False,
              'cumulative_ledger_effect': 'none',
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'additional_execution_authorized': False,
              'next_authorized_operation': 'offline PDF extraction, page-complete visual review, and field adjudication over this exact artifact',
          }
          (out / 'route-receipt.json').write_text(json.dumps(route, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (out / 'execution-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PYEXEC

          stage=post_request_reconciliation
          set +e
          POST_MAIN="$(git ls-remote --heads origin refs/heads/main 2>/dev/null | awk '{print $1}')"
          POST_LOCK="$(git ls-remote --heads origin "$LOCK_REF" 2>/dev/null | awk '{print $1}')"
          set -e
          printf '%s\n' "$POST_MAIN" > "$OUT/post-request-main.txt"
          printf '%s\n' "$POST_LOCK" > "$OUT/post-request-lock.txt"
          python - "$OUT/execution-receipt.json" "$POST_MAIN" "$POST_LOCK" "$(git rev-parse HEAD)" <<'PYPOST'
          import json, sys
          path, post_main, post_lock, head = sys.argv[1:]
          value = json.load(open(path, encoding='utf-8'))
          value['post_request_live_main'] = post_main
          value['post_request_main_matches_execution_parent'] = post_main == value['execution_parent']
          value['post_request_lock_head'] = post_lock
          value['post_request_lock_matches_execution_head'] = post_lock == head
          value['custody_state'] = (
              'terminal_capture_live_lease_preserved'
              if value['post_request_main_matches_execution_parent'] and value['post_request_lock_matches_execution_head']
              else 'terminal_capture_postcontact_repository_drift_recorded'
          )
          open(path, 'w', encoding='utf-8').write(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PYPOST

          stage=complete
          trap - ERR
          printf '%s\n' 0 > "$OUT/EXIT_CODE"
          printf '%s\n' complete > "$OUT/STAGE"

      - name: Upload exact PDF execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-current-waiver-fy26q3-execution-v2
          path: ${{ runner.temp }}/ssc-rd04-nd-current-waiver-fy26q3-execution-v2
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Require typed terminal PDF custody
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-nd-current-waiver-fy26q3-execution-v2"
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          python - "$OUT/execution-receipt.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value['schema_version'] == 'ssc-rd04-nd-current-waiver-fy26q3-execution@2'
          assert value['state'] == 'complete'
          assert value['fixed_route_count'] == 1
          assert value['terminal_route_count'] == 1
          assert 1 <= value['physical_requests'] <= 6
          assert value['route']['route_id'] == 'RD04-ND-CURRENT-WAIVER-FY26Q3-001'
          assert value['route']['requested_url'] == 'https://www.fna.usda.gov/sites/default/files/resource-files/FY26-Quarter-3-ABAWD-Waiver-Status.pdf'
          assert value['result_spawned_requests'] == 0
          assert value['source_admissions'] == 0
          assert value['field_terminalizations'] == 0
          assert value['matrix_updates'] == 0
          assert value['row_state_mutations'] == 0
          assert value['class_closed'] is False
          assert value['outside_human_dependency'] is False
          assert value['additional_execution_authorized'] is False
          assert isinstance(value['post_request_lock_matches_execution_head'], bool)
          PY
