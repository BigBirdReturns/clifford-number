name: TEMP recover School.House IRS filing-index custody product v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-recovery-v3.yml'
  workflow_dispatch:

concurrency:
  group: schoolhouse-irs-candidate-filing-index-recovery-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-irs-candidate-filing-index-census-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Replay exact eight-index acquisition on the frozen integrated carrier
        id: acquisition
        continue-on-error: true
        shell: bash
        run: |
          set +e
          SOURCE='.github/workflows/temp-schoolhouse-irs-candidate-filing-index-materializer.yml'
          SCRIPT="$RUNNER_TEMP/replay-schoolhouse-irs-filing-index-acquisition-recovery-v3.sh"
          python - "$SOURCE" "$SCRIPT" <<'PY'
          from pathlib import Path
          import re, sys

          source = Path(sys.argv[1]).read_text()
          step = '      - name: Reconstruct and execute exact filing-index acquisition\n'
          start = source.index(step)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('\n      - name: Upload exact acquisition artifact', run)
          lines = source[run:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'

          pattern = re.compile(
              r'''mapfile -t CHANGED < <\(git diff --name-only "\$BASE"\.\.HEAD \| sort\)\n(?:.*\n){0,12}?\s*test "\$\{CHANGED\[1\]\}" = "\$MATERIALIZER"'''
          )
          replacement = '''mapfile -t CHANGED < <(git diff --name-only "$BASE"..HEAD | sort)
          EXPECTED=(
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-census.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer-authoritative-v2.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer-v2.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer-v3.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer-v4.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer-v5.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer-v6.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer-v7.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-finalizer.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-materializer-v2.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-materializer.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-recovery-v2.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-recovery-v3.yml'
            '.github/workflows/temp-schoolhouse-irs-candidate-filing-index-terminal-receipt.yml'
            '.schoolhouse-irs-candidate-filing-index-census/capture.py.gz.b64'
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          for i in "${!EXPECTED[@]}"; do
            test "${CHANGED[$i]}" = "${EXPECTED[$i]}"
          done'''
          script, count = pattern.subn(replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'carrier replacements={count}')
          Path(sys.argv[2]).write_text(script)
          PY
          bash -n "$SCRIPT"
          bash "$SCRIPT"

      - name: Upload recovered acquisition under the product-builder binding
        if: steps.acquisition.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-candidate-filing-index-census-materializer
          path: ${{ runner.temp }}/schoolhouse-irs-candidate-filing-index-census
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Replay repaired product publisher
        if: steps.acquisition.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE='.github/workflows/temp-schoolhouse-irs-candidate-filing-index-materializer-v2.yml'
          SCRIPT="$RUNNER_TEMP/replay-schoolhouse-irs-filing-index-product-recovery-v3.sh"
          python - "$SOURCE" "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          step = '      - name: Replay, qualify, and publish the exact workflow-free product\n'
          start = source.index(step)
          run = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index(
              '\n      - name: Upload exact repaired materialization receipt',
              run,
          )
          lines = source[run:end].splitlines()
          Path(sys.argv[2]).write_text(
              '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in lines
              ) + '\n'
          )
          PY
          bash -n "$SCRIPT"
          bash "$SCRIPT"

      - name: Upload exact recovered product receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-irs-candidate-filing-index-product-recovery-receipt-v3
          path: ${{ runner.temp }}/schoolhouse-irs-candidate-filing-index-materialization-receipt
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
