name: TEMP export canonical main for PC-36 composition

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc36-main-source-export.yml'
      - '.pc36-main-source-export.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Package exact canonical main source
        run: |
          set -Eeuo pipefail
          out=/tmp/pc36-main-source
          mkdir -p "$out"
          git rev-parse HEAD > "$out/canonical-main.sha"
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./dist' \
            --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$out/canonical-main-source.tar.gz" .
          sha256sum "$out/canonical-main-source.tar.gz" > "$out/canonical-main-source.sha256"
          find . -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' | sort > "$out/source-paths.txt"
          wc -c "$out/canonical-main-source.tar.gz" > "$out/canonical-main-source.bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: pc36-canonical-main-source
          path: /tmp/pc36-main-source
          if-no-files-found: error
          retention-days: 7
