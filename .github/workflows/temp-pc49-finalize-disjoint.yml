name: TEMP finalize disjoint PC-49 product

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pc49-disjoint-finalization
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  finalize:
    if: github.head_ref == 'agent/pc49-source-carrier'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout authenticated carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify one-commit product and disjoint current-main advance
        run: |
          set -euo pipefail
          git fetch --force origin \
            main:refs/remotes/origin/main \
            agent/pc49-materializer:refs/remotes/origin/agent/pc49-materializer

          main_sha="$(git rev-parse refs/remotes/origin/main^{commit})"
          product_sha="$(git rev-parse refs/remotes/origin/agent/pc49-materializer^{commit})"
          product_parent="$(git rev-parse "${product_sha}^"^{commit})"
          product_tree="$(git rev-parse "${product_sha}^{tree}")"
          git merge-base --is-ancestor "$product_parent" "$main_sha"
          test "$(git rev-list --count "${product_parent}..${product_sha}")" -eq 1

          cat > /tmp/pc49-expected-paths.txt <<'EOF'
          .github/workflows/preference-custody-v47.yml
          .github/workflows/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.yml
          data/research/preference-custody/control-manifest-v47.json
          data/research/preference-custody/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.fixture.json
          docs/preference-custody-laboratory-floor-v47.md
          docs/preference-custody-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.md
          test/preference-custody-manifest-v47.test.js
          test/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.test.js
          tools/compile-preference-custody-manifest-v47.mjs
          tools/compile-preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs
          tools/lib/preference-custody-manifest-v47.mjs
          tools/lib/preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs
          tools/validate-preference-custody-manifest-v47.mjs
          tools/validate-preference-linkage-runtime-artifact-dependency-numerical-determinism-replay-assurance.mjs
          EOF
          sed -i 's/^          //' /tmp/pc49-expected-paths.txt
          sort -o /tmp/pc49-expected-paths.txt /tmp/pc49-expected-paths.txt

          git diff --name-only --diff-filter=A "$product_parent" "$product_sha" \
            | sort > /tmp/pc49-product-paths.txt
          test "$(wc -l < /tmp/pc49-product-paths.txt)" -eq 14
          cmp /tmp/pc49-expected-paths.txt /tmp/pc49-product-paths.txt
          test -z "$(git diff --name-only --diff-filter=CDMRTUXB "$product_parent" "$product_sha")"

          git diff --name-only "$product_parent" "$main_sha" \
            | sort > /tmp/pc49-main-advance-paths.txt
          comm -12 /tmp/pc49-expected-paths.txt /tmp/pc49-main-advance-paths.txt \
            > /tmp/pc49-overlap-paths.txt
          test ! -s /tmp/pc49-overlap-paths.txt

          pr_number="$(
            gh pr list --repo "$GITHUB_REPOSITORY" \
              --state open --head agent/pc49-materializer --base main \
              --json number --jq '.[0].number // empty'
          )"
          if [ -z "$pr_number" ]; then
            pr_url="$(
              gh pr create --repo "$GITHUB_REPOSITORY" \
                --head agent/pc49-materializer --base main \
                --title 'Add PC-49 runtime artifact, numerical determinism, and replay custody' \
                --body-file - <<'BODY'
          Closes #1120.

          Promotes Preference Custody PC-49 and compiles floor v47. The clean product contains one commit and fourteen permanent paths, with zero carrier paths and no outside-human dependency.
          BODY
            )"
            pr_number="${pr_url##*/}"
          fi
          test -n "$pr_number"
          test "$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false

          {
            printf 'main_sha=%s\n' "$main_sha"
            printf 'product_sha=%s\n' "$product_sha"
            printf 'product_parent=%s\n' "$product_parent"
            printf 'product_tree=%s\n' "$product_tree"
            printf 'product_pr=%s\n' "$pr_number"
            printf 'main_advance_commits=%s\n' "$(git rev-list --count "${product_parent}..${main_sha}")"
            printf 'main_advance_paths=%s\n' "$(wc -l < /tmp/pc49-main-advance-paths.txt)"
            printf 'overlap_paths=0\n'
          } > /tmp/pc49-disjoint-finalization.txt
          cat /tmp/pc49-disjoint-finalization.txt
      - name: Wait for and require green current-product checks
        run: |
          set -euo pipefail
          source /tmp/pc49-disjoint-finalization.txt

          for attempt in $(seq 1 180); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${product_sha}/check-runs?per_page=100" \
              > /tmp/pc49-check-runs.json
            read -r total pending bad < <(
              jq -r '[
                .total_count,
                ([.check_runs[] | select(.status != "completed")] | length),
                ([.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))] | length)
              ] | @tsv' /tmp/pc49-check-runs.json
            )
            printf 'check_poll=%s total=%s pending=%s bad=%s\n' "$attempt" "$total" "$pending" "$bad"
            if [ "$bad" -gt 0 ]; then
              jq -r '.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not)) | [.name,.conclusion,.details_url] | @tsv' /tmp/pc49-check-runs.json
              exit 1
            fi
            if [ "$total" -ge 3 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            sleep 10
          done

          read -r total pending bad < <(
            jq -r '[
              .total_count,
              ([.check_runs[] | select(.status != "completed")] | length),
              ([.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))] | length)
            ] | @tsv' /tmp/pc49-check-runs.json
          )
          test "$total" -ge 3
          test "$pending" -eq 0
          test "$bad" -eq 0

          review_decision="$(gh pr view "$product_pr" --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision // ""')"
          test "$review_decision" != CHANGES_REQUESTED
          jq -r '.check_runs | sort_by(.name)[] | [.name,.conclusion] | @tsv' \
            /tmp/pc49-check-runs.json > /tmp/pc49-green-checks.txt
          printf 'current_head_checks=%s\nreview_decision=%s\n' "$total" "${review_decision:-none}" \
            >> /tmp/pc49-disjoint-finalization.txt
          cat /tmp/pc49-green-checks.txt
      - name: Merge product and verify exact canonical content
        run: |
          set -euo pipefail
          source /tmp/pc49-disjoint-finalization.txt

          mergeable='UNKNOWN'
          for attempt in $(seq 1 60); do
            read -r state mergeable < <(
              gh pr view "$product_pr" --repo "$GITHUB_REPOSITORY" \
                --json state,mergeable --jq '[.state,.mergeable] | @tsv'
            )
            test "$state" = OPEN
            if [ "$mergeable" = MERGEABLE ]; then break; fi
            test "$mergeable" != CONFLICTING
            sleep 5
          done
          test "$mergeable" = MERGEABLE

          settings="$(gh api "repos/${GITHUB_REPOSITORY}")"
          if [ "$(jq -r .allow_squash_merge <<<"$settings")" = true ]; then
            merge_flag=--squash
          elif [ "$(jq -r .allow_merge_commit <<<"$settings")" = true ]; then
            merge_flag=--merge
          elif [ "$(jq -r .allow_rebase_merge <<<"$settings")" = true ]; then
            merge_flag=--rebase
          else
            exit 1
          fi

          gh pr merge "$product_pr" --repo "$GITHUB_REPOSITORY" "$merge_flag" --delete-branch
          test "$(gh pr view "$product_pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = MERGED
          merge_sha="$(gh pr view "$product_pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)"
          test -n "$merge_sha"

          git fetch --force origin main:refs/remotes/origin/main
          canonical_main="$(git rev-parse refs/remotes/origin/main^{commit})"
          test "$canonical_main" = "$merge_sha"
          mapfile -t expected < /tmp/pc49-expected-paths.txt
          git diff --exit-code "$product_sha" "$canonical_main" -- "${expected[@]}"

          printf 'merge_method=%s\nmerge_sha=%s\ncanonical_main=%s\n' \
            "${merge_flag#--}" "$merge_sha" "$canonical_main" \
            >> /tmp/pc49-disjoint-finalization.txt
      - name: Close authority surfaces and retire every transport ref
        run: |
          set -euo pipefail
          source /tmp/pc49-disjoint-finalization.txt

          if [ "$(gh issue view 1120 --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = OPEN ]; then
            gh issue close 1120 --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "Completed by merged PC-49 product PR #${product_pr}."
          fi
          if [ "$(gh pr view 1127 --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = OPEN ]; then
            gh pr close 1127 --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by merged PC-49 product PR #${product_pr}; this carrier was never merged."
          fi

          for branch in \
            agent/pc49-source-carrier-v3-stage \
            agent/pc49-materializer-verify \
            agent/pc49-materializer; do
            git push origin --delete "$branch" 2>/dev/null || true
          done
          git push origin --delete agent/pc49-source-carrier

          printf 'issue_1120=closed\ncarrier_pr_1127=closed_without_merge\ntransport_refs=retired\n' \
            >> /tmp/pc49-disjoint-finalization.txt
          cat /tmp/pc49-disjoint-finalization.txt
      - name: Upload final disjoint PC-49 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc49-disjoint-finalization-receipt
          path: |
            /tmp/pc49-disjoint-finalization.txt
            /tmp/pc49-expected-paths.txt
            /tmp/pc49-product-paths.txt
            /tmp/pc49-main-advance-paths.txt
            /tmp/pc49-overlap-paths.txt
            /tmp/pc49-check-runs.json
            /tmp/pc49-green-checks.txt
          if-no-files-found: warn
