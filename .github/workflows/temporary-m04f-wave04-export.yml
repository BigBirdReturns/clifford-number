name: Temporary export M-04F Wave 04 working surface

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-m04f-wave04-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04f-wave04-vertical-joins
          fetch-depth: 0
      - name: Package exact working surface
        run: |
          {
            git ls-files 'package*.json'
            git ls-files '.github/workflows/m04f-epistemic-jurisdiction.yml'
            git ls-files 'data/intake/m04f-epistemic-jurisdiction-*.json'
            git ls-files 'data/project/m04f-*.json'
            git ls-files 'tools/build-m04f-epistemic-jurisdiction.mjs'
            git ls-files 'tools/validate-m04f-epistemic-jurisdiction.mjs'
            git ls-files 'test/m04f-epistemic-jurisdiction.test.js'
            git ls-files 'docs/methods/pattern-to-proof.md'
            git ls-files 'docs/milestones/m04f-*.md'
            git ls-files 'build/core-thesis/epistemic-jurisdiction/**'
            git ls-files 'reports/core-thesis/epistemic-jurisdiction/**'
          } | sort -u > /tmp/m04f-files.txt
          test -s /tmp/m04f-files.txt
          tar -czf /tmp/m04f-wave04-working-surface.tgz -T /tmp/m04f-files.txt
          sha256sum /tmp/m04f-wave04-working-surface.tgz | tee /tmp/m04f-wave04-working-surface.sha256
          cat /tmp/m04f-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m04f-wave04-working-surface
          path: |
            /tmp/m04f-wave04-working-surface.tgz
            /tmp/m04f-wave04-working-surface.sha256
            /tmp/m04f-files.txt
          if-no-files-found: error
