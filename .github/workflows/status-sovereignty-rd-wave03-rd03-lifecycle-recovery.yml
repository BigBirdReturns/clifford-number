name: SSC RD-03 Wave 03 lifecycle-recovery terminal closure

on:
  pull_request:
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/**'
      - 'data/intake/status-sovereignty-rd03-osc-instrument-lifecycle.json'
      - 'data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'data/project/ssc-residual-wave03/seeds/RD-03-C05.json'
      - 'data/project/ssc-residual-wave03/closures/RD-03-C05.json'
      - 'data/project/ssc-residual-wave03/closures/RD-01-C06.json'
      - 'data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/**'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'schemas/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs'
      - 'test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd03-lifecycle-recovery-terminal.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.yml'
      - 'data/intake/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/**'
      - 'data/intake/status-sovereignty-rd03-osc-instrument-lifecycle.json'
      - 'data/research/status-sovereignty-rd-wave02-rd03-negotiated-terms/**'
      - 'data/project/ssc-residual-wave03/seeds/RD-03-C05.json'
      - 'data/project/ssc-residual-wave03/closures/RD-03-C05.json'
      - 'data/project/ssc-residual-wave03/closures/RD-01-C06.json'
      - 'data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/**'
      - 'data/research/status-sovereignty-residual-denominator-wave-03-constitution.json'
      - 'data/research/status-sovereignty-residual-denominator-wave-02-current.json'
      - 'schemas/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.schema.json'
      - 'tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs'
      - 'tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs'
      - 'test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.test.js'
      - 'docs/milestones/ssc-rd-wave03-rd03-lifecycle-recovery-terminal.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-rd03-wave03-terminal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate exact terminal product and 745 adversarial refusals
        run: |
          set -Eeuo pipefail
          node --check tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs
          node --check test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.test.js
          node tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs
          node test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Restore volatile outputs and replay deterministic terminal build
        run: |
          set -Eeuo pipefail
          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs --write
          node tools/validate-status-sovereignty-rd-wave03-rd03-lifecycle-recovery.mjs
          node test/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Preserve exact terminal custody
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-wave03-lifecycle-recovery-terminal
          path: |
            data/intake/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/capture-execution-receipt.json
            data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/terminal-field-matrix.json
            data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/summary.json
            data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/class-receipt.json
            data/research/status-sovereignty-rd-wave03-rd03-lifecycle-recovery/manifest.json
            data/project/ssc-residual-wave03/closures/RD-03-C05.json
            schemas/status-sovereignty-rd-wave03-rd03-lifecycle-recovery.schema.json
            docs/milestones/ssc-rd-wave03-rd03-lifecycle-recovery-terminal.md
          if-no-files-found: error
          retention-days: 90
