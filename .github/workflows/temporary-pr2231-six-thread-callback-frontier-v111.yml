name: Temporary PR 2231 six-thread callback frontier V111 R2
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temporary-pr2231-six-thread-callback-frontier-v111.yml']
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: pr2231-six-thread-callback-frontier-v111-r2
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: ${{ github.head_ref }}
      CONTROLLER_WORKFLOW: .github/workflows/temporary-pr2231-six-thread-callback-frontier-v111.yml
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_PRODUCT: cfd1e459efc07f57cab7117200a4a4b962fd1bac
      EXPECTED_PARENT: 0b1d8af5b86adad49b3451053dbb9166294d631c
      EXPECTED_TREE: 17d5350c902e47f129fae0282735b4acbeff381c
      EXPECTED_LIBRARY: dab48bfba026dc1629a4384a26d98c13366b0ea3
      EXPECTED_TEST: 8fad1d2be93f9a286f9b95bb35751d3e908c4834
      REVIEW_BINDINGS: >-
        PRRT_kwDOTGqftc6dept0:3888440222 PRRT_kwDOTGqftc6dfK4F:3888640534
        PRRT_kwDOTGqftc6dfK4H:3888640536 PRRT_kwDOTGqftc6dfLu0:3888645507
        PRRT_kwDOTGqftc6di_ww:3890125090 PRRT_kwDOTGqftc6di_wy:3890125092
      ARTIFACT_DIR: /tmp/pr2231-six-thread-callback-frontier-v111
      PRODUCT_WT: /tmp/pr2231-six-thread-callback-frontier-product-v111
      MAIN_WT: /tmp/pr2231-six-thread-callback-frontier-main-v111
      QUALIFIED_DIR: /tmp/pr2231-six-thread-callback-frontier-qualified-v111
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recover and execute read-only qualifier
        shell: bash
        run: |
          set -Eeuo pipefail
          d=/tmp/pr2231-v111-source
          blob=a3b3c96f8c8612ff7c6b6278d7a5d344f5ef8947
          rm -rf "$d"
          mkdir -p "$d"
          gh api "repos/$REPO/git/blobs/$blob" > "$d/$blob.json"
          python3 - "$d/$blob.json" "$d/qualifier.sh.gz" <<'PY_BLOB'
          import base64
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          with open(sys.argv[2], 'wb') as handle:
              handle.write(base64.b64decode(payload['content']))
          PY_BLOB
          echo '77896ecb7bcf402b7d8203c72b1fb7fb5199fb74acc3264f09c4d9a303bf1126  '$d'/qualifier.sh.gz' \
            | sha256sum -c -
          gzip -dc "$d/qualifier.sh.gz" > "$d/qualifier.sh"
          echo '0d07a06a2096a71216ed90e728fe64e623eb03e30687624c34d58dd438b39e09  '$d'/qualifier.sh' \
            | sha256sum -c -
          chmod +x "$d/qualifier.sh"
          "$d/qualifier.sh"
      - name: Retain reconstruction inputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          d=/tmp/pr2231-v111-source
          r=/tmp/pr2231-v111-reconstruct
          mkdir -p "$ARTIFACT_DIR" "$r/tools/lib" "$r/test"
          [[ ! -f "$d/qualifier.sh" ]] || cp "$d/qualifier.sh" "$ARTIFACT_DIR/qualifier-v111.sh"
          for spec in \
            "$EXPECTED_LIBRARY:$r/tools/lib/industrial-exhaust.mjs" \
            "$EXPECTED_TEST:$r/test/industrial-exhaust.test.js"
          do
            blob=${spec%%:*}
            target=${spec#*:}
            gh api "repos/$REPO/git/blobs/$blob" > "$d/$blob.json"
            python3 - "$d/$blob.json" "$target" <<'PY_EXPORT'
          import base64
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          with open(sys.argv[2], 'wb') as handle:
              handle.write(base64.b64decode(payload['content']))
          PY_EXPORT
          done
          cp "$r/tools/lib/industrial-exhaust.mjs" "$ARTIFACT_DIR/predecessor-library.mjs"
          cp "$r/test/industrial-exhaust.test.js" "$ARTIFACT_DIR/predecessor-test.js"
          if [[ -f "$d/qualifier.sh" ]]; then
            awk '/^PRODUCT_WT=.*python3 <<.PY.$/{capture=1;next} capture&&/^PY$/{exit} capture' \
              "$d/qualifier.sh" > "$d/apply-repair.py"
            PRODUCT_WT="$r" ARTIFACT_DIR="$ARTIFACT_DIR" python3 "$d/apply-repair.py"
            cp "$r/tools/lib/industrial-exhaust.mjs" "$ARTIFACT_DIR/candidate-library.mjs"
            cp "$r/test/industrial-exhaust.test.js" "$ARTIFACT_DIR/candidate-test.js"
            cp "$d/apply-repair.py" "$ARTIFACT_DIR/apply-repair.py"
          fi
          find "$ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\t%s\n' | sort > "$ARTIFACT_DIR/artifact-manifest.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-six-thread-callback-frontier-v111-r2
          path: /tmp/pr2231-six-thread-callback-frontier-v111
          retention-days: 90
