name: TEMP probe SSC RD-04 A07 official sitemaps

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd04-a07-official-sitemap-probe-base
    paths:
      - '.github/tmp/ssc-rd04-a07-official-sitemap-probe.trigger'

permissions:
  contents: write
  issues: write

concurrency:
  group: ssc-rd04-a07-official-sitemap-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a07-official-sitemap-probe-base
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: probe
        name: Inventory official sitemap surfaces
        continue-on-error: true
        run: node .github/tmp/ssc-rd04-a07-official-sitemap-probe.mjs
      - name: Upload exact sitemap probe custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-a07-official-sitemap-probe
          path: a07-official-sitemap-probe
          if-no-files-found: error
          retention-days: 30
      - name: Record sitemap probe on issue 739
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' > /tmp/a07-sitemap-comment.md
          import fs from 'node:fs';
          let summary = null;
          try { summary = JSON.parse(fs.readFileSync('a07-official-sitemap-probe/summary.json', 'utf8')); } catch {}
          const counts = summary?.counts ?? {};
          console.log('### A07 official sitemap denominator probe');
          console.log('');
          console.log('```text');
          console.log(`status:                         ${summary?.status ?? process.env.OUTCOME ?? 'unknown'}`);
          console.log(`seed families:                  ${counts.seeds ?? 0}`);
          console.log(`successful seed roots:          ${counts.successful_seed_roots ?? 0}`);
          console.log(`sitemap documents attempted:    ${counts.sitemap_documents_attempted ?? 0}`);
          console.log(`sitemap documents successful:   ${counts.sitemap_documents_successful ?? 0}`);
          console.log(`discovered official page URLs:  ${counts.discovered_page_urls ?? 0}`);
          console.log(`lexical candidate URLs:         ${counts.lexical_candidate_urls ?? 0}`);
          console.log(`bound hits:                     ${counts.bound_hits ?? 0}`);
          console.log(`fetch/parse failures:           ${counts.failures ?? 0}`);
          console.log('external contacts:              0');
          console.log('graph effect:                   none');
          console.log('```');
          console.log('');
          console.log(`Workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`);
          console.log('');
          console.log('This is a surface-denominator probe only. A lexical candidate is not evidence of implementation or restoration; a failed or absent sitemap is not record absence; and missing public material is not noncompliance.');
          if (summary?.failures?.length) {
            console.log('');
            console.log('Bounded failures:');
            for (const failure of summary.failures.slice(0, 20)) console.log(`- ${failure.message ?? String(failure)}`);
          }
          NODE
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/739/comments" -f body="$(cat /tmp/a07-sitemap-comment.md)"
      - name: Publish disposable sitemap probe handoff
        if: steps.probe.outcome == 'success'
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C agent/ssc-rd04-a07-official-sitemap-probe-pass
          mkdir -p .github/tmp/ssc-rd04-a07-official-sitemap-probe-pass
          cp a07-official-sitemap-probe/summary.json .github/tmp/ssc-rd04-a07-official-sitemap-probe-pass/summary.json
          cp -R a07-official-sitemap-probe/inventories .github/tmp/ssc-rd04-a07-official-sitemap-probe-pass/inventories
          git add .github/tmp/ssc-rd04-a07-official-sitemap-probe-pass
          git commit -m 'Record SSC RD-04 A07 official sitemap probe'
          git push --force origin HEAD:refs/heads/agent/ssc-rd04-a07-official-sitemap-probe-pass
      - name: Fail workflow after custody when execution failed
        if: steps.probe.outcome != 'success'
        run: exit 1
