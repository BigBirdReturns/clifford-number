name: TEMP materialize RD-05 Wave-03 candidate adjudication v1

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-ssc-rd-wave03-rd05-candidate-materializer-v1.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd-wave03-rd05-candidate-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARRIER_ROOT: .transport/ssc-rd-wave03-rd05-candidate-v1/shards
      INPUT_BRANCH: agent/ssc-rd-wave03-rd05-member-participation
      INPUT_HEAD: bc9800dcd3a3768288a5dfeaf0f7144969994ffa
      PRODUCT_BRANCH: agent/ssc-rd-wave03-rd05-candidate-adjudication-product-v1
      PRODUCT_LEASE: bc9800dcd3a3768288a5dfeaf0f7144969994ffa
      PERMANENT_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd05-candidate-adjudication.yml
      BASE64_BYTES: '173112'
      BASE64_SHA256: 9670f55522cf4f58ad5adb800fba361b58cf22760f647aae485135e5184533b6
      ARCHIVE_BYTES: '129832'
      ARCHIVE_SHA256: 41f17e3df0ddf520920f589bf0cfff26245ee41a3dbc95063dff971042773939
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct, qualify, and publish transport-safe product
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          WORK="$RUNNER_TEMP/ssc-rd-wave03-rd05-candidate-v1"
          PACKAGE="$WORK/package"
          RECEIPT="$WORK/receipt"
          rm -rf "$WORK"
          mkdir -p "$PACKAGE" "$RECEIPT"
          exec > >(tee "$RECEIPT/execution.log") 2>&1
          STAGE=init
          finish() {
            rc=$?
            printf 'status=%s\nstage=%s\nexit_code=%s\nutc=%s\n' \
              "$([[ $rc -eq 0 ]] && echo complete || echo failed_closed)" \
              "$STAGE" "$rc" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RECEIPT/checkpoint.txt"
            exit "$rc"
          }
          trap finish EXIT

          STAGE=verify-carrier
          cat > "$RECEIPT/shards.sha256" <<'EOF'
          c2924e0f704941924f0e28eeac615c6a425bbad5c57b0b5c10592dc54bf3677e  000.b64
          adf8bc402e2df8d2ca191af50c7b5cc42d53abfb13c02a9fcac0871dc3c43d83  001.b64
          401dd47b9b8dbc63b291b2ff1e3b82c79f9fa8f28f5ebfb39fb8ea7222cbe98a  002.b64
          2bb951c22149a3126f8149ec16623763a362d3146ec46ed37dfd2fb95e32a89d  003.b64
          2f4027bc89c5c717b1417881f11d78dcb5c83259e4ade8fbd0e94292d42ba488  004.b64
          4da9fe7ae0ff3cd1edbde85c2d2bc3ae600ab40d0d25a347b18feea82e45e2db  005.b64
          d4b2d18d88d631f4d0ed542150b801a5e407ee451727c823b6fa4211dfad3120  006.b64
          a993e3ff19749e07fe25dd5f26e79180f9a23e11d843eb6d91c7ac370d1228f9  007.b64
          8504ed5c2b0cbc50d9b1f27f148c6fe8f29a095f89e99abe545cd4a3142ee1f7  008.b64
          EOF
          sed -i 's/^          //' "$RECEIPT/shards.sha256"
          test "$(find "$CARRIER_ROOT" -maxdepth 1 -type f -name '*.b64' | wc -l | tr -d ' ')" = 9
          (cd "$CARRIER_ROOT" && sha256sum -c "$RECEIPT/shards.sha256")
          cat "$CARRIER_ROOT"/*.b64 > "$WORK/product.b64"
          test "$(stat -c '%s' "$WORK/product.b64")" = "$BASE64_BYTES"
          test "$(sha256sum "$WORK/product.b64" | awk '{print $1}')" = "$BASE64_SHA256"
          base64 -d "$WORK/product.b64" > "$WORK/product.tar.xz"
          test "$(stat -c '%s' "$WORK/product.tar.xz")" = "$ARCHIVE_BYTES"
          test "$(sha256sum "$WORK/product.tar.xz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          tar -xJf "$WORK/product.tar.xz" -C "$PACKAGE"

          cat > "$RECEIPT/expected-paths.txt" <<'EOF'
          .github/workflows/status-sovereignty-rd-wave03-rd05-candidate-adjudication.yml
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/candidates/index.json
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/candidates/part-00.jsonl
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/candidates/part-01.jsonl
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/candidates/part-02.jsonl
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/candidates/part-03.jsonl
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/candidates/part-04.jsonl
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/candidates/product-manifest.json
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/official-body-observation-protocol.json
          data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/source-census-execution-receipt.json
          docs/milestones/ssc-rd-wave03-rd05-candidate-adjudication.md
          schemas/status-sovereignty-rd-wave03-rd05-candidate-adjudication.schema.json
          test/status-sovereignty-rd-wave03-rd05-candidate-adjudication.test.js
          tools/acquisition/status-sovereignty-rd-wave03-rd05/observe-official-bodies.py
          tools/build-status-sovereignty-rd-wave03-rd05-candidate-adjudication.mjs
          tools/validate-status-sovereignty-rd-wave03-rd05-candidate-adjudication.mjs
          EOF
          sed -i 's/^          //' "$RECEIPT/expected-paths.txt"
          test "$(wc -l < "$RECEIPT/expected-paths.txt" | tr -d ' ')" = 16
          find "$PACKAGE" -type f -printf '%P\n' | sort > "$RECEIPT/archive-paths.txt"
          sort "$RECEIPT/expected-paths.txt" > "$RECEIPT/expected-paths-sorted.txt"
          cmp "$RECEIPT/expected-paths-sorted.txt" "$RECEIPT/archive-paths.txt"
          test "$(find "$PACKAGE" -type l | wc -l | tr -d ' ')" = 0

          STAGE=bind-leases
          git fetch --no-tags origin "$INPUT_BRANCH" "$PRODUCT_BRANCH"
          test "$(git rev-parse "origin/$INPUT_BRANCH")" = "$INPUT_HEAD"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_LEASE"
          printf 'input_branch=%s\ninput_head=%s\nproduct_branch=%s\nproduct_lease=%s\n' \
            "$INPUT_BRANCH" "$INPUT_HEAD" "$PRODUCT_BRANCH" "$PRODUCT_LEASE" > "$RECEIPT/leases.txt"

          STAGE=compose
          git checkout --detach "$INPUT_HEAD"
          while IFS= read -r rel; do test ! -e "$rel"; done < "$RECEIPT/expected-paths.txt"
          cp -a "$PACKAGE"/. .
          xargs -d '\n' git add -- < "$RECEIPT/expected-paths.txt"
          git diff --cached --name-status > "$RECEIPT/full-name-status.txt"
          test "$(wc -l < "$RECEIPT/full-name-status.txt" | tr -d ' ')" = 16
          test "$(awk '$1 != "A" {n++} END {print n+0}' "$RECEIPT/full-name-status.txt")" = 0

          run_focused() {
            node --check tools/build-status-sovereignty-rd-wave03-rd05-candidate-adjudication.mjs
            node --check tools/validate-status-sovereignty-rd-wave03-rd05-candidate-adjudication.mjs
            node --check test/status-sovereignty-rd-wave03-rd05-candidate-adjudication.test.js
            python -m py_compile tools/acquisition/status-sovereignty-rd-wave03-rd05/observe-official-bodies.py
            node tools/build-status-sovereignty-rd-wave03-rd05-candidate-adjudication.mjs --check
            node tools/validate-status-sovereignty-rd-wave03-rd05-candidate-adjudication.mjs
            node test/status-sovereignty-rd-wave03-rd05-candidate-adjudication.test.js
            python tools/acquisition/status-sovereignty-rd-wave03-rd05/observe-official-bodies.py \
              --protocol data/intake/status-sovereignty-rd-wave03-rd05-candidate-adjudication/official-body-observation-protocol.json \
              --validate-only
            node tools/validate-no-magic-human-gate.mjs
            node test/no-magic-human-gate.test.js
          }

          STAGE=focused-gates
          run_focused
          git diff --check "$INPUT_HEAD"

          STAGE=full-release-gate
          npm run release:check

          STAGE=clean-replay
          git restore --worktree -- .
          git clean -fdx
          run_focused
          git diff --exit-code

          STAGE=strip-workflow-transport
          git restore --staged -- "$PERMANENT_WORKFLOW"
          rm -f "$PERMANENT_WORKFLOW"
          git diff --cached --name-status > "$RECEIPT/name-status.txt"
          test "$(wc -l < "$RECEIPT/name-status.txt" | tr -d ' ')" = 15
          test "$(awk '$1 != "A" {n++} END {print n+0}' "$RECEIPT/name-status.txt")" = 0
          ! grep -F -- "$PERMANENT_WORKFLOW" "$RECEIPT/name-status.txt"

          STAGE=commit
          git commit -m 'Adjudicate RD-05 candidates and freeze official-body observation protocol'
          PRODUCT_HEAD=$(git rev-parse HEAD)
          PRODUCT_TREE=$(git rev-parse HEAD^{tree})

          STAGE=publish
          git fetch --no-tags origin "$INPUT_BRANCH" "$PRODUCT_BRANCH"
          test "$(git rev-parse "origin/$INPUT_BRANCH")" = "$INPUT_HEAD"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_LEASE"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH" \
            --force-with-lease="refs/heads/$PRODUCT_BRANCH:$PRODUCT_LEASE"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_HEAD"
          printf 'status=complete\ninput_head=%s\ntransport_safe_head=%s\ntransport_safe_tree=%s\npermanent_paths=15\nworkflow_path_omitted=%s\ncandidate_rows=1351\nselected_candidate_followups=0\nofficial_body_observations=25\nclass_closed=false\noutside_human_dependency=false\npublication_effect=none\nadoption_effect=none\ngraph_effect=none\n' \
            "$INPUT_HEAD" "$PRODUCT_HEAD" "$PRODUCT_TREE" "$PERMANENT_WORKFLOW" > "$RECEIPT/final.txt"
          STAGE=complete
      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd-wave03-rd05-candidate-materializer-v1
          path: ${{ runner.temp }}/ssc-rd-wave03-rd05-candidate-v1/receipt
          if-no-files-found: error
          retention-days: 90
