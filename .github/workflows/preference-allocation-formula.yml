name: Preference custody allocation-formula control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/allocation-formula.fixture.json'
      - 'tools/lib/preference-allocation-formula.mjs'
      - 'tools/compile-preference-allocation-formula.mjs'
      - 'tools/validate-preference-allocation-formula.mjs'
      - 'test/preference-allocation-formula.test.js'
      - 'docs/preference-custody-allocation-formula.md'
      - '.github/workflows/preference-allocation-formula.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocation-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile algorithmic allocation-governance worlds
        run: node tools/compile-preference-allocation-formula.mjs
      - name: Validate population, subgroup, formula, feature, model, override, audit, and authority boundaries
        run: node tools/validate-preference-allocation-formula.mjs
      - name: Exercise equality, proxy, opacity, threshold, feedback, gaming, drift, authority, and tamper fixtures
        run: node test/preference-allocation-formula.test.js
      - name: Preserve deterministic allocation-formula projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-allocation-formula-pc19
          path: |
            build/research/preference-allocation-formula.json
            build/research/preference-allocation-formula.md
          if-no-files-found: error
