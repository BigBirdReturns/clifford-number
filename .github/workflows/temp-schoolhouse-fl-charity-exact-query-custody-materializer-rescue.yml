name: TEMP rescue School.House Florida charity custody materializer

on:
  pull_request:
    branches: [main]

concurrency:
  group: schoolhouse-fl-charity-custody-rescue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch sealed hashes in memory and execute original materializer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SOURCE='.github/workflows/temp-schoolhouse-fl-charity-exact-query-custody-materializer.yml'
          PATCHED='/tmp/temp-schoolhouse-fl-charity-exact-query-custody-materializer.patched.yml'
          SCRIPT='/tmp/materialize-schoolhouse-fl-charity-custody.sh'

          test -s "$SOURCE"
          python - "$SOURCE" "$PATCHED" "$SCRIPT" <<'PY'
          from pathlib import Path
          import sys

          source_path = Path(sys.argv[1])
          patched_path = Path(sys.argv[2])
          script_path = Path(sys.argv[3])
          source = source_path.read_text()

          replacements = {
              'sha256:ae68a594d911d0ead2ed673e91392aef326c261b0b6b38a6f68bcaf16db80902':
                  'sha256:9e0797d62a9be0646b81f0e0ae741a6165799d58f943484a68d760d17f26296a',
              '4ca71ec761ff6a085e49c3881150cdf02fa033903d041ff7239f612cde74ea14':
                  '956e5edd8a8e884832f6b3d0fd8cca183855854396877a02d2af8995ba2a04c2',
              '313efb0262982d55aade986dc4da6b97f9b27e9350c3e2426e322d5def144f3c':
                  'a2492b911930353a6c69cfe02971e96109ca8304a0389489e23b770d69a35634',
              '21870d1a65d3b6d29c3a4fce8da374714ff88348bef217ad75241612cf821945':
                  '728ebdae2047c7ef7619072dec6d32eca246531d5d8361ae64663ebc9ef8d1c7',
          }

          for old, new in replacements.items():
              count = source.count(old)
              assert count >= 1, (old, count)
              assert new not in source, new
              source = source.replace(old, new)

          for old, new in replacements.items():
              assert old not in source
              assert new in source

          patched_path.write_text(source)
          lines = source.splitlines()
          marker = '      - name: Reconstruct, validate, gate, and publish exact product'
          try:
              marker_index = lines.index(marker)
          except ValueError as exc:
              raise AssertionError('materializer step marker missing') from exc

          run_index = None
          for index in range(marker_index + 1, len(lines)):
              if lines[index] == '        run: |':
                  run_index = index
                  break
          assert run_index is not None, 'materializer run block missing'

          body = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - ') and not line.startswith('          '):
                  break
              if not line:
                  body.append('')
                  continue
              assert line.startswith('          '), repr(line)
              body.append(line[10:])

          script = '\n'.join(body) + '\n'
          assert 'set -Eeuo pipefail' in script
          assert 'git push --force origin "HEAD:refs/heads/$TARGET"' in script
          assert 'sha256:9e0797d62a9be0646b81f0e0ae741a6165799d58f943484a68d760d17f26296a' in script
          assert '956e5edd8a8e884832f6b3d0fd8cca183855854396877a02d2af8995ba2a04c2' in script
          assert 'a2492b911930353a6c69cfe02971e96109ca8304a0389489e23b770d69a35634' in script
          assert '728ebdae2047c7ef7619072dec6d32eca246531d5d8361ae64663ebc9ef8d1c7' in script
          script_path.write_text(script)
          PY

          bash -n "$SCRIPT"
          bash "$SCRIPT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schoolhouse-fl-charity-custody-materialization-rescue-receipt
          path: /tmp/schoolhouse-fl-charity-custody-materialization-receipt
          if-no-files-found: warn
          retention-days: 90
