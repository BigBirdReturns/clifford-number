name: TEMP diagnose canonical RD-04 North Dakota follow-up adjudication release replay v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-diagnose-ssc-rd04-postpromotion-nd-followup-adjudication-release-replay-v3.yml'

permissions:
  contents: read

concurrency:
  group: rd04-postpromotion-nd-followup-release-diagnostic-v3-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/ssc-rd04-postpromotion-nd-followup-adjudication-postmerge-v3-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MERGE: 30e151b3ff4aeb5e6353d443fab1c535bc6d7b69
      PRODUCT: 9ac648d062d6a1ec5a19fec849be29bf76c69bad
      PARENT: 048e9d13a2555d8e6fabdbee5f45aea858f919b7
      TREE: 9d5b15d4b78e3027a316f507e46692e215f7e5a8
      CARRIER_BRANCH: observer/ssc-rd04-postpromotion-nd-followup-adjudication-postmerge-v3-diagnostic
      CARRIER_PATH: .github/workflows/temp-diagnose-ssc-rd04-postpromotion-nd-followup-adjudication-release-replay-v3.yml

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Classify exact canonical release replay
        id: diagnose
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-nd-followup-release-diagnostic-v3"
          REPLAY="$RUNNER_TEMP/ssc-rd04-postpromotion-nd-followup-canonical-release-replay-v3"
          rm -rf "$OUT" "$REPLAY"
          mkdir -p "$OUT"
          printf 'stage=carrier-topology\n' > "$OUT/stage.txt"

          test "${{ github.event_name }}" = pull_request
          test "${{ github.head_ref }}" = "$CARRIER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$MERGE"
          test "$(git rev-list --count "$MERGE"..HEAD)" -eq 1
          test "$(git diff --name-only "$MERGE" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --diff-filter=A --name-only "$MERGE" HEAD)" = "$CARRIER_PATH"
          test -z "$(git diff --diff-filter=MDTCRUXB --name-only "$MERGE" HEAD)"
          git diff --check "$MERGE" HEAD

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$MERGE"
          test "$(git rev-parse "$PRODUCT^")" = "$PARENT"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$TREE"
          test "$(git rev-parse "$MERGE^{tree}")" = "$TREE"

          git rev-list --parents -n1 "$MERGE" > "$OUT/merge-parents.txt"
          git diff --name-status "$PARENT" "$PRODUCT" > "$OUT/product-name-status.txt"
          git diff --name-status "$PRODUCT" "$MERGE" > "$OUT/merge-wrapper-name-status.txt"
          test ! -s "$OUT/merge-wrapper-name-status.txt"

          printf 'stage=detached-worktree-setup\n' > "$OUT/stage.txt"
          git worktree add --detach "$REPLAY" "$MERGE"
          test "$(git -C "$REPLAY" rev-parse HEAD)" = "$MERGE"
          test "$(git -C "$REPLAY" rev-parse HEAD^{tree})" = "$TREE"
          test -z "$(git -C "$REPLAY" status --porcelain=v1 --untracked-files=all)"

          printf 'stage=release-check-running\n' > "$OUT/stage.txt"
          set +e
          (
            cd "$REPLAY"
            npm run release:check
          ) > "$OUT/release-check.log" 2>&1
          RELEASE_CODE=$?
          set -e
          printf '%s\n' "$RELEASE_CODE" > "$OUT/release-check-exit-code.txt"
          printf 'stage=release-check-complete\n' > "$OUT/stage.txt"

          set +e
          git -C "$REPLAY" diff --check > "$OUT/diff-check.txt" 2>&1
          DIFF_CHECK_CODE=$?
          git -C "$REPLAY" diff --exit-code > "$OUT/tracked-diff.patch" 2>&1
          TRACKED_DIFF_CODE=$?
          set -e
          printf '%s\n' "$DIFF_CHECK_CODE" > "$OUT/diff-check-exit-code.txt"
          printf '%s\n' "$TRACKED_DIFF_CODE" > "$OUT/tracked-diff-exit-code.txt"

          git -C "$REPLAY" diff --name-status > "$OUT/tracked-name-status.txt"
          git -C "$REPLAY" diff --stat > "$OUT/tracked-diff-stat.txt"
          git -C "$REPLAY" status --porcelain=v1 --untracked-files=all > "$OUT/status-porcelain.txt"
          git -C "$REPLAY" status --porcelain=v2 --untracked-files=all > "$OUT/status-porcelain-v2.txt"
          git -C "$REPLAY" clean -ndx > "$OUT/clean-dry-run.txt"

          printf 'stage=classification\n' > "$OUT/stage.txt"
          python - "$OUT" "$RELEASE_CODE" "$DIFF_CHECK_CODE" "$TRACKED_DIFF_CODE" <<'PY'
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          release_code = int(sys.argv[2])
          diff_check_code = int(sys.argv[3])
          tracked_diff_code = int(sys.argv[4])
          tracked = [
              line for line in (out / "tracked-name-status.txt").read_text().splitlines()
              if line.strip()
          ]
          status = [
              line for line in (out / "status-porcelain.txt").read_text().splitlines()
              if line.strip()
          ]
          untracked = [line[3:] for line in status if line.startswith("?? ")]
          tracked_status = [line for line in status if not line.startswith("?? ")]

          if release_code != 0:
              classification = "release_check_failed"
          elif diff_check_code != 0:
              classification = "release_check_passed_diff_check_failed"
          elif tracked_diff_code != 0 or tracked or tracked_status:
              classification = "release_check_passed_tracked_residue"
          elif untracked:
              classification = "release_check_passed_untracked_residue"
          else:
              classification = "release_check_passed_clean"

          receipt = {
              "schema_version": "ssc-rd04-postpromotion-nd-followup-release-diagnostic@3",
              "state": "diagnosis_complete",
              "canonical_merge": "30e151b3ff4aeb5e6353d443fab1c535bc6d7b69",
              "product_commit": "9ac648d062d6a1ec5a19fec849be29bf76c69bad",
              "product_parent": "048e9d13a2555d8e6fabdbee5f45aea858f919b7",
              "canonical_tree": "9d5b15d4b78e3027a316f507e46692e215f7e5a8",
              "replay_surface": "detached_exact_canonical_merge",
              "classification": classification,
              "release_check_exit_code": release_code,
              "diff_check_exit_code": diff_check_code,
              "tracked_diff_exit_code": tracked_diff_code,
              "tracked_name_status": tracked,
              "tracked_status": tracked_status,
              "untracked_paths": untracked,
              "clean_after_release": not status and tracked_diff_code == 0,
              "source_requests": 0,
              "source_admissions": 0,
              "matrix_updates": 0,
              "field_terminalizations": 0,
              "row_state_mutations": 0,
              "class_closed": False,
              "cumulative_ledger_effect": "none",
              "outside_human_dependency": False,
              "publication_effect": "none",
              "adoption_effect": "none",
              "graph_effect": "none",
          }
          (out / "diagnosis.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

          printf 'stage=canonical-lease-recheck\n' > "$OUT/stage.txt"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$MERGE"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git worktree remove --force "$REPLAY"

          printf 'stage=complete\n' > "$OUT/stage.txt"
          (
            cd "$OUT"
            find . -type f ! -name SHA256SUMS -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-rd04-postpromotion-nd-followup-release-diagnostic-v3
          path: ${{ runner.temp }}/ssc-rd04-postpromotion-nd-followup-release-diagnostic-v3
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Require complete bounded diagnosis
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/ssc-rd04-postpromotion-nd-followup-release-diagnostic-v3"
          test "${{ steps.diagnose.outcome }}" = success
          test "$(cat "$OUT/stage.txt")" = 'stage=complete'
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e '
            .schema_version=="ssc-rd04-postpromotion-nd-followup-release-diagnostic@3" and
            .state=="diagnosis_complete" and
            .replay_surface=="detached_exact_canonical_merge" and
            .canonical_merge=="30e151b3ff4aeb5e6353d443fab1c535bc6d7b69" and
            .product_commit=="9ac648d062d6a1ec5a19fec849be29bf76c69bad" and
            .product_parent=="048e9d13a2555d8e6fabdbee5f45aea858f919b7" and
            .canonical_tree=="9d5b15d4b78e3027a316f507e46692e215f7e5a8" and
            (.classification |
              .=="release_check_failed" or
              .=="release_check_passed_diff_check_failed" or
              .=="release_check_passed_tracked_residue" or
              .=="release_check_passed_untracked_residue" or
              .=="release_check_passed_clean") and
            .source_requests==0 and
            .source_admissions==0 and
            .matrix_updates==0 and
            .field_terminalizations==0 and
            .row_state_mutations==0 and
            .class_closed==false and
            .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and
            .publication_effect=="none" and
            .adoption_effect=="none" and
            .graph_effect=="none"
          ' "$OUT/diagnosis.json" > /dev/null
