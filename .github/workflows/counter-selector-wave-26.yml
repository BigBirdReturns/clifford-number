name: Counter-Selector Wave 26 observability pivot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-26.yml'
      - 'data/project/counter-selector-wave-26-*.json'
      - 'schemas/counter-selector-observability-pivot.schema.json'
      - 'docs/methods/counter-selector-observability-pivot.md'
      - 'docs/milestones/counter-selector-wave-26.md'
      - 'tools/build-counter-selector-wave-26.mjs'
      - 'tools/validate-counter-selector-wave-26.mjs'
      - 'test/counter-selector-wave-26.test.js'
      - 'reports/core-thesis/counter-selector-wave-26/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-26.yml'
      - 'data/project/counter-selector-wave-26-*.json'
      - 'schemas/counter-selector-observability-pivot.schema.json'
      - 'docs/methods/counter-selector-observability-pivot.md'
      - 'docs/milestones/counter-selector-wave-26.md'
      - 'tools/build-counter-selector-wave-26.mjs'
      - 'tools/validate-counter-selector-wave-26.mjs'
      - 'test/counter-selector-wave-26.test.js'
      - 'reports/core-thesis/counter-selector-wave-26/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 26 products
        run: node tools/build-counter-selector-wave-26.mjs
      - name: Validate observability-pivot contract
        run: node tools/validate-counter-selector-wave-26.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-26.test.js
      - name: Require exact committed Wave 26 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-26-candidate-registry.json \
            data/project/counter-selector-wave-26-release-manifest.json \
            reports/core-thesis/counter-selector-wave-26/data.json \
            reports/core-thesis/counter-selector-wave-26/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 26 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-26.mjs
          node tools/validate-counter-selector-wave-26.mjs
          node test/counter-selector-wave-26.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
