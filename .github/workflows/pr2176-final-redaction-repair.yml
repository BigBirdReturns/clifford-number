name: PR 2176 final redaction repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/pr2176-final-redaction-repair.yml

permissions:
  contents: write

concurrency:
  group: pr2176-final-redaction-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply, verify, test, and commit the final redaction repair
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"

          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "6b31c000cacfe29cb7fa0414c50e7263d4cd901f"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "bd1282b025d03c61ac6f0b4ba1d99273ae35d53d"
          test "$(git hash-object tools/crawl-industrial-exhaust.mjs)" = "22c4cc8a53058bbb128d064850c2a7c71a4367de"
          test "$(git ls-files -s tools/crawl-industrial-exhaust.mjs | awk '{print $1}')" = "100755"

          cat > /tmp/pr2176.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode /tmp/pr2176.patch.gz.b64 > /tmp/pr2176.patch.gz
          gzip --decompress --stdout /tmp/pr2176.patch.gz > /tmp/pr2176.patch
          echo "f6055ddba218603a8a04dffd798f2f9ed1318864e4776cc4ddafeba0cfc2d93c  /tmp/pr2176.patch" | sha256sum --check --strict

          git apply --check /tmp/pr2176.patch
          git apply /tmp/pr2176.patch
          git diff --check

          test "$(git hash-object tools/lib/industrial-exhaust.mjs)" = "c98415430662d782e44352f9a8f4f9918743e0f8"
          test "$(git hash-object test/industrial-exhaust.test.js)" = "57049258534c23553bb1aeb19d58d10d6b7d2443"
          test "$(git hash-object tools/crawl-industrial-exhaust.mjs)" = "22c4cc8a53058bbb128d064850c2a7c71a4367de"
          test "$(git ls-files -s tools/crawl-industrial-exhaust.mjs | awk '{print $1}')" = "100755"

          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node test/industrial-exhaust.test.js

          rm .github/workflows/pr2176-final-redaction-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/pr2176-final-redaction-repair.yml
          git commit -m "fix(crawler): cover international dialing boundaries"
          git push origin "HEAD:$GITHUB_REF_NAME"
