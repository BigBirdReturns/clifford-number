name: K0 source and field audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/intake/k0-*.json'
      - 'data/intake/k0-*.txt'
      - 'data/project/k0-*.json'
      - 'data/research/k0-*.json'
      - 'schemas/k0-*.json'
      - 'docs/methods/k0-*.md'
      - 'docs/milestones/m05-k0-*.md'
      - 'tools/*k0*.mjs'
      - 'test/k0-*.test.js'
      - 'reports/core-thesis/answerable-power/k0.*'
      - '.github/workflows/k0-*.yml'
  push:
    branches: [main]
    paths:
      - 'data/intake/k0-*.json'
      - 'data/intake/k0-*.txt'
      - 'data/project/k0-*.json'
      - 'data/research/k0-*.json'
      - 'schemas/k0-*.json'
      - 'docs/methods/k0-*.md'
      - 'docs/milestones/m05-k0-*.md'
      - 'tools/*k0*.mjs'
      - 'test/k0-*.test.js'
      - 'reports/core-thesis/answerable-power/k0.*'
      - '.github/workflows/k0-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and test K0 audit
        run: |
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic products
        run: |
          git restore --staged --worktree .
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
          git diff --exit-code
