name: Project stable-ground supersession 09 · historical

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg09*.json'
      - 'data/project/project-stable-ground-sg10*.json'
      - 'reports/core-thesis/stable-ground/sg09/**'
      - 'reports/core-thesis/stable-ground/sg10/**'
      - 'tools/validate-project-stable-ground-sg09.mjs'
      - 'test/project-stable-ground-sg09.test.js'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-sg09*.json'
      - 'data/project/project-stable-ground-sg10*.json'
      - 'reports/core-thesis/stable-ground/sg09/**'
      - 'reports/core-thesis/stable-ground/sg10/**'
      - 'tools/validate-project-stable-ground-sg09.mjs'
      - 'test/project-stable-ground-sg09.test.js'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate SG-09 as immutable history
        run: |
          node tools/validate-project-stable-ground-sg09.mjs
          node test/project-stable-ground-sg09.test.js
      - name: Verify frozen SG-09 bytes at the merge receipt
        run: |
          set -Eeuo pipefail
          receipt=17775a008efbe33c57a59af489db691716e9bae1
          for rel in \
            data/project/project-stable-ground-sg09.json \
            data/project/project-stable-ground-sg09-release-manifest.json \
            reports/core-thesis/stable-ground/sg09/checkpoint.json \
            reports/core-thesis/stable-ground/sg09/index.html
          do
            git show "$receipt:$rel" > "/tmp/$(basename "$rel")"
            cmp --silent "$rel" "/tmp/$(basename "$rel")"
          done
      - name: Reject historical rebuilding
        run: |
          test "$(jq -r '.history_law.historical_data_and_reports_rewritten' data/project/project-stable-ground-governor.json)" = false
          test "$(jq -r '.history_law.historical_release_manifests_recomputed' data/project/project-stable-ground-governor.json)" = false
          test "$(jq -r '.history[] | select(.checkpoint_id == "SG-2026-07-31-09") | .status' data/project/project-stable-ground-current.json)" = superseded_preserved
