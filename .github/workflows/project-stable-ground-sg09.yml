name: Project stable-ground supersession 09 · historical

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-sg09*.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-governor.json'
      - 'tools/validate-project-stable-ground-sg09.mjs'
      - 'test/project-stable-ground-sg09.test.js'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'data/project/project-stable-ground-sg09*.json'
      - 'data/project/project-stable-ground-current.json'
      - 'data/project/project-stable-ground-governor.json'
      - 'tools/validate-project-stable-ground-sg09.mjs'
      - 'test/project-stable-ground-sg09.test.js'
      - '.github/workflows/project-stable-ground-sg09.yml'
      - '.github/workflows/project-stable-ground-sg10.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-history:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate frozen SG-09 custody
        run: |
          node tools/validate-project-stable-ground-sg09.mjs
          node test/project-stable-ground-sg09.test.js
      - name: Validate current stable-ground chain
        run: npm run validate:stable-ground
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Preserve immutable SG-09 bytes
        run: |
          git restore --staged --worktree .
          git clean -fdx
          node tools/validate-project-stable-ground-sg09.mjs
          node test/project-stable-ground-sg09.test.js
          git diff --exit-code -- \
            data/project/project-stable-ground-sg09.json \
            data/project/project-stable-ground-sg09-release-manifest.json \
            reports/core-thesis/stable-ground/sg09/checkpoint.json \
            reports/core-thesis/stable-ground/sg09/index.html
          test -z "$(git status --porcelain)"
