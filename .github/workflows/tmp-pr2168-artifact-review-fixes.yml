name: Temporary PR2168 artifact review fixes

on:
  push:
    branches:
      - agent/pr2168-artifact-review-fixes-v1
    paths:
      - '.github/workflows/tmp-pr2168-artifact-review-fixes.yml'

permissions:
  contents: write

concurrency:
  group: pr2168-artifact-review-fixes-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH_NAME: agent/pr2168-artifact-review-fixes-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply both post-merge review fixes
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${BRANCH_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path

          lib_path = Path('tools/lib/industrial-exhaust-artifacts.mjs')
          lib_text = lib_path.read_text()
          old_selection = '''export function selectHydrationCandidates(candidates, state, limit) {
            const positions = new Map(candidates.map((candidate, index) => [candidate.canonical_url, index]));
            const rank = candidate => {
              const page = state?.pages?.[candidate.canonical_url];
              if (!page) return 0;
              if (page.last_status === 'error') return 1;
              return 2;
            };
            return [...candidates]
              .sort((left, right) => rank(left) - rank(right)
                || Number(positions.get(left.canonical_url)) - Number(positions.get(right.canonical_url)))
              .slice(0, limit);
          }
          '''
          new_selection = '''export function selectHydrationCandidates(candidates, state, limit) {
            const positions = new Map(candidates.map((candidate, index) => [candidate.canonical_url, index]));
            const pageFor = candidate => state?.pages?.[candidate.canonical_url] ?? null;
            const rank = candidate => {
              const page = pageFor(candidate);
              if (!page) return 0;
              if (page.last_status === 'error') return 1;
              return 2;
            };
            const lastCheckedAt = candidate => String(pageFor(candidate)?.last_checked_at ?? '');
            return [...candidates]
              .sort((left, right) => rank(left) - rank(right)
                || lastCheckedAt(left).localeCompare(lastCheckedAt(right))
                || Number(positions.get(left.canonical_url)) - Number(positions.get(right.canonical_url)))
              .slice(0, limit);
          }
          '''
          old_selection = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_selection.splitlines()) + '\n'
          new_selection = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_selection.splitlines()) + '\n'
          if lib_text.count(old_selection) != 1:
              raise SystemExit(f'selection contract expected once, found {lib_text.count(old_selection)}')
          lib_text = lib_text.replace(old_selection, new_selection, 1)

          old_seed = "    const seedMatchedTerms = [...(candidate?.seed_matched_terms ?? artifact.seed_matched_terms ?? [])];\n"
          new_seed = (
              "    const seedMatchedTerms = watchConfig\n"
              "      ? [...(candidate?.seed_matched_terms ?? [])]\n"
              "      : [...(artifact.seed_matched_terms ?? [])];\n"
          )
          if lib_text.count(old_seed) != 1:
              raise SystemExit(f'seed rematch contract expected once, found {lib_text.count(old_seed)}')
          lib_path.write_text(lib_text.replace(old_seed, new_seed, 1))

          test_path = Path('test/industrial-exhaust-artifacts.test.js')
          test_text = test_path.read_text()
          rematch_anchor = "assert.ok(rematchedAlerts[0].artifact_matched_terms.includes('leadership_copy'));\n\n"
          rematch_tests = '''assert.ok(rematchedAlerts[0].artifact_matched_terms.includes('leadership_copy'));
          const retiredSeedArtifact = {
            ...artifactMerge.added,
            title: 'No current watch match',
            normalized_text: 'The current registry does not match this body.',
            seed_matched_terms: ['retired_term'],
            artifact_matched_terms: [],
            matched_terms: ['retired_term']
          };
          const currentRegistryAlerts = buildArtifactAlerts([retiredSeedArtifact], {
            watchConfig: {
              schema_version: 1,
              terms: [{ id: 'current_term', patterns: ['current phrase'] }]
            },
            candidates: []
          });
          assert.deepEqual(currentRegistryAlerts, []);
          const historicalRegistryAlerts = buildArtifactAlerts([retiredSeedArtifact]);
          assert.deepEqual(historicalRegistryAlerts[0].seed_matched_terms, ['retired_term']);

          '''
          rematch_tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in rematch_tests.splitlines()) + '\n'
          if test_text.count(rematch_anchor) != 1:
              raise SystemExit(f'rematch test anchor expected once, found {test_text.count(rematch_anchor)}')
          test_text = test_text.replace(rematch_anchor, rematch_tests, 1)

          fairness_anchor = '''assert.deepEqual(fairSelection.map(row => row.canonical_url), [
            'https://www.dentsu.com/news-releases/new-one',
            'https://www.dentsu.com/news-releases/new-two'
          ]);

          '''
          fairness_tests = '''assert.deepEqual(fairSelection.map(row => row.canonical_url), [
            'https://www.dentsu.com/news-releases/new-one',
            'https://www.dentsu.com/news-releases/new-two'
          ]);

          const rotatingCandidates = [
            { canonical_url: 'https://www.dentsu.com/news-releases/success-one' },
            { canonical_url: 'https://www.dentsu.com/news-releases/success-two' },
            { canonical_url: 'https://www.dentsu.com/news-releases/success-three' }
          ];
          const rotatingSuccessSelection = selectHydrationCandidates(rotatingCandidates, {
            pages: {
              'https://www.dentsu.com/news-releases/success-one': { last_status: 'ok', last_checked_at: '2026-08-18T03:00:00.000Z' },
              'https://www.dentsu.com/news-releases/success-two': { last_status: 'ok', last_checked_at: '2026-08-18T02:00:00.000Z' },
              'https://www.dentsu.com/news-releases/success-three': { last_status: 'ok', last_checked_at: '2026-08-18T01:00:00.000Z' }
            }
          }, 2);
          assert.deepEqual(rotatingSuccessSelection.map(row => row.canonical_url), [
            'https://www.dentsu.com/news-releases/success-three',
            'https://www.dentsu.com/news-releases/success-two'
          ]);

          const rotatingFailureSelection = selectHydrationCandidates(rotatingCandidates, {
            pages: {
              'https://www.dentsu.com/news-releases/success-one': { last_status: 'error', last_checked_at: '2026-08-18T03:00:00.000Z' },
              'https://www.dentsu.com/news-releases/success-two': { last_status: 'error', last_checked_at: '2026-08-18T02:00:00.000Z' },
              'https://www.dentsu.com/news-releases/success-three': { last_status: 'error', last_checked_at: '2026-08-18T01:00:00.000Z' }
            }
          }, 2);
          assert.deepEqual(rotatingFailureSelection.map(row => row.canonical_url), [
            'https://www.dentsu.com/news-releases/success-three',
            'https://www.dentsu.com/news-releases/success-two'
          ]);

          '''
          fairness_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in fairness_anchor.splitlines()) + '\n'
          fairness_tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in fairness_tests.splitlines()) + '\n'
          if test_text.count(fairness_anchor) != 1:
              raise SystemExit(f'fairness test anchor expected once, found {test_text.count(fairness_anchor)}')
          test_path.write_text(test_text.replace(fairness_anchor, fairness_tests, 1))
          PY

          node --check tools/lib/industrial-exhaust-artifacts.mjs
          node --check test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust-artifacts.test.js
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/lib/industrial-exhaust-artifacts.mjs test/industrial-exhaust-artifacts.test.js
          git commit -m 'Fix artifact alert rematching and hydration rotation'

          npm run release:check
          git restore --staged --worktree .
          git rm .github/workflows/tmp-pr2168-artifact-review-fixes.yml
          git commit -m 'Remove temporary PR2168 review-fix materializer'
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
