name: TEMP export bounded historical Git objects for PC-38

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/temporary-pc38-historical-object-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Acquire and pack exact Stable Ground validator commits
        run: |
          set -Eeuo pipefail
          out=/tmp/pc38-historical-objects
          mkdir -p "$out/objects/pack"
          cat > /tmp/pc38-required-commits <<'COMMITS'
          0d0999b89196294ec6d8058b7f18e44360d2b6e6
          0d701692fa83a405bd0ba86e7b45c525022589f7
          17775a008efbe33c57a59af489db691716e9bae1
          4a921326d99e248fb7dc3f1883e4460b8c6ce0e0
          8c5e592034effe30d644319e085f97e045060269
          8ccbff46d2ee83a3d0f1d39b91b38765f7a3f3c1
          9370b4d27c756ec7b11d5f88d92eecf3a1ffe13f
          974b7a70cdc46828805f38bb4abe46aacd94380c
          a9cb4c707a1cc6afb51d0fd20b0375e0cf2373b7
          b305eb935864b8adef320e8db5ff471d2a778403
          b3a34a66d37a93b907361b1e9a73dd7bda8d2fa1
          b952da00932012be409c63554d6c81f8367723cb
          c8415a769d03add67a92a3019794268bf5d1cb84
          cada5ce40087305196a53a9ecc32a707cff28e52
          f3fb90778ce12e262cd24824c385594d7c7daec2
          COMMITS
          sed -i 's/^          //' /tmp/pc38-required-commits
          sort -u -o /tmp/pc38-required-commits /tmp/pc38-required-commits
          test "$(wc -l < /tmp/pc38-required-commits | tr -d ' ')" = 15

          git fetch --no-tags --deepen=4096 origin main
          : > "$out/acquired-commits.txt"
          : > "$out/unavailable-commits.txt"
          while IFS= read -r sha; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=256 origin "$sha" || true
            fi
            if git cat-file -e "$sha^{commit}" 2>/dev/null; then
              git update-ref "refs/pc38/history/$sha" "$sha"
              printf '%s\n' "$sha" >> "$out/acquired-commits.txt"
            else
              printf '%s\n' "$sha" >> "$out/unavailable-commits.txt"
            fi
          done < /tmp/pc38-required-commits

          printf '%s\n' 'acquired commits:'
          cat "$out/acquired-commits.txt"
          printf '%s\n' 'unavailable commits:'
          cat "$out/unavailable-commits.txt"
          test ! -s "$out/unavailable-commits.txt"
          test "$(wc -l < "$out/acquired-commits.txt" | tr -d ' ')" = 15

          git repack -a -d
          cp .git/objects/pack/* "$out/objects/pack/"
          cp /tmp/pc38-required-commits "$out/required-commits.txt"
          git rev-parse HEAD > "$out/main-head.sha"
          sha256sum "$out"/objects/pack/* > "$out/pack-files.sha256"
          stat -c '%s %n' "$out"/objects/pack/* > "$out/pack-files.bytes"
          while IFS= read -r sha; do git cat-file -t "$sha"; done < /tmp/pc38-required-commits > "$out/object-types.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pc38-stable-ground-historical-object-pack
          path: /tmp/pc38-historical-objects
          if-no-files-found: error
          retention-days: 7
