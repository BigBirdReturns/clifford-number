name: TEMP SSC RD-04 A07 shard-00 extraction pilot

on:
  push:
    branches:
      - agent/ssc-rd04-a07-public-compliance-receipts
    paths:
      - '.github/workflows/temporary-ssc-rd04-a07-shard00-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: agent/ssc-rd04-a07-public-compliance-receipts
      RELEASE_TAG: ssc-rd04-a06-fy2025-26-corpus-v1
      ARCHIVE_NAME: ssc-rd04-a06-pdf-shard-00.tar.zst
      HASH_NAME: ssc-rd04-a06-pdf-shard-00.tar.zst.sha256
      EXPECTED_DOCUMENTS: '192'
      EXPECTED_REGISTRY_ROWS: '212'
      RECEIPT_PATH: data/intake/status-sovereignty-rd04-calfresh-compliance-receipts-a07/pilot/shard-00-receipt.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd04-a07-public-compliance-receipts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the frozen extractor before source access
        id: preflight
        run: |
          set -Eeuo pipefail
          node tools/validate-no-magic-human-gate.mjs
          node tools/ssc-rd04-a07-order-candidate-extractor.mjs validate-rules
          node test/ssc-rd04-a07-order-candidate-extractor.test.js
      - name: Install archive support when absent
        id: archive_support
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
      - name: Bind exact shard assets from merged A06 custody
        id: assets
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/a07-shard00-pilot"
          mkdir -p "$work"
          node --input-type=module <<'NODE' > "$work/asset-selection.env"
          import fs from 'node:fs';
          const ledger = JSON.parse(fs.readFileSync(
            'data/intake/status-sovereignty-rd04-calfresh-decision-corpus-a06/release-assets.json',
            'utf8'
          ));
          const select = (name) => {
            const matches = ledger.assets.filter((asset) => asset.name === name);
            if (matches.length !== 1) throw new Error(`expected one committed asset ${name}, observed ${matches.length}`);
            return matches[0];
          };
          const archive = select(process.env.ARCHIVE_NAME);
          const hash = select(process.env.HASH_NAME);
          if (ledger.tag !== process.env.RELEASE_TAG) throw new Error('committed release tag mismatch');
          if (ledger.release_id !== 363688049) throw new Error('committed release id mismatch');
          if (ledger.draft !== true || ledger.published_at !== null) throw new Error('committed draft boundary mismatch');
          if (ledger.observed_assets !== 132 || ledger.expected_assets !== 132) throw new Error('committed asset denominator mismatch');
          if (archive.id !== 498543437 || hash.id !== 498543438) throw new Error('committed shard-00 asset identity mismatch');
          if (archive.size !== 21339450 || hash.size !== 100) throw new Error('committed shard-00 asset size mismatch');
          if (archive.sha256 !== '37d07a030e07857db758b96f8d2ef878a98bd413f1e987623d019fc835ed2ebc') throw new Error('committed shard-00 archive hash mismatch');
          if (!archive.browser_download_url || !hash.browser_download_url) throw new Error('committed browser download URL absent');
          console.log(`release_id=${ledger.release_id}`);
          console.log(`release_asset_count=${ledger.observed_assets}`);
          console.log(`archive_id=${archive.id}`);
          console.log(`archive_size=${archive.size}`);
          console.log(`archive_expected_sha256=${archive.sha256}`);
          console.log(`archive_download_url=${archive.browser_download_url}`);
          console.log(`hash_id=${hash.id}`);
          console.log(`hash_size=${hash.size}`);
          console.log(`hash_download_url=${hash.browser_download_url}`);
          NODE
          cat "$work/asset-selection.env" >> "$GITHUB_OUTPUT"
      - name: Download, checksum, and extract content-neutral shard 00
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_ID: ${{ steps.assets.outputs.archive_id }}
          HASH_ID: ${{ steps.assets.outputs.hash_id }}
          ARCHIVE_URL: ${{ steps.assets.outputs.archive_download_url }}
          HASH_URL: ${{ steps.assets.outputs.hash_download_url }}
          ARCHIVE_EXPECTED_SHA256: ${{ steps.assets.outputs.archive_expected_sha256 }}
          ARCHIVE_EXPECTED_SIZE: ${{ steps.assets.outputs.archive_size }}
          HASH_EXPECTED_SIZE: ${{ steps.assets.outputs.hash_size }}
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/a07-shard00-pilot"
          cd "$work"
          download_one() {
            local url="$1"
            local asset_id="$2"
            local output="$3"
            local label="$4"
            if curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/octet-stream' \
              "$url" -o "$output"; then
              echo "${label}_transport=browser_download_url" >> "$GITHUB_OUTPUT"
            else
              rm -f "$output"
              gh api -H 'Accept: application/octet-stream' \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$output"
              echo "${label}_transport=asset_api" >> "$GITHUB_OUTPUT"
            fi
          }
          download_one "$ARCHIVE_URL" "$ARCHIVE_ID" "$ARCHIVE_NAME" archive
          download_one "$HASH_URL" "$HASH_ID" "$HASH_NAME" hash
          test "$(wc -c < "$ARCHIVE_NAME" | tr -d ' ')" = "$ARCHIVE_EXPECTED_SIZE"
          test "$(wc -c < "$HASH_NAME" | tr -d ' ')" = "$HASH_EXPECTED_SIZE"
          test "$(sha256sum "$ARCHIVE_NAME" | cut -d' ' -f1)" = "$ARCHIVE_EXPECTED_SHA256"
          sha256sum --check --strict "$HASH_NAME"
          mkdir -p extracted
          tar --zstd -xf "$ARCHIVE_NAME" -C extracted
          test "$(find extracted -type f -name fetch.json | wc -l | tr -d ' ')" = "$EXPECTED_DOCUMENTS"
          test "$(find extracted -type f -name decision.txt | wc -l | tr -d ' ')" = "$EXPECTED_DOCUMENTS"
      - name: Execute bounded content-neutral extraction
        id: extraction
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/a07-shard00-pilot"
          node tools/ssc-rd04-a07-order-candidate-extractor.mjs extract \
            --source "$work/extracted" \
            --output "$work/ledger.json" \
            --mode pilot \
            --expected "$EXPECTED_DOCUMENTS"
      - name: Reconcile exact denominator and write provisional receipt
        id: reconciliation
        env:
          RELEASE_ID: ${{ steps.assets.outputs.release_id }}
          RELEASE_ASSET_COUNT: ${{ steps.assets.outputs.release_asset_count }}
          ARCHIVE_ID: ${{ steps.assets.outputs.archive_id }}
          ARCHIVE_SIZE: ${{ steps.assets.outputs.archive_size }}
          ARCHIVE_EXPECTED_SHA256: ${{ steps.assets.outputs.archive_expected_sha256 }}
          HASH_ID: ${{ steps.assets.outputs.hash_id }}
          ARCHIVE_TRANSPORT: ${{ steps.download.outputs.archive_transport }}
          HASH_TRANSPORT: ${{ steps.download.outputs.hash_transport }}
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/a07-shard00-pilot"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const stable = (value) => `${JSON.stringify(value, null, 2)}\n`;
          const work = `${process.env.RUNNER_TEMP}/a07-shard00-pilot`;
          const plan = JSON.parse(fs.readFileSync(
            'data/intake/status-sovereignty-rd04-calfresh-decision-corpus-a06/denominator-shards/00.json',
            'utf8'
          ));
          const releaseLedgerBytes = fs.readFileSync(
            'data/intake/status-sovereignty-rd04-calfresh-decision-corpus-a06/release-assets.json'
          );
          const ledgerBytes = fs.readFileSync(`${work}/ledger.json`);
          const ledger = JSON.parse(ledgerBytes);
          const rulesBytes = fs.readFileSync(
            'data/intake/status-sovereignty-rd04-calfresh-compliance-receipts-a07/candidate-extraction-rules.json'
          );
          const expectedIds = plan.documents.map((row) => row.document_identity).sort();
          const observedIds = ledger.documents.map((row) => row.document_identity).sort();
          if (JSON.stringify(expectedIds) !== JSON.stringify(observedIds)) throw new Error('document identities differ from frozen shard 00');
          const expectedRegistryIds = plan.documents.flatMap((row) => row.registry_ids).map(String).sort();
          const observedRegistryIds = ledger.documents.flatMap((row) => row.registry_ids).map(String).sort();
          if (JSON.stringify(expectedRegistryIds) !== JSON.stringify(observedRegistryIds)) throw new Error('registry identities differ from frozen shard 00');
          if (ledger.extraction_mode !== 'pilot') throw new Error('pilot mode absent');
          if (ledger.population.documents_processed !== Number(process.env.EXPECTED_DOCUMENTS)) throw new Error('pilot document denominator');
          if (ledger.population.registry_rows_represented !== Number(process.env.EXPECTED_REGISTRY_ROWS)) throw new Error('pilot registry-row denominator');
          if (ledger.population.population_complete !== false) throw new Error('pilot was promoted to population complete');
          if (ledger.rules.sha256 !== sha256(rulesBytes)) throw new Error('rules hash mismatch');
          for (const document of ledger.documents) {
            if (document.follow_up_authorized !== false) throw new Error('pilot authorized follow-up');
            if (document.ordered_relief_observed !== false) throw new Error('pilot inferred ordered relief');
            if (document.implementation_observed !== false) throw new Error('pilot inferred implementation');
            if (document.separate_public_compliance_receipt_observed !== false) throw new Error('pilot inferred compliance receipt');
            if (document.complete_restoration_observed !== false) throw new Error('pilot inferred restoration');
            if (document.remedy_timeliness_observed !== false) throw new Error('pilot inferred timeliness');
          }
          const archiveBytes = fs.readFileSync(`${work}/${process.env.ARCHIVE_NAME}`);
          if (sha256(archiveBytes) !== process.env.ARCHIVE_EXPECTED_SHA256) throw new Error('archive hash differs from A06 ledger');
          const hashBytes = fs.readFileSync(`${work}/${process.env.HASH_NAME}`);
          const receipt = {
            schema_version: 'ssc-rd04-a07-shard00-pilot-receipt@1',
            execution_id: 'SSC-RD04-SNAP-A07',
            issue: 741,
            workflow_run: Number(process.env.GITHUB_RUN_ID),
            workflow_head: process.env.GITHUB_SHA,
            source: {
              release_tag: process.env.RELEASE_TAG,
              release_id: Number(process.env.RELEASE_ID),
              release_asset_count: Number(process.env.RELEASE_ASSET_COUNT),
              release_ledger_path: 'data/intake/status-sovereignty-rd04-calfresh-decision-corpus-a06/release-assets.json',
              release_ledger_bytes: releaseLedgerBytes.length,
              release_ledger_sha256: sha256(releaseLedgerBytes),
              archive_name: process.env.ARCHIVE_NAME,
              archive_asset_id: Number(process.env.ARCHIVE_ID),
              archive_bytes: archiveBytes.length,
              archive_sha256: sha256(archiveBytes),
              archive_transport: process.env.ARCHIVE_TRANSPORT,
              checksum_asset_name: process.env.HASH_NAME,
              checksum_asset_id: Number(process.env.HASH_ID),
              checksum_bytes: hashBytes.length,
              checksum_sha256: sha256(hashBytes),
              checksum_transport: process.env.HASH_TRANSPORT
            },
            rules: {
              dictionary_version: ledger.rules.dictionary_version,
              exact_bytes: rulesBytes.length,
              sha256: sha256(rulesBytes),
              pattern_count: ledger.rules.pattern_count
            },
            denominator: {
              shard: '00',
              assignment: plan.assignment,
              documents: plan.counts.documents,
              registry_rows: plan.counts.registry_rows,
              document_identity_match: true,
              registry_identity_match: true
            },
            extraction: {
              ledger_bytes: ledgerBytes.length,
              ledger_sha256: sha256(ledgerBytes),
              candidate_documents: ledger.counts.candidate_documents,
              support_only_documents: ledger.counts.support_only_documents,
              negative_documents: ledger.counts.negative_documents,
              total_matches: ledger.counts.total_matches,
              field_match_counts: ledger.counts.field_match_counts,
              pattern_match_counts: ledger.counts.pattern_match_counts,
              population_complete: false
            },
            artifact: null,
            authority: ledger.authority,
            boundaries: {
              content_neutral_preassigned_shard: true,
              rule_change_authorized: false,
              follow_up_authorized: false,
              ordered_relief_observed: false,
              source_receipt_observed: false,
              implementation_observed: false,
              restoration_observed: false,
              remedy_timeliness_observed: false,
              graph_effect: 'none',
              publication_effect: 'none',
              adoption_effect: 'none'
            }
          };
          fs.writeFileSync(`${work}/receipt.json`, stable(receipt));
          console.log(JSON.stringify(receipt.extraction, null, 2));
          NODE
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-a07-shard00-extraction-pilot-v4
          path: |
            ${{ runner.temp }}/a07-shard00-pilot/ledger.json
            ${{ runner.temp }}/a07-shard00-pilot/receipt.json
            ${{ runner.temp }}/a07-shard00-pilot/ssc-rd04-a06-pdf-shard-00.tar.zst.sha256
            ${{ runner.temp }}/a07-shard00-pilot/asset-selection.env
          if-no-files-found: error
          retention-days: 90
      - name: Finalize and publish permanent pilot receipt
        id: publication
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          work="${RUNNER_TEMP}/a07-shard00-pilot"
          mkdir -p "$(dirname "$RECEIPT_PATH")"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const stable = (value) => `${JSON.stringify(value, null, 2)}\n`;
          const source = `${process.env.RUNNER_TEMP}/a07-shard00-pilot/receipt.json`;
          const receipt = JSON.parse(fs.readFileSync(source, 'utf8'));
          receipt.artifact = {
            id: Number(process.env.ARTIFACT_ID),
            name: 'ssc-rd04-a07-shard00-extraction-pilot-v4',
            url: process.env.ARTIFACT_URL,
            digest: process.env.ARTIFACT_DIGEST,
            retention_days: 90
          };
          fs.writeFileSync(process.env.RECEIPT_PATH, stable(receipt));
          NODE
          source_head="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RECEIPT_PATH"
          test "$(git diff --cached --name-only)" = "$RECEIPT_PATH"
          git commit -m 'Preserve SSC RD-04 A07 shard-00 pilot receipt'
          product_head="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$source_head"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$source_head" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
          echo "product_head=$product_head" >> "$GITHUB_OUTPUT"
      - name: Record terminal pilot state on issue 741
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          ASSET_OUTCOME: ${{ steps.assets.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          EXTRACTION_OUTCOME: ${{ steps.extraction.outcome }}
          RECONCILIATION_OUTCOME: ${{ steps.reconciliation.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          PRODUCT_HEAD: ${{ steps.publication.outputs.product_head }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE' > "${RUNNER_TEMP}/a07-shard00-report.md"
          import fs from 'node:fs';
          const receipt = fs.existsSync(process.env.RECEIPT_PATH)
            ? JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'))
            : null;
          console.log('## A07 content-neutral shard-00 extraction pilot v4');
          console.log('');
          console.log('```text');
          console.log(`workflow_run=${process.env.GITHUB_RUN_ID}`);
          console.log(`workflow_head=${process.env.GITHUB_SHA}`);
          console.log(`preflight=${process.env.PREFLIGHT_OUTCOME}`);
          console.log(`asset_binding=${process.env.ASSET_OUTCOME}`);
          console.log(`download=${process.env.DOWNLOAD_OUTCOME}`);
          console.log(`extraction=${process.env.EXTRACTION_OUTCOME}`);
          console.log(`reconciliation=${process.env.RECONCILIATION_OUTCOME}`);
          console.log(`artifact_upload=${process.env.UPLOAD_OUTCOME}`);
          console.log(`publication=${process.env.PUBLICATION_OUTCOME}`);
          console.log(`product_head=${process.env.PRODUCT_HEAD ?? ''}`);
          if (receipt) {
            console.log(`artifact_id=${receipt.artifact?.id ?? ''}`);
            console.log(`artifact_digest=${receipt.artifact?.digest ?? ''}`);
            console.log(`source_release_id=${receipt.source.release_id}`);
            console.log(`source_asset_id=${receipt.source.archive_asset_id}`);
            console.log(`source_archive_sha256=${receipt.source.archive_sha256}`);
            console.log(`archive_transport=${receipt.source.archive_transport}`);
            console.log(`rules_sha256=${receipt.rules.sha256}`);
            console.log(`documents=${receipt.denominator.documents}`);
            console.log(`registry_rows=${receipt.denominator.registry_rows}`);
            console.log(`candidate_documents=${receipt.extraction.candidate_documents}`);
            console.log(`support_only_documents=${receipt.extraction.support_only_documents}`);
            console.log(`negative_documents=${receipt.extraction.negative_documents}`);
            console.log(`total_matches=${receipt.extraction.total_matches}`);
            console.log(`ledger_sha256=${receipt.extraction.ledger_sha256}`);
            console.log(`population_complete=${receipt.extraction.population_complete}`);
            console.log(`follow_up_authorized=${receipt.boundaries.follow_up_authorized}`);
            console.log(`implementation_observed=${receipt.boundaries.implementation_observed}`);
            console.log(`restoration_observed=${receipt.boundaries.restoration_observed}`);
            console.log(`remedy_timeliness_observed=${receipt.boundaries.remedy_timeliness_observed}`);
          }
          console.log('graph_effect=none');
          console.log('publication_effect=none');
          console.log('adoption_effect=none');
          console.log('```');
          console.log('');
          console.log('This is one SHA-256-preassigned shard and remains population-incomplete. Candidate counts are extraction states only and authorize no case follow-up, compliance, implementation, restoration, or timeliness claim.');
          NODE
          gh issue comment 741 --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/a07-shard00-report.md"
