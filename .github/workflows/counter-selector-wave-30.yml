name: Counter-Selector Wave 30 public handoff controls

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-30.yml'
      - 'data/project/counter-selector-wave-30-*.json'
      - 'schemas/counter-selector-handoff-controls.schema.json'
      - 'docs/methods/counter-selector-public-handoff-controls.md'
      - 'docs/milestones/counter-selector-wave-30.md'
      - 'tools/build-counter-selector-wave-30.mjs'
      - 'tools/validate-counter-selector-wave-30.mjs'
      - 'test/counter-selector-wave-30.test.js'
      - 'reports/core-thesis/counter-selector-wave-30/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-30.yml'
      - 'data/project/counter-selector-wave-30-*.json'
      - 'schemas/counter-selector-handoff-controls.schema.json'
      - 'docs/methods/counter-selector-public-handoff-controls.md'
      - 'docs/milestones/counter-selector-wave-30.md'
      - 'tools/build-counter-selector-wave-30.mjs'
      - 'tools/validate-counter-selector-wave-30.mjs'
      - 'test/counter-selector-wave-30.test.js'
      - 'reports/core-thesis/counter-selector-wave-30/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 30 products
        run: node tools/build-counter-selector-wave-30.mjs
      - name: Validate handoff-control contract
        run: node tools/validate-counter-selector-wave-30.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-30.test.js
      - name: Require exact committed Wave 30 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-wave-30-handoff-registry.json \
            data/project/counter-selector-wave-30-release-manifest.json \
            reports/core-thesis/counter-selector-wave-30/data.json \
            reports/core-thesis/counter-selector-wave-30/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 30 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-30.mjs
          node tools/validate-counter-selector-wave-30.mjs
          node test/counter-selector-wave-30.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
