name: Counter-Selector Wave 19 cross-domain governance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-19.yml'
      - 'data/project/counter-selector-wave-19-cross-domain-governance.json'
      - 'data/project/counter-selector-cross-domain-transfer-registry.json'
      - 'data/project/counter-selector-wave-19-external-review-export-registry.json'
      - 'data/project/counter-selector-wave-19-release-manifest.json'
      - 'schemas/counter-selector-cross-domain-governance.schema.json'
      - 'docs/methods/counter-selector-cross-domain-governance.md'
      - 'docs/milestones/counter-selector-wave-19.md'
      - 'tools/build-counter-selector-wave-19.mjs'
      - 'tools/validate-counter-selector-wave-19.mjs'
      - 'test/counter-selector-wave-19.test.js'
      - 'reports/core-thesis/counter-selector-wave-19/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-19-cross-domain-governance'
    paths:
      - '.github/workflows/counter-selector-wave-19.yml'
      - 'data/project/counter-selector-wave-19-cross-domain-governance.json'
      - 'data/project/counter-selector-cross-domain-transfer-registry.json'
      - 'data/project/counter-selector-wave-19-external-review-export-registry.json'
      - 'data/project/counter-selector-wave-19-release-manifest.json'
      - 'schemas/counter-selector-cross-domain-governance.schema.json'
      - 'docs/methods/counter-selector-cross-domain-governance.md'
      - 'docs/milestones/counter-selector-wave-19.md'
      - 'tools/build-counter-selector-wave-19.mjs'
      - 'tools/validate-counter-selector-wave-19.mjs'
      - 'test/counter-selector-wave-19.test.js'
      - 'reports/core-thesis/counter-selector-wave-19/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 19 products
        run: node tools/build-counter-selector-wave-19.mjs
      - name: Validate cross-domain governance contract
        run: node tools/validate-counter-selector-wave-19.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-19.test.js
      - name: Require exact committed Wave 19 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-cross-domain-transfer-registry.json \
            data/project/counter-selector-wave-19-external-review-export-registry.json \
            data/project/counter-selector-wave-19-release-manifest.json \
            reports/core-thesis/counter-selector-wave-19/data.json \
            reports/core-thesis/counter-selector-wave-19/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 19 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-19.mjs
          node tools/validate-counter-selector-wave-19.mjs
          node test/counter-selector-wave-19.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
