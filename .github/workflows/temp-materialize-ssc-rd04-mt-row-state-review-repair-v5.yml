name: TEMP materialize Montana row-state review repair v5

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-ssc-rd04-mt-row-state-review-repair-v5.yml'

permissions:
  contents: write

env:
  SOURCE_PRODUCT: 85fad4f736a3639444edd2c522a67316dbade480
  SOURCE_CARRIER_BRANCH: agent/ssc-rd04-mt-row-state-review-repair-materializer-v1
  SOURCE_CARRIER_HEAD: 3d576b154fad26a1bd87ca6b70300183f97673ec
  SOURCE_CARRIER_PATH: .github/workflows/temp-materialize-ssc-rd04-mt-row-state-review-repair-v1.yml
  SOURCE_CARRIER_BLOB: cdbe6947307487a52a9f98f059cfaa7a05a2ecb4
  CANONICAL_PARENT: 0840358962621b0be3db6864ecec763327f35903
  TARGET_BRANCH: agent/ssc-rd04-mt-row-state-reconciliation-v2
  CARRIER_PATH: .github/workflows/temp-materialize-ssc-rd04-mt-row-state-review-repair-v5.yml
  OUT: /tmp/ssc-rd04-mt-row-state-review-repair-v1
  WRAPPER_OUT: /tmp/ssc-rd04-mt-row-state-review-repair-wrapper-v5
  PRODUCT_AUTHOR_NAME: github-actions[bot]
  PRODUCT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PRODUCT_AUTHOR_DATE: '2026-08-10T19:00:00+00:00'
  PRODUCT_COMMITTER_NAME: github-actions[bot]
  PRODUCT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PRODUCT_COMMITTER_DATE: '2026-08-10T19:00:00+00:00'
  PRODUCT_MESSAGE: Promote exact Montana derivative row-state reconciliation v2

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned validators
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Execute authenticated and indentation-repaired V1 materializer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$WRAPPER_OUT"
          mkdir -p "$WRAPPER_OUT"
          printf '%s\n' wrapper-bootstrap > "$WRAPPER_OUT/STAGE"
          printf '%s\n' 1 > "$WRAPPER_OUT/EXIT_CODE"
          fail() {
            local rc=$?
            trap - ERR
            printf '%s\n' "$rc" > "$WRAPPER_OUT/EXIT_CODE"
            if [ -f /tmp/source-carrier.yml ]; then cp /tmp/source-carrier.yml "$WRAPPER_OUT/source-carrier.yml"; fi
            if [ -f /tmp/materialize.sh ]; then cp /tmp/materialize.sh "$WRAPPER_OUT/materialize.sh"; fi
            if [ -f /tmp/patch-receipt.json ]; then cp /tmp/patch-receipt.json "$WRAPPER_OUT/patch-receipt.json"; fi
            if [ -f /tmp/materializer-console.log ]; then cp /tmp/materializer-console.log "$WRAPPER_OUT/materializer-console.log"; fi
            if [ -d "$OUT" ]; then mkdir -p "$WRAPPER_OUT/materializer-out"; cp -a "$OUT"/. "$WRAPPER_OUT/materializer-out"/ || true; fi
            exit "$rc"
          }
          trap fail ERR

          printf '%s\n' authenticate-wrapper > "$WRAPPER_OUT/STAGE"
          test "$(git show -s --format='%P' HEAD)" = "$CANONICAL_PARENT"
          test "$(git diff --name-only "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"
          git diff --check "$CANONICAL_PARENT" HEAD
          git fetch --no-tags --force origin \
            "+refs/heads/$SOURCE_CARRIER_BRANCH:refs/remotes/origin/source-carrier" \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/source-carrier)" = "$SOURCE_CARRIER_HEAD"
          test "$(git show -s --format='%P' "$SOURCE_CARRIER_HEAD")" = "$SOURCE_PRODUCT"
          test "$(git show -s --format='%P' "$SOURCE_PRODUCT")" = "$CANONICAL_PARENT"
          test "$(git rev-parse "$SOURCE_CARRIER_HEAD:$SOURCE_CARRIER_PATH")" = "$SOURCE_CARRIER_BLOB"
          git merge-base --is-ancestor "$CANONICAL_PARENT" refs/remotes/origin/main
          test -z "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
          git show "$SOURCE_CARRIER_HEAD:$SOURCE_CARRIER_PATH" > /tmp/source-carrier.yml

          printf '%s\n' extract-sealed-program > "$WRAPPER_OUT/STAGE"
          python - /tmp/source-carrier.yml /tmp/materialize.sh <<'PYEXTRACT'
          from pathlib import Path
          import sys

          source_path, output_path = map(Path, sys.argv[1:])
          text = source_path.read_text(encoding='utf-8')
          start = "      - name: Authenticate carrier and materialize repaired sole-parent product\n"
          end = "      - name: Preserve repair materialization receipt\n"
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit(
                  f'materializer marker denominator start={text.count(start)} end={text.count(end)}'
              )
          section = text.split(start, 1)[1].split(end, 1)[0]
          marker = "        run: |\n"
          if section.count(marker) != 1:
              raise SystemExit(f'run marker denominator {section.count(marker)}')
          raw = section.split(marker, 1)[1]
          body = []
          legacy_unindented = []
          for lineno, line in enumerate(raw.splitlines(), 1):
              if not line:
                  body.append('')
              elif line.startswith('          '):
                  body.append(line[10:])
              elif line == "'''":
                  legacy_unindented.append((lineno, line))
                  body.append(line)
              else:
                  raise SystemExit(f'run block indentation mismatch line {lineno}: {line!r}')
          if legacy_unindented != [(46, "'''")]:
              raise SystemExit(f'legacy unindented denominator mismatch: {legacy_unindented!r}')
          program = '\n'.join(body) + '\n'
          if 'set -Eeuo pipefail' not in program or 'qualified_repaired_product_published' not in program:
              raise SystemExit('extracted program authentication markers absent')
          output_path.write_text(program, encoding='utf-8')
          PYEXTRACT

          printf '%s\n' repair-extracted-program > "$WRAPPER_OUT/STAGE"
          python - /tmp/materialize.sh /tmp/patch-receipt.json <<'PYPATCH'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import sys

          path, receipt_path = map(Path, sys.argv[1:])
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          bad = [
              "checks='''          test \"$(git show -s --format='%an' \"$PRODUCT_COMMIT\")\" = 'github-actions[bot]'",
              "test \"$(git show -s --format='%ae' \"$PRODUCT_COMMIT\")\" = '41898282+github-actions[bot]@users.noreply.github.com'",
              "test \"$(git show -s --format='%aI' \"$PRODUCT_COMMIT\")\" = '2026-08-10T19:00:00+00:00'",
              "test \"$(git show -s --format='%cn' \"$PRODUCT_COMMIT\")\" = 'github-actions[bot]'",
              "test \"$(git show -s --format='%ce' \"$PRODUCT_COMMIT\")\" = '41898282+github-actions[bot]@users.noreply.github.com'",
              "test \"$(git show -s --format='%cI' \"$PRODUCT_COMMIT\")\" = '2026-08-10T19:00:00+00:00'",
              "test \"$(git show -s --format='%B' \"$PRODUCT_COMMIT\")\" = 'Promote exact Montana derivative row-state reconciliation v2'",
              "'''",
          ]
          hits = [i for i in range(len(lines) - len(bad) + 1) if lines[i:i + len(bad)] == bad]
          if len(hits) != 1:
              raise SystemExit(f'faulty commit-check block denominator {len(hits)}')
          commit_checks = [
              "          test \"$(git show -s --format='%an' \"$PRODUCT_COMMIT\")\" = 'github-actions[bot]'",
              "          test \"$(git show -s --format='%ae' \"$PRODUCT_COMMIT\")\" = '41898282+github-actions[bot]@users.noreply.github.com'",
              "          test \"$(git show -s --format='%aI' \"$PRODUCT_COMMIT\")\" = '2026-08-10T19:00:00+00:00'",
              "          test \"$(git show -s --format='%cn' \"$PRODUCT_COMMIT\")\" = 'github-actions[bot]'",
              "          test \"$(git show -s --format='%ce' \"$PRODUCT_COMMIT\")\" = '41898282+github-actions[bot]@users.noreply.github.com'",
              "          test \"$(git show -s --format='%cI' \"$PRODUCT_COMMIT\")\" = '2026-08-10T19:00:00+00:00'",
              "          test \"$(git show -s --format='%B' \"$PRODUCT_COMMIT\")\" = 'Promote exact Montana derivative row-state reconciliation v2'",
          ]
          replacement = ["checks='\\n'.join(" + repr(commit_checks) + ") + '\\n'"]
          start = hits[0]
          lines[start:start + len(bad)] = replacement
          source = '\n'.join(lines) + '\n'

          rebinds = {
              'test "$(git rev-parse HEAD^)" = "$SOURCE_PRODUCT"':
                  'test "$(git rev-parse HEAD^)" = "$CANONICAL_PARENT"',
              'test "$(git diff --name-only "$SOURCE_PRODUCT" HEAD)" = "$CARRIER_PATH"':
                  'test "$(git diff --name-only "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"',
              'test "$(git diff --name-only --diff-filter=A "$SOURCE_PRODUCT" HEAD)" = "$CARRIER_PATH"':
                  'test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"',
              'test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$SOURCE_PRODUCT" HEAD)"':
                  'test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_PARENT" HEAD)"',
              'git diff --check "$SOURCE_PRODUCT" HEAD':
                  'git diff --check "$CANONICAL_PARENT" HEAD',
          }
          counts = {}
          for old, new in rebinds.items():
              count = source.count(old)
              counts[old] = count
              if count != 1:
                  raise SystemExit(f'rebind denominator for {old!r}: {count}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          receipt = {
              'schema_version': 'ssc-rd04-mt-row-state-review-repair-program-patch@1',
              'state': 'exact_faulty_check_indentation_repaired_and_carrier_preflight_rebound',
              'faulty_check_blocks_replaced': 1,
              'commit_checks_emitted': len(commit_checks),
              'rebind_denominators': counts,
              'patched_program_bytes': len(source.encode('utf-8')),
              'patched_program_sha256': hashlib.sha256(source.encode('utf-8')).hexdigest(),
          }
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PYPATCH
          bash -n /tmp/materialize.sh

          printf '%s\n' execute-sealed-materializer > "$WRAPPER_OUT/STAGE"
          set +e
          bash /tmp/materialize.sh > /tmp/materializer-console.log 2>&1
          rc=$?
          set -e
          cp /tmp/materializer-console.log "$WRAPPER_OUT/materializer-console.log"
          cp /tmp/materialize.sh "$WRAPPER_OUT/materialize.sh"
          cp /tmp/patch-receipt.json "$WRAPPER_OUT/patch-receipt.json"
          if [ -d "$OUT" ]; then mkdir -p "$WRAPPER_OUT/materializer-out"; cp -a "$OUT"/. "$WRAPPER_OUT/materializer-out"/ || true; fi
          cat /tmp/materializer-console.log
          test "$rc" = 0

          printf '%s\n' complete > "$WRAPPER_OUT/STAGE"
          printf '%s\n' 0 > "$WRAPPER_OUT/EXIT_CODE"
          trap - ERR
      - name: Preserve repair materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-review-repair-materializer-v5
          path: |
            ${{ env.OUT }}
            ${{ env.WRAPPER_OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
