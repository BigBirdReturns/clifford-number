name: Temporary capture K0 Wave 03 materializer error

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-capture-k0-wave03-materializer.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and expand carrier
        run: |
          base64 -d .github/tmp/k0-wave03-materializer.b64 > /tmp/k0-wave03-materializer.tgz
          test "$(sha256sum /tmp/k0-wave03-materializer.tgz | awk '{print $1}')" = "51b43d6772b0be8c0312e3fd24de339d5d230711b852f4dacb863364a8fe7b33"
          mkdir -p /tmp/k0-wave03-materializer
          tar -xzf /tmp/k0-wave03-materializer.tgz -C /tmp/k0-wave03-materializer
      - name: Capture materializer output
        id: materialize
        continue-on-error: true
        run: |
          set +e
          node /tmp/k0-wave03-materializer/materialize-k0-role-neutral-wave-03.mjs > /tmp/k0-wave03-materializer.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/k0-wave03-materializer.status
          cat /tmp/k0-wave03-materializer.log
          exit "$status"
      - name: Upload materializer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k0-wave03-materializer-diagnostic
          path: |
            /tmp/k0-wave03-materializer.log
            /tmp/k0-wave03-materializer.status
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed outcome
        if: always()
        run: test "$(cat /tmp/k0-wave03-materializer.status)" = "0"
