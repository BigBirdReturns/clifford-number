name: M-05 Intel bilateral-exception acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-pre-eligibility-realization-monitor.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-date-gate-monitor.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-five-domain-implementation-frontier.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-syri-subject-access-public-record-acquisition.json'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.test.js'
      - '.github/workflows/m05-intel-bilateral-exception-acquisition.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-pre-eligibility-realization-monitor.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-date-gate-monitor.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-five-domain-implementation-frontier.json'
      - 'data/project/m05-answerable-power-sprint-03-leg-07-syri-subject-access-public-record-acquisition.json'
      - 'tools/validate-m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.mjs'
      - 'test/m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.test.js'
      - '.github/workflows/m05-intel-bilateral-exception-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m05-intel-bilateral-exception-acquisition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Intel bilateral-exception acquisition
        run: |
          node --check tools/validate-m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.mjs
          node --check test/m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.test.js
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic focused state
        run: |
          git restore --staged --worktree .
          node tools/validate-m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.mjs
          node test/m05-answerable-power-sprint-03-leg-07-intel-bilateral-exception-acquisition.test.js
          git diff --exit-code
