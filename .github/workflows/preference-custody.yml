name: Preference custody laboratory floor

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-custody.mjs'
      - 'tools/lib/preference-equifinality.mjs'
      - 'tools/lib/preference-attrition.mjs'
      - 'tools/lib/preference-subgroup.mjs'
      - 'tools/lib/preference-custody-manifest.mjs'
      - 'tools/compile-performative-synthetic-constituency.mjs'
      - 'tools/compile-preference-custody.mjs'
      - 'tools/compile-preference-equifinality.mjs'
      - 'tools/compile-preference-attrition.mjs'
      - 'tools/compile-preference-subgroup.mjs'
      - 'tools/compile-preference-custody-manifest.mjs'
      - 'tools/validate-performative-synthetic-constituency.mjs'
      - 'tools/validate-preference-custody.mjs'
      - 'tools/validate-preference-equifinality.mjs'
      - 'tools/validate-preference-attrition.mjs'
      - 'tools/validate-preference-subgroup.mjs'
      - 'tools/validate-preference-custody-manifest.mjs'
      - 'test/performative-synthetic-constituency.test.js'
      - 'test/preference-custody.test.js'
      - 'test/preference-equifinality.test.js'
      - 'test/preference-attrition.test.js'
      - 'test/preference-subgroup.test.js'
      - 'test/preference-custody-manifest.test.js'
      - 'docs/preference-custody-*.md'
      - '.github/workflows/preference-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile deterministic preference-custody controls and floor
        run: |
          node tools/compile-performative-synthetic-constituency.mjs
          node tools/compile-preference-custody.mjs
          node tools/compile-preference-equifinality.mjs
          node tools/compile-preference-attrition.mjs
          node tools/compile-preference-subgroup.mjs
          node tools/compile-preference-custody-manifest.mjs
      - name: Validate custody, identification, interpretation, and authority boundaries
        run: |
          node tools/validate-performative-synthetic-constituency.mjs
          node tools/validate-preference-custody.mjs
          node tools/validate-preference-equifinality.mjs
          node tools/validate-preference-attrition.mjs
          node tools/validate-preference-subgroup.mjs
          node tools/validate-preference-custody-manifest.mjs
      - name: Exercise positive, tamper, and laundering fixtures
        run: |
          node test/performative-synthetic-constituency.test.js
          node test/preference-custody.test.js
          node test/preference-equifinality.test.js
          node test/preference-attrition.test.js
          node test/preference-subgroup.test.js
          node test/preference-custody-manifest.test.js
      - name: Preserve deterministic preference-custody projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v3
          path: |
            build/research/performative-synthetic-constituency-fixture.json
            build/research/performative-synthetic-constituency-fixture.md
            build/research/preference-custody-option-set-fixture.json
            build/research/preference-custody-option-set-fixture.md
            build/research/preference-observational-equivalence.json
            build/research/preference-observational-equivalence.md
            build/research/preference-attrition-refusal.json
            build/research/preference-attrition-refusal.md
            build/research/preference-subgroup-capacity.json
            build/research/preference-subgroup-capacity.md
            build/research/preference-custody-laboratory-floor.json
            build/research/preference-custody-laboratory-floor.md
          if-no-files-found: error
