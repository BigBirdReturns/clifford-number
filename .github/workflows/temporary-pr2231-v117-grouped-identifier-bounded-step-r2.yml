name: Temporary PR2231 V117 grouped-identifier and bounded-step qualifier R2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/temporary-pr2231-v117-grouped-identifier-bounded-step-r2.yml

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: pr2231-v117-grouped-identifier-bounded-step-r2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v117-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      PRODUCT_PR: '2231'
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      PRODUCT_SHA: 0c0ec19938e76d83d646c79d02bea9a724e6773b
      PRODUCT_TREE: 326186e534735e8fc108c3bb7cab115d5db08dce
      PRODUCT_LIBRARY: 123b88403265fa4193a44a97b27aebc7661c1528
      PRODUCT_TEST: a71e670bbf85a399e02a184e0a8fce19d127bfaf
      MAIN_SHA: 771a64b6b467748d2f4df667b5f78e76f9432d69
      MAIN_TREE: 86c91755f16245168ddb230d53e5b9920af5342c
      REVIEW_ID: '5072486871'
      GROUPED_COMMENT_ID: '3899391559'
      COMPLEXITY_COMMENT_ID: '3899391565'
      WORKTREE: /tmp/pr2231-v117-product-r2
      MAIN_WORKTREE: /tmp/pr2231-v117-main-r2
      RECEIPTS: /tmp/pr2231-v117-qualification-r2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize and execute exact V117 qualifier R2
        shell: bash
        run: |
          set -Eeuo pipefail
          wrapper=/tmp/pr2231-v117-wrapper-r2
          rm -rf "$wrapper"
          mkdir -p "$wrapper/parts"
          inner_status=missing
          on_exit() {
            rc=$?
            mkdir -p "$wrapper"
            printf '%s\n' \
              'controller_envelope=v117-grouped-identifier-bounded-step-r2' \
              "outer_status=$rc" \
              "inner_status=$inner_status" \
              > "$wrapper/wrapper-status.env"
          }
          trap on_exit EXIT
          specs=(
            '2c272933f97d52977d0a8b240a8358c988220ffc:1800:209b9e08255b056ec43b0cf7be910def487a50a2e646c5a8bc869b7e73939bda'
            'b130c2256d999e22778beabf16f7ecbdcdb21dc5:1800:a716daec728a3393584acef89658f5e185aa1ef4d3a5e63243ed4b90dc47207f'
            'b5a2fe8bf2c6f5a9473d61c8534c4d6efc1fe394:1312:daad870566d436bde5359d4bb1a71b478f3e2bf1e29235af32e60e986f63021e'
          )
          : > "$wrapper/qualifier.sh.xz"
          for index in "${!specs[@]}"; do
            IFS=: read -r blob size digest <<< "${specs[$index]}"
            json="$wrapper/parts/$index.json"
            part="$wrapper/parts/$index.bin"
            gh api "repos/$REPO/git/blobs/$blob" > "$json"
            jq -e --arg sha "$blob" --argjson size "$size" \
              '.sha == $sha and .size == $size and .encoding == "base64"' "$json" >/dev/null
            jq -r '.content' "$json" | tr -d '\n' | base64 -d > "$part"
            [[ "$(git hash-object "$part")" == "$blob" ]]
            [[ "$(stat -c %s "$part")" == "$size" ]]
            printf '%s  %s\n' "$digest" "$part" | sha256sum -c -
            cat "$part" >> "$wrapper/qualifier.sh.xz"
          done
          [[ "$(stat -c %s "$wrapper/qualifier.sh.xz")" == 4912 ]]
          printf '%s  %s\n' \
            '5fadf9869f8f8234fca0fe6193163b77263298372952e040bba9b14d40046e4b' \
            "$wrapper/qualifier.sh.xz" | sha256sum -c -
          xz -t "$wrapper/qualifier.sh.xz"
          xz -dc "$wrapper/qualifier.sh.xz" > "$wrapper/qualifier.sh"
          [[ "$(stat -c %s "$wrapper/qualifier.sh")" == 19671 ]]
          printf '%s  %s\n' \
            'fe8df90fbb7eccedbe3a51ff5f9958731046054734e2fafa2600dafbc6af8ca3' \
            "$wrapper/qualifier.sh" | sha256sum -c -
          bash -n "$wrapper/qualifier.sh"
          set +e
          bash "$wrapper/qualifier.sh"
          inner_status=$?
          set -e
          exit "$inner_status"

      - name: Emit controller receipts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          wrapper=/tmp/pr2231-v117-wrapper-r2
          mkdir -p "$wrapper"
          find "$wrapper" -type f -printf '%P\t%s\n' | sort > "$wrapper/artifact-manifest.txt"
          {
            printf '%s\n' '### PR2231 V117 grouped-identifier and bounded-step qualifier R2'
            for receipt in wrapper-status.env artifact-manifest.txt; do
              printf '\n#### %s\n\n```text\n' "$receipt"
              [[ ! -f "$wrapper/$receipt" ]] || tail -n 500 "$wrapper/$receipt"
              printf '%s\n' '```'
            done
            for receipt in predecessor.json direct-v117.json qualification-terminal.txt summary.json candidate-sha256.txt product-post-release-status.txt main-post-release-status.txt; do
              printf '\n#### qualification/%s\n\n```text\n' "$receipt"
              [[ ! -f "$RECEIPTS/$receipt" ]] || tail -n 500 "$RECEIPTS/$receipt"
              printf '%s\n' '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-grouped-identifier-bounded-step-v117-r2
          path: |
            /tmp/pr2231-v117-wrapper-r2
            /tmp/pr2231-v117-qualification-r2
          retention-days: 90
