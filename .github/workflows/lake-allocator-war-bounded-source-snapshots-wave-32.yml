name: Allocator-war bounded source snapshots Wave 32

on:
  pull_request:
    branches:
      - agent/lake-allocator-war-wave-21
    paths:
      - 'data/project/lake-allocator-war-bounded-source-snapshots-wave-32-policy.json'
      - 'data/project/lake-allocator-war-bounded-source-snapshots-wave-32-plan.json'
      - 'tools/acquire-lake-allocator-war-bounded-source-snapshots-wave-32.mjs'
      - 'tools/build-lake-allocator-war-bounded-source-snapshots-wave-32.mjs'
      - 'tools/validate-lake-allocator-war-bounded-source-snapshots-wave-32.mjs'
      - 'test/lake-allocator-war-bounded-source-snapshots-wave-32.test.js'
      - 'docs/methods/lake-allocator-war-bounded-source-snapshots-wave-32.md'
      - 'docs/milestones/lake-allocator-war-bounded-source-snapshots-wave-32.md'
      - 'build/lake-actions/allocator-war-bounded-source-snapshots-wave-32.json'
      - 'reports/lake-allocator-war-bounded-source-snapshots-wave-32.md'
      - 'data/acquisition/lake-allocator-war-wave-32/**'
      - 'data/project/lake-allocator-war-wave-21-policy.json'
      - 'data/project/lake-index-policy.json'
      - 'data/project/lake-basin-registry.json'
      - 'tools/install-lake-allocator-war-wave-21.mjs'
      - 'tools/validate-lake-allocator-war-wave-21.mjs'
      - 'BUILD-INSTRUCTIONS.md'
      - 'README.md'
      - 'package.json'
      - 'build/lake-index/**'
      - 'reports/lake-basin-index.md'

permissions:
  contents: read

concurrency:
  group: lake-allocator-war-bounded-source-snapshots-wave-32-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source-only Wave 32 surface
        if: ${{ hashFiles('build/lake-actions/allocator-war-bounded-source-snapshots-wave-32.json') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/acquire-lake-allocator-war-bounded-source-snapshots-wave-32.mjs
          node --check tools/build-lake-allocator-war-bounded-source-snapshots-wave-32.mjs
          node --check tools/validate-lake-allocator-war-bounded-source-snapshots-wave-32.mjs
          node --check test/lake-allocator-war-bounded-source-snapshots-wave-32.test.js
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('data/project/lake-allocator-war-bounded-source-snapshots-wave-32-policy.json', 'utf8'));
          const s = JSON.parse(fs.readFileSync('data/project/lake-allocator-war-bounded-source-snapshots-wave-32-plan.json', 'utf8'));
          if (p.expected_counts.source_tasks !== 38) throw new Error('Wave 32 task denominator drift');
          if (s.snapshot_specs.length !== 19) throw new Error('Wave 32 snapshot denominator drift');
          if (s.snapshot_specs.filter(row => row.capture_mode === 'public_http').length !== 15) throw new Error('Wave 32 public request denominator drift');
          if (s.snapshot_specs.filter(row => row.capture_mode === 'credential_boundary').length !== 4) throw new Error('Wave 32 credential denominator drift');
          if (s.required_success_snapshot_refs.length !== 7) throw new Error('Wave 32 positive-control denominator drift');
          NODE

      - name: Validate sealed Wave 32 snapshots
        if: ${{ hashFiles('build/lake-actions/allocator-war-bounded-source-snapshots-wave-32.json') != '' }}
        run: node tools/validate-lake-allocator-war-bounded-source-snapshots-wave-32.mjs

      - name: Run Wave 32 adversarial mutations
        if: ${{ hashFiles('build/lake-actions/allocator-war-bounded-source-snapshots-wave-32.json') != '' }}
        run: node test/lake-allocator-war-bounded-source-snapshots-wave-32.test.js

      - name: Run complete repository release gate
        if: ${{ hashFiles('build/lake-actions/allocator-war-bounded-source-snapshots-wave-32.json') != '' }}
        run: npm run release:check

      - name: Restore and validate committed lake epoch
        if: ${{ hashFiles('build/lake-actions/allocator-war-bounded-source-snapshots-wave-32.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree .
          git clean -fd
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-residual-frontier-wave-17.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node tools/validate-lake-generator-contracts-wave-19.mjs
          node tools/validate-lake-receipt-custody-wave-20.mjs
          node tools/validate-lake-allocator-war-wave-21.mjs
          node tools/validate-lake-allocator-war-estate-execution-wave-22.mjs
          node tools/validate-lake-allocator-war-lead-acquisition-wave-23.mjs
          node tools/validate-lake-allocator-war-lead-execution-wave-24.mjs
          node tools/validate-lake-allocator-war-denominator-closure-wave-25.mjs
          node tools/validate-lake-allocator-war-targeted-closure-wave-26.mjs
          node tools/validate-lake-allocator-war-wave26-source-custody-repair.mjs
          node tools/validate-lake-allocator-war-public-interest-downstream-wave-27.mjs
          node tools/validate-lake-allocator-war-public-interest-implementation-wave-28.mjs
          node tools/validate-lake-allocator-war-public-interest-execution-wave-29.mjs
          node tools/validate-lake-allocator-war-gap-fanout-wave-30.mjs
          node tools/validate-lake-allocator-war-public-route-execution-wave-31.mjs
          node tools/validate-lake-allocator-war-bounded-source-snapshots-wave-32.mjs
          git diff --check
          test -z "$(git status --porcelain)"
