name: Preference custody acquisition request

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/acquisition/**'
      - 'docs/requests/newsuk-times-exploraition-nucleus-panel-protocol-request.md'
      - 'tools/lib/preference-acquisition-request.mjs'
      - 'tools/compile-preference-acquisition-request.mjs'
      - 'tools/validate-preference-acquisition-request.mjs'
      - 'test/preference-acquisition-request.test.js'
      - '.github/workflows/preference-acquisition-request.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile prepared acquisition packet
        run: node tools/compile-preference-acquisition-request.mjs
      - name: Validate contact and interpretation boundaries
        run: node tools/validate-preference-acquisition-request.mjs
      - name: Exercise authority, null-state, and tamper fixtures
        run: node test/preference-acquisition-request.test.js
      - name: Preserve deterministic acquisition projections
        uses: actions/upload-artifact@v4
        with:
          name: newsuk-matched-method-acquisition-request
          path: |
            build/research/preference-acquisition/newsuk-matched-method-request.json
            build/research/preference-acquisition/newsuk-matched-method-request.md
          if-no-files-found: error
