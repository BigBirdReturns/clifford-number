name: Materialize Counter-Selector Wave 12 Batch 05 acquisition

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-12.yml'
      - '.github/materializers/counter-selector-wave-12/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-12-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-12-b05-acquisition

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 12 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-12/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-12.tar.gz
          echo 'aba03c064ca3f57075c2b497cd4b275fe8e6d3600664cd967a433098044ba641  /tmp/counter-selector-wave-12.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-12.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-12

      - name: Build, validate, and attack Batch 05 acquisition
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-12.mjs
          node tools/validate-counter-selector-wave-12.mjs
          node test/counter-selector-wave-12.test.js

      - name: Commit exact permanent Wave 12 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-12/payload-000 \
            .github/materializers/counter-selector-wave-12/payload-001 \
            .github/materializers/counter-selector-wave-12/payload-002 \
            .github/materializers/counter-selector-wave-12/payload-003 \
            .github/materializers/counter-selector-wave-12/payload-004 \
            .github/materializers/counter-selector-wave-12/payload-005 \
            .github/materializers/counter-selector-wave-12/payload-006 \
            .github/materializers/counter-selector-wave-12/payload-007 \
            .github/materializers/counter-selector-wave-12/payload-008 \
            data/project/counter-selector-artifact-acquisition-b05-registry.json \
            data/project/counter-selector-blind-packet-registry-b05.json \
            data/project/counter-selector-wave-12-batch-05.json \
            data/project/counter-selector-wave-12-release-manifest.json \
            data/project/counter-selector-wave-12-source-registry.json \
            docs/methods/counter-selector-artifact-acquisition-b05.md \
            docs/milestones/counter-selector-wave-12.md \
            reports/core-thesis/counter-selector-wave-12/data.json \
            reports/core-thesis/counter-selector-wave-12/index.html \
            schemas/counter-selector-artifact-acquisition-b05.schema.json \
            test/counter-selector-wave-12.test.js \
            tools/build-counter-selector-wave-12.mjs \
            tools/validate-counter-selector-wave-12.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Acquire Counter-Selector Wave 12 Batch 05 artifacts'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 12 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-12.mjs
          node tools/validate-counter-selector-wave-12.mjs
          node test/counter-selector-wave-12.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent Wave 12 head
        run: git push origin HEAD:agent/counter-selector-wave-12-b05-acquisition
