name: Visual aperture scale budgets

on:
  pull_request:
    paths:
      - 'src/visual-aperture-core.mjs'
      - 'src/visual-aperture-part-*.js'
      - 'src/visual-aperture*.css'
      - 'tools/visual-aperture-scale-fixture.mjs'
      - 'tools/measure-visual-aperture-scale.mjs'
      - 'tools/measure-visual-aperture-browser.cjs'
      - 'tools/measure-visual-aperture-route-browser.cjs'
      - 'tools/serve-static.mjs'
      - 'test/visual-aperture-scale.test.js'
      - 'test/visual-aperture-windowing.test.js'
      - 'test/visual-aperture-bounded-contract.test.js'
      - 'docs/visual-aperture-scale-baseline.md'
      - '.github/workflows/visual-aperture-scale.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile current public artifacts
        run: npm run compile

      - name: Pin deterministic fixture and windowing contracts
        run: |
          node test/visual-aperture-scale.test.js
          node test/visual-aperture-windowing.test.js
          node test/visual-aperture-bounded-contract.test.js

      - name: Measure pure projection costs
        run: node tools/measure-visual-aperture-scale.mjs

      - name: Install Chromium measurement runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start the public application
        run: |
          node tools/serve-static.mjs 8080 > /tmp/clifford-scale-server.log 2>&1 &
          echo $! > /tmp/clifford-scale-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clifford-scale-server.log
          exit 1

      - name: Enforce overview, DOM, interaction, mobile, and motion budgets
        run: |
          node --check tools/measure-visual-aperture-browser.cjs
          timeout 300s node tools/measure-visual-aperture-browser.cjs

      - name: Enforce the complete-path route-window budget
        run: |
          node --check tools/measure-visual-aperture-route-browser.cjs
          timeout 300s node tools/measure-visual-aperture-route-browser.cjs

      - name: Preserve scale-budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-aperture-scale-budgets
          path: |
            build/metrics/visual-aperture-scale.json
            build/metrics/visual-aperture-scale.md
            build/metrics/visual-aperture-browser.json
            build/metrics/visual-aperture-browser.md
            build/metrics/visual-aperture-route-browser.json
            build/metrics/visual-aperture-route-browser.md
            build/metrics/*.png
            /tmp/clifford-scale-server.log
          if-no-files-found: error
