name: M-04D adversarial triage ledger

on:
  pull_request:
    paths:
      - 'data/intake/m04d-fog-resolution-wave-*.json'
      - 'data/project/m04d-adversarial-triage-ledger.json'
      - 'docs/milestones/m04d-adversarial-triage-adjudication.md'
      - 'test/m04d-adversarial-triage-ledger.test.js'
      - '.github/workflows/m04d-adversarial-triage-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'data/intake/m04d-fog-resolution-wave-*.json'
      - 'data/project/m04d-adversarial-triage-ledger.json'
      - 'docs/milestones/m04d-adversarial-triage-adjudication.md'
      - 'test/m04d-adversarial-triage-ledger.test.js'
      - '.github/workflows/m04d-adversarial-triage-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile all fog-resolution waves and dispositions
        run: node test/m04d-adversarial-triage-ledger.test.js
      - name: Run complete repository release gate
        run: npm run release:check
