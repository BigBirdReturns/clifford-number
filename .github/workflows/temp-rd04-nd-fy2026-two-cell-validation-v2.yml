name: TEMP validate RD-04 North Dakota FY2026 two-cell candidates v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/ssc-rd04-nd-fy2026-two-cell-validation-base-v2
    paths:
      - '.tmp/rd04-nd-fy2026-two-cell-validation-v2/trigger.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: temp-rd04-nd-fy2026-two-cell-validation-v2
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'agent/ssc-rd04-nd-fy2026-two-cell-validation-base-v2' &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-nd-fy2026-two-cell-validation-trigger-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CURRENT_PARENT: 5be5fc4d15391b99bb29226fdd16e408be559507
      CANDIDATE_PARENT: cffe670fef5c006c7e963421d9fd18c29ed40fba
      MANIFEST_REPAIR_HEAD: 892cdff34ade4ce6a9bb1d9ba30e8e81b41acea7
      CONTROLLER_COMMIT: 2082a3e907a330b568b184ae7de264359ac36301
      MATRIX_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-followup-one-cell-promotion/promoted-partial-field-matrix.json
      MATRIX_BLOB: 19357f8214ab2710bc5e75b3fae8c7fb09ff1654
      TARGET_CELL_SHA256: cbaabfa791f02aa4f17bc1b5b31e28775368b125a4b658cb216c22cd90a26dfe
      ROW_STATE_CELL_SHA256: 6a4c7d204c6c99a89f3c121065860806668c5da850f44c67fe42b4dc84b1b5c3
      ARCHIVE_PREFIX: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication
      ARCHIVE_MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-nd-fy2026-mi-nm-request-archive-adjudication/product-manifest.json
      ARCHIVE_MANIFEST_BLOB: a5036ec6ca07399d3ae67ad6849fe887c804502a
      ARCHIVE_PAYLOAD_SHA256: 69a49733a9c20fc3b87c4b45ebbe1f1d2137e9e3de97b48fd68c4442de471032
      ARCHIVE_DISPOSITION_BLOB: 942ac9fd34ee0857aa66b941c579487b01dd9d70
      ARCHIVE_CELL_CUSTODY_BLOB: 04e405425082714c5f6b4ac83de9351a41a27b38
      WORKFLOW_PATH: .github/workflows/temp-rd04-nd-fy2026-two-cell-validation-v2.yml
      TRIGGER_PATH: .tmp/rd04-nd-fy2026-two-cell-validation-v2/trigger.json
      BASE_BRANCH: agent/ssc-rd04-nd-fy2026-two-cell-validation-base-v2
      HEAD_BRANCH: agent/ssc-rd04-nd-fy2026-two-cell-validation-trigger-v2
      CANDIDATE_ARTIFACT_ID: '9043309756'
      CANDIDATE_ARTIFACT_BYTES: '14782'
      CANDIDATE_ARTIFACT_SHA256: ef3346192ce13eade5b4f66b90c1eb560290a1d6a74edae6a29a4823555f336e
      CANDIDATE_RECEIPT_SHA256: ee228a61eae704a65fd8e3c2fc9fb0de91158123cf721a1841bee98b927bf186
      SOURCE_ADJUDICATION_SHA256: b386fe3acee2e0c4ae441c987b05105fbc7e9ea33130f7ad8fbf9064ce443048
      FIELD_CANDIDATE_SHA256: d456cafab44e26cc4660b955a7041f6722616d746633858a3f17bbde3340d19a
      ROW_CANDIDATE_SHA256: 02f9fceaec25649f4a160fa97ccf8e328274413fd43fde1fe1465fe5d50fd69f
      CANDIDATE_CELL_PROOF_SHA256: 4b9ab6dee1795defb63e55c4bf9a8616a11c33413264684aaaa7467848323af8
      TARGET_CANDIDATE_ID: RD04-ND-FY2026-FIXED-PROTOCOL-TARGET-CELL-CANDIDATE-V2
      ROW_CANDIDATE_ID: RD04-ND-FY2026-FIXED-PROTOCOL-ROW-STATE-CANDIDATE-V2
      ARCHIVE_SOURCE_ID: RD04-SOURCE-ND-FY2026-MI-NM-ARCHIVE-CENSUS-V1
      REFRESH_SOURCE_ID: RD04-SOURCE-ND-FY2026-CURRENT-INDEX-REFRESH-2026-08-09-V1
      ROW_SOURCE_ID: RD04-ND-FY2026-FIXED-PROTOCOL-ROW-STATE-V1
      CONTROLLER_PREFIX: .tmp/rd04-nd-fy2026-two-cell-validation-v2/controller.sh
      CONTROLLER_FRAGMENT_COUNT: '20'
      CONTROLLER_BYTES: '28705'
      CONTROLLER_SHA256: f5c2287f3c98b1d34befe99c35305e204832d9239a15e457fdb946e10cfe2f1d
      CONTROLLER_DIR: /tmp/ssc-rd04-nd-fy2026-two-cell-validation-v2-controller
      OUT: /tmp/ssc-rd04-nd-fy2026-two-cell-validation-v2
      WORK: /tmp/ssc-rd04-nd-fy2026-two-cell-validation-v2-work

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct exact ordinary Git validator and execute request-free validation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$CONTROLLER_DIR"
          mkdir -p "$CONTROLLER_DIR"
          CONTROLLER="$CONTROLLER_DIR/controller.sh"
          CUSTODY="$CONTROLLER_DIR/controller-custody.json"
          : > "$CONTROLLER"

          expected_sha=(
            0f05ecabdfc018ae7addb1f5a39d1adeb67eef5f0af74252320a115ec50f18bc
            d2f265c3625b23779d91418be8e5b93ee00399eb5f008726c73eb3b05d42e5f5
            68cd2143dd81836168c0cb20b27d7cb06a7281a3c89b176dc2722952bc30ac67
            f775b40df8ddccd01997f0d9fd04a3097e07c4513c4d98385c36aa613d77c6ad
            4401e99018aa199d8c0e28cfd91a4ffe7e154c34ca92b30dae34aa6834deb6e6
            7726ec799b81c0d242fe073a6f767c386c0bc4ed872e811e02f88b54f5ee09cd
            faf86856875fb068e5768d9769d93b1987c5ddf109a467420e9fd716ad6a3ba5
            4ffef431fffc5061add406ff2b4c8a6ca0ca7ffa108e33da0408c71dcf9b80c3
            6bd309250343c9149149fbb28591b73351e2301eb0ca5e9f1f424d2fb51aff4b
            8f4d6fa32afea74282f285663ca20bde0bf3b5562ca217992c3d4f1f53ba0d31
            f6e2bcb631ed5c841589c92f3ed668cfad06f30d4937a36af17dee66777cea58
            a43f441c2785c4fba7a271f763a81fc0ada6e185192b66b24fe06869ae75f00f
            d3a2d43e5b1c9fc52e92f26093b8c45405430b1f84bcfed04c861f7fe871e163
            337512a6f38c59f1bb705d0d31cea605a224ce28e5f6e778368b48b276a1b0c9
            a78d71394d30f6514598b0dfcc0330c6aaedfee785cee9e18c887144c7a19393
            88e9e13435bf2fec8ca4215fb4555744ad716f0992d591d8da6eb9225f1b7375
            708b0a8c16399849d048a85e821ce5e23a951522fc6e3ac0c73cc7b6499552a2
            31cb2eb20aa5d8575ac82c1e65d4c41d77ad1c8065278c2ff9c770709a2d07da
            d79a171226e02a2bb85e6f9b74d6aeab3fcfda67b2dfdc769afa9b2451d0a488
            fb44b00d0d98e332a206d11f69d73a8c907e207262db217c8873513787887b13
          )

          for i in $(seq 0 19); do
            printf -v part '%s.part%02d' "$CONTROLLER_PREFIX" "$i"
            test -f "$part"
            test "$(sha256sum "$part" | awk '{print $1}')" = "${expected_sha[$i]}"
            if test "$i" -lt 19; then
              test "$(stat -c %s "$part")" = 1500
            else
              test "$(stat -c %s "$part")" = 205
            fi
            cat "$part" >> "$CONTROLLER"
          done

          test "$(stat -c %s "$CONTROLLER")" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$CONTROLLER" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          chmod 700 "$CONTROLLER"
          bash -n "$CONTROLLER"

          python - "$CUSTODY" "$CONTROLLER_COMMIT" "$CONTROLLER_SHA256" <<'PY'
          import json,sys
          path,commit,digest=sys.argv[1:]
          obj={
            'schema_version':'ssc-rd04-nd-fy2026-two-cell-validator-controller-custody@2',
            'controller_commit':commit,'fragment_count':20,'fragment_bytes_total':28705,
            'controller_bytes':28705,'controller_sha256':digest,
            'transport':'ordinary_git_fragments','source_requests':0,'route_executions':0,
            'authority_effect':'controller_transport_custody_only'
          }
          open(path,'w',encoding='utf-8').write(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY

          set +e
          bash "$CONTROLLER"
          rc=$?
          set -e
          if test -d "$OUT"; then
            cp "$CUSTODY" "$OUT/controller-custody.json"
            (
              cd "$OUT"
              find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
              sha256sum -c SHA256SUMS
            )
          fi
          exit "$rc"

      - name: Preserve exact two-cell validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-nd-fy2026-two-cell-validation-v2
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Enforce validated candidates and zero mutation
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat "$OUT/EXIT_CODE")" = 0
          test "$(cat "$OUT/STAGE")" = complete
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-two-cell-validation-receipt@2" and
            .state=="validated_candidates_complete" and .failed_or_final_stage=="complete" and .exit_code==0 and
            .current_parent=="5be5fc4d15391b99bb29226fdd16e408be559507" and
            .candidate_parent=="cffe670fef5c006c7e963421d9fd18c29ed40fba" and
            .matrix_blob=="19357f8214ab2710bc5e75b3fae8c7fb09ff1654" and
            .validated_candidates==2 and .rejected_candidates==0 and
            .source_requests==0 and .route_executions==0 and .new_source_admissions==0 and
            .field_terminalizations==0 and .matrix_updates==0 and .row_state_mutations==0 and
            .class_closed==false and .cumulative_ledger_effect=="none" and
            .outside_human_dependency==false and .publication_effect=="none" and
            .adoption_effect=="none" and .graph_effect=="none" and
            .separate_promotion_product_authorized==true and .additional_source_execution_authorized==false and
            .projected_terminal_cells==229 and .projected_still_open_cells==221 and
            .projected_terminal_substantive_cells==118 and .projected_still_open_substantive_cells==182 and
            .projected_terminal_units==11
          ' "$OUT/receipt.json" > /dev/null
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-two-cell-candidate-validation@2" and
            .state=="validated" and .validated_candidates==2 and .rejected_candidates==0 and
            .exact_current_matrix=="pass" and .exact_current_cells=="pass" and
            .candidate_identity=="pass" and .source_identity_normalization=="pass" and
            .candidate_dependency=="pass" and .projected_transition_arithmetic=="pass" and
            .unchanged_cell_denominator=="pass" and .manifest_only_rebind=="pass" and
            .promotion_applied==false and .separate_promotion_product_authorized==true
          ' "$OUT/candidate-validation.json" > /dev/null
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-two-cell-validated-candidate-protocol@2" and
            .state=="validated_unexecuted" and .candidate_count==2 and
            .application_order==[
              "RD04-ND-FY2026-FIXED-PROTOCOL-TARGET-CELL-CANDIDATE-V2",
              "RD04-ND-FY2026-FIXED-PROTOCOL-ROW-STATE-CANDIDATE-V2"
            ] and .separate_promotion_product_authorized==true and .promotion_executed==false and
            .promotion_product_requirements.field_terminalizations==1 and
            .promotion_product_requirements.row_terminalizations==1 and
            .promotion_product_requirements.matrix_cell_updates==2 and
            .promotion_product_requirements.terminal_cells_after==229 and
            .promotion_product_requirements.still_open_cells_after==221 and
            .promotion_product_requirements.terminal_substantive_cells_after==118 and
            .promotion_product_requirements.still_open_substantive_cells_after==182 and
            .promotion_product_requirements.terminal_units_after==11 and
            .promotion_product_requirements.class_closed==false and
            .promotion_product_requirements.cumulative_ledger_effect=="none" and
            .source_requests==0 and .route_executions==0 and
            .additional_source_execution_authorized==false
          ' "$OUT/validated-candidate-protocol.json" > /dev/null
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-two-cell-projected-transition@2" and
            .unchanged_evidence_cells==7 and .unchanged_other_rows==49 and
            .substantive_field_terminalizations==1 and .row_terminalizations==1 and .matrix_cell_updates==2 and
            .counts_after.terminal_cells==229 and .counts_after.still_open_cells==221 and
            .counts_after.terminal_substantive_cells==118 and .counts_after.still_open_substantive_cells==182 and
            .counts_after.not_publicly_recovered_cells==14 and
            .counts_after.row_terminal_state_cells_terminal==11 and
            .counts_after.row_terminal_state_cells_open==39 and .counts_after.terminal_units==11 and
            .class_closed==false and .cumulative_ledger_effect=="none"
          ' "$OUT/projected-transition.json" > /dev/null
          jq -e '
            .schema_version=="ssc-rd04-nd-fy2026-two-cell-validator-controller-custody@2" and
            .controller_commit=="2082a3e907a330b568b184ae7de264359ac36301" and
            .fragment_count==20 and .fragment_bytes_total==28705 and .controller_bytes==28705 and
            .controller_sha256=="f5c2287f3c98b1d34befe99c35305e204832d9239a15e457fdb946e10cfe2f1d" and
            .transport=="ordinary_git_fragments" and .source_requests==0 and .route_executions==0 and
            .authority_effect=="controller_transport_custody_only"
          ' "$OUT/controller-custody.json" > /dev/null
          (cd "$OUT" && sha256sum -c SHA256SUMS)
