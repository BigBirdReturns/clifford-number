name: Temporary PR 2231 observation unit bridge controller v66
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-observation-unit-bridge-controller-v66.yml'
      - '.github/tmp/pr2231-observation-unit-bridge-v66-repair.py'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: pr2231-observation-unit-bridge-v66
  cancel-in-progress: false
jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-observation-unit-bridge-controller-v66
      WORKFLOW_PATH: .github/workflows/temporary-pr2231-observation-unit-bridge-controller-v66.yml
      REPAIR_PATH: .github/tmp/pr2231-observation-unit-bridge-v66-repair.py
      CPARENT: a1158b01e7f2ba5c12e0a0085d3897ef00a8f79b
      CTREE: f7fc52609c1c6b42921c7a4db6e20c4e54c1f99e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 08594a6eb033a137d1500ff5ff970658a7cac020
      PTREE: d53c3b2397b262972ff594fdbce478f3699179bf
      PLIB: 0730e31c7870b17c99dfdb92c0c0ac550f7f13c8
      PTEST: 77a55e8c6a5fba54515008126b1e64ed5b30ae6d
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      V63BRANCH: agent/pr2231-split-observation-controller-v63
      V63HEAD: 80ad8865bd98a8b815a702385bac86c8564ef9a6
      V63SCRIPT: .github/tmp/pr2231-split-observation-v63-repair.py
      V63SCRIPT_BLOB: 092a9f56ad924dd1a4e8ada6c90d5df34bebce5d
      V65BRANCH: agent/pr2231-labelled-interval-boundary-controller-v65
      V65HEAD: e4b153ee1fe893fe18fb7aa689b4736006999dc0
      V65SCRIPT: .github/tmp/pr2231-labelled-interval-boundary-v65-repair.py
      V65SCRIPT_BLOB: 50f8a22163ce2ed6fa2099ed2274d8f3a138cdb0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify and publish observation unit bridge repair
        shell: bash
        run: |
          set -euo pipefail
          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-v66-source
          Q=/tmp/pr2231-v66-main
          R=/tmp/pr2231-v66-receipt.txt
          V63=/tmp/pr2231-v63-repair.py
          V65=/tmp/pr2231-v65-repair.py
          : >"$R"
          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            local label="$1" actual="$2" expected="$3"
            printf '%s actual=%s expected=%s\n' "$label" "$actual" "$expected" | tee -a "$R"
            [ "$actual" = "$expected" ] || fail "$label" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$V63BRANCH:refs/remotes/origin/$V63BRANCH" \
              "+refs/heads/$V65BRANCH:refs/remotes/origin/$V65BRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-branch '${{ github.head_ref }}' "$CBRANCH"
          require_eq controller-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" $'.github/tmp/pr2231-observation-unit-bridge-v66-repair.py\n.github/workflows/temporary-pr2231-observation-unit-bridge-controller-v66.yml'
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-remote "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq v63-head "$(git rev-parse refs/remotes/origin/$V63BRANCH)" "$V63HEAD"
          require_eq v63-script-blob "$(git rev-parse "$V63HEAD:$V63SCRIPT")" "$V63SCRIPT_BLOB"
          require_eq v65-head "$(git rev-parse refs/remotes/origin/$V65BRANCH)" "$V65HEAD"
          require_eq v65-parent "$(git rev-parse "$V65HEAD^")" "$CPARENT"
          require_eq v65-script-blob "$(git rev-parse "$V65HEAD:$V65SCRIPT")" "$V65SCRIPT_BLOB"
          git show "$V63HEAD:$V63SCRIPT" > "$V63"
          git show "$V65HEAD:$V65SCRIPT" > "$V65"
          python3 -m py_compile "$V63" "$V65"

          stage exact-predecessor-defect-witness
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          python3 "$V63"
          python3 "$V65"
          git diff --check
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';
          const secondsInput = 'Phone: 09012345678 12:30:45 555-1212';
          const secondsRequired = 'Phone: [contact omitted] 12:30:45 [contact omitted]';
          const secondsActual = redact(secondsInput);
          const unitInput = 'Mobile number: 2125551234 2026-08-17 555-1212 90 people 666-1212';
          const unitRequired = 'Mobile number: [contact omitted] 2026-08-17 [contact omitted] 90 people [contact omitted]';
          const unitActual = redact(unitInput);
          console.log(JSON.stringify({ secondsInput, secondsActual, secondsRequired }));
          console.log(JSON.stringify({ unitInput, unitActual, unitRequired }));
          assert.equal(secondsActual, secondsRequired, 'v63 plus v65 must repair the labelled interval boundary');
          assert.notEqual(unitActual, unitRequired, 'the exact predecessor must retain the cross-candidate unit bridge defect');
          NODE

          stage apply-v66-repair
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          git diff --check
          require_eq repair-paths "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage repaired-transition-matrix
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const cases = [
            ['recursive-dates', 'Phone: 09012345678 2026-08-17 555-1212 2027-09-18 666-1212', 'Phone: [contact omitted] 2026-08-17 [contact omitted] 2027-09-18 [contact omitted]'],
            ['fullwidth-recursive-dates', '電話番号：０９０１２３４５６７８ ２０２６－０８－１７ ５５５－１２１２ ２０２７－０９－１８ ６６６－１２１２', '電話番号：[contact omitted] ２０２６－０８－１７ [contact omitted] ２０２７－０９－１８ [contact omitted]'],
            ['unit-transition', 'Mobile number: 2125551234 2026-08-17 555-1212 90 people 666-1212', 'Mobile number: [contact omitted] 2026-08-17 [contact omitted] 90 people [contact omitted]'],
            ['repeated-unit-transition', 'Phone: 09012345678 90 people 666-1212 12 days 777-1212', 'Phone: [contact omitted] 90 people [contact omitted] 12 days [contact omitted]'],
            ['fullwidth-unit-transition', '電話番号：０９０１２３４５６７８ ９０人 ６６６－１２１２', '電話番号：[contact omitted] ９０人 [contact omitted]'],
            ['owned-unit-wrapper', 'Phone: 09012345678 (90 people) 666-1212', 'Phone: [contact omitted] (90 people) [contact omitted]'],
            ['identifier-chain', 'Phone / GUID / record id: 09012345678 2026-08-17 555-1212 2027-09-18 666-1212', 'Phone / GUID / record id: [contact omitted] 2026-08-17 [contact omitted] 2027-09-18 [contact omitted]'],
            ['split-time-then-decimal', 'Phone: 09012345678 2026-08-17 555-1212 12:30 666-1212 3.14 777-1212', 'Phone: [contact omitted] 2026-08-17 [contact omitted] 12:30 [contact omitted] 3.14 [contact omitted]'],
            ['split-time-seconds', 'Phone: 09012345678 12:30:45 555-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted]'],
            ['fullwidth-split-time-seconds', '電話番号：０９０１２３４５６７８ １２：３０：４５ ５５５－１２１２', '電話番号：[contact omitted] １２：３０：４５ [contact omitted]'],
            ['seconds-phone-decimal-phone', 'Phone: 09012345678 12:30:45 555-1212 3.14 666-1212', 'Phone: [contact omitted] 12:30:45 [contact omitted] 3.14 [contact omitted]'],
            ['seconds-parenthesized-phone', 'Phone: 09012345678 12:30:45 (555) 1212', 'Phone: [contact omitted] 12:30:45 [contact omitted]'],
            ['seconds-dotted-phone', 'Phone: 09012345678 12:30:45 555.1212', 'Phone: [contact omitted] 12:30:45 [contact omitted]'],
            ['identifier-seconds-phone', 'Phone / GUID / record id: 09012345678 12:30:45 555-1212', 'Phone / GUID / record id: [contact omitted] 12:30:45 [contact omitted]'],
            ['split-thousands', 'Phone: 09012345678 1,234 555-1212', 'Phone: [contact omitted] 1,234 [contact omitted]'],
            ['split-comma-decimal', 'Phone: 09012345678 1,23 555-1212', 'Phone: [contact omitted] 1,23 [contact omitted]'],
            ['invalid-closer', 'Phone: 09012345678 2026-08-17-) 555-1212 2027-09-18 666-1212', 'Phone: [contact omitted] 2026-08-17-) [contact omitted] 2027-09-18 [contact omitted]'],
            ['unlabelled-recursive-control', 'Archive 09012345678 2026-08-17 555-1212 2027-09-18 666-1212', 'Archive [contact omitted] 2026-08-17 555-1212 2027-09-18 666-1212'],
            ['unlabelled-unit-control', 'Archive 09012345678 90 people 666-1212', 'Archive [contact omitted] 90 people 666-1212'],
            ['fresh-narrative-boundary', 'Phone: 09012345678 2026-08-17 555-1212. Archive 2027-09-18 666-1212', 'Phone: [contact omitted] 2026-08-17 [contact omitted]. Archive 2027-09-18 666-1212'],
            ['narrative-unit-reset', 'Phone: 09012345678 90 people. Archive 666-1212', 'Phone: [contact omitted] 90 people. Archive 666-1212'],
            ['lexical-unit-reset', 'Phone: 09012345678 90 people called 666-1212', 'Phone: [contact omitted] 90 people called 666-1212'],
            ['unowned-unit-closer', 'Phone: 09012345678 90 people) 666-1212', 'Phone: [contact omitted] 90 people) 666-1212'],
            ['standalone-intrinsic', '03-62165111', '[contact omitted]'],
            ['date-only-control', 'Phone: 09012345678 2026-08-17 2027-09-18', 'Phone: [contact omitted] 2026-08-17 2027-09-18']
          ];
          for (const [name, input, expected] of cases) {
            const actual = redact(input);
            console.log(JSON.stringify({ name, actual, expected }));
            assert.equal(actual, expected, name);
          }
          NODE

          stage repaired-focused-suites
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"

          stage live-main-transplant-and-release-qualification
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq qualified-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js 2>&1 | tee -a "$R"
          node test/industrial-exhaust-artifacts.test.js 2>&1 | tee -a "$R"
          npm run release:check 2>&1 | tee -a "$R"
          git restore --worktree --staged -- build 2>/dev/null || true
          git clean -fd -- build >/dev/null 2>&1 || true
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check

          stage construct-qualified-product
          git config user.name BigBirdReturns
          git config user.email bigbirdreturns@proton.me
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: preserve phone-label authority across unit observations'
          AHEAD="$(git rev-parse HEAD)"
          ATREE="$(git rev-parse HEAD^{tree})"
          ALIB="$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)"
          ATEST="$(git rev-parse HEAD:test/industrial-exhaust.test.js)"
          require_eq qualified-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq qualified-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq qualified-commit-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          printf 'qualified-head=%s\nqualified-tree=%s\nqualified-lib=%s\nqualified-test=%s\n' "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
          git diff --numstat "$CPARENT..HEAD" | LC_ALL=C sort -k3 | tee -a "$R"

          stage final-lease-revalidation-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-main "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-controller "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-product "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq final-v63 "$(git rev-parse refs/remotes/origin/$V63BRANCH)" "$V63HEAD"
          require_eq final-v63-script "$(git rev-parse "$V63HEAD:$V63SCRIPT")" "$V63SCRIPT_BLOB"
          require_eq final-v65 "$(git rev-parse refs/remotes/origin/$V65BRANCH)" "$V65HEAD"
          require_eq final-v65-script "$(git rev-parse "$V65HEAD:$V65SCRIPT")" "$V65SCRIPT_BLOB"
          require_eq final-main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq final-main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq final-product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq final-product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          git -C "$Q" push origin "$AHEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          git fetch --no-tags origin "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$AHEAD"
          require_eq published-tree "$(git rev-parse "$AHEAD^{tree}")" "$ATREE"
          require_eq published-lib "$(git rev-parse "$AHEAD:tools/lib/industrial-exhaust.mjs")" "$ALIB"
          require_eq published-test "$(git rev-parse "$AHEAD:test/industrial-exhaust.test.js")" "$ATEST"
          printf 'QUALIFICATION_SUCCESS\nbase=%s\nold_product=%s\nnew_product=%s\ntree=%s\nlib=%s\ntest=%s\n' \
            "$CPARENT" "$PHEAD" "$AHEAD" "$ATREE" "$ALIB" "$ATEST" | tee -a "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-observation-unit-bridge-v66
          path: /tmp/pr2231-v66-receipt.txt
          if-no-files-found: error
          retention-days: 90
