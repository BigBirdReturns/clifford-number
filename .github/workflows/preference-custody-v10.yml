name: Preference custody laboratory floor v10

on:
  pull_request:
    paths:
      - 'data/research/performative-synthetic-constituencies/**'
      - 'data/research/preference-custody/**'
      - 'tools/lib/performative-synthetic-constituency.mjs'
      - 'tools/lib/preference-custody.mjs'
      - 'tools/lib/preference-equifinality.mjs'
      - 'tools/lib/preference-attrition.mjs'
      - 'tools/lib/preference-subgroup.mjs'
      - 'tools/lib/preference-standing.mjs'
      - 'tools/lib/preference-agenda.mjs'
      - 'tools/lib/preference-package.mjs'
      - 'tools/lib/preference-succession.mjs'
      - 'tools/lib/preference-dynamic-change.mjs'
      - 'tools/lib/preference-network-formation.mjs'
      - 'tools/lib/preference-deliberative-formation.mjs'
      - 'tools/lib/preference-custody-manifest.mjs'
      - 'tools/lib/preference-custody-manifest-v9.mjs'
      - 'tools/lib/preference-custody-manifest-v10.mjs'
      - 'tools/compile-preference-deliberative-formation.mjs'
      - 'tools/validate-preference-deliberative-formation.mjs'
      - 'tools/compile-preference-custody-manifest-v10.mjs'
      - 'tools/validate-preference-custody-manifest-v10.mjs'
      - 'test/preference-deliberative-formation.test.js'
      - 'test/preference-custody-manifest-v10.test.js'
      - 'docs/preference-custody-deliberative-formation.md'
      - 'docs/preference-custody-laboratory-floor-v10.md'
      - '.github/workflows/preference-custody-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile PC-12 and the compositional v10 floor
        run: |
          node tools/compile-preference-deliberative-formation.mjs
          node tools/compile-preference-custody-manifest-v10.mjs
      - name: Validate deliberative and floor boundaries
        run: |
          node tools/validate-preference-deliberative-formation.mjs
          node tools/validate-preference-custody-manifest-v10.mjs
      - name: Exercise standalone and integrated adversarial fixtures
        run: |
          node test/preference-deliberative-formation.test.js
          node test/preference-custody-manifest-v10.test.js
      - name: Preserve deterministic v10 projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-custody-laboratory-floor-v10
          path: |
            build/research/preference-deliberative-formation.json
            build/research/preference-deliberative-formation.md
            build/research/preference-custody-laboratory-floor-v10.json
            build/research/preference-custody-laboratory-floor-v10.md
          if-no-files-found: error
