name: TEMP capture School.House state-registry candidates

on:
  pull_request:
    paths:
      - '.github/workflows/temp-schoolhouse-state-registry-capture.yml'
      - '.schoolhouse-state-registry-capture/EXECUTE'
      - 'tools/acquisition/schoolhouse-state-registries/run.py'
      - 'tools/acquisition/schoolhouse-state-registries/run-strict.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile acquisition runners
        run: |
          python -m py_compile \
            tools/acquisition/schoolhouse-state-registries/run.py \
            tools/acquisition/schoolhouse-state-registries/run-strict.py

      - name: Execute strict bounded state-registry acquisition
        id: acquisition
        continue-on-error: true
        env:
          STATE_REGISTRY_USER_AGENT: CliffordNumber-SchoolHouse-State-Registry/2.0 219768509+BigBirdReturns@users.noreply.github.com
        run: |
          set +e
          OUT=/tmp/schoolhouse-state-registry-candidates
          rm -rf "$OUT"
          python tools/acquisition/schoolhouse-state-registries/run-strict.py \
            --output "$OUT" \
            --retries 3 \
            --sleep-seconds 0.75 \
            --max-detail-pages 30
          status=$?
          mkdir -p "$OUT"
          printf '%s\n' "$status" > "$OUT/RUNNER_EXIT_CODE"
          exit "$status"

      - name: Upload exact acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-state-registry-candidates-attempt02-strict
          path: /tmp/schoolhouse-state-registry-candidates
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Require terminal bounded route and semantic custody
        if: always()
        run: |
          test -f /tmp/schoolhouse-state-registry-candidates/RUNNER_EXIT_CODE
          test "$(cat /tmp/schoolhouse-state-registry-candidates/RUNNER_EXIT_CODE)" = '0'
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/schoolhouse-state-registry-candidates')
          summary = json.loads((root / 'summary.json').read_text())
          receipt = json.loads((root / 'acquisition-receipt.json').read_text())
          adjudication = json.loads((root / 'adjudication.json').read_text())
          routes = [json.loads(line) for line in (root / 'source-routes.jsonl').read_text().splitlines() if line]
          candidates = [json.loads(line) for line in (root / 'registry-candidates.jsonl').read_text().splitlines() if line]

          def canonical(value):
              text = re.sub(r'[^A-Z0-9]+', ' ', str(value or '').upper()).strip()
              return re.sub(r'\bSCHOOL\s+HOUSE\b', 'SCHOOLHOUSE', text)

          def tokens(value):
              return [token for token in canonical(value).split() if token]

          assert summary['route_count'] == 26
          assert summary['terminal_route_count'] == 26
          assert summary['all_routes_terminal'] is True
          assert summary['florida_query_route_count'] == 20
          assert summary['florida_captured_route_count'] >= 1
          assert summary['north_carolina_automated_queries_executed'] == 0
          assert summary['registry_identity_admitted'] is False
          assert summary['negative_existence_claim_created'] is False
          assert summary['street_address_rows_retained'] == 0
          assert summary['contact_detail_rows_retained'] == 0
          assert summary['officer_name_rows_retained'] == 0
          assert summary['private_support_rows'] == 0
          assert summary['outside_human_dependency'] is False
          assert summary['graph_effect'] == 'none'

          assert len(routes) == 26
          assert len(candidates) == summary['candidate_rows']
          assert all(route['state'] in {
              'automation_not_permitted',
              'captured_and_parsed',
              'captured_metadata',
              'captured_no_candidates',
              'form_discovery_only',
              'source_unavailable_after_search',
          } for route in routes)

          for candidate in candidates:
              assert candidate['semantic_parser'] == 'strict_typed_table_v2'
              assert candidate['street_address_retained'] is False
              assert candidate['contact_details_retained'] is False
              assert candidate['officer_names_retained'] is False
              assert candidate['graph_effect'] == 'none'
              assert candidate['promotes_to'] == 'candidate_only'
              assert candidate['legal_name']
              assert not candidate['legal_name'].isdigit()
              if candidate['query_type'] == 'fei_ein':
                  assert re.sub(r'\D', '', candidate['query']) == candidate['fei_ein']
                  assert len(candidate['fei_ein']) == 9
              elif candidate['query_type'] in {'entity_name', 'fictitious_name', 'organization_name'}:
                  candidate_tokens = set(canonical(candidate['legal_name']).split())
                  assert all(token in candidate_tokens for token in tokens(candidate['query']))

          assert receipt['all_routes_terminal'] is True
          assert receipt['registry_identity_admitted'] is False
          assert receipt['negative_existence_claim_created'] is False
          assert receipt['north_carolina_automation_boundary_respected'] is True
          assert receipt['outside_human_dependency'] is False
          assert receipt['graph_effect'] == 'none'

          assert adjudication['identity_decision']['state'] == 'registry_candidates_not_admitted'
          assert adjudication['identity_decision']['negative_existence_claim_created'] is False
          assert adjudication['north_carolina_boundary']['automated_queries_executed'] == 0
          assert adjudication['outside_human_dependency'] is False
          assert adjudication['graph_effect'] == 'none'
          print(json.dumps(summary, sort_keys=True))
          PY
