name: SSC RD-04 responsive-link source adjudication materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: ssc-rd04-responsive-source-materializer-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd04-responsive-source-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct, qualify, and lease-publish the exact thirteen-file product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          readonly MAIN_LEASE=c81de1c073d0a9ff6d35d8b6f1f4396941026203
          readonly TARGET_BRANCH=agent/ssc-rd-wave03-rd04-responsive-link-source-adjudication-v1
          readonly TARGET_LEASE=f5fda8994e30d281a8ab5fb49c77fe1c19337c39
          readonly STANDING=.github/workflows/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.yml
          readonly ARCHIVE=/tmp/rd04-responsive-source-adjudication.tar.xz
          readonly PACKAGE=/tmp/rd04-responsive-source-adjudication-package
          readonly WORK=/tmp/rd04-responsive-source-adjudication-worktree
          readonly RECEIPT=/tmp/rd04-responsive-source-materializer-receipt
          readonly PATHS=/tmp/rd04-responsive-source-product-paths.txt

          rm -rf "$ARCHIVE" "$PACKAGE" "$WORK" "$RECEIPT" "$PATHS"
          mkdir -p "$PACKAGE" "$RECEIPT"
          trap 'status=$?; printf "exit_status=%s\n" "$status" >> "$RECEIPT/terminal.txt"; exit "$status"' EXIT
          printf 'main_lease=%s\ntarget_branch=%s\ntarget_lease=%s\n' "$MAIN_LEASE" "$TARGET_BRANCH" "$TARGET_LEASE" > "$RECEIPT/start.txt"

          python - "$ARCHIVE" "$PACKAGE" "$PATHS" <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request
          import sys

          archive = pathlib.Path(sys.argv[1])
          package = pathlib.Path(sys.argv[2])
          paths_file = pathlib.Path(sys.argv[3])
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']

          blobs = [
              ('e765e4953d2e62e0f59daf5601ee62c3f6609ba4', 2250, 'd18157443bedd11a9fb8c482106f345ed4c14b2518f122a5aebb2aebb6d47fe0'),
              ('4006650d071d7a26e26d22118c863115d7acfeb2', 2250, '7b73a5174c7e6e062d1507ff76605e0bbef6e227759fbdd970f72fe6a1422dc9'),
              ('99030690fa2b19274085ee5786a40304e4465434', 4500, '5570b882f6552d9dbe2bcd846763d4838ce0152d07780765eece1e4823c8ff5c'),
              ('061f7ed21242b46c888e35a4f737d9df5cbf3fd1', 4500, '4c5134fa0173813d3eb1e865af47ddfec7ef075cc941ab0ec7813a316fc5dbe3'),
              ('a8bf08283088dba5a1a3d6d08ba421f2b027cb0d', 4500, '8acf52ab38cd95bae33740d6736a4b82b6e392670883ce73ccf23fad0f09242f'),
              ('a96483ff4119f83997c616bba218959d3350a713', 4500, '27551d584e16e7e89993032e220eb2dfa23eeae96b416b41b0319e7f68a4ad0e'),
              ('bc55bcf821ebbabb7af8dde61cbd793bd976f6fc', 4500, '04617ec151c8eca156c1de2ad80c744fb42f59c8c9d4f25d30a8119e7a48f222'),
              ('d88b2f2c5926636426e7e67637df870b0a2a110a', 4500, 'ee0a8d3ecfb13c58001ed4784efbaf4f95db94e3e03b9c2b882061b5fd50afd4'),
              ('714a9f199b01fa9cc6668df0497f787008bdd602', 2432, 'f8e9c60ab453a6d10dd7ea3b348db90f3e19ae0348b173e3815d429b6f2727fc'),
          ]

          expected_paths = [
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/capture-custody.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/capture-execution-receipt.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/capture-route-results.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/index.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/offline-field-review-protocol.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/product-manifest.json',
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/source-adjudications.jsonl',
              'data/intake/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication/source-decisions.json',
              'docs/milestones/ssc-rd-wave03-rd04-responsive-link-source-adjudication.md',
              'schemas/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.schema.json',
              'test/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.test.js',
              'tools/build-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs',
              'tools/validate-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs',
          ]

          expected_files = {
              expected_paths[0]: (1938, '2158cc096d977f785313e18d778c60f87deb8a310efd240022a42ac31188bfa2'),
              expected_paths[1]: (716, 'f8ff7bc77c162206f1155388bf363d0fc0ba12a2dbd67ffc0eafb0d1b2732bc4'),
              expected_paths[2]: (73417, '7bc1db2b09372d2902a8a506a85a0d6022bb7a3cac86d3393c9d371b6da24161'),
              expected_paths[3]: (2324, '01f55d50156bd627b6d833643f93413de59c1d80e916d58090d6390e32077df3'),
              expected_paths[4]: (42953, '4442656c9680df1af7aae7d2e6a92ee5cce2af523724c84a27b764e502e2bb11'),
              expected_paths[5]: (1343, 'f661905a2c46e21e0e1e80de01e14d4b5fc22f197ccaaa1a5e6445cd55ff0626'),
              expected_paths[6]: (150582, '7f454fc2e068d9be2d66bf6c0ac6940026b8568dac44ba6ceead59afd547de28'),
              expected_paths[7]: (129494, '879c2191ca0128dd09e02ef66c01c5ee7058545a28ad25683eafb23f72451857'),
              expected_paths[8]: (5808, '1f77cbfecabeb9fb2c86e9d4004361d5b90802e173141171f3ec47c8f9dbd671'),
              expected_paths[9]: (5651, '3c0b0cb118bf2550dc3369e001b536b7839c6d46d0dc96a95baa67793030c896'),
              expected_paths[10]: (4092, '2daa809c1118ece9468a497f6e9cee860897d44a07c8d62559e8f35e1ad26d34'),
              expected_paths[11]: (21772, 'bcbe94e1b6c4a841af41bfd267d933c0d818b038a26911f331c52df2def1f5c6'),
              expected_paths[12]: (8011, '189c2334c1f1bd6cdc5e257a7874667427e9948ba02caacb52ce512b247e8c7c'),
          }

          chunks = []
          chunk_receipt = []
          for sha, size, digest in blobs:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'ssc-rd04-responsive-source-materializer',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              data = base64.b64decode(payload['content'].replace('\n', ''))
              computed_git_sha = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert payload['sha'] == sha and computed_git_sha == sha, sha
              assert len(data) == size, (sha, len(data), size)
              assert hashlib.sha256(data).hexdigest() == digest, sha
              chunks.append(data)
              chunk_receipt.append({'sha': sha, 'bytes': size, 'sha256': digest})

          archive_bytes = b''.join(chunks)
          assert len(archive_bytes) == 33932, len(archive_bytes)
          assert hashlib.sha256(archive_bytes).hexdigest() == '7b372c64357d59125267e932769254c3553f1a95fd180d5432c50748eb664cfa'
          archive.write_bytes(archive_bytes)

          with tarfile.open(archive, mode='r:xz') as tf:
              members = [member for member in tf.getmembers() if member.isfile()]
              normalized = sorted(member.name.lstrip('./') for member in members)
              assert normalized == expected_paths, normalized
              assert len(members) == 13
              assert all(not member.issym() and not member.islnk() for member in tf.getmembers())
              for member in tf.getmembers():
                  target = (package / member.name).resolve()
                  assert target == package.resolve() or package.resolve() in target.parents
              tf.extractall(package, filter='data')

          found = sorted(str(path.relative_to(package)) for path in package.rglob('*') if path.is_file())
          assert found == expected_paths, found
          for rel, (size, digest) in expected_files.items():
              data = (package / rel).read_bytes()
              assert len(data) == size, (rel, len(data), size)
              assert hashlib.sha256(data).hexdigest() == digest, rel

          paths_file.write_text('\n'.join(expected_paths) + '\n')
          pathlib.Path('/tmp/rd04-responsive-source-materializer-receipt/chunks.json').write_text(
              json.dumps(chunk_receipt, indent=2, sort_keys=True) + '\n'
          )
          print('sealed_archive_bytes=33932')
          print('sealed_archive_sha256=7b372c64357d59125267e932769254c3553f1a95fd180d5432c50748eb664cfa')
          print('sealed_nonworkflow_paths=13')
          PY

          git fetch --no-tags origin main "$TARGET_BRANCH"
          LIVE_MAIN=$(git rev-parse origin/main)
          LIVE_TARGET=$(git rev-parse "origin/$TARGET_BRANCH")
          test "$LIVE_MAIN" = "$MAIN_LEASE"
          test "$LIVE_TARGET" = "$TARGET_LEASE"
          test "$(git rev-parse "$LIVE_TARGET^")" = "$LIVE_MAIN"
          test "$(git rev-list --count "$LIVE_MAIN..$LIVE_TARGET")" = 1
          test "$(git diff --name-only "$LIVE_MAIN..$LIVE_TARGET")" = "$STANDING"
          test "$(git diff --name-status "$LIVE_MAIN..$LIVE_TARGET" | awk '$1 != "A" {n++} END {print n+0}')" = 0

          git worktree add --detach "$WORK" "$LIVE_TARGET"
          cp -a "$PACKAGE"/. "$WORK"/
          cd "$WORK"
          while IFS= read -r path; do git add -- "$path"; done < "$PATHS"
          git diff --cached --name-only | sort > "$RECEIPT/staged-paths.txt"
          cmp "$PATHS" "$RECEIPT/staged-paths.txt"
          test "$(git diff --cached --name-status | wc -l | tr -d ' ')" = 13
          test "$(git diff --cached --name-status | awk '$1 != "A" {n++} END {print n+0}')" = 0
          if grep -E '(^|/)(tmp|transport|carrier|materializer|trigger)(/|$)' "$RECEIPT/staged-paths.txt"; then exit 1; fi
          if grep -E '^\.github/workflows/' "$RECEIPT/staged-paths.txt"; then exit 1; fi
          git diff --cached --check

          git commit -m 'Adjudicate RD-04 responsive-link sources and freeze offline field review'
          FINAL_COMMIT=$(git rev-parse HEAD)
          FINAL_TREE=$(git rev-parse 'HEAD^{tree}')
          test "$(git rev-parse HEAD^)" = "$LIVE_TARGET"
          test "$(git rev-list --count "$LIVE_TARGET..HEAD")" = 1
          git diff --name-only "$LIVE_TARGET..HEAD" | sort > "$RECEIPT/committed-paths.txt"
          cmp "$PATHS" "$RECEIPT/committed-paths.txt"
          test "$(git diff --name-status "$LIVE_TARGET..HEAD" | awk '$1 != "A" {n++} END {print n+0}')" = 0

          node --check tools/build-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs
          node --check tools/validate-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs
          node --check test/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.test.js
          node tools/build-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.test.js
          node tools/validate-no-magic-human-gate.mjs
          npm run release:check

          git restore --worktree -- .
          git clean -fdx
          node tools/build-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs --write
          node tools/build-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs --check
          node tools/validate-status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.mjs
          node test/status-sovereignty-rd-wave03-rd04-responsive-link-source-adjudication.test.js
          node tools/validate-no-magic-human-gate.mjs
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$LIVE_MAIN"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$LIVE_TARGET"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$LIVE_TARGET"
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$FINAL_COMMIT"

          printf 'live_main=%s\nstanding_workflow_commit=%s\nfinal_commit=%s\nfinal_tree=%s\npermanent_nonworkflow_paths=13\ncaptured_routes=62\nsources_admitted=58\noffline_field_review_sources=36\nlocator_context_toolkit_only=22\nno_source_decisions=4\nfield_classifications=0\nfield_terminalizations=0\nterminal_cells=100/450\nclass_closed=false\noutside_human_dependency=false\n' \
            "$LIVE_MAIN" "$LIVE_TARGET" "$FINAL_COMMIT" "$FINAL_TREE" > "$RECEIPT/final.txt"
          cp "$PATHS" "$RECEIPT/product-paths.txt"
          cp "$ARCHIVE" "$RECEIPT/rd04-responsive-source-adjudication.tar.xz"
          sha256sum "$ARCHIVE" "$RECEIPT"/*.txt > "$RECEIPT/sha256sums.txt"
          cat "$RECEIPT/final.txt"

      - name: Preserve exact source-adjudication materializer receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-responsive-source-materializer-receipt
          path: /tmp/rd04-responsive-source-materializer-receipt
          if-no-files-found: error
          retention-days: 90
