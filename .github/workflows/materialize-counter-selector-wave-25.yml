# Trigger exact materialization through push or draft-PR custody.
name: Materialize Counter-Selector Wave 25

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-25.yml'
  push:
    branches:
      - 'agent/counter-selector-wave-25-support-adjusted-surplus'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-25-support-adjusted-surplus
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact fragments and reconstruct Wave 25 sources
        run: |
          set -euo pipefail
          cat > /tmp/wave25-expected-blobs <<'EOF'
          60e7b75c9c90bca31e36909538af24071a82065f  .github/materializers/counter-selector-wave-25/source-00
          dc8578f05b2e61e03dc71c3b201900ae61475e6e  .github/materializers/counter-selector-wave-25/source-01
          f9a1a2aeca9a3a066f5a088c66e11a4407bdd35f  .github/materializers/counter-selector-wave-25/source-02
          ab014fa906b49188b98749adaa341e2b94638aa3  .github/materializers/counter-selector-wave-25/source-03
          26feb22818df116d755b34ce93662588209a63f4  .github/materializers/counter-selector-wave-25/source-04
          db28d170d0ae176d3f7804704f53457ea62ed196  .github/materializers/counter-selector-wave-25/report-00
          d7c15ec53d40d0f17ac55027faba1bfcdfa3faf6  .github/materializers/counter-selector-wave-25/report-01
          e14bdd5f232e4648e8b8e78d4d2898a73a5ac470  .github/materializers/counter-selector-wave-25/report-02
          18610a5126f9ea3c6a015a1716bc8b15db82feba  .github/materializers/counter-selector-wave-25/build-00
          df6cb56e4078fea553dd12c9569c10f272483d62  .github/materializers/counter-selector-wave-25/build-01
          347b4867c18ccbeeed77ebe15cc25e71c79992f0  .github/materializers/counter-selector-wave-25/build-02
          adb1e0a51125db0e7f906dfe076bf80c8d475bd4  .github/materializers/counter-selector-wave-25/validate-00
          f39da55256d7b7bc7e2fed9cc1268684ff4de207  .github/materializers/counter-selector-wave-25/validate-01
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "fragment blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave25-expected-blobs

          mkdir -p data/project reports/core-thesis/counter-selector-wave-25 tools
          cat .github/materializers/counter-selector-wave-25/source-* \
            > data/project/counter-selector-wave-25-support-adjusted-surplus.json
          cat .github/materializers/counter-selector-wave-25/report-* \
            > reports/core-thesis/counter-selector-wave-25/data.json
          cat .github/materializers/counter-selector-wave-25/build-* \
            > tools/build-counter-selector-wave-25.mjs
          cat .github/materializers/counter-selector-wave-25/validate-* \
            > tools/validate-counter-selector-wave-25.mjs

          echo 'fa131a047d1df0d478b23f9d8559e3fe9f4761b8497818c0901b5bae9127c956  data/project/counter-selector-wave-25-support-adjusted-surplus.json' | sha256sum --check --strict
          echo '94041cc8dac981327aed53065d1d1d423da829b3b1465ab6c29dde14f5a1e643  reports/core-thesis/counter-selector-wave-25/data.json' | sha256sum --check --strict
          echo '05bff6d09fa866d974f80dcc46cfb91c260dbd2333cbc2aa38016038e02275ee  tools/build-counter-selector-wave-25.mjs' | sha256sum --check --strict
          echo 'bac5bf55dc3bf3f0f7f6638994f066bccd407c27e271baa1e01c043bb52cb50d  tools/validate-counter-selector-wave-25.mjs' | sha256sum --check --strict
      - name: Build, validate, and attack Wave 25
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-25.mjs
          node tools/validate-counter-selector-wave-25.mjs
          node test/counter-selector-wave-25.test.js
      - name: Commit exact reconstructed Wave 25 files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/project/counter-selector-wave-25-support-adjusted-surplus.json \
            reports/core-thesis/counter-selector-wave-25/data.json \
            tools/build-counter-selector-wave-25.mjs \
            tools/validate-counter-selector-wave-25.mjs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            data/project/counter-selector-wave-25-support-adjusted-surplus.json \
            reports/core-thesis/counter-selector-wave-25/data.json \
            tools/build-counter-selector-wave-25.mjs \
            tools/validate-counter-selector-wave-25.mjs | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected staged paths' >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Audit Counter-Selector Wave 25 support-adjusted surplus'
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Wave 25 reconstruction
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-25.mjs
          node tools/validate-counter-selector-wave-25.mjs
          node test/counter-selector-wave-25.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Publish reconstructed Wave 25 head
        run: git push origin HEAD:agent/counter-selector-wave-25-support-adjusted-surplus
