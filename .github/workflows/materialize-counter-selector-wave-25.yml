# Repaired transport: deterministic four-part Base64 tar carrier.
name: Materialize Counter-Selector Wave 25

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-25.yml'
  push:
    branches:
      - 'agent/counter-selector-wave-25-support-adjusted-surplus'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-25-support-adjusted-surplus
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact carrier and unpack Wave 25 estate
        run: |
          set -euo pipefail
          cat > /tmp/wave25-expected-blobs <<'EOF'
          38ea9be569e2a0360afd7d32d8b0870c58110467  .github/materializers/counter-selector-wave-25/payload-00
          5d72de2f6a1033a2192189ae493b5aba1ab25c8e  .github/materializers/counter-selector-wave-25/payload-01
          92c2994fab5a451f8618f3088be988699090ab02  .github/materializers/counter-selector-wave-25/payload-02
          93b378e6677e0d7ae7bf571c293631e30434b1f8  .github/materializers/counter-selector-wave-25/payload-03
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave25-expected-blobs
          cat .github/materializers/counter-selector-wave-25/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-25.tar.gz
          echo '17f4dac7f72b8627b31f5ad6cae7058a611d537c338e4d51a6290d36d3c7bb77  /tmp/counter-selector-wave-25.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-25.tar.gz -C .
      - name: Build, validate, and attack Wave 25
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-25.mjs
          node tools/validate-counter-selector-wave-25.mjs
          node test/counter-selector-wave-25.test.js
      - name: Commit exact reconstructed Wave 25 files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/project/counter-selector-wave-25-support-adjusted-surplus.json \
            reports/core-thesis/counter-selector-wave-25/data.json \
            tools/build-counter-selector-wave-25.mjs \
            tools/validate-counter-selector-wave-25.mjs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            data/project/counter-selector-wave-25-support-adjusted-surplus.json \
            reports/core-thesis/counter-selector-wave-25/data.json \
            tools/build-counter-selector-wave-25.mjs \
            tools/validate-counter-selector-wave-25.mjs | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected staged paths' >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          }
          git diff --cached --check
          git commit -m 'Audit Counter-Selector Wave 25 support-adjusted surplus'
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Wave 25 reconstruction
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-25.mjs
          node tools/validate-counter-selector-wave-25.mjs
          node test/counter-selector-wave-25.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Publish reconstructed Wave 25 head
        run: git push origin HEAD:agent/counter-selector-wave-25-support-adjusted-surplus
