name: TEMP publish RD-03 cumulative label semantics follow-up

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-ssc-rd03-flattened-label-semantics-followup-v2.yml'
      - '.rd03-ledger5-materializer/**'

permissions:
  contents: write

concurrency:
  group: temp-ssc-rd03-label-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd03-ledger5-materializer-trigger-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPECTED_MAIN: ef70f7ad406c518f4b640ca4641c5a0f045a0d8d
      EXPECTED_TARGET: ef70f7ad406c518f4b640ca4641c5a0f045a0d8d
      TARGET_BRANCH: agent/ssc-rd03-label-semantics-correction
      MATERIALIZER_BASE: agent/ssc-rd03-ledger5-materializer-base-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Derive canonical-main follow-up from reviewed repair controller
        run: |
          set -Eeuo pipefail
          bootstrap="$RUNNER_TEMP/ssc-rd03-label-followup-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$bootstrap"
          mkdir -p "$bootstrap"
          echo "RECEIPT_DIR=$bootstrap" >> "$GITHUB_ENV"
          printf '%s\n' derive-followup-controller > "$bootstrap/final-step.txt"
          printf '%s\n' 1 > "$bootstrap/exit-code.txt"

          git show "origin/${MATERIALIZER_BASE}:.github/workflows/temporary-ssc-rd03-flattened-label-semantics-v1.yml" > "$RUNNER_TEMP/label-v1.yml"
          python - <<'PY'
          import hashlib
          import os
          import textwrap
          from pathlib import Path

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          lines = (runner_temp / 'label-v1.yml').read_text().splitlines()
          start = lines.index('        run: |') + 1
          end = next(
              i for i in range(start, len(lines))
              if lines[i].startswith('      - name: Preserve exact label-semantics repair receipt')
          )
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'

          replacements = [
              (
                  "'schema_version':'ssc-rd03-cumulative-flattened-label-semantics@1',",
                  "'schema_version':'ssc-rd03-cumulative-flattened-label-semantics@2',",
                  1,
                  'receipt schema',
              ),
              (
                  "'prior_target':os.environ['EXPECTED_TARGET'],",
                  "'source_main':os.environ['EXPECTED_MAIN'],",
                  1,
                  'receipt source binding',
              ),
              (
                  "'permanent_pr_paths_after_patch':11,",
                  "'permanent_pr_paths_after_patch':10,",
                  1,
                  'follow-up path count',
              ),
              (
                  'test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"',
                  'test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"',
                  1,
                  'checkout lease',
              ),
              (
                  'test "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_TARGET"',
                  'test -z "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"',
                  2,
                  'absent target leases',
              ),
              (
                  'git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET"',
                  'git push origin "HEAD:refs/heads/$TARGET_BRANCH"',
                  1,
                  'new branch publication',
              ),
          ]
          for old, new, expected_count, label in replacements:
              count = script.count(old)
              if count != expected_count:
                  raise RuntimeError(f'{label}: expected {expected_count} matches, found {count}')
              script = script.replace(old, new)

          output = Path('/tmp/ssc-rd03-label-followup-v2.sh')
          output.write_text(script)
          digest = hashlib.sha256(script.encode()).hexdigest()
          (runner_temp / 'derived-followup-script.sha256').write_text(
              f'{digest}  ssc-rd03-label-followup-v2.sh\n'
          )
          PY
          bash -n /tmp/ssc-rd03-label-followup-v2.sh
          cp "$RUNNER_TEMP/derived-followup-script.sha256" "$bootstrap/"
          printf '%s\n' 0 > "$bootstrap/exit-code.txt"
          printf '%s\n' derived-followup-controller > "$bootstrap/final-step.txt"
      - name: Patch, qualify, and publish canonical follow-up
        run: bash /tmp/ssc-rd03-label-followup-v2.sh
      - name: Preserve exact follow-up receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd03-cumulative-label-semantics-followup-v2
          path: ${{ env.RECEIPT_DIR }}
          if-no-files-found: error
          retention-days: 90
