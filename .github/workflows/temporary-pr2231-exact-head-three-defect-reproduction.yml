name: Temporary PR 2231 exact-head three-defect reproduction

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temporary-pr2231-exact-head-three-defect-reproduction.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr2231-exact-head-three-defect-reproduction
  cancel-in-progress: false

jobs:
  reproduce-current-head:
    if: github.event.pull_request.number == 2391
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN: 17aa3cfc22d5f9022164baf5c1d5a8e401b796cf
      EXPECTED_PRODUCT: bea76f0dd155122c3a45fe82c7c1abbaf676349b
      EXPECTED_LIBRARY_BLOB: 6655e9aa10ac2964e5f6289a4881f1343265fa0e
      EXPECTED_FOCUSED_TEST_BLOB: 7f72ca8c2eb7f436471453c74b98e1227b0970d5
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      CONTROLLER_BRANCH: agent/pr2231-cumulative-custody-controller-v92
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      ARTIFACT_DIR: /tmp/pr2231-exact-head-three-defect-reproduction

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize immutable reproduction receipt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' REPRODUCTION_STARTED > "$ARTIFACT_DIR/result.txt"
          printf '%s\n' "$EXPECTED_MAIN" > "$ARTIFACT_DIR/main.sha"
          printf '%s\n' "$EXPECTED_PRODUCT" > "$ARTIFACT_DIR/product.sha"
          printf '%s\n' "$EXPECTED_CONTROLLER" > "$ARTIFACT_DIR/controller.sha"
          printf '%s\n' "$EXPECTED_LIBRARY_BLOB" > "$ARTIFACT_DIR/library.blob"
          printf '%s\n' "$EXPECTED_FOCUSED_TEST_BLOB" > "$ARTIFACT_DIR/focused-test.blob"

      - name: Bind live main, product, controller, topology, and blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}" \
            "+refs/heads/${CONTROLLER_BRANCH}:refs/remotes/origin/${CONTROLLER_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$EXPECTED_PRODUCT"
          test "$(git rev-parse refs/remotes/origin/${CONTROLLER_BRANCH})" = "$EXPECTED_CONTROLLER"
          test "$(git rev-parse "${EXPECTED_PRODUCT}^")" = "$EXPECTED_MAIN"
          test "$(git rev-parse "${EXPECTED_PRODUCT}:tools/lib/industrial-exhaust.mjs")" = "$EXPECTED_LIBRARY_BLOB"
          test "$(git rev-parse "${EXPECTED_PRODUCT}:test/industrial-exhaust.test.js")" = "$EXPECTED_FOCUSED_TEST_BLOB"
          mapfile -t product_paths < <(git diff-tree --no-commit-id --name-only -r "$EXPECTED_PRODUCT" | sort)
          test "${#product_paths[@]}" -eq 2
          test "${product_paths[0]}" = 'test/industrial-exhaust.test.js'
          test "${product_paths[1]}" = 'tools/lib/industrial-exhaust.mjs'
          git rev-parse "${EXPECTED_PRODUCT}^{tree}" > "$ARTIFACT_DIR/product.tree"
          rm -rf /tmp/pr2231-exact-head-product
          git worktree add --detach /tmp/pr2231-exact-head-product "$EXPECTED_PRODUCT"

      - name: Reproduce all three fresh exact-head review defects
        shell: bash
        working-directory: /tmp/pr2231-exact-head-product
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { redactContactData } from './tools/lib/industrial-exhaust.mjs';

          const cases = [
            {
              name: 'synthetic-date-inside-phone',
              input: 'Archive 03-6216-8041-3.14',
              current: 'Archive 03-6216-8041-3.14',
              repaired: 'Archive [contact omitted]-3.14'
            },
            {
              name: 'dotted-phone-after-labelled-phone',
              input: 'Phone: 09012345678 03.6216.8041',
              current: 'Phone: [contact omitted] 03.6216.8041',
              repaired: 'Phone: [contact omitted] [contact omitted]'
            },
            {
              name: 'international-phone-dash-observation',
              input: 'Archive +81 3 6216 8041–3.14',
              current: 'Archive [contact omitted]',
              repaired: 'Archive [contact omitted]–3.14'
            }
          ];

          const outcomes = cases.map(testCase => ({
            ...testCase,
            actual: redactContactData(testCase.input)
          }));
          fs.writeFileSync(
            `${process.env.ARTIFACT_DIR}/reproduction.json`,
            `${JSON.stringify({
              main: process.env.EXPECTED_MAIN,
              product: process.env.EXPECTED_PRODUCT,
              controller: process.env.EXPECTED_CONTROLLER,
              outcomes
            }, null, 2)}\n`
          );

          for (const outcome of outcomes) {
            console.log(`${outcome.name}: ${JSON.stringify(outcome.actual)}`);
            assert.equal(outcome.actual, outcome.current, outcome.name);
          }
          console.log('CURRENT_EXACT_HEAD_THREE_DEFECT_REPRODUCTION_SUCCESS');
          NODE
          printf '%s\n' REPRODUCTION_SUCCESS > "$ARTIFACT_DIR/result.txt"

      - name: Upload exact-head reproduction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-exact-head-three-defect-reproduction
          path: /tmp/pr2231-exact-head-three-defect-reproduction
          if-no-files-found: warn
          retention-days: 90
