name: Preference custody remedy-enforcement control

on:
  pull_request:
    paths:
      - 'data/research/preference-custody/remedy-enforcement.fixture.json'
      - 'tools/lib/preference-remedy-enforcement.mjs'
      - 'tools/compile-preference-remedy-enforcement.mjs'
      - 'tools/validate-preference-remedy-enforcement.mjs'
      - 'test/preference-remedy-enforcement.test.js'
      - 'docs/preference-custody-remedy-enforcement.md'
      - '.github/workflows/preference-remedy-enforcement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remedy-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile collective remedy-enforcement worlds
        run: node tools/compile-preference-remedy-enforcement.mjs
      - name: Validate standing, security, payment, insolvency, succession, and durability boundaries
        run: node tools/validate-preference-remedy-enforcement.mjs
      - name: Exercise stay, escrow, pass-through, fragmentation, insolvency, successor, clawback, authority, and tamper fixtures
        run: node test/preference-remedy-enforcement.test.js
      - name: Preserve deterministic remedy-enforcement projections
        uses: actions/upload-artifact@v4
        with:
          name: preference-remedy-enforcement-pc17
          path: |
            build/research/preference-remedy-enforcement.json
            build/research/preference-remedy-enforcement.md
          if-no-files-found: error
