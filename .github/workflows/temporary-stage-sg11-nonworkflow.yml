name: Temporary stage SG-11 non-workflow estate · current main

on:
  push:
    branches: [agent/sg11-nonworkflow-materializer]
    paths:
      - '.github/tmp/sg11-current.part-*.b64'
      - '.github/workflows/temporary-stage-sg11-nonworkflow.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp/sg11-current.part-*.b64'
      - '.github/workflows/temporary-stage-sg11-nonworkflow.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sg11-nonworkflow-materializer-current-main
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sg11-nonworkflow-materializer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and reconstruct exact patch
        run: |
          set -Eeuo pipefail
          printf '%s  %s\n' ebcc649312ee7befef09926610066f4f2245cf0e9413c374311b968708103f65 .github/tmp/sg11-current.part-00.b64 | sha256sum -c -
          printf '%s  %s\n' 0927ccf839a266022ea18fed7595773b9f4559b786bfb7455c70cffeac6c2a44 .github/tmp/sg11-current.part-01.b64 | sha256sum -c -
          printf '%s  %s\n' 506194976ed360ce40b1aa12afc79b59edcd4820f746c77aa011a16860dbbc56 .github/tmp/sg11-current.part-02.b64 | sha256sum -c -
          printf '%s  %s\n' d068e36eb5f93ce5187145aabd78cb557637cec2312467560d961245c00f966c .github/tmp/sg11-current.part-03.b64 | sha256sum -c -
          cat .github/tmp/sg11-current.part-{00..03}.b64 > /tmp/sg11.patch.xz.b64
          test "$(wc -c < /tmp/sg11.patch.xz.b64)" -eq 27456
          printf '%s  %s\n' 5e9ae3e6a2b55f41e5039957dab9f776c7e3ce3edfbc85f8a3c5be353fb4f329 /tmp/sg11.patch.xz.b64 | sha256sum -c -
          base64 -d /tmp/sg11.patch.xz.b64 > /tmp/sg11.patch.xz
          test "$(wc -c < /tmp/sg11.patch.xz)" -eq 20592
          printf '%s  %s\n' 4e92e576a104df8397cb972d129e46f16c7158e9d24c6780ef17d7548eef3e5f /tmp/sg11.patch.xz | sha256sum -c -
          xz -dc /tmp/sg11.patch.xz > /tmp/sg11.patch
          test "$(wc -c < /tmp/sg11.patch)" -eq 124901
          printf '%s  %s\n' 2b550f334cb635fa1daf6aa16f59bd83852e77b15a97a30ad4245643b7701dc3 /tmp/sg11.patch | sha256sum -c -
      - name: Apply exact non-workflow patch to isolated staging branch
        env:
          STAGING_BRANCH: agent/sg11-nonworkflow-staging
          EXPECTED_HEAD: 4a0cf108098789f93732b829fc5a5e4ea152f28b
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$STAGING_BRANCH"
          lease="$(git ls-remote origin "refs/heads/$STAGING_BRANCH" | awk '{print $1}')"
          test "$lease" = "$EXPECTED_HEAD"
          git switch -C sg11-staging "origin/$STAGING_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git show -s --format=%P HEAD)" = "2362f4357bf58d388dad11f38bcac62f580ce89b 04649fafcc517c0d7eef6279818dd309366eb49b"
          git apply --check --index /tmp/sg11.patch
          git apply --index /tmp/sg11.patch
          cat > /tmp/expected <<'PATHS'
build/core-thesis/status-sovereignty/data.json
build/core-thesis/status-sovereignty/manifest.json
build/core-thesis/status-sovereignty/wave-02-second-party-review/data.json
build/core-thesis/status-sovereignty/wave-02-second-party-review/manifest.json
data/project/poof-clifford-ecology-release-manifest.json
data/project/project-stable-ground-current.json
data/project/project-stable-ground-sg11-release-manifest.json
data/project/project-stable-ground-sg11.json
data/project/status-sovereignty-release-manifest.json
data/project/status-sovereignty-wave-02-second-party-review-release-manifest.json
docs/milestones/project-stable-ground-sg11.md
package.json
reports/core-thesis/poof-clifford-ecology/release-manifest.json
reports/core-thesis/stable-ground/sg11/checkpoint.json
reports/core-thesis/stable-ground/sg11/index.html
reports/core-thesis/status-sovereignty/data.json
reports/core-thesis/status-sovereignty/index.html
reports/core-thesis/status-sovereignty/wave-02-second-party-review/data.json
reports/core-thesis/status-sovereignty/wave-02-second-party-review/index.html
test/project-stable-ground-sg10.test.js
test/project-stable-ground-sg11.test.js
tools/build-project-stable-ground-sg10.mjs
tools/build-project-stable-ground-sg11.mjs
tools/validate-project-stable-ground-sg10.mjs
tools/validate-project-stable-ground-sg11.mjs
PATHS
          sort -o /tmp/expected /tmp/expected
          git diff --cached --name-only | sort > /tmp/observed
          diff -u /tmp/expected /tmp/observed
          test "$(wc -l < /tmp/observed)" -eq 25
          ! grep -Eq '^\.github/(tmp/|workflows/)' /tmp/observed
      - name: Install exact permanent workflow bytes for validation only
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 -d > .github/workflows/project-stable-ground-sg10.yml
          printf '%s' '' | base64 -d > .github/workflows/project-stable-ground-sg11.yml
      - name: Validate focused campaign and stable-ground chain
        run: |
          set -Eeuo pipefail
          node tools/build-status-sovereignty-wave-02-second-party-review.mjs
          node tools/validate-status-sovereignty-wave-02-second-party-review.mjs
          node test/status-sovereignty-wave-02-second-party-review.test.js
          node tools/validate-project-stable-ground-sg10.mjs
          node test/project-stable-ground-sg10.test.js
          node tools/build-project-stable-ground-sg11.mjs
          node tools/validate-project-stable-ground-sg11.mjs
          node test/project-stable-ground-sg11.test.js
          test "$(jq -r '.current_checkpoint_id' data/project/project-stable-ground-current.json)" = SG-2026-08-01-11
          test "$(jq -r '.combined_sha256' data/project/status-sovereignty-wave-02-second-party-review-release-manifest.json)" = 5690fb91f6d686d0c5b080ab30621e277d0efbe5fbdf4e336e6ac7219d26e0c5
          test "$(jq -r '.combined_sha256' data/project/status-sovereignty-release-manifest.json)" = f9362122c76960c23a4572514a7be3650c672d920a40fb1654dfefecb59103bb
          test "$(jq -r '.combined_sha256' data/project/poof-clifford-ecology-release-manifest.json)" = 042f6bad908db435b9071f25be7c4072d4570da182c5132ff64ab501dc897d8a
          test "$(jq -r '.combined_sha256' data/project/project-stable-ground-sg11-release-manifest.json)" = 2c6b9b593e6f22334e628fb5a8b596740a0cc525cd698f79aae9701d908bb881
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Restore volatile products and prove exact permanent denominator
        run: |
          set -Eeuo pipefail
          cat > /tmp/volatile <<'PATHS'
build/axm-identity.json
build/build-hop-report.json
build/hop-graph.json
build/migration-review.md
build/migration-summary.json
build/receipt-graph.json
build/scores.json
build/scout-report.json
build/scout-report.md
build/surface-graph.json
PATHS
          xargs -d '\n' git restore --worktree --source=HEAD -- < /tmp/volatile
          printf '%s\n' .github/workflows/project-stable-ground-sg10.yml > /tmp/expected-unstaged
          git diff --name-only | sort > /tmp/observed-unstaged
          diff -u /tmp/expected-unstaged /tmp/observed-unstaged
          printf '%s\n' .github/workflows/project-stable-ground-sg11.yml > /tmp/expected-untracked
          git ls-files --others --exclude-standard | sort > /tmp/observed-untracked
          diff -u /tmp/expected-untracked /tmp/observed-untracked
          git diff --cached --name-only | sort > /tmp/observed-after
          diff -u /tmp/expected /tmp/observed-after
      - name: Publish workflow-neutral staging commit
        env:
          STAGING_BRANCH: agent/sg11-nonworkflow-staging
          EXPECTED_HEAD: 4a0cf108098789f93732b829fc5a5e4ea152f28b
        run: |
          set -Eeuo pipefail
          git restore --worktree --source=HEAD -- .github/workflows/project-stable-ground-sg10.yml
          rm -f .github/workflows/project-stable-ground-sg11.yml
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | sort > /tmp/observed-final
          diff -u /tmp/expected /tmp/observed-final
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Stage SG-11 current-main checkpoint products'
          git push --force-with-lease="refs/heads/$STAGING_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "staging_sha=$(git rev-parse HEAD)"
          echo "staging_tree=$(git show -s --format=%T HEAD)"
