name: Temporary stage SG-11 non-workflow estate

on:
  push:
    branches: [agent/sg11-nonworkflow-materializer]
    paths:
      - '.github/tmp/sg11-nonworkflow-25.patch.xz.b64'
      - '.github/workflows/temporary-stage-sg11-nonworkflow.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp/sg11-nonworkflow-25.patch.xz.b64'
      - '.github/workflows/temporary-stage-sg11-nonworkflow.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sg11-nonworkflow-materializer
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sg11-nonworkflow-materializer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and reconstruct exact patch
        run: |
          set -Eeuo pipefail
          carrier=.github/tmp/sg11-nonworkflow-25.patch.xz.b64
          test "$(wc -c < "$carrier")" -eq 12936
          printf '%s  %s\n' 83d7dcfbb25401fbedb743ce76bf67f339c4fcfa1fd87167923c1fc60bc62e8c "$carrier" | sha256sum -c -
          base64 -d "$carrier" > /tmp/sg11.patch.xz
          test "$(wc -c < /tmp/sg11.patch.xz)" -eq 9700
          printf '%s  %s\n' 7ba2f4c7ee76a442eeffc616a42aa458c1545acceb62e41528474268801d9b5e /tmp/sg11.patch.xz | sha256sum -c -
          xz -dc /tmp/sg11.patch.xz > /tmp/sg11.patch
          test "$(wc -c < /tmp/sg11.patch)" -eq 59953
          printf '%s  %s\n' 1df39c498fc33d049bbf246bbdfde845d44e56d262e293ee28ef5bc8490fecae /tmp/sg11.patch | sha256sum -c -
      - name: Apply exact non-workflow patch to isolated staging branch
        env:
          STAGING_BRANCH: agent/sg11-nonworkflow-staging
          EXPECTED_HEAD: 2467d3dbf647738391ece602da77dc93f05dc697
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$STAGING_BRANCH"
          lease="$(git ls-remote origin "refs/heads/$STAGING_BRANCH" | awk '{print $1}')"
          test "$lease" = "$EXPECTED_HEAD"
          git switch -C sg11-staging "origin/$STAGING_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check --index /tmp/sg11.patch
          git apply --index /tmp/sg11.patch
          cat > /tmp/expected <<'PATHS'
build/core-thesis/status-sovereignty/data.json
build/core-thesis/status-sovereignty/manifest.json
build/core-thesis/status-sovereignty/wave-02-second-party-review/data.json
build/core-thesis/status-sovereignty/wave-02-second-party-review/manifest.json
data/project/poof-clifford-ecology-release-manifest.json
data/project/project-stable-ground-current.json
data/project/project-stable-ground-sg11-release-manifest.json
data/project/project-stable-ground-sg11.json
data/project/status-sovereignty-release-manifest.json
data/project/status-sovereignty-wave-02-second-party-review-release-manifest.json
docs/milestones/project-stable-ground-sg11.md
package.json
reports/core-thesis/poof-clifford-ecology/release-manifest.json
reports/core-thesis/stable-ground/sg11/checkpoint.json
reports/core-thesis/stable-ground/sg11/index.html
reports/core-thesis/status-sovereignty/data.json
reports/core-thesis/status-sovereignty/index.html
reports/core-thesis/status-sovereignty/wave-02-second-party-review/data.json
reports/core-thesis/status-sovereignty/wave-02-second-party-review/index.html
test/project-stable-ground-sg10.test.js
test/project-stable-ground-sg11.test.js
tools/build-project-stable-ground-sg10.mjs
tools/build-project-stable-ground-sg11.mjs
tools/validate-project-stable-ground-sg10.mjs
tools/validate-project-stable-ground-sg11.mjs
PATHS
          sort -o /tmp/expected /tmp/expected
          git diff --cached --name-only | sort > /tmp/observed
          diff -u /tmp/expected /tmp/observed
          test "$(wc -l < /tmp/observed)" -eq 25
          ! grep -Eq '^\.github/(tmp/|workflows/)' /tmp/observed
      - name: Validate against exact permanent workflow bytes
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 -d > .github/workflows/project-stable-ground-sg10.yml
          printf '%s' '' | base64 -d > .github/workflows/project-stable-ground-sg11.yml
          printf '%s  %s\n' 2ad6fb794029ea5c6dafe0116cbaf9de415c6cebeaa0e21c16d13bb6fafc9693 .github/workflows/project-stable-ground-sg10.yml | sha256sum -c -
          printf '%s  %s\n' 7423b2166dd8055d7bb25b6f170c1fc6cd4f0d84f0c91fbc6f53070a5c7e5ac8 .github/workflows/project-stable-ground-sg11.yml | sha256sum -c -
          npm run build:status-sovereignty
          npm run validate:status-sovereignty
          node test/status-sovereignty-wave-02-second-party-review.test.js
          npm run build:poof-ecology
          npm run validate:poof-ecology
          node tools/validate-project-stable-ground-sg10.mjs
          node test/project-stable-ground-sg10.test.js
          node tools/build-project-stable-ground-sg11.mjs
          node tools/validate-project-stable-ground-sg11.mjs
          node test/project-stable-ground-sg11.test.js
          test "$(jq -r '.combined_sha256' data/project/status-sovereignty-wave-02-second-party-review-release-manifest.json)" = 5690fb91f6d686d0c5b080ab30621e277d0efbe5fbdf4e336e6ac7219d26e0c5
          test "$(jq -r '.combined_sha256' data/project/status-sovereignty-release-manifest.json)" = f9362122c76960c23a4572514a7be3650c672d920a40fb1654dfefecb59103bb
          test "$(jq -r '.combined_sha256' data/project/poof-clifford-ecology-release-manifest.json)" = 042f6bad908db435b9071f25be7c4072d4570da182c5132ff64ab501dc897d8a
          test "$(jq -r '.combined_sha256' data/project/project-stable-ground-sg11-release-manifest.json)" = 2798c3015fe6f3790d022eea82075e31e02371b243db3eab991ed20372c9937f
          git diff --cached --name-only | sort > /tmp/observed-after
          diff -u /tmp/expected /tmp/observed-after
          unstaged="$(git diff --name-only | sort)"
          expected_unstaged=$(printf '%s\n' .github/workflows/project-stable-ground-sg10.yml .github/workflows/project-stable-ground-sg11.yml | sort)
          test "$unstaged" = "$expected_unstaged"
      - name: Remove validation-only workflow bytes and publish staging commit
        env:
          STAGING_BRANCH: agent/sg11-nonworkflow-staging
          EXPECTED_HEAD: 2467d3dbf647738391ece602da77dc93f05dc697
        run: |
          set -Eeuo pipefail
          git restore --worktree .github/workflows/project-stable-ground-sg10.yml
          rm .github/workflows/project-stable-ground-sg11.yml
          test -z "$(git diff --name-only)"
          git diff --cached --name-only | sort > /tmp/observed-final
          diff -u /tmp/expected /tmp/observed-final
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Stage SG-11 non-workflow estate'
          git push --force-with-lease="refs/heads/$STAGING_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "staging_sha=$(git rev-parse HEAD)"
          echo "staging_tree=$(git show -s --format=%T HEAD)"
