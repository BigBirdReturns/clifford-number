name: M-04D fog-resolution wave 02

on:
  pull_request:
    paths:
      - 'data/intake/m04d-fog-resolution-wave-02.json'
      - 'docs/milestones/m04d-fog-resolution-wave-02.md'
      - 'test/m04d-fog-resolution-wave-02.test.js'
      - '.github/workflows/m04d-fog-resolution-wave-02.yml'
  push:
    branches: [main]
    paths:
      - 'data/intake/m04d-fog-resolution-wave-02.json'
      - 'docs/milestones/m04d-fog-resolution-wave-02.md'
      - 'test/m04d-fog-resolution-wave-02.test.js'
      - '.github/workflows/m04d-fog-resolution-wave-02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate phase bridges and ICE system non-link
        run: node test/m04d-fog-resolution-wave-02.test.js
      - name: Run complete repository release gate
        run: npm run release:check
