name: NEVER MERGE materialize M-05 repository-tree custody

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m05-stage-receipt-tree-custody-materializer.yml'
      - '.m05-stage-tree-custody-hardening/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-stage-tree-custody-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Replace product bytes with the hardened exact revision
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='cdc9d3670fb226e92ff90952c3f8a4392c532a26'
          EXPECTED_TREE='55ce861e8971bfc258b206acb4eb6a911c5ef0be'
          TARGET='agent/m05-s03-l7-stage-receipt-repository-tree-custody-v1'
          PAYLOAD_SHA256='880e334718428a184594feee380c4e3f84a072d07781fb8d7d23e66bc914536f'
          CONTRACT='data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-repository-tree-custody-amendment.json'
          TEST='test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-repository-tree-custody-amendment.test.js'
          VALIDATOR='tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-repository-tree-custody-amendment.mjs'
          REGISTRY='data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-registry.json'
          WORKFLOW='.github/workflows/m05-intel-realization-stage-receipt-repository-tree-custody-amendment.yml'

          git fetch --prune origin main "$TARGET"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse origin/$TARGET:$REGISTRY)" = '6d5a7f263e50716835af457b6fa82927711459fa'
          test "$(git rev-parse origin/$TARGET:$WORKFLOW)" = 'dc5bf79d77ad15d0ea9692d0b24a6636e6e93b15'
          test "$(git rev-parse origin/$TARGET:$CONTRACT)" = 'c5bbabaf13d61d2cee4095d5e88bed83664010ab'
          test "$(git rev-parse origin/$TARGET:$VALIDATOR)" = '9278910e81798b2e004fe576a1ce0c6cf2a35a93'
          test "$(git rev-parse origin/$TARGET:$TEST)" = '82af0716569874da53498bbd1338242d8aa54a28'

          mkdir -p /tmp/m05-stage-tree-custody-hardening
          cat .m05-stage-tree-custody-hardening/payload-*.b64 | tr -d '\n' | base64 --decode > /tmp/m05-stage-tree-custody-hardening/payload.zip
          echo "$PAYLOAD_SHA256  /tmp/m05-stage-tree-custody-hardening/payload.zip" | sha256sum -c -
          unzip -q /tmp/m05-stage-tree-custody-hardening/payload.zip -d /tmp/m05-stage-tree-custody-hardening/product
          test "$(git hash-object /tmp/m05-stage-tree-custody-hardening/product/$CONTRACT)" = '353266ad3412f415b227f16bf4a1bdb342b51f15'
          test "$(git hash-object /tmp/m05-stage-tree-custody-hardening/product/$VALIDATOR)" = '54b27caceeeb18b90ef0a15cde003ea8716699c7'
          test "$(git hash-object /tmp/m05-stage-tree-custody-hardening/product/$TEST)" = 'ccd1d313e3e653dfa05676736962acfc48ab4ee6'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$TARGET" "origin/$TARGET"
          cp -a /tmp/m05-stage-tree-custody-hardening/product/. .
          git add -- "$CONTRACT" "$TEST" "$VALIDATOR"
          printf '%s\n' "$CONTRACT" "$TEST" "$VALIDATOR" | LC_ALL=C sort > /tmp/expected
          git diff --cached --name-only | LC_ALL=C sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --cached --check
          node --check "$VALIDATOR"
          node --check "$TEST"
          node "$TEST"
          git commit -m '[M-05 S03-L7] Harden repository-tree custody admission'
          git push origin "HEAD:refs/heads/$TARGET"
