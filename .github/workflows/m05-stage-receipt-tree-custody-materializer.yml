name: NEVER MERGE materialize M-05 repository-tree custody

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m05-stage-receipt-tree-custody-materializer.yml'
      - '.m05-stage-tree-custody-materializer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m05-stage-tree-custody-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Reconstruct and publish exact non-workflow product objects
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='cdc9d3670fb226e92ff90952c3f8a4392c532a26'
          EXPECTED_TREE='55ce861e8971bfc258b206acb4eb6a911c5ef0be'
          TARGET='agent/m05-s03-l7-stage-receipt-repository-tree-custody-v1'
          PAYLOAD_SHA256='728c393fbbb527481424758f73876a563b69970b66dc3d6d31e7f4758d469ee2'
          REGISTRY='data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-control-stack-registry.json'
          CONTRACT='data/project/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-repository-tree-custody-amendment.json'
          TEST='test/m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-repository-tree-custody-amendment.test.js'
          VALIDATOR='tools/validate-m05-answerable-power-sprint-03-leg-07-intel-realization-stage-receipt-repository-tree-custody-amendment.mjs'

          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main^{tree})" = "$EXPECTED_TREE"
          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi

          mkdir -p /tmp/m05-stage-tree-custody
          cat .m05-stage-tree-custody-materializer/payload-*.b64 | tr -d '\n' | base64 --decode > /tmp/m05-stage-tree-custody/payload.zip
          echo "$PAYLOAD_SHA256  /tmp/m05-stage-tree-custody/payload.zip" | sha256sum -c -
          unzip -q /tmp/m05-stage-tree-custody/payload.zip -d /tmp/m05-stage-tree-custody/product

          test "$(git hash-object /tmp/m05-stage-tree-custody/product/$REGISTRY)" = '6d5a7f263e50716835af457b6fa82927711459fa'
          test "$(git hash-object /tmp/m05-stage-tree-custody/product/$CONTRACT)" = 'c5bbabaf13d61d2cee4095d5e88bed83664010ab'
          test "$(git hash-object /tmp/m05-stage-tree-custody/product/$TEST)" = '82af0716569874da53498bbd1338242d8aa54a28'
          test "$(git hash-object /tmp/m05-stage-tree-custody/product/$VALIDATOR)" = '9278910e81798b2e004fe576a1ce0c6cf2a35a93'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach "$EXPECTED_BASE"
          git switch -c "$TARGET"
          cp -a /tmp/m05-stage-tree-custody/product/. .
          git add -- "$REGISTRY" "$CONTRACT" "$TEST" "$VALIDATOR"
          mapfile -t ACTUAL < <(git diff --cached --name-only | LC_ALL=C sort)
          EXPECTED=("$CONTRACT" "$REGISTRY" "$TEST" "$VALIDATOR")
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort)
          test "${#ACTUAL[@]}" -eq 4
          test "$(printf '%s\n' "${ACTUAL[@]}")" = "$(printf '%s\n' "${EXPECTED_SORTED[@]}")"
          git diff --cached --check
          node --check "$VALIDATOR"
          node --check "$TEST"
          git commit -m '[M-05 S03-L7] Materialize repository-tree custody product'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git push origin "HEAD:refs/heads/$TARGET"
