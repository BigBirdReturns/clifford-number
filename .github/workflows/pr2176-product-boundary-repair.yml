name: Temporary PR2176 product boundary repair

on:
  push:
    branches:
      - agent/dentsu-industrial-exhaust-review-fixes
    paths:
      - .github/workflows/pr2176-product-boundary-repair.yml

permissions:
  contents: write

concurrency:
  group: temporary-pr2176-product-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/dentsu-industrial-exhaust-review-fixes
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and verify the product repair
        shell: bash
        run: |
          set -euo pipefail
          expected_remote_head="$(git rev-parse HEAD)"

          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count was {count}, expected 1')
              return text.replace(old, new, 1)

          library_path = Path('tools/lib/industrial-exhaust.mjs')
          library = library_path.read_text(encoding='utf-8')

          old_dotted = r'''function isDottedContactContinuation(value, separator, groups, index) {
            const normalizedTail = normalizedWrappedNumericTail(value);
            if (/^(?:19|20)\d{2}$/u.test(normalizedTail)) return false;
            if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(separator.normalize('NFKC'))) {
              return false;
            }
            if (/^\d{3,4}$/u.test(normalizedTail)) return true;
            if (!/^\d{2}$/u.test(normalizedTail) || index < 3) return false;
            return groups.slice(index - 3, index + 1).every(group =>
              /^\d{2}$/u.test(group[0].normalize('NFKC'))
            );
          }'''
          old_dotted = dedent(old_dotted)
          new_dotted = r'''function isDottedContactContinuation(value, separator, groups, index, contextualTail) {
            const normalizedTail = normalizedWrappedNumericTail(value);
            const normalizedSeparator = separator.normalize('NFKC');
            if (/^(?:19|20)\d{2}$/u.test(normalizedTail)) return false;
            if (!/^(?:\s*\)\s*)?\.\s*(?:\(\s*)?$/u.test(normalizedSeparator)) return false;
            if (/\(\s*$/u.test(normalizedSeparator)
                && hasNarrativeNumericContinuation(contextualTail)) return false;
            if (/^\d{3,4}$/u.test(normalizedTail)) return true;
            if (!/^\d{2}$/u.test(normalizedTail) || index < 3) return false;
            return groups.slice(index - 3, index + 1).every(group =>
              /^\d{2}$/u.test(group[0].normalize('NFKC'))
            );
          }'''
          new_dotted = dedent(new_dotted)
          library = replace_once(library, old_dotted, new_dotted, 'dotted continuation')

          old_call = 'isDottedContactContinuation(tail, separator, groups, index)'
          new_call = 'isDottedContactContinuation(tail, separator, groups, index, contextualTail)'
          if library.count(old_call) != 2:
              raise SystemExit(f'dotted continuation call count was {library.count(old_call)}, expected 2')
          library = library.replace(old_call, new_call)

          old_callback = (
              "  const phoneRedacted = emailRedacted.replace(PHONE_SPAN_PATTERN, (candidate, offset, input) => {\n"
              "    const prefix = redactionPrefixContext(input, offset);\n"
              "    const suffix = input.slice(offset + candidate.length, offset + candidate.length + 64);\n"
              "    const previousCharacter = Array.from(prefix).at(-1) ?? '';\n"
              "    const allowInitialGroup = !/[\\p{L}\\p{N}]/u.test(previousCharacter) || hasPhoneLabelPrefix(prefix);\n"
              "    return redactPhoneSubspans(candidate, prefix, suffix, allowInitialGroup);\n"
              "  });"
          )
          new_callback = (
              "  const phoneRedacted = emailRedacted.replace(PHONE_SPAN_PATTERN, (candidate, offset, input) => {\n"
              "    const firstContactCharacter = candidate.search(/[+＋(（0-9０-９]/u);\n"
              "    const contactOffset = offset + Math.max(0, firstContactCharacter);\n"
              "    const prefix = redactionPrefixContext(input, contactOffset);\n"
              "    const suffix = input.slice(offset + candidate.length, offset + candidate.length + 64);\n"
              "    const adjacentCharacter = Array.from(input.slice(0, contactOffset)).at(-1) ?? '';\n"
              "    const allowInitialGroup = !/[\\p{L}\\p{N}]/u.test(adjacentCharacter) || hasPhoneLabelPrefix(prefix);\n"
              "    return redactPhoneSubspans(candidate, prefix, suffix, allowInitialGroup);\n"
              "  });"
          )
          library = replace_once(library, old_callback, new_callback, 'phone callback')
          library_path.write_text(library, encoding='utf-8')

          test_path = Path('test/industrial-exhaust.test.js')
          tests = test_path.read_text(encoding='utf-8')

          adjacency_marker = 'for (const compactNumericIdentifier of ['
          if tests.count(adjacency_marker) != 1:
              raise SystemExit('compact identifier marker must appear exactly once')
          adjacency_tests = dedent('''\
          for (const [input, expected] of [
            ['Call 03-6216-5111', 'Call [contact omitted]'],
            ['Call 09012345678', 'Call [contact omitted]'],
            ['Phone: 03 6216 5111 or 090-1234-5678', 'Phone: [contact omitted] or [contact omitted]']
          ]) {
            assert.equal(
              redactContactData(input),
              expected,
              'phone eligibility must be evaluated at the actual first phone marker rather than leading matched whitespace'
            );
          }
          assert.equal(
            redactContactData('release09012345678'),
            'release09012345678',
            'a compact phone-shaped identifier attached to prose must remain intact'
          );

          ''')
          tests = tests.replace(adjacency_marker, adjacency_tests + adjacency_marker, 1)

          parenthetical_marker = dedent('''\
          assert.equal(
            redactContactData('Tel: +44 20 7123. 4567'),''')
          if tests.count(parenthetical_marker) != 1:
              raise SystemExit('dotted phone control marker must appear exactly once')
          parenthetical_tests = dedent('''\
          assert.equal(
            redactContactData('Contact +33 1 42 68 53. (00) attendees joined.'),
            'Contact [contact omitted]. (00) attendees joined.',
            'parenthesized narrative evidence must override dotted pair-group continuation'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53．（００） attendees joined.'),
            'Contact [contact omitted]．（００） attendees joined.',
            'fullwidth parenthesized narrative evidence must override dotted pair-group continuation'
          );
          assert.equal(
            redactContactData('Tel: +44 20 7123 4567 ext 12 34 56 78. (00) attendees joined.'),
            'Tel: [contact omitted] ext [contact omitted]. (00) attendees joined.',
            'parenthesized narrative evidence must remain outside a dotted pair-group extension'
          );
          assert.equal(
            redactContactData('Contact +33 1 42 68 53. (00)'),
            'Contact [contact omitted]',
            'a parenthesized two-digit tail without narrative continuation may remain contact formatting'
          );

          ''')
          tests = tests.replace(parenthetical_marker, parenthetical_tests + parenthetical_marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          node --check tools/lib/industrial-exhaust.mjs
          node --check tools/crawl-industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          node test/industrial-exhaust.test.js
          git diff --check

          rm .github/workflows/pr2176-product-boundary-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js .github/workflows/pr2176-product-boundary-repair.yml
          git diff --cached --check
          git commit -m "fix(crawler): honor true phone boundaries"
          git push --force-with-lease="refs/heads/agent/dentsu-industrial-exhaust-review-fixes:${expected_remote_head}" origin HEAD:refs/heads/agent/dentsu-industrial-exhaust-review-fixes
