name: Temporary SG-02 materialization

on:
  push:
    branches: [agent/project-stable-ground-sg02]
    paths:
      - '.github/workflows/temporary-project-stable-ground-sg02-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-ground-sg02-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-stable-ground-sg02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate SG-02
        run: |
          node tools/build-project-stable-ground-sg02.mjs
          node tools/validate-project-stable-ground-sg02.mjs
          node test/project-stable-ground-sg02.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Commit deterministic products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/project/project-stable-ground-sg02-release-manifest.json \
            reports/core-thesis/stable-ground/sg02/checkpoint.json \
            reports/core-thesis/stable-ground/sg02/index.html
          if git diff --cached --quiet; then
            echo "SG-02 products already deterministic"
            exit 0
          fi
          git commit -m "Materialize stable-ground SG-02 products"
          git push origin HEAD:agent/project-stable-ground-sg02
