name: TEMP publish qualified exact PC-51 repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pc51-consolidated-executor-final
  cancel-in-progress: true

jobs:
  publish-qualified-product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout execution carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: carrier
          fetch-depth: 0

      - name: Checkout exact qualified PC-51 product
        uses: actions/checkout@v4
        with:
          ref: 7802dcc91ca45d564a72f87c99183a6ed196e6fb
          path: product
          fetch-depth: 0

      - name: Reconstruct and verify the previously qualified repair
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/pc51-consolidated-publication
          python carrier/.pc51-carrier/consolidated_repair.py patch product \
            2>&1 | tee /tmp/pc51-consolidated-publication/patch.log
          git -C product diff --check
          git -C product diff --binary \
            > /tmp/pc51-consolidated-publication/repair.patch
          git -C product diff --name-status \
            > /tmp/pc51-consolidated-publication/repair-paths.txt
          printf '%s\n' \
            'qualified_run_1=31132403468' \
            'qualified_artifact_1=8976711382' \
            'qualified_artifact_1_digest=sha256:f8717d61b4fb9e7bcd7b3ad40fac201679414f3e0eedeea24de1aecbe15be99f' \
            'qualified_run_2=31133032265' \
            'qualified_artifact_2=8976981435' \
            'qualified_artifact_2_digest=sha256:8fb83ed75ca54f7d1b8fb87f906f9e1109e6e244faa902436e10c6da6cf50472' \
            'qualification=direct-clean-checkout+focused-pc51+all-preference-custody-floors+no-magic-human+complete-release-gate' \
            > /tmp/pc51-consolidated-publication/prior-qualification.txt

      - name: Publish exact one-parent fourteen-path head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python carrier/.pc51-carrier/consolidated_repair.py publish \
            product /tmp/pc51-consolidated-publication \
            2>&1 | tee /tmp/pc51-consolidated-publication/publication.log

      - name: Record publication on PC-51 issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          COMMIT=$(cat /tmp/pc51-consolidated-publication/new-product-commit.txt)
          TREE=$(cat /tmp/pc51-consolidated-publication/new-product-tree.txt)
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GH_REPOSITORY}/issues/1268/comments" \
            -f body="PC-51 exact repaired product published: commit \`${COMMIT}\`; tree \`${TREE}\`; transport run \`${RUN_ID}\`. Exact repaired bytes previously passed exhaustive qualification in runs \`31132403468\` and \`31133032265\`; artifacts \`8976711382\` and \`8976981435\`. One parent, fourteen permanent paths, four repaired files, no outside-human dependency, graph effect none. Product-head workflows remain authoritative for merge."

      - name: Upload publication custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc51-consolidated-publication-final
          path: /tmp/pc51-consolidated-publication
          if-no-files-found: error
          retention-days: 90
