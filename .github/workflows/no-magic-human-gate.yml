name: No magic human gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pc59-terminal-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate nonblocking external-participation law
        run: |
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js

  recover-pc59-terminal-proof-and-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/pc59-terminal-recovery-v3'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      API_URL: ${{ github.api_url }}
      CARRIER_PARENT: 'cffe670fef5c006c7e963421d9fd18c29ed40fba'
      CARRIER_PATH: '.github/workflows/no-magic-human-gate.yml'
      CONTROLLER_BLOB: 'de263ca08bcd1af895b3df34c1081c1d1df43b7d'
      CONTROLLER_GZIP_SHA256: 'materialize-from-exact-git-object'
      CONTROLLER_SHA256: '93e91097ed1eefc0bb251cdfc7f3a324676b2020a585905468999550425c490c'
      ISSUE: '1662'
      PRODUCT_PR: '1731'
      PRODUCT: '80a9898890c2a8b271d4d36f74d37c1975149b25'
      PRODUCT_PARENT: 'a592acea22c69a979f2a90c24a2bafb8c9445759'
      PRODUCT_PARENT_TREE: 'c7dbb1df10b409caa7893846a9e4b3e8d1392be0'
      PRODUCT_TREE: '9057a3daca6e8420c83652d5ba2669c2f2ae34a5'
      MERGE: 'cffe670fef5c006c7e963421d9fd18c29ed40fba'
      MERGE_FIRST_EXPECTED: 'aa1c0c3f741bf2fb7aa923a4008e5bc927dca032'
      EXPECTED_MATRIX: '53'
      CODEX_REQUEST_COMMENT: '5232899476'
      CODEX_COMMIT_PREFIX: '80a9898890'
      QUALIFIER_RUN: '31294560504'
      QUALIFIER_HEAD: '5886d3c87bf3d083b6de6c376579067952018c0a'
      QUALIFIER_ARTIFACT: '9032608869'
      QUALIFIER_DIGEST: 'sha256:6882402385ebd8014c5cfc8a7c2a94cf77d1acc9b00b0198662f08f541452037'
      PUBLICATION_RUN: '31327408812'
      PUBLICATION_HEAD: 'afb990c64b598842931e6e54bd864ddfb164fe32'
      PUBLICATION_ARTIFACT: '9041921964'
      PUBLICATION_DIGEST: 'sha256:63f8c960826b8ba60187f274b3375ebe969e2e8dcac172b95cca4c9cc4e23cfd'
      PACKAGE_RUN: '31327561157'
      PACKAGE_HEAD: '00065a7cff3eebad46c7bbcf3533d4b25477d0bd'
      PACKAGE_ARTIFACT: '9041961136'
      PACKAGE_DIGEST: 'sha256:ab51add6b58db7028a4b9003ae8592d7311bd807646e505695fe0c835efacd17'
      ARCHIVE_SHA256: '8a56d6209fba1a451cf733cf2d67b2e6dcc37e45209d70d340576773e5f7eef0'
      MANIFEST_SHA256: 'e209ea8ba3d59849c24d4f217251b0053c71d559e838bc7f2968881f70942ee3'
      FAILED_SUPERVISOR_RUN: '31328404859'
      FAILED_SUPERVISOR_JOB: '93282546575'
      FAILED_SUPERVISOR_HEAD: '7a5e1be9fb812ff27e3ec506aa5947d43cac29a9'
      FAILED_RECOVERY_RUN: '31329468305'
      FAILED_RECOVERY_JOB: '93285283293'
      FAILED_RECOVERY_HEAD: 'fb4cfa1ff6c6c49789bef027aa168cc93dff03e5'
      RESOLVED_FRONTIER: 'linkage_interval_repository_owner_login_canonical_profile_api_location_account_type_state_and_suspension_governance'
      NEXT_FRONTIER_ONE: 'linkage_interval_repository_owner_login_normalization_alias_case_history_and_location_pair_governance'
      NEXT_FRONTIER_TWO: 'linkage_interval_owner_account_type_active_suspended_deleted_ghost_restoration_site_admin_and_metadata_governance'
      PROOF_DIR: '/tmp/pc59-exact-postmerge-proof'
      CENSUS_DIR: '/tmp/pc59-terminal-census'
      PACKAGE_DIR: '/tmp/pc59-complete-product-package'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticate exact remote Git object and materialize recovery controller
        shell: bash
        run: |
          set -Eeuo pipefail
          blob_json=/tmp/pc59-terminal-recovery-controller.blob.json
          gzip_path=/tmp/pc59-terminal-recovery-controller.sh.gz
          script_path=/tmp/pc59-terminal-recovery-controller.sh

          gh api "/repos/${GH_REPOSITORY}/git/blobs/${CONTROLLER_BLOB}" > "$blob_json"
          test "$(jq -r .sha "$blob_json")" = "$CONTROLLER_BLOB"
          jq -r .content "$blob_json" | tr -d '\n' | base64 -d > "$gzip_path"
          test "$(git hash-object "$gzip_path")" = "$CONTROLLER_BLOB"
          test "$(wc -c < "$gzip_path" | tr -d ' ')" = "$(jq -r .size "$blob_json")"
          gzip -t "$gzip_path"

          actual_gzip_sha256="$(sha256sum "$gzip_path" | awk '{print $1}')"
          printf '%s  %s\n' "$actual_gzip_sha256" "$(basename "$gzip_path")" > /tmp/pc59-terminal-recovery-controller-gzip.sha256
          echo "CONTROLLER_GZIP_SHA256=$actual_gzip_sha256" >> "$GITHUB_ENV"
          echo "exact remote controller gzip SHA-256: $actual_gzip_sha256"

          gzip -dc "$gzip_path" > "$script_path"
          test "$(sha256sum "$script_path" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          chmod +x "$script_path"
          bash -n "$script_path"
      - name: Bind canonical product, failed supervisors, sealed package, matrix, and review
        run: /tmp/pc59-terminal-recovery-controller.sh bind
      - name: Recover exact canonical merge without another merge operation
        id: merge
        run: /tmp/pc59-terminal-recovery-controller.sh merge
      - name: Reprove canonical topology, fourteen blobs, and complete replay
        env:
          MERGE: ${{ steps.merge.outputs.merge }}
        run: /tmp/pc59-terminal-recovery-controller.sh proof
      - name: Upload recovered exact PC-59 post-merge proof
        id: proof
        uses: actions/upload-artifact@v4
        with:
          name: pc59-exact-postmerge-proof
          path: /tmp/pc59-exact-postmerge-proof
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retire every PC-59 transaction surface and seal census
        env:
          MERGE: ${{ steps.merge.outputs.merge }}
          PROOF_ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          PROOF_ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
        run: /tmp/pc59-terminal-recovery-controller.sh cleanup
      - name: Upload PC-59 terminal census
        id: census
        uses: actions/upload-artifact@v4
        with:
          name: pc59-terminal-census
          path: /tmp/pc59-terminal-census
          if-no-files-found: error
          retention-days: 90
      - name: Write durable PC-59 terminal receipt and close issue
        env:
          MERGE: ${{ steps.merge.outputs.merge }}
          PROOF_ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          PROOF_ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
          CENSUS_ARTIFACT_ID: ${{ steps.census.outputs.artifact-id }}
          CENSUS_ARTIFACT_DIGEST: ${{ steps.census.outputs.artifact-digest }}
        run: /tmp/pc59-terminal-recovery-controller.sh receipt
