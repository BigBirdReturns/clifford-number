name: No magic human gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: no-magic-human-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned JSON Schema validator
        if: github.head_ref == 'agent/ssc-rd04-mf7-row-state-existing-gate-materializer-v5'
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.25.1'
      - name: Validate nonblocking external-participation law
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RD04_MF7_EXECUTE: ${{ github.head_ref == 'agent/ssc-rd04-mf7-row-state-existing-gate-materializer-v5' && '1' || '0' }}
          RD04_MF7_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
