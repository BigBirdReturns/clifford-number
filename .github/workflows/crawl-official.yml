name: Official-record intake

# Discovery only. This workflow may append neutral observations and candidates.
# It never edits canonical ledgers, cases, identities, surfaces, scores, or UI.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      max_records:
        description: Maximum new immutable observations
        default: '100'

permissions:
  contents: write

concurrency:
  group: official-record-intake
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit configured adapters
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: npm run crawl:audit

      - name: Harvest official observations
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEC_USER_AGENT: clifford-number official-record crawler bigbirdreturns@proton.me
          CRAWL_MAX: ${{ inputs.max_records || '100' }}
          CRAWL_LIMIT: '10'
          CRAWL_DELAY_MS: '1200'
          CRAWL_INITIAL_LOOKBACK_DAYS: '30'
        run: npm run crawl:official

      - name: Enforce intake firewall
        run: npm run validate:crawl && node test/official-crawl.test.js

      - name: Commit intake only
        run: |
          git config user.name "clifford-intake-bot"
          git config user.email "clifford-intake-bot@users.noreply.github.com"
          git add data/crawl receipts/crawl
          git diff --cached --quiet && exit 0
          git commit -m "crawl: official-record intake ($(date -u +%F))"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0 || sleep $((i*3)); done
          echo "push failed after retries"; exit 1
