name: Official-record intake

# Discovery only. This workflow may append neutral observations and candidates.
# It never edits canonical ledgers, cases, identities, surfaces, scores, or UI.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      max_records:
        description: Maximum new immutable observations
        default: '100'

permissions:
  contents: read

concurrency:
  group: scheduled-crawl-main-promotion
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit configured adapters
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: npm run crawl:audit

      - name: Harvest official observations
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SEC_USER_AGENT: clifford-number official-record crawler bigbirdreturns@proton.me
          CRAWL_MAX: ${{ inputs.max_records || '100' }}
          CRAWL_LIMIT: '10'
          CRAWL_DELAY_MS: '1200'
          CRAWL_INITIAL_LOOKBACK_DAYS: '30'
        run: npm run crawl:official

      - name: Enforce intake firewall
        run: npm run validate:crawl && node test/official-crawl.test.js

      - name: Stage crawler-owned intake roots
        run: git add data/crawl receipts/crawl

      - name: Promote intake through qualified pull request
        id: promote
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_KIND: official-record
        run: bash .github/scripts/promote-scheduled-crawl.sh
      - name: Retain exact candidate recovery bundle
        if: always()
        run: bash .github/scripts/retain-scheduled-crawl-candidate.sh
      - name: Retain scheduled promotion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-crawl-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduled-crawl-promotion-receipt
          if-no-files-found: error
          retention-days: 30
      - name: Enforce scheduled promotion result
        if: always()
        env:
          PROMOTION_STEP_OUTCOME: ${{ steps.promote.outcome }}
        run: test "$PROMOTION_STEP_OUTCOME" = success
