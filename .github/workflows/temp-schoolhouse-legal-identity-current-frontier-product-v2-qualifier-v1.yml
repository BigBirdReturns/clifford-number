name: TEMP qualify corrected School.House current-frontier product v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-legal-identity-current-frontier-product-v2-qualifier-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: schoolhouse-current-frontier-product-v2-qualifier-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-legal-identity-current-frontier-product-v2-qualifier-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Independently qualify corrected product and parent congruence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          CARRIER_BASE='3918c799f8b8dcdac49c33cec5c7bbd01ac428e4'
          WORKFLOW='.github/workflows/temp-schoolhouse-legal-identity-current-frontier-product-v2-qualifier-v1.yml'
          PRODUCT_BRANCH='agent/schoolhouse-legal-identity-current-frontier-product-v2'
          PRODUCT_PR='1483'
          PRODUCT_PARENT='2aaadb3b87c83a8cf79ded7046a3856101bf943b'
          PRODUCT_PARENT_TREE='1a6690047ea1919fe4b63b1a4eb287b78459241b'
          PRODUCT='9416543ed482b4a7a9e354df3bc6ee2393e18bef'
          PRODUCT_TREE='5b8404c9b4412a6f4de2578b73f51f7ca63db73e'
          SUPERSEDED_PRODUCT='91c831a76f1af7b63fc4a1b8e26d3c5c093a17fb'
          SUPERSEDED_MERGE='3918c799f8b8dcdac49c33cec5c7bbd01ac428e4'
          OLD_PARENT='987f1b2574eeddaba49d67c1c1498a81d40f7c69'
          OLD_PARENT_TREE='f805cde651c5236e0918baba558e0da1be77b556'
          REPAIR_RUN='31239693505'
          REPAIR_ARTIFACT='9016608377'
          REPAIR_ARTIFACT_BYTES='14803'
          REPAIR_ARTIFACT_DIGEST='sha256:287edd94a40c17647dd6eabcb48aa6a95d4ffb2f4e5f89385bcc42d0dc45bf84'
          RECEIPT="$RUNNER_TEMP/schoolhouse-current-frontier-product-v2-qualification"
          WORKTREE="$RUNNER_TEMP/schoolhouse-current-frontier-product-v2-qualification-worktree"
          rm -rf "$RECEIPT" "$WORKTREE"
          mkdir -p "$RECEIPT"
          printf 'initializing-product-v2-qualification\n' > "$RECEIPT/STAGE"
          printf 'source_requests=0\nregistry_queries=0\nform_submissions=0\ncontacts=0\npayments=0\nuploads=0\n' > "$RECEIPT/BOUNDARY"

          finalize() {
            rc="$?"
            trap - EXIT
            printf '%s\n' "$rc" > "$RECEIPT/SCRIPT_EXIT_CODE"
            (
              cd "$RECEIPT"
              find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            )
            exit "$rc"
          }
          trap finalize EXIT

          cat > "$RECEIPT/product-paths.txt" <<'EOF_PATHS'
          data/intake/bvvc-defense-capital/acquisition-frontier.json
          data/intake/bvvc-defense-capital/manifest.json
          data/intake/bvvc-defense-capital/schoolhouse.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/canonical-slice-manifest.jsonl
          data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/next-source-gate.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/source-custody.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/source-lanes.json
          docs/milestones/schoolhouse-legal-identity-current-frontier-v1.md
          tools/validate-schoolhouse-legal-identity-current-frontier.py
          EOF_PATHS
          sed -i 's/^          //' "$RECEIPT/product-paths.txt"
          sort -o "$RECEIPT/product-paths.txt" "$RECEIPT/product-paths.txt"
          cat > "$RECEIPT/expected-product-status.txt" <<'EOF_STATUS'
          M	data/intake/bvvc-defense-capital/acquisition-frontier.json
          M	data/intake/bvvc-defense-capital/manifest.json
          M	data/intake/bvvc-defense-capital/schoolhouse.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/canonical-slice-manifest.jsonl
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/next-source-gate.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/source-custody.json
          A	data/intake/schoolhouse-legal-identity-current-frontier-v1/source-lanes.json
          A	docs/milestones/schoolhouse-legal-identity-current-frontier-v1.md
          A	tools/validate-schoolhouse-legal-identity-current-frontier.py
          EOF_STATUS
          sed -i 's/^          //' "$RECEIPT/expected-product-status.txt"
          sort -k2,2 -o "$RECEIPT/expected-product-status.txt" "$RECEIPT/expected-product-status.txt"
          cat > "$RECEIPT/expected-repair-files.txt" <<'EOF_REPAIR'
          data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json
          data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json
          tools/validate-schoolhouse-legal-identity-current-frontier.py
          EOF_REPAIR
          sed -i 's/^          //' "$RECEIPT/expected-repair-files.txt"
          sort -o "$RECEIPT/expected-repair-files.txt" "$RECEIPT/expected-repair-files.txt"

          printf 'proving-carrier-product-pr-and-git-topology\n' > "$RECEIPT/STAGE"
          git fetch --no-tags origin main "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD^)" = "$CARRIER_BASE"
          test "$(git rev-list --count "$CARRIER_BASE"..HEAD)" = '1'
          test "$(git diff --name-only "$CARRIER_BASE"..HEAD)" = "$WORKFLOW"
          git diff --check "$CARRIER_BASE"..HEAD
          test "$(git rev-parse origin/main)" = "$SUPERSEDED_MERGE"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT"
          test "$(git rev-parse "$PRODUCT^")" = "$PRODUCT_PARENT"
          test "$(git rev-parse "$PRODUCT_PARENT^{tree}")" = "$PRODUCT_PARENT_TREE"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$PRODUCT_TREE"
          test "$(git rev-list --count "$PRODUCT_PARENT".."$PRODUCT")" = '1'
          test "$(git rev-parse "$SUPERSEDED_MERGE^2")" = "$SUPERSEDED_PRODUCT"
          test "$(git rev-parse "$SUPERSEDED_PRODUCT^")" = "$PRODUCT_PARENT"
          git diff --name-only "$PRODUCT_PARENT".."$PRODUCT" | sort > "$RECEIPT/observed-product-paths.txt"
          diff -u "$RECEIPT/product-paths.txt" "$RECEIPT/observed-product-paths.txt"
          git diff --name-status "$PRODUCT_PARENT".."$PRODUCT" | sort -k2,2 > "$RECEIPT/observed-product-status.txt"
          diff -u "$RECEIPT/expected-product-status.txt" "$RECEIPT/observed-product-status.txt"
          test -z "$(git diff --name-only "$PRODUCT_PARENT".."$PRODUCT" | grep '^\.github/workflows/' || true)"
          git diff --name-only "$SUPERSEDED_PRODUCT".."$PRODUCT" | sort > "$RECEIPT/observed-repair-files.txt"
          diff -u "$RECEIPT/expected-repair-files.txt" "$RECEIPT/observed-repair-files.txt"

          mapfile -t PRODUCT_PATHS < "$RECEIPT/product-paths.txt"
          printf 'path\tsuperseded_blob\tcorrected_blob\tdisposition\n' > "$RECEIPT/blob-comparison.tsv"
          for path in "${PRODUCT_PATHS[@]}"; do
            old_blob="$(git rev-parse "$SUPERSEDED_PRODUCT:$path")"
            new_blob="$(git rev-parse "$PRODUCT:$path")"
            disposition='unchanged'
            if grep -Fxq "$path" "$RECEIPT/expected-repair-files.txt"; then
              disposition='parent_custody_repaired'
              test "$old_blob" != "$new_blob"
            else
              test "$old_blob" = "$new_blob"
            fi
            printf '%s\t%s\t%s\t%s\n' "$path" "$old_blob" "$new_blob" "$disposition" >> "$RECEIPT/blob-comparison.tsv"
          done

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$RECEIPT/product-pr.json"
          test "$(jq -r .state "$RECEIPT/product-pr.json")" = 'open'
          test "$(jq -r .draft "$RECEIPT/product-pr.json")" = 'false'
          test "$(jq -r .head.sha "$RECEIPT/product-pr.json")" = "$PRODUCT"
          test "$(jq -r .base.sha "$RECEIPT/product-pr.json")" = "$SUPERSEDED_MERGE"
          test "$(jq -r .commits "$RECEIPT/product-pr.json")" = '1'
          test "$(jq -r .changed_files "$RECEIPT/product-pr.json")" = '11'

          printf 'authenticating-parent-repair-materialization\n' > "$RECEIPT/STAGE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN" > "$RECEIPT/repair-run.json"
          test "$(jq -r .head_sha "$RECEIPT/repair-run.json")" = '5aa15625ee0b562aabfdf88a0799ea617c9a293a'
          test "$(jq -r .status "$RECEIPT/repair-run.json")" = 'completed'
          test "$(jq -r .conclusion "$RECEIPT/repair-run.json")" = 'success'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_ARTIFACT" > "$RECEIPT/repair-artifact-metadata.json"
          test "$(jq -r .size_in_bytes "$RECEIPT/repair-artifact-metadata.json")" = "$REPAIR_ARTIFACT_BYTES"
          test "$(jq -r .digest "$RECEIPT/repair-artifact-metadata.json")" = "$REPAIR_ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id "$RECEIPT/repair-artifact-metadata.json")" = "$REPAIR_RUN"
          test "$(jq -r .expired "$RECEIPT/repair-artifact-metadata.json")" = 'false'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_ARTIFACT/zip" > "$RECEIPT/repair-artifact.zip"
          test "$(stat -c%s "$RECEIPT/repair-artifact.zip")" = "$REPAIR_ARTIFACT_BYTES"
          test "sha256:$(sha256sum "$RECEIPT/repair-artifact.zip" | cut -d' ' -f1)" = "$REPAIR_ARTIFACT_DIGEST"
          unzip -tq "$RECEIPT/repair-artifact.zip"
          mkdir -p "$RECEIPT/repair-artifact"
          unzip -q "$RECEIPT/repair-artifact.zip" -d "$RECEIPT/repair-artifact"
          test "$(cat "$RECEIPT/repair-artifact/SCRIPT_EXIT_CODE")" = '0'
          test "$(cat "$RECEIPT/repair-artifact/STAGE")" = 'complete'
          jq -e --arg product "$PRODUCT" --arg tree "$PRODUCT_TREE" '
            .status == "complete" and
            .canonical_parent == "2aaadb3b87c83a8cf79ded7046a3856101bf943b" and
            .canonical_parent_tree == "1a6690047ea1919fe4b63b1a4eb287b78459241b" and
            .product_commit == $product and
            .product_tree == $tree and
            .product_commit_count == 1 and
            .permanent_path_count == 11 and
            .workflow_paths == 0 and
            .parent_binding_files_repaired == 3 and
            .parent_occurrences_replaced == 3 and
            .parent_tree_occurrences_replaced == 3 and
            .focused_validation == "pass" and
            .adversarial_refusals == 15 and
            .bvvc_validation == "pass" and
            .no_magic_human_gate == "pass" and
            .complete_release_gate == "pass" and
            .clean_replay == "pass" and
            .post_restore_clean == true
          ' "$RECEIPT/repair-artifact/materialization.json" > /dev/null

          printf 'qualifying-corrected-product-head\n' > "$RECEIPT/STAGE"
          git worktree add --detach "$WORKTREE" "$PRODUCT"
          python - "$WORKTREE" "$RECEIPT/parent-congruence.json" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          parent = '2aaadb3b87c83a8cf79ded7046a3856101bf943b'
          tree = '1a6690047ea1919fe4b63b1a4eb287b78459241b'
          old_parent = '987f1b2574eeddaba49d67c1c1498a81d40f7c69'
          old_tree = 'f805cde651c5236e0918baba558e0da1be77b556'
          paths = [line for line in (Path(sys.argv[2]).parent / 'product-paths.txt').read_text().splitlines() if line]
          expected = {
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json',
              'data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json',
              'tools/validate-schoolhouse-legal-identity-current-frontier.py',
          }
          parent_files = set()
          tree_files = set()
          parent_count = tree_count = 0
          for relative in paths:
              data = (root / relative).read_bytes()
              assert old_parent.encode() not in data, relative
              assert old_tree.encode() not in data, relative
              pc = data.count(parent.encode())
              tc = data.count(tree.encode())
              if pc:
                  parent_files.add(relative)
                  parent_count += pc
              if tc:
                  tree_files.add(relative)
                  tree_count += tc
          assert parent_files == expected, parent_files
          assert tree_files == expected, tree_files
          assert parent_count == 3, parent_count
          assert tree_count == 3, tree_count
          manifest = json.loads((root / 'data/intake/schoolhouse-legal-identity-current-frontier-v1/product-manifest.json').read_text())
          reconciliation = json.loads((root / 'data/intake/schoolhouse-legal-identity-current-frontier-v1/frontier-reconciliation.json').read_text())
          validator = (root / 'tools/validate-schoolhouse-legal-identity-current-frontier.py').read_text()
          assert manifest['canonical_parent'] == parent
          assert manifest['canonical_parent_tree'] == tree
          assert reconciliation['product_parent'] == parent
          assert reconciliation['product_parent_tree'] == tree
          assert f"EXPECTED_PARENT = '{parent}'" in validator
          assert f"EXPECTED_PARENT_TREE = '{tree}'" in validator
          out.write_text(json.dumps({
              'state': 'pass',
              'actual_product_parent': parent,
              'actual_product_parent_tree': tree,
              'embedded_parent_occurrences': parent_count,
              'embedded_parent_tree_occurrences': tree_count,
              'embedded_parent_files': sorted(parent_files),
              'stale_parent_occurrences': 0,
              'stale_parent_tree_occurrences': 0,
          }, indent=2, sort_keys=True) + '\n')
          PY
          (
            cd "$WORKTREE"
            python tools/validate-schoolhouse-legal-identity-current-frontier.py --self-test | tee "$RECEIPT/focused-validator.log"
            node tools/validate-bvvc-defense-capital.mjs | tee "$RECEIPT/bvvc-validator.log"
            node tools/validate-no-magic-human-gate.mjs | tee "$RECEIPT/no-magic-human.log"
            node test/no-magic-human-gate.test.js | tee -a "$RECEIPT/no-magic-human.log"
            npm run release:check | tee "$RECEIPT/release-check.log"
            git restore --staged --worktree .
            git clean -fdx
            python tools/validate-schoolhouse-legal-identity-current-frontier.py --self-test | tee "$RECEIPT/focused-validator-replay.log"
            node tools/validate-bvvc-defense-capital.mjs | tee "$RECEIPT/bvvc-validator-replay.log"
            node tools/validate-no-magic-human-gate.mjs | tee "$RECEIPT/no-magic-human-replay.log"
            git diff --check
            git diff --exit-code
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          )
          git -C "$WORKTREE" ls-tree -r HEAD -- "${PRODUCT_PATHS[@]}" > "$RECEIPT/product-ls-tree.txt"
          diff -u "$RECEIPT/repair-artifact/corrected-product-ls-tree.txt" "$RECEIPT/product-ls-tree.txt"
          git fetch --no-tags origin main "$PRODUCT_BRANCH"
          test "$(git rev-parse origin/main)" = "$SUPERSEDED_MERGE"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT"

          python - "$RECEIPT/qualification.json" <<'PY'
          from pathlib import Path
          import json, sys
          Path(sys.argv[1]).write_text(json.dumps({
              'schema_version': 'schoolhouse-legal-identity-current-frontier-corrected-product-qualification@1',
              'qualification': 'pass',
              'product_pr': 1483,
              'product_parent': '2aaadb3b87c83a8cf79ded7046a3856101bf943b',
              'product_parent_tree': '1a6690047ea1919fe4b63b1a4eb287b78459241b',
              'product_commit': '9416543ed482b4a7a9e354df3bc6ee2393e18bef',
              'product_tree': '5b8404c9b4412a6f4de2578b73f51f7ca63db73e',
              'product_commit_count': 1,
              'permanent_path_count': 11,
              'modified_path_count': 3,
              'added_path_count': 8,
              'workflow_paths': 0,
              'repair_files': 3,
              'unchanged_product_blobs': 8,
              'embedded_parent_congruence': 'pass',
              'stale_parent_occurrences': 0,
              'stale_parent_tree_occurrences': 0,
              'focused_validation': 'pass',
              'adversarial_refusals': 15,
              'bvvc_validation': 'pass',
              'no_magic_human_gate': 'pass',
              'complete_release_gate': 'pass',
              'clean_replay': 'pass',
              'post_restore_clean': True,
              'source_slice_files': 233,
              'source_lanes': 23,
              'active_source_leases': 0,
              'candidate_successors': 0,
              'source_requests': 0,
              'registry_queries': 0,
              'form_submissions': 0,
              'identity_admissions': 0,
              'relationship_admissions': 0,
              'negative_existence_claims': 0,
              'outside_human_dependency': False,
              'publication_effect': 'none',
              'adoption_effect': 'none',
              'graph_effect': 'none',
              'public_schoolhouse_legal_identity': 'unresolved',
          }, indent=2, sort_keys=True) + '\n')
          PY
          printf 'complete\n' > "$RECEIPT/STAGE"

      - name: Upload exact corrected-product qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-legal-identity-current-frontier-product-v2-qualification
          path: ${{ runner.temp }}/schoolhouse-current-frontier-product-v2-qualification
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
