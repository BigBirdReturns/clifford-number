name: Temporary PR 2231 short-year phone precedence controller v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/tmp/pr2231-short-year-phone-precedence-v1-repair.py'
      - '.github/workflows/temporary-pr2231-short-year-phone-precedence-controller-v1.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr2231-short-year-phone-precedence-v1
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: github.repository == 'BigBirdReturns/clifford-number'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBRANCH: agent/pr2231-short-year-phone-precedence-controller-v1
      REPAIR_PATH: .github/tmp/pr2231-short-year-phone-precedence-v1-repair.py
      REPAIR_BLOB: 2e48b8e914a900e9a97815b86da8f1a09cae6733
      CPARENT: 564da53a373bfee43b026d7ed0ba0022bcc38633
      CTREE: 2e0ba796bf4648e899e8c425ce00fa9bbdb2c7cc
      CBASEPARENT: 01428cde971ffe0d995a60c80c153eded9b7e6b1
      BLIB: 5f68254d3e44de693e83503aed879160f9b7b997
      BTEST: 1659a7cc54666a2ac5a1d6b88eb8c6591d98008e
      PBRANCH: agent/current-main-identifier-context-product-v1
      PHEAD: 409df07e5031b60d525310b2f7ed01d508a6c73b
      PTREE: 06a840cb70c0c654f74b1f52675465aaf7af3521
      PLIB: 1b7899efc5eabd9c7945673dc075ddae14678f88
      PTEST: b38f5bff424a3c21f0337dee6964698ca2aa59b1
      RLIB: daadf5c66839e6e2c74792a02706704eee98e698
      RTEST: c43624859ba307792a12b1b0986300540a66399e

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Qualify and publish short-year telephone precedence repair
        shell: bash
        run: |
          set -euo pipefail

          H='${{ github.event.pull_request.head.sha }}'
          S=/tmp/pr2231-short-year-source
          Q=/tmp/pr2231-short-year-main
          A=/tmp/pr2231-short-year-phone-precedence-artifact
          R="$A/receipt.txt"
          mkdir -p "$A"
          : >"$R"

          stage() { printf '\n=== STAGE %s ===\n' "$1" | tee -a "$R"; }
          fail() { printf 'FAIL[%s] %s\n' "$1" "$2" | tee -a "$R" >&2; exit 1; }
          require_eq() {
            printf '%s actual=%s expected=%s\n' "$1" "$2" "$3" | tee -a "$R"
            [ "$2" = "$3" ] || fail "$1" 'value mismatch'
          }
          fetch_leases() {
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH" \
              "+refs/heads/$CBRANCH:refs/remotes/origin/$CBRANCH"
          }
          retain_workspace() {
            if [ -d "$S" ]; then
              git -C "$S" diff --binary -- \
                tools/lib/industrial-exhaust.mjs \
                test/industrial-exhaust.test.js \
                > "$A/candidate.patch" 2>/dev/null || true
              cp "$S/tools/lib/industrial-exhaust.mjs" "$A/industrial-exhaust.mjs" 2>/dev/null || true
              cp "$S/test/industrial-exhaust.test.js" "$A/industrial-exhaust.test.js" 2>/dev/null || true
            fi
          }
          trap retain_workspace EXIT

          stage controller-envelope
          require_eq controller-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq controller-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq controller-paths \
            "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'.github/tmp/pr2231-short-year-phone-precedence-v1-repair.py\n.github/workflows/temporary-pr2231-short-year-phone-precedence-controller-v1.yml'
          require_eq repair-blob "$(git rev-parse "HEAD:$REPAIR_PATH")" "$REPAIR_BLOB"
          python3 -m py_compile "$REPAIR_PATH"

          stage initial-live-leases
          fetch_leases
          require_eq controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq main-tree "$(git rev-parse "$CPARENT^{tree}")" "$CTREE"
          require_eq main-parent "$(git rev-parse "$CPARENT^")" "$CBASEPARENT"
          require_eq main-lib "$(git rev-parse "$CPARENT:tools/lib/industrial-exhaust.mjs")" "$BLIB"
          require_eq main-test "$(git rev-parse "$CPARENT:test/industrial-exhaust.test.js")" "$BTEST"
          require_eq product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq product-parent "$(git rev-parse "$PHEAD^")" "$CPARENT"
          require_eq product-main-merge-base "$(git merge-base "$PHEAD" "$CPARENT")" "$CPARENT"
          require_eq product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          require_eq product-count "$(git rev-list --count "$CPARENT..$PHEAD")" '1'
          require_eq product-paths \
            "$(git diff --name-only "$CPARENT..$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          stage exact-product-reproduction
          rm -rf "$S" "$Q"
          git worktree prune
          git worktree add --detach "$S" "$PHEAD"
          cd "$S"
          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          for (const [name, source, wanted] of [
            ['domestic prefix consumed as short year',
              'Phone: 03-6216-8041 3.12.03-6216-8041',
              'Phone: [contact omitted] 3.12.03-6216-8041'],
            ['mobile prefix consumed as short year',
              'Phone: 03-6216-8041 3.12.090-1234-5678',
              'Phone: [contact omitted] 3.12.090-1234-5678'],
            ['fullwidth mobile prefix consumed as short year',
              '電話：０３－６２１６－８０４１ ３．１２．０９０－１２３４－５６７８',
              '電話：[contact omitted] ３．１２．０９０－１２３４－５６７８']
          ]) {
            const rendered = redact(source);
            console.log(JSON.stringify({ kind: 'predecessor-reproduction', name, source, rendered, wanted }));
            assert.equal(rendered, wanted, name);
          }

          for (const [name, source, wanted] of [
            ['qualified short-year date',
              'Phone: 03-6216-8041 17.08.26 03-6216-8041',
              'Phone: [contact omitted] 17.08.26 [contact omitted]'],
            ['qualified four-digit attached date',
              'Phone: 03-6216-8041 17.08.2026.03-6216-8041',
              'Phone: [contact omitted] 17.08.2026.[contact omitted]'],
            ['invalid-month decimal control',
              'Phone: 03-6216-8041 3.14.03-6216-8041',
              'Phone: [contact omitted] 3.14.[contact omitted]'],
            ['unit observation custody',
              'Phone: 09012345678 2026-08-17)03-62165111 people 03-6216-8041',
              'Phone: [contact omitted] 2026-08-17)03-62165111 people [contact omitted]'],
            ['nonleading date custody',
              'Phone: 12:30:45 2026-08-17 555-1212',
              'Phone: 12:30:45 2026-08-17 555-1212'],
            ['one-use lease nonrenewal',
              'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212',
              'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212']
          ]) {
            const rendered = redact(source);
            console.log(JSON.stringify({ kind: 'retained-current-control', name, source, rendered, wanted }));
            assert.equal(rendered, wanted, name);
          }
          NODE

          stage apply-repair-and-direct-controls
          python3 "$GITHUB_WORKSPACE/$REPAIR_PATH"
          require_eq repair-paths \
            "$(git diff --name-only "$PHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          git diff --check
          node --check tools/lib/industrial-exhaust.mjs
          node --check test/industrial-exhaust.test.js
          require_eq repaired-library-blob "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq repaired-test-blob "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"

          node --input-type=module <<'NODE' 2>&1 | tee -a "$R"
          import assert from 'node:assert/strict';
          import { redactContactData as redact } from './tools/lib/industrial-exhaust.mjs';

          const repairedCases = [
            ['domestic phone after month-like decimal',
              'Phone: 03-6216-8041 3.12.03-6216-8041',
              'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['mobile phone after month-like decimal',
              'Phone: 03-6216-8041 3.12.090-1234-5678',
              'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['compact phone after month-like decimal',
              'Phone: 03-6216-8041 3.12.050-12345678',
              'Phone: [contact omitted] 3.12.[contact omitted]'],
            ['fullwidth mobile after month-like decimal',
              '電話：０３－６２１６－８０４１ ３．１２．０９０－１２３４－５６７８',
              '電話：[contact omitted] ３．１２．[contact omitted]'],
            ['direct decimal then domestic phone',
              'Phone: 3.12.03 6216 8041',
              'Phone: 3.12.[contact omitted]'],
            ['direct decimal then mobile phone',
              'Archive 3.12.090-1234-5678',
              'Archive 3.12.[contact omitted]'],
            ['short-year date remains complete',
              'Phone: 03-6216-8041 17.08.26 03-6216-8041',
              'Phone: [contact omitted] 17.08.26 [contact omitted]'],
            ['three-digit year remains complete before separate phone',
              'Phone: 03-6216-8041 17.08.090 03-6216-8041',
              'Phone: [contact omitted] 17.08.090 [contact omitted]'],
            ['four-digit attached date remains complete',
              'Phone: 03-6216-8041 17.08.2026.03-6216-8041',
              'Phone: [contact omitted] 17.08.2026.[contact omitted]'],
            ['decimal invalid month remains decimal',
              'Phone: 03-6216-8041 3.14.03-6216-8041',
              'Phone: [contact omitted] 3.14.[contact omitted]'],
            ['phone then date remains disjoint',
              'Phone: 3.12.03-6216-8041 2026-08-17',
              'Phone: 3.12.[contact omitted] 2026-08-17'],
            ['two later phones remain disjoint',
              'Phone: 3.12.03-6216-8041 090-1234-5678',
              'Phone: 3.12.[contact omitted] [contact omitted]'],
            ['external unit custody retained',
              'Phone: 09012345678 2026-08-17)03-62165111 people 03-6216-8041',
              'Phone: [contact omitted] 2026-08-17)03-62165111 people [contact omitted]'],
            ['nonleading date custody retained',
              'Phone: 12:30:45 2026-08-17 555-1212',
              'Phone: 12:30:45 2026-08-17 555-1212'],
            ['one-use lease remains nonrenewable',
              'Phone: 09012345678 12:30:45 555-1212 13:40:50 666-1212',
              'Phone: [contact omitted] 12:30:45 [contact omitted] 13:40:50 666-1212'],
            ['terminal closer sentence expiry retained',
              'Context (Phone: 09012345678.) 12:30:45 555-1212',
              'Context (Phone: [contact omitted].) 12:30:45 555-1212']
          ];
          for (const [name, source, wanted] of repairedCases) {
            const rendered = redact(source);
            console.log(JSON.stringify({ kind: 'repaired-transition', name, source, rendered, wanted }));
            assert.equal(rendered, wanted, name);
          }
          NODE

          stage repaired-industrial-exhaust-suites
          mapfile -t suites < <(
            find test -maxdepth 1 -type f -name 'industrial-exhaust*.test.js' -print | LC_ALL=C sort
          )
          test "${#suites[@]}" -ge 3
          printf '%s\n' "${suites[@]}" | tee "$A/suites.txt"
          for suite in "${suites[@]}"; do
            printf 'RUNNING %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done

          cp tools/lib/industrial-exhaust.mjs "$A/repaired-industrial-exhaust.mjs"
          cp test/industrial-exhaust.test.js "$A/repaired-industrial-exhaust.test.js"

          stage exact-main-transplant-and-release
          cd "$GITHUB_WORKSPACE"
          git worktree add --detach "$Q" "$CPARENT"
          cp "$S/tools/lib/industrial-exhaust.mjs" "$Q/tools/lib/industrial-exhaust.mjs"
          cp "$S/test/industrial-exhaust.test.js" "$Q/test/industrial-exhaust.test.js"
          cd "$Q"
          require_eq transplant-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq transplant-library-blob "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq transplant-test-blob "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"
          for suite in "${suites[@]}"; do
            printf 'TRANSPLANT RUNNING %s\n' "$suite" | tee -a "$R"
            node "$suite" 2>&1 | tee -a "$R"
          done
          npm run release:check 2>&1 | tee -a "$R"

          stage restore-two-file-product
          git reset --hard "$CPARENT"
          cp "$A/repaired-industrial-exhaust.mjs" tools/lib/industrial-exhaust.mjs
          cp "$A/repaired-industrial-exhaust.test.js" test/industrial-exhaust.test.js
          require_eq post-release-paths "$(git diff --name-only | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq post-release-library-blob "$(git hash-object tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq post-release-test-blob "$(git hash-object test/industrial-exhaust.test.js)" "$RTEST"
          git diff --check

          stage construct-product
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lib/industrial-exhaust.mjs test/industrial-exhaust.test.js
          git commit -m 'fix: preserve phones after short-year date ambiguity'
          NHEAD="$(git rev-parse HEAD)"
          NTREE="$(git rev-parse HEAD^{tree})"
          require_eq new-parent "$(git rev-parse HEAD^)" "$CPARENT"
          require_eq new-count "$(git rev-list --count "$CPARENT..HEAD")" '1'
          require_eq new-paths "$(git diff --name-only "$CPARENT..HEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'
          require_eq new-library-blob "$(git rev-parse HEAD:tools/lib/industrial-exhaust.mjs)" "$RLIB"
          require_eq new-test-blob "$(git rev-parse HEAD:test/industrial-exhaust.test.js)" "$RTEST"
          printf 'new-head=%s\nnew-tree=%s\n' "$NHEAD" "$NTREE" | tee -a "$R"

          stage final-leases-and-publication
          cd "$GITHUB_WORKSPACE"
          fetch_leases
          require_eq final-controller-head "$(git rev-parse refs/remotes/origin/$CBRANCH)" "$H"
          require_eq final-main-head "$(git rev-parse refs/remotes/origin/main)" "$CPARENT"
          require_eq final-product-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$PHEAD"
          require_eq final-product-tree "$(git rev-parse "$PHEAD^{tree}")" "$PTREE"
          require_eq final-product-lib "$(git rev-parse "$PHEAD:tools/lib/industrial-exhaust.mjs")" "$PLIB"
          require_eq final-product-test "$(git rev-parse "$PHEAD:test/industrial-exhaust.test.js")" "$PTEST"
          cd "$Q"
          git push origin "HEAD:refs/heads/$PBRANCH" \
            --force-with-lease="refs/heads/$PBRANCH:$PHEAD"
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "+refs/heads/$PBRANCH:refs/remotes/origin/$PBRANCH"
          require_eq published-head "$(git rev-parse refs/remotes/origin/$PBRANCH)" "$NHEAD"
          require_eq published-tree "$(git rev-parse "$NHEAD^{tree}")" "$NTREE"
          require_eq published-parent "$(git rev-parse "$NHEAD^")" "$CPARENT"
          require_eq published-lib "$(git rev-parse "$NHEAD:tools/lib/industrial-exhaust.mjs")" "$RLIB"
          require_eq published-test "$(git rev-parse "$NHEAD:test/industrial-exhaust.test.js")" "$RTEST"
          require_eq published-count "$(git rev-list --count "$CPARENT..$NHEAD")" '1'
          require_eq published-paths "$(git diff --name-only "$CPARENT..$NHEAD" | LC_ALL=C sort)" \
            $'test/industrial-exhaust.test.js\ntools/lib/industrial-exhaust.mjs'

          printf '\nQUALIFICATION_SUCCESS\n' | tee -a "$R"
          trap - EXIT
          retain_workspace

      - name: Retain qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2231-short-year-phone-precedence-v1
          path: /tmp/pr2231-short-year-phone-precedence-artifact
          if-no-files-found: error
          retention-days: 90
