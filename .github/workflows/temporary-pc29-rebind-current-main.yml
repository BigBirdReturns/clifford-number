name: TEMP rebind PC-29 to current main

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.pc29-rebind.trigger'
      - '.github/workflows/temporary-pc29-rebind-current-main.yml'
  push:
    branches:
      - research/preference-identity-boundary-assurance-v1
    paths:
      - '.pc29-rebind.trigger'
      - '.github/workflows/temporary-pc29-rebind-current-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc29-current-main-rebind
  cancel-in-progress: false

jobs:
  rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/preference-identity-boundary-assurance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove disjoint drift, merge live main, and qualify PC-29
        env:
          TARGET_BRANCH: research/preference-identity-boundary-assurance-v1
          FROZEN_BASE: 77bf94dfded4e3f0463d3af0a38e6d3b83cf269e
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$TARGET_BRANCH"
          git switch -C "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          start_main="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$FROZEN_BASE" "$start_main"

          cat > /tmp/pc29-permanent-paths <<'PATHS'
          .github/workflows/preference-custody-v27.yml
          .github/workflows/preference-identity-boundary-assurance.yml
          data/research/preference-custody/control-manifest-v27.json
          data/research/preference-custody/identity-boundary-assurance.fixture.json
          docs/preference-custody-identity-boundary-assurance.md
          docs/preference-custody-laboratory-floor-v27.md
          test/preference-custody-manifest-v27.test.js
          test/preference-identity-boundary-assurance.test.js
          tools/compile-preference-custody-manifest-v27.mjs
          tools/compile-preference-identity-boundary-assurance.mjs
          tools/lib/preference-custody-manifest-v27.mjs
          tools/lib/preference-identity-boundary-assurance.mjs
          tools/validate-preference-custody-manifest-v27.mjs
          tools/validate-preference-identity-boundary-assurance.mjs
          PATHS
          sed -i 's/^          //' /tmp/pc29-permanent-paths
          sort -o /tmp/pc29-permanent-paths /tmp/pc29-permanent-paths
          test "$(wc -l < /tmp/pc29-permanent-paths | tr -d ' ')" = 14

          git diff --name-only "$FROZEN_BASE" "$start_main" | sort > /tmp/current-main-drift
          test -z "$(comm -12 /tmp/pc29-permanent-paths /tmp/current-main-drift)"

          git merge --no-ff "$start_main" -m 'Rebind PC-29 permanent surface to current main'
          rebound_head="$(git rev-parse HEAD)"

          node tools/compile-preference-identity-boundary-assurance.mjs
          node tools/validate-preference-identity-boundary-assurance.mjs
          node test/preference-identity-boundary-assurance.test.js
          node tools/compile-preference-custody-manifest-v27.mjs
          node tools/validate-preference-custody-manifest-v27.mjs
          node test/preference-custody-manifest-v27.test.js
          node tools/validate-no-magic-human-gate.mjs
          npm run release:check

          git restore --staged --worktree .
          git clean -fdx
          node tools/compile-preference-identity-boundary-assurance.mjs
          node tools/validate-preference-identity-boundary-assurance.mjs
          node test/preference-identity-boundary-assurance.test.js
          node tools/compile-preference-custody-manifest-v27.mjs
          node tools/validate-preference-custody-manifest-v27.mjs
          node test/preference-custody-manifest-v27.test.js
          git restore --staged --worktree .
          git clean -fdx
          test -z "$(git status --porcelain=v1)"

          git fetch --no-tags origin main
          end_main="$(git rev-parse origin/main)"
          test "$end_main" = "$start_main"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          START_MAIN="$start_main" REBOUND_HEAD="$rebound_head" node --input-type=module <<'NODE' > pc29-rebind-receipt.json
          const receipt = {
            schema_version: 'pc29-rebind-receipt@1',
            start_main: process.env.START_MAIN,
            rebound_head: process.env.REBOUND_HEAD,
            permanent_paths: 14,
            standalone_paths: 7,
            floor_v27_paths: 7,
            outside_human_dependency: false,
            graph_effect: 'none'
          };
          process.stdout.write(`${JSON.stringify(receipt, null, 2)}\n`);
          NODE
      - name: Upload PC-29 rebind receipt
        uses: actions/upload-artifact@v4
        with:
          name: pc29-rebind-receipt
          path: pc29-rebind-receipt.json
          if-no-files-found: error
          retention-days: 90
