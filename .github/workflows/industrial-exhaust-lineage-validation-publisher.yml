name: Publish industrial-exhaust lineage validation product

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/industrial-exhaust-lineage-validation-publisher.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: industrial-exhaust-lineage-validation-product
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'agent/industrial-exhaust-lineage-validation-controller-v1'
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: cdc9d3670fb226e92ff90952c3f8a4392c532a26
      EXPECTED_PREDECESSOR: 0e609d24af3d60c731d12fa15062043dd1601684
      PREDECESSOR_BRANCH: agent/industrial-exhaust-revision-occurrence-v1
      PRODUCT_BRANCH: agent/industrial-exhaust-lineage-validation-v1
      PATCH_SHA256: c80c97b2f13b6b4eba5327e42205837b9b79c15a50f2f62913fc2e031f60d61d
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Materialize, qualify, and publish the product branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "refs/heads/${PREDECESSOR_BRANCH}:refs/remotes/origin/${PREDECESSOR_BRANCH}"

          actual_base="$(git rev-parse refs/remotes/origin/main)"
          test "$actual_base" = "$EXPECTED_BASE"

          actual_predecessor="$(git rev-parse "refs/remotes/origin/${PREDECESSOR_BRANCH}")"
          test "$actual_predecessor" = "$EXPECTED_PREDECESSOR"

          git checkout -B "$PRODUCT_BRANCH" "$EXPECTED_BASE"
          git checkout "$EXPECTED_PREDECESSOR" -- \
            tools/lib/industrial-exhaust-artifacts.mjs \
            test/industrial-exhaust-artifacts.test.js

          base64 --decode > /tmp/industrial-exhaust-lineage-validation.patch.gz <<'PATCH_GZIP_BASE64'
