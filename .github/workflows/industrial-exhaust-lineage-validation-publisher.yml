          echo "$PATCH_SHA256  /tmp/industrial-exhaust-lineage-validation.patch" | sha256sum --check --strict

          git apply --check /tmp/industrial-exhaust-lineage-validation.patch
          git apply /tmp/industrial-exhaust-lineage-validation.patch
          git diff --check

          expected_paths=$'test/industrial-exhaust-artifacts.test.js\ntools/lib/industrial-exhaust-artifacts.mjs'
          actual_paths="$(git diff --name-only "$EXPECTED_BASE" | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"

          npm ci
          node --check tools/lib/industrial-exhaust-artifacts.mjs
          node --check test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust-artifacts.test.js
          node test/industrial-exhaust.test.js

          actual_paths_after="$(git diff --name-only "$EXPECTED_BASE" | LC_ALL=C sort)"
          test "$actual_paths_after" = "$expected_paths"
          test -z "$(git ls-files --others --exclude-standard)"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            tools/lib/industrial-exhaust-artifacts.mjs \
            test/industrial-exhaust-artifacts.test.js
          git diff --cached --check
          staged_paths="$(git diff --cached --name-only "$EXPECTED_BASE" | LC_ALL=C sort)"
          test "$staged_paths" = "$expected_paths"
          test -z "$(git diff --name-only)"
          git commit -m "fix(industrial-exhaust): validate revision lineages deterministically"

          remote_sha="$(git ls-remote --heads origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${remote_sha}" \
              origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          fi
