name: Counter-Selector Wave 17 function attribution fan-out

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-17.yml'
      - 'data/project/counter-selector-wave-17-function-attribution.json'
      - 'data/project/counter-selector-function-attribution-registry.json'
      - 'data/project/counter-selector-external-review-packet-registry.json'
      - 'data/project/counter-selector-wave-17-release-manifest.json'
      - 'schemas/counter-selector-function-attribution-fanout.schema.json'
      - 'docs/methods/counter-selector-function-attribution-fanout.md'
      - 'docs/milestones/counter-selector-wave-17.md'
      - 'tools/build-counter-selector-wave-17.mjs'
      - 'tools/validate-counter-selector-wave-17.mjs'
      - 'test/counter-selector-wave-17.test.js'
      - 'reports/core-thesis/counter-selector-wave-17/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-17-function-attribution-fanout'
    paths:
      - '.github/workflows/counter-selector-wave-17.yml'
      - 'data/project/counter-selector-wave-17-function-attribution.json'
      - 'data/project/counter-selector-function-attribution-registry.json'
      - 'data/project/counter-selector-external-review-packet-registry.json'
      - 'data/project/counter-selector-wave-17-release-manifest.json'
      - 'schemas/counter-selector-function-attribution-fanout.schema.json'
      - 'docs/methods/counter-selector-function-attribution-fanout.md'
      - 'docs/milestones/counter-selector-wave-17.md'
      - 'tools/build-counter-selector-wave-17.mjs'
      - 'tools/validate-counter-selector-wave-17.mjs'
      - 'test/counter-selector-wave-17.test.js'
      - 'reports/core-thesis/counter-selector-wave-17/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 17 products
        run: node tools/build-counter-selector-wave-17.mjs
      - name: Validate function attribution contract
        run: node tools/validate-counter-selector-wave-17.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-17.test.js
      - name: Require exact committed Wave 17 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-function-attribution-registry.json \
            data/project/counter-selector-external-review-packet-registry.json \
            data/project/counter-selector-wave-17-release-manifest.json \
            reports/core-thesis/counter-selector-wave-17/data.json \
            reports/core-thesis/counter-selector-wave-17/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 17 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-17.mjs
          node tools/validate-counter-selector-wave-17.mjs
          node test/counter-selector-wave-17.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
