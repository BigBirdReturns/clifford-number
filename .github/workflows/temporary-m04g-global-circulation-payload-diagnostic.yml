name: Temporary diagnose M-04G global circulation payload

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/temporary/m04g-global-circulation/**'
      - '.github/workflows/temporary-m04g-global-circulation-payload-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m04g-global-circulation-proof-wave-02
      - name: Measure split carrier and recovery slices
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, tarfile
          from pathlib import Path
          root=Path('.github/temporary/m04g-global-circulation')
          seed=(root/'payload.b64').read_text().strip()
          out={'seed':{'length':len(seed),'sha256':hashlib.sha256(seed.encode()).hexdigest(),'first_5000_sha256':hashlib.sha256(seed[:5000].encode()).hexdigest()},'parts':[]}
          texts=[]
          for index in range(9):
            p=root/f'part-{index:02d}'
            text=p.read_text().strip()
            texts.append(text)
            row={'name':p.name,'length':len(text),'sha256':hashlib.sha256(text.encode()).hexdigest()}
            if index in (0,7):
              row['first_5000_sha256']=hashlib.sha256(text[:5000].encode()).hexdigest()
              row['last_5000_sha256']=hashlib.sha256(text[-5000:].encode()).hexdigest()
              row['first_2808_sha256']=hashlib.sha256(text[:2808].encode()).hexdigest()
              row['last_2808_sha256']=hashlib.sha256(text[-2808:].encode()).hexdigest()
            out['parts'].append(row)
          encoded=''.join(texts)
          out['encoded_length']=len(encoded)
          out['encoded_sha256']=hashlib.sha256(encoded.encode()).hexdigest()
          try:
            payload=base64.b64decode(encoded,validate=True)
            out['payload_length']=len(payload)
            out['payload_sha256']=hashlib.sha256(payload).hexdigest()
            try:
              with tarfile.open(fileobj=io.BytesIO(payload),mode='r:gz') as archive:
                out['members']=[m.name for m in archive.getmembers()]
            except Exception as error:
              out['tar_error']=str(error)
          except Exception as error:
            out['decode_error']=str(error)
          Path('/tmp/m04g-global-payload-diagnostic.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m04g-global-payload-diagnostic
          path: /tmp/m04g-global-payload-diagnostic.json
          if-no-files-found: error
