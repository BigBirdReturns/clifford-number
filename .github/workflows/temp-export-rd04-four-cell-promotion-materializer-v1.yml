name: TEMP export exact RD-04 four-cell materializer v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-export-rd04-four-cell-promotion-materializer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-export-rd04-four-cell-materializer-v1
  cancel-in-progress: false

env:
  CANONICAL_PARENT: d35deab5ef1e255e5957f29e11fe53fcf74e1cfd
  CANONICAL_PARENT_TREE: cb129c2c7297ef5aa2dc0076030f8d2eb5440860
  CARRIER_BRANCH: agent/rd04-four-cell-promotion-materializer-v1-export
  CARRIER_PATH: .github/workflows/temp-export-rd04-four-cell-promotion-materializer-v1.yml
  SOURCE_BRANCH: agent/rd04-four-cell-promotion-materializer-v1
  SOURCE_COMMIT: f1c508ecc347300073552717843a59bcac0ea250
  SOURCE_PATH: .github/workflows/temp-materialize-ssc-rd04-postpromotion-four-cell-promotion-v1.yml
  SOURCE_BLOB: 1a3edc22e73f887047b1e40e583bffaafcf73a0e

jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/rd04-four-cell-promotion-materializer-v1-export')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Export exact materializer blob
        id: export
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/rd04-four-cell-promotion-materializer-v1-export"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/export.log") 2>&1
          stage=bootstrap

          write_candidate_ledger() {
            jq -n \
              --arg parent "$CANONICAL_PARENT" \
              --arg source_commit "$SOURCE_COMMIT" \
              '{
                schema_version:"rd04-four-cell-promotion-materializer-export-candidate-ledger@1",
                state:"not_created",
                product_parent:$parent,
                source_materializer_commit:$source_commit,
                candidate_commit:null,
                candidate_tree:null,
                staging_branch:null,
                permanent_branch:null,
                candidate_path_count:0,
                source_requests:0,
                route_executions:0,
                matrix_updates:0,
                field_terminalizations:0,
                row_state_mutations:0,
                class_closed:false,
                cumulative_ledger_effect:"none",
                outside_human_dependency:false,
                publication_effect:"none",
                adoption_effect:"none",
                graph_effect:"none"
              }' > "$OUT/candidate-ledger.json"
          }

          finalize() {
            set +e
            write_candidate_ledger
            (
              cd "$OUT"
              find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )
          }

          on_error() {
            local code=$?
            trap - ERR
            set +e
            printf '%s\n' "$code" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            jq -n \
              --arg stage "$stage" \
              --argjson exit_code "$code" \
              --arg parent "$CANONICAL_PARENT" \
              --arg source_branch "$SOURCE_BRANCH" \
              --arg source_commit "$SOURCE_COMMIT" \
              --arg source_path "$SOURCE_PATH" \
              --arg source_blob "$SOURCE_BLOB" \
              --arg carrier_head "$(git rev-parse HEAD 2>/dev/null || true)" \
              '{
                schema_version:"rd04-four-cell-promotion-materializer-export-receipt@1",
                state:"failed_closed",
                failed_or_final_stage:$stage,
                exit_code:$exit_code,
                canonical_parent:$parent,
                carrier_head:(if $carrier_head=="" then null else $carrier_head end),
                source_branch:$source_branch,
                source_commit:$source_commit,
                source_path:$source_path,
                source_blob:$source_blob,
                exported_bytes:null,
                exported_sha256:null,
                candidate_created:false,
                ref_mutations:0,
                source_requests:0,
                route_executions:0,
                matrix_updates:0,
                field_terminalizations:0,
                row_state_mutations:0,
                class_closed:false,
                cumulative_ledger_effect:"none",
                outside_human_dependency:false,
                publication_effect:"none",
                adoption_effect:"none",
                graph_effect:"none"
              }' > "$OUT/export-receipt.json"
            finalize
            exit "$code"
          }

          trap on_error ERR
          set -Eeuo pipefail

          stage=bind_carrier_and_live_main
          if test "${{ github.event_name }}" = pull_request; then
            test "${{ github.event.pull_request.head.ref }}" = "$CARRIER_BRANCH"
            test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          fi
          test "$(git rev-parse HEAD^)" = "$CANONICAL_PARENT"
          test "$(git rev-parse "$CANONICAL_PARENT^{tree}")" = "$CANONICAL_PARENT_TREE"
          test "$(git rev-list --count "$CANONICAL_PARENT"..HEAD)" -eq 1
          test "$(git diff --name-only "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_PARENT" HEAD)" = "$CARRIER_PATH"
          test -z "$(git diff --name-only --diff-filter=MD "$CANONICAL_PARENT" HEAD)"
          git diff --check "$CANONICAL_PARENT" HEAD
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CANONICAL_PARENT"
          test "$(git ls-remote --heads origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')" = "$SOURCE_COMMIT"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/source-materializer"
          test "$(git rev-parse origin/main)" = "$CANONICAL_PARENT"
          test "$(git rev-parse refs/remotes/origin/source-materializer)" = "$SOURCE_COMMIT"

          stage=export_exact_source_blob
          test "$(git rev-parse "$SOURCE_COMMIT:$SOURCE_PATH")" = "$SOURCE_BLOB"
          git show "$SOURCE_COMMIT:$SOURCE_PATH" > "$OUT/materializer-v1.yml"
          test "$(git hash-object "$OUT/materializer-v1.yml")" = "$SOURCE_BLOB"
          grep -Fx '  VALIDATION_RUN: 31271473675' "$OUT/materializer-v1.yml"
          grep -Fx '  VALIDATION_HEAD: 7980e6872ff4954e5e5e17d2b905bb8a9cf99db6' "$OUT/materializer-v1.yml"
          grep -Fx '  VALIDATION_ARTIFACT: 9025731830' "$OUT/materializer-v1.yml"

          exported_bytes="$(wc -c < "$OUT/materializer-v1.yml" | tr -d ' ')"
          exported_lines="$(wc -l < "$OUT/materializer-v1.yml" | tr -d ' ')"
          exported_sha256="$(sha256sum "$OUT/materializer-v1.yml" | awk '{print $1}')"

          jq -n \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_path "$SOURCE_PATH" \
            --arg source_blob "$SOURCE_BLOB" \
            --arg source_sha256 "$exported_sha256" \
            --argjson source_bytes "$exported_bytes" \
            --argjson source_lines "$exported_lines" \
            '{
              schema_version:"rd04-four-cell-promotion-materializer-source-inventory@1",
              source_branch:$source_branch,
              source_commit:$source_commit,
              source_path:$source_path,
              source_blob:$source_blob,
              source_sha256:$source_sha256,
              source_bytes:$source_bytes,
              source_lines:$source_lines,
              predecessor_validation_run:31271473675,
              predecessor_validation_head:"7980e6872ff4954e5e5e17d2b905bb8a9cf99db6",
              predecessor_validation_artifact:9025731830
            }' > "$OUT/source-inventory.json"

          stage=complete
          printf '0\n' > "$OUT/EXIT_CODE"
          printf 'complete\n' > "$OUT/STAGE"
          jq -n \
            --arg parent "$CANONICAL_PARENT" \
            --arg parent_tree "$CANONICAL_PARENT_TREE" \
            --arg carrier_head "$(git rev-parse HEAD)" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_path "$SOURCE_PATH" \
            --arg source_blob "$SOURCE_BLOB" \
            --arg exported_sha256 "$exported_sha256" \
            --argjson exported_bytes "$exported_bytes" \
            --argjson exported_lines "$exported_lines" \
            '{
              schema_version:"rd04-four-cell-promotion-materializer-export-receipt@1",
              state:"exported",
              failed_or_final_stage:"complete",
              exit_code:0,
              canonical_parent:$parent,
              canonical_parent_tree:$parent_tree,
              carrier_head:$carrier_head,
              carrier_commits:1,
              carrier_paths:1,
              source_branch:$source_branch,
              source_commit:$source_commit,
              source_path:$source_path,
              source_blob:$source_blob,
              exported_bytes:$exported_bytes,
              exported_lines:$exported_lines,
              exported_sha256:$exported_sha256,
              candidate_created:false,
              ref_mutations:0,
              source_requests:0,
              route_executions:0,
              matrix_updates:0,
              field_terminalizations:0,
              row_state_mutations:0,
              class_closed:false,
              cumulative_ledger_effect:"none",
              outside_human_dependency:false,
              publication_effect:"none",
              adoption_effect:"none",
              graph_effect:"none"
            }' > "$OUT/export-receipt.json"
          finalize

      - name: Upload exact export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd04-four-cell-promotion-materializer-v1-export
          path: ${{ runner.temp }}/rd04-four-cell-promotion-materializer-v1-export/*
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

      - name: Enforce terminal export result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/rd04-four-cell-promotion-materializer-v1-export"
          test -f "$OUT/export-receipt.json"
          test -f "$OUT/candidate-ledger.json"
          test -f "$OUT/SHA256SUMS"
          (
            cd "$OUT"
            sha256sum -c SHA256SUMS
          )
          test "${{ steps.export.outcome }}" = success
          jq -e \
            '.state=="exported" and
             .failed_or_final_stage=="complete" and
             .exit_code==0 and
             .carrier_commits==1 and
             .carrier_paths==1 and
             .candidate_created==false and
             .ref_mutations==0 and
             .source_requests==0 and
             .route_executions==0 and
             .matrix_updates==0 and
             .field_terminalizations==0 and
             .row_state_mutations==0 and
             .class_closed==false and
             .cumulative_ledger_effect=="none" and
             .outside_human_dependency==false and
             .publication_effect=="none" and
             .adoption_effect=="none" and
             .graph_effect=="none"' \
            "$OUT/export-receipt.json" > /dev/null
          jq -e \
            '.state=="not_created" and
             .candidate_commit==null and
             .candidate_tree==null and
             .candidate_path_count==0' \
            "$OUT/candidate-ledger.json" > /dev/null
