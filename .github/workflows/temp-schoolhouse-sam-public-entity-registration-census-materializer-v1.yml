name: TEMP materialize permanent School.House SAM public entity census custody

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-sam-public-entity-registration-census-materializer-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: schoolhouse-sam-public-entity-registration-census-materializer-v1-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-sam-public-entity-registration-census-materializer-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate custody, reconstruct six-path product, and publish exact head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='d26cb838df12a877840ebe71eb9388d44b6ceaf9'
          BASE_TREE='af520dd75d4111d60f8a15c681e9d04d23c2f8f4'
          MATERIALIZER='.github/workflows/temp-schoolhouse-sam-public-entity-registration-census-materializer-v1.yml'
          PRODUCT_BRANCH='agent/schoolhouse-sam-public-entity-registration-census-custody-product-v1'
          SOURCE_RUN='31208398663'
          SOURCE_HEAD='05a56dfd208380c5269c157d8726a85725b2a058'
          SOURCE_ARTIFACT='9005696128'
          SOURCE_BYTES='6352'
          SOURCE_DIGEST='sha256:b4084cfbb96d35e9d708dcad52b8c2de11f54d34f6e4abb73b91fe4d6089f538'
          QUALIFIER_RUN='31209050398'
          QUALIFIER_HEAD='642582f003af4d01474f35b0ad3a300d0733f2e5'
          QUALIFIER_ARTIFACT='9006024017'
          QUALIFIER_BYTES='6088'
          QUALIFIER_DIGEST='sha256:483a7ede58e8f052a5ce4b85ed85d22a955783bafaaf333e574d8a1979b7b96c'
          PAYLOAD_BYTES='13402'
          PAYLOAD_SHA256='824c93cc28bbf59ad81dbedf1cec4a3c1ed0c8a3dd62103b48e3516fc8fd731c'
          WORK="$RUNNER_TEMP/sam-custody-materializer-v1"
          RECEIPT="$RUNNER_TEMP/schoolhouse-sam-public-entity-registration-census-materializer-v1"
          mkdir -p "$WORK" "$RECEIPT"

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = '1'
          mapfile -t MATERIALIZER_DELTA < <(git diff --name-only "$BASE"..HEAD)
          test "${#MATERIALIZER_DELTA[@]}" -eq 1
          test "${MATERIALIZER_DELTA[0]}" = "$MATERIALIZER"
          test -z "$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH")"

          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = 'failure'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31208402677" --jq .conclusion)" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31208402452" --jq .conclusion)" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIER_RUN" --jq .head_sha)" = "$QUALIFIER_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIER_RUN" --jq .conclusion)" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31209050912" --jq .conclusion)" = 'success'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/31209050486" --jq .conclusion)" = 'success'

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$WORK/source-metadata.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$QUALIFIER_ARTIFACT" > "$WORK/qualification-metadata.json"
          test "$(jq -r .size_in_bytes "$WORK/source-metadata.json")" = "$SOURCE_BYTES"
          test "$(jq -r .digest "$WORK/source-metadata.json")" = "$SOURCE_DIGEST"
          test "$(jq -r .workflow_run.id "$WORK/source-metadata.json")" = "$SOURCE_RUN"
          test "$(jq -r .workflow_run.head_sha "$WORK/source-metadata.json")" = "$SOURCE_HEAD"
          test "$(jq -r .expired "$WORK/source-metadata.json")" = 'false'
          test "$(jq -r .size_in_bytes "$WORK/qualification-metadata.json")" = "$QUALIFIER_BYTES"
          test "$(jq -r .digest "$WORK/qualification-metadata.json")" = "$QUALIFIER_DIGEST"
          test "$(jq -r .workflow_run.id "$WORK/qualification-metadata.json")" = "$QUALIFIER_RUN"
          test "$(jq -r .workflow_run.head_sha "$WORK/qualification-metadata.json")" = "$QUALIFIER_HEAD"
          test "$(jq -r .expired "$WORK/qualification-metadata.json")" = 'false'

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$WORK/source.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$QUALIFIER_ARTIFACT/zip" > "$WORK/qualification.zip"
          test "$(stat -c %s "$WORK/source.zip")" = "$SOURCE_BYTES"
          test "sha256:$(sha256sum "$WORK/source.zip" | cut -d' ' -f1)" = "$SOURCE_DIGEST"
          test "$(stat -c %s "$WORK/qualification.zip")" = "$QUALIFIER_BYTES"
          test "sha256:$(sha256sum "$WORK/qualification.zip" | cut -d' ' -f1)" = "$QUALIFIER_DIGEST"

          cat > "$WORK/product-text-payload.zip.b64" <<'B64'
          
          B64
          base64 -d "$WORK/product-text-payload.zip.b64" > "$WORK/product-text-payload.zip"
          test "$(stat -c %s "$WORK/product-text-payload.zip")" = "$PAYLOAD_BYTES"
          test "$(sha256sum "$WORK/product-text-payload.zip" | cut -d' ' -f1)" = "$PAYLOAD_SHA256"

          python - "$WORK/product-text-payload.zip" "$WORK/text-product" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import zipfile

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          expected = {
              'data/intake/schoolhouse-sam-public-entity-registration-census-v1/source-custody.json',
              'data/intake/schoolhouse-sam-public-entity-registration-census-v1/product-manifest.json',
              'docs/milestones/schoolhouse-sam-public-entity-registration-census-v1.md',
              'tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py',
          }
          target.mkdir(parents=True)
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == expected
              assert len(archive.namelist()) == len(expected)
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
              archive.extractall(target)
          PY

          cat > "$WORK/expected-paths.txt" <<'PATHS'
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/product-manifest.json
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/sealed-qualification-artifact.zip
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/sealed-source-artifact.zip
          data/intake/schoolhouse-sam-public-entity-registration-census-v1/source-custody.json
          docs/milestones/schoolhouse-sam-public-entity-registration-census-v1.md
          tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py
          PATHS
          sed -i 's/^          //' "$WORK/expected-paths.txt"

          git worktree add --detach "$WORK/repo" "$BASE"
          cp -a "$WORK/text-product/." "$WORK/repo/"
          DATA="$WORK/repo/data/intake/schoolhouse-sam-public-entity-registration-census-v1"
          cp "$WORK/source.zip" "$DATA/sealed-source-artifact.zip"
          cp "$WORK/qualification.zip" "$DATA/sealed-qualification-artifact.zip"

          python "$WORK/repo/tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py" --check
          python "$WORK/repo/tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py" --self-test

          git -C "$WORK/repo" status --porcelain=v1 --untracked-files=all \
            | sed -n 's/^?? //p' | sort > "$WORK/untracked-paths.txt"
          diff -u "$WORK/expected-paths.txt" "$WORK/untracked-paths.txt"
          test -z "$(git -C "$WORK/repo" diff --name-only)"
          test -z "$(git -C "$WORK/repo" diff --cached --name-only)"
          while IFS= read -r path; do
            ! git -C "$WORK/repo" cat-file -e "$BASE:$path"
          done < "$WORK/expected-paths.txt"

          git -C "$WORK/repo" add --pathspec-from-file="$WORK/expected-paths.txt"
          git -C "$WORK/repo" diff --cached --name-only | sort > "$WORK/staged-paths.txt"
          diff -u "$WORK/expected-paths.txt" "$WORK/staged-paths.txt"
          git -C "$WORK/repo" diff --cached --name-only --diff-filter=A | sort \
            > "$WORK/added-paths.txt"
          diff -u "$WORK/expected-paths.txt" "$WORK/added-paths.txt"
          test -z "$(git -C "$WORK/repo" diff --cached --name-only --diff-filter=CDMRTUXB)"
          ! grep -Eq '^\.github/workflows/' "$WORK/staged-paths.txt"

          git -C "$WORK/repo" config user.name 'github-actions[bot]'
          git -C "$WORK/repo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$WORK/repo" commit -m 'Preserve School.House SAM public entity census custody'
          PRODUCT_HEAD="$(git -C "$WORK/repo" rev-parse HEAD)"
          PRODUCT_TREE="$(git -C "$WORK/repo" rev-parse 'HEAD^{tree}')"
          test "$(git -C "$WORK/repo" rev-parse HEAD^)" = "$BASE"
          test "$(git -C "$WORK/repo" rev-list --count "$BASE"..HEAD)" = '1'
          git -C "$WORK/repo" diff --name-only "$BASE"..HEAD | sort > "$WORK/product-paths.txt"
          diff -u "$WORK/expected-paths.txt" "$WORK/product-paths.txt"
          git -C "$WORK/repo" diff --name-only --diff-filter=A "$BASE"..HEAD | sort \
            > "$WORK/product-added-paths.txt"
          diff -u "$WORK/expected-paths.txt" "$WORK/product-added-paths.txt"
          test -z "$(git -C "$WORK/repo" diff --name-only --diff-filter=CDMRTUXB "$BASE"..HEAD)"
          test -z "$(git -C "$WORK/repo" status --porcelain=v1 --untracked-files=all)"
          python "$WORK/repo/tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py" --check
          python "$WORK/repo/tools/validate-schoolhouse-sam-public-entity-registration-census-custody.py" --self-test

          git -C "$WORK/repo" push origin "HEAD:refs/heads/$PRODUCT_BRANCH"

          PR_URL="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PRODUCT_BRANCH" \
            --title 'Preserve bounded School.House SAM public entity census custody' \
            --body-file - <<EOF
          ## Permanent custody product

          Preserve the independently qualified anonymous public SAM.gov Entity Registrations boundary for issue #1382.

          \`\`\`text
          canonical parent:
          $BASE
          canonical parent tree:
          $BASE_TREE

          product commit:
          $PRODUCT_HEAD
          product tree:
          $PRODUCT_TREE

          product commits:                                  1
          permanent changed paths:                          6
          addition-only paths:                           true
          workflow or carrier paths:                        0
          \`\`\`

          ## Exact source and qualification custody

          \`\`\`text
          source PR / run / artifact:       #1389 / $SOURCE_RUN / $SOURCE_ARTIFACT
          source program exit code:                                  0
          hosted source workflow conclusion:                   failure
          source artifact bytes:                              $SOURCE_BYTES
          source artifact SHA-256:
          b4084cfbb96d35e9d708dcad52b8c2de11f54d34f6e4abb73b91fe4d6089f538

          qualification PR / run / artifact:#1390 / $QUALIFIER_RUN / $QUALIFIER_ARTIFACT
          qualification artifact bytes:                       $QUALIFIER_BYTES
          qualification artifact SHA-256:
          483a7ede58e8f052a5ce4b85ed85d22a955783bafaaf333e574d8a1979b7b96c
          qualification result:                                  pass
          qualification Release checks:                       success
          qualification no-magic-human gate:                  success
          \`\`\`

          The source program completed and wrote exit code zero. Its hosted job is red only because the final generic privacy walker rejected its own zero-retention control key \`points_of_contact\` and terminal schema key \`state\`. The independent request-free qualifier authenticated the exact source and wrapper artifacts, exact schemas, zero retention, empty candidates, and zero authority.

          ## Terminal source result

          \`\`\`text
          fixed / terminal queries:                         3 / 3
          terminal state:
            bounded_public_search_controls_unavailable:         3
          browser contexts:                                     1
          query submissions / result pages:                  0 / 0
          official requests / accounted bytes:       99 / 2,594,925
          JSON responses observed and hashed:                   9
          rendered rows / retained candidates:              0 / 0
          unique public UEIs:                                   0
          entity-detail views:                                  0
          \`\`\`

          The required public Entity Registrations category control was unavailable, so no fixed query was submitted. This is typed provider/interface custody, not a zero-result or negative-existence finding.

          ## Authority ceiling

          \`\`\`text
          identities / relationships admitted:              0 / 0
          negative-existence claims:                             0
          federal-registration / award admissions:           0 / 0
          owner / operator admissions:                       0 / 0
          outside-human dependency:                          false
          publication / adoption / graph:      none / none / none
          public School.House legal identity:          unresolved
          \`\`\`

          Merge only after the exact product head passes hosted Release checks, the no-magic-human gate, the permanent validator with eight adversarial refusals, and an independent one-path product-head qualifier. All acquisition, repair, recovery, materializer, and qualifier PRs remain never-merge carriers.
          EOF
          )"
          PR_NUMBER="${PR_URL##*/}"

          cp "$WORK/source-metadata.json" "$RECEIPT/source-artifact-metadata.json"
          cp "$WORK/qualification-metadata.json" "$RECEIPT/qualification-artifact-metadata.json"
          cp "$WORK/expected-paths.txt" "$RECEIPT/product-paths.txt"
          printf 'canonical_parent=%s\ncanonical_parent_tree=%s\n' "$BASE" "$BASE_TREE" > "$RECEIPT/topology.txt"
          printf 'product_branch=%s\nproduct_commit=%s\nproduct_tree=%s\nproduct_pr=%s\n' \
            "$PRODUCT_BRANCH" "$PRODUCT_HEAD" "$PRODUCT_TREE" "$PR_NUMBER" >> "$RECEIPT/topology.txt"
          printf 'product_commits=1\npermanent_paths=6\naddition_only=true\nworkflow_paths=0\n' >> "$RECEIPT/topology.txt"
          (
            cd "$WORK/repo"
            sha256sum $(cat "$WORK/expected-paths.txt") > "$RECEIPT/product-SHA256SUMS"
          )
          sha256sum "$RECEIPT"/* > "$RECEIPT/SHA256SUMS"
          cat "$RECEIPT/topology.txt"

      - name: Preserve exact materialization receipt
        uses: actions/upload-artifact@v4
        with:
          name: schoolhouse-sam-public-entity-registration-census-materializer-v1
          path: ${{ runner.temp }}/schoolhouse-sam-public-entity-registration-census-materializer-v1
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
