name: Temporary materialize K0 epistemic admissibility

on:
  push:
    branches:
      - agent/k0-epistemic-admissibility-integration
    paths:
      - '.github/workflows/temporary-materialize-k0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-epistemic-admissibility-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Expand exact K0 payload
        run: |
          cat .github/tmp/k0-payload-part-*.b64 > /tmp/k0.b64
          base64 -d /tmp/k0.b64 > /tmp/k0.tgz
          test "$(sha256sum /tmp/k0.tgz | awk '{print $1}')" = "92331bf4071504e8786e802bba8eeba5c624988085da563249c67da6097ef3da"
          rm -rf /tmp/k0-payload
          mkdir -p /tmp/k0-payload
          tar -xzf /tmp/k0.tgz -C /tmp/k0-payload
      - name: Materialize and run focused K0 and M-05 checks
        run: |
          node /tmp/k0-payload/materialize-k0.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct clean permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          node /tmp/k0-payload/materialize-k0.mjs
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
      - name: Commit exact permanent denominator
        run: |
          git add \
            data/intake/k0-ceiling-conversion-seed-events.json \
            data/intake/k0-epistemic-admissibility-source.txt \
            data/project/k0-epistemic-admissibility-methodology.json \
            data/project/k0-existing-ecosystem-wiring.json \
            docs/methods/k0-epistemic-admissibility.md \
            docs/milestones/m05-k0-epistemic-admissibility.md \
            schemas/k0-ceiling-conversion-event.schema.json \
            test/k0-epistemic-admissibility.test.js \
            tools/build-k0-epistemic-admissibility.mjs \
            tools/validate-k0-epistemic-admissibility.mjs \
            data/project/m05-answerable-power-story-registry.json \
            data/project/m05-answerable-power-fanout.json \
            data/canonical/corpus-selection.json \
            data/research/corpus-coverage.json \
            data/research/selection-adversarial-reviews.json \
            package.json \
            tools/validate-m05-answerable-power.mjs \
            test/m05-answerable-power.test.js \
            data/project/k0-epistemic-admissibility-release-manifest.json \
            reports/core-thesis/answerable-power/k0.json \
            reports/core-thesis/answerable-power/k0.html \
            reports/core-thesis/answerable-power/data.json \
            reports/core-thesis/answerable-power/index.html
          python - <<'PYDENOM'
          import subprocess
          expected = {
            'data/canonical/corpus-selection.json',
            'data/intake/k0-ceiling-conversion-seed-events.json',
            'data/intake/k0-epistemic-admissibility-source.txt',
            'data/project/k0-epistemic-admissibility-methodology.json',
            'data/project/k0-epistemic-admissibility-release-manifest.json',
            'data/project/k0-existing-ecosystem-wiring.json',
            'data/project/m05-answerable-power-fanout.json',
            'data/project/m05-answerable-power-story-registry.json',
            'data/research/corpus-coverage.json',
            'data/research/selection-adversarial-reviews.json',
            'docs/methods/k0-epistemic-admissibility.md',
            'docs/milestones/m05-k0-epistemic-admissibility.md',
            'package.json',
            'reports/core-thesis/answerable-power/data.json',
            'reports/core-thesis/answerable-power/index.html',
            'reports/core-thesis/answerable-power/k0.html',
            'reports/core-thesis/answerable-power/k0.json',
            'schemas/k0-ceiling-conversion-event.schema.json',
            'test/k0-epistemic-admissibility.test.js',
            'test/m05-answerable-power.test.js',
            'tools/build-k0-epistemic-admissibility.mjs',
            'tools/validate-k0-epistemic-admissibility.mjs',
            'tools/validate-m05-answerable-power.mjs',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert actual == expected, f'path denominator mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-gpg-sign -m 'Install K0 epistemic admissibility'
      - name: Prove deterministic permanent products
        run: |
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/build-m05-answerable-power.mjs
          node tools/validate-m05-answerable-power.mjs
          node test/m05-answerable-power.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs
          git diff --exit-code
      - name: Publish validated commit
        run: git push origin HEAD:agent/k0-epistemic-admissibility-integration
