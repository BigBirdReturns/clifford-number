name: Temporary materialize M-05 Sprint 05 reports

on:
  push:
    branches:
      - agent/m05-sprint-05-adoption-integrity
    paths:
      - '.github/workflows/temporary-materialize-m05-s05-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m05-sprint-05-adoption-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source package and full release gate
        run: |
          node tools/build-m05-answerable-power-sprint-05.mjs
          node tools/validate-m05-answerable-power-sprint-05.mjs
          node test/m05-answerable-power-sprint-05.test.js
          node test/m05-adoption-conformance.test.js
          npm run release:check
      - name: Rebuild exact permanent products
        run: |
          git restore --staged --worktree .
          git clean -fd
          node tools/build-m05-answerable-power-sprint-05.mjs
          node tools/validate-m05-answerable-power-sprint-05.mjs
          node test/m05-answerable-power-sprint-05.test.js
          node test/m05-adoption-conformance.test.js
      - name: Commit reports and remove temporary workflow
        run: |
          rm .github/workflows/temporary-materialize-m05-s05-reports.yml
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/temporary-materialize-m05-s05-reports.yml' \
            'reports/core-thesis/answerable-power/sprint-05.html' \
            'reports/core-thesis/answerable-power/sprint-05.json' | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected staged paths:\n%s\n' "$actual"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build M-05 Sprint 05 adoption-integrity reports'
          git push origin HEAD:agent/m05-sprint-05-adoption-integrity
