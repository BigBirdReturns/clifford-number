name: Industrial exhaust run-counter reset PR publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/industrial-exhaust-run-counter-reset.patch'
      - '.github/workflows/industrial-exhaust-run-counter-reset-publisher.yml'
      - '.github/workflows/industrial-exhaust-run-counter-reset-pr-publisher.yml'
      - '.industrial-exhaust-run-counter-reset-trigger'

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/industrial-exhaust-run-counter-reset-controller-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize qualified repair on exact product base
        env:
          EXPECTED_BASE: bd885ff47b0256d0aba1cb3ff1e61ef7285b206e
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(path, before, after, expectedMatches = 1) {
            const current = fs.readFileSync(path, 'utf8');
            const matches = current.split(before).length - 1;
            if (matches !== expectedMatches) {
              throw new Error(`${path}: expected ${expectedMatches} exact match(es), found ${matches}`);
            }
            fs.writeFileSync(path, current.replaceAll(before, after));
          }

          replaceExact(
            'tools/crawl-industrial-exhaust.mjs',
            "          last_status: 'not_modified',\n          last_error: null\n",
            "          last_status: 'not_modified',\n          last_error: null,\n          new_observation_count: 0\n"
          );
          replaceExact(
            'tools/crawl-industrial-exhaust.mjs',
            "        last_status: 'error',\n        last_error: error.message\n",
            "        last_status: 'error',\n        last_error: error.message,\n        new_observation_count: 0\n"
          );
          replaceExact(
            'tools/hydrate-industrial-exhaust.mjs',
            "last_status: 'not_modified',\nlast_error: null,\nresolved_url: fetched.finalUrl,",
            "last_status: 'not_modified',\nlast_error: null,\nnew_discovery_count: 0,\nresolved_url: fetched.finalUrl,"
          );
          replaceExact(
            'tools/hydrate-industrial-exhaust.mjs',
            "state.indexes[source.id] = { ...prior, index_url: source.index_url, publisher: source.publisher, last_checked_at: capturedAt, last_status: 'error', last_error: error.message };",
            "state.indexes[source.id] = { ...prior, index_url: source.index_url, publisher: source.publisher, last_checked_at: capturedAt, last_status: 'error', last_error: error.message, new_discovery_count: 0 };"
          );

          const crawlerTestMarker = "console.log('industrial-exhaust tests passed');";
          const crawlerTestInsert = [
            "const crawlerRuntimeSource = fs.readFileSync(",
            "  new URL('../tools/crawl-industrial-exhaust.mjs', import.meta.url),",
            "  'utf8'",
            ");",
            "assert.match(",
            "  crawlerRuntimeSource,",
            "  /last_status: 'not_modified',\\s+last_error: null,\\s+new_observation_count: 0/u,",
            "  'a 304 response must reset the current-run observation count'",
            ");",
            "assert.match(",
            "  crawlerRuntimeSource,",
            "  /last_status: 'error',\\s+last_error: error\\.message,\\s+new_observation_count: 0/u,",
            "  'an acquisition error must reset the current-run observation count'",
            ");",
            ""
          ].join('\n');
          replaceExact(
            'test/industrial-exhaust.test.js',
            crawlerTestMarker,
            `${crawlerTestInsert}\n${crawlerTestMarker}`
          );

          const hydratorTestMarker = "console.log('industrial-exhaust artifact tests passed');";
          const hydratorTestInsert = [
            "const hydratorRuntimeSource = fs.readFileSync(",
            "  new URL('../tools/hydrate-industrial-exhaust.mjs', import.meta.url),",
            "  'utf8'",
            ");",
            "assert.match(",
            "  hydratorRuntimeSource,",
            "  /last_status: 'not_modified',\\s+last_error: null,\\s+new_discovery_count: 0/u,",
            "  'a 304 index response must reset the current-run discovery count'",
            ");",
            "assert.match(",
            "  hydratorRuntimeSource,",
            "  /last_status: 'error',\\s+last_error: error\\.message,\\s+new_discovery_count: 0/u,",
            "  'an index acquisition error must reset the current-run discovery count'",
            ");",
            ""
          ].join('\n');
          replaceExact(
            'test/industrial-exhaust-artifacts.test.js',
            hydratorTestMarker,
            `${hydratorTestInsert}\n${hydratorTestMarker}`
          );

          const statePath = 'data/exhaust/state.json';
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          let resetCount = 0;
          for (const source of Object.values(state.sources ?? {})) {
            if (source.last_status === 'not_modified' && source.new_observation_count !== 0) {
              source.new_observation_count = 0;
              resetCount += 1;
            }
          }
          if (resetCount !== 4) {
            throw new Error(`${statePath}: expected to normalize 4 stale counters, normalized ${resetCount}`);
          }
          fs.writeFileSync(statePath, `${JSON.stringify(state, null, 2)}\n`);
          NODE
      - name: Validate exact five-file product surface
        run: |
          set -euo pipefail
          node --check tools/crawl-industrial-exhaust.mjs
          node --check tools/hydrate-industrial-exhaust.mjs
          node test/industrial-exhaust.test.js
          node test/industrial-exhaust-artifacts.test.js
          node -e "JSON.parse(require('node:fs').readFileSync('data/exhaust/state.json', 'utf8'))"
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            data/exhaust/state.json \
            test/industrial-exhaust-artifacts.test.js \
            test/industrial-exhaust.test.js \
            tools/crawl-industrial-exhaust.mjs \
            tools/hydrate-industrial-exhaust.mjs | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(node -e 'const s=require("./data/exhaust/state.json"); console.log(Object.values(s.sources).filter(x=>x.last_status==="not_modified" && x.new_observation_count!==0).length)')" = "0"
      - name: Publish carrier product commit
        env:
          PRODUCT_BRANCH: agent/industrial-exhaust-run-counter-reset-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/exhaust/state.json \
            test/industrial-exhaust-artifacts.test.js \
            test/industrial-exhaust.test.js \
            tools/crawl-industrial-exhaust.mjs \
            tools/hydrate-industrial-exhaust.mjs
          git commit -m "fix(exhaust): reset run-scoped acquisition counters"
          local_tree="$(git rev-parse HEAD^{tree})"
          if remote_line="$(git ls-remote --heads origin "refs/heads/$PRODUCT_BRANCH")" && test -n "$remote_line"; then
            remote_sha="${remote_line%%$'\t'*}"
            git fetch --no-tags origin "$remote_sha"
            remote_tree="$(git rev-parse "$remote_sha^{tree}")"
            test "$remote_tree" = "$local_tree"
            echo "Existing product branch already carries the qualified tree: $remote_sha"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "Published product carrier $(git rev-parse HEAD) with tree $local_tree"
