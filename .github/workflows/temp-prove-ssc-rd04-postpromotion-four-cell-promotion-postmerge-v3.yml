name: TEMP prove RD-04 four-cell promotion postmerge v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-prove-ssc-rd04-postpromotion-four-cell-promotion-postmerge-v3.yml'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: temp-prove-rd04-four-cell-promotion-postmerge-v3
  cancel-in-progress: false

env:
  MERGE: 048e9d13a2555d8e6fabdbee5f45aea858f919b7
  PARENT: d35deab5ef1e255e5957f29e11fe53fcf74e1cfd
  PRODUCT: ef8a9de8d7fba418cd1fb493bd7899f9db77f649
  TREE: d354309d6b936b499c78f3d0ff47d20f69abda78
  BRANCH: observer/ssc-rd04-postpromotion-four-cell-promotion-postmerge-v3
  OBSERVER: .github/workflows/temp-prove-ssc-rd04-postpromotion-four-cell-promotion-postmerge-v3.yml
  STANDING: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion.yml
  WORKFLOW_NAME: Status sovereignty RD Wave 03 RD-04 postpromotion four-cell promotion
  ARTIFACT_NAME: status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion
  ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion
  BUILD: tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion.mjs
  VALIDATE: tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion.mjs
  TEST: test/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion.test.js

jobs:
  prove:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/ssc-rd04-postpromotion-four-cell-promotion-postmerge-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Prove canonical merge, native standing run, artifact, and accounting
        id: proof
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/rd04-four-cell-postmerge-v3"
          X="$OUT/native-artifact"
          rm -rf "$OUT"; mkdir -p "$X"
          exec > >(tee "$OUT/proof.log") 2>&1
          stage=bootstrap
          fail() {
            code=$?; trap - ERR; set +e
            printf '%s\n' "$code" > "$OUT/EXIT_CODE"
            printf '%s\n' "$stage" > "$OUT/STAGE"
            jq -n --arg stage "$stage" --argjson code "$code" --arg merge "$MERGE" \
              '{schema_version:"ssc-rd04-four-cell-postmerge-proof@3",state:"failed_closed",failed_or_final_stage:$stage,exit_code:$code,canonical_merge:$merge,terminal_cells:226,open_substantive_cells:184,terminal_units:10,row_state_mutations:0,class_closed:false,outside_human_dependency:false,source_requests:0}' > "$OUT/receipt.json"
            exit "$code"
          }
          trap fail ERR
          set -Eeuo pipefail

          stage=topology
          test "${{ github.event.pull_request.head.ref }}" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$MERGE"
          test "$(git rev-list --count "$MERGE"..HEAD)" -eq 1
          test "$(git diff --name-only "$MERGE" HEAD)" = "$OBSERVER"
          test "$(git diff --name-only --diff-filter=A "$MERGE" HEAD)" = "$OBSERVER"
          git fetch --force --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MERGE"
          test "$(git rev-parse "$MERGE^1")" = "$PARENT"
          test "$(git rev-parse "$MERGE^2")" = "$PRODUCT"
          test "$(git rev-parse "$MERGE^{tree}")" = "$TREE"
          test "$(git rev-parse "$PRODUCT^1")" = "$PARENT"
          test "$(git rev-parse "$PRODUCT^{tree}")" = "$TREE"
          git diff --exit-code "$PRODUCT" "$MERGE"
          git diff --name-only --diff-filter=A "$PARENT" "$MERGE" | LC_ALL=C sort > "$OUT/product-paths"
          git diff --name-only --diff-filter=ACDMRTUXB "$PARENT" "$MERGE" | LC_ALL=C sort > "$OUT/all-product-paths"
          diff -u "$OUT/product-paths" "$OUT/all-product-paths"
          test "$(wc -l < "$OUT/product-paths")" -eq 14
          test -z "$(grep -E '(^|/)(\.tmp|\.trigger)(/|$)' "$OUT/product-paths" || true)"

          stage=native_standing_run
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGE&event=push&per_page=100" > "$OUT/runs.json"
          jq --arg name "$WORKFLOW_NAME" --arg path "$STANDING" --arg head "$MERGE" \
            '[.workflow_runs[]|select(.name==$name and .path==$path and .head_sha==$head and .head_branch=="main" and .event=="push")]|sort_by(.run_started_at)|reverse|.[0]' \
            "$OUT/runs.json" > "$OUT/run.json"
          RUN_ID="$(jq -r .id "$OUT/run.json")"
          test "$RUN_ID" != null
          jq -e --arg head "$MERGE" '.status=="completed" and .conclusion=="success" and .head_sha==$head and .event=="push"' "$OUT/run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$OUT/jobs.json"
          jq '[.jobs[]|select(.name=="validate")]|.[0]' "$OUT/jobs.json" > "$OUT/job.json"
          jq -e '.status=="completed" and .conclusion=="success"' "$OUT/job.json" >/dev/null
          for name in \
            'Install pinned schema and workflow parsers' \
            'Parse the standing workflow' \
            'Rebuild exact permanent data product' \
            'Enforce recursively closed product schemas' \
            'Validate focused and adversarial promotion controls' \
            'Run complete repository release gate'; do
            jq -e --arg name "$name" '[.steps[]|select(.name==$name and .status=="completed" and .conclusion=="success")]|length==1' "$OUT/job.json" >/dev/null
          done

          stage=native_artifact
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$OUT/artifacts.json"
          jq --arg name "$ARTIFACT_NAME" '[.artifacts[]|select(.name==$name and .expired==false)]|.[0]' "$OUT/artifacts.json" > "$OUT/artifact.json"
          ARTIFACT_ID="$(jq -r .id "$OUT/artifact.json")"
          DIGEST="$(jq -r .digest "$OUT/artifact.json")"
          test "$ARTIFACT_ID" != null
          test "$(jq -r .size_in_bytes "$OUT/artifact.json")" -gt 0
          test "${DIGEST#sha256:}" != "$DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$OUT/artifact.zip"
          ZIP_SHA="$(sha256sum "$OUT/artifact.zip"|cut -d' ' -f1)"
          test "$ZIP_SHA" = "${DIGEST#sha256:}"
          unzip -t "$OUT/artifact.zip" > "$OUT/zip-test.log"
          unzip -q "$OUT/artifact.zip" -d "$X"
          cat > "$OUT/artifact-files" <<'EOF'
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/cell-promotion-ledger.json 4b2b478f1260d947723ccf99adad2b66e503807582fd92845e1b61dd8ff46693
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/index.json 68aa1bcaff386c62380d418b3a1d7e096caf8b2265cc1e4ec2a7f2da4f35dbd6
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/product-manifest.json 26af14f451b25bc99bb9f00c0b531913aa402c7d1915b659c2ddc4185b9329f7
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/promoted-partial-field-matrix.json 0e61600064296e14176b5cd43bb9e4e1d52b9f435d40ca4888175f98ca087182
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/promotion-decisions.json a88e3e38380867d9d3a6a97dbfe57d267f8c05ecbcdc61dc81a4a71b0ca4b3e6
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/promotion-input-custody.json d829b8282869d620888c755412316ba8fc2940a43c929893cb3e91038b800b67
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/promotion-summary.json 86892565253c78017f89999b492190ac3fac77f46ddb920dd7b6720f67fffc34
          data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion/remaining-open-field-census.json 17f8484b176a31afef185a389ce396baba5d9fddd4da704151b4338fdd3ee73b
          docs/milestones/ssc-rd-wave03-rd04-postpromotion-four-cell-promotion.md 286fcca1bfee59b7d73c714676617e7de6c43821a88da14ab9c36938dcbbbde2
          EOF
          sed -i 's/^          //' "$OUT/artifact-files"
          while read -r path sha; do test "$(sha256sum "$X/$path"|cut -d' ' -f1)" = "$sha"; done < "$OUT/artifact-files"

          stage=replay
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.2' 'jsonschema==4.25.1'
          python -c "import yaml; yaml.safe_load(open('$OBSERVER')); yaml.safe_load(open('$STANDING'))"
          node --check "$BUILD"; node --check "$VALIDATE"; node --check "$TEST"
          node "$BUILD"
          git diff --exit-code -- "$ROOT"
          node "$VALIDATE"
          node "$TEST"
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check

          stage=accounting
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-four-cell-promotion')
          s=json.loads((root/'promotion-summary.json').read_text())
          m=json.loads((root/'promoted-partial-field-matrix.json').read_text())
          assert s['promotion_counts']['candidate_findings_promoted']==4
          assert s['promotion_counts']['candidate_findings_scope_held']==0
          assert s['route_target_checks']=={'candidate_to_source_routes':6,'candidate_to_evidence_locators':8}
          assert s['matrix_transition']=={'terminal_cells_before':222,'terminal_cells_after':226,'still_open_cells_before':228,'still_open_cells_after':224,'substantive_fields_still_open_before':188,'substantive_fields_still_open_after':184,'terminal_units_before':10,'terminal_units_after':10,'class_closed_before':False,'class_closed_after':False}
          c=m['counts']
          assert (c['materialized_cells'],c['terminal_cells'],c['still_open_cells'],c['still_open_substantive_cells'],c['terminal_units'],c['class_closed'])==(450,226,224,184,10,False)
          promoted={(r['postal_code'],cell['field_id']) for r in m['rows'] for cell in r['cells'] if cell.get('authority_effect')=='bounded_postpromotion_field_observation_only'}
          assert promoted=={('MT','operative_state_implementation_authority_and_version'),('MT','implementation_effective_date_or_typed_gap'),('MT','abawd_or_work_requirement_waiver_state_and_governing_period'),('ND','implementation_effective_date_or_typed_gap')}
          nd=next(r for r in m['rows'] if r['postal_code']=='ND')
          by={c['field_id']:c for c in nd['cells']}
          for f in ['operative_state_implementation_authority_and_version','abawd_or_work_requirement_waiver_state_and_governing_period']:
              assert by[f]['state']=='still_open' and by[f]['terminal'] is False
          assert nd['row_state']=='still_open'
          PY

          stage=clean
          git restore --staged --worktree .; git clean -fdx
          node "$BUILD"; node "$VALIDATE"; node "$TEST"; node tools/validate-no-magic-human-gate.mjs
          git diff --check; git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse origin/main)" = "$MERGE"

          stage=complete; trap - ERR
          printf '0\n' > "$OUT/EXIT_CODE"; printf 'complete\n' > "$OUT/STAGE"
          jq -n --arg merge "$MERGE" --arg parent "$PARENT" --arg product "$PRODUCT" --arg tree "$TREE" \
            --argjson run "$RUN_ID" --argjson artifact "$ARTIFACT_ID" --arg digest "$DIGEST" --arg zip "$ZIP_SHA" \
            '{schema_version:"ssc-rd04-four-cell-postmerge-proof@3",state:"canonical_postmerge_proved",failed_or_final_stage:"complete",exit_code:0,canonical_merge:$merge,canonical_parent:$parent,product_commit:$product,canonical_tree:$tree,permanent_paths:14,addition_only:true,temporary_paths:0,native_push_run_id:$run,native_push_conclusion:"success",native_artifact_id:$artifact,native_artifact_digest:$digest,native_artifact_zip_sha256:$zip,native_steps_authenticated:6,native_files_authenticated:9,terminal_cells_before:222,terminal_cells_after:226,still_open_cells_before:228,still_open_cells_after:224,open_substantive_cells_before:188,open_substantive_cells_after:184,terminal_units_before:10,terminal_units_after:10,candidate_findings_promoted:4,held_north_dakota_cells:2,route_target_source_checks:6,route_target_locator_checks:8,row_state_mutations:0,class_closed:false,cumulative_ledger_effect:"none",outside_human_dependency:false,publication_effect:"none",adoption_effect:"none",graph_effect:"none",source_requests:0,route_executions:0}' > "$OUT/receipt.json"

      - name: Seal closed proof custody
        id: seal
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/rd04-four-cell-postmerge-v3"
          test -s "$OUT/receipt.json"; test -s "$OUT/EXIT_CODE"; test -s "$OUT/STAGE"
          (cd "$OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Upload sealed postmerge proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-postpromotion-four-cell-promotion-postmerge-proof-v3
          path: ${{ runner.temp }}/rd04-four-cell-postmerge-v3
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Report postmerge result
        if: always()
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -Eeuo pipefail
          R="${RUNNER_TEMP}/rd04-four-cell-postmerge-v3/receipt.json"; test -s "$R"
          jq -r '"RD-04 four-cell postmerge proof: state=\(.state), stage=\(.failed_or_final_stage), merge=\(.canonical_merge), native_run=\(.native_push_run_id // "none"), artifact=\(.native_artifact_id // "none"), terminal_cells=\(.terminal_cells_after), open_substantive=\(.open_substantive_cells_after), held_ND=\(.held_north_dakota_cells), class_closed=\(.class_closed). This observer is read-only and must never merge."' "$R" > /tmp/result.txt
          gh issue comment 1017 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.txt

      - name: Preserve fail-closed conclusion
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${RUNNER_TEMP}/rd04-four-cell-postmerge-v3"; R="$OUT/receipt.json"
          test "${{ steps.proof.outcome }}" = success
          test "${{ steps.seal.outcome }}" = success
          test "$(cat "$OUT/EXIT_CODE")" = 0; test "$(cat "$OUT/STAGE")" = complete
          (cd "$OUT" && sha256sum -c SHA256SUMS)
          jq -e --arg merge "$MERGE" --arg parent "$PARENT" --arg product "$PRODUCT" --arg tree "$TREE" '
            .state=="canonical_postmerge_proved" and .failed_or_final_stage=="complete" and .exit_code==0 and
            .canonical_merge==$merge and .canonical_parent==$parent and .product_commit==$product and .canonical_tree==$tree and
            .permanent_paths==14 and .addition_only==true and .temporary_paths==0 and
            (.native_push_run_id|type)=="number" and .native_push_conclusion=="success" and
            (.native_artifact_id|type)=="number" and (.native_artifact_digest|startswith("sha256:")) and
            .native_artifact_zip_sha256==(.native_artifact_digest|sub("^sha256:";"")) and
            .native_steps_authenticated==6 and .native_files_authenticated==9 and
            .terminal_cells_before==222 and .terminal_cells_after==226 and .still_open_cells_before==228 and .still_open_cells_after==224 and
            .open_substantive_cells_before==188 and .open_substantive_cells_after==184 and .terminal_units_before==10 and .terminal_units_after==10 and
            .candidate_findings_promoted==4 and .held_north_dakota_cells==2 and .route_target_source_checks==6 and .route_target_locator_checks==8 and
            .row_state_mutations==0 and .class_closed==false and .cumulative_ledger_effect=="none" and .outside_human_dependency==false and
            .publication_effect=="none" and .adoption_effect=="none" and .graph_effect=="none" and .source_requests==0 and .route_executions==0' "$R" >/dev/null
