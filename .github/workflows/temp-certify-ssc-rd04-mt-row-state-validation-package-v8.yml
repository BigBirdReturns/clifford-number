name: TEMP certify RD-04 Montana validation package v8

on:
  pull_request:
    branches:
      - agent/ssc-rd04-mt-row-state-validation-one-char-certification-base-v8
    types: [opened, synchronize, reopened]
    paths:
      - '.tmp/rd04-mt-row-state-validation-materializer/one-char-certification-v8-trigger.json'

permissions:
  contents: read

concurrency:
  group: temp-rd04-mt-row-state-validation-one-char-certification-v8
  cancel-in-progress: false

env:
  CANONICAL_MAIN: bc3cf04459bb0d18829f376c9b937693b521e444
  SOURCE_PACKAGE_COMMIT: a53a40fc92368cf32cfb106ec7099199e80b8b51
  PACKAGE_PATH: .tmp/rd04-mt-row-state-validation-materializer/package.tar.gz.b64
  WORKFLOW_PATH: .github/workflows/temp-certify-ssc-rd04-mt-row-state-validation-package-v8.yml
  TRIGGER_PATH: .tmp/rd04-mt-row-state-validation-materializer/one-char-certification-v8-trigger.json
  TARGET_REF: refs/heads/staging/ssc-rd04-mt-row-state-reconciliation-validation-v1
  OUT: /tmp/rd04-mt-row-state-validation-one-char-certification-v8
  EXTRACT: /tmp/rd04-mt-row-state-validation-one-char-certification-v8-package
  CORRUPT_B64_BYTES: '14740'
  CORRUPT_B64_SHA256: 6a71fc9fea0de70c0d1281729a71872fcf7d0d9952f0c99a7dcebfd7ba0aca98
  REPAIRED_B64_SHA256: d19b30d285e725f0cba1844864f9a8a4d543e46de2ff66484e3a9b710b9771aa
  GZIP_BYTES: '11054'
  GZIP_SHA256: db899783e6a52055842ba9748b9ea1996d5bfa5b7806db374fbf127723c2c3ba
  TAR_BYTES: '61440'
  TAR_SHA256: d81a4cc83d47f192995a9bf32aed803f4f5c878799558ce906fc166ada7af559
  CONTROLLER_BYTES: '9075'
  CONTROLLER_SHA256: 5b9b91cf7e30af38ca4fcec137b8a43d5e3e9c3c3c21e259b6aa21a1bf9d1674
  PACKAGE_FILE_RECORD_SHA256: 613d3fbfed4b154fa596a950e073b7435bebe8b426b2c18cc9ea4db501bf3449

jobs:
  certify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'agent/ssc-rd04-mt-row-state-validation-one-char-certification-base-v8' &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-mt-row-state-validation-one-char-certification-trigger-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Authenticate exact four-commit recovery topology
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$EXTRACT"
          mkdir -p "$OUT" "$EXTRACT"

          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$EVENT_BASE_SHA"
          test "$(git rev-parse "$EVENT_BASE_SHA^")" = "$SOURCE_PACKAGE_COMMIT"
          test "$(git rev-parse "$SOURCE_PACKAGE_COMMIT^")" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$EVENT_BASE_SHA..$EVENT_HEAD_SHA")" -eq 1
          test "$(git rev-list --count "$SOURCE_PACKAGE_COMMIT..$EVENT_BASE_SHA")" -eq 1
          test "$(git rev-list --count "$CANONICAL_MAIN..$SOURCE_PACKAGE_COMMIT")" -eq 1
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CANONICAL_MAIN"

          printf '%s\n' "$PACKAGE_PATH" > "$OUT/expected-package-paths.txt"
          git diff --name-only "$CANONICAL_MAIN" "$SOURCE_PACKAGE_COMMIT" | LC_ALL=C sort > "$OUT/actual-package-paths.txt"
          cmp "$OUT/expected-package-paths.txt" "$OUT/actual-package-paths.txt"
          test "$(git diff --name-only --diff-filter=A "$CANONICAL_MAIN" "$SOURCE_PACKAGE_COMMIT" | wc -l)" -eq 1
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$CANONICAL_MAIN" "$SOURCE_PACKAGE_COMMIT")"

          printf '%s\n' "$WORKFLOW_PATH" > "$OUT/expected-base-paths.txt"
          git diff --name-only "$SOURCE_PACKAGE_COMMIT" "$EVENT_BASE_SHA" | LC_ALL=C sort > "$OUT/actual-base-paths.txt"
          cmp "$OUT/expected-base-paths.txt" "$OUT/actual-base-paths.txt"
          test "$(git diff --name-only --diff-filter=A "$SOURCE_PACKAGE_COMMIT" "$EVENT_BASE_SHA" | wc -l)" -eq 1
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$SOURCE_PACKAGE_COMMIT" "$EVENT_BASE_SHA")"

          printf '%s\n' "$TRIGGER_PATH" > "$OUT/expected-trigger-paths.txt"
          git diff --name-only "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" | LC_ALL=C sort > "$OUT/actual-trigger-paths.txt"
          cmp "$OUT/expected-trigger-paths.txt" "$OUT/actual-trigger-paths.txt"
          test "$(git diff --name-only --diff-filter=A "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" | wc -l)" -eq 1
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA")"

          test -f "$PACKAGE_PATH"
          test -f "$WORKFLOW_PATH"
          test -f "$TRIGGER_PATH"
          git diff --check "$CANONICAL_MAIN" "$EVENT_HEAD_SHA"

      - name: Exhaustively recover and certify the exact package
        id: recover
        continue-on-error: true
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git ls-remote --heads origin "$TARGET_REF" | awk '{print $1}')"
          printf '%s\n' "${before:-absent}" > "$OUT/target-ref-before.txt"

          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          import pathlib
          import shutil
          import tarfile
          import traceback
          from pathlib import PurePosixPath

          source = pathlib.Path(os.environ['PACKAGE_PATH'])
          out = pathlib.Path(os.environ['OUT'])
          extract = pathlib.Path(os.environ['EXTRACT'])

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def write_json(name: str, value: object) -> None:
              (out / name).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )

          observations = {
              'schema_version': 'ssc-rd04-mt-row-state-validation-one-char-certification-observations@8',
              'state': 'started',
          }
          write_json('observations.json', observations)

          try:
              corrupt = source.read_bytes()
              assert len(corrupt) == int(os.environ['CORRUPT_B64_BYTES'])
              assert sha256(corrupt) == os.environ['CORRUPT_B64_SHA256']
              alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              assert set(corrupt) <= set(alphabet)

              target = os.environ['REPAIRED_B64_SHA256']
              work = bytearray(corrupt)
              matches = []
              tested = 0
              for index, original in enumerate(corrupt):
                  for replacement in alphabet:
                      if replacement == original:
                          continue
                      work[index] = replacement
                      tested += 1
                      if hashlib.sha256(work).hexdigest() == target:
                          matches.append((index, original, replacement, bytes(work)))
                  work[index] = original

              assert tested == 943360
              assert len(matches) == 1
              index, original, replacement, repaired = matches[0]
              assert index == 2876
              assert original == ord('e')
              assert replacement == ord('/')
              assert sum(left != right for left, right in zip(corrupt, repaired)) == 1
              assert len(repaired) == 14740
              assert sha256(repaired) == target
              (out / 'repaired-package.tar.gz.b64').write_bytes(repaired)

              compressed = base64.b64decode(repaired, validate=True)
              assert len(compressed) == int(os.environ['GZIP_BYTES'])
              assert sha256(compressed) == os.environ['GZIP_SHA256']
              (out / 'repaired-package.tar.gz').write_bytes(compressed)

              archive = gzip.decompress(compressed)
              assert len(archive) == int(os.environ['TAR_BYTES'])
              assert sha256(archive) == os.environ['TAR_SHA256']
              (out / 'repaired-package.tar').write_bytes(archive)

              members = []
              targets = set()
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tf:
                  infos = tf.getmembers()
                  assert len(infos) == 8
                  assert all(info.isfile() for info in infos)
                  assert not any(info.isdir() for info in infos)
                  for info in infos:
                      raw = info.name
                      path = PurePosixPath(raw)
                      assert not path.is_absolute()
                      assert '..' not in path.parts
                      assert '\\' not in raw
                      parts = tuple(part for part in path.parts if part not in ('', '.'))
                      assert parts
                      normalized = PurePosixPath(*parts).as_posix()
                      assert normalized not in targets
                      targets.add(normalized)
                      members.append({
                          'name': raw,
                          'normalized_path': normalized,
                          'type': 'file',
                          'bytes': info.size,
                          'mode': oct(info.mode),
                      })

                      destination = extract.joinpath(*parts)
                      root = extract.resolve()
                      resolved = destination.resolve()
                      assert resolved == root or root in resolved.parents
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      stream = tf.extractfile(info)
                      assert stream is not None
                      data = stream.read()
                      assert len(data) == info.size
                      destination.write_bytes(data)
              write_json('package-members.json', members)

              expected_paths = {
                  'controller.py',
                  'product/.github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1.yml',
                  'product/data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/current-row-custody.json',
                  'product/data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/product-manifest.json',
                  'product/data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/row-state-validation.json',
                  'product/data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/summary.json',
                  'product/data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation-validation-v1/validated-row-state-protocol.json',
                  'product/tools/validate-status-sovereignty-rd-wave03-rd04-mt-row-state-reconciliation-v1.py',
              }
              assert targets == expected_paths

              controller = extract / 'controller.py'
              controller_data = controller.read_bytes()
              assert len(controller_data) == int(os.environ['CONTROLLER_BYTES'])
              assert sha256(controller_data) == os.environ['CONTROLLER_SHA256']
              compile(controller_data, str(controller), 'exec')
              (out / 'controller.py').write_bytes(controller_data)

              exported = out / 'package'
              shutil.copytree(extract, exported)
              records = []
              combined = hashlib.sha256()
              for path in sorted(item for item in exported.rglob('*') if item.is_file()):
                  data = path.read_bytes()
                  record = {
                      'path': path.relative_to(exported).as_posix(),
                      'bytes': len(data),
                      'sha256': sha256(data),
                      'git_blob': hashlib.sha1(
                          b'blob ' + str(len(data)).encode() + b'\0' + data
                      ).hexdigest(),
                  }
                  records.append(record)
                  combined.update(
                      json.dumps(record, sort_keys=True, separators=(',', ':')).encode()
                      + b'\n'
                  )
              assert len(records) == 8
              assert combined.hexdigest() == os.environ['PACKAGE_FILE_RECORD_SHA256']
              write_json('package-file-manifest.json', {
                  'schema_version': 'ssc-rd04-mt-row-state-validation-package-export@8',
                  'files': records,
                  'combined_file_record_sha256': combined.hexdigest(),
              })

              repair = {
                  'schema_version': 'ssc-rd04-mt-row-state-validation-one-char-repair@8',
                  'state': 'unique_one_character_repair_certified',
                  'tested_candidate_substitutions': tested,
                  'zero_based_index': index,
                  'one_based_index': index + 1,
                  'original_byte': original,
                  'original_character': chr(original),
                  'replacement_byte': replacement,
                  'replacement_character': chr(replacement),
                  'corrupt_payload_b64_bytes': len(corrupt),
                  'corrupt_payload_b64_sha256': sha256(corrupt),
                  'repaired_payload_b64_bytes': len(repaired),
                  'repaired_payload_b64_sha256': sha256(repaired),
                  'gzip_bytes': len(compressed),
                  'gzip_sha256': sha256(compressed),
                  'tar_bytes': len(archive),
                  'tar_sha256': sha256(archive),
              }
              write_json('one-character-repair.json', repair)

              receipt = {
                  'schema_version': 'ssc-rd04-mt-row-state-validation-package-certification@8',
                  'state': 'exact_repaired_package_and_controller_certified_without_execution',
                  'canonical_main': os.environ['CANONICAL_MAIN'],
                  'source_package_commit': os.environ['SOURCE_PACKAGE_COMMIT'],
                  'event_base_sha': os.environ['EVENT_BASE_SHA'],
                  'event_head_sha': os.environ['EVENT_HEAD_SHA'],
                  'repair_hamming_distance': 1,
                  'archive_directory_members': 0,
                  'archive_file_members': 8,
                  'package_file_count': 8,
                  'package_file_record_sha256': combined.hexdigest(),
                  'controller_path': 'controller.py',
                  'controller_bytes': len(controller_data),
                  'controller_sha256': sha256(controller_data),
                  'controller_executed': False,
                  'source_requests': 0,
                  'route_executions': 0,
                  'evidence_admissions': 0,
                  'field_terminalizations': 0,
                  'matrix_updates': 0,
                  'row_state_mutations': 0,
                  'row_terminalizations': 0,
                  'class_closures': 0,
                  'canonical_effect': 'none',
                  'publication_effect': 'none',
                  'adoption_effect': 'none',
                  'graph_effect': 'none',
                  'outside_human_dependency': False,
              }
              write_json('certification-receipt.json', receipt)
              observations.update(
                  state=receipt['state'],
                  repaired_payload_b64_sha256=sha256(repaired),
                  controller_sha256=sha256(controller_data),
              )
              write_json('observations.json', observations)
          except BaseException as error:
              observations.update(
                  state='certification_failed_closed',
                  error_type=type(error).__name__,
                  error=str(error),
              )
              write_json('observations.json', observations)
              (out / 'certification-traceback.txt').write_text(
                  traceback.format_exc(),
                  encoding='utf-8',
              )
              raise
          PY

          after="$(git ls-remote --heads origin "$TARGET_REF" | awk '{print $1}')"
          printf '%s\n' "${after:-absent}" > "$OUT/target-ref-after.txt"
          cmp "$OUT/target-ref-before.txt" "$OUT/target-ref-after.txt"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$CANONICAL_MAIN"
          git status --porcelain=v1 > "$OUT/repository-status.txt"
          test ! -s "$OUT/repository-status.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$OUT" && sha256sum -c SHA256SUMS)

      - name: Preserve exact certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-validation-one-char-certification-v8
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9

      - name: Enforce exact zero-authority certification
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.recover.outcome }}" = success
          test -s "$OUT/repaired-package.tar.gz.b64"
          test -s "$OUT/repaired-package.tar.gz"
          test -s "$OUT/repaired-package.tar"
          test -s "$OUT/controller.py"
          test -s "$OUT/one-character-repair.json"
          test -s "$OUT/package-members.json"
          test -s "$OUT/package-file-manifest.json"
          test -s "$OUT/certification-receipt.json"
          test -s "$OUT/SHA256SUMS"
          test -d "$OUT/package"
          (cd "$OUT" && sha256sum -c SHA256SUMS)

          test "$(stat -c %s "$OUT/repaired-package.tar.gz.b64")" -eq 14740
          test "$(sha256sum "$OUT/repaired-package.tar.gz.b64" | awk '{print $1}')" = "$REPAIRED_B64_SHA256"
          test "$(stat -c %s "$OUT/repaired-package.tar.gz")" -eq 11054
          test "$(sha256sum "$OUT/repaired-package.tar.gz" | awk '{print $1}')" = "$GZIP_SHA256"
          test "$(stat -c %s "$OUT/repaired-package.tar")" -eq 61440
          test "$(sha256sum "$OUT/repaired-package.tar" | awk '{print $1}')" = "$TAR_SHA256"
          test "$(stat -c %s "$OUT/controller.py")" -eq 9075
          test "$(sha256sum "$OUT/controller.py" | awk '{print $1}')" = "$CONTROLLER_SHA256"

          jq -e '
            .schema_version == "ssc-rd04-mt-row-state-validation-one-char-repair@8" and
            .state == "unique_one_character_repair_certified" and
            .tested_candidate_substitutions == 943360 and
            .zero_based_index == 2876 and .one_based_index == 2877 and
            .original_character == "e" and .replacement_character == "/" and
            .corrupt_payload_b64_sha256 == "6a71fc9fea0de70c0d1281729a71872fcf7d0d9952f0c99a7dcebfd7ba0aca98" and
            .repaired_payload_b64_sha256 == "d19b30d285e725f0cba1844864f9a8a4d543e46de2ff66484e3a9b710b9771aa" and
            .gzip_sha256 == "db899783e6a52055842ba9748b9ea1996d5bfa5b7806db374fbf127723c2c3ba" and
            .tar_sha256 == "d81a4cc83d47f192995a9bf32aed803f4f5c878799558ce906fc166ada7af559"
          ' "$OUT/one-character-repair.json" >/dev/null

          jq -e '
            .schema_version == "ssc-rd04-mt-row-state-validation-package-certification@8" and
            .state == "exact_repaired_package_and_controller_certified_without_execution" and
            .canonical_main == "bc3cf04459bb0d18829f376c9b937693b521e444" and
            .source_package_commit == "a53a40fc92368cf32cfb106ec7099199e80b8b51" and
            .repair_hamming_distance == 1 and
            .archive_directory_members == 0 and
            .archive_file_members == 8 and
            .package_file_count == 8 and
            .package_file_record_sha256 == "613d3fbfed4b154fa596a950e073b7435bebe8b426b2c18cc9ea4db501bf3449" and
            .controller_path == "controller.py" and
            .controller_bytes == 9075 and
            .controller_sha256 == "5b9b91cf7e30af38ca4fcec137b8a43d5e3e9c3c3c21e259b6aa21a1bf9d1674" and
            .controller_executed == false and
            .source_requests == 0 and .route_executions == 0 and
            .evidence_admissions == 0 and .field_terminalizations == 0 and
            .matrix_updates == 0 and .row_state_mutations == 0 and
            .row_terminalizations == 0 and .class_closures == 0 and
            .canonical_effect == "none" and .publication_effect == "none" and
            .adoption_effect == "none" and .graph_effect == "none" and
            .outside_human_dependency == false
          ' "$OUT/certification-receipt.json" >/dev/null

          cmp "$OUT/target-ref-before.txt" "$OUT/target-ref-after.txt"
          test -z "$(git status --porcelain=v1)"
