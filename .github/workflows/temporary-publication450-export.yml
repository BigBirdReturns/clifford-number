name: Temporary publication-450 exact export

on:
  push:
    branches:
      - agent/publication-allowlist-poof-admission-v2
    paths:
      - '.github/workflows/temporary-publication450-export.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-publication450-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-allowlist-poof-admission-v2
          fetch-depth: 0
      - name: Archive exact branch head and canonical main
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/publication450-input
          git archive --format=tar.gz --output=/tmp/publication450-input/publication450-head.tar.gz HEAD
          git archive --format=tar.gz --output=/tmp/publication450-input/main-head.tar.gz origin/main
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/publication450-input/branch-head.txt
          printf '%s\n' "$(git rev-parse origin/main)" > /tmp/publication450-input/main-head.txt
          sha256sum /tmp/publication450-input/publication450-head.tar.gz /tmp/publication450-input/main-head.tar.gz > /tmp/publication450-input/archives.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: publication450-dual-input-${{ github.run_id }}
          path: /tmp/publication450-input/
          if-no-files-found: error
          retention-days: 3
