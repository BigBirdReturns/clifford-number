name: Materialize Counter-Selector Wave 05 post-review gap audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-05.yml'
      - '.github/materializers/counter-selector-wave-05/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-05-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-05-gap-resolution

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 05 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-05/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-05.tar.gz
          echo '210751117049e545ab4f0acef4551668e44fe183b1baf9b038613485ffb48748  /tmp/counter-selector-wave-05.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-05.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-05

      - name: Build, validate, and attack post-review gaps
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-05.mjs
          node tools/validate-counter-selector-wave-05.mjs
          node test/counter-selector-wave-05.test.js

      - name: Commit exact non-workflow Wave 05 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-05/payload-00a \
            .github/materializers/counter-selector-wave-05/payload-00b \
            .github/materializers/counter-selector-wave-05/payload-01 \
            .github/materializers/counter-selector-wave-05/payload-02 \
            .github/materializers/counter-selector-wave-05/payload-03 \
            .github/materializers/counter-selector-wave-05/payload-04 \
            data/project/counter-selector-wave-05-gap-resolution.json \
            data/project/counter-selector-wave-05-source-registry.json \
            data/project/counter-selector-post-review-gap-registry.json \
            data/project/counter-selector-wave-05-supersession.json \
            data/project/counter-selector-wave-05-release-manifest.json \
            schemas/counter-selector-post-review-gap.schema.json \
            docs/methods/counter-selector-post-review-gap.md \
            docs/milestones/counter-selector-wave-05.md \
            tools/build-counter-selector-wave-05.mjs \
            tools/validate-counter-selector-wave-05.mjs \
            test/counter-selector-wave-05.test.js \
            reports/core-thesis/counter-selector-wave-05/data.json \
            reports/core-thesis/counter-selector-wave-05/index.html | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Resolve Counter-Selector Wave 05 post-review gaps'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 05 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-05.mjs
          node tools/validate-counter-selector-wave-05.mjs
          node test/counter-selector-wave-05.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish non-workflow Wave 05 head
        run: git push origin HEAD:agent/counter-selector-wave-05-gap-resolution
