name: Counter-Selector Wave 16 targeted receipts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/counter-selector-wave-16.yml'
      - 'data/project/counter-selector-wave-16-targeted-receipts.json'
      - 'data/project/counter-selector-targeted-receipt-registry.json'
      - 'data/project/counter-selector-wave-16-release-manifest.json'
      - 'schemas/counter-selector-targeted-receipts.schema.json'
      - 'docs/methods/counter-selector-targeted-receipts.md'
      - 'docs/milestones/counter-selector-wave-16.md'
      - 'tools/build-counter-selector-wave-16.mjs'
      - 'tools/validate-counter-selector-wave-16.mjs'
      - 'test/counter-selector-wave-16.test.js'
      - 'reports/core-thesis/counter-selector-wave-16/**'
  push:
    branches:
      - main
      - 'agent/counter-selector-wave-16-targeted-receipts'
    paths:
      - '.github/workflows/counter-selector-wave-16.yml'
      - 'data/project/counter-selector-wave-16-targeted-receipts.json'
      - 'data/project/counter-selector-targeted-receipt-registry.json'
      - 'data/project/counter-selector-wave-16-release-manifest.json'
      - 'schemas/counter-selector-targeted-receipts.schema.json'
      - 'docs/methods/counter-selector-targeted-receipts.md'
      - 'docs/milestones/counter-selector-wave-16.md'
      - 'tools/build-counter-selector-wave-16.mjs'
      - 'tools/validate-counter-selector-wave-16.mjs'
      - 'test/counter-selector-wave-16.test.js'
      - 'reports/core-thesis/counter-selector-wave-16/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 16 products
        run: node tools/build-counter-selector-wave-16.mjs
      - name: Validate targeted receipt contract
        run: node tools/validate-counter-selector-wave-16.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-16.test.js
      - name: Require exact committed Wave 16 products
        run: |
          git diff --exit-code -- \
            data/project/counter-selector-targeted-receipt-registry.json \
            data/project/counter-selector-wave-16-release-manifest.json \
            reports/core-thesis/counter-selector-wave-16/data.json \
            reports/core-thesis/counter-selector-wave-16/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 16 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-16.mjs
          node tools/validate-counter-selector-wave-16.mjs
          node test/counter-selector-wave-16.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
