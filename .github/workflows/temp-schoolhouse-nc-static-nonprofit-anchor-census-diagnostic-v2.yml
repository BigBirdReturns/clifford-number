name: TEMP recover exact NC anchor runner hashes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-schoolhouse-nc-static-nonprofit-anchor-census-diagnostic-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/schoolhouse-nc-static-nonprofit-anchor-census-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover checked-in shard, bundle, gzip, and source hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          SHARD_DIR='.schoolhouse-nc-static-nonprofit-anchor-census'
          BUNDLE="$RUNNER_TEMP/anchor-census.py.gz.b64"
          GZIP="$RUNNER_TEMP/anchor-census.py.gz"
          RUNNER="$RUNNER_TEMP/anchor-census.py"

          for part in 00 01 02 03; do
            printf 'actual_shard_%s_sha256=%s\n' "$part" "$(sha256sum "$SHARD_DIR/capture.part.$part" | awk '{print $1}')"
          done
          cat "$SHARD_DIR"/capture.part.00 \
              "$SHARD_DIR"/capture.part.01 \
              "$SHARD_DIR"/capture.part.02 \
              "$SHARD_DIR"/capture.part.03 > "$BUNDLE"
          printf 'actual_bundle_sha256=%s\n' "$(sha256sum "$BUNDLE" | awk '{print $1}')"
          base64 -d "$BUNDLE" > "$GZIP"
          printf 'actual_gzip_sha256=%s\n' "$(sha256sum "$GZIP" | awk '{print $1}')"
          gzip -dc "$GZIP" > "$RUNNER"
          printf 'actual_source_sha256=%s\n' "$(sha256sum "$RUNNER" | awk '{print $1}')"
          python -m py_compile "$RUNNER"
          printf 'runner_compile=pass\n'
