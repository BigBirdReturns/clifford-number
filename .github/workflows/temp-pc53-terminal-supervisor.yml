name: TEMP recover exact PC-53 postmerge proof and cleanup

on:
  pull_request:
    types: [synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pc53-terminal-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      ISSUE: '1360'
      PRODUCT_PR: '1418'
      PRODUCT: 21dc720257b574caf52579843124a349e7b9f434
      PRODUCT_PARENT: 0a4091391e4c17c64683bd91f6a739a2a0a152fc
      PRODUCT_TREE: 04cbe1bf293f4be2f364e479263155ee4438f713
      MERGE: 1e52a58be874538509d6c0d3c06adc12fc53cad7
      QUALIFIED_SOURCE_PARENT: 8a2f4538bdbcf9455f02e70c35a71cb39f805b18
      RECEIPT_DIR: /tmp/pc53-exact-postmerge-proof
      CENSUS_DIR: /tmp/pc53-terminal-census
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact-head matrix, topology, paths, and blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RECEIPT_DIR" "$CENSUS_DIR"
          git fetch --no-tags origin main "$MERGE" "$PRODUCT" "$PRODUCT_PARENT" "$QUALIFIED_SOURCE_PARENT"

          test "$(git rev-parse "$PRODUCT^{tree}")" = "$PRODUCT_TREE"
          test "$(git show -s --format='%P' "$PRODUCT")" = "$PRODUCT_PARENT"
          git merge-base --is-ancestor "$QUALIFIED_SOURCE_PARENT" "$PRODUCT_PARENT"

          mapfile -t merge_parents < <(git show -s --format='%P' "$MERGE" | tr ' ' '\n')
          test "${#merge_parents[@]}" -eq 2
          test "${merge_parents[1]}" = "$PRODUCT"
          MERGE_FIRST_PARENT="${merge_parents[0]}"
          printf '%s\n' "$MERGE_FIRST_PARENT" > "$RECEIPT_DIR/merge-first-parent.txt"

          git diff --name-status "$PRODUCT_PARENT" "$PRODUCT" > "$RECEIPT_DIR/product-delta.tsv"
          test "$(wc -l < "$RECEIPT_DIR/product-delta.tsv" | tr -d ' ')" = 14
          awk '$1 != "A" { exit 1 }' "$RECEIPT_DIR/product-delta.tsv"
          cut -f2 "$RECEIPT_DIR/product-delta.tsv" | sort > "$RECEIPT_DIR/product-paths.txt"
          test "$(sort -u "$RECEIPT_DIR/product-paths.txt" | wc -l | tr -d ' ')" = 14

          if grep -E '(^|/)(\.pc53|temp-|carrier|materializer|controller|diagnostic|receipt|marker|pulse|trigger|shard)' "$RECEIPT_DIR/product-paths.txt"; then
            echo 'transport path entered product' >&2
            exit 1
          fi

          test "$(grep -c '^\.github/workflows/' "$RECEIPT_DIR/product-paths.txt")" = 2
          while IFS= read -r workflow_path; do
            [[ "$workflow_path" != .github/workflows/* ]] && continue
            workflow_copy="$RECEIPT_DIR/$(basename "$workflow_path")"
            git show "$PRODUCT:$workflow_path" > "$workflow_copy"
            grep -Eq '^permissions:' "$workflow_copy"
            grep -Eq 'contents:[[:space:]]*read' "$workflow_copy"
            ! grep -Eq 'contents:[[:space:]]*write|pull-requests:[[:space:]]*write|issues:[[:space:]]*write|actions:[[:space:]]*write' "$workflow_copy"
          done < "$RECEIPT_DIR/product-paths.txt"

          : > "$RECEIPT_DIR/canonical-product-blobs.tsv"
          while IFS= read -r path; do
            product_blob=$(git rev-parse "$PRODUCT:$path")
            merge_blob=$(git rev-parse "$MERGE:$path")
            test "$product_blob" = "$merge_blob"
            printf '%s\t%s\n' "$path" "$product_blob" >> "$RECEIPT_DIR/canonical-product-blobs.tsv"
          done < "$RECEIPT_DIR/product-paths.txt"

          LIVE_MAIN=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$MERGE" "$LIVE_MAIN"
          : > "$RECEIPT_DIR/live-main-product-blobs.tsv"
          while IFS= read -r path; do
            merge_blob=$(git rev-parse "$MERGE:$path")
            live_blob=$(git rev-parse "$LIVE_MAIN:$path")
            test "$merge_blob" = "$live_blob"
            printf '%s\t%s\n' "$path" "$live_blob" >> "$RECEIPT_DIR/live-main-product-blobs.tsv"
          done < "$RECEIPT_DIR/product-paths.txt"

          gh api "/repos/${GH_REPOSITORY}/pulls/${PRODUCT_PR}" > "$RECEIPT_DIR/product-pr.json"
          test "$(jq -r .merged "$RECEIPT_DIR/product-pr.json")" = true
          test "$(jq -r .head.sha "$RECEIPT_DIR/product-pr.json")" = "$PRODUCT"
          test "$(jq -r .merge_commit_sha "$RECEIPT_DIR/product-pr.json")" = "$MERGE"

          gh api --paginate "/repos/${GH_REPOSITORY}/actions/runs?head_sha=${PRODUCT}&event=pull_request&per_page=100" \
            > "$RECEIPT_DIR/product-runs.json"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/pc53-exact-postmerge-proof')
          data = json.loads((root / 'product-runs.json').read_text())
          newest = {}
          for run in data.get('workflow_runs', []):
              key = run['workflow_id']
              if key not in newest or run['id'] > newest[key]['id']:
                  newest[key] = run
          summary = {
              'count': len(newest),
              'pending': sum(run['status'] != 'completed' for run in newest.values()),
              'failed': sum(
                  run['status'] == 'completed' and run.get('conclusion') != 'success'
                  for run in newest.values()
              ),
              'runs': sorted(
                  (
                      run['name'],
                      run['id'],
                      run['status'],
                      run.get('conclusion'),
                  )
                  for run in newest.values()
              ),
          }
          (root / 'matrix.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
          test "$(jq -r .count "$RECEIPT_DIR/matrix.json")" = 47
          test "$(jq -r .pending "$RECEIPT_DIR/matrix.json")" = 0
          test "$(jq -r .failed "$RECEIPT_DIR/matrix.json")" = 0

      - name: Replay PC-53, floor v51, historical floors, and complete gates
        shell: bash
        run: |
          set -Eeuo pipefail
          git checkout --detach "$MERGE"
          rm -rf build/research

          node test/preference-custody-manifest-v51.test.js
          node tools/compile-preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.mjs
          node tools/validate-preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.mjs
          node test/preference-linkage-repository-commit-tree-blob-diff-review-disposition-owner-scope-assurance.test.js
          node tools/compile-preference-custody-manifest-v51.mjs
          node tools/validate-preference-custody-manifest-v51.mjs
          node test/preference-custody-manifest-v51.test.js

          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do
            node "$test_file"
          done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check

          git fetch --no-tags origin main
          LIVE_MAIN=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$MERGE" "$LIVE_MAIN"
          while IFS= read -r path; do
            test "$(git rev-parse "$MERGE:$path")" = "$(git rev-parse "$LIVE_MAIN:$path")"
          done < "$RECEIPT_DIR/product-paths.txt"

          MERGE_FIRST_PARENT=$(cat "$RECEIPT_DIR/merge-first-parent.txt")
          jq -n \
            --arg status complete \
            --argjson issue "$ISSUE" \
            --argjson product_pr "$PRODUCT_PR" \
            --arg product_commit "$PRODUCT" \
            --arg product_parent "$PRODUCT_PARENT" \
            --arg product_tree "$PRODUCT_TREE" \
            --arg canonical_merge "$MERGE" \
            --arg merge_first_parent "$MERGE_FIRST_PARENT" \
            --arg merge_second_parent "$PRODUCT" \
            --arg live_main "$LIVE_MAIN" \
            --argjson permanent_paths 14 \
            --argjson canonical_product_blob_matches 14 \
            --argjson workflow_matrix 47 \
            '{
              schema_version: "pc53-terminal-receipt@2",
              status: $status,
              issue: $issue,
              product_pr: $product_pr,
              product_commit: $product_commit,
              product_parent: $product_parent,
              product_tree: $product_tree,
              canonical_merge: $canonical_merge,
              merge_first_parent: $merge_first_parent,
              merge_second_parent: $merge_second_parent,
              live_main: $live_main,
              permanent_paths: $permanent_paths,
              canonical_product_blob_matches: $canonical_product_blob_matches,
              workflow_matrix: $workflow_matrix,
              focused_pc53: "pass",
              floor_v51: "pass",
              historical_floor_reconstruction: "pass",
              base_preference_custody: "pass",
              no_magic_human: "pass",
              release_check: "pass",
              outside_human_dependency: false,
              graph_effect: "none"
            }' > "$RECEIPT_DIR/terminal.json"
          sha256sum "$RECEIPT_DIR"/* > "$RECEIPT_DIR/SHA256SUMS"

      - name: Upload exact post-merge proof
        id: proof
        uses: actions/upload-artifact@v4
        with:
          name: pc53-exact-postmerge-proof-1e52a58b
          path: /tmp/pc53-exact-postmerge-proof
          if-no-files-found: error
          retention-days: 90

      - name: Close execution PRs and retire all PC-53 refs
        shell: bash
        env:
          PROOF_ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          PROOF_ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$CENSUS_DIR"

          gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("agent/pc53")) | [.number,.head.ref,.head.sha] | @tsv' \
            | sort -n > "$CENSUS_DIR/open-prs-before.tsv"

          while IFS=$'\t' read -r pr branch sha; do
            [[ -z "$pr" ]] && continue
            gh api --method PATCH "/repos/${GH_REPOSITORY}/pulls/${pr}" -f state=closed >/dev/null
          done < "$CENSUS_DIR/open-prs-before.tsv"

          gh api --paginate "/repos/${GH_REPOSITORY}/git/matching-refs/heads/agent/pc53" \
            --jq '.[] | [.ref,.object.sha] | @tsv' \
            | sed 's#^refs/heads/##' | sort > "$CENSUS_DIR/refs-before.tsv"

          while IFS=$'\t' read -r branch sha; do
            [[ -z "$branch" ]] && continue
            gh api --method DELETE "/repos/${GH_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done < "$CENSUS_DIR/refs-before.tsv"

          gh api --paginate "/repos/${GH_REPOSITORY}/git/matching-refs/heads/agent/pc53" \
            --jq '.[] | [.ref,.object.sha] | @tsv' \
            | sed 's#^refs/heads/##' | sort > "$CENSUS_DIR/refs-after.tsv"
          test ! -s "$CENSUS_DIR/refs-after.tsv"

          gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("agent/pc53")) | [.number,.head.ref,.head.sha] | @tsv' \
            | sort -n > "$CENSUS_DIR/open-prs-after.tsv"
          test ! -s "$CENSUS_DIR/open-prs-after.tsv"

          LIVE_MAIN=$(git rev-parse origin/main)
          jq -n \
            --arg status complete \
            --arg canonical_merge "$MERGE" \
            --arg product_commit "$PRODUCT" \
            --arg live_main "$LIVE_MAIN" \
            --arg proof_artifact_id "$PROOF_ARTIFACT_ID" \
            --arg proof_artifact_digest "$PROOF_ARTIFACT_DIGEST" \
            --argjson retired_refs "$(wc -l < "$CENSUS_DIR/refs-before.tsv" | tr -d ' ')" \
            --argjson closed_prs "$(wc -l < "$CENSUS_DIR/open-prs-before.tsv" | tr -d ' ')" \
            '{
              schema_version: "pc53-terminal-census@1",
              status: $status,
              canonical_merge: $canonical_merge,
              product_commit: $product_commit,
              live_main: $live_main,
              proof_artifact_id: $proof_artifact_id,
              proof_artifact_digest: $proof_artifact_digest,
              retired_refs: $retired_refs,
              closed_execution_prs: $closed_prs,
              remaining_pc53_refs: 0,
              remaining_open_pc53_prs: 0,
              outside_human_dependency: false,
              graph_effect: "none"
            }' > "$CENSUS_DIR/census.json"
          sha256sum "$CENSUS_DIR"/* > "$CENSUS_DIR/SHA256SUMS"

      - name: Upload terminal census
        id: census
        uses: actions/upload-artifact@v4
        with:
          name: pc53-terminal-census-1e52a58b
          path: /tmp/pc53-terminal-census
          if-no-files-found: error
          retention-days: 90

      - name: Write terminal issue receipt and close PC-53
        shell: bash
        env:
          PROOF_ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          PROOF_ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
          CENSUS_ARTIFACT_ID: ${{ steps.census.outputs.artifact-id }}
          CENSUS_ARTIFACT_DIGEST: ${{ steps.census.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          cat > "$CENSUS_DIR/comment.md" <<EOF
          ## PC-53 terminal receipt

          \`\`\`text
          status                                  complete
          product pull request                    #1418
          clean product commit
          $PRODUCT
          clean product tree
          $PRODUCT_TREE
          canonical merge
          $MERGE

          permanent product paths                 14
          canonical/product blob matches       14 / 14
          hosted exact-head workflows          47 / 47
          failed or pending workflows               0
          remaining agent/pc53-* refs               0
          remaining open PC-53 transaction PRs      0
          outside-human dependency                false
          graph effect                              none
          \`\`\`

          Exact post-merge proof:

          \`\`\`text
          workflow run
          $GITHUB_RUN_ID
          artifact
          $PROOF_ARTIFACT_ID
          artifact SHA-256
          $PROOF_ARTIFACT_DIGEST
          \`\`\`

          Terminal census:

          \`\`\`text
          artifact
          $CENSUS_ARTIFACT_ID
          artifact SHA-256
          $CENSUS_ARTIFACT_DIGEST
          \`\`\`

          PC-53 is merged, exact-head qualified, canonically replayed, transport-clean, ref-clean, and terminal.
          EOF
          sed -i 's/^          //' "$CENSUS_DIR/comment.md"
          gh api --method POST "/repos/${GH_REPOSITORY}/issues/${ISSUE}/comments" \
            -f body="$(cat "$CENSUS_DIR/comment.md")" >/dev/null
          gh api --method PATCH "/repos/${GH_REPOSITORY}/issues/${ISSUE}" \
            -f state=closed -f state_reason=completed >/dev/null
