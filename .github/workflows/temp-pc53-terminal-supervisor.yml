name: TEMP supervise and terminalize exact PC-53 transaction

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pc53-terminal-supervisor
  cancel-in-progress: false

jobs:
  terminalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      ISSUE: '1360'
      QUALIFIED_SOURCE_PARENT: 8a2f4538bdbcf9455f02e70c35a71cb39f805b18
      PRODUCT_BRANCH: agent/pc53-materializer
      CARRIER_BRANCH: agent/pc53-materializer-carrier
      RECEIPT_DIR: /tmp/pc53-terminal-supervisor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Reconcile or release exact product authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RECEIPT_DIR"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

          issue_state=$(gh api "/repos/${GH_REPOSITORY}/issues/${ISSUE}" --jq .state)
          refs_now=$(gh api --paginate "/repos/${GH_REPOSITORY}/git/matching-refs/heads/agent/pc53" --jq '.[].ref' 2>/dev/null || true)
          if [[ "$issue_state" == closed && -z "$refs_now" ]]; then
            printf '%s\n' 'status=already_terminal' > "$RECEIPT_DIR/status.txt"
            exit 0
          fi

          product_pr() {
            gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=all&per_page=100" \
              --jq '.[] | select(.head.ref == "agent/pc53-materializer") | .number' \
              | head -n1
          }

          ensure_carrier_pr() {
            if ! gh api "/repos/${GH_REPOSITORY}/git/ref/heads/${CARRIER_BRANCH}" >/dev/null 2>&1; then
              echo "PC-53 carrier branch is absent and no product exists" >&2
              return 1
            fi
            local pr
            pr=$(gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=all&per_page=100" \
              --jq '.[] | select(.head.ref == "agent/pc53-materializer-carrier") | .number' \
              | head -n1)
            if [[ -z "$pr" ]]; then
              gh api --method POST "/repos/${GH_REPOSITORY}/pulls" \
                -f title='TEMP qualify and publish exact PC-53 product — never merge' \
                -f head="$CARRIER_BRANCH" -f base=main \
                -f body='Execution-only, checksum-bound carrier for PC-53 issue #1360. Never merge. It may publish only the exact one-parent, fourteen-path product after focused, historical, no-magic-human, and complete release qualification.' \
                -F draft=true >/dev/null
            else
              local state
              state=$(gh api "/repos/${GH_REPOSITORY}/pulls/${pr}" --jq .state)
              if [[ "$state" == closed ]]; then
                gh api --method PATCH "/repos/${GH_REPOSITORY}/pulls/${pr}" -f state=open >/dev/null
              fi
            fi
          }

          release_runs() {
            local sha="$1"
            local rerun_marker="$RECEIPT_DIR/rerun-${sha}"
            gh api --paginate "/repos/${GH_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" > "$RECEIPT_DIR/runs-${sha}.json"
            jq -r '.workflow_runs[] | select(.status == "action_required" or .status == "waiting") | .id' "$RECEIPT_DIR/runs-${sha}.json" \
              | while read -r run; do
                  [[ -z "$run" ]] && continue
                  gh api --method POST "/repos/${GH_REPOSITORY}/actions/runs/${run}/approve" >/dev/null 2>&1 || true
                done
            if [[ ! -e "$rerun_marker" ]]; then
              jq -r '.workflow_runs[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")) | .id' "$RECEIPT_DIR/runs-${sha}.json" \
                | head -n1 \
                | while read -r run; do
                    [[ -z "$run" ]] && continue
                    gh api --method POST "/repos/${GH_REPOSITORY}/actions/runs/${run}/rerun-failed-jobs" >/dev/null 2>&1 || \
                      gh api --method POST "/repos/${GH_REPOSITORY}/actions/runs/${run}/rerun" >/dev/null 2>&1 || true
                    touch "$rerun_marker"
                  done
            fi
          }

          product=$(product_pr || true)
          if [[ -z "$product" ]]; then
            ensure_carrier_pr
          fi

          for attempt in $(seq 1 240); do
            product=$(product_pr || true)
            if [[ -n "$product" ]]; then
              state=$(gh api "/repos/${GH_REPOSITORY}/pulls/${product}" --jq .state)
              merged=$(gh api "/repos/${GH_REPOSITORY}/pulls/${product}" --jq .merged)
              if [[ "$state" == open || "$merged" == true ]]; then
                break
              fi
            fi
            carrier_sha=$(gh api "/repos/${GH_REPOSITORY}/git/ref/heads/${CARRIER_BRANCH}" --jq .object.sha 2>/dev/null || true)
            if [[ -n "$carrier_sha" ]]; then release_runs "$carrier_sha"; fi
            sleep 30
          done

          product=$(product_pr || true)
          test -n "$product"
          gh api "/repos/${GH_REPOSITORY}/pulls/${product}" > "$RECEIPT_DIR/product-pr.json"
          PRODUCT=$(jq -r .head.sha "$RECEIPT_DIR/product-pr.json")
          PRODUCT_STATE=$(jq -r .state "$RECEIPT_DIR/product-pr.json")
          PRODUCT_MERGED=$(jq -r .merged "$RECEIPT_DIR/product-pr.json")
          git fetch --no-tags origin "$PRODUCT"
          mapfile -t parents < <(git show -s --format='%P' "$PRODUCT" | tr ' ' '\n')
          test "${#parents[@]}" -eq 1
          PARENT="${parents[0]}"
          git merge-base --is-ancestor "$QUALIFIED_SOURCE_PARENT" "$PARENT"

          git diff --name-status "$PARENT" "$PRODUCT" > "$RECEIPT_DIR/product-delta.tsv"
          test "$(wc -l < "$RECEIPT_DIR/product-delta.tsv" | tr -d ' ')" = 14
          awk '$1 != "A" { exit 1 }' "$RECEIPT_DIR/product-delta.tsv"
          cut -f2 "$RECEIPT_DIR/product-delta.tsv" | sort > "$RECEIPT_DIR/product-paths.txt"
          test "$(sort -u "$RECEIPT_DIR/product-paths.txt" | wc -l | tr -d ' ')" = 14
          if grep -E '(^|/)(\.pc53|temp-|carrier|materializer|controller|diagnostic|receipt|marker|pulse|trigger|shard)' "$RECEIPT_DIR/product-paths.txt"; then
            echo 'transport path entered product' >&2
            exit 1
          fi
          test "$(grep -c '^\.github/workflows/' "$RECEIPT_DIR/product-paths.txt")" = 2
          while IFS= read -r workflow; do
            [[ "$workflow" != .github/workflows/* ]] && continue
            git show "$PRODUCT:$workflow" > "$RECEIPT_DIR/$(basename "$workflow")"
            grep -Eq '^permissions:' "$RECEIPT_DIR/$(basename "$workflow")"
            grep -Eq 'contents:[[:space:]]*read' "$RECEIPT_DIR/$(basename "$workflow")"
            ! grep -Eq 'contents:[[:space:]]*write|pull-requests:[[:space:]]*write|issues:[[:space:]]*write|actions:[[:space:]]*write' "$RECEIPT_DIR/$(basename "$workflow")"
          done < "$RECEIPT_DIR/product-paths.txt"

          git diff --name-only "$QUALIFIED_SOURCE_PARENT" "$PARENT" | sort > "$RECEIPT_DIR/main-successor-paths.txt"
          comm -12 "$RECEIPT_DIR/product-paths.txt" "$RECEIPT_DIR/main-successor-paths.txt" > "$RECEIPT_DIR/overlap.txt"
          test ! -s "$RECEIPT_DIR/overlap.txt"

          if [[ "$PRODUCT_MERGED" != true ]]; then
            for attempt in $(seq 1 240); do
              release_runs "$PRODUCT"
              gh api --paginate "/repos/${GH_REPOSITORY}/actions/runs?head_sha=${PRODUCT}&event=pull_request&per_page=100" > "$RECEIPT_DIR/product-runs.json"
              python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/pc53-terminal-supervisor/product-runs.json').read_text())
          newest={}
          for run in data.get('workflow_runs',[]):
              key=run['workflow_id']
              if key not in newest or run['id']>newest[key]['id']:
                  newest[key]=run
          summary={
              'count':len(newest),
              'pending':sum(r['status']!='completed' for r in newest.values()),
              'failed':sum(r['status']=='completed' and r.get('conclusion')!='success' for r in newest.values()),
              'runs':sorted((r['name'],r['id'],r['status'],r.get('conclusion')) for r in newest.values()),
          }
          Path('/tmp/pc53-terminal-supervisor/matrix.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY
              count=$(jq -r .count "$RECEIPT_DIR/matrix.json")
              pending=$(jq -r .pending "$RECEIPT_DIR/matrix.json")
              failed=$(jq -r .failed "$RECEIPT_DIR/matrix.json")
              if [[ "$count" -ge 47 && "$pending" -eq 0 && "$failed" -eq 0 ]]; then break; fi
              sleep 30
            done
            test "$(jq -r .count "$RECEIPT_DIR/matrix.json")" -ge 47
            test "$(jq -r .pending "$RECEIPT_DIR/matrix.json")" = 0
            test "$(jq -r .failed "$RECEIPT_DIR/matrix.json")" = 0

            unresolved=$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}} reviews(first:100){nodes{state}}}}}' \
              -f owner="${GH_REPOSITORY%%/*}" -f repo="${GH_REPOSITORY##*/}" -F number="$product" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
            changes_requested=$(gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviews(first:100){nodes{state}}}}}' \
              -f owner="${GH_REPOSITORY%%/*}" -f repo="${GH_REPOSITORY##*/}" -F number="$product" \
              --jq '[.data.repository.pullRequest.reviews.nodes[] | select(.state == "CHANGES_REQUESTED")] | length')
            test "$unresolved" = 0
            test "$changes_requested" = 0

            mergeable='UNKNOWN'
            for attempt in $(seq 1 30); do
              mergeable=$(gh api "/repos/${GH_REPOSITORY}/pulls/${product}" --jq .mergeable_state)
              [[ "$mergeable" != unknown ]] && break
              sleep 10
            done
            [[ "$mergeable" == clean || "$mergeable" == unstable || "$mergeable" == has_hooks ]]
            gh api --method PUT "/repos/${GH_REPOSITORY}/pulls/${product}/merge" \
              -f merge_method=merge -f sha="$PRODUCT" \
              -f commit_title='Complete PC-53 repository and review-scope identity custody' \
              -f commit_message='Merge the exact one-parent, fourteen-path PC-53 product after complete exact-head qualification, independent adversarial review, zero current-main overlap, and preserved authority ceilings.' \
              > "$RECEIPT_DIR/merge.json"
            test "$(jq -r .merged "$RECEIPT_DIR/merge.json")" = true
            MERGE=$(jq -r .sha "$RECEIPT_DIR/merge.json")
          else
            MERGE=$(jq -r .merge_commit_sha "$RECEIPT_DIR/product-pr.json")
          fi
          printf '%s\n' "$PRODUCT" > "$RECEIPT_DIR/product.txt"
          printf '%s\n' "$PARENT" > "$RECEIPT_DIR/product-parent.txt"
          printf '%s\n' "$MERGE" > "$RECEIPT_DIR/merge.txt"

      - name: Prove exact canonical merge and replay complete estate
        shell: bash
        run: |
          set -Eeuo pipefail
          PRODUCT=$(cat "$RECEIPT_DIR/product.txt")
          PARENT=$(cat "$RECEIPT_DIR/product-parent.txt")
          MERGE=$(cat "$RECEIPT_DIR/merge.txt")
          git fetch --no-tags origin main "$MERGE" "$PRODUCT" "$PARENT"
          mapfile -t merge_parents < <(git show -s --format='%P' "$MERGE" | tr ' ' '\n')
          test "${#merge_parents[@]}" -eq 2
          test "${merge_parents[1]}" = "$PRODUCT"
          test "$(git show -s --format='%P' "$PRODUCT")" = "$PARENT"
          while IFS= read -r path; do
            test "$(git rev-parse "$PRODUCT:$path")" = "$(git rev-parse "$MERGE:$path")"
          done < "$RECEIPT_DIR/product-paths.txt"
          LIVE_MAIN=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$MERGE" "$LIVE_MAIN"
          while IFS= read -r path; do
            test "$(git rev-parse "$MERGE:$path")" = "$(git rev-parse "$LIVE_MAIN:$path")"
          done < "$RECEIPT_DIR/product-paths.txt"

          git checkout --detach "$MERGE"
          rm -rf build/research
          node test/preference-custody-manifest-v51.test.js
          node tools/compile-preference-linkage-repository-review-scope-assurance.mjs
          node tools/validate-preference-linkage-repository-review-scope-assurance.mjs
          node test/preference-linkage-repository-review-scope-assurance.test.js
          node tools/compile-preference-custody-manifest-v51.mjs
          node tools/validate-preference-custody-manifest-v51.mjs
          node test/preference-custody-manifest-v51.test.js
          for test_file in $(find test -maxdepth 1 -type f -name 'preference-custody-manifest-v*.test.js' | sort -V); do node "$test_file"; done
          node test/preference-custody-manifest.test.js
          node tools/validate-no-magic-human-gate.mjs
          node test/no-magic-human-gate.test.js
          npm run release:check

          LIVE_MAIN=$(git rev-parse origin/main)
          cat > "$RECEIPT_DIR/terminal.json" <<EOF
          {
            "schema_version": "pc53-terminal-receipt@1",
            "status": "complete",
            "issue": 1360,
            "product_pr": $(cat "$RECEIPT_DIR/product-pr.json" | jq .number),
            "product_commit": "$PRODUCT",
            "product_parent": "$PARENT",
            "product_tree": "$(git rev-parse "$PRODUCT^{tree}")",
            "canonical_merge": "$MERGE",
            "merge_first_parent": "$(git show -s --format='%P' "$MERGE" | cut -d' ' -f1)",
            "merge_second_parent": "$PRODUCT",
            "live_main": "$LIVE_MAIN",
            "permanent_paths": 14,
            "canonical_product_blob_matches": 14,
            "outside_human_dependency": false,
            "graph_effect": "none"
          }
          EOF
          sha256sum "$RECEIPT_DIR"/* > "$RECEIPT_DIR/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: pc53-exact-postmerge-proof
          path: /tmp/pc53-terminal-supervisor
          if-no-files-found: error
          retention-days: 90

      - name: Close execution lanes, retire refs, and close issue
        shell: bash
        run: |
          set -Eeuo pipefail
          PRODUCT=$(cat "$RECEIPT_DIR/product.txt")
          MERGE=$(cat "$RECEIPT_DIR/merge.txt")
          LIVE_MAIN=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$MERGE" "$LIVE_MAIN"
          while IFS= read -r path; do
            test "$(git rev-parse "$MERGE:$path")" = "$(git rev-parse "$LIVE_MAIN:$path")"
          done < "$RECEIPT_DIR/product-paths.txt"

          gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("agent/pc53")) | .number' \
            | while read -r pr; do
                [[ -z "$pr" ]] && continue
                gh api --method PATCH "/repos/${GH_REPOSITORY}/pulls/${pr}" -f state=closed >/dev/null
              done

          gh api --paginate "/repos/${GH_REPOSITORY}/git/matching-refs/heads/agent/pc53" \
            --jq '.[].ref' 2>/dev/null \
            | sed 's#^refs/heads/##' \
            | while read -r branch; do
                [[ -z "$branch" ]] && continue
                gh api --method DELETE "/repos/${GH_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
              done

          sleep 3
          refs=$(gh api --paginate "/repos/${GH_REPOSITORY}/git/matching-refs/heads/agent/pc53" --jq 'length' 2>/dev/null | awk '{s+=$1} END{print s+0}')
          prs=$(gh api --paginate "/repos/${GH_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.head.ref | startswith("agent/pc53"))] | length' \
            | awk '{s+=$1} END{print s+0}')
          test "$refs" = 0
          test "$prs" = 0

          artifact_run="$GITHUB_RUN_ID"
          comment=$(cat <<EOF
          ## PC-53 terminal receipt

          \`\`\`text
          status                                  complete
          clean product commit                    $PRODUCT
          canonical merge                         $MERGE
          permanent product paths                 14
          canonical/product blob matches          14 / 14
          remaining agent/pc53-* refs              0
          remaining open PC-53 transaction PRs     0
          outside-human dependency                 false
          graph effect                             none
          proof workflow run                       $artifact_run
          \`\`\`

          PC-53 is merged, canonically replayed, transport-clean, ref-clean, and terminal.
          EOF
          )
          gh api --method POST "/repos/${GH_REPOSITORY}/issues/${ISSUE}/comments" -f body="$comment" >/dev/null
          gh api --method PATCH "/repos/${GH_REPOSITORY}/issues/${ISSUE}" -f state=closed -f state_reason=completed >/dev/null
