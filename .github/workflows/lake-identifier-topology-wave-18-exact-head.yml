name: Validate exact Wave 18 materialization head

on:
  push:
    branches:
      - agent/lake-identifier-topology-wave-18
    paths:
      - '.github/tmp/lake-identifier-topology-wave-18-exact-head-trigger.json'

permissions:
  contents: read

concurrency:
  group: lake-identifier-topology-wave-18-exact-head
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: d9e4ca85189eb03cbfb7e659ae25e1c7ed435279
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact materialization commit in a detached worktree
        shell: bash
        run: |
          set -euo pipefail
          target_tree=$(git rev-parse "${TARGET_SHA}^{tree}")
          git cat-file -e "${TARGET_SHA}^{commit}"
          git worktree add --detach /tmp/wave18-exact "${TARGET_SHA}"
          cd /tmp/wave18-exact
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          npm run release:check
          node tools/validate-lake-index-shards.mjs
          node tools/validate-lake-basin-index.mjs
          node tools/validate-lake-identifier-topology-wave-18.mjs
          node test/lake-index.test.js
          node test/lake-basin-index.test.js
          node test/lake-identifier-topology-wave-18.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
          receipt_sha=$(sha256sum data/project/lake-identifier-topology-wave-18.json | awk '{print $1}')
          {
            echo '## Exact Wave 18 clean-head validation'
            echo
            echo '```text'
            echo "target commit: ${TARGET_SHA}"
            echo "target tree:   ${target_tree}"
            echo "receipt sha256:${receipt_sha}"
            echo 'release gate:  passed'
            echo 'lake shards:   passed'
            echo 'lake basins:   passed'
            echo 'Wave 18 gate:  passed'
            echo 'worktree drift:none'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
