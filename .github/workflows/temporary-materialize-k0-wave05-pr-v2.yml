name: Temporary materialize K0 role-neutral Wave 05 from PR v2
# Carrier recovered uniquely as a valid seven-file gzip tar and bound below by exact SHA-256.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-materialize-k0-wave05-pr-v2.yml'
  push:
    branches:
      - agent/k0-role-neutral-wave-05
    paths:
      - '.github/workflows/temporary-materialize-k0-wave05-pr-v2.yml'
      - '.github/tmp/k0-wave05-materializer-part-*.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k0-role-neutral-wave-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand uniquely recovered Wave 05 source package
        run: |
          cat .github/tmp/k0-wave05-materializer-part-*.b64 | base64 -d > /tmp/k0-wave05-materializer.tgz
          test "$(sha256sum /tmp/k0-wave05-materializer.tgz | awk '{print $1}')" = "191727093d18d1df7684f0b57883544f935f481aa67c9125d2f0693437221aca"
          rm -rf /tmp/k0-wave05-materializer
          mkdir -p /tmp/k0-wave05-materializer
          tar -xzf /tmp/k0-wave05-materializer.tgz -C /tmp/k0-wave05-materializer
          test "$(find /tmp/k0-wave05-materializer -type f | wc -l)" = "7"

      - name: Materialize and validate Wave 05
        run: |
          node /tmp/k0-wave05-materializer/materialize-k0-role-neutral-wave-05.mjs
          python - <<'PYSTALE'
          from pathlib import Path
          path = Path('tools/validate-k0-epistemic-admissibility.mjs')
          text = path.read_text()
          old = "if (pendingFieldMetric?.observed !== 0 || pendingFieldMetric?.source !== 'data/research/k0-wave04-field-adjudication.json') fail('Wave 04 coverage metric drift');"
          new = "if (pendingFieldMetric?.observed !== 2 || pendingFieldMetric?.source !== 'data/research/k0-role-neutral-wave-05.json') fail('Wave 05 coverage metric drift');"
          assert text.count(old) == 1, 'stale Wave 04 metric anchor missing or duplicated'
          path.write_text(text.replace(old, new))
          PYSTALE
          node tools/build-k0-role-neutral-wave-05.mjs
          node tools/validate-k0-role-neutral-wave-05.mjs
          node test/k0-role-neutral-wave-05.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Reconstruct exact permanent package
        run: |
          git restore --staged --worktree .
          git clean -fd
          node /tmp/k0-wave05-materializer/materialize-k0-role-neutral-wave-05.mjs
          python - <<'PYSTALE'
          from pathlib import Path
          path = Path('tools/validate-k0-epistemic-admissibility.mjs')
          text = path.read_text()
          old = "if (pendingFieldMetric?.observed !== 0 || pendingFieldMetric?.source !== 'data/research/k0-wave04-field-adjudication.json') fail('Wave 04 coverage metric drift');"
          new = "if (pendingFieldMetric?.observed !== 2 || pendingFieldMetric?.source !== 'data/research/k0-role-neutral-wave-05.json') fail('Wave 05 coverage metric drift');"
          assert text.count(old) == 1, 'stale Wave 04 metric anchor missing or duplicated'
          path.write_text(text.replace(old, new))
          PYSTALE
          node tools/build-k0-role-neutral-wave-05.mjs
          node tools/validate-k0-role-neutral-wave-05.mjs
          node test/k0-role-neutral-wave-05.test.js
          node tools/build-k0-epistemic-admissibility.mjs
          node tools/validate-k0-epistemic-admissibility.mjs
          node test/k0-epistemic-admissibility.test.js
          node tools/validate-corpus-selection.mjs
          node tools/validate-consumption-contract.mjs

      - name: Enforce permanent path denominator
        run: |
          python - <<'PYDENOM'
          import subprocess
          expected = {
              '.github/workflows/k0-role-neutral-wave-05.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/project/k0-role-neutral-wave-05-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-05.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-05.md',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-05.html',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-05.json',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-05.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/build-k0-role-neutral-wave-05.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-05.mjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          actual = changed | untracked
          assert actual == expected, f'path mismatch\nmissing={sorted(expected-actual)}\nextra={sorted(actual-expected)}'
          PYDENOM

      - name: Create exact blobs and export transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYBLOBS'
          import base64, json, os, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          paths = [
              '.github/workflows/k0-role-neutral-wave-05.yml',
              'data/project/k0-epistemic-admissibility-methodology.json',
              'data/project/k0-epistemic-admissibility-release-manifest.json',
              'data/project/k0-role-neutral-wave-05-release-manifest.json',
              'data/research/corpus-coverage.json',
              'data/research/k0-role-neutral-denominator.json',
              'data/research/k0-role-neutral-wave-05.json',
              'data/research/selection-adversarial-reviews.json',
              'docs/milestones/m05-k0-role-neutral-wave-05.md',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-05.html',
              'reports/core-thesis/answerable-power/k0-role-neutral-wave-05.json',
              'reports/core-thesis/answerable-power/k0.html',
              'reports/core-thesis/answerable-power/k0.json',
              'test/k0-role-neutral-wave-05.test.js',
              'tools/build-k0-epistemic-admissibility.mjs',
              'tools/build-k0-role-neutral-wave-05.mjs',
              'tools/validate-k0-epistemic-admissibility.mjs',
              'tools/validate-k0-role-neutral-wave-05.mjs',
          ]
          def post(path, payload):
              req = urllib.request.Request(api + path, data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'k0-role-neutral-wave-05-pr-v2',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          rows = []
          for path in paths:
              raw = open(path, 'rb').read()
              blob = post(f'/repos/{repo}/git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              index_row = subprocess.check_output(['git','ls-files','-s','--',path], text=True).strip()
              mode = index_row.split()[0] if index_row else '100644'
              rows.append({'path': path, 'sha': blob['sha'], 'bytes': len(raw), 'mode': mode})
          receipt = {
              'schema_version': 'k0-role-neutral-wave-05-transaction@3',
              'repository': repo,
              'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'base_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'updates': rows,
              'deletions': [
                  '.github/tmp/k0-wave05-clean-head-trigger.txt',
                  '.github/tmp/k0-wave05-materializer-part-00.b64',
                  '.github/tmp/k0-wave05-materializer-part-01.b64',
                  '.github/tmp/k0-wave05-materializer-part-02.b64',
                  '.github/tmp/k0-wave05-materializer-part-03.b64',
                  '.github/workflows/temporary-apply-k0-wave05-transaction.yml',
                  '.github/workflows/temporary-diagnose-k0-wave05-carrier.yml',
                  '.github/workflows/temporary-materialize-k0-wave05-pr-v2.yml',
                  '.github/workflows/temporary-materialize-k0-wave05-pr.yml',
                  '.github/workflows/temporary-materialize-k0-wave05.yml',
                  '.github/workflows/temporary-retrigger-k0-wave05.yml',
              ],
              'source_package_sha256': '191727093d18d1df7684f0b57883544f935f481aa67c9125d2f0693437221aca',
              'rejected_claimed_sha256': '58848239eaff432d0ff4c6f164bff3e4e1e4cefaec8288b7629feb8d5fb3c674',
              'unsupported_intermediate_sha256': '229b15062e72d756d7fbda7eec1c6345530f00edfe4462cff403826be00b76a5',
              'carrier_repair': {'fragment': 0, 'byte_offset': 293, 'inserted_character': 'O', 'unique_valid_gzip_tar_reconstruction': True},
              'aggregate_repair': {'old_metric': 'Wave04 field pending = 0', 'new_metric': 'Wave05 discovery pending = 2', 'anchor_count': 1},
              'included_events': 0,
              'publication_cleared': False,
              'graph_effect': 'none',
              'ref_updated': False,
          }
          os.makedirs('/tmp/k0-wave05-export', exist_ok=True)
          with open('/tmp/k0-wave05-export/BLOB_RECEIPTS.json', 'w') as handle:
              json.dump(receipt, handle, indent=2); handle.write('\n')
          print(json.dumps(receipt, indent=2))
          PYBLOBS

      - name: Export validated transaction
        uses: actions/upload-artifact@v4
        with:
          name: k0-role-neutral-wave-05-validated-transaction-v3
          path: /tmp/k0-wave05-export/BLOB_RECEIPTS.json
          if-no-files-found: error
          retention-days: 30
