name: Counter-Selector Wave 32 candidate handoff application

on:
  pull_request:
    paths:
      - '.github/workflows/counter-selector-wave-32.yml'
      - 'data/project/counter-selector-wave-32-*.json'
      - 'schemas/counter-selector-candidate-handoff-application.schema.json'
      - 'docs/methods/counter-selector-candidate-handoff-application.md'
      - 'docs/milestones/counter-selector-wave-32.md'
      - 'tools/build-counter-selector-wave-32.mjs'
      - 'tools/validate-counter-selector-wave-32.mjs'
      - 'test/counter-selector-wave-32.test.js'
      - 'reports/core-thesis/counter-selector-wave-32/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Wave 32 products
        run: node tools/build-counter-selector-wave-32.mjs
      - name: Validate candidate handoff application
        run: node tools/validate-counter-selector-wave-32.mjs
      - name: Run adversarial mutations
        run: node test/counter-selector-wave-32.test.js
      - name: Require exact committed Wave 32 products
        run: git diff --exit-code -- data/project/counter-selector-wave-32-handoff-registry.json data/project/counter-selector-wave-32-release-manifest.json reports/core-thesis/counter-selector-wave-32/data.json reports/core-thesis/counter-selector-wave-32/index.html
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Reconstruct Wave 32 deterministically
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-32.mjs
          node tools/validate-counter-selector-wave-32.mjs
          node test/counter-selector-wave-32.test.js
          git diff --exit-code -- data/project/counter-selector-wave-32-handoff-registry.json data/project/counter-selector-wave-32-release-manifest.json reports/core-thesis/counter-selector-wave-32/data.json reports/core-thesis/counter-selector-wave-32/index.html
          test -z "$(git status --porcelain)"
