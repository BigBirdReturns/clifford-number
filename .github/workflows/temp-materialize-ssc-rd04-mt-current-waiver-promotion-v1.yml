name: TEMP materialize exact Montana current-waiver promotion v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-ssc-rd04-mt-current-waiver-promotion-v1.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: temp-materialize-ssc-rd04-mt-current-waiver-promotion-v1
  cancel-in-progress: false

env:
  CARRIER_BRANCH: agent/ssc-rd04-mt-current-waiver-promotion-materializer-base-v1
  TARGET_BRANCH: agent/ssc-rd04-mt-current-waiver-promotion-product-v1
  CARRIER_PATH: .github/workflows/temp-materialize-ssc-rd04-mt-current-waiver-promotion-v1.yml
  STANDING_WORKFLOW: .github/workflows/status-sovereignty-rd-wave03-rd04-mt-current-waiver-promotion.yml
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion
  MILESTONE: docs/milestones/ssc-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion.md
  SCHEMA: schemas/status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion.schema.json
  TEST: test/status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion.test.py
  BUILDER: tools/build-status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion.py
  VALIDATOR: tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion.py
  OUT: /tmp/ssc-rd04-mt-current-waiver-promotion-materializer-v1
  WORK: /tmp/ssc-rd04-mt-current-waiver-promotion-work-v1

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ssc-rd04-mt-current-waiver-promotion-materializer-base-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Construct, qualify, and publish the exact fourteen-path product
        id: materialize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT" "$WORK"
          printf '%s\n' bootstrap > "$OUT/STAGE"
          printf '%s\n' 1 > "$OUT/EXIT_CODE"
          fail() {
            local rc=$? stage="$(cat "$OUT/STAGE" 2>/dev/null || echo unknown)"
            trap - ERR
            python - "$OUT/receipt.json" "$stage" "$rc" <<'PYFAIL'
          import json,os,sys
          path,stage,rc=sys.argv[1],sys.argv[2],int(sys.argv[3])
          value={'schema_version':'ssc-rd04-mt-current-waiver-promotion-materializer@1','state':'failed_closed','failed_or_final_stage':stage,'exit_code':rc,'canonical_parent':os.environ.get('BASE_SHA'),'target_branch':os.environ.get('TARGET_BRANCH'),'product_commit':None,'product_tree':None,'permanent_paths':14,'source_requests':0,'route_executions':0,'source_admissions':0,'field_terminalizations':0,'matrix_updates':0,'row_state_mutations':0,'row_terminalizations':0,'class_closed':False,'cumulative_ledger_effect':'none','outside_human_dependency':False,'publication_effect':'none','adoption_effect':'none','graph_effect':'none'}
          open(path,'w').write(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PYFAIL
            (cd "$OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
            exit "$rc"
          }
          trap fail ERR

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = 1
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = "$CARRIER_PATH"
          test "$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD)" = "$CARRIER_PATH"
          test -z "$(git diff --name-only --diff-filter=MDTCRUXB "$BASE_SHA" HEAD)"
          git diff --check "$BASE_SHA" HEAD
          git fetch --no-tags --force origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          TARGET_OLD="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$(git rev-parse "$TARGET_OLD^")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$TARGET_OLD")" = "$STANDING_WORKFLOW"
          STANDING_BLOB="$(git rev-parse "$TARGET_OLD:$STANDING_WORKFLOW")"
          printf '%s\n' "$TARGET_OLD" > "$OUT/target-old.txt"
          printf '%s\n' "$STANDING_BLOB" > "$OUT/standing-workflow-blob.txt"

          printf '%s\n' generate > "$OUT/STAGE"
          git worktree add --detach "$WORK/repo" "$BASE_SHA"
          git show "$TARGET_OLD:$STANDING_WORKFLOW" > "$WORK/standing-workflow.yml"
          cat > "$WORK/generate.py" <<'PYGEN'
          from __future__ import annotations
          import copy, hashlib, json, os, pathlib, subprocess, sys

          ROOT=pathlib.Path(sys.argv[1])
          BASE=os.environ['BASE_SHA']
          PRODUCT_ROOT=pathlib.Path(os.environ['PRODUCT_ROOT'])
          TARGET_FIELD='abawd_or_work_requirement_waiver_state_and_governing_period'
          CANDIDATE_ID='RD04-PPN-MT-FIXED-PROTOCOL-CANDIDATE-ABAWD-WAIVER-STATE-AND-GOVERNING-PERIOD'
          DECISION_ID='RD04-PPN-MT-ABAWD-WAIVER-STATE-AND-GOVERNING-PERIOD'
          SOURCE_ID='RD04-W03-PPN-MT-001'
          CURRENT_CELL_SHA='8038457db737326ae32405c31a56ed656f00eefd71ed3cdf99091ffcaf594f42'
          PROPOSED_CELL_SHA='0583ff798febf55f3b50028ebd8452a4fcaa5409561eac7bd6e2039ecd2f0db0'
          AUTH={'source_requests':0,'route_executions':0,'source_admissions':0,'field_terminalizations':0,'matrix_updates':0,'row_state_mutations':0,'row_terminalizations':0,'class_closed':False,'cumulative_ledger_effect':'none','outside_human_dependency':False,'publication_effect':'none','adoption_effect':'none','graph_effect':'none'}
          def dump(v): return (json.dumps(v,indent=2,ensure_ascii=False)+'\n').encode()
          def canon(v): return json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          def sha(b): return hashlib.sha256(b).hexdigest()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
