          before_sha=sha(before_raw); before_blob=blob(before_raw)
          counts=matrix['counts']; result=matrix['current_result']
          assert counts['terminal_cells']==229 and counts['still_open_cells']==221
          assert counts['terminal_substantive_cells']==118 and counts['still_open_substantive_cells']==182
          assert counts['terminal_units']==11 and result['terminal_units']==11
          assert current_row['row_state']=='still_open' and current_row['terminal_fields']==7 and current_row['open_fields']==2
          current_row_sha=sha(canon(current_row)); current_cell_obj=copy.deepcopy(current_cell)

          promoted=copy.deepcopy(matrix)
          mt=next(x for x in promoted['rows'] if x.get('postal_code')=='MT' or x.get('unit_id')=='US-STATE-MT')
          index=next(i for i,x in enumerate(mt['cells']) if x.get('field_id')==TARGET_FIELD)
          mt['cells'][index]=copy.deepcopy(proposed_cell)
          mt['terminal_fields']=8; mt['open_fields']=1; mt['row_state']='still_open'
          c=promoted['counts']; c['terminal_cells']=230; c['still_open_cells']=220; c['terminal_substantive_cells']=119; c['still_open_substantive_cells']=181; c['evidence_complete_cells']=c.get('evidence_complete_cells',0)+1
          c['postpromotion_mt_current_waiver_candidate_cells']=1; c['newly_terminalized_postpromotion_mt_current_waiver_cells']=1
          r=promoted['current_result']; r['terminal_cells']='230/450'; r['still_open_cells']='220/450'; r['terminal_substantive_cells']=119; r['still_open_substantive_cells']=181; r['terminal_units']=11; r['field_matrix_terminal']=False; r['class_state']='still_open'; r['class_closed']=False
          promoted['schema_version']='ssc-rd04-wave03-postpromotion-mt-current-waiver-promoted-partial-field-matrix@1'
          after_row=next(x for x in promoted['rows'] if x.get('postal_code')=='MT' or x.get('unit_id')=='US-STATE-MT')
          after_row_sha=sha(canon(after_row))
          unchanged=sha(b''.join(canon(x)+b'\n' for x in promoted['rows'] if x is not after_row))
          metadata={'canonical_parent':BASE,'validation_root':VROOT.relative_to(ROOT).as_posix(),'candidate_id':CANDIDATE_ID,'decision_id':DECISION_ID,'source_id':SOURCE_ID,'predecessor_matrix_path':matrix_rel,'predecessor_matrix_bytes':len(before_raw),'predecessor_matrix_sha256':before_sha,'predecessor_matrix_git_blob':before_blob,'current_cell_sha256':CURRENT_CELL_SHA,'proposed_cell_sha256':PROPOSED_CELL_SHA,'current_row_sha256':current_row_sha,'promoted_row_sha256':after_row_sha,'unchanged_non_target_rows_sha256':unchanged,'field_terminalizations':1,'matrix_updates':1,'row_state_mutations':0,'row_terminalizations':0,'class_closed':False,'cumulative_ledger_effect':'none'}
          promoted['postpromotion_mt_current_waiver_promotion_product']=metadata
          promoted_raw=dump(promoted); promoted_sha=sha(promoted_raw); promoted_blob=blob(promoted_raw)
          vrows=[]
          for p,v in vdocs:
              b=p.read_bytes(); vrows.append({'path':p.relative_to(ROOT).as_posix(),'bytes':len(b),'sha256':sha(b),'git_blob':blob(b)})
          input_custody={'schema_version':'ssc-rd04-mt-current-waiver-promotion-input-custody@1','issue':1017,'wave_id':'SSC-RD-W03','lane_id':'RD-04','class_id':'RD-04-C02','canonical_parent':BASE,'predecessor_matrix':{'path':matrix_rel,'bytes':len(before_raw),'sha256':before_sha,'git_blob':before_blob},'validation_root':VROOT.relative_to(ROOT).as_posix(),'validation_files':vrows,'target':{'unit_id':'US-STATE-MT','field_id':TARGET_FIELD,'current_cell_sha256':CURRENT_CELL_SHA,'proposed_cell_sha256':PROPOSED_CELL_SHA,'current_row_sha256':current_row_sha},'authority_boundary':AUTH}
          decision={'schema_version':'ssc-rd04-mt-current-waiver-promotion-decision@1','issue':1017,'candidate_id':CANDIDATE_ID,'decision_id':DECISION_ID,'source_id':SOURCE_ID,'unit_id':'US-STATE-MT','field_id':TARGET_FIELD,'current_cell':current_cell_obj,'proposed_cell':proposed_cell,'finding':'montana_snap_manual_802_1_statewide_waiver_effective_2026_02_26_for_one_year','promotion_state':'promoted_exact_validated_candidate','authority_boundary':{**AUTH,'field_terminalizations':1,'matrix_updates':1}}
