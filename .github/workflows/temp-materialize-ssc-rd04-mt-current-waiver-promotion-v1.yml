          (ROOT/os.environ['MILESTONE']).parent.mkdir(parents=True,exist_ok=True); (ROOT/os.environ['MILESTONE']).write_text(milestone)
          def schema_for(v):
              if isinstance(v,dict): return {'type':'object','required':list(v.keys()),'properties':{k:schema_for(x) for k,x in v.items()},'additionalProperties':False}
              if isinstance(v,list): return {'type':'array','items':schema_for(v[0]) if v else {}}
