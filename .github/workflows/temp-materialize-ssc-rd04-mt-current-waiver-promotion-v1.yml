              if isinstance(v,dict):
                  yield v
                  for child in v.values(): yield from walk(child)
              elif isinstance(v,list):
                  for child in v: yield from walk(child)
          def strings(v):
              if isinstance(v,str): yield v
              elif isinstance(v,dict):
                  for child in v.values(): yield from strings(child)
              elif isinstance(v,list):
                  for child in v: yield from strings(child)
          validation_files=[]
          for p in (ROOT/'data/intake').rglob('*.json'):
              try:
                  text=p.read_text(encoding='utf-8')
              except Exception: continue
              if CANDIDATE_ID in text: validation_files.append(p)
          if not validation_files: raise SystemExit('Montana candidate validation not found on canonical parent')
          roots={p.parent for p in validation_files}
          scored=[]
          for r in roots:
              docs=[]
              for p in sorted(r.glob('*.json')):
                  try: docs.append((p,load(p)))
                  except Exception: pass
              score=sum(CANDIDATE_ID in p.read_text(encoding='utf-8') for p,_ in docs)
              if any(any(d.get(k) is True for k in ('separate_promotion_product_authorized','promotion_authorized')) for _,v in docs for d in walk(v)):
                  score+=100
              scored.append((score,r,docs))
          score,VROOT,vdocs=max(scored,key=lambda x:x[0])
          if score<100: raise SystemExit('no canonically authorized Montana validation root')
          proposed=[]
          for _,v in vdocs:
              for d in walk(v):
                  if d.get('field_id')==TARGET_FIELD and d.get('terminal') is True and sha(canon(d))==PROPOSED_CELL_SHA: proposed.append(copy.deepcopy(d))
          if len(proposed)!=1: raise SystemExit(f'proposed cell denominator {len(proposed)}')
          proposed_cell=proposed[0]
          refs=[]
          for _,v in vdocs:
              for s in strings(v):
                  if s.endswith('promoted-partial-field-matrix.json') and (ROOT/s).is_file(): refs.append(s)
          refs=sorted(set(refs))
          candidates=[]
          for rel in refs:
              value=load(ROOT/rel)
              rows=value.get('rows',[])
              row=next((x for x in rows if x.get('postal_code')=='MT' or x.get('unit_id')=='US-STATE-MT'),None)
              if not row: continue
              cell=next((x for x in row.get('cells',[]) if x.get('field_id')==TARGET_FIELD),None)
              if cell and sha(canon(cell))==CURRENT_CELL_SHA: candidates.append((rel,value,row,cell))
          if len(candidates)!=1: raise SystemExit(f'canonical matrix denominator {len(candidates)}')
