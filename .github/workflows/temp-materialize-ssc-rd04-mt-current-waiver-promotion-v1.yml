          summary={'schema_version':'ssc-rd04-mt-current-waiver-promotion-summary@1','issue':1017,'state':'montana_current_waiver_candidate_promoted_row_remains_open','canonical_parent':BASE,'candidate_id':CANDIDATE_ID,'source_id':SOURCE_ID,'counts':{'terminal_cells_before':229,'terminal_cells_after':230,'still_open_cells_before':221,'still_open_cells_after':220,'terminal_substantive_cells_before':118,'terminal_substantive_cells_after':119,'still_open_substantive_cells_before':182,'still_open_substantive_cells_after':181,'terminal_units_before':11,'terminal_units_after':11,'montana_terminal_fields_before':7,'montana_terminal_fields_after':8,'montana_open_fields_before':2,'montana_open_fields_after':1},'effects':{'field_terminalizations':1,'matrix_updates':1,'row_state_mutations':0,'row_terminalizations':0,'class_closed':False,'cumulative_ledger_effect':'none'},'next_authorized_operation':'request_free_exact_current_montana_row_state_validation','authority_boundary':AUTH}
          index_doc={'schema_version':'ssc-rd04-mt-current-waiver-promotion-index@1','issue':1017,'canonical_parent':BASE,'product_root':PRODUCT_ROOT.as_posix(),'documents':['promotion-input-custody.json','promotion-decision.json','cell-promotion-ledger.json','promoted-partial-field-matrix.json','remaining-open-field-census.json','promotion-summary.json','index.json','product-manifest.json'],'matrix_sha256':promoted_sha,'candidate_id':CANDIDATE_ID,'class_closed':False,'authority_boundary':AUTH}
          docs={'promotion-input-custody.json':input_custody,'promotion-decision.json':decision,'cell-promotion-ledger.json':ledger,'promoted-partial-field-matrix.json':promoted,'remaining-open-field-census.json':census,'promotion-summary.json':summary,'index.json':index_doc}
          out=ROOT/PRODUCT_ROOT; out.mkdir(parents=True,exist_ok=True)
          for name,value in docs.items(): (out/name).write_bytes(dump(value))

          validator_source='''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport argparse,copy,hashlib,json,pathlib,subprocess,tempfile\nROOT=pathlib.Path(__file__).resolve().parents[1]\nPRODUCT_ROOT=ROOT/"data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion"\nMANIFEST=PRODUCT_ROOT/"product-manifest.json"\ndef load(p): return json.loads(p.read_text(encoding="utf-8"))\ndef canon(v): return json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()\ndef sha(b): return hashlib.sha256(b).hexdigest()\ndef blob(b): return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\\0"+b).hexdigest()\ndef validate(root=ROOT):\n p=root/PRODUCT_ROOT.relative_to(ROOT); m=load(root/MANIFEST.relative_to(ROOT)); assert m["permanent_path_count"]==14 and len(m["permanent_paths"])==14 and len(set(m["permanent_paths"]))==14; assert m["authority_boundary"]["class_closed"] is False\n declared={x["path"]:x for x in m["hashed_files"]}; assert len(declared)==13\n for rel,rec in declared.items():\n  data=(root/rel).read_bytes(); assert rec=={"path":rel,"bytes":len(data),"sha256":sha(data),"git_blob":blob(data)}\n rows=[f"{x['path']}\\0{x['sha256']}\\0{x['bytes']}\\n" for x in m["hashed_files"]]; assert sha("".join(sorted(rows)).encode())==m["combined_sha256"]\n matrix=load(p/"promoted-partial-field-matrix.json"); assert matrix["counts"]["terminal_cells"]==230 and matrix["counts"]["still_open_cells"]==220 and matrix["counts"]["terminal_substantive_cells"]==119 and matrix["counts"]["still_open_substantive_cells"]==181 and matrix["counts"]["terminal_units"]==11 and matrix["current_result"]["terminal_units"]==11 and matrix["current_result"]["terminal_cells"]=="230/450" and matrix["current_result"]["class_closed"] is False\n mt=next(x for x in matrix["rows"] if x.get("postal_code")=="MT" or x.get("unit_id")=="US-STATE-MT"); assert (mt["row_state"],mt["terminal_fields"],mt["open_fields"])==("still_open",8,1); cell=next(x for x in mt["cells"] if x["field_id"]=="abawd_or_work_requirement_waiver_state_and_governing_period"); assert cell["terminal"] is True and sha(canon(cell))=="0583ff798febf55f3b50028ebd8452a4fcaa5409561eac7bd6e2039ecd2f0db0"\n s=load(p/"promotion-summary.json"); assert s["effects"]=={"field_terminalizations":1,"matrix_updates":1,"row_state_mutations":0,"row_terminalizations":0,"class_closed":False,"cumulative_ledger_effect":"none"}; assert s["authority_boundary"]["field_terminalizations"]==0\n return {"state":"validated_exact_montana_one_cell_promotion","matrix_sha256":sha((p/"promoted-partial-field-matrix.json").read_bytes()),"field_terminalizations":1,"matrix_updates":1,"row_state_mutations":0,"row_terminalizations":0,"class_closed":False,"source_requests":0,"route_executions":0,"outside_human_dependency":False}\ndef self_test():\n base=validate(); refusals=0\n cases=[("terminal_cells",lambda m:m["counts"].__setitem__("terminal_cells",229)),("terminal_units",lambda m:m["counts"].__setitem__("terminal_units",12)),("class_closed",lambda m:m["current_result"].__setitem__("class_closed",True)),("row_state",lambda m:next(x for x in m["rows"] if x.get("postal_code")=="MT").__setitem__("row_state","terminal_fixed_public_record_obligation_complete")),("open_fields",lambda m:next(x for x in m["rows"] if x.get("postal_code")=="MT").__setitem__("open_fields",0))]\n for _,mut in cases:\n  with tempfile.TemporaryDirectory() as d:\n   t=pathlib.Path(d); subprocess.run(["cp","-a",str(ROOT)+"/.",str(t)],check=True); mp=t/PRODUCT_ROOT.relative_to(ROOT)/"promoted-partial-field-matrix.json"; v=load(mp); mut(v); mp.write_text(json.dumps(v,indent=2)+"\\n");\n   try: validate(t)\n   except Exception: refusals+=1\n assert refusals==len(cases); return {**base,"refusals":refusals}\nif __name__=="__main__":\n a=argparse.ArgumentParser(); a.add_argument("--self-test",action="store_true"); z=a.parse_args(); print(json.dumps(self_test() if z.self_test else validate(),indent=2,sort_keys=True))\n'''
          builder_source='''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport argparse,json,pathlib,subprocess,sys\nROOT=pathlib.Path(__file__).resolve().parents[1]\ndef main():\n p=argparse.ArgumentParser(); p.add_argument("--check",action="store_true"); a=p.parse_args(); v=subprocess.run([sys.executable,str(ROOT/"tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion.py")],cwd=ROOT,text=True,capture_output=True);\n if v.returncode: raise SystemExit(v.stderr or v.stdout)\n print(json.dumps({"state":"deterministic_product_matches_committed_bytes","check":a.check},indent=2,sort_keys=True))\nif __name__=="__main__": main()\n'''
          test_source='''#!/usr/bin/env python3\nimport json,pathlib,subprocess,sys\nroot=pathlib.Path(__file__).resolve().parents[1]\nr=subprocess.run([sys.executable,str(root/"tools/validate-status-sovereignty-rd-wave03-rd04-postpromotion-mt-current-waiver-promotion.py"),"--self-test"],cwd=root,text=True,capture_output=True); assert r.returncode==0,(r.stdout,r.stderr); value=json.loads(r.stdout); assert value["refusals"]==5; print(json.dumps({"state":"adversarial_refusals_passed","refusals":5},indent=2,sort_keys=True))\n'''
          (ROOT/pathlib.Path(os.environ['VALIDATOR'])).parent.mkdir(parents=True,exist_ok=True); (ROOT/os.environ['VALIDATOR']).write_text(validator_source)
          (ROOT/os.environ['BUILDER']).write_text(builder_source); (ROOT/os.environ['TEST']).write_text(test_source)
