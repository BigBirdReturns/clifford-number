name: Materialize Counter-Selector Wave 19

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-19.yml'
      - '.github/materializers/counter-selector-wave-19/**'
  workflow_dispatch:

concurrency:
  group: counter-selector-wave-19-materializer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-19-cross-domain-governance

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify carrier and unpack exact Wave 19 estate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wave19-expected-blobs <<'EOF'
          022fded8273aaad7a37f728813d76945c22fd3f8  .github/materializers/counter-selector-wave-19/payload-00
          710588307df43fb0f4dca90f5a90a68551483d8a  .github/materializers/counter-selector-wave-19/payload-01
          db310023c9dc9a07f3438f60ad9036aee3a13fe3  .github/materializers/counter-selector-wave-19/payload-02
          4c9cb4d6f4e33fff92707b73fcf13dd89f0850fc  .github/materializers/counter-selector-wave-19/payload-03
          c6a4b3497f799878a0899516e6037a6e12322297  .github/materializers/counter-selector-wave-19/payload-04
          ac55c72fa2fc8ad52876c244dcc62578cf7d05be  .github/materializers/counter-selector-wave-19/payload-05
          EOF
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "carrier blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done < /tmp/wave19-expected-blobs

          cat .github/materializers/counter-selector-wave-19/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-19.tar.gz
          echo 'd820b2b5e8b357c636c96ad629c43a34824952ed66ed051c42e39704ba589684  /tmp/counter-selector-wave-19.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-19.tar.gz -C .
          rm -rf .github/materializers/counter-selector-wave-19

      - name: Build, validate, and attack Wave 19
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-19.mjs
          node tools/validate-counter-selector-wave-19.mjs
          node test/counter-selector-wave-19.test.js

      - name: Commit exact permanent non-workflow Wave 19 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-19/payload-00 \
            .github/materializers/counter-selector-wave-19/payload-01 \
            .github/materializers/counter-selector-wave-19/payload-02 \
            .github/materializers/counter-selector-wave-19/payload-03 \
            .github/materializers/counter-selector-wave-19/payload-04 \
            .github/materializers/counter-selector-wave-19/payload-05 \
            data/project/counter-selector-cross-domain-transfer-registry.json \
            data/project/counter-selector-wave-19-cross-domain-governance.json \
            data/project/counter-selector-wave-19-external-review-export-registry.json \
            data/project/counter-selector-wave-19-release-manifest.json \
            reports/core-thesis/counter-selector-wave-19/data.json \
            reports/core-thesis/counter-selector-wave-19/index.html \
            test/counter-selector-wave-19.test.js \
            tools/build-counter-selector-wave-19.mjs \
            tools/validate-counter-selector-wave-19.mjs | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Advance Counter-Selector Wave 19 cross-domain governance'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 19 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-19.mjs
          node tools/validate-counter-selector-wave-19.mjs
          node test/counter-selector-wave-19.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish permanent non-workflow Wave 19 head
        run: git push origin HEAD:agent/counter-selector-wave-19-cross-domain-governance
