name: TEMP RD-04 field-promotion replay diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/ssc-rd04-field-promotion-replay-diagnostic-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run replay commands independently and preserve every exit code
        run: |
          set -u
          REPORT=/tmp/ssc-rd04-field-promotion-replay-diagnostic
          mkdir -p "$REPORT"
          exec > >(tee "$REPORT/diagnostic.log") 2>&1
          run_cmd() {
            name=$1
            shift
            printf '\n===== %s =====\n' "$name"
            printf 'command:'
            printf ' %q' "$@"
            printf '\n'
            "$@"
            rc=$?
            printf 'exit_code=%s\n' "$rc"
            return 0
          }
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'head_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf '\nExact stale-path references in tracked source:\n'
          git grep -n 'data/research/status-sovereignty-residual-denominator-wave-03-current.json' || true
          printf '\nAll nearby residual-denominator current paths:\n'
          git ls-files '*residual-denominator*current*' | sort || true
          run_cmd restore_all git restore --staged --worktree -- .
          run_cmd clean_untracked git clean -fdx
          run_cmd builder_write node tools/build-status-sovereignty-rd-wave03-rd04-field-promotion.mjs --write
          run_cmd builder_check node tools/build-status-sovereignty-rd-wave03-rd04-field-promotion.mjs --check
          run_cmd product_validator node tools/validate-status-sovereignty-rd-wave03-rd04-field-promotion.mjs
          run_cmd adversarial_test node test/status-sovereignty-rd-wave03-rd04-field-promotion.test.js
          run_cmd no_magic_human node tools/validate-no-magic-human-gate.mjs
          run_cmd diff_check git diff --check
          run_cmd diff_exit git diff --exit-code
          run_cmd status git status --porcelain=v1 --untracked-files=all
          printf '\nDiagnostic completed without promoting any result.\n'
      - uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-field-promotion-replay-diagnostic
          path: /tmp/ssc-rd04-field-promotion-replay-diagnostic
          if-no-files-found: error
          retention-days: 30
