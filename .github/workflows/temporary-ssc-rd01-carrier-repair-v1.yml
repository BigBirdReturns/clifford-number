name: TEMP repair SSC RD-01 carrier v1

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - agent/ssc-rd01-permanent-materializer-base-v1
    paths:
      - '.github/tmp/ssc-rd01-permanent-materializer-v1.trigger'

permissions:
  contents: write

concurrency:
  group: ssc-rd01-carrier-repair-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact carrier base
        uses: actions/checkout@v4
        with:
          ref: agent/ssc-rd01-permanent-materializer-base-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Recover final carrier part and patch materializer
        env:
          TARGET_BRANCH: agent/ssc-rd01-permanent-materializer-base-v1
          PACKAGE_B64_SHA256: bd37425b3f936369196d10307bc32b33d9765e835738563c887082028d2c19bb
          PACKAGE_TGZ_SHA256: 7affdafb780f90fab813b93480f346ecd65391d560eaad94499346b9769e004c
          PART04_SHA256: 01d3b3555ae7165a5701e8cd857cef69e220ee45413a5ab972da0a6653a4e7e1
        run: |
          set -Eeuo pipefail
          start="$(git rev-parse HEAD)"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$start"

          full='.github/tmp/ssc-rd01-permanent-package-v1.tar.gz.b64'
          prefix='.github/tmp/ssc-rd01-permanent-package-v1'
          workflow='.github/workflows/temporary-ssc-rd01-permanent-materializer-v1.yml'
          test -f "$full"
          test -f "$workflow"
          for part in 00 01 02 03; do test -f "$prefix.part-$part.b64"; done

          tr -d '\r\n\t ' < "$full" > /tmp/rd01-full-normalized.b64
          test "$(wc -c < /tmp/rd01-full-normalized.b64 | tr -d ' ')" = '17396'
          tail -c 1012 /tmp/rd01-full-normalized.b64 > "$prefix.part-04.b64"
          test "$(wc -c < "$prefix.part-04.b64" | tr -d ' ')" = '1012'
          echo "$PART04_SHA256  $prefix.part-04.b64" | sha256sum --check --strict

          cat "$prefix.part-00.b64" "$prefix.part-01.b64" "$prefix.part-02.b64" "$prefix.part-03.b64" "$prefix.part-04.b64" > /tmp/rd01-reassembled.b64
          test "$(wc -c < /tmp/rd01-reassembled.b64 | tr -d ' ')" = '17396'
          echo "$PACKAGE_B64_SHA256  /tmp/rd01-reassembled.b64" | sha256sum --check --strict
          base64 --decode /tmp/rd01-reassembled.b64 > /tmp/rd01-permanent-package.tar.gz
          echo "$PACKAGE_TGZ_SHA256  /tmp/rd01-permanent-package.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/rd01-permanent-package.tar.gz > /tmp/rd01-package-members.txt
          test "$(wc -l < /tmp/rd01-package-members.txt | tr -d ' ')" = '6'

          export SHA00="$(sha256sum "$prefix.part-00.b64" | awk '{print $1}')"
          export SHA01="$(sha256sum "$prefix.part-01.b64" | awk '{print $1}')"
          export SHA02="$(sha256sum "$prefix.part-02.b64" | awk '{print $1}')"
          export SHA03="$(sha256sum "$prefix.part-03.b64" | awk '{print $1}')"
          export SHA04="$(sha256sum "$prefix.part-04.b64" | awk '{print $1}')"

          python - <<'PY'
          import os
          from pathlib import Path

          workflow = Path('.github/workflows/temporary-ssc-rd01-permanent-materializer-v1.yml')
          text = workflow.read_text()
          if '  PACKAGE_B64_SHA256:' not in text:
              text = text.replace(
                  '  PACKAGE_TGZ_SHA256: 7affdafb780f90fab813b93480f346ecd65391d560eaad94499346b9769e004c\n',
                  '  PACKAGE_B64_SHA256: bd37425b3f936369196d10307bc32b33d9765e835738563c887082028d2c19bb\n'
                  '  PACKAGE_TGZ_SHA256: 7affdafb780f90fab813b93480f346ecd65391d560eaad94499346b9769e004c\n'
              )

          start_marker = '      - name: Reconstruct exact permanent package\n'
          end_marker = '      - name: Recover three exact source artifacts into permanent custody\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          hashes = [os.environ[f'SHA0{i}'] for i in range(5)]
          paths = [
              f'controller/.github/tmp/ssc-rd01-permanent-package-v1.part-0{i}.b64'
              for i in range(5)
          ]
          sizes = [4096, 4096, 4096, 4096, 1012]
          checks = []
          for path, digest, size in zip(paths, hashes, sizes):
              checks.extend([
                  f"          test \"$(wc -c < '{path}' | tr -d ' ')\" = '{size}'",
                  f"          echo '{digest}  {path}' | sha256sum --check --strict",
                  f"          cat '{path}' >> /tmp/rd01-permanent-package.b64",
              ])
          checks_text = '\n'.join(checks)
          block = f'''      - name: Reconstruct exact permanent package
        run: |
          set -Eeuo pipefail
          : > /tmp/rd01-permanent-package.b64
{checks_text}
          test "$(wc -c < /tmp/rd01-permanent-package.b64 | tr -d ' ')" = '17396'
          echo "$PACKAGE_B64_SHA256  /tmp/rd01-permanent-package.b64" | sha256sum --check --strict
          base64 --decode /tmp/rd01-permanent-package.b64 > /tmp/rd01-permanent-package.tar.gz
          echo "$PACKAGE_TGZ_SHA256  /tmp/rd01-permanent-package.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/rd01-permanent-package.tar.gz -C work
          test "$(find work/.github/workflows work/docs/milestones work/schemas work/test work/tools -type f \\
            \\( -name 'status-sovereignty-rd01-wave02-terminal-closure.yml' \\
            -o -name 'ssc-rd-wave02-rd01-legal-entity.md' \\
            -o -name 'status-sovereignty-rd-wave02-rd01-legal-entity.schema.json' \\
            -o -name 'status-sovereignty-rd-wave02-rd01-legal-entity.test.js' \\
            -o -name 'build-status-sovereignty-rd-wave02-rd01-legal-entity.mjs' \\
            -o -name 'validate-status-sovereignty-rd-wave02-rd01-legal-entity.mjs' \\) | wc -l | tr -d ' ')" = '6'

'''
          workflow.write_text(text[:start] + block + text[end:])
          PY

          grep -q 'part-04.b64' "$workflow"
          grep -q "$PACKAGE_B64_SHA256" "$workflow"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$prefix.part-04.b64" "$workflow"
          git commit -m 'Repair exact RD-01 permanent carrier reassembly'
          product="$(git rev-parse HEAD)"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$start"
          git push origin "$product:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$start"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$product"
