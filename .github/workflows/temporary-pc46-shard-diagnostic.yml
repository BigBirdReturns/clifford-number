name: TEMP execute exact PC-46 v2 package rebuild

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-pc46-shard-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc46-v2-package-rebuild-registered
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc46-exact-product-materializer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract and execute the hash-guarded rebuild program
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-pc46-v2-package-rebuild.yml').read_text().splitlines()
          start = None
          for index, line in enumerate(source):
              if line.strip() == 'run: |' and index >= 2 and 'Rebuild corrected exact package and v2 materializer script' in source[index - 2]:
                  start = index + 1
                  break
          if start is None:
              raise SystemExit('rebuild program not found')
          lines = []
          for line in source[start:]:
              if line.strip() and not line.startswith('          '):
                  break
              lines.append(line[10:] if line.startswith('          ') else '')
          program = '\n'.join(lines).rstrip() + '\n'
          Path('/tmp/pc46-v2-rebuild.sh').write_text('#!/usr/bin/env bash\n' + program)
          PY
          chmod +x /tmp/pc46-v2-rebuild.sh
          bash -n /tmp/pc46-v2-rebuild.sh
          bash /tmp/pc46-v2-rebuild.sh
