name: TEMP export immutable qualified PC-46 parent tree

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-pc46-shard-diagnostic.yml'
      - 'transport/pc46/tree-diagnostic-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc46-parent-tree-diagnostic
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUALIFIED_PARENT: ea1776f7bba28b56fee9f3defb1940ef640517a2
      QUALIFIED_PRODUCT_TREE: a4ebcb55818011668e78ecac338734a32dcabfbd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc46-exact-product-materializer
          fetch-depth: 0
      - name: Export immutable parent-tree receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          current_main=$(git rev-parse origin/main)
          git cat-file -e "$QUALIFIED_PARENT^{commit}"
          parent_tree=$(git rev-parse "$QUALIFIED_PARENT^{tree}")
          test -n "$parent_tree"
          python - <<PY
          import json
          from pathlib import Path
          receipt = {
            'schema_version': 'pc46-parent-tree-diagnostic@2',
            'workflow_run_id': '${GITHUB_RUN_ID}',
            'qualified_parent': '${QUALIFIED_PARENT}',
            'qualified_parent_tree': '${parent_tree}',
            'qualified_product_tree': '${QUALIFIED_PRODUCT_TREE}',
            'canonical_main_observed': '${current_main}',
            'publication_model': 'immutable-qualified-product-plus-current-main-synthetic-merge'
          }
          Path('/tmp/pc46-parent-tree.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pc46-parent-tree-${{ github.run_id }}
          path: /tmp/pc46-parent-tree.json
          if-no-files-found: error
          retention-days: 30
