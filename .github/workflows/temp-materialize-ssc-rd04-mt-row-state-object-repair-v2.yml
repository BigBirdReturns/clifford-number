name: TEMP materialize Montana exact commit-object repair v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-materialize-ssc-rd04-mt-row-state-object-repair-v2.yml'
      - '.tmp/ssc-rd04-mt-row-state-object-repair-v2/**'

permissions:
  contents: write

env:
  SOURCE_BRANCH: agent/ssc-rd04-mt-row-state-reconciliation-v2
  SOURCE_PRODUCT: e4d363df169e0707eb1e23ba705ea7ac55745717
  SOURCE_TREE: d849f6bac89a8f81f1dca35c5777478cb1fed07c
  CANONICAL_PARENT: 0840358962621b0be3db6864ecec763327f35903
  TARGET_BRANCH: agent/ssc-rd04-mt-row-state-reconciliation-v3
  CARRIER_PATH: .github/workflows/temp-materialize-ssc-rd04-mt-row-state-object-repair-v2.yml
  PART_ROOT: .tmp/ssc-rd04-mt-row-state-object-repair-v2
  WORKFLOW_PATH: .github/workflows/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation.yml
  PRODUCT_ROOT: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation
  MANIFEST_PATH: data/intake/status-sovereignty-rd-wave03-rd04-postpromotion-mt-row-state-reconciliation/product-manifest.json
  OUT: /tmp/ssc-rd04-mt-row-state-object-repair-v2
  WORK: /tmp/ssc-rd04-mt-row-state-object-repair-work-v2
  PRODUCT_NAME: github-actions[bot]
  PRODUCT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  PRODUCT_DATE: '1786388400 +0000'
  PRODUCT_MESSAGE: Promote exact Montana derivative row-state reconciliation v3
  PROGRAM_SHA256: 470114f0791fa4f9ced695b0b6111817ee6df4ebbe6aa654949e711d98d59137

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Authenticate and execute sealed materializer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cat "$PART_ROOT"/part-00 "$PART_ROOT"/part-01 "$PART_ROOT"/part-02 "$PART_ROOT"/part-03 > /tmp/materialize.sh
          test "$(sha256sum /tmp/materialize.sh | awk '{print $1}')" = "$PROGRAM_SHA256"
          bash -n /tmp/materialize.sh
          bash /tmp/materialize.sh
      - name: Preserve exact repair transaction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-rd04-mt-row-state-object-repair-v2
          path: ${{ env.OUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
