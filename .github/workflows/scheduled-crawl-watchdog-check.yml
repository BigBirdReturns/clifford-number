name: Scheduled crawler watchdog check

on:
  pull_request:
    paths:
      - '.github/scripts/watch-scheduled-crawl-admission.mjs'
      - '.github/workflows/resume-scheduled-crawl-admission.yml'
      - '.github/workflows/scheduled-crawl-watchdog-check.yml'
      - 'test/scheduled-crawl-watchdog.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-crawl-watchdog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scheduled crawler watchdog tests
        run: node test/scheduled-crawl-watchdog.test.js
