name: Temporary PR 2231 V115 identifier-custody cursor qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr2231-v115-identifier-cursor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify-v115:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: BigBirdReturns/clifford-number
      CONTROLLER_PR: ${{ github.event.pull_request.number }}
      EXPECTED_CONTROLLER: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 771a64b6b467748d2f4df667b5f78e76f9432d69
      PRODUCT_PR: '2231'
      PRODUCT_BRANCH: agent/current-main-identifier-context-product-v1
      EXPECTED_PRODUCT: 9652029dbabcab0e2d7c51c0f8c61e57869e34cc
      EXPECTED_PRODUCT_TREE: dbc81b437b7e98a4bfd0dc59ef13a51586c0c6c7
      EXPECTED_LIBRARY_BLOB: 2ac63e66103fd637166d82d559269ca1b3cf7419
      EXPECTED_TEST_BLOB: ba934a14f232af58fadf1250d1903fd774e20654
      IDENTIFIER_REVIEW_COMMENT: '3896943486'
      IDENTIFIER_REVIEW_COMMENT_2: '3896968531'
      CURSOR_REVIEW_COMMENT: '3896968536'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize and execute exact qualification program
        shell: bash
        env:
          PROGRAM_GZIP_BASE64: >-
            
        run: |
          set -Eeuo pipefail
          printf '%s' "${PROGRAM_GZIP_BASE64}" | base64 -d | gzip -d > /tmp/pr2231-v115-qualify.sh
          chmod 0700 /tmp/pr2231-v115-qualify.sh
          bash -n /tmp/pr2231-v115-qualify.sh
          bash /tmp/pr2231-v115-qualify.sh

      - name: Emit receipts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/pr2231-v115-qualified
          if [[ -d "${root}" ]]; then
            find "${root}" -type f -printf '%P\t%s\n' | sort
            for receipt in "${root}/receipts/qualification.env" "${root}/receipts/terminal.env"; do
              [[ -f "${receipt}" ]] && cat "${receipt}"
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2231-v115-identifier-cursor-qualification
          path: /tmp/pr2231-v115-qualified
          retention-days: 90
