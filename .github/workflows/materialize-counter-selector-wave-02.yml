name: Materialize Counter-Selector Wave 02

# Connector-owned workflow custody; Actions publishes non-workflow estate bytes only.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/materialize-counter-selector-wave-02.yml'
      - '.github/materializers/counter-selector-wave-02/**'
  push:
    branches:
      - 'agent/counter-selector-wave-02-artifact-readiness'
    paths:
      - '.github/workflows/materialize-counter-selector-wave-02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/counter-selector-wave-02-artifact-readiness

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack exact Wave 02 source estate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materializers/counter-selector-wave-02/payload-* \
            | base64 --decode \
            > /tmp/counter-selector-wave-02.tar.gz
          echo '3ece02fc78ecf252876f975e8ddb80ff9854799219e9bfa8c3b40c54d624864c  /tmp/counter-selector-wave-02.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/counter-selector-wave-02.tar.gz -C .
          git restore --source=HEAD --worktree -- .github/workflows/counter-selector-wave-02.yml
          rm -rf .github/materializers/counter-selector-wave-02

      - name: Build, validate, and attack artifact readiness
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-counter-selector-wave-02.mjs
          node tools/validate-counter-selector-wave-02.mjs
          node test/counter-selector-wave-02.test.js

      - name: Commit exact non-workflow Wave 02 estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/materializers/counter-selector-wave-02/payload-00 \
            .github/materializers/counter-selector-wave-02/payload-01 \
            data/project/counter-selector-wave-02-artifact-readiness.json \
            data/project/counter-selector-artifact-readiness-registry.json \
            data/project/counter-selector-artifact-acquisition-queue.json \
            data/project/counter-selector-wave-02-release-manifest.json \
            schemas/counter-selector-artifact-readiness.schema.json \
            docs/methods/counter-selector-artifact-readiness.md \
            docs/milestones/counter-selector-wave-02.md \
            tools/build-counter-selector-wave-02.mjs \
            tools/validate-counter-selector-wave-02.mjs \
            test/counter-selector-wave-02.test.js \
            reports/core-thesis/counter-selector-wave-02/data.json \
            reports/core-thesis/counter-selector-wave-02/index.html | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Audit Counter-Selector artifact readiness and open acquisition batches'

      - name: Run complete repository release gate
        run: npm run release:check

      - name: Prove deterministic Wave 02 reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .
          node tools/build-counter-selector-wave-02.mjs
          node tools/validate-counter-selector-wave-02.mjs
          node test/counter-selector-wave-02.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish non-workflow Wave 02 head
        run: git push origin HEAD:agent/counter-selector-wave-02-artifact-readiness
