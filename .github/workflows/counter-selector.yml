name: Counter-Selector Wave 00

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/project/counter-selector-*.json'
      - 'schemas/counter-selector-candidate.schema.json'
      - 'docs/methods/counter-selector.md'
      - 'docs/milestones/counter-selector-wave-00.md'
      - 'tools/build-counter-selector.mjs'
      - 'tools/validate-counter-selector.mjs'
      - 'test/counter-selector.test.js'
      - 'reports/core-thesis/counter-selector/**'
      - '.github/workflows/counter-selector.yml'
  push:
    branches: [main]
    paths:
      - 'data/project/counter-selector-*.json'
      - 'schemas/counter-selector-candidate.schema.json'
      - 'docs/methods/counter-selector.md'
      - 'docs/milestones/counter-selector-wave-00.md'
      - 'tools/build-counter-selector.mjs'
      - 'tools/validate-counter-selector.mjs'
      - 'test/counter-selector.test.js'
      - 'reports/core-thesis/counter-selector/**'
      - '.github/workflows/counter-selector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, validate, and attack Counter-Selector
        run: |
          node tools/build-counter-selector.mjs
          node tools/validate-counter-selector.mjs
          node test/counter-selector.test.js
      - name: Run complete repository release gate
        run: npm run release:check
      - name: Prove deterministic Counter-Selector products
        run: |
          git restore --staged --worktree .
          node tools/build-counter-selector.mjs
          node tools/validate-counter-selector.mjs
          node test/counter-selector.test.js
          git diff --exit-code
          test -z "$(git status --porcelain)"
