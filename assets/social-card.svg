<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Clifford Number</title>
  <desc id="desc">Connections you can check. Inferences we won't make.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fffaf0" stroke-opacity=".08"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d9a22f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#d9a22f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#071e4a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="170" r="300" fill="url(#glow)"/>
  <rect x="72" y="68" width="56" height="56" fill="#d9a22f"/>
  <text x="100" y="103" fill="#071e4a" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700" text-anchor="middle">CN</text>
  <text x="148" y="90" fill="#d9a22f" font-family="Arial Narrow, sans-serif" font-size="17" font-weight="700" letter-spacing="3">PUBLIC-ROLE CONNECTIONS · WITH RECEIPTS</text>
  <text x="72" y="245" fill="#fffaf0" font-family="Georgia, serif" font-size="92" font-weight="600" letter-spacing="-4">The Clifford</text>
  <text x="72" y="342" fill="#f4c85a" font-family="Georgia, serif" font-size="92" font-style="italic" letter-spacing="-4">Number.</text>
  <text x="76" y="410" fill="#fffaf0" fill-opacity=".78" font-family="Georgia, serif" font-size="26">Connections you can check. Inferences we won’t make.</text>
  <path d="M750 466C835 330 968 278 1090 175" fill="none" stroke="#fffaf0" stroke-opacity=".65" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="750" cy="466" r="20" fill="#fffaf0" stroke="#071e4a" stroke-width="6"/>
  <rect x="895" y="315" width="38" height="38" rx="4" fill="#d9a22f" stroke="#071e4a" stroke-width="6" transform="rotate(45 914 334)"/>
  <circle cx="1090" cy="175" r="24" fill="#7ad69d" stroke="#d9a22f" stroke-width="5"/>
  <line x1="72" y1="520" x2="1128" y2="520" stroke="#fffaf0" stroke-opacity=".18"/>
  <text x="72" y="566" fill="#fffaf0" fill-opacity=".55" font-family="IBM Plex Mono, monospace" font-size="16">EVERY HOP IS A SHARED BOUNDED SURFACE. EVERY STEP CARRIES RECEIPTS.</text>
  <text x="1128" y="566" fill="#d9a22f" font-family="IBM Plex Mono, monospace" font-size="16" text-anchor="end">NOT CONSPIRACY. TOPOLOGY.</text>
</svg>
